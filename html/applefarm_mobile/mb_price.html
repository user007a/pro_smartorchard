<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 价格预测</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body { font-family: var(--font-family); background: var(--bg); color: var(--text); overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 66px; }
    
    .content { padding: 16px; }
    
    .current-card { background: linear-gradient(135deg, var(--primary-600), var(--primary-700)); border-radius: var(--radius-lg); padding: var(--space-6) var(--space-5); margin-bottom: var(--space-4); color: var(--bg-white); box-shadow: var(--shadow); }
    .current-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); }
    .current-title { font-size: var(--font-base); opacity: 0.9; display: flex; align-items: center; gap: var(--space-2); }
    .current-date { font-size: var(--font-xs); opacity: 0.7; }
    .current-main { text-align: center; margin-bottom: var(--space-4); }
    .current-variety { font-size: var(--font-base); opacity: 0.9; margin-bottom: var(--space-2); }
    .current-price { font-size: 48px; font-weight: 800; }
    .current-unit { font-size: var(--font-md); opacity: 0.9; }
    .current-trend { display: flex; justify-content: center; gap: var(--space-4); font-size: var(--font-sm); }
    .trend-item { display: flex; align-items: center; gap: var(--space-1); }
    
    .chart-card { background: var(--bg-white); border-radius: var(--radius-lg); padding: var(--space-4); margin-bottom: var(--space-4); box-shadow: var(--shadow); border: 1px solid var(--border); }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); }
    .chart-title { font-size: var(--font-base); font-weight: 600; color: var(--text); display: flex; align-items: center; gap: var(--space-2); }
    .chart-legend { display: flex; gap: var(--space-3); font-size: var(--font-xs); }
    .legend-item { display: flex; align-items: center; gap: var(--space-1); color: var(--text-secondary); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    .legend-dot.predict { background: var(--primary); }
    .legend-dot.last { background: var(--text-light); }
    .chart-canvas { height: 160px; position: relative; }
    .chart-grid { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-between; }
    .chart-grid-line { border-top: 1px dashed var(--border-light); position: relative; }
    .chart-grid-label { position: absolute; left: 0; top: -8px; font-size: var(--font-xs); color: var(--text-light); }
    .chart-points { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
    .chart-line { position: absolute; }
    .chart-months { display: flex; justify-content: space-between; margin-top: var(--space-2); padding: 0 10px; }
    .chart-month { font-size: var(--font-xs); color: var(--text-light); text-align: center; }
    
    .suggestion-card { background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1)); border-radius: var(--radius-lg); padding: var(--space-4); margin-bottom: var(--space-4); border: 1px solid rgba(102, 126, 234, 0.2); }
    .suggestion-header { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); }
    .suggestion-icon { font-size: var(--font-xl); }
    .suggestion-title { font-size: var(--font-base); font-weight: 600; color: var(--purple); }
    .suggestion-main { background: var(--bg-white); border-radius: var(--radius-md); padding: 14px; margin-bottom: var(--space-3); }
    .suggestion-text { font-size: var(--font-base); color: var(--text); line-height: 1.6; }
    .suggestion-window { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); background: var(--purple-bg); border-radius: var(--radius-md); }
    .window-icon { font-size: var(--font-xl); }
    .window-text { flex: 1; font-size: var(--font-sm); color: var(--purple); }
    .window-time { font-size: var(--font-md); font-weight: 700; color: var(--purple); }
    
    .variety-card { background: var(--bg-white); border-radius: var(--radius-lg); padding: var(--space-4); box-shadow: var(--shadow); border: 1px solid var(--border); }
    .variety-title { font-size: var(--font-base); font-weight: 600; color: var(--text); margin-bottom: var(--space-3); display: flex; align-items: center; gap: var(--space-2); }
    .variety-list { display: flex; flex-direction: column; gap: var(--space-3); }
    .variety-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); background: var(--gray-100); border-radius: var(--radius-md); }
    .variety-color { width: 4px; height: 32px; border-radius: 2px; }
    .variety-color.red { background: var(--error); }
    .variety-color.yellow { background: var(--warning); }
    .variety-color.green { background: var(--success); }
    .variety-name { flex: 1; font-size: var(--font-sm); color: var(--text); }
    .variety-price { font-size: var(--font-base); font-weight: 600; color: var(--text); }
    .variety-trend { font-size: var(--font-xs); padding: 2px var(--space-2); border-radius: var(--radius-sm); }
    .variety-trend.up { background: var(--danger-bg); color: var(--danger); }
    .variety-trend.down { background: var(--primary-light); color: var(--primary); }
  </style>
</head>
<body>
  <div class="app">
    <div class="header-bg">
      <div class="page-header">
        <div class="header-back" onclick="history.back()">←</div>
        <div class="header-title">价格预测</div>
      </div>
    </div>
    
    <div class="content">
      <div class="current-card">
        <div class="current-header">
          <div class="current-title">
            <span>💰</span>
            <span>当前市场价格</span>
          </div>
          <div class="current-date" id="priceDate">--</div>
        </div>
        <div class="current-main">
          <div class="current-variety" id="priceVariety">--</div>
          <div class="current-price"><span id="priceValue">--</span><span style="font-size: 18px;" id="priceUnit">元/斤</span></div>
        </div>
        <div class="current-trend">
          <div class="trend-item">
            <span>📈</span>
            <span id="priceTrend">--</span>
          </div>
          <div class="trend-item">
            <span>📊</span>
            <span id="priceAvg">--</span>
          </div>
        </div>
      </div>
      
      <div class="chart-card">
        <div class="chart-header">
          <div class="chart-title">
            <span>📈</span>
            <span>未来6个月价格走势</span>
          </div>
          <div class="chart-legend">
            <div class="legend-item" id="priceLegendPredict">
              <div class="legend-dot predict"></div>
              <span>预测价</span>
            </div>
            <div class="legend-item" id="priceLegendLast" style="display:none;">
              <div class="legend-dot last"></div>
              <span>去年同期</span>
            </div>
          </div>
        </div>
        <div class="chart-canvas">
          <div class="chart-grid" id="priceGrid"></div>
          <svg class="chart-points" id="priceSvg" viewBox="0 0 300 120" preserveAspectRatio="none"></svg>
        </div>
        <div class="chart-months" id="priceMonths"></div>
      </div>

      <div class="suggestion-card">
        <div class="suggestion-header">
          <span class="suggestion-icon">💡</span>
          <div class="suggestion-title">AI销售建议</div>
        </div>
        <div class="suggestion-main">
          <div class="suggestion-text" id="priceAdvice">--</div>
        </div>
        <div class="suggestion-window">
          <span class="window-icon">⏰</span>
          <div class="window-text">最佳出售窗口</div>
          <div class="window-time" id="priceWindow">--</div>
        </div>
      </div>
      
      <div class="variety-card">
        <div class="variety-title">
          <span>🍎</span>
          <span>分规格价格预测</span>
        </div>
        <div class="variety-list" id="priceSpecs"></div>
      </div>
    </div>
    
    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_ai_assistant.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
        <span>AI</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </div>
  </div>
  
  <script src="../applefarm_backhand/js/shared/model-store.js"></script>
  <script>
    function navigateTo(page) { window.location.href = page; }

    /* 价格预测 · 严格读库（sf_model_config · price 模型快照） */
    (function () {
      'use strict';

      function num(v) { var n = parseFloat(v); return isNaN(n) ? null : n; }
      function setText(id, text) {
        var el = document.getElementById(id);
        if (el) el.textContent = text;
      }
      function dash(v) { return (v === undefined || v === null || v === '') ? '--' : String(v); }

      function renderChart(chart) {
        var cats = (chart && chart.categories) || [];
        var series = (chart && chart.series) || [];
        var grid = document.getElementById('priceGrid');
        var svg = document.getElementById('priceSvg');
        var months = document.getElementById('priceMonths');
        if (!grid || !svg || !months) return;

        var values = [];
        series.forEach(function (s) {
          (s.data || []).forEach(function (v) { var n = num(v); if (n !== null) values.push(n); });
        });

        if (!cats.length || !values.length) {
          grid.innerHTML = '';
          svg.innerHTML = '';
          months.innerHTML = '<div class="chart-month">暂无价格走势数据</div>';
          var lastEl = document.getElementById('priceLegendLast');
          if (lastEl) lastEl.style.display = 'none';
          return;
        }

        var min = Math.min.apply(null, values);
        var max = Math.max.apply(null, values);
        if (max === min) max = min + 1;
        var pad = (max - min) * 0.12;
        var lo = min - pad;
        var hi = max + pad;

        var gridHtml = '';
        for (var i = 0; i < 4; i++) {
          var val = hi - (hi - lo) * i / 3;
          gridHtml += '<div class="chart-grid-line"><span class="chart-grid-label">' + val.toFixed(1) + '</span></div>';
        }
        grid.innerHTML = gridHtml;

        var n = cats.length;
        function xAt(i) { return n === 1 ? 150 : i * 300 / (n - 1); }
        function yAt(v) { return 120 - (v - lo) / (hi - lo) * 120; }

        var svgHtml = '';
        series.forEach(function (s, si) {
          var pts = [];
          (s.data || []).forEach(function (v, i) {
            var nn = num(v);
            if (nn !== null) pts.push(xAt(i).toFixed(1) + ',' + yAt(nn).toFixed(1));
          });
          if (!pts.length) return;
          svgHtml += '<path d="M' + pts.join(' L') + '" fill="none" stroke="' +
            (si === 0 ? 'var(--purple)' : 'var(--gray-300)') + '" stroke-width="' + (si === 0 ? 2 : 1.5) + '"' +
            (si === 0 ? '' : ' stroke-dasharray="4,2"') + '/>';
        });
        svg.innerHTML = svgHtml;

        months.innerHTML = cats.map(function (c) { return '<div class="chart-month">' + c + '</div>'; }).join('');

        var lastLegend = document.getElementById('priceLegendLast');
        if (lastLegend) lastLegend.style.display = series.length > 1 ? '' : 'none';
        var predictLegend = document.getElementById('priceLegendPredict');
        var predictLabel = predictLegend ? predictLegend.querySelector('span') : null;
        if (predictLabel && series[0] && series[0].name) {
          predictLabel.textContent = series[0].name;
        }
      }

      function renderSpecs(specs) {
        var box = document.getElementById('priceSpecs');
        if (!box) return;
        if (!specs.length) {
          box.innerHTML = '<div class="mb-list-empty">暂无分规格价格数据</div>';
          return;
        }
        var colors = ['red', 'yellow', 'green', 'blue', 'orange'];
        box.innerHTML = specs.map(function (s, i) {
          return '<div class="variety-item">' +
            '<div class="variety-color ' + colors[i % colors.length] + '"></div>' +
            '<div class="variety-name">' + (s.label || '--') + '</div>' +
            '<div class="variety-price">' + (s.price === undefined || s.price === null || s.price === '' ? '--' : s.price) + '</div>' +
          '</div>';
        }).join('');
      }

      function render() {
        var m = (window.ModelStore && ModelStore.get('price')) || null;
        if (!m) return;

        var kpi = m.kpi || [];
        var lists = m.lists || {};
        var k0 = kpi[0] || {};
        var k2 = kpi[2] || {};

        var now = new Date();
        setText('priceDate', (now.getMonth() + 1) + '月' + now.getDate() + '日');

        var varieties = lists.varieties || [];
        setText('priceVariety', varieties.length ? varieties[0] : '暂无品种');

        setText('priceValue', dash(k0.value));
        setText('priceUnit', k0.unit || '元/斤');
        setText('priceTrend', (k0.trend && k0.trend.text) ? k0.trend.text : '--');

        var chart = (m.charts && m.charts.priceTrend) || {};
        var s0 = (chart.series || [])[0] || {};
        var nums = (s0.data || []).map(num).filter(function (x) { return x !== null; });
        var avg = nums.length ? nums.reduce(function (a, b) { return a + b; }, 0) / nums.length : null;
        setText('priceAvg', avg === null ? '--' : ('均价 ' + avg.toFixed(2)));
        renderChart(chart);

        var windowTime = (lists.saleWindow && lists.saleWindow.time) || '';
        var peak = dash(k2.value);
        var peakTime = (k2.trend && k2.trend.text) || '';
        var advice = document.getElementById('priceAdvice');
        if (advice) {
          if (peak === '--' && !windowTime) {
            advice.textContent = '暂无销售建议（价格模型尚未生成预测结果）';
          } else {
            advice.textContent = '根据模型预测，' + (peakTime || '预测期') + '价格将达到峰值 ' +
              peak + (k2.unit || '元/斤') + '，建议在' + (windowTime || '--') + '开启销售并分批出货，抓住最佳窗口。';
          }
        }
        setText('priceWindow', windowTime || '--');

        renderSpecs(lists.specs || []);
      }

      if (window.ModelStore) {
        render();
        ModelStore.subscribe(render);
      } else {
        render();
      }
    })();
  </script>
</body>
</html>
