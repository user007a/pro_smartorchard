<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 预警中心</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <style>
    /* 预警中心主题色：橙红（覆盖设计系统默认绿色 Header） */
    .page-header {
      background: linear-gradient(135deg, #f56c4d, #e84a3a);
    }
    .header-stats {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }
    .header-stat {
      flex: 1;
      background: rgba(255,255,255,0.16);
      border-radius: 10px;
      padding: 10px 12px;
      backdrop-filter: blur(4px);
    }
    .header-stat .num { font-size: var(--font-2xl); font-weight: 700; line-height: 1; }
    .header-stat .lbl { font-size: var(--font-xs); opacity: 0.85; margin-top: 4px; }

    .filter-bar {
      display: flex;
      gap: 8px;
      padding: 14px 16px 4px;
      background: var(--bg-white, #fff);
      overflow-x: auto;
    }
    .filter-chip {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: var(--font-sm);
      background: var(--bg-white, #f5f5f7);
      color: var(--text-secondary, #555);
      cursor: pointer;
    }
    .filter-chip.active {
      background: linear-gradient(135deg, #f56c4d, #e84a3a);
      color: #fff;
      font-weight: 500;
    }
    .filter-bar.sub { padding-top: 8px; padding-bottom: 10px; }
    .alert-status {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: var(--font-2xs);
      font-weight: 500;
    }
    .alert-status.pending     { background: rgba(245,166,35,0.14); color: #c47800; }
    .alert-status.processing  { background: rgba(9,109,217,0.12);  color: #096dd9; }
    .alert-status.closed      { background: rgba(56,158,13,0.12);  color: #389e0d; }
    .alert-status.ignored     { background: rgba(125,128,133,0.14);color: #5b6066; }
    .alert-status.transferred { background: rgba(47,84,235,0.12);  color: #2f54eb; }
    .alert-status.voided      { background: rgba(0,0,0,0.06);      color: #909399; text-decoration: line-through; }
    .alert-src {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: var(--font-2xs);
      color: #606266;
      background: #f2f4f7;
    }
    .alert-due { font-size: var(--font-2xs); color: #b0b3b8; margin-bottom: 8px; }
    .alert-due.overdue { color: #e84a3a; font-weight: 500; }
    .sheet-action {
      padding: 13px;
      border-radius: 10px;
      text-align: center;
      font-size: var(--font-base);
      margin-bottom: 8px;
      cursor: pointer;
      border: 1px solid #eee;
      background: #fafafa;
      color: #333;
    }
    .sheet-action.primary { background: linear-gradient(135deg, #f56c4d, #e84a3a); color: #fff; border: none; }

    .alert-list { padding: 12px 16px; }
    .alert-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      border-left: 4px solid #909399;
    }
    .alert-card.urgent { border-left-color: #e84a3a; }
    .alert-card.important { border-left-color: #f5a623; }
    .alert-card.reminder { border-left-color: var(--info); }
    .alert-card.notice { border-left-color: #7d8085; }

    .alert-row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .alert-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: var(--font-2xs);
      font-weight: 500;
    }
    .alert-tag.urgent { background: rgba(232,74,58,0.12); color: #e84a3a; }
    .alert-tag.important { background: rgba(245,166,35,0.14); color: #c47800; }
    .alert-tag.reminder { background: rgba(9,109,217,0.12); color: var(--info); }
    .alert-tag.notice { background: rgba(125,128,133,0.14); color: #5b6066; }
    .alert-type { font-size: var(--font-xs); color: #909399; }
    .alert-time { font-size: var(--font-2xs); color: #b0b3b8; }
    .alert-title { font-size: var(--font-base); font-weight: 600; color: #1f2e1f; line-height: 1.4; margin-bottom: 6px; }
    .alert-desc { font-size: var(--font-sm); color: #606266; line-height: 1.5; margin-bottom: 10px; }
    .alert-actions { display: flex; gap: 8px; }
    .alert-btn {
      flex: 1;
      padding: 8px 0;
      border-radius: 8px;
      font-size: var(--font-sm);
      text-align: center;
      cursor: pointer;
      border: 1px solid #e8e8e8;
      background: #fafafa;
      color: #555;
    }
    .alert-btn.primary {
      background: linear-gradient(135deg, #f56c4d, #e84a3a);
      color: #fff;
      border: none;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #b0b3b8;
    }
    .empty-state svg { width: 50px; height: 50px; opacity: 0.5; }
    .empty-state p { margin-top: 12px; font-size: var(--font-sm); }
  </style>
</head>
<body>
  <div class="page-header">
    <div class="header-back" onclick="navigateBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div class="header-content">
      <div class="header-title">预警中心</div>
      <div class="header-sub">五类来源 · 六态闭环</div>
      <div class="header-stats">
        <div class="header-stat"><div class="num" id="statUrgent">0</div><div class="lbl">待处理</div></div>
        <div class="header-stat"><div class="num" id="statTotal">0</div><div class="lbl">未闭环</div></div>
        <div class="header-stat"><div class="num" id="statRate">--</div><div class="lbl">闭环率</div></div>
      </div>
    </div>
  </div>

  <div class="filter-bar">
    <div class="filter-chip active" data-filter="all" onclick="setFilter('all')">全部</div>
    <div class="filter-chip" data-filter="pending" onclick="setFilter('pending')">待处理</div>
    <div class="filter-chip" data-filter="processing" onclick="setFilter('processing')">处理中</div>
    <div class="filter-chip" data-filter="transferred" onclick="setFilter('transferred')">已转工单</div>
    <div class="filter-chip" data-filter="closed" onclick="setFilter('closed')">已闭环</div>
    <div class="filter-chip" data-filter="ignored" onclick="setFilter('ignored')">已忽略</div>
    <div class="filter-chip" data-filter="voided" onclick="setFilter('voided')">已作废</div>
  </div>
  <div class="filter-bar sub" id="sourceFilterBar"></div>

  <div class="alert-list" id="alertList"></div>

  <script>
    // 数据来源：共享数据源 AlertStore（详见 applefarm_backhand/js/shared/alert-data.js）
    var currentFilter = 'all';
    var currentSource = 'all';
    var STATUS_TEXT = { pending:'待处理', processing:'处理中', closed:'已闭环',
                        ignored:'已忽略', transferred:'已转工单', voided:'已作废' };

    function levelClass(l){ return ({urgent:'urgent', important:'important', reminder:'reminder', notice:'notice'})[l] || 'notice'; }
    function sourceTextOf(src){
      var list = (window.AlertStore && AlertStore.SOURCES) || [];
      for (var i = 0; i < list.length; i++) if (list[i].key === src) return list[i].text;
      return '系统预警';
    }
    function sourceOf(a){
      if (a.source) return a.source;
      return a.type === 'device' ? 'device' : 'system';
    }
    function statusTextOf(s){ return STATUS_TEXT[s] || s || '—'; }
    function fmtTm(t){
      if (!t) return '';
      var m = String(t).match(/(\d{2})-(\d{2})[ T](\d{2}:\d{2})/);
      return m ? (m[1]+'-'+m[2]+' '+m[3]) : t;
    }
    function isOverdue(a){
      if (!a.respondDue) return false;
      if (a.status !== 'pending' && a.status !== 'processing') return false;
      var d = new Date(String(a.respondDue).replace(/-/g,'/'));
      return !isNaN(d.getTime()) && d.getTime() < Date.now();
    }
    function setFilter(f){
      currentFilter = f;
      document.querySelectorAll('.filter-bar:not(.sub) .filter-chip').forEach(function(c){ c.classList.toggle('active', c.dataset.filter===f); });
      render();
    }
    function setSource(s){
      currentSource = s;
      document.querySelectorAll('#sourceFilterBar .filter-chip').forEach(function(c){ c.classList.toggle('active', c.dataset.source===s); });
      render();
    }
    function renderSourceChips(){
      var box = document.getElementById('sourceFilterBar');
      if (!box) return;
      var sources = (window.AlertStore && AlertStore.SOURCES) || [];
      var all = window.AlertStore ? AlertStore.all() : [];
      var chips = ['<div class="filter-chip ' + (currentSource === 'all' ? 'active' : '') + '" data-source="all" onclick="setSource(\'all\')">全部来源</div>'];
      sources.forEach(function(s){
        var n = all.filter(function(a){ return sourceOf(a) === s.key; }).length;
        chips.push('<div class="filter-chip ' + (currentSource === s.key ? 'active' : '') +
          '" data-source="' + s.key + '" onclick="setSource(\'' + s.key + '\')">' + s.text + (n ? ' ' + n : '') + '</div>');
      });
      box.innerHTML = chips.join('');
    }
    function render(){
      var list = (window.AlertStore ? AlertStore.all() : []).filter(function(a){
        if (currentFilter !== 'all' && a.status !== currentFilter) return false;
        if (currentSource !== 'all' && sourceOf(a) !== currentSource) return false;
        return true;
      });
      // 排序：未闭环在前 + 紧急优先 + 时间倒序
      var openStatus = { pending:0, processing:1, transferred:2 };
      list.sort(function(a,b){
        var lvOrder = { urgent:0, important:1, reminder:2, notice:3 };
        var oa = openStatus[a.status] !== undefined ? openStatus[a.status] : 9;
        var ob = openStatus[b.status] !== undefined ? openStatus[b.status] : 9;
        if (oa !== ob) return oa - ob;
        var la = lvOrder[a.level]!==undefined ? lvOrder[a.level] : 9;
        var lb = lvOrder[b.level]!==undefined ? lvOrder[b.level] : 9;
        if (la !== lb) return la - lb;
        return (b.time||'').localeCompare(a.time||'');
      });
      var box = document.getElementById('alertList');
      if (!list.length){
        box.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.6 2.6L16 9.5"/></svg><p>暂无预警 · 园区指标正常</p></div>';
        return;
      }
      box.innerHTML = list.map(function(a){
        var actionable = a.status === 'pending' || a.status === 'processing';
        var actionBtn = actionable
          ? '<div class="alert-btn primary" onclick="openActionSheet(\''+a.id+'\',event)">立即处理</div>'
          : (a.status === 'ignored'
            ? '<div class="alert-btn primary" onclick="reopenAlert(\''+a.id+'\',event)">恢复处理</div>'
            : '<div class="alert-btn" onclick="viewAlert(\''+a.id+'\',event)">查看详情</div>');
        var due = '';
        if (a.respondDue && (a.status === 'pending' || a.status === 'processing')) {
          due = '<div class="alert-due '+(isOverdue(a)?'overdue':'')+'">响应时限：'+a.respondDue+(isOverdue(a)?'（已超时）':'')+'</div>';
        }
        return '<div class="alert-card '+levelClass(a.level)+'" onclick="viewAlert(\''+a.id+'\',event)">'+
          '<div class="alert-row1">'+
            '<div><span class="alert-tag '+levelClass(a.level)+'">'+a.levelText+'</span>'+
              '<span class="alert-src" style="margin-left:6px;">'+sourceTextOf(sourceOf(a))+'</span></div>'+
            '<div class="alert-time">'+fmtTm(a.time)+'</div>'+
          '</div>'+
          '<div class="alert-title">'+a.title+
            '<span class="alert-status '+(a.status||'pending')+'" style="margin-left:6px;">'+statusTextOf(a.status)+'</span></div>'+
          '<div class="alert-desc">'+a.desc+'</div>'+
          '<div class="alert-type" style="margin-bottom:10px;">位置：'+a.location+'</div>'+
          due+
          '<div class="alert-actions">'+
            '<div class="alert-btn" onclick="viewAlert(\''+a.id+'\',event)">详情</div>'+
            actionBtn+
          '</div>'+
        '</div>';
      }).join('');
    }
    function updateStats(){
      if (!window.AlertStore) return;
      var s = AlertStore.stats();
      document.getElementById('statUrgent').textContent = s.pending;
      document.getElementById('statTotal').textContent = s.open;
      document.getElementById('statRate').textContent = s.closedRate + '%';
    }
    function navigateBack(){ if(window.history.length>1){ window.history.back(); } else { window.location.href='mb_home.html'; } }
    function viewAlert(id, e){
      if (e) e.stopPropagation();
      var a = window.AlertStore ? AlertStore.byId(id) : null;
      if (!a) return;
      var extra = '位置：'+a.location+'\n来源：'+sourceTextOf(sourceOf(a))+' · 状态：'+statusTextOf(a.status)+'\n⏰ '+fmtTm(a.time);
      if (a.assignee) extra += '\n处理人：'+a.assignee;
      if (a.respondDue) extra += '\n响应时限：'+a.respondDue;
      showModal(a.title, '【'+a.levelText+'】\n\n'+a.desc+'\n\n'+extra);
    }
    function openActionSheet(id, e){
      if (e) e.stopPropagation();
      var a = window.AlertStore ? AlertStore.byId(id) : null;
      if (!a) return;
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:flex-end;';
      overlay.addEventListener('click', function(){ overlay.remove(); });
      var sheet = document.createElement('div');
      sheet.style.cssText = 'background:#fff;border-radius:16px 16px 0 0;width:100%;padding:18px 16px 22px;';
      sheet.addEventListener('click', function(ev){ ev.stopPropagation(); });
      sheet.innerHTML = '<div style="font-size:16px;font-weight:600;margin-bottom:4px;color:#1f2e1f;">处理预警</div>'
        + '<div style="font-size:13px;color:#909399;margin-bottom:14px;">'+a.title+'</div>'
        + '<div class="sheet-action primary" data-to="closed">处理完成（闭环）</div>'
        + '<div class="sheet-action" data-to="transferred">转工单跟进</div>'
        + '<div class="sheet-action" data-to="ignored">忽略本条</div>'
        + '<div class="sheet-action" data-to="cancel" style="background:#fff;color:#909399;">取消</div>';
      overlay.appendChild(sheet);
      document.body.appendChild(overlay);
      sheet.querySelectorAll('.sheet-action').forEach(function(btn){
        btn.addEventListener('click', function(){
          var to = btn.dataset.to;
          overlay.remove();
          if (to === 'cancel') return;
          doTransition(id, to);
        });
      });
    }
    function doTransition(id, to){
      var a = window.AlertStore ? AlertStore.byId(id) : null;
      if (!a) return;
      var actionText = { closed:'现场处理完成', transferred:'转工单跟进', ignored:'现场确认忽略' }[to] || to;
      var res = AlertStore.transition(id, to, { action: actionText, operator: '当前用户' });
      if (!res || !res.ok) {
        showModal('操作未生效', (res && res.message) || '当前状态不支持该流转');
        return;
      }
      showModal('已提交', '【'+a.title+'】\n\n处理方式：'+actionText+'\n处理人：当前用户\n状态：'+(STATUS_TEXT[to] || to));
      refresh();
    }
    function reopenAlert(id, e){
      if (e) e.stopPropagation();
      var res = AlertStore.transition(id, 'pending', { action: '恢复处理', operator: '当前用户' });
      if (res && res.ok) { refresh(); }
      else { showModal('操作未生效', (res && res.message) || '当前状态不支持恢复'); }
    }
    function showModal(title, content){
      var html = '<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;" onclick="this.remove()">'+
        '<div style="background:#fff;border-radius:14px;max-width:340px;width:100%;padding:20px;" onclick="event.stopPropagation()">'+
          '<div style="font-size:16px;font-weight:600;margin-bottom:12px;color:#1f2e1f;">'+title+'</div>'+
          '<div style="font-size:14px;color:#606266;line-height:1.7;white-space:pre-wrap;margin-bottom:16px;">'+content+'</div>'+
          '<div style="text-align:right;"><div class="alert-btn" style="display:inline-block;padding:8px 20px;" onclick="this.closest(\'div[style*=&quot;position:fixed&quot;]\').remove()">关闭</div></div>'+
        '</div>'+
      '</div>';
      document.body.insertAdjacentHTML('beforeend', html);
    }

    function refresh(){ updateStats(); renderSourceChips(); render(); }
    function initAlertPage(){
      refresh();
      if (window.AlertStore && !window.__mbAlertSubscribed) {
        window.__mbAlertSubscribed = true;
        AlertStore.subscribe(refresh);
      }
    }
    // alert-data.js 在下方以 <script> 引入，必须等待其完成后再初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initAlertPage);
      window.addEventListener('load', initAlertPage);
    } else {
      initAlertPage();
    }
  </script>
  <script src="../applefarm_backhand/js/shared/alert-data.js"></script>
  <script>
    // 兜底：脚本加载完成后若尚未初始化则补一次
    if (typeof initAlertPage === 'function') initAlertPage();
  </script>
</body>
</html>
