<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智慧果园 - 快捷操作</title>
<link rel="stylesheet" href="../applefarm_backhand/css/design-system.css">
<link rel="stylesheet" href="css/mobile-design-system.css">
<style>
body {
  margin: 0;
  padding: 0;
  font-family: var(--font-family);
  background: var(--bg-base);
}
.page-header {
  background: var(--gradient-header);
  padding: var(--space-lg) var(--space-md);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: var(--z-sticky);
}
.header-title {
  color: var(--text-inverse);
  font-size: var(--font-size-lg);
  font-weight: var(--font-weight-bold);
}
.header-back,
.header-action {
  width: var(--space-2xl);
  height: var(--space-2xl);
  border-radius: var(--radius-full);
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
}
.record-section {
  background: var(--bg-card);
  margin: var(--space-md);
  border-radius: var(--radius-lg);
  padding: var(--space-xl);
  box-shadow: var(--shadow-card);
}
.record-area {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.record-btn {
  width: 120px;
  height: 120px;
  border-radius: var(--radius-full);
  background: linear-gradient(135deg, var(--error) 0%, #cf1322 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  box-shadow: 0 var(--space-md) 20px rgba(255, 77, 79, 0.4);
  transition: all var(--transition-fast);
}
.record-btn:hover {
  transform: scale(1.05);
}
.record-btn.recording {
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 var(--space-md) 20px rgba(255, 77, 79, 0.4); }
  50% { transform: scale(1.1); box-shadow: 0 var(--space-md) 30px rgba(255, 77, 79, 0.6); }
  100% { transform: scale(1); box-shadow: 0 var(--space-md) 20px rgba(255, 77, 79, 0.4); }
}
.record-icon {
  width: var(--space-3xl);
  height: var(--space-3xl);
}
.record-text {
  margin-top: var(--space-lg);
  font-size: var(--font-size-base);
  color: var(--text-primary);
  font-weight: var(--font-weight-medium);
}
.record-hint {
  margin-top: var(--space-sm);
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
}
.transcript-section {
  background: var(--bg-card);
  margin: var(--space-md);
  border-radius: var(--radius-lg);
  padding: var(--space-lg);
  box-shadow: var(--shadow-card);
}
.section-title {
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-semibold);
  color: var(--text-primary);
  margin-bottom: var(--space-md);
}
.transcript-area {
  min-height: 100px;
  padding: var(--space-md);
  background: var(--bg-base);
  border-radius: var(--radius-md);
  font-size: var(--font-size-base);
  color: var(--text-primary);
  line-height: 1.6;
}
.action-buttons {
  display: flex;
  gap: var(--space-md);
  margin-top: var(--space-lg);
}
.btn-secondary {
  flex: 1;
  padding: var(--space-md);
  background: var(--gray-100);
  color: var(--text-primary);
  border: none;
  border-radius: var(--radius-md);
  font-size: var(--font-size-sm);
  cursor: pointer;
}
.btn-primary {
  flex: 1;
  padding: var(--space-md);
  background: var(--primary-500);
  color: var(--text-inverse);
  border: none;
  border-radius: var(--radius-md);
  font-size: var(--font-size-sm);
  cursor: pointer;
}
.templates-section {
  background: var(--bg-card);
  margin: var(--space-md);
  border-radius: var(--radius-lg);
  padding: var(--space-lg);
  box-shadow: var(--shadow-card);
}
.template-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-md);
}
.template-item {
  padding: var(--space-md);
  background: var(--bg-base);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  gap: var(--space-md);
  cursor: pointer;
  transition: all var(--transition-fast);
}
.template-item:hover {
  background: var(--primary-50);
}
.template-icon {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  background: var(--primary-500);
  display: flex;
  align-items: center;
  justify-content: center;
}
.template-info {
  flex: 1;
}
.template-name {
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-medium);
  color: var(--text-primary);
}
.template-desc {
  font-size: var(--font-size-xs);
  color: var(--text-secondary);
}
.quick-actions {
  background: var(--bg-card);
  margin: var(--space-md);
  border-radius: var(--radius-lg);
  padding: var(--space-lg);
  box-shadow: var(--shadow-card);
}
.action-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-lg);
}
.action-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-sm);
  cursor: pointer;
}
.action-icon {
  width: var(--space-3xl);
  height: var(--space-3xl);
  border-radius: var(--radius-lg);
  background: var(--gray-100);
  display: flex;
  align-items: center;
  justify-content: center;
}
.action-text {
  font-size: var(--font-size-xs);
  color: var(--text-secondary);
}
.footer-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-card);
  padding: var(--space-md);
  display: flex;
  justify-content: space-around;
  box-shadow: 0 calc(var(--space-sm) * -1) 10px rgba(0,0,0,0.1);
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-xs);
}
.nav-icon {
  width: var(--space-2xl);
  height: var(--space-2xl);
}
.nav-text {
  font-size: var(--font-size-xs);
  color: var(--text-secondary);
}
.nav-item.active .nav-text {
  color: var(--primary-500);
}
</style>
</head>
<body>
<!-- 顶部导航 -->
<header class="page-header">
  <button class="header-back">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-inverse)" stroke-width="2">
      <path d="M19 12H5"/>
      <path d="M12 19l-7-7 7-7"/>
    </svg>
  </button>
  <div class="header-title">快捷操作</div>
  <button class="header-action">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-inverse)" stroke-width="2">
      <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
    </svg>
  </button>
</header>

<!-- 语音录制区域 -->
<div class="record-section">
  <div class="record-area">
    <button class="record-btn" id="recordBtn">
      <svg class="record-icon" viewBox="0 0 24 24" fill="var(--text-inverse)" stroke="var(--text-inverse)" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="12" cy="12" r="4"/>
      </svg>
    </button>
    <div class="record-text">点击开始录音</div>
    <div class="record-hint">支持语音转文字，快速记录农事信息</div>
  </div>
</div>

<!-- 转写内容 -->
<div class="transcript-section">
  <div class="section-title">转写内容</div>
  <div class="transcript-area" id="transcriptArea">
    点击上方按钮开始录音，语音内容将自动转换为文字...
  </div>
  <div class="action-buttons">
    <button class="btn-secondary">清空</button>
    <button class="btn-primary">保存记录</button>
  </div>
</div>

<!-- 快捷模板 -->
<div class="templates-section">
  <div class="section-title">快捷模板</div>
  <div class="template-grid">
    <div class="template-item">
      <div class="template-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-inverse)" stroke-width="2">
          <path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10z"/>
          <path d="M8 12l2 2 4-4 4 4"/>
        </svg>
      </div>
      <div class="template-info">
        <div class="template-name">施肥记录</div>
        <div class="template-desc">记录施肥作业</div>
      </div>
    </div>
    <div class="template-item">
      <div class="template-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-inverse)" stroke-width="2">
          <path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10z"/>
          <path d="M8 8h8M8 12h8M8 16h8"/>
        </svg>
      </div>
      <div class="template-info">
        <div class="template-name">病虫害防治</div>
        <div class="template-desc">记录病虫害防治</div>
      </div>
    </div>
    <div class="template-item">
      <div class="template-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-inverse)" stroke-width="2">
          <path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10z"/>
          <path d="M8 12l4-4 4 4M8 16l4-4 4 4"/>
        </svg>
      </div>
      <div class="template-info">
        <div class="template-name">修剪记录</div>
        <div class="template-desc">记录修剪作业</div>
      </div>
    </div>
    <div class="template-item">
      <div class="template-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-inverse)" stroke-width="2">
          <path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10z"/>
          <path d="M8 16l4-4 4 4M12 8v8"/>
        </svg>
      </div>
      <div class="template-info">
        <div class="template-name">灌溉记录</div>
        <div class="template-desc">记录浇水灌溉</div>
      </div>
    </div>
  </div>
</div>

<!-- 快速操作 -->
<div class="quick-actions">
  <div class="section-title">快速操作</div>
  <div class="action-grid">
    <div class="action-item">
      <div class="action-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary-500)" stroke-width="2">
          <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V5a2 2 0 012-2h4l2 3h9a2 2 0 012 2z"/>
        </svg>
      </div>
      <span class="action-text">拍照</span>
    </div>
    <div class="action-item">
      <div class="action-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary-500)" stroke-width="2">
          <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
      </div>
      <span class="action-text">打卡</span>
    </div>
    <div class="action-item">
      <div class="action-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary-500)" stroke-width="2">
          <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
        </svg>
      </div>
      <span class="action-text">定位</span>
    </div>
    <div class="action-item">
      <div class="action-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary-500)" stroke-width="2">
          <path d="M12 8v4l3 3"/>
          <circle cx="12" cy="12" r="10"/>
        </svg>
      </div>
      <span class="action-text">签到</span>
    </div>
  </div>
</div>

<!-- 底部导航 -->
<div class="footer-nav">
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" stroke-width="2">
      <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    <span class="nav-text">首页</span>
  </div>
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" stroke-width="2">
      <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
      <line x1="9" y1="3" x2="9" y2="18"/>
      <line x1="15" y1="6" x2="15" y2="21"/>
    </svg>
    <span class="nav-text">导航</span>
  </div>
  <div class="nav-item active">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="var(--primary-500)" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <circle cx="12" cy="12" r="4"/>
    </svg>
    <span class="nav-text">快捷</span>
  </div>
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <path d="M8 15s1.5-2 4-2 4 2 4 2"/>
      <circle cx="9" cy="9" r="1"/>
      <circle cx="15" cy="9" r="1"/>
    </svg>
    <span class="nav-text">AI助手</span>
  </div>
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" stroke-width="2">
      <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    <span class="nav-text">我的</span>
  </div>
</div>
</body>
</html>
