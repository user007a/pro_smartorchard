<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2b6e3c">
    <title>VR基地全景 - 智慧果园</title>
    <!-- H5设计系统 -->
    <link rel="stylesheet" href="css/mobile-design-system.css">
    <!-- 图标库 -->
    <script src="../applefarm_backhand/icons/icons.js"></script>
    <!-- CDN 资源使用 defer，避免离线/内网环境阻塞首屏渲染（下方有加载失败降级） -->
    <script defer src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" media="print" onload="this.media='all'">
    <script src="../common/js/vr-hotspots.js"></script>
    <script src="../common/js/api-mock.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        #panorama {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .mobile-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }
        .logo-text {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }
        .header-right {
            display: flex;
            gap: 8px;
        }
        .header-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
        }
        .scene-tabs {
            position: absolute;
            top: 68px;
            left: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }
        .scene-tab {
            flex: 1;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .scene-tab.active {
            background: #2b6e3c;
            border-color: #2b6e3c;
        }
        .hotspot-info {
            position: absolute;
            bottom: 140px;
            left: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 16px;
            color: #fff;
            z-index: 100;
            display: none;
            animation: slideUp 0.3s ease;
        }
        .hotspot-info.show {
            display: block;
        }
        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .info-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-close {
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .info-body {
            font-size: 13px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
        }
        .info-action {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .action-btn {
            display: inline-block;
            padding: 8px 24px;
            background: #2b6e3c;
            border-radius: 20px;
            color: #fff;
            font-size: 13px;
        }
        .bottom-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            padding: 0 20px;
            z-index: 100;
        }
        .control-ring {
            width: 160px;
            height: 160px;
            margin: 0 auto;
            position: relative;
        }
        .ring-bg {
            width: 100%;
            height: 100%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }
        .ring-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 12px;
            text-align: center;
        }
        .ring-btn {
            position: absolute;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }
        .ring-btn.up { top: 0; left: 50%; transform: translateX(-50%); }
        .ring-btn.down { bottom: 0; left: 50%; transform: translateX(-50%); }
        .ring-btn.left { left: 0; top: 50%; transform: translateY(-50%); }
        .ring-btn.right { right: 0; top: 50%; transform: translateY(-50%); }
        .zoom-controls {
            position: absolute;
            right: 20px;
            bottom: 200px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .zoom-btn {
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }
        .legend-bar {
            position: absolute;
            top: 130px;
            right: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 10px;
            z-index: 100;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8);
        }
        .legend-item:last-child { margin-bottom: 0; }
        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .legend-dot.plot { background: #22c55e; }
        .legend-dot.device { background: #3b82f6; }
        .legend-dot.task { background: #f59e0b; }
        .legend-dot.scene { background: #06b6d4; }
        .tap-hint {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            z-index: 100;
        }
        /* 轻提示 */
        .vr-toast {
            position: fixed;
            left: 50%;
            bottom: 96px;
            transform: translate(-50%, 12px);
            max-width: 80vw;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
            color: #fff;
            background: rgba(0, 0, 0, 0.78);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transition: opacity 0.24s ease, transform 0.24s ease;
            z-index: 2000;
            pointer-events: none;
            text-align: center;
        }
        .vr-toast.show { opacity: 1; transform: translate(-50%, 0); }
        .vr-toast-success { background: #389e0d; }
        .vr-toast-warning { background: #d48806; }
        .vr-toast-error   { background: #cf1322; }
        @media (prefers-reduced-motion: reduce) {
            .vr-toast { transition: opacity 0.01ms; }
        }
    </style>
</head>
<body>
    <div id="panorama"></div>
    
    <div class="mobile-header">
        <div class="header-left">
            <div class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </div>
            <div class="logo-text">VR全景</div>
        </div>
        <div class="header-right">
            <div class="header-btn" onclick="toggleAutoRotate()">
                <i class="fas fa-refresh"></i>
            </div>
            <div class="header-btn" onclick="resetView()" title="复位视角">
                <i class="fas fa-home"></i>
            </div>
            <div class="header-btn" id="gyroBtn" onclick="toggleGyro()" title="陀螺仪环顾">
                <i class="fas fa-mobile-alt"></i>
            </div>
        </div>
    </div>
    
    <div class="scene-tabs">
        <div class="scene-tab active" data-scene="scene_main">主入口</div>
        <div class="scene-tab" data-scene="scene_b">B区</div>
        <div class="scene-tab" data-scene="scene_c">C区</div>
    </div>
    
    <div class="legend-bar">
        <div class="legend-item"><span class="legend-dot plot"></span> 地块</div>
        <div class="legend-item"><span class="legend-dot device"></span> 设备</div>
        <div class="legend-item"><span class="legend-dot task"></span> 任务</div>
        <div class="legend-item"><span class="legend-dot scene"></span> 切换</div>
    </div>
    
    <div class="hotspot-info" id="hotspotInfo">
        <div class="info-header">
            <div class="info-title" id="infoTitle">信息详情</div>
            <div class="info-close" onclick="closeInfo()">✕</div>
        </div>
        <div class="info-body" id="infoBody"></div>
        <div class="info-action" id="infoAction"></div>
    </div>
    
    <div class="tap-hint">点击热点查看详情</div>
    
    <div class="bottom-controls">
        <div class="control-ring">
            <div class="ring-bg"></div>
            <div class="ring-center">移动</div>
            <div class="ring-btn up" onclick="adjustPitch(12)">
                <i class="fas fa-chevron-up"></i>
            </div>
            <div class="ring-btn down" onclick="adjustPitch(-12)">
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="ring-btn left" onclick="adjustYaw(-15)">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="ring-btn right" onclick="adjustYaw(15)">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>
    </div>
    
    <div class="zoom-controls">
        <div class="zoom-btn" onclick="adjustHfov(8)">
            <i class="fas fa-plus"></i>
        </div>
        <div class="zoom-btn" onclick="adjustHfov(-8)">
            <i class="fas fa-minus"></i>
        </div>
    </div>
    
    <script>
        var viewer;
        var currentSceneId = 'scene_main';
        var isAutoRotating = false;

        /** 轻提示（该页未引入设计系统，故自带样式） */
        function vrToast(msg, type) {
            var cls = type === 'success' ? 'success' : type === 'error' ? 'error' : type === 'warning' ? 'warning' : 'info';
            var box = document.createElement('div');
            box.className = 'vr-toast vr-toast-' + cls;
            box.textContent = msg;
            box.setAttribute('role', 'status');
            document.body.appendChild(box);
            requestAnimationFrame(function () { box.classList.add('show'); });
            setTimeout(function () {
                box.classList.remove('show');
                setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 260);
            }, 2000);
        }
        
        function initViewer(sceneId) {
            var sceneData = vrHotspotsData.getSceneById(sceneId);
            if (!sceneData) return;

            if (viewer) {
                viewer.destroy();
            }

            // 全景库（CDN）不可用时给出明确提示，避免整页因 pannellum 未定义而崩溃
            if (typeof pannellum === 'undefined') {
                document.getElementById('panorama').innerHTML =
                    '<div style="display:flex;align-items:center;justify-content:center;height:100%;' +
                    'color:#fff;background:#1a1a1a;text-align:center;padding:24px;line-height:1.8;">' +
                    '全景组件加载失败<br><span style="font-size:13px;opacity:.75;">请检查网络后刷新页面</span></div>';
                showLibraryMissing();
                return;
            }

            var config = {
                type: 'equirectangular',
                panorama: sceneData.image,
                title: sceneData.name,
                author: '智慧果园',
                sceneFov: sceneData.hfov || 100,
                autoLoad: true,
                showControls: false,
                mouseZoom: true,
                draggable: true,
                keyboardZoom: false,
                compass: false,
                hotSpots: []
            };

            (sceneData.hotspots || []).forEach(function(hotspot) {
                var hotspotConfig = {
                    pitch: hotspot.pitch,
                    yaw: hotspot.yaw,
                    type: 'custom',
                    custom: getHotspotIcon(hotspot.type, hotspot.status),
                    clickHandler: function() {
                        showInfo(hotspot);
                    }
                };
                config.hotSpots.push(hotspotConfig);
            });
            
            viewer = pannellum.viewer('panorama', config);
            currentSceneId = sceneId;
            updateSceneTabs(sceneId);
        }
        
        function getHotspotIcon(type, status) {
            var color = '#22c55e';
            switch(type) {
                case 'plot': color = '#22c55e'; break;
                case 'device': color = '#3b82f6'; break;
                case 'task': color = '#f59e0b'; break;
                case 'building': color = '#8b5cf6'; break;
                case 'scene': color = '#06b6d4'; break;
            }
            if (status === 'warning') color = '#f59e0b';
            if (status === 'error') color = '#ef4444';
            
            return '<div style="width:24px;height:24px;border-radius:50%;background:' + color + ';box-shadow:0 0 12px ' + color + ';border:3px solid #fff;cursor:pointer;"></div>';
        }
        
        function showInfo(hotspot) {
            document.getElementById('infoTitle').innerHTML = hotspot.title;
            document.getElementById('infoBody').innerHTML = hotspot.content;
            
            if (hotspot.type === 'scene') {
                document.getElementById('infoAction').innerHTML = '<div class="action-btn" onclick="switchScene(\'' + hotspot.targetId + '\');closeInfo();">查看全景</div>';
            } else {
                document.getElementById('infoAction').innerHTML = '';
            }
            
            document.getElementById('hotspotInfo').classList.add('show');
        }
        
        function closeInfo() {
            document.getElementById('hotspotInfo').classList.remove('show');
        }
        
        function switchScene(sceneId) {
            initViewer(sceneId);
        }
        
        function updateSceneTabs(sceneId) {
            var tabs = document.querySelectorAll('.scene-tab');
            tabs.forEach(function(tab) {
                tab.classList.remove('active');
                if (tab.dataset.scene === sceneId) {
                    tab.classList.add('active');
                }
            });
        }
        
        function toggleAutoRotate() {
            if (!viewer) {
                vrToast('全景尚未加载完成', 'warning');
                return;
            }
            if (isAutoRotating) {
                viewer.stopAutoRotate();
            } else {
                viewer.startAutoRotate(2);
            }
            isAutoRotating = !isAutoRotating;
        }
        
        /** 全景库缺失时收起所有依赖 viewer 的控件，避免点击报错 */
        function showLibraryMissing() {
            document.querySelectorAll('.bottom-controls, .zoom-controls, .scene-tabs')
                .forEach(function(el) { el.style.display = 'none'; });
        }

        function resetView() {
            if (viewer) viewer.reset();
        }

        function adjustPitch(delta) {
            if (viewer) viewer.setPitch(viewer.getPitch() + delta);
        }

        function adjustYaw(delta) {
            if (viewer) viewer.setYaw(viewer.getYaw() + delta);
        }

        function adjustHfov(delta) {
            if (viewer) viewer.setHfov(viewer.getHfov() + delta);
        }

        function goBack() {
            window.location.href = 'mb_home.html';
        }

        /* ---------- 陀螺仪环顾（F-285） ---------- */
        var gyroOn = false;
        var gyroBase = null;       // 开启瞬间的基准，避免画面跳变
        var smoothYaw = null;
        var smoothPitch = null;

        function screenAngle() {
            if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
            if (typeof window.orientation === 'number') return window.orientation;
            return 0;
        }

        function toggleGyro() {
            if (gyroOn) {
                stopGyro();
                return;
            }
            if (!window.DeviceOrientationEvent) {
                vrToast('当前设备/浏览器不支持陀螺仪', 'warning');
                return;
            }
            // iOS 13+ 需要显式授权
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(function (state) {
                    if (state === 'granted') startGyro();
                    else vrToast('未授予动作与方向权限，无法使用陀螺仪', 'warning');
                }).catch(function () {
                    vrToast('陀螺仪授权失败', 'error');
                });
            } else {
                startGyro();
            }
        }

        function startGyro() {
            if (!viewer) return;
            if (isAutoRotating) { viewer.stopAutoRotate(); isAutoRotating = false; }
            gyroOn = true;
            gyroBase = null;
            smoothYaw = null;
            smoothPitch = null;
            window.addEventListener('deviceorientation', onDeviceOrientation, true);
            document.getElementById('gyroBtn').classList.add('active');
            // 陀螺仪开启时锁定拖拽，避免手势冲突
            if (viewer.setDraggable) viewer.setDraggable(false);
        }

        function stopGyro() {
            gyroOn = false;
            window.removeEventListener('deviceorientation', onDeviceOrientation, true);
            document.getElementById('gyroBtn').classList.remove('active');
            if (viewer && viewer.setDraggable) viewer.setDraggable(true);
        }

        function onDeviceOrientation(e) {
            if (!gyroOn || !viewer) return;
            if (e.alpha === null || e.alpha === undefined) return;   // 设备无方向传感器
            var sa = screenAngle();
            var landscape = (sa === 90 || sa === -90 || sa === 270);
            var alpha = e.alpha;
            var deviceYaw = (alpha + sa + 360) % 360;
            // 竖屏用 beta（前后倾）作为俯仰；横屏时 beta/gamma 语义互换
            var devicePitch = landscape ? (e.gamma || 0) : (e.beta || 0);

            if (!gyroBase) {
                gyroBase = {
                    yaw: deviceYaw,
                    pitch: devicePitch,
                    viewerYaw: viewer.getYaw(),
                    viewerPitch: viewer.getPitch()
                };
                return;
            }

            // 转动手机 → 视线反向偏移
            var targetYaw = gyroBase.viewerYaw - angleDiff(deviceYaw, gyroBase.yaw);
            var targetPitch = gyroBase.viewerPitch + (devicePitch - gyroBase.pitch);

            smoothYaw = smoothYaw === null ? targetYaw : smoothYaw + (targetYaw - smoothYaw) * 0.35;
            smoothPitch = smoothPitch === null ? targetPitch : smoothPitch + (targetPitch - smoothPitch) * 0.35;
            viewer.setYaw(smoothYaw);
            viewer.setPitch(Math.max(-90, Math.min(90, smoothPitch)));
        }

        /** 处理 0/360 环绕的最短角差 */
        function angleDiff(a, b) {
            var d = (a - b) % 360;
            if (d > 180) d -= 360;
            if (d < -180) d += 360;
            return d;
        }
        
        document.querySelectorAll('.scene-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                switchScene(this.dataset.scene);
            });
        });
        
        window.addEventListener('load', function() {
            initViewer('scene_main');
        });
    </script>
</body>
</html>
