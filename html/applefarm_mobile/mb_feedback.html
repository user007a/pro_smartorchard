<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 反馈</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <script src="js/mobile-store.js"></script>
  <script src="../applefarm_backhand/js/shared/mobile-ops-store.js"></script>
  <style>
    /* 页面特定样式 - 使用设计系统变量 */
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; overflow: hidden; padding-bottom: 66px; }
    
    .tab-badge { position: absolute; top: var(--space-1); right: 50%; margin-right: -18px; min-width: 16px; height: 16px; background: var(--error); color: var(--bg-white); border-radius: var(--radius-md); font-size: var(--font-xs); display: flex; align-items: center; justify-content: center; padding: 0 var(--space-1); }
    .content { padding: 16px; padding-bottom: 80px; }
    .card { background: var(--bg-white); border-radius: var(--radius-lg); margin-bottom: var(--space-4); padding: var(--space-4); box-shadow: var(--shadow-card); border: 1px solid var(--border); }
    .card-title { font-size: var(--font-md); font-weight: 600; color: var(--text); margin-bottom: var(--space-3); }
    .status-tag { display: inline-flex; align-items: center; padding: var(--space-1) var(--space-2); border-radius: var(--radius-lg); font-size: var(--font-sm); font-weight: 500; }
    .status-tag.pending { background: var(--warning-bg); color: var(--warning); }
    .status-tag.processing { background: var(--info-bg); color: var(--info); }
    .status-tag.passed { background: var(--success-bg); color: var(--success); }
    .status-tag.rejected { background: var(--error-bg); color: var(--error); }
    .feedback-item { padding: var(--space-3); background: var(--bg-white); border-radius: var(--radius-lg); margin-bottom: var(--space-3); border: 1px solid var(--border); cursor: pointer; transition: all var(--transition-normal); }
    .feedback-item:active { transform: scale(0.99); background: var(--gray-50); }
    .feedback-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-2); }
    .feedback-title { font-size: var(--font-base); font-weight: 600; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .feedback-time { font-size: var(--font-xs); color: var(--text-light); margin-left: var(--space-3); }
    .feedback-content { font-size: var(--font-base); color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .feedback-reason { margin-top: var(--space-2); padding: var(--space-2); background: var(--error-bg); border-radius: var(--radius-md); }
    .feedback-reason-title { font-size: var(--font-sm); color: var(--error); font-weight: 600; margin-bottom: var(--space-1); }
    .feedback-reason-text { font-size: var(--font-sm); color: var(--error); line-height: 1.5; }
    .form-group { margin-bottom: var(--space-4); }
    .form-label { font-size: var(--font-base); color: var(--text-secondary); margin-bottom: var(--space-2); display: block; }
    .form-input { width: 100%; height: 44px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0 var(--space-3); font-size: var(--font-base); color: var(--text); background: var(--bg-white); transition: border-color var(--transition-normal); }
    .form-input:focus { border-color: var(--primary); }
    .form-textarea { width: 100%; min-height: 120px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3); font-size: var(--font-base); color: var(--text); resize: vertical; transition: border-color var(--transition-normal); }
    .form-textarea:focus { border-color: var(--primary); }
    .radio-group { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .radio-item { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--gray-50); border-radius: var(--radius-xl); cursor: pointer; transition: all var(--transition-normal); }
    .radio-item.active { background: var(--primary-light); }
    .radio-item.active .radio-circle { background: var(--primary); border-color: var(--primary); }
    .radio-circle { width: 16px; height: 16px; border: 2px solid var(--gray-400); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .radio-circle::after { content: ''; width: 8px; height: 8px; background: var(--bg-white); border-radius: 50%; opacity: 0; }
    .radio-item.active .radio-circle::after { opacity: 1; }
    .radio-text { font-size: var(--font-base); color: var(--text); }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 var(--space-5); border-radius: var(--radius-full); font-size: var(--font-base); font-weight: 600; cursor: pointer; transition: all var(--transition-normal); border: none; }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: var(--bg-white); }
    .btn-outline { border: 1px solid var(--primary); color: var(--primary); background: transparent; }
    .btn-block { width: 100%; }
    .btn-sm { height: 36px; padding: 0 var(--space-4); font-size: var(--font-base); }
    .action-row { display: flex; gap: var(--space-3); margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border); }
    .action-row .btn { flex: 1; }
    .tabs { display: flex; background: var(--bg-white); border-radius: var(--radius-lg); padding: var(--space-1); margin-bottom: var(--space-4); border: 1px solid var(--border); }
    .tab-btn { flex: 1; height: 40px; border: none; background: transparent; font-size: var(--font-base); color: var(--text-secondary); cursor: pointer; border-radius: var(--radius-md); transition: all var(--transition-normal); }
    .tab-btn.active { background: var(--primary); color: var(--bg-white); }
    .empty-state { text-align: center; padding: var(--space-10) var(--space-5); color: var(--text-light); }
    .empty-icon { width: 80px; height: 80px; margin: 0 auto var(--space-5); background: var(--gray-100); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .empty-icon svg { width: 40px; height: 40px; color: var(--text-light); }
    .empty-text { font-size: var(--font-base); }
    .modal-title { font-size: var(--font-md); font-weight: 600; text-align: center; margin-bottom: var(--space-5); }
    .modal-btn { width: 100%; height: 44px; background: var(--primary); color: var(--bg-white); border: none; border-radius: var(--radius-full); font-size: var(--font-md); font-weight: 600; cursor: pointer; }
    .success-icon { width: 56px; height: 56px; margin: 0 auto var(--space-4); background: var(--success-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .success-icon svg { width: 32px; height: 32px; color: var(--success); }
    .float-btn { position: fixed; bottom: 80px; right: var(--space-5); width: 56px; height: 56px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow-float); z-index: 50; transition: all var(--transition-normal); }
    .float-btn:active { transform: scale(0.95); }
    .float-btn svg { width: 28px; height: 28px; color: var(--bg-white); }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div style="padding-left: 40px;">
        <div class="header-title">我的反馈</div>
        <div class="header-sub">跟踪反馈处理进度</div>
      </div>
    </div>
    
    <div class="content">
      <div class="tabs">
        <button class="tab-btn active" data-tab="all" onclick="switchTab('all')">全部</button>
        <button class="tab-btn" data-tab="pending" onclick="switchTab('pending')">待审核</button>
        <button class="tab-btn" data-tab="processing" onclick="switchTab('processing')">处理中</button>
        <button class="tab-btn" data-tab="closed" onclick="switchTab('closed')">已完成</button>
      </div>

      <div id="feedbackList">
      </div>
    </div>

    <div class="float-btn" onclick="openCreateModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </div>

    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <div class="mb-modal-overlay" id="createModal">
    <div class="mb-modal">
      <div class="modal-title">提交反馈</div>
      <div class="form-group">
        <label class="form-label">反馈类型</label>
        <div class="radio-group" id="feedbackTypeGroup">
          <div class="radio-item active" data-type="suggestion">
            <div class="radio-circle"></div>
            <div class="radio-text">建议</div>
          </div>
          <div class="radio-item" data-type="problem">
            <div class="radio-circle"></div>
            <div class="radio-text">问题</div>
          </div>
          <div class="radio-item" data-type="other">
            <div class="radio-circle"></div>
            <div class="radio-text">其他</div>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">反馈标题</label>
        <input type="text" class="form-input" id="feedbackTitle" placeholder="请输入标题">
      </div>
      <div class="form-group">
        <label class="form-label">详细描述</label>
        <textarea class="form-textarea" id="feedbackContent" placeholder="请详细描述您的问题或建议"></textarea>
      </div>
      <div class="action-row">
        <button class="btn btn-outline" onclick="closeCreateModal()">取消</button>
        <button class="btn btn-primary" onclick="submitFeedback()">提交</button>
      </div>
    </div>
  </div>

  <div class="mb-modal-overlay" id="detailModal">
    <div class="mb-modal">
      <div class="modal-title" id="detailTitle">反馈详情</div>
      <div id="detailContent"></div>
      <button class="modal-btn" onclick="closeDetailModal()">关闭</button>
    </div>
  </div>

  <div class="mb-modal-overlay" id="successModal">
    <div class="mb-modal">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="modal-title" id="successModalTitle">提交成功</div>
      <button class="modal-btn" onclick="closeSuccessModal()">确 定</button>
    </div>
  </div>

  <script>
    let currentTab = 'all';
    let selectedFeedbackType = 'suggestion';

    /* 当前登录作业人员，用于反馈/提问的来源留痕（后台「来源端 + 提交人」） */
    function currentOperator() {
      try {
        const u = JSON.parse(localStorage.getItem('smartorchard_current_user') || 'null');
        return { name: (u && u.name) || '移动端用户', id: (u && u.username) || '' };
      } catch (e) {
        return { name: '移动端用户', id: '' };
      }
    }

    /* 纯在线数据源：反馈来自后端 sf_mb_feedback，经 MobileOpsStore 桥接。
     * 将 store 字段（feedbackType/submitTime/submitter）映射回页面既有字段结构
     * （type/createTime/operator），页面渲染逻辑保持不变。 */
    function getFeedbacks() {
      let rows = [];
      try {
        if (window.MobileOpsStore && typeof MobileOpsStore.list === 'function') {
          rows = MobileOpsStore.list('feedbacks') || [];
        }
      } catch (e) { rows = []; }
      return rows.map(function (f, i) {
        return {
          id: f.id != null && f.id !== '' ? f.id : ('fb_' + i),
          title: f.title || '',
          content: f.content || '',
          type: f.feedbackType || f.type || 'suggestion',
          status: f.status || 'pending',
          createTime: f.submitTime || f.createTime || '',
          source: f.source || 'mobile',
          operator: f.submitter || f.operator || '',
          operatorId: f.operatorId || '',
          reply: f.reply || '',
          rejectReason: f.rejectReason || ''
        };
      });
    }

    /* 反馈写入后端（经 MobileOpsStore 全量桥接，字段映射为 mapper 约定） */
    function persistFeedback(item) {
      if (!window.MobileOpsStore || typeof MobileOpsStore.push !== 'function') return;
      MobileOpsStore.push('feedbacks', {
        title: item.title,
        content: item.content,
        feedbackType: item.type || 'suggestion',
        submitter: item.operator || '',
        operatorId: item.operatorId || '',
        submitTime: item.createTime || MobileStore.fmtTime(Date.now()),
        status: item.status || 'pending',
        source: item.source || 'mobile',
        reply: item.reply || null,
        rejectReason: item.rejectReason || null
      });
    }

    function navigateTo(page) {
      window.location.href = page;
    }

    function goBack() {
      window.history.back();
    }

    function init() {
      loadFeedbacks();
      document.querySelectorAll('#feedbackTypeGroup .radio-item').forEach(item => {
        item.addEventListener('click', () => {
          document.querySelectorAll('#feedbackTypeGroup .radio-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          selectedFeedbackType = item.dataset.type;
        });
      });
      /* 后端预加载完成后重渲染（严格空库：数据来自数据库） */
      if (window.MobileOpsStore && MobileOpsStore.subscribe) {
        MobileOpsStore.subscribe(function (key) {
          if (!key || key === MobileOpsStore.KEYS.feedbacks) loadFeedbacks();
        });
      }
    }

    function loadFeedbacks() {
      const container = document.getElementById('feedbackList');
      const mockFeedbacks = getFeedbacks();
      let filtered = mockFeedbacks;
      
      if (currentTab !== 'all') {
        if (currentTab === 'closed') {
          filtered = mockFeedbacks.filter(f => f.status === 'passed' || f.status === 'rejected');
        } else {
          filtered = mockFeedbacks.filter(f => f.status === currentTab);
        }
      }
      
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </div>
            <div class="empty-text">暂无反馈记录</div>
          </div>
        `;
        return;
      }
      
      container.innerHTML = filtered.map(f => `
        <div class="feedback-item" onclick="showDetail(${f.id})">
          <div class="feedback-header">
            <div class="feedback-title">${f.title}</div>
            <span class="status-tag ${f.status}">${getStatusText(f.status)}</span>
          </div>
          <div class="feedback-content">${f.content}</div>
          <div class="feedback-time">${f.createTime}</div>
          ${f.status === 'rejected' && f.rejectReason ? `
            <div class="feedback-reason">
              <div class="feedback-reason-title">审核意见</div>
              <div class="feedback-reason-text">${f.rejectReason}</div>
            </div>
            <div class="action-row">
              <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); editFeedback(${f.id})">修改重提</button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function getStatusText(status) {
      const map = {
        pending: '待审核',
        processing: '处理中',
        passed: '已通过',
        rejected: '已驳回'
      };
      return map[status] || status;
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tabs .tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      loadFeedbacks();
    }

    function showDetail(id) {
      const feedback = getFeedbacks().find(f => String(f.id) === String(id));
      if (!feedback) return;
      
      document.getElementById('detailTitle').textContent = feedback.title;
      document.getElementById('detailContent').innerHTML = `
        <div class="form-group">
          <label class="form-label">反馈类型</label>
          <div class="radio-text">${getTypeText(feedback.type)}</div>
        </div>
        <div class="form-group">
          <label class="form-label">详细描述</label>
          <div class="radio-text">${feedback.content}</div>
        </div>
        <div class="form-group">
          <label class="form-label">当前状态</label>
          <span class="status-tag ${feedback.status}">${getStatusText(feedback.status)}</span>
        </div>
        <div class="form-group">
          <label class="form-label">提交时间</label>
          <div class="radio-text">${feedback.createTime}</div>
        </div>
        ${feedback.reply ? `
          <div class="form-group">
            <label class="form-label">官方回复</label>
            <div class="radio-text">${feedback.reply}</div>
          </div>
        ` : ''}
        ${feedback.rejectReason ? `
          <div class="feedback-reason">
            <div class="feedback-reason-title">审核意见</div>
            <div class="feedback-reason-text">${feedback.rejectReason}</div>
          </div>
        ` : ''}
      `;
      document.getElementById('detailModal').classList.add('show');
    }

    function getTypeText(type) {
      const map = { suggestion: '建议', problem: '问题', other: '其他' };
      return map[type] || type;
    }

    function openCreateModal() {
      document.getElementById('feedbackTitle').value = '';
      document.getElementById('feedbackContent').value = '';
      document.querySelectorAll('#feedbackTypeGroup .radio-item').forEach((item, i) => {
        item.classList.toggle('active', i === 0);
      });
      selectedFeedbackType = 'suggestion';
      document.getElementById('createModal').classList.add('show');
    }

    function closeCreateModal() {
      document.getElementById('createModal').classList.remove('show');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.remove('show');
    }

    function closeSuccessModal() {
      document.getElementById('successModal').classList.remove('show');
    }

    function submitFeedback() {
      const title = document.getElementById('feedbackTitle').value.trim();
      const content = document.getElementById('feedbackContent').value.trim();
      
      if (!title) {
        MobileStore.toast('请输入反馈标题', 'warning');
        return;
      }
      
      if (!content) {
        MobileStore.toast('请输入详细描述', 'warning');
        return;
      }
      
      const me = currentOperator();
      const newFeedback = {
        id: Date.now(),
        title,
        content,
        type: selectedFeedbackType,
        status: 'pending',
        createTime: MobileStore.fmtTime(Date.now()),
        source: 'mobile',
        operator: me.name,
        operatorId: me.id,
        appVersion: '1.0.0'
      };
      
      persistFeedback(newFeedback);
      closeCreateModal();
      document.getElementById('successModalTitle').textContent = '提交成功';
      document.getElementById('successModal').classList.add('show');
      loadFeedbacks();
      MobileStore.toast('反馈已提交', 'success');
    }

    function editFeedback(id) {
      const feedback = getFeedbacks().find(f => String(f.id) === String(id));
      if (!feedback) return;
      
      document.getElementById('feedbackTitle').value = feedback.title;
      document.getElementById('feedbackContent').value = feedback.content;
      
      document.querySelectorAll('#feedbackTypeGroup .radio-item').forEach(item => {
        item.classList.toggle('active', item.dataset.type === feedback.type);
      });
      selectedFeedbackType = feedback.type;
      
      const originalSubmit = submitFeedback;
      submitFeedback = function() {
        const title = document.getElementById('feedbackTitle').value.trim();
        const content = document.getElementById('feedbackContent').value.trim();
        
        if (!title || !content) {
          MobileStore.toast('请填写完整信息', 'warning');
          return;
        }
        
        feedback.title = title;
        feedback.content = content;
        feedback.type = selectedFeedbackType;
        feedback.status = 'pending';
        feedback.updatedAt = MobileStore.fmtTime(Date.now());
        delete feedback.rejectReason;
        persistFeedback(feedback);
        
        submitFeedback = originalSubmit;
        closeCreateModal();
        document.getElementById('successModalTitle').textContent = '修改成功';
        document.getElementById('successModal').classList.add('show');
        loadFeedbacks();
      };
      
      document.getElementById('createModal').classList.add('show');
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
