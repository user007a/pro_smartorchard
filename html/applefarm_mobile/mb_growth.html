<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 生长阶段</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="../applefarm_backhand/css/design-system.css">
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body { font-family: var(--font-family); background: var(--bg); color: var(--text); overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 66px; }
    
    /* Header */
    .page-header {
      position: relative;
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
      padding: 44px 16px 20px;
      color: var(--bg-white);
    }
    
    .header-back {
      position: absolute;
      left: 12px;
      top: 44px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .header-back svg { width: 18px; height: 18px; }
    
    .header-content { padding-left: 44px; }
    .header-title { font-size: var(--font-xl); font-weight: 700; }
    .header-sub { font-size: var(--font-sm); opacity: 0.85; margin-top: 4px; }
    
    .content { padding: 16px; }
    
    .overview-card { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-5); margin-bottom: var(--space-4); box-shadow: var(--shadow-card); border: 1px solid var(--border); }
    .overview-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); }
    .overview-title { font-size: var(--font-base); font-weight: 600; color: var(--text); display: flex; align-items: center; gap: var(--space-2); }
    .overview-badge { background: var(--primary-light); color: var(--primary); font-size: var(--font-xs); padding: var(--space-1) var(--space-3); border-radius: var(--radius-md); font-weight: 600; }
    .stage-info { text-align: center; padding: var(--space-4) 0; }
    .stage-name { font-size: var(--font-3xl); font-weight: 800; color: var(--primary); margin-bottom: var(--space-2); }
    .stage-desc { font-size: var(--font-sm); color: var(--text-secondary); }
    .progress-bar { height: 12px; background: var(--gray-100); border-radius: var(--radius-sm); overflow: hidden; margin: var(--space-4) 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #4cd964); border-radius: var(--radius-sm); transition: width .5s ease; }
    .progress-info { display: flex; justify-content: space-between; font-size: var(--font-sm); color: var(--text-light); }
    
    .plot-list { background: var(--bg-white); border-radius: var(--radius-xl); overflow: hidden; box-shadow: var(--shadow-card); border: 1px solid var(--border); }
    .plot-header { padding: var(--space-3) var(--space-4); font-size: var(--font-base); font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--space-2); }
    .plot-item { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--space-3); }
    .plot-item:last-child { border-bottom: none; }
    .plot-color { width: 4px; height: 40px; border-radius: 2px; }
    .plot-color.green { background: var(--primary); }
    .plot-color.orange { background: var(--orange); }
    .plot-color.blue { background: var(--info); }
    .plot-info { flex: 1; }
    .plot-name { font-size: var(--font-base); font-weight: 600; color: var(--text); margin-bottom: var(--space-1); }
    .plot-stage { font-size: var(--font-sm); color: var(--text-secondary); }
    .plot-progress { text-align: right; }
    .plot-percent { font-size: var(--font-xl); font-weight: 700; color: var(--primary); }
    .plot-days { font-size: var(--font-xs); color: var(--text-light); margin-top: 2px; }
    
    .suggestion-card { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-4); margin-top: var(--space-4); box-shadow: var(--shadow-card); border: 1px solid var(--border); }
    .suggestion-title { font-size: var(--font-base); font-weight: 600; color: var(--text); margin-bottom: var(--space-3); display: flex; align-items: center; gap: var(--space-2); }
    .suggestion-icon { font-size: var(--font-lg); }
    .suggestion-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); background: var(--primary-light); border-radius: var(--radius-md); margin-bottom: var(--space-3); }
    .suggestion-item:last-child { margin-bottom: 0; }
    .suggestion-text { flex: 1; font-size: var(--font-sm); color: var(--text); }
    .suggestion-btn { background: var(--primary); color: var(--bg-white); font-size: var(--font-sm); padding: var(--space-2) var(--space-4); border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; }
    
    .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 750px; height: 56px; background: var(--bg-white); display: flex; border-top: 1px solid var(--border); z-index: 100; }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-light); transition: color .2s; cursor: pointer; }
    .tab-item.active { color: var(--primary); }
    .tab-item svg { width: 22px; height: 22px; }
    .tab-item span { font-size: var(--font-xs); }
  </style>
</head>
<body>
  <div class="app">
    <div class="header-bg">
      <div class="page-header">
        <div class="header-back" onclick="history.back()">←</div>
        <div class="header-title">生长阶段</div>
      </div>
    </div>
    
    <div class="content">
      <div class="overview-card">
        <div class="overview-header">
          <div class="overview-title">
            <span>🌱</span>
            <span>当前生长阶段</span>
          </div>
          <div class="overview-badge">膨大期</div>
        </div>
        <div class="stage-info">
          <div class="stage-name">果实膨大期</div>
          <div class="stage-desc">红富士正处于果实快速膨大阶段，需加强水肥管理</div>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 65%;"></div>
        </div>
        <div class="progress-info">
          <span>萌芽期 3月15日</span>
          <span>成熟期 10月15日</span>
        </div>
      </div>
      
      <div class="plot-list">
        <div class="plot-header">
          <span>📍</span>
          <span>各地块生长进度</span>
        </div>
        <div class="plot-item">
          <div class="plot-color green"></div>
          <div class="plot-info">
            <div class="plot-name">A区 - 红富士</div>
            <div class="plot-stage">膨大期 · 预计剩余45天</div>
          </div>
          <div class="plot-progress">
            <div class="plot-percent">65%</div>
            <div class="plot-days">剩余45天</div>
          </div>
        </div>
        <div class="plot-item">
          <div class="plot-color orange"></div>
          <div class="plot-info">
            <div class="plot-name">B区 - 嘎啦</div>
            <div class="plot-stage">成熟期 · 预计剩余15天</div>
          </div>
          <div class="plot-progress">
            <div class="plot-percent">90%</div>
            <div class="plot-days">剩余15天</div>
          </div>
        </div>
        <div class="plot-item">
          <div class="plot-color blue"></div>
          <div class="plot-info">
            <div class="plot-name">C区 - 乔纳金</div>
            <div class="plot-stage">膨大期 · 预计剩余50天</div>
          </div>
          <div class="plot-progress">
            <div class="plot-percent">55%</div>
            <div class="plot-days">剩余50天</div>
          </div>
        </div>
      </div>
      
      <div class="suggestion-card">
        <div class="suggestion-title">
          <span class="suggestion-icon">💡</span>
          <span>模型推荐农事</span>
        </div>
        <div class="suggestion-item">
          <div class="suggestion-text">膨大期建议追施高钾肥，每亩施用量15-20公斤</div>
          <div class="suggestion-btn" onclick="navigateTo('mb_record_task.html')">记农事</div>
        </div>
        <div class="suggestion-item">
          <div class="suggestion-text">及时补充钙肥，预防苦痘病发生</div>
          <div class="suggestion-btn" onclick="navigateTo('mb_record_task.html')">记农事</div>
        </div>
      </div>
    </div>
    
    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_model.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
        <span>AI</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </div>
  </div>
  
  <script>
    function navigateTo(page) { window.location.href = page; }
  </script>
</body>
</html>
