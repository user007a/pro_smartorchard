<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 农事计划</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <style>
    /* Content */
    .content { padding: 16px; padding-bottom: 80px; }
    
    /* Card */
    .card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    
    .card-title {
      font-size: var(--font-md);
      font-weight: 600;
      color: var(--text);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .card-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background: var(--primary);
      border-radius: 2px;
    }
    
    /* Plan Item */
    .plan-item {
      padding: 16px;
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      margin-bottom: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .plan-item:active {
      transform: scale(0.99);
      box-shadow: var(--shadow-xs);
    }
    
    .plan-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    
    .plan-name {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
    }
    
    .plan-status {
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: var(--font-xs);
      font-weight: 500;
    }
    
    .plan-status.doing {
      background: var(--primary-light);
      color: var(--primary);
    }
    
    .plan-status.pending {
      background: var(--warning-bg);
      color: var(--warning);
    }
    
    .plan-status.completed {
      background: var(--info-bg);
      color: var(--info);
    }
    
    .plan-date {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    
    .plan-tasks {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .task-tag {
      padding: 4px 10px;
      background: var(--gray-100);
      border-radius: var(--radius-md);
      font-size: var(--font-xs);
      color: var(--text-secondary);
    }
    
    /* Modal: 已迁移到统一弹窗组件 .mb-modal-overlay / .mb-modal */
    .modal-title {
      font-size: var(--font-lg);
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
      color: var(--text);
    }
    
    .detail-section { margin-bottom: 18px; }
    
    .detail-label {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    
    .detail-value {
      font-size: var(--font-base);
      color: var(--text);
    }
    
    /* Timeline */
    .timeline {
      position: relative;
      padding-left: 24px;
    }
    
    .timeline::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 4px;
      bottom: 4px;
      width: 3px;
      background: var(--border);
      border-radius: 2px;
    }
    
    .timeline-item {
      position: relative;
      margin-bottom: 20px;
    }
    
    .timeline-item:last-child { margin-bottom: 0; }
    
    .timeline-dot {
      position: absolute;
      left: -24px;
      top: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--primary);
      border: 3px solid var(--bg-white);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    
    .timeline-item.completed .timeline-dot {
      background: var(--success);
      box-shadow: 0 0 0 3px var(--success-bg);
    }
    
    .timeline-item.pending .timeline-dot {
      background: var(--gray-300);
      box-shadow: 0 0 0 3px var(--gray-100);
    }
    
    .timeline-content {
      padding: 12px 0;
    }
    
    .timeline-title {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }
    
    .timeline-time {
      font-size: var(--font-xs);
      color: var(--text-light);
    }
    
    /* Button */
    .btn {
      width: 100%;
      height: 44px;
      border-radius: var(--radius-full);
      font-size: var(--font-base);
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-top: 16px;
      transition: all var(--transition-fast);
    }
    
    .btn:active { transform: scale(0.98); }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: var(--bg-white);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div style="padding-left: 44px;">
        <div class="header-title">农事计划</div>
        <div class="header-sub">查看和执行农事作业计划</div>
      </div>
    </div>
    
    <div class="content" id="planContent"></div>

    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <div class="mb-modal-overlay" id="planModal">
    <div class="mb-modal">
      <div class="modal-title" id="planModalTitle">计划详情</div>
      <div id="planModalContent"></div>
      <button class="btn btn-primary" onclick="closePlanModal()">知道了</button>
    </div>
  </div>

  <script src="../applefarm_backhand/js/shared/production-store.js"></script>
  <script src="../applefarm_backhand/js/shared/production-store.js"></script>
  <script src="js/mobile-data.js"></script>
  <script>
    /* ============================================================
     * 农事计划页（严格空库 · 全部取自数据库）
     * ------------------------------------------------------------
     * 计划列表 → sf_farming_plan（+ sf_farming_task 任务标签）
     * 计划详情 → sf_farming_plan + sf_farming_task
     * ============================================================ */
    var MD = window.MobileData;

    var STATUS_CLS = { completed: 'completed', executing: 'doing', delayed: 'doing', pending: 'pending', cancelled: 'pending' };
    var STATUS_TXT = { completed: '已完成', executing: '进行中', delayed: '已延期', pending: '待执行', cancelled: '已取消' };

    function esc(s) {
      return MD ? MD.esc(s) : String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function navigateTo(page) {
      window.location.href = page;
    }

    function goBack() {
      window.history.back();
    }

    function fmt(d) {
      if (!d) return '';
      var m = String(d).slice(0, 10).split('-');
      return m.length === 3 ? (m[0] + '年' + parseInt(m[1], 10) + '月' + parseInt(m[2], 10) + '日') : String(d);
    }

    function range(a, b) {
      if (!a && !b) return '';
      return fmt(a) + ' - ' + fmt(b);
    }

    /* 计划 → 任务（sf_farming_task.plan_id 关联 sf_farming_plan.id） */
    function tasksOfPlan(plan) {
      var tasks = MD ? MD.list('farming_task') : [];
      return tasks.filter(function (t) {
        return String(t.plan_id || '') === String(plan.id) ||
               String(t.plan_id || '') === String(plan.plan_code);
      });
    }

    /* ---------- 计划详情弹窗 ---------- */
    function openPlanDetail(planId) {
      var plans = MD ? MD.list('farming_plan') : [];
      var plan = null;
      plans.forEach(function (p) {
        if (String(p.id) === String(planId) || String(p.plan_code) === String(planId)) plan = p;
      });
      if (!plan) return;

      document.getElementById('planModalTitle').textContent = plan.plan_name || '--';

      var planTasks = tasksOfPlan(plan);
      var tasksHtml = '<div class="timeline">';
      planTasks.forEach(function (task) {
        var isCompleted = task.status === 'completed';
        tasksHtml += '<div class="timeline-item ' + (isCompleted ? 'completed' : 'pending') + '">' +
          '<div class="timeline-dot"></div>' +
          '<div class="task-item">' +
            '<div class="task-icon">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                (isCompleted ? '<polyline points="20 6 9 17 4 12"/>' : '<circle cx="12" cy="12" r="10"/>') +
              '</svg>' +
            '</div>' +
            '<div class="task-info">' +
              '<div class="task-name">' + esc(task.task_name) + '</div>' +
              '<div class="task-time">' + esc(range(String(task.plan_time || '').slice(0, 10), task.deadline)) + '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
      });
      tasksHtml += '</div>';
      if (!planTasks.length) tasksHtml = MD.inlineEmpty('该计划暂无任务');

      document.getElementById('planModalContent').innerHTML =
        '<div class="detail-section">' +
          '<div class="detail-label">计划时间</div>' +
          '<div class="detail-value">' + esc(range(plan.start_date, plan.end_date)) + '</div>' +
        '</div>' +
        '<div class="detail-section">' +
          '<div class="detail-label">适用区域</div>' +
          '<div class="detail-value">' + esc(plan.plot_range || plan.standard_name || '全园') + '</div>' +
        '</div>' +
        '<div class="detail-section">' +
          '<div class="detail-label">任务列表</div>' +
          tasksHtml +
        '</div>';

      document.getElementById('planModal').classList.add('show');
    }

    function closePlanModal() {
      document.getElementById('planModal').classList.remove('show');
    }

    /* ---------- 列表渲染 ---------- */
    function renderPlans() {
      var box = document.getElementById('planContent');
      if (!box || !MD) return;
      var plans = MD.list('farming_plan');
      if (!plans.length) {
        box.innerHTML = '<div class="card"><div class="card-title">暂无农事计划</div>' +
          '<div class="mb-list-empty">数据库中暂无农事计划</div></div>';
        return;
      }

      var groups = [
        { title: '进行中的计划', statuses: ['executing', 'delayed'] },
        { title: '待执行计划', statuses: ['pending'] },
        { title: '已完成计划', statuses: ['completed'] },
        { title: '已取消计划', statuses: ['cancelled'] }
      ];

      var html = '';
      groups.forEach(function (g) {
        var rows = plans.filter(function (p) { return g.statuses.indexOf(p.status) >= 0; });
        if (!rows.length) return;
        html += '<div class="card"><div class="card-title">' + g.title + '（' + rows.length + '）</div>' +
          rows.map(function (p) {
            var tagList = tasksOfPlan(p).slice(0, 4).map(function (t) {
              return '<span class="task-tag">' + esc(t.task_name) + '</span>';
            }).join('');
            return '<div class="plan-item" onclick="openPlanDetail(\'' + esc(p.plan_code || p.id) + '\')">' +
              '<div class="plan-header"><div class="plan-name">' + esc(p.plan_name) + '</div>' +
              '<span class="plan-status ' + (STATUS_CLS[p.status] || 'pending') + '">' +
              (STATUS_TXT[p.status] || p.status) + '</span></div>' +
              '<div class="plan-date">' + esc(range(p.start_date, p.end_date)) + '</div>' +
              '<div class="plan-tasks">' + (tagList || '<span class="task-tag">暂无任务</span>') + '</div>' +
            '</div>';
          }).join('') + '</div>';
      });
      box.innerHTML = html;
    }

    renderPlans();
    if (MD) MD.subscribe(renderPlans);
    if (window.ProductionStore && ProductionStore.subscribe) {
      ProductionStore.subscribe(renderPlans);
    }
  </script>

</body>
</html>
