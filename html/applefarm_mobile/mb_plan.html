<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 农事计划</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <style>
    /* Content */
    .content { padding: 16px; padding-bottom: 80px; }
    
    /* Card */
    .card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    
    .card-title {
      font-size: var(--font-md);
      font-weight: 600;
      color: var(--text);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .card-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background: var(--primary);
      border-radius: 2px;
    }
    
    /* Plan Item */
    .plan-item {
      padding: 16px;
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      margin-bottom: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .plan-item:active {
      transform: scale(0.99);
      box-shadow: var(--shadow-xs);
    }
    
    .plan-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    
    .plan-name {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
    }
    
    .plan-status {
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: var(--font-xs);
      font-weight: 500;
    }
    
    .plan-status.doing {
      background: var(--primary-light);
      color: var(--primary);
    }
    
    .plan-status.pending {
      background: var(--warning-bg);
      color: var(--warning);
    }
    
    .plan-status.completed {
      background: var(--info-bg);
      color: var(--info);
    }
    
    .plan-date {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    
    .plan-tasks {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .task-tag {
      padding: 4px 10px;
      background: var(--gray-100);
      border-radius: var(--radius-md);
      font-size: var(--font-xs);
      color: var(--text-secondary);
    }
    
    /* Modal: 已迁移到统一弹窗组件 .mb-modal-overlay / .mb-modal */
    .modal-title {
      font-size: var(--font-lg);
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
      color: var(--text);
    }
    
    .detail-section { margin-bottom: 18px; }
    
    .detail-label {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    
    .detail-value {
      font-size: var(--font-base);
      color: var(--text);
    }
    
    /* Timeline */
    .timeline {
      position: relative;
      padding-left: 24px;
    }
    
    .timeline::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 4px;
      bottom: 4px;
      width: 3px;
      background: var(--border);
      border-radius: 2px;
    }
    
    .timeline-item {
      position: relative;
      margin-bottom: 20px;
    }
    
    .timeline-item:last-child { margin-bottom: 0; }
    
    .timeline-dot {
      position: absolute;
      left: -24px;
      top: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--primary);
      border: 3px solid var(--bg-white);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    
    .timeline-item.completed .timeline-dot {
      background: var(--success);
      box-shadow: 0 0 0 3px var(--success-bg);
    }
    
    .timeline-item.pending .timeline-dot {
      background: var(--gray-300);
      box-shadow: 0 0 0 3px var(--gray-100);
    }
    
    .timeline-content {
      padding: 12px 0;
    }
    
    .timeline-title {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }
    
    .timeline-time {
      font-size: var(--font-xs);
      color: var(--text-light);
    }
    
    /* Button */
    .btn {
      width: 100%;
      height: 44px;
      border-radius: var(--radius-full);
      font-size: var(--font-base);
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-top: 16px;
      transition: all var(--transition-fast);
    }
    
    .btn:active { transform: scale(0.98); }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: var(--bg-white);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div style="padding-left: 44px;">
        <div class="header-title">农事计划</div>
        <div class="header-sub">查看和执行农事作业计划</div>
      </div>
    </div>
    
    <div class="content">
      <div class="card">
        <div class="card-title">进行中的计划</div>
        <div class="plan-item" onclick="openPlanDetail(1)">
          <div class="plan-header">
            <div class="plan-name">2026年花牛苹果秋季采收计划</div>
            <span class="plan-status doing">进行中</span>
          </div>
          <div class="plan-date">2026年10月15日 - 2026年10月31日</div>
          <div class="plan-tasks">
            <span class="task-tag">分批采收</span>
            <span class="task-tag">分级</span>
            <span class="task-tag">入库预冷</span>
            <span class="task-tag">防早霜</span>
          </div>
        </div>
        <div class="plan-item" onclick="openPlanDetail(4)">
          <div class="plan-header">
            <div class="plan-name">2026年金帅苹果采收入库计划</div>
            <span class="plan-status doing">进行中</span>
          </div>
          <div class="plan-date">2026年10月10日 - 2026年10月28日</div>
          <div class="plan-tasks">
            <span class="task-tag">采收</span>
            <span class="task-tag">分级</span>
            <span class="task-tag">冷链入库</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">待执行计划</div>
        <div class="plan-item" onclick="openPlanDetail(2)">
          <div class="plan-header">
            <div class="plan-name">2026年苹果园采后清园计划</div>
            <span class="plan-status pending">待执行</span>
          </div>
          <div class="plan-date">2026年11月5日 - 2026年11月25日</div>
          <div class="plan-tasks">
            <span class="task-tag">落叶清扫</span>
            <span class="task-tag">秋季施肥</span>
            <span class="task-tag">树干涂白</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">已完成计划</div>
        <div class="plan-item" onclick="openPlanDetail(3)">
          <div class="plan-header">
            <div class="plan-name">2026年春季果园管理计划</div>
            <span class="plan-status completed">已完成</span>
          </div>
          <div class="plan-date">2026年3月 - 2026年4月</div>
          <div class="plan-tasks">
            <span class="task-tag">冬季修剪</span>
            <span class="task-tag">清园消毒</span>
            <span class="task-tag">春季施肥</span>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <div class="mb-modal-overlay" id="planModal">
    <div class="mb-modal">
      <div class="modal-title" id="planModalTitle">计划详情</div>
      <div id="planModalContent"></div>
      <button class="btn btn-primary" onclick="closePlanModal()">知道了</button>
    </div>
  </div>

  <script>
    const planData = {
      1: {
        title: '2026年花牛苹果秋季采收计划',
        date: '2026年10月15日 - 2026年10月31日',
        status: 'doing',
        area: 'A1区、A2区',
        tasks: [
          { name: '第一轮采收（阳面果）', time: '10月15日 - 10月18日', completed: true },
          { name: '第二轮采收（外围果）', time: '10月19日 - 10月22日', completed: false },
          { name: '果实分级与包装', time: '10月18日 - 10月25日', completed: false },
          { name: '冷链预冷入库', time: '10月20日 - 10月26日', completed: false },
          { name: '低洼地块防早霜', time: '10月27日 - 10月31日', completed: false }
        ]
      },
      4: {
        title: '2026年金帅苹果采收入库计划',
        date: '2026年10月10日 - 2026年10月28日',
        status: 'doing',
        area: 'B1区、B2区',
        tasks: [
          { name: '金帅苹果采收', time: '10月10日 - 10月18日', completed: true },
          { name: '果实分级与筛选', time: '10月18日 - 10月22日', completed: false },
          { name: '冷链入库预冷', time: '10月22日 - 10月26日', completed: false },
          { name: '果园采后清理', time: '10月26日 - 10月28日', completed: false }
        ]
      },
      2: {
        title: '2026年苹果园采后清园计划',
        date: '2026年11月5日 - 2026年11月25日',
        status: 'pending',
        area: '全园',
        tasks: [
          { name: '落叶清扫与掩埋', time: '11月5日 - 11月10日', completed: false },
          { name: '秋季基肥（有机肥）', time: '11月12日 - 11月18日', completed: false },
          { name: '树干涂白与防寒', time: '11月20日 - 11月25日', completed: false }
        ]
      },
      3: {
        title: '2026年春季果园管理计划',
        date: '2026年3月 - 2026年4月',
        status: 'completed',
        area: '全园',
        tasks: [
          { name: '冬季修剪', time: '3月1日 - 3月10日', completed: true },
          { name: '清园消毒（石硫合剂）', time: '3月15日 - 3月20日', completed: true },
          { name: '春季基肥（有机肥）', time: '3月25日 - 3月30日', completed: true },
          { name: '花前病虫害防治', time: '4月1日 - 4月10日', completed: true },
          { name: '人工辅助授粉', time: '4月15日 - 4月20日', completed: true }
        ]
      }
    };

    function navigateTo(page) {
      window.location.href = page;
    }

    function goBack() {
      window.history.back();
    }

    function openPlanDetail(id) {
      const plan = planData[id];
      if (!plan) return;

      document.getElementById('planModalTitle').textContent = plan.title;
      
      let tasksHtml = '<div class="timeline">';
      plan.tasks.forEach((task, index) => {
        const isCompleted = task.completed;
        tasksHtml += `
          <div class="timeline-item ${isCompleted ? 'completed' : 'pending'}">
            <div class="timeline-dot"></div>
            <div class="task-item">
              <div class="task-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  ${isCompleted ? '<polyline points="20 6 9 17 4 12"/>' : '<circle cx="12" cy="12" r="10"/>'}
                </svg>
              </div>
              <div class="task-info">
                <div class="task-name">${task.name}</div>
                <div class="task-time">${task.time}</div>
              </div>
            </div>
          </div>
        `;
      });
      tasksHtml += '</div>';

      document.getElementById('planModalContent').innerHTML = `
        <div class="detail-section">
          <div class="detail-label">计划时间</div>
          <div class="detail-value">${plan.date}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">适用区域</div>
          <div class="detail-value">${plan.area || '全园'}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">任务列表</div>
          ${tasksHtml}
        </div>
      `;

      document.getElementById('planModal').classList.add('show');
    }

    function closePlanModal() {
      document.getElementById('planModal').classList.remove('show');
    }
  </script>
</body>
</html>
