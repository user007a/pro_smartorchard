<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智慧果园 - 任务导航</title>
<link rel="stylesheet" href="css/mobile-design-system.css">
<style>
body {
  margin: 0;
  padding: 0;
  font-family: var(--font-family);
  background: var(--bg);
}
.page-header {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  padding: var(--space-5) var(--space-4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.header-title {
  color: var(--bg-white);
  font-size: var(--font-lg);
  font-weight: 700;
}
.header-back {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
}
.map-container {
  height: 400px;
  background: linear-gradient(135deg, var(--primary-50) 0%, var(--primary-100) 100%);
  position: relative;
}
.map-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.map-icon {
  width: 80px;
  height: 80px;
  margin-bottom: var(--space-5);
}
.map-text {
  font-size: var(--font-base);
  color: var(--text-secondary);
}
.route-info {
  background: var(--bg-white);
  padding: var(--space-5);
  margin: var(--space-4);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}
.route-title {
  font-size: var(--font-base);
  font-weight: 600;
  color: var(--text);
  margin-bottom: var(--space-4);
}
.route-stats {
  display: flex;
  justify-content: space-around;
}
.stat-item {
  text-align: center;
}
.stat-value {
  font-size: var(--font-xl);
  font-weight: 700;
  color: var(--primary);
}
.stat-label {
  font-size: var(--font-xs);
  color: var(--text-secondary);
  margin-top: var(--space-1);
}
.current-task {
  background: var(--bg-white);
  padding: var(--space-5);
  margin: var(--space-4);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}
.task-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--space-4);
}
.task-title {
  font-size: var(--font-base);
  font-weight: 600;
  color: var(--text);
}
.task-status {
  padding: var(--space-1) var(--space-4);
  border-radius: var(--radius-lg);
  font-size: var(--font-xs);
  background: var(--success-bg);
  color: var(--success);
}
.task-info {
  display: flex;
  gap: var(--space-5);
  margin-bottom: var(--space-4);
}
.info-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.info-icon {
  width: 16px;
  height: 16px;
  color: var(--primary);
}
.info-text {
  font-size: var(--font-sm);
  color: var(--text-secondary);
}
.btn-primary {
  width: 100%;
  padding: var(--space-4);
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: var(--bg-white);
  border: none;
  border-radius: var(--radius-md);
  font-size: var(--font-base);
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-fast);
}
.btn-primary:hover {
  background: linear-gradient(135deg, var(--primary-dark), var(--primary-700));
}
.other-tasks {
  background: var(--bg-white);
  padding: var(--space-5);
  margin: var(--space-4);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}
.section-title {
  font-size: var(--font-base);
  font-weight: 600;
  color: var(--text);
  margin-bottom: var(--space-4);
}
.task-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
.task-item {
  padding: var(--space-4);
  background: var(--bg);
  border-radius: var(--radius-md);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.task-name {
  font-size: var(--font-sm);
  color: var(--text);
}
.task-meta {
  font-size: var(--font-xs);
  color: var(--text-secondary);
}
.task-arrow {
  width: 20px;
  height: 20px;
  color: var(--gray-400);
}
.footer-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-white);
  padding: var(--space-4);
  display: flex;
  justify-content: space-around;
  box-shadow: var(--shadow-md);
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-1);
}
.nav-icon {
  width: 24px;
  height: 24px;
}
.nav-text {
  font-size: var(--font-xs);
  color: var(--text-secondary);
}
.nav-item.active .nav-text {
  color: var(--primary-500);
}
</style>
</head>
<body>
<!-- 顶部导航 -->
<header class="page-header">
  <button class="header-back">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--text-inverse);">
      <path d="M19 12H5"/>
      <path d="M12 19l-7-7 7-7"/>
    </svg>
  </button>
  <div class="header-title">任务导航</div>
  <button class="header-back">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--text-inverse);">
      <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
    </svg>
  </button>
</header>

<!-- 地图区域 -->
<div class="map-container">
  <div class="map-placeholder"><iframe src="https://www.openstreetmap.org/export/embed.html?bbox=106.05%2C34.20%2C106.30%2C34.50&layer=mapnik&marker=34.35%2C106.18" style="width:100%;height:100%;border:0;" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="天水市麦积区 红崖村花牛苹果基地地图"></iframe></div>
</div>

<!-- 路线信息 -->
<div class="route-info">
  <div class="route-title">到A1区的路线</div>
  <div class="route-stats">
    <div class="stat-item">
      <div class="stat-value">850</div>
      <div class="stat-label">米</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">12</div>
      <div class="stat-label">分钟</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">步行</div>
      <div class="stat-label">方式</div>
    </div>
  </div>
</div>

<!-- 当前任务 -->
<div class="current-task">
  <div class="task-header">
    <div class="task-title">当前任务</div>
    <div class="task-status">进行中</div>
  </div>
  <div class="task-info">
    <div class="info-item">
      <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 09-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
        <path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <span class="info-text">A1区</span>
    </div>
    <div class="info-item">
      <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12a9 9 0 09-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 09-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.09-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
      </svg>
      <span class="info-text">春季施肥</span>
    </div>
  </div>
  <button class="btn-primary">开始导航</button>
</div>

<!-- 其他任务 -->
<div class="other-tasks">
  <div class="section-title">待完成任务</div>
  <div class="task-list">
    <div class="task-item">
      <div>
        <div class="task-name">病虫害防治</div>
        <div class="task-meta">A2区 · 今天 14:00</div>
      </div>
      <svg class="task-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 5l7 7-7 7"/>
      </svg>
    </div>
    <div class="task-item">
      <div>
        <div class="task-name">果树修剪</div>
        <div class="task-meta">B1区 · 今天 16:00</div>
      </div>
      <svg class="task-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 5l7 7-7 7"/>
      </svg>
    </div>
    <div class="task-item">
      <div>
        <div class="task-name">浇水灌溉</div>
        <div class="task-meta">B2区 · 明天 08:00</div>
      </div>
      <svg class="task-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 5l7 7-7 7"/>
      </svg>
    </div>
  </div>
</div>

<!-- 底部导航 -->
<div class="footer-nav">
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--gray-400);">
      <path d="M3 9l9-7 9 7v11a2 2 0 09-2 2H5a2 2 0 09-2-2V9z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    <span class="nav-text">首页</span>
  </div>
  <div class="nav-item active">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--primary-500);">
      <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
      <line x1="9" y1="3" x2="9" y2="18"/>
      <line x1="15" y1="6" x2="15" y2="21"/>
    </svg>
    <span class="nav-text">导航</span>
  </div>
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--gray-400);">
      <circle cx="12" cy="12" r="10"/>
      <path d="M8 15s1.5-2 4-2 4 2 4 2"/>
      <circle cx="9" cy="9" r="1"/>
      <circle cx="15" cy="9" r="1"/>
    </svg>
    <span class="nav-text">AI助手</span>
  </div>
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--gray-400);">
      <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    <span class="nav-text">我的</span>
  </div>
</div>
</body>
</html>
