<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 问专家</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <!-- 移动端共享数据层 -->
  <script src="js/mobile-store.js"></script>
  <script src="js/mobile-data.js"></script>
  <style>
    /* Content */
    .content { padding: var(--space-4); padding-bottom: 80px; }
    
    /* Card */
    .card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      margin-bottom: var(--space-4);
      padding: var(--space-4);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    
    .card-title {
      font-size: var(--font-md);
      font-weight: 600;
      color: var(--text);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    
    .card-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background: var(--primary);
      border-radius: 2px;
    }
    
    /* Expert Card */
    .expert-card {
      display: flex;
      gap: var(--space-3);
      padding: var(--space-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-3);
      box-shadow: var(--shadow-xs);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .expert-card:active { transform: scale(0.98); }
    
    .expert-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .expert-avatar svg { width: 32px; height: 32px; color: var(--primary); }
    
    .expert-info { flex: 1; min-width: 0; }
    
    .expert-name { font-size: var(--font-base); font-weight: 600; color: var(--text); margin-bottom: 4px; }
    
    .expert-title { font-size: var(--font-xs); color: var(--text-secondary); margin-bottom: var(--space-2); }
    
    .expert-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    
    .expert-tag {
      padding: 3px 10px;
      background: var(--gray-100);
      border-radius: var(--radius-full);
      font-size: var(--font-xs);
      color: var(--text-secondary);
    }
    
    /* Question Item */
    .question-item {
      padding: var(--space-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-3);
      box-shadow: var(--shadow-xs);
    }
    
    .question-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-2);
    }
    
    .question-title { font-size: var(--font-sm); font-weight: 600; color: var(--text); }
    
    .question-status {
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: var(--font-xs);
      font-weight: 500;
    }
    
    .question-status.pending { background: var(--warning-bg); color: var(--warning); }
    .question-status.answered { background: var(--success-bg); color: var(--success); }
    
    .question-content {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: var(--space-2);
    }
    
    .answer-box {
      padding: var(--space-3);
      background: var(--info-bg);
      border-radius: var(--radius-md);
    }
    
    .answer-title { font-size: var(--font-xs); font-weight: 600; color: var(--info); margin-bottom: 6px; }
    
    .answer-content { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.5; }
    
    /* Float Button */
    .float-btn {
      position: fixed;
      bottom: 80px;
      right: var(--space-5);
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(46, 158, 90, 0.4);
      z-index: 50;
      transition: all var(--transition-fast);
    }
    
    .float-btn:active { transform: scale(0.95); }
    .float-btn svg { width: 28px; height: 28px; color: var(--bg-white); }
    
    /* Modal: 已迁移到统一弹窗组件 .mb-modal-overlay / .mb-modal */
    .modal-title {
      font-size: var(--font-lg);
      font-weight: 600;
      text-align: center;
      margin-bottom: var(--space-5);
      color: var(--text);
    }
    
    .form-group { margin-bottom: var(--space-4); }
    
    .form-label {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: var(--space-2);
      display: block;
    }
    
    .form-input {
      width: 100%;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0 var(--space-3);
      font-size: var(--font-base);
      color: var(--text);
      background: var(--bg-white);
      transition: all var(--transition-fast);
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }
    
    .form-textarea {
      width: 100%;
      min-height: 120px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      font-size: var(--font-base);
      color: var(--text);
      resize: vertical;
      transition: all var(--transition-fast);
    }
    
    .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }
    
    .btn-row {
      display: flex;
      gap: var(--space-3);
      margin-top: var(--space-5);
    }
    
    .btn {
      flex: 1;
      height: 44px;
      border-radius: var(--radius-full);
      font-size: var(--font-base);
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all var(--transition-fast);
    }
    
    .btn:active { transform: scale(0.98); }
    
    .btn-outline {
      border: 1px solid var(--border);
      background: var(--bg-white);
      color: var(--text);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: var(--bg-white);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div class="header-content">
        <div class="header-title">专家咨询</div>
        <div class="header-sub">向农业专家提问咨询</div>
      </div>
    </div>
    
    <div class="content">
      <div class="card">
        <div class="card-title">推荐专家</div>
        <div id="expertList"></div>
      </div>

      <div class="card">
        <div class="card-title">我的提问</div>
        <div id="myQuestionList"></div>
      </div>
    </div>

    <div class="float-btn" onclick="openAskModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </div>

    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <div class="mb-modal-overlay" id="askModal">
    <div class="mb-modal">
      <div class="modal-title">发起提问</div>
      <div class="form-group">
        <label class="form-label">问题标题</label>
        <input type="text" class="form-input" id="questionTitle" maxlength="40" placeholder="请输入问题标题">
      </div>
      <div class="form-group">
        <label class="form-label">问题描述</label>
        <textarea class="form-textarea" id="questionDesc" maxlength="500" placeholder="请详细描述您的问题..."></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="closeAskModal()">取消</button>
        <button class="btn btn-primary" onclick="submitQuestion()">提交</button>
      </div>
    </div>
  </div>

  <script>
    var MD = window.MobileData;
    var EXPERT_ROWS = [];

    function navigateTo(page) {
      window.location.href = page;
    }

    function goBack() {
      window.history.back();
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function pad2(n) { return n < 10 ? '0' + n : String(n); }

    function nowText() {
      var d = new Date();
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
        ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    }

    function currentOperator() {
      var u = MD && typeof MD.user === 'function' ? MD.user() : null;
      return {
        name: (u && (u.realName || u.account)) || '',
        id: (u && u.id) || ''
      };
    }

    function loadExperts() {
      if (!MD || typeof MD.rows !== 'function') { renderExperts(); return; }
      var run = function () {
        MD.rows('enterprise_expert').then(function (rows) {
          EXPERT_ROWS = rows || [];
          renderExperts();
        });
      };
      if (MD.ready && MD.ready.then) MD.ready.then(run); else run();
    }

    function renderExperts() {
      var box = document.getElementById('expertList');
      if (!box) return;
      var rows = EXPERT_ROWS.length ? EXPERT_ROWS : (MD ? MD.list('enterprise_expert') : []);
      if (!rows.length) {
        box.innerHTML = MD ? MD.inlineEmpty('暂无专家信息') : '';
        return;
      }
      var list = rows.slice().sort(function (a, b) {
        return (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0);
      });
      box.innerHTML = list.map(function (e) {
        var title = [e.role, e.org].filter(Boolean).join(' · ');
        var tags = String(e.description || '').split(/[\/、,，;；]/).map(function (t) {
          return t.trim();
        }).filter(Boolean).slice(0, 4);
        return '<div class="expert-card">' +
          '<div class="expert-avatar">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>' +
            '</svg>' +
          '</div>' +
          '<div class="expert-info">' +
            '<div class="expert-name">' + esc(e.name) + '</div>' +
            (title ? '<div class="expert-title">' + esc(title) + '</div>' : '') +
            (tags.length ? '<div class="expert-tags">' + tags.map(function (t) {
              return '<span class="expert-tag">' + esc(t) + '</span>';
            }).join('') + '</div>' : '') +
          '</div>' +
        '</div>';
      }).join('');
    }

    function expertNameById(id) {
      if (!MD || id == null) return '';
      var staff = MD.list('mb_staff_account');
      for (var i = 0; i < staff.length; i++) {
        if (String(staff[i].id) === String(id)) {
          return staff[i].real_name || staff[i].account || '';
        }
      }
      return '';
    }

    function renderQuestions() {
      var box = document.getElementById('myQuestionList');
      if (!box) return;
      var u = MD && typeof MD.user === 'function' ? MD.user() : null;
      var meName = (u && u.realName) || '';
      var meAccount = (u && u.account) || '';
      if (!meName && !meAccount) {
        box.innerHTML = MD ? MD.inlineEmpty('未获取到登录用户信息') : '';
        return;
      }
      var rows = MD ? MD.list('mb_expert_consult') : [];
      var mine = rows.filter(function (q) {
        var who = String(q.questioner || '');
        return who && (who === meName || who === meAccount);
      }).sort(function (a, b) {
        return String(b.question_time || '').localeCompare(String(a.question_time || ''));
      });
      if (!mine.length) {
        box.innerHTML = MD ? MD.inlineEmpty('暂无提问记录') : '';
        return;
      }
      box.innerHTML = mine.map(function (q) {
        var answered = q.status === 'replied' && !!q.expert_reply;
        var answerHtml = answered
          ? '<div class="answer-box">' +
              '<div class="answer-title">' + esc(expertNameById(q.expert_id) || '专家') + ' 回复' +
              (q.reply_time ? ' · ' + esc(MD.dateTimeText(q.reply_time)) : '') + '</div>' +
              '<div class="answer-content">' + esc(q.expert_reply) + '</div>' +
            '</div>'
          : '';
        return '<div class="question-item">' +
          '<div class="question-header">' +
          '<div class="question-title">' + esc(q.title) + '</div>' +
          '<span class="question-status ' + (answered ? 'answered' : 'pending') + '">' +
            (answered ? '已回复' : '待回复') + '</span>' +
          '</div>' +
          '<div class="question-content">' + esc(q.content) + '</div>' +
          answerHtml +
          '<div style="font-size:var(--font-xs);color:var(--text-light);">' + esc(MD.dateText(q.question_time)) + '</div>' +
          '</div>';
      }).join('');
    }

    function openAskModal() {
      document.getElementById('questionTitle').value = '';
      document.getElementById('questionDesc').value = '';
      document.getElementById('askModal').classList.add('show');
    }

    function closeAskModal() {
      document.getElementById('askModal').classList.remove('show');
    }

    function submitQuestion() {
      var title = document.getElementById('questionTitle').value.trim();
      var desc = document.getElementById('questionDesc').value.trim();

      if (!title) { MobileStore.toast('请输入问题标题', 'warning'); return; }
      if (title.length < 2) { MobileStore.toast('问题标题至少 2 个字', 'warning'); return; }
      if (!desc) { MobileStore.toast('请输入问题描述', 'warning'); return; }
      if (desc.length < 5) { MobileStore.toast('问题描述至少 5 个字', 'warning'); return; }

      var me = currentOperator();
      if (!me.name) { MobileStore.toast('未获取到登录用户信息', 'error'); return; }
      if (!window.Api || typeof Api.create !== 'function') {
        MobileStore.toast('数据服务未就绪，请稍后重试', 'error');
        return;
      }

      Api.create('mb_expert_consult', {
        title: title,
        content: desc,
        questioner: me.name,
        question_time: nowText(),
        status: 'pending',
        source: 'mobile',
        operator: me.name
      }).then(function (res) {
        if (!res || !res.ok) {
          MobileStore.toast((res && res.message) || '提问提交失败', 'error');
          return;
        }
        closeAskModal();
        MobileStore.toast('提问已提交，专家将尽快回复', 'success');
        if (MD) MD.reload('mb_expert_consult').then(renderQuestions);
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      renderExperts();
      renderQuestions();
      loadExperts();
      if (MD && typeof MD.subscribe === 'function') {
        MD.subscribe(function () {
          renderExperts();
          renderQuestions();
        });
      }
    });
  </script>
</body>
</html>
