<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 问专家</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="../applefarm_backhand/css/design-system.css">
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <style>
    /* Header */
    .page-header {
      position: relative;
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
      padding: 44px var(--space-4) var(--space-3);
      color: var(--bg-white);
    }
    
    .header-back {
      position: absolute;
      left: var(--space-3);
      top: 44px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .header-back svg { width: 18px; height: 18px; }
    
    .header-content { padding-left: var(--space-5); }
    
    .header-title { font-size: var(--font-xl); font-weight: 700; }
    
    .header-sub { font-size: var(--font-sm); opacity: 0.85; margin-top: 4px; }
    
    /* Content */
    .content { padding: var(--space-4); padding-bottom: 80px; }
    
    /* Card */
    .card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      margin-bottom: var(--space-4);
      padding: var(--space-4);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    
    .card-title {
      font-size: var(--font-md);
      font-weight: 600;
      color: var(--text);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    
    .card-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background: var(--primary);
      border-radius: 2px;
    }
    
    /* Expert Card */
    .expert-card {
      display: flex;
      gap: var(--space-3);
      padding: var(--space-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-3);
      box-shadow: var(--shadow-xs);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .expert-card:active { transform: scale(0.98); }
    
    .expert-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .expert-avatar svg { width: 32px; height: 32px; color: var(--primary); }
    
    .expert-info { flex: 1; min-width: 0; }
    
    .expert-name { font-size: var(--font-base); font-weight: 600; color: var(--text); margin-bottom: 4px; }
    
    .expert-title { font-size: var(--font-xs); color: var(--text-secondary); margin-bottom: var(--space-2); }
    
    .expert-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    
    .expert-tag {
      padding: 3px 10px;
      background: var(--gray-100);
      border-radius: var(--radius-full);
      font-size: var(--font-xs);
      color: var(--text-secondary);
    }
    
    /* Question Item */
    .question-item {
      padding: var(--space-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-3);
      box-shadow: var(--shadow-xs);
    }
    
    .question-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-2);
    }
    
    .question-title { font-size: var(--font-sm); font-weight: 600; color: var(--text); }
    
    .question-status {
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: var(--font-xs);
      font-weight: 500;
    }
    
    .question-status.pending { background: var(--orange-bg); color: var(--orange); }
    .question-status.answered { background: var(--success-bg); color: var(--success); }
    
    .question-content {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: var(--space-2);
    }
    
    .answer-box {
      padding: var(--space-3);
      background: var(--info-bg);
      border-radius: var(--radius-md);
    }
    
    .answer-title { font-size: var(--font-xs); font-weight: 600; color: var(--info); margin-bottom: 6px; }
    
    .answer-content { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.5; }
    
    /* Float Button */
    .float-btn {
      position: fixed;
      bottom: 80px;
      right: var(--space-5);
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(46, 158, 90, 0.4);
      z-index: 50;
      transition: all var(--transition-fast);
    }
    
    .float-btn:active { transform: scale(0.95); }
    .float-btn svg { width: 28px; height: 28px; color: var(--bg-white); }
    
    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
    }
    
    .modal-overlay.show { display: flex; }
    
    .modal-box {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: var(--space-6) var(--space-5);
      width: 90%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }
    
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .modal-title {
      font-size: var(--font-lg);
      font-weight: 600;
      text-align: center;
      margin-bottom: var(--space-5);
      color: var(--text);
    }
    
    .form-group { margin-bottom: var(--space-4); }
    
    .form-label {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: var(--space-2);
      display: block;
    }
    
    .form-input {
      width: 100%;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0 var(--space-3);
      font-size: var(--font-base);
      color: var(--text);
      background: var(--bg-white);
      transition: all var(--transition-fast);
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }
    
    .form-textarea {
      width: 100%;
      min-height: 120px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      font-size: var(--font-base);
      color: var(--text);
      resize: vertical;
      transition: all var(--transition-fast);
    }
    
    .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }
    
    .btn-row {
      display: flex;
      gap: var(--space-3);
      margin-top: var(--space-5);
    }
    
    .btn {
      flex: 1;
      height: 44px;
      border-radius: var(--radius-full);
      font-size: var(--font-base);
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all var(--transition-fast);
    }
    
    .btn:active { transform: scale(0.98); }
    
    .btn-outline {
      border: 1px solid var(--border);
      background: var(--bg-white);
      color: var(--text);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: var(--bg-white);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div class="header-content">
        <div class="header-title">专家咨询</div>
        <div class="header-sub">向农业专家提问咨询</div>
      </div>
    </div>
    
    <div class="content">
      <div class="card">
        <div class="card-title">推荐专家</div>
        <div class="expert-card">
          <div class="expert-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div class="expert-info">
            <div class="expert-name">王教授</div>
            <div class="expert-title">农业大学果树学教授</div>
            <div class="expert-tags">
              <span class="expert-tag">苹果栽培</span>
              <span class="expert-tag">病虫害防治</span>
              <span class="expert-tag">施肥管理</span>
            </div>
          </div>
        </div>

        <div class="expert-card">
          <div class="expert-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div class="expert-info">
            <div class="expert-name">李农艺师</div>
            <div class="expert-title">资深苹果种植专家</div>
            <div class="expert-tags">
              <span class="expert-tag">物候期管理</span>
              <span class="expert-tag">水肥一体化</span>
              <span class="expert-tag">采收技术</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">我的提问</div>
        <div class="question-item">
          <div class="question-header">
            <div class="question-title">苹果树叶片发黄怎么办？</div>
            <span class="question-status answered">已回复</span>
          </div>
          <div class="question-content">最近发现部分苹果树叶片开始发黄，主要是老叶，新叶还好，请问是什么原因？</div>
          <div class="answer-box">
            <div class="answer-title">王教授 回复</div>
            <div class="answer-content">根据描述，老叶发黄可能是缺氮或镁元素。建议：1. 检查土壤肥力情况；2. 适量追施复合肥；3. 叶面喷施镁肥。同时注意排水，避免根系积水。</div>
          </div>
        </div>

        <div class="question-item">
          <div class="question-header">
            <div class="question-title">今年什么时候套袋合适？</div>
            <span class="question-status pending">待回复</span>
          </div>
          <div class="question-content">想咨询一下今年苹果套袋的最佳时间，谢谢！</div>
        </div>
      </div>
    </div>

    <div class="float-btn" onclick="openAskModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </div>

    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="askModal">
    <div class="modal-box">
      <div class="modal-title">发起提问</div>
      <div class="form-group">
        <label class="form-label">问题标题</label>
        <input type="text" class="form-input" placeholder="请输入问题标题">
      </div>
      <div class="form-group">
        <label class="form-label">问题描述</label>
        <textarea class="form-textarea" placeholder="请详细描述您的问题..."></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="closeAskModal()">取消</button>
        <button class="btn btn-primary" onclick="submitQuestion()">提交</button>
      </div>
    </div>
  </div>

  <script>
    function navigateTo(page) {
      window.location.href = page;
    }

    function goBack() {
      window.history.back();
    }

    function openAskModal() {
      document.getElementById('askModal').classList.add('show');
    }

    function closeAskModal() {
      document.getElementById('askModal').classList.remove('show');
    }

    function submitQuestion() {
      alert('提问提交成功！');
      closeAskModal();
    }
  </script>
</body>
</html>
