<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 领标签</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <style>
    /* 基础重置已由设计系统提供 */
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; overflow: hidden; padding-bottom: 66px; }
    
    .content { padding: 16px; padding-bottom: 80px; }
    .card { background: var(--bg-white); border-radius: var(--radius-lg); margin-bottom: var(--space-4); padding: var(--space-4); box-shadow: var(--shadow-card); border: 1px solid var(--border); }
    .card-title { font-size: var(--font-md); font-weight: 600; color: var(--text); margin-bottom: 14px; }
    .label-item { display: flex; gap: var(--space-3); padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: var(--space-3); }
    .label-icon { width: 56px; height: 56px; border-radius: var(--radius-md); background: var(--primary-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .label-icon svg { width: 32px; height: 32px; color: var(--primary); }
    .label-info { flex: 1; min-width: 0; }
    .label-name { font-size: var(--font-md); font-weight: 600; color: var(--text); margin-bottom: var(--space-1); }
    .label-desc { font-size: var(--font-sm); color: var(--text-secondary); margin-bottom: var(--space-2); }
    .label-meta { display: flex; justify-content: space-between; align-items: center; }
    .label-stock { font-size: var(--font-sm); color: var(--text-light); }
    .btn { height: 36px; padding: 0 var(--space-4); border-radius: var(--radius-full); font-size: var(--font-sm); font-weight: 600; cursor: pointer; border: none; transition: all var(--transition-fast); }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: var(--bg-white); }
    .btn-outline { border: 1px solid var(--border); background: var(--bg-white); color: var(--text); }
    .record-item { padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: var(--space-3); }
    .record-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-2); }
    .record-name { font-size: var(--font-base); font-weight: 600; color: var(--text); }
    .record-status { padding: var(--space-1) 10px; border-radius: var(--radius-md); font-size: var(--font-sm); font-weight: 500; }
    .record-status.pending { background: var(--warning-bg); color: var(--warning); }
    .record-status.approved { background: var(--primary-light); color: var(--primary); }
    .record-info { font-size: var(--font-sm); color: var(--text-secondary); display: flex; justify-content: space-between; }
    .modal-title { font-size: var(--font-md); font-weight: 600; text-align: center; margin-bottom: var(--space-5); }
    .form-group { margin-bottom: var(--space-4); }
    .form-label { font-size: var(--font-sm); color: var(--text-secondary); margin-bottom: var(--space-2); display: block; }
    .form-input { width: 100%; height: 48px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0 14px; font-size: var(--font-base); color: var(--text); background: var(--bg-white); }
    .form-select { width: 100%; height: 48px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0 14px; font-size: var(--font-base); color: var(--text); background: var(--bg-white); }
    .btn-row { display: flex; gap: var(--space-3); margin-top: var(--space-5); }
    .btn-row .btn { flex: 1; height: 48px; border-radius: var(--radius-full); font-size: var(--font-md); }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div style="padding-left: var(--space-10);">
        <div class="header-title">标签领用</div>
        <div class="header-sub">申请领取溯源标签</div>
      </div>
    </div>
    
    <div class="content">
      <div class="card">
        <div class="card-title">可领取标签</div>
        <div id="labelList"></div>
      </div>

      <div class="card">
        <div class="card-title">领用记录</div>
        <div id="recordList"></div>
      </div>
    </div>

    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <div class="mb-modal-overlay" id="labelModal">
    <div class="mb-modal">
      <div class="modal-title">标签申请</div>
      <div class="form-group">
        <label class="form-label">标签类型</label>
        <input type="text" class="form-input" id="labelName" readonly>
      </div>
      <div class="form-group">
        <label class="form-label">可用库存</label>
        <input type="text" class="form-input" id="labelStockView" readonly>
      </div>
      <div class="form-group">
        <label class="form-label">领用数量</label>
        <input type="number" class="form-input" id="labelQty" min="1" placeholder="请输入数量">
      </div>
      <div class="form-group">
        <label class="form-label">使用地块</label>
        <select class="form-select" id="labelPlot"></select>
      </div>
      <div class="form-group">
        <label class="form-label">备注</label>
        <input type="text" class="form-input" id="labelRemark" placeholder="备注信息（选填）">
      </div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="closeLabelModal()">取消</button>
        <button class="btn btn-primary" onclick="submitLabel()">提交</button>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
     * 标签领用 —— 库存与后台「溯源编码 - 打印标签」共用同一份数据
     * 存储键：smartorchard_label_stock / smartorchard_label_records
     * ============================================================ */

    const STOCK_KEY = 'smartorchard_label_stock';
    const RECORD_KEY = 'smartorchard_label_records';

    // 标签类型基础信息（库存由本地存储维护）
    const LABEL_TYPES = [
      { id: 'LB-A', name: '花牛苹果专用标签（双层纸袋型）', desc: '双层纸袋，防水防虫', stock: 12500 },
      { id: 'LB-B', name: '花牛苹果专用标签（透气膜袋型）', desc: '透气膜袋，早熟品种适用', stock: 8200 },
      { id: 'LB-C', name: '秦冠专用标签', desc: '三色可选，中熟品种', stock: 6800 }
    ];

    // 地块（与企业管理 - 地块管理一致）
    const PLOT_OPTIONS = ['D-001 · 东区1号地','D-002 · 东区2号地','D-003 · 西区1号地','D-004 · 北区1号地','D-005 · 南区1号地',
      'D-006 · 中区1号地','D-007 · 南区2号地','D-008 · 西区2号地','D-009 · 北区2号地','D-010 · 东区3号地'];

    const DEFAULT_RECORDS = [
      { name: '花牛苹果专用标签（双层纸袋型）', qty: 2000, time: '2026-09-21 08:30', plot: 'D-001 · 东区1号地', status: 'approved' },
      { name: '花牛苹果专用标签（双层纸袋型）', qty: 1500, time: '2026-09-20 10:15', plot: 'D-002 · 东区2号地', status: 'approved' },
      { name: '秦冠专用标签', qty: 1000, time: '2026-09-21 11:45', plot: 'D-012 · 西区3号地', status: 'pending' },
      { name: '花牛苹果专用标签（透气膜袋型）', qty: 3000, time: '2026-09-18 14:20', plot: 'D-003 · 西区1号地', status: 'approved' }
    ];

    function readStock() {
      try {
        const raw = localStorage.getItem(STOCK_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { /* 忽略 */ }
      const init = {};
      LABEL_TYPES.forEach(t => { init[t.name] = t.stock; });
      return init;
    }

    function readRecords() {
      try {
        const raw = localStorage.getItem(RECORD_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { /* 忽略 */ }
      return DEFAULT_RECORDS.slice();
    }

    function persist(stock, records) {
      try {
        localStorage.setItem(STOCK_KEY, JSON.stringify(stock));
        localStorage.setItem(RECORD_KEY, JSON.stringify(records));
      } catch (e) { /* 忽略 */ }
    }

    function renderLabels() {
      const stock = readStock();
      document.getElementById('labelList').innerHTML = LABEL_TYPES.map(t => {
        const left = stock[t.name] != null ? stock[t.name] : t.stock;
        return `
          <div class="label-item">
            <div class="label-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                <path d="M7 7h.01"/>
              </svg>
            </div>
            <div class="label-info">
              <div class="label-name">${t.name}</div>
              <div class="label-desc">${t.desc}</div>
              <div class="label-meta">
                <span class="label-stock">库存：${left}张</span>
                <button class="btn btn-primary" ${left <= 0 ? 'disabled style="opacity:.5;cursor:not-allowed;"' : ''}
                  onclick="openLabelModal('${t.name}')">${left <= 0 ? '无库存' : '申请'}</button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function renderRecords() {
      const records = readRecords();
      const box = document.getElementById('recordList');
      if (!records.length) {
        box.innerHTML = '<div style="text-align:center;color:var(--text-light);font-size:var(--font-sm);padding:12px;">暂无领用记录</div>';
        return;
      }
      box.innerHTML = records.map(r => `
        <div class="record-item">
          <div class="record-header">
            <div class="record-name">${r.name}</div>
            <span class="record-status ${r.status === 'approved' ? 'approved' : 'pending'}">${r.status === 'approved' ? '已审批' : '审批中'}</span>
          </div>
          <div class="record-info">
            <span>数量：${r.qty}张</span>
            <span>${r.time}</span>
          </div>
          <div style="font-size:var(--font-sm);color:var(--text-light);margin-top:var(--space-2);">
            用途：${r.plot} 套袋 · ${r.status === 'approved' ? '审批人：王经理' : '待审批'}
          </div>
        </div>`).join('');
    }

    function refresh() {
      renderLabels();
      renderRecords();
    }

    function navigateTo(page) { window.location.href = page; }
    function goBack() { window.history.back(); }

    function openLabelModal(name) {
      const stock = readStock();
      const left = stock[name] != null ? stock[name] : 0;
      document.getElementById('labelName').value = name;
      document.getElementById('labelStockView').value = left + ' 张';
      document.getElementById('labelQty').value = '';
      document.getElementById('labelRemark').value = '';

      const plotSelect = document.getElementById('labelPlot');
      plotSelect.innerHTML = '<option value="">请选择地块</option>' +
        PLOT_OPTIONS.map(p => `<option value="${p}">${p}</option>`).join('');

      document.getElementById('labelModal').classList.add('show');
      document.getElementById('labelModal').dataset.labelName = name;
    }

    function closeLabelModal() {
      document.getElementById('labelModal').classList.remove('show');
    }

    function submitLabel() {
      const name = document.getElementById('labelModal').dataset.labelName || document.getElementById('labelName').value;
      const qty = Number(document.getElementById('labelQty').value);
      const plot = document.getElementById('labelPlot').value;
      const remark = document.getElementById('labelRemark').value.trim();

      const stock = readStock();
      const left = stock[name] != null ? stock[name] : 0;

      if (!qty || qty < 1) { alert('请输入领用数量'); return; }
      if (qty > left) { alert(`库存不足，当前可领取 ${left} 张`); return; }
      if (!plot) { alert('请选择使用地块'); return; }

      stock[name] = left - qty;
      const records = readRecords();
      const now = new Date();
      const p = n => String(n).padStart(2, '0');
      records.unshift({
        name: name,
        qty: qty,
        time: `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}`,
        plot: plot,
        status: 'pending',
        remark: remark
      });
      persist(stock, records);

      closeLabelModal();
      refresh();
      alert(`申请已提交：${name} ${qty} 张（剩余库存 ${stock[name]} 张），后台打印标签时按此库存扣减。`);
    }

    document.addEventListener('DOMContentLoaded', refresh);
  </script>
</body>
</html>
