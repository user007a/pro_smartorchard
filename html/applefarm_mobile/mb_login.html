<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 登录</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="../applefarm_backhand/css/design-system.css">
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <style>
    body {
      font-family: var(--font-family);
      min-height: 100vh;
      background: url('https://images.unsplash.com/photo-1511732765119-d46091b24bfa?w=1200&h=2000&fit=crop') center/cover no-repeat;
      overflow-x: hidden;
      position: relative;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(26, 138, 60, 0.7) 0%, rgba(34, 168, 74, 0.6) 30%, rgba(46, 198, 100, 0.5) 70%, rgba(76, 214, 140, 0.4) 100%);
      z-index: 0;
    }
    
    .bg-decor {
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      pointer-events: none; 
      z-index: 0; 
      overflow: hidden;
    }
    
    .bg-circle {
      position: absolute; 
      border-radius: 50%; 
      background: rgba(255,255,255,0.08);
    }
    
    .bg-circle-1 { 
      width: 320px; 
      height: 320px; 
      top: -80px; 
      right: -100px;
      animation: float 6s ease-in-out infinite;
    }
    
    .bg-circle-2 { 
      width: 220px; 
      height: 220px; 
      bottom: 150px; 
      left: -80px; 
      background: rgba(255,255,255,0.05);
      animation: float 8s ease-in-out infinite reverse;
    }
    
    .bg-circle-3 { 
      width: 160px; 
      height: 160px; 
      top: 50%; 
      right: 20%; 
      background: rgba(255,255,255,0.06);
      animation: float 5s ease-in-out infinite;
    }
    
    .bg-grid {
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-15px) scale(1.05); }
    }
    
    .container {
      position: relative; 
      z-index: 1;
      display: flex; 
      flex-direction: column; 
      align-items: center;
      min-height: 100vh; 
      padding: 70px 7.5% 40px;
    }
    
    .header { 
      text-align: center; 
      margin-bottom: 40px; 
      animation: slideDown 0.5s ease;
    }
    
    .logo-wrap {
      width: 80px; 
      height: 80px; 
      margin: 0 auto 20px;
      background: rgba(255,255,255,0.98); 
      border-radius: 24px;
      display: flex; 
      align-items: center; 
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      transition: transform var(--transition-normal);
    }
    
    .logo-wrap:hover {
      transform: scale(1.05);
    }
    
    .logo-wrap svg,
    .logo-wrap img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    
    .sys-name {
      font-size: var(--font-size-xl); 
      font-weight: var(--font-weight-bold); 
      color: #fff;
      letter-spacing: 2px; 
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    
    .sys-sub { 
      font-size: var(--font-size-sm); 
      color: rgba(255,255,255,0.8); 
      letter-spacing: 3px;
    }
    
    .login-card {
      width: 100%; 
      background: #fff; 
      border-radius: var(--radius-xl);
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      padding: 28px 24px; 
      overflow: hidden;
      animation: slideUp 0.5s ease 0.1s both;
    }
    
    .tab-bar {
      display: flex; 
      background: var(--gray-50); 
      border-radius: var(--radius-full);
      padding: 4px; 
      margin-bottom: 28px; 
      position: relative;
    }
    
    .tab-item {
      flex: 1; 
      text-align: center; 
      padding: 10px 0;
      font-size: var(--font-size-sm); 
      color: var(--text-light); 
      cursor: pointer;
      border-radius: var(--radius-full); 
      transition: all var(--transition-normal);
      position: relative; 
      z-index: 1; 
      user-select: none;
      font-weight: var(--font-weight-medium);
    }
    
    .tab-item.active { 
      color: #fff; 
      font-weight: var(--font-weight-semibold); 
    }
    
    .tab-slider {
      position: absolute; 
      top: 4px; 
      left: 4px;
      width: calc(50% - 3px); 
      height: calc(100% - 8px);
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      border-radius: var(--radius-full); 
      transition: transform var(--transition-normal);
      z-index: 0;
      box-shadow: 0 2px 8px rgba(34, 168, 74, 0.3);
    }
    
    .tab-slider[data-index="1"] { transform: translateX(100%); }
    
    .tab-panels { 
      position: relative; 
      overflow: hidden; 
    }
    
    .tab-panel {
      display: none; 
      animation: fadeSlideIn 0.3s ease;
    }
    
    .tab-panel.active { display: block; }
    
    @keyframes fadeSlideIn {
      from { 
        opacity: 0; 
        transform: translateX(20px); 
      }
      to { 
        opacity: 1; 
        transform: translateX(0); 
      }
    }
    
    .input-group {
      position: relative; 
      margin-bottom: 18px;
    }
    
    .input-group .input-icon {
      position: absolute; 
      left: 16px; 
      top: 50%; 
      transform: translateY(-50%);
      width: 22px; 
      height: 22px; 
      color: var(--gray-400);
      transition: color var(--transition-fast);
    }
    
    .input-group input {
      width: 100%; 
      height: 48px; 
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg); 
      padding: 0 16px 0 48px;
      font-size: var(--font-size-md); 
      color: var(--text-primary); 
      outline: none;
      transition: all var(--transition-fast);
      background: #fff;
    }
    
    .input-group input::placeholder { 
      color: var(--gray-400); 
    }
    
    .input-group input:focus { 
      border-color: var(--primary-500); 
      background: #fff;
      box-shadow: 0 0 0 3px rgba(34, 168, 74, 0.1);
    }
    
    .input-group input:focus + .input-icon {
      color: var(--primary-500);
    }
    
    .input-group .toggle-pwd {
      position: absolute; 
      right: 16px; 
      top: 50%; 
      transform: translateY(-50%);
      width: 22px; 
      height: 22px; 
      cursor: pointer; 
      color: var(--gray-400);
      transition: color var(--transition-fast);
    }
    
    .input-group .toggle-pwd:hover { 
      color: var(--primary-500); 
    }
    
    .input-group .error-msg {
      display: none; 
      font-size: var(--font-size-xs); 
      color: var(--error);
      margin-top: 6px; 
      padding-left: 6px;
    }
    
    .input-group.has-error input { 
      border-color: var(--error); 
    }
    
    .input-group.has-error .error-msg { 
      display: block; 
    }
    
    .input-group.has-error .input-icon {
      color: var(--error);
    }
    
    .code-row { 
      display: flex; 
      gap: 12px; 
      margin-bottom: 18px !important;
    }
    
    .code-row .input-group { 
      flex: 1; 
      margin-bottom: 0; 
    }
    
    .code-row input { 
      padding-right: 16px; 
    }
    
    .btn-get-code {
      flex-shrink: 0; 
      height: 48px; 
      padding: 0 18px;
      border: 2px solid var(--primary-500); 
      border-radius: var(--radius-lg);
      background: transparent; 
      color: var(--primary-500); 
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      cursor: pointer; 
      white-space: nowrap; 
      transition: all var(--transition-fast);
    }
    
    .btn-get-code:hover:not(:disabled) {
      background: var(--primary-50);
    }
    
    .btn-get-code:active:not(:disabled) {
      transform: scale(0.98);
    }
    
    .btn-get-code:disabled { 
      border-color: var(--gray-300); 
      color: var(--gray-400); 
      cursor: not-allowed; 
    }
    
    .form-extra {
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      margin-bottom: 24px; 
      font-size: var(--font-size-sm);
    }
    
    .remember-me {
      display: flex; 
      align-items: center; 
      gap: 8px; 
      cursor: pointer; 
      color: var(--text-secondary);
      user-select: none;
    }
    
    .remember-me input[type="checkbox"] { 
      display: none; 
    }
    
    .checkbox-custom {
      width: 18px; 
      height: 18px; 
      border: 2px solid var(--gray-300);
      border-radius: var(--radius-sm); 
      display: flex; 
      align-items: center; 
      justify-content: center;
      transition: all var(--transition-fast);
    }
    
    .remember-me input:checked + .checkbox-custom {
      background: var(--primary-500); 
      border-color: var(--primary-500);
    }
    
    .checkbox-custom svg { 
      width: 11px; 
      height: 11px; 
      color: #fff; 
      opacity: 0; 
      transition: opacity var(--transition-fast); 
    }
    
    .remember-me input:checked + .checkbox-custom svg { 
      opacity: 1; 
    }
    
    .forgot-pwd { 
      color: var(--primary-500); 
      text-decoration: none;
      font-weight: var(--font-weight-medium);
    }
    
    .forgot-pwd:hover {
      text-decoration: underline;
    }
    
    .btn-login {
      width: 100%; 
      height: 50px; 
      border: none; 
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: #fff; 
      font-size: var(--font-size-md); 
      font-weight: var(--font-weight-semibold);
      letter-spacing: 4px; 
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative; 
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(34, 168, 74, 0.35);
    }
    
    .btn-login:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
      box-shadow: 0 6px 20px rgba(34, 168, 74, 0.45);
      transform: translateY(-1px);
    }
    
    .btn-login:active { 
      transform: scale(0.98); 
    }
    
    .btn-login:disabled { 
      opacity: 0.6; 
      cursor: not-allowed; 
      box-shadow: none;
    }
    
    .btn-login .spinner {
      display: none; 
      width: 22px; 
      height: 22px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; 
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      position: absolute; 
      top: 50%; 
      left: 50%;
      margin: -11px 0 0 -11px;
    }
    
    .btn-login.loading .btn-text { 
      opacity: 0; 
    }
    
    .btn-login.loading .spinner { 
      display: block; 
    }
    
    @keyframes spin { 
      to { 
        transform: rotate(360deg); 
      } 
    }
    
    .wechat-panel { 
      text-align: center; 
      padding: 24px 0 14px; 
    }
    
    .wechat-icon-wrap {
      width: 90px; 
      height: 90px; 
      margin: 0 auto 20px;
      background: var(--success-bg); 
      border-radius: 50%;
      display: flex; 
      align-items: center; 
      justify-content: center;
      box-shadow: 0 8px 20px rgba(82, 196, 26, 0.2);
      transition: transform var(--transition-normal);
    }
    
    .wechat-icon-wrap:hover {
      transform: scale(1.05);
    }
    
    .wechat-icon-wrap svg { 
      width: 52px; 
      height: 52px; 
    }
    
    .wechat-desc { 
      font-size: var(--font-size-md); 
      color: var(--text-secondary); 
      margin-bottom: 32px; 
    }
    
    .btn-wechat {
      width: 100%; 
      height: 50px; 
      border: none; 
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, #07c160, #06ad56);
      color: #fff; 
      font-size: var(--font-size-md); 
      font-weight: var(--font-weight-semibold);
      letter-spacing: 2px; 
      cursor: pointer; 
      position: relative; 
      overflow: hidden;
      transition: all var(--transition-fast);
      box-shadow: 0 4px 14px rgba(7, 193, 96, 0.35);
    }
    
    .btn-wechat:hover:not(:disabled) {
      background: linear-gradient(135deg, #06ad56, #059a4d);
      box-shadow: 0 6px 20px rgba(7, 193, 96, 0.45);
      transform: translateY(-1px);
    }
    
    .btn-wechat:active { 
      transform: scale(0.98); 
    }
    
    .btn-wechat:disabled { 
      opacity: 0.6; 
      cursor: not-allowed; 
      box-shadow: none;
    }
    
    .btn-wechat .spinner {
      display: none; 
      width: 22px; 
      height: 22px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; 
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      position: absolute; 
      top: 50%; 
      left: 50%;
      margin: -11px 0 0 -11px;
    }
    
    .btn-wechat.loading .btn-text { 
      opacity: 0; 
    }
    
    .btn-wechat.loading .spinner { 
      display: block; 
    }
    
    .wechat-tip { 
      font-size: var(--font-size-xs); 
      color: var(--text-light); 
      margin-top: 16px; 
    }
    
    .agreement {
      text-align: center; 
      font-size: var(--font-size-xs); 
      color: rgba(255,255,255,0.7);
      margin-top: 32px; 
      line-height: 1.6;
    }
    
    .agreement a { 
      color: #fff; 
      text-decoration: underline;
    }
    
    .agreement a:hover {
      opacity: 0.8;
    }
    
    .success-overlay {
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background: rgba(0,0,0,0.5); 
      z-index: 1000;
      justify-content: center; 
      align-items: center;
      backdrop-filter: blur(4px);
    }
    
    .success-overlay.show { 
      display: flex; 
      animation: fadeIn 0.3s ease;
    }
    
    .success-modal {
      background: #fff; 
      border-radius: var(--radius-xl); 
      padding: 40px 36px;
      text-align: center; 
      width: 280px;
      animation: scaleIn 0.4s ease;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
    }
    
    @keyframes scaleIn {
      from { 
        opacity: 0; 
        transform: scale(0.85); 
      }
      to { 
        opacity: 1; 
        transform: scale(1); 
      }
    }
    
    .success-icon {
      width: 64px; 
      height: 64px; 
      margin: 0 auto 20px;
      background: var(--success-bg); 
      border-radius: 50%;
      display: flex; 
      align-items: center; 
      justify-content: center;
      box-shadow: 0 4px 16px rgba(82, 196, 26, 0.2);
    }
    
    .success-icon svg { 
      width: 36px; 
      height: 36px; 
      color: var(--success); 
    }
    
    .success-title { 
      font-size: var(--font-size-xl); 
      font-weight: var(--font-weight-bold); 
      color: var(--text-primary); 
      margin-bottom: 10px; 
    }
    
    .success-countdown { 
      font-size: var(--font-size-sm); 
      color: var(--text-light); 
    }
    
    /* 登录失败提示 */
    .error-toast {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 16px 24px;
      border-radius: var(--radius-lg);
      font-size: var(--font-size-sm);
      z-index: 1001;
      animation: fadeIn 0.2s ease;
    }
    
    .error-toast.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="bg-decor">
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>
    <div class="bg-grid"></div>
  </div>
  
  <div class="container">
    <div class="header">
      <div class="logo-wrap">
        <img src="../common/images/brand_logo.png" alt="智慧果园logo">
      </div>
      <div class="sys-name">智慧果园</div>
      <div class="sys-sub">数字赋能 · 智慧管理</div>
    </div>
    
    <div class="login-card">
      <div class="tab-bar" id="tabBar">
        <div class="tab-slider" data-index="0" id="tabSlider"></div>
        <div class="tab-item active" data-tab="0">密码登录</div>
        <div class="tab-item" data-tab="1">微信登录</div>
      </div>
      
      <div class="tab-panels">
        <!-- 密码登录 -->
        <div class="tab-panel active" id="panel0">
          <div class="input-group" id="usernameGroup">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
            <div class="error-msg" id="usernameError">请输入用户名</div>
          </div>
          
          <div class="input-group" id="passwordGroup">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
            <svg class="toggle-pwd" id="togglePwd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <div class="error-msg" id="passwordError">请输入密码</div>
          </div>
          
          <div class="form-extra">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe">
              <span class="checkbox-custom">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
              记住密码
            </label>
            <a href="javascript:void(0)" class="forgot-pwd">忘记密码</a>
          </div>
          
          <button class="btn-login" id="btnLogin" type="button">
            <span class="btn-text">登 录</span>
            <span class="spinner"></span>
          </button>
        </div>
        
        <!-- 微信登录 -->
        <div class="tab-panel" id="panel1">
          <div class="wechat-panel">
            <div class="wechat-icon-wrap">
              <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M32.5 18.5C32.5 12.149 26.234 7 18.5 7C10.766 7 4.5 12.149 4.5 18.5C4.5 22.14 6.56 25.41 9.78 27.6L8.3 31.9L13.2 29.5C14.88 30.12 16.64 30.47 18.5 30.47C18.84 30.47 19.17 30.46 19.5 30.43C19.17 29.5 19 28.52 19 27.5C19 22.53 23.03 18.5 28 18.5C29.58 18.5 31.07 18.88 32.39 19.55C32.46 19.2 32.5 18.85 32.5 18.5Z" fill="#07c160"/>
                <path d="M43.5 27.5C43.5 22.81 38.35 19 32 19C25.65 19 20.5 22.81 20.5 27.5C20.5 32.19 25.65 36 32 36C33.44 36 34.82 35.78 36.08 35.38L40 37.5L38.78 34C41.1 32.28 43.5 30.04 43.5 27.5Z" fill="#07c160"/>
                <circle cx="14" cy="17" r="1.5" fill="#fff"/>
                <circle cx="23" cy="17" r="1.5" fill="#fff"/>
                <circle cx="28" cy="26.5" r="1.3" fill="#fff"/>
                <circle cx="36" cy="26.5" r="1.3" fill="#fff"/>
              </svg>
            </div>
            <div class="wechat-desc">使用微信账号快速登录</div>
            <button class="btn-wechat" id="btnWechat" type="button">
              <span class="btn-text">微信一键登录</span>
              <span class="spinner"></span>
            </button>
            <div class="wechat-tip">首次登录将自动创建账号</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="agreement">
      登录即代表同意<a href="javascript:void(0)">《用户协议》</a>和<a href="javascript:void(0)">《隐私政策》</a>
    </div>
  </div>
  
  <!-- 登录成功弹窗 -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-modal">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="success-title">登录成功</div>
      <div class="success-countdown" id="successCountdown">2秒后自动跳转...</div>
    </div>
  </div>
  
  <!-- 错误提示 -->
  <div class="error-toast" id="errorToast">登录失败，请重试</div>

  <script>
    (function checkLogin() {
      if (sessionStorage.getItem('isLoggedIn')) {
        window.location.href = 'mb_home.html';
      }
    })();
    
    (function restoreRemembered() {
      var saved = localStorage.getItem('rememberedUser');
      if (saved) {
        document.getElementById('username').value = saved;
        document.getElementById('rememberMe').checked = true;
      }
    })();
    
    var tabs = document.querySelectorAll('.tab-item');
    var slider = document.getElementById('tabSlider');
    var panels = document.querySelectorAll('.tab-panel');
    
    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        var idx = parseInt(this.getAttribute('data-tab'));
        tabs.forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
        slider.setAttribute('data-index', idx);
        panels.forEach(function(p) { p.classList.remove('active'); });
        document.getElementById('panel' + idx).classList.add('active');
        clearErrors();
      });
    });
    
    var togglePwd = document.getElementById('togglePwd');
    var pwdInput = document.getElementById('password');
    var pwdVisible = false;
    
    togglePwd.addEventListener('click', function() {
      pwdVisible = !pwdVisible;
      pwdInput.type = pwdVisible ? 'text' : 'password';
      if (pwdVisible) {
        this.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        this.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    });
    
    function setError(groupId, errorId, msg) {
      var group = document.getElementById(groupId);
      var errorEl = document.getElementById(errorId);
      group.classList.add('has-error');
      if (msg) errorEl.textContent = msg;
    }
    
    function clearError(groupId) {
      var group = document.getElementById(groupId);
      group.classList.remove('has-error');
    }
    
    function clearErrors() {
      document.querySelectorAll('.input-group').forEach(function(g) {
        g.classList.remove('has-error');
      });
    }
    
    function showErrorToast(msg) {
      var toast = document.getElementById('errorToast');
      toast.textContent = msg || '操作失败，请重试';
      toast.classList.add('show');
      setTimeout(function() {
        toast.classList.remove('show');
      }, 2000);
    }
    
    document.getElementById('btnLogin').addEventListener('click', function() {
      clearErrors();
      var user = document.getElementById('username').value.trim();
      var pass = document.getElementById('password').value.trim();
      var valid = true;
      
      if (!user) {
        setError('usernameGroup', 'usernameError', '请输入用户名');
        valid = false;
      }
      if (!pass) {
        setError('passwordGroup', 'passwordError', '请输入密码');
        valid = false;
      }
      
      if (!valid) return;
      
      if (document.getElementById('rememberMe').checked) {
        localStorage.setItem('rememberedUser', user);
      } else {
        localStorage.removeItem('rememberedUser');
      }
      
      doLogin(this, user);
    });
    
    document.getElementById('btnWechat').addEventListener('click', function() {
      doLogin(this, '微信用户');
    });
    
    function doLogin(btn, username) {
      btn.classList.add('loading');
      btn.disabled = true;
      
      setTimeout(function() {
        btn.classList.remove('loading');
        btn.disabled = false;
        
        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('loginUser', username);
        
        var overlay = document.getElementById('successOverlay');
        overlay.classList.add('show');
        
        var countdown = 2;
        document.getElementById('successCountdown').textContent = countdown + '秒后自动跳转...';
        
        var timer = setInterval(function() {
          countdown--;
          if (countdown <= 0) {
            clearInterval(timer);
            window.location.href = 'mb_home.html';
          } else {
            document.getElementById('successCountdown').textContent = countdown + '秒后自动跳转...';
          }
        }, 1000);
      }, 1200);
    }
    
    document.getElementById('username').addEventListener('input', function() {
      clearError('usernameGroup');
    });
    
    document.getElementById('password').addEventListener('input', function() {
      clearError('passwordGroup');
    });
  </script>
</body>
</html>
