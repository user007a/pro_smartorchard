<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 登录</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <!-- 统一 API 层（含登录鉴权 + 严格空库模式 localStorage 闸门） -->
  <script src="../common/js/api.js"></script>
  <style>
    body {
      font-family: var(--font-family);
      min-height: 100vh;
      background: url('../common/images/orchard_bg.jpg') center/cover no-repeat;
      overflow-x: hidden;
      position: relative;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(26, 138, 60, 0.7) 0%, rgba(34, 168, 74, 0.6) 30%, rgba(46, 198, 100, 0.5) 70%, rgba(76, 214, 140, 0.4) 100%);
      z-index: 0;
    }
    
    .bg-decor {
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      pointer-events: none; 
      z-index: 0; 
      overflow: hidden;
    }
    
    .bg-circle {
      position: absolute; 
      border-radius: 50%; 
      background: rgba(255,255,255,0.08);
    }
    
    .bg-circle-1 { 
      width: 320px; 
      height: 320px; 
      top: -80px; 
      right: -100px;
      animation: float 6s ease-in-out infinite;
    }
    
    .bg-circle-2 { 
      width: 220px; 
      height: 220px; 
      bottom: 150px; 
      left: -80px; 
      background: rgba(255,255,255,0.05);
      animation: float 8s ease-in-out infinite reverse;
    }
    
    .bg-circle-3 { 
      width: 160px; 
      height: 160px; 
      top: 50%; 
      right: 20%; 
      background: rgba(255,255,255,0.06);
      animation: float 5s ease-in-out infinite;
    }
    
    .bg-grid {
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-15px) scale(1.05); }
    }
    
    .container {
      position: relative; 
      z-index: 1;
      display: flex; 
      flex-direction: column; 
      align-items: center;
      justify-content: center;
      min-height: 100vh; 
      padding: calc(env(safe-area-inset-top, 0px) + 24px) 7.5% 32px;
    }
    
    .header { 
      text-align: center; 
      margin-bottom: 40px; 
      animation: slideDown 0.5s ease;
    }
    
    .logo-wrap {
      width: 80px; 
      height: 80px; 
      margin: 0 auto 20px;
      background: rgba(255,255,255,0.98); 
      border-radius: 24px;
      display: flex; 
      align-items: center; 
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      transition: transform var(--transition-normal);
    }
    
    .logo-wrap:hover {
      transform: scale(1.05);
    }
    
    .logo-wrap svg,
    .logo-wrap img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    
    .sys-name {
      font-size: var(--font-2xl);
      font-weight: var(--font-bold);
      color: #fff;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    
    .sys-sub { 
      font-size: var(--font-base); 
      color: rgba(255,255,255,0.8); 
      letter-spacing: 3px;
    }
    
    .login-card {
      width: 100%; 
      background: #fff; 
      border-radius: var(--radius-xl);
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      padding: 28px 24px; 
      overflow: hidden;
      animation: slideUp 0.5s ease 0.1s both;
    }
    
    .login-tabs {
      display: flex; 
      background: var(--gray-50); 
      border-radius: var(--radius-full);
      padding: 4px; 
      margin-bottom: 28px; 
      position: relative;
    }
    
    .login-tabs .tab-item {
      flex: 1; 
      text-align: center; 
      padding: 10px 0;
      font-size: var(--font-base); 
      color: var(--gray-600); 
      cursor: pointer;
      border-radius: var(--radius-full); 
      transition: all var(--transition-normal);
      position: relative; 
      z-index: 1; 
      user-select: none;
      font-weight: var(--font-medium);
    }
    
    .login-tabs .tab-item.active { 
      color: #fff; 
      font-weight: var(--font-semibold); 
    }
    
    .tab-slider {
      position: absolute; 
      top: 4px; 
      left: 4px;
      width: calc(50% - 3px); 
      height: calc(100% - 8px);
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      border-radius: var(--radius-full); 
      transition: transform var(--transition-normal);
      z-index: 0;
      box-shadow: 0 2px 8px rgba(34, 168, 74, 0.3);
    }
    
    .tab-slider[data-index="1"] { transform: translateX(100%); }
    
    .tab-panels { 
      position: relative; 
      overflow: hidden; 
      min-height: 320px;
    }
    
    .tab-panel {
      display: none; 
      animation: fadeSlideIn 0.3s ease;
    }
    
    .tab-panel.active { display: block; }
    
    @keyframes fadeSlideIn {
      from { 
        opacity: 0; 
        transform: translateX(20px); 
      }
      to { 
        opacity: 1; 
        transform: translateX(0); 
      }
    }
    
    .input-group {
      position: relative; 
      margin-bottom: 18px;
    }
    
    .input-group .input-icon {
      position: absolute; 
      left: 16px; 
      top: 50%; 
      transform: translateY(-50%);
      width: 22px; 
      height: 22px; 
      color: var(--gray-400);
      transition: color var(--transition-fast);
    }
    
    .input-group input {
      width: 100%; 
      height: 48px; 
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg); 
      padding: 0 16px 0 48px;
      font-size: var(--font-md); 
      color: var(--text); 
      outline: none;
      transition: all var(--transition-fast);
      background: #fff;
    }
    
    .input-group input::placeholder { 
      color: var(--gray-400); 
    }
    
    .input-group input:focus { 
      border-color: var(--primary-500); 
      background: #fff;
      box-shadow: 0 0 0 3px rgba(34, 168, 74, 0.1);
    }
    
    .input-group input:focus + .input-icon {
      color: var(--primary-500);
    }
    
    .input-group .toggle-pwd {
      position: absolute; 
      right: 16px; 
      top: 50%; 
      transform: translateY(-50%);
      width: 22px; 
      height: 22px; 
      cursor: pointer; 
      color: var(--gray-400);
      transition: color var(--transition-fast);
    }
    
    .input-group .toggle-pwd:hover { 
      color: var(--primary-500); 
    }
    
    .input-group .error-msg {
      display: none; 
      font-size: var(--font-sm); 
      color: var(--error);
      margin-top: 6px; 
      padding-left: 6px;
    }
    
    .input-group.has-error input { 
      border-color: var(--error); 
    }
    
    .input-group.has-error .error-msg { 
      display: block; 
    }
    
    .input-group.has-error .input-icon {
      color: var(--error);
    }
    
    .code-row { 
      display: flex; 
      gap: 12px; 
      margin-bottom: 18px !important;
    }
    
    .code-row .input-group { 
      flex: 1; 
      margin-bottom: 0; 
    }
    
    .code-row input { 
      padding-right: 16px; 
    }
    
    .btn-get-code {
      flex-shrink: 0; 
      height: 48px; 
      padding: 0 18px;
      border: 2px solid var(--primary-500); 
      border-radius: var(--radius-lg);
      background: transparent; 
      color: var(--primary-500); 
      font-size: var(--font-base);
      font-weight: var(--font-semibold);
      cursor: pointer; 
      white-space: nowrap; 
      transition: all var(--transition-fast);
    }
    
    .btn-get-code:hover:not(:disabled) {
      background: var(--primary-50);
    }
    
    .btn-get-code:active:not(:disabled) {
      transform: scale(0.98);
    }
    
    .btn-get-code:disabled { 
      border-color: var(--gray-300); 
      color: var(--gray-400); 
      cursor: not-allowed; 
    }
    
    .form-extra {
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      margin-bottom: 24px; 
      font-size: var(--font-base);
    }
    
    .remember-me {
      display: flex; 
      align-items: center; 
      gap: 8px; 
      cursor: pointer; 
      color: var(--text-secondary);
      user-select: none;
    }
    
    .remember-me input[type="checkbox"] { 
      display: none; 
    }
    
    .checkbox-custom {
      width: 18px; 
      height: 18px; 
      border: 2px solid var(--gray-300);
      border-radius: var(--radius-sm); 
      display: flex; 
      align-items: center; 
      justify-content: center;
      transition: all var(--transition-fast);
    }
    
    .remember-me input:checked + .checkbox-custom {
      background: var(--primary-500); 
      border-color: var(--primary-500);
    }
    
    .checkbox-custom svg { 
      width: 11px; 
      height: 11px; 
      color: #fff; 
      opacity: 0; 
      transition: opacity var(--transition-fast); 
    }
    
    .remember-me input:checked + .checkbox-custom svg { 
      opacity: 1; 
    }
    
    .forgot-pwd { 
      color: var(--primary-500); 
      text-decoration: none;
      font-weight: var(--font-medium);
    }
    
    .forgot-pwd:hover {
      text-decoration: underline;
    }
    
    .btn-login {
      width: 100%; 
      height: 50px; 
      border: none; 
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: #fff; 
      font-size: var(--font-md); 
      font-weight: var(--font-semibold);
      letter-spacing: 4px; 
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative; 
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(34, 168, 74, 0.35);
    }
    
    .btn-login:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
      box-shadow: 0 6px 20px rgba(34, 168, 74, 0.45);
      transform: translateY(-1px);
    }
    
    .btn-login:active { 
      transform: scale(0.98); 
    }
    
    .btn-login:disabled { 
      opacity: 0.6; 
      cursor: not-allowed; 
      box-shadow: none;
    }
    
    .wechat-panel { 
      text-align: center; 
      padding: 24px 0 14px; 
    }
    
    .wechat-icon-wrap {
      width: 90px; 
      height: 90px; 
      margin: 0 auto 20px;
      background: rgba(7, 193, 96, 0.1); 
      border-radius: 50%;
      display: flex; 
      align-items: center; 
      justify-content: center;
      box-shadow: 0 8px 20px rgba(7, 193, 96, 0.2);
      transition: transform var(--transition-normal);
    }
    
    .wechat-icon-wrap:hover {
      transform: scale(1.05);
    }
    
    .wechat-icon-wrap svg { 
      width: 52px; 
      height: 52px; 
    }
    
    .wechat-desc { 
      font-size: var(--font-md); 
      color: var(--text-secondary); 
      margin-bottom: 32px; 
    }
    
    .btn-wechat {
      width: 100%; 
      height: 50px; 
      border: none; 
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, #07c160, #06ad56);
      color: #fff; 
      font-size: var(--font-md); 
      font-weight: var(--font-semibold);
      letter-spacing: 2px; 
      cursor: pointer; 
      position: relative; 
      overflow: hidden;
      transition: all var(--transition-fast);
      box-shadow: 0 4px 14px rgba(7, 193, 96, 0.35);
    }
    
    .btn-wechat:hover:not(:disabled) {
      background: linear-gradient(135deg, #06ad56, #059a4d);
      box-shadow: 0 6px 20px rgba(7, 193, 96, 0.45);
      transform: translateY(-1px);
    }
    
    .btn-wechat:active { 
      transform: scale(0.98); 
    }
    
    .btn-wechat:disabled { 
      opacity: 0.6; 
      cursor: not-allowed; 
      box-shadow: none;
    }
    
    .wechat-tip { 
      font-size: var(--font-sm); 
      color: var(--text-light); 
      margin-top: 16px; 
    }
    
    .agreement {
      text-align: center; 
      font-size: var(--font-sm); 
      color: rgba(255,255,255,0.85);
      margin-top: 20px; 
      line-height: 1.6;
    }
    
    .agreement a { 
      color: #fff; 
      text-decoration: underline;
    }
    
    .agreement a:hover {
      opacity: 0.8;
    }

    /* 登录失败提示 */
    .error-toast {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 16px 24px;
      border-radius: var(--radius-lg);
      font-size: var(--font-base);
      z-index: 1001;
      animation: fadeIn 0.2s ease;
    }
    
    .error-toast.show {
      display: block;
    }

    .copyright {
      font-size: var(--font-sm);
      color: rgba(255,255,255,0.7);
      margin-top: 16px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.45);
    }

    .demo-hint {
      margin-top: 12px;
      text-align: center;
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="bg-decor">
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>
    <div class="bg-grid"></div>
  </div>
  
  <div class="container">
    <div class="header">
      <div class="logo-wrap">
        <img src="../common/images/brand_logo.png" alt="智慧果园logo">
      </div>
      <div class="sys-name">智慧果园</div>
      <div class="sys-sub">数字赋能 · 智慧管理</div>
    </div>
    
    <div class="login-card">
      <div class="login-tabs" id="tabBar">
        <div class="tab-slider" data-index="0" id="tabSlider"></div>
        <div class="tab-item active" data-tab="0">密码登录</div>
        <div class="tab-item" data-tab="1">微信登录</div>
      </div>
      
      <div class="tab-panels">
        <!-- 密码登录 -->
        <div class="tab-panel active" id="panel0">
          <div class="input-group" id="usernameGroup">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
            <div class="error-msg" id="usernameError">请输入用户名</div>
          </div>
          
          <div class="input-group" id="passwordGroup">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
            <svg class="toggle-pwd" id="togglePwd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <div class="error-msg" id="passwordError">请输入密码</div>
          </div>
          
          <div class="form-extra">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe">
              <span class="checkbox-custom">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
              记住密码
            </label>
            <a href="javascript:void(0)" class="forgot-pwd" onclick="openInfoModal('forgot');return false;">忘记密码</a>
          </div>
          
          <button class="btn-login" id="btnLogin" type="button">
            <span class="btn-text">登 录</span>
          </button>
          <div class="demo-hint">账号由基地管理员在后台「移动端运营 › 用户服务」中开通</div>
        </div>
        
        <!-- 微信登录 -->
        <div class="tab-panel" id="panel1">
          <div class="wechat-panel">
            <div class="wechat-icon-wrap">
              <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M32.5 18.5C32.5 12.149 26.234 7 18.5 7C10.766 7 4.5 12.149 4.5 18.5C4.5 22.14 6.56 25.41 9.78 27.6L8.3 31.9L13.2 29.5C14.88 30.12 16.64 30.47 18.5 30.47C18.84 30.47 19.17 30.46 19.5 30.43C19.17 29.5 19 28.52 19 27.5C19 22.53 23.03 18.5 28 18.5C29.58 18.5 31.07 18.88 32.39 19.55C32.46 19.2 32.5 18.85 32.5 18.5Z" fill="#07c160"/>
                <path d="M43.5 27.5C43.5 22.81 38.35 19 32 19C25.65 19 20.5 22.81 20.5 27.5C20.5 32.19 25.65 36 32 36C33.44 36 34.82 35.78 36.08 35.38L40 37.5L38.78 34C41.1 32.28 43.5 30.04 43.5 27.5Z" fill="#07c160"/>
                <circle cx="14" cy="17" r="1.5" fill="#fff"/>
                <circle cx="23" cy="17" r="1.5" fill="#fff"/>
                <circle cx="28" cy="26.5" r="1.3" fill="#fff"/>
                <circle cx="36" cy="26.5" r="1.3" fill="#fff"/>
              </svg>
            </div>
            <div class="wechat-desc">使用微信账号快速登录</div>
            <button class="btn-wechat" id="btnWechat" type="button">
              <span class="btn-text">微信一键登录</span>
            </button>
            <div class="wechat-tip">首次登录将自动创建账号</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="agreement">
      登录即代表同意<a href="javascript:void(0)" onclick="openInfoModal('terms');return false;">《用户协议》</a>和<a href="javascript:void(0)" onclick="openInfoModal('privacy');return false;">《隐私政策》</a>
    </div>

    <div class="copyright">© 2026 湖南数字农业科技有限公司 All Rights Reserved</div>
  </div>
  
  <!-- 错误提示 -->
  <div class="error-toast" id="errorToast">登录失败，请重试</div>

  <!-- 忘记密码 / 用户协议 / 隐私政策（此前为 href="javascript:void(0)" 空链接） -->
  <div class="mb-modal-overlay" id="infoOverlay">
    <div class="mb-modal">
      <div class="mb-modal-title" id="infoTitle">用户协议</div>
      <div class="mb-modal-body" id="infoBody"
           style="max-height:52vh;overflow-y:auto;font-size:13px;line-height:1.9;color:var(--text-secondary);white-space:pre-wrap;"></div>
      <div class="mb-modal-actions">
        <button type="button" class="mb-btn mb-btn-block" id="infoConfirm">我知道了</button>
      </div>
    </div>
  </div>

  <!-- 微信授权确认（真实走一次授权确认，而非静默登录） -->
  <div class="mb-modal-overlay" id="wxOverlay">
    <div class="mb-modal is-sm">
      <div class="mb-modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2"/>
          <path d="M12 18h.01"/>
        </svg>
      </div>
      <div class="mb-modal-title">微信授权</div>
      <div class="mb-modal-body">“智慧果园”申请获取你的昵称与头像，用于创建并登录账号。</div>
      <div class="mb-modal-actions">
        <button class="mb-btn mb-btn-secondary" type="button" id="wxCancel">取消</button>
        <button class="mb-btn mb-btn-primary" type="button" id="wxAgree">同意授权</button>
      </div>
    </div>
  </div>

  <script>
    (function checkLogin() {
      // 严格空库模式：以 Api.isLoggedIn()（即持有后端 token）判断是否已登录
      if (typeof window.Api !== 'undefined' && window.Api.isLoggedIn && window.Api.isLoggedIn()) {
        window.location.href = 'mb_home.html';
      }
    })();

    /* ------------------------------------------------------------
     * 严格空库模式：账号凭据由服务端校验并颁发 JWT 令牌，
     * 不再本地比对 SHA-256，也不再内置演示账号库。
     * ------------------------------------------------------------ */
    function touchLastLogin(username) {
      /* 登录成功后回写最近登录时间由服务端在 mobile-login 内更新 last_login_at，
         前端无需再写本地账号表。 */
    }
    var MAX_ATTEMPTS = 5;
    var LOCK_MS = 30000;
    var failCount = 0;
    var lockUntil = 0;

    // 严格空库模式：密码不再本地落盘，仅记住用户名；删除密码混淆编解码
    (function restoreRemembered() {
      var saved = localStorage.getItem('rememberedUser');
      if (saved) {
        document.getElementById('username').value = saved;
        document.getElementById('rememberMe').checked = true;
      }
    })();
    
    var tabs = document.querySelectorAll('.tab-item');
    var slider = document.getElementById('tabSlider');
    var panels = document.querySelectorAll('.tab-panel');
    
    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        var idx = parseInt(this.getAttribute('data-tab'));
        tabs.forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
        slider.setAttribute('data-index', idx);
        panels.forEach(function(p) { p.classList.remove('active'); });
        document.getElementById('panel' + idx).classList.add('active');
        clearErrors();
      });
    });
    
    var togglePwd = document.getElementById('togglePwd');
    var pwdInput = document.getElementById('password');
    var pwdVisible = false;
    
    togglePwd.addEventListener('click', function() {
      pwdVisible = !pwdVisible;
      pwdInput.type = pwdVisible ? 'text' : 'password';
      if (pwdVisible) {
        this.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.09-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        this.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    });
    
    function setError(groupId, errorId, msg) {
      var group = document.getElementById(groupId);
      var errorEl = document.getElementById(errorId);
      group.classList.add('has-error');
      if (msg) errorEl.textContent = msg;
    }
    
    function clearError(groupId) {
      var group = document.getElementById(groupId);
      group.classList.remove('has-error');
    }
    
    function clearErrors() {
      document.querySelectorAll('.input-group').forEach(function(g) {
        g.classList.remove('has-error');
      });
    }
    
    /* ---------- 忘记密码 / 用户协议 / 隐私政策（替代空链接） ---------- */
    var INFO_TEXTS = {
      forgot: {
        title: '忘记密码',
        body: '本系统的账号密码由企业管理员在后台统一维护。\n\n如需重置密码，请通过以下方式申请：\n\n' +
              '1. 联系本基地管理员，在 PC 管理后台「系统管理 → 系统设置 → 用户管理」中为你重置密码；\n' +
              '2. 或拨打企业服务热线，由管理员在后台「用户管理」中重置后告知你；\n' +
              '3. 新密码初始为 admin123，首次登录后请及时修改。\n\n' +
              '注意：连续 5 次输入错误将锁定账号 30 分钟，请确认账号无误后再输入。'
      },
      terms: {
        title: '用户协议',
        body: '一、服务范围\n' +
              '“智慧果园”移动作业端（以下简称“本应用”）为企业内部果园生产管理工具，向经企业授权的作业人员提供地块信息、巡园打卡、农事记录、农资领用、设备报修等作业功能。\n\n' +
              '二、账号与权限\n' +
              '账号由企业管理员统一分配与授权，不得出借、转让或共享。账号权限按岗位角色划分，作业人员仅可查看与本人权限范围内的地块与数据。\n\n' +
              '三、数据真实性\n' +
              '通过本应用提交的农事记录、巡园打卡、农资领用等数据将作为生产档案与追溯依据，作业人员应确保录入内容真实、准确、完整，并按实际情况上传照片凭证。\n\n' +
              '四、保密义务\n' +
              '作业人员应对本应用内展示的经营数据、订单信息、客户资料及未公开的种植数据承担保密义务，不得私自复制、外传或用于本系统之外的用途。\n\n' +
              '五、违约处理\n' +
              '违反本协议造成数据失真或信息泄露的，企业将暂停其账号使用，并按相关制度追究责任。\n\n' +
              '六、协议生效\n' +
              '点击“登录”即视为你已阅读并同意本协议。'
      },
      privacy: {
        title: '隐私政策',
        body: '一、我们收集的信息\n' +
              '· 账号信息：登录账号、姓名、岗位与所属基地（由企业管理员提供）\n' +
              '· 作业信息：农事记录、巡园打卡位置与时间、农资领用记录、设备报修记录及你上传的照片凭证\n' +
              '· 设备信息：设备型号、操作系统版本、网络状态（用于问题排查与兼容性适配）\n\n' +
              '二、信息的使用\n' +
              '上述信息仅用于果园生产管理、作业记录追溯、农资库存核算与设备运维，不用于与上述目的无关的商业用途。\n\n' +
              '三、信息的存储与保护\n' +
              '数据存储于企业自有服务器，与其他业务数据隔离；数据传输采用加密通道。作业人员账号密码由企业统一管理，企业不得擅自导出或向第三方提供。\n\n' +
              '四、位置信息的说明\n' +
              '巡园打卡、异常上报等场景会调用定位能力，用于校验是否到达指定地块。该位置数据随作业记录保存，作为到岗与作业凭证。\n\n' +
              '五、你的权利\n' +
              '你有权通过企业管理员查询、更正或删除与你相关的个人与作业数据；注销账号请联系企业管理员办理。\n\n' +
              '六、联系我们\n' +
              '如对本政策有任何疑问，请联系本企业系统管理员。'
      }
    };
    function openInfoModal(kind) {
      var cfg = INFO_TEXTS[kind];
      if (!cfg) return;
      document.getElementById('infoTitle').textContent = cfg.title;
      document.getElementById('infoBody').textContent = cfg.body;
      document.getElementById('infoOverlay').classList.add('show');
    }
    function closeInfoModal() {
      document.getElementById('infoOverlay').classList.remove('show');
    }
    document.getElementById('infoConfirm').addEventListener('click', closeInfoModal);
    document.getElementById('infoOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeInfoModal();
    });

    function showErrorToast(msg) {
      var toast = document.getElementById('errorToast');
      toast.textContent = msg || '操作失败，请重试';
      toast.classList.add('show');
      setTimeout(function() {
        toast.classList.remove('show');
      }, 2000);
    }
    
    document.getElementById('btnLogin').addEventListener('click', function() {
      clearErrors();
      if (Date.now() < lockUntil) {
        showErrorToast('尝试次数过多，请 ' + Math.ceil((lockUntil - Date.now()) / 1000) + ' 秒后再试');
        return;
      }

      var user = document.getElementById('username').value.trim();
      var pass = document.getElementById('password').value;
      var valid = true;

      if (!user) {
        setError('usernameGroup', 'usernameError', '请输入用户名');
        valid = false;
      }
      if (!pass) {
        setError('passwordGroup', 'passwordError', '请输入密码');
        valid = false;
      }
      if (!valid) return;

      // 严格空库模式：走服务端鉴权，校验账号密码并颁发 JWT
      if (typeof window.Api !== 'undefined' && window.Api.mobileLogin) {
        var btn = this;
        btn.disabled = true;
        window.Api.mobileLogin({ account: user, password: pass }).then(function(r) {
          btn.disabled = false;
          if (r && r.ok) {
            failCount = 0;
            var u = (r.data && r.data.user) || {};
            // 记住密码：仅存用户名，密码不再本地落盘
            if (document.getElementById('rememberMe').checked) {
              localStorage.setItem('rememberedUser', user);
            } else {
              localStorage.removeItem('rememberedUser');
              localStorage.removeItem('rememberedPwd');
            }
            // 后端返回的完整账号信息（真实姓名/手机号/角色/所属基地），供各页面展示
            sessionStorage.setItem('smartorchard_user_info', JSON.stringify({
              id: u.id, account: u.account, realName: u.realName, phone: u.phone,
              role: u.role, baseId: u.baseId, isExpert: u.isExpert
            }));
            doLogin(btn, u.realName || u.account || user, u.role || '');
          } else {
            failCount++;
            if (failCount >= MAX_ATTEMPTS) lockUntil = Date.now() + LOCK_MS;
            showErrorToast((r && r.message) || '账号或密码错误');
          }
        }).catch(function(e) {
          btn.disabled = false;
          showErrorToast('网络异常，请稍后重试');
        });
      } else {
        showErrorToast('服务未就绪，请刷新后重试');
      }
    });

    // 微信登录：先走一次真实的授权确认，用户同意后才登录
    document.getElementById('btnWechat').addEventListener('click', function() {
      document.getElementById('wxOverlay').classList.add('show');
    });

    document.getElementById('wxCancel').addEventListener('click', function() {
      document.getElementById('wxOverlay').classList.remove('show');
    });

    document.getElementById('wxAgree').addEventListener('click', function() {
      document.getElementById('wxOverlay').classList.remove('show');
      // 微信登录需绑定手机号（11位，1开头）作为身份凭证；不允许匿名微信用户直接进入
      var phone = (window.prompt('请输入绑定手机号（11位，1开头）：') || '').trim();
      if (!/^1\d{10}$/.test(phone)) {
        showErrorToast('微信登录需绑定有效手机号');
        return;
      }
      // 严格空库模式：微信登录的绑定校验走服务端（用手机号查询作业人员账号），
      // 本地不再比对演示账号表。
      showErrorToast('微信登录暂未接入服务端，请使用账号密码登录');
    });

    function doLogin(btn, username, role) {
      btn.disabled = true;

      // 严格空库模式：token 已由 Api.mobileLogin 写入 smartorchard_token，
      // 此处仅补充会话标记供页面读取用户信息，无假延迟。
      sessionStorage.setItem('isLoggedIn', 'true');
      sessionStorage.setItem('loginUser', username);
      sessionStorage.setItem('loginRole', role || '');
      sessionStorage.setItem('smartorchard_current_user', JSON.stringify({
        name: username, role: role || '', loginAt: new Date().toISOString()
      }));

      window.location.href = 'mb_home.html';
    }
    
    document.getElementById('username').addEventListener('input', function() {
      clearError('usernameGroup');
    });
    
    document.getElementById('password').addEventListener('input', function() {
      clearError('passwordGroup');
    });
  </script>
</body>
</html>
