<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 查故障</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body { font-family: var(--font-family); background: var(--bg); color: var(--text); overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; overflow: hidden; padding-bottom: 66px; }
    
    .content { padding: 16px; padding-bottom: 80px; }
    .card { background: var(--bg-white); border-radius: var(--radius-lg); margin-bottom: var(--space-4); padding: var(--space-4); box-shadow: var(--shadow-card); border: 1px solid var(--border); }
    .card-title { font-size: var(--font-md); font-weight: 600; color: var(--text); margin-bottom: var(--space-3); }
    .search-box { width: 100%; height: 48px; background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius-full); padding: 0 var(--space-4); display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
    .search-box svg { width: 20px; height: 20px; color: var(--text-light); }
    .search-input { flex: 1; height: 100%; font-size: var(--font-base); border: none; outline: none; background: transparent; }
    .fault-item { padding: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: var(--space-3); cursor: pointer; transition: all var(--transition-fast); }
    .fault-item:active { background: var(--gray-100); }
    .fault-item.active { background: var(--primary-50); border-color: var(--primary); }
    .fault-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-2); }
    .fault-title { font-size: var(--font-base); font-weight: 600; color: var(--text); }
    .fault-tag { padding: var(--space-1) var(--space-2); border-radius: var(--radius-lg); font-size: var(--font-xs); font-weight: 500; }
    .fault-tag.high { background: var(--error-bg); color: var(--error); }
    .fault-tag.medium { background: var(--warning-bg); color: var(--warning); }
    .fault-tag.low { background: var(--primary-light); color: var(--primary); }
    .fault-desc { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.5; }
    .guide-box { padding: var(--space-3); background: var(--info-bg); border-radius: var(--radius-md); margin-top: var(--space-3); }
    .guide-title { font-size: var(--font-base); font-weight: 600; color: var(--info); margin-bottom: var(--space-2); }
    .guide-step { display: flex; gap: var(--space-3); margin-bottom: var(--space-2); }
    .guide-step:last-child { margin-bottom: 0; }
    .step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--info); color: var(--bg-white); display: flex; align-items: center; justify-content: center; font-size: var(--font-xs); font-weight: 600; flex-shrink: 0; }
    .step-text { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.5; }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div style="padding-left: 40px;">
        <div class="header-title">设备故障查询</div>
        <div class="header-sub">查找设备故障排查指南</div>
      </div>
    </div>
    
    <div class="content">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" class="search-input" id="faultSearch" placeholder="搜索故障问题..." oninput="filterFaults(this.value)">
      </div>

      <div class="card">
        <div class="card-title">常见故障</div>
        <div id="faultList"></div>
      </div>
    </div>

    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
     * 设备故障查询（移动端）—— 数据源：localStorage['mb_fault_kb']
     * 由后台「设备故障知识库」(applefarm_backhand/mb_fault_knowledge.html) 维护
     * ES5 风格，无框架
     * ============================================================ */

    var KB_KEY = 'mb_fault_kb';

    /* 分类中文标签（与后台 CATEGORY_TEXT 保持一致） */
    var CATEGORY_TEXT = {
      irrigation: '灌溉',
      sensor:     '传感器',
      weather:    '气象',
      camera:     '摄像头',
      drone:      '无人机',
      other:      '其他'
    };
    /* 紧急程度：配色沿用本页既有 .fault-tag high/medium/low 三档 */
    var SEVERITY_META = {
      high:   { cls: 'high',   text: '高危' },
      medium: { cls: 'medium', text: '中危' },
      low:    { cls: 'low',    text: '低危' }
    };

    /* 兜底数据：读不到 mb_fault_kb 时使用（等同原页面 4 条硬编码） */
    var FALLBACK_KB = [
      {
        id: 'F001', title: '灌溉系统水泵不工作', category: 'irrigation',
        deviceType: '灌溉水泵', severity: 'high',
        symptom: '设备通电但水泵不启动，可能是电机或控制器故障',
        guide: [
          '检查电源连接是否牢固，电压是否正常',
          '查看控制器指示灯状态，确认是否有报错',
          '检查水泵叶轮是否卡死，手动尝试转动',
          '如以上均正常，请联系技术人员检修'
        ],
        order: 10
      },
      {
        id: 'F002', title: '土壤传感器数据异常', category: 'sensor',
        deviceType: '土壤湿度传感器', severity: 'medium',
        symptom: '传感器读数波动大或长期不变化',
        guide: [
          '检查传感器探头是否清洁，清除泥土附着',
          '确认传感器安装位置是否符合要求',
          '检查线缆连接是否松动或破损'
        ],
        order: 20
      },
      {
        id: 'F003', title: '气象站无数据上传', category: 'weather',
        deviceType: '气象站', severity: 'medium',
        symptom: '设备在线但平台收不到气象数据',
        guide: [
          '检查网络信号强度，确认4G/5G连接正常',
          '重启数据采集器，观察指示灯状态',
          '检查SIM卡是否欠费或松动'
        ],
        order: 30
      },
      {
        id: 'F004', title: '摄像头离线', category: 'camera',
        deviceType: '网络摄像头', severity: 'low',
        symptom: '监控画面无法加载，显示设备离线',
        guide: [
          '检查摄像头电源是否正常',
          '确认WiFi或有线网络连接',
          '尝试重启摄像头和路由器'
        ],
        order: 40
      }
    ];

    function navigateTo(page) {
      window.location.href = page;
    }

    function goBack() {
      window.history.back();
    }

    /* HTML 转义 */
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* 从 localStorage 读取知识库；无有效数据返回 null */
    function readKB() {
      try {
        var raw = localStorage.getItem(KB_KEY);
        if (!raw) return null;
        var v = JSON.parse(raw);
        if (!Array.isArray(v) || !v.length) return null;
        return v;
      } catch (e) {
        return null;
      }
    }

    /* 取启用中的条目：enabled !== false，按 order 升序（order 缺失则维持原数组顺序） */
    function getEnabledList() {
      var list = readKB();
      if (!list) list = FALLBACK_KB;
      var tmp = [];
      for (var i = 0; i < list.length; i++) {
        var k = list[i];
        if (!k || k.enabled === false) continue;
        tmp.push({ item: k, idx: i });
      }
      tmp.sort(function (a, b) {
        var oa = (a.item.order == null) ? Infinity : Number(a.item.order);
        var ob = (b.item.order == null) ? Infinity : Number(b.item.order);
        if (isNaN(oa)) oa = Infinity;
        if (isNaN(ob)) ob = Infinity;
        if (oa !== ob) return oa - ob;
        return a.idx - b.idx;
      });
      var out = [];
      for (var m = 0; m < tmp.length; m++) out.push(tmp[m].item);
      return out;
    }

    /* 渲染手风琴列表（写入 data-search 供搜索 / 分类筛选） */
    function renderList() {
      var box = document.getElementById('faultList');
      if (!box) return;
      var list = getEnabledList();
      if (!list.length) {
        box.innerHTML = '<div style="padding:32px 0;text-align:center;color:var(--text-light);font-size:14px;">暂无故障数据</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < list.length; i++) {
        var k = list[i];
        var sev = SEVERITY_META[k.severity] || { cls: 'low', text: k.severity || '未知' };
        var guide = Array.isArray(k.guide) ? k.guide : [];
        var catText = CATEGORY_TEXT[k.category] || k.category || '';
        var steps = '';
        for (var j = 0; j < guide.length; j++) {
          steps += '<div class="guide-step"><div class="step-num">' + (j + 1) + '</div>'
                 + '<div class="step-text">' + esc(guide[j]) + '</div></div>';
        }
        var searchStr = [k.title || '', k.deviceType || '', catText, k.symptom || '', guide.join(' ')]
          .join(' ').toLowerCase();
        html += '<div class="fault-item" data-search="' + esc(searchStr) + '"'
              + ' onclick="showDetail(' + (i + 1) + ')">'
              +   '<div class="fault-header">'
              +     '<div class="fault-title">' + esc(k.title) + '</div>'
              +     '<span class="fault-tag ' + sev.cls + '">' + esc(sev.text) + '</span>'
              +   '</div>'
              +   (k.deviceType ? '<div class="fault-desc">' + esc(k.deviceType) + '</div>' : '')
              +   '<div class="guide-box" style="display:none;">'
              +     '<div class="guide-title">故障现象</div>'
              +     '<div class="step-text" style="margin-bottom:var(--space-3);">' + esc(k.symptom || '暂无描述') + '</div>'
              +     '<div class="guide-title">排查指南</div>'
              +     (steps || '<div class="step-text">暂无排查步骤</div>')
              +   '</div>'
              + '</div>';
      }
      box.innerHTML = html;
    }

    /* 展开 / 收起：保留原函数名与签名，n 为列表序号（1 起） */
    function showDetail(id) {
      var items = document.querySelectorAll('.fault-item');
      var targetIndex = Number(id) - 1;
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var guide = item.querySelector('.guide-box');
        if (!guide) continue;
        if (i === targetIndex) {
          /* 再次点击同一项可收起 */
          var willOpen = (guide.style.display === 'none' || guide.style.display === '');
          guide.style.display = willOpen ? 'block' : 'none';
          if (willOpen) item.classList.add('active');
          else item.classList.remove('active');
        } else {
          /* 其余条目自动收起 */
          guide.style.display = 'none';
          item.classList.remove('active');
        }
      }
    }

    /* 关键词搜索：匹配标题 / 设备类型 / 分类 / 现象 / 步骤 */
    function filterFaults(kw) {
      var key = String(kw || '').trim().toLowerCase();
      var items = document.querySelectorAll('.fault-item');
      var visible = 0;
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var text = (item.getAttribute('data-search') || item.textContent || '').toLowerCase();
        var match = !key || text.indexOf(key) !== -1;
        item.style.display = match ? '' : 'none';
        if (match) visible++;
      }
      var tip = document.getElementById('faultEmpty');
      if (!tip) {
        var card = document.querySelector('.content .card');
        if (card) {
          tip = document.createElement('div');
          tip.id = 'faultEmpty';
          tip.style.cssText = 'display:none;padding:32px 0;text-align:center;color:var(--text-light);font-size:14px;';
          tip.textContent = '未找到相关故障，试试其他关键词';
          card.appendChild(tip);
        }
      }
      if (tip) tip.style.display = visible ? 'none' : 'block';
    }

    /* 初始化渲染 */
    function initPage() {
      renderList();
    }

    /* 监听同源其他页面（后台知识库）对 localStorage 的改动，实时同步 */
    window.addEventListener('storage', function (e) {
      if (!e || e.key == null || e.key === KB_KEY) {
        renderList();
        var input = document.getElementById('faultSearch');
        if (input) filterFaults(input.value);
      }
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPage);
    } else {
      initPage();
    }
  </script>
</body>
</html>
