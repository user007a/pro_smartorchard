<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 无人机巡园</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <script src="js/mobile-store.js"></script>
  <script src="js/mobile-data.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body { font-family: var(--font-family); background: var(--bg); color: var(--text); overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }

    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 80px; }
    
    /* 当前任务状态 */
    .task-status-card { background: var(--bg-white); margin: var(--space-3); border-radius: var(--radius-lg); padding: var(--space-4); border: 1px solid var(--border); }
    .task-status-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3); }
    .task-name { font-size: var(--font-md); font-weight: var(--font-semibold); color: var(--text); }
    .status-tag { font-size: var(--font-xs); padding: var(--space-1) var(--space-3); border-radius: var(--radius-full); font-weight: var(--font-semibold); }
    .status-tag.running { background: var(--success-bg); color: var(--primary-500); }
    .status-tag.idle { background: var(--gray-100); color: var(--text-light); }
    .task-progress-bar { height: 6px; background: var(--border-light); border-radius: var(--radius-sm); overflow: hidden; }
    .task-progress-fill { height: 100%; background: var(--gradient-primary); border-radius: var(--radius-sm); transition: width var(--transition-slow); }
    .task-progress-text { font-size: var(--font-xs); color: var(--text-light); margin-top: var(--space-2); text-align: right; }
    
    /* 实时监控区域 */
    .monitor-section { padding: 0 var(--space-3); }
    .section-title { font-size: var(--font-md); font-weight: var(--font-bold); color: var(--text); margin-bottom: var(--space-3); display: flex; align-items: center; gap: var(--space-2); }
    .section-dot { width: 4px; height: 16px; background: var(--primary); border-radius: var(--radius-sm); }
    
    /* 地图区域 */
    .map-container { background: linear-gradient(160deg, #1a2e1a 0%, #2d4a2d 30%, #3d5c3d 60%, #2a3a2a 100%); border-radius: var(--radius-lg); height: 200px; position: relative; overflow: hidden; margin-bottom: var(--space-3); }
    .map-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(100,180,100,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(100,180,100,0.1) 1px, transparent 1px); background-size: 30px 30px; }
    .drone-marker { position: absolute; width: 36px; height: 36px; background: var(--info); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: pulse 2s infinite; }
    .drone-marker svg { width: 18px; height: 18px; color: var(--bg-white); }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(24,144,255,0.7); } 70% { box-shadow: 0 0 0 10px rgba(24,144,255,0); } 100% { box-shadow: 0 0 0 0 rgba(24,144,255,0); } }
    .waypoint-marker { position: absolute; width: 24px; height: 24px; background: var(--primary-500); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; }
    .waypoint-marker svg { width: 12px; height: 12px; color: var(--bg-white); }
    .waypoint-label { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); font-size: var(--font-xs); color: rgba(255,255,255,0.8); white-space: nowrap; margin-top: var(--space-1); }
    .flight-path { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .path-line { fill: none; stroke: rgba(34,168,74,0.6); stroke-width: 2; stroke-dasharray: 6 3; }
    
    /* 飞行参数 */
    .flight-info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); }
    .info-card { background: var(--bg-white); border-radius: var(--radius-lg); padding: var(--space-4); border: 1px solid var(--border); }
    .info-label { font-size: var(--font-xs); color: var(--text-light); margin-bottom: var(--space-1); }
    .info-value { font-size: var(--font-xl); font-weight: var(--font-bold); color: var(--text); }
    .info-unit { font-size: var(--font-xs); color: var(--text-light); font-weight: var(--font-regular); }
    .info-value.green { color: var(--primary-500); }
    .info-value.orange { color: var(--warning); }
    .info-value.red { color: var(--error); }
    
    /* 视频画面 */
    .video-container { background: #1a1a1a; border-radius: var(--radius-lg); padding: var(--space-3); margin-top: var(--space-3); }
    .video-frame { background: #000; border-radius: var(--radius-md); height: 160px; display: flex; align-items: center; justify-content: center; position: relative; }
    .video-placeholder { text-align: center; color: var(--gray-500); }
    .video-placeholder svg { width: 40px; height: 40px; margin-bottom: var(--space-2); }
    .video-status { position: absolute; top: var(--space-2); right: var(--space-2); display: flex; align-items: center; gap: var(--space-1); background: rgba(0,0,0,0.6); padding: 3px var(--space-2); border-radius: var(--radius-md); font-size: var(--font-xs); color: var(--success); }
    .video-status svg { width: 8px; height: 8px; fill: var(--success); animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    
    /* 控制按钮 */
    .control-section { padding: var(--space-3); }
    .control-buttons { display: flex; gap: var(--space-3); }
    .control-btn { flex: 1; padding: var(--space-4); border-radius: var(--radius-lg); border: none; cursor: pointer; font-size: var(--font-base); font-weight: var(--font-semibold); transition: all var(--transition-normal); }
    .control-btn:active { transform: scale(0.98); }
    .control-btn.pause { background: linear-gradient(135deg, var(--warning), #d47500); color: var(--bg-white); }
    .control-btn.return { background: linear-gradient(135deg, var(--error), var(--error-dark)); color: var(--bg-white); }
    
    /* 异常列表 */
    .abnormal-section { padding: 0 var(--space-3); }
    .abnormal-card { background: var(--bg-white); border-radius: var(--radius-lg); padding: var(--space-4); margin-bottom: var(--space-3); border: 1px solid var(--border); }
    .abnormal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3); }
    .abnormal-title { font-size: var(--font-base); font-weight: var(--font-semibold); color: var(--text); display: flex; align-items: center; gap: var(--space-2); }
    .abnormal-dot { width: 8px; height: 8px; border-radius: var(--radius-full); }
    .abnormal-dot.pest { background: var(--error); }
    .abnormal-dot.growth { background: var(--warning); }
    .abnormal-status { font-size: var(--font-xs); padding: 2px var(--space-2); border-radius: var(--radius-md); background: var(--error-bg); color: var(--error); }
    .abnormal-meta { display: flex; gap: var(--space-3); font-size: var(--font-xs); color: var(--text-light); }
    .abnormal-confidence { color: var(--success); font-weight: var(--font-semibold); }
    .abnormal-footer { display: flex; justify-content: space-between; align-items: center; margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border-light); }
    .btn-confirm { background: var(--gradient-primary); color: var(--bg-white); border: none; border-radius: var(--radius-lg); padding: var(--space-2) var(--space-4); font-size: var(--font-xs); font-weight: var(--font-semibold); cursor: pointer; }
    .btn-ignore { background: var(--gray-100); color: var(--text-secondary); border: none; border-radius: var(--radius-lg); padding: var(--space-2) var(--space-4); font-size: var(--font-xs); font-weight: var(--font-semibold); cursor: pointer; }
    
    /* 历史任务 */
    .history-section { padding: 0 var(--space-3); }
    .history-card { background: var(--bg-white); border-radius: var(--radius-lg); padding: var(--space-4); margin-bottom: var(--space-3); border: 1px solid var(--border); }
    .history-header { display: flex; align-items: center; justify-content: space-between; }
    .history-task-id { font-size: var(--font-base); font-weight: var(--font-semibold); color: var(--text); }
    .history-status { font-size: var(--font-xs); padding: 2px var(--space-2); border-radius: var(--radius-md); }
    .history-status.completed { background: var(--success-bg); color: var(--primary-500); }
    .history-date { font-size: var(--font-xs); color: var(--text-light); margin-top: var(--space-2); }
    .history-stats { display: flex; gap: var(--space-4); margin-top: var(--space-3); font-size: var(--font-xs); color: var(--text-secondary); }
    .history-stat-value { font-weight: var(--font-semibold); color: var(--text); }

    /* 暂停 / 返航状态 */
    .status-tag.paused { background: var(--warning-bg); color: var(--warning); }
    .status-tag.returned { background: var(--info-bg); color: var(--info); }
    .control-btn.resume { background: linear-gradient(135deg, var(--success), var(--primary-600)); color: var(--bg-white); }
    .control-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 视频区域扫描线装饰 */
    .video-frame::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 3px); pointer-events: none; }

    /* 异常已处理状态 */
    .abnormal-status.ignored { background: var(--gray-100); color: var(--text-light); }
    .abnormal-status.confirmed { background: var(--success-bg); color: var(--success); }
    .abnormal-card.done { opacity: 0.72; }
    .abnormal-card.done .btn-confirm,
    .abnormal-card.done .btn-ignore { display: none; }
    .abnormal-done-tip { font-size: var(--font-xs); color: var(--text-light); }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div class="header-content">
        <div class="header-title">无人机巡园</div>
        <div class="header-sub">实时监控飞行状态</div>
      </div>
    </div>
    
    <!-- 当前任务状态 -->
    <div class="task-status-card">
      <div class="task-status-header">
        <div class="task-name" id="taskName">加载中…</div>
        <span class="status-tag idle" id="taskStatus">加载中</span>
      </div>
      <div class="task-progress-bar">
        <div class="task-progress-fill" id="taskProgressFill" style="width: 0%"></div>
      </div>
      <div class="task-progress-text" id="taskProgressText">--</div>
    </div>
    
    <!-- 实时监控 -->
    <div class="monitor-section">
      <div class="section-title">
        <span class="section-dot"></span>
        实时监控
      </div>
      
      <!-- 地图展示 -->
      <div class="map-container" id="mapContainer">
        <div class="map-grid"></div>
        <div class="flight-path" id="flightPath">
          <svg width="100%" height="100%">
            <path class="path-line" d="M 50,100 Q 120,60 200,100 T 360,100" />
          </svg>
        </div>
        <div id="routeMarkers"></div>
        <div class="drone-marker" id="droneMarker" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
      </div>
      
      <!-- 飞行参数 -->
      <div class="flight-info-grid">
        <div class="info-card">
          <div class="info-label">飞行高度</div>
          <div class="info-value" id="flightHeight">--<span class="info-unit">m</span></div>
        </div>
        <div class="info-card">
          <div class="info-label">飞行速度</div>
          <div class="info-value" id="flightSpeed">--<span class="info-unit">m/s</span></div>
        </div>
        <div class="info-card">
          <div class="info-label">电池电量</div>
          <div class="info-value green" id="flightBattery">--<span class="info-unit">%</span></div>
        </div>
        <div class="info-card">
          <div class="info-label">信号强度</div>
          <div class="info-value" id="flightSignal">--</div>
        </div>
      </div>
      
      <!-- 视频画面 -->
      <div class="video-container">
        <div class="video-frame">
          <div class="video-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <div>暂无实时视频流</div>
          </div>
          <div class="video-status">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="12" r="10"/>
            </svg>
            <span>未接入</span>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 控制按钮 -->
    <div class="control-section">
      <div class="control-buttons">
        <button class="control-btn pause" id="pauseBtn" onclick="pauseFlight()">⏸️ 暂停</button>
        <button class="control-btn return" onclick="returnFlight()">🔙 返航</button>
      </div>
    </div>
    
    <!-- 异常列表 -->
    <div class="abnormal-section">
      <div class="section-title">
        <span class="section-dot"></span>
        识别异常 <span id="abnormalPending" style="font-size:12px;font-weight:400;color:#999;"></span>
      </div>
      <div id="abnormalList"></div>
    </div>
    
    <!-- 历史任务 -->
    <div class="history-section">
      <div class="section-title">
        <span class="section-dot"></span>
        历史任务
      </div>
      <div id="historyList"></div>
    </div>
    
    <!-- 底部导航 -->
    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_patrol.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span>巡园</span>
      </div>
      <div class="tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        <span>无人机</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
    </div>
  </div>
  
  <script>
    var MD = window.MobileData;
    var state = { task: null, paused: false, returned: false, busy: false };

    function goBack() {
      window.history.back();
    }

    function navigateTo(page) {
      window.location.href = page;
    }

    function pad2(n) { return n < 10 ? '0' + n : String(n); }

    function nowText() {
      var d = new Date();
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
        ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    }

    function genCode(prefix) {
      var d = new Date();
      var rand = Math.random().toString(36).slice(2, 6).toUpperCase();
      return prefix + '-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
        '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds()) + '-' + rand;
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function numText(v) {
      var n = parseFloat(v);
      return isNaN(n) ? '--' : String(n);
    }

    function isDone(status) {
      return ['done', 'completed', 'finished'].indexOf(String(status || '').toLowerCase()) >= 0;
    }

    function isRunning(status) {
      return ['in_progress', 'running', 'patrolling', 'executing', 'processing']
        .indexOf(String(status || '').toLowerCase()) >= 0;
    }

    function statusText(status) {
      var s = String(status || '').toLowerCase();
      if (isDone(s)) return '已完成';
      if (isRunning(s)) return '进行中';
      if (s === 'paused') return '已暂停';
      return '待执行';
    }

    function pickTask() {
      var rows = MD ? MD.list('drone_patrol') : [];
      var i;
      for (i = 0; i < rows.length; i++) {
        if (isRunning(rows[i].status)) return rows[i];
      }
      for (i = 0; i < rows.length; i++) {
        if (!isDone(rows[i].status)) return rows[i];
      }
      return rows.length ? rows[0] : null;
    }

    function latestBattery(taskCode) {
      var logs = MD ? MD.list('drone_flight_log') : [];
      var best = null;
      for (var i = 0; i < logs.length; i++) {
        var l = logs[i];
        if (String(l.task_code || '') !== String(taskCode || '')) continue;
        if (l.battery == null || l.battery === '') continue;
        if (!best || Number(l.id) > Number(best.id)) best = l;
      }
      return best ? best.battery : null;
    }

    function setInfo(id, value, unit) {
      var el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = '';
      el.appendChild(document.createTextNode(value == null || value === '' ? '--' : String(value)));
      if (unit) {
        var span = document.createElement('span');
        span.className = 'info-unit';
        span.textContent = unit;
        el.appendChild(span);
      }
    }

    function renderTask() {
      var task = state.task;
      var nameEl = document.getElementById('taskName');
      var tag = document.getElementById('taskStatus');
      var fill = document.getElementById('taskProgressFill');
      var text = document.getElementById('taskProgressText');
      var pauseBtn = document.getElementById('pauseBtn');
      var returnBtn = document.querySelector('.control-btn.return');

      if (!task) {
        nameEl.textContent = '暂无巡园任务';
        tag.className = 'status-tag idle';
        tag.textContent = '暂无任务';
        fill.style.width = '0%';
        text.textContent = '数据库暂无无人机巡园任务，请先在后台创建';
        if (pauseBtn) pauseBtn.disabled = true;
        if (returnBtn) returnBtn.disabled = true;
        setInfo('flightHeight', '--', 'm');
        setInfo('flightSpeed', '--', 'm/s');
        setInfo('flightBattery', '--', '%');
        setInfo('flightSignal', '--', '');
        return;
      }

      var done = isDone(task.status);
      nameEl.textContent = task.task_code + (task.drone_task_name ? ' · ' + task.drone_task_name : (task.route ? ' · ' + task.route : ''));
      var cls = state.returned ? 'returned' : (state.paused ? 'paused' : (done ? 'idle' : (isRunning(task.status) ? 'running' : 'idle')));
      tag.className = 'status-tag ' + cls;
      tag.textContent = state.returned ? '已返航' : (state.paused ? '已暂停' : statusText(task.status));

      var progress = parseFloat(task.progress);
      if (isNaN(progress)) progress = 0;
      progress = Math.max(0, Math.min(100, Math.round(progress)));
      fill.style.width = progress + '%';

      if (state.returned) {
        text.textContent = '已返回起点 · 本次巡检结束';
      } else if (done) {
        text.textContent = '已完成 ' + progress + '% · 巡检任务完成';
      } else if (state.paused) {
        text.textContent = '已完成 ' + progress + '% · 已暂停';
      } else {
        text.textContent = '已完成 ' + progress + '%' +
          (task.plan_time ? ' · 计划 ' + MD.dateTimeText(task.plan_time) : '');
      }

      setInfo('flightHeight', numText(task.flight_height), 'm');
      setInfo('flightSpeed', numText(task.speed), 'm/s');
      setInfo('flightBattery', numText(latestBattery(task.task_code)), '%');
      setInfo('flightSignal', '--', '');

      if (pauseBtn) {
        pauseBtn.disabled = !!(done || state.returned);
        pauseBtn.textContent = state.paused ? '▶️ 继续' : '⏸️ 暂停';
        pauseBtn.className = 'control-btn ' + (state.paused ? 'resume' : 'pause');
      }
      if (returnBtn) returnBtn.disabled = !!(done || state.returned);
    }

    function taskRoutePoints() {
      if (!state.task || state.task.route_id == null || !MD) return [];
      var routes = MD.list('patrol_route');
      for (var i = 0; i < routes.length; i++) {
        if (String(routes[i].id) !== String(state.task.route_id)) continue;
        try {
          var pts = JSON.parse(routes[i].points || '[]');
          return Array.isArray(pts) ? pts : [];
        } catch (e) {
          return [];
        }
      }
      return [];
    }

    function renderMap() {
      var box = document.getElementById('routeMarkers');
      var path = document.getElementById('flightPath');
      var drone = document.getElementById('droneMarker');
      if (!box) return;
      var pts = taskRoutePoints();

      if (!pts.length) {
        box.innerHTML = '<div style="position:absolute;left:0;right:0;top:48%;text-align:center;color:rgba(255,255,255,0.7);font-size:12px;">暂无航线点位</div>';
        if (path) path.style.display = 'none';
      } else {
        if (path) path.style.display = '';
        var lats = [], lngs = [];
        pts.forEach(function (p) {
          var lat = Number(p.lat), lng = Number(p.lng);
          if (!isNaN(lat) && !isNaN(lng)) { lats.push(lat); lngs.push(lng); }
        });
        var hasGeo = lats.length === pts.length && pts.length > 0;
        var minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
        var minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
        box.innerHTML = pts.map(function (p, i) {
          var left, top;
          if (hasGeo) {
            var dLat = maxLat - minLat, dLng = maxLng - minLng;
            left = dLng ? 10 + 80 * (Number(p.lng) - minLng) / dLng : 50;
            top = dLat ? 90 - 80 * (Number(p.lat) - minLat) / dLat : 50;
          } else if (pts.length > 1) {
            left = 15 + i * 70 / (pts.length - 1);
            top = 35 + i * 30 / (pts.length - 1);
          } else {
            left = 50; top = 50;
          }
          return '<div class="waypoint-marker" style="top:' + top.toFixed(2) + '%;left:' + left.toFixed(2) + '%;">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>' +
            '<div class="waypoint-label">' + esc(p.name || p.id || ('P' + (i + 1))) + '</div>' +
          '</div>';
        }).join('');
      }
      if (drone) drone.style.display = state.task ? 'flex' : 'none';
    }

    function renderAbnormal() {
      var box = document.getElementById('abnormalList');
      var pendingEl = document.getElementById('abnormalPending');
      if (!box) return;
      var rows = MD ? MD.list('patrol_abnormal') : [];
      var list = rows.filter(function (r) {
        var src = String(r.source || '').toLowerCase();
        var st = String(r.status || 'pending').toLowerCase();
        return src === 'drone' && st !== 'done' && st !== 'completed';
      });
      if (pendingEl) pendingEl.textContent = '(' + list.length + '条待确认)';
      if (!list.length) {
        box.innerHTML = MD ? MD.inlineEmpty('暂无待确认异常') : '';
        return;
      }
      box.innerHTML = list.map(function (r) {
        var type = r.abnormal_type || '异常';
        var dot = String(type).indexOf('虫') >= 0 || String(type).indexOf('病') >= 0 ? 'pest' : 'growth';
        var stText = String(r.status || 'pending').toLowerCase() === 'processing' ? '处理中' : '待确认';
        var sevMap = { high: '高', medium: '中', low: '低' };
        var sevText = sevMap[String(r.severity || '').toLowerCase()] || r.severity;
        return '<div class="abnormal-card" data-db-id="' + esc(r.id) + '">' +
          '<div class="abnormal-header">' +
            '<div class="abnormal-title"><span class="abnormal-dot ' + dot + '"></span>' + esc(type) + '</div>' +
            '<span class="abnormal-status">' + stText + '</span>' +
          '</div>' +
          '<div class="abnormal-meta">' +
            (r.plot_code ? '<span>地块' + esc(r.plot_code) + '</span>' : '') +
            (sevText ? '<span>等级：' + esc(sevText) + '</span>' : '') +
          '</div>' +
          (r.abnormal_desc ? '<div style="font-size:12px;color:#666;margin-top:6px;">' + esc(r.abnormal_desc) + '</div>' : '') +
          '<div class="abnormal-footer">' +
            '<span style="font-size:12px;color:#666;">' + esc(MD ? MD.dateTimeText(r.report_time) : '') + '</span>' +
            '<div style="display:flex;gap:8px;">' +
              '<button class="btn-ignore" onclick="ignoreAbnormal(this, ' + esc(r.id) + ')">标记误报</button>' +
              '<button class="btn-confirm" onclick="confirmAbnormal(this, ' + esc(r.id) + ')">确认异常</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function renderHistory() {
      var box = document.getElementById('historyList');
      if (!box) return;
      var rows = MD ? MD.list('drone_patrol') : [];
      var list = rows.filter(function (r) {
        return !state.task || String(r.id) !== String(state.task.id);
      }).slice(0, 6);
      if (!list.length) {
        box.innerHTML = MD ? MD.inlineEmpty('暂无历史任务') : '';
        return;
      }
      box.innerHTML = list.map(function (r) {
        var done = isDone(r.status);
        var area = parseFloat(r.flight_area);
        return '<div class="history-card">' +
          '<div class="history-header">' +
            '<div class="history-task-id">' + esc(r.task_code) + '</div>' +
            '<span class="history-status' + (done ? ' completed' : '') + '">' + statusText(r.status) + '</span>' +
          '</div>' +
          '<div class="history-date">' + esc(MD.dateTimeText(r.plan_time || r.created_at)) + '</div>' +
          '<div class="history-stats">' +
            '<span>航线：<span class="history-stat-value">' + esc(r.route || r.drone_task_name || '--') + '</span></span>' +
            '<span>覆盖：<span class="history-stat-value">' + (isNaN(area) ? '--' : area + '亩') + '</span></span>' +
            '<span>异常：<span class="history-stat-value">--</span></span>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function renderAll() {
      var prevId = state.task ? state.task.id : null;
      var next = pickTask();
      var nextId = next ? next.id : null;
      if (prevId !== null && String(prevId) !== String(nextId)) {
        state.paused = false;
        state.returned = false;
      }
      if (prevId === null && !next) {
        state.paused = false;
        state.returned = false;
      }
      state.task = next;
      renderTask();
      renderMap();
      renderAbnormal();
      renderHistory();
    }

    function writeFlightLog(eventName) {
      if (!window.Api || typeof Api.create !== 'function' || !state.task) {
        return Promise.resolve(false);
      }
      var t = state.task;
      return Api.create('drone_flight_log', {
        log_code: genCode('FL'),
        sortie_id: t.sortie || null,
        task_code: t.task_code || null,
        event: eventName,
        altitude: t.flight_height || null,
        speed: t.speed || null,
        battery: latestBattery(t.task_code),
        event_time: nowText(),
        remark: '移动端' + eventName
      }).then(function (res) {
        if (!res || !res.ok) {
          MobileStore.toast((res && res.message) || ('飞行日志写入失败：' + eventName), 'error');
          return false;
        }
        return true;
      }).catch(function () {
        MobileStore.toast('飞行日志写入失败：' + eventName, 'error');
        return false;
      });
    }

    function pauseFlight() {
      if (!state.task) {
        MobileStore.toast('当前没有可操作的巡园任务', 'warning');
        return;
      }
      if (state.busy || isDone(state.task.status) || state.returned) return;
      state.busy = true;
      var next = !state.paused;
      writeFlightLog(next ? '暂停' : '恢复').then(function (ok) {
        state.busy = false;
        if (!ok) return;
        state.paused = next;
        renderTask();
        MobileStore.toast(next ? '巡检已暂停' : '巡检已恢复', next ? 'warning' : 'success');
        MD.reload('drone_flight_log');
      });
    }

    function returnFlight() {
      if (!state.task) {
        MobileStore.toast('当前没有可操作的巡园任务', 'warning');
        return;
      }
      if (state.returned || isDone(state.task.status)) {
        MobileStore.toast('无人机当前已在起点，无需返航', 'info');
        return;
      }
      if (!MobileStore.confirm('确定要让无人机返航吗？返航后本次巡检将结束。')) return;
      state.busy = true;
      writeFlightLog('返航').then(function (ok) {
        if (!ok) { state.busy = false; return; }
        state.returned = true;
        state.paused = false;
        Api.update('drone_patrol', state.task.id, { status: 'done' }).then(function (res) {
          state.busy = false;
          if (!res || !res.ok) {
            MobileStore.toast('返航已记录，任务状态同步失败', 'warning');
            renderAll();
            return;
          }
          renderAll();
          MobileStore.toast('返航指令已发送，无人机正在返回起点', 'info');
          MD.reload('drone_patrol').then(renderAll);
        }).catch(function () {
          state.busy = false;
          renderAll();
          MobileStore.toast('返航已记录，任务状态同步失败', 'warning');
        });
      });
    }

    function markAbnormal(btn, id, decision) {
      if (!id || !window.Api || typeof Api.update !== 'function') return;
      if (btn && btn.disabled) return;
      if (btn) btn.disabled = true;
      var payload = decision === 'ignore'
        ? { status: 'done', handle_result: '标记误报', handle_remark: '移动端标记误报', handle_time: nowText() }
        : { status: 'processing', handle_result: '确认异常', handle_remark: '移动端确认异常', handle_time: nowText() };
      Api.update('patrol_abnormal', id, payload).then(function (res) {
        if (!res || !res.ok) {
          if (btn) btn.disabled = false;
          MobileStore.toast((res && res.message) || '异常状态更新失败', 'error');
          return;
        }
        MobileStore.toast(decision === 'ignore' ? '已标记为误报，该异常已忽略' : '已确认异常，已进入处理中', decision === 'ignore' ? 'info' : 'success');
        MD.reload('patrol_abnormal').then(renderAbnormal);
      }).catch(function () {
        if (btn) btn.disabled = false;
        MobileStore.toast('异常状态更新失败', 'error');
      });
    }

    function ignoreAbnormal(btn, id) {
      markAbnormal(btn, id, 'ignore');
    }

    function confirmAbnormal(btn, id) {
      markAbnormal(btn, id, 'confirm');
    }

    function initPage() {
      if (!MD || typeof MD.rows !== 'function') { renderAll(); return; }
      var run = function () {
        Promise.all([
          MD.rows('drone_patrol'),
          MD.rows('drone_flight_log'),
          MD.rows('patrol_abnormal'),
          MD.rows('patrol_route')
        ]).then(renderAll).catch(renderAll);
      };
      if (MD.ready && MD.ready.then) MD.ready.then(run); else run();
      if (typeof MD.subscribe === 'function') {
        MD.subscribe(function () { renderAll(); });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPage);
    } else {
      initPage();
    }
  </script>
</body>
</html>
