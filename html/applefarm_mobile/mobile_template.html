<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 页面名称</title>
  <!-- 设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <style>
    /* ========== 页面专属样式 ========== */
    .content { padding: var(--space-4); padding-bottom: 80px; }
    
    /* 示例：列表项 */
    .list-item {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .list-item:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    
    .list-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .list-icon.green { background: var(--success-bg); color: var(--success); }
    .list-icon.blue { background: var(--info-bg); color: var(--info); }
    .list-icon.orange { background: var(--orange-bg); color: var(--orange); }
    .list-icon.purple { background: var(--purple-bg); color: var(--purple); }
    
    .list-icon svg { width: 22px; height: 22px; }
    
    .list-content { flex: 1; min-width: 0; }
    .list-title { font-size: var(--font-md); font-weight: var(--font-semibold); color: var(--text); }
    .list-subtitle { font-size: var(--font-sm); color: var(--text-secondary); margin-top: 2px; }
    
    .list-arrow {
      color: var(--text-muted);
      flex-shrink: 0;
    }
    
    .list-arrow svg { width: 18px; height: 18px; }
    
    /* 示例：统计卡片网格 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-2);
      margin-bottom: var(--space-4);
    }
    
    .stat-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-3);
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    
    .stat-value {
      font-size: var(--font-lg);
      font-weight: var(--font-bold);
      color: var(--primary);
    }
    
    .stat-label {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-top: 2px;
    }
    
    /* 示例：操作按钮组 */
    .action-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-3);
      margin-top: var(--space-4);
    }
    
    .action-btn {
      background: var(--gradient-primary);
      color: var(--text-on-primary);
      border: none;
      border-radius: var(--radius-lg);
      padding: var(--space-3) var(--space-2);
      font-size: var(--font-sm);
      font-weight: var(--font-medium);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-1);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .action-btn:active {
      transform: scale(0.95);
      opacity: 0.9;
    }
    
    .action-btn svg { width: 24px; height: 24px; }
  </style>
</head>
<body>
  <div class="mb-app">
    
    <!-- ========== Header（详情页样式） ========== -->
    <div class="page-header mb-header-detail">
      <div class="header-nav">
        <div class="header-back" onclick="window.history.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </div>
        <div class="header-title">页面标题</div>
        <div class="header-actions">
          <!-- 可选：操作按钮 -->
        </div>
      </div>
      <div class="header-content">
        <div class="header-sub">页面副标题/说明</div>
      </div>
    </div>
    
    <!-- ========== 内容区域 ========== -->
    <div class="content">
      
      <!-- 示例：统计数据 -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value">25</div>
          <div class="stat-label">今日任务</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">18</div>
          <div class="stat-label">已完成</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">5</div>
          <div class="stat-label">进行中</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">2</div>
          <div class="stat-label">待处理</div>
        </div>
      </div>
      
      <!-- 示例：卡片 -->
      <div class="card">
        <div class="card-title">卡片标题</div>
        <div class="card-content">
          卡片内容区域
        </div>
      </div>
      
      <!-- 示例：列表项 -->
      <div class="list-item" onclick="navigateTo('target.html')">
        <div class="list-icon green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <div class="list-content">
          <div class="list-title">列表项标题</div>
          <div class="list-subtitle">列表项描述信息</div>
        </div>
        <div class="list-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </div>
      
      <div class="list-item" onclick="navigateTo('target2.html')">
        <div class="list-icon blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 8v4l3 3"/>
          </svg>
        </div>
        <div class="list-content">
          <div class="list-title">另一个列表项</div>
          <div class="list-subtitle">点击查看详情</div>
        </div>
        <div class="list-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </div>
      
      <!-- 示例：操作按钮组 -->
      <div class="action-buttons">
        <button class="action-btn" onclick="handleAction('action1')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
          </svg>
          操作一
        </button>
        <button class="action-btn" onclick="handleAction('action2')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          操作二
        </button>
        <button class="action-btn" onclick="handleAction('action3')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06"/>
          </svg>
          操作三
        </button>
      </div>
      
    </div><!-- .content -->
    
    <!-- ========== 底部导航栏 ========== -->
    <nav class="tab-bar">
      <a href="mb_home.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </svg>
        <span>首页</span>
      </a>
      <a href="mb_service.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>服务</span>
      </a>
      <a href="#" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 17H2a3 3 0 0 0 3-3V9a7 7 0 0 1 14 0v5a3 3 0 0 0 3 3zm-8.27 4a2 2 0 0 1-3.46 0"/>
        </svg>
        <span>消息</span>
      </a>
      <a href="mb_mine.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </a>
    </nav>
    
  </div><!-- .mb-app -->
  
  <script>
    // ========== 页面脚本 ==========
    
    function navigateTo(page) {
      window.location.href = page;
    }
    
    function goBack() {
      window.history.back();
    }
    
    function handleAction(action) {
      console.log('执行操作:', action);
      // 根据action执行相应逻辑
    }
    
    // 示例：打开弹窗
    function openModal(modalId) {
      document.getElementById(modalId).classList.add('show');
    }
    
    // 示例：关闭弹窗
    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('show');
    }
  </script>
  
</body>
</html>
