<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 服务</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 移动端共享数据层 -->
  <script src="js/mobile-store.js"></script>
  <style>
    /* Content */
    .content { padding: var(--space-4); padding-bottom: 80px; }
    
    /* Service Grid */
    .service-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: var(--space-2);
    }

    /* 农事操作：两行四列 */
    .service-grid.four {
      grid-template-columns: repeat(4, 1fr);
    }
    
    .service-category {
      margin-bottom: var(--space-4);
    }
    
    .category-title {
      font-size: var(--font-sm);
      font-weight: 600;
      color: var(--text);
      margin-bottom: var(--space-3);
      padding-left: var(--space-2);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    
    .category-title::before {
      content: '';
      width: 4px;
      height: 16px;
      border-radius: 2px;
    }
    
    .category-title.farming::before { background: var(--success); }
    .category-title.device::before { background: var(--info); }
    .category-title.model::before { background: var(--purple); }
    .category-title.supply::before { background: var(--warning); }
    .category-title.feedback::before { background: var(--info); }
    .category-title.marketing::before { background: var(--primary); }
    .category-title.recent::before { background: var(--primary); }
    
    .service-item {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-2) 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative;
      aspect-ratio: 1;
      min-width: 0;
    }
    
    .service-item:active {
      transform: scale(0.96);
      box-shadow: var(--shadow-sm);
    }
    
    .service-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .service-icon svg { width: 22px; height: 22px; }
    
    .service-icon.green { background: var(--success-bg); color: var(--success); }
    .service-icon.orange { background: var(--orange-bg); color: var(--orange); }
    .service-icon.blue { background: var(--info-bg); color: var(--info); }
    .service-icon.red { background: var(--error-bg); color: var(--error); }
    .service-icon.purple { background: var(--purple-bg); color: var(--purple); }
    .service-icon.cyan { background: var(--sky-50); color: var(--sky-700); }
    .service-icon.yellow { background: var(--warning-bg); color: var(--warning); }
    .service-icon.gradient { background: linear-gradient(135deg, var(--sky-500), var(--sky-700)); color: var(--bg-white); }
    
    .service-name {
      font-size: var(--font-xs);
      color: var(--text);
      text-align: center;
      line-height: 1.25;
      white-space: normal;
      overflow-wrap: break-word;
      text-wrap: balance;
    }
    
    .service-badge {
      position: absolute;
      top: var(--space-1);
      right: var(--space-1);
      min-width: 16px;
      height: 16px;
      background: var(--danger);
      color: var(--bg-white);
      border-radius: var(--radius-full);
      font-size: var(--font-xs);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    
    /* Modal: 已迁移到统一弹窗组件 .mb-modal-overlay / .mb-modal */
    .modal-title { font-size: var(--font-md); font-weight: 600; text-align: center; margin-bottom: 16px; }
    .modal-btn { width: 100%; height: 44px; background: var(--primary); color: #fff; border: none; border-radius: 22px; font-size: var(--font-md); font-weight: 600; cursor: pointer; }
    .success-icon { width: 56px; height: 56px; margin: 0 auto 16px; background: #e8f5ec; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .success-icon svg { width: 32px; height: 32px; color: #22a84a; }
  </style>
</head>
<body>
  <div class="mb-app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div class="header-content">
        <div class="header-title">服务中心</div>
      </div>
    </div>
    
    <div class="content">
      <!-- 最近使用（读取 smartorchard_service_action） -->
      <div class="service-category" id="recentCategory" style="display:none;">
        <div class="category-title recent">最近使用</div>
        <div class="service-grid four" id="recentGrid"></div>
      </div>

      <!-- 农事操作 -->
      <div class="service-category">
        <div class="category-title farming">农事操作</div>
        <div class="service-grid four">
          <div class="service-item" onclick="openPlan()">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <path d="M16 2v4"/>
                <path d="M8 2v4"/>
                <path d="M3 10h18"/>
              </svg>
            </div>
            <div class="service-name">看计划</div>
          </div>
          <div class="service-item" onclick="openRecordTask()">
            <div class="service-icon orange">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </div>
            <div class="service-name">记农事</div>
          </div>
          <div class="service-item" onclick="openPatrol()">
            <div class="service-icon blue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </div>
            <div class="service-name">巡果园</div>
          </div>
          <div class="service-item" onclick="openDrawPlot()">
            <div class="service-icon cyan">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/>
                <rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/>
              </svg>
            </div>
            <div class="service-name">画地块</div>
          </div>
          <div class="service-item" onclick="openMap()">
            <div class="service-icon purple">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
                <line x1="8" y1="2" x2="8" y2="18"/>
                <line x1="16" y1="6" x2="16" y2="22"/>
              </svg>
            </div>
            <div class="service-name">看地图</div>
          </div>
        </div>
      </div>

      <!-- 设备管理 -->
      <div class="service-category">
        <div class="category-title device">设备管理</div>
        <div class="service-grid">
          <div class="service-item" onclick="openDevice()">
            <div class="service-icon blue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="12" y="2" width="8" height="14" rx="2"/>
                <line x1="8" y1="2" x2="8" y2="18"/>
                <line x1="16" y1="18" x2="20" y2="18"/>
                <line x1="16" y1="22" x2="20" y2="22"/>
                <line x1="2" y1="6" x2="12" y2="6"/>
                <line x1="2" y1="10" x2="12" y2="10"/>
                <line x1="2" y1="14" x2="12" y2="14"/>
              </svg>
            </div>
            <div class="service-name">看设备</div>
          </div>
          <div class="service-item" onclick="openTroubleshoot()">
            <div class="service-icon red">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </div>
            <div class="service-name">查故障</div>
          </div>
          <div class="service-item" onclick="openDrone()">
            <div class="service-icon cyan">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 19 21 12 17 5 21 12 2"/>
              </svg>
            </div>
            <div class="service-name">无人机巡园</div>
          </div>
          <div class="service-item" onclick="openVR()">
            <div class="service-icon gradient">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="10" rx="2"/>
                <circle cx="8" cy="12" r="2"/>
                <circle cx="16" cy="12" r="2"/>
                <path d="M2 12v5"/>
                <path d="M22 12v5"/>
              </svg>
            </div>
            <div class="service-name">VR全景</div>
          </div>
        </div>
      </div>

      <!-- 模型预测 -->
      <div class="service-category">
        <div class="category-title model">模型预测</div>
        <div class="service-grid">
          <div class="service-item" onclick="openGrowth()">
            <div class="service-icon green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 20h18"/>
                <path d="M6 20v-6"/>
                <path d="M12 20V8"/>
                <path d="M18 20v-9"/>
                <path d="M18 11l3-3-3-3"/>
              </svg>
            </div>
            <div class="service-name">生长预测</div>
          </div>
          <div class="service-item" onclick="openWeatherPredict()">
            <div class="service-icon blue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.5 19a4.5 4.5 0 1 0-1.24-8.82A7 7 0 1 0 5 17.7"/>
                <path d="M8 19h9"/>
              </svg>
            </div>
            <div class="service-name">气象预测</div>
          </div>
          <div class="service-item" onclick="openPestRisk()">
            <div class="service-icon red">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </div>
            <div class="service-name">病虫害预测</div>
          </div>
          <div class="service-item" onclick="openYield()">
            <div class="service-icon yellow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3v18h18"/>
                <path d="M7 15l4-4 3 3 5-6"/>
              </svg>
            </div>
            <div class="service-name">产量预测</div>
          </div>
          <div class="service-item" onclick="openPrice()">
            <div class="service-icon orange">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z"/>
                <circle cx="7" cy="7" r="1.5"/>
              </svg>
            </div>
            <div class="service-name">价格预测</div>
          </div>
        </div>
      </div>

      <!-- 领用管理 -->
      <div class="service-category">
        <div class="category-title supply">领用管理</div>
        <div class="service-grid">
          <div class="service-item" onclick="openMaterial()">
            <div class="service-icon cyan">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <path d="M3 9h18"/>
                <path d="M9 21V9"/>
              </svg>
            </div>
            <div class="service-name">领农资</div>
          </div>
          <div class="service-item" onclick="openLabel()">
            <div class="service-icon yellow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                <path d="M7 7h.01"/>
              </svg>
            </div>
            <div class="service-name">领标签</div>
          </div>
        </div>
      </div>

      <!-- 营销管理 -->
      <div class="service-category">
        <div class="category-title marketing">营销管理</div>
        <div class="service-grid">
          <div class="service-item" onclick="openAdoption()">
            <div class="service-icon green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </div>
            <div class="service-name">云认养</div>
          </div>
        </div>
      </div>

      <!-- 其他服务 -->
      <div class="service-category">
        <div class="category-title feedback">其他服务</div>
        <div class="service-grid">
          <div class="service-item" onclick="openFeedback()">
            <div class="service-icon yellow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </div>
            <div class="service-name">跟反馈</div>
          </div>
          <div class="service-item" onclick="openExpert()">
            <div class="service-icon green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <div class="service-name">问专家</div>
          </div>
          <div class="service-item" onclick="openDisease()">
            <div class="service-icon red">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </div>
            <div class="service-name">识病虫</div>
          </div>
        </div>
      </div>

    </div>

    <div class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>服务</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_ai_assistant.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        <span>AI</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>地块</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <div class="mb-modal-overlay" id="modal">
    <div class="mb-modal">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="modal-title" id="modalTitle">提交成功</div>
      <button class="modal-btn" onclick="closeModal()">确 定</button>
    </div>
  </div>

  <script>
    /* 服务入口注册表：服务中心跳转意图（含目标页）→ 真实可用的导航 + 最近使用记录 */
    var SERVICE_MAP = {
      plan:         { label: '看计划',     target: 'mb_plan.html',            icon: 'green' },
      record:       { label: '记农事',     target: 'mb_record_task.html',     icon: 'orange' },
      patrol:       { label: '巡果园',     target: 'mb_patrol.html',          icon: 'blue' },
      draw:         { label: '画地块',     target: 'mb_draw_plot.html',       icon: 'cyan' },
      map:          { label: '看地图',     target: 'mb_map.html',             icon: 'purple' },
      device:       { label: '看设备',     target: 'mb_device.html',          icon: 'blue' },
      troubleshoot: { label: '查故障',     target: 'mb_troubleshoot.html',    icon: 'red' },
      drone:        { label: '无人机巡园', target: 'mb_drone_patrol.html',    icon: 'cyan' },
      vr:           { label: 'VR全景',     target: 'vr_panorama.html',        icon: 'gradient' },
      growth:       { label: '生长预测',   target: 'mb_growth.html',          icon: 'green' },
      weather:      { label: '气象预测',   target: 'mb_weather_predict.html', icon: 'blue' },
      pest:         { label: '病虫害预测', target: 'mb_pest_risk.html',       icon: 'red' },
      yield:        { label: '产量预测',   target: 'mb_yield.html',           icon: 'yellow' },
      price:        { label: '价格预测',   target: 'mb_price.html',           icon: 'orange' },
      material:     { label: '领农资',     target: 'mb_material.html',        icon: 'cyan' },
      label:        { label: '领标签',     target: 'mb_label.html',           icon: 'yellow' },
      adoption:     { label: '云认养',     target: 'mb_adoption.html',        icon: 'green' },
      feedback:     { label: '跟反馈',     target: 'mb_feedback.html',        icon: 'yellow' },
      expert:       { label: '问专家',     target: 'mb_expert.html',          icon: 'green' },
      disease:      { label: '识病虫',     target: 'mb_disease.html',         icon: 'red' }
    };

    var RECENT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>';

    function navigateTo(page) { window.location.href = page; }
    function goBack() { window.history.back(); }

    /* 记录"用户从服务中心点了什么"，作为最近使用数据源 */
    function openService(code) {
      var s = SERVICE_MAP[code];
      if (!s) { MobileStore.toast('该服务暂不可用', 'warning'); return; }
      MobileStore.upsert(MobileStore.KEYS.serviceAction, {
        id: code, code: code, label: s.label, target: s.target, icon: s.icon,
        lastUsed: Date.now(), lastUsedText: MobileStore.fmtTime(Date.now())
      });
      MobileStore.toast('正在打开 · ' + s.label, 'info');
      setTimeout(function () { navigateTo(s.target); }, 150);
    }

    function renderRecent() {
      var cat = document.getElementById('recentCategory');
      var grid = document.getElementById('recentGrid');
      if (!cat || !grid) return;
      var list = MobileStore.list(MobileStore.KEYS.serviceAction)
        .filter(function (x) { return x && x.code && SERVICE_MAP[x.code]; })
        .sort(function (a, b) { return (b.lastUsed || 0) - (a.lastUsed || 0); })
        .slice(0, 8);
      if (!list.length) { cat.style.display = 'none'; return; }
      cat.style.display = '';
      grid.innerHTML = list.map(function (x) {
        var s = SERVICE_MAP[x.code];
        return '<div class="service-item" onclick="openService(\'' + x.code + '\')">' +
          '<div class="service-icon ' + s.icon + '">' + RECENT_ICON + '</div>' +
          '<div class="service-name">' + s.label + '</div>' +
          '</div>';
      }).join('');
    }

    function openModal(title) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modal').classList.add('show');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    function openRecordTask() { openService('record'); }
    function openPatrol() { openService('patrol'); }
    function openDrawPlot() { openService('draw'); }
    function openMap() { openService('map'); }
    function openDevice() { openService('device'); }
    function openFeedback() { openService('feedback'); }
    function openGrowth() { openService('growth'); }
    function openWeatherPredict() { openService('weather'); }
    function openPestRisk() { openService('pest'); }
    function openYield() { openService('yield'); }
    function openPrice() { openService('price'); }
    function openExpert() { openService('expert'); }
    function openDisease() { openService('disease'); }
    function openTroubleshoot() { openService('troubleshoot'); }
    function openMaterial() { openService('material'); }
    function openLabel() { openService('label'); }
    function openPlan() { openService('plan'); }
    function openDrone() { openService('drone'); }
    function openVR() { openService('vr'); }
    function openAdoption() { openService('adoption'); }
    function openNewsDetail() { openModal('资讯详情'); }

    document.addEventListener('DOMContentLoaded', function () {
      renderRecent();
      MobileStore.subscribe(renderRecent);
    });
  </script>
</body>
</html>
