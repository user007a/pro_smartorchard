<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 服务</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <style>
    /* Content */
    .content { padding: var(--space-4); padding-bottom: 80px; }
    
    /* Card */
    .card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      margin-bottom: var(--space-4);
      padding: var(--space-4);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    
    .card-title {
      font-size: var(--font-md);
      font-weight: 600;
      color: var(--text);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    
    .card-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background: var(--primary);
      border-radius: 2px;
    }
    
    /* Service Grid */
    .service-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: var(--space-2);
    }
    
    .service-category {
      margin-bottom: var(--space-4);
    }
    
    .category-title {
      font-size: var(--font-sm);
      font-weight: 600;
      color: var(--text);
      margin-bottom: var(--space-3);
      padding-left: var(--space-2);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    
    .category-title::before {
      content: '';
      width: 4px;
      height: 16px;
      border-radius: 2px;
    }
    
    .category-title.farming::before { background: var(--success); }
    .category-title.device::before { background: var(--info); }
    .category-title.model::before { background: var(--purple); }
    .category-title.supply::before { background: var(--warning); }
    .category-title.feedback::before { background: var(--danger); }
    .category-title.marketing::before { background: var(--primary); }
    
    .service-item {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative;
      aspect-ratio: 1;
    }
    
    .service-item:active {
      transform: scale(0.96);
      box-shadow: var(--shadow-sm);
    }
    
    .service-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .service-icon svg { width: 22px; height: 22px; }
    
    .service-icon.green { background: var(--success-bg); color: var(--success); }
    .service-icon.orange { background: var(--orange-bg); color: var(--orange); }
    .service-icon.blue { background: var(--info-bg); color: var(--info); }
    .service-icon.red { background: var(--danger-bg); color: var(--danger); }
    .service-icon.purple { background: var(--purple-bg); color: var(--purple); }
    .service-icon.cyan { background: #e8f8f5; color: #1abc9c; }
    .service-icon.yellow { background: var(--warning-bg); color: var(--warning); }
    .service-icon.gradient { background: linear-gradient(135deg, var(--sky-500), var(--sky-700)); color: var(--bg-white); }
    
    .service-name {
      font-size: var(--font-xs);
      color: var(--text);
      text-align: center;
      line-height: 1.3;
      white-space: nowrap;
    }
    
    .service-badge {
      position: absolute;
      top: var(--space-1);
      right: var(--space-1);
      min-width: 16px;
      height: 16px;
      background: var(--danger);
      color: var(--bg-white);
      border-radius: var(--radius-full);
      font-size: var(--font-xs);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    
    /* Expert Card */
    .expert-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-3);
      margin-bottom: var(--space-3);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
    }
    
    .expert-header { display: flex; align-items: center; gap: var(--space-3); }
    
    .expert-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .expert-avatar svg { width: 24px; height: 24px; color: var(--primary); }
    
    .expert-info { flex: 1; }
    
    .expert-name { font-size: var(--font-sm); font-weight: 600; color: var(--text); }
    
    .expert-title { font-size: var(--font-xs); color: var(--text-secondary); }
    
    .expert-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: var(--space-2);
    }
    
    .expert-tag {
      padding: 2px 8px;
      background: var(--gray-100);
      border-radius: var(--radius-full);
      font-size: var(--font-xs);
      color: var(--text-secondary);
    }
    
    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: none; justify-content: center; align-items: center; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius-lg); padding: 24px 20px; width: 85%; max-width: 320px; }
    .modal-title { font-size: 16px; font-weight: 600; text-align: center; margin-bottom: 16px; }
    .modal-btn { width: 100%; height: 44px; background: var(--primary); color: #fff; border: none; border-radius: 22px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .success-icon { width: 56px; height: 56px; margin: 0 auto 16px; background: #e8f5ec; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .success-icon svg { width: 32px; height: 32px; color: #22a84a; }
  </style>
</head>
<body>
  <div class="mb-app">
    <div class="mb-header">
      <div class="mb-header-back">

    <div class="content">

          <div class="service-item" onclick="openMap()">

      <!-- 设备管理 -->

        <div class="service-grid">

                <rect x="12" y="2" width="8" height="14" rx="2"/>

                <line x1="16" y1="18" x2="20" y2="18"/>
                <line x1="16" y1="22" x2="20" y2="22"/>

          <div class="service-item" onclick="openTroubleshoot()">

                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </div>
            <div class="service-name">查故障</div>
          </div>
          <div class="service-item" onclick="openDrone()">
            <div class="service-icon cyan">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 19 21 12 17 5 21 12 2"/>
              </svg>
            </div>
            <div class="service-name">无人机巡园</div>
          </div>
          <div class="service-item" onclick="openVR()">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="10" rx="2"/>
                <circle cx="8" cy="12" r="2"/>
                <circle cx="16" cy="12" r="2"/>

                <path d="M22 12v5"/>

            </div>

      <!-- 模型管理 -->

        <div class="category-title model">模型管理</div>
        <div class="service-grid">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

              </svg>
            </div>

          </div>
          <div class="service-item" onclick="openExpert()">
            <div class="service-icon green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <div class="service-name">问专家</div>
          </div>
          <div class="service-item" onclick="openDisease()">
            <div class="service-icon red">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </div>
            <div class="service-name">识病虫</div>
          </div>
        </div>
      </div>

      <!-- 领用管理 -->
      <div class="service-category">
        <div class="category-title supply">领用管理</div>
        <div class="service-grid">
          <div class="service-item" onclick="openMaterial()">
            <div class="service-icon cyan">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <path d="M3 9h18"/>
                <path d="M9 21V9"/>
              </svg>
            </div>
            <div class="service-name">领农资</div>
          </div>
          <div class="service-item" onclick="openLabel()">
            <div class="service-icon yellow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                <path d="M7 7h.01"/>
              </svg>
            </div>
            <div class="service-name">领标签</div>
          </div>
        </div>
      </div>

      <!-- 反馈管理 -->
      <div class="service-category">
        <div class="category-title feedback">反馈管理</div>
        <div class="service-grid">
          <div class="service-item" onclick="openFeedback()">
            <div class="service-icon yellow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </div>
            <div class="service-name">跟反馈</div>
          </div>
        </div>
      </div>

      <!-- 营销管理 -->
      <div class="service-category">
        <div class="category-title marketing">营销管理</div>
        <div class="service-grid">
          <div class="service-item" onclick="openAdoption()">
            <div class="service-icon green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </div>
            <div class="service-name">云认养</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">推荐专家</div>
        <div class="expert-card">
          <div class="expert-header">
            <div class="expert-avatar">

            </div>
          </div>
          <div class="expert-tags">
            <span class="expert-tag">苹果栽培</span>
            <span class="expert-tag">病虫害防治</span>

          </div>
        </div>
        <div class="expert-card">
          <div class="expert-header">
            <div class="expert-avatar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <div class="expert-info">
              <div class="expert-name">李农艺师</div>
              <div class="expert-title">资深苹果种植专家</div>
            </div>
          </div>
          <div class="expert-tags">
            <span class="expert-tag">物候期管理</span>
            <span class="expert-tag">水肥一体化</span>
            <span class="expert-tag">采收技术</span>

    <div class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('mb_home.html')">

          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>

        <span>首页</span>
      </div>
      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>

        </svg>

      <div class="mb-tab-item" onclick="navigateTo('mb_mine.html')">

  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="modal-title" id="modalTitle">提交成功</div>
      <button class="modal-btn" onclick="closeModal()">确 定</button>
    </div>
  </div>

  <script>
    function navigateTo(page) {
      window.location.href = page;
    }
    function goBack() {
      window.history.back();
    }
    function openModal(title) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modal').classList.add('show');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }
    function openRecordTask() {
      localStorage.setItem('serviceAction', 'record');
      navigateTo('mb_record_task.html');
    }
    function openPatrol() {
      localStorage.setItem('serviceAction', 'patrol');
      navigateTo('mb_patrol.html');
    }
    function openDrawPlot() {
      localStorage.setItem('serviceAction', 'draw');
      navigateTo('mb_draw_plot.html');
    }
    function openMap() {
      localStorage.setItem('serviceAction', 'map');
      navigateTo('mb_map.html');
    }
    function openDevice() {
      localStorage.setItem('serviceAction', 'device');
      navigateTo('mb_device.html');
    }
    function openFeedback() {
      localStorage.setItem('serviceAction', 'feedback');
      navigateTo('mb_feedback.html');
    }
    function openModel() {
