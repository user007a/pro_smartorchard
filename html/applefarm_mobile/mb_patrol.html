<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 巡果园</title>
  <!-- H5设计系统 v2 — Supabase × Airbnb × Notion 混合设计基因 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <script src="js/mobile-store.js"></script>
  <style>
    /* ========== 页面专属样式（仅保留设计系统未覆盖的部分） ========== */
    
    /* --- 状态统计卡片 --- */
    .patrol-stats {
      display: flex;
      justify-content: space-around;
      padding: var(--space-4);
      background: var(--bg-white);
      margin: var(--space-3);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }
    .patrol-stats-item { text-align: center; }
    .patrol-stats-value {
      font-size: var(--font-2xl);
      font-weight: var(--font-extrabold);
      color: var(--primary);
      font-family: var(--font-family-number);
    }
    .patrol-stats-label {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* --- 地图区域 --- */
    .map-area {
      margin: 0 var(--space-3);
      height: 280px;
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }
    .map-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
    }
    .map-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--info-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .map-icon svg { width: 36px; height: 36px; color: var(--info-dark); }
    .map-text { font-size: var(--font-sm); color: var(--text-secondary); }

    .map-grid {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(46,158,90,0.1) 1px, transparent 1px), 
        linear-gradient(90deg, rgba(46,158,90,0.1) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    .checkpoint-marker {
      position: absolute;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .checkpoint-marker.current { animation: pulse 2s infinite; }
    .checkpoint-marker.done { background: var(--success); }
    .checkpoint-marker svg { width: 18px; height: 18px; color: var(--bg-white); }

    .checkpoint-label {
      position: absolute;
      top: 100%; left: 50%;
      transform: translateX(-50%);
      font-size: var(--font-xs);
      color: var(--text-secondary);
      white-space: nowrap;
      margin-top: 4px;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(243,156,18,0.7); }
      70% { box-shadow: 0 0 0 10px rgba(243,156,18,0); }
      100% { box-shadow: 0 0 0 0 rgba(243,156,18,0); }
    }

    .user-marker {
      position: absolute;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--info);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bounce 1s infinite;
    }
    .user-marker svg { width: 20px; height: 20px; color: var(--bg-white); }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* --- 打卡弹窗：弹窗容器已迁移到统一弹窗组件 .mb-modal.is-sm --- */
    .checkin-icon {
      width: 64px; height: 64px;
      margin: 0 auto var(--space-4);
      border-radius: 50%;
      background: var(--success-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .checkin-icon svg { width: 36px; height: 36px; color: var(--success); }

    .checkin-title {
      font-size: var(--font-lg);
      font-weight: var(--font-semibold);
      text-align: center;
      margin-bottom: var(--space-2);
      color: var(--text);
    }
    .checkin-desc {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: var(--space-5);
    }
    .checkin-btn {
      width: 100%; height: 48px;
      background: var(--gradient-primary);
      color: var(--text-on-primary);
      border: none;
      border-radius: var(--radius-full);
      font-size: var(--font-base);
      font-weight: var(--font-semibold);
      cursor: pointer;
      transition: all var(--transition-fast);
      min-height: 44px;
    }
    .checkin-btn:active { transform: scale(0.98); }

    /* --- 打卡列表项增强 --- */
    .mb-list-item.checkpoint-item {
      min-height: 56px;
    }
    .checkpoint-status {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .checkpoint-status svg { width: 14px; height: 14px; }
    .checkpoint-status.pending { background: var(--gray-200); }
    .checkpoint-status.pending svg { color: var(--text-tertiary); }
    .checkpoint-status.current { background: var(--orange); }
    .checkpoint-status.current svg { color: var(--bg-white); }
    .checkpoint-status.done { background: var(--success); }
    .checkpoint-status.done svg { color: var(--bg-white); }

    .checkpoint-distance {
      font-size: var(--font-xs);
      color: var(--text-tertiary);
      margin-top: 2px;
    }
    .checkpoint-time {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    /* --- 异常上报按钮 --- */
    .report-btn {
      width: 100%; height: 48px;
      background: var(--bg-white);
      border: 2px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      cursor: pointer;
      transition: all var(--transition-fast);
      min-height: 44px;
    }
    .report-btn:active {
      border-color: var(--error);
      background: var(--error-light);
    }
    .report-btn svg { width: 24px; height: 24px; color: var(--error); }
    .report-text { font-size: var(--font-base); color: var(--text); font-weight: var(--font-medium); }

    /* Modal 通用：已迁移到统一弹窗组件 .mb-modal-overlay.is-sheet / .mb-modal.is-sheet */
    .modal-close {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--gray-100);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .modal-close:active { transform: scale(0.95); }
    .modal-close svg { width: 18px; height: 18px; color: var(--text-secondary); }

    .form-label {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: var(--space-2);
      display: block;
    }

    .photo-upload {
      width: 100%; height: 160px;
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .photo-upload.has-photo {
      border-style: solid;
      border-color: var(--error);
      background: var(--error-light);
    }
    .photo-upload svg { width: 32px; height: 32px; color: var(--text-tertiary); }
    .photo-upload.has-photo svg { color: var(--error); }
    .photo-text { font-size: var(--font-sm); color: var(--text-secondary); }

    .type-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-2);
    }
    .type-item {
      padding: var(--space-3);
      background: var(--gray-100);
      border-radius: var(--radius-md);
      border: 2px solid transparent;
      cursor: pointer;
      text-align: center;
      transition: all var(--transition-fast);
      min-height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .type-item.active {
      background: var(--error-light);
      border-color: var(--error);
    }
    .type-item svg { width: 24px; height: 24px; margin-bottom: 6px; }
    .type-item.pest svg { color: var(--error); }
    .type-item.device svg { color: var(--warning); }
    .type-item.other svg { color: var(--info); }
    .type-name { font-size: var(--font-xs); color: var(--text); }

    .remark-input {
      width: 100%; min-height: 80px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      font-size: var(--font-sm);
      color: var(--text);
      font-family: var(--font-family);
      resize: none;
      transition: all var(--transition-fast);
    }
    .remark-input:focus {
      outline: none;
      border-color: var(--error);
    }

    /* 离开确认弹窗：保留特有内容样式（图标/标题/按钮） */
    .leave-icon {
      width: 64px; height: 64px;
      margin: 0 auto var(--space-4);
      border-radius: 50%;
      background: var(--warning-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .leave-icon svg { width: 32px; height: 32px; color: var(--warning); }
    
    .leave-title {
      font-size: var(--font-lg);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-2);
    }
    
    .leave-desc {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: var(--space-5);
    }
    
    .leave-buttons {
      display: flex;
      gap: var(--space-3);
    }
    
    .leave-btn {
      flex: 1;
      height: 44px;
      border-radius: var(--radius-lg);
      font-size: var(--font-base);
      font-weight: var(--font-medium);
      border: none;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .leave-btn.cancel {
      background: var(--gray-100);
      color: var(--text-secondary);
    }
    
    .leave-btn.confirm {
      background: var(--gradient-primary);
      color: var(--text-on-primary);
    }
    
    .leave-btn:active { transform: scale(0.98); }

    /* --- 基地切换（巡园路线按基地隔离，L-12） --- */
    .base-bar {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin: var(--space-3);
      padding: var(--space-3) var(--space-4);
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }
    .base-bar-label {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .base-bar-select {
      flex: 1;
      min-width: 0;
      height: 36px;
      padding: 0 var(--space-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-white);
      color: var(--text-secondary);
      font-size: var(--font-sm);
      font-family: inherit;
    }
    .base-bar-select:disabled { opacity: 0.6; }

    /* --- 底部提示 --- */
    .footer-tip {
      padding: var(--space-4);
      text-align: center;
      font-size: var(--font-xs);
      color: var(--text-tertiary);
      padding-bottom: var(--space-8);
    }
  </style>
</head>
<body>
  <div class="mb-app">
    <!-- 详情页型 Header -->
    <div class="mb-header-detail">
      <div class="header-nav">
        <div class="header-back" onclick="goBack()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </div>
        <div class="header-title">巡果园</div>
        <div class="header-actions">
          <div class="header-action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
              <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
            </svg>
          </div>
        </div>
      </div>
      <div class="header-content">
        <div class="header-sub" id="routeSubtitle">今日路线：A区 → B区 → C区</div>
      </div>
    </div>

    <!-- 基地切换：巡园路线按基地隔离（L-12） -->
    <div class="base-bar">
      <span class="base-bar-label">当前基地</span>
      <select class="base-bar-select" id="baseSelect" onchange="onBaseChange()"></select>
    </div>

    <!-- 状态统计 -->
    <div class="patrol-stats">
      <div class="patrol-stats-item">
        <div class="patrol-stats-value" id="statTotal">3</div>
        <div class="patrol-stats-label">总打卡点</div>
      </div>
      <div class="patrol-stats-item">
        <div class="patrol-stats-value" id="statDone">1</div>
        <div class="patrol-stats-label">已完成</div>
      </div>
      <div class="patrol-stats-item">
        <div class="patrol-stats-value" id="statPending">2</div>
        <div class="patrol-stats-label">待打卡</div>
      </div>
    </div>

    <!-- 离线同步状态栏（F-282） -->
    <div id="syncBar"></div>

    <!-- 异常照片：真实拍摄 -->
    <input type="file" id="reportPhotoInput" accept="image/*" capture="environment" hidden>

    <!-- 地图区域 -->
    <div class="map-area">
      <div class="map-grid"></div>
      <div class="map-placeholder"><iframe src="https://www.openstreetmap.org/export/embed.html?bbox=106.05%2C34.20%2C106.30%2C34.50&layer=mapnik&marker=34.35%2C106.18" style="width:100%;height:100%;border:0;" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="天水市麦积区 红崖村花牛苹果基地地图"></iframe></div>
      <!-- 打卡点标记（按 mb_patrol_routes 动态渲染） -->
      <div id="mapMarkers"></div>
      <!-- 用户位置标记 -->
      <div class="user-marker" style="top: 45%; left: 48%;" id="userMarker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </div>
    </div>

    <!-- 打卡提示弹窗 -->
    <div class="mb-modal-overlay" id="checkinPopup">
      <div class="mb-modal is-sm">
        <div class="checkin-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8m6-2v8m6-8l2 8m-6 4l2-8h8l2 8M3 20l6-6m6 6l6-6"/>
          </svg>
        </div>
        <div class="checkin-title" id="checkinTitle">到达打卡点</div>
        <div class="checkin-desc" id="checkinDesc">正在获取位置…</div>
        <button class="checkin-btn" onclick="checkin()">一键打卡</button>
      </div>
    </div>

    <!-- 打卡列表（按 mb_patrol_routes 动态渲染） -->
    <div class="mb-section">
      <div class="mb-section-title"><span class="mb-section-dot"></span>巡园路线</div>
      <div class="mb-list" id="checkpointList"></div>
      <div id="checkpointEmpty" class="footer-tip" style="display:none;">当前基地暂无启用的巡园路线</div>
    </div>

    <!-- 异常上报 -->
    <div class="mb-section">
      <div class="mb-section-title"><span class="mb-section-dot"></span>异常上报</div>
      <div class="report-btn" onclick="openReportModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v6m0 6v6m4.6-13H7.4M21 12h-6"/>
        </svg>
        <span class="report-text">发现异常，立即上报</span>
      </div>
    </div>

    <!-- 底部提示 -->
    <div class="footer-tip">
      提示：到达各打卡点各自配置的就近半径内将自动弹出打卡提示
    </div>
  </div>

  <!-- 异常上报弹窗 -->
  <div class="mb-modal-overlay is-sheet" id="reportModal">
    <div class="mb-modal is-sheet">
      <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-5);">
        <div style="font-size:var(--font-lg);font-weight:var(--font-semibold);color:var(--text);">上报异常</div>
        <div class="modal-close" onclick="closeReportModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </div>
      </div>

      <div class="form-group" style="margin-bottom:var(--space-4);">
        <div class="form-label">拍摄异常照片</div>
        <div class="photo-upload" id="reportPhoto" onclick="uploadPhoto()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
          <div class="photo-text">点击拍照上传</div>
        </div>
      </div>

      <div class="form-group" style="margin-bottom:var(--space-4);">
        <div class="form-label">选择异常类型</div>
        <div class="type-grid">
          <div class="type-item pest" onclick="selectReportType('病虫害')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <div class="type-name">病虫害</div>
          </div>
          <div class="type-item device" onclick="selectReportType('设备故障')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="12" y="2" width="8" height="14" rx="2"/>
              <line x1="8" y1="2" x2="8" y2="18"/>
              <line x1="16" y1="18" x2="20" y2="18"/>
            </svg>
            <div class="type-name">设备故障</div>
          </div>
          <div class="type-item other" onclick="selectReportType('其他')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="12" cy="12" r="4"/>
              <circle cx="12" cy="12" r="2"/>
            </svg>
            <div class="type-name">其他</div>
          </div>
        </div>
      </div>

      <div class="form-group" style="margin-bottom:var(--space-4);">
        <div class="form-label">备注说明</div>
        <textarea class="remark-input" placeholder="请描述异常情况..." id="reportRemark"></textarea>
      </div>

      <button class="mb-btn mb-btn-block" style="background:var(--error);color:var(--text-on-primary);border-radius:var(--radius-full);" onclick="submitReport()">确认上报</button>
    </div>
  </div>

  <!-- 成功提示弹窗 -->
  <div class="mb-modal-overlay" id="successModal">
    <div class="mb-modal is-sm">
      <div class="checkin-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="checkin-title" style="color: var(--primary);">上报成功</div>
      <div class="checkin-desc">异常信息已提交，将尽快处理</div>
      <button class="checkin-btn" onclick="closeSuccessModal()">确 定</button>
    </div>
  </div>

  <!-- 离开确认弹窗 -->
  <div class="mb-modal-overlay" id="leaveModal">
    <div class="mb-modal">
      <div class="leave-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </div>
      <div class="leave-title">确认离开</div>
      <div class="leave-desc">您还有 <span style="color: var(--warning); font-weight: 600;">2</span> 个打卡点未完成，确定要退出吗？</div>
      <div class="leave-buttons">
        <button class="leave-btn cancel" onclick="cancelLeave()">留在页面</button>
        <button class="leave-btn confirm" onclick="confirmLeave()">确认离开</button>
      </div>
    </div>
  </div>

  <script>
    var reportType = '';
    var reportPhoto = null;

    /* ---------- 打卡点数据源：mb_patrol_routes（后台「巡园路线配置」写入） ---------- */
    var ROUTE_KEY = 'mb_patrol_routes';
    var BASE_KEY = 'mb_patrol_base';   // 当前选中基地（本机记忆，L-12）
    var NEAR_THRESHOLD = 100;   // 米，点位未配置 nearRadius 时的默认就近范围

    /* 读不到路线数据时的硬编码兜底（保证页面功能不退化） */
    var FALLBACK_POINTS = [
      { id: 'A1', name: 'A1区 - 主入口',   lat: 34.34900, lng: 106.18000, nearRadius: 100, required: true, status: 'done',    time: '09:15' },
      { id: 'B1', name: 'B1区 - 果园中部', lat: 34.35200, lng: 106.18365, nearRadius: 100, required: true, status: 'pending', time: '' },
      { id: 'C1', name: 'C1区 - 仓库附近', lat: 34.35500, lng: 106.18600, nearRadius: 100, required: true, status: 'pending', time: '' }
    ];

    var CHECKPOINTS = [];       // 当前生效的打卡点（由路线数据生成）
    var currentRouteName = '';  // 当前路线名称
    var routeBases = [];        // 后台路线中出现的全部基地（去重）
    var currentBase = '';       // 当前选中基地（L-12）

    var currentPos = null;      // 当前定位
    var tracker = null;         // 轨迹采集句柄
    var trackPoints = [];       // 本次巡园轨迹
    var popupCp = null;         // 打卡弹窗对应的打卡点
    var popupShown = {};        // 已弹过窗的打卡点，避免重复打扰

    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
      });
    }

    /* 读取后台写入的路线列表；未写入 / 解析失败返回 null */
    function readRoutesRaw() {
      try {
        var raw = localStorage.getItem(ROUTE_KEY);
        if (!raw) return null;
        var v = JSON.parse(raw);
        return Array.isArray(v) ? v : null;
      } catch (e) { return null; }
    }

    /* 取第一条启用且有有效点位的路线（仅在路线未配置基地字段时兼容使用） */
    function pickEnabledRoute(list) {
      for (var i = 0; i < list.length; i++) {
        var r = list[i];
        if (r && r.enabled === true && r.points && r.points.length) return r;
      }
      return null;
    }

    /* ---------- 基地与路线（L-12：巡园路线按基地隔离） ---------- */
    function readSavedBase() {
      try { return localStorage.getItem(BASE_KEY) || ''; } catch (e) { return ''; }
    }

    function saveBase(b) {
      try { if (b) localStorage.setItem(BASE_KEY, b); } catch (e) { /* 忽略 */ }
    }

    /* 从全部路线按 base 去重聚合基地（不限启用状态，便于用户看到完整可选项） */
    function collectBases(list) {
      var seen = {}, out = [];
      list.forEach(function (r) {
        var b = (r && r.base) ? String(r.base) : '';
        if (b && !seen[b]) { seen[b] = 1; out.push(b); }
      });
      return out;
    }

    /* 取指定基地下首条启用且有有效点位的路线 */
    function pickRouteForBase(list, base) {
      for (var i = 0; i < list.length; i++) {
        var r = list[i];
        if (r && String(r.base || '') === base && r.enabled === true && r.points && r.points.length) return r;
      }
      return null;
    }

    /* 路线点位 → 打卡点（按 order 升序） */
    function mapRoutePoints(points) {
      return points.slice().sort(function (a, b) {
        return (Number(a.order) || 0) - (Number(b.order) || 0);
      }).map(function (p) {
        var radius = Number(p.nearRadius);
        return {
          id: String(p.id),
          name: p.name || p.id,
          lat: Number(p.lat),
          lng: Number(p.lng),
          nearRadius: (radius > 0) ? radius : NEAR_THRESHOLD,
          required: p.required !== false,
          status: 'pending',
          time: ''
        };
      });
    }

    /* 渲染基地下拉：无基地数据时禁用并提示 */
    function renderBaseSelect() {
      var sel = document.getElementById('baseSelect');
      if (!sel) return;
      if (!routeBases.length) {
        sel.innerHTML = '<option value="">暂无基地数据</option>';
        sel.disabled = true;
        return;
      }
      sel.disabled = false;
      sel.innerHTML = routeBases.map(function (b) {
        return '<option value="' + escHtml(b) + '">' + escHtml(b) + '</option>';
      }).join('');
      sel.value = currentBase;
    }

    /* 切换基地：重新加载该基地的巡园路线 */
    function onBaseChange() {
      var sel = document.getElementById('baseSelect');
      if (!sel) return;
      currentBase = sel.value;
      saveBase(currentBase);
      loadCheckpoints();
      updateRouteSubtitle();
      renderCheckpoints();
    }

    /* 从路线数据生成打卡点；保留已打卡的运行时状态 */
    function loadCheckpoints() {
      // 按「基地 + 点位id」记录旧状态，避免不同基地的同名点位互相串状态
      var prevBase = currentBase;
      var prev = {};
      CHECKPOINTS.forEach(function (cp) { prev[prevBase + '|' + cp.id] = { status: cp.status, time: cp.time }; });

      var list = readRoutesRaw();

      if (list === null) {
        // 读不到数据：沿用硬编码 3 点兜底
        routeBases = [];
        currentBase = '';
        CHECKPOINTS = FALLBACK_POINTS.map(function (p) { return JSON.parse(JSON.stringify(p)); });
        if (!currentRouteName) currentRouteName = 'A区 → B区 → C区';
      } else {
        routeBases = collectBases(list);
        if (!routeBases.length) {
          // 后台路线未配置基地：回退到「取首条启用路线」，保证兼容
          currentBase = '';
          var legacy = pickEnabledRoute(list);
          if (legacy) {
            currentRouteName = legacy.routeName || legacy.routeId || '';
            CHECKPOINTS = mapRoutePoints(legacy.points);
          } else {
            CHECKPOINTS = [];
            currentRouteName = '';
          }
        } else {
          // 优先恢复上次选择的基地，失效时取第一个
          var saved = readSavedBase();
          currentBase = (saved && routeBases.indexOf(saved) !== -1) ? saved : routeBases[0];
          saveBase(currentBase);

          var route = pickRouteForBase(list, currentBase);
          if (route) {
            currentRouteName = route.routeName || route.routeId || '';
            CHECKPOINTS = mapRoutePoints(route.points);
          } else {
            // 该基地无启用路线：尊重后台配置，展示空态
            CHECKPOINTS = [];
            currentRouteName = '';
          }
        }
      }

      // 恢复已打卡状态
      CHECKPOINTS.forEach(function (cp) {
        var rec = prev[currentBase + '|' + cp.id];
        if (rec) { cp.status = rec.status; cp.time = rec.time; }
      });
    }

    /* ---------- 距离计算（Haversine） ---------- */
    function distanceMeters(lat1, lng1, lat2, lng2) {
      var R = 6371000;
      var toRad = function (d) { return d * Math.PI / 180; };
      var dLat = toRad(lat2 - lat1);
      var dLng = toRad(lng2 - lng1);
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
              Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return Math.round(2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function fmtDist(m) {
      return m >= 1000 ? (m / 1000).toFixed(1) + '公里' : m + '米';
    }

    /* ---------- 定位与轨迹采集（F-244） ---------- */
    function startTracking() {
      tracker = MobileStore.track({
        onPoint: function (pt) {
          if (!pt.ok) {
            var first = CHECKPOINTS[0];
            var failEl = first ? document.getElementById('dist' + first.id) : null;
            if (failEl) failEl.textContent = '定位失败：' + (pt.message || '信号弱');
            return;
          }
          currentPos = pt;
          trackPoints = tracker.points.filter(function (p) { return p.ok; });
          refreshDistances();
          maybeAutoPopup();
        }
      });
      // 首次定位兜底：watchPosition 未在 3 秒内回调时用单次定位
      setTimeout(function () {
        if (!currentPos) {
          MobileStore.geolocate().then(function (p) {
            if (currentPos) return;   // 实时定位已到达
            currentPos = { ok: true, lat: p.lat, lng: p.lng, accuracy: p.accuracy, at: new Date().toISOString() };
            refreshDistances();
            maybeAutoPopup();
          });
        }
      }, 3000);
    }

    function refreshDistances() {
      if (!currentPos) return;
      var nearest = null;
      CHECKPOINTS.forEach(function (cp) {
        var el = document.getElementById('dist' + cp.id);
        var d = distanceMeters(currentPos.lat, currentPos.lng, cp.lat, cp.lng);
        cp._dist = d;
        if (el) {
          if (cp.status === 'done') {
            el.textContent = '已完成 · 打卡时间：' + (cp.time || '');
          } else if (d <= cp.nearRadius) {
            el.textContent = '距离' + fmtDist(d) + '，已进入打卡范围';
          } else {
            el.textContent = '距离' + fmtDist(d) + '，请前往打卡';
          }
        }
        // 点位标记文案同步
        var ml = document.querySelector('.checkpoint-marker[data-marker="' + cp.id + '"] .checkpoint-label');
        if (ml) ml.textContent = cp.status === 'done' ? (cp.id + ' ✓') : (cp.id + ' (' + fmtDist(d) + ')');
        if (!nearest || d < nearest._dist) nearest = cp;
      });
      // 真实定位时同步移动用户标记的位置（按最近点位距离近似映射，仅作视觉反馈）
      var um = document.getElementById('userMarker');
      if (um && currentPos) {
        var d0 = nearest ? nearest._dist : 0;
        var left = Math.max(8, Math.min(88, 48 + (d0 / 12)));
        var top = Math.max(8, Math.min(88, 45 + (d0 / 20)));
        um.style.left = left + '%';
        um.style.top = top + '%';
      }
    }

    /** 仅当一个「待打卡」点进入其就近范围时自动弹窗，且同一打卡点只弹一次 */
    function maybeAutoPopup() {
      if (!currentPos) return;
      var target = null;
      CHECKPOINTS.forEach(function (cp) {
        if (cp.status !== 'pending') return;
        if (cp._dist === undefined) return;
        if (cp._dist <= cp.nearRadius && !target) target = cp;
      });
      if (!target || popupShown[target.id]) return;
      popupShown[target.id] = true;
      openCheckinPopup(target);
    }

    function openCheckinPopup(cp) {
      popupCp = cp;
      document.getElementById('checkinTitle').textContent = '到达打卡点';
      document.getElementById('checkinDesc').textContent =
        '您已到达 ' + cp.id + ' 打卡点，距离' + fmtDist(cp._dist || 0) + '，在 ' + cp.nearRadius + ' 米范围内';
      document.getElementById('checkinPopup').classList.add('show');
      MobileStore.toast('已进入 ' + cp.id + ' 打卡范围', 'info');
    }

    /* ---------- 打卡 ---------- */
    function checkin() {
      var cp = popupCp;
      document.getElementById('checkinPopup').classList.remove('show');
      if (!cp) return;
      var now = MobileStore.fmtTime(Date.now());
      cp.status = 'done';
      cp.time = now.slice(11);   // HH:mm

      // 写入共享巡查记录，PC 端与大屏均可读到
      var rec = {
        id: 'patrol_' + cp.id + '_' + Date.now(),
        checkpointId: cp.id,
        checkpointName: cp.name,
        lat: currentPos ? currentPos.lat : null,
        lng: currentPos ? currentPos.lng : null,
        accuracy: currentPos ? currentPos.accuracy : null,
        checkinTime: new Date().toISOString(),
        operator: '张建国',
        source: 'mobile',
        distance: cp._dist || 0,
        track: trackPoints.slice()
      };
      MobileStore.push(MobileStore.KEYS.patrol, rec);

      // 入离线同步队列
      MobileStore.enqueue({ id: 'q_' + rec.id, type: 'patrol_checkin', refId: rec.id, payload: rec });

      renderCheckpoints();
      MobileStore.toast('打卡成功，已记录当前位置', 'success');
    }

    /* ---------- 渲染打卡点（列表 + 地图标记） ---------- */
    function renderCheckpointList() {
      var box = document.getElementById('checkpointList');
      var empty = document.getElementById('checkpointEmpty');
      if (!box) return;
      if (!CHECKPOINTS.length) {
        box.innerHTML = '';
        if (empty) empty.style.display = 'block';
        return;
      }
      if (empty) empty.style.display = 'none';
      var curId = nextPendingId();
      box.innerHTML = CHECKPOINTS.map(function (cp) {
        var st = cp.status === 'done' ? 'done' : (cp.id === curId ? 'current' : 'pending');
        var icon = cp.status === 'done'
          ? '<polyline points="20 6 9 17 4 12"/>'
          : '<circle cx="12" cy="12" r="10"/>';
        var timeHtml = cp.status === 'done'
          ? '<div class="checkpoint-time">' + escHtml(cp.time || '') + '</div>'
          : (cp.id === curId ? '<div class="checkpoint-time">当前</div>' : '');
        var reqTip = cp.required ? '' : ' <span style="font-size:10px;color:var(--text-tertiary);">（非必到）</span>';
        var distText = cp.status === 'done'
          ? ('已完成 · 打卡时间：' + escHtml(cp.time || ''))
          : '定位中…';
        return ''
          + '<div class="mb-list-item checkpoint-item" data-cp="' + escHtml(cp.id) + '" data-status="' + st + '">'
          +   '<div class="checkpoint-status ' + st + '">'
          +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + icon + '</svg>'
          +   '</div>'
          +   '<div class="mb-list-content">'
          +     '<div class="mb-list-title">' + escHtml(cp.name) + reqTip + '</div>'
          +     '<div class="checkpoint-distance" id="dist' + escHtml(cp.id) + '">' + distText + '</div>'
          +   '</div>'
          +   timeHtml
          + '</div>';
      }).join('');
      bindCheckpointClicks();
    }

    function renderMarkers() {
      var box = document.getElementById('mapMarkers');
      if (!box) return;
      var n = CHECKPOINTS.length;
      var curId = nextPendingId();
      box.innerHTML = CHECKPOINTS.map(function (cp, i) {
        var left, top;
        if (n > 1) { left = 25 + i * (50 / (n - 1)); top = 30 + i * (40 / (n - 1)); }
        else { left = 50; top = 50; }
        var cls = cp.status === 'done' ? 'done' : (cp.id === curId ? 'current' : '');
        var icon = cp.status === 'done'
          ? '<polyline points="20 6 9 17 4 12"/>'
          : '<circle cx="12" cy="12" r="10"/>';
        return ''
          + '<div class="checkpoint-marker ' + cls + '" data-marker="' + escHtml(cp.id) + '" style="top:' + top.toFixed(2) + '%;left:' + left.toFixed(2) + '%;">'
          +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + icon + '</svg>'
          +   '<div class="checkpoint-label">' + escHtml(cp.id) + '</div>'
          + '</div>';
      }).join('');
    }

    /* 点击路线中的待打卡点可手动打卡（必到点超出范围时二次确认） */
    function bindCheckpointClicks() {
      document.querySelectorAll('.checkpoint-item').forEach(function (item) {
        item.style.cursor = 'pointer';
        item.addEventListener('click', function () {
          var id = item.getAttribute('data-cp');
          var cp = null;
          CHECKPOINTS.forEach(function (c) { if (c.id === id) cp = c; });
          if (!cp || cp.status === 'done') return;
          if (cp.required && cp._dist !== undefined && cp._dist > cp.nearRadius) {
            if (!MobileStore.confirm('当前距离 ' + cp.id + ' ' + fmtDist(cp._dist) +
                '，已超出打卡范围（' + cp.nearRadius + '米）。该点为必到点，仍要打卡吗？（将记录当前实际位置）')) return;
          }
          popupCp = cp;
          checkin();
        });
      });
    }

    function renderCheckpoints() {
      var done = 0;
      CHECKPOINTS.forEach(function (cp) { if (cp.status === 'done') done++; });
      document.getElementById('statTotal').textContent = CHECKPOINTS.length;
      document.getElementById('statDone').textContent = done;
      document.getElementById('statPending').textContent = CHECKPOINTS.length - done;
      renderCheckpointList();
      renderMarkers();
      refreshDistances();
    }

    function updateRouteSubtitle() {
      var el = document.getElementById('routeSubtitle');
      if (!el) return;
      var pointsText = CHECKPOINTS.map(function (cp) { return cp.id; }).join(' → ');
      el.textContent = currentRouteName
        ? ('今日路线：' + currentRouteName + (pointsText ? '（' + pointsText + '）' : ''))
        : '当前基地暂无启用的巡园路线';
    }

    function nextPendingId() {
      for (var i = 0; i < CHECKPOINTS.length; i++) {
        if (CHECKPOINTS[i].status === 'pending') return CHECKPOINTS[i].id;
      }
      return null;
    }

    /* 未完成的必到点数（非必到点不计入离开提醒） */
    function pendingCount() {
      return CHECKPOINTS.filter(function (c) { return c.status === 'pending' && c.required; }).length;
    }

    /* ---------- 离开确认（按真实未打卡数） ---------- */
    function goBack() {
      var left = pendingCount();
      if (left > 0) {
        var tip = document.querySelector('#leaveModal .leave-desc');
        if (tip) tip.innerHTML = '您还有 <span style="color: var(--warning); font-weight: 600;">' + left + '</span> 个必到打卡点未完成，确定要退出吗？';
        document.getElementById('leaveModal').classList.add('show');
      } else {
        window.history.back();
      }
    }

    function cancelLeave() {
      document.getElementById('leaveModal').classList.remove('show');
    }

    function confirmLeave() {
      document.getElementById('leaveModal').classList.remove('show');
      if (tracker) tracker.stop();
      window.history.back();
    }

    /* ---------- 异常上报 ---------- */
    function openReportModal() {
      document.getElementById('reportModal').classList.add('show');
    }

    function closeReportModal() {
      document.getElementById('reportModal').classList.remove('show');
    }

    function uploadPhoto() {
      document.getElementById('reportPhotoInput').click();
    }

    function onReportPhotoPicked(input) {
      var file = input.files && input.files[0];
      if (!file) return;
      if (!file.type || file.type.indexOf('image/') !== 0) {
        MobileStore.toast('请选择图片文件', 'warning');
        return;
      }
      var reader = new FileReader();
      reader.onload = function (e) {
        reportPhoto = e.target.result;
        document.getElementById('reportPhoto').classList.add('has-photo');
        document.getElementById('reportPhoto').style.backgroundImage = 'url(' + e.target.result + ')';
        document.getElementById('reportPhoto').style.backgroundSize = 'cover';
      };
      reader.readAsDataURL(file);
    }

    function selectReportType(type) {
      reportType = type;
      document.querySelectorAll('.type-item').forEach(function (item) {
        item.classList.remove('active');
        if (item.querySelector('.type-name').textContent === type) {
          item.classList.add('active');
        }
      });
    }

    function submitReport() {
      if (!reportPhoto) {
        MobileStore.toast('请先拍摄异常照片', 'warning');
        return;
      }
      if (!reportType) {
        MobileStore.toast('请选择异常类型', 'warning');
        return;
      }
      var rec = {
        id: 'patrolrep_' + Date.now(),
        type: reportType,
        remark: document.getElementById('reportRemark').value || '',
        photo: reportPhoto,
        lat: currentPos ? currentPos.lat : null,
        lng: currentPos ? currentPos.lng : null,
        reportTime: new Date().toISOString(),
        operator: '张建国',
        status: '待处理',
        source: 'mobile'
      };
      MobileStore.push(MobileStore.KEYS.patrol, Object.assign({ kind: 'abnormal' }, rec));
      MobileStore.enqueue({ id: 'q_' + rec.id, type: 'patrol_abnormal', refId: rec.id, payload: rec });

      closeReportModal();
      document.getElementById('successModal').classList.add('show');
      MobileStore.toast('异常已上报', 'success');
    }

    function closeSuccessModal() {
      document.getElementById('successModal').classList.remove('show');
    }

    /* ---------- 初始化 ---------- */
    document.addEventListener('DOMContentLoaded', function () {
      MobileStore.renderSyncBar(document.getElementById('syncBar'));
      document.getElementById('reportPhotoInput').addEventListener('change', function () { onReportPhotoPicked(this); });

      loadCheckpoints();
      renderBaseSelect();
      updateRouteSubtitle();
      renderCheckpoints();
      startTracking();
    });

    // 后台「巡园路线配置」改动后，跨标签页同步刷新
    window.addEventListener('storage', function (e) {
      if (!e || e.key !== ROUTE_KEY) return;
      loadCheckpoints();
      renderBaseSelect();
      updateRouteSubtitle();
      renderCheckpoints();
      if (MobileStore.toast) MobileStore.toast('巡园路线已更新', 'info');
    });

    // 页面关闭时提示未完成打卡（按真实剩余数量）
    window.addEventListener('beforeunload', function (e) {
      if (pendingCount() <= 0) return;
      e.preventDefault();
      e.returnValue = '您还有' + pendingCount() + '个打卡点未完成，确定要退出吗？';
      return e.returnValue;
    });
  </script>
</body>
</html>
