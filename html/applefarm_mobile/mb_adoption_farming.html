<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 绑定农事</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <script src="js/mobile-store.js"></script>
  <!-- 移动端统一数据层（严格空库 · 只读后端） -->
  <script src="js/mobile-data.js"></script>
  <style>
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; overflow: hidden; padding-bottom: 80px; }
    
    .content { padding: var(--space-4); }
    
    .tree-card { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-4); margin-bottom: var(--space-4); border: 1px solid var(--border); }
    .tree-info { display: flex; gap: var(--space-3); }
    .tree-icon { width: 56px; height: 56px; border-radius: var(--radius-lg); background: linear-gradient(135deg, var(--primary-50), var(--primary-100)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tree-icon svg { width: 28px; height: 28px; color: var(--primary); }
    .tree-detail { flex: 1; }
    .tree-name { font-size: var(--font-lg); font-weight: 600; color: var(--text); margin-bottom: var(--space-1); }
    .tree-variety { font-size: var(--font-sm); color: var(--text-secondary); }
    
    .section-title { font-size: var(--font-md); font-weight: 600; color: var(--text); margin-bottom: var(--space-3); display: flex; align-items: center; gap: var(--space-2); }
    
    .farming-list { background: var(--bg-white); border-radius: var(--radius-xl); border: 1px solid var(--border); overflow: hidden; }
    .farming-item { display: flex; align-items: center; padding: var(--space-4); border-bottom: 1px solid var(--border-light); cursor: pointer; transition: background var(--transition-fast); }
    .farming-item:last-child { border-bottom: none; }
    .farming-item:active { background: var(--gray-50); }
    .farming-item.selected { background: var(--primary-50); }
    .farming-checkbox { width: 24px; height: 24px; border-radius: var(--radius-md); border: 2px solid var(--border); margin-right: var(--space-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .farming-checkbox.checked { background: var(--primary); border-color: var(--primary); }
    .farming-checkbox svg { width: 14px; height: 14px; color: var(--bg-white); }
    .farming-content { flex: 1; }
    .farming-title { font-size: var(--font-base); font-weight: 500; color: var(--text); margin-bottom: var(--space-1); }
    .farming-time { font-size: var(--font-xs); color: var(--text-light); }
    .farming-type { font-size: var(--font-xs); padding: 2px 8px; background: var(--primary-100); color: var(--primary-600); border-radius: var(--radius-md); margin-left: var(--space-2); }
    
    .bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 750px; background: var(--bg-white); border-top: 1px solid var(--border); padding: var(--space-3) var(--space-4); display: flex; gap: var(--space-3); z-index: 100; }
    .submit-btn { flex: 1; height: 48px; background: linear-gradient(135deg, var(--primary-600), var(--primary-700)); color: var(--bg-white); border: none; border-radius: var(--radius-xl); font-size: var(--font-md); font-weight: 600; cursor: pointer; }
    
    .modal-content { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-6); width: 80%; text-align: center; }
    .success-icon { width: 72px; height: 72px; margin: 0 auto var(--space-4); background: var(--primary-100); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .success-icon svg { width: 40px; height: 40px; color: var(--primary); }
    .modal-title { font-size: var(--font-xl); font-weight: 700; color: var(--text); margin-bottom: var(--space-2); }
    .modal-desc { font-size: var(--font-base); color: var(--text-secondary); margin-bottom: var(--space-5); }
    .modal-btn { width: 100%; height: 44px; background: linear-gradient(135deg, var(--primary-600), var(--primary-700)); color: var(--bg-white); border: none; border-radius: var(--radius-xl); font-size: var(--font-base); font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div style="padding-left: 44px;">
        <div class="header-title">绑定农事</div>
        <div class="header-sub">将农事记录关联到认养果树</div>
      </div>
    </div>
    
    <div class="content">
      <div class="tree-card">
        <div class="tree-info">
          <div class="tree-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
          </div>
          <div class="tree-detail">
            <div class="tree-name" id="treeName">--</div>
            <div class="tree-variety" id="treeVariety">--</div>
          </div>
        </div>
      </div>
      
      <div class="section-title">选择农事记录</div>
      
      <div class="farming-list" id="farmingList"></div>
    </div>
    
    <div class="bottom-bar">
      <button class="submit-btn" onclick="submitBind()">确认绑定</button>
    </div>
    
    <div class="mb-modal-overlay" id="successModal">
      <div class="mb-modal is-sm">
        <div class="modal-content">
          <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <div class="modal-title">绑定成功</div>
          <div class="modal-desc">已将选中的农事记录关联到认养果树，消费者可以查看这些农事信息。</div>
          <button class="modal-btn" onclick="closeModal()">确定</button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    var MD = window.MobileData;
    var currentTree = null;
    var currentTreeName = '--';

    function goBack() {
      window.history.back();
    }

    function queryParam(name) {
      var m = (location.search || '').match(new RegExp('[?&]' + name + '=([^&]+)'));
      if (!m) return '';
      try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
    }

    /* 当前果树：来自 sf_adoption_tree，?treeId= 支持传主键或 tree_code */
    function findTree() {
      var trees = MD.list('adoption_tree');
      var wanted = queryParam('treeId');
      if (!wanted) return null;
      for (var i = 0; i < trees.length; i++) {
        if (String(trees[i].id) === String(wanted) || String(trees[i].tree_code) === String(wanted)) {
          return trees[i];
        }
      }
      return null;
    }

    function renderTree() {
      currentTree = findTree();
      var nameEl = document.getElementById('treeName');
      var varietyEl = document.getElementById('treeVariety');
      if (!currentTree) {
        currentTreeName = '未找到认养果树';
        if (nameEl) nameEl.textContent = currentTreeName;
        if (varietyEl) varietyEl.textContent = '--';
        return;
      }
      var variety = currentTree.variety_name || currentTree.variety || '--';
      currentTreeName = currentTree.tree_name || (variety + ' #' + (currentTree.tree_code || currentTree.id));
      if (nameEl) nameEl.textContent = currentTreeName;
      if (varietyEl) {
        varietyEl.textContent = '品种：' + variety +
          (currentTree.tree_age != null ? ' · 树龄' + currentTree.tree_age + '年' : '') +
          (currentTree.plot_name ? ' · ' + currentTree.plot_name : '');
      }
    }

    /* 农事记录：来自 sf_farming_record，库中无数据时显示空态 */
    function renderFarmingList() {
      var box = document.getElementById('farmingList');
      if (!box) return;
      var list = MD.list('farming_record');
      if (!list.length) {
        box.innerHTML = MD.inlineEmpty('暂无农事记录');
        return;
      }
      var html = '';
      list.forEach(function (r) {
        var type = r.type_name || r.farm_type || '农事';
        var title = r.content || (type + '作业');
        var time = MD.dateTimeText(r.execute_date) || MD.dateTimeText(r.created_at) || '--';
        html += '<div class="farming-item" data-id="' + MD.esc(r.id) + '" onclick="toggleSelect(this)">' +
          '<div class="farming-checkbox">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<polyline points="20 6 9 17 4 12"/>' +
            '</svg>' +
          '</div>' +
          '<div class="farming-content">' +
            '<div class="farming-title">' + MD.esc(title) +
              ' <span class="farming-type">' + MD.esc(type) + '</span></div>' +
            '<div class="farming-time">' + MD.esc(time) +
              (r.executor ? ' · ' + MD.esc(r.executor) : '') + '</div>' +
          '</div>' +
        '</div>';
      });
      box.innerHTML = html;
    }

    function toggleSelect(item) {
      var checkbox = item.querySelector('.farming-checkbox');
      checkbox.classList.toggle('checked');
      item.classList.toggle('selected');
    }

    function pad2(n) { return n < 10 ? '0' + n : String(n); }

    function nowStamp() {
      var d = new Date();
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
        ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    }

    function farmingById(id) {
      var list = MD.list('farming_record');
      for (var i = 0; i < list.length; i++) {
        if (String(list[i].id) === String(id)) return list[i];
      }
      return null;
    }

    /* 绑定：真实写入 sf_adoption_farming（POST /api/adoption_farming） */
    function submitBind() {
      var selected = document.querySelectorAll('.farming-item.selected');
      if (!selected.length) {
        MobileStore.toast('请至少选择一项农事记录', 'warning');
        return;
      }
      if (!currentTree) {
        MobileStore.toast('未找到认养果树，无法绑定', 'error');
        return;
      }
      if (!(window.Api && typeof window.Api.create === 'function')) {
        MobileStore.toast('数据接口不可用，请稍后重试', 'error');
        return;
      }

      var ts = nowStamp();
      var stamp = ts.replace(/[-: ]/g, '');
      var jobs = [];
      selected.forEach(function (item, idx) {
        var rec = farmingById(item.getAttribute('data-id'));
        if (!rec) return;
        var type = rec.type_name || rec.farm_type || '农事';
        jobs.push(Api.create('adoption_farming', {
          record_code: 'AF' + stamp + idx + Math.random().toString(36).slice(2, 5).toUpperCase(),
          source: 'mobile',
          tree_id: Number(currentTree.id),
          adopter: currentTree.adopter || (MD.user() || {}).realName || '',
          base_name: currentTree.base_name || currentTree.plot_name || '',
          farm_type: type,
          title: rec.content || (type + '作业'),
          batch_no: rec.record_code || '',
          bind_time: ts,
          execute_date: rec.execute_date || null,
          status: 'bound',
          remark: '绑定农事记录 ' + (rec.record_code || rec.id)
        }));
      });

      if (!jobs.length) {
        MobileStore.toast('所选的农事记录已不存在，请刷新后重试', 'error');
        return;
      }

      Promise.all(jobs).then(function (results) {
        var failed = results.filter(function (r) { return !(r && r.ok); }).length;
        MD.reload('adoption_farming');
        if (failed) {
          MobileStore.toast('有 ' + failed + ' 条绑定失败，请重试', 'error');
          return;
        }
        document.getElementById('successModal').classList.add('show');
        MobileStore.toast('已绑定 ' + jobs.length + ' 条农事记录', 'success');
      }).catch(function () {
        MobileStore.toast('绑定失败，请检查网络', 'error');
      });
    }

    function closeModal() {
      document.getElementById('successModal').classList.remove('show');
      window.history.back();
    }

    function init() {
      renderTree();
      renderFarmingList();
      if (MD && typeof MD.subscribe === 'function') {
        MD.subscribe(function () {
          renderTree();
          renderFarmingList();
        });
      }
      MD.ready.then(function () {
        renderTree();
        renderFarmingList();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
