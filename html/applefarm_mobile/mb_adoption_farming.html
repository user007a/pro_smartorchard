<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 绑定农事</title>
  <link rel="stylesheet" href="../applefarm_backhand/css/design-system.css">
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <style>
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; overflow: hidden; padding-bottom: 80px; }
    
    .page-header {
      position: relative;
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
      padding: 44px 16px 20px;
      color: var(--bg-white);
    }
    
    .header-back {
      position: absolute;
      left: 12px;
      top: 44px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .header-back svg { width: 18px; height: 18px; }
    
    .header-title { font-size: var(--font-xl); font-weight: 700; }
    .header-sub { font-size: var(--font-sm); opacity: 0.85; margin-top: 4px; }
    
    .content { padding: var(--space-4); }
    
    .tree-card { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-4); margin-bottom: var(--space-4); border: 1px solid var(--border); }
    .tree-info { display: flex; gap: var(--space-3); }
    .tree-icon { width: 56px; height: 56px; border-radius: var(--radius-lg); background: linear-gradient(135deg, var(--primary-50), var(--primary-100)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tree-icon svg { width: 28px; height: 28px; color: var(--primary); }
    .tree-detail { flex: 1; }
    .tree-name { font-size: var(--font-lg); font-weight: 600; color: var(--text); margin-bottom: var(--space-1); }
    .tree-variety { font-size: var(--font-sm); color: var(--text-secondary); }
    
    .section-title { font-size: var(--font-md); font-weight: 600; color: var(--text); margin-bottom: var(--space-3); display: flex; align-items: center; gap: var(--space-2); }
    
    .farming-list { background: var(--bg-white); border-radius: var(--radius-xl); border: 1px solid var(--border); overflow: hidden; }
    .farming-item { display: flex; align-items: center; padding: var(--space-4); border-bottom: 1px solid var(--border-light); cursor: pointer; transition: background var(--transition-fast); }
    .farming-item:last-child { border-bottom: none; }
    .farming-item:active { background: var(--gray-50); }
    .farming-item.selected { background: var(--primary-50); }
    .farming-checkbox { width: 24px; height: 24px; border-radius: var(--radius-md); border: 2px solid var(--border); margin-right: var(--space-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .farming-checkbox.checked { background: var(--primary); border-color: var(--primary); }
    .farming-checkbox svg { width: 14px; height: 14px; color: var(--bg-white); }
    .farming-content { flex: 1; }
    .farming-title { font-size: var(--font-base); font-weight: 500; color: var(--text); margin-bottom: var(--space-1); }
    .farming-time { font-size: var(--font-xs); color: var(--text-light); }
    .farming-type { font-size: var(--font-xs); padding: 2px 8px; background: var(--primary-100); color: var(--primary-600); border-radius: var(--radius-md); margin-left: var(--space-2); }
    
    .bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 750px; background: var(--bg-white); border-top: 1px solid var(--border); padding: var(--space-3) var(--space-4); display: flex; gap: var(--space-3); z-index: 100; }
    .submit-btn { flex: 1; height: 48px; background: linear-gradient(135deg, var(--primary-600), var(--primary-700)); color: var(--bg-white); border: none; border-radius: var(--radius-xl); font-size: var(--font-md); font-weight: 600; cursor: pointer; }
    
    .success-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .success-modal.show { display: flex; }
    .modal-content { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-6); width: 80%; text-align: center; }
    .success-icon { width: 72px; height: 72px; margin: 0 auto var(--space-4); background: var(--primary-100); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .success-icon svg { width: 40px; height: 40px; color: var(--primary); }
    .modal-title { font-size: var(--font-xl); font-weight: 700; color: var(--text); margin-bottom: var(--space-2); }
    .modal-desc { font-size: var(--font-base); color: var(--text-secondary); margin-bottom: var(--space-5); }
    .modal-btn { width: 100%; height: 44px; background: linear-gradient(135deg, var(--primary-600), var(--primary-700)); color: var(--bg-white); border: none; border-radius: var(--radius-xl); font-size: var(--font-base); font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div style="padding-left: 44px;">
        <div class="header-title">绑定农事</div>
        <div class="header-sub">将农事记录关联到认养果树</div>
      </div>
    </div>
    
    <div class="content">
      <div class="tree-card">
        <div class="tree-info">
          <div class="tree-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
          </div>
          <div class="tree-detail">
            <div class="tree-name">红富士 #A025</div>
            <div class="tree-variety">品种：红富士 · 树龄8年 · A1区</div>
          </div>
        </div>
      </div>
      
      <div class="section-title">选择农事记录</div>
      
      <div class="farming-list">
        <div class="farming-item" onclick="toggleSelect(this)">
          <div class="farming-checkbox" id="chk1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <div class="farming-content">
            <div class="farming-title">春季修剪作业 <span class="farming-type">修剪</span></div>
            <div class="farming-time">2026-03-15 09:00</div>
          </div>
        </div>
        
        <div class="farming-item" onclick="toggleSelect(this)">
          <div class="farming-checkbox" id="chk2">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <div class="farming-content">
            <div class="farming-title">施肥作业 - 有机肥 <span class="farming-type">施肥</span></div>
            <div class="farming-time">2026-04-20 14:30</div>
          </div>
        </div>
        
        <div class="farming-item" onclick="toggleSelect(this)">
          <div class="farming-checkbox" id="chk3">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <div class="farming-content">
            <div class="farming-title">病虫害防治 - 喷洒农药 <span class="farming-type">植保</span></div>
            <div class="farming-time">2026-05-10 10:00</div>
          </div>
        </div>
        
        <div class="farming-item" onclick="toggleSelect(this)">
          <div class="farming-checkbox" id="chk4">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <div class="farming-content">
            <div class="farming-title">果实套袋作业 <span class="farming-type">套袋</span></div>
            <div class="farming-time">2026-06-05 07:00</div>
          </div>
        </div>
        
        <div class="farming-item" onclick="toggleSelect(this)">
          <div class="farming-checkbox" id="chk5">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <div class="farming-content">
            <div class="farming-title">夏季修剪作业 <span class="farming-type">修剪</span></div>
            <div class="farming-time">2026-06-12 08:30</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="bottom-bar">
      <button class="submit-btn" onclick="submitBind()">确认绑定</button>
    </div>
    
    <div class="success-modal" id="successModal">
      <div class="modal-content">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div class="modal-title">绑定成功</div>
        <div class="modal-desc">已将选中的农事记录关联到认养果树，消费者可以查看这些农事信息。</div>
        <button class="modal-btn" onclick="closeModal()">确定</button>
      </div>
    </div>
  </div>
  
  <script>
    function goBack() {
      window.history.back();
    }
    
    function toggleSelect(item) {
      var checkbox = item.querySelector('.farming-checkbox');
      checkbox.classList.toggle('checked');
      item.classList.toggle('selected');
    }
    
    function submitBind() {
      var selected = document.querySelectorAll('.farming-checkbox.checked');
      if (selected.length === 0) {
        alert('请至少选择一项农事记录');
        return;
      }
      document.getElementById('successModal').classList.add('show');
    }
    
    function closeModal() {
      document.getElementById('successModal').classList.remove('show');
      window.history.back();
    }
  </script>
</body>
</html>
