<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 认养挂牌</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <style>
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; overflow: hidden; padding-bottom: 80px; }
    
    .content { padding: var(--space-4); }
    
    .card { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-4); margin-bottom: var(--space-4); border: 1px solid var(--border); }
    .card-title { font-size: var(--font-md); font-weight: 600; color: var(--text); margin-bottom: var(--space-3); }
    
    .tag-preview { background: linear-gradient(135deg, #fef9e7, #fff8dc); border: 2px solid #d4af37; border-radius: var(--radius-lg); padding: var(--space-5); text-align: center; }
    .tag-header { font-size: var(--font-xs); color: #b8962e; margin-bottom: var(--space-2); }
    .tag-title { font-size: var(--font-xl); font-weight: 700; color: #8b4513; margin-bottom: var(--space-3); }
    .tag-info { font-size: var(--font-sm); color: #5c4033; line-height: 1.6; }
    .tag-info-row { display: flex; justify-content: space-between; padding: var(--space-2) 0; border-bottom: 1px dashed #d4af37; }
    .tag-info-row:last-child { border-bottom: none; }
    .tag-label { color: #8b7355; }
    .tag-value { font-weight: 500; }
    .tag-footer { margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px dashed #d4af37; }
    .tag-qrcode { width: 60px; height: 60px; margin: 0 auto; background: #fff; border-radius: var(--radius-md); padding: 4px; }
    
    .form-item { margin-bottom: var(--space-4); }
    .form-label { font-size: var(--font-sm); color: var(--text-secondary); margin-bottom: var(--space-2); display: block; }
    .form-input { width: 100%; height: 44px; background: var(--gray-50); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0 var(--space-3); font-size: var(--font-base); box-sizing: border-box; }
    .form-input:focus { outline: none; border-color: var(--primary); }
    
    .radio-group { display: flex; gap: var(--space-4); }
    .radio-item { display: flex; align-items: center; gap: var(--space-2); cursor: pointer; }
    .radio-input { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); appearance: none; cursor: pointer; }
    .radio-input:checked { background: var(--primary); border-color: var(--primary); }
    .radio-label { font-size: var(--font-sm); color: var(--text); }
    
    .bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 750px; background: var(--bg-white); border-top: 1px solid var(--border); padding: var(--space-3) var(--space-4); display: flex; gap: var(--space-3); z-index: 100; }
    .submit-btn { flex: 1; height: 48px; background: linear-gradient(135deg, var(--primary-600), var(--primary-700)); color: var(--bg-white); border: none; border-radius: var(--radius-xl); font-size: var(--font-md); font-weight: 600; cursor: pointer; }
    
    .modal-content { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-6); width: 80%; text-align: center; }
    .success-icon { width: 72px; height: 72px; margin: 0 auto var(--space-4); background: var(--primary-100); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .success-icon svg { width: 40px; height: 40px; color: var(--primary); }
    .modal-title { font-size: var(--font-xl); font-weight: 700; color: var(--text); margin-bottom: var(--space-2); }
    .modal-desc { font-size: var(--font-base); color: var(--text-secondary); margin-bottom: var(--space-5); }
    .modal-btn { width: 100%; height: 44px; background: linear-gradient(135deg, var(--primary-600), var(--primary-700)); color: var(--bg-white); border: none; border-radius: var(--radius-xl); font-size: var(--font-base); font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div style="padding-left: 44px;">
        <div class="header-title">认养挂牌</div>
        <div class="header-sub">为认养果树制作标识牌</div>
      </div>
    </div>
    
    <div class="content">
      <div class="card">
        <div class="card-title">挂牌预览</div>
        <div class="tag-preview">
          <div class="tag-header">智慧果园认养证书</div>
          <div class="tag-title">花牛苹果 #A025</div>
          <div class="tag-info">
            <div class="tag-info-row">
              <span class="tag-label">认养人</span>
              <span class="tag-value">李明</span>
            </div>
            <div class="tag-info-row">
              <span class="tag-label">认养周期</span>
              <span class="tag-value">2026.06-2027.06</span>
            </div>
            <div class="tag-info-row">
              <span class="tag-label">地块位置</span>
              <span class="tag-value">A1区-025号</span>
            </div>
          </div>
          <div class="tag-footer">
            <div class="tag-qrcode">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <line x1="7" y1="7" x2="10" y2="7"/>
                <line x1="7" y1="12" x2="8" y2="12"/>
                <line x1="7" y1="17" x2="11" y2="17"/>
                <line x1="14" y1="7" x2="17" y2="7"/>
                <line x1="17" y1="7" x2="17" y2="10"/>
                <line x1="14" y1="12" x2="16" y2="12"/>
                <line x1="14" y1="17" x2="17" y2="17"/>
                <line x1="12" y1="14" x2="12" y2="16"/>
                <line x1="14" y1="14" x2="14" y2="16"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-title">挂牌信息</div>
        
        <div class="form-item">
          <label class="form-label">认养人姓名</label>
          <input type="text" class="form-input" placeholder="请输入认养人姓名" value="李明">
        </div>
        
        <div class="form-item">
          <label class="form-label">果树编号</label>
          <input type="text" class="form-input" placeholder="请输入果树编号" value="花牛苹果 #A025">
        </div>
        
        <div class="form-item">
          <label class="form-label">认养周期</label>
          <input type="text" class="form-input" placeholder="请输入认养周期" value="2026.06-2027.06">
        </div>
        
        <div class="form-item">
          <label class="form-label">挂牌材质</label>
          <div class="radio-group">
            <label class="radio-item">
              <input type="radio" class="radio-input" name="material" checked>
              <span class="radio-label">木质</span>
            </label>
            <label class="radio-item">
              <input type="radio" class="radio-input" name="material">
              <span class="radio-label">金属</span>
            </label>
            <label class="radio-item">
              <input type="radio" class="radio-input" name="material">
              <span class="radio-label">亚克力</span>
            </label>
          </div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-title">安装位置</div>
        <div class="form-item">
          <label class="form-label">地块区域</label>
          <input type="text" class="form-input" placeholder="请输入地块区域" value="A1区">
        </div>
        <div class="form-item">
          <label class="form-label">树行号</label>
          <input type="text" class="form-input" placeholder="请输入树行号" value="第8行">
        </div>
        <div class="form-item">
          <label class="form-label">树位号</label>
          <input type="text" class="form-input" placeholder="请输入树位号" value="第25棵">
        </div>
      </div>
    </div>
    
    <div class="bottom-bar">
      <button class="submit-btn" onclick="submitTagging()">生成挂牌</button>
    </div>
    
    <div class="mb-modal-overlay" id="successModal">
      <div class="mb-modal is-sm">
        <div class="modal-content">
          <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <div class="modal-title">挂牌生成成功</div>
          <div class="modal-desc">认养挂牌已生成，二维码已绑定果树信息。可打印制作实体挂牌并安装到果树上。</div>
          <button class="modal-btn" onclick="closeModal()">确定</button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    function goBack() {
      window.history.back();
    }
    
    function submitTagging() {
      document.getElementById('successModal').classList.add('show');
    }
    
    function closeModal() {
      document.getElementById('successModal').classList.remove('show');
      window.history.back();
    }
  </script>
</body>
</html>
