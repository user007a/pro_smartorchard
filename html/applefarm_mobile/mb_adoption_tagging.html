<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 认养挂牌</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <!-- 共享数据层 -->
  <script src="js/mobile-store.js"></script>
  <style>
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; overflow: hidden; padding-bottom: 80px; }
    
    .content { padding: var(--space-4); }
    
    .card { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-4); margin-bottom: var(--space-4); border: 1px solid var(--border); }
    .card-title { font-size: var(--font-md); font-weight: 600; color: var(--text); margin-bottom: var(--space-3); }
    
    .tag-preview { background: linear-gradient(135deg, #fef9e7, #fff8dc); border: 2px solid #d4af37; border-radius: var(--radius-lg); padding: var(--space-5); text-align: center; }
    .tag-header { font-size: var(--font-xs); color: #b8962e; margin-bottom: var(--space-2); }
    .tag-title { font-size: var(--font-xl); font-weight: 700; color: #8b4513; margin-bottom: var(--space-3); }
    .tag-info { font-size: var(--font-sm); color: #5c4033; line-height: 1.6; }
    .tag-info-row { display: flex; justify-content: space-between; padding: var(--space-2) 0; border-bottom: 1px dashed #d4af37; }
    .tag-info-row:last-child { border-bottom: none; }
    .tag-label { color: #8b7355; }
    .tag-value { font-weight: 500; }
    .tag-footer { margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px dashed #d4af37; }
    .tag-qrcode { width: 60px; height: 60px; margin: 0 auto; background: #fff; border-radius: var(--radius-md); padding: 4px; }
    
    .form-item { margin-bottom: var(--space-4); }
    .form-label { font-size: var(--font-sm); color: var(--text-secondary); margin-bottom: var(--space-2); display: block; }
    .form-input { width: 100%; height: 44px; background: var(--gray-50); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0 var(--space-3); font-size: var(--font-base); box-sizing: border-box; }
    .form-input:focus { outline: none; border-color: var(--primary); }
    
    .radio-group { display: flex; gap: var(--space-4); }
    .radio-item { display: flex; align-items: center; gap: var(--space-2); cursor: pointer; }
    .radio-input { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); appearance: none; cursor: pointer; }
    .radio-input:checked { background: var(--primary); border-color: var(--primary); }
    .radio-label { font-size: var(--font-sm); color: var(--text); }
    
    .bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 750px; background: var(--bg-white); border-top: 1px solid var(--border); padding: var(--space-3) var(--space-4); display: flex; gap: var(--space-3); z-index: 100; }
    .submit-btn { flex: 1; height: 48px; background: linear-gradient(135deg, var(--primary-600), var(--primary-700)); color: var(--bg-white); border: none; border-radius: var(--radius-xl); font-size: var(--font-md); font-weight: 600; cursor: pointer; }
    
    .modal-content { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-6); width: 80%; text-align: center; }
    .success-icon { width: 72px; height: 72px; margin: 0 auto var(--space-4); background: var(--primary-100); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .success-icon svg { width: 40px; height: 40px; color: var(--primary); }
    .modal-title { font-size: var(--font-xl); font-weight: 700; color: var(--text); margin-bottom: var(--space-2); }
    .modal-desc { font-size: var(--font-base); color: var(--text-secondary); margin-bottom: var(--space-5); }
    .modal-btn { width: 100%; height: 44px; background: linear-gradient(135deg, var(--primary-600), var(--primary-700)); color: var(--bg-white); border: none; border-radius: var(--radius-xl); font-size: var(--font-base); font-weight: 600; cursor: pointer; }

    /* 挂牌记录列表 */
    .card-title span { color: var(--text-light); font-weight: 500; font-size: var(--font-sm); }
    .tag-record-item { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); padding: var(--space-2) 0; border-bottom: 1px dashed var(--border-light); }
    .tag-record-item:last-child { border-bottom: none; }
    .tag-record-main { font-size: var(--font-sm); color: var(--text); }
    .tag-record-sub { font-size: var(--font-xs); color: var(--text-light); margin-top: 2px; }
    .tag-record-code { font-size: var(--font-xs); font-weight: 600; color: var(--primary); flex-shrink: 0; }
    .tag-empty { text-align: center; color: var(--text-light); font-size: var(--font-sm); padding: var(--space-3) 0; }
    .tag-archived-tag { display: inline-block; padding: 0 6px; border-radius: var(--radius-sm); background: var(--gray-100); color: var(--text-light); font-size: var(--font-xs); line-height: 1.6; vertical-align: middle; margin-left: 4px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div style="padding-left: 44px;">
        <div class="header-title">认养挂牌</div>
        <div class="header-sub">为认养果树制作标识牌</div>
      </div>
    </div>
    
    <div class="content">
      <div class="card">
        <div class="card-title">挂牌预览</div>
        <div class="tag-preview">
          <div class="tag-header">智慧果园认养证书</div>
          <div class="tag-title" id="tagPreviewTreeNo">花牛苹果 #A025</div>
          <div class="tag-info">
            <div class="tag-info-row">
              <span class="tag-label">认养人</span>
              <span class="tag-value" id="tagPreviewAdopter">李明</span>
            </div>
            <div class="tag-info-row">
              <span class="tag-label">认养周期</span>
              <span class="tag-value" id="tagPreviewPeriod">2026.06-2027.06</span>
            </div>
            <div class="tag-info-row">
              <span class="tag-label">地块位置</span>
              <span class="tag-value" id="tagPreviewLocation">A1区-025号</span>
            </div>
          </div>
          <div class="tag-footer">
            <div class="tag-qrcode">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <line x1="7" y1="7" x2="10" y2="7"/>
                <line x1="7" y1="12" x2="8" y2="12"/>
                <line x1="7" y1="17" x2="11" y2="17"/>
                <line x1="14" y1="7" x2="17" y2="7"/>
                <line x1="17" y1="7" x2="17" y2="10"/>
                <line x1="14" y1="12" x2="16" y2="12"/>
                <line x1="14" y1="17" x2="17" y2="17"/>
                <line x1="12" y1="14" x2="12" y2="16"/>
                <line x1="14" y1="14" x2="14" y2="16"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-title">挂牌信息</div>
        
        <div class="form-item">
          <label class="form-label">认养人姓名</label>
          <input type="text" class="form-input" id="adopterName" placeholder="请输入认养人姓名" value="李明">
        </div>
        
        <div class="form-item">
          <label class="form-label">果树编号</label>
          <input type="text" class="form-input" id="treeNo" placeholder="请输入果树编号" value="花牛苹果 #A025">
        </div>
        
        <div class="form-item">
          <label class="form-label">认养周期</label>
          <input type="text" class="form-input" id="adoptPeriod" placeholder="请输入认养周期" value="2026.06-2027.06">
        </div>
        
        <div class="form-item">
          <label class="form-label">挂牌材质</label>
          <div class="radio-group">
            <label class="radio-item">
              <input type="radio" class="radio-input" name="material" value="木质" checked>
              <span class="radio-label">木质</span>
            </label>
            <label class="radio-item">
              <input type="radio" class="radio-input" name="material" value="金属">
              <span class="radio-label">金属</span>
            </label>
            <label class="radio-item">
              <input type="radio" class="radio-input" name="material" value="亚克力">
              <span class="radio-label">亚克力</span>
            </label>
          </div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-title">安装位置</div>
        <div class="form-item">
          <label class="form-label">地块区域</label>
          <input type="text" class="form-input" id="plotArea" placeholder="请输入地块区域" value="A1区">
        </div>
        <div class="form-item">
          <label class="form-label">树行号</label>
          <input type="text" class="form-input" id="rowNo" placeholder="请输入树行号" value="第8行">
        </div>
        <div class="form-item">
          <label class="form-label">树位号</label>
          <input type="text" class="form-input" id="colNo" placeholder="请输入树位号" value="第25棵">
        </div>
      </div>

      <div class="card">
        <div class="card-title">挂牌记录 <span id="tagCount">0</span></div>
        <div id="tagRecords"></div>
      </div>
    </div>
    
    <div class="bottom-bar">
      <button class="submit-btn" onclick="submitTagging()">生成挂牌</button>
    </div>
    
    <div class="mb-modal-overlay" id="successModal">
      <div class="mb-modal is-sm">
        <div class="modal-content">
          <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <div class="modal-title">挂牌生成成功</div>
          <div class="modal-desc">认养挂牌已生成，二维码已绑定果树信息。可打印制作实体挂牌并安装到果树上。</div>
          <button class="modal-btn" onclick="closeModal()">确定</button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    function goBack() {
      window.history.back();
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function getMaterial() {
      var checked = document.querySelector('input[name="material"]:checked');
      return checked ? checked.value : '木质';
    }

    // 由果树编号 + 认养人生成确定性识别码
    function makeCode(seed) {
      var h = 0, s = String(seed || '');
      for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
      return 'AD' + new Date().getFullYear() + h.toString(36).toUpperCase().padStart(6, '0');
    }

    function updatePreview() {
      var name = document.getElementById('adopterName').value.trim() || '—';
      var treeNo = document.getElementById('treeNo').value.trim() || '—';
      var period = document.getElementById('adoptPeriod').value.trim() || '—';
      var plot = document.getElementById('plotArea').value.trim() || '—';
      var row = document.getElementById('rowNo').value.trim();
      var col = document.getElementById('colNo').value.trim();
      document.getElementById('tagPreviewTreeNo').textContent = treeNo;
      document.getElementById('tagPreviewAdopter').textContent = name;
      document.getElementById('tagPreviewPeriod').textContent = period;
      document.getElementById('tagPreviewLocation').textContent = [plot, row, col].filter(Boolean).join('-');
    }

    // 读取共享键渲染挂牌记录，形成跨端闭环
    function renderTagRecords() {
      var box = document.getElementById('tagRecords');
      var arr = window.MobileStore ? MobileStore.list(MobileStore.KEYS.adoptionTag) : [];
      document.getElementById('tagCount').textContent = arr.length;
      if (!arr.length) {
        box.innerHTML = '<div class="tag-empty">暂无挂牌记录，提交挂牌后将显示在这里</div>';
        return;
      }
      // 图片已被归档（超大跳过 / 被挤出上限）的挂牌编号集合
      var archivedCodes = {};
      readTagArchive().forEach(function (a) { if (a && a.code) archivedCodes[a.code] = true; });
      box.innerHTML = arr.map(function (it) {
        var archivedTag = archivedCodes[it.code] ? '<span class="tag-archived-tag">图片已归档</span>' : '';
        return '<div class="tag-record-item">' +
            '<div>' +
              '<div class="tag-record-main">' + esc(it.treeNo || '未命名') + ' · ' + esc(it.adopter || '—') + archivedTag + '</div>' +
              '<div class="tag-record-sub">' + esc(it.location || '—') + ' · ' + esc(MobileStore.fmtTime(it.tagTime || it.createTime)) + ' · 材质:' + esc(it.material || '—') + '</div>' +
            '</div>' +
            '<div class="tag-record-code">' + esc(it.code || '') + '</div>' +
          '</div>';
      }).join('');
    }

    function submitTagging() {
      var adopter = document.getElementById('adopterName').value.trim();
      var treeNo = document.getElementById('treeNo').value.trim();
      if (!adopter) { MobileStore.toast('请输入认养人姓名', 'warning'); return; }
      if (!treeNo) { MobileStore.toast('请输入果树编号', 'warning'); return; }

      var period = document.getElementById('adoptPeriod').value.trim();
      var plot = document.getElementById('plotArea').value.trim();
      var row = document.getElementById('rowNo').value.trim();
      var col = document.getElementById('colNo').value.trim();
      var item = {
        treeNo: treeNo,
        adopter: adopter,
        period: period,
        material: getMaterial(),
        plot: plot,
        row: row,
        col: col,
        location: [plot, row, col].filter(Boolean).join('-'),
        code: makeCode(treeNo + adopter),
        tagTime: new Date().toISOString()
      };

      // 写入共享存储，PC 端 adoption_tree 可读取
      MobileStore.push(MobileStore.KEYS.adoptionTag, item);
      updatePreview();
      renderTagRecords();
      MobileStore.toast('挂牌已生成并保存', 'success');
      // 生成挂牌 PNG（Canvas → toBlob → 下载链接）
      generateTaggingPng(item);
      document.getElementById('successModal').classList.add('show');
    }

    /* ============================================================
     * 挂牌 PNG 缓存的容量治理
     * ------------------------------------------------------------
     * 为什么要限流：Canvas 生成的挂牌以 base64 dataURL（约体积的 4/3）
     * 完整存入 localStorage，而 localStorage 单域配额仅约 5MB，
     * 一张挂牌 50~200KB，几十条就会写满并触发 QuotaExceededError，
     * 之后所有 localStorage 写入（含农事记录、挂牌元数据）都会失败。
     * 长期方案：挂牌 PNG 改存对象存储/文件服务，localStorage 只留 URL。
     * 当前过渡策略：
     *   1) 单条上限 300KB，超限只留元数据（png 置空，skipped=true）
     *   2) 总条数上限最近 10 条，新的在前
     *   3) setItem 异常兜底：清空全部 png 后重写一次，并提示用户
     * ============================================================ */
    var PNG_STORE_KEY = 'mb_adoption_tagging_png';
    var PNG_MAX_SIZE = 300 * 1024;   // 单条 300KB 上限
    var PNG_MAX_COUNT = 10;          // 最多保留最近 10 条

    // 被挤出/被跳过挂牌记录的元数据归档（不含 base64，避免二次撑爆配额）
    var PNG_ARCHIVE_KEY = 'smartorchard_adoption_tag_archive';
    var ARCHIVE_MAX_COUNT = 100;     // 归档清单最多保留最近 100 条

    // 读取历史挂牌 PNG 缓存，损坏数据按空数组处理，绝不让页面崩溃
    function readPngCache() {
      try {
        var raw = localStorage.getItem(PNG_STORE_KEY);
        if (!raw) return [];
        var v = JSON.parse(raw);
        return Array.isArray(v) ? v : [];
      } catch (e) {
        return [];
      }
    }

    // 读取挂牌归档清单（仅元数据）
    function readTagArchive() {
      try {
        var raw = localStorage.getItem(PNG_ARCHIVE_KEY);
        if (!raw) return [];
        var v = JSON.parse(raw);
        return Array.isArray(v) ? v : [];
      } catch (e) {
        return [];
      }
    }

    // 把一条记录（不含 base64）追加进归档清单，最新的在前，并限长
    function archiveTagRecord(rec, reason) {
      if (!rec) return;
      var entry = {
        code: rec.code || '',
        treeNo: rec.treeNo || '',
        adopter: rec.adopter || '',
        time: rec.time || new Date().toISOString(),
        size: rec.size || 0,
        reason: reason
      };
      var list = readTagArchive();
      list.unshift(entry);
      if (list.length > ARCHIVE_MAX_COUNT) list = list.slice(0, ARCHIVE_MAX_COUNT);
      try { localStorage.setItem(PNG_ARCHIVE_KEY, JSON.stringify(list)); } catch (e) {}
    }

    // 写入挂牌 PNG 缓存（带单条上限、条数上限与配额兜底）
    function writePngCache(record) {
      var list = readPngCache();
      list.unshift(record);
      if (list.length > PNG_MAX_COUNT) {
        // 被挤出保留上限的记录：图片丢弃、元数据归档
        list.slice(PNG_MAX_COUNT).forEach(function (it) {
          archiveTagRecord(it, '超出保留上限');
        });
        list = list.slice(0, PNG_MAX_COUNT);
      }
      // 单张过大被跳过的记录：图片未缓存，元数据归档
      if (record.skipped) archiveTagRecord(record, '单张过大');

      try {
        localStorage.setItem(PNG_STORE_KEY, JSON.stringify(list));
        return true;
      } catch (e) {
        // 配额已满：清空所有 base64 图片、只保留元数据后重试一次
        try {
          var metaOnly = list.map(function (it) {
            return {
              code: it.code, treeNo: it.treeNo, adopter: it.adopter,
              png: '', time: it.time, size: it.size, skipped: true
            };
          });
          localStorage.setItem(PNG_STORE_KEY, JSON.stringify(metaOnly));
          MobileStore.toast('存储空间不足，已清除历史挂牌图片，请及时下载保存', 'warning');
          return true;
        } catch (e2) {
          MobileStore.toast('挂牌图片保存失败，请检查浏览器存储空间', 'warning');
          return false;
        }
      }
    }

    // 挂牌 PNG 生成（MB-B-020）：Canvas 绘制 → Blob → 触发下载
    function generateTaggingPng(item) {
      try {
        var c = document.createElement('canvas');
        c.width = 320; c.height = 480;
        var ctx = c.getContext('2d');
        // 背景
        var grad = ctx.createLinearGradient(0, 0, 0, 480);
        grad.addColorStop(0, '#fef9e7'); grad.addColorStop(1, '#fff8dc');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, 320, 480);
        // 边框
        ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 4;
        ctx.strokeRect(8, 8, 304, 464);
        // 标题
        ctx.fillStyle = '#b8962e'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('智慧果园认养证书', 160, 40);
        ctx.fillStyle = '#8b4513'; ctx.font = 'bold 22px sans-serif';
        ctx.fillText(item.treeNo || '未命名', 160, 80);
        // 信息行
        ctx.fillStyle = '#5c4033'; ctx.font = '14px sans-serif'; ctx.textAlign = 'left';
        var rows = [['认养人', item.adopter], ['认养周期', item.period], ['地块位置', item.location], ['材质', item.material || '—'], ['编号', item.code]];
        rows.forEach(function(r, i){ ctx.fillText(r[0] + '：' + r[1], 30, 140 + i * 30); });
        // 二维码占位（21x21 网格）
        var qx = 130, qy = 320, qsize = 60;
        var cell = qsize / 21;
        ctx.fillStyle = '#000';
        for (var y = 0; y < 21; y++) for (var x = 0; x < 21; x++) {
          if ((item.code.charCodeAt((x + y) % item.code.length) + x * 7 + y * 11) % 7 < 3) ctx.fillRect(qx + x * cell, qy + y * cell, cell - 0.5, cell - 0.5);
        }
        // 落款
        ctx.fillStyle = '#8b7355'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('扫码查看认养详情', 160, 410);
        ctx.fillText(new Date().toLocaleDateString(), 160, 430);
        // 落库 + 下载
        c.toBlob(function(blob){
          var reader = new FileReader();
          reader.onload = function(ev){
            var dataUrl = String(ev.target.result || '');
            var size = dataUrl.length;
            var record = {
              code: item.code,
              treeNo: item.treeNo,
              adopter: item.adopter,
              // 超限只留元数据，避免单条 base64 撑爆配额
              png: size > PNG_MAX_SIZE ? '' : dataUrl,
              time: new Date().toISOString(),
              size: size,
              skipped: size > PNG_MAX_SIZE
            };
            writePngCache(record);
            // 超限时明确告知用户，图片已通过下载保存
            if (record.skipped) {
              MobileStore.toast('挂牌图片较大（' + Math.round(size / 1024) + 'KB），已跳过本地缓存，请查看下载的图片', 'warning');
            }
            // 同时下载
            var a = document.createElement('a');
            a.href = dataUrl;
            a.download = '挂牌_' + (item.treeNo || item.code) + '.png';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
          };
          reader.readAsDataURL(blob);
        }, 'image/png');
      } catch (e) { console.warn('生成挂牌 PNG 失败：' + e.message); }
    }

    function closeModal() {
      document.getElementById('successModal').classList.remove('show');
      window.history.back();
    }

    // 初始化：预览与共享记录
    ['adopterName', 'treeNo', 'adoptPeriod', 'plotArea', 'rowNo', 'colNo'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('input', updatePreview);
    });
    renderTagRecords();
    // 跨标签页同步：归档清单或挂牌记录变化时刷新「图片已归档」标识
    window.addEventListener('storage', function (e) {
      if (!e || !e.key) return;
      if (e.key === PNG_ARCHIVE_KEY || (window.MobileStore && e.key === MobileStore.KEYS.adoptionTag)) {
        renderTagRecords();
      }
    });
  </script>
</body>
</html>
