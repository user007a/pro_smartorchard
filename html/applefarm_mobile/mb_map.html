<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 果园地图</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <!-- 共享数据层（toast 轻提示） -->
  <script src="js/mobile-store.js"></script>
  <style>
    /* 移除重复的 :root 变量定义，使用设计系统变量 */
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 66px; }
    .map-container { position: relative; height: calc(100vh - 180px); background: #e8eef3; }
    .map-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, #e8eef3 0%, #d4dde5 100%); overflow: hidden; }
    .map-grid { width: 80%; max-width: 280px; aspect-ratio: 1; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); gap: var(--space-1); }
    .grid-cell { background: rgba(46, 158, 90, 0.1); border: 1px solid rgba(46, 158, 90, 0.2); border-radius: var(--radius-sm); }
    .grid-cell.plot { background: rgba(46, 158, 90, 0.3); border-color: rgba(46, 158, 90, 0.5); }
    .plot-marker { position: relative; }
    .plot-marker::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; background: var(--primary); border-radius: 50%; border: 2px solid var(--bg-white); box-shadow: var(--shadow-sm); }
    .plot-marker.warning::after { background: var(--warning); }
    .plot-marker.overdue::after { background: var(--error); }
    .map-legend { position: absolute; bottom: var(--space-4); left: var(--space-4); background: rgba(255,255,255,0.95); border-radius: var(--radius-md); padding: var(--space-3); box-shadow: var(--shadow-md); }
    .legend-title { font-size: var(--font-sm); font-weight: 600; color: var(--text); margin-bottom: var(--space-2); }
    .legend-item { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-1); font-size: var(--font-sm); color: var(--text-secondary); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .legend-dot.normal { background: var(--primary); }
    .legend-dot.warning { background: var(--warning); }
    .legend-dot.overdue { background: var(--error); }
    .zoom-controls { position: absolute; bottom: var(--space-4); right: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
    .zoom-btn { width: 40px; height: 40px; background: rgba(255,255,255,0.95); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow-sm); }
    .zoom-btn svg { width: 20px; height: 20px; color: var(--text); }
    .zoom-btn.disabled { opacity: 0.45; cursor: not-allowed; }
    .zoom-level { font-size: var(--font-xs); color: var(--text-secondary); background: rgba(255,255,255,0.95); border-radius: var(--radius-md); padding: 2px var(--space-2); text-align: center; box-shadow: var(--shadow-sm); }
    .map-frame { width: 100%; height: 100%; border: 0; transform-origin: center center; transition: transform 0.25s ease; will-change: transform; }
    .plot-list { background: var(--bg-white); border-top: 1px solid var(--border); padding: var(--space-3) var(--space-4); }
    .list-title { font-size: var(--font-base); font-weight: 600; color: var(--text); margin-bottom: var(--space-2); }
    .plot-item { display: flex; align-items: center; padding: var(--space-2) 0; border-bottom: 1px solid var(--border-light); cursor: pointer; }
    .plot-item:last-child { border-bottom: none; }
    .plot-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: var(--space-3); }
    .plot-dot.normal { background: var(--primary); }
    .plot-dot.warning { background: var(--warning); }
    .plot-dot.overdue { background: var(--error); }
    .plot-info { flex: 1; }
    .plot-name { font-size: var(--font-base); color: var(--text); }
    .plot-meta { font-size: var(--font-sm); color: var(--text-light); margin-top: var(--space-1); }
    .plot-status { font-size: var(--font-xs); padding: 3px var(--space-2); border-radius: var(--radius-md); }
    .plot-status.normal { background: var(--success-bg); color: var(--success); }
    .plot-status.warning { background: var(--orange-bg); color: var(--orange); }
    .plot-status.overdue { background: var(--error-bg); color: var(--error); }
    /* 图例作为状态筛选控件：可点击过滤，激活态高亮 */
    .legend-item { cursor: pointer; border-radius: var(--radius-sm); padding: 2px 4px; }
    .legend-item.active { background: rgba(46, 158, 90, 0.12); font-weight: 600; }
    /* 列表顶部的当前选中地块坐标 */
    .list-coord { font-size: var(--font-sm); color: var(--text-light); margin-bottom: var(--space-2); }
    .plot-item.active { background: rgba(46, 158, 90, 0.06); border-radius: var(--radius-md); }
    /* 地块详情底部弹层 */
    .plot-modal-overlay { position: fixed; left: 0; right: 0; top: 0; bottom: 0; background: rgba(0, 0, 0, 0.45); display: none; align-items: flex-end; justify-content: center; z-index: var(--z-modal); }
    .plot-modal-overlay.show { display: flex; }
    .plot-sheet { width: 100%; max-width: 750px; background: var(--bg-white); border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding: var(--space-4); max-height: 78vh; overflow-y: auto; }
    .plot-sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3); }
    .plot-sheet-title { font-size: var(--font-lg); font-weight: 700; color: var(--text); }
    .plot-sheet-close { width: 32px; height: 32px; border-radius: 50%; background: rgba(0, 0, 0, 0.05); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .plot-sheet-close svg { width: 16px; height: 16px; color: var(--text-secondary); }
    .detail-info-row { display: flex; padding: var(--space-2) 0; border-bottom: 1px solid var(--border-light); }
    .detail-info-row:last-child { border-bottom: none; }
    .detail-info-label { width: 80px; flex-shrink: 0; font-size: var(--font-sm); color: var(--text-secondary); }
    .detail-info-value { flex: 1; font-size: var(--font-sm); color: var(--text); }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div style="padding-left: 44px;">
        <div class="header-title">果园地图</div>
        <div class="header-sub">点击地块查看详情</div>
      </div>
    </div>

    <div class="map-container">
      <div class="map-placeholder"><iframe id="mapFrame" class="map-frame" src="https://www.openstreetmap.org/export/embed.html?bbox=106.05%2C34.20%2C106.30%2C34.50&layer=mapnik&marker=34.35%2C106.18" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="天水市麦积区 红崖村花牛苹果基地地图"></iframe></div>

      <div class="map-legend">
        <div class="legend-title">图例 · 点击筛选</div>
        <div class="legend-item" data-status="normal" title="只看正常地块" onclick="toggleStatusFilter('normal')">
          <span class="legend-dot normal"></span>
          <span>正常</span>
        </div>
        <div class="legend-item" data-status="warning" title="只看预警地块" onclick="toggleStatusFilter('warning')">
          <span class="legend-dot warning"></span>
          <span>预警</span>
        </div>
        <div class="legend-item" data-status="danger" title="只看危险地块" onclick="toggleStatusFilter('danger')">
          <span class="legend-dot overdue"></span>
          <span>危险</span>
        </div>
      </div>

      <div class="zoom-controls">
        <div class="zoom-level" id="zoomLevel">100%</div>
        <div class="zoom-btn" id="zoomIn" role="button" aria-label="放大" onclick="zoomIn()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </div>
        <div class="zoom-btn" id="zoomOut" role="button" aria-label="缩小" onclick="zoomOut()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="plot-list">
      <div class="list-title">地块列表</div>
      <div class="list-coord" id="listCoord">未选择地块，点击下方地块可定位</div>
      <div id="plotListItems">
        <div class="plot-item" onclick="openPlotDetail(FALLBACK_PLOTS[0])">
          <span class="plot-dot normal"></span>
          <div class="plot-info">
            <div class="plot-name">地块A1区</div>
            <div class="plot-meta">花牛苹果 · 5年 · 15亩</div>
          </div>
          <span class="plot-status normal">正常</span>
        </div>
        <div class="plot-item" onclick="openPlotDetail(FALLBACK_PLOTS[1])">
          <span class="plot-dot warning"></span>
          <div class="plot-info">
            <div class="plot-name">地块A2区</div>
            <div class="plot-meta">花牛苹果 · 5年 · 18亩</div>
          </div>
          <span class="plot-status warning">预警</span>
        </div>
        <div class="plot-item" onclick="openPlotDetail(FALLBACK_PLOTS[2])">
          <span class="plot-dot overdue"></span>
          <div class="plot-info">
            <div class="plot-name">地块B1区</div>
            <div class="plot-meta">花牛苹果 · 8年 · 22亩</div>
          </div>
          <span class="plot-status overdue">危险</span>
        </div>
        <div class="plot-item" onclick="openPlotDetail(FALLBACK_PLOTS[3])">
          <span class="plot-dot normal"></span>
          <div class="plot-info">
            <div class="plot-name">地块B2区</div>
            <div class="plot-meta">秦冠 · 10年 · 25亩</div>
          </div>
          <span class="plot-status normal">正常</span>
        </div>
      </div>
    </div>

    <!-- 地块详情底部弹层：展示编号 / 基地 / 面积 / 品种 / 树龄 / 负责人 / 经纬度 -->
    <div class="plot-modal-overlay" id="plotDetailModal">
      <div class="plot-sheet">
        <div class="plot-sheet-head">
          <div class="plot-sheet-title" id="plotDetailTitle">地块详情</div>
          <div class="plot-sheet-close" role="button" aria-label="关闭" onclick="closePlotDetail()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </div>
        </div>
        <div id="plotDetailBody"></div>
      </div>
    </div>

    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <script>
    function goBack() {
      window.history.back();
    }
    function navigateTo(page) {
      window.location.href = page;
    }
    /* ============================================================
     * 果园地图 · 读取后台地块主数据
     * localStorage key: smartorchard_plot_master（由后台 enterprise_plot.html 落库）
     * 字段：id / code / name / enterprise / area / variety / year / status / statusText / manager / lng / lat
     * 与移动端手绘地块键 smartorchard_plots 互不相干，本页只读主数据
     * ============================================================ */
    var PLOT_MASTER_KEY = 'smartorchard_plot_master';

    // 状态 → 本页既有样式类（normal / warning / overdue）
    var STATUS_CLASS = { normal: 'normal', warning: 'warning', danger: 'overdue' };
    var STATUS_LABEL = { normal: '正常', warning: '预警', danger: '危险' };

    // 读不到主数据时的兜底地块，保证列表不空白
    var FALLBACK_PLOTS = [
      { id: 'FB-A1', code: '—', name: '地块A1区', enterprise: '天水麦积区基地', area: 15, variety: '花牛苹果', year: 2021, status: 'normal', statusText: '正常', manager: '张三', lng: 106.18, lat: 34.35 },
      { id: 'FB-A2', code: '—', name: '地块A2区', enterprise: '天水麦积区基地', area: 18, variety: '花牛苹果', year: 2021, status: 'warning', statusText: '预警', manager: '张三', lng: 106.19, lat: 34.36 },
      { id: 'FB-B1', code: '—', name: '地块B1区', enterprise: '天水麦积区基地', area: 22, variety: '花牛苹果', year: 2018, status: 'danger', statusText: '危险', manager: '李四', lng: 106.17, lat: 34.34 },
      { id: 'FB-B2', code: '—', name: '地块B2区', enterprise: '天水麦积区基地', area: 25, variety: '秦冠', year: 2016, status: 'normal', statusText: '正常', manager: '李四', lng: 106.20, lat: 34.33 }
    ];

    var PLOT_LIST = [];        // 当前渲染的地块数组（列表 onclick 通过下标引用）
    var statusFilter = '';     // '' 全部 / normal / warning / danger
    var selectedPlotId = '';   // 当前选中地块 id

    function escPlot(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function readPlotMaster() {
      try {
        var arr = JSON.parse(localStorage.getItem(PLOT_MASTER_KEY) || 'null');
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }

    function statusClass(s) { return STATUS_CLASS[s] || 'normal'; }
    function statusLabel(p) { return p.statusText || STATUS_LABEL[p.status] || '正常'; }
    function treeAge(year) {
      var y = parseInt(year, 10);
      if (isNaN(y) || !y) return '—';
      var age = new Date().getFullYear() - y;
      return (age > 0 ? age : 1) + '年';
    }

    // 按状态筛选后的列表；无主数据时回退 4 条兜底
    function currentPlots() {
      var all = readPlotMaster();
      if (!all.length) all = FALLBACK_PLOTS;
      if (!statusFilter) return all;
      return all.filter(function (p) { return p.status === statusFilter; });
    }

    // 渲染地块列表（名称 / 面积 / 品种 / 状态 / 树龄）
    function renderPlotList() {
      var wrap = document.getElementById('plotListItems');
      if (!wrap) return;
      PLOT_LIST = currentPlots();
      if (!PLOT_LIST.length) {
        wrap.innerHTML = '<div class="plot-meta" style="padding:var(--space-3) 0;">当前筛选条件下暂无地块</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < PLOT_LIST.length; i++) {
        var p = PLOT_LIST[i];
        var cls = statusClass(p.status);
        var activeCls = (String(p.id) === String(selectedPlotId)) ? ' active' : '';
        html +=
          '<div class="plot-item' + activeCls + '" onclick="openPlotDetail(PLOT_LIST[' + i + '])">' +
            '<span class="plot-dot ' + cls + '"></span>' +
            '<div class="plot-info">' +
              '<div class="plot-name">' + escPlot(p.name || '未命名地块') + '</div>' +
              '<div class="plot-meta">' + escPlot(p.variety || '未标注') + ' · ' + escPlot(treeAge(p.year)) + ' · ' + escPlot(p.area) + '亩</div>' +
            '</div>' +
            '<span class="plot-status ' + cls + '">' + escPlot(statusLabel(p)) + '</span>' +
          '</div>';
      }
      wrap.innerHTML = html;
    }

    // 用 bbox + marker 把 OSM 内嵌地图定位到该地块
    function buildMapSrc(lng, lat) {
      var dLng = 0.012, dLat = 0.009;
      var bbox = (lng - dLng).toFixed(5) + ',' + (lat - dLat).toFixed(5) + ',' +
                 (lng + dLng).toFixed(5) + ',' + (lat + dLat).toFixed(5);
      return 'https://www.openstreetmap.org/export/embed.html?bbox=' + encodeURIComponent(bbox) +
             '&layer=mapnik&marker=' + lat + ',' + lng;
    }

    // 选中地块：更新地图中心点 + 列表顶部坐标
    function selectPlot(rec) {
      if (!rec) return;
      selectedPlotId = (rec.id != null) ? rec.id : '';
      var coordEl = document.getElementById('listCoord');
      var name = rec.name || '地块';
      if (rec.lng != null && rec.lat != null) {
        var lng = Number(rec.lng), lat = Number(rec.lat);
        if (coordEl) coordEl.textContent = '当前选中：' + name + '（经度 ' + lng.toFixed(4) + '，纬度 ' + lat.toFixed(4) + '）';
        var frame = document.getElementById('mapFrame');
        if (frame) frame.src = buildMapSrc(lng, lat);
      } else if (coordEl) {
        coordEl.textContent = '当前选中：' + name + '（暂无坐标）';
      }
      renderPlotList();
    }

    // 点击地块：定位到地图并在详情弹层展示完整字段
    function openPlotDetail(plot) {
      var rec = (plot && typeof plot === 'object') ? plot : { name: plot };
      selectPlot(rec);

      var titleEl = document.getElementById('plotDetailTitle');
      if (titleEl) titleEl.textContent = rec.name || '地块详情';

      var coord = (rec.lng != null && rec.lat != null)
        ? (Number(rec.lng).toFixed(4) + ', ' + Number(rec.lat).toFixed(4)) : '—';
      var rows = [
        ['地块编号', rec.code || '—'],
        ['所属基地', rec.enterprise || '—'],
        ['面积', (rec.area != null && rec.area !== '') ? (rec.area + ' 亩') : '—'],
        ['品种', rec.variety || '—'],
        ['树龄', treeAge(rec.year)],
        ['负责人', rec.manager || '—'],
        ['经纬度', coord],
        ['状态', statusLabel(rec)]
      ];
      var html = '';
      for (var i = 0; i < rows.length; i++) {
        html += '<div class="detail-info-row">' +
          '<div class="detail-info-label">' + rows[i][0] + '</div>' +
          '<div class="detail-info-value">' + escPlot(rows[i][1]) + '</div>' +
        '</div>';
      }
      var body = document.getElementById('plotDetailBody');
      if (body) body.innerHTML = html;
      var modal = document.getElementById('plotDetailModal');
      if (modal) modal.classList.add('show');
    }

    function closePlotDetail() {
      var modal = document.getElementById('plotDetailModal');
      if (modal) modal.classList.remove('show');
    }

    // 图例即筛选控件：点击按状态过滤，再次点击取消
    function toggleStatusFilter(status) {
      statusFilter = (statusFilter === status) ? '' : status;
      var items = document.querySelectorAll('.legend-item');
      for (var i = 0; i < items.length; i++) {
        var st = items[i].getAttribute('data-status');
        if (statusFilter && st === statusFilter) items[i].classList.add('active');
        else items[i].classList.remove('active');
      }
      renderPlotList();
    }

    // 地图缩放：控制地图区域缩放级别，到边界禁用并提示
    var mapZoom = 1;
    var ZOOM_MIN = 1;
    var ZOOM_MAX = 3;
    var ZOOM_STEP = 0.5;

    function applyZoom() {
      var frame = document.getElementById('mapFrame');
      frame.style.transform = 'scale(' + mapZoom + ')';
      document.getElementById('zoomLevel').textContent = Math.round(mapZoom * 100) + '%';
      document.getElementById('zoomIn').classList.toggle('disabled', mapZoom >= ZOOM_MAX);
      document.getElementById('zoomOut').classList.toggle('disabled', mapZoom <= ZOOM_MIN);
    }
    function zoomIn() {
      if (mapZoom >= ZOOM_MAX) {
        if (window.MobileStore) MobileStore.toast('已到最大缩放级别', 'warning');
        return;
      }
      mapZoom = Math.min(ZOOM_MAX, mapZoom + ZOOM_STEP);
      applyZoom();
    }
    function zoomOut() {
      if (mapZoom <= ZOOM_MIN) {
        if (window.MobileStore) MobileStore.toast('已到最小缩放级别', 'warning');
        return;
      }
      mapZoom = Math.max(ZOOM_MIN, mapZoom - ZOOM_STEP);
      applyZoom();
    }

    // 跨页同步：后台改地块（其它标签页 / iframe 写入）后刷新本页列表
    window.addEventListener('storage', function (e) {
      if (e && e.key && e.key !== PLOT_MASTER_KEY) return;
      renderPlotList();
    });
    // 从后台切回本页时兜底刷新
    window.addEventListener('focus', renderPlotList);

    renderPlotList();
    applyZoom();
  </script>
</body>
