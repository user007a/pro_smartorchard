<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 果园地图</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="../applefarm_backhand/css/design-system.css">
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <style>
    /* 移除重复的 :root 变量定义，使用设计系统变量 */
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 66px; }
    /* Header */
    .page-header {
      position: relative;
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
      padding: 44px 16px 20px;
      color: var(--bg-white);
    }
    
    .header-back {
      position: absolute;
      left: 12px;
      top: 44px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .header-back svg { width: 18px; height: 18px; }
    
    .header-title { font-size: var(--font-xl); font-weight: 700; }
    .map-container { position: relative; height: calc(100vh - 180px); background: #e8eef3; }
    .map-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, #e8eef3 0%, #d4dde5 100%); }
    .map-grid { width: 80%; max-width: 280px; aspect-ratio: 1; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); gap: var(--space-1); }
    .grid-cell { background: rgba(46, 158, 90, 0.1); border: 1px solid rgba(46, 158, 90, 0.2); border-radius: var(--radius-sm); }
    .grid-cell.plot { background: rgba(46, 158, 90, 0.3); border-color: rgba(46, 158, 90, 0.5); }
    .plot-marker { position: relative; }
    .plot-marker::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; background: var(--primary); border-radius: 50%; border: 2px solid var(--bg-white); box-shadow: var(--shadow-sm); }
    .plot-marker.warning::after { background: var(--orange); }
    .plot-marker.overdue::after { background: var(--error); }
    .map-legend { position: absolute; bottom: var(--space-4); left: var(--space-4); background: rgba(255,255,255,0.95); border-radius: var(--radius-md); padding: var(--space-3); box-shadow: var(--shadow-md); }
    .legend-title { font-size: var(--font-sm); font-weight: 600; color: var(--text); margin-bottom: var(--space-2); }
    .legend-item { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-1); font-size: var(--font-sm); color: var(--text-secondary); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .legend-dot.normal { background: var(--primary); }
    .legend-dot.warning { background: var(--orange); }
    .legend-dot.overdue { background: var(--error); }
    .zoom-controls { position: absolute; bottom: var(--space-4); right: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
    .zoom-btn { width: 40px; height: 40px; background: rgba(255,255,255,0.95); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow-sm); }
    .zoom-btn svg { width: 20px; height: 20px; color: var(--text); }
    .plot-list { background: var(--bg-white); border-top: 1px solid var(--border); padding: var(--space-3) var(--space-4); }
    .list-title { font-size: var(--font-base); font-weight: 600; color: var(--text); margin-bottom: var(--space-2); }
    .plot-item { display: flex; align-items: center; padding: var(--space-2) 0; border-bottom: 1px solid var(--border-light); cursor: pointer; }
    .plot-item:last-child { border-bottom: none; }
    .plot-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: var(--space-3); }
    .plot-dot.normal { background: var(--primary); }
    .plot-dot.warning { background: var(--orange); }
    .plot-dot.overdue { background: var(--error); }
    .plot-info { flex: 1; }
    .plot-name { font-size: var(--font-base); color: var(--text); }
    .plot-meta { font-size: var(--font-sm); color: var(--text-light); margin-top: var(--space-1); }
    .plot-status { font-size: var(--font-xs); padding: 3px var(--space-2); border-radius: var(--radius-md); }
    .plot-status.normal { background: var(--success-bg); color: var(--success); }
    .plot-status.warning { background: var(--orange-bg); color: var(--orange); }
    .plot-status.overdue { background: var(--error-bg); color: var(--error); }
    .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 750px; height: 56px; background: var(--bg-white); display: flex; border-top: 1px solid var(--border); z-index: 100; }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-light); transition: color var(--transition-fast); cursor: pointer; }
    .tab-item.active { color: var(--primary); }
    .tab-item svg { width: 22px; height: 22px; }
    .tab-item span { font-size: var(--font-xs); }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div style="padding-left: 44px;">
        <div class="header-title">果园地图</div>
        <div class="header-sub">点击地块查看详情</div>
      </div>
    </div>

    <div class="map-container">
      <div class="map-placeholder">
        <div style="font-size: var(--font-sm); color: var(--text-light); margin-bottom: var(--space-5);">果园俯视图</div>
        <div class="map-grid">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell plot plot-marker normal"></div>
          <div class="grid-cell plot plot-marker normal"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell plot plot-marker warning"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell plot plot-marker normal"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell plot plot-marker overdue"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell plot plot-marker normal"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell plot"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div style="font-size: var(--font-xs); color: var(--text-light); margin-top: var(--space-5);">共 8 块地块</div>
      </div>

      <div class="map-legend">
        <div class="legend-title">图例</div>
        <div class="legend-item">
          <span class="legend-dot normal"></span>
          <span>正常</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot warning"></span>
          <span>待执行</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot overdue"></span>
          <span>已逾期</span>
        </div>
      </div>

      <div class="zoom-controls">
        <div class="zoom-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </div>
        <div class="zoom-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="plot-list">
      <div class="list-title">地块列表</div>
      <div class="plot-item" onclick="openPlotDetail('地块A1区')">
        <span class="plot-dot normal"></span>
        <div class="plot-info">
          <div class="plot-name">地块A1区</div>
          <div class="plot-meta">红富士 · 5年 · 15亩</div>
        </div>
        <span class="plot-status normal">正常</span>
      </div>
      <div class="plot-item" onclick="openPlotDetail('地块A2区')">
        <span class="plot-dot warning"></span>
        <div class="plot-info">
          <div class="plot-name">地块A2区</div>
          <div class="plot-meta">红富士 · 5年 · 18亩</div>
        </div>
        <span class="plot-status warning">待执行</span>
      </div>
      <div class="plot-item" onclick="openPlotDetail('地块B1区')">
        <span class="plot-dot overdue"></span>
        <div class="plot-info">
          <div class="plot-name">地块B1区</div>
          <div class="plot-meta">嘎啦 · 8年 · 22亩</div>
        </div>
        <span class="plot-status overdue">已逾期</span>
      </div>
      <div class="plot-item" onclick="openPlotDetail('地块B2区')">
        <span class="plot-dot normal"></span>
        <div class="plot-info">
          <div class="plot-name">地块B2区</div>
          <div class="plot-meta">秦冠 · 10年 · 25亩</div>
        </div>
        <span class="plot-status normal">正常</span>
      </div>
    </div>

    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <script>
    function goBack() {
      window.history.back();
    }
    function navigateTo(page) {
      window.location.href = page;
    }
    function openPlotDetail(name) {
      window.location.href = 'mb_plot.html';
    }
  </script>
</body>
</html>
