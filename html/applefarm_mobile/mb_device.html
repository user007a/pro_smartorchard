<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 设备监控</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <script src="js/mobile-store.js"></script>
  <script src="../applefarm_backhand/js/shared/device-store.js"></script>
  <style>
    /* Stats Bar */
    .stats-bar {
      display: flex;
      justify-content: space-around;
      padding: 20px 16px;
      background: var(--bg-white);
      margin: 12px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    
    .stat-item { text-align: center; }
    
    .stat-value {
      font-size: var(--font-2xl);
      font-weight: 800;
    }
    
    .stat-value.online { color: var(--success); }
    .stat-value.offline { color: var(--error); }
    .stat-value.warning { color: var(--warning); }
    
    .stat-label {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-top: 6px;
    }
    
    /* Filter Bar */
    .filter-bar {
      display: flex;
      gap: 10px;
      padding: 0 12px;
      margin-bottom: 14px;
    }
    
    .filter-item {
      padding: 10px 16px;
      background: var(--bg-white);
      border-radius: var(--radius-full);
      font-size: var(--font-sm);
      color: var(--text-secondary);
      cursor: pointer;
      border: 2px solid transparent;
      transition: all var(--transition-fast);
    }
    
    .filter-item.active {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }
    
    /* Device Card */
    .device-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: 16px;
      margin: 0 12px 14px;
      border: 1px solid var(--border);
      transition: all var(--transition-fast);
    }
    
    .device-card:active { transform: scale(0.99); }
    
    .device-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    
    .device-icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }
    
    .device-icon-wrap.online { background: var(--success-bg); }
    .device-icon-wrap.offline { background: var(--gray-100); }
    .device-icon-wrap.warning { background: var(--warning-bg); }
    
    .device-icon-wrap svg { width: 28px; height: 28px; }
    .device-icon-wrap.online svg { color: var(--success); }
    .device-icon-wrap.offline svg { color: var(--text-light); }
    .device-icon-wrap.warning svg { color: var(--warning); }
    
    .device-info { flex: 1; min-width: 0; }
    
    .device-name {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
    }
    
    .device-location {
      font-size: var(--font-xs);
      color: var(--text-light);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .device-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 11px;
      border-radius: var(--radius-full);
      font-size: var(--font-xs);
      font-weight: 500;
      margin-top: 8px;
    }
    
    .device-status-badge.online {
      background: var(--success-bg);
      color: var(--success);
    }
    
    .device-status-badge.offline {
      background: var(--gray-100);
      color: var(--text-light);
    }
    
    .device-status-badge.warning {
      background: var(--warning-bg);
      color: var(--warning);
      animation: pulse 2s infinite;
    }
    
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    
    .status-dot.online { background: var(--success); }
    .status-dot.offline { background: var(--text-light); }
    .status-dot.warning { background: var(--warning); animation: pulse 2s infinite; }
    
    /* Device Params */
    .device-params {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--border-light);
    }
    
    .param-item {
      flex: 1;
      text-align: center;
      padding: 12px 8px;
      background: var(--gray-50);
      border-radius: var(--radius-lg);
    }
    
    .param-value {
      font-size: var(--font-lg);
      font-weight: 700;
      color: var(--text);
    }
    
    .param-unit {
      font-size: var(--font-xs);
      color: var(--text-light);
      margin-left: 2px;
    }
    
    .param-label {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-top: 6px;
    }
    
    /* Alert Section */
    .alert-section {
      padding: 14px;
      background: var(--error-bg);
      border-radius: var(--radius-lg);
      margin-top: 14px;
      border-left: 4px solid var(--error);
    }
    
    .alert-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    
    .alert-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--error);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .alert-icon svg { width: 18px; height: 18px; color: var(--bg-white); }
    
    .alert-title {
      font-size: var(--font-sm);
      font-weight: 600;
      color: var(--error);
    }
    
    .alert-content {
      font-size: var(--font-sm);
      color: var(--error);
      line-height: 1.5;
    }
    
    .alert-btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: var(--error);
      color: var(--bg-white);
      border: none;
      border-radius: var(--radius-full);
      font-size: var(--font-sm);
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .alert-btn:active { transform: scale(0.98); }
    
    /* Modal: 已迁移到统一弹窗组件 .mb-modal-overlay.is-sheet / .mb-modal.is-sheet */
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .modal-title {
      font-size: var(--font-lg);
      font-weight: 700;
      color: var(--text);
    }
    
    .modal-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--gray-100);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .modal-close svg { width: 18px; height: 18px; color: var(--text-secondary); }
    
    .detail-section { margin-bottom: 22px; }
    
    .detail-title {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .detail-title svg { width: 18px; height: 18px; color: var(--primary); }
    
    .info-list {
      background: var(--gray-50);
      border-radius: var(--radius-lg);
      padding: 14px;
    }
    
    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    
    .info-item:last-child { border-bottom: none; }
    
    .info-label {
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }
    
    .info-value {
      font-size: var(--font-sm);
      color: var(--text);
      font-weight: 500;
    }
    
    .chart-area {
      height: 180px;
      background: var(--gray-50);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    
    .chart-area::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(34, 168, 74, 0.03), transparent);
    }
    
    .chart-placeholder {
      text-align: center;
      position: relative;
      z-index: 1;
    }
    
    .chart-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: var(--info-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .chart-icon svg { width: 32px; height: 32px; color: var(--info); }
    
    .chart-text {
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }
    
    .action-btns {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    
    .action-btn {
      flex: 1;
      height: 44px;
      border-radius: var(--radius-full);
      font-size: var(--font-sm);
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all var(--transition-fast);
    }
    
    .action-btn:active { transform: scale(0.98); }
    
    .action-btn.primary {
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: var(--bg-white);
    }
    
    .action-btn.secondary {
      background: var(--gray-100);
      color: var(--text-secondary);
    }
    
    .action-btn.warning {
      background: var(--warning-bg);
      color: var(--warning);
    }

    /* 刷新时间 */
    .refresh-time {
      text-align: center;
      font-size: var(--font-xs);
      color: var(--text-light);
      margin: -6px 0 12px;
    }

    /* 筛选结果计数 */
    .filter-result {
      padding: 0 16px;
      margin-bottom: 12px;
      font-size: var(--font-xs);
      color: var(--text-secondary);
    }

    /* 维护申请表单 */
    .form-row { margin-bottom: 16px; }
    .form-label {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: block;
    }
    .form-select,
    .form-textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      font-size: var(--font-sm);
      color: var(--text);
      background: var(--bg-white);
      font-family: inherit;
      outline: none;
    }
    .form-textarea { min-height: 88px; resize: vertical; line-height: 1.5; }
    .form-select:focus,
    .form-textarea:focus { border-color: var(--primary); }
  </style>
</head>
<body>
  <div class="mb-app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div class="header-content">
        <div class="header-title">设备监控</div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-value online" id="devStatOnline">--</div>

      <div class="stat-item">

        <div class="stat-label">离线设备</div>
      </div>
      <div class="stat-item">
        <div class="stat-value warning" id="devStatWarning">--</div>
        <div class="stat-label">预警设备</div>
      </div>

      <div class="filter-item active" onclick="filterDevices('all', this)">全部</div>
      <div class="filter-item" onclick="filterDevices('online', this)">在线</div>

    <!-- Device List -->

    <!-- Tab Bar -->
    <div class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('mb_home.html')">

          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>

        <span>服务</span>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>

          <rect x="14" y="14" width="7" height="7"/>

        </svg>
        <span>地块</span>

      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>

  <!-- Detail Modal -->
  <div class="mb-modal-overlay is-sheet" id="detailModal">
    <div class="mb-modal is-sheet">
      <div class="modal-header">
        <div class="modal-title" id="modalDeviceName">设备详情</div>

  <!-- Maintain Modal -->

    <div class="mb-modal is-sheet">

        <div class="modal-title">申请设备维护</div>
        <div class="modal-close" onclick="closeMaintainModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>

          </svg>
        </div>
      </div>

      <div class="detail-section">
        <div class="form-row">
          <label class="form-label">选择设备</label>
          <select class="form-select" id="mtDevice">
            <option value="温湿度传感器">温湿度传感器 #001</option>
            <option value="土壤湿度传感器">土壤湿度传感器 #002</option>
            <option value="灌溉控制器">灌溉控制器 #003</option>

            <option value="normal" selected>较急 - 48小时内处理</option>
            <option value="high">紧急 - 需尽快处理</option>
          </select>
        </div>
        <div class="form-row">
          <label class="form-label">维护原因</label>
          <textarea class="form-textarea" id="mtReason" placeholder="请描述设备故障现象或需要维护的内容…"></textarea>

        <button class="mb-btn mb-btn-secondary" onclick="closeMaintainModal()">取消</button>

      </div>
    </div>

  <script src="js/mobile-data.js"></script>
  <script>
    /* ============================================================
     * 设备页（严格空库 · 全部取自数据库）
     * ------------------------------------------------------------
     * 设备列表 → sf_device（+ sf_device_type / sf_base / sf_plot）
     * 实时读数 → sf_device_log 的「数据采集」日志（measure_key + value）
     * 维护申请 → sf_device_maintain
     * ============================================================ */
    var MD = window.MobileData;
    var currentDevice = '';
    var currentFilter = 'all';

    function goBack() { window.history.back(); }
    function navigateTo(page) { window.location.href = page; }

    function esc(s) {
      return MD ? MD.esc(s) : String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    var STATUS_TEXT = { online: '在线', offline: '离线', warning: '预警', running: '运行中', fault: '故障', maintain: '维护中' };

    function filterLabel(type) {
      return { all: '全部', online: '在线', offline: '离线', warning: '预警' }[type] || type;
    }

    /* ---------- 数据读取 ---------- */
    function readDevices() {
      return MD ? MD.list('device') : [];
    }

    function typeNameOf(deviceTypeId) {
      var types = MD ? MD.list('device_type') : [];
      for (var i = 0; i < types.length; i++) {
        if (String(types[i].id) === String(deviceTypeId)) return types[i].type_name || types[i].type_code || '';
      }
      return '';
    }

    function baseNameOf(baseId) {
      var bases = MD ? MD.list('base') : [];
      for (var i = 0; i < bases.length; i++) {
        if (String(bases[i].id) === String(baseId)) return bases[i].name || '';
      }
      return '';
    }

    function plotNameOf(plotId) {
      var plots = MD ? MD.list('plot') : [];
      for (var i = 0; i < plots.length; i++) {
        if (String(plots[i].id) === String(plotId)) return plots[i].name || '';
      }
      return '';
    }

    /** 设备最近一次上报值（来自 sf_device_log 数据采集日志） */
    function readingsOf(deviceId) {
      var logs = MD ? MD.list('device_log') : [];
      var out = {};
      logs.forEach(function (r) {
        if (String(r.device_id) !== String(deviceId)) return;
        if (!r.measure_key || r.value == null || r.value === '') return;
        var n = parseFloat(r.value);
        if (isNaN(n)) return;
        var at = r.log_time || r.created_at || '';
        if (!out[r.measure_key] || String(at) > String(out[r.measure_key].at)) {
          out[r.measure_key] = { value: n, at: at };
        }
      });
      return out;
    }

    /* ---------- 设备列表 ---------- */
    function renderDeviceList() {
      var box = document.getElementById('deviceList');
      if (!box || !MD) return;
      var devices = readDevices();
      if (!devices.length) {
        box.innerHTML = MD.empty('暂无设备数据', '数据库中尚未维护设备台账');
        applyFilter(currentFilter);
        return;
      }
      box.innerHTML = devices.map(function (d) {
        var status = d.run_status || 'offline';
        var readings = readingsOf(d.id);
        var loc = [plotNameOf(d.plot_id), d.location].filter(Boolean).join(' - ') || baseNameOf(d.base_id) || '未标注位置';
        var typeName = typeNameOf(d.device_type) || d.device_type || '';
        var params = [];
        var keys = Object.keys(readings);
        keys.slice(0, 3).forEach(function (k) {
          params.push({
            value: readings[k].value,
            label: measureLabel(k)
          });
        });
        if (!params.length) params.push({ value: '--', label: '暂无读数' });

        return '<div class="device-card" data-status="' + esc(status) + '" onclick="openDeviceDetail(\'' + esc(d.device_code) + '\')">' +
          '<div class="device-header">' +
            '<div class="device-icon-wrap ' + (status === 'online' ? 'online' : '') + '">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>' +
              '</svg>' +
            '</div>' +
            '<div class="device-info">' +
              '<div class="device-name">' + esc(d.device_name) + (typeName ? ' · ' + esc(typeName) : '') + '</div>' +
              '<div class="device-location">📍 ' + esc(loc) + '</div>' +
              '<div class="device-status-badge ' + (status === 'online' ? 'online' : '') + '">' +
                '<span class="status-dot ' + (status === 'online' ? 'online' : '') + '"></span>' +
                '<span>' + esc(STATUS_TEXT[status] || status) + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="device-params">' +
            params.map(function (p) {
              var v = (typeof p.value === 'number') ? p.value : p.value;
              var vTxt = (typeof v === 'number') ? (Math.round(v * 10) / 10) : v;
              return '<div class="param-item">' +
                '<div class="param-value">' + esc(String(vTxt)) + '</div>' +
                '<div class="param-label">' + esc(p.label) + '</div>' +
              '</div>';
            }).join('') +
          '</div>' +
        '</div>';
      }).join('');
      applyFilter(currentFilter);
    }

    /** 测点 key → 中文名称（取物模型 sf_device_measure） */
    function measureLabel(key) {
      var measures = MD ? MD.list('device_measure') : [];
      for (var i = 0; i < measures.length; i++) {
        if (String(measures[i].measure_key) === String(key)) {
          return measures[i].measure_name || key;
        }
      }
      return key;
    }

    /* ---------- 筛选 ---------- */
    function applyFilter(type) {
      var cards = document.querySelectorAll('#deviceList .device-card');
      var count = 0;
      cards.forEach(function (card) {
        var match = (type === 'all') || (card.getAttribute('data-status') === type);
        card.style.display = match ? '' : 'none';
        if (match) count++;
      });
      var result = document.getElementById('filterResult');
      if (result) {
        result.textContent = type === 'all'
          ? '共 ' + count + ' 台设备'
          : filterLabel(type) + '设备 ' + count + ' 台';
      }
      updateStats();
    }

    function filterDevices(type, el) {
      currentFilter = type;
      document.querySelectorAll('.filter-item').forEach(function (item) { item.classList.remove('active'); });
      if (el) el.classList.add('active');
      applyFilter(type);
      var visible = document.querySelectorAll('#deviceList .device-card:not([style*="display: none"])').length;
      MobileStore.toast('已筛选' + filterLabel(type) + '设备：' + visible + ' 台', 'info');
    }

    function updateStats() {
      if (!MD) return;
      var list = readDevices();
      function count(s) { return list.filter(function (d) { return (d.run_status || 'offline') === s; }).length; }
      function set(id, v) { var e = document.getElementById(id); if (e) e.textContent = v; }
      set('devStatOnline', count('online'));
      set('devStatOffline', count('offline'));
      set('devStatWarning', count('warning'));
    }

    function updateRefreshTime() {
      var now = new Date();
      var p = function (n) { return n < 10 ? '0' + n : n; };
      document.getElementById('refreshTime').textContent =
        '数据更新于 ' + p(now.getHours()) + ':' + p(now.getMinutes()) + ':' + p(now.getSeconds());
    }

    /* ---------- 趋势图：取设备历史采集日志（sf_device_log） ---------- */
    function renderDeviceTrend(deviceCode) {
      var box = document.getElementById('deviceTrendChart');
      if (!box || !MD) return;

      var logs = MD.list('device_log').filter(function (r) {
        if (String(r.device_id) !== String(deviceCode)) return false;
        return !!r.measure_key && r.value != null && r.value !== '';
      }).sort(function (a, b) {
        return String(a.log_time || '').localeCompare(String(b.log_time || ''));
      });

      if (!logs.length) {
        box.innerHTML = MD.inlineEmpty('暂无历史采集数据');
        return;
      }

      /* 取出现次数最多的两个测点作为折线 */
      var byKey = {};
      logs.forEach(function (r) {
        var n = parseFloat(r.value);
        if (isNaN(n)) return;
        (byKey[r.measure_key] = byKey[r.measure_key] || []).push(n);
      });
      var keys = Object.keys(byKey).sort(function (a, b) { return byKey[b].length - byKey[a].length; }).slice(0, 2);
      if (!keys.length) {
        box.innerHTML = MD.inlineEmpty('暂无有效采集数据');
        return;
      }

      var N = 12, W = 320, H = 150, PL = 30, PR = 10, PT = 14, PB = 22;
      var iw = W - PL - PR, ih = H - PT - PB;
      var series = keys.map(function (k) { return { key: k, unit: unitOf(k), data: byKey[k].slice(-N) }; });

      function pathOf(data, min, max) {
        var d = '', a = '';
        for (var i = 0; i < data.length; i++) {
          var x = PL + (i / Math.max(1, N - 1)) * iw;
          var y = PT + ih - ((data[i] - min) / (max - min)) * ih;
          d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
          a += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) +
               'L' + x.toFixed(1) + ' ' + (PT + ih) + 'Z';
        }
        return { line: d, area: a };
      }

      var all = [];
      series.forEach(function (s) { all = all.concat(s.data); });
      var vMin = Math.min.apply(null, all), vMax = Math.max.apply(null, all);
      if (vMax === vMin) { vMax = vMin + 1; vMin = vMin - 1; }

      var colors = ['#ff6b35', '#1890ff'];
      var grid = '';
      for (var g = 0; g <= 3; g++) {
        var gy = PT + (g / 3) * ih;
        grid += '<line x1="' + PL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - PR) +
                '" y2="' + gy.toFixed(1) + '" stroke="#e8e8e8" stroke-width="1"/>';
      }

      var paths = series.map(function (s) {
        var p = pathOf(s.data, vMin, vMax);
        return '<path d="' + p.area + '" fill="' + colors[series.indexOf(s)] + '" opacity=".14"/>' +
          '<path d="' + p.line + '" fill="none" stroke="' + colors[series.indexOf(s)] + '" stroke-width="2" ' +
          'stroke-linecap="round" stroke-linejoin="round"/>';
      }).join('');

      var legend = series.map(function (s, i) {
        var last = s.data.length ? s.data[s.data.length - 1] : null;
        return '<div style="position:absolute;left:34px;top:' + (6 + i * 14) + 'px;font-size:11px;color:' + colors[i] + ';font-weight:600">' +
          esc(measureLabel(s.key)) + ' ' + (last == null ? '--' : last) + esc(s.unit) + '</div>';
      }).join('');

      box.innerHTML =
        '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" ' +
        'style="display:block" role="img" aria-label="设备历史采集趋势">' +
        grid + paths +
        '<text x="4" y="' + (PT + 4) + '" font-size="9" fill="#8c8c8c">' + vMax.toFixed(0) + '</text>' +
        '<text x="4" y="' + (PT + ih) + '" font-size="9" fill="#8c8c8c">' + vMin.toFixed(0) + '</text>' +
        '<text x="' + PL + '" y="' + (H - 5) + '" font-size="9" fill="#8c8c8c">较早</text>' +
        '<text x="' + (W - PR) + '" y="' + (H - 5) + '" font-size="9" fill="#8c8c8c" text-anchor="end">最新</text>' +
        '</svg>' + legend;
    }

    function unitOf(key) {
      var measures = MD ? MD.list('device_measure') : [];
      for (var i = 0; i < measures.length; i++) {
        if (String(measures[i].measure_key) === String(key)) return measures[i].unit || '';
      }
      return '';
    }

    /* ---------- 设备详情 ---------- */
    function findDevice(code) {
      var devices = readDevices();
      for (var i = 0; i < devices.length; i++) {
        if (String(devices[i].device_code) === String(code)) return devices[i];
      }
      return null;
    }

    function openDeviceDetail(code) {
      currentDevice = code;
      var d = findDevice(code);
      document.getElementById('modalDeviceName').textContent = (d ? d.device_name : code) + ' - 详情';

      var loc = d ? ([plotNameOf(d.plot_id), d.location].filter(Boolean).join(' - ') || baseNameOf(d.base_id) || '未标注位置') : '--';
      var rows = [
        ['设备编号', d ? (d.sn || d.device_code) : '--'],
        ['安装位置', loc],
        ['安装日期', d && d.install_date ? d.install_date : '--'],
        ['运行时长', d && d.running_hours != null ? (Math.round(Number(d.running_hours) * 10) / 10) + '小时' : '--'],
        ['上次维护', d && d.last_maintain_date ? d.last_maintain_date : '--']
      ];
      var listEl = document.querySelector('#detailModal .info-list');
      if (listEl) {
        listEl.innerHTML = rows.map(function (r) {
          return '<div class="info-item"><div class="info-label">' + esc(r[0]) + '</div>' +
            '<div class="info-value">' + esc(String(r[1])) + '</div></div>';
        }).join('');
      }

      renderDeviceTrend(code);
      document.getElementById('detailModal').classList.add('show');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.remove('show');
    }

    function handleAlert(e) {
      e.stopPropagation();
      var devices = readDevices();
      if (devices.length) openDeviceDetail(devices[0].device_code);
    }

    function refreshDevice() {
      updateRefreshTime();
      if (MD) MD.reload('device_log').then(function () { renderDeviceList(); });
      else applyFilter(currentFilter);
      MobileStore.toast('数据已刷新', 'success');
    }

    /* ---------- 维护申请 ---------- */
    function renderMaintainOptions() {
      var sel = document.getElementById('mtDevice');
      if (!sel) return;
      var devices = readDevices();
      sel.innerHTML = devices.length
        ? devices.map(function (d) {
            return '<option value="' + esc(d.device_code) + '">' + esc(d.device_name) + '</option>';
          }).join('')
        : '<option value="">暂无设备</option>';
    }

    function maintainDevice() {
      closeDetailModal();
      renderMaintainOptions();
      var sel = document.getElementById('mtDevice');
      if (sel && currentDevice) {
        for (var i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value === currentDevice) { sel.selectedIndex = i; break; }
        }
      }
      document.getElementById('mtReason').value = '';
      document.getElementById('maintainModal').classList.add('show');
    }

    function closeMaintainModal() {
      document.getElementById('maintainModal').classList.remove('show');
    }

    function submitMaintain() {
      var device = document.getElementById('mtDevice').value;
      var urgency = document.getElementById('mtUrgency').value;
      var reason = document.getElementById('mtReason').value.trim();
      if (!device) { MobileStore.toast('设备台账为空，无法提交维护申请', 'warning'); return; }
      if (!reason) {
        MobileStore.toast('请填写维护原因', 'warning');
        return;
      }
      if (!(window.Api && Api.isLoggedIn())) { MobileStore.toast('登录已失效，请重新登录', 'error'); return; }

      var target = null;
      readDevices().forEach(function (d) { if (String(d.device_code) === String(device)) target = d; });
      if (!target) { MobileStore.toast('未找到设备台账', 'error'); return; }

      Api.create('device_maintain', {
        maintain_code: 'MT' + Date.now(),
        device_id: target.id,
        maintain_type: '故障报修',
        fault_desc: reason,
        content: reason,
        manager: (MD && MD.user() ? (MD.user().realName || MD.user().account) : '') || '',
        plan_time: MD ? (MD.today() + ' ' + new Date().toTimeString().slice(0, 8)) : null,
        priority: urgency,
        status: 'pending'
      }).then(function (res) {
        if (res && res.ok) {
          MobileStore.toast('维护申请已提交，工作人员将尽快处理', 'success');
          closeMaintainModal();
          if (MD) MD.reload('device_maintain');
        } else {
          MobileStore.toast((res && res.message) || '提交失败，请稍后重试', 'error');
        }
      }).catch(function () {
        MobileStore.toast('提交失败，请检查网络', 'error');
      });
    }

    /* ---------- 渲染入口 ---------- */
    function renderAll() {
      renderDeviceList();
      renderMaintainOptions();
      updateStats();
    }

    renderAll();
    updateRefreshTime();
    if (MD) MD.subscribe(renderAll);
  </script>

  <script>
    /* 设备统计：与后台设备台账同源（P1-08） */
    (function () {
      if (!window.DeviceStore) return;
      try {
        var list = DeviceStore.devices();
        function count(s) { return list.filter(function (d) { return d.status === s; }).length; }
        var set = function (id, v) { var e = document.getElementById(id); if (e) e.textContent = v; };
        set('devStatOnline', count('online'));
        set('devStatOffline', count('offline'));
        set('devStatWarning', count('warning'));
      } catch (e) { console.warn('[mb_device] 统计绑定失败', e); }
    })();
  
/* ============================================================
 * 后端数据到达后自动重绘
 * ------------------------------------------------------------
 * 数据层在「后端预加载完成」与「本地写入」两条路径上都会派发
 * <store>StoreChange 窗口事件；页面若不监听，首次渲染发生在数据
 * 到达之前，界面会一直停在空列表。此处统一订阅后自动重绘。
 * ============================================================ */
(function () {
  // StoreLive 由 common/js/api.js 提供；部分页面未静态引入该文件，
  // 此时回退到原生窗口事件订阅，避免订阅被静默跳过导致页面不重绘。
  function bind(events, handler) {
    if (typeof StoreLive !== 'undefined') return StoreLive.on(events, handler);
    (Array.isArray(events) ? events : [events]).forEach(function (ev) {
      if (ev) window.addEventListener(ev, function () { try { handler(); } catch (e) { console.warn('[store-live]', e); } });
    });
  }
  bind(["deviceStoreChange"], function () {
      refreshDevice();
  });
})();
</script>
