<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 产量估测</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body { font-family: var(--font-family); background: var(--bg); color: var(--text); overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 66px; }
    
    .content { padding: 16px; }
    
    .total-card { background: linear-gradient(135deg, var(--primary), #3ddc84); border-radius: var(--radius-xl); padding: var(--space-6) var(--space-5); margin-bottom: var(--space-4); color: var(--bg-white); box-shadow: var(--shadow-md); }
    .total-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); }
    .total-title { font-size: var(--font-md); opacity: 0.9; display: flex; align-items: center; gap: var(--space-1); }
    .total-update { font-size: var(--font-xs); opacity: 0.7; }
    .total-main { display: flex; align-items: baseline; justify-content: center; gap: var(--space-2); margin-bottom: var(--space-2); }
    .total-value { font-size: 48px; font-weight: 800; }
    .total-unit { font-size: var(--font-lg); opacity: 0.9; }
    .total-compare { text-align: center; font-size: var(--font-base); opacity: 0.9; margin-bottom: var(--space-4); }
    .total-range { display: flex; justify-content: center; gap: var(--space-4); font-size: var(--font-sm); opacity: 0.8; }
    
    .chart-card { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-4); margin-bottom: var(--space-4); box-shadow: var(--shadow-md); border: 1px solid var(--border); }
    .chart-title { font-size: var(--font-md); font-weight: 600; color: var(--text); margin-bottom: var(--space-4); display: flex; align-items: center; gap: var(--space-1); }
    .chart-bars { display: flex; align-items: flex-end; justify-content: space-around; height: 120px; padding: 0 var(--space-2); }
    .chart-bar-item { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
    .chart-bar { width: 50px; background: linear-gradient(180deg, var(--primary), #86e3c3); border-radius: var(--radius-sm) var(--radius-sm) 0 0; transition: height .5s ease; }
    .chart-bar-label { font-size: var(--font-xs); color: var(--text-secondary); }
    .chart-bar-value { font-size: var(--font-sm); font-weight: 600; color: var(--text); margin-top: var(--space-1); }
    
    .plot-list { background: var(--bg-white); border-radius: var(--radius-xl); overflow: hidden; box-shadow: var(--shadow-md); border: 1px solid var(--border); }
    .plot-header { padding: 14px var(--space-4); font-size: var(--font-md); font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--space-2); }
    .plot-item { padding: 14px var(--space-4); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--space-3); }
    .plot-item:last-child { border-bottom: none; }
    .plot-color { width: var(--space-2); height: 40px; border-radius: var(--radius-sm); }
    .plot-color.green { background: var(--primary); }
    .plot-color.orange { background: var(--warning); }
    .plot-color.blue { background: var(--info); }
    .plot-info { flex: 1; }
    .plot-name { font-size: var(--font-md); font-weight: 600; color: var(--text); }
    .plot-variety { font-size: var(--font-sm); color: var(--text-secondary); margin-top: 2px; }
    .plot-percent { width: 50px; height: var(--space-1); background: #f0f0f0; border-radius: 3px; margin-top: var(--space-1); overflow: hidden; }
    .plot-percent-fill { height: 100%; border-radius: 3px; }
    .plot-percent-fill.green { background: var(--primary); }
    .plot-percent-fill.orange { background: var(--warning); }
    .plot-percent-fill.blue { background: var(--info); }
    .plot-value { text-align: right; }
    .plot-tons { font-size: var(--font-lg); font-weight: 700; color: var(--text); }
    .plot-tons-unit { font-size: var(--font-xs); color: var(--text-light); }
    
    .factors-card { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-4); margin-top: var(--space-4); box-shadow: var(--shadow-md); border: 1px solid var(--border); }
    .factors-title { font-size: var(--font-md); font-weight: 600; color: var(--text); margin-bottom: var(--space-3); display: flex; align-items: center; gap: var(--space-1); }
    .factors-section { margin-bottom: var(--space-3); }
    .factors-section:last-child { margin-bottom: 0; }
    .factors-label { font-size: var(--font-sm); color: var(--text-secondary); margin-bottom: var(--space-2); display: flex; align-items: center; gap: var(--space-1); }
    .factors-label.positive { color: var(--primary); }
    .factors-label.negative { color: var(--error); }
    .factors-item { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) 0; }
    .factors-icon { font-size: var(--font-md); }
    .factors-text { font-size: var(--font-base); color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="app">
    <div class="header-bg">
      <div class="page-header">
        <div class="header-back" onclick="history.back()">←</div>
        <div class="header-title">产量估测</div>
      </div>
    </div>
    
    <div class="content">
      <div class="total-card">
        <div class="total-header">
          <div class="total-title">
            <span>📊</span>
            <span>2026年预估总产量</span>
          </div>
          <div class="total-update">模型预测 · 更新于 9月21日</div>
        </div>
        <div class="total-main">
          <div class="total-value">450</div>
          <div class="total-unit">吨</div>
        </div>
        <div class="total-compare">较去年实际产量 420吨 ↑增长 7.1%</div>
        <div class="total-range">
          <span>置信区间：420-480吨</span>
          <span>误差范围 ±8%</span>
        </div>
      </div>
      
      <div class="chart-card">
        <div class="chart-title">📈 分品种预估占比</div>
        <div class="chart-bars">
          <div class="chart-bar-item">
            <div class="chart-bar" style="height: 80px;"></div>
            <div class="chart-bar-label">花牛苹果</div>
            <div class="chart-bar-value">40%</div>
          </div>
          <div class="chart-bar-item">
            <div class="chart-bar" style="height: 60px; background: linear-gradient(180deg, var(--warning), #ffd699);"></div>
            <div class="chart-bar-label">花牛苹果</div>
            <div class="chart-bar-value">27%</div>
          </div>
          <div class="chart-bar-item">
            <div class="chart-bar" style="height: 70px; background: linear-gradient(180deg, var(--info), #85c1e9);"></div>
            <div class="chart-bar-label">金帅</div>
            <div class="chart-bar-value">33%</div>
          </div>
        </div>
      </div>
      
      <div class="plot-list">
        <div class="plot-header">
          <span>📍</span>
          <span>各地块预估产量</span>
        </div>
        <div class="plot-item">
          <div class="plot-color green"></div>
          <div class="plot-info">
            <div class="plot-name">A区</div>
            <div class="plot-variety">花牛苹果</div>
            <div class="plot-percent"><div class="plot-percent-fill green" style="width: 40%;"></div></div>
          </div>
          <div class="plot-value">
            <div class="plot-tons">180</div>
            <div class="plot-tons-unit">吨 (40%)</div>
          </div>
        </div>
        <div class="plot-item">
          <div class="plot-color orange"></div>
          <div class="plot-info">
            <div class="plot-name">B区</div>
            <div class="plot-variety">花牛苹果</div>
            <div class="plot-percent"><div class="plot-percent-fill orange" style="width: 27%;"></div></div>
          </div>
          <div class="plot-value">
            <div class="plot-tons">120</div>
            <div class="plot-tons-unit">吨 (27%)</div>
          </div>
        </div>
        <div class="plot-item">
          <div class="plot-color blue"></div>
          <div class="plot-info">
            <div class="plot-name">C区</div>
            <div class="plot-variety">金帅</div>
            <div class="plot-percent"><div class="plot-percent-fill blue" style="width: 33%;"></div></div>
          </div>
          <div class="plot-value">
            <div class="plot-tons">150</div>
            <div class="plot-tons-unit">吨 (33%)</div>
          </div>
        </div>
      </div>
      
      <div class="factors-card">
        <div class="factors-title">
          <span>⚖️</span>
          <span>影响因子分析</span>
        </div>
        <div class="factors-section">
          <div class="factors-label positive">
            <span>⬆️</span>
            <span>正向因子</span>
          </div>
          <div class="factors-item">
            <span class="factors-icon">✓</span>
            <span class="factors-text">坐果率高于去年 5%</span>
          </div>
          <div class="factors-item">
            <span class="factors-icon">✓</span>
            <span class="factors-text">膨大期水肥充足，长势良好</span>
          </div>
        </div>
        <div class="factors-section">
          <div class="factors-label negative">
            <span>⬇️</span>
            <span>负向因子</span>
          </div>
          <div class="factors-item">
            <span class="factors-icon">!</span>
            <span class="factors-text">9月干旱影响，部分地块减产约 3%</span>
          </div>
          <div class="factors-item">
            <span class="factors-icon">!</span>
            <span class="factors-text">C区局部受冰雹影响，预计减产 8%</span>
          </div>
        </div>
      </div>
    </div>
    
    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_ai_assistant.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
        <span>AI</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </div>
  </div>
  
  <script>
    function navigateTo(page) { window.location.href = page; }
  </script>
</body>
</html>
