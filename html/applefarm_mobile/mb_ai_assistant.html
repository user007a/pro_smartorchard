<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - AI助手</title>
  <!-- H5设计系统 v2 — Supabase × Airbnb × Notion 混合设计基因 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <script src="js/mobile-data.js"></script>
  <style>
    /* ========== 页面专属样式（仅保留设计系统未覆盖的部分） ========== */

    /* --- 助手介绍区 --- */
    .assistant-section { padding: 0 var(--space-4); }

    .assistant-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      display: flex;
      gap: var(--space-4);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }

    .assistant-avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--primary-100);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(46, 158, 90, 0.2);
    }

    .assistant-info { flex: 1; }

    .weather-bar {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-2);
    }
    .weather-text { font-size: var(--font-sm); color: var(--text-secondary); }

    .tip-badge {
      background: var(--gradient-primary);
      color: var(--text-on-primary);
      font-size: var(--font-xs);
      padding: 4px 10px;
      border-radius: var(--radius-full);
    }

    .assistant-name {
      font-size: var(--font-base);
      font-weight: var(--font-bold);
      color: var(--text);
      margin-bottom: 4px;
    }
    .assistant-desc {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* --- Header 内 Tab 切换 --- */
    .header-tabs {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--space-4) var(--space-4);
    }

    .tabs {
      display: flex;
      background: rgba(255,255,255,0.9);
      border-radius: var(--radius-full);
      padding: 4px;
      box-shadow: var(--shadow-sm);
    }

    .tabs .tab-item {
      padding: 10px 32px;
      border-radius: var(--radius-lg);
      font-size: var(--font-base);
      font-weight: var(--font-medium);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-normal);
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    .tabs .tab-item.active {
      color: var(--primary);
      font-weight: var(--font-semibold);
    }

    /* --- 分类标签 --- */
    .category-section { padding: var(--space-4); }

    .category-scroll {
      display: flex;
      gap: var(--space-2);
      overflow-x: auto;
      padding-bottom: var(--space-2);
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    .category-item {
      padding: 10px var(--space-5);
      background: var(--bg-white);
      border-radius: var(--radius-full);
      font-size: var(--font-base);
      color: var(--text-secondary);
      white-space: nowrap;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all var(--transition-normal);
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    .category-item.active {
      color: var(--primary);
      font-weight: var(--font-semibold);
      border-color: var(--primary);
    }

    /* --- 推荐问题 --- */
    .questions-section { padding: 0 var(--space-4); }

    .questions-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: var(--space-4);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }

    .questions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-3);
    }
    .questions-title { font-size: var(--font-md); font-weight: var(--font-semibold); color: var(--text); }

    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: var(--font-sm);
      color: var(--primary);
      cursor: pointer;
      min-height: 44px;
      padding: 4px;
    }
    .refresh-btn svg { width: 14px; height: 14px; }
    .refresh-btn:active svg { animation: spin 0.5s; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .question-item {
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .question-item:last-child { border-bottom: none; }
    .question-item:active { background: var(--gray-50); }

    .question-text { font-size: var(--font-sm); color: var(--text); line-height: 1.5; }

    /* --- AI 识别区 --- */
    .ai-recognize-section { padding: var(--space-3) var(--space-4); }

    .ai-recognize-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: var(--space-4);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }

    .ai-recognize-title {
      font-size: var(--font-sm);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-2);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .ai-tag { color: var(--primary); font-weight: var(--font-extrabold); }

    .recognize-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-2);
    }

    .recognize-item {
      padding: var(--space-3) var(--space-2);
      background: var(--gray-50);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all var(--transition-fast);
      min-height: 44px;
    }
    .recognize-item:active {
      transform: scale(0.98);
      background: var(--gray-100);
    }

    .recognize-icon {
      width: 40px; height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .recognize-icon svg { width: 20px; height: 20px; }
    .recognize-icon.blue { background: var(--info-light); color: var(--info-dark); }
    .recognize-icon.green { background: var(--success-light); color: var(--success-dark); }
    .recognize-icon.orange { background: var(--warning-light); color: var(--warning-dark); }
    .recognize-icon.purple { background: var(--purple-bg); color: var(--purple); }

    .recognize-name { font-size: var(--font-sm); color: var(--text); font-weight: var(--font-medium); }

    /* --- 深度思考 --- */
    .deep-think-section { padding: 0 var(--space-4); }

    .deep-think-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      border: 1px solid var(--border);
    }

    .deep-think-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .deep-think-icon svg { width: 16px; height: 16px; color: var(--bg-white); }

    .deep-think-text { font-size: var(--font-sm); font-weight: var(--font-semibold); color: #6c5ce7; }

    .deep-think-switch {
      width: 44px; height: 24px;
      background: var(--gray-200);
      border-radius: var(--radius-full);
      position: relative;
      cursor: pointer;
      transition: background var(--transition-normal);
    }
    .deep-think-switch.active { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }
    .deep-think-switch::after {
      content: '';
      position: absolute;
      left: 2px; top: 2px;
      width: 20px; height: 20px;
      background: var(--bg-white);
      border-radius: 50%;
      box-shadow: var(--shadow-sm);
      transition: left var(--transition-normal);
    }
    .deep-think-switch.active::after { left: 22px; }

    /* --- 底部输入栏 --- */
    .bottom-input {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 750px;
      padding: var(--space-3) var(--space-4);
      background: var(--bg-white);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      z-index: var(--z-sticky);
    }

    .voice-btn {
      width: 44px; height: 44px;
      background: var(--primary-50);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      flex-shrink: 0;
    }
    .voice-btn:active { transform: scale(0.95); }
    .voice-btn svg { width: 22px; height: 22px; color: var(--primary-700); }

    .input-box {
      flex: 1; height: 44px;
      background: var(--gray-100);
      border-radius: var(--radius-full);
      padding: 0 var(--space-5);
      border: none;
      font-size: var(--font-base);
      color: var(--text);
      font-family: var(--font-family);
      outline: none;
      transition: all var(--transition-fast);
    }
    .input-box:focus { background: var(--gray-200); }
    .input-box::placeholder { color: var(--text-placeholder); }

    .send-btn {
      width: 44px; height: 44px;
      background: var(--gradient-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      flex-shrink: 0;
    }
    .send-btn:active { transform: scale(0.95); }
    .send-btn svg { width: 20px; height: 20px; color: var(--bg-white); }

    /* --- 历史记录 --- */
    .history-section { padding: var(--space-4); }

    .history-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: var(--space-4);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }

    .history-item {
      padding: var(--space-3);
      background: var(--gray-50);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-2);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all var(--transition-fast);
      min-height: 44px;
    }
    .history-item:last-child { margin-bottom: 0; }
    .history-item:active { background: var(--gray-100); }

    .history-content { flex: 1; min-width: 0; }

    .history-tag {
      font-size: var(--font-xs);
      color: var(--info-dark);
      background: var(--info-light);
      padding: 2px 8px;
      border-radius: var(--radius-md);
      display: inline-block;
      margin-bottom: 6px;
    }

    .history-question { font-size: var(--font-sm); color: var(--text); margin-bottom: 6px; }
    .history-time { font-size: var(--font-xs); color: var(--text-tertiary); }

    .continue-btn {
      background: var(--primary);
      color: var(--text-on-primary);
      font-size: var(--font-sm);
      padding: 10px var(--space-4);
      border-radius: var(--radius-full);
      white-space: nowrap;
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    .continue-btn:active { opacity: 0.8; }

    .empty-history { text-align: center; padding: 40px var(--space-5); }

    .empty-icon {
      width: 64px; height: 64px;
      background: var(--gray-100);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-3);
    }
    .empty-icon svg { width: 32px; height: 32px; color: var(--text-tertiary); }
    .empty-text { font-size: var(--font-sm); color: var(--text-secondary); }

    /* --- 问答详情 Modal --- */
    .mb-modal {
      width: 100%; max-width: 750px;
      height: 100%;
      overflow-y: auto;
    }

    .modal-header {
      position: sticky;
      top: 0;
      background: var(--bg-white);
      display: flex;
      align-items: center;
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border);
      z-index: var(--z-sticky);
    }

    .modal-back {
      width: 36px; height: 36px;
      background: var(--gray-100);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .modal-back svg { width: 18px; height: 18px; color: var(--text-secondary); }

    .modal-title {
      flex: 1; text-align: center;
      font-size: var(--font-base);
      font-weight: var(--font-semibold);
      color: var(--text);
    }

    .modal-content { padding: var(--space-4); }

    .answer-question {
      font-size: var(--font-base);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-4);
      line-height: 1.6;
    }

    .answer-content {
      background: var(--gray-50);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
    }
    .answer-text { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.8; }
    .answer-text p { margin-bottom: var(--space-3); }
    .answer-text p:last-child { margin-bottom: 0; }
    .answer-text ul { margin-left: 20px; margin-bottom: var(--space-3); }
    .answer-text li { margin-bottom: 6px; }

    .answer-footer {
      background: var(--warning-light);
      border-radius: var(--radius-md);
      padding: 10px var(--space-3);
      margin-bottom: var(--space-5);
    }
    .answer-footer-text { font-size: var(--font-xs); color: var(--warning-dark); }

    .action-bar {
      display: flex;
      gap: var(--space-4);
      padding: 0 8px;
      margin-bottom: var(--space-5);
    }
    .action-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      min-height: 44px;
      justify-content: center;
    }
    .action-icon {
      width: 40px; height: 40px;
      background: var(--gray-100);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }
    .action-icon svg { width: 18px; height: 18px; color: var(--text-secondary); }
    .action-text { font-size: var(--font-xs); color: var(--text-secondary); }

    .action-item:active .action-icon { background: var(--primary-50); }
    .action-item:active .action-icon svg, .action-item:active .action-text { color: var(--primary); }

    .related-section { margin-top: var(--space-5); }
    .related-title { font-size: var(--font-md); font-weight: var(--font-semibold); color: var(--text); margin-bottom: var(--space-3); }

    .related-item {
      padding: var(--space-3);
      background: var(--gray-50);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-2);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .related-item:active { background: var(--gray-100); }
    .related-text { font-size: var(--font-sm); color: var(--text); }

    /* 思考/打字加载态 */
    .answer-loading {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--text-secondary);
      font-size: var(--font-sm);
      padding: var(--space-3) 0;
    }
    .answer-loading .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      display: inline-block;
      animation: ai-dot 1.2s ease-in-out infinite;
    }
    .answer-loading .dot:nth-child(2) { animation-delay: 0.15s; }
    .answer-loading .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes ai-dot {
      0%, 100% { opacity: 0.25; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }
  </style>
</head>
<body>
  <div class="mb-app">
    <!-- 工具页型 Header -->
    <div class="mb-header-tool">
      <div class="header-nav">
        <div class="header-back" onclick="navigateTo('mb_home.html')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </div>
        <div class="header-title">AI助手</div>
        <div class="header-actions">
          <div class="header-action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
              <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- 助手介绍区 -->
    <div class="assistant-section" style="padding-top:var(--space-4);">
      <div class="assistant-card">
        <div class="assistant-avatar">
          <svg viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="20" fill="var(--primary-300)" opacity="0.9"/>
            <circle cx="24" cy="24" r="16" fill="var(--primary-200)"/>
            <circle cx="18" cy="22" r="3" fill="#333"/>
            <circle cx="30" cy="22" r="3" fill="#333"/>
            <circle cx="19" cy="21" r="1" fill="#fff"/>
            <circle cx="31" cy="21" r="1" fill="#fff"/>
            <path d="M20 29 Q24 33 28 29" stroke="#333" stroke-width="2" stroke-linecap="round" fill="none"/>
            <path d="M12 20 Q14 12 24 10 Q34 12 36 20" stroke="var(--primary)" stroke-width="2" fill="none"/>
            <circle cx="14" cy="12" r="2" fill="var(--primary)"/>
            <circle cx="34" cy="12" r="2" fill="var(--primary)"/>
            <circle cx="24" cy="8" r="3" fill="var(--primary)"/>
            <path d="M22 6 L24 3 L26 6" stroke="var(--primary-600)" stroke-width="2" fill="none"/>
          </svg>
        </div>
        <div class="assistant-info">
          <div class="assistant-name">Hi, 我是"小果"</div>
          <div class="assistant-desc">苹果种植智能助手，深耕天水花牛苹果种植技术，为您提供专业的农事指导</div>
        </div>
      </div>
    </div>

    <!-- Tab 切换 -->
    <div class="header-tabs">
      <div class="tabs">
        <div class="tab-item active" id="tabQa" onclick="switchTab('qa')">问答</div>
        <div class="tab-item" id="tabHistory" onclick="switchTab('history')">历史</div>
      </div>
    </div>

    <!-- 问答内容 -->
    <div id="qaContent">

      <!-- 分类标签（由 JS 从 sf_mb_ai_category 动态渲染） -->
      <div class="category-section">
        <div class="category-scroll" id="categoryScroll"></div>
      </div>

      <!-- 推荐问题 -->
      <div class="questions-section">
        <div class="questions-card">
          <div class="questions-header">
            <div class="questions-title">热门问题</div>
            <div class="refresh-btn" onclick="refreshQuestions()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
              </svg>
              换一换
            </div>
          </div>
          <div id="questionsList"></div>
        </div>
      </div>

      <!-- AI识别 -->
      <div class="ai-recognize-section">
        <div class="ai-recognize-card">
          <div class="ai-recognize-title">
            <span class="ai-tag">AI</span>识别
          </div>
          <div class="recognize-grid">
            <div class="recognize-item" onclick="navigateTo('mb_disease.html')">
              <div class="recognize-icon blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </div>
              <div class="recognize-name">病害识别</div>
            </div>
            <div class="recognize-item" onclick="navigateTo('mb_disease.html')">
              <div class="recognize-icon green">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2L2 7l10 5 10-5z"/>
                  <path d="M2 17l10 5 10-5"/>
                  <path d="M2 12l10 5 10-5"/>
                </svg>
              </div>
              <div class="recognize-name">作物识别</div>
            </div>
            <div class="recognize-item" onclick="navigateTo('mb_disease.html')">
              <div class="recognize-icon orange">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M8 12h8"/>
                  <path d="M12 8v8"/>
                </svg>
              </div>
              <div class="recognize-name">虫子识别</div>
            </div>
            <div class="recognize-item" onclick="navigateTo('mb_disease.html')">
              <div class="recognize-icon purple">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
              </div>
              <div class="recognize-name">随心拍</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 深度思考 -->
      <div class="deep-think-section">

  <script>
    /* ====================================================================
     * AI 助手（严格空库 · 全部取自数据库，无本地造答案）
     * ------------------------------------------------------------
     * 分类     → sf_mb_ai_category.category_name
     * 推荐问题 → sf_mb_ai_question.question / related_question
     * 作答     → sf_mb_disease_rule（disease_name / match_keywords /
     *            confidence / risk_level）
     *            sf_mb_fault_kb（fault_title / device_type / category /
     *            urgency / steps）
     * 两表均无命中时如实提示暂无答案，不做任何编造。
     * ==================================================================== */
    var MD = window.MobileData;

    var currentCategory = '';
    var displayedQuestions = [];
    var NO_ANSWER = '知识库中暂无该问题的答案，已记录并转人工/专家处理。';

    function escHtml(s) {
      return MD ? MD.esc(s) : String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function rowsOf(resource) {
      return MD ? MD.list(resource) : [];
    }

    function trimText(s) {
      return String(s == null ? '' : s).replace(/^\s+|\s+$/g, '');
    }

    /* 归一化：忽略大小写、空白与常见标点，便于包含匹配 */
    function norm(s) {
      return String(s == null ? '' : s).toLowerCase().replace(/[\s，,。.;；、|/\\]+/g, '');
    }

    /* 拆分关键字 / 关联问题（逗号、分号、顿号、竖线分隔） */
    function splitKeys(v) {
      return String(v == null ? '' : v).split(/[,，;；、|\/\r\n]+/)
        .map(trimText)
        .filter(function (x) { return !!x; });
    }

    /* ---------- 知识分类：sf_mb_ai_category ---------- */
    function renderCategories() {
      var wrap = document.getElementById('categoryScroll');
      if (!wrap) return;
      var cats = rowsOf('mb_ai_category');
      if (!cats.length) {
        wrap.innerHTML = MD ? MD.inlineEmpty('暂无知识分类') : '';
        currentCategory = '';
        return;
      }
      var index = -1;
      for (var i = 0; i < cats.length; i++) {
        if (String(cats[i].id) === String(currentCategory)) { index = i; break; }
      }
      if (index < 0) index = 0;
      currentCategory = String(cats[index].id);
      wrap.innerHTML = cats.map(function (c, i) {
        return '<div class="category-item' + (i === index ? ' active' : '') + '" data-id="' + escHtml(c.id) + '">' +
                 escHtml(c.category_name || '未命名分类') +
               '</div>';
      }).join('');
      wrap.querySelectorAll('.category-item').forEach(function (item) {
        item.addEventListener('click', function () { switchCategory(item.dataset.id); });
      });
    }

    function switchCategory(categoryId) {
      currentCategory = String(categoryId);
      document.querySelectorAll('.category-item').forEach(function (item) {
        item.classList.toggle('active', item.dataset.id === currentCategory);
      });
      renderQuestions();
    }

    function categoryNameOf(id) {
      if (id == null || id === '') return '';
      var cats = rowsOf('mb_ai_category');
      for (var i = 0; i < cats.length; i++) {
        if (String(cats[i].id) === String(id)) return cats[i].category_name || '';
      }
      return '';
    }

    /* ---------- 推荐问题：sf_mb_ai_question ---------- */
    function questionsOfCategory() {
      var all = rowsOf('mb_ai_question');
      if (!currentCategory) return all;
      return all.filter(function (q) {
        return String(q.category_id == null ? '' : q.category_id) === currentCategory;
      });
    }

    function renderQuestionsList(list) {
      var wrap = document.getElementById('questionsList');
      if (!wrap) return;
      displayedQuestions = list || [];
      if (!displayedQuestions.length) {
        wrap.innerHTML = MD ? MD.inlineEmpty('暂无推荐问题') : '';
        return;
      }
      wrap.innerHTML = displayedQuestions.slice(0, 3).map(function (q) {
        return '<div class="question-item" data-qid="' + escHtml(q.id) + '">' +
                 '<div class="question-text">' + escHtml(q.question || '') + '</div>' +
               '</div>';
      }).join('');
      wrap.querySelectorAll('.question-item').forEach(function (item) {
        item.addEventListener('click', function () { askQuestionById(item.dataset.qid); });
      });
    }

    function renderQuestions() {
      renderQuestionsList(questionsOfCategory());
    }

    function refreshQuestions() {
      var arr = questionsOfCategory().slice();
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      renderQuestionsList(arr);
    }

    function askQuestionById(id) {
      var all = rowsOf('mb_ai_question');
      for (var i = 0; i < all.length; i++) {
        if (String(all[i].id) === String(id)) {
          askQuestionText(all[i].question || '');
          return;
        }
      }
    }

    /* ---------- 知识匹配（全部基于数据库行） ---------- */
    function matchQuestionRow(text) {
      var qn = norm(text);
      if (!qn) return null;
      var rows = rowsOf('mb_ai_question');
      var partial = null;
      for (var i = 0; i < rows.length; i++) {
        var nq = norm(rows[i].question);
        if (!nq) continue;
        if (nq === qn) return rows[i];
        if (!partial && (nq.indexOf(qn) >= 0 || qn.indexOf(nq) >= 0)) partial = rows[i];
      }
      return partial;
    }

    function findDiseaseRule(text) {
      var qn = norm(text);
      if (!qn) return null;
      var rows = rowsOf('mb_disease_rule');
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var keys = splitKeys(r.match_keywords);
        var hit = false;
        for (var j = 0; j < keys.length; j++) {
          var k = norm(keys[j]);
          if (k.length >= 2 && qn.indexOf(k) >= 0) { hit = true; break; }
        }
        if (!hit) {
          var name = norm(r.disease_name);
          if (name.length >= 2 && qn.indexOf(name) >= 0) hit = true;
        }
        if (hit) return r;
      }
      return null;
    }

    function findFaultRule(text) {
      var qn = norm(text);
      if (!qn) return null;
      var rows = rowsOf('mb_fault_kb');
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var title = norm(r.fault_title);
        if (!title) continue;
        if (qn.indexOf(title) >= 0) return r;
        if (qn.length >= 3 && title.indexOf(qn) >= 0) return r;
      }
      return null;
    }

    /* ---------- 用数据库字段拼装答案（不添加任何技术建议） ---------- */
    function diseaseAnswer(r) {
      var lines = ['**病害名称：**' + (r.disease_name || '--')];
      if (r.risk_level) lines.push('**风险等级：**' + r.risk_level);
      if (r.confidence != null && r.confidence !== '') lines.push('**识别置信度：**' + r.confidence + '%');
      if (r.match_keywords) lines.push('**匹配关键字：**' + r.match_keywords);
      return lines.join('\n');
    }

    function faultAnswer(r) {
      var lines = ['**故障标题：**' + (r.fault_title || '--')];
      var meta = [];
      if (r.device_type) meta.push('设备类型：' + r.device_type);
      if (r.category) meta.push('分类：' + r.category);
      if (r.urgency) meta.push('紧急程度：' + r.urgency);
      if (meta.length) lines.push(meta.join('　'));
      var steps = parseSteps(r.steps);
      if (steps.length) {
        lines.push('**排查步骤：**');
        for (var i = 0; i < steps.length; i++) lines.push((i + 1) + '. ' + steps[i]);
      }
      return lines.join('\n');
    }

    function stripStepNo(v) {
      return trimText(v).replace(/^\d+[.、)]\s*/, '');
    }

    function parseSteps(v) {
      if (v == null || v === '') return [];
      var s = trimText(v);
      if (s.charAt(0) === '[') {
        try {
          var arr = JSON.parse(s);
          if (Object.prototype.toString.call(arr) === '[object Array]') {
            return arr.map(stripStepNo).filter(function (x) { return !!x; });
          }
        } catch (e) { /* 非 JSON 时按文本处理 */ }
      }
      var parts = s.split(/\r?\n+/).map(stripStepNo).filter(function (x) { return !!x; });
      if (parts.length <= 1) {
        parts = s.split(/\s*\d+[.、)]\s*/).map(trimText).filter(function (x) { return !!x; });
      }
      return parts;
    }

    function relatedQuestions(qRow) {
      var out = [];
      function push(v) { if (v && out.indexOf(v) < 0) out.push(v); }
      if (qRow && qRow.related_question) splitKeys(qRow.related_question).forEach(push);
      var catId = qRow && qRow.category_id != null ? String(qRow.category_id) : currentCategory;
      var all = rowsOf('mb_ai_question');
      for (var i = 0; i < all.length && out.length < 4; i++) {
        var q = all[i];
        if (!q.question) continue;
        if (qRow && String(q.id) === String(qRow.id)) continue;
        if (catId && String(q.category_id) !== catId) continue;
        push(q.question);
      }
      return out.slice(0, 4);
    }

    function resolveAnswer(text) {
      var qRow = matchQuestionRow(text);
      var probe = qRow ? (qRow.question + ' ' + (qRow.related_question || '')) : text;
      var catName = qRow ? categoryNameOf(qRow.category_id) : '';

      var disease = findDiseaseRule(text) || findDiseaseRule(probe);
      if (disease) {
        return {
          question: text,
          answer: diseaseAnswer(disease),
          related: relatedQuestions(qRow),
          category: catName,
          footer: '本回答来自病虫害识别规则库，仅供参考。',
          found: true
        };
      }

      var fault = findFaultRule(text) || findFaultRule(probe);
      if (fault) {
        return {
          question: text,
          answer: faultAnswer(fault),
          related: relatedQuestions(qRow),
          category: catName,
          footer: '本回答来自设备故障知识库，仅供参考。',
          found: true
        };
      }

      return {
        question: text,
        answer: NO_ANSWER,
        related: relatedQuestions(qRow),
        category: catName,
        footer: '知识库暂未收录该问题的答案。',
        found: false
      };
    }

    /* 未命中时生成专家咨询单（sf_mb_expert_consult），页面不新增转人工入口 */
    function recordConsult(question) {
      if (!window.Api || typeof Api.create !== 'function') return;
      var u = MD && MD.user ? MD.user() : null;
      try {
        Api.create('mb_expert_consult', {
          title: String(question).substring(0, 100),
          content: String(question),
          questioner: u ? String(u.realName || u.account || '') : '',
          source: 'mobile_ai',
          status: 'pending'
        }).then(function (res) {
          if (res && res.ok && MD) MD.reload('mb_expert_consult');
        }).catch(function () { /* 写入失败不影响页面提示 */ });
      } catch (e) { /* 忽略写入异常 */ }
    }

    /* ---------- 弹窗渲染 ---------- */
    function actionBarHtml() {
      return '' +
        '<div class="action-bar">' +
          '<div class="action-item">' +
            '<div class="action-icon">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>' +
                '<circle cx="12" cy="7" r="4"/>' +
              '</svg>' +
            '</div>' +
            '<div class="action-text">点赞</div>' +
          '</div>' +
          '<div class="action-item">' +
            '<div class="action-icon">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<line x1="18" y1="2" x2="21" y2="5"/>' +
                '<line x1="12" y1="19" x2="21" y2="5"/>' +
                '<path d="M21 5v7a8 8 0 0 1-8 8H3"/>' +
              '</svg>' +
            '</div>' +
            '<div class="action-text">分享</div>' +
          '</div>' +
          '<div class="action-item">' +
            '<div class="action-icon">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' +
              '</svg>' +
            '</div>' +
            '<div class="action-text">收藏</div>' +
          '</div>' +
          '<div class="action-item">' +
            '<div class="action-icon">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>' +
                '<circle cx="12" cy="7" r="4"/>' +
              '</svg>' +
            '</div>' +
            '<div class="action-text">追问</div>' +
          '</div>' +
        '</div>';
    }

    function relatedHtml(list) {
      if (!list || !list.length) return MD ? MD.inlineEmpty('暂无相关问题') : '';
      return list.map(function (q) {
        return '<div class="related-item" data-related="' + escHtml(q) + '">' +
                 '<div class="related-text">' + escHtml(q) + '</div>' +
               '</div>';
      }).join('');
    }

    function formatAnswer(text) {
      return String(text == null ? '' : text).split('\n').map(function (p) {
        if (!p.replace(/^\s+|\s+$/g, '')) return '';
        var html = escHtml(p).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        if (/^\d+\.\s/.test(p) || /^[一二三四五六七八九十]、/.test(p)) {
          return '<p><strong>' + html.replace(/<\/?strong>/g, '') + '</strong></p>';
        }
        return '<p>' + html + '</p>';
      }).join('');
    }

    function renderAnswerModal(res) {
      var html = '' +
        '<div class="answer-question">' + escHtml(res.question) + '</div>' +
        '<div class="answer-content">' +
          '<div class="answer-text">' + formatAnswer(res.answer) + '</div>' +
        '</div>' +
        '<div class="answer-footer">' +
          '<div class="answer-footer-text">' + escHtml(res.footer) + '</div>' +
        '</div>' +
        actionBarHtml() +
        '<div class="related-section">' +
          '<div class="related-title">相关问题</div>' +
          relatedHtml(res.related) +
        '</div>';
      var content = document.getElementById('modalContent');
      content.innerHTML = html;
      content.querySelectorAll('.related-item').forEach(function (item) {
        item.addEventListener('click', function () { searchQuestion(item.dataset.related); });
      });
      document.getElementById('answerModal').classList.add('show');
    }

    function showThinking(question) {
      var html = '' +
        '<div class="answer-question">' + escHtml(question) + '</div>' +
        '<div class="answer-loading">' +
          '<span class="dot"></span><span class="dot"></span><span class="dot"></span>' +
          '<span>正在检索知识库…</span>' +
        '</div>' +
        '<div class="answer-footer">' +
          '<div class="answer-footer-text">正在检索果园知识库</div>' +
        '</div>';
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('answerModal').classList.add('show');
    }

    function askQuestionText(text) {
      text = trimText(text);
      if (!text) return;
      showThinking(text);
      var run = function () {
        var res = resolveAnswer(text);
        renderAnswerModal(res);
        saveToHistory(text, plainAnswer(res.answer), res.category);
        if (!res.found) recordConsult(text);
      };
      if (MD && !MD.isLoaded() && MD.ready && typeof MD.ready.then === 'function') {
        MD.ready.then(run);
      } else {
        run();
      }
    }

    function plainAnswer(text) {
      return String(text == null ? '' : text).replace(/\*\*/g, '').replace(/\r?\n+/g, ' ');
    }

    function sendMessage() {
      var input = document.getElementById('inputBox');
      var text = trimText(input.value);
      if (!text) return;
      input.value = '';
      askQuestionText(text);
    }

    function handleKeyup(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function closeModal() {
      document.getElementById('answerModal').classList.remove('show');
    }

    function searchQuestion(q) {
      var input = document.getElementById('inputBox');
      input.value = String(q == null ? '' : q);
      input.focus();
    }

    function toggleDeepThink() {
      document.getElementById('deepThinkSwitch').classList.toggle('active');
    }

    function startVoice() {
      /* 语音输入能力未接入 */

    function endVoice() {
      /* 语音输入能力未接入 */
    }

    function switchTab(tab) {
      document.getElementById('tabQa').classList.toggle('active', tab === 'qa');
      document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
      document.getElementById('qaContent').style.display = tab === 'qa' ? 'block' : 'none';
      document.getElementById('historyContent').style.display = tab === 'history' ? 'block' : 'none';
      if (tab === 'history') loadHistory();
    }

    /* ---------- 会话历史（sessionStorage，随会话不落库） ---------- */
    var EMPTY_HISTORY_HTML = '' +
      '<div class="empty-history">' +
        '<div class="empty-icon">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
            '<polyline points="14 2 14 8 20 8"/>' +
            '<line x1="16" y1="13" x2="8" y2="13"/>' +
            '<line x1="16" y1="17" x2="8" y2="17"/>' +
            '<polyline points="10 9 9 9 8 9"/>' +
          '</svg>' +
        '</div>' +
        '<div class="empty-text">暂无问答历史</div>' +
      '</div>';

    function readAiHistory() {
      try {
        var raw = sessionStorage.getItem('aiHistory');
        if (!raw) return [];
        var v = JSON.parse(raw);
        return Object.prototype.toString.call(v) === '[object Array]' ? v : [];
      } catch (e) { return []; }
    }

    function writeAiHistory(list) {
      try { sessionStorage.setItem('aiHistory', JSON.stringify(list)); return true; }
      catch (e) { return false; }
    }

    function nowText() {
      function p2(n) { return n < 10 ? '0' + n : String(n); }
      var d = new Date();
      return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) +
        ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
    }

    function saveToHistory(question, answer, category) {
      var history = readAiHistory();
      history.unshift({
        question: question,
        answer: answer,
        category: category || '',
        time: nowText()
      });
      if (history.length > 20) history = history.slice(0, 20);
      writeAiHistory(history);
    }

    function loadHistory() {
      var list = document.getElementById('historyList');
      if (!list) return;
      var history = readAiHistory();
      if (!history.length) {
        list.innerHTML = EMPTY_HISTORY_HTML;
        return;
      }
      list.innerHTML = history.map(function (item, i) {
        return '<div class="history-item" data-idx="' + i + '">' +
          '<div class="history-content">' +
            '<span class="history-tag">' + escHtml(item.category || '未分类') + '</span>' +
            '<div class="history-question">' + escHtml(item.question || '') + '</div>' +
            '<div class="history-time">' + escHtml(item.time || '') + '</div>' +
          '</div>' +
          '<div class="continue-btn" data-continue="' + i + '">继续对话</div>' +
        '</div>';
      }).join('');
      list.querySelectorAll('.history-item').forEach(function (el) {
        var idx = parseInt(el.dataset.idx, 10);
        el.addEventListener('click', function () { openHistoryAnswer(idx); });
        var btn = el.querySelector('[data-continue]');
        if (btn) {
          btn.addEventListener('click', function (ev) {
            ev.stopPropagation();
            continueChat(idx);
          });
        }
      });
    }

    function openHistoryAnswer(idx) {
      var history = readAiHistory();
      var item = history[idx];
      if (!item) return;
      renderAnswerModal({
        question: item.question || '',
        answer: item.answer || '',
        related: [],
        footer: '来自本次会话的问答记录。',
        found: true
      });
    }

    function continueChat(idx) {
      var history = readAiHistory();
      var item = history[idx];
      if (!item) return;
      switchTab('qa');
      var input = document.getElementById('inputBox');
      input.value = String(item.question || '').substring(0, 50);
      input.focus();
    }

    function navigateTo(page) {
      window.location.href = page;
    }

    /* ---------- 初始化 ---------- */
    renderCategories();
    renderQuestions();
    loadHistory();

    if (MD && MD.subscribe) {
      MD.subscribe(function () {
        renderCategories();
        renderQuestions();
      });
    }
  </script>
</body>
</html>
