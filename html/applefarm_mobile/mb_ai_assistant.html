<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - AI助手</title>
  <!-- H5设计系统 v2 — Supabase × Airbnb × Notion 混合设计基因 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <style>
    /* ========== 页面专属样式（仅保留设计系统未覆盖的部分） ========== */

    /* --- 助手介绍区 --- */
    .assistant-section { padding: 0 var(--space-4); }

    .assistant-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      display: flex;
      gap: var(--space-4);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }

    .assistant-avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--primary-100);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(46, 158, 90, 0.2);
    }

    .assistant-info { flex: 1; }

    .weather-bar {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-2);
    }
    .weather-text { font-size: var(--font-sm); color: var(--text-secondary); }

    .tip-badge {
      background: var(--gradient-primary);
      color: var(--text-on-primary);
      font-size: var(--font-xs);
      padding: 4px 10px;
      border-radius: var(--radius-full);
    }

    .assistant-name {
      font-size: var(--font-base);
      font-weight: var(--font-bold);
      color: var(--text);
      margin-bottom: 4px;
    }
    .assistant-desc {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* --- Header 内 Tab 切换 --- */
    .header-tabs {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--space-4) var(--space-4);
    }

    .tabs {
      display: flex;
      background: rgba(255,255,255,0.9);
      border-radius: var(--radius-full);
      padding: 4px;
      box-shadow: var(--shadow-sm);
    }

    .tab-item {
      padding: 10px 32px;
      border-radius: var(--radius-lg);
      font-size: var(--font-base);
      font-weight: var(--font-medium);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-normal);
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    .tab-item.active {
      color: var(--primary);
      font-weight: var(--font-semibold);
    }

    /* --- 分类标签 --- */
    .category-section { padding: var(--space-4); }

    .category-scroll {
      display: flex;
      gap: var(--space-2);
      overflow-x: auto;
      padding-bottom: var(--space-2);
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    .category-item {
      padding: 10px var(--space-5);
      background: var(--bg-white);
      border-radius: var(--radius-full);
      font-size: var(--font-base);
      color: var(--text-secondary);
      white-space: nowrap;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all var(--transition-normal);
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    .category-item.active {
      color: var(--primary);
      font-weight: var(--font-semibold);
      border-color: var(--primary);
    }

    /* --- 推荐问题 --- */
    .questions-section { padding: 0 var(--space-4); }

    .questions-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: var(--space-4);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }

    .questions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-3);
    }
    .questions-title { font-size: var(--font-md); font-weight: var(--font-semibold); color: var(--text); }

    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: var(--font-sm);
      color: var(--primary);
      cursor: pointer;
      min-height: 44px;
      padding: 4px;
    }
    .refresh-btn svg { width: 14px; height: 14px; }
    .refresh-btn:active svg { animation: spin 0.5s; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .question-item {
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .question-item:last-child { border-bottom: none; }
    .question-item:active { background: var(--gray-50); }

    .question-text { font-size: var(--font-sm); color: var(--text); line-height: 1.5; }

    /* --- AI 识别区 --- */
    .ai-recognize-section { padding: var(--space-3) var(--space-4); }

    .ai-recognize-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: var(--space-4);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }

    .ai-recognize-title {
      font-size: var(--font-sm);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-2);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .ai-tag { color: var(--primary); font-weight: var(--font-extrabold); }

    .recognize-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-2);
    }

    .recognize-item {
      padding: var(--space-3) var(--space-2);
      background: var(--gray-50);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all var(--transition-fast);
      min-height: 44px;
    }
    .recognize-item:active {
      transform: scale(0.98);
      background: var(--gray-100);
    }

    .recognize-icon {
      width: 40px; height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .recognize-icon svg { width: 20px; height: 20px; }
    .recognize-icon.blue { background: var(--info-light); color: var(--info-dark); }
    .recognize-icon.green { background: var(--success-light); color: var(--success-dark); }
    .recognize-icon.orange { background: var(--warning-light); color: var(--warning-dark); }
    .recognize-icon.purple { background: #f5eef8; color: #7c3aed; }

    .recognize-name { font-size: var(--font-sm); color: var(--text); font-weight: var(--font-medium); }

    /* --- 深度思考 --- */
    .deep-think-section { padding: 0 var(--space-4); }

    .deep-think-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      border: 1px solid var(--border);
    }

    .deep-think-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .deep-think-icon svg { width: 16px; height: 16px; color: var(--bg-white); }

    .deep-think-text { font-size: var(--font-sm); font-weight: var(--font-semibold); color: #6c5ce7; }

    .deep-think-switch {
      width: 44px; height: 24px;
      background: var(--gray-200);
      border-radius: var(--radius-full);
      position: relative;
      cursor: pointer;
      transition: background var(--transition-normal);
    }
    .deep-think-switch.active { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }
    .deep-think-switch::after {
      content: '';
      position: absolute;
      left: 2px; top: 2px;
      width: 20px; height: 20px;
      background: var(--bg-white);
      border-radius: 50%;
      box-shadow: var(--shadow-sm);
      transition: left var(--transition-normal);
    }
    .deep-think-switch.active::after { left: 22px; }

    /* --- 底部输入栏 --- */
    .bottom-input {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 750px;
      padding: var(--space-3) var(--space-4);
      background: var(--bg-white);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      z-index: var(--z-sticky);
    }

    .voice-btn {
      width: 44px; height: 44px;
      background: var(--primary-50);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      flex-shrink: 0;
    }
    .voice-btn:active { transform: scale(0.95); }
    .voice-btn svg { width: 22px; height: 22px; color: var(--primary-700); }

    .input-box {
      flex: 1; height: 44px;
      background: var(--gray-100);
      border-radius: var(--radius-full);
      padding: 0 var(--space-5);
      border: none;
      font-size: var(--font-base);
      color: var(--text);
      font-family: var(--font-family);
      outline: none;
      transition: all var(--transition-fast);
    }
    .input-box:focus { background: var(--gray-200); }
    .input-box::placeholder { color: var(--text-placeholder); }

    .send-btn {
      width: 44px; height: 44px;
      background: var(--gradient-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      flex-shrink: 0;
    }
    .send-btn:active { transform: scale(0.95); }
    .send-btn svg { width: 20px; height: 20px; color: var(--bg-white); }

    /* --- 历史记录 --- */
    .history-section { padding: var(--space-4); }

    .history-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: var(--space-4);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }

    .history-item {
      padding: var(--space-3);
      background: var(--gray-50);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-2);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all var(--transition-fast);
      min-height: 44px;
    }
    .history-item:last-child { margin-bottom: 0; }
    .history-item:active { background: var(--gray-100); }

    .history-content { flex: 1; min-width: 0; }

    .history-tag {
      font-size: var(--font-xs);
      color: var(--info-dark);
      background: var(--info-light);
      padding: 2px 8px;
      border-radius: var(--radius-md);
      display: inline-block;
      margin-bottom: 6px;
    }

    .history-question { font-size: var(--font-sm); color: var(--text); margin-bottom: 6px; }
    .history-time { font-size: var(--font-xs); color: var(--text-tertiary); }

    .continue-btn {
      background: var(--primary);
      color: var(--text-on-primary);
      font-size: var(--font-sm);
      padding: 10px var(--space-4);
      border-radius: var(--radius-full);
      white-space: nowrap;
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    .continue-btn:active { opacity: 0.8; }

    .empty-history { text-align: center; padding: 40px var(--space-5); }

    .empty-icon {
      width: 64px; height: 64px;
      background: var(--gray-100);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-3);
    }
    .empty-icon svg { width: 32px; height: 32px; color: var(--text-tertiary); }
    .empty-text { font-size: var(--font-sm); color: var(--text-secondary); }

    /* --- 问答详情 Modal --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: var(--z-overlay);
      display: none;
    }
    .modal-overlay.show { display: flex; }

    .modal-box {
      background: var(--bg-white);
      width: 100%; max-width: 750px;
      height: 100%;
      overflow-y: auto;
    }

    .modal-header {
      position: sticky;
      top: 0;
      background: var(--bg-white);
      display: flex;
      align-items: center;
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border);
      z-index: var(--z-sticky);
    }

    .modal-back {
      width: 36px; height: 36px;
      background: var(--gray-100);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .modal-back svg { width: 18px; height: 18px; color: var(--text-secondary); }

    .modal-title {
      flex: 1; text-align: center;
      font-size: var(--font-base);
      font-weight: var(--font-semibold);
      color: var(--text);
    }

    .modal-content { padding: var(--space-4); }

    .answer-question {
      font-size: var(--font-base);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-4);
      line-height: 1.6;
    }

    .answer-content {
      background: var(--gray-50);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
    }
    .answer-text { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.8; }
    .answer-text p { margin-bottom: var(--space-3); }
    .answer-text p:last-child { margin-bottom: 0; }
    .answer-text ul { margin-left: 20px; margin-bottom: var(--space-3); }
    .answer-text li { margin-bottom: 6px; }

    .answer-footer {
      background: var(--warning-light);
      border-radius: var(--radius-md);
      padding: 10px var(--space-3);
      margin-bottom: var(--space-5);
    }
    .answer-footer-text { font-size: var(--font-xs); color: var(--warning-dark); }

    .action-bar {
      display: flex;
      gap: var(--space-4);
      padding: 0 8px;
      margin-bottom: var(--space-5);
    }
    .action-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      min-height: 44px;
      justify-content: center;
    }
    .action-icon {
      width: 40px; height: 40px;
      background: var(--gray-100);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }
    .action-icon svg { width: 18px; height: 18px; color: var(--text-secondary); }
    .action-text { font-size: var(--font-xs); color: var(--text-secondary); }

    .action-item:active .action-icon { background: var(--primary-50); }
    .action-item:active .action-icon svg, .action-item:active .action-text { color: var(--primary); }

    .related-section { margin-top: var(--space-5); }
    .related-title { font-size: var(--font-md); font-weight: var(--font-semibold); color: var(--text); margin-bottom: var(--space-3); }

    .related-item {
      padding: var(--space-3);
      background: var(--gray-50);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-2);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .related-item:active { background: var(--gray-100); }
    .related-text { font-size: var(--font-sm); color: var(--text); }
  </style>
</head>
<body>
  <div class="mb-app">
    <!-- 工具页型 Header -->
    <div class="mb-header-tool">
      <div class="header-nav">
        <div class="header-back" onclick="navigateTo('mb_home.html')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </div>
        <div class="header-title">AI助手</div>
        <div class="header-actions">
          <div class="header-action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
              <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- 助手介绍区 -->
    <div class="assistant-section" style="padding-top:var(--space-4);">
      <div class="assistant-card">
        <div class="assistant-avatar">
          <svg viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="20" fill="var(--primary-300)" opacity="0.9"/>
            <circle cx="24" cy="24" r="16" fill="var(--primary-200)"/>
            <circle cx="18" cy="22" r="3" fill="#333"/>
            <circle cx="30" cy="22" r="3" fill="#333"/>
            <circle cx="19" cy="21" r="1" fill="#fff"/>
            <circle cx="31" cy="21" r="1" fill="#fff"/>
            <path d="M20 29 Q24 33 28 29" stroke="#333" stroke-width="2" stroke-linecap="round" fill="none"/>
            <path d="M12 20 Q14 12 24 10 Q34 12 36 20" stroke="var(--primary)" stroke-width="2" fill="none"/>
            <circle cx="14" cy="12" r="2" fill="var(--primary)"/>
            <circle cx="34" cy="12" r="2" fill="var(--primary)"/>
            <circle cx="24" cy="8" r="3" fill="var(--primary)"/>
            <path d="M22 6 L24 3 L26 6" stroke="var(--primary-600)" stroke-width="2" fill="none"/>
          </svg>
        </div>
        <div class="assistant-info">
          <div class="assistant-name">Hi, 我是"小果"</div>
          <div class="assistant-desc">苹果种植智能助手，深耕烟台红富士种植技术，为您提供专业的农事指导</div>
        </div>
      </div>
    </div>

    <!-- Tab 切换 -->
    <div class="header-tabs">
      <div class="tabs">
        <div class="tab-item active" id="tabQa" onclick="switchTab('qa')">问答</div>
        <div class="tab-item" id="tabHistory" onclick="switchTab('history')">历史</div>
      </div>
    </div>

    <!-- 问答内容 -->
    <div id="qaContent">

      <!-- 分类标签 -->
      <div class="category-section">
        <div class="category-scroll" id="categoryScroll">
          <div class="category-item active" data-id="general">综合</div>
          <div class="category-item" data-id="plant">植保</div>
          <div class="category-item" data-id="grow">种植</div>
          <div class="category-item" data-id="breed">育种</div>
          <div class="category-item" data-id="crop">作物</div>
          <div class="category-item" data-id="adoption">认养</div>
        </div>
      </div>

      <!-- 推荐问题 -->
      <div class="questions-section">
        <div class="questions-card">
          <div class="questions-header">
            <div class="questions-title">热门问题</div>
            <div class="refresh-btn" onclick="refreshQuestions()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
              </svg>
              换一换
            </div>
          </div>
          <div id="questionsList">
            <div class="question-item" onclick="openAnswer('q1')">
              <div class="question-text">苹果常见病虫害有哪些？如何防治？</div>
            </div>
            <div class="question-item" onclick="openAnswer('q2')">
              <div class="question-text">苹果最佳施肥时间是什么时候？</div>
            </div>
            <div class="question-item" onclick="openAnswer('q3')">
              <div class="question-text">如何提高苹果果实品质？</div>
            </div>
          </div>
        </div>
      </div>

      <!-- AI识别 -->
      <div class="ai-recognize-section">
        <div class="ai-recognize-card">
          <div class="ai-recognize-title">
            <span class="ai-tag">AI</span>识别
          </div>
          <div class="recognize-grid">
            <div class="recognize-item" onclick="navigateTo('mb_disease.html')">
              <div class="recognize-icon blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </div>
              <div class="recognize-name">病害识别</div>
            </div>
            <div class="recognize-item" onclick="navigateTo('mb_disease.html')">
              <div class="recognize-icon green">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2L2 7l10 5 10-5z"/>
                  <path d="M2 17l10 5 10-5"/>
                  <path d="M2 12l10 5 10-5"/>
                </svg>
              </div>
              <div class="recognize-name">作物识别</div>
            </div>
            <div class="recognize-item" onclick="navigateTo('mb_disease.html')">
              <div class="recognize-icon orange">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M8 12h8"/>
                  <path d="M12 8v8"/>
                </svg>
              </div>
              <div class="recognize-name">虫子识别</div>
            </div>
            <div class="recognize-item" onclick="navigateTo('mb_disease.html')">
              <div class="recognize-icon purple">

      }
      return arr;

    function formatAnswer(text) {
      return text.split('\n').map(p => {
        if (p.match(/^\d+\.\s/)) {
          return `<p><strong>${p}</strong></p>`;
        } else if (p.match(/^[一|二|三|四|五|六|七|八|九|十]、/)) {
          return `<p><strong>${p}</strong></p>`;
        } else if (p.trim()) {
          return `<p>${p}</p>`;
        }
        return '';
      }).join('');
    }
