<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 病虫害风险</title>
  <!-- H5设计系统 v2 — Supabase × Airbnb × Notion 混合设计基因 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <style>
    /* ========== 页面专属样式（仅保留设计系统未覆盖的部分） ========== */
    
    /* Header */
    .page-header {
      position: relative;
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
      padding: 44px 16px 20px;
      color: var(--bg-white);
    }
    
    .header-back {
      position: absolute;
      left: 12px;
      top: 44px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .header-back svg { width: 18px; height: 18px; }
    
    .header-content { padding-left: 44px; }
    .header-title { font-size: var(--font-xl); font-weight: 700; }
    .header-sub { font-size: var(--font-sm); opacity: 0.85; margin-top: 4px; }

    /* --- 风险概览统计 --- */
    .risk-stats { display: flex; justify-content: space-around; text-align: center; padding-top: var(--space-2); }
    .risk-stat { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
    .risk-count {
      width: 48px; height: 48px;
      border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: center;
      font-size: var(--font-xl); font-weight: var(--font-extrabold);
      color: var(--bg-white);
      font-family: var(--font-family-number);
    }
    .risk-count.high { background: var(--error-dark); }
    .risk-count.medium { background: var(--warning-dark); }
    .risk-count.low { background: var(--primary); }
    .risk-label { font-size: var(--font-sm); color: var(--text-secondary); font-weight: var(--font-medium); }

    /* --- 地块风险列表 --- */
    .plot-item { padding: var(--space-4); border-bottom: 1px solid var(--border-light); }
    .plot-item:last-child { border-bottom: none; }
    .plot-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3); }
    .plot-name {
      font-size: var(--font-base); font-weight: var(--font-semibold);
      color: var(--text); display: flex; align-items: center; gap: var(--space-2);
    }
    .plot-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .plot-dot.high { background: var(--error); }
    .plot-dot.medium { background: var(--warning); }
    .plot-dot.low { background: var(--primary); }

    .pests-row { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3); }
    .pest-tag {
      font-size: var(--font-sm);
      background: var(--gray-50);
      color: var(--text-secondary);
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .advice-item {
      display: flex; align-items: flex-start; gap: var(--space-2);
      padding: var(--space-3); background: var(--warning-light);
      border-radius: var(--radius-md); border-left: 3px solid var(--warning-dark);
    }
    .advice-item.safe {
      background: var(--success-light);
      border-left-color: var(--success-dark);
    }

    .advice-text { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.6; }

    /* --- 骨架屏 --- */
    .skeleton-state { display: none; }
    .mb-app.loading .real-content { display: none; }
    .mb-app.loading .skeleton-state { display: block; }
  </style>
</head>
<body>
  <div class="mb-app loading">
    <!-- ===================== 骨架屏 ===================== -->
    <div class="skeleton-state">
      <div class="mb-header-detail">
        <div class="header-nav">
          <div style="width:36px;height:36px;"></div>
          <div class="header-title"></div>
        </div>
      </div>
      <div class="mb-section">
        <div class="mb-skeleton-card">
          <div class="mb-skeleton" style="width:100px;height:16px;margin-bottom:16px;"></div>
          <div style="display:flex;justify-content:space-around;">
            <div style="text-align:center;"><div class="mb-skeleton" style="width:48px;height:48px;border-radius:50%;margin:0 auto 8px;"></div><div class="mb-skeleton" style="width:40px;height:12px;margin:0 auto;"></div></div>
            <div style="text-align:center;"><div class="mb-skeleton" style="width:48px;height:48px;border-radius:50%;margin:0 auto 8px;"></div><div class="mb-skeleton" style="width:40px;height:12px;margin:0 auto;"></div></div>
            <div style="text-align:center;"><div class="mb-skeleton" style="width:48px;height:48px;border-radius:50%;margin:0 auto 8px;"></div><div class="mb-skeleton" style="width:40px;height:12px;margin:0 auto;"></div></div>
          </div>
        </div>
        <div style="height:20px;"></div>
        <div class="mb-skeleton-card">
          <div class="mb-skeleton" style="width:120px;height:16px;margin-bottom:16px;"></div>
          <div class="mb-skeleton-line long"></div>
          <div class="mb-skeleton-line medium"></div>
          <div style="height:16px;"></div>
          <div class="mb-skeleton-line long"></div>
          <div class="mb-skeleton-line short"></div>
        </div>
      </div>
    </div>

    <!-- ===================== 真实内容 ===================== -->
    <div class="real-content">
      <!-- 详情页型 Header -->
      <div class="mb-header-detail">
        <div class="header-nav">
          <div class="header-back" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </div>
          <div class="header-title">病虫害风险</div>
          <div class="header-actions">
            <div class="header-action-btn" onclick="navigateTo('mb_disease.html')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="header-content">
          <div class="header-sub">AI驱动的病虫害风险预测与防治建议</div>
        </div>
      </div>

      <div class="mb-section">
        <!-- 风险概览 -->
        <div class="mb-card">
          <div class="mb-risk-header">
            <div class="mb-risk-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;color:var(--warning-dark);"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              风险概览
            </div>
            <span class="mb-tag info">更新于 今日 08:00</span>
          </div>
          <div class="risk-stats">
            <div class="risk-stat">
              <div class="risk-count high">1</div>
              <div class="risk-label">高风险</div>
            </div>
            <div class="risk-stat">
              <div class="risk-count medium">1</div>
              <div class="risk-label">中风险</div>
            </div>
            <div class="risk-stat">
              <div class="risk-count low">1</div>
              <div class="risk-label">低风险</div>
            </div>
          </div>
        </div>

        <!-- 各地块风险 -->
        <div class="mb-list" style="margin-top: var(--space-4);">
          <div style="padding: var(--space-4) var(--space-4) var(--space-2); font-size: var(--font-md); font-weight: var(--font-semibold); color: var(--text); display: flex; align-items: center; gap: var(--space-2); border-bottom: 1px solid var(--border-light);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;color:var(--primary);"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            各地块病虫害风险
          </div>

          <!-- A区 - 高风险 -->
          <div class="plot-item">
            <div class="plot-top">
              <div class="plot-name">
                <span class="plot-dot high"></span>
                A区 - 红富士
              </div>
              <span class="mb-tag error mb-tag-lg">高风险</span>
            </div>
            <div class="pests-row">
              <span class="pest-tag">苹果锈病</span>
              <span class="pest-tag">红蜘蛛</span>
            </div>
            <div class="advice-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;flex-shrink:0;margin-top:2px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              <div class="advice-text">风险触发条件：近5天湿度>80%且温度15-25℃。建议喷施多菌灵+阿维菌素防治</div>
            </div>
          </div>

          <!-- B区 - 中风险 -->
          <div class="plot-item">
            <div class="plot-top">
              <div class="plot-name">
                <span class="plot-dot medium"></span>
                B区 - 嘎啦
              </div>
              <span class="mb-tag warning mb-tag-lg">中风险</span>
            </div>
            <div class="pests-row">
              <span class="pest-tag">蚜虫</span>
            </div>
            <div class="advice-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;flex-shrink:0;margin-top:2px;"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              <div class="advice-text">注意观察蚜虫发生情况，必要时使用吡虫啉进行防治</div>
            </div>
          </div>

          <!-- C区 - 低风险 -->
          <div class="plot-item">
            <div class="plot-top">
              <div class="plot-name">
                <span class="plot-dot low"></span>
                C区 - 乔纳金
              </div>
              <span class="mb-tag success mb-tag-lg">低风险</span>
            </div>
            <div class="pests-row">
              <span class="pest-tag">暂无明显病虫害</span>
            </div>
            <div class="advice-item safe">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;flex-shrink:0;margin-top:2px;color:var(--success-dark);"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              <div class="advice-text" style="color: var(--success-dark);">当前无明显病虫害，继续保持日常巡检</div>
            </div>
          </div>
        </div>
      </div>
    </div><!-- /real-content -->

    <!-- 底部导航 -->
    <div class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>服务</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_ai_assistant.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span>AI</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>地块</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <script>
    function navigateTo(page) { window.location.href = page; }

    // 骨架屏加载模拟
    (function() {
      var app = document.querySelector('.mb-app');
      setTimeout(function() {
        app.classList.remove('loading');
      }, 600);
    })();
  </script>
</body>
</html>
