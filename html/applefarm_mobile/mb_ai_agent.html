<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智慧果园 - AI助手</title>
<link rel="stylesheet" href="../applefarm_backhand/css/design-system.css">
<style>
body {
  margin: 0;
  padding: 0;
  font-family: var(--font-family);
  background: var(--bg-base);
}
.page-header {
  background: var(--gradient-header);
  padding: var(--space-lg) var(--space-md);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: var(--z-sticky);
}
.header-title {
  color: var(--text-inverse);
  font-size: var(--font-size-lg);
  font-weight: var(--font-weight-bold);
}
.header-back {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
}
.header-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
}
.chat-container {
  padding: var(--space-md);
  padding-bottom: 120px;
}
.message-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-lg);
}
.message-item {
  display: flex;
  gap: var(--space-md);
}
.message-item.bot {
  flex-direction: row;
}
.message-item.user {
  flex-direction: row-reverse;
}
.avatar {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-full);
  flex-shrink: 0;
}
.avatar.bot {
  background: var(--primary-500);
  display: flex;
  align-items: center;
  justify-content: center;
}
.avatar.user {
  background: var(--gray-100);
  display: flex;
  align-items: center;
  justify-content: center;
}
.message-content {
  max-width: 70%;
  padding: var(--space-md);
  border-radius: var(--radius-lg);
}
.message-content.bot {
  background: var(--bg-card);
  border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 0;
}
.message-content.user {
  background: var(--primary-500);
  color: var(--text-inverse);
  border-radius: var(--radius-lg) var(--radius-lg) 0 var(--radius-lg);
}
.message-text {
  font-size: var(--font-size-base);
  line-height: var(--line-height-normal);
}
.message-time {
  font-size: var(--font-size-xs);
  color: var(--text-secondary);
  margin-top: var(--space-xs);
}
.message-content.user .message-time {
  color: rgba(255,255,255,0.7);
}
.quick-questions {
  background: var(--bg-card);
  margin: var(--space-md);
  padding: var(--space-lg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}
.quick-title {
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-semibold);
  color: var(--text-secondary);
  margin-bottom: var(--space-md);
}
.quick-grid {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-sm);
}
.quick-tag {
  padding: var(--space-sm) var(--space-md);
  background: var(--bg-base);
  border-radius: var(--radius-md);
  font-size: var(--font-size-sm);
  color: var(--text-primary);
  cursor: pointer;
  transition: all var(--transition-fast);
}
.quick-tag:hover {
  background: var(--primary-50);
  color: var(--primary-500);
}
.input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-card);
  padding: var(--space-md);
  display: flex;
  gap: var(--space-md);
  box-shadow: var(--shadow-md);
}
.input-wrapper {
  flex: 1;
  display: flex;
  align-items: center;
  background: var(--bg-base);
  border-radius: var(--radius-lg);
  padding: 0 var(--space-md);
}
.input-field {
  flex: 1;
  padding: var(--space-md);
  border: none;
  background: transparent;
  font-size: var(--font-size-base);
  outline: none;
}
.send-btn {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-full);
  background: var(--primary-500);
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
}
.voice-btn {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-full);
  background: var(--gray-100);
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
}
.footer-nav {
  position: fixed;
  bottom: 70px;
  left: 0;
  right: 0;
  background: var(--bg-card);
  padding: var(--space-md);
  display: flex;
  justify-content: space-around;
  box-shadow: var(--shadow-md);
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-xs);
}
.nav-icon {
  width: 24px;
  height: 24px;
}
.nav-text {
  font-size: var(--font-size-xs);
  color: var(--text-secondary);
}
.nav-item.active .nav-text {
  color: var(--primary-500);
}
.feature-cards {
  background: var(--bg-card);
  margin: var(--space-md);
  padding: var(--space-lg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}
.feature-title {
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-semibold);
  color: var(--text-primary);
  margin-bottom: var(--space-lg);
}
.feature-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-md);
}
.feature-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-md);
  background: var(--bg-base);
  border-radius: var(--radius-md);
  cursor: pointer;
}
.feature-icon {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-full);
  background: var(--primary-500);
  display: flex;
  align-items: center;
  justify-content: center;
}
.feature-text {
  font-size: var(--font-size-xs);
  color: var(--text-secondary);
}
</style>
</head>
<body>
<!-- 顶部导航 -->
<header class="page-header">
  <button class="header-back">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
      <path d="M19 12H5"/>
      <path d="M12 19l-7-7 7-7"/>
    </svg>
  </button>
  <div class="header-title">智慧果园AI</div>
  <button class="header-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
      <path d="M12 8v4l3 3"/>
      <circle cx="12" cy="12" r="10"/>
    </svg>
  </button>
</header>

<!-- 功能入口 -->
<div class="feature-cards">
  <div class="feature-title">AI功能</div>
  <div class="feature-grid">
    <div class="feature-item">
      <div class="feature-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
        </svg>
      </div>
      <span class="feature-text">智能问答</span>
    </div>
    <div class="feature-item">
      <div class="feature-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M23 12l-2 2m0 0l-7-7 2-2m-7 7l-2-2m2 2l7 7"/>
        </svg>
      </div>
      <span class="feature-text">病虫害识别</span>
    </div>
    <div class="feature-item">
      <div class="feature-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M9 5l7 7-7 7"/>
        </svg>
      </div>
      <span class="feature-text">任务规划</span>
    </div>
  </div>
</div>

<!-- 快捷问题 -->
<div class="quick-questions">
  <div class="quick-title">问我点什么吧</div>
  <div class="quick-grid">
    <span class="quick-tag">今天天气怎么样?</span>
    <span class="quick-tag">病虫害防治建议</span>
    <span class="quick-tag">产量预测</span>
    <span class="quick-tag">农资推荐</span>
    <span class="quick-tag">施肥方案</span>
    <span class="quick-tag">浇水时间</span>
  </div>
</div>

<!-- 聊天内容 -->
<div class="chat-container">
  <div class="message-list">
    <div class="message-item bot">
      <div class="avatar bot">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 15s1.5-2 4-2 4 2 4 2"/>
          <circle cx="9" cy="9" r="1"/>
          <circle cx="15" cy="9" r="1"/>
        </svg>
      </div>
      <div class="message-content bot">
        <div class="message-text">您好！我是智慧果园AI助手，有什么可以帮您的吗？</div>
        <div class="message-time">刚刚</div>
      </div>
    </div>
    <div class="message-item user">
      <div class="avatar user">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22a84a" stroke-width="2">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="message-content user">
        <div class="message-text">今天适合浇水吗？</div>
        <div class="message-time">刚刚</div>
      </div>
    </div>
    <div class="message-item bot">
      <div class="avatar bot">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 15s1.5-2 4-2 4 2 4 2"/>
          <circle cx="9" cy="9" r="1"/>
          <circle cx="15" cy="9" r="1"/>
        </svg>
      </div>
      <div class="message-content bot">
        <div class="message-text">根据当前天气和土壤湿度数据，今天适合浇水。建议在上午10点前完成浇水，每次浇水时间约30分钟，水量控制在每株5-8升为宜。</div>
        <div class="message-time">刚刚</div>
      </div>
    </div>
  </div>
</div>

<!-- 输入区域 -->
<div class="input-area">
  <button class="voice-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22a84a" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <circle cx="12" cy="12" r="4"/>
    </svg>
  </button>
  <div class="input-wrapper">
    <input type="text" class="input-field" placeholder="输入您的问题...">
  </div>
  <button class="send-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
      <path d="M22 2H12a2 2 0 00-2 2v16l7-3 7 3V4a2 2 0 00-2-2z"/>
    </svg>
  </button>
</div>

<!-- 底部导航 -->
<div class="footer-nav">
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2">
      <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    <span class="nav-text">首页</span>
  </div>
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2">
      <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
      <line x1="9" y1="3" x2="9" y2="18"/>
      <line x1="15" y1="6" x2="15" y2="21"/>
    </svg>
    <span class="nav-text">导航</span>
  </div>
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <circle cx="12" cy="12" r="4"/>
    </svg>
    <span class="nav-text">快捷</span>
  </div>
  <div class="nav-item active">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#22a84a" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <path d="M8 15s1.5-2 4-2 4 2 4 2"/>
      <circle cx="9" cy="9" r="1"/>
      <circle cx="15" cy="9" r="1"/>
    </svg>
    <span class="nav-text">AI助手</span>
  </div>
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2">
      <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    <span class="nav-text">我的</span>
  </div>
</div>
</body>
</html>
