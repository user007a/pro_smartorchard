<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 领农资</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <!-- 移动端共享数据层 -->
  <script src="js/mobile-store.js"></script>
  <script src="js/mobile-data.js"></script>
  <style>
    /* 页面特定样式 - 使用设计系统变量 */
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; overflow: hidden; padding-bottom: 66px; }
    
    /* 内容区域 */
    .content { padding: 16px; padding-bottom: 80px; }
    
    /* 卡片 */
    .card { background: var(--bg-white); border-radius: var(--radius-lg); margin-bottom: var(--space-4); padding: var(--space-4); box-shadow: var(--shadow-card); border: 1px solid var(--border); }
    .card-title { font-size: var(--font-md); font-weight: 600; color: var(--text); margin-bottom: var(--space-4); }
    
    /* 农资列表项 */
    .material-item { display: flex; gap: var(--space-3); padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: var(--space-3); }
    /* 库存数据源说明 */
    .stock-tip {
      font-size:12px;color:var(--text-light);line-height:1.6;
      padding:8px 10px;margin-bottom:var(--space-3);
      background:var(--primary-light);border-radius:var(--radius-md);
    }
    .material-icon { width: 56px; height: 56px; border-radius: var(--radius-lg); background: var(--primary-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .material-icon svg { width: 32px; height: 32px; color: var(--primary); }
    .material-info { flex: 1; min-width: 0; }
    .material-name { font-size: var(--font-md); font-weight: 600; color: var(--text); margin-bottom: var(--space-1); }
    .material-desc { font-size: var(--font-sm); color: var(--text-secondary); margin-bottom: var(--space-2); }
    .material-meta { display: flex; justify-content: space-between; align-items: center; }
    .material-stock { font-size: var(--font-sm); color: var(--text-light); }
    
    /* 按钮 */
    .btn { height: 36px; padding: 0 var(--space-4); border-radius: var(--radius-full); font-size: var(--font-base); font-weight: 600; cursor: pointer; border: none; transition: all var(--transition-normal); }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: var(--bg-white); }
    .btn-outline { border: 1px solid var(--border); background: var(--bg-white); color: var(--text); }
    
    /* 领用记录 */
    .record-item { padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: var(--space-3); }
    .record-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-2); }
    .record-name { font-size: var(--font-base); font-weight: 600; color: var(--text); }
    .record-status { padding: var(--space-1) var(--space-3); border-radius: var(--radius-lg); font-size: var(--font-sm); font-weight: 500; }
    .record-status.pending { background: var(--warning-bg); color: var(--warning); }
    .record-status.approved { background: var(--success-bg); color: var(--success); }
    .record-status.rejected { background: var(--error-bg, #ffece8); color: var(--error, #f5222d); }
    .record-info { font-size: var(--font-sm); color: var(--text-secondary); display: flex; justify-content: space-between; }
    
    /* Modal: 已迁移到统一弹窗组件 .mb-modal-overlay / .mb-modal */
    .modal-title { font-size: var(--font-md); font-weight: 600; text-align: center; margin-bottom: var(--space-5); }
    
    /* 表单 */
    .form-group { margin-bottom: var(--space-4); }
    .form-label { font-size: var(--font-sm); color: var(--text-secondary); margin-bottom: var(--space-2); display: block; }
    .form-input { width: 100%; height: 48px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0 var(--space-4); font-size: var(--font-base); color: var(--text); background: var(--bg-white); }
    .form-select { width: 100%; height: 48px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0 var(--space-4); font-size: var(--font-base); color: var(--text); background: var(--bg-white); }
    
    /* 按钮行 */
    .btn-row { display: flex; gap: var(--space-3); margin-top: var(--space-5); }
    .btn-row .btn { flex: 1; height: 48px; border-radius: 24px; font-size: var(--font-md); }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div class="header-content">
        <div class="header-title">农资领用</div>
        <div class="header-sub">申请领取农资物资</div>
      </div>
    </div>
    
    <div class="content">
      <div class="card">
        <div class="card-title">可领取农资</div>
        <div class="stock-tip">库存数据来自后台农资库（唯一权威数据源）；提交领用申请不会直接扣减库存，由后台「农资使用 - 领用审批」通过后统一扣减。</div>
        <!-- 可领取农资列表：全部由后端 sf_material_info 渲染，无硬编码兜底 -->
        <div id="materialList"></div>
      </div>

      <div class="card">
        <div class="card-title">领用记录</div>
        <div id="myApplyList"></div>
      </div>
    </div>

    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <div class="mb-modal-overlay" id="applyModal">
    <div class="mb-modal">
      <div class="modal-title">领用申请</div>
      <div class="form-group">
        <label class="form-label">农资名称</label>
        <input type="text" class="form-input" id="materialName" readonly>
      </div>
      <div class="form-group">
        <label class="form-label">领用数量</label>
        <input type="number" class="form-input" id="materialQty" min="1" max="1000" placeholder="请输入数量（1-1000）">
      </div>
      <div class="form-group">
        <label class="form-label">领用地块</label>
        <select class="form-select" id="materialPlot">
          <option value="">请选择地块</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">备注</label>
        <input type="text" class="form-input" id="materialRemark" placeholder="备注信息（选填）">
      </div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="closeApplyModal()">取消</button>
        <button class="btn btn-primary" onclick="submitApply()">提交</button>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
     * 农资领用页（严格空库 · 全部取自数据库）
     * ------------------------------------------------------------
     * 可领取农资 → sf_material_info（库存 = current_stock）
     * 领用记录   → sf_material_io（移动端提交后由后台审批回写 audit_status）
     * 领用地块   → sf_plot
     * ============================================================ */
    function navigateTo(page) {
      window.location.href = page;
    }

    function goBack() {
      window.history.back();
    }

    var MD = window.MobileData;

    function esc(s) {
      return MD ? MD.esc(s) : String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function resetApplyForm() {
      document.getElementById('materialQty').value = '';
      document.getElementById('materialPlot').value = '';
      document.getElementById('materialRemark').value = '';
    }

    /* 打开领用弹窗：传入按钮元素（含后台编号与品名） */
    function openApplyModal(target) {
      var name, code;
      if (target && target.nodeType === 1) {
        name = target.getAttribute('data-name') || '';
        code = target.getAttribute('data-code') || '';
      } else {
        name = String(target == null ? '' : target);
        code = '';
      }
      var modal = document.getElementById('applyModal');
      modal.dataset.materialName = name;
      modal.dataset.materialCode = code;
      document.getElementById('materialName').value = name;
      resetApplyForm();
      modal.classList.add('show');
    }

    function closeApplyModal() {
      document.getElementById('applyModal').classList.remove('show');
    }

    /* ---------- 农资档案（sf_material_info） ---------- */
    function readMaterials() {
      return MD ? MD.list('material_info') : [];
    }

    function findMaterialByCode(code) {
      if (!code) return null;
      var list = readMaterials();
      for (var i = 0; i < list.length; i++) {
        if (String(list[i].material_code) === String(code)) return list[i];
      }
      return null;
    }

    /* ---------- 地块下拉（sf_plot） ---------- */
    function renderPlotOptions() {
      var sel = document.getElementById('materialPlot');
      if (!sel) return;
      var plots = MD ? MD.list('plot') : [];
      var html = '<option value="">请选择地块</option>';
      plots.forEach(function (p) {
        html += '<option value="' + esc(p.name) + '">' + esc(p.name) + '</option>';
      });
      sel.innerHTML = html;
    }

    /* ---------- 可领取农资清单 ---------- */
    function iconOf(type) {
      if (type === 'fertilizer') {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M12 2L2 7l10 5 10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>';
      }
      if (type === 'pesticide') {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
      }
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>';
    }

    function renderMaterialList() {
      var box = document.getElementById('materialList');
      if (!box) return;
      var list = readMaterials();
      if (!list.length) {
        box.innerHTML = MD.inlineEmpty('后台暂无农资档案');
        return;
      }
      box.innerHTML = list.map(function (m) {
        var stock = m.current_stock != null ? Number(m.current_stock) : 0;
        var unit = m.unit || '';
        var desc = m.spec || m.type_name || m.material_type || '';
        var soldOut = !(stock > 0);
        return '<div class="material-item" data-code="' + esc(m.material_code) + '">' +
          '<div class="material-icon">' + iconOf(m.material_type) + '</div>' +
          '<div class="material-info">' +
            '<div class="material-name">' + esc(m.material_name) + '</div>' +
            '<div class="material-desc">' + esc(desc) + '</div>' +
            '<div class="material-meta">' +
              '<span class="material-stock">库存：' + esc(String(stock)) + esc(unit) + '</span>' +
              '<button class="btn btn-primary"' + (soldOut ? ' disabled style="opacity:.5;cursor:not-allowed;"' : '') +
                ' data-code="' + esc(m.material_code) + '" data-name="' + esc(m.material_name) + '" onclick="openApplyModal(this)">' +
                (soldOut ? '暂无库存' : '申请') + '</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    /* ---------- 我的领用记录（sf_material_io） ---------- */
    var IO_STATUS = { pending: '审核中', approved: '已审核', rejected: '已驳回', void: '已作废' };

    function renderMyApplies() {
      var box = document.getElementById('myApplyList');
      if (!box || !MD) return;
      var infoById = MD.mapBy(MD.list('material_info'), 'id');
      var ios = MD.list('material_io').slice().sort(function (a, b) {
        return String(b.io_date || '').localeCompare(String(a.io_date || ''));
      });
      if (!ios.length) {
        box.innerHTML = MD.inlineEmpty('暂无领用记录');
        return;
      }
      box.innerHTML = ios.map(function (r) {
        var info = infoById[r.material_id] || {};
        var name = info.material_name || r.source_code || r.io_code;
        var qty = r.quantity;
        var unit = info.unit || '';
        var status = r.audit_status || 'pending';
        var st = { text: IO_STATUS[status] || status, cls: status === 'approved' ? 'approved' : (status === 'rejected' ? 'rejected' : 'pending') };
        var tail = r.auditor ? ' · 审批人：' + r.auditor : '';
        return '<div class="record-item">' +
          '<div class="record-header">' +
            '<div class="record-name">' + esc(name) + '</div>' +
            '<span class="record-status ' + st.cls + '">' + esc(st.text) + '</span>' +
          '</div>' +
          '<div class="record-info">' +
            '<span>数量：' + (qty == null ? '--' : esc(qty) + esc(unit)) + '</span>' +
            '<span>' + esc(MD.dateText(r.io_date)) + '</span>' +
          '</div>' +
          '<div style="font-size:12px;color:var(--text-light);margin-top:6px;">用途：' + esc(r.related_target || '未指定地块') +
          (r.io_code ? ' · 单号：' + esc(r.io_code) : '') +
          (r.remark ? ' · ' + esc(r.remark) : '') + tail + '</div>' +
        '</div>';
      }).join('');
    }

    /* ---------- 提交领用申请 ---------- */
    function submitApply() {
      var modal = document.getElementById('applyModal');
      var name = modal.dataset.materialName || document.getElementById('materialName').value;
      var code = modal.dataset.materialCode || '';
      var qtyRaw = document.getElementById('materialQty').value.trim();
      var plot = document.getElementById('materialPlot').value;
      var remark = document.getElementById('materialRemark').value.trim();

      if (!qtyRaw) { MobileStore.toast('请输入领用数量', 'warning'); return; }
      var qty = Number(qtyRaw);
      if (!isFinite(qty) || qty <= 0) { MobileStore.toast('领用数量必须是大于 0 的数字', 'error'); return; }
      if (qty > 1000) { MobileStore.toast('单次领用数量不能超过 1000', 'error'); return; }
      if (!plot) { MobileStore.toast('请选择领用地块', 'warning'); return; }

      /* 以后台编号为准校验；未在后台农资库登记则禁止提交，避免产生无法审批的脏数据 */
      var mapped = findMaterialByCode(code);
      if (!mapped) {
        MobileStore.toast('「' + name + '」未在后台农资库登记，请联系管理员先建档', 'error');
        return;
      }

      /* 仅做提交前的可用量校验，实际扣减由后台审批环节执行 */
      var stock = mapped.current_stock != null ? Number(mapped.current_stock) : null;
      var unit = mapped.unit || '';
      if (stock === null || qty > stock) {
        MobileStore.toast('库存不足，当前仅剩 ' + (stock == null ? 0 : stock) + ' ' + unit, 'error');
        return;
      }

      /* 只写申请记录，不动后台库存 */
      MobileStore.push(MobileStore.KEYS.material, {
        name: name,
        code: mapped.material_code,
        backName: mapped.material_name,
        materialId: mapped.id,
        unit: unit,
        qty: qty,
        plot: plot,
        remark: remark,
        status: 'pending',
        time: MobileStore.fmtTime(Date.now())
      });

      closeApplyModal();
      MobileStore.toast('申请已提交：' + name + ' ' + qty + unit + '，由后台审批通过后统一扣减库存', 'success');
      renderMyApplies();
    }

    /* ---------- 渲染入口 ---------- */
    function renderAll() {
      renderMaterialList();
      renderMyApplies();
      renderPlotOptions();
    }

    renderAll();
    if (MD) MD.subscribe(renderAll);
    MobileStore.subscribe(function () {
      renderMyApplies();
      renderMaterialList();
    });
  </script>

</body>
</html>
