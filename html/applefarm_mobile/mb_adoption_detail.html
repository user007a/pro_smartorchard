<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 认养详情</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <script src="js/mobile-store.js"></script>
  <!-- 移动端统一数据层（严格空库 · 只读后端） -->
  <script src="js/mobile-data.js"></script>
  <style>
    /* 页面特定样式 - 使用设计系统变量 */
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; overflow: hidden; padding-bottom: var(--space-10); }
    
    .photo-carousel { position: relative; height: 280px; background: linear-gradient(135deg, var(--primary-100), var(--primary-200)); overflow: hidden; margin-top: 12px; }
    .photo-slide { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .photo-placeholder { font-size: 100px; }
    .photo-indicators { position: absolute; bottom: var(--space-4); left: 50%; transform: translateX(-50%); display: flex; gap: var(--space-2); }
    .indicator { width: var(--space-2); height: var(--space-2); border-radius: var(--radius-full); background: rgba(255,255,255,0.5); }
    .indicator.active { background: var(--bg-white); width: var(--space-5); border-radius: var(--radius-sm); }
    .photo-count { position: absolute; top: var(--space-4); right: var(--space-4); background: rgba(0,0,0,0.5); color: var(--bg-white); font-size: var(--font-sm); padding: var(--space-1) var(--space-3); border-radius: var(--radius-lg); }
    
    .content { padding: var(--space-4); padding-bottom: 80px; }
    
    .tree-header { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-4); margin-bottom: var(--space-3); border: 1px solid var(--border); }
    .tree-name { font-size: var(--font-xl); font-weight: var(--font-bold); color: var(--text); margin-bottom: var(--space-2); }
    .tree-status-row { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); }
    .status-badge { font-size: var(--font-sm); padding: var(--space-1) var(--space-3); border-radius: var(--radius-lg); }
    .status-badge.growing { background: var(--primary-100); color: var(--primary-500); }
    .status-badge.harvest { background: var(--orange-bg); color: var(--orange); }
    .growth-stage { font-size: var(--font-base); color: var(--primary-500); font-weight: var(--font-medium); }
    .tree-info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); }
    .info-item { }
    .info-label { font-size: var(--font-sm); color: var(--text-light); margin-bottom: var(--space-1); }
    .info-value { font-size: var(--font-base); color: var(--text); font-weight: var(--font-medium); }
    
    .function-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); margin-bottom: var(--space-4); }
    .func-item { background: var(--bg-white); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-2); display: flex; flex-direction: column; align-items: center; gap: var(--space-2); border: 1px solid var(--border); cursor: pointer; transition: all var(--transition-normal); }
    .func-item:active { transform: scale(0.96); background: var(--gray-50); }
    .func-icon { width: 44px; height: 44px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; }
    .func-icon.video { background: var(--error-bg); color: var(--error); }
    .func-icon.monitor { background: var(--info-bg); color: var(--info); }
    .func-icon.record { background: var(--primary-100); color: var(--primary-500); }
    .func-icon.report { background: var(--purple-bg); color: var(--purple); }
    .func-icon svg { width: 22px; height: 22px; }
    .func-name { font-size: var(--font-sm); color: var(--text); }
    
    .section-title { font-size: var(--font-md); font-weight: var(--font-semibold); color: var(--text); margin-bottom: var(--space-3); display: flex; align-items: center; justify-content: space-between; }
    .section-more { font-size: var(--font-base); color: var(--text-light); display: flex; align-items: center; gap: var(--space-1); cursor: pointer; }
    .section-more svg { width: 14px; height: 14px; }
    
    .updates-card { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-4); border: 1px solid var(--border); }
    .update-item { display: flex; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--border-light); }
    .update-item:last-child { border-bottom: none; }
    .update-icon { width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--primary-100); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .update-icon svg { width: var(--space-5); height: var(--space-5); color: var(--primary-500); }
    .update-icon.harvest { background: var(--orange-bg); }
    .update-icon.harvest svg { color: var(--orange); }
    .update-icon.water { background: var(--info-bg); }
    .update-icon.water svg { color: var(--info); }
    .update-icon.fertilize { background: var(--purple-bg); }
    .update-icon.fertilize svg { color: var(--purple); }
    .update-content { flex: 1; }
    .update-title { font-size: var(--font-base); color: var(--text); margin-bottom: var(--space-1); }
    .update-desc { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.4; margin-bottom: var(--space-1); }
    .update-time { font-size: var(--font-xs); color: var(--text-light); }
    .update-photo { width: 60px; height: 60px; border-radius: var(--radius-md); background: var(--gray-100); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .update-photo img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-md); }
    .update-photo-icon { font-size: var(--font-lg); }
    
    .growth-card { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-4); border: 1px solid var(--border); }
    .growth-timeline { position: relative; padding-left: var(--space-6); }
    .growth-timeline::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: var(--border); }
    .timeline-item { position: relative; padding-bottom: var(--space-5); }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-dot { position: absolute; left: -24px; top: var(--space-1); width: var(--space-4); height: var(--space-4); border-radius: var(--radius-full); background: var(--bg-white); border: 3px solid var(--primary-500); }
    .timeline-item.active .timeline-dot { background: var(--primary-500); }
    .timeline-item.future .timeline-dot { border-color: var(--border); }
    .timeline-date { font-size: var(--font-sm); color: var(--text-light); margin-bottom: var(--space-1); }
    .timeline-title { font-size: var(--font-base); color: var(--text); font-weight: var(--font-medium); margin-bottom: var(--space-1); }
    .timeline-item.active .timeline-title { color: var(--primary-500); }
    .timeline-desc { font-size: var(--font-sm); color: var(--text-secondary); }
    
    .bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 750px; background: var(--bg-white); border-top: 1px solid var(--border); padding: var(--space-3) var(--space-4); display: flex; gap: var(--space-3); z-index: 100; }
    .bar-btn { flex: 1; height: 44px; border-radius: var(--radius-full); font-size: var(--font-base); font-weight: var(--font-semibold); display: flex; align-items: center; justify-content: center; gap: var(--space-2); cursor: pointer; }
    .bar-btn.primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: var(--bg-white); border: none; }
    .bar-btn.secondary { background: var(--bg-white); color: var(--text); border: 1px solid var(--border); }
    .bar-btn svg { width: 18px; height: 18px; }

    /* 功能项选中态 */
    .func-item.active { border-color: var(--primary); background: var(--primary-100); }

    /* 内联展开面板 */
    .inline-panel { display: none; background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-4); border: 1px solid var(--border); margin-bottom: var(--space-3); }
    .inline-panel.show { display: block; }
    .inline-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3); }
    .inline-panel-title { font-size: var(--font-md); font-weight: var(--font-semibold); color: var(--text); }
    .inline-panel-close { font-size: var(--font-sm); color: var(--text-light); display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .inline-panel-close svg { width: 14px; height: 14px; }

    /* 监控画面 */
    .scene-frame { position: relative; height: 180px; border-radius: var(--radius-lg); background: linear-gradient(160deg, #1a2e1a, #3d5c3d); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .scene-frame::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 3px); pointer-events: none; }
    .scene-frame-icon { font-size: 56px; opacity: 0.9; }
    .scene-badge { position: absolute; top: var(--space-2); left: var(--space-2); background: var(--warning); color: var(--bg-white); padding: 3px var(--space-2); border-radius: var(--radius-md); font-size: var(--font-xs); font-weight: var(--font-semibold); z-index: 1; }
    .scene-note { font-size: var(--font-xs); color: var(--text-light); margin-top: var(--space-2); text-align: center; }

    /* 记录 / 时间轴列表 */
    .record-list { display: flex; flex-direction: column; }
    .record-item { display: flex; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--border-light); }
    .record-item:last-child { border-bottom: none; }
    .record-icon { width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--primary-100); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
    .record-main { flex: 1; min-width: 0; }
    .record-title { font-size: var(--font-base); color: var(--text); margin-bottom: 2px; }
    .record-desc { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.4; }
    .record-time { font-size: var(--font-xs); color: var(--text-light); margin-top: 4px; }

    /* 空态 */
    .empty-state { text-align: center; padding: var(--space-6) var(--space-4); color: var(--text-light); }
    .empty-state-icon { font-size: 40px; margin-bottom: var(--space-2); }
    .empty-state-text { font-size: var(--font-sm); margin-bottom: var(--space-3); }

    /* 报告数据 */
    .report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); }
    .report-card { background: var(--gray-50); border-radius: var(--radius-lg); padding: var(--space-3); }
    .report-value { font-size: var(--font-xl); font-weight: var(--font-bold); color: var(--primary-500); }
    .report-value .unit { font-size: var(--font-xs); color: var(--text-light); font-weight: 400; margin-left: 2px; }
    .report-label { font-size: var(--font-xs); color: var(--text-secondary); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div style="padding-left: 44px;">
        <div class="header-title">认养详情</div>
        <div class="header-sub">查看认养果树信息</div>
      </div>
    </div>
    <div class="photo-carousel">
      <div class="photo-slide">
        <span class="photo-placeholder">🍎</span>
      </div>
      <div class="photo-count" id="photoCount">--</div>
      <div class="photo-indicators" id="photoIndicators"></div>
    </div>
    
    <div class="content">
      <div class="tree-header">
        <div class="tree-name" id="treeName">--</div>
        <div class="tree-status-row">
          <span class="status-badge harvest" id="treeStatus">--</span>
          <span class="growth-stage" id="treeStage">--</span>
        </div>
        <div class="tree-info-grid">
          <div class="info-item">
            <div class="info-label">品种</div>
            <div class="info-value" id="treeVariety">--</div>
          </div>
          <div class="info-item">
            <div class="info-label">树龄</div>
            <div class="info-value" id="treeAge">--</div>
          </div>
          <div class="info-item">
            <div class="info-label">位置</div>
            <div class="info-value" id="treeLocation">--</div>
          </div>
          <div class="info-item">
            <div class="info-label">预估产量</div>
            <div class="info-value" id="treeYield">--</div>
          </div>
          <div class="info-item">
            <div class="info-label">认养开始</div>
            <div class="info-value" id="treeStart">--</div>
          </div>
          <div class="info-item">
            <div class="info-label">认养到期</div>
            <div class="info-value" id="treeEnd">--</div>
          </div>
        </div>
      </div>
      
      <div class="function-grid">
        <div class="func-item" onclick="showVideo(this)">
          <div class="func-icon video">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="23 7 16 12 23 17 23 7"/>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
          </div>
          <div class="func-name">果树视频</div>
        </div>
        <div class="func-item" onclick="showMonitor(this)">
          <div class="func-icon monitor">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
          <div class="func-name">实时监控</div>
        </div>
        <div class="func-item" onclick="showFarmingLog(this)">
          <div class="func-icon record">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
          </div>
          <div class="func-name">农事记录</div>
        </div>
        <div class="func-item" onclick="showGrowthReport(this)">
          <div class="func-icon report">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"/>
              <line x1="12" y1="20" x2="12" y2="4"/>
              <line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
          </div>
          <div class="func-name">生长报告</div>
        </div>
      </div>

      <!-- 内联展开面板 -->
      <div class="inline-panel" id="inlinePanel"></div>

      <div class="section-title">
        最近动态
        <div class="section-more" onclick="showAllUpdates()">
          查看全部
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </div>
      <div class="updates-card" id="updatesCard"></div>
      
      <div class="section-title" style="margin-top: 16px;">
        生长历程
      </div>
      <div class="growth-card">
        <div class="growth-timeline" id="growthTimeline"></div>
      </div>
    </div>
    
    <div class="bottom-bar">
      <div class="bar-btn secondary" onclick="showCertificate()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        查看证书
      </div>
      <div class="bar-btn primary" onclick="reserveHarvest()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        预约采摘
      </div>
    </div>
  </div>

  <script>
    var MD = window.MobileData;
    var currentPanel = '';
    var currentTreeCode = '';
    var currentTree = null;
    var currentOrder = null;
    var photos = [];

    var TREE_STATUS_TEXT = { available: '可认养', adopted: '已认养', unavailable: '不可认养' };
    var CAMERA_STATUS_TEXT = { online: '在线', maintain: '维护中', offline: '离线' };

    function queryParam(name) {
      var m = (location.search || '').match(new RegExp('[?&]' + name + '=([^&]+)'));
      if (!m) return '';
      try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
    }

    /* 果树：优先 ?tree= / ?treeId=，其次 ?orderId= 反查订单上的 tree_id */
    function resolveTree() {
      var trees = MD.list('adoption_tree');
      var orders = MD.list('adoption_order');
      var wanted = queryParam('tree') || queryParam('treeId');
      var orderId = queryParam('orderId');
      var i;

      if (!wanted && orderId) {
        for (i = 0; i < orders.length; i++) {
          if (String(orders[i].order_code) === orderId || String(orders[i].id) === orderId) {
            currentOrder = orders[i];
            wanted = orders[i].tree_id != null ? String(orders[i].tree_id) : (orders[i].tree_code || '');
            break;
          }
        }
      }
      if (!wanted) return null;
      var wantedNorm = String(wanted).replace(/^AD-/i, '');
      for (i = 0; i < trees.length; i++) {
        if (String(trees[i].id) === String(wanted) ||
            String(trees[i].tree_code) === String(wanted) ||
            String(trees[i].tree_code) === wantedNorm) {
          return trees[i];
        }
      }
      return null;
    }

    function currentTreeId() { return currentTree ? String(currentTree.id) : ''; }

    function farmingOfTree() {
      var id = currentTreeId();
      if (!id) return [];
      return MD.list('adoption_farming').filter(function (r) {
        return String(r.tree_id) === id;
      });
    }

    function sortedFarming() {
      var records = farmingOfTree().slice();
      records.sort(function (a, b) {
        return String(b.execute_date || b.bind_time || '').localeCompare(String(a.execute_date || a.bind_time || ''));
      });
      return records;
    }

    function certOfTree() {
      var id = currentTreeId();
      if (!id) return null;
      var all = MD.list('adoption_cert');
      for (var i = 0; i < all.length; i++) {
        if (String(all[i].tree_id) === id) return all[i];
      }
      return null;
    }

    function setText(id, val) {
      var el = document.getElementById(id);
      if (el) el.textContent = val == null || val === '' ? '--' : val;
    }

    /* ---------- 果树概要 ---------- */
    function renderHeader() {
      currentTree = resolveTree();
      if (!currentTree) {
        setText('treeName', '未找到认养果树');
        setText('treeStatus', '--');
        setText('treeStage', '--');
        setText('treeVariety', '--');
        setText('treeAge', '--');
        setText('treeLocation', '--');
        setText('treeYield', '--');
        setText('treeStart', '--');
        setText('treeEnd', '--');
        return;
      }
      currentTreeCode = currentTree.tree_code || '';
      var variety = currentTree.variety_name || currentTree.variety || '';
      var name = currentTree.tree_name ||
        ((variety || '苹果树') + (currentTreeCode ? ' #' + currentTreeCode : ''));
      setText('treeName', name);
      setText('treeStatus', TREE_STATUS_TEXT[currentTree.status] || currentTree.status);
      setText('treeStage', currentTree.growth_stage ? '当前物候期：' + currentTree.growth_stage : '');
      setText('treeVariety', variety);
      setText('treeAge', currentTree.tree_age != null ? currentTree.tree_age + '年' : '');
      setText('treeLocation', [currentTree.base_name, currentTree.plot_name].filter(Boolean).join(' '));

      var cert = certOfTree();
      setText('treeYield', cert && cert.estimate_yield != null ? cert.estimate_yield + '斤' : '');

      var start = MD.dateText(currentTree.start_date);
      var end = MD.dateText(currentTree.expire_time);
      if (!start && currentOrder) start = MD.dateText(currentOrder.start_date);
      if (!end && currentOrder) end = MD.dateText(currentOrder.end_date);
      setText('treeStart', start);
      setText('treeEnd', end);

      var sub = document.querySelector('.header-sub');
      if (sub) {
        sub.textContent = currentTreeCode
          ? '果树编号 #' + currentTreeCode + ' · 查看认养果树信息'
          : '查看认养果树信息';
      }
    }

    /* ---------- 成长相册（sf_adoption_photo） ---------- */
    function renderPhotos() {
      var countEl = document.getElementById('photoCount');
      var indEl = document.getElementById('photoIndicators');
      var treeId = currentTreeId();
      photos = treeId ? MD.list('adoption_photo').filter(function (p) {
        return String(p.tree_id) === treeId;
      }) : [];
      if (countEl) countEl.textContent = photos.length ? '1/' + photos.length : '--';
      if (indEl) {
        indEl.innerHTML = photos.map(function (p, i) {
          return '<div class="indicator' + (i === 0 ? ' active' : '') + '"></div>';
        }).join('');
      }
    }

    /* ---------- 最近动态（sf_adoption_farming） ---------- */
    function renderUpdates() {
      var box = document.getElementById('updatesCard');
      if (!box) return;
      var records = sortedFarming();
      if (!records.length) {
        box.innerHTML = MD.inlineEmpty('暂无农事动态');
        return;
      }
      box.innerHTML = records.slice(0, 5).map(function (r) {
        var type = r.farm_type || '农事';
        var time = MD.dateText(r.execute_date) || MD.dateTimeText(r.bind_time) || '--';
        return '<div class="update-item">' +
          '<div class="update-icon fertilize">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>' +
            '</svg>' +
          '</div>' +
          '<div class="update-content">' +
            '<div class="update-title">' + MD.esc(r.title || (type + '作业')) + '</div>' +
            (r.remark ? '<div class="update-desc">' + MD.esc(r.remark) + '</div>' : '') +
            '<div class="update-time">' + MD.esc(time) + ' · ' + MD.esc(type) + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    /* ---------- 生长历程（sf_phenology_stage 物候期配置） ---------- */
    function renderTimeline() {
      var box = document.getElementById('growthTimeline');
      if (!box) return;
      var stages = MD.list('phenology_stage').slice();
      if (!stages.length) {
        box.innerHTML = MD.inlineEmpty('暂无生长阶段数据');
        return;
      }
      stages.sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0); });
      var currentStage = currentTree ? (currentTree.growth_stage || '') : '';
      box.innerHTML = stages.map(function (s) {
        var isActive = currentStage && s.stage_name === currentStage;
        var range = [s.start_date, s.end_date].filter(Boolean).join(' 至 ');
        return '<div class="timeline-item' + (isActive ? ' active' : '') + '">' +
          '<div class="timeline-dot"></div>' +
          '<div class="timeline-date">' + MD.esc(range) + '</div>' +
          '<div class="timeline-title">' + MD.esc(s.stage_name) + '</div>' +
          (s.variety ? '<div class="timeline-desc">适用品种：' + MD.esc(s.variety) + '</div>' : '') +
        '</div>';
      }).join('');
    }

    /* 果树绑定的摄像头：sf_adoption_tree.camera_id → sf_device */
    function resolveCamera() {
      if (!currentTree || currentTree.camera_id == null) return null;
      var id = String(currentTree.camera_id);
      var devices = MD.list('device');
      for (var i = 0; i < devices.length; i++) {
        if (String(devices[i].id) === id || String(devices[i].device_code) === id) return devices[i];
      }
      return { device_code: id, device_name: '摄像头 #' + id };
    }

    function refreshAll() {
      renderHeader();
      renderPhotos();
      renderUpdates();
      renderTimeline();
    }

    function goBack() {
      window.history.back();
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function panelTitle(type) {
      return { video: '果树视频', monitor: '实时监控', farming: '农事记录', growth: '生长报告', updates: '全部动态' }[type] || '详情';
    }

    function togglePanel(type, el) {
      if (currentPanel === type) { closePanel(); return; }
      currentPanel = type;
      document.querySelectorAll('.func-item').forEach(function (f) { f.classList.remove('active'); });
      if (el && el.classList && el.classList.contains('func-item')) el.classList.add('active');

      var panel = document.getElementById('inlinePanel');
      panel.innerHTML =
        '<div class="inline-panel-header">' +
          '<div class="inline-panel-title">' + panelTitle(type) + '</div>' +
          '<div class="inline-panel-close" onclick="closePanel()">收起' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>' +
          '</div>' +
        '</div>' + panelBody(type);
      panel.classList.add('show');
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function panelBody(type) {
      if (type === 'video') return renderCameraFrame('果树视频', '🍎');
      if (type === 'monitor') return renderCameraFrame('实时监控', '🎥');
      if (type === 'farming') return renderFarmingBody();
      if (type === 'growth') return renderGrowthBody();
      if (type === 'updates') return renderUpdatesBody();
      return '';
    }

    function renderSceneFrame(label, icon, badge) {
      return '<div class="scene-frame">' +
        '<div class="scene-badge">' + MD.esc(badge || '暂无实时画面') + '</div>' +
        '<div class="scene-frame-icon">' + icon + '</div>' +
      '</div>' +
      '<div class="scene-note">' + MD.esc(label) + '</div>';
    }

    // 有绑定摄像头时展示设备档案，未绑定则明确提示无视频通道
    function renderCameraFrame(label, icon) {
      var cam = resolveCamera();
      if (!cam) {
        return renderSceneFrame(label + ' · 暂未绑定视频通道', icon, '未绑定摄像头');
      }
      var baseName = '--';
      if (cam.base_id != null) {
        var bases = MD.list('base');
        for (var i = 0; i < bases.length; i++) {
          if (String(bases[i].id) === String(cam.base_id)) { baseName = bases[i].name || '--'; break; }
        }
      }
      var rows = [
        ['摄像头', cam.device_name || cam.device_code || '--'],
        ['设备编码', cam.device_code || '--'],
        ['所在基地', baseName],
        ['安装位置', cam.location || '--'],
        ['设备状态', CAMERA_STATUS_TEXT[cam.run_status] || cam.run_status || '--'],
        ['设备型号', cam.model || '--']
      ];
      var info = rows.map(function (r) {
        return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border-light);font-size:var(--font-sm);">' +
          '<span style="color:var(--text-light);">' + r[0] + '</span>' +
          '<span style="color:var(--text);font-weight:var(--font-medium);text-align:right;">' + escapeHtml(r[1]) + '</span></div>';
      }).join('');
      return '<div style="background:var(--bg-white);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);border:1px solid var(--border);margin-bottom:var(--space-3);">' + info + '</div>' +
        renderSceneFrame(label + ' · ' + (cam.device_name || cam.device_code || ''), icon, '未接入实时图传');
    }

    function renderFarmingBody() {
      var records = sortedFarming();
      if (!records.length) {
        return MD.empty('暂无农事记录', '该果树尚未绑定农事记录');
      }
      var html = '<div class="record-list">';
      records.forEach(function (r) {
        var time = MD.dateText(r.execute_date) || MD.dateTimeText(r.bind_time) || '--';
        html += '<div class="record-item">' +
          '<div class="record-icon">🌾</div>' +
          '<div class="record-main">' +
            '<div class="record-title">' + MD.esc(r.title || ((r.farm_type || '农事') + '作业')) + '</div>' +
            (r.remark ? '<div class="record-desc">' + MD.esc(r.remark) + '</div>' : '') +
            '<div class="record-time">' + MD.esc(time) + (r.adopter ? ' · ' + MD.esc(r.adopter) : '') + '</div>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
      return html;
    }

    function reportCard(value, unit, label) {
      return '<div class="report-card">' +
        '<div class="report-value">' + value + '<span class="unit">' + unit + '</span></div>' +
        '<div class="report-label">' + label + '</div>' +
      '</div>';
    }

    function renderGrowthBody() {
      if (!currentTree) return MD.inlineEmpty('暂无生长报告数据');
      var stage = currentTree.growth_stage;
      var progress = currentTree.progress;
      if (!stage && progress == null) return MD.inlineEmpty('暂无生长报告数据');
      return '<div class="report-grid">' +
        reportCard(stage || '--', '', '当前物候期') +
        reportCard(progress != null ? progress : '--', progress != null ? '%' : '', '生长进度') +
      '</div>';
    }

    function renderUpdatesBody() {
      var records = sortedFarming();
      if (!records.length) return MD.inlineEmpty('暂无动态');
      var html = '<div class="record-list">';
      records.forEach(function (r) {
        var type = r.farm_type || '农事';
        var time = MD.dateText(r.execute_date) || MD.dateTimeText(r.bind_time) || '--';
        html += '<div class="record-item">' +
          '<div class="record-icon">🌾</div>' +
          '<div class="record-main">' +
            '<div class="record-title">' + MD.esc(r.title || (type + '作业')) + '</div>' +
            (r.remark ? '<div class="record-desc">' + MD.esc(r.remark) + '</div>' : '') +
            '<div class="record-time">' + MD.esc(time) + ' · ' + MD.esc(type) + '</div>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
      return html;
    }

    function closePanel() {
      currentPanel = '';
      document.querySelectorAll('.func-item').forEach(function (f) { f.classList.remove('active'); });
      var panel = document.getElementById('inlinePanel');
      if (panel) { panel.classList.remove('show'); panel.innerHTML = ''; }
    }

    function showVideo(el) { togglePanel('video', el); }
    function showMonitor(el) { togglePanel('monitor', el); }
    function showFarmingLog(el) { togglePanel('farming', el); }
    function showGrowthReport(el) { togglePanel('growth', el); }
    function showAllUpdates() { togglePanel('updates', null); }

    function showCertificate() {
      var q = currentTree ? '?treeId=' + encodeURIComponent(currentTree.id) : '';
      window.location.href = 'mb_adoption_cert.html' + q;
    }

    function reserveHarvest() {
      var q = [];
      if (currentOrder) q.push('orderId=' + encodeURIComponent(currentOrder.order_code || currentOrder.id));
      if (currentTree) q.push('treeId=' + encodeURIComponent(currentTree.id));
      window.location.href = 'mb_adoption_harvest.html' + (q.length ? '?' + q.join('&') : '');
    }

    /* 初始化：先按库中数据渲染，再补拉成长相册 */
    function initDetail() {
      refreshAll();
      if (MD && typeof MD.subscribe === 'function') MD.subscribe(refreshAll);
      MD.ready.then(function () {
        refreshAll();
        /* 成长相册不在预加载清单内，预加载完成后再补拉 */
        return MD.rows('adoption_photo').then(renderPhotos);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDetail);
    } else {
      initDetail();
    }
  </script>
</body>
</html>
