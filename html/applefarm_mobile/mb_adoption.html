<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 认养管理</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <!-- 共享数据层（toast 轻提示） -->
  <script src="js/mobile-store.js"></script>
  <!-- 移动端统一数据层（严格空库 · 只读后端） -->
  <script src="js/mobile-data.js"></script>
  <style>
    /* Stats */
    .stats-row {
      display: flex;
      gap: var(--space-3);
      padding: 16px;
      background: var(--bg-white);
      margin: 12px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .stat-item {
      flex: 1;
      text-align: center;
      padding: 12px 0;
    }

    .stat-value {
      font-size: var(--font-2xl);
      font-weight: 700;
      color: var(--primary);
    }

    .stat-label {
      font-size: var(--font-xs);
      opacity: 0.85;
      margin-top: 4px;
      color: var(--text-secondary);
    }

    /* Content */
    .content { padding: var(--space-4); padding-bottom: 80px; }

    .section-title {
      font-size: var(--font-md);
      font-weight: 600;
      color: var(--text);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* Quick Actions - 认养设置 */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: var(--space-2);
      margin-bottom: var(--space-4);
    }

    .quick-action {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-3) var(--space-1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-1);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .quick-action:active {
      transform: scale(0.96);
      box-shadow: var(--shadow-xs);
    }

    .quick-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quick-icon.cert { background: var(--warning-bg); color: var(--warning); }
    .quick-icon.harvest { background: var(--orange-bg); color: var(--orange); }
    .quick-icon.tag { background: var(--success-bg); color: var(--success); }
    .quick-icon.farming { background: var(--purple-bg); color: var(--purple); }
    .quick-icon.camera { background: var(--info-bg); color: var(--info); }

    .quick-icon svg { width: 20px; height: 20px; }

    .quick-name {
      font-size: var(--font-xs);
      color: var(--text);
      text-align: center;
      line-height: 1.2;
    }

    /* Order Card */
    .order-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: var(--space-3);
    }

    .order-info { flex: 1; }

    .order-id {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .order-user {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
    }

    .order-time {
      font-size: var(--font-xs);
      color: var(--text-light);
      margin-top: 2px;
    }

    .order-status {
      font-size: var(--font-xs);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-weight: 600;
    }

    .order-status.pending { background: var(--warning-bg); color: var(--warning); }
    .order-status.confirmed { background: var(--info-bg); color: var(--info); }
    .order-status.ready { background: var(--orange-bg); color: var(--orange); }
    .order-status.shipping { background: var(--purple-bg); color: var(--purple); }
    .order-status.shipped { background: var(--info-bg); color: var(--info); }
    .order-status.completed { background: var(--success-bg); color: var(--success); }
    .order-status.refunded { background: var(--gray-100); color: var(--text-secondary); }
    .order-status.cancelled { background: var(--gray-100); color: var(--text-light); }

    .order-detail {
      background: var(--gray-50);
      border-radius: var(--radius-lg);
      padding: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: var(--font-sm);
    }

    .detail-label { color: var(--text-secondary); }
    .detail-value { color: var(--text); font-weight: 500; }

    .order-actions {
      display: flex;
      gap: var(--space-2);
      padding-top: var(--space-3);
      border-top: 1px solid var(--border-light);
    }

    .order-btn {
      flex: 1;
      height: 36px;
      border-radius: var(--radius-full);
      font-size: var(--font-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all var(--transition-fast);
      border: none;
    }

    .order-btn.primary {
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: var(--bg-white);
    }

    .order-btn.secondary {
      background: var(--gray-100);
      color: var(--text-secondary);
    }

    .order-btn:active { transform: scale(0.98); }

    .order-btn svg { width: 16px; height: 16px; }

    /* Adoption Tree Card */
    .tree-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .tree-header {
      display: flex;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .tree-photo {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--primary-100), var(--primary-200));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .tree-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tree-info { flex: 1; min-width: 0; }

    .tree-name {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .tree-variety {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .tree-adopter {
      font-size: var(--font-xs);
      color: var(--primary);
      margin-top: 4px;
    }

    .tree-status-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-2);
    }

    .status-badge {
      font-size: var(--font-xs);
      padding: 3px 10px;
      border-radius: var(--radius-full);
    }

    .status-badge.active { background: var(--success-bg); color: var(--success); }
    .status-badge.pending { background: var(--warning-bg); color: var(--warning); }

    .tree-actions {
      display: flex;
      gap: var(--space-2);
      padding-top: var(--space-3);
      border-top: 1px solid var(--border-light);
    }

    .tree-btn {
      flex: 1;
      height: 36px;
      background: var(--primary-light);
      border-radius: var(--radius-full);
      font-size: var(--font-sm);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .tree-btn:active {
      transform: scale(0.98);
      background: var(--primary-200);
    }

    .tree-btn svg { width: 16px; height: 16px; }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
      padding: var(--space-2);
      background: var(--gray-50);
      border-radius: var(--radius-lg);
    }

    .filter-tab {
      flex: 1;
      height: 36px;
      border-radius: var(--radius-md);
      font-size: var(--font-sm);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      background: transparent;
    }

    .filter-tab.active {
      background: var(--bg-white);
      color: var(--primary);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .order-result {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-bottom: var(--space-3);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px var(--space-5);
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      background: var(--primary-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-3);
    }

    .empty-icon svg { width: 32px; height: 32px; color: var(--primary); }

    .empty-title {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
      margin-bottom: var(--space-2);
    }

    .empty-desc {
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }

    /* 摄像头权限引导弹窗 */
    .cam-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; }
    .cam-overlay.show { display: flex; }
    .cam-panel { background: var(--bg-white); border-radius: var(--radius-xl); width: 100%; max-width: 360px; padding: var(--space-4); }
    .cam-title { font-size: var(--font-md); font-weight: 600; color: var(--text); margin-bottom: var(--space-3); }
    .cam-stage { width: 100%; height: 200px; border-radius: var(--radius-lg); background: var(--gray-100); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: var(--space-3); }
    .cam-stage-icon { font-size: 40px; color: var(--text-light); }
    .cam-stage video { width: 100%; height: 100%; object-fit: cover; }
    .cam-tip { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.6; margin-bottom: var(--space-3); }
    .cam-actions { display: flex; gap: var(--space-2); }

  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div class="header-content">
        <div class="header-title">认养管理</div>
        <div class="header-sub">管理认养订单与果树</div>
      </div>
    </div>
    <div class="stats-row">
        <div class="stat-item">
          <div class="stat-value" id="statTrees">--</div>
          <div class="stat-label">认养果树</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statPending">--</div>
          <div class="stat-label">待确认订单</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statPaid">--</div>
          <div class="stat-label">已支付订单</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statHarvest">--</div>
          <div class="stat-label">待采摘</div>
        </div>
      </div>

    <div class="content">
      <!-- 认养设置快捷入口 -->
      <div class="section-title">认养设置</div>
      <div class="quick-actions">
        <div class="quick-action" onclick="openCertSetting()">
          <div class="quick-icon cert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <path d="M12 18v-6"/>
              <path d="M9 15h6"/>
            </svg>
          </div>
          <div class="quick-name">证书设置</div>
        </div>
        <div class="quick-action" onclick="openHarvestConfirm()">
          <div class="quick-icon harvest">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </div>
          <div class="quick-name">采摘确认</div>
        </div>
        <div class="quick-action" onclick="openTagging()">
          <div class="quick-icon tag">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
              <path d="M7 7h.01"/>
            </svg>
          </div>
          <div class="quick-name">认养挂牌</div>
        </div>
        <div class="quick-action" onclick="openFarmingBind()">
          <div class="quick-icon farming">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
          </div>
          <div class="quick-name">农事绑定</div>
        </div>
        <div class="quick-action" onclick="openCameraSetting()">
          <div class="quick-icon camera">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
          <div class="quick-name">开放实景</div>
        </div>
      </div>

      <!-- 订单管理 -->
      <div class="section-title">订单管理</div>
      <div class="filter-tabs">
        <div class="filter-tab active" data-filter="all" onclick="filterOrders('all')">全部</div>
        <div class="filter-tab" data-filter="pending" onclick="filterOrders('pending')">待确认</div>
        <div class="filter-tab" data-filter="paid" onclick="filterOrders('paid')">已支付</div>
        <div class="filter-tab" data-filter="done" onclick="filterOrders('done')">已完成</div>
        <div class="filter-tab" data-filter="refunded" onclick="filterOrders('refunded')">已退款</div>
        <div class="filter-tab" data-filter="cancelled" onclick="filterOrders('cancelled')">已取消</div>
      </div>
      <div class="order-result" id="orderResult">共 -- 条订单</div>

      <!-- 订单卡片 -->
      <div id="orderList">





      </div>

      <!-- 已认养果树 -->
      <div class="section-title" style="margin-top: var(--space-4);">已认养果树</div>

      <div id="treeList"></div>
    </div>

    <div class="cam-overlay" id="camOverlay" onclick="closeCameraSetting()">
      <div class="cam-panel" onclick="event.stopPropagation()">
        <div class="cam-title">开放果树实景</div>
        <div class="cam-stage" id="camStage">
          <span class="cam-stage-icon" id="camPlaceholder">📷</span>
          <video id="camVideo" autoplay playsinline muted style="display:none;"></video>
        </div>
        <div class="cam-tip" id="camTip">正在请求摄像头权限…</div>
        <div class="cam-actions">
          <button class="order-btn secondary" type="button" onclick="closeCameraSetting()">取消</button>
          <button class="order-btn primary" type="button" onclick="openCameraSetting()">开启摄像头</button>
        </div>
      </div>
    </div>

    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_ai_assistant.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
        <span>AI</span>
      </div>
      <div class="tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M12 8v4"/>
          <path d="M12 16h.01"/>
        </svg>
        <span>认养</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <script>
    function goBack() {
      window.history.back();
    }

    function navigateTo(page) {
      window.location.href = page;
    }

    function refreshData() {
      renderStats();
      renderOrders();
      renderTrees();
    }

    // 认养设置功能
    function openCertSetting() {
      window.location.href = 'mb_adoption_cert.html';
    }

    function openHarvestConfirm() {
      window.location.href = 'mb_adoption_harvest.html';
    }

    function openTagging() {
      window.location.href = 'mb_adoption_tagging.html';
    }

    function openFarmingBind() {
      window.location.href = 'mb_adoption_farming.html';
    }

    // 开放果树实景：调用摄像头做权限引导，不再跳转到认养浏览页
    var camStream = null;

    function openCameraSetting() {
      var overlay = document.getElementById('camOverlay');
      var video = document.getElementById('camVideo');
      var placeholder = document.getElementById('camPlaceholder');
      var tip = document.getElementById('camTip');
      overlay.classList.add('show');

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        video.style.display = 'none';
        placeholder.style.display = 'block';
        tip.textContent = '当前环境无法调用摄像头，请在设备“设置 - 应用权限”中开启摄像头权限后重试。';
        return;
      }
      tip.textContent = '正在请求摄像头权限…';
      navigator.mediaDevices.getUserMedia({ video: true }).then(function (stream) {
        if (camStream) { camStream.getTracks().forEach(function (t) { t.stop(); }); }
        camStream = stream;
        video.srcObject = stream;
        video.style.display = 'block';
        placeholder.style.display = 'none';
        tip.textContent = '摄像头已开启，实景画面预览中。';
      }).catch(function () {
        video.style.display = 'none';
        placeholder.style.display = 'block';
        tip.textContent = '摄像头权限未开启。请允许浏览器访问摄像头后，点击“开启摄像头”重试。';
      });
    }

    function closeCameraSetting() {
      if (camStream) {
        camStream.getTracks().forEach(function (t) { t.stop(); });
        camStream = null;
      }
      var video = document.getElementById('camVideo');
      video.srcObject = null;
      video.style.display = 'none';
      document.getElementById('camPlaceholder').style.display = 'block';
      document.getElementById('camOverlay').classList.remove('show');
    }

    /* ============================================================
     * 认养业务数据（严格空库：全部来自 sf_adoption_tree / sf_adoption_order /
     * sf_adoption_harvest，库中无数据时显示空态与 --）
     * ============================================================ */
    var MD = window.MobileData;

    var ORDER_STATUS = {
      pending:   { text: '待确认', cls: 'pending' },
      paid:      { text: '已支付', cls: 'confirmed' },
      done:      { text: '已完成', cls: 'completed' },
      refunded:  { text: '已退款', cls: 'refunded' },
      cancelled: { text: '已取消', cls: 'cancelled' }
    };

    var ICON_INFO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
      '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/>' +
      '<line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
    var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
      '<polyline points="20 6 9 17 4 12"/></svg>';

    function treeById(id) {
      var trees = MD.list('adoption_tree');
      for (var i = 0; i < trees.length; i++) {
        if (String(trees[i].id) === String(id)) return trees[i];
      }
      return null;
    }

    function money(v) {
      var n = MD.num(v);
      return n == null ? '--' : '¥' + n.toFixed(2).replace(/\.00$/, '');
    }

    function periodText(o) {
      var s = MD.dateText(o.start_date);
      var e = MD.dateText(o.end_date);
      var term = o.term || (o.duration != null && o.duration !== '' ? o.duration + '年' : '');
      if (s && e) return (term ? term + '（' : '') + s + ' 至 ' + e + (term ? '）' : '');
      return term || '--';
    }

    function detailRow(label, value) {
      return '<div class="detail-row">' +
        '<span class="detail-label">' + label + '</span>' +
        '<span class="detail-value">' + MD.esc(value == null || value === '' ? '--' : value) + '</span>' +
      '</div>';
    }

    function buildOrderCard(o) {
      var st = ORDER_STATUS[o.order_status] || { text: o.order_status || '--', cls: '' };
      var tree = o.tree_id ? treeById(o.tree_id) : null;
      var treeLabel = o.tree_code || (tree ? tree.tree_code : '') || '--';
      if (tree) {
        var vn = tree.variety_name || tree.variety;
        if (vn) treeLabel += ' · ' + vn;
      }
      var contact = o.adopter || '--';
      if (o.adopter_phone) contact += '（' + o.adopter_phone + '）';

      var baseName = '';
      if (o.base_id) {
        var bases = MD.list('base');
        for (var i = 0; i < bases.length; i++) {
          if (String(bases[i].id) === String(o.base_id)) { baseName = bases[i].name || ''; break; }
        }
      }
      if (!baseName) baseName = o.plot_name || '--';

      var actions = '<button class="order-btn secondary" onclick="viewOrderDetail(\'' +
        MD.esc(o.order_code || o.id) + '\')">' + ICON_INFO + '查看详情</button>';
      if (o.order_status === 'pending') {
        actions += '<button class="order-btn primary" onclick="confirmOrder(' + o.id + ')">' +
          ICON_CHECK + '确认订单</button>';
      } else if (o.order_status === 'paid') {
        actions += '<button class="order-btn primary" onclick="completeOrder(' + o.id + ')">' +
          ICON_CHECK + '完成订单</button>';
      }

      return '<div class="order-card" data-status="' + MD.esc(o.order_status || '') +
          '" data-order="' + MD.esc(o.order_code || '') + '">' +
        '<div class="order-header">' +
          '<div class="order-info">' +
            '<div class="order-id">订单号：' + MD.esc(o.order_code || '--') + '</div>' +
            '<div class="order-user">认养人：' + MD.esc(contact) + '</div>' +
            '<div class="order-time">下单时间：' + MD.esc(MD.dateTimeText(o.order_time) || '--') + '</div>' +
          '</div>' +
          '<span class="order-status ' + st.cls + '">' + MD.esc(st.text) + '</span>' +
        '</div>' +
        '<div class="order-detail">' +
          detailRow('认养果树', treeLabel) +
          detailRow('认养周期', periodText(o)) +
          detailRow('认养金额', money(o.amount)) +
          detailRow('认养基地', baseName) +
        '</div>' +
        '<div class="order-actions">' + actions + '</div>' +
      '</div>';
    }

    function buildTreeCard(t) {
      var code = t.tree_code || '';
      var name = t.tree_name || ((t.variety_name || t.variety || '苹果树') + ' #' + code);
      var meta = '品种：' + (t.variety_name || t.variety || '--') +
        (t.tree_age != null ? ' · 树龄' + t.tree_age + '年' : '') +
        (t.plot_name ? ' · ' + t.plot_name : '');
      var s = MD.dateText(t.start_date);
      var e = MD.dateText(t.expire_time);
      var adopter = '认养人：' + (t.adopter || '--') +
        ((s || e) ? '（' + (s || '--') + ' 至 ' + (e || '--') + '）' : '');
      var tagBadge = t.tag_code
        ? '<span class="status-badge active">已挂牌</span>'
        : '<span class="status-badge pending">未挂牌</span>';
      var sceneBadge = (t.open_scene === 1 || t.open_scene === '1')
        ? '<span class="status-badge active">实景开放</span>'
        : '<span class="status-badge pending">实景未开放</span>';

      return '<div class="tree-card">' +
        '<div class="tree-header">' +
          '<div class="tree-photo">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:32px;height:32px;color:var(--primary);">' +
              '<path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>' +
            '</svg>' +
          '</div>' +
          '<div class="tree-info">' +
            '<div class="tree-name">' + MD.esc(name) + '</div>' +
            '<div class="tree-variety">' + MD.esc(meta) + '</div>' +
            '<div class="tree-adopter">' + MD.esc(adopter) + '</div>' +
            '<div class="tree-status-row">' + tagBadge + sceneBadge + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="tree-actions">' +
          '<div class="tree-btn" onclick="editCert(' + t.id + ')">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
              '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
            '</svg>编辑证书</div>' +
          '<div class="tree-btn" onclick="bindFarming(' + t.id + ')">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
              '<rect x="3" y="4" width="18" height="18" rx="2"/>' +
              '<line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>' +
            '</svg>绑定农事</div>' +
          '<div class="tree-btn" onclick="toggleCamera(' + t.id + ')">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
              '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>' +
              '<circle cx="12" cy="13" r="4"/>' +
            '</svg>实景设置</div>' +
        '</div>' +
      '</div>';
    }

    function setStat(id, value) {
      var el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function renderStats() {
      if (!MD.isLoaded()) {
        setStat('statTrees', '--');
        setStat('statPending', '--');
        setStat('statPaid', '--');
        setStat('statHarvest', '--');
        return;
      }
      var trees = MD.list('adoption_tree');
      var orders = MD.list('adoption_order');
      var harvests = MD.list('adoption_harvest');
      var adopted = 0, pending = 0, paid = 0, harvesting = 0;
      trees.forEach(function (t) { if (t.status === 'adopted') adopted++; });
      orders.forEach(function (o) {
        if (o.order_status === 'pending') pending++;
        if (o.order_status === 'paid') paid++;
      });
      harvests.forEach(function (h) { if (h.status === 'pending') harvesting++; });
      setStat('statTrees', trees.length ? adopted : '--');
      setStat('statPending', orders.length ? pending : '--');
      setStat('statPaid', orders.length ? paid : '--');
      setStat('statHarvest', harvests.length ? harvesting : '--');
    }

    function currentFilter() {
      var tab = document.querySelector('.filter-tab.active');
      return tab ? tab.dataset.filter : 'all';
    }

    function renderOrders() {
      var listEl = document.getElementById('orderList');
      if (!listEl) return;
      var filter = currentFilter();
      var all = MD.list('adoption_order').slice();
      all.sort(function (a, b) {
        return String(b.order_time || '').localeCompare(String(a.order_time || ''));
      });
      var shown = all.filter(function (o) {
        return filter === 'all' || o.order_status === filter;
      });
      listEl.innerHTML = shown.length
        ? shown.map(buildOrderCard).join('')
        : MD.inlineEmpty('暂无认养订单');
      var result = document.getElementById('orderResult');
      if (result) result.textContent = '共 ' + shown.length + ' 条订单';
    }

    function renderTrees() {
      var box = document.getElementById('treeList');
      if (!box) return;
      var trees = MD.list('adoption_tree').filter(function (t) {
        return t.status === 'adopted' || !!t.adopter;
      });
      box.innerHTML = trees.length
        ? trees.map(buildTreeCard).join('')
        : MD.inlineEmpty('暂无已认养果树');
    }

    function filterOrders(type) {
      document.querySelectorAll('.filter-tab').forEach(function (tab) {
        tab.classList.toggle('active', tab.dataset.filter === type);
      });
      renderOrders();
    }

    document.addEventListener('DOMContentLoaded', function () {
      refreshData();
      if (MD && typeof MD.subscribe === 'function') MD.subscribe(refreshData);
      MD.ready.then(refreshData);
    });

    function viewOrderDetail(orderCode) {
      window.location.href = 'mb_adoption_detail.html?orderId=' + encodeURIComponent(orderCode);
    }

    /* 订单状态流转：真实写库（PUT /api/adoption_order/:id） */
    function updateOrderStatus(id, status, okMsg) {
      if (!(window.Api && typeof window.Api.update === 'function')) {
        MobileStore.toast('数据接口不可用，请稍后重试', 'error');
        return;
      }
      Api.update('adoption_order', id, { order_status: status }).then(function (res) {
        if (res && res.ok) {
          MobileStore.toast(okMsg, 'success');
          MD.reload('adoption_order').then(refreshData);
        } else {
          MobileStore.toast((res && res.message) || '操作失败', 'error');
        }
      }).catch(function () {
        MobileStore.toast('操作失败，请检查网络', 'error');
      });
    }

    function confirmOrder(id) { updateOrderStatus(id, 'paid', '订单已确认'); }

    function completeOrder(id) { updateOrderStatus(id, 'done', '订单已完成'); }

    // 已认养果树功能
    function editCert(treeId) {
      window.location.href = 'mb_adoption_cert.html?treeId=' + encodeURIComponent(treeId);
    }

    function bindFarming(treeId) {
      window.location.href = 'mb_adoption_farming.html?treeId=' + encodeURIComponent(treeId);
    }

    function toggleCamera(treeId) {
      window.location.href = 'mb_adoption_browse.html?treeId=' + encodeURIComponent(treeId);
    }
  </script>
</body>
</html>
