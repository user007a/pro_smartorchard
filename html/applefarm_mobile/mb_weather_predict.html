<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 气象预测</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <style>
    /* 基础重置 - 继承设计系统 */
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 66px; }

    .content { padding: var(--space-4); }

    /* 今日天气卡片 */
    .today-card { background: linear-gradient(135deg, var(--info), #2980b9); border-radius: var(--radius-xl); padding: var(--space-6) var(--space-5); margin-bottom: var(--space-4); color: var(--bg-white); box-shadow: var(--shadow-md); }
    .today-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-5); }
    .today-location { font-size: var(--font-base); opacity: 0.9; display: flex; align-items: center; gap: var(--space-2); }
    .today-date { font-size: var(--font-sm); opacity: 0.8; }
    .today-main { display: flex; align-items: center; justify-content: center; gap: var(--space-5); padding: var(--space-3) 0; }
    .today-icon { font-size: 64px; }
    .today-temp { font-size: 56px; font-weight: 300; }
    .today-info { margin-top: var(--space-4); display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); }
    .today-info-item { background: rgba(255,255,255,0.2); border-radius: var(--radius-md); padding: var(--space-3) var(--space-2); text-align: center; }
    .today-info-label { font-size: var(--font-xs); opacity: 0.8; margin-bottom: var(--space-1); }
    .today-info-value { font-size: var(--font-base); font-weight: 600; }

    /* 天气预报列表 */
    .forecast-title { font-size: var(--font-base); font-weight: 600; color: var(--text); margin-bottom: var(--space-3); display: flex; align-items: center; gap: var(--space-2); }
    .forecast-list { background: var(--bg-white); border-radius: var(--radius-xl); overflow: hidden; box-shadow: var(--shadow-md); border: 1px solid var(--border); }
    .forecast-item { padding: var(--space-4); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--space-3); }
    .forecast-item:last-child { border-bottom: none; }
    .forecast-day { width: 50px; text-align: center; }
    .forecast-day-name { font-size: var(--font-sm); font-weight: 600; color: var(--text); }
    .forecast-day-date { font-size: var(--font-xs); color: var(--text-light); margin-top: var(--space-1); }
    .forecast-icon { font-size: 32px; margin: 0 var(--space-3); }
    .forecast-temp { flex: 1; display: flex; justify-content: space-between; font-size: var(--font-base); }
    .forecast-high { font-weight: 600; color: var(--text); }
    .forecast-low { color: var(--text-light); }
    .forecast-rain { font-size: var(--font-sm); color: var(--info); background: var(--info-bg); padding: var(--space-1) var(--space-2); border-radius: var(--radius-md); }

    /* 种植提醒卡片 */
    .tips-card { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-4); margin-top: var(--space-4); box-shadow: var(--shadow-md); border: 1px solid var(--border); }
    .tips-title { font-size: var(--font-base); font-weight: 600; color: var(--text); margin-bottom: var(--space-3); display: flex; align-items: center; gap: var(--space-2); }
    .tips-icon { font-size: var(--font-md); }
    .tips-item { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--border-light); }
    .tips-item:last-child { border-bottom: none; }
    .tips-dot { width: 6px; height: 6px; background: var(--warning); border-radius: 50%; margin-top: var(--space-2); flex-shrink: 0; }
    .tips-text { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.5; }
  </style>
</head>
<body>
  <div class="app">
    <div class="page-header">
      <div class="header-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div style="padding-left: 44px;">
        <div class="header-title">气象预测</div>
        <div class="header-sub">未来天气趋势分析</div>
      </div>
    </div>
    
    <div class="content">
      <div class="today-card">
        <div class="today-header">
          <div class="today-location">
            <span>📍</span>
            <span id="weatherLocation">--</span>
          </div>
          <div class="today-date" id="todayDate">--</div>
        </div>
        <div class="today-main">
          <div class="today-icon" data-mf="weather.lists.forecast.0.icon">--</div>
          <div class="today-temp" data-mf="weather.kpi.0.value" data-mf-suffix="°">--</div>
        </div>
        <div class="today-info">
          <div class="today-info-item">
            <div class="today-info-label">湿度</div>
            <div class="today-info-value" data-mf="weather.kpi.1.value" data-mf-suffix="%">--</div>
          </div>
          <div class="today-info-item">
            <div class="today-info-label">风速</div>
            <div class="today-info-value" data-mf="weather.kpi.2.trend.text">--</div>
          </div>
          <div class="today-info-item">
            <div class="today-info-label">紫外线</div>
            <div class="today-info-value" id="weatherUv">--</div>
          </div>
        </div>
      </div>

      <div class="forecast-title">📅 未来3天预报</div>
      <div class="forecast-list" id="forecastList"></div>

      <div class="tips-card">
        <div class="tips-title">
          <span class="tips-icon">🍎</span>
          <span>苹果种植提醒</span>
        </div>
        <div id="weatherTips"></div>
      </div>
    </div>
    
    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_ai_assistant.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
        <span>AI</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </div>
  </div>
  
  <script src="../applefarm_backhand/js/shared/model-store.js"></script>
  <script src="../applefarm_backhand/js/shared/model-bind.js"></script>
  <script src="js/mobile-data.js"></script>
  <script>
    function navigateTo(page) { window.location.href = page; }
    function goBack() { window.history.back(); }

    var MD = window.MobileData;

    function esc(s) {
      return MD ? MD.esc(s) : String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // 动态计算今日与未来3天的「月日」与「星期」，避免硬编码过期
    (function () {
      var WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      function fmt(d) { return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
      var now = new Date();
      var dateEl = document.getElementById('todayDate');
      if (dateEl) dateEl.textContent = fmt(now) + ' ' + WEEK[now.getDay()];
    })();

    /* ============================================================
     * 气象页数据绑定（严格空库）
     * 数据源：ModelStore 气象模型（后台「模型中心 › 气象模型」维护，落库 sf_model_config）
     *   预报   → weather.lists.forecast[]
     *   指标   → weather.kpi[]
     *   提醒   → weather.lists.extremeWarnings[] / weather.lists.riskProbability[]
     * 库中无气象模型数据时显示空态，不回落任何演示文案。
     * ============================================================ */
    function renderWeather() {
      var W = null;
      try { W = window.ModelStore ? ModelStore.get('weather') : null; } catch (e) { W = null; }

      /* 位置：取当前用户所属基地 */
      var loc = document.getElementById('weatherLocation');
      if (loc) loc.textContent = (MD && MD.baseName()) || '--';

      /* 紫外线：取气象模型 index 列表中「紫外线」项 */
      var uv = document.getElementById('weatherUv');
      if (uv) {
        var uvVal = '';
        if (W && W.lists && Array.isArray(W.lists.indexes)) {
          W.lists.indexes.forEach(function (i) {
            if (String(i.name || '').indexOf('紫外') >= 0) uvVal = i.value;
          });
        }
        uv.textContent = uvVal || '--';
      }

      /* 未来3天预报 */
      var box = document.getElementById('forecastList');
      if (box) {
        var forecast = (W && W.lists && Array.isArray(W.lists.forecast)) ? W.lists.forecast : [];
        var days = forecast.slice(0, 3);
        if (!days.length) {
          box.innerHTML = '<div class="mb-list-empty">暂无天气预报数据</div>';
        } else {
          var WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
          var names = ['明天', '后天', '大后天'];
          box.innerHTML = days.map(function (d, i) {
            var dateText = '';
            if (d.date) {
              var parsed = new Date(String(d.date).replace(/-/g, '/'));
              if (!isNaN(parsed.getTime())) {
                dateText = (parsed.getMonth() + 1) + '月' + parsed.getDate() + '日';
              } else dateText = String(d.date);
            }
            var rain = d.rain != null ? d.rain : (d.rainProbability != null ? d.rainProbability : null);
            var rainTxt = rain == null ? '--' : (String(rain).indexOf('%') >= 0 ? rain : rain + '%');
            return '<div class="forecast-item">' +
              '<div class="forecast-day">' +
                '<div class="forecast-day-name">' + esc(names[i] || d.name || '') + '</div>' +
                '<div class="forecast-day-date">' + esc(dateText) + '</div>' +
              '</div>' +
              '<div class="forecast-icon">' + esc(d.icon || '--') + '</div>' +
              '<div class="forecast-temp">' +
                '<span class="forecast-high">' + esc(d.high == null ? '--' : d.high) + '</span>' +
                '<span class="forecast-low" data-mf-prefix="/ ">' + esc(d.low == null ? '--' : d.low) + '</span>' +
              '</div>' +
              '<div class="forecast-rain">' + esc(rainTxt) + '</div>' +
            '</div>';
          }).join('');
        }
      }

      /* 种植提醒：取气象模型预警 / 风险概率列表 */
      var tips = document.getElementById('weatherTips');
      if (tips) {
        var items = [];
        if (W && W.lists && Array.isArray(W.lists.extremeWarnings)) {
          W.lists.extremeWarnings.forEach(function (w) {
            items.push(w.name + (w.time ? '（' + w.time + '）' : '') + (w.desc ? '：' + w.desc : ''));
          });
        }
        if (W && W.lists && Array.isArray(W.lists.riskProbability)) {
          W.lists.riskProbability.forEach(function (r) {
            items.push(r.name + ' ' + r.value + '（' + (r.percent != null ? r.percent + '%' : '--') + '）');
          });
        }
        tips.innerHTML = items.length
          ? items.map(function (t) {
              return '<div class="tips-item"><div class="tips-dot"></div><div class="tips-text">' + esc(t) + '</div></div>';
            }).join('')
          : '<div class="mb-list-empty">暂无气象提醒</div>';
      }
    }

    renderWeather();
    if (window.ModelStore && ModelStore.subscribe) {
      ModelStore.subscribe(renderWeather);
    }
    if (MD) MD.subscribe(renderWeather);
  </script>
</body>
</html>
