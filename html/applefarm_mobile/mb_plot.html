<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 地块管理</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <!-- 共享数据层 -->
  <script src="js/mobile-store.js"></script>
  <script src="js/mobile-data.js"></script>
  <script src="../applefarm_backhand/js/shared/model-store.js"></script>
  <style>
    /* Stats Bar */
    .stats-bar {
      display: flex; gap: 12px;
      padding: 0 16px; margin-top: -20px;
      position: relative; z-index: 10;
    }
    
    .stat-card {
      flex: 1;
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: 16px 12px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
    }
    
    .stat-num {
      font-size: var(--font-2xl); font-weight: 800;
      color: var(--primary);
    }
    
    .stat-label {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-top: 4px;
    }
    
    /* Filter Bar */
    .filter-bar {
      display: flex; gap: 8px;
      padding: 16px;
    }
    
    .filter-btn {
      flex: 1;
      height: 36px;
      padding: 0 12px;
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: var(--font-sm);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--bg-white);
    }
    
    /* Plot Card */
    .plot-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      margin: 0 16px 12px;
      padding: 16px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }
    
    .plot-card:active {
      transform: scale(0.99);
      box-shadow: var(--shadow-xs);
    }
    
    .plot-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .plot-name {
      font-size: var(--font-lg);
      font-weight: 600;
      color: var(--text);
    }
    
    .plot-status {
      font-size: var(--font-xs);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-weight: 500;
    }
    
    .plot-status.normal {
      background: var(--success-bg);
      color: var(--success);
    }
    
    .plot-status.warning {
      background: var(--warning-bg);
      color: var(--warning);
      animation: pulse 2s infinite;
    }
    
    .plot-status.overdue {
      background: var(--error-bg);
      color: var(--error);
    }

    /* 新绘制地块标识 */
    .plot-status.drawn {
      background: var(--info-bg);
      color: var(--info);
    }

    /* 空态提示 */
    .drawn-empty {
      margin: 0 16px 12px;
      padding: 16px;
      border: 1px dashed var(--border);
      border-radius: var(--radius-xl);
      text-align: center;
      color: var(--text-secondary);
      font-size: var(--font-sm);
      background: var(--bg-white);
    }

    .drawn-empty-link {
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
    }
    
    .plot-info {
      display: flex; gap: 16px;
      font-size: var(--font-sm);
      color: var(--text-secondary);
      flex-wrap: wrap;
    }
    
    .plot-info-item {
      display: flex; align-items: center; gap: 5px;
    }
    
    .plot-info-item svg {
      width: 15px; height: 15px;
      flex-shrink: 0;
    }
    
    .plot-tasks {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border-light);
    }
    
    .plot-tasks-title {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    
    .plot-tasks-title::before {
      content: '';
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--primary);
    }
    
    .task-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0;
    }
    
    .task-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    
    .task-dot.pending { background: var(--warning); }
    .task-dot.completed { background: var(--success); }
    .task-dot.overdue { background: var(--error); animation: pulse 2s infinite; }
    
    .task-name {
      flex: 1;
      font-size: var(--font-sm);
      color: var(--text);
    }
    
    .task-status {
      font-size: var(--font-xs);
      padding: 2px 8px;
      border-radius: var(--radius-md);
      font-weight: 500;
    }
    
    .task-status.pending { background: var(--warning-bg); color: var(--warning); }
    .task-status.completed { background: var(--success-bg); color: var(--success); }
    .task-status.overdue { background: var(--error-bg); color: var(--error); }
    
    /* Quick Actions */
    .quick-actions {
      display: flex; gap: 12px;
      padding: 0 16px 16px;
    }
    
    .quick-action {
      flex: 1;
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .quick-action:active {
      transform: scale(0.96);
    }
    
    .quick-icon {
      width: 44px; height: 44px;
      border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: center;
    }
    
    .quick-icon svg { width: 22px; height: 22px; }
    .quick-icon.green { background: var(--primary-light); color: var(--primary); }
    .quick-icon.blue { background: var(--info-bg); color: var(--info); }
    .quick-icon.orange { background: var(--warning-bg); color: var(--warning); }
    
    .quick-name {
      font-size: var(--font-sm);
      color: var(--text);
      font-weight: 500;
    }
    
    /* Detail Modal */
    .detail-modal {
      width: 100%;
      max-width: 750px;
      height: 100%;
      background: var(--bg);
      overflow-y: auto;
    }
    
    .detail-header {
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
      padding: 44px 16px 20px;
      color: var(--bg-white);
      position: sticky; top: 0; z-index: 10;
    }
    
    .detail-header-content {
      display: flex; align-items: center; gap: 12px;
    }
    
    .detail-back {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    
    .detail-back svg { width: 18px; height: 18px; }
    
    .detail-title-wrap { flex: 1; }
    .detail-title { font-size: var(--font-xl); font-weight: 700; }
    .detail-sub { font-size: var(--font-sm); opacity: 0.85; margin-top: 4px; }
    
    .detail-content { padding: 16px; }
    
    .detail-section {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    
    .detail-section-title {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    
    .detail-section-title::before {
      content: '';
      width: 4px; height: 16px;
      background: var(--primary);
      border-radius: 2px;
    }
    
    .detail-info-row {
      display: flex;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    
    .detail-info-row:last-child { border-bottom: none; }
    
    .detail-info-label {
      width: 80px;
      font-size: var(--font-sm);
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    
    .detail-info-value {
      flex: 1;
      font-size: var(--font-sm);
      color: var(--text);
    }
    
    .today-task-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    
    .today-task-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    
    .today-task-name {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
    }
    
    .today-task-time {
      font-size: var(--font-xs);
      color: var(--text-light);
      background: var(--gray-100);
      padding: 4px 10px;
      border-radius: var(--radius-md);
    }
    
    .today-task-desc {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      line-height: 1.6;
    }
    
    .btn-record {
      width: 100%;
      height: 44px;
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: var(--bg-white);
      border: none;
      border-radius: var(--radius-full);
      font-size: var(--font-base);
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: all var(--transition-fast);
    }
    
    .btn-record:active { transform: scale(0.98); }
  </style>
</head>

  <script>
    /* ============================================================
     * 地块页数据绑定（严格空库 · 全部取自数据库）
     * ------------------------------------------------------------
     * 地块列表  → sf_plot（+ sf_base / sf_farming_task）
     * 统计条    → sf_plot 数量与面积、sf_farming_task 今日任务数
     * 详情      → sf_plot + sf_farming_task + sf_farming_record
     * ============================================================ */
    function navigateTo(page) { window.location.href = page; }

    var MD = window.MobileData;
    var PLOT_TYPE_LABELS = { apple: '苹果园', peach: '桃园', grape: '葡萄园', other: '其他' };

    function esc(s) {
      return MD ? MD.esc(s) : String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* ---------- 数据读取 ---------- */
    function allPlots() {
      return MD ? MD.list('plot') : [];
    }

    function baseNameOf(id) {
      var bases = MD ? MD.list('base') : [];
      for (var i = 0; i < bases.length; i++) {
        if (String(bases[i].id) === String(id)) return bases[i].name || '';
      }
      return '';
    }

    /** 某地块的任务（按 plot_ids / plot_name 匹配） */
    function tasksOfPlot(plot) {
      var tasks = MD ? MD.list('farming_task') : [];
      return tasks.filter(function (t) {
        var ids = String(t.plot_ids || '');
        var name = String(t.plot_name || '');
        if (ids && ids.indexOf(plot.code) >= 0) return true;
        if (name && name === plot.name) return true;
        return false;
      });
    }

    function isOverdue(t) {
      if (t.status === 'overdue') return true;
      if (!t.deadline) return false;
      if (['completed', 'cancelled', 'rejected'].indexOf(t.status) >= 0) return false;
      return t.deadline < (MD ? MD.today() : '');
    }

    function taskStatusCls(t) {
      if (t.status === 'completed') return 'completed';
      if (isOverdue(t)) return 'overdue';
      if (t.status === 'executing' || t.status === 'processing') return 'executing';
      return 'pending';
    }

    function taskStatusText(t) {
      if (t.status === 'completed') return '已完成';
      if (isOverdue(t)) return '已逾期';
      if (t.status === 'executing' || t.status === 'processing') return '进行中';
      return '待执行';
    }

    /* ---------- 统计条 ---------- */
    function updateStats() {
      if (!MD) return;
      var plots = allPlots();
      var today = MD.today();
      var tasks = MD.list('farming_task');
      var todayTasks = tasks.filter(function (t) {
        var d = String(t.plan_time || '').slice(0, 10);
        return d === today && ['completed', 'cancelled', 'rejected'].indexOf(t.status) < 0;
      });
      var area = plots.reduce(function (s, p) { return s + (parseFloat(p.area) || 0); }, 0);

      var elTotal = document.getElementById('plotStatTotal');
      var elTasks = document.getElementById('plotStatTasks');
      var elArea = document.getElementById('plotStatArea');
      if (elTotal) elTotal.textContent = plots.length;
      if (elTasks) elTasks.textContent = todayTasks.length;
      if (elArea) elArea.textContent = Math.round(area * 10) / 10;
    }

    /* ---------- 地块列表 ---------- */
    function renderPlots() {
      var wrap = document.getElementById('plotListWrap');
      if (!wrap || !MD) return;
      var plots = allPlots();
      if (!plots.length) {
        wrap.innerHTML = MD.empty('暂无地块数据', '数据库中尚未维护地块，可点击下方「画地块」新建') +
          '<div style="text-align:center;margin-bottom:var(--space-4);">' +
          '<span class="drawn-empty-link" onclick="navigateToDraw()">去画地块 ›</span></div>';
        return;
      }
      wrap.innerHTML = plots.map(function (p) {
        var pTasks = tasksOfPlot(p);
        var pending = pTasks.filter(function (t) { return t.status === 'pending'; }).length;
        var overdue = pTasks.filter(isOverdue).length;
        var statusCls = p.plot_status === 'warning' ? 'warning' : (p.plot_status === 'danger' ? 'danger' : 'normal');
        var statusText = { normal: '正常', warning: '预警', danger: '异常', fallow: '休耕', maintain: '维护中' }[p.plot_status] || '正常';
        var areaText = (p.area != null && p.area !== '') ? (p.area + '亩') : '面积待测';
        var variety = p.variety_code || '';
        var age = p.plant_year ? (new Date().getFullYear() - parseInt(p.plant_year, 10)) + '年' : '';

        var taskHtml = pTasks.length
          ? '<div class="plot-tasks-title">今日任务 (' + pTasks.length + ')</div>' +
            pTasks.map(function (t) {
              var cls = taskStatusCls(t);
              return '<div class="task-row">' +
                '<span class="task-dot ' + cls + '"></span>' +
                '<span class="task-name">' + esc(t.task_name) + '</span>' +
                '<span class="task-status ' + cls + '">' + taskStatusText(t) + '</span>' +
              '</div>';
            }).join('')
          : '<div class="plot-tasks-title">今日任务 (0)</div>' +
            '<div style="text-align: center; padding: 8px; color: var(--text-light); font-size: var(--font-sm);">暂无任务</div>';

        return '<div class="plot-card" onclick="openPlotDetail(\'' + esc(p.code) + '\')">' +
          '<div class="plot-header">' +
            '<div class="plot-name">' + esc(p.name) + '</div>' +
            '<span class="plot-status ' + statusCls + '">' + statusText + '</span>' +
          '</div>' +
          '<div class="plot-info">' +
            '<div class="plot-info-item">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 20h5v-2a3 3 0 0 0-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 0 1 5.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 0 1 9.288 0M15 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm6 3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM7 10a3 3 0 1 1-4 0 3 3 0 0 1 4 0z"/></svg>' +
              '<span>' + esc(variety || PLOT_TYPE_LABELS[p.plot_type] || '未标注品种') + (age ? ' · ' + age : '') + '</span>' +
            '</div>' +
            '<div class="plot-info-item">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="15" x2="15" y2="15"/></svg>' +
              '<span>' + esc(areaText) + '</span>' +
            '</div>' +
            '<div class="plot-info-item">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
              '<span>' + esc(baseNameOf(p.base_id) || '未分配基地') + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="plot-tasks">' + taskHtml + '</div>' +
        '</div>';
      }).join('');

      applyFilter(currentFilter);
    }

    /* ---------- 筛选 ---------- */
    var currentFilter = 'all';

    function filterPlots(type, el) {
      document.querySelectorAll('.filter-btn').forEach(function (btn) { btn.classList.remove('active'); });
      if (el) el.classList.add('active');
      currentFilter = type;
      applyFilter(type);
    }

    function applyFilter(type) {
      var cards = document.querySelectorAll('#plotListWrap .plot-card');
      cards.forEach(function (card) {
        card.style.display = 'block';
        if (type === 'pending') {
          if (!card.querySelector('.task-dot.pending')) card.style.display = 'none';
        } else if (type === 'overdue') {
          if (!card.querySelector('.task-dot.overdue')) card.style.display = 'none';
        }
      });
    }

    /* ---------- 物候期 ---------- */
    function phenoText() {
      try {
        var s = window.ModelStore ? ModelStore.phenologySnapshot() : null;
        return s && s.currentStage ? s.currentStage : '--';
      } catch (e) { return '--'; }
    }

    /* ---------- 详情弹窗 ---------- */
    function openPlotDetail(code) {
      if (!MD) return;
      var plot = null;
      allPlots().forEach(function (p) {
        if (String(p.code) === String(code) || String(p.name) === String(code)) plot = p;
      });
      if (!plot) {
        document.getElementById('detailTitle').textContent = '地块详情';
        document.getElementById('detailName').textContent = '--';
        document.getElementById('detailModal').classList.add('show');
        return;
      }

      document.getElementById('detailTitle').textContent = plot.name;
      document.getElementById('detailSub').textContent = '查看地块详细信息';
      document.getElementById('detailName').textContent = plot.name;
      document.getElementById('detailCode').textContent = plot.code || '--';
      document.getElementById('detailVariety').textContent = plot.variety_code || PLOT_TYPE_LABELS[plot.plot_type] || '--';
      document.getElementById('detailAge').textContent = plot.plant_year
        ? (new Date().getFullYear() - parseInt(plot.plant_year, 10)) + '年'
        : '--';
      document.getElementById('detailArea').textContent = (plot.area != null && plot.area !== '') ? plot.area + '亩' : '--';
      document.getElementById('detailBase').textContent = baseNameOf(plot.base_id) || '未分配基地';
      document.getElementById('detailPheno').textContent = phenoText();

      /* 今日任务 */
      var pTasks = tasksOfPlot(plot);
      var taskBox = document.getElementById('detailTasks');
      if (taskBox) {
        taskBox.innerHTML = pTasks.length ? pTasks.map(function (t) {
          var cls = taskStatusCls(t);
          return '<div class="today-task-card">' +
            '<div class="today-task-header">' +
              '<div class="today-task-name">' + esc(t.task_name) + '</div>' +
              '<div class="today-task-time">' + esc(MD.dateText(t.plan_time) || '--') + '</div>' +
            '</div>' +
            (t.remark ? '<div class="today-task-desc">' + esc(t.remark) + '</div>' : '') +
            '<div class="today-task-desc">状态：' + taskStatusText(t) + '</div>' +
            '<button class="btn-record" onclick="navigateToRecord()">立即记录</button>' +
          '</div>';
        }).join('') : MD.inlineEmpty('暂无任务');
      }

      /* 历史农事记录 */
      var records = MD.list('farming_record').filter(function (r) {
        return String(r.plot_code || '') === String(plot.code) || String(r.plot_ids || '').indexOf(plot.code) >= 0;
      });
      var recBox = document.getElementById('detailRecords');
      if (recBox) {
        recBox.innerHTML = records.length ? records.map(function (r) {
          var cls = r.status === 'approved' ? 'completed' : 'pending';
          return '<div class="task-row">' +
            '<span class="task-dot ' + cls + '"></span>' +
            '<span class="task-name">' + esc(r.type_name || r.farm_type || '农事') + '</span>' +
            '<span style="font-size: var(--font-xs); color: var(--text-light);">' + esc(MD.dateText(r.execute_date)) + '</span>' +
          '</div>';
        }).join('') : MD.inlineEmpty('暂无农事记录');
      }

      document.getElementById('detailModal').classList.add('show');
    }

    function closeDetail() {
      document.getElementById('detailModal').classList.remove('show');
    }

    function navigateToRecord() { window.location.href = 'mb_record_task.html'; }
    function navigateToPatrol() { window.location.href = 'mb_patrol.html'; }
    function navigateToDraw() { window.location.href = 'mb_draw_plot.html'; }

    /* ---------- 渲染入口 ---------- */
    function renderAll() {
      renderPlots();
      updateStats();
    }

    renderAll();
    if (MD) MD.subscribe(renderAll);
    if (window.MobileStore && MobileStore.subscribe) {
      MobileStore.subscribe(function () { renderAll(); });
    }
    if (window.ModelStore && ModelStore.subscribe) {
      ModelStore.subscribe(function () {
        var el = document.getElementById('detailPheno');
        if (el && document.getElementById('detailModal').classList.contains('show')) el.textContent = phenoText();
      });
    }

    /* 从地图进入时直接定位并打开对应地块详情 */
    (function () {
      var m = location.search.match(/[?&]plot=([^&]+)/);
      if (!m) return;
      var name = decodeURIComponent(m[1]);
      var sub = document.querySelector('.header-sub');
      if (sub) sub.textContent = '已定位：' + name;
      var run = function () { if (typeof openPlotDetail === 'function') openPlotDetail(name); };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
      else run();
    })();
  </script>

</body>
</html>
