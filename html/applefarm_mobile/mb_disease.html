<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 识病虫</title>
  <!-- H5设计系统 v2 — Supabase × Airbnb × Notion 混合设计基因 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <!-- 共享数据层 -->
  <script src="js/mobile-store.js"></script>
  <style>
    /* ========== 页面专属样式（仅保留设计系统未覆盖的部分） ========== */
    
    /* --- 上传区域 --- */
    .upload-area {
      width: 100%;
      height: 200px;
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      cursor: pointer;
      transition: all var(--transition-fast);
      background: var(--bg-white);
    }
    .upload-area:active { background: var(--gray-50); border-color: var(--primary-300); }
    .upload-icon {
      width: 60px;
      height: 60px;
      border-radius: var(--radius-full);
      background: var(--primary-50);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .upload-icon svg { width: 28px; height: 28px; color: var(--primary-700); }
    .upload-text { font-size: var(--font-base); color: var(--text-secondary); }
    .upload-hint { font-size: var(--font-xs); color: var(--text-tertiary); }

    /* --- 上传后预览 --- */
    .upload-area { position: relative; overflow: hidden; }
    .upload-area.has-image {
      padding: 0;
      border-style: solid;
      border-color: var(--primary-300);
    }
    .upload-area.has-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .upload-area .preview-hint {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 8px 12px; text-align: center;
      font-size: var(--font-xs); color: #fff;
      background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.55));
    }
    .result-note { font-size: var(--font-xs); color: var(--text-tertiary); margin-top: var(--space-1); }

    /* --- 识别结果卡片 --- */
    .result-header { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
    .result-icon {
      width: 56px; height: 56px;
      border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .result-icon svg { width: 28px; height: 28px; }
    .result-icon.danger { background: var(--error-light); color: var(--error-dark); }
    .result-icon.warning { background: var(--warning-light); color: var(--warning-dark); }
    .result-icon.success { background: var(--success-light); color: var(--success-dark); }
    .result-info { flex: 1; }
    .result-name { font-size: var(--font-lg); font-weight: var(--font-bold); color: var(--text); }
    .result-confidence { font-size: var(--font-sm); color: var(--text-secondary); margin-top: var(--space-1); }

    /* --- 提示框 --- */
    .tips-box {
      padding: var(--space-4);
      background: var(--info-light);
      border-radius: var(--radius-md);
      border-left: 3px solid var(--info-dark);
      margin-top: var(--space-4);
    }
    .tips-title { font-size: var(--font-base); font-weight: var(--font-semibold); color: var(--info-dark); margin-bottom: var(--space-2); }
    .tips-content { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.7; }

    /* --- 历史记录 --- */
    .history-thumb {
      width: 56px; height: 56px;
      border-radius: var(--radius-md);
      background: var(--gray-50);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .history-thumb svg { width: 24px; height: 24px; color: var(--text-tertiary); }

    /* --- 模态框 --- */
    .mb-modal {
      padding: var(--space-8) var(--space-6);
      width: 90%; max-width: 340px;
      text-align: center;
    }
    .modal-text { font-size: var(--font-md); color: var(--text); margin-top: var(--space-4); }

    /* --- 骨架屏 --- */
    .skeleton-state { display: none; }
    .mb-app.loading .real-content { display: none; }
    .mb-app.loading .skeleton-state { display: block; }
  </style>
</head>
<body>
  <div class="mb-app loading">
    <!-- ===================== 骨架屏 ===================== -->
    <div class="skeleton-state">
      <div class="mb-header-detail">
        <div class="header-nav">
          <div style="width:36px;height:36px;"></div>
          <div class="header-title"></div>
        </div>
      </div>
      <div class="mb-section">
        <div class="mb-skeleton-card">
          <div class="mb-skeleton" style="width:80px;height:16px;margin-bottom:16px;"></div>
          <div class="mb-skeleton-card" style="height:160px;padding:0;margin:0;border:none;box-shadow:none;"></div>
          <div style="height:16px;"></div>
          <div class="mb-skeleton" style="width:100%;height:48px;border-radius:var(--radius-full);"></div>
        </div>
        <div style="height:20px;"></div>
        <div class="mb-skeleton-card">
          <div class="mb-skeleton" style="width:80px;height:16px;margin-bottom:16px;"></div>
          <div class="mb-skeleton-line long"></div>
          <div class="mb-skeleton-line medium"></div>
        </div>
      </div>
    </div>

    <!-- ===================== 真实内容 ===================== -->
    <div class="real-content">
      <!-- 详情页型 Header -->
      <div class="mb-header-detail">
        <div class="header-nav">
          <div class="header-back" onclick="goBack()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </div>
          <div class="header-title">病虫害识别</div>
          <div class="header-actions">
            <div class="header-action-btn" onclick="navigateTo('mb_pest_risk.html')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="header-content">
          <div class="header-sub">拍照或上传图片，AI智能识别果树病虫害</div>
        </div>
      </div>

      <div class="mb-section">
        <!-- 上传卡片 -->
        <div class="mb-card">
          <div class="mb-section-title"><span class="mb-section-dot"></span>上传图片</div>
          <div class="upload-area" onclick="triggerUpload()">
            <div class="upload-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
            </div>
            <div class="upload-text">点击拍照或上传图片</div>
            <div class="upload-hint">支持 JPG、PNG 格式</div>
          </div>
          <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleUpload(event)">
          <button class="mb-btn mb-btn-primary mb-btn-block" style="margin-top: var(--space-4);" onclick="startIdentify()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
            开始识别
          </button>
        </div>

        <!-- 识别结果 -->
        <div id="resultArea" style="display:none;">
          <div class="mb-card" style="margin-top: var(--space-4);">
            <div class="mb-section-title"><span class="mb-section-dot"></span>识别结果</div>
            <div class="result-header">
              <div class="result-icon danger" id="resultIcon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                  <line x1="12" y1="9" x2="12" y2="13"/>
                  <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
              </div>
              <div class="result-info">
                <div class="result-name" id="resultName">苹果轮纹病</div>
                <div class="result-confidence" id="resultConfidence">置信度：92%</div>
                <div class="result-note" id="resultNote">演示识别 · 依据文件名启发式判断</div>
              </div>
              <span class="mb-tag error mb-tag-lg" id="resultTag">高风险</span>
            </div>
            <div class="tips-box">
              <div class="tips-title">防治建议</div>
              <div class="tips-content" id="resultTips">1. 及时清除病枝病果<br>2. 春季发芽前喷布波尔多液<br>3. 谢花后喷施甲基托布津<br>4. 加强果园排水通风</div>
            </div>
          </div>
        </div>

        <!-- 识别历史 -->
        <div class="mb-card" style="margin-top: var(--space-4);">
          <div class="mb-section-title"><span class="mb-section-dot"></span>识别历史</div>
          <div class="mb-list-item" style="padding: 12px 0; border-bottom: 1px solid var(--border-light);">
            <div class="history-thumb">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
            </div>
            <div class="mb-list-content">
              <div class="mb-list-title">苹果斑点落叶病</div>
              <div class="mb-list-desc">2026-09-20 14:30</div>
            </div>
            <span class="mb-tag warning">中风险</span>
          </div>
          <div class="mb-list-item" style="padding: 12px 0; border-bottom: none;">
            <div class="history-thumb">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
            </div>
            <div class="mb-list-content">
              <div class="mb-list-title">红蜘蛛虫害</div>
              <div class="mb-list-desc">2026-09-18 09:15</div>
            </div>
            <span class="mb-tag error">高风险</span>
          </div>
        </div>
      </div>
    </div><!-- /real-content -->

    <!-- 底部导航 -->
    <div class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>服务</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_ai_assistant.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span>AI</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>地块</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <!-- 识别中模态框 -->
  <div class="mb-modal-overlay" id="loadingModal">
    <div class="mb-modal">
      <div class="mb-skeleton" style="width:48px;height:48px;border-radius:50%;margin:0 auto;"></div>
      <div class="modal-text">正在识别中...</div>
    </div>
  </div>

  <script>
    function navigateTo(page) {
      window.location.href = page;
    }

    function goBack() {
      window.history.back();
    }

    function triggerUpload() {
      document.getElementById('imageInput').click();
    }

    // 已选图片状态
    var uploadedFile = { name: '', dataUrl: '' };

    /* ====================================================================
     * 病害识别规则（T13 接入）
     *
     * 数据源：localStorage['mb_disease_rules']
     *   单条结构（由后台 mb_disease_config.html 维护）：
     *     { id, keyword: [str], disease, risk: 'high'|'medium'|'low',
     *       confidence: Number, prevent: [str], enabled: Boolean }
     *
     * 移动端原先硬编码的 DEMO_RULES 作为本地内置默认值；
     * 一旦后台写入 mb_disease_rules，将以存储内容为准。
     * 为保持移动端独立运行：未读到存储或存储损坏时回退到 DEMO_RULES。
     * ==================================================================== */
    var RISK_META = {
      high:   { risk: '高风险', riskClass: 'error',   icon: 'danger'  },
      medium: { risk: '中风险', riskClass: 'warning', icon: 'warning' },
      low:    { risk: '低风险', riskClass: 'success', icon: 'success' }
    };

    var BUILTIN_RULES = [
      { keys: ['rot', 'fub', '腐烂'],
        disease: '苹果腐烂病', risk: 'high',
        prevent: [
          '及时刮除病斑并涂抹杀菌剂（如戊唑醇）',
          '剪除病枝集中烧毁，减少侵染源',
          '增施有机肥、控制负载，增强树势',
          '冬季清园，树干涂白防冻防病'
        ],
        confidence: 91, enabled: true },
      { keys: ['ring', 'lunwen', '轮纹'],
        disease: '苹果轮纹病', risk: 'high',
        prevent: [
          '及时清除病枝病果',
          '春季发芽前喷布波尔多液',
          '谢花后喷施甲基托布津',
          '加强果园排水通风'
        ],
        confidence: 92, enabled: true },
      { keys: ['spot', 'leaf', '斑点', '落叶'],
        disease: '苹果斑点落叶病', risk: 'medium',
        prevent: [
          '清除落叶与病枝，减少病原',
          '谢花后喷多抗霉素或代森锰锌',
          '生长期视病情间隔 10~15 天连喷 2~3 次',
          '平衡施肥，避免偏施氮肥'
        ],
        confidence: 88, enabled: true },
      { keys: ['red', 'spider', 'mite', 'hongzhizhu', '红蜘蛛'],
        disease: '红蜘蛛虫害', risk: 'high',
        prevent: [
          '冬季刮除粗老树皮、清除越冬螨卵',
          '萌芽前喷石硫合剂或矿物油',
          '发生期喷阿维菌素、螺螨酯，注意轮换',
          '保护捕食螨、草蛉等天敌'
        ],
        confidence: 90, enabled: true },
      { keys: ['aphid', 'ya', '蚜虫'],
        disease: '蚜虫虫害', risk: 'medium',
        prevent: [
          '剪除虫梢，减少虫源',
          '发生期喷吡虫啉、噻虫嗪',
          '保护瓢虫、草蛉等天敌',
          '避免偏施氮肥，防止徒长诱蚜'
        ],
        confidence: 86, enabled: true },
      { keys: ['anthracnose', '炭疽'],
        disease: '苹果炭疽病', risk: 'medium',
        prevent: [
          '清除病果、病枝，集中处理',
          '套袋前喷保护性杀菌剂',
          '生长期喷多菌灵、咪鲜胺等',
          '加强通风透光，降低果园湿度'
        ],
        confidence: 85, enabled: true },
      { keys: ['healthy', 'normal', 'ok', '健康', '正常'],
        disease: '未发现明显病害', risk: 'low',
        prevent: [
          '叶片、果面未见典型病斑',
          '建议保持现有水肥与通风管理',
          '定期巡园，早发现早防治',
          '关注后续天气变化，做好预防'
        ],
        confidence: 94, enabled: true }
    ];

    /**
     * 把后台规则统一转换为移动端内部的 matches 格式（keys/name/risk/riskClass/icon/conf/tips）。
     * 兼容 BUILTIN_RULES 的简写：仅做映射补全。
     */
    function adaptRule(r) {
      var meta = RISK_META[r.risk] || RISK_META.medium;
      return {
        keys: Array.isArray(r.keyword) ? r.keyword : (r.keys || []),
        name: r.disease || r.name || '未知病害',
        risk: meta.risk,
        riskClass: meta.riskClass,
        icon: meta.icon,
        conf: Number(r.confidence || r.conf || 85),
        // 后台传字符串数组 → 渲染为 <ul><li>；原 HTML 富文本（兼容历史）也照常支持
        tips: r.prevent && r.prevent.length
          ? '<ul>' + r.prevent.map(function (p) { return '<li>' + String(p) + '</li>'; }).join('') + '</ul>'
          : (r.tips || '')
      };
    }

    /**
     * 读取后台配置；损坏或缺失时回退到内置 BUILTIN_RULES。
     * 注意：禁用规则（enabled=false）会被剔除，不参与匹配与无命中回退。
     */
    function loadActiveRules() {
      var raw = null;
      try { raw = localStorage.getItem('mb_disease_rules'); } catch (e) { raw = null; }
      if (!raw) return BUILTIN_RULES.slice().filter(function (r) { return r.enabled !== false; }).map(adaptRule);
      try {
        var v = JSON.parse(raw);
        if (!Array.isArray(v)) throw new Error('not array');
        var cleaned = [];
        v.forEach(function (r) {
          if (!r || typeof r !== 'object') return;
          if (r.enabled === false) return;
          cleaned.push(adaptRule(r));
        });
        return cleaned;
      } catch (e) {
        return BUILTIN_RULES.slice().filter(function (r) { return r.enabled !== false; }).map(adaptRule);
      }
    }

    /** 兼容旧引用：保持变量名 DEMO_RULES 可被任何依赖它的代码继续使用 */
    var DEMO_RULES = loadActiveRules();

    /** 后台修改后，重新刷新内部规则表（若后台停用了某规则，立即生效） */
    function refreshDemoRules() {
      DEMO_RULES = loadActiveRules();
    }
    window.addEventListener('storage', function (e) {
      if (e.key === 'mb_disease_rules') refreshDemoRules();
    });

    /* ====================================================================
     * 图像特征分析（L-8）
     * 原实现按「上传文件名」做关键词 / 哈希启发式，属演示占位。现改为直接读取
     * 图片真实像素：把图片缩到 96×96 后统计暗褐斑、深黑、白粉、锈橙、失绿黄化、
     * 健康绿等区域的占比，据此判定症状类别，再匹配后台「识别规则配置」中的病害条目。
     * 规则库仍由后台维护，本页只负责从像素得到特征与症状类别。
     * ==================================================================== */
    var CATEGORY_DEFS = {
      healthy:     { label: '未见明显病斑',   kw: ['健康', '正常', '明显病害'] },
      powdery:     { label: '白色粉状霉层',   kw: ['白粉'] },
      rust:        { label: '橙黄色锈斑',     kw: ['锈'] },
      rot:         { label: '暗褐色腐烂斑块', kw: ['腐烂'] },
      ring:        { label: '同心轮纹病斑',   kw: ['轮纹'] },
      anthracnose: { label: '深褐色凹陷病斑', kw: ['炭疽'] },
      mite:        { label: '细密失绿黄白点', kw: ['红蜘蛛', '螨'] },
      aphid:       { label: '嫩梢密集虫体',   kw: ['蚜虫'] },
      spot:        { label: '褐色斑点 / 落叶', kw: ['斑点', '落叶'] }
    };

    /**
     * 读取图片像素并统计颜色特征占比。
     * 回调参数 f = { green, yellow, brown, dark, white, orange, red, avgLum }（占比 0~1）；
     * 无法读取像素（极端环境 / 非图片）时回传 null，由上层降级处理。
     */
    function analyzePixels(dataUrl, done) {
      var img = new Image();
      img.onload = function () {
        var side = 96;   // 统一缩到 96×96 采样，兼顾速度与代表性
        var canvas = document.createElement('canvas');
        canvas.width = side;
        canvas.height = side;
        var ctx = canvas.getContext('2d');
        var f = { green: 0, yellow: 0, brown: 0, dark: 0, white: 0, orange: 0, red: 0, avgLum: 0 };
        try {
          ctx.drawImage(img, 0, 0, side, side);
          var px = ctx.getImageData(0, 0, side, side).data;
          var n = side * side, lum = 0;
          for (var i = 0; i < px.length; i += 4) {
            var r = px[i], g = px[i + 1], b = px[i + 2];
            var max = Math.max(r, g, b), min = Math.min(r, g, b);
            var v = max / 255;
            var s = max === 0 ? 0 : (max - min) / max;
            lum += v;
            if (v < 0.22) { f.dark++; continue; }                                     // 深黑（坏死）
            if (r > 130 && g < 100 && b < 100) { f.red++; continue; }                  // 鲜红（螨类聚集）
            if (v > 0.74 && s < 0.18) { f.white++; continue; }                         // 白粉 / 霉层
            if (r > 150 && g > 90 && g < 175 && b < 100 && (r - g) > 35) { f.orange++; continue; } // 锈橙
            if (g > r + 10 && g > b + 10) { f.green++; continue; }                     // 健康绿
            if (r > 135 && g > 115 && b < 115 && Math.abs(r - g) < 65) { f.yellow++; continue; }   // 失绿黄化
            if (v < 0.55 && r >= g && g >= b && (r - b) > 15) { f.brown++; }           // 暗褐病斑
          }
          Object.keys(f).forEach(function (k) { if (k !== 'avgLum') f[k] = f[k] / n; });
          f.avgLum = lum / n;
        } catch (e) {
          done(null);
          return;
        }
        done(f);
      };
      img.onerror = function () { done(null); };
      img.src = dataUrl;
    }

    /** 由颜色特征占比判定症状类别（按病斑严重度从高到低短路判断） */
    function classifyImage(f) {
      var lesion = f.brown + f.dark + f.orange + f.white + f.red;
      if (f.green >= 0.45 && lesion < 0.14) return { cat: 'healthy', score: f.green };
      if (f.white >= 0.16) return { cat: 'powdery', score: f.white };
      if (f.orange >= 0.12) return { cat: 'rust', score: f.orange };
      if (f.dark >= 0.10) return { cat: 'anthracnose', score: f.dark };
      if (f.red >= 0.10) return { cat: 'mite', score: f.red };
      if (f.yellow >= 0.22) return { cat: 'mite', score: f.yellow };
      if (f.brown >= 0.16) return { cat: 'rot', score: f.brown };
      if (f.brown >= 0.08) return { cat: 'ring', score: f.brown };
      if (f.brown >= 0.03) return { cat: 'spot', score: f.brown };
      return { cat: 'healthy', score: Math.max(f.green, 0.3) };
    }

    /** 症状类别 → 后台规则条目：优先按病害名称关键词命中，未命中则就近回退 */
    function ruleByCategory(cat) {
      var kws = (CATEGORY_DEFS[cat] || {}).kw || [];
      var i, j;
      for (i = 0; i < DEMO_RULES.length; i++) {
        var name = DEMO_RULES[i].name || '';
        for (j = 0; j < kws.length; j++) {
          if (name.indexOf(kws[j]) >= 0) return DEMO_RULES[i];
        }
      }
      if (cat === 'healthy') {
        for (i = 0; i < DEMO_RULES.length; i++) {
          if (DEMO_RULES[i].riskClass === 'success') return DEMO_RULES[i];
        }
      }
      // 无对应条目时回退到通用叶斑类，再回退到首个非健康规则
      for (i = 0; i < DEMO_RULES.length; i++) {
        if ((DEMO_RULES[i].name || '').indexOf('斑点') >= 0) return DEMO_RULES[i];
      }
      var pool = DEMO_RULES.filter(function (r) { return r.riskClass !== 'success'; });
      if (!pool.length) pool = DEMO_RULES;
      return pool[0];
    }

    /** 识别入口：图像特征分析 → 症状类别 → 规则匹配，异步回调 { rule, conf, note } */
    function identifyByImage(dataUrl, done) {
      analyzePixels(dataUrl, function (f) {
        if (!f) {
          var guard = DEMO_RULES.filter(function (r) { return r.riskClass === 'success'; })[0] || DEMO_RULES[0];
          done({ rule: guard, conf: 60, note: '图像分析 · 当前环境无法读取图片像素，请更换图片后重试' });
          return;
        }
        var res = classifyImage(f);
        var def = CATEGORY_DEFS[res.cat] || { label: '' };
        var rule = ruleByCategory(res.cat);
        // 置信度由特征强度换算（非硬编码），并限制在 60~96 之间
        var conf = Math.round(Math.max(60, Math.min(96, 52 + res.score * 120)));
        var pct = function (x) { return (x * 100).toFixed(1) + '%'; };
        var note = '图像分析 · 症状特征「' + def.label + '」（暗褐斑 ' + pct(f.brown) +
          ' · 深黑 ' + pct(f.dark) + ' · 白粉 ' + pct(f.white) + ' · 锈橙 ' + pct(f.orange) +
          ' · 黄化 ' + pct(f.yellow) + ' · 健康绿 ' + pct(f.green) + '）';
        done({ rule: rule, conf: conf, note: note });
      });
    }

    function handleUpload(e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      if (!/^image\//.test(file.type)) {
        MobileStore.toast('请选择图片文件', 'error');
        return;
      }
      var reader = new FileReader();
      reader.onload = function (ev) {
        uploadedFile.name = file.name;
        uploadedFile.dataUrl = ev.target.result;
        var area = document.querySelector('.upload-area');
        area.classList.add('has-image');
        area.innerHTML =
          '<img src="' + ev.target.result + '" alt="已上传图片预览">' +
          '<div class="preview-hint">点击可重新选择图片</div>';
        // 重新选图后收起旧结果，避免误导
        document.getElementById('resultArea').style.display = 'none';
      };
      reader.onerror = function () {
        MobileStore.toast('图片读取失败，请重试', 'error');
      };
      reader.readAsDataURL(file);
    }

    function startIdentify() {
      if (!uploadedFile.dataUrl) {
        MobileStore.toast('请先上传图片', 'warning');
        return;
      }
      var modal = document.getElementById('loadingModal');
      modal.classList.add('show');

      var MIN_MS = 900;              // 保留最短“识别中”反馈，避免结果一闪而过
      var timerDone = false, outcome = null;

      function render() {
        if (!outcome || !timerDone) return;
        modal.classList.remove('show');
        var r = outcome.rule;
        document.getElementById('resultIcon').className = 'result-icon ' + r.icon;
        document.getElementById('resultName').textContent = r.name;
        document.getElementById('resultConfidence').textContent = '置信度：' + outcome.conf + '%';
        document.getElementById('resultNote').textContent = outcome.note;
        var tag = document.getElementById('resultTag');
        tag.className = 'mb-tag mb-tag-lg ' + r.riskClass;
        tag.textContent = r.risk;
        document.getElementById('resultTips').innerHTML = r.tips;
        var resultArea = document.getElementById('resultArea');
        resultArea.style.display = 'block';
        resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      setTimeout(function () { timerDone = true; render(); }, MIN_MS);
      identifyByImage(uploadedFile.dataUrl, function (res) {
        outcome = res;
        render();
      });
    }

    // 骨架屏加载模拟
    (function() {
      var app = document.querySelector('.mb-app');
      setTimeout(function() {
        app.classList.remove('loading');
      }, 600);
    })();
  </script>
</body>
</html>
