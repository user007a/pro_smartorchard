<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智慧果园 - 测试页面</title>
<script>
const mockData = [
  { id: 1, name: '测试1' },
  { id: 2, name: '测试2' },
  { id: 3, name: '测试3' }
];

function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  mockData.forEach(item => {
    tbody.innerHTML += '<tr><td>' + item.name + '</td></tr>';
  });
}

document.addEventListener('DOMContentLoaded', function() {
  renderTable();
});
</script>
</head>
<body>
<table>
  <tbody id="tableBody"></tbody>
</table>
</body>
</html>
