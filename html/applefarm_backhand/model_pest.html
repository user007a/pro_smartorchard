<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 病虫害模型</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  /* GIS 地图 */
  .gis-map { position:relative; background:linear-gradient(135deg,#0f1a0f,#1a2a1a); border-radius:10px; overflow:hidden; min-height:380px; }
  .gis-map svg { display:block; width:100%; height:auto; }
  .gis-map .gis-img { opacity:0.92; }
  .gis-map .base-boundary { fill:rgba(24,144,255,0.06); stroke:#5b8def; stroke-width:1.5; stroke-dasharray:4 3; }
  .gis-map .plot { cursor:pointer; transition:filter 0.2s; }
  .gis-map .plot:hover { filter:brightness(1.2) drop-shadow(0 0 4px rgba(255,255,255,0.4)); }
  .gis-map .plot.pid { fill:#fff; font-size:13px; font-weight:600; pointer-events:none; }
  .gis-map .plot.parea { fill:rgba(255,255,255,0.85); font-size:11px; pointer-events:none; }
  .gis-map .water { fill:rgba(159,208,255,0.4); stroke:#9fd0ff; stroke-width:1; }
  .gis-map .facility { fill:rgba(245,210,122,0.25); stroke:#f5d27a; stroke-width:1; }
  .gis-map text.water-label { fill:#9fd0ff; font-size:11px; }
  .gis-map text.facility-label { fill:#f5d27a; font-size:11px; }
  .map-legend { position:absolute; bottom:12px; left:12px; display:flex; gap:10px; background:rgba(255,255,255,0.92); padding:6px 12px; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,0.15); font-size:12px; }
  .map-legend-item { display:flex; align-items:center; gap:5px; }
  .map-legend-dot { width:10px; height:10px; border-radius:2px; }
  /* 类型标签 */
  .pest-selector { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .pest-tag { padding:5px 14px; background:#f5f5f5; border-radius:14px; font-size:13px; color:var(--text-secondary); cursor:pointer; transition:all 0.2s; border:1px solid transparent; }
  .pest-tag:hover { background:#e6f4ff; color:var(--primary-600); }
  .pest-tag.active { background:linear-gradient(135deg,#1890ff,#096dd9); color:#fff; border-color:#1890ff; box-shadow:0 2px 8px rgba(24,144,255,0.25); }
  /* 因子紧凑 */
  .factor-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .factor-card { padding:12px 14px; background:#fff; border-radius:8px; border:1px solid rgba(0,0,0,0.06); }
  .factor-name { font-size:12px; color:var(--text-tertiary); margin-bottom:4px; }
  .factor-value { font-size:16px; font-weight:700; color:var(--text-primary); margin-bottom:4px; }
  .factor-status { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; font-weight:500; }
  .factor-status.danger { background:#fff1f0; color:#cf1322; }
  .factor-status.warning { background:#fff1b8; color:#8c6d10; }
  .factor-status.success { background:#d9f7be; color:#3a8618; }
  /* 防治建议 */
  .treatment-card { background:linear-gradient(135deg,#fff9f0,#fff5e6); border-radius:10px; padding:14px 16px; border:1px solid #ffe4b8; margin-top:12px; }
  .treatment-title { display:flex; align-items:center; gap:6px; font-size:14px; font-weight:600; color:#b37c00; margin-bottom:6px; }
  .treatment-desc { font-size:12.5px; color:var(--text-secondary); line-height:1.6; margin-bottom:8px; }
  .treatment-meta { display:flex; gap:12px; font-size:11.5px; color:var(--text-tertiary); margin-bottom:10px; padding-bottom:8px; border-bottom:1px dashed #e0d0c0; }
  .treatment-action { padding:7px 18px; background:linear-gradient(135deg,#fa8c16,#e07700); color:#fff; border:none; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; transition:all 0.2s; }
  .treatment-action:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(250,140,22,0.25); }

  /* 地块详情面板（浮在地图右上角） */
  .plot-detail { position:absolute; top:12px; right:12px; width:240px; background:rgba(255,255,255,0.96); border-radius:10px; padding:14px; box-shadow:0 6px 20px rgba(0,0,0,0.25); backdrop-filter:blur(8px); display:none; z-index:10; }
  .plot-detail.show { display:block; animation:fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
  .plot-detail-head { display:flex; align-items:center; justify-content:space-between; padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid #e8e8e8; }
  .plot-detail-title { display:flex; align-items:center; gap:8px; }
  .plot-detail-name { font-size:15px; font-weight:600; color:var(--text-primary); }
  .plot-detail-id { padding:2px 8px; border-radius:10px; font-size:11px; font-weight:500; background:rgba(24,144,255,0.1); color:var(--primary-600); }
  .plot-detail-close { width:24px; height:24px; border-radius:50%; border:none; background:var(--gray-100); color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .plot-detail-close:hover { background:var(--gray-200); color:var(--text-primary); }
  .plot-detail-row { display:flex; align-items:center; justify-content:space-between; padding:6px 0; font-size:12.5px; }
  .plot-detail-row + .plot-detail-row { border-top:1px dashed #f0f0f0; }
  .plot-detail-label { color:var(--text-tertiary); }
  .plot-detail-value { color:var(--text-primary); font-weight:500; }
  .plot-detail-level { padding:2px 8px; border-radius:10px; font-size:11px; font-weight:500; }
  .plot-detail-level.high { background:#fff1f0; color:#cf1322; }
  .plot-detail-level.medium { background:#fff1b8; color:#8c6d10; }
  .plot-detail-level.low { background:#d9f7be; color:#3a8618; }
  .plot-detail-actions { display:flex; gap:8px; margin-top:12px; }
  .plot-detail-actions button { flex:1; padding:6px 10px; border:none; border-radius:5px; font-size:12px; font-weight:500; cursor:pointer; transition:all 0.2s; }
  .plot-detail-actions .btn-primary { background:var(--primary-500); color:#fff; }
  .plot-detail-actions .btn-primary:hover { background:var(--primary-600); }
  .plot-detail-actions .btn-secondary { background:#f5f5f5; color:var(--text-secondary); border:1px solid #e8e8e8; }
  .plot-detail-actions .btn-secondary:hover { color:var(--primary-500); border-color:var(--primary-500); }
  /* 选中地块高亮 */
  .gis-map .plot.sel polygon { stroke:#fff; stroke-width:3; filter:drop-shadow(0 0 8px rgba(255,255,255,0.6)); }
  .gis-map .plot.sel text { fill:var(--primary-600) !important; font-weight:bold !important; }
  /* 提示气泡（hover显示） */
  .plot-tooltip { position:absolute; background:rgba(0,0,0,0.85); color:#fff; padding:6px 10px; border-radius:4px; font-size:12px; pointer-events:none; opacity:0; transition:opacity 0.15s; z-index:5; white-space:nowrap; }
  .plot-tooltip.show { opacity:1; }
  .plot-tooltip::after { content:''; position:absolute; bottom:-4px; left:50%; margin-left:-4px; border:4px solid transparent; border-top-color:rgba(0,0,0,0.85); }
  /* 地块风险指数表 */
  .risk-table { width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
  .risk-table th { text-align:left; font-weight:600; color:var(--text-secondary); font-size:12px; padding:10px 12px; background:linear-gradient(135deg, var(--gray-50), var(--gray-100)); border-bottom:2px solid var(--border-light); }
  .risk-table td { padding:10px 12px; border-bottom:1px solid var(--border-light); color:var(--text-primary); }
  .risk-table tbody tr:nth-child(even) { background:var(--gray-50); }
  .risk-table tbody tr:hover { background:var(--primary-50); }
  .risk-cell { display:flex; align-items:center; gap:10px; min-width:150px; }
  .risk-cell .risk-track { flex:1; height:8px; background:#eef1ef; border-radius:4px; overflow:hidden; }
  .risk-cell .risk-track > i { display:block; height:100%; border-radius:4px; }
  .risk-cell .risk-track > i.high { background:linear-gradient(90deg,#ff7875,#ff4d4f); }
  .risk-cell .risk-track > i.mid { background:linear-gradient(90deg,#ffd666,#fa8c16); }
  .risk-cell .risk-track > i.low { background:linear-gradient(90deg,#95de64,#52c41a); }
  .risk-cell .risk-num { font-weight:700; font-variant-numeric:tabular-nums; min-width:30px; text-align:right; }
  .risk-cell .risk-num.high { color:var(--error); }
  .risk-cell .risk-num.mid { color:var(--warning); }
  .risk-cell .risk-num.low { color:var(--success); }
  .risk-level { display:inline-block; padding:2px 10px; border-radius:10px; font-size:11px; font-weight:500; }
  .risk-level.high { background:#fff1f0; color:#cf1322; }
  .risk-level.mid { background:#fff1b8; color:#8c6d10; }
  .risk-level.low { background:#d9f7be; color:#3a8618; }
</style>
<style id="standalone-fix">.main-wrapper{margin-left:0!important;width:100%!important;}</style>

<body data-active-menu="model" data-active-submenu="model-pest">
<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3L11 11M11 3L3 11"/></svg>
        </button>
      </div>
    </div>

    <main class="main-content">
<div class="page-container">
  <div class="mp-header">
    <div class="mp-header-main">
      <div class="mp-header-icon"><i data-uicon="bug"></i></div>
      <div>
        <div class="mp-title">病虫害模型</div>
        <div class="mp-subtitle">风险地图 · 模型推演与防治建议</div>
      </div>
    </div>
    <div class="mp-header-actions">
      <span class="mp-live">模型运行中</span>
    </div>
  </div>

  <!-- 顶部 4 指标 -->
  <div class="patrol-stats">
    <div class="patrol-stat-card red"><div class="stat-value" id="statHighRisk">--</div><div class="stat-label">高风险地块</div><div class="stat-trend" style="font-size:12px;color:var(--error);"></div></div>
    <div class="patrol-stat-card orange"><div class="stat-value" id="statMidRisk">--</div><div class="stat-label">中风险地块</div><div class="stat-trend" style="font-size:12px;color:var(--warning);"></div></div>
    <div class="patrol-stat-card green"><div class="stat-value" id="statLowRisk">--</div><div class="stat-label">低风险地块</div><div class="stat-trend" style="font-size:12px;color:var(--success);"></div></div>
    <div class="patrol-stat-card blue"><div class="stat-value">--</div><div class="stat-label">今日防治建议</div><div class="stat-trend" style="font-size:12px;color:var(--text-tertiary);"></div></div>
  </div>

  <!-- 页签 -->
  <div class="mp-tabs">
    <button class="mp-tab active" data-tab="map" onclick="mpSwitchTab('map')"><i data-uicon="map"></i>风险地图</button>
    <button class="mp-tab" data-tab="trend" onclick="mpSwitchTab('trend')"><i data-uicon="chartBar"></i>趋势与清单</button>
  </div>

  <div class="mp-panel active" data-panel="map">
  <!-- GIS 病虫害风险地图 + 模型推演（左右） -->
  <div style="display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-bottom:20px;">
    <div class="chart-section">
      <h2 class="section-title">病虫害风险地图</h2>
      <div class="gis-map" id="gisMap">
        <!-- 地图由 JS 渲染 -->
        <div class="map-legend"></div>
      </div>
    </div>

    <div class="chart-section">
      <h2 class="section-title">模型推演详情</h2>
      <div class="pest-selector"></div>
      <div class="factor-grid"></div>
      <div class="treatment-card"></div>
    </div>
  </div>
  </div>

  <div class="mp-panel" data-panel="trend">
  <!-- 风险趋势（可切换 3天/7天） -->
  <div class="chart-section" style="margin-bottom:20px;">
    <div class="section-title" style="display:flex;align-items:center;justify-content:space-between;">
      <span>未来风险趋势</span>
      <div class="trend-switch" style="display:inline-flex;border:1px solid var(--border-light);border-radius:6px;overflow:hidden;">
        <button type="button" class="trend-switch-btn active" data-range="3" style="padding:4px 14px;background:var(--primary-500);color:#fff;border:none;cursor:pointer;font-size:12px;">未来3天</button>
        <button type="button" class="trend-switch-btn" data-range="7" style="padding:4px 14px;background:#fff;color:var(--text-secondary);border:none;cursor:pointer;font-size:12px;">未来7天</button>
      </div>

    <div id="chart-trend" class="chart-container" style="height:280px;"></div>
  </div>

  <!-- 按地块的风险指数（数值化） -->
  <div class="chart-section" style="margin-bottom:20px;">
    <h2 class="section-title">地块风险指数 <span style="font-size:12px;color:var(--text-tertiary);font-weight:400;">风险等级由指数推导：≥70 高 · 40-69 中 · &lt;40 低</span></h2>
    <table class="risk-table">
      <thead>
        <tr>
          <th style="width:80px;">地块编号</th>
          <th style="width:130px;">地块名称</th>
          <th style="width:130px;">主栽品种</th>
          <th style="width:130px;">病虫害类型</th>
          <th style="width:220px;">风险指数</th>
          <th style="width:90px;">风险等级</th>
          <th>责任人</th>
        </tr>
      </thead>
      <tbody id="riskTableBody"></tbody>
    </table>

  </div>
</div>
    </main>

<script>
  /* 模型页面通用页签切换 */
  function mpSwitchTab(name) {
    document.querySelectorAll('.mp-tab').forEach(function (t) { t.classList.toggle('active', t.dataset.tab === name); });
    document.querySelectorAll('.mp-panel').forEach(function (p) { p.classList.toggle('active', p.dataset.panel === name); });
    requestAnimationFrame(function () { window.dispatchEvent(new Event('resize')); });
  }
</script>
<script src="js/shared/model-store.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/chart.js"></script>
<script src="js/shared/alert-data.js"></script>
<script>
// 病虫害模型数据统一取自 ModelStore（与移动端/大屏共用）
let PEST_MODEL = ModelStore.get('pest');
let PEST_META = PEST_MODEL.meta;

// ===== 病虫害风险地图（参照大屏 GIS 真实布局） =====
// 详情面板 / tooltip / 选中态在多次重建间复用，地块 SVG 随数据重建
let pestDetail = null;
let pestTooltip = null;
let pestSelectedG = null;
let pestMapBuilt = false;

function hidePestDetail() {
  if (pestDetail) pestDetail.classList.remove('show');
  if (pestSelectedG) { pestSelectedG.classList.remove('sel'); pestSelectedG = null; }
}

function buildPestMap() {
  const map = document.getElementById('gisMap');
  if (!map) return;
  // 移除上一次的地块 SVG（保留图例与详情面板），重置选中态
  const oldSvg = map.querySelector('svg');
  if (oldSvg) oldSvg.remove();
  pestSelectedG = null;

  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

  // 与大屏同一坐标 900×720 + 地块多边形
  const svg = el('svg', { viewBox: PEST_META.mapViewBox, preserveAspectRatio: 'xMidYMid slice', xmlns: NS });
  svg.style.width = '100%';
  svg.style.height = 'auto';
  svg.style.maxHeight = '420px';

  // 底图（需复制到 images/ 目录）
  const img = el('image', { class: 'gis-img', href: PEST_META.mapImage, x: 0, y: 0, width: 900, height: 720, preserveAspectRatio: 'xMidYMid slice' });
  svg.appendChild(img);

  // 基地边界（与 yl-camera-26 大屏一致）
  svg.appendChild(el('polygon', { points: PEST_META.baseBoundary, class: 'base-boundary' }));

  // 蓄水池
  const WATER = PEST_META.water;
  svg.appendChild(el('ellipse', { cx: WATER.cx, cy: WATER.cy, rx: WATER.rx, ry: WATER.ry, class: 'water' }));
  const wt = el('text', { x: WATER.cx, y: WATER.cy + 4, 'text-anchor': 'middle', class: 'water-label' });
  wt.textContent = WATER.label;
  svg.appendChild(wt);

  // 分选中心
  const FACILITY = PEST_META.facility;
  svg.appendChild(el('rect', { x: FACILITY.x, y: FACILITY.y, width: FACILITY.width, height: FACILITY.height, rx: FACILITY.rx, class: 'facility' }));
  const ft = el('text', { x: FACILITY.x + FACILITY.width / 2, y: FACILITY.y + 28, 'text-anchor': 'middle', class: 'facility-label' });
  ft.textContent = FACILITY.label;
  svg.appendChild(ft);

  // 病虫害地块（数据来自 ModelStore，按当前风险等级着色）
  // riskIndex：数值化风险指数 0-100（≥70 高 / 40-69 中 / <40 低），与 level 相互独立
  const PLOTS = PEST_MODEL.lists.plots;
  // 基地附加地块（各基地简化示意，与大屏互补）
  const EXT = PEST_MODEL.lists.basePlots;
  const ALL = PLOTS.concat(EXT);
  window.PEST_PLOTS = PLOTS;
  window.PEST_ALL = ALL;

  // 病虫害模型预警 → AlertStore（source=model / category=pest）
  if (window.AlertStore && typeof AlertStore.syncSource === 'function') {
    const risky = ALL.filter(p => p.riskIndex >= 40 && p.pest && p.pest !== '无');
    AlertStore.syncSource('model', risky.map(p => ({
      dedupeKey: 'model:pest:' + p.id,
      category: 'pest',
      level: p.riskIndex >= 70 ? 'urgent' : 'important',
      title: '病虫害风险：' + p.name + ' · ' + p.pest,
      desc: p.name + '（' + p.variety + '）风险指数 ' + p.riskIndex + '，主要病虫害 ' + p.pest +
            '，健康指数 ' + p.health + '，负责人 ' + p.manager + '。',
      base: p.name.indexOf('基地') >= 0 ? p.name : '',
      plot: p.id,
      value: p.riskIndex,
      threshold: '风险指数 ≥ 70 为高风险'
    })), 'model:pest:');
  }

  const COL = { high: 'rgba(229,86,75,0.35)', medium: 'rgba(242,179,61,0.38)', low: 'rgba(43,212,110,0.30)' };
  const COLB = { high: '#ff5d63', medium: '#f5b53d', low: '#2bd46e' };
  const LV_TXT = { high: '高风险', medium: '中风险', low: '低风险' };

  // 详情面板 / tooltip 只创建一次（重建地图时复用），空白处点击关闭也只绑一次
  if (!pestMapBuilt) {
    pestDetail = document.createElement('div');
    pestDetail.className = 'plot-detail';
    pestDetail.id = 'plotDetail';
    pestDetail.innerHTML =
      '<div class="plot-detail-head">' +
        '<div class="plot-detail-title">' +
          '<span class="plot-detail-name" id="pd-name"></span>' +
          '<span class="plot-detail-id" id="pd-id"></span>' +
        '</div>' +
        '<button class="plot-detail-close" id="pd-close">×</button>' +
      '</div>' +
      '<div class="plot-detail-row"><span class="plot-detail-label">风险等级</span><span class="plot-detail-level" id="pd-level"></span></div>' +
      '<div class="plot-detail-row"><span class="plot-detail-label">品种</span><span class="plot-detail-value" id="pd-variety"></span></div>' +
      '<div class="plot-detail-row"><span class="plot-detail-label">面积</span><span class="plot-detail-value" id="pd-area"></span></div>' +
      '<div class="plot-detail-row"><span class="plot-detail-label">主要病虫害</span><span class="plot-detail-value" id="pd-pest"></span></div>' +
      '<div class="plot-detail-row"><span class="plot-detail-label">预估产量</span><span class="plot-detail-value" id="pd-yield"></span></div>' +
      '<div class="plot-detail-row"><span class="plot-detail-label">健康指数</span><span class="plot-detail-value" id="pd-health"></span></div>' +
      '<div class="plot-detail-row"><span class="plot-detail-label">负责人</span><span class="plot-detail-value" id="pd-manager"></span></div>' +
      '<div class="plot-detail-row"><span class="plot-detail-label">更新时间</span><span class="plot-detail-value" id="pd-updated"></span></div>' +
      '<div class="plot-detail-actions">' +
        '<button class="btn-primary" id="pd-detail">查看详情</button>' +
        '<button class="btn-secondary" id="pd-treat">生成防治</button>' +
      '</div>';
    map.appendChild(pestDetail);

    // Hover tooltip
    pestTooltip = document.createElement('div');
    pestTooltip.className = 'plot-tooltip';
    pestTooltip.id = 'plotTooltip';
    map.appendChild(pestTooltip);

    document.getElementById('pd-close').addEventListener('click', hidePestDetail);
    // 点击地图空白处关闭
    map.addEventListener('click', (e) => {
      if (e.target === map || e.target.tagName === 'image' || e.target.classList.contains('base-boundary')) hidePestDetail();
    });
    pestMapBuilt = true;
  }

  function centroid(pts) {
    let x = 0, y = 0; pts.forEach(p => { x += p[0]; y += p[1]; }); return [x / pts.length, y / pts.length];
  }

  function selectPlot(g, p) {
    // 取消上一次选中
    if (pestSelectedG && pestSelectedG !== g) pestSelectedG.classList.remove('sel');
    pestSelectedG = g;
    g.classList.add('sel');

    // 填充详情
    document.getElementById('pd-name').textContent = p.name;
    document.getElementById('pd-id').textContent = p.id;
    const lv = document.getElementById('pd-level');
    lv.textContent = LV_TXT[p.level];
    lv.className = 'plot-detail-level ' + p.level;
    document.getElementById('pd-variety').textContent = p.variety || '—';
    document.getElementById('pd-area').textContent = p.area ? p.area + ' 亩' : '—';
    document.getElementById('pd-pest').textContent = p.pest || '无';
    document.getElementById('pd-yield').textContent = p.yieldL ? p.yieldL + '产量' : '—';
    document.getElementById('pd-health').textContent = p.health ? p.health + ' / 100' : '—';
    document.getElementById('pd-manager').textContent = p.manager || '—';
    document.getElementById('pd-updated').textContent = p.updated || '—';
    pestDetail.classList.add('show');

    // 详情按钮 → 跳地块详情页
    document.getElementById('pd-detail').onclick = () => {
      var f = window.parent.document.querySelector('iframe[name="mainFrame"]');
      var url = 'enterprise_plot.html?plot=' + encodeURIComponent(p.id + ' ' + p.name);
      if (f) f.src = url; else location.href = url;
    };

    // 防治按钮 → 写入 localStorage 并跳转
    document.getElementById('pd-treat').onclick = () => {
      try {
        const prefills = JSON.parse(localStorage.getItem('orchard_farming_prefill') || '[]');
        prefills.push({
          title: (p.pest || '病虫害') + '防治任务（来自病虫害地图）',
          taskType: '病虫害防治',
          plotRange: p.id + ' ' + p.name,
          priority: p.level === 'high' ? '高' : '中'
        });
        localStorage.setItem('orchard_farming_prefill', JSON.stringify(prefills));
        Toast.show('已为 ' + p.name + ' 生成防治任务', 'success');
        setTimeout(() => {
          var f = window.parent.document.querySelector('iframe[name="mainFrame"]');
          if (f) f.src = 'farming_plan.html?from=model_pest';
          else location.href = 'farming_plan.html?from=model_pest';
        }, 700);
      } catch (e) { Toast.show('生成失败：' + e.message, 'error'); }
    };
  }

  // 绘制地块 + 绑定交互
  ALL.forEach(p => {
    const g = el('g', { class: 'plot', 'data-plot': p.id, tabindex: '0', role: 'button' });
    const shape = el('polygon', {
      points: p.pts.map(q => q[0] + ',' + q[1]).join(' '),
      fill: COL[p.level], stroke: COLB[p.level], 'stroke-width': 2, 'stroke-linejoin': 'round'
    });
    g.appendChild(shape);
    const c = centroid(p.pts);
    const t1 = el('text', { x: c[0], y: c[1] - 6, 'text-anchor': 'middle', class: 'pid' }); t1.textContent = p.id;
    const t2 = el('text', { x: c[0], y: c[1] + 14, 'text-anchor': 'middle', class: 'parea' }); t2.textContent = p.name;
    g.appendChild(t1); g.appendChild(t2);
    svg.appendChild(g);

    // 点击 → 显示详情
    g.addEventListener('click', (e) => {
      e.stopPropagation();
      selectPlot(g, p);
    });

    // 键盘 Enter/Space
    g.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        selectPlot(g, p);
      }
      if (e.key === 'Escape') hidePestDetail();
    });

    // Hover → 显示 tooltip
    g.addEventListener('mouseenter', (e) => {
      pestTooltip.textContent = p.id + ' ' + p.name + ' · ' + LV_TXT[p.level] + ' · ' + (p.pest || '无');
      pestTooltip.classList.add('show');
    });
    g.addEventListener('mousemove', (e) => {
      const rect = map.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      pestTooltip.style.left = (x - pestTooltip.offsetWidth / 2) + 'px';
      pestTooltip.style.top = (y - pestTooltip.offsetHeight - 10) + 'px';
    });
    g.addEventListener('mouseleave', () => {
      pestTooltip.classList.remove('show');
    });

    // 双击 → 直接跳详情页
    g.addEventListener('dblclick', () => {
      var f = window.parent.document.querySelector('iframe[name="mainFrame"]');
      var url = 'enterprise_plot.html?plot=' + encodeURIComponent(p.id + ' ' + p.name);
      if (f) f.src = url; else location.href = url;
    });
  });

  // 把 legend 之外的 svg 插入 map
  map.insertBefore(svg, map.firstChild);
}

// ===== 地块风险指数表（数值化，level 保留给原图表使用）=====
// 风险等级由 riskIndex 推导：≥70 高 / 40-69 中 / <40 低
function riskLevelOf(index) {
  if (index >= 70) return { key: 'high', text: '高风险' };
  if (index >= 40) return { key: 'mid', text: '中风险' };
  return { key: 'low', text: '低风险' };
}

function renderRiskTable() {
  const tbody = document.getElementById('riskTableBody');
  if (!tbody) return;
  const rows = window.PEST_PLOTS || [];
  tbody.innerHTML = rows.map(p => {
    const idx = Math.max(0, Math.min(100, Number(p.riskIndex) || 0));
    const lv = riskLevelOf(idx);
    return `<tr>
      <td><strong>${p.id}</strong></td>
      <td>${p.name}</td>
      <td>${p.variety}</td>
      <td>${p.pest || '无'}</td>
      <td>
        <div class="risk-cell">
          <div class="risk-track"><i class="${lv.key}" style="width:${idx}%"></i></div>
          <span class="risk-num ${lv.key}">${idx}</span>
        </div>
      </td>
      <td><span class="risk-level ${lv.key}">${lv.text}</span></td>
      <td>${p.manager || '—'}</td>
    </tr>`;
  }).join('');
}

// ===== 图例 / 病害类型 / 影响因子 / 防治建议（数据来自 ModelStore）=====
function renderPestLegend(M) {
  const box = document.querySelector('.map-legend');
  if (!box) return;
  box.innerHTML = M.lists.riskLegend.map(function(r) {
    return '<div class="map-legend-item"><span class="map-legend-dot" style="background:' + r.color + ';"></span>' + r.label + '</div>';
  }).join('');
}

function renderPestSelector(M) {
  const box = document.querySelector('.pest-selector');
  if (!box) return;
  box.innerHTML = M.lists.pestTypes.map(function(name, i) {
    return '<span class="pest-tag' + (i === 0 ? ' active' : '') + '" onclick="selectPest(this)">' + name + '</span>';
  }).join('');
}

function renderPestFactors(M) {
  const box = document.querySelector('.factor-grid');
  if (!box) return;
  box.innerHTML = M.lists.factors.map(function(f) {
    return '<div class="factor-card">' +
      '<div class="factor-name">' + f.name + '</div>' +
      '<div class="factor-value">' + f.value + '</div>' +
      '<div class="factor-status ' + f.tone + '">' + f.status + '</div>' +
    '</div>';
  }).join('');
}

function renderPestTreatment(M) {
  const box = document.querySelector('.treatment-card');
  if (!box) return;
  const t = M.lists.treatment;
  box.innerHTML =
    '<div class="treatment-title">' + t.title + '</div>' +
    '<div class="treatment-desc">' + t.desc + '</div>' +
    '<div class="treatment-meta">' + t.meta.map(function(m) { return '<span>' + m + '</span>'; }).join('') + '</div>' +
    '<button class="treatment-action" onclick="adoptPestAdvice(\'' + t.pestName + '\')">' + t.action + '</button>';
}

// ===== ECharts 风险趋势（可切换 3 天 / 7 天）=====
let pestTrendRange = 3;
function renderPestTrend() {
  const M = ModelStore.get('pest');
  Chart.line('#chart-trend', pestTrendRange == 7 ? M.charts.riskTrend7 : M.charts.riskTrend3);
}

// 整页重绘：KPI + 地图 + 列表 + 趋势统一取最新 ModelStore
function refreshPest() {
  PEST_MODEL = ModelStore.get('pest');
  PEST_META = PEST_MODEL.meta;
  ModelStore.hydrateKpi('.patrol-stats', 'pest');
  buildPestMap();
  renderPestLegend(PEST_MODEL);
  renderPestSelector(PEST_MODEL);
  renderPestFactors(PEST_MODEL);
  renderPestTreatment(PEST_MODEL);
  renderRiskTable();
  renderPestTrend();
}

document.addEventListener('DOMContentLoaded', function() {
  refreshPest();

  // 切换按钮交互
  const btns = document.querySelectorAll('.trend-switch-btn');
  btns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      pestTrendRange = this.getAttribute('data-range') == 7 ? 7 : 3;
      btns.forEach(function(b) {
        const isActive = b === btn;
        b.classList.toggle('active', isActive);
        b.style.background = isActive ? 'var(--primary-500)' : '#fff';
        b.style.color = isActive ? '#fff' : 'var(--text-secondary)';
      });
      renderPestTrend();
    });
  });
});

function selectPest(tag) {
  document.querySelectorAll('.pest-tag').forEach(t => t.classList.remove('active'));
  tag.classList.add('active');
  Toast.show('已切换至' + tag.textContent, 'info');
}

function adoptPestAdvice(pestName) {
  try {
    const prefills = JSON.parse(localStorage.getItem('orchard_farming_prefill') || '[]');
    const high = PEST_MODEL.kpi[0] ? PEST_MODEL.kpi[0].value : '--';
    const mid = PEST_MODEL.kpi[1] ? PEST_MODEL.kpi[1].value : '--';
    prefills.push({ title: pestName + '任务（来自病虫害模型）', taskType: '病虫害防治', plotRange: '高风险' + high + '块 + 中风险' + mid + '块', priority: '高' });
    localStorage.setItem('orchard_farming_prefill', JSON.stringify(prefills));
    Toast.show('已生成' + pestName + '任务', 'success');
    setTimeout(() => {
      const f = window.parent.document.querySelector('iframe[name="mainFrame"]');
      if (f) f.src = 'farming_plan.html?from=model_pest';
      else location.href = 'farming_plan.html?from=model_pest';
    }, 700);
  } catch (e) { Toast.show('采纳失败：' + e.message, 'error'); }
}
</script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/typography.js"></script>
<script>
/* ============================================================
 * 后端数据到达后自动重绘
 * ------------------------------------------------------------
 * 数据层在「后端预加载完成」与「本地写入」两条路径上都会派发
 * <store>StoreChange 窗口事件；页面若不监听，首次渲染发生在数据
 * 到达之前，界面会一直停在空列表。此处统一订阅后自动重绘。
 *
 * 注意：只订阅 modelStoreChange。buildPestMap 内部会 syncSource
 * 同步预警并广播 alertStoreChange，若再订阅它会造成重绘→同步→
 * 再广播的无限循环。
 * ============================================================ */
(function () {
  function bind(events, handler) {
    if (typeof StoreLive !== 'undefined') return StoreLive.on(events, handler);
    (Array.isArray(events) ? events : [events]).forEach(function (ev) {
      if (ev) window.addEventListener(ev, function () { try { handler(); } catch (e) { console.warn('[store-live]', e); } });
    });
  }
  bind(["modelStoreChange"], refreshPest);
})();
</script>
