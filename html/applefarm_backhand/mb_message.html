<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 消息推送与公告</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/page-content.css">
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<style>
  .notice-bar {
    display: flex; align-items: flex-start; gap: var(--space-sm);
    padding: var(--space-md) var(--space-lg);
    background: var(--info-bg); border: 1px solid var(--border-light);
    border-radius: var(--radius-lg); font-size: var(--font-size-sm);
    color: var(--text-secondary); margin-bottom: var(--space-lg);
  }
  .notice-bar svg { flex-shrink: 0; margin-top: 2px; color: var(--info); }
  .notice-bar code {
    font-family: var(--font-family-mono, monospace);
    background: rgba(24,144,255,0.08); padding: 1px 5px; border-radius: 4px;
  }
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
  }
  .stat-label { font-size: var(--font-size-sm); color: var(--text-tertiary); margin-bottom: var(--space-xs); }
  .stat-value {
    font-size: 26px; font-weight: var(--font-weight-bold);
    color: var(--text-primary); line-height: 1.2; font-variant-numeric: tabular-nums;
  }
  .stat-card.is-on   .stat-value { color: var(--success); }
  .stat-card.is-ai   .stat-value { color: var(--primary-500); }
  .stat-card.is-alert .stat-value { color: var(--error); }

  .cat-tag {
    display: inline-block; padding: 3px 10px;
    border-radius: var(--radius-full);
    font-size: var(--font-size-xs);
    white-space: nowrap;
  }
  .cat-tag.ai      { background: var(--primary-50); color: var(--primary-600); }
  .cat-tag.alert   { background: var(--error-bg); color: var(--error); }
  .cat-tag.farming { background: var(--success-bg); color: var(--success); }
  .cat-tag.device  { background: var(--info-bg); color: var(--info); }
  .cat-tag.notice  { background: var(--warning-bg); color: var(--warning); }

  .status-tag {
    display: inline-block; padding: 3px 10px;
    border-radius: var(--radius-full);
    font-size: var(--font-size-xs); white-space: nowrap;
  }
  .status-tag.on  { background: var(--success-bg); color: var(--success); }
  .status-tag.off { background: var(--gray-100); color: var(--text-tertiary); }

  .cell-title {
    font-weight: var(--font-weight-semibold, 600);
    color: var(--text-primary); margin-bottom: 2px;
  }
  .cell-sub {
    font-size: var(--font-size-xs); color: var(--text-tertiary);
    max-width: 360px; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .target-tag {
    display: inline-block; margin-left: 6px; padding: 1px 6px;
    border-radius: var(--radius-sm); font-size: 11px;
    background: var(--gray-100); color: var(--text-tertiary);
  }
  .empty-state {
    padding: var(--space-2xl) 0; text-align: center;
    color: var(--text-tertiary); font-size: var(--font-size-sm);
  }

  /* ===== 弹窗 ===== */
  .modal-overlay {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    justify-content: center; align-items: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--bg-card);
    border-radius: 12px;
    width: 92%; max-width: 620px; max-height: 85vh;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    animation: modalFadeIn 0.2s ease-out;
  }
  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.95) translateY(-20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-bottom: 1px solid var(--border-default);
  }
  .modal-title { font-size: 16px; font-weight: 600; color: #1f1f1f; }
  .modal-close {
    background: none; border: none; cursor: pointer;
    padding: 4px; font-size: 20px; line-height: 1;
    color: var(--text-tertiary); transition: color 0.2s;
  }
  .modal-close:hover { color: var(--text-secondary); }
  .modal-body { padding: 20px; overflow-y: auto; max-height: calc(85vh - 132px); }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 12px;
    padding: 16px 20px; border-top: 1px solid var(--border-default);
  }
  .modal-field { margin-bottom: var(--space-lg); }
  .modal-field:last-child { margin-bottom: 0; }
  .modal-field label {
    display: block; font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium, 500);
    color: var(--text-primary); margin-bottom: var(--space-sm);
  }
  .modal-field textarea, .modal-field input, .modal-field select {
    width: 100%; padding: 10px 14px;
    border: 1.5px solid var(--border-default);
    border-radius: var(--radius-lg);
    font-size: var(--font-size-base); font-family: inherit;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    background: var(--bg-card);
  }
  .modal-field textarea { min-height: 90px; resize: vertical; line-height: var(--line-height-relaxed); }
  .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus {
    border-color: var(--primary-500);
    box-shadow: 0 0 0 4px rgba(24, 144, 255, 0.12);
    outline: none;
  }
  .field-hint { font-size: var(--font-size-xs); color: var(--text-tertiary); margin-top: 6px; }
</style>
</head>

<script>
/* ============================================================
 * 消息推送与公告（移动端运营 · 消息与同步）
 * 严格空库模式：数据一律来自后端 API（sf_mb_message），页面不再播种演示数据
 *   结构：[{ id, category, title, content, time, target, enabled,
 *            publisher, source, createdAt }]
 *   category：ai AI / alert 预警 / farming 农事 / device 设备 / notice 通知
 *   target  ：mobile 移动端作业人员 / all 全部用户
 *   publisher：发布人（后台账号姓名，留痕展示）
 *   读取方  ：applefarm_mobile/mb_home.html 首页滚动消息栏
 *             （仅取 enabled:true 且 target 为 mobile/all）
 * ============================================================ */

/* 当前编辑中的消息 id（null = 新增） */
var currentEditId = null;

var CATEGORY_TEXT = {
  ai: 'AI', alert: '预警', farming: '农事', device: '设备', notice: '通知'
};

var TARGET_TEXT = {
  mobile: '移动端作业人员', all: '全部用户'
};

/* ---------- 数据源（严格空库模式） ---------- */
var MESSAGE_RESOURCE = 'mb_message';
/* 消息缓存：由 loadMessages() 从后端 API 异步填充，页面不再读写 localStorage 播种 */
let msgData = [];

/* 数据库行(snake_case) → 页面渲染字段 */
function mapMessageRow(row) {
  return {
    id: row.id,
    category: row.category || 'notice',
    title: row.title || '',
    content: row.content || '',
    time: row.publish_time || '',
    target: row.target || 'mobile',
    enabled: row.status !== 'disabled' && row.status !== 'inactive',
    publisher: row.publisher || '',
    source: row.source || 'pc',
    createdAt: row.created_at || ''
  };
}

/* 表格状态提示：加载中 / 暂无数据 / 加载失败 */
function setMsgStatus(text, isError) {
  var body = document.getElementById('msgBody');
  var empty = document.getElementById('emptyHint');
  if (body) body.innerHTML = '';
  if (empty) {
    empty.style.display = 'block';
    empty.textContent = text;
    empty.style.color = isError ? 'var(--error, #d03050)' : '';
  }
  ['statTotal', 'statOn', 'statAi', 'statAlert'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.textContent = '0';
  });
}

/* 异步取数：成功后渲染，无数据显示暂无数据，失败显示错误提示；不写 localStorage */
function loadMessages() {
  if (!window.Api) { setMsgStatus('数据加载失败：接口未就绪', true); return; }
  setMsgStatus('正在加载数据...', false);
  Api.get(MESSAGE_RESOURCE, { page: 1, size: 500 }).then(function (r) {
    if (!r || !r.ok) {
      setMsgStatus('数据加载失败：' + ((r && r.message) || '请求异常'), true);
      return;
    }
    var list = (r.data && r.data.list) || [];
    msgData = list.map(mapMessageRow);
    if (!msgData.length) { setMsgStatus('暂无数据', false); return; }
    renderTable();
  }).catch(function (e) {
    setMsgStatus('数据加载失败：' + (e && e.message ? e.message : '网络异常'), true);
  });
}

/* ---------- 数据读写（仅内存缓存，保证增删改交互即时生效） ---------- */
function writeAll(list) {
  msgData = list;
  return true;
}

/* 数据源：loadMessages() 从后端填充的内存缓存，不再读 localStorage / 播种 */
function readList() {
  return msgData;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function fmtTime(t) {
  if (!t) return '—';
  var d = new Date(String(t).replace(/-/g, '/').replace('T', ' ').replace(/\..*$/, ''));
  if (isNaN(d.getTime())) return String(t).replace('T', ' ').slice(0, 16);
  var p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ---------- 统计与渲染 ---------- */
function renderStats(list) {
  var on = 0, ai = 0, alert = 0;
  list.forEach(function (m) {
    if (m.enabled !== false) on++;
    if (m.category === 'ai') ai++;
    if (m.category === 'alert') alert++;
  });
  document.getElementById('statTotal').textContent = list.length;
  document.getElementById('statOn').textContent = on;
  document.getElementById('statAi').textContent = ai;
  document.getElementById('statAlert').textContent = alert;
}

function filteredList() {
  var cat = document.getElementById('catSelect').value;
  var status = document.getElementById('statusSelect').value;
  var kw = document.getElementById('searchInput').value.trim().toLowerCase();

  return readList().filter(function (m) {
    if (cat && m.category !== cat) return false;
    if (status === 'on' && m.enabled === false) return false;
    if (status === 'off' && m.enabled !== false) return false;
    if (kw) {
      var hay = ((m.title || '') + ' ' + (m.content || '')).toLowerCase();
      if (hay.indexOf(kw) === -1) return false;
    }
    return true;
  }).sort(function (a, b) {
    return new Date(String(b.time || 0).replace(/-/g, '/')).getTime() -
           new Date(String(a.time || 0).replace(/-/g, '/')).getTime();
  });
}

function renderTable() {
  var all = readList();
  renderStats(all);

  var list = filteredList();
  var body = document.getElementById('msgBody');
  var empty = document.getElementById('emptyHint');

  if (!list.length) {
    body.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = all.length
      ? '没有符合条件的消息，试试调整筛选条件'
      : '暂无数据';
    return;
  }
  empty.style.display = 'none';

  body.innerHTML = list.map(function (m, i) {
    var cat = CATEGORY_TEXT[m.category] || m.category || '通知';
    var target = TARGET_TEXT[m.target] || TARGET_TEXT.mobile;
    var on = m.enabled !== false;
    return '<tr>' +
      '<td>' + (i + 1) + '</td>' +
      '<td class="text-mono">' + esc(fmtTime(m.time)) + '</td>' +
      '<td><span class="cat-tag ' + esc(m.category || 'notice') + '">' + esc(cat) + '</span></td>' +
      '<td><div class="cell-title">' + esc(m.title) + '</div>' +
          '<div class="cell-sub">' + esc(m.content) + '</div></td>' +
      '<td><span class="status-tag ' + (on ? 'on' : 'off') + '">' + (on ? '启用中' : '已停用') + '</span>' +
          '<span class="target-tag">' + esc(target) + '</span></td>' +
      '<td>' + esc(m.publisher || '系统管理员') +
          '<div class="cell-sub" style="font-size:11px;">' + esc(MobileOpsStore.SOURCE_TEXT[m.source || 'pc']) + '</div></td>' +
      '<td><div class="action-btns">' +
        '<button class="action-btn edit" data-act="edit" data-id="' + esc(m.id) + '">编辑</button>' +
        '<button class="action-btn detail" data-act="toggle" data-id="' + esc(m.id) + '">' + (on ? '停用' : '启用') + '</button>' +
        '<button class="action-btn delete" data-act="delete" data-id="' + esc(m.id) + '">删除</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

function refreshList() { renderTable(); }

function resetFilter() {
  document.getElementById('catSelect').value = '';
  document.getElementById('statusSelect').value = '';
  document.getElementById('searchInput').value = '';
  renderTable();
}

/* ---------- 启停 ---------- */
function toggleMsg(id) {
  var list = readList();
  var target = null;
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].id) === String(id)) { target = list[i]; break; }
  }
  if (!target) { Toast.error('未找到该消息'); return; }
  target.enabled = target.enabled === false;
  if (writeAll(list)) {
    MobileOpsStore.audit(target.enabled ? '启用消息' : '停用消息', 'messages', target.id, target.title);
    renderTable();
    Toast.success(target.enabled ? '消息已启用，移动端可展示' : '消息已停用，移动端不再展示');
  }
}

/* ---------- 删除 ---------- */
function deleteMsg(id) {
  var list = readList();
  var target = null;
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].id) === String(id)) { target = list[i]; break; }
  }
  if (!target) { Toast.error('未找到该消息'); return; }
  ConfirmDialog.show({
    title: '删除消息',
    message: '将删除消息「' + (target.title || '') + '」，删除后移动端首页不再展示，删除不可恢复。',
    onConfirm: function () {
      var cur = readList().filter(function (m) { return String(m.id) !== String(id); });
      if (writeAll(cur)) {
        MobileOpsStore.audit('删除消息', 'messages', id, target.title);
        renderTable();
        Toast.success('消息已删除');
      }
    }
  });
}

/* ---------- 新增 / 编辑 ---------- */
function openEdit(id, mode) {
  document.getElementById('editCat').value = 'notice';
  document.getElementById('editTitleInput').value = '';
  document.getElementById('editContent').value = '';
  document.getElementById('editTarget').value = 'mobile';
  document.getElementById('editEnabled').value = '1';

  // 群发公告：默认分类为「通知」，标题预填
  if (mode === 'bulletin') {
    document.getElementById('editTitle').textContent = '群发公告';
    document.getElementById('editTitleInput').placeholder = '请输入公告标题';
  } else {
    document.getElementById('editTitle').textContent = '新增消息';
    document.getElementById('editTitleInput').placeholder = '请输入滚动栏展示的标题';
  }

  currentEditId = id == null ? null : id;
  if (currentEditId != null) {
    var list = readList();
    var target = null;
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].id) === String(currentEditId)) { target = list[i]; break; }
    }
    if (target) {
      document.getElementById('editTitle').textContent = '编辑消息';
      document.getElementById('editCat').value = target.category || 'notice';
      document.getElementById('editTitleInput').value = target.title || '';
      document.getElementById('editContent').value = target.content || '';
      document.getElementById('editTarget').value = target.target || 'mobile';
      document.getElementById('editEnabled').value = target.enabled === false ? '0' : '1';
      document.getElementById('editTime').value = toLocalInput(target.time);
    }
  } else {
    document.getElementById('editTime').value = toLocalInput('');
  }

  document.getElementById('editModal').classList.add('show');
}

/* datetime-local 输入值：'2026-09-21 09:30' / ISO → '2026-09-21T09:30' */
function toLocalInput(v) {
  if (!v) {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  var s = String(v).replace('T', ' ').slice(0, 16);
  return s.replace(' ', 'T');
}

function closeEdit() {
  document.getElementById('editModal').classList.remove('show');
  currentEditId = null;
}

function submitEdit() {
  var category = document.getElementById('editCat').value;
  var title = document.getElementById('editTitleInput').value.trim();
  var content = document.getElementById('editContent').value.trim();
  var target = document.getElementById('editTarget').value;
  var time = document.getElementById('editTime').value;
  var enabled = document.getElementById('editEnabled').value === '1';

  if (!title) { Toast.warning('请填写消息标题'); return; }
  if (!content) { Toast.warning('请填写消息内容'); return; }
  if (!time) { Toast.warning('请选择发布时间'); return; }

  var list = readList();
  if (currentEditId != null) {
    var hit = null;
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].id) === String(currentEditId)) { hit = list[i]; break; }
    }
    if (!hit) { Toast.error('未找到该消息'); return; }
    hit.category = category;
    hit.title = title;
    hit.content = content;
    hit.target = target;
    hit.time = time;
    hit.enabled = enabled;
    hit.updatedAt = MobileOpsStore.now();
  } else {
    var maxId = 0;
    list.forEach(function (m) {
      var n = Number(m.id);
      if (!isNaN(n) && n > maxId) maxId = n;
    });
    list.push({
      id: maxId + 1,
      category: category,
      title: title,
      content: content,
      time: time,
      target: target,
      enabled: enabled,
      publisher: MobileOpsStore.operatorName(),
      source: 'pc',
      createdAt: MobileOpsStore.now()
    });
  }

  var isEdit = currentEditId != null;
  if (writeAll(list)) {
    MobileOpsStore.audit(isEdit ? '编辑消息' : '发布消息', 'messages', isEdit ? currentEditId : maxId, title);
    closeEdit();
    renderTable();
    Toast.success(isEdit ? '消息已更新，移动端实时生效' : '消息已发布，移动端首页可见');
  }
}

/* ---------- 初始化 ---------- */
document.addEventListener('DOMContentLoaded', function () {
  MobileOpsStore.ready();
  // 严格空库模式：数据一律由后端 API 拉取，不再读 localStorage 或播种演示数据
  loadMessages();
  MobileOpsStore.subscribe(function (key) {
    if (key === MobileOpsStore.KEYS.messages) renderTable();
  });
  var catSelect = document.getElementById('catSelect');
  var editCat = document.getElementById('editCat');
  Object.keys(CATEGORY_TEXT).forEach(function (k) {
    var o1 = document.createElement('option');
    o1.value = k; o1.textContent = CATEGORY_TEXT[k];
    catSelect.appendChild(o1);
    var o2 = document.createElement('option');
    o2.value = k; o2.textContent = CATEGORY_TEXT[k];
    editCat.appendChild(o2);
  });

  // 操作按钮用事件代理绑定，避免把消息 id 拼进 onclick 属性
  document.getElementById('msgBody').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!btn) return;
    var id = btn.getAttribute('data-id');
    var act = btn.getAttribute('data-act');
    if (act === 'edit') openEdit(id);
    else if (act === 'toggle') toggleMsg(id);
    else if (act === 'delete') deleteMsg(id);
  });

  document.getElementById('searchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') renderTable();
  });
});
</script>
