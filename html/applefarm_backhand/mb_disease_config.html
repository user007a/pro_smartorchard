<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/page-content.css">

<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<style>
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
  }
  .stat-label {
    font-size: var(--font-size-sm);
    color: var(--text-tertiary);
    margin-bottom: var(--space-xs);
  }
  .stat-value {
    font-size: 26px;
    font-weight: var(--font-weight-bold);
    color: var(--text-primary);
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .stat-card.is-total .stat-value { color: var(--info); }
  .stat-card.is-active .stat-value { color: var(--success); }
  .stat-card.is-disabled .stat-value { color: var(--text-tertiary); }
  .stat-card.is-danger .stat-value { color: var(--error); }

  .notice-bar {
    padding: 10px 14px;
    background: var(--warning-bg);
    border-left: 3px solid var(--warning);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-size: var(--font-size-sm);
    margin-bottom: var(--space-lg);
    line-height: 1.6;
  }

  .kw-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    background: var(--gray-100);
    color: var(--text-secondary);
    font-family: var(--font-family-mono, monospace);
    font-size: var(--font-size-xs);
    margin-right: 4px;
    margin-bottom: 2px;
  }

  .risk-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    font-size: var(--font-size-xs);
    font-weight: 500;
    white-space: nowrap;
  }
  .risk-tag.high   { background: var(--error-bg);   color: var(--error); }
  .risk-tag.medium { background: var(--warning-bg); color: var(--warning); }
  .risk-tag.low    { background: var(--success-bg); color: var(--success); }

  .enabled-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    font-size: var(--font-size-xs);
    font-weight: 500;
    white-space: nowrap;
  }
  .enabled-tag.on  { background: var(--success-bg); color: var(--success); }
  .enabled-tag.off { background: var(--gray-100);    color: var(--text-tertiary); }

  .cell-sub {
    font-size: var(--font-size-xs);
    color: var(--text-tertiary);
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--bg-card);
    border-radius: 12px;
    width: 92%;
    max-width: 600px;
    max-height: 90vh;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    animation: modalFadeIn 0.2s ease-out;
  }
  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.95) translateY(-20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-default);
  }
  .modal-title { font-size: 16px; font-weight: 600; color: #1f1f1f; }
  .modal-close {
    background: none; border: none; cursor: pointer;
    padding: 4px; font-size: 20px; line-height: 1;
    color: var(--text-tertiary); transition: color 0.2s;
  }
  .modal-close:hover { color: var(--text-secondary); }
  .modal-body {
    padding: 20px;
    overflow-y: auto;
    max-height: calc(90vh - 132px);
  }
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    padding: 16px 20px;
    border-top: 1px solid var(--border-default);
  }
  .modal-field { margin-bottom: var(--space-lg); }
  .modal-field label {
    display: block;
    font-size: var(--font-size-sm);
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: var(--space-sm);
  }
  .modal-field input, .modal-field select, .modal-field textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border-default);
    border-radius: var(--radius-lg);
    font-size: var(--font-size-base);
    font-family: inherit;
    background: var(--bg-card);
  }
  .modal-field textarea {
    min-height: 120px;
    resize: vertical;
    line-height: 1.6;
  }
  .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus {
    border-color: var(--primary-500);
    box-shadow: 0 0 0 4px rgba(24, 144, 255, 0.12);
    outline: none;
  }
  .field-row {
    display: grid;
    grid-template-columns: 1fr 130px 100px;
    gap: var(--space-md);
  }
  .field-hint {
    font-size: var(--font-size-xs);
    color: var(--text-tertiary);
    margin-top: 4px;
  }
  .toggle-switch {
    display: inline-block;
    width: 44px; height: 24px;
    background: var(--gray-200);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toggle-switch::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    left: 2px; top: 2px;
    transition: left 0.2s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .toggle-switch.on { background: var(--success); }
  .toggle-switch.on::after { left: 22px; }
  .empty-state {
    padding: var(--space-2xl) 0;
    text-align: center;
    color: var(--text-tertiary);
    font-size: var(--font-size-sm);
  }
</style>
</head>

  <div class="tab-bar">
    <div class="tab-bar-actions">
      <button class="tab-close-all" title="关闭全部标签">

          <path d="M3 3L11 11M11 3L3 11"/>
        </svg>
      </button>
    </div>
  </div>

  <main class="main-content">
    <nav class="device-tabs" aria-label="移动端运营·智能与知识">
      <a href="mb_ai_config.html">AI助手配置</a>
      <a href="mb_disease_config.html" class="active">识别规则配置</a>
      <a href="mb_fault_knowledge.html">故障知识库</a>
    </nav>
    <div class="page-header">
      <div>
        <div class="page-title">病害识别规则配置</div>
        <div class="page-subtitle">维护移动端「病虫害识别」的病害匹配规则，配置后立即在移动端生效</div>

    <div class="stat-row">

      <div class="stat-card is-active">
        <div class="stat-label">启用中</div>

      </div>
      <div class="stat-card is-disabled">
        <div class="stat-label">已停用</div>

      <div id="emptyHint" class="empty-state" style="display:none;">暂无数据</div>

<div class="modal-overlay" id="ruleModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="ruleModalTitle">新增识别规则</h3>
      <button class="modal-close" onclick="closeRuleModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-field">
        <label>病害名称<span style="color:var(--error);">*</span></label>
        <input id="ruleDiseaseInput" placeholder="例如 苹果腐烂病" maxlength="32">
      </div>
      <div class="modal-field">
        <label>匹配关键字<span style="color:var(--error);">*</span></label>
        <textarea id="ruleKeywordInput" placeholder="多个关键字用空格或英文逗号分隔，文件名中包含任一关键字即命中。例：rot fub 腐烂"
          maxlength="200"></textarea>
      </div>
      <div class="modal-field">
        <div class="field-row">
          <div>
            <label>风险等级<span style="color:var(--error);">*</span></label>
            <select id="ruleRiskInput">
              <option value="high">高风险</option>
              <option value="medium" selected>中风险</option>
              <option value="low">低风险</option>
            </select>
          </div>

            <label>置信度 (%)</label>

          </div>
        </div>
      </div>
      <div class="modal-field">
        <label>防治要点（当前版本暂不保存）</label>
        <textarea id="rulePreventInput" placeholder="每行一条防治要点"

          maxlength="600"></textarea>
      </div>
      <div class="modal-field" style="display:flex;align-items:center;gap:10px;">
        <div class="toggle-switch on" id="ruleEnabledToggle" onclick="toggleEnabled()" role="switch" aria-checked="true"></div>
        <label style="margin:0;">启用此规则</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeRuleModal()">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="submitRule()">保存</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
 * 病害识别规则配置（T13）—— 严格空库模式
 * 数据源：Api.get('mb_disease_rule') -> sf_mb_disease_rule
 *   (id, disease_name, match_keywords, confidence, risk_level, status)
 * 字段映射：
 *   disease <-> disease_name
 *   keyword <-> match_keywords (逗号分隔字符串)
 *   risk    <-> risk_level (high/medium/low <-> 高/中/低)
 *   confidence <-> confidence
 *   enabled <-> status (active/disabled)
 *   防治要点：DB 无对应列，保留输入控件但不入库、不编造
 * 空库显示「暂无数据」，不内置演示记录，不写入 localStorage。
 * ============================================================ */
(function () {
  'use strict';

  var ruleList = [];
  var RISK_TEXT = { high: '高风险', medium: '中风险', low: '低风险' };
  var RISK_TO_DB = { high: '高', medium: '中', low: '低' };
  var RISK_FROM_DB = { '高': 'high', '中': 'medium', '低': 'low',
    high: 'high', medium: 'medium', low: 'low' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function mapRule(r) {
    var kws = String(r.match_keywords || '')
      .split(/[\s,,，]+/)
      .map(function (k) { return k.trim().toLowerCase(); })
      .filter(function (k) { return k.length > 0; });
    var conf = Number(r.confidence);
    if (!isFinite(conf) || conf < 1) conf = 80;
    if (conf > 100) conf = 100;
    return {
      id: String(r.id),
      keyword: kws,
      disease: r.disease_name || '',
      risk: RISK_FROM_DB[r.risk_level] || 'medium',
      confidence: conf,
      prevent: [],
      enabled: r.status !== 'disabled'
    };
  }

  function setTableState(bodyId, emptyId, msg, colspan) {
    var body = document.getElementById(bodyId);
    var empty = document.getElementById(emptyId);
    if (empty) empty.style.display = 'none';
    if (body) body.innerHTML = '<tr><td colspan="' + colspan + '" style="text-align:center;color:var(--text-tertiary);padding:24px 0;">' + esc(msg) + '</td></tr>';
  }

  function loadData() {
    setTableState('ruleBody', 'emptyHint', '加载中...', 6);
    if (!window.Api || !Api.get) {
      setTableState('ruleBody', 'emptyHint', '数据加载失败：Api 未就绪', 6);
      return;
    }
    Api.get('mb_disease_rule', { page: 1, size: 500, sort: 'id', order: 'asc' }).then(function (res) {
      if (!res || !res.ok) {
        setTableState('ruleBody', 'emptyHint', '数据加载失败：' + ((res && res.message) || '请检查登录状态与网络'), 6);
        return;
      }
      ruleList = ((res.data && res.data.list) || []).map(mapRule);
      refreshAll();
    }).catch(function (err) {
      setTableState('ruleBody', 'emptyHint', '数据加载失败：' + ((err && err.message) || '请检查登录状态与网络'), 6);
    });
  }

  function parseKeywordInput(text) {
    return String(text || '')
      .split(/[\s,,，]+/)
      .map(function (k) { return k.trim().toLowerCase(); })
      .filter(function (k) { return k.length > 0; });
  }

  /* ====================== 渲染 ====================== */

  function renderStats(list) {
    var active = 0, disabled = 0, high = 0;
    list.forEach(function (r) {
      if (r.enabled) active++; else disabled++;
      if (r.risk === 'high' && r.enabled) high++;
    });
    document.getElementById('statTotal').textContent = list.length;
    document.getElementById('statActive').textContent = active;
    document.getElementById('statDisabled').textContent = disabled;
    document.getElementById('statHigh').textContent = high;
  }

  function renderTable(list) {
    var body = document.getElementById('ruleBody');
    var empty = document.getElementById('emptyHint');
    if (!list.length) {
      body.innerHTML = '';
      empty.textContent = '暂无数据';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    body.innerHTML = list.map(function (r) {
      var kwHtml = r.keyword.map(function (k) { return '<span class="kw-tag">' + esc(k) + '</span>'; }).join('');
      return '<tr>' +
        '<td>' +
          '<div class="cell-title">' + esc(r.disease) + '</div>' +
          '<div class="cell-sub">防治要点：—</div>' +
        '</td>' +
        '<td><div>' + kwHtml + '</div></td>' +
        '<td><span class="risk-tag ' + esc(r.risk) + '">' + esc(RISK_TEXT[r.risk]) + '</span></td>' +
        '<td class="text-mono">' + esc(r.confidence) + '%</td>' +
        '<td><span class="enabled-tag ' + (r.enabled ? 'on' : 'off') + '">' + (r.enabled ? '启用' : '已停') + '</span></td>' +
        '<td><div class="action-btns">' +
          '<button class="action-btn detail" data-edit-rule="' + esc(r.id) + '">编辑</button>' +
          '<button class="action-btn ' + (r.enabled ? 'warning' : 'success') + '" data-toggle-rule="' + esc(r.id) + '">' + (r.enabled ? '停用' : '启用') + '</button>' +
          '<button class="action-btn danger" data-del-rule="' + esc(r.id) + '">删除</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  function refreshAll() {
    renderStats(ruleList);
    renderTable(ruleList);
  }

  /* ====================== 弹窗 ====================== */
  var editingId = null;
  var pendingEnabled = true;

  function openRuleModal(id) {
    editingId = id || null;
    document.getElementById('ruleModalTitle').textContent = id ? '编辑识别规则' : '新增识别规则';
    document.getElementById('ruleDiseaseInput').value = '';
    document.getElementById('ruleKeywordInput').value = '';
    document.getElementById('ruleRiskInput').value = 'medium';
    document.getElementById('ruleConfInput').value = '85';
    document.getElementById('rulePreventInput').value = '';
    pendingEnabled = true;
    paintToggle();

    if (id) {
      var target = null;
      ruleList.forEach(function (r) { if (r.id === id) target = r; });
      if (!target) { Toast.error('未找到该规则'); return; }
      document.getElementById('ruleDiseaseInput').value = target.disease || '';
      document.getElementById('ruleKeywordInput').value = (target.keyword || []).join(' ');
      document.getElementById('ruleRiskInput').value = target.risk || 'medium';
      document.getElementById('ruleConfInput').value = String(target.confidence || 85);
      document.getElementById('rulePreventInput').value = '';
      pendingEnabled = target.enabled !== false;
      paintToggle();
    }

    document.getElementById('ruleModal').classList.add('show');
  }

  function closeRuleModal() {
    document.getElementById('ruleModal').classList.remove('show');
    editingId = null;
  }

  function toggleEnabled() {
    pendingEnabled = !pendingEnabled;
    paintToggle();
  }

  function paintToggle() {
    var el = document.getElementById('ruleEnabledToggle');
    if (!el) return;
    if (pendingEnabled) { el.classList.add('on'); el.setAttribute('aria-checked', 'true'); }
    else { el.classList.remove('on'); el.setAttribute('aria-checked', 'false'); }
  }

  function submitRule() {
    var disease = (document.getElementById('ruleDiseaseInput').value || '').trim();
    var kwArr = parseKeywordInput(document.getElementById('ruleKeywordInput').value);
    var risk = document.getElementById('ruleRiskInput').value;
    var conf = Number(document.getElementById('ruleConfInput').value);

    if (!disease) { Toast.warning('请填写病害名称'); return; }
    if (!kwArr.length) { Toast.warning('请至少填写一个匹配关键字'); return; }
    if (risk !== 'high' && risk !== 'medium' && risk !== 'low') risk = 'medium';
    if (!isFinite(conf) || conf < 1 || conf > 100) { Toast.warning('置信度需在 1~100 之间'); return; }

    var isEdit = !!editingId;
    var body = {
      disease_name: disease,
      match_keywords: kwArr.join(','),
      risk_level: RISK_TO_DB[risk] || '中',
      confidence: conf,
      status: pendingEnabled ? 'active' : 'disabled'
    };
    var req = isEdit
      ? Api.update('mb_disease_rule', editingId, body)
      : Api.create('mb_disease_rule', body);
    req.then(function (res) {
      if (!res || !res.ok) { Toast.error((res && res.message) || '保存失败'); return; }
      closeRuleModal();
      loadData();
      Toast.success(isEdit ? '规则已更新' : '已新增识别规则');
    }).catch(function (err) { Toast.error((err && err.message) || '保存失败'); });
  }

  function toggleRule(id) {
    var target = null;
    ruleList.forEach(function (r) { if (r.id === id) target = r; });
    if (!target) { Toast.error('未找到该规则'); return; }
    var next = !target.enabled;
    Api.update('mb_disease_rule', id, { status: next ? 'active' : 'disabled' }).then(function (res) {
      if (!res || !res.ok) { Toast.error((res && res.message) || '操作失败'); return; }
      loadData();
      Toast.success('已' + (next ? '启用' : '停用') + '规则');
    }).catch(function (err) { Toast.error((err && err.message) || '操作失败'); });
  }

  function deleteRule(id) {
    var target = null;
    ruleList.forEach(function (r) { if (r.id === id) target = r; });
    if (!target) { Toast.error('未找到该规则'); return; }
    ConfirmDialog.show({
      title: '删除识别规则',
      message: '确认删除「' + (target.disease || id) + '」规则？删除后该病害将无法被命中。',
      onConfirm: function () {
        Api.remove('mb_disease_rule', id).then(function (res) {
          if (!res || !res.ok) { Toast.error((res && res.message) || '删除失败'); return; }
          loadData();
          Toast.success('规则已删除');
        }).catch(function (err) { Toast.error((err && err.message) || '删除失败'); });
      }
    });
  }

  /* ====================== 事件代理 ====================== */
  document.addEventListener('click', function (e) {
    var editEl = e.target.closest && e.target.closest('[data-edit-rule]');
    var togEl  = e.target.closest && e.target.closest('[data-toggle-rule]');
    var delEl  = e.target.closest && e.target.closest('[data-del-rule]');
    if (editEl) openRuleModal(editEl.getAttribute('data-edit-rule'));
    else if (togEl) toggleRule(togEl.getAttribute('data-toggle-rule'));
    else if (delEl) deleteRule(delEl.getAttribute('data-del-rule'));
  });

  document.addEventListener('DOMContentLoaded', function () {
    loadData();
  });

  /* 暴露给内联 onclick */
  window.refreshAll = loadData;
  window.openRuleModal = openRuleModal;
  window.closeRuleModal = closeRuleModal;
  window.submitRule = submitRule;
  window.toggleEnabled = toggleEnabled;
})();
</script>
</body>
</html>
