<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 社区审核</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/page-content.css">
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<style>
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
  }
  .stat-label { font-size: var(--font-size-sm); color: var(--text-tertiary); margin-bottom: var(--space-xs); }
  .stat-value {
    font-size: 26px; font-weight: var(--font-weight-bold);
    color: var(--text-primary); line-height: 1.2; font-variant-numeric: tabular-nums;
  }
  .notice-bar {
    display: flex; align-items: flex-start; gap: var(--space-sm);
    padding: var(--space-md) var(--space-lg);
    background: var(--warning-bg); border: var(--warning-border);
    border: 1px solid var(--warning-border);
    border-radius: var(--radius-lg); font-size: var(--font-size-sm);
    color: var(--text-secondary); margin-bottom: var(--space-lg);
  }
  .notice-bar svg { flex-shrink: 0; margin-top: 2px; color: var(--warning); }
  .author-cell { display: flex; align-items: center; gap: var(--space-md); }
  .author-avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--primary-500), var(--success));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: var(--font-size-sm); font-weight: var(--font-weight-bold);
  }
  .cell-name { font-weight: var(--font-weight-semibold, 600); color: var(--text-primary); }
  .cell-sub { font-size: var(--font-size-xs); color: var(--text-tertiary); }
  .content-cell {
    color: var(--text-secondary); font-size: var(--font-size-sm);
    max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .metric-cell { font-variant-numeric: tabular-nums; }
  .metric-cell.like { color: var(--error); font-weight: var(--font-weight-semibold, 600); }
  .metric-cell.cmt { color: var(--primary-500); font-weight: var(--font-weight-semibold, 600); }
  .detail-block { margin-bottom: var(--space-lg); }
  .detail-label {
    font-size: var(--font-size-sm); color: var(--text-tertiary);
    margin-bottom: var(--space-xs); font-weight: var(--weight-medium, 500);
  }
  .detail-value {
    font-size: var(--font-size-sm); color: var(--text-primary);
    background: var(--gray-50, #fafafa); border: 1px solid var(--border-light);
    border-radius: var(--radius-md); padding: var(--space-md); line-height: 1.7;
    white-space: pre-wrap; word-break: break-all;
  }
  .comment-item {
    border-left: 2px solid var(--primary-500); padding: 8px 12px; margin-bottom: 10px;
    background: var(--gray-50, #fafafa); border-radius: 0 var(--radius-md) var(--radius-md) 0;
  }
  .comment-text { font-size: var(--font-size-sm); color: var(--text-primary); line-height: 1.6; word-break: break-all; }
  .comment-time { font-size: var(--font-size-xs); color: var(--text-tertiary); margin-top: 4px; }
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 1000;
    justify-content: center; align-items: center; backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--bg-card); border-radius: 12px; width: 92%; max-width: 620px;
    max-height: 85vh; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    animation: modalFadeIn 0.2s ease-out;
  }
  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.95) translateY(-20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-bottom: 1px solid var(--border-default);
  }
  .modal-title { font-size: 16px; font-weight: 600; color: #1f1f1f; }
  .modal-close {
    background: none; border: none; cursor: pointer; padding: 4px;
    font-size: 20px; line-height: 1; color: var(--text-tertiary);
  }
  .modal-close:hover { color: var(--text-secondary); }
  .modal-body { padding: 20px; overflow-y: auto; max-height: calc(85vh - 132px); }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 12px;
    padding: 16px 20px; border-top: 1px solid var(--border-default);
  }
  .empty-state { padding: var(--space-2xl) 0; text-align: center; color: var(--text-tertiary); font-size: var(--font-size-sm); }
  .status-tag { display:inline-block;padding:3px 10px;border-radius:99px;font-size:var(--font-size-xs); }
  .status-tag.pending { background:var(--warning-bg);color:var(--warning); }
  .status-tag.approved { background:var(--success-bg);color:var(--success); }
  .status-tag.rejected { background:var(--error-bg);color:var(--error); }
  .post-images { display:flex;gap:6px;margin-top:6px;flex-wrap:wrap; }
  .post-images img { width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--border-light); }
  .search-select { padding:9px 12px;border:1px solid var(--border-default);border-radius:8px;background:var(--bg-card);font-size:var(--font-size-sm); }
</style>
</head>
<body data-active-menu="mall" data-active-submenu="mall-community">

<div class="main-wrapper">
  <div class="tab-bar">
    <div class="tab-bar-actions">
      <button class="tab-close-all" title="关闭全部标签">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3L11 11M11 3L3 11"/>
        </svg>
      </button>
    </div>
  </div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">社区审核</div>
      </div>
      <div class="page-actions">
        <button class="jg-btn" onclick="renderTable()">刷新</button>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">帖子总数</div>
        <div class="stat-value" id="statPosts">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">评论总数</div>
        <div class="stat-value" id="statComments">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">待审核</div>
        <div class="stat-value" id="statPending" style="color:var(--warning);">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">已通过</div>
        <div class="stat-value" id="statApproved">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">今日新增</div>
        <div class="stat-value" id="statToday">0</div>
      </div>
    </div>

    <div class="page-section search-section">
      <div class="search-bar">
        <input type="text" class="search-input" placeholder="搜索作者 / 动态内容..." id="searchInput">
        <select class="search-select" id="statusSelect">
          <option value="">全部状态</option>
          <option value="pending">待审核</option>
          <option value="approved">已通过</option>
          <option value="rejected">已驳回</option>
        </select>
        <div class="search-actions">
          <button class="jg-btn jg-btn-primary" onclick="renderTable()">搜索</button>
          <button class="jg-btn" onclick="resetFilter()">重置</button>
        </div>
      </div>
    </div>

    <div class="page-section data-section">
      <div class="data-table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th class="checkbox-col" style="width:60px;">序号</th>
              <th style="width:110px;">发布时间</th>
              <th style="width:140px;">作者</th>
              <th>动态内容</th>
              <th style="width:100px;">状态</th>
              <th style="width:70px;">点赞数</th>
              <th style="width:70px;">评论数</th>
              <th style="width:230px;">操作</th>
            </tr>
          </thead>
          <tbody id="postBody"></tbody>
        </table>
      </div>
      <div id="emptyHint" class="empty-state" style="display:none;">暂无数据</div>
    </div>
  </main>
</div>

<!-- ===== 详情弹窗 ===== -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title">动态详情</h3>
      <button class="modal-close" onclick="closeDetailModal()">&times;</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeDetailModal()">关闭</button>
    </div>
  </div>
</div>

<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/common-functions.js"></script>
<script src="js/shared/mall-store.js"></script>
<script src="../common/js/api.js"></script>
<!-- 严格空库模式：演示数据播种已停用，数据一律来自后端 API -->
<script>
/* ============================================================
 * 社区审核 —— 严格空库模式
 * 数据源：Api.get('mall_post') -> sf_mall_post
 *   (id, author, content, images, topic, like_count, comment_count,
 *    publish_time, status, audit_by, audit_at, reject_reason)
 * 字段映射：
 *   status 页面 approved <-> DB published（pending/rejected 同名）
 *   likes    <-> like_count ; comments <-> comment_count
 *   评论明细：DB 无明细表，详情列表显示「暂无评论明细」，计数取 comment_count
 * 空库显示「暂无数据」，不写入 localStorage。
 * ============================================================ */
var postList = [];
var dataLoaded = false;
var STATUS_TO_DB = { pending: 'pending', approved: 'published', rejected: 'rejected' };
var STATUS_FROM_DB = { pending: 'pending', published: 'approved', approved: 'approved', rejected: 'rejected' };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function mapPost(r) {
  var imgs = [];
  try { var v = JSON.parse(r.images || '[]'); if (Array.isArray(v)) imgs = v; } catch (e) { imgs = []; }
  var t = r.publish_time || r.created_at || '';
  return {
    id: String(r.id),
    author: r.author || '匿名用户',
    content: r.content || '',
    images: imgs,
    topic: r.topic || '',
    status: STATUS_FROM_DB[r.status] || 'pending',
    time: t,
    auditBy: r.audit_by || '',
    auditAt: r.audit_at || '',
    rejectReason: r.reject_reason || '',
    likes: Number(r.like_count) || 0,
    comments: Number(r.comment_count) || 0,
    ts: new Date(t || 0).getTime() || 0
  };
}

function setTableState(bodyId, emptyId, msg, colspan) {
  var body = document.getElementById(bodyId);
  var empty = document.getElementById(emptyId);
  if (empty) empty.style.display = 'none';
  if (body) body.innerHTML = '<tr><td colspan="' + colspan + '" style="text-align:center;color:var(--text-tertiary);padding:24px 0;">' + esc(msg) + '</td></tr>';
}

function loadData() {
  dataLoaded = false;
  setTableState('postBody', 'emptyHint', '加载中...', 8);
  if (!window.Api || !Api.get) {
    setTableState('postBody', 'emptyHint', '数据加载失败：Api 未就绪', 8);
    return;
  }
  Api.get('mall_post', { page: 1, size: 500, sort: 'id', order: 'desc' }).then(function (res) {
    if (!res || !res.ok) {
      setTableState('postBody', 'emptyHint', '数据加载失败：' + ((res && res.message) || '请检查登录状态与网络'), 8);
      return;
    }
    postList = ((res.data && res.data.list) || []).map(mapPost);
    dataLoaded = true;
    renderTable();
  }).catch(function (err) {
    setTableState('postBody', 'emptyHint', '数据加载失败：' + ((err && err.message) || '请检查登录状态与网络'), 8);
  });
}

function fmtTime(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso).slice(0, 16);
  var p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function todayStr() {
  var d = new Date();
  var p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/* 汇总行：按时间倒序（无法解析时间的排在最后） */
function buildRows() {
  return postList.slice().sort(function (a, b) { return b.ts - a.ts; });
}

function renderStats(rows) {
  var comments = 0, today = 0, pending = 0, approved = 0;
  var t = todayStr();
  rows.forEach(function (r) {
    comments += r.comments;
    if (r.time && fmtTime(r.time).slice(0, 10) === t) today++;
    if (r.status === 'pending') pending++;
    if (r.status === 'approved') approved++;
  });
  document.getElementById('statPosts').textContent = rows.length;
  document.getElementById('statComments').textContent = comments;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statApproved').textContent = approved;
  document.getElementById('statToday').textContent = today;
}

function filteredRows() {
  var kw = document.getElementById('searchInput').value.trim().toLowerCase();
  var status = document.getElementById('statusSelect').value;
  return buildRows().filter(function (r) {
    if (status && r.status !== status) return false;
    if (!kw) return true;
    var hay = ((r.author || '') + ' ' + (r.content || '') + ' ' + (r.id || '')).toLowerCase();
    return hay.indexOf(kw) !== -1;
  });
}

function renderTable() {
  if (!dataLoaded) return;
  var all = buildRows();
  var rows = filteredRows();
  renderStats(all);

  var body = document.getElementById('postBody');
  var emptyHint = document.getElementById('emptyHint');

  if (!rows.length) {
    body.innerHTML = '';
    emptyHint.textContent = all.length ? '未找到匹配的动态' : '暂无数据';
    emptyHint.style.display = 'block';
    return;
  }
  emptyHint.style.display = 'none';

  body.innerHTML = rows.map(function (r, i) {
    var initial = esc((r.author || '我').charAt(0));
    var statusText = { pending: '待审核', approved: '已通过', rejected: '已驳回' }[r.status] || r.status;
    var imagesHtml = r.images.length ? '<div class="post-images">' + r.images.slice(0, 3).map(function (src) {
      return '<img src="' + esc(src) + '" alt="" onerror="this.remove()">';
    }).join('') + '</div>' : '';
    var actions = '<button class="action-btn detail" data-post-detail="' + esc(r.id) + '">查看详情</button>';
    if (r.status === 'pending') {
      actions += '<button class="action-btn download" data-post-review="' + esc(r.id) + '" data-review-status="approved">通过</button>' +
                 '<button class="action-btn delete" data-post-review="' + esc(r.id) + '" data-review-status="rejected">驳回</button>';
    } else if (r.status === 'rejected') {
      actions += '<button class="action-btn download" data-post-review="' + esc(r.id) + '" data-review-status="approved">恢复</button>';
    }
    actions += '<button class="action-btn delete" data-post-del="' + esc(r.id) + '">删除</button>';
    return '<tr>' +
      '<td class="checkbox-col">' + (i + 1) + '</td>' +
      '<td class="text-mono" style="font-size:var(--font-size-xs);">' + esc(fmtTime(r.time)) + '</td>' +
      '<td><div class="author-cell"><div class="author-avatar">' + initial + '</div>' +
          '<div><div class="cell-name">' + esc(r.author) + '</div>' +
          '<div class="cell-sub text-mono">' + esc(r.id) + '</div></div></div></td>' +
      '<td><div class="content-cell" title="' + esc(r.content) + '">' + esc(r.content || '（无内容）') + '</div>' +
          imagesHtml + '</td>' +
      '<td><span class="status-tag ' + esc(r.status) + '">' + statusText + '</span></td>' +
      '<td class="metric-cell like">' + r.likes + '</td>' +
      '<td class="metric-cell cmt">' + r.comments + '</td>' +
      '<td><div class="action-btns">' + actions + '</div></td>' +
    '</tr>';
  }).join('');
}

function resetFilter() {
  document.getElementById('searchInput').value = '';
  document.getElementById('statusSelect').value = '';
  renderTable();
}

function openDetail(id) {
  var r = null;
  var rows = buildRows();
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].id === id) { r = rows[i]; break; }
  }
  if (!r) { Toast.error('未找到该动态'); return; }

  var commentsHtml = '<div style="color:var(--text-tertiary);font-size:var(--font-size-sm);padding:8px 0;">暂无评论明细</div>';
  var statusText = { pending: '待审核', approved: '已通过', rejected: '已驳回' }[r.status] || r.status;
  var imagesHtml = r.images.length ? '<div class="detail-block"><div class="detail-label">动态图片</div><div class="post-images">' +
    r.images.map(function (src) { return '<img src="' + esc(src) + '" alt="" onerror="this.remove()">'; }).join('') + '</div></div>' : '';

  document.getElementById('detailBody').innerHTML =
    '<div class="detail-block"><div class="detail-label">作者</div>' +
      '<div class="detail-value">' + esc(r.author) + '</div></div>' +
    '<div class="detail-block"><div class="detail-label">审核状态</div>' +
      '<div class="detail-value"><span class="status-tag ' + esc(r.status) + '">' + statusText + '</span>' +
      (r.auditBy ? ' · ' + esc(r.auditBy) + ' ' + esc(fmtTime(r.auditAt)) : '') +
      (r.rejectReason ? '<br>驳回原因：' + esc(r.rejectReason) : '') + '</div></div>' +
    '<div class="detail-block"><div class="detail-label">发布时间 / 话题</div>' +
      '<div class="detail-value">' + esc(fmtTime(r.time)) + (r.topic ? ' · #' + esc(r.topic) + '#' : '') + '</div></div>' +
    '<div class="detail-block"><div class="detail-label">动态内容</div>' +
      '<div class="detail-value">' + esc(r.content || '（无内容）') + '</div></div>' +
    imagesHtml +
    '<div class="detail-block"><div class="detail-label">互动数据</div>' +
      '<div class="detail-value">点赞 ' + r.likes + ' 次 · 评论 ' + r.comments + ' 条</div></div>' +
    '<div class="detail-block"><div class="detail-label">评论明细</div>' + commentsHtml + '</div>';

  document.getElementById('detailModal').classList.add('show');
}

function reviewPost(id, status) {
  var reason = '';
  if (status === 'rejected') {
    reason = window.prompt('请填写驳回原因（将展示给内容作者）', '内容不符合社区规范');
    if (reason === null) return;
    reason = reason.trim();
    if (!reason) { Toast.warning('驳回原因不能为空'); return; }
  }
  var body = {
    status: STATUS_TO_DB[status] || status,
    audit_by: '后台管理员',
    audit_at: new Date().toISOString().slice(0, 19).replace('T', ' '),
    reject_reason: status === 'rejected' ? reason : ''
  };
  Api.update('mall_post', id, body).then(function (res) {
    if (!res || !res.ok) { Toast.error((res && res.message) || '审核失败'); return; }
    loadData();
    Toast.success(status === 'approved' ? '动态已通过审核' : '动态已驳回');
  }).catch(function (err) { Toast.error((err && err.message) || '审核失败'); });
}

function closeDetailModal() {
  document.getElementById('detailModal').classList.remove('show');
}

function removePost(id) {
  ConfirmDialog.show({
    title: '删除动态',
    message: '确定删除动态「' + id + '」吗？此操作不可撤销。',
    onConfirm: function () {
      Api.remove('mall_post', id).then(function (res) {
        if (!res || !res.ok) { Toast.error((res && res.message) || '删除失败'); return; }
        loadData();
        Toast.success('动态已删除');
      }).catch(function (err) { Toast.error((err && err.message) || '删除失败'); });
    }
  });
}

/* 事件代理 */
document.addEventListener('click', function (e) {
  var d = e.target.closest && e.target.closest('[data-post-detail]');
  var rev = e.target.closest && e.target.closest('[data-post-review]');
  var del = e.target.closest && e.target.closest('[data-post-del]');
  if (d) openDetail(d.getAttribute('data-post-detail'));
  else if (rev) reviewPost(rev.getAttribute('data-post-review'), rev.getAttribute('data-review-status'));
  else if (del) removePost(del.getAttribute('data-post-del'));
});

document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('searchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') renderTable();
  });
  loadData();
});
</script>
</body>
</html>
