<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">

<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition:all 0.2s ease;
  }
  .module-card:hover {
    background:var(--bg-hover);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }

  /* 弹窗遮罩层 */
  .modal-overlay {
    display:none;
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0, 0, 0, 0.5);
    z-index:1000;
    align-items:center;
    justify-content:center;
  }
  .modal-overlay.show {
    display:flex;
  }

  /* 弹窗内容 */
  .modal-content {
    background:var(--bg-card);
    border-radius:16px;
    width:90%;
    max-width:600px;
    max-height:80vh;
    overflow-y:auto;
    box-shadow:0 20px 60px rgba(0, 0, 0, 0.2);
    animation:modalFadeIn 0.3s ease;
  }

  @keyframes modalFadeIn {
    from {
      opacity:0;
      transform:scale(0.95);
    }
    to {
      opacity:1;
      transform:scale(1);
    }
  }

  /* 弹窗头部 */
  .modal-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 24px;
    border-bottom:1px solid var(--border-light);
    position:sticky;
    top:0;
    background:var(--bg-card);
  }
  .modal-title {
    font-size:18px;
    font-weight:600;
    color:var(--text-primary);
  }
  .modal-close {
    width:32px;
    height:32px;
    border-radius:50%;
    border:none;
    background:var(--gray-100);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.2s ease;
  }
  .modal-close:hover {
    background:var(--gray-200);
  }

  /* 弹窗主体 */
  .modal-body {
    padding:24px;
  }

  /* 详情信息卡片 */
  .detail-grid {
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:16px;
  }
  .detail-item {
    background:var(--gray-50);
    padding:14px 16px;
    border-radius:10px;
  }
  .detail-label {
    font-size:12px;
    color:var(--text-tertiary);
    margin-bottom:4px;
  }
  .detail-value {
    font-size:16px;
    font-weight:600;
    color:var(--text-primary);
  }

  /* 详情按钮 */
  .detail-btn {
    color:var(--primary-500);
    text-decoration:none;
    font-size:13px;
    padding:4px 10px;
    border-radius:6px;
    transition:background 0.2s ease;
    cursor:pointer;
  }
  .detail-btn:hover {
    background:var(--primary-50);
  }

  /* 排行榜名次徽标：金/银/铜三档（沿用 design-system 的 warning / gray 色阶） */
  .rank-badge {
    display:inline-block;
    padding:2px 8px;
    border-radius:12px;
    font-size:12px;
    font-weight:700;
  }
  .rank-badge.gold   { background:var(--warning-light); color:#ad8b00; border:1px solid var(--warning-border); }
  .rank-badge.silver { background:var(--gray-100); color:var(--gray-700); border:1px solid var(--gray-300); }
  .rank-badge.bronze { background:var(--gray-50); color:#8c5a2b; border:1px solid var(--gray-300); }

  /* 利润率：达标绿色、临界橙色 */
  .rate-good { color:var(--success); }
  .rate-warn { color:var(--warning); }
</style>

<script>
/* 严格空库模式：地块详情来自真实接口 plot_profit，不再内置示例详情对象 */
var plotDetails = {};   // id -> 真实地块经营记录
var reportRows = [];    // 真实排行数据

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function setText(id, text) {
  var node = document.getElementById(id);
  if (node) node.textContent = text;
}
function num(v) {
  if (v === null || v === undefined || v === '') return 0;
  var n = Number(v);
  return isNaN(n) ? 0 : n;
}
function fmtMoney(n) { return '¥ ' + Math.round(n).toLocaleString('en-US'); }
function setChartEmpty(id, text) {
  var box = document.getElementById(id);
  if (box) box.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-tertiary);font-size:13px;">' + esc(text) + '</div>';
}
function clearChart(id) {
  var box = document.getElementById(id);
  if (box) box.innerHTML = '';
}

/* 地块效益详情：字段来自真实 plot_profit，表无对应字段的显示 — */
function showDetail(id) {
  var r = plotDetails[String(id)];
  if (!r) return;
  document.getElementById('modal-title').textContent = (r.base_name || ('地块' + id)) + ' - 效益详情';
  setText('detail-variety', r.variety || '—');
  setText('detail-area', r.area == null ? '—' : r.area + ' 亩');
  setText('detail-yield', r.yield == null ? '—' : r.yield + ' 吨');
  setText('detail-cost', r.cost == null ? '—' : fmtMoney(num(r.cost)));
  setText('detail-revenue', r.revenue == null ? '—' : fmtMoney(num(r.revenue)));
  setText('detail-profit', r.profit == null ? '—' : fmtMoney(num(r.profit)));
  setText('detail-profit-rate', r.rate == null ? '—' : r.rate + '%');
  setText('detail-unit-price', '—');
  setText('detail-planting-year', '—');
  setText('detail-tree-count', r.tree_count == null ? '—' : r.tree_count + ' 棵');
  setText('detail-average-age', '—');
  setText('detail-manager', '—');
  document.getElementById('detail-modal').classList.add('show');
}

function closeModal() {
  document.getElementById('detail-modal').classList.remove('show');
}

/* 导出：内容基于真实地块经营记录，不再读 localStorage 或写死产值 */
function exportReport(format) {
  if (!reportRows.length) {
    if (typeof Toast !== 'undefined') Toast.success('暂无数据可导出');
    else alert('暂无数据可导出');
    return;
  }
  var header = '地块,品种,面积(亩),产量(吨),收入(元),成本(元),利润(元),利润率';
  var lines = reportRows.map(function (r) {
    return [r.base_name || ('地块' + r.plot_id), r.variety || '', r.area, r.yield, r.revenue, r.cost, r.profit, r.rate]
      .map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
  });
  var csv = [header].concat(lines).join('\n');
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '报表总览_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  if (typeof Toast !== 'undefined') Toast.success('报表已导出（' + format + '）');
}

/* 兼容旧调用：重新从真实接口取数 */
function loadReportData() { loadData(); }

function showEmpty(text) {
  ['kpiRevenue', 'kpiCost', 'kpiProfit', 'kpiRate'].forEach(function (id) { setText(id, '—'); });
  ['kpiRevenueSub', 'kpiCostSub', 'kpiProfitSub', 'kpiRateSub'].forEach(function (id) { setText(id, text); });
  document.getElementById('rankBody').innerHTML = '<tr><td colspan="12" style="text-align:center;color:var(--text-tertiary);padding:32px;">' + esc(text) + '</td></tr>';
  ['chart-revenue-trend', 'chart-cost-pie', 'chart-revenue-bar'].forEach(function (id) { setChartEmpty(id, text); });
}

function renderKpi(rows) {
  var revenue = 0, cost = 0, profit = 0;
  rows.forEach(function (r) { revenue += num(r.revenue); cost += num(r.cost); profit += num(r.profit); });
  setText('kpiRevenue', fmtMoney(revenue));
  setText('kpiCost', fmtMoney(cost));
  setText('kpiProfit', fmtMoney(profit));
  setText('kpiRate', revenue ? (profit / revenue * 100).toFixed(1) + '%' : '—');
  ['kpiRevenueSub', 'kpiCostSub', 'kpiProfitSub', 'kpiRateSub'].forEach(function (id) {
    setText(id, '基于 ' + rows.length + ' 条地块经营记录');
  });
}

function renderRank(rows) {
  var body = document.getElementById('rankBody');
  var sorted = rows.slice().sort(function (a, b) { return num(b.profit) - num(a.profit); });
  if (!sorted.length) {
    body.innerHTML = '<tr><td colspan="12" style="text-align:center;color:var(--text-tertiary);padding:32px;">暂无数据</td></tr>';
    return;
  }
  var html = sorted.map(function (r, i) {
    var badge = i < 3 ? '<span class="rank-badge ' + ['gold', 'silver', 'bronze'][i] + '">' + (i + 1) + '</span>' : String(i + 1);
    var rateCls = num(r.rate) >= 40 ? 'rate-good' : 'rate-warn';
    return '<tr>' +
      '<td>' + badge + '</td>' +
      '<td>' + esc(r.plot_id == null ? '—' : r.plot_id) + '</td>' +
      '<td>' + esc(r.base_name || '—') + '</td>' +
      '<td>' + esc(r.variety || '—') + '</td>' +
      '<td>' + esc(r.area == null ? '—' : r.area) + '</td>' +
      '<td>' + esc(r.tree_count == null ? '—' : r.tree_count) + '</td>' +
      '<td>' + esc(r.yield == null ? '—' : r.yield) + '</td>' +
      '<td>' + esc(r.revenue == null ? '—' : r.revenue) + '</td>' +
      '<td>' + esc(r.cost == null ? '—' : r.cost) + '</td>' +
      '<td>' + esc(r.profit == null ? '—' : r.profit) + '</td>' +
      '<td><span class="' + rateCls + '">' + esc(r.rate == null ? '—' : r.rate + '%') + '</span></td>' +
      '<td><span class="detail-btn" onclick="showDetail(\'' + esc(String(r.id)) + '\')">详情</span></td>' +
    '</tr>';
  }).join('');
  var totalYield = 0, totalRevenue = 0, totalCost = 0, totalProfit = 0, totalTrees = 0;
  sorted.forEach(function (r) {
    totalYield += num(r.yield); totalRevenue += num(r.revenue); totalCost += num(r.cost);
    totalProfit += num(r.profit); totalTrees += num(r.tree_count);
  });
  html += '<tr style="background:var(--gray-50);font-weight:600;">' +
    '<td colspan="6">合计（' + sorted.length + ' 个地块 / ' + totalTrees + ' 棵）</td>' +
    '<td>' + totalYield + '</td><td>' + totalRevenue + '</td><td>' + totalCost + '</td>' +
    '<td>' + totalProfit + '</td><td>' + (totalRevenue ? (totalProfit / totalRevenue * 100).toFixed(1) + '%' : '—') + '</td><td></td>' +
  '</tr>';
  body.innerHTML = html;
}

function renderCharts(rows, costItems) {
  /* 收入趋势：按财年聚合真实收入 */
  var byYear = {};
  rows.forEach(function (r) {
    var y = String(r.fiscal_year || '未标注');
    byYear[y] = (byYear[y] || 0) + num(r.revenue);
  });
  var years = Object.keys(byYear).sort();
  if (!years.length) setChartEmpty('chart-revenue-trend', '暂无数据');
  else {
    clearChart('chart-revenue-trend');
    Chart.line('#chart-revenue-trend', {
      categories: years,
      series: [{ name: '收入', data: years.map(function (y) { return byYear[y]; }), color: '#1890ff', area: true }]
    });
  }
  /* 成本构成：按真实成本科目聚合 */
  if (!costItems.length) setChartEmpty('chart-cost-pie', '暂无数据');
  else {
    clearChart('chart-cost-pie');
    Chart.donut('#chart-cost-pie', {
      series: costItems.map(function (c) { return { name: c.cost_name || '', value: num(c.amount) }; })
    });
  }
  /* 收入构成：按品种聚合真实收入 */
  var byVariety = {};
  rows.forEach(function (r) {
    var k = r.variety || '未标注';
    byVariety[k] = (byVariety[k] || 0) + num(r.revenue);
  });
  var varieties = Object.keys(byVariety);
  if (!varieties.length) setChartEmpty('chart-revenue-bar', '暂无数据');
  else {
    clearChart('chart-revenue-bar');
    Chart.bar('#chart-revenue-bar', {
      categories: varieties,
      series: [{ name: '收入(元)', data: varieties.map(function (k) { return byVariety[k]; }), color: '#1890ff' }]
    });
  }
}

function loadData() {
  showEmpty('加载中...');
  Promise.all([
    Api.get('plot_profit', { page: 1, size: 500 }),
    Api.get('cost_item', { page: 1, size: 500, sort: 'sort_order', order: 'asc' })
  ]).then(function (res) {
    var pr = res[0], cr = res[1];
    if (!pr || !pr.ok || !cr || !cr.ok) {
      showEmpty('数据加载失败：' + ((pr && pr.message) || (cr && cr.message) || '请检查登录状态与网络'));
      return;
    }
    var rows = (pr.data && pr.data.list) || [];
    var costItems = (cr.data && cr.data.list) || [];
    reportRows = rows;
    plotDetails = {};
    rows.forEach(function (r) { plotDetails[String(r.id)] = r; });
    if (!rows.length) { showEmpty('暂无数据'); return; }
    renderKpi(rows);
    renderRank(rows);
    renderCharts(rows, costItems);
  }).catch(function (err) {
    showEmpty('数据加载失败：' + (err && err.message ? err.message : '网络异常'));
  });
}

document.addEventListener('DOMContentLoaded', function() {
  loadData();
  // 点击遮罩层关闭弹窗
  document.getElementById('detail-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
});
</script>
