<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 农资使用</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .usage-stats {
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:16px;
    margin-bottom:var(--space-xl);
  }
  .usage-stat-card {
    background:var(--bg-card);
    border-radius:12px;
    padding:16px;
    box-shadow:0 1px 3px rgba(16,24,40,0.06);
    border:1px solid rgba(0,0,0,0.06);
    transition:all 0.25s ease;
    position:relative;
    overflow:hidden;
  }
  /* 左侧渐变竖条已按全后台扁平风移除（2026-09-22） */
  .usage-stat-card:hover {
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(24,144,255,0.12);
  }
  .stat-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:var(--space-md);
  }
  .stat-icon {
    width:36px;
    height:36px;
    border-radius:var(--radius-sm);
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--primary-50);
    color:var(--primary-500);
    font-size:16px;
  }
  .stat-label {
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
    font-weight:var(--font-weight-medium);
  }
  /* 数值统一深色实心（取消渐变裁剪文字，与全后台扁平风一致） */
  .stat-value {
    font-size:22px;
    font-weight:var(--font-weight-bold);
    line-height:1.2;
    color:var(--text-primary);
    background:none;
    -webkit-background-clip:border-box;
    background-clip:border-box;
    -webkit-text-fill-color:var(--text-primary);
    margin-bottom:var(--space-xs);
  }
  .stat-unit {
    font-size:var(--font-size-sm);
    font-weight:var(--font-weight-normal);
    color:var(--text-tertiary);
  }
  .search-section {
    display:flex;
    gap:12px;
    align-items:center;
    padding:16px 20px;
    background:var(--bg-card);
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0, 0, 0, 0.06);
    margin-bottom:16px;
  }
  .search-select {
    padding:10px 16px;
    border:1px solid var(--border-default);
    border-radius:6px;
    font-size:14px;
    color:var(--text-primary);
    min-width:140px;
  }
  .search-input {
    flex:1;
    padding:10px 16px;
    border:1px solid var(--border-default);
    border-radius:6px;
    font-size:14px;
  }
  .search-input:focus, .search-select:focus {
    outline:none;
    border-color:var(--border-primary);
    box-shadow:0 0 0 2px rgba(24, 144, 255, 0.1);
  }
  .action-bar {
    display:flex;
    justify-content:flex-end;
    margin-bottom:16px;
  }
  .data-section {
    background:var(--bg-card);
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0, 0, 0, 0.06);
    overflow:hidden;
  }
  .data-table {
    width:100%;
    border-collapse:collapse;
  }
  .data-table th, .data-table td {
    padding:12px 16px;
    text-align:left;
    border-bottom:1px solid var(--border-light);
  }
  .data-table th {
    background:var(--gray-50);
    font-weight:600;
    color:var(--text-secondary);
    font-size:13px;
  }
  .data-table tr:hover {
    background:var(--gray-50);
  }
  .checkbox-col {
    width:40px;
  }
  .status-tag {
    display:inline-block;
    padding:4px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:500;
  }
  .status-tag.approved {
    background:var(--info-bg);
    color:var(--primary-500);
  }
  .status-tag.pending {
    background:var(--warning-bg);
    color:var(--warning);
  }
  .action-btns {
    display:flex;
    gap:8px;
  }
  .action-btn {
    padding:5px 12px;
    border:none;
    border-radius:4px;
    font-size:12px;
    cursor:pointer;
    transition:all 0.2s;
  }
  .action-btn.detail {
    background:var(--success-bg);
    color:var(--primary-500);
  }
  .action-btn.detail:hover {
    background:#c8e6c9;
  }
  .action-btn.approve {
    background:var(--info-bg);
    color:var(--primary-500);
  }
  .action-btn.approve:hover {
    background:#b3d8f0;
  }
  .action-btn.reject {
    background:var(--error-bg);
    color:var(--error);
  }
  .action-btn.reject:hover {
    background:#ffccc7;
  }
  .pagination {
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    gap:8px;
    border-top:1px solid var(--border-light);
  }
  .page-btn {
    width:36px;
    height:36px;
    border:1px solid var(--border-default);
    background:var(--bg-card);
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
    transition:all 0.2s;
  }
  .page-btn:hover:not(.disabled) {
    background:var(--gray-100);
    border-color:var(--border-primary);
  }
  .page-btn.active {
    background:var(--primary-500);
    color:white;
    border-color:var(--border-primary);
  }
  .pagination-input {
    width:50px;
    padding:4px 8px;
    border:1px solid var(--border-default);
    border-radius:4px;
    text-align:center;
    font-size:14px;
  }
  .pagination-input:focus {
    outline:none;
    border-color:var(--border-primary);
  }
  .modal-overlay {
    display:none;
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0, 0, 0, 0.5);
    z-index:1000;
    align-items:center;
    justify-content:center;
  }
  .modal-overlay.show {
    display:flex;
  }
  .modal-container {
    background:var(--bg-card);
    border-radius:10px;
    width:90%;
    max-width:600px;
    max-height:90vh;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0, 0, 0, 0.2);
  }
  .modal-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 20px;
    border-bottom:1px solid var(--border-light);
  }
  .modal-title {
    font-size:18px;
    font-weight:600;
    color:var(--text-primary);
  }
  .modal-close {
    background:none;
    border:none;
    cursor:pointer;
    color:var(--text-tertiary);
    padding:4px;
  }
  .modal-close:hover {
    color:var(--text-secondary);
  }
  .modal-body {
    padding:20px;
    max-height:60vh;
    overflow-y:auto;
  }
  .modal-footer {
    display:flex;
    justify-content:flex-end;
    gap:12px;
    padding:16px 20px;
    border-top:1px solid var(--border-light);
    background:var(--gray-50);
  }
  .form-row {
    display:flex;
    gap:20px;
    margin-bottom:16px;
  }
  .form-item {
    flex:1;
  }
  .form-item label {
    display:block;
    margin-bottom:6px;
    font-size:14px;
    font-weight:500;
    color:var(--text-primary);
  }
  .form-item input, .form-item select, .form-item textarea {
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border-default);
    border-radius:6px;
    font-size:14px;
    box-sizing:border-box;
  }
  .form-item textarea {
    min-height:80px;
    resize:vertical;
  }
  .form-item input:focus, .form-item select:focus, .form-item textarea:focus {
    outline:none;
    border-color:var(--border-primary);
  }
  .detail-content {
    padding:10px 0;
  }
  .detail-row {
    display:flex;
    padding:12px 0;
    border-bottom:1px solid var(--border-light);
  }
  .detail-label {
    width:120px;
    font-weight:500;
    color:var(--text-secondary);
    font-size:14px;
  }
  .detail-value {
    flex:1;
    color:var(--text-primary);
    font-size:14px;
  }
  .export-options {
    padding:10px 0;
  }
  .export-option {
    display:flex;
    align-items:center;
    padding:12px;
    border:1px solid var(--border-default);
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
    transition:all 0.2s;
  }
  .export-option:hover {
    border-color:var(--border-primary);
    background:var(--success-bg);
  }
  .export-option.selected {
    border-color:var(--border-primary);
    background:var(--success-bg);
  }
  .export-option input[type="radio"] {
    margin-right:12px;
    width:18px;
    height:18px;
  }
  .export-option .option-text {
    font-size:14px;
    color:var(--text-primary);
  }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="material" data-active-submenu="material-usage">

<!-- 导出弹窗 -->
<div class="modal-overlay" id="exportModal">
  <div class="modal-container">
    <div class="modal-header">
      <h3 class="modal-title">导出使用记录</h3>
      <button class="modal-close" onclick="closeExportModal()">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
          <path d="M5 5L13 13M13 5L5 13"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="export-options">
        <div class="export-option" onclick="selectExportFormat('excel')">
          <input type="radio" name="exportFormat" id="formatExcel" value="excel" checked>
          <span class="option-text">Excel格式 (.xlsx)</span>
        </div>
        <div class="export-option" onclick="selectExportFormat('csv')">
          <input type="radio" name="exportFormat" id="formatCsv" value="csv">
          <span class="option-text">CSV格式 (.csv)</span>
        </div>
        <div class="export-option" onclick="selectExportFormat('pdf')">
          <input type="radio" name="exportFormat" id="formatPdf" value="pdf">
          <span class="option-text">PDF格式 (.pdf)</span>
        </div>
      </div>
      <div style="margin-top:16px;">
        <label style="display:block;margin-bottom:8px;font-size:14px;font-weight:500;">导出范围</label>
        <label style="display:block;margin-bottom:8px;font-size:13px;">
          <input type="radio" name="exportRange" value="all" checked> 全部记录
        </label>
        <label style="display:block;font-size:13px;">
          <input type="radio" name="exportRange" value="current"> 当前页记录
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn-outline" onclick="closeExportModal()">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="confirmExport()">导出</button>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->

        <div class="detail-row">

        <div class="detail-row">

    </div>
    <div class="modal-footer">
      <button class="jg-btn jg-btn-primary" onclick="closeDetailModal()">关闭</button>
    </div>
  </div>
</div>

  {"id":"U-023","name":"土壤改良剂","type":"fertilizer","spec":"25kg/袋","quantity":"6袋","time":"2024-04-28 14:00","operator":"孙技术员","task":"土壤改良计划","plot":"D区05地块","status":"pending","statusText":"待审核","remark":"改良土壤结构"}
];

let currentPage = 1;
const pageSize = 10;
let totalItems = usageData.length;
let totalPages = Math.ceil(totalItems / pageSize);
let filteredData = [...usageData];

const exportModal = document.getElementById('exportModal');
const detailModal = document.getElementById('detailModal');
const tableBody = document.getElementById('tableBody');
const pagination = document.getElementById('pagination');
const searchInput = document.getElementById('searchInput');
const materialSelect = document.getElementById('materialSelect');

function init() {
  renderTable();
  renderPagination();
}

function renderTable() {
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageData = filteredData.slice(start, end);
  
  tableBody.innerHTML = pageData.map((item, __seq) => `
    <tr>
      <td class="checkbox-col">${__seq + 1}</td>
      <td><strong>${item.name}</strong></td>
      <td>${item.spec}</td>
      <td class="text-right">${item.quantity}</td>
      <td>${item.time}</td>
      <td>${item.operator}</td>
      <td>${item.task}</td>
      <td>${item.plot}</td>
      <td><span class="status-tag ${item.status}">${item.statusText}</span></td>
      <td>
        <div class="action-btns">
          <button class="action-btn detail" onclick="viewDetail('${item.id}')">详情</button>
          ${item.status === 'pending' ? `
          <button class="action-btn approve" onclick="approveUsage('${item.id}')">审核通过</button>
          <button class="action-btn reject" onclick="rejectUsage('${item.id}')">拒绝</button>
          ` : ''}
        </div>
      </td>
    </tr>
  `).join('');
}

function renderPagination() {
  pagination.innerHTML = `
    <button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="prevPage()">‹</button>
    ${Array.from({length: Math.min(5, totalPages)}, (_, i) => {
      let pageNum;
      if (totalPages <= 5) {
        pageNum = i + 1;
      } else if (currentPage <= 3) {
        pageNum = i + 1;
      } else if (currentPage >= totalPages - 2) {
        pageNum = totalPages - 4 + i;
      } else {
        pageNum = currentPage - 2 + i;
      }
      return `<button class="page-btn ${currentPage === pageNum ? 'active' : ''}" onclick="goToPage(${pageNum})">${pageNum}</button>`;
    }).join('')}
    <button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="nextPage()">›</button>
    <span style="margin-left:16px;font-size:13px;color:var(--text-tertiary);">第 <input type="number" class="pagination-input" id="pageInput" value="${currentPage}" min="1" max="${totalPages}" onkeydown="if(event.keyCode===13)jumpToPage()"> 页 / 共 ${totalPages} 页，共 ${totalItems} 条记录</span>
    <button class="jg-btn-outline" style="margin-left:12px;padding:2px 8px;font-size:12px;" onclick="jumpToPage()">跳转</button>
  `;
}

function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    renderTable();
    renderPagination();
  }
}

function nextPage() {
  if (currentPage < totalPages) {
    currentPage++;
    renderTable();
    renderPagination();
  }
}

function goToPage(page) {
  if (page >= 1 && page <= totalPages) {
    currentPage = page;
    renderTable();
    renderPagination();
  }
}

function jumpToPage() {
  const pageInput = document.getElementById('pageInput');
  const page = parseInt(pageInput.value);
  if (!isNaN(page) && page >= 1 && page <= totalPages) {
    currentPage = page;
    renderTable();
    renderPagination();
  } else {
    pageInput.value = currentPage;
  }
}

function search() {
  const keyword = searchInput.value.toLowerCase().trim();
  const type = materialSelect.value;
  
  filteredData = usageData.filter(item => {
    let match = true;
    
    if (keyword) {
      match = match && (item.name.toLowerCase().includes(keyword) || 
                        item.task.toLowerCase().includes(keyword) ||
                        item.operator.toLowerCase().includes(keyword));
    }
    if (type) {
      match = match && item.type === type;
    }
    
    return match;
  });
  
  totalItems = filteredData.length;
  totalPages = Math.ceil(totalItems / pageSize);
  currentPage = 1;
  
  renderTable();
  renderPagination();
}

function toggleSelectAll() {
  const checkboxes = document.querySelectorAll('input[name="record"]');
  const selectAll = document.getElementById('selectAll');
  checkboxes.forEach(cb => cb.checked = selectAll.checked);
}

function openExportModal() {
  exportModal.classList.add('show');
}

function closeExportModal() {
  exportModal.classList.remove('show');
}

function selectExportFormat(format) {
  document.querySelector(`input[value="${format}"]`).checked = true;
}

function confirmExport() {
  const format = document.querySelector('input[name="exportFormat"]:checked').value;
  const range = document.querySelector('input[name="exportRange"]:checked').value;
  
  let dataToExport = range === 'all' ? filteredData : filteredData.slice((currentPage - 1) * pageSize, currentPage * pageSize);
  
  alert(`正在导出${dataToExport.length}条记录，格式：${format.toUpperCase()}...\n\n导出成功！`);
  closeExportModal();
}

function viewDetail(id) {
  const item = usageData.find(u => u.id === id);
  if (item) {
    document.getElementById('detailId').textContent = item.id;
    document.getElementById('detailName').textContent = item.name;
    document.getElementById('detailSpec').textContent = item.spec;
    document.getElementById('detailQuantity').textContent = item.quantity;
    document.getElementById('detailTime').textContent = item.time;
    document.getElementById('detailOperator').textContent = item.operator;
    document.getElementById('detailTask').textContent = item.task;
    document.getElementById('detailPlot').textContent = item.plot;
    document.getElementById('detailStatus').innerHTML = `<span class="status-tag ${item.status}">${item.statusText}</span>`;
    document.getElementById('detailRemark').textContent = item.remark || '-';
    detailModal.classList.add('show');
  }
}

function closeDetailModal() {
  detailModal.classList.remove('show');
}

function approveUsage(id) {
  const item = usageData.find(u => u.id === id);
  if (item && item.status === 'pending') {
    item.status = 'approved';
    item.statusText = '已审核';
    alert(`记录 ${item.id} 已审核通过`);
    search();
  }
}

function rejectUsage(id) {
  if (confirm('确定要拒绝这条使用记录吗？')) {
    const item = usageData.find(u => u.id === id);
    if (item) {
      item.status = 'rejected';
      item.statusText = '已拒绝';
      alert(`记录 ${item.id} 已被拒绝`);
      search();
    }
  }
}

init();
</script>
