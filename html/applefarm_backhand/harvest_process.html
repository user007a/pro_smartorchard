// 当前操作批次
let currentBatchId = '';

// 状态标签
function getStatusTag(status) {
  const statusMap = {
    'grading':   '<span class="status-tag processing">分级中</span>',
    'packaging': '<span class="status-tag processing">包装中</span>',
    'stored':    '<span class="status-tag stored">已入库</span>',
    'exported':  '<span class="status-tag exported">已出库</span>',
    'abnormal':  '<span class="status-tag abnormal">异常</span>'
  };
  return statusMap[status] || statusMap['stored'];
}

const STATUS_NAME = {
  'grading': '分级中', 'packaging': '包装中', 'stored': '已入库', 'exported': '已出库', 'abnormal': '异常'
};

// 渲染表格行（操作按钮按状态流转显示）
function renderRow(item, index) {
  let actions = `<button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>`;
  if (['grading', 'packaging', 'abnormal'].includes(item.status)) {
    actions += `<button class="action-btn edit" onclick="showStandard('${item.id}')">标准处理</button>`;
  }
  if (['grading', 'packaging'].includes(item.status)) {
    actions += `<button class="action-btn edit" onclick="showInbound('${item.id}')">入库</button>`;
  }
  if (item.status === 'stored') {
    actions += `<button class="action-btn edit" onclick="showOutbound('${item.id}')">出库</button>`;
  }

  return `<tr>
    <td>${index + 1}</td>
    <td><strong>${item.id}</strong></td>
    <td>${item.batchNo}</td>
    <td>${item.plot}</td>
    <td>${item.grade}</td>
    <td class="text-right">${item.quantity.toLocaleString()}</td>
    <td>${getStatusTag(item.status)}</td>
    <td>${item.time}</td>
    <td>${item.operator}</td>
    <td><div class="action-btns">${actions}</div></td>
  </tr>`;
}

// 搜索：状态 + 关键词
function handleSearch() {
  var status = document.getElementById('statusSelect').value;
  var keyword = document.getElementById('searchInput').value.trim().toLowerCase();

  var filteredData = processBatches.filter(item => {
    if (status && item.status !== status) return false;
    if (keyword && !item.id.toLowerCase().includes(keyword) && !item.plot.toLowerCase().includes(keyword)) return false;
    return true;
  });

  Pagination.updateData(filteredData);
  Toast.info('找到 ' + filteredData.length + ' 条记录');
}

function findBatch(id) {
  return processBatches.find(b => b.id === id);
}

// 详情（按行回填）
function showDetail(id) {
  const item = findBatch(id);
  if (!item) return;
  document.getElementById('detail-id').textContent = item.id;
  document.getElementById('detail-record').textContent = item.record || '-';
  document.getElementById('detail-plot').textContent = item.plot;
  document.getElementById('detail-grade').textContent = item.grade;
  document.getElementById('detail-quantity').textContent = item.quantity.toLocaleString() + ' kg';
  document.getElementById('detail-status').innerHTML = getStatusTag(item.status);
  document.getElementById('detail-location').textContent = item.location || '-';
  document.getElementById('detail-time').textContent = item.time;
  document.getElementById('detail-operator').textContent = item.operator;
  document.getElementById('detail-remark').textContent = item.remark || '-';
  Modal.show('modal-detail');
}

// 标准处理
function showStandard(id) {
  const item = findBatch(id);
  if (!item) return;
  currentBatchId = id;
  document.getElementById('std-id').value = item.id;
  document.getElementById('std-type').value = 'grading';
  document.getElementById('std-result').value = 'pass';
  document.getElementById('std-remark').value = '';
  Modal.show('modal-standard');
}

function submitStandard() {
  const item = findBatch(currentBatchId);
  if (item) {
    const result = document.getElementById('std-result').value;
    const type = document.getElementById('std-type').value;
    if (result === 'discard') {
      item.status = 'abnormal';
    } else if (result === 'pass') {
      if (type === 'grading') item.status = 'grading';
      else if (type === 'packaging' || type === 'cleaning') item.status = 'packaging';
      else if (type === 'storage') item.status = 'stored';
    }
    item.time = formatNow();
    item.remark = document.getElementById('std-remark').value || item.remark;
  }
  Modal.hide('modal-standard');
  handleSearch();
  Toast.success('处理完成');
}

// 入库
function showInbound(id) {
  const item = findBatch(id);
  if (!item) return;
  currentBatchId = id;
  document.getElementById('in-id').value = item.id;
  document.getElementById('in-quantity').value = item.quantity;
  document.getElementById('in-time').value = toLocalInput(new Date());
  document.getElementById('in-location').value = '';
  Modal.show('modal-inbound');
}

function submitInbound() {
  const item = findBatch(currentBatchId);
  if (item) {
    item.status = 'stored';
    item.time = formatNow();
    item.location = document.getElementById('in-location').value || item.location;
  }
  Modal.hide('modal-inbound');
  handleSearch();
  Toast.success('入库成功');
}

// 出库
function showOutbound(id) {
  const item = findBatch(id);
  if (!item) return;
  currentBatchId = id;
  document.getElementById('out-id').value = item.id;
  document.getElementById('out-quantity').value = item.quantity;
  document.getElementById('out-time').value = toLocalInput(new Date());
  document.getElementById('out-remark').value = '';
  Modal.show('modal-outbound');
}

function submitOutbound() {
  const item = findBatch(currentBatchId);
  if (item) {
    item.status = 'exported';
    item.time = formatNow();
    const remark = document.getElementById('out-remark').value;
    if (remark) item.remark = remark;
  }
  Modal.hide('modal-outbound');
  handleSearch();
  Toast.success('出库成功');
}

// 真实导出（Excel / CSV）
async function handleExport() {
  const scope = document.querySelector('input[name="exportScope"]:checked').value;
  const rows = (scope === 'selected' ? Pagination.filteredData : processBatches);
  const result = await ExportHelper.exportData({
    filename: '采后处理记录_' + ExportHelper.stamp(),
    format: document.getElementById('exportFormat').value,
    headers: ['批次编号', '来源记录', '地块', '等级', '数量(kg)', '状态', '库位', '操作时间', '操作人', '备注'],
    rows: rows.map(b => [b.id, b.record || '', b.plot, b.grade, b.quantity, STATUS_NAME[b.status], b.location || '', b.time, b.operator, b.remark || ''])
  });
  Modal.hide('modal-export');
  Toast.success(result === 'csv-fallback' ? 'Excel 组件加载失败，已导出为 CSV' : '导出成功，文件已下载');
}

// 工具：当前时间
function formatNow() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function toLocalInput(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

// 初始化分页
document.addEventListener('DOMContentLoaded', function() {
  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: processBatches,
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderRow
  });
});
