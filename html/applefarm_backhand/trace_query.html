<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .modal-overlay {
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0, 0, 0, 0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    opacity:0;
    visibility:hidden;
    transition:all 0.3s ease;
  }
  .modal-overlay.active {
    opacity:1;
    visibility:visible;
  }
  .modal {
    background:var(--bg-card);
    border-radius:16px;
    width:560px;
    max-width:90vw;
    max-height:90vh;
    overflow:hidden;
    transform:scale(0.9);
    transition:all 0.3s ease;
  }
  .modal-overlay.active .modal {
    transform:scale(1);
  }
  .modal-header {
    padding:20px 24px;
    border-bottom:1px solid var(--border-default);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(135deg, #1890ff 0%, #1a8a3a 100%);
    color:var(--text-inverse);
  }
  .modal-header h3 {
    font-size:18px;
    font-weight:600;
    margin:0;
  }
  .modal-close {
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
    border:none;
    color:var(--text-inverse);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.2s;
  }
  .modal-close:hover { background:rgba(255,255,255,0.3); }
  .modal-body { padding:24px; max-height:60vh; overflow-y:auto; }
  .modal-footer {
    padding:16px 24px;
    border-top:1px solid var(--border-default);
    display:flex;
    justify-content:flex-end;
    gap:12px;
  }
  .detail-grid {
    display:grid;
    grid-template-columns:120px 1fr;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--border-light);
  }
  .detail-grid:last-child { border-bottom:none; }
  .detail-label { color:var(--text-tertiary); font-size:14px; }
  .detail-value { color:var(--text-primary); font-size:14px; font-weight:500; }
  .qrcode-container {
    text-align:center;
    padding:24px;
    background:#f8faf8;
    border-radius:12px;
    margin:16px 0;
  }
  .qrcode-box {
    width:180px;
    height:180px;
    background:var(--bg-card);
    border-radius:12px;
    margin:0 auto 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid var(--border-primary);
  }
  .qrcode-code { font-size:16px; font-weight:600; color:var(--text-primary); margin-bottom:8px; }
  .qrcode-hint { font-size:12px; color:var(--text-tertiary); }
  .trace-timeline { margin-top:16px; }
  .trace-item {
    display:flex;
    gap:12px;
    padding:12px 0;
    position:relative;
  }
  .trace-item::before {
    content:'';
    position:absolute;
    left:11px;
    top:32px;
    bottom:-12px;
    width:2px;
    background:var(--gray-200);
  }
  .trace-item:last-child::before { display:none; }
  .trace-dot {
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--primary-500);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .trace-dot svg { width:12px; height:12px; color:var(--text-inverse); }
  .trace-content { flex:1; }
  .trace-title { font-weight:500; color:var(--text-primary); margin-bottom:4px; }
  .trace-time { font-size:12px; color:var(--text-tertiary); }
  .trace-desc { font-size:12px; color:var(--text-secondary); margin-top:4px; line-height:1.6; }
  .trace-status { font-size:12px; margin-left:8px; }
  .qrcode-url {
    margin-top:10px;
    font-size:12px;
    color:var(--text-tertiary);
    word-break:break-all;
    font-family:var(--font-mono, monospace);
  }
  .chain-box { background:#f8faf8; border-radius:12px; padding:16px 20px; margin-bottom:16px; }
  .chain-title { font-weight:600; color:var(--text-primary); font-size:14px; margin-bottom:10px; }
  .chain-list { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .chain-node { background:var(--bg-card); border:1px solid var(--border-default); border-radius:8px; padding:6px 12px; font-size:13px; color:var(--text-secondary); }
  .chain-node.hl { border-color:#1890ff; color:#1890ff; font-weight:500; }
  .chain-arrow { color:var(--text-tertiary); font-size:13px; }
  .toast {
    position:fixed;
    top:20px;
    right:20px;
    padding:14px 20px;
    background:var(--bg-card);
    border-radius:10px;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
    display:flex;
    align-items:center;
    gap:12px;
    z-index:2000;
    transform:translateX(120%);
    transition:all 0.3s ease;
  }
  .toast.show { transform:translateX(0); }
  .toast.success { border-left:4px solid var(--border-primary); }
  .toast.error { border-left:4px solid #ef4444; }
  .toast-icon {
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--gray-100);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--primary-500);
  }
</style>

<script src="js/shared/harvest-store.js"></script>

<script>
// 追溯码统一来自 TraceStore
function allCodes() { return TraceStore.codes(); }

/* ---------- 上游数据源（用于动态组装溯源轨迹） ---------- */

// 批次主数据统一来自 TraceStore（由采收记录生成）
function batchSource() {
  return TraceStore.batches().map(function (b) {
    return {
      batchNo: b.batchNo, plotCode: b.plotCode, plotName: b.plotName, base: b.base,
      product: b.product, spec: b.spec, harvestDate: b.harvestDate, planNo: b.planNo,
      processNo: b.processNo, quantity: b.quantity, grade: b.grade, status: b.status,
      shipment: b.shipment
    };
  });
}

// 农事作业（取自农事记录 farming_record.html，按地块）
/* 严格空库：农事作业记录一律来自真实 API，空库时轨迹显示「暂无该地块的农事记录」 */
const FARM_BY_PLOT = {};

// 农资投入（取自农资使用 material_usage.html，按地块，同一地块取最近一次）
/* 严格空库：农资投入记录一律来自真实 API */
const MATERIAL_BY_PLOT = {};

// 农资追溯字段（登记证号 / 有效成分 / 安全间隔期）：暂由页面 mock 增强，后续可接物资 Store
/* 严格空库：农资登记证信息一律来自真实 API */
const MATERIAL_TRACE = {};

// 批次证书（统一取自共享数据层 CertStore，按批次动态查询，状态实时派生）
function certsOfBatch(batchNo) {
  if (typeof CertStore === 'undefined') return [];
  return CertStore.certsOfBatch(batchNo).map(function (c) {
    var sv = CertStore.computeStatus(c);
    return {
      id: c.id,
      certNo: c.certNo,
      type: c.type,
      date: c.issueDate,
      status: sv.text,
      statusClass: sv.cls,
      issuer: c.issueOrg,
      customer: c.customer,
      qrUrl: c.qrUrl
    };
  });
}

// 冷链配送（取自采收发货 harvest_post.html，按采后处理单号）
/* 严格空库：冷链配送信息一律来自真实 API */
const SHIP_BY_PROCESS = {};

const STATUS_TEXT = { inactive:'未激活', active:'已激活', expired:'已过期' };

// H5 溯源端地址
const H5_BASE = window.location.href.split('?')[0].replace(/[^/]*$/, '').replace(/applefarm_backhand\/$/, 'applefarm_h5/');
const H5_TRACE_PAGE = H5_BASE + 'trace_h5.html';
function buildH5Url(code) { return TraceStore.shortUrlOf(code); }
function buildPreviewUrl(code) { return H5_TRACE_PAGE + '?code=' + encodeURIComponent(code); }

let currentDetailCode = '';

function getBatchInfo(batchNo) {
  return batchSource().find(b => b.batchNo === batchNo) || null;
}
function enrichCode(item) {
  const b = getBatchInfo(item.batch) || { product:'—', base:'—', plotCode:'—', plotName:'—' };
  return Object.assign({}, item, {
    product: b.product,
    base: b.base,
    plotCode: b.plotCode,
    plotName: b.plotName,
    statusText: STATUS_TEXT[item.status] || item.status
  });
}
function statusTagClass(status) {
  return status === 'active' ? 'active' : status === 'expired' ? 'error' : 'inactive';
}

/* ---------- 分页组件（与农事计划、批次管理一致） ---------- */
const Pagination = {
  currentPage: 1, pageSize: 10, filteredData: [],
  containerId: 'pagination-container', tbodyId: 'dataTableBody', renderRow: null,
  init: function(options) {
    this.currentPage = options.currentPage || 1;
    this.pageSize = options.pageSize || 10;
    this.filteredData = options.data || [];
    this.containerId = options.containerId || 'pagination-container';
    this.tbodyId = options.tbodyId || 'dataTableBody';
    this.renderRow = options.renderRow || null;
    this.render();
  },
  renderTable: function() {
    const tbody = document.getElementById(this.tbodyId);
    if (!tbody || !this.renderRow) return;
    const start = (this.currentPage - 1) * this.pageSize;
    const pageData = this.filteredData.slice(start, start + this.pageSize);
    tbody.innerHTML = pageData.map((item, i) => this.renderRow(item, start + i + 1)).join('');
  },
  render: function() {
    const container = document.getElementById(this.containerId);
    if (!container) return;
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    let html = '<div class="pagination">';
    html += `<button class="page-btn ${this.currentPage <= 1 ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage - 1})">‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= this.currentPage - 1 && i <= this.currentPage + 1)) {
        html += `<button class="page-btn ${i === this.currentPage ? 'active' : ''}" onclick="Pagination.goToPage(${i})">${i}</button>`;
      } else if (i === this.currentPage - 2 || i === this.currentPage + 2) {
        html += '<span class="page-ellipsis" style="padding:0 8px;color:#6b7b6b;">...</span>';
      }
    }
    html += `<button class="page-btn ${this.currentPage >= totalPages ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage + 1})">›</button>`;
    html += `<span style="margin-left:16px;font-size:13px;color:#6b7b6b;">第 ${this.currentPage} 页/共 ${totalPages} 页，共 ${this.filteredData.length} 条记录</span>`;
    html += '</div>';
    container.innerHTML = html;
    this.renderTable();
  },
  goToPage: function(page) {
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    if (page < 1 || page > totalPages) return;
    this.currentPage = page;
    this.render();
  },
  updateData: function(data) {
    this.filteredData = data;
    this.currentPage = 1;
    this.render();
  }
};

// 渲染表格行
function renderCodeRow(item, seq) {
  const c = enrichCode(item);
  return `
    <tr data-id="${c.code}">
      <td><strong>${c.code}</strong></td>
      <td>${c.product}</td>
      <td>${c.batch}</td>
      <td><span class="status-tag ${statusTagClass(c.status)}">${c.statusText}</span></td>
      <td>${c.queries} 次</td>
      <td>${c.lastQuery}</td>
      <td>
        <div class="action-btns">
          <button class="action-btn detail" onclick="viewDetail('${c.code}')">详情</button>
          <button class="action-btn qrcode" onclick="showQRCode('${c.code}')">二维码</button>
        </div>
      </td>
    </tr>
  `;
}

function searchData() {
  const code = document.getElementById('traceCodeInput').value.trim().toLowerCase();
  const product = document.getElementById('productNameInput').value.trim().toLowerCase();
  const status = document.getElementById('statusSelect').value;
  const batch = document.getElementById('batchInput').value.trim().toLowerCase();

  const filtered = allCodes().filter(item => {
    const c = enrichCode(item);
    if (code && !c.code.toLowerCase().includes(code)) return false;
    if (product && !c.product.toLowerCase().includes(product)) return false;
    if (status && c.status !== status) return false;
    if (batch && !c.batch.toLowerCase().includes(batch)) return false;
    return true;
  });

  Pagination.updateData(filtered);
  showToast(`找到 ${filtered.length} 条记录`);
}

function resetSearch() {
  document.getElementById('traceCodeInput').value = '';
  document.getElementById('productNameInput').value = '';
  document.getElementById('statusSelect').value = '';
  document.getElementById('batchInput').value = '';
  Pagination.updateData(allCodes());
  showToast('已重置筛选条件');
}

// 扫一扫：使用 getUserMedia 调起摄像头，原型未引入真实解码库，提示输入模拟码
function openScanner() {
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(function(stream){
        var v = document.createElement('video');
        v.srcObject = stream; v.setAttribute('playsinline','true');
        v.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:300px;height:300px;background:#000;border:2px solid #fff;z-index:9999;border-radius:8px;';
        document.body.appendChild(v); v.play();
        // 3 秒后关闭并提示手动输入（原型无真实解码）
        setTimeout(function(){
          stream.getTracks().forEach(function(t){ t.stop(); });
          v.remove();
          var code = prompt('摄像头对准二维码后，请在弹窗中输入扫描到的溯源码（原型演示）：');
          if (code) {
            document.getElementById('traceCodeInput').value = code.trim();
            searchData();
          }
        }, 2500);
      })
      .catch(function(){
        var code = prompt('请输入溯源码：');
        if (code) {
          document.getElementById('traceCodeInput').value = code.trim();
          searchData();
        }
      });
  } else {
    var code = prompt('当前浏览器不支持摄像头扫码，请手动输入溯源码：');
    if (code) {
      document.getElementById('traceCodeInput').value = code.trim();
      searchData();
    }
  }
}

// 按批次动态组装溯源轨迹：农事作业 → 农资投入 → 采收入库 → 质量检测 → 冷链配送
function buildTrack(batchNo) {
  const b = getBatchInfo(batchNo);
  if (!b) return [];
  const stages = [];

  const farm = FARM_BY_PLOT[b.plotCode];
  stages.push(farm ? {
    title: `农事作业 · ${farm.typeName}`,
    time: farm.date,
    desc: `作业人：${farm.executor}　地块：${b.plotCode} · ${b.plotName}`,
    warn: false
  } : { title: '农事作业', time: '—', desc: '暂无该地块的农事记录', warn: true });

  const mat = MATERIAL_BY_PLOT[b.plotCode];
  const mt = mat ? (MATERIAL_TRACE[mat.name] || {}) : null;
  stages.push(mat ? {
    title: `农资投入 · ${mat.name}`,
    time: mat.date,
    desc: `规格：${mat.spec}　用量：${mat.quantity}　领用人：${mat.operator}` +
      (mt ? `<br>登记证号：${mt.regNo}　有效成分：${mt.ingredient}　安全间隔期：${mt.safety}` +
        (mt.safety && mt.safety !== '—' ? `　最后施药：${mat.date}` : '') : ''),
    warn: false
  } : { title: '农资投入', time: '—', desc: '暂无该地块的农资使用记录', warn: true });

  stages.push({
    title: `采收入库 · ${b.planNo}`,
    time: b.harvestDate,
    desc: `采收 ${b.quantity} kg　等级：${b.grade}　采后处理单：${b.processNo}`,
    warn: false
  });

  const gate = TraceStore.inspectionState(batchNo);
  if (gate.latest) {
    const ins = gate.latest;
    stages.push({
      title: `质量检测 · ${ins.reportType || '检测报告'}`,
      time: ins.issueDate,
      desc: `报告编号：${ins.reportNo}　机构：${ins.institution}　结论：${ins.conclusion}　有效期至：${ins.validUntil || '—'}`,
      warn: !gate.hasValid
    });
  } else {
    stages.push({ title: '质量检测', time: '—', desc: '该批次尚未上传检测报告，赋码与销售前必须补录', warn: true });
  }

  const ship = SHIP_BY_PROCESS[b.processNo];
  stages.push(ship ? {
    title: `冷链配送 · ${ship.logistics}`,
    time: ship.date,
    desc: `发货单 ${ship.id}　客户：${ship.customer}　运单号：${ship.tracking || '待分配'}　状态：${ship.status}`,
    warn: ship.status === '运输异常'
  } : { title: '冷链配送', time: '—', desc: '该批次尚未安排发货', warn: true });

  return stages;
}

function viewDetail(code) {
  currentDetailCode = code;
  const item = TraceStore.code(code);
  if (!item) { showToast('未找到该追溯码', 'error'); return; }
  const c = enrichCode(item);
  const b = getBatchInfo(item.batch);

  const gate = TraceStore.inspectionState(item.batch);
  const ins = gate.latest;
  const env = TraceStore.environmentOf(item.batch);
  const scanRes = TraceStore.recordScan(item.code, { source: 'PC', region: '甘肃省天水市', device: 'PC 查询台' });
  const firstEvent = TraceStore.events().filter(e => e.code === item.code && e.type === 'code')[0];
  const queryTip = scanRes.firstScan
    ? '<span style="color:#16a34a;font-weight:600;">首次查询，验证为正品首次查询</span>'
    : `该码已被查询 <strong>${scanRes.queries}</strong> 次，最后查询：${scanRes.lastQuery}` +
      (scanRes.risk ? `<span style="color:#ef4444;"> · ${scanRes.riskReason}</span>` : '');

  const traceHtml = buildTrack(item.batch).map(t => `
    <div class="trace-item">
      <div class="trace-dot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <div class="trace-content">
        <div class="trace-title">${t.title}${t.warn ? '<span class="trace-status" style="color:#ef4444;">待补充</span>' : ''}</div>
        <div class="trace-time">${t.time}</div>
        <div class="trace-desc">${t.desc}</div>
      </div>
    </div>
  `).join('');

  const reportHtml = ins ? `
    <div class="chain-box" style="margin-top:16px;">
      <div class="chain-title">检测报告（必需）</div>
      <div class="detail-grid"><span class="detail-label">报告编号</span><span class="detail-value">${ins.reportNo}</span></div>
      <div class="detail-grid"><span class="detail-label">检测机构</span><span class="detail-value">${ins.institution}</span></div>
      <div class="detail-grid"><span class="detail-label">检测结论</span><span class="detail-value"><span class="status-tag ${ins.conclusion === '合格' && gate.hasValid ? 'active' : 'inactive'}">${ins.conclusion}${gate.hasValid ? '' : '（不可用作赋码依据）'}</span></span></div>
      <div class="detail-grid"><span class="detail-label">有效期至</span><span class="detail-value">${ins.validUntil || '—'}</span></div>
      <div class="detail-grid"><span class="detail-label">附件</span><span class="detail-value">${ins.attachment ? ins.attachment.name : '未上传'}</span></div>
    </div>` : `
    <div class="chain-box" style="margin-top:16px;border:1px solid #fecaca;background:#fff5f5;">
      <div class="chain-title" style="color:#ef4444;">检测报告缺失</div>
      <div class="detail-value" style="font-size:13px;color:#b91c1c;">该批次尚未上传检测报告，追溯数据不完整，禁止赋码与销售。</div>
    </div>`;

  const w = env.weather || {};
  const s = env.soil || {};
  const capturesHtml = (env.captures || []).map(x => `
    <div style="flex:1;min-width:110px;">
      <img src="../applefarm_h5/images/${x.file}" alt="${x.name}" style="width:100%;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--border-default);" onerror="this.style.display='none'">
      <div style="font-size:12px;color:var(--text-secondary);margin-top:6px;">${x.name}</div>
      <div style="font-size:11px;color:var(--text-tertiary);">${x.time}</div>
    </div>
  `).join('');

  const batchCerts = certsOfBatch(item.batch);
  const certsHtml = batchCerts.length ? `
    <div class="chain-box" style="margin-top:16px;">
      <div class="chain-title">批次证书（${batchCerts.length} 项）</div>
      ${batchCerts.map(ct => `
        <div class="detail-grid">
          <span class="detail-label">${ct.type}</span>
          <span class="detail-value">
            ${ct.certNo}　签发 ${ct.date}
            <span class="status-tag ${ct.statusClass}">${ct.status}</span>
            ${ct.qrUrl ? '　<a href="' + ct.qrUrl + '" target="_blank" rel="noopener" style="color:#1890ff;">验证链接</a>' : ''}
          </span>
        </div>
      `).join('')}
    </div>` : `
    <div class="chain-box" style="margin-top:16px;border:1px solid #fde68a;background:#fffbeb;">
      <div class="chain-title" style="color:#b45309;">该批次暂无证书</div>
      <div class="detail-value" style="font-size:13px;color:#92400e;">尚未开具质量合格证，请前往「证书管理 › 农产品合格证」开具。</div>
    </div>`;

  document.getElementById('detailContent').innerHTML = `
    <div class="chain-box">
      <div class="chain-title">溯源链路</div>
      <div class="chain-list">
        <span class="chain-node">${b ? b.plotCode + ' · ' + b.plotName : '—'}</span>
        <span class="chain-arrow">→</span>
        <span class="chain-node hl">${c.batch}</span>
        <span class="chain-arrow">→</span>
        <span class="chain-node">${c.code}</span>
      </div>
    </div>
    <div class="detail-grid"><span class="detail-label">溯源码</span><span class="detail-value">${c.code}</span></div>
    <div class="detail-grid"><span class="detail-label">产品名称</span><span class="detail-value">${c.product}</span></div>
    <div class="detail-grid"><span class="detail-label">批次号</span><span class="detail-value">${c.batch}</span></div>
    <div class="detail-grid"><span class="detail-label">产地</span><span class="detail-value">${c.base} / ${c.plotCode} · ${c.plotName}</span></div>
    <div class="detail-grid"><span class="detail-label">溯源状态</span><span class="detail-value"><span class="status-tag ${statusTagClass(c.status)}">${c.statusText}</span></span></div>
    <div class="detail-grid"><span class="detail-label">查询提示</span><span class="detail-value" style="font-size:13px;">${queryTip}</span></div>
    <div class="detail-grid"><span class="detail-label">对外短链</span><span class="detail-value" style="word-break:break-all;font-size:12px;">${buildH5Url(c.code)}</span></div>
    <div class="detail-grid"><span class="detail-label">存证哈希</span><span class="detail-value" style="word-break:break-all;font-size:12px;">${firstEvent ? firstEvent.hash : '待上链'}</span></div>
    ${reportHtml}
    ${certsHtml}
    <div class="chain-box" style="margin-top:16px;">
      <div class="chain-title">基地实景与环境（带时间戳）</div>
      <div class="detail-grid"><span class="detail-label">VR 实景</span><span class="detail-value">${env.vrUrl ? '<a href="' + env.vrUrl + '" target="_blank" style="color:#1890ff;">进入基地 VR 全景</a>' : '未接入'}</span></div>
      <div class="detail-grid"><span class="detail-label">视频监控</span><span class="detail-value">${env.videoAvailable ? '已接入视频流' : '视频流未接入，展示最近监控快照'}</span></div>
      <div class="detail-grid"><span class="detail-label">气象站</span><span class="detail-value">${env.weather ? w.condition + ' ' + w.temp + '℃ · 湿度 ' + w.humidity + '% · 降雨 ' + w.rainfall + 'mm · 风速 ' + w.wind + 'm/s<br><span style="font-size:12px;color:var(--text-tertiary);">' + w.source + ' · ' + w.updatedAt + '</span>' : '<span style="color:var(--text-tertiary);">暂无数据</span>'}</span></div>
      <div class="detail-grid"><span class="detail-label">土壤墒情</span><span class="detail-value">${env.soil ? '温度 ' + s.temp + '℃ · 含水量 ' + s.moisture + '% · pH ' + s.ph + ' · EC ' + s.ec + 'μS/cm<br><span style="font-size:12px;color:var(--text-tertiary);">' + s.source + ' · ' + s.updatedAt + '</span>' : '<span style="color:var(--text-tertiary);">暂无数据</span>'}</span></div>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">${capturesHtml}</div>
    </div>
    <div style="margin-top:16px; font-weight:500; color:var(--text-primary);">溯源轨迹</div>
    <div class="trace-timeline">${traceHtml}</div>
  `;

  openModal('detailModal');
}

function showQRCode(code) {
  currentDetailCode = code;
  const url = buildH5Url(code);
  document.getElementById('qrcodeValue').textContent = code;
  document.getElementById('qrcodeUrl').textContent = url;

  const holder = document.getElementById('qrcodeCanvas');
  const img = document.getElementById('qrcodeImg');
  const ph = document.getElementById('qrcodePlaceholder');
  holder.innerHTML = '';
  holder.style.display = 'none';
  img.style.display = 'none';
  ph.style.display = 'none';

  let rendered = false;
  try {
    if (typeof QRCode === 'function') {
      new QRCode(holder, {
        text: url, width: 180, height: 180,
        colorDark: '#1f1f1f', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H
      });
      holder.style.display = 'flex';
      rendered = true;
    }
  } catch (e) { rendered = false; }

  if (!rendered) {
    img.onload = function() { img.style.display = 'block'; ph.style.display = 'none'; };
    img.onerror = function() { img.style.display = 'none'; ph.style.display = 'flex'; };
    img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data=' + encodeURIComponent(url);
  }

  openModal('qrcodeModal');
}

function showDetailQRCode() {
  const code = currentDetailCode;
  closeModal('detailModal');
  setTimeout(() => showQRCode(code), 200);
}

function openH5Page() {
  if (!currentDetailCode) return;
  window.open(buildH5Url(currentDetailCode), '_blank');
}

function previewConsumerPage() {
  openH5Page();
}

/* P2：导出批次证据包（检测报告、追溯码、存证事件、扫码记录、打印任务、环境快照） */
function exportEvidencePack() {
  if (!currentDetailCode) return;
  const item = TraceStore.code(currentDetailCode);
  if (!item) { showToast('未找到该追溯码', 'error'); return; }
  const data = TraceStore.exportEvidence(item.batch);
  if (!data) { showToast('证据包生成失败', 'error'); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'trace_evidence_' + item.batch + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('证据包已导出');
}

function downloadQRCode() {
  if (!currentDetailCode) return;
  const holder = document.getElementById('qrcodeCanvas');
  const canvas = holder ? holder.querySelector('canvas') : null;
  if (!canvas) { showToast('二维码尚未生成，请稍后重试', 'error'); return; }
  const out = document.createElement('canvas');
  out.width = 360; out.height = 404;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, out.width, out.height);
  ctx.drawImage(canvas, 30, 8, 300, 300);
  ctx.fillStyle = '#1f1f1f';
  ctx.font = 'bold 18px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('智慧果园溯源', 180, 336);
  ctx.font = '12px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#666';
  ctx.fillText(currentDetailCode, 180, 358);
  out.toBlob(function (blob) {
    if (!blob) { showToast('二维码导出失败', 'error'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'trace_' + currentDetailCode + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    showToast(`已导出二维码：${currentDetailCode}`);
  }, 'image/png');
}

function openModal(id) {
  document.getElementById(id).classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
  document.body.style.overflow = '';
}

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  document.getElementById('toastMessage').textContent = message;
  toast.className = `toast ${type}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// 页面初始化
document.addEventListener('DOMContentLoaded', function() {
  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: allCodes(),
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderCodeRow
  });

  TraceStore.subscribe(function () {
    Pagination.updateData(allCodes());
  });

  // 由其它页面跳转过来时按溯源码直接打开详情
  const preset = new URLSearchParams(window.location.search).get('code');
  if (preset) viewDetail(preset);
});

// 点击遮罩关闭弹窗
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeModal(overlay.id);
  });
});

// ESC 关闭弹窗
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.active').forEach(o => closeModal(o.id));
  }
});
