<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 溯源查询</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .modal-overlay {
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0, 0, 0, 0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    opacity:0;
    visibility:hidden;
    transition:all 0.3s ease;
  }
  .modal-overlay.active {
    opacity:1;
    visibility:visible;
  }
  .modal {
    background:var(--bg-card);
    border-radius:16px;
    width:560px;
    max-width:90vw;
    max-height:90vh;
    overflow:hidden;
    transform:scale(0.9);
    transition:all 0.3s ease;
  }
  .modal-overlay.active .modal {
    transform:scale(1);
  }
  .modal-header {
    padding:20px 24px;
    border-bottom:1px solid var(--border-default);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(135deg, #1890ff 0%, #1a8a3a 100%);
    color:var(--text-inverse);
  }
  .modal-header h3 {
    font-size:18px;
    font-weight:600;
    margin:0;
  }
  .modal-close {
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
    border:none;
    color:var(--text-inverse);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.2s;
  }
  .modal-close:hover { background:rgba(255,255,255,0.3); }
  .modal-body { padding:24px; max-height:60vh; overflow-y:auto; }
  .modal-footer {
    padding:16px 24px;
    border-top:1px solid var(--border-default);
    display:flex;
    justify-content:flex-end;
    gap:12px;
  }
  .detail-grid {
    display:grid;
    grid-template-columns:120px 1fr;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--border-light);
  }
  .detail-grid:last-child { border-bottom:none; }
  .detail-label { color:var(--text-tertiary); font-size:14px; }
  .detail-value { color:var(--text-primary); font-size:14px; font-weight:500; }
  .qrcode-container {
    text-align:center;
    padding:24px;
    background:#f8faf8;
    border-radius:12px;
    margin:16px 0;
  }
  .qrcode-box {
    width:180px;
    height:180px;
    background:var(--bg-card);
    border-radius:12px;
    margin:0 auto 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid var(--border-primary);
  }
  .qrcode-code { font-size:16px; font-weight:600; color:var(--text-primary); margin-bottom:8px; }
  .qrcode-hint { font-size:12px; color:var(--text-tertiary); }
  .trace-timeline { margin-top:16px; }
  .trace-item {
    display:flex;
    gap:12px;
    padding:12px 0;
    position:relative;
  }
  .trace-item::before {
    content:'';
    position:absolute;
    left:11px;
    top:32px;
    bottom:-12px;
    width:2px;
    background:var(--gray-200);
  }
  .trace-item:last-child::before { display:none; }
  .trace-dot {
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--primary-500);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .trace-dot svg { width:12px; height:12px; color:var(--text-inverse); }
  .trace-content { flex:1; }
  .trace-title { font-weight:500; color:var(--text-primary); margin-bottom:4px; }
  .trace-time { font-size:12px; color:var(--text-tertiary); }
  .toast {
    position:fixed;
    top:20px;
    right:20px;
    padding:14px 20px;
    background:var(--bg-card);
    border-radius:10px;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
    display:flex;
    align-items:center;
    gap:12px;
    z-index:2000;
    transform:translateX(120%);
    transition:all 0.3s ease;
  }
  .toast.show { transform:translateX(0); }
  .toast.success { border-left:4px solid var(--border-primary); }
  .toast.error { border-left:4px solid #ef4444; }
  .toast-icon {
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--gray-100);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--primary-500);
  }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}

let currentPage = 1;
const pageSize = 10;
let filteredData = [...mockData];
let currentDetailCode = '';

document.addEventListener('DOMContentLoaded', function() {
  renderTable();
  renderPagination();
});

function renderTable() {
  const tbody = document.getElementById('dataTableBody');
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageData = filteredData.slice(start, end);
  
  tbody.innerHTML = pageData.map(item => `
    <tr>
      <td><strong>${item.code}</strong></td>
      <td>${item.product}</td>
      <td>${item.batch}</td>
      <td><span class="status-tag ${item.status === 'completed' ? 'active' : item.status === 'pending' ? 'inactive' : 'warning'}">${item.status === 'completed' ? '已完成' : item.status === 'pending' ? '待追溯' : '进行中'}</span></td>
      <td>${item.queries} 次</td>
      <td>${item.lastQuery}</td>
      <td>
        <div class="action-btns">
          <button class="action-btn detail" onclick="viewDetail('${item.code}')">详情</button>
          <button class="action-btn qrcode" onclick="showQRCode('${item.code}')">二维码</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function renderPagination() {
  const container = document.getElementById('paginationContainer');
  const totalPages = Math.ceil(filteredData.length / pageSize);
  
  if (totalPages <= 1) { container.innerHTML = ''; return; }
  
  let html = `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="goToPage(${currentPage - 1})">‹</button>`;
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
      html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
    } else if (i === currentPage - 2 || i === currentPage + 2) {
      html += '<span class="page-ellipsis">...</span>';
    }
  }
  html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="goToPage(${currentPage + 1})">›</button>`;
  container.innerHTML = html;
}

function goToPage(page) {
  const totalPages = Math.ceil(filteredData.length / pageSize);
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderTable();
  renderPagination();
}

function searchData() {
  const code = document.getElementById('traceCodeInput').value.toLowerCase();
  const product = document.getElementById('productNameInput').value.toLowerCase();
  const status = document.getElementById('statusSelect').value;
  const batch = document.getElementById('batchInput').value.toLowerCase();
  
  filteredData = mockData.filter(item => {
    if (code && !item.code.toLowerCase().includes(code)) return false;
    if (product && !item.product.toLowerCase().includes(product)) return false;
    if (status && item.status !== status) return false;
    if (batch && !item.batch.toLowerCase().includes(batch)) return false;
    return true;
  });
  
  currentPage = 1;
  renderTable();
  renderPagination();
  showToast(`找到 ${filteredData.length} 条记录`);
}

function resetSearch() {
  document.getElementById('traceCodeInput').value = '';
  document.getElementById('productNameInput').value = '';
  document.getElementById('statusSelect').value = '';
  document.getElementById('batchInput').value = '';
  filteredData = [...mockData];
  currentPage = 1;
  renderTable();
  renderPagination();
  showToast('已重置筛选条件');
}

function viewDetail(code) {
  currentDetailCode = code;
  const item = mockData.find(d => d.code === code);
  if (!item) return;
  
  const traceHtml = item.trace.map((t, i) => `
    <div class="trace-item">
      <div class="trace-dot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <div class="trace-content">
        <div class="trace-title">${t.title}</div>
        <div class="trace-time">${t.time}</div>
      </div>
    </div>
  `).join('');
  
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-grid"><span class="detail-label">溯源码</span><span class="detail-value">${item.code}</span></div>
    <div class="detail-grid"><span class="detail-label">产品名称</span><span class="detail-value">${item.product}</span></div>
    <div class="detail-grid"><span class="detail-label">批次号</span><span class="detail-value">${item.batch}</span></div>
    <div class="detail-grid"><span class="detail-label">溯源状态</span><span class="detail-value"><span class="status-tag ${item.status === 'completed' ? 'active' : item.status === 'pending' ? 'inactive' : 'warning'}">${item.status === 'completed' ? '已完成' : item.status === 'pending' ? '待追溯' : '进行中'}</span></span></div>
    <div class="detail-grid"><span class="detail-label">查询次数</span><span class="detail-value">${item.queries} 次</span></div>
    <div class="detail-grid"><span class="detail-label">最后查询</span><span class="detail-value">${item.lastQuery}</span></div>
    <div style="margin-top:16px; font-weight:500; color:var(--text-primary);">溯源轨迹</div>
    <div class="trace-timeline">${traceHtml}</div>
  `;
  
  openModal('detailModal');
}

function showQRCode(code) {
  currentDetailCode = code;
  document.getElementById('qrcodeValue').textContent = code;
  openModal('qrcodeModal');
}

function showDetailQRCode() {
  closeModal('detailModal');
  setTimeout(() => showQRCode(currentDetailCode), 200);
}

function downloadQRCode() {
  showToast(`下载二维码：${currentDetailCode}`);
}

function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  document.getElementById('toastMessage').textContent = message;
  toast.className = `toast ${type}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}
