<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 数据归集</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  /* 统计卡 */
  .stat-card-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-lg);
    margin-bottom: var(--space-xl);
  }
  .stat-card {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-light);
    box-shadow: var(--shadow-card);
    padding: var(--space-xl);
    transition: box-shadow var(--transition-normal);
  }
  .stat-card:hover { box-shadow: var(--shadow-md); }
  .stat-label { font-size: 13px; color: var(--text-tertiary); margin-bottom: 8px; }
  .stat-value {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }
  .stat-value .unit { font-size: 13px; font-weight: 500; color: var(--text-tertiary); margin-left: 4px; }
  .stat-sub { margin-top: 8px; font-size: 12px; color: var(--text-tertiary); }

  /* 左右分栏：归集明细 + 来源占比 */
  .collection-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: var(--space-lg);
    margin-bottom: var(--space-xl);
    align-items: start;
  }
  @media (max-width: 1280px) { .collection-grid { grid-template-columns: 1fr; } }

  .data-table { min-width: 860px; }
  .empty-row td { text-align: center; color: var(--text-tertiary); padding: 40px 0; }

  /* 明细区标题栏 */
  .section-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 0 4px; margin-bottom: 12px;
  }

  /* 占比进度条 */
  .ratio-row { padding: 12px 0; border-bottom: 1px dashed var(--border-light); }
  .ratio-row:last-child { border-bottom: none; }
  .ratio-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .ratio-name { font-size: 13px; color: var(--text-primary); font-weight: 500; }
  .ratio-val { font-size: 12.5px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .ratio-val strong { color: var(--text-primary); font-size: 13px; }
  .ratio-bar { height: 8px; background: var(--border-light); border-radius: 4px; overflow: hidden; }
  .ratio-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: var(--primary-500);
    transition: width 0.5s ease;
  }
  /* 趋势编辑：12 个月数值栅格 */
  .trend-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 12px; }
  .trend-grid label { display: block; font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px; }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="数据运营" data-active-submenu="数据归集">

<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <div class="content-wrapper">
        <!-- 统计卡 -->
        <div class="stat-card-row" id="statCards"></div>

        <!-- 归集趋势 -->
        <div class="chart-section">
          <div class="section-toolbar">
            <h2 class="section-title" style="margin:0;padding:0;border:none;">近 12 月数据归集趋势（万条）</h2>
            <div style="display:flex;gap:8px;">
              <button class="btn" onclick="openTrendEditor()">编辑趋势</button>
              <button class="btn" onclick="openCoverageEditor()">覆盖地块口径</button>
            </div>
          </div>
          <div id="chart-collection-trend" style="height:300px;"></div>
        </div>

        <!-- 归集明细 + 来源占比 -->
        <div class="collection-grid">
          <div class="data-section">
            <div class="section-toolbar">
              <h2 class="section-title" style="margin:0;padding:0;border:none;">归集明细</h2>
              <div style="display:flex;gap:8px;">
                <button class="btn" onclick="recalcCollections()">按原始记录重算</button>
                <button class="btn btn-primary" onclick="openCollectionForm()">新增归集记录</button>
              </div>
            </div>
            <div class="data-table-wrapper">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>数据来源</th>
                    <th>归集量（条）</th>
                    <th>占比</th>
                    <th>同比</th>
                    <th>合格率</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </div>

          <div class="data-section" style="padding:24px;">
            <h2 class="section-title">来源占比</h2>
            <div id="ratioList"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/components/modal.js"></script>
<script src="js/components/confirm.js"></script>
<script src="js/page-actions.js"></script>
<script src="js/components/chart.js"></script>
<script src="js/shared/data-store.js"></script>
<script src="../common/js/api.js"></script>
<script>
(function(){
  'use strict';

  /* 严格空库模式：归集记录一律来自后端 API（sf_data_collection），不再依赖本地演示数据 */
  var COLLECTION_RESOURCE = 'data_collection';
  var collectionData = [];
  var collectionLoadState = 'loading';
  var collectionLoadError = '';

  function fmt(n){
    n = Number(n) || 0;
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  // 保留 1 位小数（用于占比 / 比率显示）
  function pct(n){ return Math.round((Number(n) || 0) * 10) / 10; }
  // 归集量占比（%），保留 1 位小数
  function shareOf(amount, total){ return total ? pct((Number(amount) || 0) / total * 100) : 0; }
  function esc(v){
    return String(v === undefined || v === null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var els = {
    statCards : document.getElementById('statCards'),
    tbody     : document.getElementById('tableBody'),
    ratioList : document.getElementById('ratioList')
  };

  /* 数据库行(snake_case) → 页面渲染字段；id 规则与 DataMapper.rowToCollection 一致 */
  function mapCollectionRow(row) {
    return {
      id: row.category || row.source || '',
      source: row.source || '',
      category: row.category || row.source || '',
      amount: Number(row.collect_amount) || 0,
      yoy: Number(row.yoy) || 0,
      rate: Number(row.qualified_rate) || 0
    };
  }

  /* 异步取数：加载中 / 暂无数据 / 加载失败三态，不写 localStorage */
  function loadCollections() {
    if (!window.Api) { collectionLoadState = 'error'; collectionLoadError = '接口未就绪'; renderAll(); return; }
    collectionLoadState = 'loading'; collectionLoadError = ''; renderAll();
    Api.get(COLLECTION_RESOURCE, { page: 1, size: 500 }).then(function (r) {
      if (!r || !r.ok) {
        collectionLoadState = 'error'; collectionLoadError = (r && r.message) || '请求异常';
        collectionData = []; renderAll(); return;
      }
      collectionData = ((r.data && r.data.list) || []).map(mapCollectionRow);
      collectionLoadState = 'ok'; renderAll();
    }).catch(function (e) {
      collectionLoadState = 'error'; collectionLoadError = (e && e.message) || '网络异常';
      collectionData = []; renderAll();
    });
  }

  function statusText() {
    return collectionLoadState === 'loading' ? '正在加载数据...' : ('数据加载失败：' + collectionLoadError);
  }

  function renderStats(){
    if (collectionLoadState !== 'ok') {
      els.statCards.innerHTML = '<div class="stat-card"><div class="stat-label">数据状态</div>' +
        '<div class="stat-value" style="font-size:16px;">' + esc(statusText()) + '</div></div>';
      return;
    }
    var s = DataStore.summary();
    els.statCards.innerHTML =
      '<div class="stat-card">' +
        '<div class="stat-label">累计归集量</div>' +
        '<div class="stat-value">' + fmt(s.totalAmountYi) + '<span class="unit">亿条</span></div>' +
        '<div class="stat-sub">折合 ' + fmt(s.totalAmount) + ' 条</div>' +
      '</div>' +
      '<div class="stat-card">' +
        '<div class="stat-label">数据质量合格率</div>' +
        '<div class="stat-value">' + fmt(s.avgRate) + '<span class="unit">%</span></div>' +
        '<div class="stat-sub">按归集量加权计算</div>' +
      '</div>' +
      '<div class="stat-card">' +
        '<div class="stat-label">数据来源数</div>' +
        '<div class="stat-value">' + fmt(s.sourceTotal) + '<span class="unit">个</span></div>' +
        '<div class="stat-sub">在线 ' + fmt(s.onlineSources) + ' 个</div>' +
      '</div>' +
      '<div class="stat-card">' +
        '<div class="stat-label">数字化覆盖地块</div>' +
        '<div class="stat-value">' + fmt(s.plotCoverage) + '<span class="unit">个</span></div>' +
        '<div class="stat-sub">规划口径 · 台账 ' + fmt(s.plotLedger) + ' 块</div>' +
      '</div>';
  }

  function renderTable(){
    if (collectionLoadState !== 'ok') {
      els.tbody.innerHTML = '<tr class="empty-row"><td colspan="6">' + esc(statusText()) + '</td></tr>';
      return;
    }
    var list  = collectionData;
    var total = list.reduce(function(sum, x){ return sum + (x.amount || 0); }, 0);

    if (!list.length){
      els.tbody.innerHTML = '<tr class="empty-row"><td colspan="6">暂无数据</td></tr>';
      return;
    }

    els.tbody.innerHTML = list.map(function(x){
      var ratio = shareOf(x.amount, total);
      var yoy = Number(x.yoy) || 0;
      var rate = Number(x.rate) || 0;
      var yoyCls = yoy >= 0 ? 'text-success' : 'text-danger';
      return '<tr>' +
        '<td><strong>' + esc(x.source) + '</strong></td>' +
        '<td class="num">' + fmt(x.amount) + '</td>' +
        '<td class="num">' + fmt(ratio) + '%</td>' +
        '<td class="num ' + yoyCls + '">' + (yoy >= 0 ? '+' : '') + fmt(yoy) + '%</td>' +
        '<td class="num">' + fmt(rate) + '%</td>' +
        '<td><div class="action-btns">' +
          '<button class="action-btn" onclick="editCollection(\'' + x.id + '\')">编辑</button>' +
          '<button class="action-btn" onclick="deleteCollection(\'' + x.id + '\')">删除</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  function renderRatio(){
    if (collectionLoadState !== 'ok') {
      els.ratioList.innerHTML = '<div class="empty-state"><div class="empty-text">' + esc(statusText()) + '</div></div>';
      return;
    }
    var list  = collectionData;
    var total = list.reduce(function(sum, x){ return sum + (x.amount || 0); }, 0);
    if (!list.length || !total){
      els.ratioList.innerHTML = '<div class="empty-state"><div class="empty-text">暂无数据</div></div>';
      return;
    }
    els.ratioList.innerHTML = list.map(function(x){
      var ratio = shareOf(x.amount, total);
      var width = Math.max(2, ratio);
      return '<div class="ratio-row">' +
          '<div class="ratio-head">' +
            '<span class="ratio-name">' + esc(x.source) + '（' + esc(x.category || '-') + '）</span>' +
            '<span class="ratio-val"><strong>' + fmt(ratio) + '%</strong> · ' + fmt(x.amount) + ' 条</span>' +
          '</div>' +
          '<div class="ratio-bar"><div class="ratio-bar-fill" style="width:' + width + '%;"></div></div>' +
        '</div>';
    }).join('');
  }

  function renderChart(){
    if (collectionLoadState !== 'ok') return;
    var trend = DataStore.collectionTrend();
    Chart.line('#chart-collection-trend', {
      categories: trend.map(function(x){ return x.month; }),
      series: [{
        name: '归集量（万条）',
        data: trend.map(function(x){ return x.value; }),
        color: '#1890ff',
        area: true
      }]
    });
  }

  function renderAll(){
    renderStats();
    renderTable();
    renderRatio();
    renderChart();
  }

  /* ---------------- 归集记录维护（写入共享数据层，驾驶舱同步） ---------------- */
  var CATEGORIES = [
    { value: '农事', label: '农事' },
    { value: '设备', label: '设备' },
    { value: '销售', label: '销售' },
    { value: '溯源', label: '溯源' },
    { value: '环境', label: '环境' },
    { value: '其他', label: '其他' }
  ];

  function openCollectionForm(id){
    var item = null;
    if (id){
      item = collectionData.filter(function(x){ return x.id === id; })[0] || null;
      if (!item){ Toast.show('归集记录不存在', 'error'); return; }
    }

    Modal.form({
      title: item ? '编辑归集记录' : '新增归集记录',
      submitText: item ? '保存' : '新增',
      width: '520px',
      values: item ? {
        source: item.source,
        category: item.category || '其他',
        amount: item.amount,
        yoy: item.yoy,
        rate: item.rate
      } : { category: '农事', rate: 95 },
      fields: [
        { name: 'source', label: '数据来源', type: 'text', required: true, placeholder: '如：智能气象站' },
        { name: 'category', label: '归集类别', type: 'select', options: CATEGORIES },
        { name: 'amount', label: '归集量（条）', type: 'number', min: 0, step: 1, required: true },
        { name: 'yoy', label: '同比增长（%）', type: 'number', step: 0.1, hint: '可填负数表示同比下降' },
        { name: 'rate', label: '合格率（%）', type: 'number', min: 0, max: 100, step: 0.1, required: true }
      ],
      onSubmit: function(data){
        var res = DataStore.upsertCollection({
          id: item ? item.id : '',
          source: data.source,
          category: data.category,
          amount: data.amount,
          yoy: data.yoy,
          rate: data.rate
        });
        if (!res.ok){ Toast.show(res.message, 'error'); return false; }
        collectionData = DataStore.collections();
        renderAll();
        Toast.show(item ? '归集记录已更新，驾驶舱数据已同步' : '归集记录已新增，驾驶舱数据已同步', 'success');
        return true;
      }
    });
  }

  function editCollection(id){ openCollectionForm(id); }

  function deleteCollection(id){
    var item = collectionData.filter(function(x){ return x.id === id; })[0];
    if (!item) return;
    Confirm.delete('确定删除「' + esc(item.source) + '」的归集记录吗？删除后驾驶舱归集量与合格率将同步调整。').then(function(ok){
      if (!ok) return;
      DataStore.removeCollection(id);
      collectionData = DataStore.collections();
      renderAll();
      Toast.show('归集记录已删除', 'success');
    });
  }

  /* ---------------- 数字化覆盖地块口径 ---------------- */
  function openCoverageEditor(){
    var c = DataStore.coverage();
    Modal.form({
      title: '数字化覆盖地块口径',
      submitText: '保存',
      width: '480px',
      values: { planned: c.planned, ledgerFallback: c.ledger },
      fields: [
        { name: 'planned', label: '规划覆盖地块（块）', type: 'number', min: 0, step: 1, required: true, hint: '用于驾驶舱「规划 126 块」口径展示' },
        { name: 'ledgerFallback', label: '台账默认数量（块）', type: 'number', min: 0, step: 1, hint: '地块管理暂无数据时，驾驶舱「台账」展示该值' }
      ],
      onSubmit: function(data){
        var res = DataStore.setCoverage({ planned: data.planned, ledgerFallback: data.ledgerFallback });
        if (!res.ok){ Toast.show(res.message, 'error'); return false; }
        Toast.show('覆盖地块口径已更新，驾驶舱已同步', 'success');
        return true;
      }
    });
  }

  /* ---------------- 近 12 月归集趋势维护 ---------------- */
  function openTrendEditor(){
    var trend = DataStore.collectionTrend();
    var html = '<div class="trend-grid">' + trend.map(function(x, i){
      return '<div><label>' + esc(x.month) + '（万条）</label>' +
        '<input type="number" class="form-input" name="t' + i + '" min="0" step="0.1" value="' + x.value + '" required></div>';
    }).join('') + '</div>';
    Modal.form({
      title: '编辑近 12 月归集趋势',
      submitText: '保存',
      width: '640px',
      fields: [{ name: 'trend', type: 'custom', html: html }],
      onSubmit: function(data){
        var list = trend.map(function(x, i){ return { month: x.month, value: data['t' + i] }; });
        var res = DataStore.upsertCollectionTrend(list);
        if (!res.ok){ Toast.show(res.message, 'error'); return false; }
        Toast.show('归集趋势已更新，驾驶舱已同步', 'success');
        return true;
      }
    });
  }

  /* ---------------- 按本地原始记录重算归集量 ---------------- */
  function recalcCollections(){
    Confirm.delete('将按本地原始记录重新统计各类归集量（农事记录、设备日志、H5 订单、溯源批次等），重算后数值可能变化。是否继续？').then(function(ok){
      if (!ok) return;
      var res = DataStore.recalcCollections(true);
      var applied = res.items.filter(function(x){ return !x.skipped; });
      var skipped = res.items.filter(function(x){ return x.skipped; });
      var msg = '已重算 ' + applied.length + ' 类归集量';
      if (skipped.length) msg += '，' + skipped.length + ' 类暂无原始记录已保留原值';
      Toast.show(msg, 'success');
    });
  }

  window.openCollectionForm = openCollectionForm;
  window.editCollection = editCollection;
  window.deleteCollection = deleteCollection;
  window.openCoverageEditor = openCoverageEditor;
  window.openTrendEditor = openTrendEditor;
  window.recalcCollections = recalcCollections;

  DataStore.subscribe(function(){
    if (collectionLoadState === 'ok') collectionData = DataStore.collections();
    renderAll();
  });
  loadCollections();
})();
</script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/search-helper.js"></script>
<script src="js/typography.js"></script>
</body>
</html>
