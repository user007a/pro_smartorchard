<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 生长模型</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  /* 紧凑列表（农事建议） */
  .advice-list { display:flex; flex-direction:column; gap:10px; }
  .advice-item { display:flex; align-items:center; gap:12px; padding:12px 14px; background:#fff; border-radius:10px; border:1px solid rgba(0,0,0,0.06); transition:all 0.2s ease; }
  .advice-item:hover { border-color:rgba(24,144,255,0.25); box-shadow:0 2px 8px rgba(0,0,0,0.05); }
  .advice-icon { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .advice-icon.water { background:linear-gradient(135deg,#bae0ff,#91d5ff); color:var(--primary-600); }
  .advice-icon.fertilizer { background:linear-gradient(135deg,#d4f4dd,#91d5ff); color:var(--primary-600); }
  .advice-icon.pest { background:linear-gradient(135deg,#ffd1d1,#ffccc7); color:#cf1322; }
  .advice-icon.pruning { background:linear-gradient(135deg,#fff7e6,#ffd591); color:#d48806; }
  .advice-content { flex:1; min-width:0; }
  .advice-title { font-size:14px; font-weight:600; color:var(--text-primary); margin-bottom:4px; }
  .advice-desc { font-size:12.5px; color:var(--text-secondary); line-height:1.5; }
  .advice-meta { display:flex; gap:10px; font-size:11.5px; color:var(--text-tertiary); margin-top:4px; }
  .advice-meta span { padding:1px 6px; background:#f5f9f5; border-radius:4px; }
  .advice-action { padding:7px 16px; background:linear-gradient(135deg,#1890ff,#096dd9); color:#fff; border:none; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; transition:all 0.2s; }
  .advice-action:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(24,144,255,0.25); }
  /* 报警列表 */
  .alert-list { display:flex; flex-direction:column; }
  .alert-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #f4f6f4; font-size:13.5px; cursor:pointer; transition:background 0.15s; }
  .alert-item:hover { background:#f8fbf9; }
  .alert-item:last-child { border-bottom:none; }
  .alert-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .alert-dot.red { background:var(--error); box-shadow:0 0 4px rgba(255,77,79,0.4); }
  .alert-dot.orange { background:var(--warning); }
  .alert-content { flex:1; min-width:0; }
  .alert-title { font-weight:500; color:var(--text-primary); }
  .alert-meta { font-size:11.5px; color:var(--text-tertiary); margin-top:2px; }
</style>
<style id="standalone-fix">.main-wrapper{margin-left:0!important;width:100%!important;}</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
<link rel="stylesheet" href="css/model-page.css">
</head>
<body data-active-menu="model" data-active-submenu="model-growth">
<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3L11 11M11 3L3 11"/></svg>
        </button>
      </div>
    </div>

    <main class="main-content">
<div class="page-container">
  <div class="mp-header">
    <div class="mp-header-main">
      <div class="mp-header-icon"><i data-uicon="plant"></i></div>
      <div>
        <div class="mp-title">生长模型</div>
        <div class="mp-subtitle">积温驱动 · 生育期跟踪与农事建议</div>
      </div>
    </div>
    <div class="mp-header-actions">
      <span class="mp-live">模型运行中</span>
    </div>
  </div>

  <!-- 顶部4指标 -->
  <div class="patrol-stats">
    <div class="patrol-stat-card green"><div class="stat-value">--</div><div class="stat-label">监测地块总数</div><div class="stat-trend" style="font-size:12px;color:var(--success);"></div></div>
    <div class="patrol-stat-card blue"><div class="stat-value">--</div><div class="stat-label">膨大期地块</div><div class="stat-trend" style="font-size:12px;color:var(--text-tertiary);"></div></div>
    <div class="patrol-stat-card red"><div class="stat-value">--</div><div class="stat-label">生长异常地块</div><div class="stat-trend" style="font-size:12px;color:var(--error);"></div></div>
    <div class="patrol-stat-card orange"><div class="stat-value">--</div><div class="stat-label">本周农事建议</div><div class="stat-trend" style="font-size:12px;color:var(--success);"></div></div>
  </div>

  <!-- 页签 -->
  <div class="mp-tabs">
    <button class="mp-tab active" data-tab="monitor" onclick="mpSwitchTab('monitor')"><i data-uicon="chartBar"></i>生长监测</button>
    <button class="mp-tab" data-tab="gantt" onclick="mpSwitchTab('gantt')"><i data-uicon="calendar"></i>生育期甘特</button>
    <button class="mp-tab" data-tab="advice" onclick="mpSwitchTab('advice')"><i data-uicon="alert"></i>建议与报警</button>
    <button class="mp-tab" data-tab="metrics" onclick="mpSwitchTab('metrics')"><i data-uicon="chartBar"></i>生长指标</button>
  </div>

  <div class="mp-panel active" data-panel="monitor">
  <!-- 积温曲线 + 生长阶段分布（左右） -->
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px;">
    <div class="chart-section">
      <h2 class="section-title">积温累计曲线</h2>
      <div id="chart-temp" class="chart-container" style="height:260px;"></div>
    </div>
    <div class="chart-section">
      <h2 class="section-title">生长阶段分布</h2>
      <div id="chart-stage" class="chart-container" style="height:260px;"></div>
    </div>
  </div>
  </div>

  <div class="mp-panel" data-panel="gantt">
  <!-- 生育期甘特图（横向堆叠条形图） -->
  <div class="chart-section" style="margin-bottom:20px;">
    <h2 class="section-title">生育期甘特图（按月分段）</h2>
    <div id="chart-gantt" class="chart-container" style="height:300px;"></div>
  </div>
  </div>

  <div class="mp-panel" data-panel="advice">
  <!-- 农事建议看板 + 异常报警（左右） -->
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
    <div class="chart-section">
      <h2 class="section-title">农事建议看板</h2>
      <div class="advice-list" id="adviceList"></div>
    </div>

    <div class="chart-section">
      <h2 class="section-title">异常报警 <span id="alertCountBadge" style="background:var(--error);color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:500;margin-left:4px;">0</span></h2>
      <div class="alert-list" id="alertList"></div>
    </div>
  </div>
  </div>

  <div class="mp-panel" data-panel="metrics">
  <!-- 关键生长指标 + 看板参数（左右） -->
  <div style="display:grid; grid-template-columns:1.4fr 1fr; gap:16px; margin-bottom:16px;">
    <div class="chart-section">
      <h2 class="section-title">关键生长指标 <span style="font-size:12px;color:var(--text-tertiary);font-weight:400;">园区均值 · 近 7 日</span></h2>
      <table class="data-table">
        <thead>
          <tr><th>指标</th><th>当前值</th><th>环比</th><th>评价</th><th style="width:74px;text-align:right;">操作</th></tr>
        </thead>
        <tbody id="keyMetricBody"></tbody>
      </table>
    </div>
    <div class="chart-section">
      <div class="section-title" style="display:flex;align-items:center;justify-content:space-between;">
        <span>生长看板参数</span>
        <button class="stage-btn" onclick="editGrowthParams()">编辑</button>
      </div>
      <table class="data-table">
        <thead>
          <tr><th>参数</th><th style="text-align:right;">当前值</th></tr>
        </thead>
        <tbody id="growthParamBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 地块生长曲线采样 -->
  <div class="chart-section">
    <h2 class="section-title">地块生长曲线采样 <span style="font-size:12px;color:var(--text-tertiary);font-weight:400;">近 12 周 · 录入即同步至大屏与移动端</span></h2>
    <table class="data-table">
      <thead>
        <tr><th>地块</th><th>品种</th><th>果实横径(mm)</th><th>株高(cm)</th><th>果实硬度(kg/cm²)</th><th>最近采样</th><th style="width:96px;text-align:right;">操作</th></tr>
      </thead>
      <tbody id="curveSampleBody"></tbody>
    </table>
  </div>
  </div>
</div>
    </main>
  </div>
</div>

<script>
  /* 模型页面通用页签切换 */
  function mpSwitchTab(name) {
    document.querySelectorAll('.mp-tab').forEach(function (t) { t.classList.toggle('active', t.dataset.tab === name); });
    document.querySelectorAll('.mp-panel').forEach(function (p) { p.classList.toggle('active', p.dataset.panel === name); });
    requestAnimationFrame(function () { window.dispatchEvent(new Event('resize')); });
  }
</script>
<script src="js/shared/model-store.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/chart.js"></script>
<script>
// 农事建议列表（数据来自 ModelStore）
function renderGrowthAdvice(M) {
  const list = document.getElementById('adviceList');
  if (!list) return;
  list.innerHTML = M.lists.advice.map(function (a) {
    return '<div class="advice-item">' +
      '<div class="advice-content">' +
        '<div class="advice-title">' + a.title + '</div>' +
        '<div class="advice-desc">' + a.desc + '</div>' +
        '<div class="advice-meta">' + a.meta.map(function (m) { return '<span>' + m + '</span>'; }).join('') + '</div>' +
      '</div>' +
      '<button class="advice-action" onclick="adoptAdvice(\'' + a.title + '\',\'' + a.plotRange + '\')">' + a.action + '</button>' +
    '</div>';
  }).join('');
}

// 异常报警列表（数据来自 ModelStore）
function renderGrowthAlerts(M) {
  const list = document.getElementById('alertList');
  if (!list) return;
  list.innerHTML = M.lists.alerts.map(function (a) {
    return '<div class="alert-item" data-plot="' + a.plot + '">' +
      '<span class="alert-dot ' + a.level + '"></span>' +
      '<div class="alert-content"><div class="alert-title">' + a.title + '</div><div class="alert-meta">' + a.desc + '</div></div>' +
    '</div>';
  }).join('');
  const badge = document.getElementById('alertCountBadge');
  if (badge) badge.textContent = M.lists.alertCount;
}

// 整页重绘：KPI + 列表 + 图表统一取最新 ModelStore（后端预加载到达 / 本地写入都会触发）
function renderGrowthAll() {
  const M = ModelStore.get('growth');
  ModelStore.hydrateKpi('.patrol-stats', 'growth');
  renderGrowthAdvice(M);
  renderGrowthAlerts(M);
  renderGrowthPanels();

  // 1. 积温曲线
  Chart.line('#chart-temp', M.charts.tempTrend);

  // 2. 生长阶段分布（饼图）
  Chart.donut('#chart-stage', { series: M.charts.stageDistribution.items });

  // 3. 甘特图（横向条形图，按月分段）
  Chart.bar('#chart-gantt', M.charts.gantt, {
    direction: 'horizontal',
    legend: { show: true, top: 0, bottom: null, itemGap: 8 },
    grid: { left: 110, right: 20, top: 40, bottom: 20 },
    xAxis: { type: 'value', min: 0, max: 12, name: '月份', nameLocation: 'end', nameGap: 5, nameTextStyle: { color: '#8c8c8c' } },
    yAxis: { type: 'category' },
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } }
  });
}

document.addEventListener('DOMContentLoaded', function() {
  // subscribe 会先同步回调一次完成首渲染，之后随数据到达自动重绘
  ModelStore.subscribe(renderGrowthAll);

  // 报警点击（事件委托，重绘后仍有效）
  const alertList = document.getElementById('alertList');
  if (alertList) alertList.addEventListener('click', function(e) {
    const item = e.target.closest('.alert-item');
    if (!item) return;
    const plot = item.dataset.plot;
    const f = window.parent.document.querySelector('iframe[name="mainFrame"]');
    if (f) f.src = 'enterprise_plot.html?plot=' + encodeURIComponent(plot);
    else location.href = 'enterprise_plot.html?plot=' + encodeURIComponent(plot);
  });

  // 顶部统计卡点击
  document.querySelectorAll('.patrol-stat-card').forEach((card, i) => {
    card.addEventListener('click', () => {
      const targets = ['enterprise_plot.html', 'enterprise_plot.html?stage=enlarging', 'alert_farming.html', 'farming_plan.html'];
      const f = window.parent.document.querySelector('iframe[name="mainFrame"]');
      if (f) f.src = targets[i];
      else location.href = targets[i];
    });
  });
});

function adoptAdvice(taskType, plotRange) {
  try {
    const prefills = JSON.parse(localStorage.getItem('orchard_farming_prefill') || '[]');
    prefills.push({ title: taskType + '（来自生长模型）', taskType: taskType, plotRange: plotRange, priority: '高' });
    localStorage.setItem('orchard_farming_prefill', JSON.stringify(prefills));
    Toast.show('已生成' + taskType + '，跳转农事计划', 'success');
    setTimeout(() => {
      const f = window.parent.document.querySelector('iframe[name="mainFrame"]');
      if (f) f.src = 'farming_plan.html?from=model_growth';
      else location.href = 'farming_plan.html?from=model_growth';
    }, 700);
  } catch (e) { Toast.show('采纳失败：' + e.message, 'error'); }
}

/* ==================== 生长指标页签（数据来自 ModelStore） ==================== */

function todayMMDD() {
  const d = new Date();
  return ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

function renderGrowthPanels() {
  const M = ModelStore.get('growth');
  renderKeyMetricTable(M);
  renderGrowthParams(M);
  renderCurveSampleTable(M);
}

function renderKeyMetricTable(M) {
  const tbody = document.getElementById('keyMetricBody');
  if (!tbody) return;
  tbody.innerHTML = M.keyMetrics.map(function (k, i) {
    const trend = k.trend === 'down' ? ' <span style="color:var(--error);">↓</span>' : ' <span style="color:var(--success);">↑</span>';
    return '<tr>' +
      '<td>' + k.name + '</td>' +
      '<td><b>' + k.value + '</b> <span style="color:var(--text-tertiary);font-size:12px;">' + k.unit + '</span></td>' +
      '<td>' + k.delta + trend + '</td>' +
      '<td>' + k.grade + '</td>' +
      '<td style="text-align:right;"><button class="stage-btn" onclick="editKeyMetric(' + i + ')">编辑</button></td>' +
    '</tr>';
  }).join('');
}

function editKeyMetric(index) {
  const M = ModelStore.get('growth');
  const k = M.keyMetrics[index];
  if (!k) return;
  Modal.form({
    title: '编辑生长指标 · ' + k.name,
    width: '420px',
    values: { value: k.value, delta: k.delta, grade: k.grade },
    fields: [
      { name: 'value', label: '当前值（' + k.unit + '）', type: 'number', step: '0.1', required: true },
      { name: 'delta', label: '环比', type: 'text', placeholder: '如 +6.4% 或 -0.3' },
      { name: 'grade', label: '评价', type: 'text', placeholder: '良好 / 达标 / 正常' }
    ],
    onSubmit: function (data) {
      const val = parseFloat(data.value);
      if (isNaN(val)) { Toast.show('当前值需为数字', 'error'); return false; }
      const prev = parseFloat(k.value);
      const trend = val >= prev ? 'up' : 'down';
      const list = M.keyMetrics.map(function (x) { return Object.assign({}, x); });
      list[index] = Object.assign({}, list[index], {
        value: val,
        delta: data.delta || list[index].delta,
        grade: data.grade || list[index].grade,
        trend: trend
      });
      ModelStore.patch('growth', { keyMetrics: list });
      Toast.show('生长指标已更新', 'success');
    }
  });
}

function renderGrowthParams(M) {
  const tbody = document.getElementById('growthParamBody');
  if (!tbody) return;
  const dash = M.dashboard || {};
  const gdd = M.gdd || {};
  const num = function(v, suffix) { return (v === null || v === undefined || v === '') ? '--' : v + suffix; };
  const rows = [
    ['长势指数', num(dash.vigorIndex, ' / 100')],
    ['成熟度预测吻合率', num(dash.maturityHitRate, ' %')],
    ['生育期积温累计', num(gdd.cumulative, ' ' + (gdd.unit || ''))],
    ['近 12 周周均积温', (gdd.weeklyAvg === null || gdd.weeklyAvg === undefined) ? '--' : '+' + gdd.weeklyAvg + ' ' + (gdd.unit || '')],
    ['较常年同期', gdd.compareNormal || '--'],
    ['最近采样日期', dash.lastSampledAt || '-']
  ];
  tbody.innerHTML = rows.map(function (r) {
    return '<tr><td>' + r[0] + '</td><td style="text-align:right;"><b>' + r[1] + '</b></td></tr>';
  }).join('');
}

function editGrowthParams() {
  const M = ModelStore.get('growth');
  Modal.form({
    title: '编辑生长看板参数',
    width: '480px',
    values: {
      vigorIndex: M.dashboard.vigorIndex,
      maturityHitRate: M.dashboard.maturityHitRate,
      cumulative: M.gdd.cumulative,
      weeklyAvg: M.gdd.weeklyAvg,
      compareNormal: M.gdd.compareNormal
    },
    fields: [
      { name: 'vigorIndex', label: '长势指数（0-100）', type: 'number', min: 0, max: 100, required: true },
      { name: 'maturityHitRate', label: '成熟度预测吻合率（%）', type: 'number', min: 0, max: 100, required: true },
      { name: 'cumulative', label: '生育期积温累计（℃·d）', type: 'number', min: 0, required: true },
      { name: 'weeklyAvg', label: '近 12 周周均积温（℃·d）', type: 'number', min: 0, required: true },
      { name: 'compareNormal', label: '较常年同期', type: 'text', placeholder: '如 +4%' }
    ],
    onSubmit: function (data) {
      const nums = ['vigorIndex', 'maturityHitRate', 'cumulative', 'weeklyAvg'];
      for (let i = 0; i < nums.length; i++) {
        if (isNaN(parseFloat(data[nums[i]]))) { Toast.show('数值字段需为数字', 'error'); return false; }
      }
      const dashboard = Object.assign({}, M.dashboard, {
        vigorIndex: parseFloat(data.vigorIndex),
        maturityHitRate: parseFloat(data.maturityHitRate)
      });
      const gdd = Object.assign({}, M.gdd, {
        cumulative: parseFloat(data.cumulative),
        weeklyAvg: parseFloat(data.weeklyAvg),
        compareNormal: data.compareNormal || M.gdd.compareNormal
      });
      ModelStore.patch('growth', { dashboard: dashboard, gdd: gdd });
      Toast.show('生长看板参数已更新', 'success');
    }
  });
}

function renderCurveSampleTable(M) {
  const tbody = document.getElementById('curveSampleBody');
  if (!tbody) return;
  const gc = M.growthCurves;
  tbody.innerHTML = gc.series.map(function (s, i) {
    const cells = gc.metrics.map(function (m) {
      const arr = (s.values && s.values[m.key]) || [];
      const last = arr.length ? arr[arr.length - 1] : '-';
      return '<td><b>' + last + '</b></td>';
    }).join('');
    return '<tr>' +
      '<td>' + s.plot + '</td>' +
      '<td>' + s.variety + '</td>' +
      cells +
      '<td>' + (M.dashboard.lastSampledAt || '-') + '</td>' +
      '<td style="text-align:right;"><button class="stage-btn" onclick="samplePlotCurve(' + i + ')">录入本周</button></td>' +
    '</tr>';
  }).join('');
}

function samplePlotCurve(index) {
  const M = ModelStore.get('growth');
  const gc = M.growthCurves;
  const s = gc.series[index];
  if (!s) return;
  const fields = gc.metrics.map(function (m) {
    const arr = (s.values && s.values[m.key]) || [];
    return {
      name: m.key,
      label: m.name + '（' + m.unit + '）',
      type: 'number',
      step: '0.1',
      min: 0,
      required: true,
      placeholder: arr.length ? '上周 ' + arr[arr.length - 1] : ''
    };
  });
  Modal.form({
    title: '录入本周生长采样 · ' + s.plot,
    width: '440px',
    fields: fields,
    onSubmit: function (data) {
      const values = {};
      for (let i = 0; i < gc.metrics.length; i++) {
        const key = gc.metrics[i].key;
        const v = parseFloat(data[key]);
        if (isNaN(v) || v <= 0) { Toast.show('请填写有效的采样数值', 'error'); return false; }
        values[key] = v;
      }
      const next = JSON.parse(JSON.stringify(gc));
      gc.metrics.forEach(function (m) {
        const arr = (next.series[index].values[m.key] || []).concat([values[m.key]]);
        while (arr.length > gc.weeks.length) arr.shift();
        next.series[index].values[m.key] = arr;
      });
      const dashboard = Object.assign({}, M.dashboard, { lastSampledAt: todayMMDD() });
      ModelStore.patch('growth', { growthCurves: next, dashboard: dashboard });
      Toast.show('本周采样已录入，大屏与移动端已同步', 'success');
    }
  });
}

</script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/typography.js"></script>
</body>
