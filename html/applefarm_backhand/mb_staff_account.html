<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 作业人员账号</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/page-content.css">
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<style>
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
  }
  .stat-label { font-size: var(--font-size-sm); color: var(--text-tertiary); margin-bottom: var(--space-xs); }
  .stat-value {
    font-size: 26px; font-weight: var(--font-weight-bold);
    color: var(--text-primary); line-height: 1.2; font-variant-numeric: tabular-nums;
  }
  .stat-card.is-on .stat-value { color: var(--success); }
  .stat-card.is-off .stat-value { color: var(--text-tertiary); }
  .notice-bar {
    display: flex; align-items: flex-start; gap: var(--space-sm);
    padding: var(--space-md) var(--space-lg);
    background: var(--info-bg); border: 1px solid var(--info-border);
    border-radius: var(--radius-lg); font-size: var(--font-size-sm);
    color: var(--text-secondary); margin-bottom: var(--space-lg);
  }
  .notice-bar svg { flex-shrink: 0; margin-top: 2px; color: var(--info); }
  .role-tag {
    display: inline-block; padding: 3px 10px; border-radius: var(--radius-sm);
    font-size: var(--font-size-xs); white-space: nowrap;
  }
  .role-tag.admin { background: var(--error-bg); color: var(--error); }
  .role-tag.manager { background: var(--primary-50); color: var(--primary-600); }
  .role-tag.farmer { background: var(--success-bg); color: var(--success); }
  .role-tag.worker { background: var(--gray-100); color: var(--text-secondary); }
  .role-tag.guest { background: var(--warning-bg); color: var(--warning); }
  .status-tag {
    display: inline-block; padding: 3px 10px; border-radius: var(--radius-full);
    font-size: var(--font-size-xs); white-space: nowrap;
  }
  .status-tag.active { background: var(--success-bg); color: var(--success); }
  .status-tag.disabled { background: var(--gray-100); color: var(--text-secondary); }
  .cell-name { font-weight: var(--font-weight-semibold, 600); color: var(--text-primary); }
  .cell-sub { font-size: var(--font-size-xs); color: var(--text-tertiary); }
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 1000;
    justify-content: center; align-items: center; backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--bg-card); border-radius: 12px; width: 92%; max-width: 600px;
    max-height: 85vh; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    animation: modalFadeIn 0.2s ease-out;
  }
  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.95) translateY(-20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-bottom: 1px solid var(--border-default);
  }
  .modal-title { font-size: 16px; font-weight: 600; color: #1f1f1f; }
  .modal-close {
    background: none; border: none; cursor: pointer; padding: 4px;
    font-size: 20px; line-height: 1; color: var(--text-tertiary);
  }
  .modal-close:hover { color: var(--text-secondary); }
  .modal-body { padding: 20px; overflow-y: auto; max-height: calc(85vh - 132px); }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 12px;
    padding: 16px 20px; border-top: 1px solid var(--border-default);
  }
  .form-row { display: flex; gap: var(--space-md); margin-bottom: var(--space-lg); }
  .form-field { flex: 1; }
  .form-field label {
    display: block; font-size: var(--font-size-sm);
    font-weight: var(--weight-medium, 500); color: var(--text-primary); margin-bottom: var(--space-sm);
  }
  .form-field input, .form-field select {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--border-default);
    border-radius: var(--radius-lg); font-size: var(--font-size-base);
    font-family: inherit; background: var(--bg-card); box-sizing: border-box;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .form-field input:focus, .form-field select:focus {
    border-color: var(--primary-500); box-shadow: 0 0 0 4px rgba(24,144,255,0.12); outline: none;
  }
  .checkbox-line {
    display: flex !important; align-items: center; gap: 8px;
    font-weight: 400 !important; font-size: var(--font-size-sm) !important;
    color: var(--text-secondary) !important; cursor: pointer;
  }
  .checkbox-line input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary-500); }
  .expert-tag {
    display: inline-block; margin-left: 6px; padding: 1px 7px;
    border-radius: var(--radius-full); font-size: 11px; font-weight: 500;
    background: var(--primary-50); color: var(--primary-600);
  }
  .form-hint { font-size: var(--font-size-xs); color: var(--text-tertiary); margin-top: 4px; }
  .empty-state { padding: var(--space-2xl) 0; text-align: center; color: var(--text-tertiary); font-size: var(--font-size-sm); }
</style>
</head>

<div class="main-wrapper">
  <div class="tab-bar">
    <div class="tab-bar-actions">
      <button class="tab-close-all" title="关闭全部标签">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3L11 11M11 3L3 11"/>
        </svg>
      </button>
    </div>
  </div>

  <main class="main-content">
    <nav class="device-tabs" aria-label="移动端运营·用户服务">
      <a href="mb_staff_account.html" class="active">作业人员账号</a>
      <a href="mb_feedback_review.html">意见反馈审核</a>
      <a href="mb_expert_reply.html">专家咨询回复</a>
    </nav>
    <div class="page-header">
      <div>
        <div class="page-title">作业人员账号</div>
      </div>
      <div class="page-actions">
        <button class="jg-btn" onclick="resetToMobileDefault()">恢复默认</button>
        <button class="jg-btn jg-btn-primary" onclick="openEdit()">新增账号</button>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">账号总数</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-card is-on">
        <div class="stat-label">启用中</div>
        <div class="stat-value" id="statActive">0</div>
      </div>
      <div class="stat-card is-off">
        <div class="stat-label">已停用</div>
        <div class="stat-value" id="statDisabled">0</div>
      </div>
    </div>

    <div class="page-section search-section">
      <div class="search-bar">
        <select class="search-select" id="roleSelect">
          <option value="">全部角色</option>
          <option value="管理员">管理员</option>
          <option value="果农">果农</option>
          <option value="访客">访客</option>
        </select>
        <select class="search-select" id="statusSelect">
          <option value="">全部状态</option>
          <option value="active">启用中</option>
          <option value="disabled">已停用</option>
        </select>

          <button class="jg-btn jg-btn-primary" onclick="renderTable()">搜索</button>

    <div class="page-section data-section">

          <thead>
            <tr>

              <th>作业人员</th>
              <th style="width:130px;">登录账号</th>
              <th style="width:100px;">角色</th>
              <th style="width:130px;">手机号</th>
              <th style="width:150px;">所属基地</th>
              <th style="width:100px;">状态</th>
              <th style="width:200px;">操作</th>

          <tbody id="staffBody"></tbody>

<script>
/* ============================================================
 * 作业人员账号（移动端运营 · 用户服务）
 * 严格空库模式：数据一律来自后端 API（sf_mb_staff_account），页面不再播种演示账号
 *   消费方 = 移动端 mb_login.html（登录校验 / 微信登录手机号匹配）
 *            后台 mb_expert_reply.html（专家名录与指派下拉）
 *   字段：{ username, pwdHash, name, role, phone, base, status,
 *           isExpert, expertTitle, createdAt?, lastLoginAt? }
 *   密码只保存 SHA-256 摘要，不落明文。
 * ============================================================ */

var STAFF_RESOURCE = 'mb_staff_account';
/* 账号缓存：由 loadStaff() 从后端 API 异步填充，页面不再读写 localStorage 播种 */
let staffData = [];

/* 数据库行(snake_case) → 页面渲染字段 */
function mapStaffRow(row) {
  return {
    username: row.account || '',
    pwdHash: row.password || '',
    name: row.real_name || '',
    role: row.role || '果农',
    phone: row.phone || '',
    base: '',
    status: row.status || 'active',
    isExpert: !!row.is_expert,
    expertTitle: row.expertise || '',
    createdAt: row.created_at || '',
    lastLoginAt: ''
  };
}

/* 表格状态提示：加载中 / 暂无数据 / 加载失败 */
function setStaffStatus(text, isError) {
  var body = document.getElementById('staffBody');
  var empty = document.getElementById('emptyHint');
  if (body) body.innerHTML = '';
  if (empty) {
    empty.style.display = 'block';
    empty.textContent = text;
    empty.style.color = isError ? 'var(--error, #d03050)' : '';
  }
  ['statTotal', 'statActive', 'statDisabled'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.textContent = '0';
  });
}

/* 异步取数：成功后渲染，无数据显示暂无数据，失败显示错误提示；不写 localStorage */
function loadStaff() {
  if (!window.Api) { setStaffStatus('数据加载失败：接口未就绪', true); return; }
  setStaffStatus('正在加载数据...', false);
  Api.get(STAFF_RESOURCE, { page: 1, size: 500 }).then(function (r) {
    if (!r || !r.ok) {
      setStaffStatus('数据加载失败：' + ((r && r.message) || '请求异常'), true);
      return;
    }
    var list = (r.data && r.data.list) || [];
    staffData = list.map(mapStaffRow);
    if (!staffData.length) { setStaffStatus('暂无数据', false); return; }
    renderTable();
  }).catch(function (e) {
    setStaffStatus('数据加载失败：' + (e && e.message ? e.message : '网络异常'), true);
  });
}

var ROLE_CLASS = { 管理员: 'admin', 果农: 'farmer', 访客: 'guest' };

var editingUsername = null;

/* 数据源：loadStaff() 从后端填充的内存缓存，不再读 localStorage / 播种 */
function readStaff() {
  return staffData;
}

/* 仅更新内存缓存，保证增删改交互即时生效；不写 localStorage */
function writeList(list) {
  staffData = list;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function renderStats() {
  var list = readStaff();
  var active = list.filter(function (s) { return s.status !== 'disabled'; }).length;
  document.getElementById('statTotal').textContent = list.length;
  document.getElementById('statActive').textContent = active;
  document.getElementById('statDisabled').textContent = list.length - active;
}

function filteredList() {
  var role = document.getElementById('roleSelect').value;
  var status = document.getElementById('statusSelect').value;
  var kw = document.getElementById('searchInput').value.trim().toLowerCase();

  return readStaff().filter(function (s) {
    if (role && s.role !== role) return false;
    if (status === 'active' && s.status === 'disabled') return false;
    if (status === 'disabled' && s.status !== 'disabled') return false;
    if (kw) {
      var hay = ((s.username || '') + ' ' + (s.name || '') + ' ' + (s.phone || '')).toLowerCase();
      if (hay.indexOf(kw) === -1) return false;
    }
    return true;
  });
}

function renderTable() {
  var list = filteredList();
  renderStats();

  var body = document.getElementById('staffBody');
  var emptyHint = document.getElementById('emptyHint');

  if (!list.length) {
    body.innerHTML = '';
    emptyHint.style.display = 'block';
    emptyHint.textContent = readStaff().length ? '没有符合条件的账号，试试调整筛选条件' : '暂无数据';
    return;
  }
  emptyHint.style.display = 'none';

  body.innerHTML = list.map(function (s, i) {
    var disabled = s.status === 'disabled';
    return '<tr>' +
      '<td class="checkbox-col">' + (i + 1) + '</td>' +
      '<td><div class="cell-name">' + esc(s.name) +
          (s.isExpert ? '<span class="expert-tag">专家</span>' : '') + '</div>' +
          '<div class="cell-sub">' + (disabled ? '已停用，无法登录' : '可正常登录作业端') + '</div></td>' +
      '<td class="text-mono">' + esc(s.username) + '</td>' +
      '<td><span class="role-tag ' + (ROLE_CLASS[s.role] || 'worker') + '">' + esc(s.role) + '</span></td>' +
      '<td class="text-mono">' + esc(s.phone) + '</td>' +
      '<td>' + esc(s.base || '—') + '</td>' +
      '<td><span class="status-tag ' + (disabled ? 'disabled' : 'active') + '">' + (disabled ? '已停用' : '启用中') + '</span></td>' +
      '<td><div class="action-btns">' +
        '<button class="action-btn detail" onclick="openEdit(\'' + esc(s.username) + '\')">编辑</button>' +
        '<button class="action-btn ' + (disabled ? 'download' : 'delete') + '" onclick="toggleStatus(\'' + esc(s.username) + '\')">' +
          (disabled ? '启用' : '停用') + '</button>' +
        '<button class="action-btn delete" onclick="removeStaff(\'' + esc(s.username) + '\')">删除</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

function resetFilter() {
  document.getElementById('roleSelect').value = '';
  document.getElementById('statusSelect').value = '';
  document.getElementById('searchInput').value = '';
  renderTable();
}

function openEdit(username) {
  editingUsername = username || null;
  var s = null;
  if (username) {
    var list = readStaff();
    for (var i = 0; i < list.length; i++) {
      if (list[i].username === username) { s = list[i]; break; }
    }
    if (!s) { Toast.error('未找到该账号'); return; }
  }

  document.getElementById('editModalTitle').textContent = s ? '编辑账号' : '新增账号';
  document.getElementById('editUsername').value = s ? s.username : '';
  document.getElementById('editUsername').disabled = !!s;
  document.getElementById('editName').value = s ? s.name : '';
  document.getElementById('editPhone').value = s ? s.phone : '';
  document.getElementById('editPwd').value = '';
  document.getElementById('editPwd').placeholder = s ? '留空表示不修改密码' : '如 123456';
  document.getElementById('editRole').value = s ? s.role : '果农';
  document.getElementById('editStatus').value = s ? (s.status || 'active') : 'active';
  document.getElementById('editIsExpert').checked = !!(s && s.isExpert);
  document.getElementById('editExpertTitle').value = s ? (s.expertTitle || '') : '';
  document.getElementById('editBase').value = s ? (s.base || '') : '';
  document.getElementById('pwdRequired').style.display = s ? 'none' : '';

  document.getElementById('editModal').classList.add('show');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  editingUsername = null;
}

function submitEdit() {
  var username = document.getElementById('editUsername').value.trim();
  var name = document.getElementById('editName').value.trim();
  var phone = document.getElementById('editPhone').value.trim();
  var pwd = document.getElementById('editPwd').value.trim();
  var old = null;

  if (!username) { Toast.warning('请填写登录账号'); return; }
  if (!name) { Toast.warning('请填写姓名'); return; }
  if (!/^1\d{10}$/.test(phone)) { Toast.warning('请填写正确的 11 位手机号'); return; }
  if (!editingUsername && !pwd) { Toast.warning('请填写登录密码'); return; }

  var list = readStaff();

  // 登录账号与手机号均需唯一（微信登录按手机号匹配账号）
  for (var i = 0; i < list.length; i++) {
    if (list[i].username === username && list[i].username !== editingUsername) {
      Toast.warning('登录账号已存在');
      return;
    }
    if (list[i].phone === phone && list[i].username !== editingUsername) {
      Toast.warning('该手机号已被其他账号占用');
      return;
    }
    if (editingUsername && list[i].username === editingUsername) old = list[i];
  }

  var isExpert = document.getElementById('editIsExpert').checked;
  var payload = {
    username: username,
    name: name,
    role: document.getElementById('editRole').value,
    phone: phone,
    base: document.getElementById('editBase').value.trim(),
    status: document.getElementById('editStatus').value,
    isExpert: isExpert,
    expertTitle: isExpert ? document.getElementById('editExpertTitle').value.trim() : '',
    pwdHash: pwd ? MobileOpsStore.hashPwd(pwd) : (old ? old.pwdHash : ''),
    createdAt: old ? old.createdAt : MobileOpsStore.now(),
    lastLoginAt: old ? (old.lastLoginAt || '') : '',
    updatedAt: MobileOpsStore.now()
  };

  if (editingUsername) {
    for (var k = 0; k < list.length; k++) {
      if (list[k].username === editingUsername) {
        list[k] = payload;
        break;
      }
    }
  } else {
    list.push(payload);
  }

  writeList(list);
  MobileOpsStore.audit(editingUsername ? '编辑账号' : '新增账号', 'staff', username,
    name + ' / ' + payload.role + (isExpert ? ' / 农技专家' : ''));
  closeEditModal();
  renderTable();
  Toast.success(editingUsername ? '账号已更新' : '账号已新增');
}

function toggleStatus(username) {
  var list = readStaff();
  for (var i = 0; i < list.length; i++) {
    if (list[i].username === username) {
      list[i].status = list[i].status === 'disabled' ? 'active' : 'disabled';
      list[i].updatedAt = MobileOpsStore.now();
      writeList(list);
      MobileOpsStore.audit(list[i].status === 'active' ? '启用账号' : '停用账号', 'staff', username);
      renderTable();
      Toast.success(list[i].status === 'active' ? '账号已启用' : '账号已停用');
      return;
    }
  }
}

function removeStaff(username) {
  ConfirmDialog.show({
    title: '删除账号',
    message: '确定删除作业人员账号「' + username + '」吗？该账号将无法再登录移动端。',
    onConfirm: function () {
      var list = readStaff().filter(function (s) { return s.username !== username; });
      writeList(list);
      MobileOpsStore.audit('删除账号', 'staff', username);
      renderTable();
      Toast.success('账号已删除');
    }
  });
}

/* 严格空库模式：不再「恢复演示账号」，改为从数据库重新加载 */
function resetToMobileDefault() {
  ConfirmDialog.show({
    title: '重新加载',
    message: '将从数据库重新加载作业人员账号，未保存到后端的本地改动会丢失。是否继续？',
    onConfirm: function () {
      loadStaff();
      Toast.success('已从数据库重新加载');
    }
  });
}

document.addEventListener('DOMContentLoaded', function () {
  MobileOpsStore.ready();
  // 严格空库模式：账号一律由后端 API 拉取，不再播种演示账号
  loadStaff();
  MobileOpsStore.subscribe(function (key) {
    if (key === MobileOpsStore.KEYS.staff) renderTable();
  });
  document.getElementById('searchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') renderTable();
  });
});
</script>
</body>
</html>
