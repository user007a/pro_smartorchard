<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 成效记录</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  /* ---------- 页头 ---------- */
  .ar-header {
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    background: linear-gradient(120deg, #f5faff 0%, #ffffff 58%);
    border: 1px solid var(--border-light); border-radius: 14px;
    padding: 16px 20px; margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(16, 24, 40, 0.05);
  }
  .ar-header-main { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .ar-header-icon {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    background: var(--gradient-primary); color: #fff;
    box-shadow: 0 6px 14px rgba(24, 144, 255, 0.28);
  }
  .ar-title { font-size: 19px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.2px; }
  .ar-subtitle { font-size: 12.5px; color: var(--text-tertiary); margin-top: 3px; }
  .ar-header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .ar-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; color: var(--primary-600);
    background: var(--primary-50); border: 1px solid #bae0ff;
    border-radius: 999px; padding: 5px 12px; white-space: nowrap;
  }

  /* ---------- 指标速览 ---------- */
  .kpi-strip {
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: #fff; border: 1px solid var(--border-light); border-radius: 14px;
    box-shadow: 0 1px 3px rgba(16, 24, 40, 0.05);
    margin-bottom: 12px; overflow: hidden;
  }
  .kpi-item { position: relative; padding: 12px 16px; }
  .kpi-item + .kpi-item::before {
    content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 1px; height: 30px; background: var(--border-light);
  }
  .kpi-top { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .kpi-icon {
    width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    background: var(--kb, #e6f4ff); color: var(--kc, #1890ff);
  }
  .kpi-label { font-size: 12.5px; font-weight: 500; color: var(--text-secondary); }
  .kpi-value {
    font-size: 21px; font-weight: 700; line-height: 1.15; letter-spacing: -0.3px;
    color: var(--text-primary); white-space: nowrap;
  }
  .kpi-value small { font-size: 12px; font-weight: 500; color: var(--text-tertiary); margin-left: 1px; }
  .kpi-value.down { color: var(--success); }
  .kpi-value.up { color: var(--accent-500); }
  .kpi-value.flat-bad { color: var(--error); }
  .kpi-sub { margin-top: 4px; font-size: 11.5px; color: var(--text-tertiary); white-space: nowrap; }

  /* ---------- 页签 ---------- */
  .ar-tabs {
    display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 12px;
    background: #fff; border: 1px solid var(--border-light); border-radius: 12px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
  }
  .ar-tab {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 18px; border: none; background: transparent; border-radius: 9px;
    font-size: 13.5px; font-weight: 500; color: var(--text-secondary);
    font-family: inherit; cursor: pointer; transition: all 0.2s ease;
  }
  .ar-tab:hover { color: var(--primary-600); background: var(--primary-50); }
  .ar-tab.active {
    background: var(--gradient-primary); color: #fff; font-weight: 600;
    box-shadow: 0 3px 10px rgba(24, 144, 255, 0.28);
  }
  .ar-tab.active:hover { color: #fff; }
  .ar-tab .tab-count {
    font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 8px;
    background: rgba(0, 0, 0, 0.06); font-weight: 600;
  }
  .ar-tab.active .tab-count { background: rgba(255, 255, 255, 0.24); }
  .ar-panel { display: none; }
  .ar-panel.active { display: block; animation: arFade 0.28s ease; }
  @keyframes arFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- 通用卡片 ---------- */
  .ar-card {
    background: #fff; border: 1px solid var(--border-light); border-radius: 14px;
    box-shadow: 0 1px 3px rgba(16, 24, 40, 0.05); overflow: hidden;
  }
  .ar-card-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 18px; border-bottom: 1px solid var(--border-light);
  }
  .ar-card-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600; color: var(--text-primary);
  }
  .ar-card-title .bar { width: 3px; height: 14px; border-radius: 2px; background: var(--gradient-primary); }
  .ar-card-title .hint { font-size: 11.5px; font-weight: 400; color: var(--text-tertiary); }
  .ar-note { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-tertiary); }
  .ar-card-body { padding: 14px 18px 16px; }
  .ar-card-body.no-pad { padding: 0; }

  /* ---------- 明细表 ---------- */
  .data-table { min-width: 860px; }
  .item-cell { display: inline-flex; align-items: center; gap: 8px; }
  .item-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .item-name { font-weight: 600; color: var(--text-primary); }
  .delta-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .delta-badge.good { background: var(--success-bg); color: #389e0d; border: 1px solid var(--success-border); }
  .delta-badge.bad { background: var(--error-bg); color: #cf1322; border: 1px solid var(--error-border); }
  .delta-badge.flat { background: var(--gray-50); color: var(--text-tertiary); border: 1px solid var(--border-light); }
  .desc-cell { font-size: 12.5px; color: var(--text-tertiary); }
  .empty-row td { text-align: center; color: var(--text-tertiary); padding: 40px 0; }

  /* ---------- 数字化里程碑 ---------- */
  .timeline-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 40px; }
  .tl-item { display: flex; gap: 14px; padding-bottom: 18px; position: relative; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item::before {
    content: ''; position: absolute; left: 8px; top: 26px; bottom: 0;
    width: 2px; background: var(--border-light);
  }
  .tl-item:last-child::before { display: none; }
  .tl-dot {
    width: 18px; height: 18px; border-radius: 50%;
    border: 3px solid var(--primary-400); background: #fff;
    flex: none; position: relative; z-index: 1; margin-top: 4px;
  }
  .tl-item.current .tl-dot {
    border-color: var(--primary-500); background: var(--primary-500);
    box-shadow: 0 0 0 4px rgba(24, 144, 255, 0.16);
  }
  .tl-card {
    flex: 1; min-width: 0;
    background: #fafcff; border: 1px solid var(--border-light); border-radius: 12px;
    padding: 12px 16px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .tl-card:hover {
    background: #fff; border-color: #bae0ff;
    box-shadow: 0 6px 16px rgba(16, 24, 40, 0.07); transform: translateY(-1px);
  }
  .tl-item.current .tl-card { background: linear-gradient(120deg, #f0f8ff, #ffffff); border-color: #bae0ff; }
  .tl-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .tl-date { font-size: 12.5px; font-weight: 600; color: var(--primary-600); font-variant-numeric: tabular-nums; }
  .tl-badge {
    font-size: 10.5px; font-weight: 600; padding: 1px 8px;
    border-radius: 999px; background: var(--primary-500); color: #fff;
  }
  .tl-card h5 { margin: 0 0 3px; font-size: 14.5px; font-weight: 600; color: var(--text-primary); }
  .tl-card p { margin: 0; font-size: 12.5px; line-height: 1.65; color: var(--text-tertiary); }
  .tl-actions { display: flex; gap: 12px; margin-top: 8px; }
  .tl-link {
    padding: 0; border: none; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: 500; color: var(--primary-600);
  }
  .tl-link:hover { text-decoration: underline; }
  .tl-link.danger { color: var(--error); }

  /* ---------- 成果亮点与系统运维 ---------- */
  .ops-form {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
    align-items: end;
  }
  .ops-label {
    display: block;
    font-size: 12.5px;
    color: var(--text-tertiary);
    margin-bottom: 6px;
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 1280px) {
    .kpi-strip { grid-template-columns: repeat(3, 1fr); }
    .kpi-item + .kpi-item::before { display: none; }
    .kpi-item:nth-child(n+4) { border-top: 1px solid var(--border-light); }
  }
  @media (max-width: 900px) {
    .ar-header { flex-direction: column; align-items: flex-start; }
    .kpi-strip { grid-template-columns: repeat(2, 1fr); }
    .timeline-grid { grid-template-columns: 1fr; }
  }
</style>

  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>

<body data-active-menu="数据运营" data-active-submenu="成效记录">

<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <div class="page-container">
        <!-- 页头 -->
        <div class="ar-header">
          <div class="ar-header-main">
            <div class="ar-header-icon"><i data-uicon="medal"></i></div>
            <div>
              <div class="ar-title">成效记录</div>
              <div class="ar-subtitle">数字农业提质增效实施前后对比与关键里程碑沉淀</div>
            </div>
          </div>
          <div class="ar-header-actions">
            <span class="ar-tag"><i data-uicon="chartBar"></i><span id="kpiItemCount">-</span> 项成效指标</span>
            <span class="ar-tag"><i data-uicon="clock"></i><span id="kpiMsCount">-</span> 个里程碑</span>
          </div>
        </div>

        <!-- 指标速览 -->
        <div class="kpi-strip" id="statCards"></div>

        <!-- 页签 -->
        <div class="ar-tabs">
          <button class="ar-tab active" data-tab="compare" onclick="switchTab('compare')">
            <i data-uicon="chartBar"></i>实施前后对比
          </button>
          <button class="ar-tab" data-tab="detail" onclick="switchTab('detail')">
            <i data-uicon="table"></i>成效明细<span class="tab-count" id="detailCount">-</span>
          </button>
          <button class="ar-tab" data-tab="milestone" onclick="switchTab('milestone')">

          </button>
          <button class="ar-tab" data-tab="highlight" onclick="switchTab('highlight')">
            <i data-uicon="star"></i>成果亮点与运维
          </button>
        </div>

        <!-- 面板一：实施前后对比 -->
        <div class="ar-panel active" id="panel-compare">
          <div class="ar-card">
            <div class="ar-card-head">
              <div class="ar-card-title">
                <span class="bar"></span>提质增效实施前后对比
                <span class="hint">以实施前为 100% 基准</span>
              </div>
              <span class="ar-note"><i data-uicon="info"></i>柱高为相对基准的百分比</span>
            </div>
            <div class="ar-card-body">
              <div id="chart-achievement" style="height:340px;"></div>
            </div>
          </div>
        </div>

        <!-- 面板二：成效明细 -->
        <div class="ar-panel" id="panel-detail">
          <div class="ar-card">
            <div class="ar-card-head">
              <div class="ar-card-title">
                <span class="bar"></span>成效明细
                <span class="hint">五项核心指标逐项对比</span>
              </div>
              <span class="ar-note"><i data-uicon="info"></i>数值为相对实施前基准的百分比</span>
            </div>
            <div class="ar-card-body no-pad">
              <div class="data-table-wrapper">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>成效项</th>
                      <th>实施前</th>
                      <th>实施后</th>
                      <th>变化幅度</th>
                      <th>说明</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="tableBody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <!-- 面板三：数字化里程碑 -->
        <div class="ar-panel" id="panel-milestone">
          <div class="ar-card">
            <div class="ar-card-head">
              <div class="ar-card-title">
                <span class="bar"></span>数字化里程碑
                <span class="hint">按时间倒序排列</span>
              </div>
              <button class="btn btn-primary" onclick="openMilestoneForm()">新增里程碑</button>
            </div>
            <div class="ar-card-body">
              <div class="timeline-grid" id="timeline-grid"></div>
            </div>
          </div>
        </div>

        <!-- 面板四：成果亮点与系统运维 -->
        <div class="ar-panel" id="panel-highlight">
          <div class="ar-card" style="margin-bottom:16px;">
            <div class="ar-card-head">
              <div class="ar-card-title">

              </div>
              <button class="btn btn-primary" onclick="openHighlightForm()">新增亮点</button>
            </div>
            <div class="ar-card-body no-pad">
              <div class="data-table-wrapper">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>亮点名称</th>
                      <th>数值</th>
                      <th>单位</th>
                      <th>说明</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="hlTableBody"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="ar-card">
            <div class="ar-card-head">
              <div class="ar-card-title">
                <span class="bar"></span>系统运行信息

              <div class="ops-form">

                  <input type="date" class="form-input" id="opsOnlineSince">
                </div>
                <div>
                  <label class="ops-label">最近故障日期</label>
                  <input type="date" class="form-input" id="opsLastDowntime">
                </div>
                <div>
                  <label class="ops-label">手动天数（留空自动计算）</label>
                  <input type="number" class="form-input" id="opsManualDays" min="0" step="1" placeholder="自动计算">
                </div>
                <div>
                  <button class="btn btn-primary" onclick="saveOps()">保存</button>

            </div>
          </div>
        </div>
      </div>
    </main>

<script>
(function(){
  'use strict';

  function fmt(n){
    n = Number(n) || 0;
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function esc(v){
    return String(v === undefined || v === null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // 顶部指标速览关注的成效项（与 achievements 明细表逐项对应，含「减损」）
  var FOCUS_ITEMS = ['节水', '节肥', '减药', '增产', '减损'];

  // 各成效项的图标与主题色
  var ITEM_META = {
    '节水': { color: '#1890ff', bg: '#e6f4ff', icon: 'drop' },
    '节肥': { color: '#52c41a', bg: '#f6ffed', icon: 'seed' },
    '减药': { color: '#13c2c2', bg: '#e6fffb', icon: 'shield' },
    '增产': { color: '#ff6b35', bg: '#fff2e8', icon: 'plant' },
    '减损': { color: '#722ed1', bg: '#f5f0ff', icon: 'box' }
  };
  function metaOf(name){
    return ITEM_META[name] || { color: '#8c8c8c', bg: '#f5f5f5', icon: 'star' };
  }

  // 语义判定：节水性指标（节水/节肥/减药/减损）下降为正向，
  // 增产类上升为正向，其余为负向。卡片与表格共用同一口径。
  function isReduce(name){ return name !== '增产'; }
  function deltaIsPositive(name, delta){
    if (!delta) return false;
    return isReduce(name) ? delta < 0 : delta > 0;
  }

  var els = {
    statCards   : document.getElementById('statCards'),
    tbody       : document.getElementById('tableBody'),
    timeline    : document.getElementById('timeline-grid'),
    kpiItemCount: document.getElementById('kpiItemCount'),
    kpiMsCount  : document.getElementById('kpiMsCount'),
    detailCount : document.getElementById('detailCount'),
    msCount     : document.getElementById('msCount')
  };

  var chartDirty = false;

  function findItem(item){
    var list = DataStore.achievements();
    for (var i = 0; i < list.length; i++){
      if (list[i].item === item) return list[i];
    }
    return null;
  }

  function renderStats(){
    var list = DataStore.achievements();
    els.statCards.innerHTML = FOCUS_ITEMS.map(function(name){
      var row = findItem(name);
      var delta = row ? (Number(row.delta) || 0) : 0;
      var reduce = isReduce(name);
      var meta = metaOf(name);
      // 节水性指标下降为正向 → 绿色；增产上升为正向 → 橙色强调
      var positive = deltaIsPositive(name, delta);
      var valueCls = positive ? (reduce ? 'down' : 'up') : (delta ? 'flat-bad' : '');
      var sub = row
        ? (reduce ? '实施后降至基准的 ' + fmt(row.after) + '%' : '实施后达基准的 ' + fmt(row.after) + '%')
        : '暂无数据';
      return '<div class="kpi-item">' +
        '<div class="kpi-top">' +
          '<span class="kpi-icon" style="--kc:' + meta.color + ';--kb:' + meta.bg + '"><i data-uicon="' + meta.icon + '"></i></span>' +
          '<span class="kpi-label">' + esc(name) + '</span>' +
        '</div>' +
        '<div class="kpi-value ' + valueCls + '">' + (delta > 0 ? '+' : '') + fmt(delta) + '<small>%</small></div>' +
        '<div class="kpi-sub">' + esc(sub) + '</div>' +
      '</div>';
    }).join('');
    if (window.Icons) Icons.mount(els.statCards);

    els.kpiItemCount.textContent = list.length;
    els.detailCount.textContent = list.length;
  }

  function renderTable(){
    var list = DataStore.achievements();
    if (!list.length){
      els.tbody.innerHTML = '<tr class="empty-row"><td colspan="6">暂无成效数据</td></tr>';
      return;
    }
    els.tbody.innerHTML = list.map(function(x){
      var delta = Number(x.delta) || 0;
      var unit = x.unit || '%';
      var meta = metaOf(x.item);
      // 与顶部指标卡同一语义口径：节水性下降为正向，增产上升为正向
      var positive = deltaIsPositive(x.item, delta);
      var badgeCls = delta === 0 ? 'flat' : (positive ? 'good' : 'bad');
      var deltaText = delta === 0
        ? '持平'
        : (delta < 0 ? '↓ ' : '↑ ') + fmt(Math.abs(delta)) + unit;
      return '<tr>' +
        '<td><span class="item-cell"><span class="item-dot" style="background:' + meta.color + '"></span>' +
          '<span class="item-name">' + esc(x.item) + '</span></span></td>' +
        '<td class="num">' + fmt(x.before) + unit + '</td>' +
        '<td class="num"><strong>' + fmt(x.after) + unit + '</strong></td>' +
        '<td><span class="delta-badge ' + badgeCls + '">' + deltaText + '</span></td>' +
        '<td class="desc-cell">' + esc(x.desc || '-') + '</td>' +
        '<td><div class="action-btns">' +
          '<button class="action-btn" onclick="editAchievement(\'' + x.id + '\')">编辑</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  function renderTimeline(){
    var list = DataStore.milestones().slice().sort(function(a, b){
      return String(a.date).localeCompare(String(b.date));
    }).reverse();

    els.msCount.textContent = list.length;
    els.kpiMsCount.textContent = list.length;

    if (!list.length){
      els.timeline.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="empty-text">暂无里程碑记录</div></div>';
      return;
    }

    els.timeline.innerHTML = list.map(function(x, i){
      return '<div class="tl-item' + (i === 0 ? ' current' : '') + '">' +
        '<div class="tl-dot"></div>' +
        '<div class="tl-card">' +
          '<div class="tl-head">' +
            '<span class="tl-date">' + esc(x.date) + '</span>' +
            (i === 0 ? '<span class="tl-badge">最新</span>' : '') +
          '</div>' +
          '<h5>' + esc(x.title) + '</h5>' +
          '<p>' + esc(x.desc || '') + '</p>' +
          '<div class="tl-actions">' +
            '<button class="tl-link" onclick="openMilestoneForm(\'' + x.id + '\')">编辑</button>' +
            '<button class="tl-link danger" onclick="deleteMilestone(\'' + x.id + '\')">删除</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function renderChart(){
    var panel = document.getElementById('panel-compare');
    // 页签隐藏时容器宽度为 0，延迟到切换回来再渲染
    if (!panel.classList.contains('active')) { chartDirty = true; return; }
    chartDirty = false;

    var list = DataStore.achievements();
    Chart.bar('#chart-achievement', {
      categories: list.map(function(x){ return x.item; })
    }, {
      grid: { left: 12, right: 24, top: 42, bottom: 46, containLabel: true },
      legend: {
        bottom: 0, itemWidth: 12, itemHeight: 12, itemGap: 18,
        textStyle: { color: '#595959', fontSize: 12 }
      },
      yAxis: {
        type: 'value', min: 0, max: 130,
        axisLine: { show: false }, axisTick: { show: false },
        axisLabel: { formatter: '{value}%', color: '#8c8c8c', fontSize: 12 },
        splitLine: { lineStyle: { color: '#f0f0f0', type: 'dashed' } }
      },
      series: [
        {
          name: '实施前', type: 'bar', barWidth: '24%',
          data: list.map(function(x){ return Number(x.before) || 0; }),
          itemStyle: { color: '#d9d9d9', borderRadius: [4, 4, 0, 0] },
          label: { show: true, position: 'top', color: '#8c8c8c', fontSize: 11, formatter: '{c}%' }
        },
        {
          name: '实施后', type: 'bar', barWidth: '24%',
          data: list.map(function(x){ return Number(x.after) || 0; }),
          itemStyle: {
            color: {
              type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
              colorStops: [{ offset: 0, color: '#1890ff' }, { offset: 1, color: '#69c0ff' }]
            },
            borderRadius: [4, 4, 0, 0]
          },
          label: { show: true, position: 'top', color: '#096dd9', fontSize: 11, fontWeight: 600, formatter: '{c}%' },
          markLine: {
            silent: true, symbol: 'none',
            data: [{ yAxis: 100 }],
            lineStyle: { color: '#ff6b35', width: 1, type: 'dashed' },
            label: { formatter: '基准 100%', color: '#ff6b35', fontSize: 11, position: 'insideEndTop' }
          }
        }
      ]
    });
  }

  function switchTab(name){
    document.querySelectorAll('.ar-tab').forEach(function(t){
      t.classList.toggle('active', t.dataset.tab === name);
    });
    document.querySelectorAll('.ar-panel').forEach(function(p){
      p.classList.toggle('active', p.id === 'panel-' + name);
    });
    if (name === 'compare' && chartDirty) requestAnimationFrame(renderChart);
  }
  window.switchTab = switchTab;

  /* ---------------- 成效项与里程碑维护（写入共享数据层，驾驶舱同步） ---------------- */
  function editAchievement(id){
    var item = DataStore.achievements().filter(function(x){ return x.id === id; })[0];
    if (!item){ Toast.show('成效项不存在', 'error'); return; }
    Modal.form({
      title: '编辑成效项 · ' + item.item,
      submitText: '保存',
      width: '520px',
      values: { before: item.before, after: item.after, desc: item.desc || '' },
      fields: [
        { name: 'before', label: '实施前（基准值）', type: 'number', min: 1, step: 0.1, required: true, hint: '以实施前为 100% 基准' },
        { name: 'after', label: '实施后', type: 'number', min: 0, step: 0.1, required: true, hint: '变化幅度由实施前后自动计算' },
        { name: 'desc', label: '说明', type: 'textarea', placeholder: '如：亩均节水 32%' }
      ],
      onSubmit: function(data){
        var res = DataStore.updateAchievement(id, {
          before: data.before,
          after: data.after,
          desc: data.desc
        });
        if (!res.ok){ Toast.show(res.message, 'error'); return false; }
        Toast.show('成效项已更新，驾驶舱已同步', 'success');
        return true;
      }
    });
  }

  function openMilestoneForm(id){
    var item = null;
    if (id){
      item = DataStore.milestones().filter(function(x){ return x.id === id; })[0] || null;
      if (!item){ Toast.show('里程碑不存在', 'error'); return; }
    }
    Modal.form({
      title: item ? '编辑里程碑' : '新增里程碑',
      submitText: item ? '保存' : '新增',
      width: '520px',
      values: item ? { date: item.date, title: item.title, desc: item.desc || '' } : {},
      fields: [
        { name: 'date', label: '时间', type: 'text', required: true, placeholder: '2026-11', hint: '格式 YYYY-MM 或 YYYY-MM-DD' },
        { name: 'title', label: '里程碑标题', type: 'text', required: true, placeholder: '如：数字化育苗中心投产' },
        { name: 'desc', label: '说明', type: 'textarea', placeholder: '简要说明该里程碑的成果' }
      ],
      onSubmit: function(data){
        var res = DataStore.upsertMilestone({
          id: item ? item.id : '',
          date: data.date,
          title: data.title,
          desc: data.desc
        });
        if (!res.ok){ Toast.show(res.message, 'error'); return false; }
        Toast.show(item ? '里程碑已更新，驾驶舱已同步' : '里程碑已新增，驾驶舱已同步', 'success');
        return true;
      }
    });
  }

  function deleteMilestone(id){
    var item = DataStore.milestones().filter(function(x){ return x.id === id; })[0];
    if (!item) return;
    Confirm.delete('确定删除里程碑「' + esc(item.title) + '」吗？删除后驾驶舱成果时间轴将同步调整。').then(function(ok){
      if (!ok) return;
      DataStore.removeMilestone(id);
      Toast.show('里程碑已删除', 'success');
    });
  }

  /* ---------------- 成果亮点与系统运维（写入共享数据层，驾驶舱同步） ---------------- */
  function renderHighlights(){
    var body = document.getElementById('hlTableBody');
    if (!body) return;
    var list = DataStore.highlights();
    if (!list.length){
      body.innerHTML = '<tr class="empty-row"><td colspan="5">暂无成果亮点</td></tr>';
      return;
    }
    body.innerHTML = list.map(function(x){
      return '<tr>' +
        '<td>' + esc(x.item) + '</td>' +
        '<td class="num"><strong>' + esc(x.value) + '</strong></td>' +
        '<td>' + esc(x.unit || '-') + '</td>' +
        '<td class="desc-cell">' + esc(x.desc || '-') + '</td>' +
        '<td><div class="action-btns">' +
          '<button class="action-btn" onclick="openHighlightForm(\'' + x.id + '\')">编辑</button>' +
          '<button class="action-btn delete" onclick="deleteHighlight(\'' + x.id + '\')">删除</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  function openHighlightForm(id){
    var item = null;
    if (id){
      item = DataStore.highlights().filter(function(x){ return x.id === id; })[0] || null;
      if (!item){ Toast.show('成果亮点不存在', 'error'); return; }
    }
    Modal.form({
      title: item ? '编辑成果亮点' : '新增成果亮点',
      submitText: item ? '保存' : '新增',
      width: '520px',
      values: item ? { item: item.item, value: item.value, unit: item.unit, desc: item.desc || '' } : {},
      fields: [
        { name: 'item', label: '亮点名称', type: 'text', required: true, placeholder: '如：全年节水' },
        { name: 'value', label: '数值', type: 'number', min: 0, step: 0.01, required: true, placeholder: '如：8600' },
        { name: 'unit', label: '单位', type: 'text', placeholder: '如：吨、%' },
        { name: 'desc', label: '说明', type: 'textarea', placeholder: '口径说明，如：滴灌替代漫灌' }
      ],
      onSubmit: function(data){
        var res = DataStore.upsertHighlight({
          id: item ? item.id : '',
          item: data.item,
          value: data.value,
          unit: data.unit,
          desc: data.desc
        });
        if (!res.ok){ Toast.show(res.message, 'error'); return false; }
        Toast.show(item ? '成果亮点已更新，驾驶舱已同步' : '成果亮点已新增，驾驶舱已同步', 'success');
        return true;
      }
    });
  }

  function deleteHighlight(id){
    var item = DataStore.highlights().filter(function(x){ return x.id === id; })[0];
    if (!item) return;
    Confirm.delete('确定删除成果亮点「' + esc(item.item) + '」吗？删除后驾驶舱底部将同步移除。').then(function(ok){
      if (!ok) return;
      DataStore.removeHighlight(id);
      Toast.show('成果亮点已删除', 'success');
    });
  }

  function renderOps(){
    var ops = DataStore.ops();
    document.getElementById('opsOnlineSince').value = ops.onlineSince || '';
    document.getElementById('opsLastDowntime').value = ops.lastDowntime || '';
    document.getElementById('opsManualDays').value =
      (ops.manualUptimeDays === null || ops.manualUptimeDays === undefined) ? '' : ops.manualUptimeDays;
    var days = DataStore.summary().uptimeDays;
    document.getElementById('uptimePreview').textContent = '当前展示：' + (days == null ? '—' : days + ' 天');
  }

  function saveOps(){
    var res = DataStore.setOps({
      onlineSince: document.getElementById('opsOnlineSince').value,
      lastDowntime: document.getElementById('opsLastDowntime').value,
      manualUptimeDays: document.getElementById('opsManualDays').value
    });
    if (!res.ok){ Toast.show(res.message, 'error'); return; }
    Toast.show('系统运行信息已保存，驾驶舱已同步', 'success');
  }

  window.editAchievement = editAchievement;
  window.openMilestoneForm = openMilestoneForm;
  window.deleteMilestone = deleteMilestone;
  window.openHighlightForm = openHighlightForm;
  window.deleteHighlight = deleteHighlight;
  window.saveOps = saveOps;

  DataStore.subscribe(function(){
    renderStats();
    renderTable();
    renderTimeline();
    renderHighlights();
    renderOps();
    renderChart();
  });
})();
</script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/search-helper.js"></script>
<script src="js/typography.js"></script>
</body>
</html>
