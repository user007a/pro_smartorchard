<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 无人机巡检</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">

<style>
  .drone-live-info { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .drone-live-info .info-item { padding:16px; background:var(--gray-50); border-radius:8px; text-align:center; }
  .drone-live-info .info-label { font-size:12px; color:var(--text-tertiary); margin-bottom:6px; }
  .drone-live-info .info-value { font-size:20px; font-weight:600; }
  /* 架次号与进度条 */
  .sortie-no { font-weight:600; color:var(--text-secondary); font-variant-numeric:tabular-nums; }
  .sortie-no.running { color:var(--primary-500); }
  .progress-cell { display:flex; align-items:center; gap:8px; min-width:120px; }
  .progress-cell .progress { flex:1; }
  .progress-cell .progress-fill { background: linear-gradient(90deg, var(--primary-400, #40a9ff), var(--primary-500, #1890ff)); }
  .progress-cell .progress-text { font-size:12px; font-weight:600; color:var(--text-secondary); min-width:34px; text-align:right; font-variant-numeric:tabular-nums; }
  .progress-cell.running .progress-text { color:var(--primary-500); }
  .rtk-tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:500; }
  .rtk-tag.fixed { background:#d9f7be; color:#3a8618; }
  .rtk-tag.float { background:#fff1b8; color:#8c6d10; }
  .source-badge { display:inline-block; padding:1px 6px; border-radius:4px; font-size:10px; line-height:1.6; background:#e6f4ff; color:#0958d9; margin-left:4px; vertical-align:middle; }
  /* 航线回放示意 */
  .route-play { border:1px solid var(--border-light); border-radius:10px; padding:14px; background:var(--gray-50); }
  .route-svg { width:100%; height:auto; display:block; }
  .route-line { fill:none; stroke:var(--primary-500); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
  .route-line-area { fill:rgba(24,144,255,0.10); stroke:none; }
  .route-point { fill:#fff; stroke:var(--primary-500); stroke-width:2; }
  .route-point.start { fill:var(--success); stroke:var(--success); }
  .route-point-label { font-size:10px; fill:var(--text-tertiary); }
  .waypoint-list { max-height:220px; overflow-y:auto; margin-top:12px; border-top:1px dashed var(--border-light); }
  .waypoint-item { display:flex; justify-content:space-between; padding:6px 4px; font-size:12px; border-bottom:1px dashed #f0f0f0; }
  .waypoint-item span:first-child { color:var(--text-tertiary); font-weight:600; }
  .waypoint-item span:last-child { color:var(--text-secondary); font-variant-numeric:tabular-nums; }
  /* 页内 Tab 切换 */
  .view-tabs { display:flex; gap:8px; margin-bottom:16px; border-bottom:1px solid var(--border-light); }
  .view-tab { padding:10px 20px; border:none; background:none; font-size:14px; font-family:inherit;
    color:var(--text-secondary); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; }
  .view-tab:hover { color:var(--primary-500); }
  .view-tab.active { color:var(--primary-500); font-weight:600; border-bottom-color:var(--primary-500); }
</style>
<style id="standalone-fix">
  .main-wrapper{margin-left:0!important;width:100%!important;}

<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">

<body data-active-menu="farming" data-active-submenu="drone-patrol">

<script>
/* ==========================================================
 * 无人机巡检 —— 巡检任务 / 飞行日志 / 巡检异常
 * 数据源：ProductionStore
 * ========================================================== */
var PS = window.ProductionStore;
var currentSortieId = '';

var SORTIE_STATUS = {
  '待执行': '<span class="status-tag normal">待执行</span>',
  '执行中': '<span class="status-tag warning">执行中</span>',
  '已完成': '<span class="status-tag done">已完成</span>',
  '已取消': '<span class="status-tag normal">已取消</span>'
};

function switchDroneTab(tab) {
  var views = { task: 'viewTask', log: 'viewLog', anomaly: 'viewAnomaly' };
  var tabs = { task: 'tabTask', log: 'tabLog', anomaly: 'tabAnomaly' };
  Object.keys(views).forEach(function (k) {
    var v = document.getElementById(views[k]);
    var t = document.getElementById(tabs[k]);
    if (v) v.style.display = (k === tab) ? '' : 'none';
    if (t) t.classList.toggle('active', k === tab);
  });
  if (tab === 'task') mountSortiePager();
  else if (tab === 'log') searchLogs();
  else searchDroneAnomaly();
}

/* ---------------- 巡检任务 ---------------- */
function sortieList() {
  return PS.sorties().slice().sort(function (a, b) {
    return String(b.time || '').localeCompare(String(a.time || ''));
  });
}

function mountSortiePager(list) {
  Pagination.init({
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    pageSize: 10,
    renderRow: renderRow,
    data: list || sortieList()
  });
}

function renderRow(item, index) {
  var running = item.status === '执行中';
  var progress = Math.max(0, Math.min(100, Number(item.progress) || 0));
  var rtkFixed = item.rtk === '固定解';
  var plan = item.planId ? PS.get('plans', item.planId) : null;
  var route = PS.routeList().filter(function (r) { return r.routeId === item.routeId; })[0];
  var btns = '<button class="action-btn detail" onclick="showTaskDetail(\'' + item.id + '\')">查看</button>' +
    '<button class="action-btn edit" onclick="showRouteReplay(\'' + item.id + '\')">航线回放</button>';
  if (item.status === '待执行') btns += '<button class="action-btn approve" onclick="startSortie(\'' + item.id + '\')">开始</button>';
  if (item.status === '执行中') btns += '<button class="action-btn approve" onclick="finishSortie(\'' + item.id + '\')">完成</button>';
  btns += '<button class="action-btn delete" onclick="handleDelete(\'' + item.id + '\')">删除</button>';
  return '<tr>' +
    '<td><strong style="font-family:var(--font-mono,monospace);font-size:12px;">' + item.taskId + '</strong></td>' +
    '<td><span class="sortie-no' + (running ? ' running' : '') + '">' + item.sortieNo + '</span></td>' +
    '<td style="font-size:12px;">' + (plan ? plan.id + '<br><span style="color:var(--text-tertiary);">' + plan.name + '</span>' : '<span style="color:var(--text-tertiary);">独立飞巡</span>') + '</td>' +
    '<td>' + item.base + '</td>' +
    '<td>' + item.drone + '</td>' +
    '<td>' + item.plot + '</td>' +
    '<td>' + (route ? route.routeName : (item.routeId || '—')) + '</td>' +
    '<td>' + item.area + '亩</td>' +
    '<td><div class="progress-cell' + (running ? ' running' : '') + '"><div class="progress"><div class="progress-fill" style="width:' + progress + '%;"></div></div><span class="progress-text">' + progress + '%</span></div></td>' +
    '<td><span class="rtk-tag ' + (rtkFixed ? 'fixed' : 'float') + '">' + (item.rtk || '—') + '</span></td>' +
    '<td>' + (item.altitude || 0) + 'm</td>' +
    '<td>' + item.time + '</td>' +
    '<td>' + (SORTIE_STATUS[item.status] || SORTIE_STATUS['待执行']) + '</td>' +

    ['任务编号', s.taskId], ['架次', s.sortieNo],

function startSortie(id) {
  var s = PS.get('sorties', id);
  if (!s) { Toast.error('架次不存在或已被删除'); return; }
  if (s.status === '执行中') { Toast.warning('该架次正在执行中'); return; }
  if (s.status === '已完成') { Toast.error('已完成的架次不能重新开始'); return; }
  PS.upsert('sorties', { id: id, status: '执行中', progress: 5, speed: 8.2 });
  mountSortiePager();
  Toast.success('架次已开始执行');
}

function finishSortie(id) {
  var s = PS.get('sorties', id);
  if (!s) { Toast.error('架次不存在或已被删除'); return; }
  if (s.status === '已完成') { Toast.error('该架次已完成，请勿重复提交'); return; }
  if (s.status !== '执行中') { Toast.error('请先开始架次，再提交完成'); return; }
  if (!PS.get('tasks', s.taskId)) { Toast.error('关联巡检任务不存在，无法同步任务状态'); return; }
  PS.upsert('sorties', { id: id, status: '已完成', progress: 100, speed: s.speed || 8.2 });
  // 完成后自动写入飞行日志，保证「任务 → 架次 → 日志」可追溯
  var base = s.time ? s.time.slice(0, 10) : PS.today();
  ['起飞', '暂停', '恢复', '返航', '降落'].forEach(function (ev, i) {
    PS.upsert('flightLogs', {
      id: PS.nextId('flightLogs'),
      sortieId: s.id, sortieNo: s.sortieNo, taskId: s.taskId,
      base: s.base, plot: s.plot, event: ev,
      altitude: s.altitude, speed: ev === '暂停' ? 0 : (s.speed || 8.2),
      battery: Math.max(12, 96 - i * 18),
      time: base + ' ' + (i + 8) + ':' + (i * 7 % 60 < 10 ? '0' : '') + (i * 7 % 60),
      remark: ev === '返航' ? '电量低于阈值自动返航' : ''
    });
  });
  PS.upsert('tasks', { id: s.taskId, status: 'completed' });
  mountSortiePager();
  Toast.success('架次已完成，飞行日志与任务状态已同步');
}

function handleSearch() {

  var keyword = (document.getElementById('searchInput').value || '').trim();

    return true;
  });

  Toast.info('找到 ' + list.length + ' 条记录');

/* ---------------- 航线回放 ---------------- */
function buildWaypoints(item) {
  var seed = 0;
  var key = String(item.taskId || '') + (item.sortieNo || '');
  for (var i = 0; i < key.length; i++) seed = (seed * 31 + key.charCodeAt(i)) % 9973;
  var pts = [];
  for (var k = 0; k < 6; k++) {
    seed = (seed * 9301 + 49297) % 233280;
    var jitterX = (seed / 233280) * 40 - 20;
    seed = (seed * 9301 + 49297) % 233280;
    var jitterY = (seed / 233280) * 30 - 15;
    pts.push({
      no: k + 1,
      lng: (34.580 + k * 0.021 + jitterX / 900).toFixed(6),
      lat: (34.760 + (k % 2 === 0 ? 1 : -1) * (0.018 * (k + 1)) + jitterY / 900).toFixed(6)
    });
  }
  return pts;
}

function showRouteReplay(id) {
  var task = PS.get('sorties', id);
  if (!task) return;
  currentSortieId = id;
  var wps = buildWaypoints(task);
  var w = 520, h = 200;
  var xs = wps.map(function (_, i) { return 40 + i * ((w - 80) / (wps.length - 1)); });
  var ys = wps.map(function (_, i) { return h / 2 + (i % 2 === 0 ? -1 : 1) * (26 + (i * 7)); });
  var poly = xs.map(function (x, i) { return x + ',' + ys[i]; }).join(' ');
  var pointsHtml = wps.map(function (p, i) {
    return '<circle class="route-point' + (i === 0 ? ' start' : '') + '" cx="' + xs[i] + '" cy="' + ys[i] + '" r="4"></circle>' +
      '<text class="route-point-label" x="' + xs[i] + '" y="' + (ys[i] - 9) + '" text-anchor="middle">WP' + p.no + '</text>';
  }).join('');
  var listHtml = wps.map(function (p) {
    return '<div class="waypoint-item"><span>航点 ' + p.no + '</span><span>' + p.lng + '°E / ' + p.lat + '°N</span></div>';
  }).join('');

  document.getElementById('routeReplayTitle').textContent = '航线回放 · 架次 ' + (task.sortieNo || '—');
  document.getElementById('routeReplayBody').innerHTML =
    '<div class="route-play">' +
      '<svg class="route-svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet">' +
        '<polygon class="route-line-area" points="' + poly + '"></polygon>' +
        '<polyline class="route-line" points="' + poly + '"></polyline>' +
        pointsHtml +
      '</svg>' +
      '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--text-tertiary);">' +
        '<span>任务编号：<strong>' + task.taskId + '</strong></span>' +
        '<span>巡查地块：<strong>' + task.plot + '</strong></span>' +
        '<span>航高：<strong>' + (task.altitude || 0) + 'm</strong></span>' +
        '<span>速度：<strong>' + (task.speed || 0) + 'm/s</strong></span>' +
        '<span>RTK：<strong>' + (task.rtk || '—') + '</strong></span>' +
        '<span>进度：<strong>' + (task.progress || 0) + '%</strong></span>' +
      '</div>' +
      '<div class="waypoint-list">' + listHtml + '</div>' +
    '</div>';
  Modal.show('modal-route');
}

/* 移动端 mb_drone_patrol.html 写入的飞行事件（暂停/恢复/返航） */
function mobileLogs() {
  try {
    if (typeof MobileBridge === 'undefined' || typeof MobileBridge.droneEvents !== 'function') return [];
    var map = { pause: '暂停', resume: '恢复', return: '返航' };
    var list = MobileBridge.droneEvents();
    return (Array.isArray(list) ? list : []).map(function (e, i) {
      return {
        id: e.id || ('MDE-' + i),
        sortieNo: '—',
        taskId: e.taskId || '—',
        base: '—',
        plot: '—',
        event: map[e.type] || e.type || '事件',
        altitude: null,
        speed: null,
        battery: null,
        time: e.createTime || '',
        remark: e.text || '',
        source: 'mobile'
      };
    });
  } catch (err) { return []; }
}

function logList() {
  var event = (document.getElementById('logEventSelect') || {}).value || '';
  var kw = ((document.getElementById('logSearchInput') || {}).value || '').trim();
  return PS.flightLogs().concat(mobileLogs()).filter(function (l) {
    if (event && l.event !== event) return false;
    if (kw) {
      var hay = [l.sortieNo, l.taskId, l.base, l.plot, l.event, l.remark, l.time].join(' ');
      if (hay.indexOf(kw) < 0) return false;
    }
    return true;
  }).sort(function (a, b) {
    return String(b.time || '').localeCompare(String(a.time || ''));
  });
}

      var task = {
        id: PS.nextId('tasks'),
        planId: '',
        anomalyId: a.id,
        name: '飞巡异常处置 · ' + a.type + ' · ' + a.plot,
        base: '天水麦积区基地',
        plot: (PS.plotLabel(anomalyPlot).split(' · ')[1] || anomalyPlot),
        plotId: anomalyPlot,
        type: /病害|病虫害/.test(a.type) ? '施药' : '其他',
        typeCode: /病害|病虫害/.test(a.type) ? 'pesticide' : 'other',
        taskCategory: 'farming',
        executorType: 'person',
        priority: 'high',
        person: '黄忠坚', worker: '黄忠坚', team: '一班',
        planTime: PS.today() + 'T09:00',
        deadline: PS.today(),
        status: 'pending',
        desc: '来源飞巡异常 ' + a.id + '：' + a.remark,
        createdBy: '飞巡异常', createdAt: PS.stampNow()
      };
      var invalid = PS.validate.task(task);
      if (invalid) { Toast.error(invalid); return; }
      PS.upsert('tasks', task);
      PS.upsert('anomalies', { id: a.id, status: 'handling', taskId: task.id, handleResult: '已生成处置任务', handleTime: PS.stampNow() });
      searchDroneAnomaly();
      Toast.success('已生成任务 ' + task.id + '，可在「任务管理」查看');
    }
  });
}

/* ---------------- 初始化 ---------------- */
document.addEventListener('DOMContentLoaded', function () {
  if (window.DemoSeed) DemoSeed.ensure(['drone-events', 'drone-abnormal']);
  PS.importMobile();
  fillAddOptions();
  mountSortiePager();
  searchLogs();
  searchDroneAnomaly();

  var addBtn = document.querySelector('button[onclick="Modal.show(\'modal-add\')"]');
  if (addBtn) addBtn.addEventListener('click', fillAddOptions);

  var dt = new Date();
  var local = dt.getFullYear() + '-' + (dt.getMonth() + 1 < 10 ? '0' : '') + (dt.getMonth() + 1) + '-' +
    (dt.getDate() < 10 ? '0' : '') + dt.getDate() + 'T08:00';
  var timeEl = document.getElementById('addTime');
  if (timeEl && !timeEl.value) timeEl.value = local;

  window.addEventListener('productionStoreChange', function () {
    var active = document.querySelector('.view-tab.active');
    var id = active ? active.id : 'tabTask';
    if (id === 'tabTask') mountSortiePager();
    if (id === 'tabLog') searchLogs();
    if (id === 'tabAnomaly') searchDroneAnomaly();
  });
});
</script>
