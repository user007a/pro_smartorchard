<style>
  .drone-live-info { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .drone-live-info .info-item { padding:16px; background:var(--gray-50); border-radius:8px; text-align:center; }
  .drone-live-info .info-label { font-size:12px; color:var(--text-tertiary); margin-bottom:6px; }
  .drone-live-info .info-value { font-size:20px; font-weight:600; }
  /* 架次号与进度条 */
  .sortie-no { font-weight:600; color:var(--text-secondary); font-variant-numeric:tabular-nums; }
  .sortie-no.running { color:var(--primary-500); }
  .progress-cell { display:flex; align-items:center; gap:8px; min-width:120px; }
  .progress-cell .progress { flex:1; }
  .progress-cell .progress-fill { background: linear-gradient(90deg, var(--primary-400, #40a9ff), var(--primary-500, #1890ff)); }
  .progress-cell .progress-text { font-size:12px; font-weight:600; color:var(--text-secondary); min-width:34px; text-align:right; font-variant-numeric:tabular-nums; }
  .progress-cell.running .progress-text { color:var(--primary-500); }
  .rtk-tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:500; }
  .rtk-tag.fixed { background:#d9f7be; color:#3a8618; }
  .rtk-tag.float { background:#fff1b8; color:#8c6d10; }
  /* 航线回放示意 */
  .route-play { border:1px solid var(--border-light); border-radius:10px; padding:14px; background:var(--gray-50); }
  .route-svg { width:100%; height:auto; display:block; }
  .route-line { fill:none; stroke:var(--primary-500); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
  .route-line-area { fill:rgba(24,144,255,0.10); stroke:none; }
  .route-point { fill:#fff; stroke:var(--primary-500); stroke-width:2; }
  .route-point.start { fill:var(--success); stroke:var(--success); }
  .route-point-label { font-size:10px; fill:var(--text-tertiary); }
  .waypoint-list { max-height:220px; overflow-y:auto; margin-top:12px; border-top:1px dashed var(--border-light); }
  .waypoint-item { display:flex; justify-content:space-between; padding:6px 4px; font-size:12px; border-bottom:1px dashed #f0f0f0; }
  .waypoint-item span:first-child { color:var(--text-tertiary); font-weight:600; }
  .waypoint-item span:last-child { color:var(--text-secondary); font-variant-numeric:tabular-nums; }
</style>

// 航线回放：由任务编号 + 架次生成稳定的航点坐标（示意用）
function buildWaypoints(task) {
  let seed = 0;
  const key = String(task.code || '') + (task.sortie || '');
  for (let i = 0; i < key.length; i++) seed = (seed * 31 + key.charCodeAt(i)) % 9973;
  const pts = [];
  const count = 6;
  for (let i = 0; i < count; i++) {
    seed = (seed * 9301 + 49297) % 233280;
    const jitterX = (seed / 233280) * 40 - 20;
    seed = (seed * 9301 + 49297) % 233280;
    const jitterY = (seed / 233280) * 30 - 15;
    pts.push({
      no: i + 1,
      lng: (34.580 + i * 0.021 + jitterX / 900).toFixed(6),
      lat: (34.760 + (i % 2 === 0 ? 1 : -1) * (0.018 * (i + 1)) + jitterY / 900).toFixed(6)
    });
  }
  return pts;
}

// 航线回放 Modal：内联 SVG 折线轨迹 + 航点列表
function showRouteReplay(code) {
  const task = mockData.find(t => t.code === code);
  if (!task) return;
  const wps = buildWaypoints(task);
  const w = 520, h = 200;
  const xs = wps.map((_, i) => 40 + i * ((w - 80) / (wps.length - 1)));
  const ys = wps.map((_, i) => h / 2 + (i % 2 === 0 ? -1 : 1) * (26 + (i * 7)));
  const poly = xs.map((x, i) => x + ',' + ys[i]).join(' ');
  const pointsHtml = wps.map((p, i) =>
    `<circle class="route-point${i === 0 ? ' start' : ''}" cx="${xs[i]}" cy="${ys[i]}" r="4"></circle>` +
    `<text class="route-point-label" x="${xs[i]}" y="${ys[i] - 9}" text-anchor="middle">WP${p.no}</text>`
  ).join('');
  const listHtml = wps.map(p =>
    `<div class="waypoint-item"><span>航点 ${p.no}</span><span>${p.lng}°E / ${p.lat}°N</span></div>`
  ).join('');

  document.getElementById('routeReplayTitle').textContent = '航线回放 · 架次 ' + (task.sortie || '—');
  document.getElementById('routeReplayBody').innerHTML =
      `<div class="route-play">` +
        `<svg class="route-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">` +
          `<polygon class="route-line-area" points="${poly}"></polygon>` +
          `<polyline class="route-line" points="${poly}"></polyline>` +
          pointsHtml +
        `</svg>` +
        `<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--text-tertiary);">` +
          `<span>任务编号：<strong>${task.code}</strong></span>` +
          `<span>巡查地块：<strong>${task.plot}</strong></span>` +
          `<span>航高：<strong>${task.altitude || 0}m</strong></span>` +
          `<span>速度：<strong>${task.speed || 0}m/s</strong></span>` +
          `<span>RTK：<strong>${task.rtk || '—'}</strong></span>` +
          `<span>进度：<strong>${task.progress || 0}%</strong></span>` +
        `</div>` +
        `<div class="waypoint-list">${listHtml}</div>` +
      `</div>`;
  Modal.show('modal-route');
}

// 获取状态标签
function getStatusTag(status) {
  const map = {
    '待执行': '<span class="status-tag normal">待执行</span>',
    '执行中': '<span class="status-tag warning">执行中</span>',
    '已完成': '<span class="status-tag done">已完成</span>',
    '已取消': '<span class="status-tag normal">已取消</span>'
  };
  return map[status] || map['待执行'];
}

// 渲染表格行
function renderRow(item, index) {
  const running = item.status === '执行中';
  const progress = Math.max(0, Math.min(100, Number(item.progress) || 0));
  const rtkFixed = item.rtk === '固定解';
  return `<tr>
    <td>${index + 1}</td>
    <td><strong>${item.code}</strong></td>
    <td><span class="sortie-no${running ? ' running' : ''}">${item.sortie || '—'}</span></td>
    <td>${item.base}</td>
    <td>${item.drone}</td>
    <td>${item.plot}</td>
    <td>${item.area}亩</td>
    <td>
      <div class="progress-cell${running ? ' running' : ''}">
        <div class="progress"><div class="progress-fill" style="width:${progress}%;"></div></div>
        <span class="progress-text">${progress}%</span>
      </div>
    </td>
    <td><span class="rtk-tag ${rtkFixed ? 'fixed' : 'float'}">${item.rtk || '—'}</span></td>
    <td>${item.altitude || 0}m</td>
    <td>${item.time}</td>
    <td>${getStatusTag(item.status)}</td>
    <td>
      <div class="action-btns">
        <button class="action-btn detail" onclick="Modal.show('modal-detail')">查看</button>
        <button class="action-btn edit" onclick="showRouteReplay('${item.code}')">航线回放</button>
        <button class="action-btn edit" onclick="Modal.show('modal-edit')">编辑</button>
        <button class="action-btn delete" onclick="handleDelete()">删除</button>
      </div>
    </td>
  </tr>`;
}

// 搜索
function handleSearch() {
  const keyword = document.getElementById('searchInput').value;
  const base = document.getElementById('baseSelect').value;
  const status = document.getElementById('statusSelect').value;
  const drone = document.getElementById('droneSelect').value;

  const filtered = mockData.filter(item => {
    if (base && item.base !== base) return false;
    if (status && item.status !== status) return false;
    if (drone && item.drone !== drone) return false;
    if (keyword && !item.code.includes(keyword)) return false;
    return true;
  });

  Pagination.updateData(filtered);
  Toast.info('找到 ' + filtered.length + ' 条记录');
}

// 重置
function smartReset() {
  document.getElementById('searchInput').value = '';
  document.getElementById('baseSelect').value = '';
  document.getElementById('statusSelect').value = '';
  document.getElementById('droneSelect').value = '';
  Pagination.updateData(mockData);
  Toast.info('已重置搜索条件');
}

// 新增
function handleAdd() {
  var name = (document.getElementById('addName') || {}).value || '';
  var drone = (document.getElementById('droneSelect') || {}).value || '';
  var area = (document.getElementById('addArea') || {}).value || '';
  var time = (document.getElementById('addTime') || {}).value || '';
  if (!name || !drone || !area || !time) { Toast.error('请填写完整任务信息'); return; }
  var record = {
    id: 'TASK' + Date.now(),
    name: name,
    drone: drone,
    area: area,
    time: time,
    status: '待执行',
    statusCode: 'pending',
    createdAt: new Date().toISOString()
  };
  mockData.unshift(record);
  Pagination.updateData(mockData);
  Modal.hide('modal-add');
  Toast.success('任务已创建：' + name);
}

// 导出
function handleExport() {
  Modal.hide('modal-export');
  var csv = '任务编号,架次,所属基地,无人机,巡查地块,飞行面积,进度(%),RTK,航高(m),速度(m/s),计划时间,状态\n' + mockData.map(function(r){
    return [r.code, r.sortie, r.base, r.drone, r.plot, r.area, r.progress, r.rtk, r.altitude, r.speed, r.time, r.status].join(',');
  }).join('\n');
  var blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `无人机巡检任务_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  Toast.success('已导出无人机巡检任务');
}

// 编辑
function handleEdit() {
  var name = (document.getElementById('editName') || {}).value || '';
  var status = (document.getElementById('editStatus') || {}).value || '';
  if (!name) { Toast.error('任务名为空'); return; }
  var idx = mockData.findIndex(function(m){ return m.name === name; });
  if (idx === -1) { Toast.error('未找到该任务'); return; }
  mockData[idx].status = status || mockData[idx].status;
  Pagination.updateData(mockData);
  Modal.hide('modal-edit');
  Toast.success('任务已更新');
}

// 删除
function handleDelete(taskId) {
  ConfirmDialog.show({
    title: '确认删除',
    message: '确定要删除这个任务吗？此操作不可撤销。',
    onConfirm: function() {
      var idx = mockData.findIndex(function(m){ return m.id === taskId || m.name === taskId; });
      if (idx !== -1) mockData.splice(idx, 1);
      Pagination.updateData(mockData);
      Toast.success('删除成功');
    }
  });
}

// 初始化分页
document.addEventListener('DOMContentLoaded', function() {
  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: mockData,
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderRow
  });
});
