<style>
  .stats-grid {
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:var(--space-lg);
    margin-bottom:var(--space-xl);
  }
  .stat-card {
    background:var(--bg-card);
    border-radius:var(--radius-lg);
    padding:var(--space-xl);
    box-shadow:var(--shadow-card);
    border:1px solid rgba(24, 144, 255, 0.08);
    transition:all var(--transition-normal);
    position:relative;
    overflow:hidden;
  }
  .stat-card::before {
    content:'';
    position:absolute;
    top:0;
    left:0;
    width:4px;
    height:100%;
    background:var(--gradient-primary);
    border-radius:0 3px 3px 0;
  }
  .stat-card:hover {
    transform:translateY(-3px);
    box-shadow:var(--shadow-card-hover);
  }
  .stat-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:var(--space-md);
  }
  .stat-icon {
    width:48px;
    height:48px;
    border-radius:var(--radius-md);
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--primary-50);
    color:var(--primary-500);
    font-size:22px;
  }
  .stat-label {
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
    font-weight:var(--font-weight-medium);
  }
  .stat-value {
    font-size:32px;
    font-weight:var(--font-weight-bold);
    line-height:1.2;
    background:linear-gradient(135deg, var(--primary-600), var(--primary-500));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:var(--space-xs);
  }
  .stat-unit {
    font-size:var(--font-size-sm);
    font-weight:var(--font-weight-normal);
    color:var(--text-tertiary);
  }
  .stat-trend {
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:var(--font-size-xs);
    padding:2px 8px;
    border-radius:var(--radius-full);
    margin-top:var(--space-sm);
  }
  .stat-trend.up {
    background:var(--success-bg);
    color:var(--success);
  }
  .stat-trend.down {
    background:var(--error-bg);
    color:var(--error);
  }
  .search-bar {
    display:flex;
    gap:var(--space-lg);
    align-items:center;
    flex-wrap:wrap;
    padding:var(--space-xl);
    background:var(--bg-card);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    margin-bottom:var(--space-xl);
  }

    padding:10px 14px;
    border:1.5px solid var(--border-default);
    border-radius:var(--radius-md);
    font-size:var(--font-size-base);
    transition:all var(--transition-fast);
    background:var(--bg-card);
    outline:none;
  }

    box-shadow:0 0 0 3px rgba(24, 144, 255, 0.1);

    padding-right:36px;
  }
  .action-bar {

    align-items:center;
    justify-content:space-between;
    gap:var(--space-md);
    padding:var(--space-lg);
    background:var(--bg-card);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    margin-bottom:var(--space-xl);
  }
  .action-left {
    display:flex;
    gap:var(--space-md);
  }
  .data-table {

    border-spacing:0;
    font-size:var(--font-size-base);
    background:var(--bg-card);
    border-radius:var(--radius-lg);

    border:1px solid var(--error-border);

  .status-tag.danger::before {

// 分页组件（与农事计划一致）
const Pagination = {
  currentPage: 1, pageSize: 10, filteredData: [],
  containerId: 'pagination-container', tbodyId: 'dataTableBody', renderRow: null,
  init: function(options) {
    this.currentPage = options.currentPage || 1;
    this.pageSize = options.pageSize || 10;
    this.filteredData = options.data || [];
    this.containerId = options.containerId || 'pagination-container';
    this.tbodyId = options.tbodyId || 'dataTableBody';
    this.renderRow = options.renderRow || null;
    this.render();
  },
  renderTable: function() {
    const tbody = document.getElementById(this.tbodyId);
    if (!tbody || !this.renderRow) return;
    const start = (this.currentPage - 1) * this.pageSize;
    const pageData = this.filteredData.slice(start, start + this.pageSize);
    tbody.innerHTML = pageData.map((item, i) => this.renderRow(item, start + i + 1)).join('');
  },
  render: function() {
    const container = document.getElementById(this.containerId);
    if (!container) return;
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    let html = '<div class="pagination">';
    html += `<button class="page-btn ${this.currentPage <= 1 ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage - 1})">‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= this.currentPage - 1 && i <= this.currentPage + 1)) {
        html += `<button class="page-btn ${i === this.currentPage ? 'active' : ''}" onclick="Pagination.goToPage(${i})">${i}</button>`;
      } else if (i === this.currentPage - 2 || i === this.currentPage + 2) {
        html += '<span class="page-ellipsis" style="padding:0 8px;color:#6b7b6b;">...</span>';
      }
    }
    html += `<button class="page-btn ${this.currentPage >= totalPages ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage + 1})">›</button>`;
    html += `<span style="margin-left:16px;font-size:13px;color:#6b7b6b;">第 ${this.currentPage} 页/共 ${totalPages} 页，共 ${this.filteredData.length} 条记录</span>`;
    html += '</div>';
    container.innerHTML = html;
    this.renderTable();
  },
  goToPage: function(page) {
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    if (page < 1 || page > totalPages) return;
    this.currentPage = page;
    this.render();
  },
  updateData: function(data) {
    this.filteredData = data;
    this.currentPage = 1;
    this.render();
  }
};

function renderPlotRow(item, seq) {
  return `
    <tr data-id="${item.id}">
      <td>${seq}</td>
      <td><strong>${item.code}</strong></td>
      <td><strong>${item.name}</strong></td>
      <td>${item.base}</td>
      <td style="text-align:right">${item.area}</td>
      <td>${item.variety}</td>
      <td style="text-align:center">${item.year}</td>
      <td><span class="status-tag ${item.status}">${item.statusText}</span></td>
      <td>
        <div class="action-btns">
          <button class="action-btn" onclick="PageActions.showDetail('${item.id}')">详情</button>
          <button class="action-btn" onclick="PageActions.showEdit('${item.id}')">编辑</button>
          <button class="action-btn delete" onclick="PageActions.deleteItem('${item.id}')">删除</button>
        </div>
      </td>
    </tr>
  `;
}

function searchPlotData() {
  const keyword = document.getElementById('searchInput').value.toLowerCase();
  const filtered = mockPlotData.filter(item =>
    !keyword || item.code.toLowerCase().includes(keyword) || item.name.toLowerCase().includes(keyword)
  );
  Pagination.updateData(filtered);
}

function smartReset() {
  document.getElementById('searchInput').value = '';
  const varietySelect = document.getElementById('varietySelect');
  if (varietySelect) varietySelect.value = '';
  Pagination.updateData(mockPlotData);
}

document.addEventListener('DOMContentLoaded', function() {
  PageActions.init('plot');
  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: mockPlotData,
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderPlotRow
  });
