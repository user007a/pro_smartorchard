<!DOCTYPE html>

<style>

      </div>
      <span class="sidebar-brand-text">智慧果园</span>
    </div>

    <!-- 菜单主体（由 JS 动态渲染） -->
    <div class="sidebar-body"></div>

    <!-- 底部功能区 -->
    <div class="sidebar-footer">
      <button class="sidebar-footer-btn sidebar-collapse-btn" title="折叠侧边栏">
        <span class="collapse-icon">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 3L6 9L11 15"/><path d="M14 3V15"/>
          </svg>
        </span>
        <span class="btn-text">折叠</span>

            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">

          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- ===== 页面头部 ===== -->
      <div class="page-header">
        <div>
          <h1 class="page-title">采收发货</h1>
          <p class="page-subtitle">管理采后处理流程，支持入库出库和标准处理</p>
        </div>
      </div>

      <!-- 统计卡片区 -->
      <div class="patrol-stats">
        <div class="patrol-stat-card green">

        </div>

        <div class="page-section action-bar">
          <button class="jg-btn" onclick="Modal.show('modal-export')">导出记录</button>

        <div class="page-section data-section">
          <table class="data-table">
            <thead>
              <tr>

                <th>地块</th>
                <th>等级</th>

<!-- 导出记录模态框 -->
<div id="modal-export" class="modal-overlay">
  <div class="modal-box" style="max-width: 420px;">
    <div class="modal-header">
      <h3 class="modal-title">导出采后处理记录</h3>
      <button class="modal-close">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4L12 12M12 4L4 12"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-item">
          <label>选择导出格式</label>
          <select class="form-select">
            <option value="excel">Excel (.xlsx)</option>
            <option value="csv">CSV (.csv)</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-item">
          <label>导出范围</label>
          <div style="display:flex;gap:16px;">
            <label class="checkbox-label">
              <input type="radio" name="exportScope" value="all" checked>
              <span>全部数据</span>
            </label>
            <label class="checkbox-label">
              <input type="radio" name="exportScope" value="selected">
              <span>选中数据</span>
            </label>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="Modal.hide('modal-export')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="handleExport()">导出</button>
    </div>
  </div>
</div>

  { id: 'PH-2024-023', plot: '南地块A区', grade: '特级', amount: 1080, status: 'stored', statusName: '已入库', time: '2024-05-31 09:30', operator: '吴九' }
];

// 获取状态标签
function getStatusTag(status) {
  const statusMap = {
    'stored': '<span class="status-tag stored">已入库</span>',
    'outbound': '<span class="status-tag outbound">已出库</span>'
  };
  return statusMap[status] || statusMap['stored'];
}

// 渲染表格行
function renderRow(item, index) {
  return `<tr>
    <td class="checkbox-col"><input type="checkbox" name="record" value="${item.id}"></td>
    <td><strong>${item.id}</strong></td>
    <td>${item.plot}</td>
    <td>${item.grade}</td>
    <td class="text-right">${item.amount.toLocaleString()}</td>
    <td>${getStatusTag(item.status)}</td>
    <td>${item.time}</td>
    <td>${item.operator}</td>
    <td>
      <div class="action-btns">
        <button class="action-btn detail" onclick="Modal.show('modal-detail')">详情</button>
        <button class="action-btn export" onclick="Modal.show('modal-outbound')">出库</button>
      </div>
    </td>
  </tr>`;
}

// 搜索功能
function handleSearch() {
  const keyword = document.getElementById('searchInput').value;

  var filteredData = mockData.filter(item => {
    if (keyword && !item.id.includes(keyword) && !item.plot.includes(keyword)) return false;
    return true;
  });

  Pagination.updateData(filteredData);
  Toast.info('找到 ' + filteredData.length + ' 条记录');
}

// 导出记录
function handleExport() {
  Modal.hide('modal-export');
  Toast.success('导出成功，文件已下载');
}

// 出库操作
function handleOutbound() {
  Modal.hide('modal-outbound');
  Toast.success('出库成功');
}

// 入库操作
function handleInbound() {
  Modal.hide('modal-inbound');
  Toast.success('入库成功');
}

// 标准处理
function handleStandard() {
  Modal.hide('modal-standard');
  Toast.success('处理完成');
}

// 初始化分页
document.addEventListener('DOMContentLoaded', function() {
  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: mockData,
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderRow
  });
});
</script>
