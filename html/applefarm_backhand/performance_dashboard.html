<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 绩效看板</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
  <link rel="stylesheet" href="css/page-content.css">
<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition:all 0.2s ease;
  }
  .module-card:hover {
    background:var(--bg-hover);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }

  /* 紧凑表格样式 */
  .compact-table {
    min-width:auto !important;
    font-size:12.5px !important;
    width:100%;
  }
  .compact-table th,
  .compact-table td {
    padding:10px 10px !important;
    white-space:nowrap;
  }
  .compact-table th {
    font-size:11px !important;
    letter-spacing:0.3px;
  }
  .compact-table td {
    line-height:1.4;
  }

  /* 评级标签样式 */
  .score-badge {
    display:inline-block;
    padding:4px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:500;
  }
  .score-badge.excellent {
    background:linear-gradient(135deg, rgba(24, 144, 255, 0.15), rgba(24, 144, 255, 0.08));
    color:var(--primary-500);
    border:1px solid rgba(24, 144, 255, 0.3);
  }
  .score-badge.good {
    background:linear-gradient(135deg, rgba(24, 144, 255, 0.15), rgba(24, 144, 255, 0.08));
    color:var(--primary-500);
    border:1px solid rgba(24, 144, 255, 0.3);
  }
  .score-badge.pass {
    background:linear-gradient(135deg, rgba(255, 183, 77, 0.15), rgba(255, 183, 77, 0.08));
    color:#ffb74d;
    border:1px solid rgba(255, 183, 77, 0.3);
  }
  .score-badge.fail {
    background:linear-gradient(135deg, rgba(245, 108, 108, 0.15), rgba(245, 108, 108, 0.08));
    color:#f56c6c;
    border:1px solid rgba(245, 108, 108, 0.3);
  }

  /* 筛选栏样式 */
  .filter-section {
    display:flex;
    align-items:center;
    gap:24px;
    background:var(--bg-card);
    padding:16px 24px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 1px 4px rgba(0,0,0,0.04);
    border:1px solid rgba(0,0,0,0.06);
  }
  .filter-group {
    display:flex;
    align-items:center;
    gap:8px;
  }
  .filter-label {
    font-size:13px;
    color:var(--text-tertiary);
    font-weight:500;
    white-space:nowrap;
  }
  .filter-select-wrapper {
    position:relative;
    display:inline-block;
  }
  .filter-select {
    appearance:none;
    background:var(--gray-50);
    border:1px solid var(--border-default);
    border-radius:8px;
    padding:10px 32px 10px 14px;
    font-size:14px;
    color:var(--text-secondary);
    cursor:pointer;
    min-width:140px;
    transition:all 0.2s ease;
  }
  .filter-select:hover {
    border-color:#40a9ff;
    background:var(--primary-50);
  }
  .filter-select:focus {
    outline:none;
    border-color:var(--border-primary);
    box-shadow:0 0 0 3px rgba(24, 144, 255, 0.1);
  }
  .select-arrow {
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    width:14px;
    height:14px;
    color:var(--text-tertiary);
    pointer-events:none;
  }
  .filter-btn {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:linear-gradient(135deg, #1890ff, #40a9ff);
    color:var(--text-inverse);
    border:none;
    border-radius:8px;
    padding:10px 20px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:all 0.2s ease;
    margin-left:auto;
    white-space:nowrap;
    min-width:70px;
  }
  .filter-btn:hover {
    transform:translateY(-1px);
    box-shadow:0 2px 8px rgba(24, 144, 255, 0.3);
  }
  .filter-btn:active {
    transform:translateY(0);
  }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="performance" data-active-submenu="performance-dashboard">

<!-- ===== 整体布局容器 ===== -->
<div class="app-layout">

  <!-- ===== 侧边栏 ===== -->
  <!-- 移动端遮罩层 -->
  <!-- ===== 主内容区 ===== -->
  <div class="main-wrapper">

    <!-- 顶栏 -->
    <!-- Tab 标签栏 -->
    <div class="tab-bar">
      <!-- Tab 标签由 JS 动态渲染 -->
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
<!-- 顶部导航 -->

<!-- 页面内容 -->
<div class="page-container">
  <!-- 筛选栏 -->
  <div class="filter-section">
    <div class="filter-group">
      <label class="filter-label">周期</label>
      <div class="filter-select-wrapper">
        <select class="filter-select">
          <option>本月</option>
          <option>上月</option>
          <option>本季度</option>
          <option>本年度</option>
        </select>
        <svg class="select-arrow" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 5L7 9L11 5"/>
        </svg>
      </div>
    </div>
    <div class="filter-group">
      <label class="filter-label">班组</label>
      <div class="filter-select-wrapper">
        <select class="filter-select">
          <option>全部班组</option>
          <option>一班</option>
          <option>二班</option>
          <option>三班</option>
        </select>
        <svg class="select-arrow" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 5L7 9L11 5"/>
        </svg>
      </div>
    </div>
    <button class="filter-btn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6"/>
        <path d="M8 5V8L10 10"/>
      </svg>
      筛选
    </button>
  </div>

  <!-- 统计卡片 - 小尺寸样式 -->
  <div class="patrol-stats">
    <div class="patrol-stat-card green">
      <div class="stat-value">28</div>
      <div class="stat-label">总人数</div>
    </div>
    <div class="patrol-stat-card blue">
      <div class="stat-value">92.5%</div>
      <div class="stat-label">平均完成率</div>
    </div>
    <div class="patrol-stat-card orange">
      <div class="stat-value">88.3</div>
      <div class="stat-label">平均质量评分</div>
    </div>
    <div class="patrol-stat-card purple">
      <div class="stat-value">6人</div>
      <div class="stat-label">优秀员工</div>
    </div>
  </div>

  <!-- 绩效趋势图 -->
  <div class="chart-section">
    <h2 class="section-title">绩效趋势分析</h2>
    <div id="chart-performance-trend" class="chart-container" style="height:300px;"></div>
  </div>

  <!-- 绩效排行和统计 -->
  <div class="double-section">
    <div class="table-container" style="overflow-x:hidden;">
      <h2 class="section-title">绩效排名</h2>
      <table class="data-table compact-table">
        <thead>
          <tr>
            <th>排名</th>
            <th>姓名</th>
            <th>班组</th>
            <th>完成率</th>
            <th>质量</th>

            <th>综合</th>

        </thead>
        <tbody>

            <td>一班</td>
            <td>100%</td>

            <td>48</td>

            <td><span class="score-badge excellent">优秀</span></td>
          </tr>
          <tr>
            <td><span class="ranking-badge silver">2</span></td>
            <td>李四</td>
            <td>二班</td>
            <td>98%</td>
            <td>92</td>
            <td>45</td>
            <td>93</td>
            <td><span class="score-badge excellent">优秀</span></td>
          </tr>
          <tr>
            <td><span class="ranking-badge bronze">3</span></td>
            <td>王五</td>
            <td>一班</td>
            <td>95%</td>
            <td>90</td>
            <td>42</td>
            <td>91</td>
            <td><span class="score-badge good">良好</span></td>
          </tr>
          <tr>
            <td>4</td>
            <td>赵六</td>
            <td>三班</td>
            <td>92%</td>
            <td>88</td>
            <td>40</td>
            <td>89</td>
            <td><span class="score-badge good">良好</span></td>
          </tr>
          <tr>
            <td>5</td>
            <td>孙七</td>
            <td>二班</td>
            <td>90%</td>

            <td>38</td>
            <td>86</td>
            <td><span class="score-badge pass">合格</span></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="chart-section">
      <h2 class="section-title">绩效分布</h2>
      <div id="chart-performance-pie" class="chart-container" style="height:280px;"></div>
    </div>
  </div>
</div>

<!-- 底部 -->
<footer style="background:var(--bg-card); padding:var(--space-lg); text-align:center; color:var(--text-secondary); font-size:var(--font-size-sm); margin-top:auto;">
  智慧果园·智慧果园管理系统 © 2026
</footer>
    </main>
  </div>

</div>

<!-- 引入交互脚本 -->
<script src="js/components/chart.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // 绩效趋势数据
  const performanceTrendData = {
    categories: ['1月', '2月', '3月', '4月', '5月', '6月'],
    series: [
      {
        name: '完成率',
        data: [88, 92, 95, 90, 94, 92],
        color: '#1890ff',
        area: true
      },
      {
        name: '质量评分',
        data: [85, 88, 90, 87, 92, 88],
        color: '#1890ff',
        area: true
      },
      {
        name: '工作量',
        data: [35, 40, 45, 38, 42, 48],
        color: '#ff6b35',
        area: true
      }
    ]
  };
  Chart.line('#chart-performance-trend', performanceTrendData);

  // 绩效分布饼图数据
  const performancePieData = {
    series: [
      { name: '优秀', value: 21 },
      { name: '良好', value: 43 },
      { name: '合格', value: 29 },
      { name: '待提升', value: 7 }
    ]
  };
  Chart.donut('#chart-performance-pie', performancePieData);
});
</script>
