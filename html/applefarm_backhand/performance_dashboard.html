<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition:all 0.2s ease;
  }
  .module-card:hover {
    background:var(--bg-hover);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }

  /* 紧凑表格样式 */
  .compact-table {
    min-width:auto !important;
    font-size:12.5px !important;
    width:100%;
  }
  .compact-table th,
  .compact-table td {
    padding:10px 10px !important;
    white-space:nowrap;
  }

  /* 绩效排名表格容器：超出可滚动 */
  .data-table-wrapper {
    max-height:400px;
    overflow-y:auto;
  }
  .compact-table th {
    font-size:11px !important;
    letter-spacing:0.3px;
  }
  .compact-table td {
    line-height:1.4;
  }

  /* 评级标签样式 */
  .score-badge {
    display:inline-block;
    padding:4px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:500;
  }
  .score-badge.excellent {
    background:linear-gradient(135deg, rgba(24, 144, 255, 0.15), rgba(24, 144, 255, 0.08));
    color:var(--primary-500);
    border:1px solid rgba(24, 144, 255, 0.3);
  }
  .score-badge.good {
    background:linear-gradient(135deg, rgba(24, 144, 255, 0.15), rgba(24, 144, 255, 0.08));
    color:var(--primary-500);
    border:1px solid rgba(24, 144, 255, 0.3);
  }
  .score-badge.pass {
    background:linear-gradient(135deg, rgba(255, 183, 77, 0.15), rgba(255, 183, 77, 0.08));
    color:#ffb74d;
    border:1px solid rgba(255, 183, 77, 0.3);
  }
  .score-badge.fail {
    background:linear-gradient(135deg, rgba(245, 108, 108, 0.15), rgba(245, 108, 108, 0.08));
    color:#f56c6c;
    border:1px solid rgba(245, 108, 108, 0.3);
  }

  /* 筛选栏样式 */
  .filter-section {
    display:flex;
    align-items:center;
    gap:24px;
    background:var(--bg-card);
    padding:16px 24px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 1px 4px rgba(0,0,0,0.04);
    border:1px solid rgba(0,0,0,0.06);
  }
  .filter-group {
    display:flex;
    align-items:center;
    gap:8px;
  }
  .filter-label {
    font-size:13px;
    color:var(--text-tertiary);
    font-weight:500;
    white-space:nowrap;
  }
  .filter-select-wrapper {
    position:relative;
    display:inline-block;
  }
  .filter-select {
    appearance:none;
    background:var(--gray-50);
    border:1px solid var(--border-default);
    border-radius:8px;
    padding:10px 32px 10px 14px;
    font-size:14px;
    color:var(--text-secondary);
    cursor:pointer;
    min-width:140px;
    transition:all 0.2s ease;
  }
  .filter-select:hover {
    border-color:#40a9ff;
    background:var(--primary-50);
  }
  .filter-select:focus {
    outline:none;
    border-color:var(--border-primary);
    box-shadow:0 0 0 3px rgba(24, 144, 255, 0.1);
  }
  .select-arrow {
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    width:14px;
    height:14px;
    color:var(--text-tertiary);
    pointer-events:none;
  }
  .filter-btn {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:linear-gradient(135deg, #1890ff, #40a9ff);
    color:var(--text-inverse);
    border:none;
    border-radius:8px;
    padding:10px 20px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:all 0.2s ease;
    margin-left:auto;
    white-space:nowrap;
    min-width:70px;
  }
  .filter-btn:hover {
    transform:translateY(-1px);
    box-shadow:0 2px 8px rgba(24, 144, 255, 0.3);
  }
  .filter-btn:active {
    transform:translateY(0);
  }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */

</style>

<body data-active-menu="performance" data-active-submenu="performance-dashboard">

<!-- ===== 整体布局容器 ===== -->
<div class="app-layout">

  <!-- ===== 侧边栏 ===== -->
  <!-- 移动端遮罩层 -->
  <!-- ===== 主内容区 ===== -->
  <div class="main-wrapper">

    <!-- 顶栏 -->
    <!-- Tab 标签栏 -->

        <button class="tab-close-all" title="关闭全部标签">

    <main class="main-content">
<!-- 顶部导航 -->

<!-- 页面内容 -->
<div class="page-container">
  <!-- 筛选栏 -->
  <div class="filter-section">
    <div class="filter-group">
      <label class="filter-label">周期</label>
      <div class="filter-select-wrapper">
        <select class="filter-select">
          <option>本月</option>
          <option>上月</option>
          <option>本季度</option>
          <option>本年度</option>
        </select>
        <svg class="select-arrow" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 5L7 9L11 5"/>
        </svg>
      </div>
    </div>
    <div class="filter-group">
      <label class="filter-label">班组</label>
      <div class="filter-select-wrapper">
        <select class="filter-select" id="teamFilter">
          <option value="">全部班组</option>
        </select>
        <svg class="select-arrow" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 5L7 9L11 5"/>
        </svg>
      </div>
    </div>
    <button class="filter-btn" onclick="loadData()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6"/>
        <path d="M8 5V8L10 10"/>
      </svg>
      筛选
    </button>
  </div>

  <!-- 统计卡片 - 小尺寸样式 -->
  <div class="patrol-stats">
    <div class="patrol-stat-card green">
      <div class="stat-value" id="statTotal">—</div>
      <div class="stat-label">总人数</div>
    </div>
    <div class="patrol-stat-card blue">
      <div class="stat-value" id="statAvgComplete">—</div>
      <div class="stat-label">平均完成率</div>
    </div>
    <div class="patrol-stat-card orange">
      <div class="stat-value" id="statAvgQuality">—</div>
      <div class="stat-label">平均质量评分</div>
    </div>
    <div class="patrol-stat-card purple">
      <div class="stat-value" id="statExcellent">—</div>
      <div class="stat-label">优秀员工</div>
    </div>
  </div>

  <!-- 绩效趋势图 -->
  <div class="chart-section">
    <h2 class="section-title">绩效趋势分析</h2>
    <div id="chart-performance-trend" class="chart-container" style="height:300px;"></div>
  </div>

  <!-- 绩效排行和统计 -->
  <div class="double-section">
    <div class="table-container" style="overflow:hidden;">
      <h2 class="section-title">绩效排名</h2>
      <div class="data-table-wrapper">
      <table class="data-table compact-table">
        <thead>
          <tr>
            <th>排名</th>
            <th>姓名</th>
            <th>班组</th>
            <th>完成率</th>
            <th>质量</th>
            <th>工作量</th>
            <th>综合</th>
            <th>评级</th>
          </tr>
        </thead>
        <tbody id="rankBody"></tbody>
      </table>
      </div>
    </div>
    <div class="chart-section">
      <h2 class="section-title">绩效分布</h2>
      <div id="chart-performance-pie" class="chart-container" style="height:280px;"></div>
    </div>
  </div>

  <!-- 班组对比 -->
  <div class="double-section">
    <div class="chart-section">
      <h2 class="section-title">班组综合对比</h2>
      <div id="chart-team-compare" class="chart-container" style="height:280px;"></div>
    </div>
    <div class="chart-section">
      <h2 class="section-title">班组评级分布</h2>

    </div>

</div>

<!-- 引入交互脚本 -->
<script src="../common/js/api.js"></script>
<script src="js/components/chart.js"></script>

<script>
/* 严格空库模式：绩效结果全部来自真实接口 performance_result，
   排名表、统计卡片与四个图表均基于真实记录计算，不再内置示例数组、不再写 localStorage */
var performanceResults = [];
var LEVEL_TEXT = { excellent: '优秀', good: '良好', pass: '合格', fail: '待提升' };

function escapeHtml(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function setText(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}
function num(v) { return (v === null || v === undefined || v === '') ? null : Number(v); }

function levelOf(r) {
  if (r.rating && LEVEL_TEXT[r.rating]) return r.rating;
  var cnMap = { '优秀': 'excellent', '良好': 'good', '合格': 'pass', '待提升': 'fail' };
  if (r.rating && cnMap[r.rating]) return cnMap[r.rating];
  var t = num(r.composite);
  if (t === null) return 'pass';
  return t >= 90 ? 'excellent' : t >= 80 ? 'good' : t >= 60 ? 'pass' : 'fail';
}

function setChartEmpty(id, text) {
  var el = document.getElementById(id);
  if (el) el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-tertiary);font-size:13px;">' + escapeHtml(text) + '</div>';
}
function clearChart(id) {
  var el = document.getElementById(id);
  if (el) el.innerHTML = '';
}

function showEmpty(text) {
  ['statTotal', 'statAvgComplete', 'statAvgQuality', 'statExcellent'].forEach(function (id) { setText(id, '—'); });
  document.getElementById('rankBody').innerHTML =
    '<tr><td colspan="8" style="text-align:center;color:var(--text-tertiary);padding:32px;">' + escapeHtml(text) + '</td></tr>';
  ['chart-performance-trend', 'chart-performance-pie', 'chart-team-compare', 'chart-team-rating'].forEach(function (id) { setChartEmpty(id, text); });
}

function fillTeamFilter(list) {
  var sel = document.getElementById('teamFilter');
  if (!sel) return;
  var teams = [];
  list.forEach(function (r) { if (r.team && teams.indexOf(r.team) < 0) teams.push(r.team); });
  var current = sel.value;
  var html = '<option value="">全部班组</option>';
  teams.forEach(function (t) { html += '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</option>'; });
  sel.innerHTML = html;
  if (teams.indexOf(current) >= 0) sel.value = current;
}

function visibleList() {
  var sel = document.getElementById('teamFilter');
  var team = sel ? sel.value : '';
  return team ? performanceResults.filter(function (r) { return r.team === team; }) : performanceResults.slice();
}

function avg(list, field) {
  var vals = list.map(function (r) { return num(r[field]); }).filter(function (n) { return n !== null && !isNaN(n); });
  if (!vals.length) return 0;
  return vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
}

function renderStats(list) {
  setText('statTotal', list.length);
  setText('statAvgComplete', list.length ? Math.round(avg(list, 'complete_rate') * 10) / 10 + '%' : '—');
  setText('statAvgQuality', list.length ? Math.round(avg(list, 'quality_score') * 10) / 10 : '—');
  setText('statExcellent', list.filter(function (r) { return levelOf(r) === 'excellent'; }).length + '人');
}

function renderRank(list) {
  var sorted = list.slice().sort(function (a, b) { return (num(b.composite) || 0) - (num(a.composite) || 0); });
  var body = document.getElementById('rankBody');
  if (!sorted.length) {
    body.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-tertiary);padding:32px;">暂无数据</td></tr>';
    return;
  }
  body.innerHTML = sorted.map(function (r, i) {
    var lv = levelOf(r);
    var badge = i < 3 ? '<span class="ranking-badge ' + ['gold', 'silver', 'bronze'][i] + '">' + (i + 1) + '</span>' : String(i + 1);
    return '<tr>' +
      '<td>' + badge + '</td>' +
      '<td>' + escapeHtml(r.real_name || '') + '</td>' +
      '<td>' + escapeHtml(r.team || '') + '</td>' +
      '<td>' + (num(r.complete_rate) === null ? '—' : r.complete_rate + '%') + '</td>' +
      '<td>' + (num(r.quality_score) === null ? '—' : r.quality_score) + '</td>' +
      '<td>' + (num(r.workload) === null ? '—' : r.workload) + '</td>' +
      '<td>' + (num(r.composite) === null ? '—' : r.composite) + '</td>' +
      '<td><span class="score-badge ' + lv + '">' + (LEVEL_TEXT[lv] || r.rating || '—') + '</span></td>' +
    '</tr>';
  }).join('');
}

function renderTrend(list) {
  var withPeriod = list.filter(function (r) { return r.period; });
  if (!withPeriod.length) { setChartEmpty('chart-performance-trend', '暂无数据'); return; }
  var periods = [];
  withPeriod.forEach(function (r) { if (periods.indexOf(r.period) < 0) periods.push(r.period); });
  periods.sort();
  clearChart('chart-performance-trend');
  Chart.line('#chart-performance-trend', {
    categories: periods,
    series: [
      { name: '完成率(%)', data: periods.map(function (p) { return Math.round(avg(withPeriod.filter(function (r) { return r.period === p; }), 'complete_rate') * 10) / 10; }), color: '#1890ff', area: true },
      { name: '质量评分', data: periods.map(function (p) { return Math.round(avg(withPeriod.filter(function (r) { return r.period === p; }), 'quality_score') * 10) / 10; }), color: '#52c41a', area: true },
      { name: '工作量', data: periods.map(function (p) { return Math.round(avg(withPeriod.filter(function (r) { return r.period === p; }), 'workload') * 10) / 10; }), color: '#ff6b35', area: true }
    ]
  });
}

function renderPie(list) {
  if (!list.length) { setChartEmpty('chart-performance-pie', '暂无数据'); return; }
  var counts = { excellent: 0, good: 0, pass: 0, fail: 0 };
  list.forEach(function (r) { counts[levelOf(r)]++; });
  clearChart('chart-performance-pie');
  Chart.donut('#chart-performance-pie', {
    series: [
      { name: '优秀', value: counts.excellent },
      { name: '良好', value: counts.good },
      { name: '合格', value: counts.pass },
      { name: '待提升', value: counts.fail }
    ]
  });
}

function teamNames(list) {
  var names = [];
  list.forEach(function (r) { if (r.team && names.indexOf(r.team) < 0) names.push(r.team); });
  return names.sort();
}

function renderTeamCompare(list) {
  var teams = teamNames(list);
  if (!teams.length) { setChartEmpty('chart-team-compare', '暂无数据'); return; }
  clearChart('chart-team-compare');
  Chart.bar('#chart-team-compare', {
    categories: ['完成率(%)', '质量分', '综合分'],
    series: teams.map(function (t) {
      var sub = list.filter(function (r) { return r.team === t; });
      return { name: t, data: [Math.round(avg(sub, 'complete_rate') * 10) / 10, Math.round(avg(sub, 'quality_score') * 10) / 10, Math.round(avg(sub, 'composite') * 10) / 10] };
    })
  });
}

function renderTeamRating(list) {
  var teams = teamNames(list);
  if (!teams.length) { setChartEmpty('chart-team-rating', '暂无数据'); return; }
  var levels = ['excellent', 'good', 'pass', 'fail'];
  clearChart('chart-team-rating');
  Chart.stackedBar('#chart-team-rating', {
    categories: teams,
    series: levels.map(function (lv) {
      return { name: LEVEL_TEXT[lv], stack: 'rating', data: teams.map(function (t) {
        return list.filter(function (r) { return r.team === t && levelOf(r) === lv; }).length;
      }) };
    })
  });
}

function loadData() {
  showEmpty('加载中...');
  Api.get('performance_result', { page: 1, size: 500, sort: 'id', order: 'asc' }).then(function (res) {
    if (!res || !res.ok) {
      showEmpty('数据加载失败：' + ((res && res.message) || '请检查登录状态与网络'));
      return;
    }
    performanceResults = (res.data && res.data.list) || [];
    fillTeamFilter(performanceResults);
    var list = visibleList();
    renderStats(list);
    renderRank(list);
    renderTrend(list);
    renderPie(list);
    renderTeamCompare(list);
    renderTeamRating(list);
  }).catch(function (err) {
    showEmpty('数据加载失败：' + (err && err.message ? err.message : '网络异常'));
  });
}

document.addEventListener('DOMContentLoaded', function() {
  /* 全部图表与统计改为基于真实接口计算，见 loadData() / renderTrend 等函数 */
  loadData();
});
</script>
