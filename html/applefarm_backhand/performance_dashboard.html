<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 绩效看板</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
  <link rel="stylesheet" href="css/page-content.css">
<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition: all 0.2s ease;
  }
  .module-card:hover {
    background: var(--bg-hover);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  /* 紧凑表格样式 */
  .compact-table {
    min-width: auto !important;
    font-size: 12.5px !important;
    width: 100%;
  }
  .compact-table th,
  .compact-table td {
    padding: 10px 10px !important;
    white-space: nowrap;
  }
  .compact-table th {
    font-size: 11px !important;
    letter-spacing: 0.3px;
  }
  .compact-table td {
    line-height: 1.4;
  }

  /* 评级标签样式 */
  .score-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }
  .score-badge.excellent {
    background: linear-gradient(135deg, rgba(24, 144, 255, 0.15), rgba(24, 144, 255, 0.08));
    color: #1890ff;
    border: 1px solid rgba(24, 144, 255, 0.3);
  }
  .score-badge.good {
    background: linear-gradient(135deg, rgba(34, 168, 74, 0.15), rgba(34, 168, 74, 0.08));
    color: #22a84a;
    border: 1px solid rgba(34, 168, 74, 0.3);
  }
  .score-badge.pass {
    background: linear-gradient(135deg, rgba(255, 183, 77, 0.15), rgba(255, 183, 77, 0.08));
    color: #ffb74d;
    border: 1px solid rgba(255, 183, 77, 0.3);
  }
  .score-badge.fail {
    background: linear-gradient(135deg, rgba(245, 108, 108, 0.15), rgba(245, 108, 108, 0.08));
    color: #f56c6c;
    border: 1px solid rgba(245, 108, 108, 0.3);
  }

  /* 筛选栏样式 */
  .filter-section {
    display: flex;
    align-items: center;
    gap: 24px;
    background: #fff;
    padding: 16px 24px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    border: 1px solid rgba(0,0,0,0.06);
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .filter-label {
    font-size: 13px;
    color: #6b7b6b;
    font-weight: 500;
    white-space: nowrap;
  }
  .filter-select-wrapper {
    position: relative;
    display: inline-block;
  }
  .filter-select {
    appearance: none;
    background: #f7f9f7;
    border: 1px solid #e8ede8;
    border-radius: 8px;
    padding: 10px 32px 10px 14px;
    font-size: 14px;
    color: #3a4a3a;
    cursor: pointer;
    min-width: 140px;
    transition: all 0.2s ease;
  }
  .filter-select:hover {
    border-color: #46c365;
    background: #f0faf3;
  }
  .filter-select:focus {
    outline: none;
    border-color: #22a84a;
    box-shadow: 0 0 0 3px rgba(34, 168, 74, 0.1);
  }
  .select-arrow {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    color: #8b9b8b;
    pointer-events: none;
  }
  .filter-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: linear-gradient(135deg, #22a84a, #46c365);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-left: auto;
    white-space: nowrap;
    min-width: 70px;
  }
  .filter-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(34, 168, 74, 0.3);
  }
  .filter-btn:active {
    transform: translateY(0);
  }
</style>
</head>
<body data-active-menu="performance" data-active-submenu="performance-dashboard">

    <!-- Tab 标签栏 -->
    <div class="tab-bar">

    <!-- 主内容区 -->

<!-- 页面内容 -->
<div class="page-container">

<script src="js/sidebar-layout.js"></script>
<script src="js/components/chart.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // 绩效趋势数据
  const performanceTrendData = {
    categories: ['1月', '2月', '3月', '4月', '5月', '6月'],
    series: [
      {
        name: '完成率',
        data: [88, 92, 95, 90, 94, 92],
        color: '#22a84a',
        area: true
      },
      {
        name: '质量评分',
        data: [85, 88, 90, 87, 92, 88],
        color: '#1890ff',
        area: true
      },
      {
        name: '工作量',
        data: [35, 40, 45, 38, 42, 48],
        color: '#ff6b35',
        area: true
      }
    ]
  };
  Chart.line('#chart-performance-trend', performanceTrendData);

  // 绩效分布饼图数据
  const performancePieData = {
    series: [
      { name: '优秀', value: 21 },
      { name: '良好', value: 43 },
      { name: '合格', value: 29 },
      { name: '待提升', value: 7 }
    ]
  };
  Chart.donut('#chart-performance-pie', performancePieData);
});
</script>
