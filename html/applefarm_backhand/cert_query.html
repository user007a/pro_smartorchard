<style>
  .search-section {
    background:var(--bg-card);
    border-radius:var(--radius-lg);
    padding:var(--space-2xl);
    box-shadow:var(--shadow-card);
    margin-bottom:var(--space-xl);
    text-align:center;
  }
  .search-title {
    font-size:var(--font-size-xl);
    font-weight:var(--font-weight-bold);
    color:var(--text-primary);
    margin-bottom:var(--space-lg);
  }
  .search-box {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:var(--space-md);
    margin-bottom:var(--space-xl);
  }
  .search-box .search-input {
    width:400px;
    padding:14px 20px;
    border:2px solid var(--border-default);
    border-radius:var(--radius-lg);
    font-size:var(--font-size-base);
    transition:all var(--transition-fast);
    background:var(--bg-card);
    outline:none;
  }
  .search-box .search-input:focus {
    border-color:var(--primary-500);
    box-shadow:0 0 0 4px rgba(24, 144, 255, 0.1);
  }
  .scan-area {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:var(--space-md);
    padding:var(--space-xl);
    border:2px dashed var(--border-default);
    border-radius:var(--radius-lg);
    transition:all var(--transition-fast);
    cursor:pointer;
  }
  .scan-area:hover {
    border-color:var(--primary-500);
    background:var(--primary-50);
  }
  .scan-icon {
    width:80px;
    height:80px;
    color:var(--text-tertiary);
  }
  .scan-text {
    font-size:var(--font-size-sm);
    color:var(--text-secondary);
    font-weight:var(--font-weight-medium);
  }
  .result-section {
    background:var(--bg-card);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    overflow:hidden;
    margin-bottom:var(--space-xl);
  }
  .result-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:var(--space-lg) var(--space-xl);
    background:linear-gradient(135deg, var(--primary-50), var(--gray-50));
    border-bottom:1px solid var(--border-light);
  }
  .result-title {
    font-size:var(--font-size-lg);
    font-weight:var(--font-weight-bold);
    color:var(--text-primary);
  }
  .verify-badge {
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    background:var(--success-bg);
    border-radius:var(--radius-full);
    color:var(--success);
    font-size:var(--font-size-sm);
    font-weight:var(--font-weight-medium);
  }
  .cert-card {
    padding:var(--space-xl);
    background:linear-gradient(180deg, #fff 0%, var(--gray-50) 100%);
  }
  .cert-header {
    text-align:center;
    padding-bottom:var(--space-xl);
    border-bottom:2px solid var(--primary-100);
    margin-bottom:var(--space-xl);
  }
  .cert-title {
    font-size:24px;
    font-weight:var(--font-weight-bold);
    color:var(--primary-600);
    margin-bottom:4px;
  }
  .cert-subtitle {
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
    font-style:italic;
  }
  .cert-body {
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:var(--space-lg);
    padding-right:120px;
  }
  .cert-row {
    display:flex;
    justify-content:space-between;
    padding:12px 16px;
    background:var(--bg-card);
    border-radius:var(--radius-md);
    border:1px solid var(--border-light);
  }
  .cert-label {
    font-size:var(--font-size-sm);
    color:var(--text-secondary);
    font-weight:var(--font-weight-medium);
  }
  .cert-value {
    font-size:var(--font-size-sm);
    color:var(--text-primary);
    font-weight:var(--font-weight-semibold);
  }
  .cert-qr {
    position:absolute;
    right:var(--space-xl);
    top:calc(50% - 60px);
  }
  .qr-box {
    width:120px;
    height:120px;
    background:var(--bg-card);
    border:1px solid var(--border-light);
    border-radius:var(--radius-lg);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:var(--shadow-sm);
  }
  .cert-footer {
    padding-top:var(--space-xl);
    margin-top:var(--space-xl);
    border-top:1px dashed var(--border-light);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .cert-stamp {
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
    font-style:italic;
    padding:8px 20px;
    border:1px solid var(--border-default);
    border-radius:var(--radius-md);
  }
  .stats-grid {
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:var(--space-lg);
    margin-bottom:var(--space-xl);
  }
  .stat-card {
    background:var(--bg-card);
    border-radius:var(--radius-lg);
    padding:var(--space-xl);
    box-shadow:var(--shadow-card);
    border:1px solid rgba(24, 144, 255, 0.08);
    transition:all var(--transition-normal);
    position:relative;
    overflow:hidden;
  }
  .stat-card::before {
    content:'';
    position:absolute;
    top:0;
    left:0;
    width:4px;
    height:100%;
    background:var(--gradient-primary);
    border-radius:0 3px 3px 0;
  }
  .stat-icon {
    width:48px;
    height:48px;
    border-radius:var(--radius-md);
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--primary-50);
    color:var(--primary-500);
    font-size:22px;
    margin-bottom:var(--space-md);
  }
  .stat-label {
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
    font-weight:var(--font-weight-medium);
  }
  .stat-value {
    font-size:32px;
    font-weight:var(--font-weight-bold);
    line-height:1.2;
    background:linear-gradient(135deg, var(--primary-600), var(--primary-500));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .action-bar {
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:var(--space-md);
    padding:var(--space-lg);
    background:var(--bg-card);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    margin-bottom:var(--space-xl);
  }
  .data-table {
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    font-size:var(--font-size-base);
    background:var(--bg-card);
    border-radius:var(--radius-lg);
    overflow:hidden;
    box-shadow:var(--shadow-card);
  }
  .data-table th {
    background:linear-gradient(135deg, var(--gray-50), var(--gray-100));
    font-weight:var(--font-weight-semibold);
    color:var(--text-secondary);
    font-size:var(--font-size-sm);
    padding:14px 16px;
    text-align:left;
    border-bottom:2px solid var(--border-light);
    position:sticky;
    top:0;
    z-index:1;
  }
  .data-table td {
    padding:14px 16px;
    border-bottom:1px solid var(--border-light);
    transition:background var(--transition-fast);
  }
  .data-table tbody tr:nth-child(even) {
    background:var(--gray-50);
  }
  .status-text {
    color:var(--success);
    font-weight:var(--font-weight-medium);
  }
  .pagination {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:var(--space-sm);
    padding:var(--space-xl);
  }

let queryCurrentPage = 1;
let queryPageSize = 10;
let queryFilteredData = [...mockQueryData];

function renderQueryTable() {
  const tbody = document.getElementById('dataTableBody');
  const start = (queryCurrentPage - 1) * queryPageSize;
  const end = start + queryPageSize;
  const pageData = queryFilteredData.slice(start, end);
  
  tbody.innerHTML = pageData.map((item, __seq) => `
    <tr>
      <td>${__seq + 1}</td>
      <td><strong>${item.certNo}</strong></td>
      <td>${item.product}</td>
      <td>${item.time}</td>
      <td>${item.ip}</td>
      <td><span class="status-tag ${item.status}">${item.statusText}</span></td>
    </tr>
  `).join('');
}

function renderQueryPagination() {
  const container = document.getElementById('paginationContainer');
  const totalPages = Math.ceil(queryFilteredData.length / queryPageSize);
  
  if (totalPages <= 1) {
    container.innerHTML = '';
    return;
  }
  
  let html = '';
  html += `<button class="page-btn ${queryCurrentPage === 1 ? 'disabled' : ''}" onclick="goToQueryPage(${queryCurrentPage - 1})">‹</button>`;
  
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= queryCurrentPage - 1 && i <= queryCurrentPage + 1)) {
      html += `<button class="page-btn ${i === queryCurrentPage ? 'active' : ''}" onclick="goToQueryPage(${i})">${i}</button>`;
    } else if (i === queryCurrentPage - 2 || i === queryCurrentPage + 2) {
      html += '<span class="page-ellipsis">...</span>';
    }
  }
  
  html += `<button class="page-btn ${queryCurrentPage === totalPages ? 'disabled' : ''}" onclick="goToQueryPage(${queryCurrentPage + 1})">›</button>`;
  container.innerHTML = html;
}

function goToQueryPage(page) {
  const totalPages = Math.ceil(queryFilteredData.length / queryPageSize);
  if (page < 1 || page > totalPages) return;
  queryCurrentPage = page;
  renderQueryTable();
  renderQueryPagination();
}

document.addEventListener('DOMContentLoaded', function() {
  PageActions.init('cert-query');
  renderQueryTable();
  renderQueryPagination();
});
</script>
