<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 销售统计</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
<link rel="stylesheet" href="css/sales-module.css">
<style>
  .chart-box { height: 240px; }
  .dim-table { min-width: 1080px; }
  .stat-bars { display: flex; align-items: center; gap: 10px; }
  .stat-bars .progress-track { flex: 1; }
  .target-row { padding: 10px 0; border-bottom: 1px dashed var(--border-light, #e8efe8); }
  .target-row:last-child { border-bottom: none; }
  .target-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .target-name { font-size: 13px; font-weight: 600; color: var(--text-primary, #1f2d1f); }
  .target-meta { font-size: 12px; color: var(--text-tertiary, #8c9a8c); font-variant-numeric: tabular-nums; }
  .target-meta strong { color: var(--text-primary, #1f2d1f); }
  .aging-row { padding: 10px 0; border-bottom: 1px dashed var(--border-light, #e8efe8); }
  .aging-row:last-child { border-bottom: none; }
  .aging-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
  .aging-name { color: var(--text-primary, #1f2d1f); }
  .aging-val { color: var(--text-tertiary, #8c9a8c); font-size: 12px; font-variant-numeric: tabular-nums; }
  .aging-val strong { color: var(--text-primary, #1f2d1f); font-size: 13px; }
  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
    font-size: 12px; font-weight: 600; background: var(--gray-100, #f3f6f3); color: var(--text-tertiary, #8c9a8c);
  }
  .rank-badge.top1 { background: #fff7e6; color: #ad8b00; }
  .rank-badge.top2 { background: #f5f5f5; color: #595959; }
  .rank-badge.top3 { background: #f6e3d0; color: #96551b; }
  .cell-ratio-bar { height: 8px; background: var(--gray-100, #eef2ee); border-radius: 4px; overflow: hidden; min-width: 90px; }
  .cell-ratio-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #1890ff, #1a8a3a); }
  .cell-ratio-text { margin-top: 4px; font-size: 12px; color: var(--text-secondary, #4a5a4a); text-align: right; font-variant-numeric: tabular-nums; }
</style>
<style id="standalone-fix">.main-wrapper{margin-left:0!important;width:100%!important;}</style>
</head>
<body data-active-menu="sales" data-active-submenu="sales-statistics">
<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3L11 11M11 3L3 11"/></svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <div class="content-wrapper">
        <div class="page-header">
          <h1 class="page-title">销售统计</h1>
          <p class="page-subtitle">与销售订单、客户管理同源统计：年份 / 月份 / 渠道 / 业务员 / 日期区间 / 维度筛选全部生效；已取消订单不计入，退款按售后已完成金额冲减。</p>
        </div>

        <div class="page-section search-section">
          <div class="search-bar filter-bar">
            <span class="filter-label">年份</span>
            <select class="search-select" id="stYear"></select>
            <span class="filter-label">月份</span>
            <select class="search-select" id="stMonth">
              <option value="">全年</option>
              <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
              <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
              <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
              <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
            </select>
            <span class="filter-label">渠道</span>
            <select class="search-select" id="stChannel">
              <option value="all">全部渠道</option>
              <option value="wholesale">批发渠道</option>
              <option value="retail">零售渠道</option>
              <option value="adoption">认养渠道</option>
              <option value="tour">观光采摘</option>
            </select>
            <span class="filter-label">业务员</span>
            <select class="search-select" id="stOwner"><option value="all">全部业务员</option></select>
            <span class="filter-label">下单日期</span>
            <input type="date" class="search-input" id="stStart" style="min-width:140px;max-width:160px;">
            <span class="filter-label">至</span>
            <input type="date" class="search-input" id="stEnd" style="min-width:140px;max-width:160px;">
            <span class="filter-label">统计维度</span>
            <select class="search-select" id="stDim">
              <option value="channel">渠道</option>
              <option value="owner">业务员</option>
              <option value="customer">客户</option>
              <option value="region">区域</option>
              <option value="variety">品类</option>
              <option value="month">月份</option>
            </select>
            <div class="search-actions">
              <button class="jg-btn jg-btn-primary" onclick="applyFilter()">查询</button>
              <button class="jg-btn" onclick="resetFilter()">重置</button>
              <button class="jg-btn" onclick="exportStats()">导出 CSV</button>
            </div>
          </div>
        </div>

        <div class="sales-stats" id="statCards"></div>

        <div class="chart-grid">
          <div class="chart-card">
            <div class="chart-card-head">
              <h4>销售趋势（万元）</h4>
              <span class="muted" id="trendNote"></span>
            </div>
            <div class="chart-box" id="chartTrend"></div>
          </div>
          <div class="chart-card">
            <div class="chart-card-head">
              <h4>渠道销售构成</h4>
              <span class="muted">按销售额占比</span>
            </div>
            <div class="chart-box" id="chartChannel"></div>
          </div>
        </div>

        <div class="chart-grid cols-3">
          <div class="chart-card">
            <div class="chart-card-head"><h4>业务员业绩 TOP8</h4><span class="muted">万元</span></div>
            <div class="chart-box sm" id="chartOwner"></div>
          </div>
          <div class="chart-card">
            <div class="chart-card-head"><h4>月度订单量</h4><span class="muted">按所选年份</span></div>
            <div class="chart-box sm" id="chartCount"></div>
          </div>
          <div class="chart-card">
            <div class="chart-card-head"><h4>目标达成</h4><span class="muted" id="targetNote"></span></div>
            <div id="targetList" style="max-height:220px;overflow-y:auto;"></div>
          </div>
        </div>

        <div class="chart-card" style="margin-bottom:16px;">
          <div class="chart-card-head">
            <h4>维度明细（<span id="dimName">渠道</span>）</h4>
            <span class="muted">点击「下钻」查看该维度下的订单清单</span>
          </div>
          <div class="data-table-wrapper">
            <table class="data-table dim-table">
              <thead>
                <tr>
                  <th style="width:60px;">序号</th>
                  <th style="width:220px;">维度</th>
                  <th style="width:90px;" class="text-right">订单数</th>
                  <th style="width:130px;" class="text-right">销售额</th>
                  <th style="width:130px;" class="text-right">净销售额</th>
                  <th style="width:130px;" class="text-right">已收</th>
                  <th style="width:110px;" class="text-right">退款</th>
                  <th style="width:200px;">占比</th>
                  <th style="width:90px;">操作</th>
                </tr>
              </thead>
              <tbody id="dimTableBody"></tbody>
            </table>
          </div>
          <div id="pagination-container" style="display:flex;justify-content:flex-end;margin-top:14px;"></div>
        </div>

        <div class="chart-grid">
          <div class="chart-card">
            <div class="chart-card-head"><h4>回款 TOP10 客户</h4><span class="muted">按收款时间，年份 / 月份生效</span></div>
            <div id="rankList"></div>
          </div>
          <div class="chart-card">
            <div class="chart-card-head"><h4>应收账龄</h4><span class="muted" id="agingNote"></span></div>
            <div id="agingList"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 维度下钻 -->
<div class="modal-overlay" id="drillModal" style="display:none;">
  <div class="modal modal-xl">
    <div class="modal-header">
      <h3 class="modal-title" id="drillTitle">维度下钻</h3>
      <button class="modal-close" onclick="closeDrill()">×</button>
    </div>
    <div class="modal-body" id="drillBody"></div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeDrill()">关闭</button>
    </div>
  </div>
</div>

<script src="js/shared/sales-store.js"></script>
<script src="js/components/chart.js"></script>
<script src="js/common-functions.js"></script>
<script src="js/icons.js"></script>
<script src="js/typography.js"></script>
<script>
(function () {
  'use strict';

  var S = window.SalesStore;
  var PAGE_SIZE = 10;
  var DIM_TEXT = { channel: '渠道', owner: '业务员', customer: '客户', region: '区域', variety: '品类', month: '月份' };
  var PIE_COLORS = ['#1890ff', '#52c41a', '#faad14', '#722ed1', '#13c2c2', '#eb2f96'];

  var F = { year: '2026', month: '', channel: 'all', owner: 'all', startDate: '', endDate: '', dim: 'channel' };
  var lastDimRows = [];

  function $(id) { return document.getElementById(id); }
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function pct(n) { return ((Number(n) || 0) * 100).toFixed(1) + '%'; }
  function wanVal(n) { return Math.round((Number(n) || 0) / 100) / 100; }
  function wanText(n) { return (Number(n) || 0) >= 10000 ? S.fmtWan(n) : S.fmtMoney(n); }

  function toast(msg, type) {
    if (window.LegacyToast) window.LegacyToast.show(msg, type || 'success');
  }

  /* ---------------- 筛选 ---------------- */
  function currentFilter() {
    return {
      year: F.year,
      month: F.month,
      channel: F.channel,
      owner: F.owner,
      startDate: F.startDate,
      endDate: F.endDate
    };
  }

  function readFilter() {
    F.year = $('stYear').value || F.year;
    F.month = $('stMonth').value;
    F.channel = $('stChannel').value;
    F.owner = $('stOwner').value;
    F.startDate = $('stStart').value;
    F.endDate = $('stEnd').value;
    F.dim = $('stDim').value;
  }

  window.applyFilter = function () {
    readFilter();
    if (F.startDate && F.endDate && F.startDate > F.endDate) {
      toast('开始日期不能晚于结束日期', 'warning');
      return;
    }
    renderAll();
    toast('筛选已生效');
  };

  window.resetFilter = function () {
    var y = String(new Date().getFullYear());
    $('stYear').value = $('stYear').options.length ? ($('stYear').querySelector('option[value="' + y + '"]') ? y : $('stYear').options[0].value) : '';
    $('stMonth').value = '';
    $('stChannel').value = 'all';
    $('stOwner').value = 'all';
    $('stStart').value = '';
    $('stEnd').value = '';
    $('stDim').value = 'channel';
    readFilter();
    renderAll();
  };

  function populateOptions() {
    var orders = S.orders();
    var years = {};
    orders.forEach(function (o) {
      var y = String(o.createdAt || '').slice(0, 4);
      if (y) years[y] = true;
    });
    years[String(new Date().getFullYear())] = true;
    years['2025'] = true;
    var yearList = Object.keys(years).sort().reverse();
    $('stYear').innerHTML = yearList.map(function (y) { return '<option value="' + y + '">' + y + ' 年</option>'; }).join('');

    var owners = {};
    orders.forEach(function (o) { if (o.owner) owners[o.owner] = true; });
    var ownerList = Object.keys(owners).sort();
    $('stOwner').innerHTML = '<option value="all">全部业务员</option>' +
      ownerList.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('');
  }

  /* ---------------- 统计卡 ---------------- */
  function card(label, value, sub, cls) {
    return '<div class="sales-stat-card ' + (cls || '') + '">' +
      '<div class="stat-label">' + label + '</div>' +
      '<div class="stat-value">' + value + '</div>' +
      '<div class="stat-sub">' + sub + '</div>' +
    '</div>';
  }

  function renderStats() {
    var f = currentFilter();
    var s = S.summary(f);
    var ag = S.aging(f);
    var rate = s.amount ? s.paid / s.amount : 0;
    $('statCards').innerHTML =
      card('销售额', wanText(s.amount), s.count + ' 笔有效订单 / 共 ' + s.total + ' 笔', 'is-primary') +
      card('净销售额', wanText(s.net), '退款冲减 ' + wanText(s.refund), 'is-success') +
      card('已回款', wanText(s.paid), '回款率 ' + pct(rate), 'is-success') +
      card('应收余额', wanText(s.balance), '超 60 天 ' + wanText(ag.over60), s.balance > 0 ? 'is-warning' : '') +
      card('客单价', S.fmtMoney(s.avg), '平均单笔成交金额', '') +
      card('目标达成', s.targetAmount ? pct(s.achievement) : '未设目标',
        s.targetAmount ? '目标 ' + wanText(s.targetAmount) + ' · 实际 ' + wanText(s.amount) : '请前往「销售目标」设置',
        s.targetAmount ? (s.achievement >= 1 ? 'is-success' : (s.achievement >= 0.8 ? 'is-warning' : 'is-danger')) : 'is-danger');

    $('agingNote').textContent = '平均账龄 ' + ag.avgDays + ' 天 · 超 60 天 ' + wanText(ag.over60);
  }

  /* ---------------- 图表 ---------------- */
  function safeChart(fn) {
    try {
      var p = fn();
      if (p && typeof p.catch === 'function') p.catch(function () {});
    } catch (e) { /* ECharts 不可用时不阻塞页面 */ }
  }

  function renderCharts() {
    var f = currentFilter();
    var trend = S.monthlyStats({ year: F.year, channel: F.channel, owner: F.owner });
    var cats = trend.map(function (r) { return r.month + '月'; });
    var totals = trend.map(function (r) { return wanVal(r.total); });
    var nets = trend.map(function (r) { return wanVal(r.net); });
    var bases = trend.map(function (r) { return wanVal(r.baseline); });

    $('trendNote').textContent = F.year + ' 年 · 全年 12 个月（渠道 / 业务员筛选生效）';

    safeChart(function () {
      return Chart.line('#chartTrend', {
        categories: cats,
        series: [
          { name: '销售额', data: totals, color: '#1890ff', area: true },
          { name: '净销售额', data: nets, color: '#52c41a', area: false },
          { name: '上年同期', data: bases, color: '#bfbfbf', area: false }
        ]
      });
    });

    var byChannel = S.dimensionStats('channel', f);
    safeChart(function () {
      return Chart.pie('#chartChannel', {
        series: byChannel.map(function (r, i) {
          return { name: r.label, value: wanVal(r.amount), color: PIE_COLORS[i % PIE_COLORS.length] };
        })
      });
    });

    var byOwner = S.dimensionStats('owner', f).slice(0, 8).reverse();
    safeChart(function () {
      return Chart.bar('#chartOwner', {
        categories: byOwner.map(function (r) { return r.label; }),
        series: [{ name: '销售额(万元)', data: byOwner.map(function (r) { return wanVal(r.amount); }), color: '#1890ff' }]
      });
    });

    safeChart(function () {
      return Chart.bar('#chartCount', {
        categories: cats,
        series: [{ name: '订单数', data: trend.map(function (r) { return r.count; }), color: '#52c41a' }]
      });
    });
  }

  /* ---------------- 目标达成 ---------------- */
  function renderTargets() {
    var list = S.targets().filter(function (t) { return String(t.period).indexOf(F.year) === 0; });
    list.sort(function (a, b) {
      var am = String(a.period).length, bm = String(b.period).length;
      if (am !== bm) return am - bm;
      return String(a.period) < String(b.period) ? -1 : 1;
    });
    if (!list.length) {
      $('targetList').innerHTML = '<div class="empty-state"><strong>暂无销售目标</strong>请在「销售目标」页面按年度或月度设置目标</div>';
      $('targetNote').textContent = '';
      return;
    }
    $('targetNote').textContent = F.year + ' 年共 ' + list.length + ' 条目标';
    $('targetList').innerHTML = list.map(function (t) {
      var p = S.targetProgress(t.period, t.owner);
      var rate = p.amountRate;
      var cls = rate >= 1 ? '' : (rate >= 0.8 ? 'warn' : 'danger');
      return '<div class="target-row">' +
        '<div class="target-head">' +
          '<span class="target-name">' + esc(String(t.period).indexOf('-') > 0 ? t.period + ' 月' : t.period + ' 年度') +
            ' · ' + esc(t.owner || '全公司') + '</span>' +
          '<span class="target-meta"><strong>' + pct(rate) + '</strong> · ' + p.actualAmount.toFixed(1) + ' / ' + p.targetAmount.toFixed(1) + ' 万</span>' +
        '</div>' +
        '<div class="progress-track"><div class="progress-fill ' + cls + '" style="width:' + Math.min(100, Math.round(rate * 100)) + '%;"></div></div>' +
      '</div>';
    }).join('');
  }

  /* ---------------- 维度明细 ---------------- */
  function dimRow(r, index) {
    var rid = encodeURIComponent(r.key);
    return '<tr>' +
      '<td>' + (index + 1) + '</td>' +
      '<td style="font-weight:600;">' + esc(r.label) + '</td>' +
      '<td class="num text-right">' + r.count + '</td>' +
      '<td class="num money text-right">' + wanText(r.amount) + '</td>' +
      '<td class="num text-right">' + wanText(r.net) + '</td>' +
      '<td class="num text-right text-success">' + wanText(r.paid) + '</td>' +
      '<td class="num text-right ' + (r.refund > 0 ? 'text-danger' : 'muted') + '">' + wanText(r.refund) + '</td>' +
      '<td><div class="cell-ratio-bar"><div class="cell-ratio-fill" style="width:' + Math.max(2, Math.min(100, r.ratio * 100)) + '%;"></div></div>' +
        '<div class="cell-ratio-text">' + pct(r.ratio) + '</div></td>' +
      '<td><button class="action-btn view" data-key="' + rid + '">下钻</button></td>' +
    '</tr>';
  }

  function renderDimensionTable() {
    lastDimRows = S.dimensionStats(F.dim, currentFilter());
    $('dimName').textContent = DIM_TEXT[F.dim] || '渠道';
    var tbody = $('dimTableBody');
    if (!lastDimRows.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="9" style="text-align:center;color:var(--text-tertiary);padding:36px 0;">当前筛选条件下暂无销售数据</td></tr>';
      $('pagination-container').innerHTML = '';
      return;
    }
    Pagination.init({
      data: lastDimRows,
      pageSize: PAGE_SIZE,
      containerId: 'pagination-container',
      tbodyId: 'dimTableBody',
      renderRow: dimRow
    });
  }

  /* ---------------- 下钻 ---------------- */
  function orderMatches(o) {
    if (o.status === 'cancelled') return false;
    var d = String(o.createdAt || '').slice(0, 10);
    if (F.year && d.slice(0, 4) !== F.year) return false;
    if (F.month && Number(d.slice(5, 7)) !== Number(F.month)) return false;
    if (F.channel !== 'all' && o.channel !== F.channel) return false;
    if (F.owner !== 'all' && o.owner !== F.owner) return false;
    if (F.startDate && d < F.startDate) return false;
    if (F.endDate && d > F.endDate) return false;
    return true;
  }

  function dimKeyOf(o) {
    if (F.dim === 'channel') return o.channel;
    if (F.dim === 'owner') return o.owner || '未分配';
    if (F.dim === 'customer') return o.customerId + '|' + o.customerName;
    if (F.dim === 'region') {
      var c = S.customer(o.customerId);
      return c ? c.region : '线上';
    }
    if (F.dim === 'variety') return (o.items && o.items[0]) ? o.items[0].name : '其他';
    return String(o.createdAt || '').slice(0, 7);
  }

  window.drillDown = function (btn) {
    var key = decodeURIComponent(btn.getAttribute('data-key'));
    var row = null;
    lastDimRows.forEach(function (r) { if (r.key === key) row = r; });
    var orders = S.orders().filter(function (o) {
      return orderMatches(o) && dimKeyOf(o) === key;
    }).sort(function (a, b) {
      return (b.createdAt || '').localeCompare(a.createdAt || '');
    });

    $('drillTitle').textContent = '下钻 · ' + (row ? row.label : key) + '（' + orders.length + ' 笔订单）';
    if (!orders.length) {
      $('drillBody').innerHTML = '<div class="empty-state">该维度下暂无订单</div>';
    } else {
      var total = 0, paid = 0;
      orders.forEach(function (o) { total += Number(o.payableAmount) || 0; paid += Number(o.paidAmount) || 0; });
      $('drillBody').innerHTML = '<div class="detail-grid cols-3" style="margin-bottom:14px;">' +
        '<div class="detail-item"><span class="detail-label">订单数</span><span class="detail-value">' + orders.length + ' 笔</span></div>' +
        '<div class="detail-item"><span class="detail-label">销售额</span><span class="detail-value">' + S.fmtMoney(total) + '</span></div>' +
        '<div class="detail-item"><span class="detail-label">已收 / 应收</span><span class="detail-value">' + S.fmtMoney(paid) + ' / ' + S.fmtMoney(total - paid) + '</span></div>' +
      '</div>' +
      '<table class="detail-table"><thead><tr><th>订单编号</th><th>客户</th><th>渠道</th><th class="num">金额</th><th class="num">已收</th><th>状态</th><th>下单时间</th></tr></thead><tbody>' +
      orders.map(function (o) {
        return '<tr><td>' + esc(o.no) + '</td><td>' + esc(o.customerName) + '</td>' +
          '<td>' + esc(S.CHANNEL_TEXT[o.channel] || o.channel) + '</td>' +
          '<td class="num">' + S.fmtMoney(o.payableAmount) + '</td>' +
          '<td class="num">' + S.fmtMoney(o.paidAmount) + '</td>' +
          '<td>' + esc(S.ORDER_STATUS_TEXT[o.status] || o.status) + '</td>' +
          '<td>' + S.fmtTime(o.createdAt) + '</td></tr>';
      }).join('') + '</tbody></table>';
    }
    $('drillModal').style.display = 'flex';
    $('drillModal').classList.add('show');
  };

  window.closeDrill = function () {
    $('drillModal').classList.remove('show');
    $('drillModal').style.display = 'none';
  };

  $('dimTableBody').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-key]');
    if (btn) window.drillDown(btn);
  });

  /* ---------------- 回款 TOP10 ---------------- */
  function renderRank() {
    var list = S.customerRank({ year: F.year, month: F.month ? Number(F.month) : null }, 10);
    if (!list.length) {
      $('rankList').innerHTML = '<div class="empty-state">当前条件下暂无回款记录</div>';
      return;
    }
    var total = list.reduce(function (sum, x) { return sum + (Number(x.amount) || 0); }, 0);
    $('rankList').innerHTML = '<table class="detail-table"><thead><tr>' +
      '<th style="width:56px;">排名</th><th>客户</th><th class="num">订单数</th><th class="num">回款金额</th><th style="width:130px;">占比</th>' +
      '</tr></thead><tbody>' +
      list.map(function (x, i) {
        var cls = i === 0 ? ' top1' : i === 1 ? ' top2' : i === 2 ? ' top3' : '';
        var ratio = total ? x.amount / total : 0;
        return '<tr><td><span class="rank-badge' + cls + '">' + (i + 1) + '</span></td>' +
          '<td>' + esc(x.customerName) + '</td>' +
          '<td class="num">' + x.orderCount + '</td>' +
          '<td class="num">' + S.fmtMoney(x.amount) + '</td>' +
          '<td><div class="cell-ratio-bar"><div class="cell-ratio-fill" style="width:' + Math.max(2, Math.min(100, ratio * 100)) + '%;"></div></div>' +
            '<div class="cell-ratio-text">' + pct(ratio) + '</div></td></tr>';
      }).join('') + '</tbody></table>';
  }

  /* ---------------- 账龄 ---------------- */
  function renderAging() {
    var ag = S.aging(currentFilter());
    var max = 0;
    ag.buckets.forEach(function (b) { if (b.amount > max) max = b.amount; });
    $('agingList').innerHTML =
      '<div class="detail-grid cols-3" style="margin-bottom:12px;">' +
        '<div class="detail-item"><span class="detail-label">应收余额</span><span class="detail-value">' + wanText(ag.total) + '</span></div>' +
        '<div class="detail-item"><span class="detail-label">超 60 天</span><span class="detail-value ' + (ag.over60 > 0 ? 'text-danger' : '') + '">' + wanText(ag.over60) + '</span></div>' +
        '<div class="detail-item"><span class="detail-label">平均账龄</span><span class="detail-value">' + ag.avgDays + ' 天</span></div>' +
      '</div>' +
      ag.buckets.map(function (b, i) {
        var width = max ? Math.max(2, Math.round(b.amount / max * 100)) : 0;
        return '<div class="aging-row">' +
          '<div class="aging-head"><span class="aging-name">' + esc(b.label) + '</span>' +
            '<span class="aging-val"><strong>' + wanText(b.amount) + '</strong> · ' + b.count + ' 笔</span></div>' +
          '<div class="progress-track"><div class="progress-fill ' + (i >= 2 ? 'warn' : '') + '" style="width:' + width + '%;"></div></div>' +
        '</div>';
      }).join('');
  }

  /* ---------------- 导出 ---------------- */
  window.exportStats = function () {
    readFilter();
    var f = currentFilter();
    var s = S.summary(f);
    var rows = S.dimensionStats(F.dim, f);
    var headers = ['统计维度', '维度值', '订单数', '销售额(元)', '净销售额(元)', '已收(元)', '退款(元)', '占比(%)'];
    var data = rows.map(function (r) {
      return [DIM_TEXT[F.dim] || '渠道', r.label, r.count, r.amount.toFixed(2), r.net.toFixed(2), r.paid.toFixed(2), r.refund.toFixed(2), (r.ratio * 100).toFixed(1)];
    });
    data.push(['合计', '—', s.count, s.amount.toFixed(2), s.net.toFixed(2), s.paid.toFixed(2), s.refund.toFixed(2), '100.0']);
    var name = '销售统计_' + F.year + (F.month ? '-' + F.month : '') + '_' + (DIM_TEXT[F.dim] || '渠道') + '.csv';
    if (S.downloadCsv(name, headers, data)) toast('已导出 ' + rows.length + ' 行明细');
    else toast('导出失败，请检查浏览器下载权限', 'error');
  };

  /* ---------------- 初始化 ---------------- */
  function renderAll() {
    renderStats();
    renderCharts();
    renderTargets();
    renderDimensionTable();
    renderRank();
    renderAging();
  }

  function init() {
    if (!S) {
      document.querySelector('.content-wrapper').innerHTML = '<div class="empty-state"><strong>销售数据层加载失败</strong>请刷新页面重试</div>';
      return;
    }
    populateOptions();
    var y = String(new Date().getFullYear());
    $('stYear').value = $('stYear').querySelector('option[value="' + y + '"]') ? y : ($('stYear').options[0] ? $('stYear').options[0].value : '2026');
    readFilter();

    $('stDim').addEventListener('change', function () {
      F.dim = $('stDim').value;
      renderDimensionTable();
    });
    $('stYear').addEventListener('change', function () {
      F.year = $('stYear').value;
      renderAll();
    });
    $('stMonth').addEventListener('change', function () {
      F.month = $('stMonth').value;
      renderAll();
    });

    renderAll();
    S.subscribe(renderAll);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
