<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 物资基础配置</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; justify-content:center; align-items:center; backdrop-filter:blur(4px); }
  .modal-overlay.show { display:flex; }
  .modal-container { background:var(--bg-card); border-radius:12px; width:90%; max-width:620px; max-height:85vh; overflow:hidden; box-shadow:0 20px 40px rgba(0,0,0,.2); }
  .modal-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border-default); background:var(--gray-50); }
  .modal-title { font-size:16px; font-weight:600; color:#1f1f1f; }
  .modal-close { background:none; border:none; cursor:pointer; font-size:22px; line-height:1; color:var(--text-tertiary); }
  .modal-body { padding:20px; overflow-y:auto; max-height:calc(85vh - 120px); }
  .modal-footer { display:flex; justify-content:flex-end; gap:12px; padding:16px 20px; border-top:1px solid var(--border-default); background:var(--gray-50); }
  .form-row { display:flex; gap:16px; margin-bottom:16px; }
  .form-item { flex:1; }
  .form-item label { display:block; font-size:13px; color:var(--text-secondary); margin-bottom:6px; }
  .form-item input, .form-item select, .form-item textarea { width:100%; padding:8px 12px; border:1px solid var(--border-strong); border-radius:6px; font-size:14px; box-sizing:border-box; font-family:inherit; }
  .form-item textarea { min-height:72px; resize:vertical; }
  .dict-tabs { display:flex; gap:8px; margin-bottom:16px; }
  .dict-tab { padding:8px 18px; border:1px solid var(--border-default); background:var(--bg-card); border-radius:6px; font-size:14px; color:var(--text-secondary); cursor:pointer; }
  .dict-tab.active { background:var(--primary-500); border-color:var(--primary-500); color:#fff; }
  .dict-panel { display:none; }
  .dict-panel.active { display:block; }
  .action-btns { display:flex; gap:6px; flex-wrap:wrap; }
  .action-btn { border:none; background:none; cursor:pointer; font-size:13px; color:var(--primary-500); padding:0; }
  .action-btn.danger { color:var(--error); }
  .tips { font-size:12px; color:var(--text-tertiary); margin-bottom:12px; }
  .input-unit { display:flex; }
  .input-unit input { flex:1; width:auto; border-radius:6px 0 0 6px; }
  .input-unit select { width:78px; flex:none; border-left:none; border-radius:0 6px 6px 0; background:var(--gray-50); padding-left:8px; }
  .wh-upload { border:1px dashed var(--border-strong); border-radius:8px; padding:12px; background:var(--gray-50); }
  .wh-upload-toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  .wh-upload-btn { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:6px; font-size:13px; font-weight:500; color:var(--primary-600); background:var(--primary-50); border:1px solid var(--primary-200); cursor:pointer; }
  .wh-upload-btn:hover { background:var(--primary-100); }
  .wh-upload-btn.is-disabled { opacity:.5; cursor:not-allowed; }
  .wh-upload-btn.is-disabled:hover { background:var(--primary-50); }
  .wh-upload-count { font-size:12px; color:var(--text-secondary); }
  .wh-upload-count b { color:var(--primary-600); font-weight:600; }
  .wh-upload-hint { font-size:12px; color:var(--text-tertiary); margin-left:auto; }
  .wh-upload-list { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .wh-upload-item { position:relative; height:82px; border-radius:8px; overflow:hidden; border:1px solid var(--border-default); background:#fff; }
  .wh-upload-item img { width:100%; height:100%; object-fit:cover; display:block; }
  .wh-upload-remove { position:absolute; top:4px; right:4px; width:20px; height:20px; border:none; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; font-size:15px; line-height:1; cursor:pointer; padding:0; }
  .wh-upload-remove:hover { background:rgba(0,0,0,.8); }
  .wh-upload-slot { height:82px; border:1px dashed var(--border-strong); border-radius:8px; background:#fff; color:var(--text-tertiary); font-size:12px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .wh-upload-slot:hover { border-color:var(--primary-400); color:var(--primary-500); background:var(--primary-50); }
  .wh-upload-slot .plus { font-size:20px; line-height:1; }
</style>

            <div class="data-table-wrapper">

                <thead>

                    <th style="width:60px;">序号</th>
                    <th style="width:120px;">分类编码</th>
                    <th style="width:140px;">分类名称</th>
                    <th style="width:120px;">上级分类</th>
                    <th style="width:90px;">默认单位</th>
                    <th style="width:120px;">默认仓库</th>
                    <th style="width:110px;">默认货位</th>

                    <th style="width:130px;">安全间隔期</th>
                    <th style="width:120px;">资质要求</th>

      <button class="modal-close" onclick="closeWarehouseModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="warehouseForm">

          <div class="form-item">
            <label>仓库编号</label>
            <input type="text" id="warehouseId" placeholder="自动生成" readonly>
          </div>
          <div class="form-item">
            <label>仓库名称 <span style="color:var(--error);">*</span></label>
            <input type="text" id="warehouseName" placeholder="如：中心仓库" required>

        </div>
        <div class="form-row">
          <div class="form-item">
            <label>仓库类型</label>
            <select id="warehouseType">
              <option value="常温库">常温库</option>
              <option value="冷藏库">冷藏库</option>
              <option value="危化品专库">危化品专库</option>
            </select>
          </div>
          <div class="form-item">
            <label>负责人</label>
            <input type="text" id="warehouseManager" placeholder="请输入负责人">
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>负责人电话</label>
            <input type="text" id="warehouseManagerPhone" placeholder="请输入负责人电话">
          </div>
          <div class="form-item">
            <label>容量</label>
            <div class="input-unit">
              <input type="number" id="warehouseCapacity" placeholder="请输入容量" min="0" step="0.01">
              <select id="warehouseCapacityUnit">
                <option value="㎡">㎡</option>
                <option value="m³">m³</option>
                <option value="吨">吨</option>
                <option value="件">件</option>
              </select>
            </div>

        </div>
        <div class="form-row">
          <div class="form-item">
            <label>是否默认仓</label>
            <select id="warehouseIsDefault">

              <option value="true">是</option>

          </div>
          <div class="form-item">
            <label>状态</label>
            <select id="warehouseStatus">

              <option value="disabled">停用</option>

        </div>
        <div class="form-item" style="margin-bottom:16px;">

<script src="js/material-dict.js"></script>
<script>
var warehouseEditingId = '';
var categoryEditingId = '';
var warehouseImages = [];
var WAREHOUSE_IMAGE_MAX = 4;
var WAREHOUSE_IMAGE_MAX_BYTES = 5 * 1024 * 1024;

function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ---------- 容量：数值 + 单位 ---------- */
function parseCapacity(raw) {
  var text = String(raw == null ? '' : raw).trim();
  var match = text.match(/^([0-9]+(?:\.[0-9]+)?)\s*(㎡|m³|吨|件)?$/);
  if (match) return { value: match[1], unit: match[2] || '㎡' };
  return { value: '', unit: '㎡' };
}

/* ---------- 仓库图片上传（最多 4 张） ---------- */
function renderWarehouseImages() {
  var list = document.getElementById('warehouseImageList');
  var btn = document.getElementById('warehouseImageBtn');
  var input = document.getElementById('warehouseImageInput');
  var full = warehouseImages.length >= WAREHOUSE_IMAGE_MAX;
  var html = warehouseImages.map(function (url, index) {
    return '<div class="wh-upload-item">' +
      '<img src="' + escapeHtml(url) + '" alt="仓库图片' + (index + 1) + '">' +
      '<button type="button" class="wh-upload-remove" title="移除" onclick="removeWarehouseImage(' + index + ')">&times;</button>' +
    '</div>';
  }).join('');
  for (var i = warehouseImages.length; i < WAREHOUSE_IMAGE_MAX; i++) {
    html += '<button type="button" class="wh-upload-slot" onclick="pickWarehouseImage()">' +
      '<span class="plus">+</span><span>上传照片</span>' +
    '</button>';
  }
  list.innerHTML = html;
  document.getElementById('warehouseImageNum').textContent = warehouseImages.length;
  btn.classList.toggle('is-disabled', full);
  input.disabled = full;
}

function pickWarehouseImage() {
  if (warehouseImages.length >= WAREHOUSE_IMAGE_MAX) {
    alert('最多上传 ' + WAREHOUSE_IMAGE_MAX + ' 张图片');
    return;
  }
  document.getElementById('warehouseImageInput').click();
}

function removeWarehouseImage(index) {
  warehouseImages.splice(index, 1);
  renderWarehouseImages();
}

function compressWarehouseImage(file, done) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth || img.width;
      var h = img.naturalHeight || img.height;
      var scale = Math.min(1, 1000 / Math.max(w, h));
      var canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(w * scale));
      canvas.height = Math.max(1, Math.round(h * scale));
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      done(canvas.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = function () { done(''); };
    img.src = String(reader.result);
  };
  reader.onerror = function () { done(''); };
  reader.readAsDataURL(file);
}

function handleWarehouseImagePick(event) {
  var files = Array.prototype.slice.call(event.target.files || []);
  if (!files.length) return;
  var remain = WAREHOUSE_IMAGE_MAX - warehouseImages.length;
  if (files.length > remain) {
    alert('最多上传 ' + WAREHOUSE_IMAGE_MAX + ' 张图片，超出部分已忽略');
  }
  files.slice(0, remain).forEach(function (file) {
    if (!/^image\//.test(file.type)) { alert(file.name + ' 不是图片文件，已跳过'); return; }
    if (file.size > WAREHOUSE_IMAGE_MAX_BYTES) { alert(file.name + ' 超过 5MB，已跳过'); return; }
    compressWarehouseImage(file, function (dataUrl) {
      if (!dataUrl) return;
      if (warehouseImages.length >= WAREHOUSE_IMAGE_MAX) return;
      warehouseImages.push(dataUrl);
      renderWarehouseImages();
    });
  });
  event.target.value = '';
}

function switchTab(tab) {
  document.querySelectorAll('.dict-tab').forEach(function (btn) {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  document.querySelectorAll('.dict-panel').forEach(function (panel) {
    panel.classList.toggle('active', panel.id === 'panel-' + tab);
  });
}

function renderWarehouses() {
  var list = MaterialDict.getWarehouses();
  var body = document.getElementById('warehouseBody');
  if (!list.length) {
    body.innerHTML = '<tr><td colspan="11" style="text-align:center;color:var(--text-tertiary);padding:32px;">暂无仓库，请点击「新增仓库」</td></tr>';
    return;
  }
  body.innerHTML = list.map(function (w, index) {
    return '<tr>' +
      '<td>' + (index + 1) + '</td>' +
      '<td><strong>' + escapeHtml(w.id) + '</strong></td>' +
      '<td>' + escapeHtml(w.name) + '</td>' +
      '<td>' + escapeHtml(w.type || '-') + '</td>' +
      '<td>' + escapeHtml(w.manager || '-') + '</td>' +
      '<td>' + escapeHtml(w.managerPhone || '-') + '</td>' +
      '<td>' + escapeHtml(w.capacity || '-') + '</td>' +
      '<td>' + escapeHtml(w.address || '-') + '</td>' +
      '<td>' + (w.isDefault ? '<span class="status-tag active">默认</span>' : '-') + '</td>' +
      '<td><span class="status-tag ' + (w.status === 'disabled' ? 'inactive' : 'active') + '">' + (w.status === 'disabled' ? '停用' : '启用') + '</span></td>' +
      '<td><div class="action-btns">' +
        '<button class="action-btn" onclick="openWarehouseModal(\'' + w.id + '\')">编辑</button>' +
        '<button class="action-btn danger" onclick="deleteWarehouse(\'' + w.id + '\')">删除</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

function renderCategories() {
  var list = MaterialDict.getCategories();
  var body = document.getElementById('categoryBody');
  if (!list.length) {
    body.innerHTML = '<tr><td colspan="12" style="text-align:center;color:var(--text-tertiary);padding:32px;">暂无分类，请点击「新增分类」</td></tr>';
    return;
  }
  var nameMap = {};
  list.forEach(function (c) { nameMap[c.id] = c.name; });
  body.innerHTML = list.map(function (c, index) {
    var parentName = c.parentId ? (nameMap[c.parentId] || '-') : '-';
    return '<tr>' +
      '<td>' + (index + 1) + '</td>' +
      '<td><strong>' + escapeHtml(c.id) + '</strong></td>' +
      '<td>' + escapeHtml(c.name) + '</td>' +
      '<td>' + escapeHtml(parentName) + '</td>' +
      '<td>' + escapeHtml(c.defaultUnit || '-') + '</td>' +
      '<td>' + escapeHtml(c.defaultWarehouse || '-') + '</td>' +
      '<td>' + escapeHtml(c.defaultLocation || '-') + '</td>' +
      '<td>' + (c.dangerous ? '<span class="status-tag danger">危险品</span>' : '否') + '</td>' +
      '<td>' + (c.safetyInterval ? escapeHtml(c.safetyInterval) + ' 天' : '不限制') + '</td>' +
      '<td>' + (c.licenseRequired ? '<span class="status-tag pending">需资质</span>' : '无') + '</td>' +
      '<td><span class="status-tag ' + (c.status === 'disabled' ? 'inactive' : 'active') + '">' + (c.status === 'disabled' ? '停用' : '启用') + '</span></td>' +
      '<td><div class="action-btns">' +
        '<button class="action-btn" onclick="openCategoryModal(\'' + c.id + '\')">编辑</button>' +
        '<button class="action-btn danger" onclick="deleteCategory(\'' + c.id + '\')">删除</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

function openWarehouseModal(id) {
  warehouseEditingId = id || '';
  var form = document.getElementById('warehouseForm');
  form.reset();
  var data = null;
  if (id) {
    data = MaterialDict.getWarehouses().filter(function (w) { return w.id === id; })[0];
  }
  document.getElementById('warehouseTitle').textContent = id ? '编辑仓库' : '新增仓库';
  document.getElementById('warehouseId').value = data ? data.id : '自动生成';
  document.getElementById('warehouseName').value = data ? data.name : '';
  document.getElementById('warehouseType').value = (data && data.type) || '常温库';
  document.getElementById('warehouseManager').value = data ? (data.manager || '') : '';
  document.getElementById('warehouseManagerPhone').value = data ? (data.managerPhone || '') : '';
  var capacity = parseCapacity(data ? data.capacity : '');
  document.getElementById('warehouseCapacity').value = capacity.value;
  document.getElementById('warehouseCapacityUnit').value = capacity.unit;
  document.getElementById('warehouseIsDefault').value = data && data.isDefault ? 'true' : 'false';
  document.getElementById('warehouseAddress').value = data ? (data.address || '') : '';
  document.getElementById('warehouseStatus').value = data ? data.status : 'enabled';
  document.getElementById('warehouseRemark').value = data ? (data.remark || '') : '';
  warehouseImages = data && Array.isArray(data.images) ? data.images.slice(0, WAREHOUSE_IMAGE_MAX) : [];
  renderWarehouseImages();
  document.getElementById('warehouseModal').classList.add('show');
}

function closeWarehouseModal() {
  document.getElementById('warehouseModal').classList.remove('show');
}

function saveWarehouse() {
  var name = document.getElementById('warehouseName').value.trim();
  if (!name) { alert('请填写仓库名称'); return; }
  var list = MaterialDict.getWarehouses();
  if (list.some(function (w) { return w.name === name && w.id !== warehouseEditingId; })) {
    alert('仓库名称已存在'); return;
  }
  var capacityValue = document.getElementById('warehouseCapacity').value.trim();
  var capacityUnit = document.getElementById('warehouseCapacityUnit').value;
  var payload = {
    name: name,
    type: document.getElementById('warehouseType').value,
    manager: document.getElementById('warehouseManager').value.trim(),
    managerPhone: document.getElementById('warehouseManagerPhone').value.trim(),
    capacity: capacityValue ? capacityValue + ' ' + capacityUnit : '',
    images: warehouseImages.slice(),
    isDefault: document.getElementById('warehouseIsDefault').value === 'true',
    address: document.getElementById('warehouseAddress').value.trim(),
    status: document.getElementById('warehouseStatus').value,
    remark: document.getElementById('warehouseRemark').value.trim()
  };
  if (warehouseEditingId) {
    list = list.map(function (w) {
      return w.id === warehouseEditingId ? Object.assign({}, w, payload) : w;
    });
  } else {
    var seq = 0;
    list.forEach(function (w) {
      var n = parseInt(String(w.id).replace(/\D/g, ''), 10);
      if (!isNaN(n) && n > seq) seq = n;
    });
    payload.id = 'wh' + (seq + 1);
    list.push(payload);
  }
  if (payload.isDefault) {
    var keepId = warehouseEditingId || payload.id;
    list = list.map(function (w) {
      return w.id === keepId ? w : Object.assign({}, w, { isDefault: false });
    });
  }
  MaterialDict.setWarehouses(list);
  closeWarehouseModal();
  renderWarehouses();
}

function deleteWarehouse(id) {
  var list = MaterialDict.getWarehouses();
  if (list.length <= 1) { alert('至少保留一个仓库'); return; }
  if (!confirm('确定删除该仓库吗？')) return;
  MaterialDict.setWarehouses(list.filter(function (w) { return w.id !== id; }));
  renderWarehouses();
}

function openCategoryModal(id) {
  categoryEditingId = id || '';
  var form = document.getElementById('categoryForm');
  form.reset();
  var all = MaterialDict.getCategories();
  var data = null;
  if (id) {
    data = all.filter(function (c) { return c.id === id; })[0];
  }
  MaterialDict.fillSelect('categoryParent', all.filter(function (c) {
    return c.id !== id;
  }).map(function (c) {
    return { value: c.id, label: c.name };
  }), '无（顶级分类）');
  MaterialDict.fillSelect('categoryWarehouse', MaterialDict.warehouseNames(), '不指定');
  document.getElementById('categoryTitle').textContent = id ? '编辑分类' : '新增分类';
  document.getElementById('categoryId').value = data ? data.id : '';
  document.getElementById('categoryId').readOnly = !!data;
  document.getElementById('categoryName').value = data ? data.name : '';
  document.getElementById('categoryParent').value = data ? (data.parentId || '') : '';
  document.getElementById('categoryWarehouse').value = data ? (data.defaultWarehouse || '') : '';
  document.getElementById('categoryLocation').value = data ? (data.defaultLocation || '') : '';
  document.getElementById('categoryDangerous').value = data && data.dangerous ? 'true' : 'false';
  document.getElementById('categoryUnit').value = data ? (data.defaultUnit || '') : '';
  document.getElementById('categoryInterval').value = data ? (data.safetyInterval || '') : '';
  document.getElementById('categoryLicense').value = data && data.licenseRequired ? 'true' : 'false';
  document.getElementById('categoryStatus').value = data ? data.status : 'enabled';
  document.getElementById('categoryRemark').value = data ? (data.remark || '') : '';
  document.getElementById('categoryModal').classList.add('show');
}

function closeCategoryModal() {
  document.getElementById('categoryModal').classList.remove('show');
}

function saveCategory() {
  var id = document.getElementById('categoryId').value.trim();
  var name = document.getElementById('categoryName').value.trim();
  if (!id || !name) { alert('分类编码与名称必填'); return; }
  var list = MaterialDict.getCategories();
  if (list.some(function (c) { return (c.id === id || c.name === name) && c.id !== categoryEditingId; })) {
    alert('分类编码或名称已存在'); return;
  }
  var payload = {
    id: id,
    name: name,
    parentId: document.getElementById('categoryParent').value,
    defaultUnit: document.getElementById('categoryUnit').value.trim(),
    defaultWarehouse: document.getElementById('categoryWarehouse').value,
    defaultLocation: document.getElementById('categoryLocation').value.trim(),
    dangerous: document.getElementById('categoryDangerous').value === 'true',
    safetyInterval: document.getElementById('categoryInterval').value.trim(),
    licenseRequired: document.getElementById('categoryLicense').value === 'true',
    status: document.getElementById('categoryStatus').value,
    remark: document.getElementById('categoryRemark').value.trim()
  };
  if (categoryEditingId) {
    list = list.map(function (c) {
      return c.id === categoryEditingId ? payload : c;
    });
  } else {
    list.push(payload);
  }
  MaterialDict.setCategories(list);
  closeCategoryModal();
  renderCategories();
}

function deleteCategory(id) {
  var list = MaterialDict.getCategories();
  if (list.length <= 1) { alert('至少保留一个分类'); return; }
  if (!confirm('确定删除该分类吗？已建档农资不受影响。')) return;
  MaterialDict.setCategories(list.filter(function (c) { return c.id !== id; }));
  renderCategories();
}

function resetDict() {
  if (!confirm('将恢复默认的仓库与分类字典，已修改内容会丢失，是否继续？')) return;
  MaterialDict.reset();
  renderWarehouses();
  renderCategories();
}

document.getElementById('warehouseImageInput').addEventListener('change', handleWarehouseImagePick);

renderWarehouses();
renderCategories();
</script>
</body>
