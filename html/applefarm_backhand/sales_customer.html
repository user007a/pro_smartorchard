<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 客户管理</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
<link rel="stylesheet" href="css/sales-module.css">
<style id="standalone-fix">.main-wrapper{margin-left:0!important;width:100%!important;}</style>
</head>
<body data-active-menu="sales" data-active-submenu="sales-customer">
<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3L11 11M11 3L3 11"/></svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <div class="content-wrapper">
        <div class="page-header">
          <h1 class="page-title">客户管理</h1>
        </div>

        <div class="sales-stats" id="customerStats"></div>

        <div class="page-section search-section">
          <div class="search-bar filter-bar">
            <input type="text" class="search-input" id="cKeyword" placeholder="搜索客户名称 / 联系人 / 电话">
            <select class="search-select" id="cType">
              <option value="all">全部类型</option>
              <option value="wholesale">批发客户</option>
              <option value="retail">零售客户</option>
              <option value="adoption">认养用户</option>
            </select>
            <select class="search-select" id="cLevel">
              <option value="all">全部等级</option>
              <option value="vip">VIP客户</option>
              <option value="gold">黄金客户</option>
              <option value="silver">白银客户</option>
            </select>
            <select class="search-select" id="cStatus">
              <option value="all">全部状态</option>
              <option value="active">合作中</option>
              <option value="inactive">已停用</option>
            </select>
            <select class="search-select" id="cRegion">
              <option value="all">全部区域</option>
            </select>
            <select class="search-select" id="cOwner">
              <option value="all">全部业务员</option>
            </select>
            <div class="search-actions">
              <button class="jg-btn jg-btn-primary" onclick="applyFilter()">查询</button>
              <button class="jg-btn" onclick="resetFilter()">重置</button>
            </div>
          </div>
        </div>

        <div class="page-section action-bar">
          <div class="action-left">
            <button class="jg-btn jg-btn-primary" onclick="openAdd()">+ 新建客户</button>
            <button class="jg-btn" onclick="document.getElementById('importFile').click()">批量导入</button>
            <button class="jg-btn" onclick="downloadTemplate()">下载模板</button>
            <button class="jg-btn" onclick="exportCustomers()">导出 CSV</button>
          </div>
          <div class="action-right" style="margin-left:auto;">
            <span class="selected-info" id="customerCountInfo"></span>
          </div>
        </div>

        <div class="page-section data-section">
          <div class="data-table-wrapper">
            <table class="data-table" style="min-width:2200px;">
              <thead>
                <tr>
                  <th style="width:52px;">序号</th>
                  <th style="width:84px;">客户编号</th>
                  <th style="width:160px;">客户名称</th>
                  <th style="width:90px;">客户类型</th>
                  <th style="width:90px;">客户等级</th>
                  <th style="width:84px;">状态</th>
                  <th style="width:76px;">区域</th>
                  <th style="width:90px;">联系人</th>
                  <th style="width:118px;">联系电话</th>
                  <th style="width:110px;">客户来源</th>
                  <th style="width:82px;">业务员</th>
                  <th style="width:70px;" class="text-right">订单数</th>
                  <th style="width:110px;" class="text-right">成交额</th>
                  <th style="width:110px;" class="text-right">回款额</th>
                  <th style="width:110px;" class="text-right">应收余额</th>
                  <th style="width:90px;" class="text-right">账龄</th>
                  <th style="width:120px;">最近下单</th>
                  <th style="width:190px;">操作</th>
                </tr>
              </thead>
              <tbody id="customerTableBody"></tbody>
            </table>
          </div>
          <div id="pagination-container" style="display:flex;justify-content:flex-end;margin-top:14px;"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<input type="file" id="importFile" accept=".csv" style="display:none;" onchange="importCustomers(this)">

<!-- 客户详情 -->
<div class="modal-overlay" id="viewModal" style="display:none;">
  <div class="modal modal-xl">
    <div class="modal-header">
      <h3 class="modal-title">客户 360 视图</h3>
      <button class="modal-close" onclick="closeModal('viewModal')">×</button>
    </div>
    <div class="modal-body" id="viewBody"></div>
    <div class="modal-footer" id="viewFooter"></div>
  </div>
</div>

<!-- 新增 / 编辑客户 -->
<div class="modal-overlay" id="editModal" style="display:none;">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 class="modal-title" id="editTitle">新建客户</h3>
      <button class="modal-close" onclick="closeModal('editModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="detail-section">
        <div class="detail-section-title">基础信息</div>
        <div class="form-grid-3">
          <div class="form-group">
            <label><span class="required"></span>客户名称</label>
            <input type="text" id="eName" placeholder="企业全称或个人姓名">
          </div>
          <div class="form-group">
            <label><span class="required"></span>客户类型</label>
            <select id="eType">
              <option value="wholesale">批发客户</option>
              <option value="retail">零售客户</option>
              <option value="adoption">认养用户</option>
            </select>
          </div>
          <div class="form-group">
            <label>客户等级</label>
            <select id="eLevel">
              <option value="vip">VIP客户</option>
              <option value="gold">黄金客户</option>
              <option value="silver">白银客户</option>
            </select>
          </div>
          <div class="form-group">
            <label>合作状态</label>
            <select id="eStatus">
              <option value="active">合作中</option>
              <option value="inactive">已停用</option>
            </select>
          </div>
          <div class="form-group">
            <label>所属区域</label>
            <input type="text" id="eRegion" placeholder="省 / 市">
          </div>
          <div class="form-group">
            <label>客户来源</label>
            <input type="text" id="eSource" list="sourceOptions" placeholder="商超直供 / 电商平台 / 认养平台">
            <datalist id="sourceOptions">
              <option value="商超直供"><option value="电商平台"><option value="批发市场">
              <option value="门店零售"><option value="认养平台"><option value="企业团购">
            </datalist>
          </div>
          <div class="form-group">
            <label>归属业务员</label>
            <input type="text" id="eOwner" list="ownerOptions" placeholder="选择或输入业务员">
            <datalist id="ownerOptions"></datalist>
          </div>
          <div class="form-group">
            <label>客户标签</label>
            <input type="text" id="eTags" placeholder="多个标签用逗号分隔">
          </div>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">联系方式</div>
        <div class="form-grid-3">
          <div class="form-group">
            <label>联系人</label>
            <input type="text" id="eContact">
          </div>
          <div class="form-group">
            <label>联系电话</label>
            <input type="text" id="ePhone" placeholder="11 位手机号">
          </div>
          <div class="form-group">
            <label>微信</label>
            <input type="text" id="eWechat">
          </div>
          <div class="form-group">
            <label>邮箱</label>
            <input type="text" id="eEmail">
          </div>
          <div class="form-group full">
            <label>详细地址</label>
            <input type="text" id="eAddress">
          </div>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">信用与开票</div>
        <div class="form-grid-3">
          <div class="form-group">
            <label>信用额度（元）</label>
            <input type="number" id="eCreditLimit" min="0" step="1000" value="0">
          </div>
          <div class="form-group">
            <label>账期（天）</label>
            <input type="number" id="eCreditDays" min="0" step="1" value="0">
          </div>
          <div class="form-group">
            <label>发票抬头</label>
            <input type="text" id="eInvoiceTitle">
          </div>
          <div class="form-group">
            <label>税号</label>
            <input type="text" id="eTaxNo">
          </div>
          <div class="form-group full">
            <label>开户行及账号</label>
            <input type="text" id="eBankInfo">
          </div>
          <div class="form-group full">
            <label>备注</label>
            <textarea id="eRemark" placeholder="合作约定、注意事项等"></textarea>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('editModal')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="submitCustomer()">保存客户</button>
    </div>
  </div>
</div>

<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/common-functions.js"></script>
<script src="js/search-helper.js"></script>
<script src="js/typography.js"></script>
<script src="js/shared/sales-store.js"></script>
<script>
var PAGE_SIZE = 10;
var filtered = [];
var editingId = null;
var viewCustomerId = null;

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
function toast(msg, type) {
  if (window.LegacyToast) LegacyToast.show(msg, type || 'success'); else alert(msg);
}
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function typeText(t) { return SalesStore.CUSTOMER_TYPE_TEXT[t] || t; }
function levelText(l) { return SalesStore.LEVEL_TEXT[l] || l; }
function statusText(s) { return s === 'active' ? '合作中' : '已停用'; }
function statusClass(s) { return s === 'active' ? 'st-active' : 'st-inactive'; }

/* ---------------- 筛选与统计 ---------------- */
function getFilters() {
  return {
    keyword: val('cKeyword').trim().toLowerCase(),
    type: val('cType') || 'all',
    level: val('cLevel') || 'all',
    status: val('cStatus') || 'all',
    region: val('cRegion') || 'all',
    owner: val('cOwner') || 'all'
  };
}

function filterCustomers() {
  var f = getFilters();
  return SalesStore.customers().filter(function (c) {
    if (f.type !== 'all' && c.type !== f.type) return false;
    if (f.level !== 'all' && c.level !== f.level) return false;
    if (f.status !== 'all' && c.status !== f.status) return false;
    if (f.region !== 'all' && c.region !== f.region) return false;
    if (f.owner !== 'all' && c.owner !== f.owner) return false;
    if (f.keyword) {
      var hay = (c.code + ' ' + c.name + ' ' + c.contact + ' ' + c.phone + ' ' + c.address).toLowerCase();
      if (hay.indexOf(f.keyword) === -1) return false;
    }
    return true;
  });
}

function applyFilter() { refreshAll(); }
function resetFilter() {
  document.getElementById('cKeyword').value = '';
  ['cType', 'cLevel', 'cStatus', 'cRegion', 'cOwner'].forEach(function (id) { document.getElementById(id).value = 'all'; });
  refreshAll();
}

function aggregate() {
  var list = SalesStore.customers();
  var active = 0;
  var amount = 0;
  var paid = 0;
  var balance = 0;
  var days = 0;
  var daysCount = 0;
  list.forEach(function (c) {
    if (c.status === 'active') active++;
    var st = SalesStore.customerStats(c.id);
    amount += st.amount;
    paid += st.paid;
    balance += st.balance;
    var unpaid = st.orders.filter(function (o) { return Number(o.payableAmount) - Number(o.paidAmount) > 0.01; });
    if (unpaid.length) {
      var oldest = unpaid[unpaid.length - 1];
      var d = new Date((oldest.createdAt || '').replace(' ', 'T'));
      if (!isNaN(d.getTime())) {
        days += Math.max(0, Math.floor((new Date() - d) / 86400000));
        daysCount++;
      }
    }
  });
  return {
    total: list.length,
    active: active,
    amount: amount,
    paid: paid,
    balance: balance,
    avgDays: daysCount ? Math.round(days / daysCount) : 0
  };
}

function renderStats() {
  var a = aggregate();
  var cards = [
    { label: '客户总数', value: String(a.total), sub: '覆盖 ' + newSet(SalesStore.customers().map(function (c) { return c.region; })).length + ' 个区域', cls: '' },
    { label: '活跃客户', value: String(a.active), sub: '合作中占比 ' + (a.total ? Math.round(a.active / a.total * 100) : 0) + '%', cls: 'is-success' },
    { label: '累计成交额', value: SalesStore.fmtWan(a.amount), sub: '全部销售订单合计', cls: '' },
    { label: '累计回款', value: SalesStore.fmtWan(a.paid), sub: '回款率 ' + (a.amount ? Math.round(a.paid / a.amount * 100) : 0) + '%', cls: 'is-success' },
    { label: '应收余额', value: SalesStore.fmtWan(a.balance), sub: '未收金额合计', cls: 'is-danger' },
    { label: '平均账龄', value: a.avgDays + ' 天', sub: '存在应收的客户平均', cls: a.avgDays > 60 ? 'is-warning' : '' }
  ];
  document.getElementById('customerStats').innerHTML = cards.map(function (c) {
    return '<div class="sales-stat-card ' + c.cls + '"><div class="stat-label">' + c.label + '</div><div class="stat-value">' + c.value + '</div><div class="stat-sub">' + c.sub + '</div></div>';
  }).join('');
}

function newSet(arr) {
  var s = {}; arr.forEach(function (v) { if (v) s[v] = true; }); return Object.keys(s);
}

/* ---------------- 表格 ---------------- */
function agingOf(c) {
  var st = SalesStore.customerStats(c.id);
  var unpaid = st.orders.filter(function (o) { return Number(o.payableAmount) - Number(o.paidAmount) > 0.01; });
  if (!unpaid.length) return '—';
  var oldest = unpaid[unpaid.length - 1];
  var d = new Date((oldest.createdAt || '').replace(' ', 'T'));
  if (isNaN(d.getTime())) return '—';
  var days = Math.max(0, Math.floor((new Date() - d) / 86400000));
  var cls = days > 90 ? 'text-danger' : (days > 60 ? 'text-warning' : '');
  return '<span class="' + cls + '">' + days + ' 天</span>';
}

function renderRow(c, index) {
  var st = SalesStore.customerStats(c.id);
  return '<tr>' +
    '<td>' + (index + 1) + '</td>' +
    '<td><strong>' + esc(c.code) + '</strong></td>' +
    '<td>' + esc(c.name) + '<div class="muted">' + esc(c.tags && c.tags.length ? c.tags.join(' · ') : '') + '</div></td>' +
    '<td>' + typeText(c.type) + '</td>' +
    '<td><span class="level-badge ' + esc(c.level) + '">' + levelText(c.level) + '</span></td>' +
    '<td><span class="status-tag ' + statusClass(c.status) + '">' + statusText(c.status) + '</span></td>' +
    '<td>' + esc(c.region || '—') + '</td>' +
    '<td>' + esc(c.contact || '—') + '</td>' +
    '<td>' + esc(c.phone || '—') + '</td>' +
    '<td>' + esc(c.source || '—') + '</td>' +
    '<td>' + esc(c.owner || '—') + '</td>' +
    '<td class="num">' + st.orderCount + '</td>' +
    '<td class="num money">' + SalesStore.fmtWan(st.amount) + '</td>' +
    '<td class="num money text-success">' + SalesStore.fmtWan(st.paid) + '</td>' +
    '<td class="num money ' + (st.balance > 0 ? 'text-danger' : '') + '">' + SalesStore.fmtWan(st.balance) + '</td>' +
    '<td class="num">' + agingOf(c) + '</td>' +
    '<td class="muted">' + (st.lastOrderAt ? SalesStore.fmtDate(st.lastOrderAt) : '—') + '</td>' +
    '<td><div class="action-btns">' +
    '<button class="action-btn view" onclick="viewCustomer(\'' + c.id + '\')">查看</button>' +
    '<button class="action-btn edit" onclick="openEdit(\'' + c.id + '\')">编辑</button>' +
    '<button class="action-btn" onclick="toggleStatus(\'' + c.id + '\')">' + (c.status === 'active' ? '停用' : '启用') + '</button>' +
    '<button class="action-btn delete" onclick="removeCustomer(\'' + c.id + '\')">删除</button>' +
    '</div></td></tr>';
}

function refreshTable() {
  filtered = filterCustomers();
  Pagination.init({
    data: filtered,
    pageSize: PAGE_SIZE,
    containerId: 'pagination-container',
    tbodyId: 'customerTableBody',
    renderRow: renderRow
  });
  document.getElementById('customerCountInfo').textContent = '共 ' + filtered.length + ' 户客户';
}

function refreshAll() {
  renderStats();
  refreshTable();
  populateRegionOptions();
  populateOwnerOptions();
}

/* ---------------- 客户 360 ---------------- */
function viewCustomer(id) {
  var c = SalesStore.customer(id);
  if (!c) return toast('客户不存在', 'danger');
  viewCustomerId = id;
  var st = SalesStore.customerStats(id);
  var pays = SalesStore.payments().filter(function (p) { return p.customerId === id; });
  var asList = SalesStore.afterSales().filter(function (a) { return a.customerId === id; });

  var html = '<div class="detail-section"><div class="detail-section-title">客户档案</div><div class="detail-grid cols-3">' +
    item('客户编号', c.code) + item('客户名称', c.name) + item('客户类型', typeText(c.type)) +
    item('客户等级', levelText(c.level)) + item('合作状态', statusText(c.status)) + item('所属区域', c.region) +
    item('联系人', c.contact) + item('联系电话', c.phone) + item('微信', c.wechat) +
    item('邮箱', c.email) + item('客户来源', c.source) + item('归属业务员', c.owner) +
    item('信用额度', SalesStore.fmtMoney(c.creditLimit)) + item('账期', (c.creditDays || 0) + ' 天') + item('发票抬头', c.invoiceTitle) +
    item('税号', c.taxNo) + item('开户行及账号', c.bankInfo) + item('客户标签', c.tags && c.tags.length ? c.tags.join('、') : '—') +
    '<div class="detail-item full"><span class="detail-label">详细地址</span><span class="detail-value">' + esc(c.address || '—') + '</span></div>' +
    '<div class="detail-item full"><span class="detail-label">备注</span><span class="detail-value">' + esc(c.remark || '—') + '</span></div>' +
    '</div></div>';

  html += '<div class="detail-section"><div class="detail-section-title">经营概况</div><div class="detail-grid cols-3">' +
    item('累计成交额', SalesStore.fmtWan(st.amount)) + item('累计回款', SalesStore.fmtWan(st.paid)) + item('应收余额', SalesStore.fmtWan(st.balance)) +
    item('订单数', st.orderCount + ' 笔') + item('客单价', SalesStore.fmtMoney(st.avgOrder)) + item('最近下单', st.lastOrderAt ? SalesStore.fmtTime(st.lastOrderAt) : '—') +
    '</div></div>';

  html += '<div class="detail-section"><div class="detail-section-title">最近订单</div>';
  if (st.orders.length) {
    html += '<table class="detail-table"><thead><tr><th>订单编号</th><th>渠道</th><th class="num">金额</th><th class="num">已收</th><th>状态</th><th>下单时间</th></tr></thead><tbody>' +
      st.orders.slice(0, 10).map(function (o) {
        return '<tr><td>' + esc(o.no) + '</td><td>' + (SalesStore.TYPE_TEXT[o.type] || o.type) + '</td><td class="num">' + SalesStore.fmtMoney(o.payableAmount) + '</td><td class="num">' + SalesStore.fmtMoney(o.paidAmount) + '</td><td>' + (SalesStore.ORDER_STATUS_TEXT[o.status] || o.status) + '</td><td>' + SalesStore.fmtTime(o.createdAt) + '</td></tr>';
      }).join('') + '</tbody></table>';
  } else {
    html += '<div class="empty-state">该客户暂无销售订单</div>';
  }
  html += '</div>';

  html += '<div class="detail-section"><div class="detail-section-title">收款记录</div>';
  if (pays.length) {
    html += '<table class="detail-table"><thead><tr><th>收款单号</th><th>关联订单</th><th class="num">金额</th><th>方式</th><th>收款时间</th></tr></thead><tbody>' +
      pays.slice(0, 10).map(function (p) {
        return '<tr><td>' + esc(p.id) + '</td><td>' + esc(p.orderNo || '—') + '</td><td class="num ' + (p.type === 'refund' ? 'text-danger' : 'text-success') + '">' + SalesStore.fmtMoney(p.amount) + '</td><td>' + (SalesStore.PAY_METHOD_TEXT[p.method] || p.method) + '</td><td>' + SalesStore.fmtTime(p.paidAt) + '</td></tr>';
      }).join('') + '</tbody></table>';
  } else {
    html += '<div class="empty-state">暂无收款记录</div>';
  }
  html += '</div>';

  html += '<div class="detail-section"><div class="detail-section-title">售后记录</div>';
  if (asList.length) {
    html += '<table class="detail-table"><thead><tr><th>售后单号</th><th>类型</th><th>原因</th><th class="num">金额</th><th>状态</th></tr></thead><tbody>' +
      asList.map(function (a) {
        return '<tr><td>' + esc(a.no) + '</td><td>' + (SalesStore.AS_TYPE_TEXT[a.type] || a.type) + '</td><td>' + esc(a.reason) + '</td><td class="num">' + SalesStore.fmtMoney(a.amount) + '</td><td>' + (SalesStore.AS_STATUS_TEXT[a.status] || a.status) + '</td></tr>';
      }).join('') + '</tbody></table>';
  } else {
    html += '<div class="empty-state">暂无售后记录</div>';
  }
  html += '</div>';

  document.getElementById('viewBody').innerHTML = html;
  document.getElementById('viewFooter').innerHTML =
    '<button class="jg-btn" onclick="openEdit(\'' + c.id + '\')">编辑客户</button>' +
    '<button class="jg-btn" onclick="closeModal(\'viewModal\')">关闭</button>';
  openModal('viewModal');
}

function item(label, value) {
  return '<div class="detail-item"><span class="detail-label">' + label + '</span><span class="detail-value">' + esc(value == null || value === '' ? '—' : value) + '</span></div>';
}

/* ---------------- 新增 / 编辑 ---------------- */
function clearForm() {
  ['eName', 'eRegion', 'eSource', 'eOwner', 'eTags', 'eContact', 'ePhone', 'eWechat', 'eEmail', 'eAddress', 'eInvoiceTitle', 'eTaxNo', 'eBankInfo', 'eRemark'].forEach(function (id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('eType').value = 'wholesale';
  document.getElementById('eLevel').value = 'gold';
  document.getElementById('eStatus').value = 'active';
  document.getElementById('eCreditLimit').value = '0';
  document.getElementById('eCreditDays').value = '0';
}

function openAdd() {
  editingId = null;
  document.getElementById('editTitle').textContent = '新建客户';
  clearForm();
  openModal('editModal');
}

function openEdit(id) {
  var c = SalesStore.customer(id);
  if (!c) return toast('客户不存在', 'danger');
  editingId = id;
  closeModal('viewModal');
  document.getElementById('editTitle').textContent = '编辑客户 · ' + c.code;
  document.getElementById('eName').value = c.name || '';
  document.getElementById('eType').value = c.type || 'retail';
  document.getElementById('eLevel').value = c.level || 'silver';
  document.getElementById('eStatus').value = c.status || 'active';
  document.getElementById('eRegion').value = c.region || '';
  document.getElementById('eSource').value = c.source || '';
  document.getElementById('eOwner').value = c.owner || '';
  document.getElementById('eTags').value = (c.tags || []).join('，');
  document.getElementById('eContact').value = c.contact || '';
  document.getElementById('ePhone').value = c.phone || '';
  document.getElementById('eWechat').value = c.wechat || '';
  document.getElementById('eEmail').value = c.email || '';
  document.getElementById('eAddress').value = c.address || '';
  document.getElementById('eCreditLimit').value = c.creditLimit || 0;
  document.getElementById('eCreditDays').value = c.creditDays || 0;
  document.getElementById('eInvoiceTitle').value = c.invoiceTitle || '';
  document.getElementById('eTaxNo').value = c.taxNo || '';
  document.getElementById('eBankInfo').value = c.bankInfo || '';
  document.getElementById('eRemark').value = c.remark || '';
  openModal('editModal');
}

function submitCustomer() {
  var payload = {
    id: editingId || undefined,
    name: val('eName'),
    type: val('eType'),
    level: val('eLevel'),
    status: val('eStatus'),
    region: val('eRegion'),
    source: val('eSource'),
    owner: val('eOwner'),
    tags: val('eTags'),
    contact: val('eContact'),
    phone: val('ePhone'),
    wechat: val('eWechat'),
    email: val('eEmail'),
    address: val('eAddress'),
    creditLimit: val('eCreditLimit'),
    creditDays: val('eCreditDays'),
    invoiceTitle: val('eInvoiceTitle'),
    taxNo: val('eTaxNo'),
    bankInfo: val('eBankInfo'),
    remark: val('eRemark')
  };
  var res = SalesStore.saveCustomer(payload);
  if (!res.ok) return toast(res.message, 'danger');
  closeModal('editModal');
  toast(editingId ? '客户资料已更新' : '客户已创建');
  editingId = null;
  refreshAll();
}

function toggleStatus(id) {
  var c = SalesStore.customer(id);
  if (!c) return;
  var res = SalesStore.setCustomerStatus(id, c.status === 'active' ? 'inactive' : 'active');
  if (!res.ok) return toast(res.message, 'danger');
  toast(c.status === 'active' ? '客户已停用' : '客户已启用');
  refreshAll();
}

function removeCustomer(id) {
  if (!confirm('确定删除该客户？已有订单或对账单的客户不可删除。')) return;
  var res = SalesStore.removeCustomer(id);
  if (!res.ok) return toast(res.message, 'danger');
  toast('客户已删除');
  refreshAll();
}

/* ---------------- 导入导出 ---------------- */
function csvCell(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }

function downloadTemplate() {
  var headers = ['客户名称', '联系人', '联系电话', '客户类型(批发/零售/认养)', '客户等级(vip/gold/silver)', '所属区域', '详细地址', '客户来源', '归属业务员'];
  var rows = [['', '', '', '', '', '', '', '', '']];
  SalesStore.downloadCsv('客户导入模板.csv', headers, rows);
  toast('客户导入模板已下载');
}

function importCustomers(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function (e) {
    var text = String(e.target.result || '').replace(/^\ufeff/, '');
    var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
    if (lines.length <= 1) { toast('文件没有可导入的数据', 'warning'); input.value = ''; return; }
    var ok = 0;
    var fail = 0;
    var firstError = '';
    for (var i = 1; i < lines.length; i++) {
      var cols = parseCsvLine(lines[i]);
      var res = SalesStore.saveCustomer({
        name: cols[0], contact: cols[1], phone: cols[2],
        type: mapType(cols[3]), level: cols[4] || 'silver',
        region: cols[5], address: cols[6], source: cols[7], owner: cols[8]
      });
      if (res.ok) ok++;
      else { fail++; if (!firstError) firstError = cols[0] + '：' + res.message; }
    }
    toast('导入完成：成功 ' + ok + ' 条，失败 ' + fail + ' 条' + (firstError ? '；' + firstError : ''), fail ? 'warning' : 'success');
    input.value = '';
    refreshAll();
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCsvLine(line) {
  var out = [];
  var cur = '';
  var quoted = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (ch === '"') {
      if (quoted && line[i + 1] === '"') { cur += '"'; i++; }
      else quoted = !quoted;
    } else if (ch === ',' && !quoted) {
      out.push(cur.trim()); cur = '';
    } else cur += ch;
  }
  out.push(cur.trim());
  return out;
}

function mapType(v) {
  if (v === '批发' || v === 'wholesale') return 'wholesale';
  if (v === '认养' || v === 'adoption') return 'adoption';
  if (v === '零售' || v === 'retail') return 'retail';
  return 'retail';
}

function exportCustomers() {
  var rows = filtered.length ? filtered : filterCustomers();
  if (!rows.length) return toast('当前筛选结果为空，无法导出', 'warning');
  var headers = ['客户编号', '客户名称', '客户类型', '客户等级', '状态', '区域', '联系人', '联系电话', '微信', '邮箱', '地址', '客户来源', '业务员', '信用额度', '账期', '发票抬头', '税号', '累计成交', '累计回款', '应收余额', '订单数', '最近下单', '创建时间'];
  var data = rows.map(function (c) {
    var st = SalesStore.customerStats(c.id);
    return [c.code, c.name, typeText(c.type), levelText(c.level), statusText(c.status), c.region, c.contact, c.phone, c.wechat, c.email, c.address, c.source, c.owner, c.creditLimit, c.creditDays, c.invoiceTitle, c.taxNo, st.amount, st.paid, st.balance, st.orderCount, st.lastOrderAt ? SalesStore.fmtDate(st.lastOrderAt) : '', c.createdAt];
  });
  SalesStore.downloadCsv('客户档案_' + new Date().toISOString().slice(0, 10) + '.csv', headers, data);
  toast('已导出 ' + rows.length + ' 户客户');
}

/* ---------------- 初始化 ---------------- */
function populateRegionOptions() {
  var regions = newSet(SalesStore.customers().map(function (c) { return c.region; })).sort();
  var sel = document.getElementById('cRegion');
  var cur = sel.value;
  sel.innerHTML = '<option value="all">全部区域</option>' + regions.map(function (r) {
    return '<option value="' + esc(r) + '">' + esc(r) + '</option>';
  }).join('');
  if (cur && regions.indexOf(cur) >= 0) sel.value = cur;
}

function populateOwnerOptions() {
  var owners = newSet(SalesStore.customers().map(function (c) { return c.owner; })).sort();
  var sel = document.getElementById('cOwner');
  var cur = sel.value;
  sel.innerHTML = '<option value="all">全部业务员</option>' + owners.map(function (o) {
    return '<option value="' + esc(o) + '">' + esc(o) + '</option>';
  }).join('');
  if (cur && owners.indexOf(cur) >= 0) sel.value = cur;
  document.getElementById('ownerOptions').innerHTML = owners.map(function (o) {
    return '<option value="' + esc(o) + '">';
  }).join('');
}

document.addEventListener('DOMContentLoaded', function () {
  populateRegionOptions();
  populateOwnerOptions();
  refreshAll();
});

if (document.readyState === 'complete' || document.readyState === 'interactive') {
  populateRegionOptions();
  populateOwnerOptions();
  refreshAll();
}

/* ============================================================
 * 后端数据到达后自动重绘
 * ------------------------------------------------------------
 * 数据层在「后端预加载完成」与「本地写入」两条路径上都会派发
 * <store>StoreChange 窗口事件；页面若不监听，首次渲染发生在数据
 * 到达之前，界面会一直停在空列表。此处统一订阅后自动重绘。
 * ============================================================ */
(function () {
  // StoreLive 由 common/js/api.js 提供；部分页面未静态引入该文件，
  // 此时回退到原生窗口事件订阅，避免订阅被静默跳过导致页面不重绘。
  function bind(events, handler) {
    if (typeof StoreLive !== 'undefined') return StoreLive.on(events, handler);
    (Array.isArray(events) ? events : [events]).forEach(function (ev) {
      if (ev) window.addEventListener(ev, function () { try { handler(); } catch (e) { console.warn('[store-live]', e); } });
    });
  }
  bind(["salesStoreChange"], function () {
      refreshAll();
  });
})();
</script>
