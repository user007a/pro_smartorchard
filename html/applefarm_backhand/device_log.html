<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 设备日志</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  /* 模态框基础样式优化 */
  .modal-overlay, .detail-overlay {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0, 0, 0, 0.5);
    z-index:999;
    backdrop-filter:blur(4px);
  }
  .modal-overlay.show, .detail-overlay.show {
    display:block;
  }
  .modal-content, .detail-modal {
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    background:var(--bg-card);
    border-radius:16px;
    box-shadow:0 20px 60px rgba(0, 0, 0, 0.15);
    padding:24px;
    width:600px;
    max-height:80vh;
    overflow-y:auto;
    z-index:1000;
    animation:modalSlideIn 0.25s ease-out;
  }
  @keyframes modalSlideIn {
    from { opacity:0; transform:translate(-50%, -50%) scale(0.95); }
    to { opacity:1; transform:translate(-50%, -50%) scale(1); }
  }
  .modal-content.show, .detail-modal.show {
    display:block;
  }
  .modal-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    padding-bottom:16px;
    border-bottom:1px solid var(--border-light);
    position:relative;
  }
  .modal-header::before {
    content:'';
    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);
    width:4px;
    height:24px;
    background:linear-gradient(180deg, var(--primary-400), var(--primary-600));
    border-radius:0 4px 4px 0;
  }
  .modal-header h3 {
    font-size:16px;
    font-weight:600;
    color:var(--text-primary);
    margin:0;
    padding-left:12px;
  }
  .modal-close {
    width:28px;
    height:28px;
    border:none;
    background:var(--gray-100);
    border-radius:6px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.2s ease;
  }
  .modal-close:hover {
    background:var(--error-bg);
    color:var(--error);
  }

  /* 详情信息卡片 */
  .detail-info {
    padding:12px;
    background:linear-gradient(135deg, var(--gray-50), var(--gray-100));
    border-radius:12px;
    margin-bottom:12px;
    border:1px solid var(--border-default);
  }
  .detail-row {
    display:flex;
    padding:10px 0;
    border-bottom:1px dashed var(--border-default);
  }
  .detail-label {
    width:110px;
    color:var(--text-tertiary);
    font-size:13px;
    flex-shrink:0;
  }
  .detail-value {
    flex:1;
    color:var(--text-primary);
    font-size:13px;
    word-break:break-all;
  }

  /* 日志级别标签优化 */
  .log-level {
    display:inline-flex;
    align-items:center;
    padding:3px 10px;
    border-radius:20px;
    font-size:11.5px;
    font-weight:500;
    white-space:nowrap;
  }
  .log-level.info {
    background:var(--info-bg);
    color:var(--primary-500);
    border:1px solid var(--info-border);
  }
  .log-level.info::before {
    content:'';
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--primary-500);
    margin-right:6px;
  }
  .log-level.warn {
    background:#fffbe6;
    color:#d4b106;
    border:1px solid #ffe58f;
  }
  .log-level.warn::before {
    content:'';
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#faad14;
    margin-right:6px;
  }
  .log-level.error {
    background:var(--error-bg);
    color:#cf1322;
    border:1px solid #ffccc7;
  }
  .log-level.error::before {
    content:'';
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--error);
    margin-right:6px;
  }
  .log-level.debug {
    background:var(--success-bg);
    color:#3a8618;
    border:1px solid #b7eb8f;
  }
  .log-level.debug::before {
    content:'';
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--success);
    margin-right:6px;
  }

  /* 分页器优化 */
  .pagination-wrapper {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:24px;
    padding-top:20px;
    border-top:1px solid #f0f2f0;
  }
  .pagination-info {
    font-size:13px;
    color:var(--text-tertiary);
  }
  .pagination {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
  }
  .pagination button, .pagination .page-btn {
    min-width:36px;
    height:36px;
    padding:0 12px;
    border:1px solid var(--border-default);
    background:var(--bg-card);
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    font-weight:500;
    color:var(--text-secondary);
    transition:all 0.2s ease;
  }
  .pagination button.active, .pagination .page-btn.active {
    background:linear-gradient(135deg, var(--primary-500), var(--primary-600));
    color:var(--text-inverse);
    border-color:transparent;
    box-shadow:0 2px 8px rgba(24, 144, 255, 0.3);
  }
  .pagination button:hover:not(.active):not(.disabled), .pagination .page-btn:hover:not(.active):not(.disabled) {
    background:#f5f8f5;
    border-color:var(--primary-300);
    color:var(--primary-600);
  }
  .pagination .disabled, .pagination .page-btn.disabled {
    opacity:0.5;
    cursor:not-allowed;
    background:var(--gray-50);
  }
  .pagination .page-ellipsis {
    padding:0 8px;
    color:var(--text-tertiary);
  }

  /* 操作按钮样式 */
  .action-btn.detail {
    padding:4px 12px;
    font-size:11.5px;
    font-weight:500;
    color:#2b6cb0;
    background:#f5f8fc;
    border:1px solid #c5d9f0;
    border-radius:6px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .action-btn.detail:hover {
    background:#edf2fa;
    border-color:#90bce8;
  }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="device" data-active-submenu="device-log">

<!-- ===== 整体布局容器 ===== -->
<div class="app-layout">

  <!-- ===== 侧边栏 ===== -->
  <!-- 移动端遮罩层 -->
  <!-- ===== 主内容区 ===== -->
  <div class="main-wrapper">

    <!-- 顶栏 -->
    <!-- Tab 标签栏 -->
    <div class="tab-bar">
      <!-- Tab 标签由 JS 动态渲染 -->
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
      <div class="content-wrapper">
        
        <!-- ===== 搜索栏区 ===== -->
        <div class="page-section search-section">
          <div class="search-bar">
            <select class="search-select" id="deviceSelect">
              <option value="">全部设备</option>
              <option value="D-001">D-001 土壤湿度传感器</option>
              <option value="D-002">D-002 智能灌溉控制器</option>
              <option value="D-003">D-003 气象监测站</option>
              <option value="D-004">D-004 高清监控摄像头</option>
              <option value="D-005">D-005 虫情监测仪</option>
              <option value="D-006">D-006 工控主机</option>
            </select>
            <select class="search-select" id="levelSelect" style="min-width:120px;">
              <option value="">全部级别</option>
              <option value="info">INFO</option>
              <option value="warn">WARN</option>
              <option value="error">ERROR</option>
              <option value="debug">DEBUG</option>
            </select>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索日志内容...">
            <input type="date" id="startDate" style="padding:8px 12px;border:1px solid var(--border-default);border-radius:8px;font-size:13px;">
            <span style="color:var(--text-tertiary);">-</span>
            <input type="date" id="endDate" style="padding:8px 12px;border:1px solid var(--border-default);border-radius:8px;font-size:13px;">

          <div class="search-actions"><button class="jg-btn jg-btn-primary" onclick="searchData()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button><button class="jg-btn" onclick="resetSearch()">重置</button></div>
          </div>
        </div>

        <!-- ===== 操作按钮区 ===== -->
        <div class="page-section action-bar">
          <button class="jg-btn-outline" onclick="exportLogs()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" x2="8" y1="13" y2="13"/>
              <line x1="16" x2="8" y1="17" y2="17"/>
            </svg>
            导出日志
          </button>
          <button class="jg-btn-outline" onclick="clearLogs()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M3 6h18"/>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
            </svg>
            清空日志
          </button>
        </div>

        <!-- ===== 数据表格区 ===== -->
        <div class="page-section">
          <table class="data-table">
            <thead>
              <tr>
                <th>日志时间</th>
                <th>设备编号</th>
                <th>设备名称</th>
                <th>日志级别</th>
                <th>日志内容</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="dataTableBody">
              <!-- 数据由JavaScript动态渲染 -->
            </tbody>
          </table>

          <!-- 分页 -->
          <div class="pagination-wrapper">
            <div class="pagination-info" id="paginationInfo">共 23 条记录，第 1/3 页</div>
            <div class="pagination" id="paginationContainer"></div>
          </div>
        </div>

      </div>
    </main>
  </div>

</div>

<!-- 删除确认模态框 -->
<div class="modal-overlay" id="deleteOverlay" onclick="hideDeleteModal()"></div>
<div class="modal-content" id="deleteModal">
  <div class="modal-header">
    <h3>确认清空</h3>
    <button class="modal-close" onclick="hideDeleteModal()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l8 8M11 3l-8 8"/></svg>
    </button>
  </div>
  <p style="color:var(--text-secondary);font-size:14px;">确定要清空所有日志吗？此操作无法撤销。</p>
  <div class="modal-footer">
    <button class="jg-btn-outline" onclick="hideDeleteModal()">取消</button>
    <button class="jg-btn" style="background:var(--error);border-color:#ff4d4f;color:var(--text-inverse);" onclick="confirmClear()">确认清空</button>
  </div>
</div>

<!-- 导出日志模态框 -->
<div class="modal-overlay" id="exportOverlay" onclick="hideExportModal()"></div>
<div class="modal-content" id="exportModal">
  <div class="modal-header">
    <h3>导出日志</h3>
    <button class="modal-close" onclick="hideExportModal()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l8 8M11 3l-8 8"/></svg>
    </button>
  </div>
  <div class="form-group">
    <label>导出范围</label>
    <select id="exportScope">
      <option value="all">全部日志</option>
      <option value="current">当前筛选结果</option>
    </select>
  </div>
  <div class="form-group">
    <label>时间范围</label>
    <div style="display:flex;gap:10px;">
      <input type="date" id="exportStartDate" style="flex:1;padding:10px;border:1px solid var(--border-default);border-radius:8px;font-size:13px;">
      <span style="display:flex;align-items:center;color:var(--text-tertiary);">至</span>
      <input type="date" id="exportEndDate" style="flex:1;padding:10px;border:1px solid var(--border-default);border-radius:8px;font-size:13px;">
    </div>
  </div>
  <div class="form-group">
    <label>日志级别</label>
    <select id="exportLevel">
      <option value="">全部级别</option>
      <option value="info">INFO</option>
      <option value="warn">WARN</option>
      <option value="error">ERROR</option>
      <option value="debug">DEBUG</option>
    </select>
  </div>
  <div class="form-group">
    <label>导出格式</label>
    <div style="display:flex;gap:10px;">
      <label style="flex:1;display:flex;align-items:center;padding:10px;border:1px solid var(--border-default);border-radius:8px;cursor:pointer;">
        <input type="radio" name="exportFormat" value="excel" checked style="margin-right:8px;">
        <span>Excel (.xlsx)</span>
      </label>
      <label style="flex:1;display:flex;align-items:center;padding:10px;border:1px solid var(--border-default);border-radius:8px;cursor:pointer;">
        <input type="radio" name="exportFormat" value="txt" style="margin-right:8px;">
        <span>文本 (.txt)</span>
      </label>
    </div>
  </div>
  <div class="modal-footer">
    <button class="jg-btn-outline" onclick="hideExportModal()">取消</button>
    <button class="jg-btn jg-btn-primary" onclick="confirmExport()">导出日志</button>
  </div>
</div>

<!-- 详情模态框 -->
<div class="detail-overlay" id="detailOverlay" onclick="hideDetailModal()"></div>
<div class="detail-modal" id="detailModal">

  </div>
  <div class="modal-footer">
    <button class="jg-btn-outline" onclick="hideDetailModal()">关闭</button>
    <button class="jg-btn jg-btn-primary" onclick="handleLog()">处理日志</button>
  </div>
</div>

  { id: 'L021', time: '2024-06-20 14:21:35', deviceId: 'D-021', deviceName: '门禁控制器', level: 'debug', content: '门禁状态更新，当前：关闭' },
  { id: 'L022', time: '2024-06-20 14:21:00', deviceId: 'D-022', deviceName: '数据采集终端', level: 'info', content: '数据同步完成，共上传1024条记录' },
  { id: 'L023', time: '2024-06-20 14:20:25', deviceId: 'D-023', deviceName: 'UPS电源系统', level: 'error', content: 'UPS故障，主电源已切换' }
];

let currentPage = 1;
const pageSize = 10;
let filteredData = [...mockData];

// 页面初始化
document.addEventListener('DOMContentLoaded', function() {
  renderTable();
  renderPagination();
});

// 渲染表格
function renderTable() {
  const tbody = document.getElementById('dataTableBody');
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageData = filteredData.slice(start, end);

  tbody.innerHTML = pageData.map(item => `
    <tr>
      <td>${item.time}</td>
      <td><strong>${item.deviceId}</strong></td>
      <td>${item.deviceName}</td>
      <td><span class="log-level ${item.level}">${item.level.toUpperCase()}</span></td>
      <td>${item.content}</td>
      <td>
        <button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>
      </td>
    </tr>
  `).join('');
}

// 渲染分页
function renderPagination() {
  const container = document.getElementById('paginationContainer');
  const info = document.getElementById('paginationInfo');
  const totalPages = Math.ceil(filteredData.length / pageSize);

  info.textContent = `共 ${filteredData.length} 条记录，第 ${currentPage}/${totalPages || 1} 页`;

  if (totalPages <= 1) {
    container.innerHTML = '';
    return;
  }

  let html = '';
  html += `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="goToPage(${currentPage - 1})">上一页</button>`;

  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
      html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
    } else if (i === currentPage - 2 || i === currentPage + 2) {
      html += '<span class="page-ellipsis">...</span>';
    }
  }

  html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="goToPage(${currentPage + 1})">下一页</button>`;

  container.innerHTML = html;
}

// 跳转页面
function goToPage(page) {
  const totalPages = Math.ceil(filteredData.length / pageSize);
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderTable();
  renderPagination();
}

// 搜索
function searchData() {
  const deviceId = document.getElementById('deviceSelect').value;
  const level = document.getElementById('levelSelect').value;
  const keyword = document.getElementById('searchInput').value.toLowerCase();
  const startDate = document.getElementById('startDate').value;
  const endDate = document.getElementById('endDate').value;

  filteredData = mockData.filter(item => {
    if (deviceId && item.deviceId !== deviceId) return false;
    if (level && item.level !== level) return false;
    if (keyword && !item.content.toLowerCase().includes(keyword)) return false;
    if (startDate && item.time < startDate) return false;
    if (endDate && item.time > endDate + ' 23:59:59') return false;
    return true;
  });

  currentPage = 1;
  renderTable();
  renderPagination();
}

// 重置搜索
function resetSearch() {
  document.getElementById('deviceSelect').value = '';
  document.getElementById('levelSelect').value = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('startDate').value = '';
  document.getElementById('endDate').value = '';
  filteredData = [...mockData];
  currentPage = 1;
  renderTable();
  renderPagination();
}

function showDetail(id) {
  const item = mockData.find(d => d.id === id);
  if (!item) return;
  
  const levelMap = { info: 'INFO', warn: 'WARN', error: 'ERROR', debug: 'DEBUG' };
  
  document.getElementById('detail-log-id').textContent = item.id;
  document.getElementById('detail-log-time').textContent = item.time;
  document.getElementById('detail-device-id').textContent = item.deviceId;
  document.getElementById('detail-device-name').textContent = item.deviceName;
  document.getElementById('detail-log-content').textContent = item.content;
  document.getElementById('detail-log-level-badge').textContent = levelMap[item.level] || item.level.toUpperCase();
  document.getElementById('detail-log-level').innerHTML = `<span class="log-level ${item.level}">${levelMap[item.level] || item.level.toUpperCase()}</span>`;
  
  document.getElementById('detailOverlay').classList.add('show');
  document.getElementById('detailModal').classList.add('show');
}

function hideDetailModal() {
  document.getElementById('detailOverlay').classList.remove('show');
  document.getElementById('detailModal').classList.remove('show');
}

function handleLog() {
  hideDetailModal();
  alert('日志已处理');
}

function exportLogs() {
  document.getElementById('exportOverlay').classList.add('show');
  document.getElementById('exportModal').classList.add('show');
}

function hideExportModal() {
  document.getElementById('exportOverlay').classList.remove('show');
  document.getElementById('exportModal').classList.remove('show');
}

function confirmExport() {
  hideExportModal();
  alert('日志已导出');
}

function clearLogs() {
  document.getElementById('deleteOverlay').classList.add('show');
  document.getElementById('deleteModal').classList.add('show');
}

function confirmClear() {
  hideDeleteModal();
  alert('日志已清空');
}

function hideDeleteModal() {
  document.getElementById('deleteOverlay').classList.remove('show');
  document.getElementById('deleteModal').classList.remove('show');
}
</script>
