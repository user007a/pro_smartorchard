<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 设备日志</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:999; backdrop-filter:blur(4px); }
  .modal-overlay.show { display:block; }
  .modal-box { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:var(--bg-card); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.15);
    width:700px; max-width:94vw; max-height:86vh; overflow-y:auto; z-index:1000; animation:modalSlideIn .25s ease-out; }
  .modal-box.show { display:block; }
  @keyframes modalSlideIn { from{opacity:0;transform:translate(-50%,-50%) scale(.95)} to{opacity:1;transform:translate(-50%,-50%) scale(1)} }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;
    padding-bottom:16px; border-bottom:1px solid var(--border-light); }
  .modal-header h3 { font-size:16px; font-weight:600; color:var(--text-primary); margin:0; }
  .modal-close { width:28px; height:28px; border:none; background:var(--gray-100); border-radius:6px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .2s ease; }
  .modal-close:hover { background:var(--error-bg); color:var(--error); }
  .modal-body { padding:0 4px; }
  .modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; padding-top:16px;
    border-top:1px solid var(--border-light); background:var(--gray-50); padding:16px 0 0; }

  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:13px; font-weight:500; color:var(--text-secondary); margin-bottom:8px; }
  .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px;
    border:1px solid var(--border-default); border-radius:8px; font-size:13px; box-sizing:border-box; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline:none; border-color:var(--primary-400); box-shadow:0 0 0 3px rgba(24,144,255,.1); }
  .form-group textarea { min-height:70px; resize:vertical; }

  .detail-info { padding:12px; background:linear-gradient(135deg,var(--gray-50),var(--gray-100));
    border-radius:12px; margin-bottom:12px; border:1px solid var(--border-default); }
  .detail-row { display:flex; padding:9px 0; border-bottom:1px dashed var(--border-default); font-size:13px; }
  .detail-row:last-child { border-bottom:none; }
  .detail-label { width:104px; color:var(--text-tertiary); flex-shrink:0; }
  .detail-value { flex:1; color:var(--text-primary); word-break:break-all; }

  .log-level { display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px;
    font-size:11.5px; font-weight:500; white-space:nowrap; }
  .log-level.info { background:var(--info-bg); color:var(--primary-500); border:1px solid var(--info-border); }
  .log-level.warn { background:#fffbe6; color:#d4b106; border:1px solid #ffe58f; }
  .log-level.error { background:var(--error-bg); color:#cf1322; border:1px solid #ffccc7; }
  .log-level.debug { background:var(--success-bg); color:#3a8618; border:1px solid #b7eb8f; }
  .status-tag { display:inline-flex; align-items:center; padding:3px 10px; font-size:11.5px;
    font-weight:500; border-radius:20px; white-space:nowrap; }
  .status-tag.online { background:#d9f7be; color:#3a8618; border:1px solid #b7eb8f; }
  .status-tag.warning { background:var(--warning-bg); color:#ad8b00; border:1px solid var(--warning-border); }
  .status-tag.offline { background:var(--error-bg); color:#cf1322; border:1px solid #ffccc7; }

  .type-badge { display:inline-block; padding:2px 8px; border-radius:var(--radius-sm); font-size:11.5px;
    font-weight:500; background:var(--gray-100); color:var(--text-secondary); border:1px solid var(--border-default); }
  .action-btns { display:flex; gap:6px; flex-wrap:nowrap; }
  .action-btn { padding:4px 10px; font-size:11.5px; font-weight:500; border:1px solid transparent;
    border-radius:6px; cursor:pointer; transition:all .2s ease; white-space:nowrap; }
  .action-btn.detail { color:#2b6cb0; background:#f5f8fc; border-color:#c5d9f0; }
  .action-btn.detail:hover { background:#edf2fa; border-color:#90bce8; }
  .action-btn.edit { color:var(--primary-600); background:var(--gray-50); border-color:var(--border-default); }
  .action-btn.edit:hover { background:var(--primary-50); border-color:var(--primary-300); }

  .stat-card-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:16px; }
  .stat-card { background:#fff; border:1px solid #eef0ee; border-radius:12px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .stat-label { font-size:12px; color:var(--text-tertiary); margin-bottom:6px; }
  .stat-value { font-size:26px; font-weight:700; color:var(--text-primary); font-variant-numeric:tabular-nums; }
  .stat-value .unit { font-size:13px; font-weight:500; color:var(--text-tertiary); margin-left:4px; }
  .stat-sub { margin-top:6px; font-size:12px; color:var(--text-tertiary); }
  .stat-sub.err { color:var(--error); }
  .stat-sub.warn { color:var(--warning); }

  .chart-card { background:#fff; border:1px solid #eef0ee; border-radius:12px; padding:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.04); min-width:300px; }
  .chart-title { font-weight:600; font-size:14px; color:#1f2e1f; margin-bottom:10px; }
  .data-table { min-width:1240px; }
  .data-table th { white-space:nowrap; }
  .empty-row td { text-align:center; color:var(--text-tertiary); padding:40px 0; }
  #pagination-container { padding:12px 16px; }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>

<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="device" data-active-submenu="device-log">

<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <nav class="device-tabs" aria-label="运行分析">
        <a href="device_stats.html">运行统计</a>
        <a href="device_log.html" class="active">设备日志</a>
        <a href="device_audit.html">操作审计</a>
      </nav>

      <div class="stat-card-row" id="statCards"></div>

      <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin:0 0 20px;">
        <div class="chart-card"><div class="chart-title">日志类型分布</div><div id="device_log-c1" style="width:100%;height:240px;"></div></div>
        <div class="chart-card"><div class="chart-title">日志级别分布</div><div id="device_log-c2" style="width:100%;height:240px;"></div></div>
      </section>

      <div class="content-wrapper">

        <!-- ===== 搜索栏区 ===== -->
        <div class="page-section search-section">
          <div class="search-bar">
            <select class="search-select" id="deviceSelect"><option value="">全部设备</option></select>
            <select class="search-select" id="levelSelect" style="min-width:110px;">
              <option value="">全部级别</option>
              <option value="info">INFO</option>
              <option value="warn">WARN</option>
              <option value="error">ERROR</option>
              <option value="debug">DEBUG</option>
            </select>
            <select class="search-select" id="typeSelect" style="min-width:120px;">
              <option value="">全部日志类型</option>
            </select>
            <select class="search-select" id="sourceSelect" style="min-width:100px;">
              <option value="">全部来源</option>
              <option value="设备">设备</option>
              <option value="网关">网关</option>
              <option value="平台">平台</option>
            </select>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索日志内容 / 追踪ID...">
            <input type="date" id="startDate" style="padding:8px 12px;border:1px solid var(--border-default);border-radius:8px;font-size:13px;">
            <span style="color:var(--text-tertiary);">-</span>
            <input type="date" id="endDate" style="padding:8px 12px;border:1px solid var(--border-default);border-radius:8px;font-size:13px;">
            <div class="search-actions">
              <button class="jg-btn jg-btn-primary" onclick="handleSearch()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button>
              <button class="jg-btn" onclick="resetLogFilter()">重置</button>
            </div>
          </div>
        </div>

        <!-- ===== 操作按钮区 ===== -->
        <div class="page-section action-bar">
          <button class="jg-btn-outline" onclick="exportLogs()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/>
            </svg>导出日志
          </button>
          <button class="jg-btn-outline" onclick="clearLogs()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
            </svg>清空日志
          </button>
        </div>

        <!-- ===== 数据表格区 ===== -->
        <div class="page-section data-section">
          <div class="data-table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:52px;">序号</th>
                <th style="width:152px;">日志时间</th>
                <th style="width:76px;">设备编号</th>
                <th style="width:132px;">设备名称</th>
                <th style="width:84px;">日志级别</th>
                <th style="width:92px;">日志类型</th>
                <th style="width:70px;">来源</th>
                <th style="width:110px;">关联测点</th>
                <th style="width:86px;">数值</th>
                <th style="width:132px;">追踪ID</th>
                <th style="width:78px;">处理状态</th>
                <th style="width:88px;">操作</th>
              </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
          </table>
          </div>
          <div id="pagination-container"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- 详情模态框 -->
<div class="modal-overlay" id="detailOverlay"></div>
<div class="modal-box" id="detailModal">
  <div class="modal-header">
    <h3 id="detail-title">日志详情</h3>
    <button class="modal-close" onclick="closeDetailModal()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l8 8M11 3l-8 8"/></svg>
    </button>
  </div>
  <div class="modal-body" id="detailBody"></div>
  <div class="modal-footer">
    <button class="jg-btn" onclick="closeDetailModal()">关闭</button>
    <button class="jg-btn jg-btn-primary" onclick="handleLog()">标记已处理</button>
  </div>
</div>

<script src="js/components/modal.js"></script>
<script src="js/components/confirm.js"></script>
<script src="js/shared/device-store.js"></script>
<script src="js/shared/device-ui.js"></script>
<script>
/* ============================================================
 * 设备日志
 * 数据源：js/shared/device-store.js → logs()
 *
 * 日志模型：时间 / 设备 / 级别 / 类型 / 来源 / 内容 / 关联测点 / 数值 / 追踪ID / 处理状态
 * 所有增删改经 DeviceStore，日志为设备运维的原始凭据，禁止页面级私有 mock。
 * ============================================================ */

var LEVEL_TEXT = { info: 'INFO', warn: 'WARN', error: 'ERROR', debug: 'DEBUG' };
var HANDLE_TEXT = { pending: '待处理', handled: '已处理' };
var currentId = null;
var page = null;

/* ---------- 下拉初始化 ---------- */
function initSelects() {
  DeviceUI.fillSelect('deviceSelect', DeviceStore.devices().map(function (d) {
    return { value: d.id, label: d.id + ' · ' + d.name };
  }), '全部设备');

  var sel = document.getElementById('typeSelect');
  var cur = sel.value;
  sel.innerHTML = '<option value="">全部日志类型</option>';
  DeviceStore.LOG_TYPES.forEach(function (t) {
    var o = document.createElement('option');
    o.value = t; o.textContent = t;
    sel.appendChild(o);
  });
  sel.value = cur;
}

/* ---------- 统计卡 ---------- */
function renderStats() {
  var s = DeviceStore.logSummary();
  document.getElementById('statCards').innerHTML =
    '<div class="stat-card"><div class="stat-label">日志总数</div>' +
    '<div class="stat-value">' + s.total + '<span class="unit">条</span></div>' +
    '<div class="stat-sub">覆盖 ' + Object.keys(s.byType).length + ' 类日志</div></div>' +
    '<div class="stat-card"><div class="stat-label">ERROR 级别</div>' +
    '<div class="stat-value">' + s.byLevel.error + '<span class="unit">条</span></div>' +
    '<div class="stat-sub ' + (s.byLevel.error ? 'err' : '') + '">需优先排查</div></div>' +
    '<div class="stat-card"><div class="stat-label">WARN 级别</div>' +
    '<div class="stat-value">' + s.byLevel.warn + '<span class="unit">条</span></div>' +
    '<div class="stat-sub ' + (s.byLevel.warn ? 'warn' : '') + '">关注阈值波动</div></div>' +
    '<div class="stat-card"><div class="stat-label">待处理日志</div>' +
    '<div class="stat-value">' + s.pending + '<span class="unit">条</span></div>' +
    '<div class="stat-sub">需人工确认</div></div>';
}

/* ---------- 行渲染 ---------- */
function renderRow(item, index) {
  var dev = DeviceStore.deviceOf(item.deviceId);
  var pointName = '-';
  if (item.point && dev) {
    var p = DeviceStore.dataPointsOf(dev.type).filter(function (x) { return x.key === item.point; })[0];
    pointName = p ? p.name : item.point;
  }
  return '<tr>' +
    '<td>' + index + '</td>' +
    '<td style="font-variant-numeric:tabular-nums;">' + DeviceUI.esc(item.time) + '</td>' +
    '<td><strong>' + DeviceUI.esc(item.deviceId || '-') + '</strong></td>' +
    '<td>' + DeviceUI.esc(dev ? dev.name : (item.deviceName || '-')) + '</td>' +
    '<td><span class="log-level ' + item.level + '">' + (LEVEL_TEXT[item.level] || item.level) + '</span></td>' +
    '<td><span class="type-badge">' + DeviceUI.esc(item.type) + '</span></td>' +
    '<td>' + DeviceUI.esc(item.source) + '</td>' +
    '<td>' + DeviceUI.esc(pointName) + '</td>' +
    '<td>' + DeviceUI.esc(item.value || '-') + '</td>' +
    '<td style="font-size:11.5px;color:var(--text-tertiary);">' + DeviceUI.esc(item.traceId || '-') + '</td>' +
    '<td>' + DeviceUI.statusTag(item.status === 'handled' ? 'online' : 'warning', HANDLE_TEXT[item.status] || item.status) + '</td>' +
    '<td><div class="action-btns">' +
      '<button class="action-btn detail" onclick="openDetail(\'' + item.id + '\')">详情</button>' +
      (item.status === 'handled'
        ? ''
        : '<button class="action-btn edit" onclick="handleLog(\'' + item.id + '\')">处理</button>') +
    '</div></td>' +
  '</tr>';
}

/* ---------- 筛选 ---------- */
function filteredList() {
  var deviceId = document.getElementById('deviceSelect').value;
  var level = document.getElementById('levelSelect').value;
  var type = document.getElementById('typeSelect').value;
  var source = document.getElementById('sourceSelect').value;
  var kw = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  var startDate = document.getElementById('startDate').value;
  var endDate = document.getElementById('endDate').value;

  return DeviceStore.logs().filter(function (item) {
    if (deviceId && item.deviceId !== deviceId) return false;
    if (level && item.level !== level) return false;
    if (type && item.type !== type) return false;
    if (source && item.source !== source) return false;
    if (kw) {
      var hay = [item.content, item.traceId, item.deviceId].join(' ').toLowerCase();
      if (hay.indexOf(kw) === -1) return false;
    }
    if (startDate && item.time < startDate) return false;
    if (endDate && item.time > endDate + ' 23:59:59') return false;
    return true;
  });
}

function handleSearch() {
  var list = filteredList();
  page.updateData(list);
  DeviceUI.toast('找到 ' + list.length + ' 条记录', 'info');
}

function resetLogFilter() {
  ['deviceSelect', 'levelSelect', 'typeSelect', 'sourceSelect', 'startDate', 'endDate'].forEach(function (id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('searchInput').value = '';
  page.updateData(DeviceStore.logs());
  DeviceUI.toast('已重置搜索条件', 'info');
}

/* ---------- 详情 ---------- */
function openDetail(id) {
  var list = DeviceStore.logs();
  var item = null;
  for (var i = 0; i < list.length; i++) { if (list[i].id === id) { item = list[i]; break; } }
  if (!item) return;
  currentId = id;
  var dev = DeviceStore.deviceOf(item.deviceId);
  var pointName = '-';
  if (item.point && dev) {
    var p = DeviceStore.dataPointsOf(dev.type).filter(function (x) { return x.key === item.point; })[0];
    pointName = p ? p.name + '(' + p.unit + ')' : item.point;
  }
  var rows = [
    ['日志ID', item.id],
    ['日志时间', item.time],
    ['设备编号', item.deviceId || '-'],
    ['设备名称', dev ? dev.name : '-'],
    ['设备类型', dev ? DeviceStore.typeName(dev.type) : '-'],
    ['日志级别', LEVEL_TEXT[item.level] || item.level],
    ['日志类型', item.type],
    ['日志来源', item.source],
    ['关联测点', pointName],
    ['数值', item.value || '-'],
    ['追踪ID', item.traceId || '-'],
    ['日志内容', item.content],
    ['原始报文', item.raw || '-'],
    ['处理状态', HANDLE_TEXT[item.status] || item.status],
    ['处理人', item.handler || '-'],
    ['处理时间', item.handleTime || '-']
  ];
  document.getElementById('detail-title').textContent = '日志详情 · ' + item.id;
  document.getElementById('detailBody').innerHTML = '<div class="detail-info">' + rows.map(function (r) {
    return '<div class="detail-row"><span class="detail-label">' + r[0] + '</span>' +
      '<span class="detail-value">' + DeviceUI.esc(r[1]) + '</span></div>';
  }).join('') + '</div>';
  document.getElementById('detailModal').classList.add('show');
  document.getElementById('detailOverlay').classList.add('show');
}

function closeDetailModal() {
  document.getElementById('detailModal').classList.remove('show');
  document.getElementById('detailOverlay').classList.remove('show');
}

/* ---------- 处理日志 ---------- */
function handleLog(id) {
  var target = id || currentId;
  if (!target) return;
  var item = DeviceStore.logs().filter(function (x) { return x.id === target; })[0];
  if (!item) return;
  if (item.status === 'handled') {
    DeviceUI.toast('该日志已处理', 'info');
    return;
  }
  DeviceStore.upsertLog(Object.assign({}, item, {
    status: 'handled',
    handler: '当前用户',
    handleTime: DeviceStore.stampNow()
  }));
  DeviceStore.audit('status', 'log', target, '处理日志「' + target + '」');
  closeDetailModal();
  DeviceUI.toast('日志已标记为已处理', 'success');
  refreshAll();
}

/* ---------- 导出 ---------- */
function exportLogs() {
  var list = filteredList();
  var headers = ['日志ID', '日志时间', '设备编号', '设备名称', '日志级别', '日志类型', '来源',
    '关联测点', '数值', '追踪ID', '日志内容', '处理状态', '处理人', '处理时间'];
  var rows = list.map(function (x) {
    var dev = DeviceStore.deviceOf(x.deviceId);
    return [x.id, x.time, x.deviceId || '', dev ? dev.name : '', LEVEL_TEXT[x.level] || x.level,
      x.type, x.source, x.point || '', x.value || '', x.traceId || '', x.content,
      HANDLE_TEXT[x.status] || x.status, x.handler || '', x.handleTime || ''];
  });
  DeviceUI.exportCsv('设备日志', headers, rows);
}

/* ---------- 清空 ---------- */
function clearLogs() {
  var n = DeviceStore.logs().length;
  if (!n) { DeviceUI.toast('当前没有日志可清空', 'info'); return; }
  DeviceUI.confirmDelete('确定要清空全部 ' + n + ' 条设备日志吗？此操作不可撤销，且不可恢复。')
    .then(function (ok) {
      if (!ok) return;
      DeviceStore.clearLogs();
      DeviceUI.toast('日志已清空', 'success');
      refreshAll();
    });
}

/* ---------- 刷新 ---------- */
function refreshAll() {
  initSelects();
  renderStats();
  page.updateData(filteredList());
  renderCharts();
}

/* ---------- 图表 ---------- */
function renderCharts() {
  if (!window.Chart) return;
  var s = DeviceStore.logSummary();
  var typeSeries = DeviceStore.LOG_TYPES.map(function (t) {
    return { name: t, value: s.byType[t] || 0 };
  }).filter(function (x) { return x.value > 0; });
  Chart.pie('#device_log-c1', { series: typeSeries });
  Chart.donut('#device_log-c2', { series: [
    { name: 'INFO', value: s.byLevel.info || 0, color: '#1890ff' },
    { name: 'DEBUG', value: s.byLevel.debug || 0, color: '#52c41a' },
    { name: 'WARN', value: s.byLevel.warn || 0, color: '#faad14' },
    { name: 'ERROR', value: s.byLevel.error || 0, color: '#ff4d4f' }
  ]});
}

/* ---------- 初始化 ---------- */
document.addEventListener('DOMContentLoaded', function () {
  initSelects();
  renderStats();
  page = DeviceUI.pagination({
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderRow,
    emptyCols: 12,
    data: DeviceStore.logs()
  });
  DeviceStore.subscribe(function () {
    initSelects();
    renderStats();
    page.updateData(filteredList());
  });
  if (window.Chart) {
    window.Chart.loadECharts().then(renderCharts);
  } else {
    window.addEventListener('load', function () { window.Chart.loadECharts().then(renderCharts); });
  }
});
</script>
