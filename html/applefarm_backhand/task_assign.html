<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 任务分配</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
  }
  .modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }
  .modal {
    background: #fff;
    border-radius: 16px;
    width: 520px;
    max-width: 90vw;
    max-height: 90vh;
    overflow: hidden;
    transform: scale(0.9);
    transition: all 0.3s ease;
  }
  .modal-overlay.active .modal {
    transform: scale(1);
  }
  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid #e8ece8;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(135deg, #22a84a 0%, #1a8a3a 100%);
    color: #fff;
  }
  .modal-header h3 {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
  }
  .modal-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .modal-close:hover {
    background: rgba(255,255,255,0.3);
  }
  .modal-body {
    padding: 24px;
    max-height: 60vh;
    overflow-y: auto;
  }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid #e8ece8;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }
  .detail-grid {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid #f0f4f0;
  }
  .detail-grid:last-child {
    border-bottom: none;
  }
  .detail-label {
    color: #6b7b6b;
    font-size: 14px;
  }
  .detail-value {
    color: #1a2e1a;
    font-size: 14px;
    font-weight: 500;
  }
  .generate-form {
    display: grid;
    gap: 16px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .form-group label {
    font-size: 14px;
    font-weight: 500;
    color: #1a2e1a;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    padding: 10px 14px;
    border: 1px solid #e0e5e0;
    border-radius: 8px;
    font-size: 14px;
    transition: all 0.2s;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: #22a84a;
    box-shadow: 0 0 0 3px rgba(34,168,74,0.1);
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .form-row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  .form-group textarea {
    min-height: 80px;
    resize: vertical;
  }
  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 14px 20px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 2000;
    transform: translateX(120%);
    transition: all 0.3s ease;
  }
  .toast.show {
    transform: translateX(0);
  }
  .toast.success {
    border-left: 4px solid #22a84a;
  }
  .toast.error {
    border-left: 4px solid #dc2626;
  }
  .toast-icon {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #e8f5ec;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #22a84a;
  }
  .toast.error .toast-icon {
    background: #fee2e2;
    color: #dc2626;
  }
  .pagination-info {
    display: flex;
    align-items: center;
    color: #6b7b6b;
    font-size: 14px;
  }
</style>
</head>
<body data-active-menu="task" data-active-submenu="task-assign">

<div class="app-layout">

        </span>

  <div class="sidebar-overlay"></div>

    <div class="tab-bar">

          </svg>
        </button>

    </div>

    <main class="main-content">
      <div class="content-wrapper">
        <div class="page-header">
          <div>

            <p class="page-subtitle">管理任务的分配、调整和进度跟踪</p>
          </div>
        </div>

        <div class="patrol-stats">
          <div class="patrol-stat-card green">
            <div class="stat-value">28</div>
            <div class="stat-label">待接收任务</div>
          </div>
          <div class="patrol-stat-card blue">
            <div class="stat-value">15</div>
            <div class="stat-label">进行中任务</div>
          </div>
          <div class="patrol-stat-card orange">
            <div class="stat-value">47</div>
            <div class="stat-label">已完成任务</div>
          </div>
          <div class="patrol-stat-card purple">
            <div class="stat-value">8</div>
            <div class="stat-label">已取消任务</div>
          </div>
        </div>

        <div class="search-section">
          <div class="search-bar">
            <select class="search-select" id="statusSelect">
              <option value="">全部状态</option>
              <option value="pending">待接收</option>
              <option value="accepted">已接收</option>
              <option value="processing">进行中</option>
              <option value="completed">已完成</option>
              <option value="cancelled">已取消</option>
            </select>
            <select class="search-select" id="prioritySelect">

              <option value="high">紧急</option>
              <option value="medium">普通</option>

            </select>
            <select class="search-select" id="teamSelect">
              <option value="">全部班组</option>
              <option value="一班">一班</option>
              <option value="二班">二班</option>
              <option value="三班">三班</option>

            <input type="text" class="search-input" placeholder="搜索任务名称、农工姓名..." id="searchInput">

                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
              </svg>
              搜索
            </button>
          </div>
        </div>

        <div class="action-bar">
          <div class="action-left">
            <button class="jg-btn jg-btn-primary" onclick="openCreateModal()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                <path d="M12 4v16m8-8H4"/>
              </svg>
              新建任务
            </button>
            <button class="jg-btn" onclick="batchAssign()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              批量分配
            </button>
            <button class="jg-btn" onclick="exportTasks()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
              </svg>
              导出任务
            </button>
          </div>
          <div class="action-right">
            <span class="selected-info" id="recordCount">共 23 条记录</span>
          </div>
        </div>

        <div class="data-section">
          <table class="data-table">
            <thead>
              <tr>
                <th class="checkbox-col"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>

                <th>地块</th>
                <th>任务类型</th>
                <th>优先级</th>
                <th>分配人员</th>
                <th>班组</th>
                <th>截止时间</th>
                <th>状态</th>

              </tr>
            </thead>
            <tbody id="dataTableBody">

</div>

<!-- 新建任务弹窗 -->
<div class="modal-overlay" id="createModal">
  <div class="modal">
    <div class="modal-header">
      <h3>新建任务</h3>
      <button class="modal-close" onclick="closeModal('createModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="generate-form">
        <div class="form-group">
          <label>任务名称</label>
          <input type="text" id="createName" placeholder="请输入任务名称">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>地块</label>
            <select id="createPlot">
              <option value="">请选择地块</option>
              <option value="A1区">A1区</option>
              <option value="A2区">A2区</option>
              <option value="B1区">B1区</option>
              <option value="B2区">B2区</option>
              <option value="C1区">C1区</option>
              <option value="C2区">C2区</option>
            </select>
          </div>
          <div class="form-group">
            <label>任务类型</label>
            <select id="createType">
              <option value="">请选择任务类型</option>
              <option value="施肥">施肥</option>
              <option value="施药">施药</option>
              <option value="修剪">修剪</option>
              <option value="灌溉">灌溉</option>
              <option value="疏果">疏果</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>优先级</label>
            <select id="createPriority">
              <option value="high">紧急</option>
              <option value="medium">普通</option>
              <option value="low">低</option>
            </select>
          </div>
          <div class="form-group">
            <label>班组</label>
            <select id="createTeam">
              <option value="一班">一班</option>
              <option value="二班">二班</option>
              <option value="三班">三班</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>分配人员</label>
            <select id="createPerson">
              <option value="">请选择人员</option>
              <option value="张三">张三</option>
              <option value="李四">李四</option>
              <option value="王五">王五</option>
              <option value="赵六">赵六</option>
              <option value="孙七">孙七</option>
            </select>
          </div>
          <div class="form-group">
            <label>截止时间</label>
            <input type="date" id="createDeadline">
          </div>
        </div>
        <div class="form-group">
          <label>任务描述</label>
          <textarea id="createDesc" placeholder="请输入任务描述（选填）"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('createModal')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="confirmCreate()">确认创建</button>
    </div>
  </div>
</div>

<!-- 批量分配弹窗 -->
<div class="modal-overlay" id="batchModal">
  <div class="modal">
    <div class="modal-header">
      <h3>批量分配</h3>
      <button class="modal-close" onclick="closeModal('batchModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="generate-form">
        <div class="form-row">
          <div class="form-group">
            <label>班组</label>

  { id: 19, name: '病虫害防治', plot: 'A1区', type: '施药', priority: 'high', person: '赵六', team: '三班', deadline: '2026-06-18', status: 'processing', desc: '综合防治病虫害' },
  { id: 20, name: '修剪培训', plot: 'A2区', type: '修剪', priority: 'medium', person: '孙七', team: '二班', deadline: '2026-06-22', status: 'pending', desc: '组织修剪技术培训' },
  { id: 21, name: '灌溉调度', plot: 'B1区', type: '灌溉', priority: 'medium', person: '张三', team: '一班', deadline: '2026-06-19', status: 'completed', desc: '智能灌溉系统调度' },
  { id: 22, name: '施肥计划制定', plot: 'B2区', type: '施肥', priority: 'low', person: '李四', team: '二班', deadline: '2026-06-28', status: 'pending', desc: '制定下半年施肥计划' },
  { id: 23, name: '果园巡视', plot: 'C1区', type: '疏果', priority: 'low', person: '王五', team: '一班', deadline: '2026-06-23', status: 'cancelled', desc: '日常果园巡视检查' }
];

let currentPage = 1;
const pageSize = 10;
let filteredData = [...mockData];
let currentDetailId = null;

document.addEventListener('DOMContentLoaded', function() {
  renderTable();
  renderPagination();
});

function renderTable() {
  const tbody = document.getElementById('dataTableBody');
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageData = filteredData.slice(start, end);
  
  tbody.innerHTML = pageData.map(item => `
    <tr>
      <td class="checkbox-col"><input type="checkbox" class="row-checkbox" data-id="${item.id}" onchange="updateSelectAll()"></td>
      <td><strong>${item.name}</strong></td>
      <td>${item.plot}</td>
      <td>${item.type}</td>
      <td><span class="status-tag ${item.priority === 'high' ? 'error' : item.priority === 'medium' ? 'warning' : 'inactive'}">${item.priority === 'high' ? '紧急' : item.priority === 'medium' ? '普通' : '低'}</span></td>
      <td>${item.person}</td>
      <td>${item.team}</td>
      <td>${item.deadline}</td>
      <td><span class="status-tag ${item.status === 'completed' ? 'active' : item.status === 'processing' ? 'warning' : item.status === 'accepted' ? 'blue' : item.status === 'cancelled' ? 'error' : 'inactive'}">${item.status === 'pending' ? '待接收' : item.status === 'accepted' ? '已接收' : item.status === 'processing' ? '进行中' : item.status === 'completed' ? '已完成' : '已取消'}</span></td>
      <td>
        <div class="action-btns">
          <button class="action-btn detail" onclick="viewDetail(${item.id})">详情</button>
          <button class="action-btn edit" onclick="openEditModal(${item.id})">编辑</button>
        </div>
      </td>
    </tr>
  `).join('');
  
  document.getElementById('recordCount').textContent = `共 ${filteredData.length} 条记录`;
}

function renderPagination() {
  const container = document.getElementById('paginationContainer');
  const totalPages = Math.ceil(filteredData.length / pageSize);
  
  if (totalPages <= 1) {
    container.innerHTML = '<div class="pagination-info">显示 1-' + filteredData.length + ' 条，共 ' + filteredData.length + ' 条</div>';
    return;
  }
  
  let html = '<div class="pagination-info">显示 ' + ((currentPage - 1) * pageSize + 1) + '-' + Math.min(currentPage * pageSize, filteredData.length) + ' 条，共 ' + filteredData.length + ' 条</div>';
  html += '<div class="pagination-controls">';
  html += `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="goToPage(${currentPage - 1})">‹</button>`;
  
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
      html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
    } else if (i === currentPage - 2 || i === currentPage + 2) {
      html += '<span class="page-ellipsis">...</span>';
    }
  }
  
  html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="goToPage(${currentPage + 1})">›</button>`;
  html += '</div>';
  
  container.innerHTML = html;
}

function goToPage(page) {
  const totalPages = Math.ceil(filteredData.length / pageSize);
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderTable();
  renderPagination();
}

function searchData() {
  const status = document.getElementById('statusSelect').value;
  const priority = document.getElementById('prioritySelect').value;
  const team = document.getElementById('teamSelect').value;
  const keyword = document.getElementById('searchInput').value.toLowerCase();
  
  filteredData = mockData.filter(item => {
    if (status && item.status !== status) return false;
    if (priority && item.priority !== priority) return false;
    if (team && item.team !== team) return false;
    if (keyword && !item.name.toLowerCase().includes(keyword) && !item.person.toLowerCase().includes(keyword)) return false;
    return true;
  });
  
  currentPage = 1;
  renderTable();
  renderPagination();
  showToast(`找到 ${filteredData.length} 条记录`);
}

function toggleSelectAll() {
  const checked = document.getElementById('selectAll').checked;
  document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = checked);
}

function updateSelectAll() {
  const allChecked = document.querySelectorAll('.row-checkbox').length === document.querySelectorAll('.row-checkbox:checked').length;
  document.getElementById('selectAll').checked = allChecked;
}

function viewDetail(id) {
  currentDetailId = id;
  const item = mockData.find(d => d.id === id);
  if (!item) return;
  
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-grid">
      <span class="detail-label">任务名称</span>
      <span class="detail-value">${item.name}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">地块</span>
      <span class="detail-value">${item.plot}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">任务类型</span>
      <span class="detail-value">${item.type}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">优先级</span>
      <span class="detail-value"><span class="status-tag ${item.priority === 'high' ? 'error' : item.priority === 'medium' ? 'warning' : 'inactive'}">${item.priority === 'high' ? '紧急' : item.priority === 'medium' ? '普通' : '低'}</span></span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">分配人员</span>
      <span class="detail-value">${item.person}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">班组</span>
      <span class="detail-value">${item.team}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">截止时间</span>
      <span class="detail-value">${item.deadline}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">状态</span>
      <span class="detail-value"><span class="status-tag ${item.status === 'completed' ? 'active' : item.status === 'processing' ? 'warning' : item.status === 'accepted' ? 'blue' : item.status === 'cancelled' ? 'error' : 'inactive'}">${item.status === 'pending' ? '待接收' : item.status === 'accepted' ? '已接收' : item.status === 'processing' ? '进行中' : item.status === 'completed' ? '已完成' : '已取消'}</span></span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">任务描述</span>
      <span class="detail-value">${item.desc || '—'}</span>
    </div>
  `;
  
  openModal('detailModal');
}

function openCreateModal() {
  document.getElementById('createName').value = '';
  document.getElementById('createPlot').value = '';
  document.getElementById('createType').value = '';
  document.getElementById('createPriority').value = 'medium';
  document.getElementById('createTeam').value = '一班';
  document.getElementById('createPerson').value = '';
  document.getElementById('createDeadline').value = '';
  document.getElementById('createDesc').value = '';
  openModal('createModal');
}

function confirmCreate() {
  const name = document.getElementById('createName').value;
  const plot = document.getElementById('createPlot').value;
  const type = document.getElementById('createType').value;
  const person = document.getElementById('createPerson').value;
  
  if (!name) {
    showToast('请输入任务名称', 'error');
    return;
  }
  if (!plot) {
    showToast('请选择地块', 'error');
    return;
  }
  if (!type) {
    showToast('请选择任务类型', 'error');
    return;
  }
  if (!person) {
    showToast('请选择分配人员', 'error');
    return;
  }
  
  closeModal('createModal');
  showToast('任务创建成功');
}

function openEditModal(id) {
  currentDetailId = id || currentDetailId;
  const item = mockData.find(d => d.id === currentDetailId);
  if (!item) return;
  
  document.getElementById('editName').value = item.name;
  document.getElementById('editPlot').value = item.plot;
  document.getElementById('editType').value = item.type;
  document.getElementById('editPriority').value = item.priority;
  document.getElementById('editTeam').value = item.team;
  document.getElementById('editPerson').value = item.person;
  document.getElementById('editDeadline').value = item.deadline;
  document.getElementById('editDesc').value = item.desc || '';
  document.getElementById('editStatus').value = item.status;
  
  closeModal('detailModal');
  openModal('editModal');
}

function confirmEdit() {
  closeModal('editModal');
  showToast('任务修改成功');
}

function batchAssign() {
  const checked = document.querySelectorAll('.row-checkbox:checked');
  if (checked.length === 0) {
    showToast('请先选择要分配的任务', 'error');
    return;
  }
  
  document.getElementById('batchTeam').value = '';
  document.getElementById('batchPerson').value = '';
  document.getElementById('batchDeadline').value = '';
  openModal('batchModal');
}

function confirmBatchAssign() {
  const team = document.getElementById('batchTeam').value;
  const person = document.getElementById('batchPerson').value;
  
  if (!team && !person) {
    showToast('请至少选择班组或人员', 'error');
    return;
  }
  
  closeModal('batchModal');
  const count = document.querySelectorAll('.row-checkbox:checked').length;
  showToast(`已成功分配 ${count} 条任务`);
}

function exportTasks() {
  const checked = document.querySelectorAll('.row-checkbox:checked');
  if (checked.length === 0) {
    showToast('请先选择要导出的任务', 'error');
    return;
  }
  showToast(`已导出 ${checked.length} 条任务`);
}

function openModal(id) {
  document.getElementById(id).classList.add('active');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  document.getElementById('toastMessage').textContent = message;
  toast.className = `toast ${type}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}
</script>
