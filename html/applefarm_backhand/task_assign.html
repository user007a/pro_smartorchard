<style>
  .modal-overlay {
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0, 0, 0, 0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    opacity:0;
    visibility:hidden;
    transition:all 0.3s ease;
  }
  .modal-overlay.active {
    opacity:1;
    visibility:visible;
  }
  .modal {
    background:var(--bg-card);
    border-radius:16px;
    width:520px;
    max-width:90vw;
    max-height:90vh;
    overflow:hidden;
    transform:scale(0.9);
    transition:all 0.3s ease;
  }
  .modal-overlay.active .modal {
    transform:scale(1);
  }
  .modal-header {
    padding:20px 24px;
    border-bottom:1px solid var(--border-default);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(135deg, #1890ff 0%, #1a8a3a 100%);
    color:var(--text-inverse);
  }
  .modal-header h3 {
    font-size:18px;
    font-weight:600;
    margin:0;
  }
  .modal-close {
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
    border:none;
    color:var(--text-inverse);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.2s;
  }
  .modal-close:hover {
    background:rgba(255,255,255,0.3);
  }
  .modal-body {
    padding:24px;
    max-height:60vh;
    overflow-y:auto;
  }
  .modal-footer {
    padding:16px 24px;
    border-top:1px solid var(--border-default);
    display:flex;
    justify-content:flex-end;
    gap:12px;
  }
  .detail-grid {
    display:grid;
    grid-template-columns:120px 1fr;
    gap:12px;
    padding:8px 0;
    border-bottom:1px solid var(--border-light);
  }
  .detail-grid:last-child {
    border-bottom:none;
  }
  .detail-label {
    color:var(--text-tertiary);
    font-size:14px;
  }
  .detail-value {
    color:var(--text-primary);
    font-size:14px;
    font-weight:500;
  }
  .generate-form {
    display:grid;
    gap:16px;
  }
  .form-group {
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .form-group label {
    font-size:14px;
    font-weight:500;
    color:var(--text-primary);
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    padding:10px 14px;
    border:1px solid var(--border-default);
    border-radius:8px;
    font-size:14px;
    transition:all 0.2s;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline:none;
    border-color:var(--border-primary);
    box-shadow:0 0 0 3px rgba(24,144,255,0.1);
  }
  .form-row {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .form-row-3 {
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
  }
  .form-group textarea {
    min-height:80px;
    resize:vertical;
  }
  .toast {
    position:fixed;
    top:20px;
    right:20px;
    padding:14px 20px;
    background:var(--bg-card);
    border-radius:10px;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
    display:flex;
    align-items:center;
    gap:12px;
    z-index:2000;
    transform:translateX(120%);
    transition:all 0.3s ease;
  }
  .toast.show {
    transform:translateX(0);
  }
  .toast.success {
    border-left:4px solid var(--border-primary);
  }
  .toast.error {
    border-left:4px solid #dc2626;
  }
  .toast-icon {
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--gray-100);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--primary-500);
  }
  .toast.error .toast-icon {
    background:var(--error-bg);
    color:#dc2626;
  }
  .pagination-info {
    display:flex;
    align-items:center;
    color:var(--text-tertiary);
    font-size:14px;
  }
</style>

let currentPage = 1;
const pageSize = 10;
let filteredData = [...mockData];
let currentDetailId = null;

document.addEventListener('DOMContentLoaded', function() {
  renderTable();
  renderPagination();
});

function renderTable() {
  const tbody = document.getElementById('dataTableBody');
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageData = filteredData.slice(start, end);
  
  tbody.innerHTML = pageData.map((item, __seq) => `
    <tr>
      <td class="checkbox-col">${__seq + 1}</td>
      <td><strong>${item.name}</strong></td>
      <td>${item.plot}</td>
      <td>${item.type}</td>
      <td><span class="status-tag ${item.priority === 'high' ? 'error' : item.priority === 'medium' ? 'warning' : 'inactive'}">${item.priority === 'high' ? '紧急' : item.priority === 'medium' ? '普通' : '低'}</span></td>
      <td>${item.person}</td>
      <td>${item.team}</td>
      <td>${item.deadline}</td>
      <td><span class="status-tag ${item.status === 'completed' ? 'active' : item.status === 'processing' ? 'warning' : item.status === 'accepted' ? 'blue' : item.status === 'cancelled' ? 'error' : 'inactive'}">${item.status === 'pending' ? '待接收' : item.status === 'accepted' ? '已接收' : item.status === 'processing' ? '进行中' : item.status === 'completed' ? '已完成' : '已取消'}</span></td>
      <td>
        <div class="action-btns">
          <button class="action-btn detail" onclick="viewDetail(${item.id})">详情</button>
          <button class="action-btn edit" onclick="openEditModal(${item.id})">编辑</button>
        </div>
      </td>
    </tr>
  `).join('');
  
  document.getElementById('recordCount').textContent = `共 ${filteredData.length} 条记录`;
}

function renderPagination() {
  const container = document.getElementById('paginationContainer');
  const totalPages = Math.ceil(filteredData.length / pageSize);
  
  if (totalPages <= 1) {
    container.innerHTML = '<div class="pagination-info">显示 1-' + filteredData.length + ' 条，共 ' + filteredData.length + ' 条</div>';
    return;
  }
  
  let html = '<div class="pagination-info">显示 ' + ((currentPage - 1) * pageSize + 1) + '-' + Math.min(currentPage * pageSize, filteredData.length) + ' 条，共 ' + filteredData.length + ' 条</div>';
  html += '<div class="pagination-controls">';
  html += `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="goToPage(${currentPage - 1})">‹</button>`;
  
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
      html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
    } else if (i === currentPage - 2 || i === currentPage + 2) {
      html += '<span class="page-ellipsis">...</span>';
    }
  }
  
  html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="goToPage(${currentPage + 1})">›</button>`;
  html += '</div>';
  
  container.innerHTML = html;
}

function goToPage(page) {
  const totalPages = Math.ceil(filteredData.length / pageSize);
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderTable();
  renderPagination();
}

function searchData() {
  const status = document.getElementById('statusSelect').value;
  const priority = document.getElementById('prioritySelect').value;
  const team = document.getElementById('teamSelect').value;
  const keyword = document.getElementById('searchInput').value.toLowerCase();
  
  filteredData = mockData.filter(item => {
    if (status && item.status !== status) return false;
    if (priority && item.priority !== priority) return false;
    if (team && item.team !== team) return false;
    if (keyword && !item.name.toLowerCase().includes(keyword) && !item.person.toLowerCase().includes(keyword)) return false;
    return true;
  });
  
  currentPage = 1;
  renderTable();
  renderPagination();
  showToast(`找到 ${filteredData.length} 条记录`);
}

function toggleSelectAll() {
  const checked = !!document.getElementById('selectAll') && document.getElementById('selectAll').checked;
  document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = checked);
}

function updateSelectAll() {
  const allChecked = document.querySelectorAll('.row-checkbox').length === document.querySelectorAll('.row-checkbox:checked').length;
  if (document.getElementById('selectAll')) document.getElementById('selectAll').checked = allChecked;
}

function viewDetail(id) {
  currentDetailId = id;

  if (!item) return;
  
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-grid">
      <span class="detail-label">任务名称</span>
      <span class="detail-value">${item.name}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">地块</span>
      <span class="detail-value">${item.plot}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">任务类型</span>
      <span class="detail-value">${item.type}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">优先级</span>
      <span class="detail-value"><span class="status-tag ${item.priority === 'high' ? 'error' : item.priority === 'medium' ? 'warning' : 'inactive'}">${item.priority === 'high' ? '紧急' : item.priority === 'medium' ? '普通' : '低'}</span></span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">分配人员</span>
      <span class="detail-value">${item.person}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">班组</span>
      <span class="detail-value">${item.team}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">截止时间</span>
      <span class="detail-value">${item.deadline}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">状态</span>
      <span class="detail-value"><span class="status-tag ${item.status === 'completed' ? 'active' : item.status === 'processing' ? 'warning' : item.status === 'accepted' ? 'blue' : item.status === 'cancelled' ? 'error' : 'inactive'}">${item.status === 'pending' ? '待接收' : item.status === 'accepted' ? '已接收' : item.status === 'processing' ? '进行中' : item.status === 'completed' ? '已完成' : '已取消'}</span></span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">任务描述</span>
      <span class="detail-value">${item.desc || '—'}</span>
    </div>
  `;
  
  openModal('detailModal');
}

function openCreateModal() {
  document.getElementById('createName').value = '';
  document.getElementById('createPlot').value = '';
  document.getElementById('createType').value = '';
  document.getElementById('createPriority').value = 'medium';
  document.getElementById('createTeam').value = '一班';
  document.getElementById('createPerson').value = '';
  document.getElementById('createDeadline').value = '';
  document.getElementById('createDesc').value = '';
  openModal('createModal');
}

function confirmCreate() {
  const name = document.getElementById('createName').value;
  const plot = document.getElementById('createPlot').value;
  const type = document.getElementById('createType').value;
  const person = document.getElementById('createPerson').value;
  
  if (!name) {
    showToast('请输入任务名称', 'error');
    return;
  }
  if (!plot) {
    showToast('请选择地块', 'error');
    return;
  }
  if (!type) {
    showToast('请选择任务类型', 'error');
    return;
  }
  if (!person) {
    showToast('请选择分配人员', 'error');
    return;
  }
  
  closeModal('createModal');
  showToast('任务创建成功');
}

function openEditModal(id) {
  currentDetailId = id || currentDetailId;
  const item = mockData.find(d => d.id === currentDetailId);
  if (!item) return;
  
  document.getElementById('editName').value = item.name;
  document.getElementById('editPlot').value = item.plot;
  document.getElementById('editType').value = item.type;
  document.getElementById('editPriority').value = item.priority;
  document.getElementById('editTeam').value = item.team;
  document.getElementById('editPerson').value = item.person;
  document.getElementById('editDeadline').value = item.deadline;
  document.getElementById('editDesc').value = item.desc || '';
  document.getElementById('editStatus').value = item.status;
  
  closeModal('detailModal');
  openModal('editModal');
}

function confirmEdit() {
  closeModal('editModal');
  showToast('任务修改成功');
}

function batchAssign() {
  const checked = document.querySelectorAll('.row-checkbox:checked');
  if (checked.length === 0) {
    showToast('请先选择要分配的任务', 'error');
    return;
  }
  
  document.getElementById('batchTeam').value = '';
  document.getElementById('batchPerson').value = '';
  document.getElementById('batchDeadline').value = '';
  openModal('batchModal');
}

function confirmBatchAssign() {
  const team = document.getElementById('batchTeam').value;
  const person = document.getElementById('batchPerson').value;
  
  if (!team && !person) {
    showToast('请至少选择班组或人员', 'error');
    return;
  }
  
  closeModal('batchModal');
  showToast(`已成功分配全部 ${filteredData.length} 条任务`);
}

function exportTasks() {
  showToast(`已导出全部 ${filteredData.length} 条任务`);
}

function openModal(id) {
  document.getElementById(id).classList.add('active');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  document.getElementById('toastMessage').textContent = message;
  toast.className = `toast ${type}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}
