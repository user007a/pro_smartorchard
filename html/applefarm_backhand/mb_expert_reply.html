<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 专家咨询回复</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/page-content.css">
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<style>
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
  }
  .stat-label {
    font-size: var(--font-size-sm);
    color: var(--text-tertiary);
    margin-bottom: var(--space-xs);
  }
  .stat-value {
    font-size: 26px;
    font-weight: var(--font-weight-bold);
    color: var(--text-primary);
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .stat-card.is-pending .stat-value { color: var(--warning); }
  .stat-card.is-done .stat-value { color: var(--success); }
  .status-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    font-size: var(--font-size-xs);
    font-weight: var(--weight-medium, 500);
    white-space: nowrap;
  }
  .status-tag.pending { background: var(--warning-bg); color: var(--warning); }
  .status-tag.replied { background: var(--success-bg); color: var(--success); }
  .status-tag.closed { background: var(--gray-100); color: var(--text-secondary); }
  .cell-title {
    font-weight: var(--font-weight-semibold, 600);
    color: var(--text-primary);
    margin-bottom: 2px;
  }
  .cell-sub {
    font-size: var(--font-size-xs);
    color: var(--text-tertiary);
    max-width: 340px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .reply-box {
    margin-top: var(--space-sm);
    padding: 10px 12px;
    background: var(--gray-50);
    border-left: 3px solid var(--success);
    border-radius: var(--radius-sm);
    font-size: var(--font-size-sm);
    color: var(--text-secondary);
  }
  .reply-box .reply-by {
    color: var(--text-tertiary);
    font-size: var(--font-size-xs);
    margin-bottom: 2px;
  }
  .expert-card {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-md);
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
  }
  .expert-avatar {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-full);
    background: var(--primary-50);
    color: var(--primary-600);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: var(--font-weight-bold);
    font-size: var(--font-size-base);
    flex-shrink: 0;
  }
  .expert-name {
    font-size: var(--font-size-base);
    font-weight: var(--font-weight-semibold, 600);
    color: var(--text-primary);
  }
  .expert-tags {
    font-size: var(--font-size-xs);
    color: var(--text-tertiary);
    margin-top: 2px;
  }
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--bg-card);
    border-radius: 12px;
    width: 92%;
    max-width: 620px;
    max-height: 85vh;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    animation: modalFadeIn 0.2s ease-out;
  }
  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.95) translateY(-20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-default);
  }
  .modal-title { font-size: 16px; font-weight: 600; color: #1f1f1f; }
  .modal-close {
    background: none; border: none; cursor: pointer;
    padding: 4px; font-size: 20px; line-height: 1;
    color: var(--text-tertiary); transition: color 0.2s;
  }
  .modal-close:hover { color: var(--text-secondary); }
  .modal-body {
    padding: 20px;
    overflow-y: auto;
    max-height: calc(85vh - 132px);
  }
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    padding: 16px 20px;
    border-top: 1px solid var(--border-default);
  }
  .modal-field { margin-bottom: var(--space-lg); }
  .modal-field label {
    display: block;
    font-size: var(--font-size-sm);
    font-weight: var(--weight-medium, 500);
    color: var(--text-primary);
    margin-bottom: var(--space-sm);
  }
  .modal-field textarea, .modal-field select {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border-default);
    border-radius: var(--radius-lg);
    font-size: var(--font-size-base);
    font-family: inherit;
    background: var(--bg-card);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .modal-field textarea { min-height: 120px; resize: vertical; line-height: var(--line-height-relaxed); }
  .modal-field textarea:focus, .modal-field select:focus {
    border-color: var(--primary-500);
    box-shadow: 0 0 0 4px rgba(24, 144, 255, 0.12);
    outline: none;
  }
  .detail-row {
    display: flex;
    gap: var(--space-md);
    padding: 10px 0;
    border-bottom: 1px solid var(--border-light);
    font-size: var(--font-size-sm);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: var(--text-tertiary); min-width: 76px; flex-shrink: 0; }
  .detail-value { color: var(--text-primary); flex: 1; word-break: break-all; }
  .empty-state {
    padding: var(--space-2xl) 0;
    text-align: center;
    color: var(--text-tertiary);
    font-size: var(--font-size-sm);
  }
</style>
</head>
<body data-active-menu="mobile-ops" data-active-submenu="expert-reply">

<div class="main-wrapper">
  <div class="tab-bar">
    <div class="tab-bar-actions">
      <button class="tab-close-all" title="关闭全部标签">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3L11 11M11 3L3 11"/>
        </svg>
      </button>
    </div>
  </div>

  <main class="main-content">
    <nav class="device-tabs" aria-label="移动端运营·用户服务">
      <a href="mb_staff_account.html">作业人员账号</a>
      <a href="mb_feedback_review.html">意见反馈审核</a>
      <a href="mb_expert_reply.html" class="active">专家咨询回复</a>
    </nav>
    <div class="page-header">
      <div>
        <div class="page-title">专家咨询回复</div>
      </div>
      <div class="page-actions">
        <button class="jg-btn" onclick="refreshList()">刷新</button>
      </div>
    </div>

    <!-- 统计区 -->
    <div class="stat-row">
      <div class="stat-card is-pending">
        <div class="stat-label">待回复</div>
        <div class="stat-value" id="statPending">0</div>
      </div>
      <div class="stat-card is-done">
        <div class="stat-label">已回复</div>
        <div class="stat-value" id="statReplied">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">累计提问</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
    </div>

    <!-- 搜索栏区 -->
    <div class="page-section search-section">
      <div class="search-bar">
        <select class="search-select" id="statusSelect">
          <option value="">全部状态</option>
          <option value="pending">待回复</option>
          <option value="replied">已回复</option>
        </select>
        <select class="search-select" id="expertSelect">
          <option value="">全部专家</option>
        </select>
        <input type="text" class="search-input" placeholder="搜索问题标题或描述..." id="searchInput">
        <div class="search-actions">
          <button class="jg-btn jg-btn-primary" onclick="refreshList()">搜索</button>
          <button class="jg-btn" onclick="resetFilter()">重置</button>
        </div>
      </div>
    </div>

    <!-- 数据列表区 -->
    <div class="page-section data-section">
      <div class="data-table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th class="checkbox-col" style="width:60px;">序号</th>
              <th>问题标题</th>
              <th style="width:120px;">指派专家</th>
              <th style="width:110px;">状态</th>
              <th style="width:110px;">提问人</th>
              <th style="width:140px;">提问时间</th>
              <th style="width:180px;">操作</th>
            </tr>
          </thead>
          <tbody id="questionBody"></tbody>
        </table>
      </div>
      <div id="emptyHint" class="empty-state" style="display:none;">暂无数据</div>
    </div>

    <!-- 专家名录 -->
    <div class="page-section data-section" style="margin-top:var(--space-lg);">
      <div style="padding:var(--space-lg) var(--space-xl);border-bottom:1px solid var(--border-light);">
        <div class="page-title" style="font-size:15px;">推荐专家</div>
      </div>
      <div style="padding:var(--space-lg) var(--space-xl);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--space-md);" id="expertDirectory"></div>
    </div>
  </main>
</div>

<!-- ===== 回复弹窗 ===== -->
<div class="modal-overlay" id="replyModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title">专家回复</h3>
      <button class="modal-close" onclick="closeReplyModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="detail-row">
        <div class="detail-label">问题标题</div>
        <div class="detail-value" id="replyQTitle"></div>
      </div>
      <div class="detail-row">
        <div class="detail-label">问题描述</div>
        <div class="detail-value" id="replyQDesc"></div>
      </div>
      <div class="detail-row">
        <div class="detail-label">提问时间</div>
        <div class="detail-value" id="replyQTime"></div>
      </div>
      <div class="detail-row">
        <div class="detail-label">提问人</div>
        <div class="detail-value" id="replyQUser"></div>
      </div>
      <div class="modal-field" style="margin-top:var(--space-lg);">
        <label>指派专家</label>
        <select id="replyExpert">
          <option value="">请选择专家</option>
        </select>
      </div>
      <div class="modal-field">
        <label>专家答复<span style="color:var(--error);">*</span></label>
        <textarea id="replyContent" placeholder="填写专家答复内容，移动端「我的提问」可见"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeReplyModal()">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="submitReply()">提交回复</button>
    </div>
  </div>
</div>

<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>

<!-- 严格空库模式：演示数据播种已停用，数据一律来自后端 API -->
<script src="js/shared/mobile-ops-store.js"></script>
<script src="../common/js/api.js"></script>
<script>
/* ============================================================
 * 专家咨询回复（移动端运营 · 用户服务）
 * 【严格空库模式】咨询列表一律来自后端 API（GET /api/mb_expert_consult），
 *   不再使用任何本地演示种子 / 假数据兜底。专家名录取自已桥接真实后端的
 *   MobileOpsStore 作业人员账号，答复仍沿用该 Store 写链路。
 *   status 枚举：pending 待回复 / replied 已回复
 * ============================================================ */

var CONSULT_RESOURCE = 'mb_expert_consult';
var consultRows = [];

// 数据库字段(snake_case) -> 页面视图字段映射
function mapConsultRow(row) {
  return {
    id: row.id,
    title: row.title || '',
    desc: row.content || '',
    status: row.status || 'pending',
    time: row.question_time || row.created_at || '',
    source: row.source || 'mobile',
    operator: row.questioner || row.operator || '',
    operatorId: '',
    expert: '',
    reply: row.expert_reply || '',
    replyTime: row.reply_time || '',
    replyBy: row.operator || ''
  };
}

// 列表三态：加载中 / 暂无数据 / 失败
function setConsultStatus(text, isError) {
  var body = document.getElementById('questionBody');
  var hint = document.getElementById('emptyHint');
  if (hint) hint.style.display = 'none';
  if (body) body.innerHTML = '<tr><td colspan="99" style="text-align:center;padding:32px;color:' +
    (isError ? '#cf1322' : 'var(--text-tertiary)') + ';">' + esc(text) + '</td></tr>';
}

// 异步取数：成功后渲染，无数据显示暂无数据，失败显示错误提示
function loadConsultations() {
  if (!window.Api) { setConsultStatus('数据加载失败：接口未就绪', true); return; }
  setConsultStatus('正在加载数据...', false);
  Api.get(CONSULT_RESOURCE, { page: 1, size: 500 }).then(function (r) {
    if (!r || !r.ok) {
      setConsultStatus('数据加载失败：' + ((r && r.message) || '请求异常'), true);
      return;
    }
    var list = (r.data && r.data.list) || [];
    consultRows = list.map(mapConsultRow);
    renderTable();
  }).catch(function (e) {
    setConsultStatus('数据加载失败：' + (e && e.message ? e.message : '网络异常'), true);
  });
}

var STATUS_TEXT = {
  pending: '待回复',
  replied: '已回复'
};

/* 严格空库模式：删除写死的兜底专家名录，专家一律取自后端桥接的作业人员账号 */
var currentId = null;

function expertList() {
  var staff = MobileOpsStore.list('staff').filter(function (s) {
    return s.isExpert && s.status !== 'disabled';
  });
  return staff.map(function (s) {
    return {
      name: s.name,
      title: s.role === '管理员' ? '平台技术专家' : s.role,
      tags: s.expertTitle || '农技咨询'
    };
  });
}

function readList() {
  return consultRows;
}

function writeList(list) {
  if (!MobileOpsStore.writeList(MobileOpsStore.KEYS.expertQuestions, list)) {
    Toast.error('本地存储写入失败，答复未能保存');
  }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function renderStats(list) {
  var pending = 0, replied = 0;
  list.forEach(function (q) {
    if (q.status === 'replied') replied++;
    else pending++;
  });
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statReplied').textContent = replied;
  document.getElementById('statTotal').textContent = list.length;
}

function filteredList() {
  var status = document.getElementById('statusSelect').value;
  var expert = document.getElementById('expertSelect').value;
  var kw = document.getElementById('searchInput').value.trim().toLowerCase();

  return readList().filter(function (q) {
    if (status && q.status !== status) return false;
    if (expert && q.expert !== expert) return false;
    if (kw) {
      var hay = ((q.title || '') + ' ' + (q.desc || '')).toLowerCase();
      if (hay.indexOf(kw) === -1) return false;
    }
    return true;
  });
}

function renderTable() {
  var list = filteredList();
  renderStats(readList());

  var body = document.getElementById('questionBody');
  var emptyHint = document.getElementById('emptyHint');

  if (!list.length) {
    body.innerHTML = '';
    emptyHint.style.display = 'block';
    return;
  }
  emptyHint.style.display = 'none';

  body.innerHTML = list.map(function (q, i) {
    var extra = q.reply
      ? '<div class="reply-box"><div class="reply-by">' + esc(q.expert || '专家') + ' · ' + esc(q.replyTime || '') + '</div>' + esc(q.reply) + '</div>'
      : '';
    return '<tr>' +
      '<td class="checkbox-col">' + (i + 1) + '</td>' +
      '<td><div class="cell-title">' + esc(q.title) + '</div>' +
          '<div class="cell-sub">' + esc(q.desc) + '</div>' + extra + '</td>' +
      '<td>' + (q.expert ? esc(q.expert) : '<span style="color:var(--text-tertiary);">未指派</span>') + '</td>' +
      '<td><span class="status-tag ' + esc(q.status) + '">' + (STATUS_TEXT[q.status] || q.status) + '</span></td>' +
      '<td>' + esc(q.operator || '移动端用户') +
          '<div class="cell-sub" style="font-size:11px;">' + esc(MobileOpsStore.SOURCE_TEXT[q.source || 'mobile']) + '</div></td>' +
      '<td class="text-mono">' + esc(q.time || '') + '</td>' +
      '<td><div class="action-btns">' +
        '<button class="action-btn detail" onclick="openReply(\'' + q.id + '\')">' + (q.status === 'replied' ? '补充回复' : '回复') + '</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

function refreshList() {
  renderTable();
}

function resetFilter() {
  document.getElementById('statusSelect').value = '';
  document.getElementById('expertSelect').value = '';
  document.getElementById('searchInput').value = '';
  renderTable();
}

function openReply(id) {
  var list = readList();
  var target = null;
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].id) === String(id)) { target = list[i]; break; }
  }
  if (!target) { Toast.error('未找到该提问记录'); return; }

  currentId = target.id;
  document.getElementById('replyQTitle').textContent = target.title || '';
  document.getElementById('replyQDesc').textContent = target.desc || '';
  document.getElementById('replyQTime').textContent = target.time || '';
  document.getElementById('replyQUser').textContent =
    (target.operator || '移动端用户') + ' · ' + (MobileOpsStore.SOURCE_TEXT[target.source || 'mobile']);
  document.getElementById('replyExpert').value = target.expert || '';
  document.getElementById('replyContent').value = target.reply || '';

  document.getElementById('replyModal').classList.add('show');
}

function closeReplyModal() {
  document.getElementById('replyModal').classList.remove('show');
  currentId = null;
}

function submitReply() {
  var expert = document.getElementById('replyExpert').value;
  var reply = document.getElementById('replyContent').value.trim();

  if (!expert) { Toast.warning('请指派专家'); return; }
  if (!reply) { Toast.warning('请填写专家答复'); return; }

  var list = readList();
  var target = null;
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].id) === String(currentId)) { target = list[i]; break; }
  }
  if (!target) { Toast.error('未找到该提问记录'); return; }

  target.expert = expert;
  target.reply = reply;
  target.replyTime = MobileOpsStore.now();
  target.replyBy = MobileOpsStore.operatorName();
  target.status = 'replied';

  writeList(list);
  MobileOpsStore.audit('回复专家咨询', 'expertQuestions', target.id, expert + '：' + reply.slice(0, 40));
  closeReplyModal();
  renderTable();
  Toast.success('答复已保存，移动端可查看');
}

function renderExpertDirectory() {
  var box = document.getElementById('expertDirectory');
  if (!box) return;
  var list = expertList();
  if (!list.length) {
    box.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-tertiary);font-size:13px;">暂无数据</div>';
    return;
  }
  box.innerHTML = list.map(function (e) {
    return '<div class="expert-card">' +
      '<div class="expert-avatar">' + esc(String(e.name).slice(0, 1)) + '</div>' +
      '<div>' +
        '<div class="expert-name">' + esc(e.name) + '</div>' +
        '<div class="expert-tags">' + esc(e.title) + ' · ' + esc(e.tags) + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function renderExpertOptions() {
  var list = expertList();
  var filterSel = document.getElementById('expertSelect');
  var replySel = document.getElementById('replyExpert');
  var keep = filterSel.value;
  filterSel.innerHTML = '<option value="">全部专家</option>' + list.map(function (e) {
    return '<option value="' + esc(e.name) + '">' + esc(e.name) + '</option>';
  }).join('');
  filterSel.value = keep;
  replySel.innerHTML = '<option value="">请选择专家</option>' + list.map(function (e) {
    return '<option value="' + esc(e.name) + '">' + esc(e.name) + '（' + esc(e.tags) + '）</option>';
  }).join('');
}

document.addEventListener('DOMContentLoaded', function () {
  MobileOpsStore.ready();
  // 严格空库模式：演示数据播种已停用，数据一律来自后端 API
  renderExpertOptions();
  renderExpertDirectory();
  MobileOpsStore.subscribe(function (key) {
    if (key === MobileOpsStore.KEYS.expertQuestions) renderTable();
    if (key === MobileOpsStore.KEYS.staff) {
      renderExpertOptions();
      renderExpertDirectory();
    }
  });
  document.getElementById('searchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') renderTable();
  });
  // 严格空库模式：列表由后端 API 异步取数并渲染三态
  loadConsultations();
});
</script>
</body>
</html>
