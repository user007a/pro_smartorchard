<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 农事记录</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
  <link rel="stylesheet" href="css/page-content.css">
<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition: all 0.2s ease;
  }
  .module-card:hover {
    background: var(--bg-hover);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
</style>
</head>
<body data-active-menu="farming" data-active-submenu="farming-record">

<!-- ===== 整体布局容器 ===== -->
<div class="app-layout">

  <!-- ===== 侧边栏 ===== -->
  <nav class="sidebar" aria-label="主导航">
    <!-- 品牌区 -->
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <!-- 苹果绿 Logo SVG -->
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 3C8 1 5 3 5 6.5C5 10 8 14 11 17C14 14 17 10 17 6.5C17 3 14 1 11 3Z" fill="rgba(34,168,74,0.2)"/>
          <path d="M11 5C9.5 4 7.5 5 7.5 7C7.5 9 9.5 12 11 14"/>
          <path d="M11 5C12.5 4 14.5 5 14.5 7C14.5 9 12.5 12 11 14"/>
          <path d="M11 3V1"/>
        </svg>
      </div>
      <span class="sidebar-brand-text">智慧果园</span>
    </div>

    <!-- 菜单主体（由 JS 动态渲染） -->
    <div class="sidebar-body"></div>

    <!-- 底部功能区 -->
    <div class="sidebar-footer">
      <button class="sidebar-footer-btn sidebar-collapse-btn" title="折叠侧边栏">
        <span class="collapse-icon">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 3L6 9L11 15"/><path d="M14 3V15"/>
          </svg>
        </span>
        <span class="btn-text">折叠</span>
      </button>
      <button class="sidebar-footer-btn" title="系统设置" id="btn-settings">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="9" r="2.5"/>
          <path d="M9 2V4M9 14V16M2 9H4M14 9H16M4.2 4.2L5.6 5.6M12.4 12.4L13.8 13.8M13.8 4.2L12.4 5.6M5.6 12.4L4.2 13.8"/>
        </svg>
        <span class="btn-text">设置</span>
      </button>
    </div>
  </nav>

  <!-- 移动端遮罩层 -->
  <div class="sidebar-overlay"></div>

  <!-- ===== 主内容区 ===== -->
  <div class="main-wrapper">

    <!-- 顶栏 -->
    <header class="topbar">
      <!-- 移动端汉堡菜单 -->
      <button class="topbar-hamburger" aria-label="打开导航菜单">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M3 6H19M3 11H19M3 16H19"/>
        </svg>
      </button>
      <!-- 右侧功能区 -->
      <div class="topbar-right">
        <!-- 通知铃铛 -->
        <button class="topbar-notification" title="消息通知">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 2C7 2 5 4.5 5 7.5V12L3 14H17L15 12V7.5C15 4.5 13 2 10 2Z"/>
            <path d="M8.5 16C8.5 17 9.2 18 10 18C10.8 18 11.5 17 11.5 16"/>
          </svg>
          <span class="badge">3</span>
        </button>

        <!-- 用户信息 -->
        <div class="topbar-user">
          <div class="topbar-user-avatar">张</div>
          <span class="topbar-user-name">张三</span>
          <span class="topbar-user-arrow">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;">
              <path d="M3 5L6 8L9 5"/>
            </svg>
          </span>
        </div>

        <!-- 用户下拉菜单 -->
        <div class="topbar-user-dropdown">
          <div class="dropdown-item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <circle cx="8" cy="5" r="3"/><path d="M2 15C2 11.5 5 10 8 10C11 10 14 11.5 14 15"/>
            </svg>
            个人中心
          </div>
          <div class="dropdown-item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <path d="M8 2V8L11 11"/><circle cx="8" cy="8" r="6"/>
            </svg>
            操作日志
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-item" style="color:var(--error);">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <path d="M6 2H3C2.45 2 2 2.45 2 3V13C2 13.55 2.45 14 3 14H6"/><path d="M10 11L14 8L10 5"/><path d="M14 8H6"/>
            </svg>
            退出登录
          </div>
        </div>
      </div>
    </header>

    <!-- Tab 标签栏 -->
    <div class="tab-bar">
      <!-- Tab 标签由 JS 动态渲染 -->
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
      <div class="content-wrapper">
        
        <!-- ===== 页面头部 ===== -->
        <div class="page-header">
          <div>
            <h1 class="page-title">农事记录</h1>
            <p class="page-subtitle">记录果园农事操作，支持审核和追溯管理</p>
          </div>
        </div>

        <!-- 统计卡片区 -->
        <div class="patrol-stats">
          <div class="patrol-stat-card green">
            <div class="stat-value">28</div>
            <div class="stat-label">记录总数</div>
          </div>
          <div class="patrol-stat-card orange">
            <div class="stat-value">3</div>
            <div class="stat-label">待审核</div>
          </div>
          <div class="patrol-stat-card blue">
            <div class="stat-value">22</div>
            <div class="stat-label">已完成</div>
          </div>
          <div class="patrol-stat-card purple">
            <div class="stat-value">3</div>
            <div class="stat-label">进行中</div>
          </div>
        </div>

        <!-- ===== 搜索栏区 ===== -->
        <div class="page-section search-section">
          <div class="search-bar">
            <select class="search-select" id="baseSelect">
              <option value="">选择基地</option>
              <option value="ytqx">烟台栖霞基地</option>
              <option value="whrc">威海荣成基地</option>
              <option value="qdlx">青岛莱西基地</option>
              <option value="zy">招远基地</option>
              <option value="pl">蓬莱阁基地</option>
            </select>
            <select class="search-select" style="min-width:120px;">
              <option value="">全部状态</option>
              <option value="pending">待审核</option>
              <option value="ongoing">进行中</option>
              <option value="completed">已完成</option>
              <option value="rejected">已退回</option>
            </select>
            <select class="search-select" style="min-width:120px;">
              <option value="">全部类型</option>
              <option value="fertilizer">施肥</option>
              <option value="pesticide">喷药</option>
              <option value="tool">修剪</option>
              <option value="irrigation">灌溉</option>
              <option value="other">其他</option>
            </select>
            <input type="date" class="search-input" id="startDate" placeholder="开始日期">
            <span class="date-separator">至</span>
            <input type="date" class="search-input" id="endDate" placeholder="结束日期">
            <input type="text" class="search-input" placeholder="搜索记录内容..." id="searchInput">
            <button class="jg-btn" onclick="handleSearch()">搜索</button>
          </div>
        </div>

        <!-- ===== 操作按钮区（搜索栏下、数据列表上）===== -->
        <div class="page-section action-bar">
          <button class="jg-btn jg-btn-primary" onclick="Modal.show('modal-add-record')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M12 5v14"/>
              <path d="M5 12h14"/>
            </svg>
            新建记录
          </button>
          <button class="jg-btn" onclick="Modal.show('modal-export')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" x2="12" y1="15" y2="3"/>
            </svg>
            导出记录
          </button>
        </div>

        <!-- ===== 数据列表区 ===== -->
        <div class="page-section data-section">
          <div class="data-table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width:40px;">
                    <input type="checkbox" style="width:16px;height:16px;">
                  </th>
                  <th style="width:100px;">记录编号</th>
                  <th style="width:140px;">所属基地</th>
                  <th style="width:80px;">地块</th>
                  <th style="width:100px;">农事类型</th>
                  <th style="width:90px;">执行人</th>
                  <th style="width:110px;">执行日期</th>
                  <th style="width:80px;">状态</th>
                  <th style="width:140px;">操作</th>
                </tr>
              </thead>
              <tbody id="dataTableBody">
              </tbody>
            </table>
          </div>
          <div id="pagination-container">
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- 新建记录模态框 -->
  <div id="modal-add-record" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">新建农事记录</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="form-add-record" class="modal-form">
          <div class="form-group">
            <label>所属基地</label>
            <select class="form-control">
              <option value="">请选择基地</option>
              <option value="ytqx">烟台栖霞基地</option>
              <option value="whrc">威海荣成基地</option>
              <option value="qdlx">青岛莱西基地</option>
              <option value="zy">招远基地</option>
              <option value="pl">蓬莱阁基地</option>
            </select>
          </div>
          <div class="form-group">
            <label>地块编号</label>
            <input type="text" class="form-control" placeholder="请输入地块编号">
          </div>
          <div class="form-group">
            <label>农事类型</label>
            <select class="form-control">
              <option value="">请选择类型</option>
              <option value="fertilizer">施肥</option>
              <option value="pesticide">喷药</option>
              <option value="tool">修剪</option>
              <option value="irrigation">灌溉</option>
              <option value="other">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label>执行人</label>
            <input type="text" class="form-control" placeholder="请输入执行人">
          </div>
          <div class="form-group">
            <label>执行日期</label>
            <input type="date" class="form-control">
          </div>
          <div class="form-group">
            <label>执行内容</label>
            <textarea class="form-control" rows="3" placeholder="请输入执行内容"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-add-record')">取消</button>
        <button class="jg-btn jg-btn-primary" onclick="submitAddRecord()">确定</button>
      </div>
    </div>
  </div>

  <!-- 导出记录模态框 -->
  <div id="modal-export" class="modal-overlay">
    <div class="modal-box" style="max-width: 420px;">
      <div class="modal-header">
        <h3 class="modal-title">导出记录</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p style="color: var(--text-secondary); margin-bottom: 16px;">请选择导出格式：</p>
        <div style="display: flex; gap: 12px;">
          <button class="jg-btn jg-btn-primary" onclick="exportRecord('excel')">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;margin-right:6px;">
              <path d="M10 2H2v16h16V8l-6-6z"/>
              <path d="M14 2v6h6M13 9H7M13 13H7M13 17H7"/>
            </svg>
            Excel格式
          </button>
          <button class="jg-btn" onclick="exportRecord('pdf')">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;margin-right:6px;">
              <path d="M10 2H2v16h16V8l-6-6z"/>
              <path d="M14 2v6h6M13 9H7M13 13H7M13 17H7"/>
            </svg>
            PDF格式
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-export')">关闭</button>
      </div>
    </div>
  </div>

  <!-- 详情模态框 -->
  <div id="modal-detail" class="modal-overlay">
    <div class="modal-box" style="max-width: 600px;">
      <div class="modal-header">
        <h3 class="modal-title">记录详情</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="detail-content">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div style="padding: 12px; background: var(--gray-50); border-radius: 8px;">
              <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px;">记录编号</div>
              <div id="detail-id" style="font-weight: 600;">REC-001</div>
            </div>
            <div style="padding: 12px; background: var(--gray-50); border-radius: 8px;">
              <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px;">所属基地</div>
              <div id="detail-base" style="font-weight: 600;">烟台栖霞基地</div>
            </div>
            <div style="padding: 12px; background: var(--gray-50); border-radius: 8px;">
              <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px;">地块编号</div>
              <div id="detail-plot" style="font-weight: 600;">D-001</div>
            </div>
            <div style="padding: 12px; background: var(--gray-50); border-radius: 8px;">
              <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px;">农事类型</div>
              <div id="detail-type" style="font-weight: 600;">施肥</div>
            </div>
            <div style="padding: 12px; background: var(--gray-50); border-radius: 8px;">
              <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px;">执行人</div>
              <div id="detail-executor" style="font-weight: 600;">李技术员</div>
            </div>
            <div style="padding: 12px; background: var(--gray-50); border-radius: 8px;">
              <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px;">执行日期</div>
              <div id="detail-date" style="font-weight: 600;">2024-03-05</div>
            </div>
          </div>
          <div style="margin-top: 16px; padding: 12px; background: var(--gray-50); border-radius: 8px;">
            <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px;">执行内容</div>
            <div id="detail-content-text" style="font-weight: 500;">完成春季施肥作业，使用复合肥，每亩用量50公斤。</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-detail')">关闭</button>
      </div>
    </div>
  </div>

  <!-- 编辑模态框 -->
  <div id="modal-edit" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">编辑农事记录</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="form-edit-record" class="modal-form">
          <div class="form-group">
            <label>所属基地</label>
            <select class="form-control" id="edit-base">
              <option value="ytqx" selected>烟台栖霞基地</option>
              <option value="whrc">威海荣成基地</option>
              <option value="qdlx">青岛莱西基地</option>
              <option value="zy">招远基地</option>
              <option value="pl">蓬莱阁基地</option>
            </select>
          </div>
          <div class="form-group">
            <label>地块编号</label>
            <input type="text" class="form-control" id="edit-plot" value="D-001">
          </div>
          <div class="form-group">
            <label>农事类型</label>
            <select class="form-control" id="edit-type">
              <option value="fertilizer" selected>施肥</option>
              <option value="pesticide">喷药</option>
              <option value="tool">修剪</option>
              <option value="irrigation">灌溉</option>
              <option value="other">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label>执行人</label>
            <input type="text" class="form-control" id="edit-executor" value="李技术员">
          </div>
          <div class="form-group">
            <label>执行日期</label>
            <input type="date" class="form-control" id="edit-date" value="2024-03-05">
          </div>
          <div class="form-group">
            <label>执行内容</label>
            <textarea class="form-control" rows="3" id="edit-content">完成春季施肥作业，使用复合肥，每亩用量50公斤。</textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-edit')">取消</button>
        <button class="jg-btn jg-btn-primary" onclick="submitEditRecord()">确定</button>
      </div>
    </div>
  </div>

  <!-- 审核模态框 -->
  <div id="modal-audit" class="modal-overlay">
    <div class="modal-box" style="max-width: 480px;">
      <div class="modal-header">
        <h3 class="modal-title">审核记录</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div style="margin-bottom: 16px;">
          <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px;">记录编号</div>
          <div id="audit-id" style="font-weight: 600; font-size: 16px;">REC-003</div>
        </div>
        <div class="form-group">
          <label>审核结果</label>
          <div style="display: flex; gap: 16px;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="radio" name="audit-result" value="approve" checked>
              <span>通过</span>
            </label>
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="radio" name="audit-result" value="reject">
              <span>退回</span>
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>审核意见</label>
          <textarea class="form-control" rows="3" placeholder="请输入审核意见"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-audit')">取消</button>
        <button class="jg-btn jg-btn-primary" onclick="submitAudit()">提交审核</button>
      </div>
    </div>
  </div>

</div>

<!-- 引入交互脚本 -->
<script src="js/sidebar-layout.js"></script>
<script src="js/common-functions.js"></script>
<script>
// 当前页面数据
var currentRecordId = '';

// 搜索功能
function handleSearch() {
  var keyword = document.getElementById('searchInput').value.trim();
  Toast.info('搜索功能已触发，关键词: ' + keyword);
}

// 显示详情
function showDetail(id) {
  currentRecordId = id;
  document.getElementById('detail-id').textContent = id;
  Modal.show('modal-detail');
}

// 获取状态标签
function getStatusTag(status) {
  const statusMap = {
    'completed': '<span class="status-tag normal">已完成</span>',
    'executing': '<span class="status-tag" style="background:#e6f7ff;color:#096dd9;border-color:#91d5ff;">进行中</span>',
    'pending': '<span class="status-tag warning">待审核</span>',
    'rejected': '<span class="status-tag danger">已退回</span>'
  };
  return statusMap[status] || statusMap['pending'];
}

// 获取操作按钮
function getActionButtons(item) {
  if (item.status === 'completed' || item.status === 'rejected') {
    return `<div class="action-btns">
      <button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>
      <button class="action-btn edit" onclick="showEdit('${item.id}')">编辑</button>
      <button class="action-btn delete" onclick="showDeleteConfirm('${item.id}')">删除</button>
    </div>`;
  } else if (item.status === 'executing') {
    return `<div class="action-btns">
      <button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>
      <button class="action-btn approve" onclick="showAudit('${item.id}')">审核</button>
    </div>`;
  } else {
    return `<div class="action-btns">
      <button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>
      <button class="action-btn approve" onclick="showAudit('${item.id}')">审核</button>
    </div>`;
  }
}

// 渲染表格行
function renderRow(item, index) {
  return `<tr>
    <td><input type="checkbox" style="width:16px;height:16px;"></td>
    <td><strong>${item.id}</strong></td>
    <td>${item.base}</td>
    <td>${item.plot}</td>
    <td><span class="type-tag ${item.type}">${item.typeName}</span></td>
    <td>${item.executor}</td>
    <td>${item.date}</td>
    <td>${getStatusTag(item.status)}</td>
    <td>${getActionButtons(item)}</td>
  </tr>`;
}

// 搜索功能
function handleSearch() {
  var keyword = document.getElementById('searchInput').value.trim();
  var base = document.getElementById('baseSelect').value;
  var type = document.getElementById('typeSelect').value;
  var status = document.getElementById('statusSelect').value;

  var filteredData = mockData.filter(item => {
    if (keyword && !item.id.includes(keyword)) return false;
    if (base && !item.base.includes(base)) return false;
    if (type && item.type !== type) return false;
    if (status && item.status !== status) return false;
    return true;
  });

  Pagination.updateData(filteredData);
  Toast.info('找到 ' + filteredData.length + ' 条记录');
}

// 显示编辑
function showEdit(id) {
  currentRecordId = id;
  Modal.show('modal-edit');
}

// 显示删除确认
function showDeleteConfirm(id) {
  currentRecordId = id;
  ConfirmDialog.show({
    title: '删除记录',
    message: '确定要删除记录 "' + id + '" 吗？此操作不可撤销。',
    onConfirm: function() {
      Toast.success('记录 "' + currentRecordId + '" 已删除');
    }
  });
}

// 显示审核
function showAudit(id) {
  currentRecordId = id;
  document.getElementById('audit-id').textContent = id;
  Modal.show('modal-audit');
}

// 提交新建记录
function submitAddRecord() {
  Toast.success('记录创建成功');
  Modal.hide('modal-add-record');
}

// 提交编辑记录
function submitEditRecord() {
  Toast.success('记录 "' + currentRecordId + '" 已更新');
  Modal.hide('modal-edit');
}

// 提交审核
function submitAudit() {
  var result = document.querySelector('input[name="audit-result"]:checked').value;
  var msg = result === 'approve' ? '审核通过' : '已退回';
  Toast.success('记录 "' + currentRecordId + '" ' + msg);
  Modal.hide('modal-audit');
}

// 导出记录
function exportRecord(format) {
  Toast.success('记录已导出为' + (format === 'excel' ? 'Excel' : 'PDF') + '格式');
  Modal.hide('modal-export');
}

  });
