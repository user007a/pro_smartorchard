<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">

<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition:all 0.2s ease;
  }
  .module-card:hover {
    background:var(--bg-hover);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }
  /* 追溯按钮 / 移动端来源标记 */
  .action-btn.trace { background:#f0f5ff; color:#2f54eb; }
  .action-btn.trace:hover { background:#d6e4ff; }
  .source-badge { display:inline-block; padding:1px 6px; border-radius:4px; font-size:10px; line-height:1.6; background:#e6f4ff; color:#0958d9; margin-left:4px; vertical-align:middle; }
  .trace-link { color:var(--primary-500); text-decoration:none; font-weight:500; }
  .trace-link:hover { text-decoration:underline; }
  .trace-code { font-family:Consolas,Monaco,monospace; font-size:12px; color:var(--text-secondary); }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">

            <input type="text" class="search-input" placeholder="搜索地块/内容/操作人..." id="searchInput">
            
          <div class="search-actions"><button class="jg-btn jg-btn-primary" onclick="handleSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button><button class="jg-btn" onclick="smartReset()">重置</button></div>
          </div>
        </div>

        <!-- ===== 操作按钮区（搜索栏下、数据列表上）===== -->
        <div class="page-section action-bar">
          <button class="jg-btn jg-btn-primary" onclick="Modal.show('modal-add-record')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">

  };

  setTxt('detail-plot', rec.plot);
  setTxt('detail-type', rec.typeName);
  setTxt('detail-executor', rec.executor);

// 获取状态标签
function getStatusTag(status) {
  const statusMap = {
    'completed': '<span class="status-tag normal">已完成</span>',
    'executing': '<span class="status-tag" style="background:var(--info-bg);color:var(--primary-600);border-color:var(--info-border);">进行中</span>',
    'pending': '<span class="status-tag warning">待审核</span>',
    'rejected': '<span class="status-tag danger">已退回</span>'
  };
  return statusMap[status] || statusMap['pending'];
}

// 获取操作按钮
function getActionButtons(item) {
  if (item.status === 'completed' || item.status === 'rejected') {
    return `<div class="action-btns">
      <button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>
      <button class="action-btn edit" onclick="showEdit('${item.id}')">编辑</button>
      <button class="action-btn delete" onclick="showDeleteConfirm('${item.id}')">删除</button>
    </div>`;
  } else if (item.status === 'executing') {
    return `<div class="action-btns">
      <button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>
      <button class="action-btn approve" onclick="showAudit('${item.id}')">审核</button>
    </div>`;
  } else {
    return `<div class="action-btns">
      <button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>
      <button class="action-btn approve" onclick="showAudit('${item.id}')">审核</button>
    </div>`;
  }
}

// 渲染表格行
function renderRow(item, index) {
  return `<tr>
    <td>${index + 1}</td>
    <td><strong>${item.id}</strong>${item.source === 'mobile' ? '<span class="source-badge">移动端</span>' : ''}</td>
    <td>${item.base}</td>
    <td>${item.plot}</td>
    <td><span class="type-tag ${item.type}">${item.typeName}</span></td>
    <td>${item.executor}</td>
    <td>${item.date}${item.time ? ' ' + item.time : ''}</td>
    <td>${getStatusTag(item.status)}</td>
    <td>${getActionButtons(item)}</td>
  </tr>`;
}

// 搜索功能
function handleSearch() {
  var keyword = document.getElementById('searchInput').value.trim();
  var base = document.getElementById('baseSelect').value;
  var type = document.getElementById('typeSelect').value;
  var status = document.getElementById('statusSelect').value;

  var source = (typeof allRecords !== 'undefined') ? allRecords : mockData;
  var filteredData = source.filter(item => {
    var hit = !keyword
      || String(item.id).includes(keyword)
      || String(item.executor || '').includes(keyword)
      || String(item.plot || '').includes(keyword)
      || String(item.remark || '').includes(keyword);   // 移动端现场记录备注
    if (!hit) return false;
    if (base && !item.base.includes(base)) return false;
    if (type && item.type !== type) return false;
    if (status && item.status !== status) return false;
    return true;
  });

  Pagination.updateData(filteredData);
  if (typeof Toast !== 'undefined') {
    Toast.show('找到 ' + filteredData.length + ' 条记录', 'info');
  }
}

// 显示编辑
function showEdit(id) {
  currentRecordId = id;
  const rec = (typeof allRecords !== 'undefined' ? allRecords : mockData).find(function(r){ return r.id === id; }) || {};
  const sel = document.getElementById('edit-executor');
  if (sel && rec.executor) {
    const opts = sel.options;
    for (let i = 0; i < opts.length; i++) {
      if (opts[i].value === rec.executor) { opts[i].selected = true; break; }
    }
  }
  Modal.show('modal-edit');
}

// 显示删除确认
function showDeleteConfirm(id) {
  currentRecordId = id;
  ConfirmDialog.show({
    title: '删除记录',
    message: '确定要删除记录 "' + id + '" 吗？此操作不可撤销。',
    onConfirm: function() {
      Toast.success('记录 "' + currentRecordId + '" 已删除');
    }
  });
}

// 显示审核
function showAudit(id) {

}

function submitAddRecord() {

// 提交审核
function submitAudit() {
  var result = document.querySelector('input[name="audit-result"]:checked').value;
  var msg = result === 'approve' ? '审核通过' : '已退回';
  Toast.success('记录 "' + currentRecordId + '" ' + msg);
  Modal.hide('modal-audit');
}

// 导出记录
function exportRecord(format) {
  Toast.success('记录已导出为' + (format === 'excel' ? 'Excel' : 'PDF') + '格式');
  Modal.hide('modal-export');
}

// 全部记录 = PC 端基础数据 + 移动端现场作业数据（FLOW-004 跨端闭环）
var allRecords = [];

// 初始化分页
document.addEventListener('DOMContentLoaded', function() {
  var mobileRecords = (typeof MobileBridge !== 'undefined') ? MobileBridge.farmingRecords() : [];
  // 移动端现场记录优先展示（按执行日期倒序），保证新提交记录在首页可见
  allRecords = mobileRecords.concat(mockData).sort(function(a, b) {
    var ad = (a.date || '') + (a.time || '');
    var bd = (b.date || '') + (b.time || '');
    return bd < ad ? -1 : (bd > ad ? 1 : 0);
  });

  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: allRecords,
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderRow
  });

  if (mobileRecords.length > 0 && typeof Toast !== 'undefined') {
    Toast.show('已加载移动端现场记录 ' + mobileRecords.length + ' 条', 'info');
  }
});
