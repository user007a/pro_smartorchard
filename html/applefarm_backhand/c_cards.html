<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 布局框架演示</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
  <link rel="stylesheet" href="css/page-content.css">
<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition: all 0.2s ease;
  }
  .module-card:hover {
    background: var(--bg-hover);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
</style>
</head>
<body>

<!-- ===== 整体布局容器 ===== -->
<div class="app-layout">

  <!-- ===== 侧边栏 ===== -->
  <nav class="sidebar" aria-label="主导航">
    <!-- 品牌区 -->
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <!-- 苹果绿 Logo SVG -->
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 3C8 1 5 3 5 6.5C5 10 8 14 11 17C14 14 17 10 17 6.5C17 3 14 1 11 3Z" fill="rgba(34,168,74,0.2)"/>
          <path d="M11 5C9.5 4 7.5 5 7.5 7C7.5 9 9.5 12 11 14"/>
          <path d="M11 5C12.5 4 14.5 5 14.5 7C14.5 9 12.5 12 11 14"/>
          <path d="M11 3V1"/>
        </svg>
      </div>
      <span class="sidebar-brand-text">智慧果园</span>
    </div>

    <!-- 菜单主体（由 JS 动态渲染） -->
    <div class="sidebar-body"></div>

    <!-- 底部功能区 -->
    <div class="sidebar-footer">
      <button class="sidebar-footer-btn sidebar-collapse-btn" title="折叠侧边栏">
        <span class="collapse-icon">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 3L6 9L11 15"/><path d="M14 3V15"/>
          </svg>
        </span>
        <span class="btn-text">折叠</span>
      </button>
      <button class="sidebar-footer-btn" title="系统设置" id="btn-settings">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="9" r="2.5"/>
          <path d="M9 2V4M9 14V16M2 9H4M14 9H16M4.2 4.2L5.6 5.6M12.4 12.4L13.8 13.8M13.8 4.2L12.4 5.6M5.6 12.4L4.2 13.8"/>
        </svg>
        <span class="btn-text">设置</span>
      </button>
    </div>
  </nav>

  <!-- 移动端遮罩层 -->
  <div class="sidebar-overlay"></div>

  <!-- ===== 主内容区 ===== -->
  <div class="main-wrapper">

    <!-- 顶栏 -->
    <header class="topbar">
      <!-- 移动端汉堡菜单 -->
      <button class="topbar-hamburger" aria-label="打开导航菜单">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M3 6H19M3 11H19M3 16H19"/>
        </svg>
      </button>
      <!-- 右侧功能区 -->
      <div class="topbar-right">
        <!-- 通知铃铛 -->
        <button class="topbar-notification" title="消息通知">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 2C7 2 5 4.5 5 7.5V12L3 14H17L15 12V7.5C15 4.5 13 2 10 2Z"/>
            <path d="M8.5 16C8.5 17 9.2 18 10 18C10.8 18 11.5 17 11.5 16"/>
          </svg>
          <span class="badge">3</span>
        </button>

        <!-- 用户信息 -->
        <div class="topbar-user">
          <div class="topbar-user-avatar">张</div>
          <span class="topbar-user-name">张三</span>
          <span class="topbar-user-arrow">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;">
              <path d="M3 5L6 8L9 5"/>
            </svg>
          </span>
        </div>

        <!-- 用户下拉菜单 -->
        <div class="topbar-user-dropdown">
          <div class="dropdown-item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <circle cx="8" cy="5" r="3"/><path d="M2 15C2 11.5 5 10 8 10C11 10 14 11.5 14 15"/>
            </svg>
            个人中心
          </div>
          <div class="dropdown-item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <path d="M8 2V8L11 11"/><circle cx="8" cy="8" r="6"/>
            </svg>
            操作日志
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-item" style="color:var(--error);">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <path d="M6 2H3C2.45 2 2 2.45 2 3V13C2 13.55 2.45 14 3 14H6"/><path d="M10 11L14 8L10 5"/><path d="M14 8H6"/>
            </svg>
            退出登录
          </div>
        </div>
      </div>
    </header>

    <!-- Tab 标签栏 -->
    <div class="tab-bar">
      <!-- Tab 标签由 JS 动态渲染 -->
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
<div class="snzg-stat-card orange" onclick="window.location.href='farming_plan.html'"><div class="metric-header"><span class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><p ath d="M222168"></path><p ath d="M202h2v20h-2"></path></svg></span><span class="metric-label">进行中计划</span></div><div class="metric-value">12<span class="metric-unit">个</span></div><div class="metric-footer"><span class="metric-trendup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><p olyline points="23613.515.58.510.5118"></polyline><p olyline points="1762362312"></polyline></svg>3个</span><span class="metric-sub">较上周</span></div></div><div class="snzg-stat-card red" onclick="window.location.href='material_info.html'"><div class="metric-header"><span class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><p ath d="m7.54.2795.15"></path><p ath d="M218a22001-11.73l-74a22001-20l-7-4A2200138V6a220011-1.73l7-4a2200120l74A22001216z"></path></svg></span><span class="metric-label">农资库存</span></div><div class="metric-value">156<span class="metric-unit">种</span></div><div class="metric-footer"><span class="metric-trenddown"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><p olyline points="231813.58.58.513.516"></polyline><p olyline points="171823182312"></polyline></svg>12种</span><span class="metric-sub">需补充</span></div></div><div class="snzg-stat-card purple" onclick="window.location.href='device_monitor.html'"><div class="metric-header"><span class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><rect width="20" height="4"x="2"y="18" rx="2"></rect><p ath d="M21272"></path><p ath d="m7125-10"></path><p ath d="m12125-10"></path></svg></span><span class="metric-label">设备在线</span></div><div class="metric-value">28<span class="metric-unit">台</span></div><div class="metric-footer"><span class="metric-trendup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><p olyline points="23613.515.58.510.5118"></polyline><p olyline points="1762362312"></polyline></svg>95%</span><span class="metric-sub">在线率</span></div></div><div class="snzg-stat-card yellow" onclick="window.location.href='adoption_tree.html'"><div class="metric-header"><span class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><p ath d="M1222v-7"></path><p ath d="M1713H7"></path><p ath d="M186H6"></path></svg></span><span class="metric-label">认养果树</span></div><div class="metric-value">86<span class="metric-unit">棵</span></div><div class="metric-footer"><span class="metric-trendup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><p olyline points="23613.515.58.510.5118"></polyline><p olyline points="1762362312"></polyline></svg>+15</span><span class="metric-sub">本月新增</span></div></div></div>

</main>
  </div>

</div>

<!-- 引入交互脚本 -->
<script src="js/sidebar-layout.js"></script>

<!-- 已通过质量审查（第2轮修正）- 严过审 2025-01-18 -->
  <script src="js/iframe-hide.js"></script>
</body>
</html>
