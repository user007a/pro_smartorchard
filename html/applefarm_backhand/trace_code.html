<style>
  .modal-overlay {
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0, 0, 0, 0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    opacity:0;
    visibility:hidden;
    transition:all 0.3s ease;
  }
  .modal-overlay.active {
    opacity:1;
    visibility:visible;
  }
  .modal {
    background:var(--bg-card);
    border-radius:16px;
    width:520px;
    max-width:90vw;
    max-height:90vh;
    overflow:hidden;
    transform:scale(0.9);
    transition:all 0.3s ease;
  }
  .modal-overlay.active .modal {
    transform:scale(1);
  }
  .modal-header {
    padding:20px 24px;
    border-bottom:1px solid var(--border-default);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(135deg, #1890ff 0%, #1a8a3a 100%);
    color:var(--text-inverse);
  }
  .modal-header h3 {
    font-size:18px;
    font-weight:600;
    margin:0;
  }
  .modal-close {
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
    border:none;
    color:var(--text-inverse);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.2s;
  }
  .modal-close:hover {
    background:rgba(255,255,255,0.3);
  }
  .modal-body {
    padding:24px;
    max-height:60vh;
    overflow-y:auto;
  }
  .modal-footer {
    padding:16px 24px;
    border-top:1px solid var(--border-default);
    display:flex;
    justify-content:flex-end;
    gap:12px;
  }
  .detail-grid {
    display:grid;
    grid-template-columns:120px 1fr;
    gap:12px;
    padding:8px 0;
    border-bottom:1px solid var(--border-light);
  }
  .detail-grid:last-child {
    border-bottom:none;
  }
  .detail-label {
    color:var(--text-tertiary);
    font-size:14px;
  }
  .detail-value {
    color:var(--text-primary);
    font-size:14px;
    font-weight:500;
  }
  .qrcode-container {
    text-align:center;
    padding:24px;
    background:#f8faf8;
    border-radius:12px;
    margin:16px 0;
  }
  .qrcode-box {
    width:180px;
    height:180px;
    background:var(--bg-card);
    border-radius:12px;
    margin:0 auto 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid var(--border-primary);
    overflow:hidden;
  }
  .qrcode-placeholder {
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--primary-500);
  }
  .qrcode-code {
    font-size:16px;
    font-weight:600;
    color:var(--text-primary);
    margin-bottom:8px;
  }
  .qrcode-hint {
    font-size:12px;
    color:var(--text-tertiary);
  }
  .generate-form {
    display:grid;
    gap:16px;
  }
  .form-group {
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .form-group label {
    font-size:14px;
    font-weight:500;
    color:var(--text-primary);
  }
  .form-group input,
  .form-group select {
    padding:10px 14px;
    border:1px solid var(--border-default);
    border-radius:8px;
    font-size:14px;
    transition:all 0.2s;
  }
  .form-group input:focus,
  .form-group select:focus {
    outline:none;
    border-color:var(--border-primary);
    box-shadow:0 0 0 3px rgba(24,144,255,0.1);
  }
  .form-row {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .qrcode-url {
    margin-top:10px;
    font-size:12px;
    color:var(--text-tertiary);
    word-break:break-all;
    font-family:var(--font-mono, monospace);
  }
  .form-hint { font-size:12px; color:var(--text-tertiary); }
  .chain-box { background:#f8faf8; border-radius:12px; padding:16px 20px; margin-bottom:16px; }
  .chain-title { font-weight:600; color:var(--text-primary); font-size:14px; margin-bottom:10px; }
  .chain-list { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .chain-node { background:var(--bg-card); border:1px solid var(--border-default); border-radius:8px; padding:6px 12px; font-size:13px; color:var(--text-secondary); }
  .chain-node.hl { border-color:#1890ff; color:#1890ff; font-weight:500; }
  .chain-arrow { color:var(--text-tertiary); font-size:13px; }
  .toast {
    position:fixed;
    top:20px;
    right:20px;
    padding:14px 20px;
    background:var(--bg-card);
    border-radius:10px;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
    display:flex;
    align-items:center;
    gap:12px;
    z-index:2000;
    transform:translateX(120%);
    transition:all 0.3s ease;
  }
  .toast.show {
    transform:translateX(0);
  }
  .toast.success {
    border-left:4px solid var(--border-primary);
  }
  .toast-icon {
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--gray-100);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--primary-500);
  }
</style>

function buildH5Url(code) { return TraceStore.shortUrlOf(code); }
function buildPreviewUrl(code) { return H5_TRACE_PAGE + '?code=' + encodeURIComponent(code); }

let currentDetailCode = '';

// 按批次号取批次信息（批次真源与批次管理页共用）
function getBatchInfo(batchNo) {
  const src = getBatchSource();
  return src.find(b => b.batchNo === batchNo) || { batchNo: batchNo, plotCode: '-', plotName: '-', base: '-', product: '-', spec: '-' };
}
function enrichCode(item) {
  const b = getBatchInfo(item.batch);
  return Object.assign({}, item, {
    product: b.product,
    spec: b.spec,
    base: b.base,
    plotCode: b.plotCode,
    plotName: b.plotName,
    statusText: STATUS_TEXT[item.status] || item.status
  });
}

/* ---------- 分页组件（与农事计划、批次管理一致） ---------- */
const Pagination = {
  currentPage: 1, pageSize: 10, filteredData: [],
  containerId: 'pagination-container', tbodyId: 'dataTableBody', renderRow: null,
  init: function(options) {
    this.currentPage = options.currentPage || 1;
    this.pageSize = options.pageSize || 10;
    this.filteredData = options.data || [];
    this.containerId = options.containerId || 'pagination-container';
    this.tbodyId = options.tbodyId || 'dataTableBody';
    this.renderRow = options.renderRow || null;
    this.render();
  },
  renderTable: function() {
    const tbody = document.getElementById(this.tbodyId);
    if (!tbody || !this.renderRow) return;
    const start = (this.currentPage - 1) * this.pageSize;
    const pageData = this.filteredData.slice(start, start + this.pageSize);
    tbody.innerHTML = pageData.map((item, i) => this.renderRow(item, start + i + 1)).join('');
  },
  render: function() {
    const container = document.getElementById(this.containerId);
    if (!container) return;
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    let html = '<div class="pagination">';
    html += `<button class="page-btn ${this.currentPage <= 1 ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage - 1})">‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= this.currentPage - 1 && i <= this.currentPage + 1)) {
        html += `<button class="page-btn ${i === this.currentPage ? 'active' : ''}" onclick="Pagination.goToPage(${i})">${i}</button>`;
      } else if (i === this.currentPage - 2 || i === this.currentPage + 2) {
        html += '<span class="page-ellipsis" style="padding:0 8px;color:#6b7b6b;">...</span>';
      }
    }
    html += `<button class="page-btn ${this.currentPage >= totalPages ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage + 1})">›</button>`;
    html += `<span style="margin-left:16px;font-size:13px;color:#6b7b6b;">第 ${this.currentPage} 页/共 ${totalPages} 页，共 ${this.filteredData.length} 条记录</span>`;
    html += '</div>';
    container.innerHTML = html;
    this.renderTable();
  },
  goToPage: function(page) {
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    if (page < 1 || page > totalPages) return;
    this.currentPage = page;
    this.render();
  },
  updateData: function(data) {
    this.filteredData = data;
    this.currentPage = 1;
    this.render();
  }
};

// 渲染表格行
function renderCodeRow(item, seq) {
  const c = enrichCode(item);
  return `
    <tr data-id="${c.code}">
      <td>${seq}</td>
      <td><strong>${c.code}</strong></td>
      <td>${c.batch}</td>
      <td>${c.product}</td>
      <td>${c.base} / ${c.plotCode} ${c.plotName}</td>
      <td>${c.time}</td>
      <td><span class="status-tag ${c.status === 'active' ? 'active' : c.status === 'expired' ? 'error' : 'inactive'}">${c.statusText}</span></td>
      <td>${c.order || '—'}</td>
      <td>
        <div class="action-btns">
          <button class="action-btn detail" onclick="viewDetail('${c.code}')">详情</button>
          <button class="action-btn" onclick="goBlockchain('${c.code}')">上链</button>

}

// 搜索
function searchData() {
  const batch = document.getElementById('batchSelect').value;
  const code = document.getElementById('codeInput').value.trim().toLowerCase();
  const status = document.getElementById('statusSelect').value;

  const filtered = allCodes().filter(item => {
    if (batch && item.batch !== batch) return false;
    if (code && !item.code.toLowerCase().includes(code)) return false;
    if (status && item.status !== status) return false;
    return true;
  });

  Pagination.updateData(filtered);
  showToast(`找到 ${filtered.length} 条记录`);
}

function resetSearch() {
  document.getElementById('batchSelect').value = '';
  document.getElementById('codeInput').value = '';
  document.getElementById('statusSelect').value = '';
  Pagination.updateData(allCodes());
  showToast('已重置筛选条件');
}

// 状态标签样式
function statusTagClass(status) {
  return status === 'active' ? 'active' : status === 'expired' ? 'error' : 'inactive';
}

// 跳转至溯源区块链页面并自动打开详情弹窗
function goBlockchain(code) {
  // 通过 URL 参数传递 code，目标页加载后会自动打开对应详情
  const url = 'trace_blockchain.html?code=' + encodeURIComponent(code);
  // 优先通过父级 openPage 切换（保持在主框架中），否则直接跳转
  if (window.parent && typeof window.parent.openPage === 'function') {
    window.parent.openPage(url, '区块链存证');
  } else {
    window.location.href = url;
  }
}

function inspectBadgeForCode(gate) {
  if (gate.hasValid) return '<span class="status-tag active">有效</span>';
  if (!gate.latest) return '<span class="status-tag inactive">缺失</span>';
  const map = { expired: '已过期', revoked: '已撤销', invalid: '不合格', pending: '待出报告' };
  return `<span class="status-tag inactive">${map[gate.latest.status] || '待补录'}</span>`;
}

// 显示二维码（优先本地生成真实二维码，失败回退二维码接口）
function showQRCode(code) {
  currentDetailCode = code;
  const url = buildH5Url(code);
  document.getElementById('qrcodeValue').textContent = code;
  document.getElementById('qrcodeUrl').textContent = url;

  const holder = document.getElementById('qrcodeCanvas');
  const img = document.getElementById('qrcodeImg');
  const ph = document.getElementById('qrcodePlaceholder');
  holder.innerHTML = '';
  holder.style.display = 'none';
  img.style.display = 'none';
  ph.style.display = 'none';

  let rendered = false;
  try {
    if (typeof QRCode === 'function') {
      new QRCode(holder, {
        text: url,
        width: 180,
        height: 180,
        colorDark: '#1f1f1f',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
      holder.style.display = 'flex';
      rendered = true;
    }
  } catch (e) { rendered = false; }

  if (!rendered) {
    img.style.display = 'none';
    img.onload = function() { img.style.display = 'block'; ph.style.display = 'none'; };
    img.onerror = function() { img.style.display = 'none'; ph.style.display = 'flex'; };
    img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data=' + encodeURIComponent(url);
  }

  openModal('qrcodeModal');
}

function openH5Page() {

}

function previewFromDetail() {
  const code = currentDetailCode;

// 选择批次后带出产品 / 规格 / 产地，并显示检测报告门禁
function syncBatchFields() {
  const batchNo = document.getElementById('generateBatch').value;
  const b = batchNo ? TraceStore.batch(batchNo) : null;
  document.getElementById('generateProduct').value = b ? b.product : '';
  document.getElementById('generateSpec').value = b ? b.spec : '';
  document.getElementById('generateOrigin').value = b ? `${b.base} / ${b.plotCode} ${b.plotName}` : '';
  const hint = document.getElementById('generateGateHint');
  const confirmBtn = document.getElementById('generateConfirmBtn');
  if (!batchNo) {
    hint.style.display = 'none';
    if (confirmBtn) confirmBtn.disabled = true;
    return;
  }
  const gate = TraceStore.inspectionState(batchNo);
  hint.style.display = 'block';
  hint.style.color = gate.canCode ? '#16a34a' : '#ef4444';
  hint.textContent = (gate.canCode ? '✓ ' : '✕ ') + gate.message +
    (gate.latest && gate.latest.reportNo ? `（${gate.latest.reportNo}）` : '');
  if (confirmBtn) {
    confirmBtn.disabled = !gate.canCode;
    confirmBtn.style.opacity = gate.canCode ? '1' : '0.5';
    confirmBtn.style.cursor = gate.canCode ? 'pointer' : 'not-allowed';
  }
}

// 确认生成（TraceStore 内部再次校验检测报告门禁）
function confirmGenerate() {
  const batchNo = document.getElementById('generateBatch').value;
  const count = Number(document.getElementById('generateCount').value);

  if (!batchNo) { showToast('请选择采收批次', 'error'); return; }
  if (!count || count < 1 || count > 200) { showToast('生成数量需在 1-200 之间', 'error'); return; }

  const template = document.getElementById('generateTemplate').value || '标准版履历模板';
  const res = TraceStore.generateCodes(batchNo, count, { template: template });
  if (!res.ok) { showToast(res.message || '生成失败', 'error'); return; }

  closeModal('generateModal');
  Pagination.updateData(allCodes());
  showToast(`已生成 ${count} 个追溯码，批次：${batchNo}`);
}

// 标签库存（与移动端「标签领用」共用同一份本地存储）
// T19 治理：库存扣减权归本打印环节，移动端只读库存 + 提交申请，不再本地扣减。
// 维护入口：本页打印扣减 + 后台「标签管理」库存管理弹窗改数。
const LABEL_RECORDS_KEY = 'smartorchard_label_records';

// 标签类型 / 库存统一由 TraceStore 提供（与标签管理页共用）
function labelTypeNames() {
  return Object.keys(TraceStore.stock());
}

// 打印批次号（用于把领用记录关联到本次打印批次）
let currentPrintBatchNo = '';

function readLabelStock() {
  const summary = TraceStore.stock();
  const out = {};
  Object.keys(summary).forEach(k => { out[k] = summary[k].stock; });
  return out;
}

function writeLabelStock(stock) {
  try {
    Object.keys(stock || {}).forEach(k => TraceStore.setStock(k, stock[k]));
    return true;
  } catch (e) {
    return false;
  }
}

/* 统一扣减入口：委托 TraceStore，同时释放领用预占 */
function consumeLabelStock(name, count) {
  const need = Math.floor(Number(count) || 0);
  if (!(need > 0)) return { ok: false, stock: null, message: '打印数量无效，未扣减库存' };
  const res = TraceStore.consumeStock(name, need);
  if (!res.ok) return { ok: false, stock: null, message: res.message };
  return { ok: true, stock: res.stock ? res.stock.stock : null };
}

/* T19：把本次打印关联到「同标签名 + 待打印」的领用记录，按 FIFO 推进状态
 * 返回本次打印推进的记录条数 */
function syncLabelRecordsAfterPrint(name, printedCount) {
  let records = [];
  try {
    const raw = localStorage.getItem(LABEL_RECORDS_KEY);
    if (raw) {
      const v = JSON.parse(raw);
      if (Array.isArray(v)) records = v;
    }
  } catch (e) { return 0; }

  // 领用记录为 unshift 写入（新的在前），此处按写入顺序取最早申请，保证 FIFO
  // 第一遍：确定本次打印实际覆盖的记录 id 集合
  let remain = Math.floor(Number(printedCount) || 0);
  const targetIds = [];
  for (let i = records.length - 1; i >= 0 && remain > 0; i--) {
    const r = records[i];
    if (!r || r.status !== 'pending') continue;
    if ((r.name || '') !== name) continue;
    const qty = Math.floor(Number(r.qty) || 0);
    if (!(qty > 0)) continue;

    remain -= Math.min(qty, remain);
    if (r.id != null) targetIds.push(r.id);
  }

  if (!targetIds.length) return 0;

  const stamp = new Date();
  const p = n => String(n).padStart(2, '0');
  const printTime = `${stamp.getFullYear()}-${p(stamp.getMonth() + 1)}-${p(stamp.getDate())} ${p(stamp.getHours())}:${p(stamp.getMinutes())}`;
  // 优先用当前筛选的溯源批次号关联，无筛选时用打印时间生成批次号
  const batchNo = currentPrintBatchNo || ('PT-' + p(stamp.getMonth() + 1) + p(stamp.getDate()) + '-' + p(stamp.getHours()) + p(stamp.getMinutes()));

  // 第二遍：按第一遍确定的 id 集合回写，保证覆盖的记录与扣减数量一致
  let done = 0;
  if (typeof MobileBridge !== 'undefined') {
    targetIds.forEach(function (id) {
      if (MobileBridge.updateRecord(LABEL_RECORDS_KEY, id, {
        status: '已打印',
        printTime: printTime,
        printBatch: batchNo,
        approveRemark: '后台打印环节已扣减库存'
      })) done++;
    });
  }
  return done;
}

function currentLabelType() {
  const sel = document.getElementById('labelTypeSelect');
  return sel && sel.value ? sel.value : (labelTypeNames()[0] || '');
}

function refreshLabelStock() {
  const name = currentLabelType();
  const s = name ? TraceStore.stock(name) : { stock: 0, reserved: 0, available: 0 };
  document.getElementById('labelStockInfo').textContent =
    `库存：${s.stock} 张 · 预占：${s.reserved} 张 · 可用：${s.available} 张`;
}

// 打印全部标签：按批次生成打印任务，统一扣减库存并记录任务
function printLabels() {
  const name = currentLabelType();
  const rows = Pagination.filteredData || [];
  const count = rows.length;
  currentPrintBatchNo = document.getElementById('batchSelect').value || '';

  if (!count) {
    showToast('当前没有可打印的追溯码', 'error');
    return;
  }
  if (!name) { showToast('请选择标签类型', 'error'); return; }

  // 按批次分组生成打印任务
  const groups = {};
  rows.forEach(function (r) {
    const b = r.batch || currentPrintBatchNo || '未关联批次';
    if (!groups[b]) groups[b] = [];
    groups[b].push(r.code);
  });

  let printed = 0, failed = '';
  Object.keys(groups).forEach(function (batchNo) {
    const res = TraceStore.createPrintJob({
      batchNo: batchNo,
      labelName: name,
      qty: groups[batchNo].length,
      operator: '管理员',
      codes: groups[batchNo]
    });
    if (res.ok) printed += groups[batchNo].length;
    else failed = res.message;
  });

  if (!printed) {
    showToast(failed || '打印失败', 'error');
    return;
  }

  const linked = syncLabelRecordsAfterPrint(name, printed);
  refreshLabelStock();
  showToast(`已打印 ${printed} 个标签，并生成打印任务` +
    (linked ? `；关联 ${linked} 条领用申请` : '') + (failed ? `；部分失败：${failed}` : ''));
}

function printSingleLabel() {
  const name = currentLabelType();
  if (!currentDetailCode) { showToast('请先选择追溯码', 'error'); return; }
  const rec = TraceStore.code(currentDetailCode);
  if (!rec) { showToast('追溯码不存在', 'error'); return; }
  currentPrintBatchNo = rec.batch;
  const res = TraceStore.createPrintJob({
    batchNo: rec.batch,
    labelName: name,
    qty: 1,
    operator: '管理员',
    codes: [rec.code]
  });
  if (!res.ok) { showToast(res.message || '打印失败', 'error'); return; }
  syncLabelRecordsAfterPrint(name, 1);
  refreshLabelStock();
  showToast(`已打印标签：${currentDetailCode}`);
  closeModal('detailModal');
}

// 下载二维码：优先导出本地生成的真实二维码，回退到二维码接口图片
function downloadQRCode() {
  if (!currentDetailCode) { showToast('请先在详情中查看二维码', 'error'); return; }
  const code = currentDetailCode;
  const holder = document.getElementById('qrcodeCanvas');
  const img = document.getElementById('qrcodeImg');
  const sourceCanvas = holder ? holder.querySelector('canvas') : null;

  function exportCanvas(canvas) {
    canvas.toBlob(function (blob) {
      if (!blob) { showToast('二维码生成失败', 'error'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `trace_${code}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 1500);
      showToast(`已导出二维码：${code}`);
    }, 'image/png');
  }

  if (sourceCanvas) {
    const out = document.createElement('canvas');
    const size = 360;
    out.width = size; out.height = size + 44;
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(sourceCanvas, (size - 300) / 2, 8, 300, 300);
    ctx.fillStyle = '#1f1f1f';
    ctx.font = 'bold 18px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('智慧果园溯源', size / 2, size + 4);
    ctx.font = '12px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#666';
    ctx.fillText(code, size / 2, size + 24);
    exportCanvas(out);
    return;
  }

  if (img && img.src && img.style.display !== 'none') {
    const out = document.createElement('canvas');
    const size = 360;
    out.width = size; out.height = size;
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
    try {
      ctx.drawImage(img, 0, 0, size, size);
      exportCanvas(out);
    } catch (e) {
      window.open(img.src, '_blank');
      showToast('浏览器限制跨域导出，已在新窗口打开二维码');
    }
    return;
  }

  showToast('请先生成二维码', 'error');
}

// 弹窗操作
function openModal(id) {
  document.getElementById(id).classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
  document.body.style.overflow = '';
}

// Toast提示
function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  document.getElementById('toastMessage').textContent = message;
  toast.className = `toast ${type}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// 页面初始化
document.addEventListener('DOMContentLoaded', function() {
  // 搜索栏批次下拉
  const batchSelect = document.getElementById('batchSelect');
  getBatchSource().forEach(b => {
    const opt = document.createElement('option');
    opt.value = b.batchNo;
    opt.textContent = `${b.batchNo} · ${b.product} · ${b.plotCode} ${b.plotName}`;
    batchSelect.appendChild(opt);
  });

  // 批次选择联动带出产品/规格/产地
  document.getElementById('generateBatch').addEventListener('change', syncBatchFields);

  // 标签类型下拉 + 库存显示
  const labelSelect = document.getElementById('labelTypeSelect');
  const types = labelTypeNames();
  labelSelect.innerHTML = types.map(t => `<option value="${t}">${t}</option>`).join('');
  // T19：由「标签管理 - 去打印」跳转过来时预选对应标签类型
  const presetLabel = new URLSearchParams(window.location.search).get('label');
  if (presetLabel && types.indexOf(presetLabel) >= 0) labelSelect.value = presetLabel;
  labelSelect.addEventListener('change', refreshLabelStock);
  refreshLabelStock();

  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: allCodes(),
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderCodeRow
  });

  TraceStore.subscribe(function () {
    Pagination.updateData(allCodes());
    refreshLabelStock();
  });

  // 由批次管理跳转过来时预选批次并打开生成弹窗
  const preset = new URLSearchParams(window.location.search).get('batch');
  if (preset) openGenerateModal(preset);
});

// 点击遮罩关闭弹窗
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeModal(overlay.id);
  });
});

// ESC 关闭弹窗
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.active').forEach(o => closeModal(o.id));
  }
});
