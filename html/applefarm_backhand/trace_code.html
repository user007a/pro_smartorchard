<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 溯源编码</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .modal-overlay {
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0, 0, 0, 0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    opacity:0;
    visibility:hidden;
    transition:all 0.3s ease;
  }
  .modal-overlay.active {
    opacity:1;
    visibility:visible;
  }
  .modal {
    background:var(--bg-card);
    border-radius:16px;
    width:520px;
    max-width:90vw;
    max-height:90vh;
    overflow:hidden;
    transform:scale(0.9);
    transition:all 0.3s ease;
  }
  .modal-overlay.active .modal {
    transform:scale(1);
  }
  .modal-header {
    padding:20px 24px;
    border-bottom:1px solid var(--border-default);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(135deg, #1890ff 0%, #1a8a3a 100%);
    color:var(--text-inverse);
  }
  .modal-header h3 {
    font-size:18px;
    font-weight:600;
    margin:0;
  }
  .modal-close {
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
    border:none;
    color:var(--text-inverse);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.2s;
  }
  .modal-close:hover {
    background:rgba(255,255,255,0.3);
  }
  .modal-body {
    padding:24px;
    max-height:60vh;
    overflow-y:auto;
  }
  .modal-footer {
    padding:16px 24px;
    border-top:1px solid var(--border-default);
    display:flex;
    justify-content:flex-end;
    gap:12px;
  }
  .detail-grid {
    display:grid;
    grid-template-columns:120px 1fr;
    gap:12px;
    padding:8px 0;
    border-bottom:1px solid var(--border-light);
  }
  .detail-grid:last-child {
    border-bottom:none;
  }
  .detail-label {
    color:var(--text-tertiary);
    font-size:14px;
  }
  .detail-value {
    color:var(--text-primary);
    font-size:14px;
    font-weight:500;
  }
  .qrcode-container {
    text-align:center;
    padding:24px;
    background:#f8faf8;
    border-radius:12px;
    margin:16px 0;
  }
  .qrcode-box {
    width:180px;
    height:180px;
    background:var(--bg-card);
    border-radius:12px;
    margin:0 auto 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid var(--border-primary);
    overflow:hidden;
  }
  .qrcode-placeholder {
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--primary-500);
  }
  .qrcode-code {
    font-size:16px;
    font-weight:600;
    color:var(--text-primary);
    margin-bottom:8px;
  }
  .qrcode-hint {
    font-size:12px;
    color:var(--text-tertiary);
  }
  .generate-form {
    display:grid;
    gap:16px;
  }
  .form-group {
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .form-group label {
    font-size:14px;
    font-weight:500;
    color:var(--text-primary);
  }
  .form-group input,
  .form-group select {
    padding:10px 14px;
    border:1px solid var(--border-default);
    border-radius:8px;
    font-size:14px;
    transition:all 0.2s;
  }
  .form-group input:focus,
  .form-group select:focus {
    outline:none;
    border-color:var(--border-primary);
    box-shadow:0 0 0 3px rgba(24,144,255,0.1);
  }
  .form-row {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .toast {
    position:fixed;
    top:20px;
    right:20px;
    padding:14px 20px;
    background:var(--bg-card);
    border-radius:10px;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
    display:flex;
    align-items:center;
    gap:12px;
    z-index:2000;
    transform:translateX(120%);
    transition:all 0.3s ease;
  }
  .toast.show {
    transform:translateX(0);
  }
  .toast.success {
    border-left:4px solid var(--border-primary);
  }
  .toast-icon {
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--gray-100);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--primary-500);
  }
</style>

<script>
// Mock数据 - 23条记录
const mockData = [
  { code: 'SNZG-2024-0001', batch: 'PC-20240515-01', product: '烟台红富士苹果', spec: '5kg/箱', time: '2024-05-15 10:30:00', status: 'used', order: 'ORD-20240515001' },

  { code: 'SNZG-2024-0003', batch: 'PC-20240517-03', product: '蓬莱苹果礼盒', spec: '8kg/盒', time: '2024-05-17 09:15:00', status: 'unused', order: '—' },
  { code: 'SNZG-2024-0004', batch: 'PC-20240518-04', product: '威海苹果汁', spec: '1L*6/箱', time: '2024-05-18 16:45:00', status: 'unused', order: '—' },
  { code: 'SNZG-2024-0005', batch: 'PC-20240520-05', product: '龙口苹果干', spec: '200g/袋', time: '2024-05-20 11:00:00', status: 'expired', order: '—' },
  { code: 'SNZG-2024-0006', batch: 'PC-20240521-06', product: '栖霞红将军苹果', spec: '5kg/箱', time: '2024-05-21 08:30:00', status: 'used', order: 'ORD-20240521001' },
  { code: 'SNZG-2024-0007', batch: 'PC-20240522-07', product: '牟平富士苹果', spec: '4kg/箱', time: '2024-05-22 15:20:00', status: 'used', order: 'ORD-20240522002' },
  { code: 'SNZG-2024-0008', batch: 'PC-20240523-08', product: '莱阳苹果醋', spec: '500ml*8/箱', time: '2024-05-23 10:45:00', status: 'unused', order: '—' },
  { code: 'SNZG-2024-0009', batch: 'PC-20240524-09', product: '海阳水晶苹果', spec: '6kg/箱', time: '2024-05-24 13:00:00', status: 'used', order: 'ORD-20240524001' },
  { code: 'SNZG-2024-0010', batch: 'PC-20240525-10', product: '福山苹果酱', spec: '300g/罐', time: '2024-05-25 09:30:00', status: 'unused', order: '—' },
  { code: 'SNZG-2024-0011', batch: 'PC-20240526-11', product: '长岛苹果脆片', spec: '150g/袋', time: '2024-05-26 14:15:00', status: 'used', order: 'ORD-20240526001' },
  { code: 'SNZG-2024-0012', batch: 'PC-20240527-12', product: '芝罘苹果饮料', spec: '330ml*12/箱', time: '2024-05-27 11:20:00', status: 'expired', order: '—' },
  { code: 'SNZG-2024-0013', batch: 'PC-20240528-13', product: '开发苹果酒', spec: '750ml/瓶', time: '2024-05-28 16:30:00', status: 'used', order: 'ORD-20240528001' },
  { code: 'SNZG-2024-0014', batch: 'PC-20240529-14', product: '蓬莱黄金富士', spec: '5kg/箱', time: '2024-05-29 08:45:00', status: 'unused', order: '—' },
  { code: 'SNZG-2024-0015', batch: 'PC-20240530-15', product: '招远有机苹果', spec: '4kg/箱', time: '2024-05-30 10:00:00', status: 'used', order: 'ORD-20240530001' },
  { code: 'SNZG-2024-0016', batch: 'PC-20240601-16', product: '龙口精品苹果', spec: '6kg/箱', time: '2024-06-01 09:15:00', status: 'unused', order: '—' },
  { code: 'SNZG-2024-0017', batch: 'PC-20240602-17', product: '烟台苹果干礼盒', spec: '500g/盒', time: '2024-06-02 14:30:00', status: 'used', order: 'ORD-20240602001' },
  { code: 'SNZG-2024-0018', batch: 'PC-20240603-18', product: '威海生态苹果', spec: '5kg/箱', time: '2024-06-03 11:45:00', status: 'unused', order: '—' },
  { code: 'SNZG-2024-0019', batch: 'PC-20240604-19', product: '栖霞冰糖心苹果', spec: '4kg/箱', time: '2024-06-04 15:20:00', status: 'used', order: 'ORD-20240604001' },
  { code: 'SNZG-2024-0020', batch: 'PC-20240605-20', product: '莱山苹果脯', spec: '250g/袋', time: '2024-06-05 10:30:00', status: 'unused', order: '—' },
  { code: 'SNZG-2024-0021', batch: 'PC-20240606-21', product: '牟平红富士', spec: '5kg/箱', time: '2024-06-06 13:15:00', status: 'used', order: 'ORD-20240606001' },
  { code: 'SNZG-2024-0022', batch: 'PC-20240607-22', product: '海阳苹果派', spec: '300g/个', time: '2024-06-07 08:00:00', status: 'unused', order: '—' },
  { code: 'SNZG-2024-0023', batch: 'PC-20240608-23', product: '福山苹果酵素', spec: '500ml/瓶', time: '2024-06-08 16:45:00', status: 'expired', order: '—' }
];

let currentPage = 1;
const pageSize = 10;
let filteredData = [...mockData];
let currentDetailCode = '';

// 页面初始化
document.addEventListener('DOMContentLoaded', function() {
  renderTable();
  renderPagination();
});

// 渲染表格
function renderTable() {
  const tbody = document.getElementById('dataTableBody');
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageData = filteredData.slice(start, end);
  
  tbody.innerHTML = pageData.map((item, __seq) => `
    <tr>
      <td class="checkbox-col">${__seq + 1}</td>
      <td><strong>${item.code}</strong></td>
      <td>${item.batch}</td>
      <td>${item.product}</td>
      <td>${item.spec}</td>
      <td>${item.time}</td>
      <td><span class="status-tag ${item.status === 'used' ? 'active' : item.status === 'expired' ? 'error' : 'inactive'}">${item.status === 'used' ? '已使用' : item.status === 'expired' ? '已过期' : '未使用'}</span></td>
      <td>${item.order}</td>
      <td>
        <div class="action-btns">
          <button class="action-btn detail" onclick="viewDetail('${item.code}')">详情</button>
          <button class="action-btn qrcode" onclick="showQRCode('${item.code}')">二维码</button>
        </div>
      </td>
    </tr>
  `).join('');
  
  document.getElementById('recordCount').textContent = `共 ${filteredData.length} 条记录`;
}

// 渲染分页
function renderPagination() {
  const container = document.getElementById('paginationContainer');
  const totalPages = Math.ceil(filteredData.length / pageSize);
  
  if (totalPages <= 1) {
    container.innerHTML = '';
    return;
  }
  
  let html = '';
  html += `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="goToPage(${currentPage - 1})">‹</button>`;
  
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
      html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
    } else if (i === currentPage - 2 || i === currentPage + 2) {
      html += '<span class="page-ellipsis">...</span>';
    }
  }
  
  html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="goToPage(${currentPage + 1})">›</button>`;
  
  container.innerHTML = html;
}

// 跳转页面
function goToPage(page) {
  const totalPages = Math.ceil(filteredData.length / pageSize);
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderTable();
  renderPagination();
}

// 搜索
function searchData() {
  const batch = document.getElementById('batchSelect').value;
  const product = document.getElementById('productNameInput').value.toLowerCase();
  const status = document.getElementById('statusSelect').value;
  
  filteredData = mockData.filter(item => {
    if (batch && item.batch !== batch) return false;
    if (product && !item.product.toLowerCase().includes(product)) return false;
    if (status && item.status !== status) return false;
    return true;
  });
  
  currentPage = 1;
  renderTable();
  renderPagination();
  showToast(`找到 ${filteredData.length} 条记录`);
}

// 全选/取消全选
function toggleSelectAll() {
  const checked = !!document.getElementById('selectAll') && document.getElementById('selectAll').checked;
  document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = checked);
}

function updateSelectAll() {
  const allChecked = document.querySelectorAll('.row-checkbox').length === document.querySelectorAll('.row-checkbox:checked').length;
  if (document.getElementById('selectAll')) document.getElementById('selectAll').checked = allChecked;
}

// 查看详情
function viewDetail(code) {
  currentDetailCode = code;
  const item = mockData.find(d => d.code === code);
  if (!item) return;
  
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-grid">
      <span class="detail-label">追溯码</span>
      <span class="detail-value">${item.code}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">批次号</span>
      <span class="detail-value">${item.batch}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">产品名称</span>
      <span class="detail-value">${item.product}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">产品规格</span>
      <span class="detail-value">${item.spec}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">生成时间</span>
      <span class="detail-value">${item.time}</span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">使用状态</span>
      <span class="detail-value"><span class="status-tag ${item.status === 'used' ? 'active' : item.status === 'expired' ? 'error' : 'inactive'}">${item.status === 'used' ? '已使用' : item.status === 'expired' ? '已过期' : '未使用'}</span></span>
    </div>
    <div class="detail-grid">
      <span class="detail-label">关联订单</span>
      <span class="detail-value">${item.order}</span>
    </div>
  `;
  
  openModal('detailModal');
}

// 显示二维码
function showQRCode(code) {
  currentDetailCode = code;
  document.getElementById('qrcodeValue').textContent = code;
  openModal('qrcodeModal');
}

// 生成追溯码弹窗
function openGenerateModal() {
  document.getElementById('generateBatch').value = 'PC-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + String(Math.floor(Math.random() * 100)).padStart(2, '0');
  openModal('generateModal');
}

// 确认生成
function confirmGenerate() {
  const product = document.getElementById('generateProduct').value;
  const count = document.getElementById('generateCount').value;
  const batch = document.getElementById('generateBatch').value;
  
  if (!product) {
    showToast('请选择产品', 'error');
    return;
  }
  
  closeModal('generateModal');
  showToast(`已成功生成 ${count} 个追溯码，批次号：${batch}`);
  
  // 重置表单
  document.getElementById('generateProduct').value = '';
  document.getElementById('generateCount').value = '100';
  document.getElementById('generateBatch').value = '';
  document.getElementById('generateRemark').value = '';
}

// 批量导出
function batchExport() {
  const checked = document.querySelectorAll('.row-checkbox:checked');
  if (checked.length === 0) {
    showToast('请先选择要导出的记录', 'error');
    return;
  }
  showToast(`已导出 ${checked.length} 条记录`);
}

// 打印标签
function printLabels() {
  showToast(`正在准备打印全部 ${filteredData.length} 个标签...`);
}

function printSingleLabel() {
  showToast(`正在打印标签：${currentDetailCode}`);
  closeModal('detailModal');
}

// 下载二维码
function downloadQRCode() {
  showToast(`下载二维码：${currentDetailCode}`);
}

// 弹窗操作
function openModal(id) {
  document.getElementById(id).classList.add('active');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

// Toast提示
function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  document.getElementById('toastMessage').textContent = message;
  toast.className = `toast ${type}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}
