<style>
  .modal-overlay {
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0, 0, 0, 0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    opacity:0;
    visibility:hidden;
    transition:all 0.3s ease;
  }
  .modal-overlay.active {
    opacity:1;
    visibility:visible;
  }
  .modal {
    background:var(--bg-card);
    border-radius:16px;
    width:520px;
    max-width:90vw;
    max-height:90vh;
    overflow:hidden;
    transform:scale(0.9);
    transition:all 0.3s ease;
  }
  .modal-overlay.active .modal {
    transform:scale(1);
  }
  .modal-header {
    padding:20px 24px;
    border-bottom:1px solid var(--border-default);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(135deg, #1890ff 0%, #1a8a3a 100%);
    color:var(--text-inverse);
  }
  .modal-header h3 {
    font-size:18px;
    font-weight:600;
    margin:0;
  }
  .modal-close {
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
    border:none;
    color:var(--text-inverse);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.2s;
  }
  .modal-close:hover {
    background:rgba(255,255,255,0.3);
  }
  .modal-body {
    padding:24px;
    max-height:60vh;
    overflow-y:auto;
  }
  .modal-footer {
    padding:16px 24px;
    border-top:1px solid var(--border-default);
    display:flex;
    justify-content:flex-end;
    gap:12px;
  }
  .detail-grid {
    display:grid;
    grid-template-columns:120px 1fr;
    gap:12px;
    padding:8px 0;
    border-bottom:1px solid var(--border-light);
  }
  .detail-grid:last-child {
    border-bottom:none;
  }
  .detail-label {
    color:var(--text-tertiary);
    font-size:14px;
  }
  .detail-value {
    color:var(--text-primary);
    font-size:14px;
    font-weight:500;
  }
  .qrcode-container {
    text-align:center;
    padding:24px;
    background:#f8faf8;
    border-radius:12px;
    margin:16px 0;
  }
  .qrcode-box {
    width:180px;
    height:180px;
    background:var(--bg-card);
    border-radius:12px;
    margin:0 auto 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid var(--border-primary);
    overflow:hidden;
  }
  .qrcode-placeholder {
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--primary-500);
  }
  .qrcode-code {
    font-size:16px;
    font-weight:600;
    color:var(--text-primary);
    margin-bottom:8px;
  }
  .qrcode-hint {
    font-size:12px;
    color:var(--text-tertiary);
  }
  .generate-form {
    display:grid;
    gap:16px;
  }
  .form-group {
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .form-group label {
    font-size:14px;
    font-weight:500;
    color:var(--text-primary);
  }
  .form-group input,
  .form-group select {
    padding:10px 14px;
    border:1px solid var(--border-default);
    border-radius:8px;
    font-size:14px;
    transition:all 0.2s;
  }
  .form-group input:focus,
  .form-group select:focus {
    outline:none;
    border-color:var(--border-primary);
    box-shadow:0 0 0 3px rgba(24,144,255,0.1);
  }
  .form-row {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .qrcode-url {
    margin-top:10px;
    font-size:12px;
    color:var(--text-tertiary);
    word-break:break-all;
    font-family:var(--font-mono, monospace);
  }
  .form-hint { font-size:12px; color:var(--text-tertiary); }
  .chain-box { background:#f8faf8; border-radius:12px; padding:16px 20px; margin-bottom:16px; }
  .chain-title { font-weight:600; color:var(--text-primary); font-size:14px; margin-bottom:10px; }
  .chain-list { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .chain-node { background:var(--bg-card); border:1px solid var(--border-default); border-radius:8px; padding:6px 12px; font-size:13px; color:var(--text-secondary); }
  .chain-node.hl { border-color:#1890ff; color:#1890ff; font-weight:500; }
  .chain-arrow { color:var(--text-tertiary); font-size:13px; }
  .toast {
    position:fixed;
    top:20px;
    right:20px;
    padding:14px 20px;
    background:var(--bg-card);
    border-radius:10px;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
    display:flex;
    align-items:center;
    gap:12px;
    z-index:2000;
    transform:translateX(120%);
    transition:all 0.3s ease;
  }
  .toast.show {
    transform:translateX(0);
  }
  .toast.success {
    border-left:4px solid var(--border-primary);
  }
  .toast-icon {
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--gray-100);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--primary-500);
  }
</style>

/* ---------- 分页组件（与农事计划、批次管理一致） ---------- */
const Pagination = {
  currentPage: 1, pageSize: 10, filteredData: [],
  containerId: 'pagination-container', tbodyId: 'dataTableBody', renderRow: null,
  init: function(options) {
    this.currentPage = options.currentPage || 1;
    this.pageSize = options.pageSize || 10;
    this.filteredData = options.data || [];
    this.containerId = options.containerId || 'pagination-container';
    this.tbodyId = options.tbodyId || 'dataTableBody';
    this.renderRow = options.renderRow || null;
    this.render();
  },
  renderTable: function() {
    const tbody = document.getElementById(this.tbodyId);
    if (!tbody || !this.renderRow) return;
    const start = (this.currentPage - 1) * this.pageSize;
    const pageData = this.filteredData.slice(start, start + this.pageSize);
    tbody.innerHTML = pageData.map((item, i) => this.renderRow(item, start + i + 1)).join('');
  },
  render: function() {
    const container = document.getElementById(this.containerId);
    if (!container) return;
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    let html = '<div class="pagination">';
    html += `<button class="page-btn ${this.currentPage <= 1 ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage - 1})">‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= this.currentPage - 1 && i <= this.currentPage + 1)) {
        html += `<button class="page-btn ${i === this.currentPage ? 'active' : ''}" onclick="Pagination.goToPage(${i})">${i}</button>`;
      } else if (i === this.currentPage - 2 || i === this.currentPage + 2) {
        html += '<span class="page-ellipsis" style="padding:0 8px;color:#6b7b6b;">...</span>';
      }
    }
    html += `<button class="page-btn ${this.currentPage >= totalPages ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage + 1})">›</button>`;
    html += `<span style="margin-left:16px;font-size:13px;color:#6b7b6b;">第 ${this.currentPage} 页/共 ${totalPages} 页，共 ${this.filteredData.length} 条记录</span>`;
    html += '</div>';
    container.innerHTML = html;
    this.renderTable();
  },
  goToPage: function(page) {
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    if (page < 1 || page > totalPages) return;
    this.currentPage = page;
    this.render();
  },
  updateData: function(data) {
    this.filteredData = data;
    this.currentPage = 1;
    this.render();
  }
};

// 渲染表格行
function renderCodeRow(item, seq) {
  const c = enrichCode(item);
  return `
    <tr data-id="${c.code}">
      <td>${seq}</td>
      <td><strong>${c.code}</strong></td>
      <td>${c.batch}</td>
      <td>${c.product}</td>
      <td>${c.base} / ${c.plotCode} ${c.plotName}</td>
      <td>${c.time}</td>
      <td><span class="status-tag ${c.status === 'active' ? 'active' : c.status === 'expired' ? 'error' : 'inactive'}">${c.statusText}</span></td>
      <td>${c.order || '—'}</td>
      <td>
        <div class="action-btns">
          <button class="action-btn detail" onclick="viewDetail('${c.code}')">详情</button>

  `;
}

// 搜索
function searchData() {
  const batch = document.getElementById('batchSelect').value;
  const code = document.getElementById('codeInput').value.trim().toLowerCase();
  const status = document.getElementById('statusSelect').value;

  const filtered = mockData.filter(item => {
    if (batch && item.batch !== batch) return false;
    if (code && !item.code.toLowerCase().includes(code)) return false;
    if (status && item.status !== status) return false;
    return true;
  });

  Pagination.updateData(filtered);
  showToast(`找到 ${filtered.length} 条记录`);
}

  const url = 'trace_blockchain.html?code=' + encodeURIComponent(code);

  }
}

// 选择批次后带出产品 / 规格 / 产地
function syncBatchFields() {
  const batchNo = document.getElementById('generateBatch').value;
  const b = batchNo ? BATCH_SOURCE.find(x => x.batchNo === batchNo) : null;
  document.getElementById('generateProduct').value = b ? b.product : '';
  document.getElementById('generateSpec').value = b ? b.spec : '';
  document.getElementById('generateOrigin').value = b ? `${b.base} / ${b.plotCode} ${b.plotName}` : '';
}

// 确认生成（强制选择采收批次，生成后落库）
function confirmGenerate() {
  const batchNo = document.getElementById('generateBatch').value;
  const count = Number(document.getElementById('generateCount').value);

  if (!batchNo) { showToast('请选择采收批次', 'error'); return; }
  if (!count || count < 1 || count > 200) { showToast('生成数量需在 1-200 之间', 'error'); return; }

  const b = BATCH_SOURCE.find(x => x.batchNo === batchNo);
  const order = document.getElementById('generateOrder').value;
  const template = document.getElementById('generateTemplate').value || '标准版履历模板';

  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const dateCode = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}`;

  let seq = mockData.length;
  for (let i = 0; i < count; i++) {
    seq += 1;
    mockData.unshift({
      code: `SNZG-${dateCode}-${String(seq).padStart(4, '0')}`,
      batch: batchNo,
      time: stamp,
      status: 'inactive',
      order: order,
      template: template,
      queries: 0
    });
  }

  closeModal('generateModal');
  Pagination.updateData(mockData);
  showToast(`已生成 ${count} 个追溯码，批次：${batchNo}（${b ? b.product : ''}）`);
}

// 标签库存（与移动端「标签领用」共用同一份本地存储）
const LABEL_STOCK_KEY = 'smartorchard_label_stock';
const LABEL_TYPES = [
  { name: '花牛苹果专用标签（双层纸袋型）', stock: 12500 },
  { name: '花牛苹果专用标签（透气膜袋型）', stock: 8200 },
  { name: '秦冠专用标签', stock: 6800 }
];

function readLabelStock() {
  try {
    const raw = localStorage.getItem(LABEL_STOCK_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* 忽略 */ }
  const init = {};
  LABEL_TYPES.forEach(t => { init[t.name] = t.stock; });
  return init;
}

function writeLabelStock(stock) {
  try { localStorage.setItem(LABEL_STOCK_KEY, JSON.stringify(stock)); } catch (e) { /* 忽略 */ }
}

function currentLabelType() {
  const sel = document.getElementById('labelTypeSelect');
  return sel && sel.value ? sel.value : LABEL_TYPES[0].name;
}

function refreshLabelStock() {
  const stock = readLabelStock();
  const name = currentLabelType();
  const left = stock[name] != null ? stock[name] : 0;
  document.getElementById('labelStockInfo').textContent = `标签库存：${left} 张`;
}

// 打印全部标签（按库存校验并扣减）
function printLabels() {
  const count = Pagination.filteredData.length;
  const name = currentLabelType();
  const stock = readLabelStock();
  const left = stock[name] != null ? stock[name] : 0;

  if (left < count) {
    showToast(`标签库存不足：需 ${count} 张，仅剩 ${left} 张，请先在移动端领用`, 'error');
    return;
  }
  stock[name] = left - count;
  writeLabelStock(stock);
  refreshLabelStock();
  showToast(`已打印 ${count} 个标签，${name} 剩余 ${stock[name]} 张`);
}

function printSingleLabel() {
  const name = currentLabelType();
  const stock = readLabelStock();
  const left = stock[name] != null ? stock[name] : 0;

  if (left < 1) {
    showToast(`标签库存不足，请先在移动端领用`, 'error');
    return;
  }
  stock[name] = left - 1;
  writeLabelStock(stock);
  refreshLabelStock();
  showToast(`已打印标签：${currentDetailCode}，剩余 ${stock[name]} 张`);
  closeModal('detailModal');
}

// 弹窗操作
function openModal(id) {
  document.getElementById(id).classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
  document.body.style.overflow = '';
}

// Toast提示
function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  document.getElementById('toastMessage').textContent = message;
  toast.className = `toast ${type}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// 页面初始化
document.addEventListener('DOMContentLoaded', function() {
  // 搜索栏批次下拉
  const batchSelect = document.getElementById('batchSelect');
  BATCH_SOURCE.forEach(b => {
    const opt = document.createElement('option');
    opt.value = b.batchNo;
    opt.textContent = `${b.batchNo} · ${b.product} · ${b.plotCode} ${b.plotName}`;
    batchSelect.appendChild(opt);
  });

  // 批次选择联动带出产品/规格/产地
  document.getElementById('generateBatch').addEventListener('change', syncBatchFields);

  // 标签类型下拉 + 库存显示
  const labelSelect = document.getElementById('labelTypeSelect');
  labelSelect.innerHTML = LABEL_TYPES.map(t => `<option value="${t.name}">${t.name}</option>`).join('');
  labelSelect.addEventListener('change', refreshLabelStock);
  refreshLabelStock();

  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: mockData,
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderCodeRow
  });

  // 由批次管理跳转过来时预选批次并打开生成弹窗
  const preset = new URLSearchParams(window.location.search).get('batch');
  if (preset) openGenerateModal(preset);
});

// 点击遮罩关闭弹窗
document.querySelectorAll('.modal-overlay').forEach(overlay => {

});

// ESC 关闭弹窗
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.active').forEach(o => closeModal(o.id));
  }
});
