<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 认养成长相册</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/page-content.css">
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<style>
  .notice-bar {
    display: flex; align-items: flex-start; gap: var(--space-sm);
    padding: var(--space-md) var(--space-lg);
    background: var(--info-bg); border: 1px solid var(--border-light);
    border-radius: var(--radius-lg); font-size: var(--font-size-sm);
    color: var(--text-secondary); margin-bottom: var(--space-lg);
  }
  .notice-bar svg { flex-shrink: 0; margin-top: 2px; color: var(--info); }
  .notice-bar code {
    font-family: var(--font-family-mono, monospace);
    background: rgba(24,144,255,0.08); padding: 1px 5px; border-radius: 4px;
  }
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
  }
  .stat-label { font-size: var(--font-size-sm); color: var(--text-tertiary); margin-bottom: var(--space-xs); }
  .stat-value {
    font-size: 26px; font-weight: var(--font-weight-bold);
    color: var(--text-primary); line-height: 1.2; font-variant-numeric: tabular-nums;
  }
  .stat-card.is-photo .stat-value { color: var(--primary-500); }
  .stat-card.is-tree  .stat-value { color: var(--success); }
  .stat-card.is-time  .stat-value { color: var(--warning); font-size: 18px; }

  /* ===== 果树分组卡片 ===== */
  .tree-group-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: var(--space-md);
  }
  .tree-group {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .tree-group-header {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm);
    padding: var(--space-md);
    border-bottom: 1px solid var(--border-light);
    background: var(--gray-50);
  }
  .tree-group-code {
    font-family: var(--font-family-mono, monospace);
    font-size: var(--font-size-base); font-weight: var(--font-weight-bold);
    color: var(--text-primary);
  }
  .tree-group-count {
    font-size: var(--font-size-xs); color: var(--text-tertiary);
    background: var(--bg-card); border: 1px solid var(--border-light);
    padding: 2px 10px; border-radius: var(--radius-full); white-space: nowrap;
  }
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
    padding: var(--space-md);
  }
  .photo-cell {
    position: relative;
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 1px solid var(--border-light);
    background: var(--gray-50);
  }
  .photo-cell-img {
    width: 100%; height: 92px; object-fit: cover; display: block;
    cursor: zoom-in; background: var(--gray-100);
  }
  .photo-fallback {
    width: 100%; height: 92px; display: none;
    align-items: center; justify-content: center;
    background: var(--gray-100); color: var(--text-tertiary); font-size: 12px;
  }
  .photo-cell-meta { padding: 6px 8px; background: var(--bg-card); }
  .photo-cell-stage {
    display: inline-block; padding: 1px 8px; border-radius: var(--radius-full);
    font-size: 11px; background: var(--primary-50); color: var(--primary-600);
    margin-bottom: 3px;
  }
  .photo-cell-time {
    font-size: 11px; color: var(--text-tertiary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
  }
  .photo-del {
    position: absolute; top: 5px; right: 5px;
    width: 22px; height: 22px; border-radius: 50%;
    border: none; background: rgba(0,0,0,0.55); color: #fff;
    cursor: pointer; font-size: 14px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.2s;
  }
  .photo-cell:hover .photo-del { opacity: 1; }
  .photo-del:hover { background: var(--error); }

  /* ===== 图片查看器 ===== */
  .viewer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.82);
    z-index: 1200; display: none; align-items: center; justify-content: center;
  }
  .viewer-overlay.show { display: flex; }
  .viewer-box { max-width: 90vw; max-height: 90vh; text-align: center; }
  .viewer-box img { max-width: 90vw; max-height: 76vh; display: block; border-radius: 8px; }
  .viewer-box .viewer-cap { color: #fff; font-size: 13px; margin-top: 10px; }
  .viewer-close {
    position: absolute; top: 18px; right: 22px;
    background: rgba(255,255,255,0.2); border: none; color: #fff;
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 20px;
  }

  /* ===== 空态 ===== */
  .empty-state {
    padding: var(--space-2xl) 0; text-align: center;
    color: var(--text-tertiary); font-size: var(--font-size-sm);
  }

  /* ===== 弹窗 ===== */
  .modal-overlay {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    justify-content: center; align-items: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--bg-card);
    border-radius: 12px;
    width: 92%; max-width: 560px; max-height: 85vh;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    animation: modalFadeIn 0.2s ease-out;
  }
  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.95) translateY(-20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-bottom: 1px solid var(--border-default);
  }
  .modal-title { font-size: 16px; font-weight: 600; color: #1f1f1f; }
  .modal-close {
    background: none; border: none; cursor: pointer;
    padding: 4px; font-size: 20px; line-height: 1;
    color: var(--text-tertiary); transition: color 0.2s;
  }
  .modal-close:hover { color: var(--text-secondary); }
  .modal-body { padding: 20px; overflow-y: auto; max-height: calc(85vh - 132px); }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 12px;
    padding: 16px 20px; border-top: 1px solid var(--border-default);
  }
  .modal-field { margin-bottom: var(--space-lg); }
  .modal-field:last-child { margin-bottom: 0; }
  .modal-field label {
    display: block; font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium, 500);
    color: var(--text-primary); margin-bottom: var(--space-sm);
  }
  .modal-field textarea, .modal-field input, .modal-field select {
    width: 100%; padding: 10px 14px;
    border: 1.5px solid var(--border-default);
    border-radius: var(--radius-lg);
    font-size: var(--font-size-base); font-family: inherit;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    background: var(--bg-card);
  }
  .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus {
    border-color: var(--primary-500);
    box-shadow: 0 0 0 4px rgba(24, 144, 255, 0.12);
    outline: none;
  }
  .field-hint { font-size: var(--font-size-xs); color: var(--text-tertiary); margin-top: 6px; }
</style>
</head>

<!-- 严格空库模式：演示数据播种已停用，数据一律来自后端 API -->
<script src="js/shared/adoption-store.js"></script>
<script src="../common/js/api.js"></script>
<script>
/* ============================================================
 * 认养成长相册 —— 严格空库模式
 * 数据源（通用 CRUD，前端关联）：
 *   Api.get('adoption_photo') -> sf_adoption_photo(id, tree_id, file_id, stage, shoot_time)
 *   Api.get('file')           -> sf_file(id, store_path)  图片经 /uploads/ 访问
 *   Api.get('adoption_tree')  -> sf_adoption_tree(id, tree_code) 果树分组
 * 说明：DB 无图片 URL/base64 列，也无文件上传写入接口，故图片通过 file_id
 *   关联 sf_file.store_path 展示；上传仅落库照片记录（tree_id/stage/shoot_time），
 *   不写 localStorage、不内置演示数据。
 * 空库显示「暂无数据」。
 * ============================================================ */
var photoMap = {};       /* { [果树编号]: [{ id, treeId, url, time, stage }] } */
var treeOptions = [];    /* 已登记果树 [{ id, code }] */
var dataLoaded = false;
var OTHER_TREE = '__other__';
var STAGE_OPTIONS = ['生长', '开花', '结果', '成熟', '采摘'];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function fmtTime(t) {
  if (!t) return '—';
  var d = new Date(t);
  if (isNaN(d.getTime())) return String(t);
  var p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* sf_file.store_path -> 可访问 URL（app.js 已挂载 /uploads 静态服务） */
function fileUrl(p) {
  p = String(p || '').trim();
  if (!p) return '';
  if (/^(https?:|data:|blob:|\/)/i.test(p)) return p;
  return '/uploads/' + p.replace(/^uploads\//i, '').replace(/^\/+/, '');
}

function setGridState(msg) {
  var grid = document.getElementById('treeGrid');
  var empty = document.getElementById('emptyHint');
  if (grid) grid.innerHTML = '';
  if (empty) { empty.textContent = msg; empty.style.display = 'block'; }
}

function loadData() {
  dataLoaded = false;
  setGridState('加载中...');
  if (!window.Api || !Api.get) {
    setGridState('数据加载失败：Api 未就绪');
    return;
  }
  Promise.all([
    Api.get('adoption_photo', { page: 1, size: 500, sort: 'id', order: 'desc' }),
    Api.get('file', { page: 1, size: 500 }),
    Api.get('adoption_tree', { page: 1, size: 500 })
  ]).then(function (res) {
    var pr = res[0], fr = res[1], tr = res[2];
    if (!pr || !pr.ok) {
      setGridState('数据加载失败：' + ((pr && pr.message) || '请检查登录状态与网络'));
      return;
    }
    var fileMap = {}, treeMap = {};
    ((fr && fr.ok && fr.data && fr.data.list) || []).forEach(function (f) {
      fileMap[String(f.id)] = f.store_path || '';
    });
    ((tr && tr.ok && tr.data && tr.data.list) || []).forEach(function (t) {
      treeMap[String(t.id)] = t.tree_code || String(t.id);
    });
    treeOptions = ((tr && tr.ok && tr.data && tr.data.list) || []).map(function (t) {
      return { id: String(t.id), code: t.tree_code || String(t.id) };
    });
    var map = {};
    ((pr.data && pr.data.list) || []).forEach(function (r) {
      var tid = r.tree_id == null ? '未关联果树' : (treeMap[String(r.tree_id)] || String(r.tree_id));
      if (!map[tid]) map[tid] = [];
      map[tid].push({
        id: String(r.id),
        treeId: tid,
        url: fileUrl(fileMap[String(r.file_id)]),
        time: r.shoot_time || r.created_at || '',
        stage: r.stage || ''
      });
    });
    photoMap = map;
    dataLoaded = true;
    renderStats(photoMap);
    renderList();
    fillTreeOptions();
  }).catch(function (err) {
    setGridState('数据加载失败：' + ((err && err.message) || '请检查登录状态与网络'));
  });
}

/* ---------- 统计与渲染 ---------- */
function renderStats(map) {
  var keys = Object.keys(map);
  var photos = 0, covered = 0, latest = 0;
  keys.forEach(function (k) {
    var arr = map[k] || [];
    if (arr.length) covered++;
    photos += arr.length;
    arr.forEach(function (p) {
      var t = new Date(p.time || 0).getTime();
      if (!isNaN(t) && t > latest) latest = t;
    });
  });
  document.getElementById('statTree').textContent = keys.length;
  document.getElementById('statPhoto').textContent = photos;
  document.getElementById('statCovered').textContent = covered;
  document.getElementById('statLatest').textContent = latest ? fmtTime(latest) : '—';
}

function sortedPhotos(arr) {
  return (arr || []).slice().sort(function (a, b) {
    var ta = new Date(a.time || 0).getTime();
    var tb = new Date(b.time || 0).getTime();
    if (isNaN(ta)) ta = 0;
    if (isNaN(tb)) tb = 0;
    return tb - ta;
  });
}

function photoCellHtml(p) {
  var src = p.url;
  var img = src
    ? '<img class="photo-cell-img" src="' + esc(src) + '" alt="成长照片" loading="lazy" data-photo-view="' + esc(p.id) + '">'
    : '';
  return '<div class="photo-cell">' +
    img +
    '<div class="photo-fallback" style="display:' + (src ? 'none' : 'flex') + '">' +
      (src ? '图片已失效' : '未设置图片') + '</div>' +
    '<button class="photo-del" title="删除照片" data-photo-del="' + esc(p.id) + '">&times;</button>' +
    '<div class="photo-cell-meta">' +
      '<span class="photo-cell-stage">' + esc(p.stage || '成长') + '</span>' +
      '<span class="photo-cell-time">' + esc(fmtTime(p.time)) + '</span>' +
    '</div>' +
  '</div>';
}

function renderList() {
  if (!dataLoaded) return;
  renderStats(photoMap);
  var kw = document.getElementById('searchInput').value.trim().toLowerCase();
  var stage = document.getElementById('stageSelect').value;
  var keys = Object.keys(photoMap).filter(function (k) {
    if (kw && k.toLowerCase().indexOf(kw) === -1) return false;
    if (stage) {
      var arr = photoMap[k] || [];
      var hit = arr.some(function (p) { return (p.stage || '成长') === stage; });
      if (!hit) return false;
    }
    return true;
  }).sort();

  var grid = document.getElementById('treeGrid');
  var empty = document.getElementById('emptyHint');
  if (!keys.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = Object.keys(photoMap).length ? '没有符合条件的果树照片' : '暂无数据';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = keys.map(function (k) {
    var arr = sortedPhotos(photoMap[k]);
    return '<div class="tree-group">' +
      '<div class="tree-group-header">' +
        '<span class="tree-group-code">' + esc(k) + '</span>' +
        '<span class="tree-group-count">' + arr.length + ' 张</span>' +
      '</div>' +
      '<div class="photo-grid">' + arr.map(function (p) { return photoCellHtml(p); }).join('') + '</div>' +
    '</div>';
  }).join('');
}

function refreshList() { renderList(); }

function resetFilter() {
  document.getElementById('searchInput').value = '';
  document.getElementById('stageSelect').value = '';
  renderList();
}

/* ---------- 图片查看 ---------- */
function photoById(id) {
  var keys = Object.keys(photoMap);
  for (var i = 0; i < keys.length; i++) {
    var arr = sortedPhotos(photoMap[keys[i]]);
    for (var j = 0; j < arr.length; j++) {
      if (arr[j].id === id) return arr[j];
    }
  }
  return null;
}

function openViewerById(id) {
  var p = photoById(id);
  if (!p || !p.url) { Toast.warning('照片暂无可预览图片'); return; }
  var img = document.getElementById('viewerImg');
  img.style.display = '';
  img.src = p.url;
  img.onerror = function () {
    this.style.display = 'none';
    document.getElementById('viewerFallback').style.display = 'block';
  };
  document.getElementById('viewerFallback').style.display = 'none';
  document.getElementById('viewerCap').textContent = (p.treeId || '') + ' · ' + (p.stage || '成长') + ' · ' + fmtTime(p.time);
  document.getElementById('viewerOverlay').classList.add('show');
}

function closeViewer() {
  document.getElementById('viewerOverlay').classList.remove('show');
}

/* ---------- 删除 ---------- */
function deletePhoto(id) {
  var p = photoById(id);
  if (!p) { Toast.error('未找到该照片'); return; }
  ConfirmDialog.show({
    title: '删除照片',
    message: '将删除「' + (p.treeId || '') + '」在「' + (p.stage || '成长') + '」阶段的 1 张照片，删除后不可恢复。',
    onConfirm: function () {
      Api.remove('adoption_photo', id).then(function (res) {
        if (!res || !res.ok) { Toast.error((res && res.message) || '删除失败'); return; }
        loadData();
        Toast.success('照片已删除');
      }).catch(function (err) { Toast.error((err && err.message) || '删除失败'); });
    }
  });
}

/* ---------- 上传 ---------- */
function initStageSelect() {
  var stageSelect = document.getElementById('stageSelect');
  var upStage = document.getElementById('upStage');
  STAGE_OPTIONS.forEach(function (st) {
    var o1 = document.createElement('option');
    o1.value = st; o1.textContent = st;
    stageSelect.appendChild(o1);
    var o2 = document.createElement('option');
    o2.value = st; o2.textContent = st;
    upStage.appendChild(o2);
  });
}

/* 果树下拉来自真实 sf_adoption_tree，value = 果树主键 */
function fillTreeOptions() {
  var sel = document.getElementById('upTreeSelect');
  var html = '';
  treeOptions.forEach(function (t) {
    html += '<option value="' + esc(t.id) + '">' + esc(t.code) + '</option>';
  });
  html += '<option value="' + OTHER_TREE + '">其他果树（手工输入编号）</option>';
  sel.innerHTML = html;
}

function syncTreeManual() {
  var isOther = document.getElementById('upTreeSelect').value === OTHER_TREE;
  document.getElementById('upTreeManualWrap').style.display = isOther ? '' : 'none';
}

/* ---------- 照片文件选择与压缩（保留交互，压缩结果仅用于本地预览） ---------- */
var PICKED_PHOTO = { dataUrl: '', name: '' };
var MAX_FILE_BYTES = 8 * 1024 * 1024;
var MAX_DATAURL_BYTES = 400 * 1024;
var MAX_EDGE = 1280;

function dataUrlBytes(u) {
  var st = String(u || '');
  var i = st.indexOf(',');
  if (i < 0) return 0;
  return Math.round((st.length - i - 1) * 0.75);
}

function handleFilePick(input) {
  PICKED_PHOTO = { dataUrl: '', name: '' };
  var file = input && input.files && input.files[0];
  if (!file) { renderFilePreview(); return; }
  if (!/^image\//i.test(file.type)) {
    Toast.warning('请选择图片文件（JPG / PNG）');
    input.value = '';
    return;
  }
  if (file.size > MAX_FILE_BYTES) {
    Toast.warning('图片过大（超过 8MB），请先压缩后再上传');
    input.value = '';
    renderFilePreview();
    return;
  }
  var reader = new FileReader();
  reader.onload = function () {
    compressImage(String(reader.result), function (dataUrl) {
      if (!dataUrl) { Toast.error('图片处理失败，请更换图片重试'); renderFilePreview(); return; }
      PICKED_PHOTO = { dataUrl: dataUrl, name: file.name };
      renderFilePreview();
    });
  };
  reader.onerror = function () { Toast.error('图片读取失败，请重试'); };
  reader.readAsDataURL(file);
}

function compressImage(src, done) {
  var img = new Image();
  img.onload = function () {
    try {
      var w = img.naturalWidth || img.width;
      var h = img.naturalHeight || img.height;
      if (!w || !h) { done(''); return; }
      var scale = Math.min(1, MAX_EDGE / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, cw, ch);
      var quality = 0.82;
      var out = canvas.toDataURL('image/jpeg', quality);
      while (dataUrlBytes(out) > MAX_DATAURL_BYTES && quality > 0.4) {
        quality -= 0.12;
        out = canvas.toDataURL('image/jpeg', quality);
      }
      done(out);
    } catch (e) { done(''); }
  };
  img.onerror = function () { done(''); };
  img.src = src;
}

function renderFilePreview() {
  var box = document.getElementById('upFilePreview');
  var nameEl = document.getElementById('upFileName');
  if (!box) return;
  if (PICKED_PHOTO.dataUrl) {
    box.innerHTML = '<img src="' + PICKED_PHOTO.dataUrl + '" alt="照片预览">';
    if (nameEl) nameEl.textContent = PICKED_PHOTO.name + ' · 已压缩约 ' + Math.round(dataUrlBytes(PICKED_PHOTO.dataUrl) / 1024) + 'KB';
  } else {
    box.innerHTML = '<span class="up-file-hint">未选择图片</span>';
    if (nameEl) nameEl.textContent = '';
  }
}

function openUpload() {
  fillTreeOptions();
  syncTreeManual();
  document.getElementById('upTreeManual').value = '';
  PICKED_PHOTO = { dataUrl: '', name: '' };
  var fileInput = document.getElementById('upFile');
  if (fileInput) fileInput.value = '';
  renderFilePreview();
  document.getElementById('upStage').selectedIndex = 0;
  var d = new Date();
  var p = function (n) { return String(n).padStart(2, '0'); };
  document.getElementById('upTime').value =
    d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  document.getElementById('uploadModal').classList.add('show');
}

function closeUpload() {
  document.getElementById('uploadModal').classList.remove('show');
}

/* 上传落库：sf_adoption_photo 仅存 tree_id / stage / shoot_time，
   项目暂无文件上传写入接口，图片 base64 不入库；记录一律走 Api.create */
function submitUpload() {
  var sel = document.getElementById('upTreeSelect').value;
  if (sel === OTHER_TREE) {
    Toast.warning('请从已登记果树中选择（严格空库下不创建未登记果树）');
    return;
  }
  var stage = document.getElementById('upStage').value || STAGE_OPTIONS[0];
  var time = document.getElementById('upTime').value;
  if (!sel) { Toast.warning('请选择果树'); return; }
  if (!PICKED_PHOTO.dataUrl) { Toast.warning('请选择要上传的照片文件'); return; }
  if (!time) { Toast.warning('请选择拍摄时间'); return; }
  var shootTime = String(time).replace('T', ' ');
  if (shootTime.length === 16) shootTime += ':00';

  var body = {
    tree_id: Number(sel) || null,
    stage: stage,
    shoot_time: shootTime
  };
  Api.create('adoption_photo', body).then(function (res) {
    if (!res || !res.ok) { Toast.error((res && res.message) || '保存失败'); return; }
    closeUpload();
    loadData();
    Toast.success('照片记录已保存（图片文件需通过文件服务上传后关联）');
  }).catch(function (err) { Toast.error((err && err.message) || '保存失败'); });
}

/* ---------- 事件代理 ---------- */
document.addEventListener('click', function (e) {
  var del = e.target.closest && e.target.closest('[data-photo-del]');
  var view = e.target.closest && e.target.closest('[data-photo-view]');
  if (del) deletePhoto(del.getAttribute('data-photo-del'));
  else if (view) openViewerById(view.getAttribute('data-photo-view'));
});

/* 图片加载失败：隐藏 img 并显示占位 */
document.addEventListener('error', function (e) {
  var im = e.target;
  if (im && im.classList && im.classList.contains('photo-cell-img')) {
    im.style.display = 'none';
    var cell = im.parentNode;
    var fb = cell && cell.querySelector && cell.querySelector('.photo-fallback');
    if (fb) fb.style.display = 'flex';
  }
}, true);

/* ---------- 初始化 ---------- */
document.addEventListener('DOMContentLoaded', function () {
  initStageSelect();
  document.getElementById('upTreeSelect').addEventListener('change', syncTreeManual);
  document.getElementById('searchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') renderList();
  });
  loadData();
});
</script>
