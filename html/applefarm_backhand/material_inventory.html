<!DOCTYPE html>

<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">

<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition:all 0.2s ease;
  }
  .module-card:hover {
    background:var(--bg-hover);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }

  /* 弹窗遮罩层 */
  .modal-overlay {
    display:none;
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0, 0, 0, 0.5);
    z-index:1000;
    justify-content:center;
    align-items:center;
    backdrop-filter:blur(4px);
  }

  .modal-overlay.show {
    display:flex;
  }

  /* 弹窗容器 */
  .modal-container {
    background:var(--bg-card);
    border-radius:12px;
    width:90%;
    max-width:600px;
    max-height:85vh;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0, 0, 0, 0.2);
    animation:modalFadeIn 0.2s ease-out;
  }

  @keyframes modalFadeIn {
    from {
      opacity:0;
      transform:scale(0.95) translateY(-20px);
    }
    to {
      opacity:1;
      transform:scale(1) translateY(0);
    }
  }

  /* 弹窗头部 */
  .modal-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 20px;
    border-bottom:1px solid var(--border-default);
    background:var(--gray-50);
  }

  .modal-title {
    font-size:16px;
    font-weight:600;
    color:#1f1f1f;
  }

  .modal-close {
    background:none;
    border:none;
    cursor:pointer;
    padding:4px;
    color:var(--text-tertiary);
    transition:color 0.2s;
  }

  .modal-close:hover {
    color:var(--text-secondary);
  }

  /* 弹窗内容 */
  .modal-body {
    padding:20px;
    overflow-y:auto;
    max-height:calc(85vh - 100px);
  }

  /* 表单样式 */
  .form-row {
    display:flex;
    gap:16px;
    margin-bottom:16px;
  }

  .form-item {
    flex:1;
  }

  .form-item label {
    display:block;
    font-size:13px;
    color:var(--text-secondary);
    margin-bottom:6px;
  }

  .form-item input,
  .form-item select {
    width:100%;
    padding:8px 12px;
    border:1px solid var(--border-strong);
    border-radius:6px;
    font-size:14px;
    transition:border-color 0.2s;
    box-sizing:border-box;
  }

  .form-item input:focus,
  .form-item select:focus {
    outline:none;
    border-color:var(--border-primary);
  }

  .form-item textarea {
    width:100%;
    padding:8px 12px;
    border:1px solid var(--border-strong);
    border-radius:6px;
    font-size:14px;
    resize:vertical;
    min-height:80px;
    box-sizing:border-box;
  }

  /* 弹窗底部 */
  .modal-footer {
    display:flex;
    justify-content:flex-end;
    gap:12px;
    padding:16px 20px;
    border-top:1px solid var(--border-default);
    background:var(--gray-50);
  }

  /* 详情弹窗样式 */
  .detail-content {
    font-size:14px;
  }

  .detail-row {
    display:flex;
    padding:12px 0;
    border-bottom:1px solid var(--border-light);
  }

  .detail-label {
    width:120px;
    color:var(--text-tertiary);
    flex-shrink:0;
  }

  .detail-value {
    color:var(--text-primary);
    font-weight:500;
  }

  /* 分页输入框 */
  .pagination-input {
    width:50px;
    padding:4px 8px;
    border:1px solid var(--border-strong);
    border-radius:4px;
    text-align:center;
    margin:0 4px;
  }
</style>

<!-- 已通过质量审查（第2轮修正）- 严过审 2026-09-18 -->
<script src="js/material-store.js"></script>
<script>
// 库存数据来自共享仓库 MaterialStore，与出入库/退货/使用页面实时联动
let inventoryData = [];

function loadInventoryData() {
  inventoryData = MaterialStore.all().map(function (m) {
    return {
      id: m.code,
      warehouse: m.warehouse,
      warehouseCode: m.warehouseCode,
      code: m.code,
      name: m.name,
      spec: m.spec,
      unit: m.unit,
      stock: String(m.stock),
      minStock: String(m.safety),
      status: MaterialStore.statusOf(m.code)
    };
  });
}

// 当前页面、每页条数、总条数、总页数
let currentPage = 1;
const pageSize = 10;
let totalItems = 0;
let totalPages = 1;
let filteredData = [];

// DOM元素
const tableBody = document.querySelector('.data-table tbody');
const pagination = document.querySelector('.pagination');
const searchBtn = document.querySelector('.search-bar .jg-btn');
const searchInput = document.getElementById('searchInput');
const warehouseSelect = document.getElementById('warehouseSelect');
const statusSelect = document.querySelector('.search-bar select:nth-child(2)');
const inboundBtn = document.querySelector('.action-bar .jg-btn-primary');
const exportBtn = document.querySelector('.action-bar .jg-btn-outline:nth-child(2)');
const countBtn = document.querySelector('.action-bar .jg-btn-outline:nth-child(3)');

// 弹窗元素
const inboundModal = document.getElementById('inboundModal');
const countModal = document.getElementById('countModal');
const viewModal = document.getElementById('viewModal');
const adjustModal = document.getElementById('adjustModal');
const exportModal = document.getElementById('exportModal');

// 初始化
function init() {
  loadInventoryData();
  filteredData = inventoryData.slice();
  totalItems = filteredData.length;
  totalPages = Math.ceil(totalItems / pageSize) || 1;
  renderTable();
  renderPagination();
  bindEvents();
  populateMaterialSelect();
}

// 渲染表格
function renderTable() {
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageData = filteredData.slice(start, end);
  
  tableBody.innerHTML = pageData.map((item, __seq) => {
    const stockClass = item.status === 'danger' ? 'style="color:var(--error); font-weight:600;"' : '';
    return `
      <tr>
        <td>${start + __seq + 1}</td>
        <td>${item.warehouse}</td>
        <td><strong>${item.code}</strong></td>
        <td>${item.name}</td>
        <td>${item.spec}</td>
        <td>${item.unit}</td>
        <td class="text-right" ${stockClass}>${item.stock}</td>
        <td class="text-right">${item.minStock}</td>
        <td><span class="status-tag ${item.status}">${getStatusText(item.status)}</span></td>
        <td>
          <div class="action-btns">
            <button class="action-btn detail" onclick="viewInventory('${item.id}')">详情</button>
            <button class="action-btn edit" onclick="adjustInventory('${item.id}')">调整</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

// 获取状态文本
function getStatusText(status) {
  const statusMap = {
    'normal': '正常',
    'danger': '库存不足',
    'high': '库存充足'
  };
  return statusMap[status] || status;
}

// 渲染分页
function renderPagination() {
  pagination.innerHTML = `
    <button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="prevPage()">‹</button>
    <button class="page-btn ${currentPage === 1 ? 'active' : ''}" onclick="goToPage(1)">1</button>
    ${currentPage > 2 ? `<button class="page-btn" onclick="goToPage(${currentPage - 1})">${currentPage - 1}</button>` : ''}
    ${currentPage > 1 && currentPage < totalPages ? `<button class="page-btn active" onclick="goToPage(${currentPage})">${currentPage}</button>` : ''}
    ${currentPage < totalPages - 1 ? `<button class="page-btn" onclick="goToPage(${currentPage + 1})">${currentPage + 1}</button>` : ''}
    ${totalPages > 1 ? `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="nextPage()">›</button>` : ''}
    <span style="margin-left:16px;font-size:13px;color:var(--text-tertiary);">第 <input type="number" class="pagination-input" id="pageInput" value="${currentPage}" min="1" max="${totalPages}" onkeydown="if(event.keyCode===13)jumpToPage()"> 页 / 共 ${totalPages} 页，共 ${totalItems} 条记录</span>
    <button class="jg-btn-outline" style="margin-left:12px;padding:2px 8px;font-size:12px;" onclick="jumpToPage()">跳转</button>
  `;
}

// 上一页
function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    renderTable();
    renderPagination();
  }
}

// 下一页
function nextPage() {
  if (currentPage < totalPages) {
    currentPage++;
    renderTable();
    renderPagination();
  }
}

// 跳转到指定页
function goToPage(page) {
  if (page >= 1 && page <= totalPages) {
    currentPage = page;
    renderTable();
    renderPagination();
  }
}

// 跳转按钮
function jumpToPage() {
  const pageInput = document.getElementById('pageInput');
  const page = parseInt(pageInput.value);
  if (!isNaN(page) && page >= 1 && page <= totalPages) {
    currentPage = page;
    renderTable();
    renderPagination();
  } else {
    pageInput.value = currentPage;
  }
}

// 搜索
function search() {
  const keyword = searchInput.value.toLowerCase().trim();
  const warehouse = warehouseSelect.value;
  const status = statusSelect.value;
  
  filteredData = inventoryData.filter(item => {
    let match = true;
    
    if (keyword) {
      match = match && (item.code.toLowerCase().includes(keyword) || item.name.toLowerCase().includes(keyword));
    }
    if (warehouse) {
      match = match && item.warehouseCode === warehouse;
    }
    if (status) {
      match = match && item.status === status;
    }
    
    return match;
  });
  
  totalItems = filteredData.length;
  totalPages = Math.ceil(totalItems / pageSize);
  currentPage = 1;
  
  renderTable();
  renderPagination();
}

// 绑定事件
function bindEvents() {
  searchBtn.addEventListener('click', search);
  
  searchInput.addEventListener('keydown', function(e) {
    if (e.keyCode === 13) {
      search();
    }
  });
  
  warehouseSelect.addEventListener('change', search);
  statusSelect.addEventListener('change', search);
  
  inboundBtn.addEventListener('click', openInboundModal);
  exportBtn.addEventListener('click', openExportModal);
  countBtn.addEventListener('click', openCountModal);
  
  // 点击遮罩层关闭弹窗
  inboundModal.addEventListener('click', function(e) {
    if (e.target === inboundModal) closeInboundModal();
  });
  countModal.addEventListener('click', function(e) {
    if (e.target === countModal) closeCountModal();
  });
  viewModal.addEventListener('click', function(e) {
    if (e.target === viewModal) closeViewModal();
  });
  adjustModal.addEventListener('click', function(e) {
    if (e.target === adjustModal) closeAdjustModal();
  });
  exportModal.addEventListener('click', function(e) {
    if (e.target === exportModal) closeExportModal();
  });
}

// 填充农资选择框
function populateMaterialSelect() {
  ['inboundMaterial', 'countMaterial'].forEach(function (id) {
    const select = document.getElementById(id);
    if (!select) return;
    select.innerHTML = '<option value="">请选择农资</option>';
    inventoryData.forEach(item => {
      const option = document.createElement('option');
      option.value = item.id;
      option.textContent = `${item.code} - ${item.name}`;
      select.appendChild(option);
    });
  });
}

// 打开入库弹窗
function openInboundModal() {
  document.getElementById('inboundCode').value = 'RK-' + Date.now().toString(36).toUpperCase();
  document.getElementById('inboundWarehouse').value = 'warehouse1';
  document.getElementById('inboundMaterial').value = '';
  document.getElementById('inboundQty').value = '';
  document.getElementById('inboundDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('inboundOperator').value = '';
  document.getElementById('inboundRemark').value = '';
  inboundModal.classList.add('show');
}

// 关闭入库弹窗
function closeInboundModal() {
  inboundModal.classList.remove('show');
}

// 保存入库
function saveInbound() {
  const materialId = document.getElementById('inboundMaterial').value;
  const qty = document.getElementById('inboundQty').value;

  if (!materialId) {
    alert('请选择农资');
    return;
  }
  if (!qty || parseInt(qty) <= 0) {
    alert('请输入有效数量');
    return;
  }

  const result = MaterialStore.applyDelta(materialId, parseInt(qty));
  if (!result.ok) {
    alert(result.message);
    return;
  }

  alert('入库成功');
  closeInboundModal();
  loadInventoryData();
  search();
}

// 打开盘点弹窗
function openCountModal() {
  document.getElementById('countCode').value = 'PD-' + Date.now().toString(36).toUpperCase();
  document.getElementById('countWarehouse').value = '';
  document.getElementById('countMaterial').value = '';
  document.getElementById('countQty').value = '';
  document.getElementById('countDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('countOperator').value = '';
  document.getElementById('countRemark').value = '';
  countModal.classList.add('show');
}

// 关闭盘点弹窗
function closeCountModal() {
  countModal.classList.remove('show');
}

// 保存盘点：将库存更新为实盘数量
function saveCount() {
  const materialId = document.getElementById('countMaterial').value;
  const qty = document.getElementById('countQty').value;
  const operator = document.getElementById('countOperator').value;

  if (!materialId) {
    alert('请选择盘点农资');
    return;
  }
  if (qty === '' || isNaN(parseInt(qty)) || parseInt(qty) < 0) {
    alert('请输入有效实盘数量');
    return;
  }
  if (!operator.trim()) {
    alert('请输入盘点人');
    return;
  }

  const result = MaterialStore.setStock(materialId, parseInt(qty));
  if (!result.ok) {
    alert(result.message);
    return;
  }

  alert('盘点完成，库存已按实盘数量更新');
  closeCountModal();
  loadInventoryData();
  search();
}

// 查看库存详情
function viewInventory(id) {
  const item = inventoryData.find(i => i.id === id);
  if (item) {
    document.getElementById('viewWarehouse').textContent = item.warehouse;
    document.getElementById('viewCode').textContent = item.code;
    document.getElementById('viewName').textContent = item.name;
    document.getElementById('viewSpec').textContent = item.spec;
    document.getElementById('viewUnit').textContent = item.unit;
    document.getElementById('viewStock').textContent = item.stock;
    document.getElementById('viewMin').textContent = item.minStock;
    document.getElementById('viewStatus').textContent = getStatusText(item.status);
    viewModal.classList.add('show');
  }
}

// 关闭查看弹窗
function closeViewModal() {
  viewModal.classList.remove('show');
}

// 打开调整弹窗
function adjustInventory(id) {
  const item = inventoryData.find(i => i.id === id);
  if (item) {
    document.getElementById('adjustId').value = item.id;
    document.getElementById('adjustName').value = item.name;
    document.getElementById('adjustCurrent').value = item.stock;
    document.getElementById('adjustType').value = 'increase';
    document.getElementById('adjustQty').value = '';
    document.getElementById('adjustDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('adjustOperator').value = '';
    document.getElementById('adjustReason').value = '';
    adjustModal.classList.add('show');
  }
}

// 关闭调整弹窗
function closeAdjustModal() {
  adjustModal.classList.remove('show');
}

// 保存调整
function saveAdjust() {
  const id = document.getElementById('adjustId').value;
  const type = document.getElementById('adjustType').value;
  const qty = document.getElementById('adjustQty').value;

  if (!qty || parseInt(qty) <= 0) {
    alert('请输入有效数量');
    return;
  }

  const delta = type === 'increase' ? parseInt(qty) : -parseInt(qty);
  const result = MaterialStore.applyDelta(id, delta);
  if (!result.ok) {
    alert(result.message);
    return;
  }

  alert('调整成功');
  closeAdjustModal();
  loadInventoryData();
  search();
}

// 打开导出弹窗
function openExportModal() {
  exportModal.classList.add('show');
}

// 关闭导出弹窗
function closeExportModal() {
  exportModal.classList.remove('show');
}

// 执行导出
function doExport() {
  const format = document.getElementById('exportFormat').value;
  alert(`库存数据将以${format === 'excel' ? 'Excel' : 'CSV'}格式导出`);
  closeExportModal();
}

document.addEventListener('DOMContentLoaded', init);
