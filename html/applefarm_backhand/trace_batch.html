<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 批次管理</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .modal-overlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center;
    z-index:1000; opacity:0; visibility:hidden; transition:all 0.3s ease;
  }
  .modal-overlay.active { opacity:1; visibility:visible; }
  .modal { background:var(--bg-card); border-radius:16px; width:640px; max-width:90vw; max-height:90vh; overflow:hidden; transform:scale(0.9); transition:all 0.3s ease; }
  .modal-overlay.active .modal { transform:scale(1); }
  .modal-header {
    padding:20px 24px; border-bottom:1px solid var(--border-default);
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(135deg, #1890ff 0%, #1a8a3a 100%); color:var(--text-inverse);
  }
  .modal-header h3 { font-size:18px; font-weight:600; margin:0; }
  .modal-close { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.2); border:none; color:var(--text-inverse); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
  .modal-close:hover { background:rgba(255,255,255,0.3); }
  .modal-body { padding:24px; max-height:60vh; overflow-y:auto; }
  .modal-footer { padding:16px 24px; border-top:1px solid var(--border-default); display:flex; justify-content:flex-end; gap:12px; }
  .detail-grid {
    display:grid; grid-template-columns:120px 1fr;
    gap:12px; padding:10px 0; border-bottom:1px solid var(--border-light);
  }
  .detail-grid:last-child { border-bottom:none; }
  .detail-label { color:var(--text-tertiary); font-size:14px; }
  .detail-value { color:var(--text-primary); font-size:14px; font-weight:500; }
  .edit-form { display:grid; gap:16px; }
  .form-group { display:flex; flex-direction:column; gap:6px; }
  .form-group label { font-size:14px; font-weight:500; color:var(--text-primary); }
  .form-group input, .form-group select, .form-group textarea { padding:10px 14px; border:1px solid var(--border-default); border-radius:8px; font-size:14px; transition:all 0.2s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--border-primary); box-shadow:0 0 0 3px rgba(24,144,255,0.1); }
  .form-group input[readonly] { background:var(--gray-50); color:var(--text-secondary); }
  .form-group textarea { resize:vertical; min-height:70px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .chain-box { background:#f8faf8; border-radius:12px; padding:16px 20px; margin-bottom:16px; }
  .chain-title { font-weight:600; color:var(--text-primary); font-size:14px; margin-bottom:10px; }
  .chain-list { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .chain-node { background:var(--bg-card); border:1px solid var(--border-default); border-radius:8px; padding:6px 12px; font-size:13px; color:var(--text-secondary); }
  .chain-node.hl { border-color:#1890ff; color:#1890ff; font-weight:500; }
  .chain-arrow { color:var(--text-tertiary); font-size:13px; }
  .toast { position:fixed; top:20px; right:20px; padding:14px 20px; background:var(--bg-card); border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.15); display:flex; align-items:center; gap:12px; z-index:2000; transform:translateX(120%); transition:all 0.3s ease; }
  .toast.show { transform:translateX(0); }
  .toast.success { border-left:4px solid var(--border-primary); }
  .toast.error { border-left:4px solid #ef4444; }
  .toast-icon { width:24px; height:24px; border-radius:50%; background:var(--gray-100); display:flex; align-items:center; justify-content:center; color:var(--primary-500); }
  /* 检测项目行编辑 */
  .ins-items { width:100%; border-collapse:collapse; font-size:13px; }
  .ins-items th { text-align:left; color:var(--text-tertiary); font-weight:500; padding:6px 4px; border-bottom:1px solid var(--border-light); }
  .ins-items td { padding:4px 4px; border-bottom:1px dashed var(--border-light); }
  .ins-items input[type=text] { width:100%; padding:6px 8px; border:1px solid var(--border-default); border-radius:6px; font-size:13px; }
  .ins-items select { padding:6px 8px; border:1px solid var(--border-default); border-radius:6px; font-size:13px; }
  .ins-item-del { border:none; background:transparent; color:#ef4444; cursor:pointer; font-size:16px; line-height:1; padding:2px 6px; }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="trace" data-active-submenu="trace-batch">

<div class="app-layout">

  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <div class="content-wrapper">

        <div class="search-section">
          <div class="search-bar">
            <select class="search-select" id="baseSelect" style="width:170px;">
              <option value="">全部基地</option>
            </select>
            <select class="search-select" id="productSelect" style="width:150px;">
              <option value="">全部产品</option>
            </select>
            <select class="search-select" id="statusSelect" style="width:140px;">
              <option value="">全部状态</option>
              <option value="pending">待包装</option>
              <option value="stored">已入库</option>
              <option value="packed">已包装</option>
              <option value="shipped">已发货</option>
            </select>
            <input type="text" class="search-input" placeholder="搜索批次号 / 地块..." id="searchInput" style="width:200px;">

          <div class="search-actions"><button class="jg-btn jg-btn-primary" onclick="searchData()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button><button class="jg-btn" onclick="resetSearch()">重置</button></div>
          </div>
        </div>

        <div class="action-bar">
          <div class="action-left">
            <button class="jg-btn jg-btn-primary" onclick="openCreateModal()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                <path d="M12 4v16m8-8H4"/>
              </svg>
              新建批次
            </button>
            <button class="jg-btn" onclick="openHarvestModal()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
              </svg>
              从采收记录建批
            </button>
            <button class="jg-btn" onclick="exportBatches()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              导出批次
            </button>
          </div>
        </div>

        <div class="data-section">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:60px;">序号</th>
                <th>批次号</th>
                <th>产品名称</th>
                <th>所属基地</th>
                <th>地块</th>
                <th>采收计划</th>
                <th>采收日期</th>
                <th>检测报告</th>
                <th>追溯码</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
          </table>
          <div id="pagination-container"></div>
        </div>
      </div>
    </main>
  </div>

</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h3>批次详情</h3>
      <button class="modal-close" onclick="closeModal('detailModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="detailContent"></div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('detailModal')">关闭</button>
      <button class="jg-btn jg-btn-primary" onclick="gotoTraceCode()">生成追溯码</button>
    </div>
  </div>
</div>

<!-- 新建 / 编辑弹窗 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="editModalTitle">新建批次</h3>
      <button class="modal-close" onclick="closeModal('editModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="edit-form">
        <div class="form-row">
          <div class="form-group">
            <label>批次号</label>
            <input type="text" id="editBatchNo" placeholder="如：PC-20260921-021">
          </div>
          <div class="form-group">
            <label>采收计划</label>
            <select id="editPlanNo"></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>所属基地</label>
            <select id="editBase"></select>
          </div>
          <div class="form-group">
            <label>地块</label>
            <select id="editPlot"></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>产品名称</label>
            <select id="editProduct"></select>
          </div>
          <div class="form-group">
            <label>规格</label>
            <input type="text" id="editSpec" placeholder="如：5kg/箱">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>采收日期</label>
            <input type="date" id="editHarvestDate">
          </div>
          <div class="form-group">
            <label>等级</label>
            <select id="editGrade">
              <option value="特级">特级</option>
              <option value="一级">一级</option>
              <option value="二级">二级</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>采收数量(kg)</label>
            <input type="number" id="editQuantity" min="1" placeholder="如：5000">
          </div>
          <div class="form-group">
            <label>采后处理单号</label>
            <input type="text" id="editProcessNo" placeholder="如：PP-2026-021">
          </div>
        </div>
        <div class="form-group">
          <label>状态</label>
          <select id="editStatus">
            <option value="pending">待包装</option>
            <option value="stored">已入库</option>
            <option value="packed">已包装</option>
            <option value="shipped">已发货</option>
          </select>
        </div>
        <div class="form-group">
          <label>备注</label>
          <textarea id="editRemark" placeholder="选填"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('editModal')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="saveBatch()">保存</button>
    </div>
  </div>
</div>

<!-- 从采收记录建批 -->
<div class="modal-overlay" id="harvestModal">
  <div class="modal" style="width:560px;">
    <div class="modal-header">
      <h3>从采收记录建批</h3>
      <button class="modal-close" onclick="closeModal('harvestModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group" style="margin-bottom:16px;">
        <label>采收记录（仅显示尚未建批的记录）</label>
        <select id="harvestRecordSelect" onchange="previewHarvestRecord()"></select>
      </div>
      <div class="chain-box" id="harvestPreview" style="margin-bottom:0;"></div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('harvestModal')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="confirmHarvestBatch()">创建批次</button>
    </div>
  </div>
</div>

<!-- 检测报告 -->
<div class="modal-overlay" id="inspectionModal">
  <div class="modal" style="width:680px;">
    <div class="modal-header">
      <h3 id="inspectionModalTitle">检测报告</h3>
      <button class="modal-close" onclick="closeModal('inspectionModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="edit-form">
        <div class="form-row">
          <div class="form-group">
            <label>批次号</label>
            <input type="text" id="insBatchNo" readonly>
          </div>
          <div class="form-group">
            <label>报告编号 <span style="color:#ef4444;">*</span></label>
            <input type="text" id="insReportNo" placeholder="如：JC-2026-9101">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>检测机构 <span style="color:#ef4444;">*</span></label>
            <input type="text" id="insInstitution" placeholder="检测机构全称">
          </div>
          <div class="form-group">
            <label>报告类型</label>
            <select id="insReportType">
              <option value="农药残留检测">农药残留检测</option>
              <option value="质量安全检测">质量安全检测</option>
              <option value="重金属检测">重金属检测</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>抽样日期</label>
            <input type="date" id="insSampleDate">
          </div>
          <div class="form-group">
            <label>出具日期</label>
            <input type="date" id="insIssueDate">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>有效期至</label>
            <input type="date" id="insValidUntil">
          </div>
          <div class="form-group">
            <label>检测结论 <span style="color:#ef4444;">*</span></label>
            <select id="insConclusion">
              <option value="合格">合格</option>
              <option value="不合格">不合格</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>CMA（选填）</label>
            <input type="text" id="insCma" placeholder="不强制要求">
          </div>
          <div class="form-group">
            <label>CNAS（选填）</label>
            <input type="text" id="insCnas" placeholder="不强制要求">
          </div>
        </div>
        <div class="form-group">
          <label>检测报告附件</label>
          <input type="file" id="insAttachment" accept=".pdf,.jpg,.jpeg,.png">
          <div class="form-hint" id="insAttachmentHint">支持 PDF / JPG / PNG；≤300KB 可在本地预览，超出仅保存文件信息。</div>
        </div>
        <div class="form-group">
          <label>检测项目</label>
          <div class="form-hint">按检测机构报告逐项录入，可增删；"是否合格"以报告结论为准。</div>
          <table class="ins-items">
            <thead>
              <tr>
                <th style="width:26%;">项目</th>
                <th style="width:20%;">结果</th>
                <th style="width:16%;">单位</th>
                <th style="width:16%;">限量</th>
                <th style="width:14%;">合格</th>
                <th style="width:8%;"></th>
              </tr>
            </thead>
            <tbody id="insItemsBody"></tbody>
          </table>
          <div>
            <button type="button" class="jg-btn" style="margin-top:8px;" onclick="addInspectionItem()">+ 添加检测项</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('inspectionModal')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="saveInspectionForm()">保存报告</button>
    </div>
  </div>
</div>

<!-- Toast提示 -->
<div class="toast" id="toast">
  <div class="toast-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
  </div>
  <span id="toastMessage">操作成功</span>
</div>

<script src="js/shared/harvest-store.js"></script>
<script src="js/shared/trace-store.js"></script>

/* ---------- 分页组件（与农事计划、地块管理一致） ---------- */
const Pagination = {
  currentPage: 1, pageSize: 10, filteredData: [],
  containerId: 'pagination-container', tbodyId: 'dataTableBody', renderRow: null,
  init: function(options) {
    this.currentPage = options.currentPage || 1;
    this.pageSize = options.pageSize || 10;
    this.filteredData = options.data || [];
    this.containerId = options.containerId || 'pagination-container';
    this.tbodyId = options.tbodyId || 'dataTableBody';
    this.renderRow = options.renderRow || null;
    this.render();
  },
  renderTable: function() {
    const tbody = document.getElementById(this.tbodyId);
    if (!tbody || !this.renderRow) return;
    const start = (this.currentPage - 1) * this.pageSize;
    const pageData = this.filteredData.slice(start, start + this.pageSize);
    tbody.innerHTML = pageData.map((item, i) => this.renderRow(item, start + i + 1)).join('');
  },
  render: function() {
    const container = document.getElementById(this.containerId);
    if (!container) return;
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    let html = '<div class="pagination">';
    html += `<button class="page-btn ${this.currentPage <= 1 ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage - 1})">‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= this.currentPage - 1 && i <= this.currentPage + 1)) {
        html += `<button class="page-btn ${i === this.currentPage ? 'active' : ''}" onclick="Pagination.goToPage(${i})">${i}</button>`;
      } else if (i === this.currentPage - 2 || i === this.currentPage + 2) {
        html += '<span class="page-ellipsis" style="padding:0 8px;color:#6b7b6b;">...</span>';
      }
    }
    html += `<button class="page-btn ${this.currentPage >= totalPages ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage + 1})">›</button>`;
    html += `<span style="margin-left:16px;font-size:13px;color:#6b7b6b;">第 ${this.currentPage} 页/共 ${totalPages} 页，共 ${this.filteredData.length} 条记录</span>`;
    html += '</div>';
    container.innerHTML = html;
    this.renderTable();
  },
  goToPage: function(page) {
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    if (page < 1 || page > totalPages) return;
    this.currentPage = page;
    this.render();
  },
  updateData: function(data) {
    this.filteredData = data;
    this.currentPage = 1;
    this.render();
  }
};

/* ---------- 工具 ---------- */
function getPlot(code) { return PLOT_SOURCE.find(p => p.code === code) || {code:code, name:'-', base:'-', variety:'-'}; }
function getProduct(batch) { return batch.product || VARIETY_PRODUCT[getPlot(batch.plotCode).variety] || '花牛苹果'; }
function inspectBadge(batchNo) {
  const st = TraceStore.inspectionState(batchNo);
  if (st.hasValid) return '<span class="status-tag active">有效</span>';
  if (!st.latest) return '<span class="status-tag inactive">缺失</span>';
  const map = { expired: '已过期', revoked: '已撤销', invalid: '不合格', pending: '待出报告' };
  const cls = st.latest.status === 'expired' || st.latest.status === 'revoked' || st.latest.status === 'invalid' ? 'inactive' : 'warning';
  return `<span class="status-tag ${cls}">${map[st.latest.status] || '待补录'}</span>`;
}
function enrich(batch) {
  const plot = getPlot(batch.plotCode);
  return Object.assign({}, batch, {
    plotName: batch.plotName || plot.name,
    base: batch.base || plot.base,
    variety: batch.variety || plot.variety,
    product: getProduct(batch),
    codeCount: batch.codeCount != null ? batch.codeCount : (batch.traceCount || 0),
    statusText: STATUS_TEXT[batch.status] || batch.status
  });
}

    const item = enrich(b);
    if (base && item.base !== base) return false;

    if (status && item.status !== status) return false;
    if (keyword && !item.batchNo.toLowerCase().includes(keyword)

function gotoTraceCode(batchNo) {
  const seq = batchNo || (currentDetailId ? (enrich(loadBatches().find(b => b.id === currentDetailId)) || {}).batchNo : '');
  if (!seq) { showToast('未找到批次', 'error'); return; }
  const batch = loadBatches().find(b => b.batchNo === seq);
  const gate = TraceStore.inspectionState(seq);
  if (!gate.canCode && (!batch || !batch.codeCount)) {
    showToast(gate.message + '，请先补录检测报告', 'error');
    openInspectionModal(seq);
    return;
  }
  closeModal('detailModal');
  showToast(`已跳转溯源编码，批次：${seq}`);
  const url = 'trace_code.html?batch=' + encodeURIComponent(seq);
  setTimeout(() => {
    try {
      if (window.parent && window.parent !== window && typeof window.parent.openPage === 'function') {
        window.parent.openPage(url, '溯源编码');
        return;
      }
    } catch (e) { /* 跨域时回退为当前窗口跳转 */ }
    window.location.href = url;
  }, 400);
}

function saveBatch() {
  const batchNo = document.getElementById('editBatchNo').value.trim();
  const quantity = document.getElementById('editQuantity').value;
  if (!batchNo) { showToast('请输入批次号', 'error'); return; }
  if (!/^PC-\d{8}-\d{3}$/.test(batchNo)) { showToast('批次号格式应为 PC-YYYYMMDD-NNN', 'error'); return; }
  if (!quantity || Number(quantity) <= 0) { showToast('请输入采收数量', 'error'); return; }

  const exists = TraceStore.batches().some(b => b.batchNo === batchNo && b.id !== currentEditId);
  if (exists) { showToast('批次号已存在', 'error'); return; }

  const plotCode = document.getElementById('editPlot').value;
  const plot = getPlot(plotCode);
  const payload = {
    batchNo: batchNo,
    plotCode: plotCode,
    plotName: plot.name,
    base: plot.base,
    variety: plot.variety,
    product: document.getElementById('editProduct').value || getProduct({ plotCode: plotCode }),
    planNo: document.getElementById('editPlanNo').value,
    processNo: document.getElementById('editProcessNo').value.trim(),
    harvestDate: document.getElementById('editHarvestDate').value,
    grade: document.getElementById('editGrade').value,
    quantity: Number(quantity),
    spec: document.getElementById('editSpec').value.trim(),
    status: document.getElementById('editStatus').value,
    remark: document.getElementById('editRemark').value.trim()
  };
  if (currentEditId) {
    const old = TraceStore.batch(currentEditId);
    if (old) payload.sourceRecordId = old.sourceRecordId;
  }
  const res = TraceStore.saveBatch(payload);
  if (!res.ok) { showToast(res.message || '保存失败', 'error'); return; }
  showToast(currentEditId ? '批次已保存' : '批次已创建');
  closeModal('editModal');
  Pagination.updateData(loadBatches());
}

function previewHarvestRecord() {
  const idx = Number(document.getElementById('harvestRecordSelect').value || 0);
  const r = harvestWorking[idx];
  const box = document.getElementById('harvestPreview');
  if (!r) {
    box.innerHTML = '<div class="detail-value">请选择采收记录</div>';
    return;
  }
  box.innerHTML = `
    <div class="chain-title">将创建批次</div>
    <div class="detail-grid"><span class="detail-label">批次号</span><span class="detail-value">${r.batchNo}</span></div>
    <div class="detail-grid"><span class="detail-label">基地 / 地块</span><span class="detail-value">${r.base} · ${r.plotCode} ${r.plotName}</span></div>
    <div class="detail-grid"><span class="detail-label">产品</span><span class="detail-value">${r.product} / ${r.variety}</span></div>
    <div class="detail-grid"><span class="detail-label">采收</span><span class="detail-value">${r.harvestDate} · ${r.quantity} kg · ${r.grade}</span></div>
  `;
}

function confirmHarvestBatch() {
  const idx = Number(document.getElementById('harvestRecordSelect').value || 0);
  const r = harvestWorking[idx];
  if (!r) { showToast('暂无采收记录可建批', 'error'); return; }
  const res = TraceStore.createBatchFromHarvest(r.recordId);
  if (!res.ok) { showToast(res.message || '建批失败', 'error'); return; }
  showToast('已从采收记录创建批次 ' + r.batchNo);
  closeModal('harvestModal');
  Pagination.updateData(loadBatches());
}

/* ---------- 检测报告 ---------- */
let currentInspectionBatch = '';

const DEFAULT_INSPECTION_ITEMS = [
  { name: '敌敌畏', result: '未检出', unit: 'mg/kg', limit: '≤0.2', qualified: true },
  { name: '毒死蜱', result: '0.02', unit: 'mg/kg', limit: '≤1.0', qualified: true },
  { name: '氯氰菊酯', result: '未检出', unit: 'mg/kg', limit: '≤2.0', qualified: true },
  { name: '铅（Pb）', result: '0.01', unit: 'mg/kg', limit: '≤0.1', qualified: true },
  { name: '镉（Cd）', result: '0.005', unit: 'mg/kg', limit: '≤0.05', qualified: true }
];

function inspectionItemRow(item) {
  const it = item || { name: '', result: '', unit: 'mg/kg', limit: '', qualified: true };
  return `<tr>
    <td><input type="text" class="ins-item-name" value="${escapeAttr(it.name)}" placeholder="如 敌敌畏"></td>
    <td><input type="text" class="ins-item-result" value="${escapeAttr(it.result)}" placeholder="如 未检出"></td>
    <td><input type="text" class="ins-item-unit" value="${escapeAttr(it.unit)}"></td>
    <td><input type="text" class="ins-item-limit" value="${escapeAttr(it.limit)}" placeholder="≤0.2"></td>
    <td>
      <select class="ins-item-qualified">
        <option value="1"${it.qualified ? ' selected' : ''}>合格</option>
        <option value="0"${it.qualified ? '' : ' selected'}>不合格</option>
      </select>
    </td>
    <td><button type="button" class="ins-item-del" title="删除" onclick="this.closest('tr').remove()">×</button></td>
  </tr>`;
}

function escapeAttr(v) {
  return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderInspectionItems(items) {
  const list = Array.isArray(items) && items.length ? items : DEFAULT_INSPECTION_ITEMS;
  document.getElementById('insItemsBody').innerHTML = list.map(inspectionItemRow).join('');
}

function addInspectionItem() {
  document.getElementById('insItemsBody').insertAdjacentHTML('beforeend', inspectionItemRow(null));
}

function collectInspectionItems() {
  const rows = document.querySelectorAll('#insItemsBody tr');
  const out = [];
  rows.forEach(function (tr) {
    const name = tr.querySelector('.ins-item-name').value.trim();
    if (!name) return;
    out.push({
      name: name,
      result: tr.querySelector('.ins-item-result').value.trim(),
      unit: tr.querySelector('.ins-item-unit').value.trim() || 'mg/kg',
      limit: tr.querySelector('.ins-item-limit').value.trim(),
      qualified: tr.querySelector('.ins-item-qualified').value === '1'
    });
  });
  return out.length ? out : undefined;
}

function openInspectionModal(batchNo) {
  currentInspectionBatch = batchNo;
  const state = TraceStore.inspectionState(batchNo);
  const ins = state.latest || {};
  document.getElementById('inspectionModalTitle').textContent = '检测报告 · ' + batchNo;
  document.getElementById('insBatchNo').value = batchNo;
  document.getElementById('insReportNo').value = ins.reportNo || '';
  document.getElementById('insInstitution').value = ins.institution || '';
  document.getElementById('insReportType').value = ins.reportType || '农药残留检测';
  document.getElementById('insSampleDate').value = ins.sampleDate || '';
  document.getElementById('insIssueDate').value = ins.issueDate || new Date().toISOString().slice(0, 10);
  document.getElementById('insValidUntil').value = ins.validUntil || '';
  document.getElementById('insConclusion').value = ins.conclusion || '合格';
  document.getElementById('insCma').value = ins.cma || '';
  document.getElementById('insCnas').value = ins.cnas || '';
  document.getElementById('insAttachment').value = '';
  document.getElementById('insAttachmentHint').textContent = ins.attachment
    ? `已上传：${ins.attachment.name}（${Math.round(ins.attachment.size / 1024)}KB）`
    : '支持 PDF / JPG / PNG；≤300KB 可在本地预览，超出仅保存文件信息。';
  renderInspectionItems(ins.items);
  openModal('inspectionModal');
}

function readFileAttachment(file, cb) {
  if (!file) { cb(null); return; }
  const meta = { name: file.name, size: file.size, type: file.type || 'application/octet-stream', uploadedAt: new Date().toLocaleString('zh-CN', { hour12: false }) };
  if (file.size <= 300 * 1024) {
    const reader = new FileReader();
    reader.onload = function () { meta.dataUrl = reader.result; cb(meta); };
    reader.onerror = function () { cb(meta); };
    reader.readAsDataURL(file);
  } else {
    cb(meta);
  }
}

function saveInspectionForm() {
  const batchNo = currentInspectionBatch || document.getElementById('insBatchNo').value;
  const reportNo = document.getElementById('insReportNo').value.trim();
  const institution = document.getElementById('insInstitution').value.trim();
  if (!reportNo) { showToast('请填写检测报告编号', 'error'); return; }
  if (!institution) { showToast('请填写检测机构', 'error'); return; }
  const file = document.getElementById('insAttachment').files[0];
  readFileAttachment(file, function (attachment) {
    const old = TraceStore.inspectionState(batchNo).latest;
    const payload = {
      id: old ? old.id : undefined,
      batchNo: batchNo,
      reportNo: reportNo,
      institution: institution,
      reportType: document.getElementById('insReportType').value,
      sampleDate: document.getElementById('insSampleDate').value,
      issueDate: document.getElementById('insIssueDate').value,
      validUntil: document.getElementById('insValidUntil').value,
      conclusion: document.getElementById('insConclusion').value,
      cma: document.getElementById('insCma').value.trim(),
      cnas: document.getElementById('insCnas').value.trim(),
      attachment: attachment || (old ? old.attachment : null),
      items: collectInspectionItems() || (old ? old.items : undefined),
      status: (old && old.status === 'revoked' && old.reportNo === reportNo) ? 'revoked' : undefined
    };
    const res = TraceStore.saveInspection(payload);
    if (!res.ok) { showToast(res.message || '保存失败', 'error'); return; }
    showToast('检测报告已保存');
    closeModal('inspectionModal');
    Pagination.updateData(loadBatches());
  });
}

/* ---------- 弹窗 / 提示 ---------- */
function openModal(id) {
  document.getElementById(id).classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
  document.body.style.overflow = '';
}

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  document.getElementById('toastMessage').textContent = message;
  toast.className = `toast ${type}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

/* ---------- 初始化 ---------- */
document.addEventListener('DOMContentLoaded', function() {
  const baseSelect = document.getElementById('baseSelect');
  BASE_SOURCE.forEach(b => {
    const opt = document.createElement('option');
    opt.value = b; opt.textContent = b;
    baseSelect.appendChild(opt);
  });

  const productSelect = document.getElementById('productSelect');
  PRODUCT_SOURCE.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p; opt.textContent = p;
    productSelect.appendChild(opt);
  });

  initFormOptions();

  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: loadBatches(),
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderBatchRow
  });

  TraceStore.subscribe(function () {
    Pagination.updateData(loadBatches());
  });

  // 点击遮罩关闭
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeModal(overlay.id);
    });
  });
  // ESC 关闭
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.active').forEach(o => closeModal(o.id));
    }
  });
});
