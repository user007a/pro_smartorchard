<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 批次管理</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .modal-overlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center;
    z-index:1000; opacity:0; visibility:hidden; transition:all 0.3s ease;
  }
  .modal-overlay.active { opacity:1; visibility:visible; }
  .modal { background:var(--bg-card); border-radius:16px; width:640px; max-width:90vw; max-height:90vh; overflow:hidden; transform:scale(0.9); transition:all 0.3s ease; }
  .modal-overlay.active .modal { transform:scale(1); }
  .modal-header {
    padding:20px 24px; border-bottom:1px solid var(--border-default);
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(135deg, #1890ff 0%, #1a8a3a 100%); color:var(--text-inverse);
  }
  .modal-header h3 { font-size:18px; font-weight:600; margin:0; }
  .modal-close { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.2); border:none; color:var(--text-inverse); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
  .modal-close:hover { background:rgba(255,255,255,0.3); }
  .modal-body { padding:24px; max-height:60vh; overflow-y:auto; }
  .modal-footer { padding:16px 24px; border-top:1px solid var(--border-default); display:flex; justify-content:flex-end; gap:12px; }
  .detail-grid {
    display:grid; grid-template-columns:120px 1fr;
    gap:12px; padding:10px 0; border-bottom:1px solid var(--border-light);
  }
  .detail-grid:last-child { border-bottom:none; }
  .detail-label { color:var(--text-tertiary); font-size:14px; }
  .detail-value { color:var(--text-primary); font-size:14px; font-weight:500; }
  .edit-form { display:grid; gap:16px; }
  .form-group { display:flex; flex-direction:column; gap:6px; }
  .form-group label { font-size:14px; font-weight:500; color:var(--text-primary); }
  .form-group input, .form-group select, .form-group textarea { padding:10px 14px; border:1px solid var(--border-default); border-radius:8px; font-size:14px; transition:all 0.2s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--border-primary); box-shadow:0 0 0 3px rgba(24,144,255,0.1); }
  .form-group input[readonly] { background:var(--gray-50); color:var(--text-secondary); }
  .form-group textarea { resize:vertical; min-height:70px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .chain-box { background:#f8faf8; border-radius:12px; padding:16px 20px; margin-bottom:16px; }
  .chain-title { font-weight:600; color:var(--text-primary); font-size:14px; margin-bottom:10px; }
  .chain-list { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .chain-node { background:var(--bg-card); border:1px solid var(--border-default); border-radius:8px; padding:6px 12px; font-size:13px; color:var(--text-secondary); }
  .chain-node.hl { border-color:#1890ff; color:#1890ff; font-weight:500; }
  .chain-arrow { color:var(--text-tertiary); font-size:13px; }
  .toast { position:fixed; top:20px; right:20px; padding:14px 20px; background:var(--bg-card); border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.15); display:flex; align-items:center; gap:12px; z-index:2000; transform:translateX(120%); transition:all 0.3s ease; }
  .toast.show { transform:translateX(0); }
  .toast.success { border-left:4px solid var(--border-primary); }
  .toast.error { border-left:4px solid #ef4444; }
  .toast-icon { width:24px; height:24px; border-radius:50%; background:var(--gray-100); display:flex; align-items:center; justify-content:center; color:var(--primary-500); }
</style>

<body data-active-menu="trace" data-active-submenu="trace-batch">

<div class="app-layout">

  <div class="main-wrapper">

    <main class="main-content">

            </select>
            <select class="search-select" id="productSelect" style="width:150px;">

            </select>

        </div>

            </thead>
            <tbody id="dataTableBody"></tbody>
          </table>
          <div id="pagination-container"></div>
        </div>
      </div>
    </main>
  </div>

</div>

const STATUS_TEXT = { pending:'待包装', stored:'已入库', packed:'已包装', shipped:'已发货' };

let currentDetailId = null;
let currentEditId = null;

/* ---------- 分页组件（与农事计划、地块管理一致） ---------- */
const Pagination = {
  currentPage: 1, pageSize: 10, filteredData: [],
  containerId: 'pagination-container', tbodyId: 'dataTableBody', renderRow: null,
  init: function(options) {
    this.currentPage = options.currentPage || 1;
    this.pageSize = options.pageSize || 10;
    this.filteredData = options.data || [];
    this.containerId = options.containerId || 'pagination-container';
    this.tbodyId = options.tbodyId || 'dataTableBody';
    this.renderRow = options.renderRow || null;
    this.render();
  },
  renderTable: function() {
    const tbody = document.getElementById(this.tbodyId);
    if (!tbody || !this.renderRow) return;
    const start = (this.currentPage - 1) * this.pageSize;
    const pageData = this.filteredData.slice(start, start + this.pageSize);
    tbody.innerHTML = pageData.map((item, i) => this.renderRow(item, start + i + 1)).join('');
  },
  render: function() {
    const container = document.getElementById(this.containerId);
    if (!container) return;
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    let html = '<div class="pagination">';
    html += `<button class="page-btn ${this.currentPage <= 1 ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage - 1})">‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= this.currentPage - 1 && i <= this.currentPage + 1)) {
        html += `<button class="page-btn ${i === this.currentPage ? 'active' : ''}" onclick="Pagination.goToPage(${i})">${i}</button>`;
      } else if (i === this.currentPage - 2 || i === this.currentPage + 2) {
        html += '<span class="page-ellipsis" style="padding:0 8px;color:#6b7b6b;">...</span>';
      }
    }
    html += `<button class="page-btn ${this.currentPage >= totalPages ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage + 1})">›</button>`;
    html += `<span style="margin-left:16px;font-size:13px;color:#6b7b6b;">第 ${this.currentPage} 页/共 ${totalPages} 页，共 ${this.filteredData.length} 条记录</span>`;
    html += '</div>';
    container.innerHTML = html;
    this.renderTable();
  },
  goToPage: function(page) {
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    if (page < 1 || page > totalPages) return;
    this.currentPage = page;
    this.render();
  },
  updateData: function(data) {
    this.filteredData = data;
    this.currentPage = 1;
    this.render();
  }
};

/* ---------- 工具 ---------- */
function getPlot(code) { return PLOT_SOURCE.find(p => p.code === code) || {code:code, name:'-', base:'-', variety:'-'}; }
function getProduct(batch) { return VARIETY_PRODUCT[getPlot(batch.plotCode).variety] || '花牛苹果'; }
function enrich(batch) {
  const plot = getPlot(batch.plotCode);
  return Object.assign({}, batch, {
    plotName: plot.name,
    base: plot.base,
    variety: plot.variety,
    product: getProduct(batch),
    statusText: STATUS_TEXT[batch.status] || batch.status
  });
}

/* ---------- 渲染 ---------- */
function renderBatchRow(batch, seq) {
  const item = enrich(batch);
  return `
    <tr data-id="${item.id}">
      <td>${seq}</td>
      <td><strong>${item.batchNo}</strong></td>
      <td>${item.product}</td>
      <td>${item.base}</td>
      <td>${item.plotCode} · ${item.plotName}</td>
      <td>${item.planNo}</td>
      <td>${item.harvestDate}</td>
      <td>${item.traceCount} 个</td>
      <td><span class="status-tag ${item.status === 'shipped' ? 'active' : item.status === 'pending' ? 'inactive' : 'warning'}">${item.statusText}</span></td>
      <td>
        <div class="action-btns">
          <button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>
          <button class="action-btn edit" onclick="showEdit('${item.id}')">编辑</button>
          <button class="action-btn qrcode" onclick="gotoTraceCode('${item.batchNo}')">追溯码</button>
        </div>
      </td>
    </tr>
  `;
}

/* ---------- 搜索 ---------- */
function searchData() {
  const base = document.getElementById('baseSelect').value;
  const product = document.getElementById('productSelect').value;
  const status = document.getElementById('statusSelect').value;
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

  const filtered = mockBatchData.filter(b => {
    const item = enrich(b);
    if (base && item.base !== base) return false;
    if (product && item.product !== product) return false;
    if (status && item.status !== status) return false;
    if (keyword && !item.batchNo.toLowerCase().includes(keyword)
      && !item.plotCode.toLowerCase().includes(keyword)
      && !item.plotName.toLowerCase().includes(keyword)) return false;
    return true;
  });
  Pagination.updateData(filtered);
  showToast(`找到 ${filtered.length} 条记录`);
}

function resetSearch() {
  document.getElementById('baseSelect').value = '';
  document.getElementById('productSelect').value = '';
  document.getElementById('statusSelect').value = '';
  document.getElementById('searchInput').value = '';
  Pagination.updateData(mockBatchData);
  showToast('已重置筛选条件');
}

function exportBatches() {
  showToast(`已导出 ${Pagination.filteredData.length} 条批次记录`);
}

/* ---------- 详情 ---------- */

  const item = enrich(batch);

  document.getElementById('detailContent').innerHTML = `
    <div class="chain-box">
      <div class="chain-title">溯源链路</div>
      <div class="chain-list">
        <span class="chain-node">${item.planNo} 采收计划</span>
        <span class="chain-arrow">→</span>
        <span class="chain-node">${item.plotCode} · ${item.plotName}</span>
        <span class="chain-arrow">→</span>
        <span class="chain-node hl">${item.batchNo}</span>
        <span class="chain-arrow">→</span>
        <span class="chain-node">${item.processNo} 采后处理</span>
        <span class="chain-arrow">→</span>
        <span class="chain-node">${item.traceCount} 个追溯码</span>
      </div>
    </div>
    <div class="detail-grid"><span class="detail-label">批次号</span><span class="detail-value">${item.batchNo}</span></div>
    <div class="detail-grid"><span class="detail-label">产品名称</span><span class="detail-value">${item.product}</span></div>
    <div class="detail-grid"><span class="detail-label">品种</span><span class="detail-value">${item.variety}</span></div>
    <div class="detail-grid"><span class="detail-label">规格</span><span class="detail-value">${item.spec}</span></div>
    <div class="detail-grid"><span class="detail-label">所属基地</span><span class="detail-value">${item.base}</span></div>
    <div class="detail-grid"><span class="detail-label">地块</span><span class="detail-value">${item.plotCode} · ${item.plotName}</span></div>
    <div class="detail-grid"><span class="detail-label">采收计划</span><span class="detail-value">${item.planNo}</span></div>
    <div class="detail-grid"><span class="detail-label">采后处理单</span><span class="detail-value">${item.processNo}</span></div>
    <div class="detail-grid"><span class="detail-label">采收日期</span><span class="detail-value">${item.harvestDate}</span></div>
    <div class="detail-grid"><span class="detail-label">等级</span><span class="detail-value">${item.grade}</span></div>
    <div class="detail-grid"><span class="detail-label">采收数量</span><span class="detail-value">${item.quantity} kg</span></div>
    <div class="detail-grid"><span class="detail-label">已生成追溯码</span><span class="detail-value">${item.traceCount} 个</span></div>
    <div class="detail-grid"><span class="detail-label">状态</span><span class="detail-value"><span class="status-tag ${item.status === 'shipped' ? 'active' : item.status === 'pending' ? 'inactive' : 'warning'}">${item.statusText}</span></span></div>
    <div class="detail-grid"><span class="detail-label">备注</span><span class="detail-value">${item.remark || '—'}</span></div>
  `;
  openModal('detailModal');
}

function gotoTraceCode(batchNo) {
  const seq = batchNo || (currentDetailId ? enrich(mockBatchData.find(b => b.id === currentDetailId)).batchNo : '');
  closeModal('detailModal');
  showToast(`已跳转溯源编码，批次：${seq}`);
  const url = 'trace_code.html?batch=' + encodeURIComponent(seq);
  setTimeout(() => {
    try {
      if (window.parent && window.parent !== window && typeof window.parent.openPage === 'function') {
        window.parent.openPage(url, '溯源编码');
        return;
      }
    } catch (e) { /* 跨域时回退为当前窗口跳转 */ }
    window.location.href = url;
  }, 400);
}

/* ---------- 新建 / 编辑 ---------- */
function fillSelect(el, list, valueKey, textFn) {
  el.innerHTML = list.map(v => `<option value="${valueKey ? v[valueKey] : v}">${textFn ? textFn(v) : v}</option>`).join('');
}

function initFormOptions() {
  fillSelect(document.getElementById('editPlanNo'), PLAN_SOURCE);
  fillSelect(document.getElementById('editBase'), BASE_SOURCE);
  fillSelect(document.getElementById('editProduct'), PRODUCT_SOURCE);
  refreshPlotOptions();
  document.getElementById('editBase').addEventListener('change', refreshPlotOptions);
}

function refreshPlotOptions() {
  const base = document.getElementById('editBase').value;
  const list = PLOT_SOURCE.filter(p => p.base === base);
  const plotSelect = document.getElementById('editPlot');
  const source = list.length ? list : PLOT_SOURCE;
  fillSelect(plotSelect, source, 'code', p => `${p.code} · ${p.name}`);
}

function openCreateModal() {
  currentEditId = null;
  document.getElementById('editModalTitle').textContent = '新建批次';
  document.getElementById('editBatchNo').value = '';
  document.getElementById('editSpec').value = '';
  document.getElementById('editHarvestDate').value = '2026-09-21';
  document.getElementById('editQuantity').value = '';
  document.getElementById('editProcessNo').value = '';
  document.getElementById('editRemark').value = '';
  document.getElementById('editGrade').value = '一级';
  document.getElementById('editStatus').value = 'pending';
  document.getElementById('editPlanNo').selectedIndex = 0;
  document.getElementById('editBase').selectedIndex = 0;
  refreshPlotOptions();
  document.getElementById('editProduct').selectedIndex = 0;
  openModal('editModal');
}

function showEdit(id) {
  const batch = mockBatchData.find(b => b.id === id);
  if (!batch) return;
  currentEditId = id;
  const item = enrich(batch);
  document.getElementById('editModalTitle').textContent = '编辑批次';
  document.getElementById('editBatchNo').value = item.batchNo;
  document.getElementById('editPlanNo').value = item.planNo;
  document.getElementById('editBase').value = BASE_SOURCE.indexOf(item.base) >= 0 ? item.base : BASE_SOURCE[0];
  refreshPlotOptions();
  document.getElementById('editPlot').value = item.plotCode;
  document.getElementById('editProduct').value = item.product;
  document.getElementById('editSpec').value = item.spec;
  document.getElementById('editHarvestDate').value = item.harvestDate;
  document.getElementById('editGrade').value = item.grade;
  document.getElementById('editQuantity').value = item.quantity;
  document.getElementById('editProcessNo').value = item.processNo;
  document.getElementById('editStatus').value = item.status;
  document.getElementById('editRemark').value = item.remark || '';
  openModal('editModal');
}

function saveBatch() {
  const batchNo = document.getElementById('editBatchNo').value.trim();
  const quantity = document.getElementById('editQuantity').value;
  if (!batchNo) { showToast('请输入批次号', 'error'); return; }
  if (!/^PC-\d{8}-\d{3}$/.test(batchNo)) { showToast('批次号格式应为 PC-YYYYMMDD-NNN', 'error'); return; }
  if (!quantity || Number(quantity) <= 0) { showToast('请输入采收数量', 'error'); return; }

  const duplicated = mockBatchData.some(b => b.batchNo === batchNo && b.id !== currentEditId);
  if (duplicated) { showToast('批次号已存在', 'error'); return; }

  const payload = {
    batchNo: batchNo,
    plotCode: document.getElementById('editPlot').value,
    planNo: document.getElementById('editPlanNo').value,
    processNo: document.getElementById('editProcessNo').value.trim(),
    harvestDate: document.getElementById('editHarvestDate').value,
    grade: document.getElementById('editGrade').value,
    quantity: Number(quantity),
    spec: document.getElementById('editSpec').value.trim(),
    status: document.getElementById('editStatus').value,
    remark: document.getElementById('editRemark').value.trim()
  };

  if (currentEditId) {
    const target = mockBatchData.find(b => b.id === currentEditId);
    Object.assign(target, payload);
    showToast('批次已保存');
  } else {
    payload.id = 'BAT' + String(mockBatchData.length + 1).padStart(3, '0');
    payload.traceCount = 0;
    mockBatchData.unshift(payload);
    showToast('批次已创建');
  }
  closeModal('editModal');
  Pagination.updateData(mockBatchData);
}

/* ---------- 弹窗 / 提示 ---------- */
function openModal(id) {
  document.getElementById(id).classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
  document.body.style.overflow = '';
}

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  document.getElementById('toastMessage').textContent = message;
  toast.className = `toast ${type}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

/* ---------- 初始化 ---------- */
document.addEventListener('DOMContentLoaded', function() {
  const baseSelect = document.getElementById('baseSelect');
  [...new Set(PLOT_SOURCE.map(p => p.base))].forEach(b => {
    const opt = document.createElement('option');
    opt.value = b; opt.textContent = b;
    baseSelect.appendChild(opt);
  });

  const productSelect = document.getElementById('productSelect');
  PRODUCT_SOURCE.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p; opt.textContent = p;
    productSelect.appendChild(opt);
  });

  initFormOptions();

  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: mockBatchData,
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderBatchRow
  });

  // 点击遮罩关闭
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeModal(overlay.id);
    });
  });
  // ESC 关闭
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.active').forEach(o => closeModal(o.id));
    }
  });
});
