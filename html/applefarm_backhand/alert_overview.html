<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 预警总览</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  /* KPI 行：四列统计卡片（与全站统计卡片栅格一致） */
  .kpi-row { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:16px; margin-bottom:20px; }
  @media (max-width:1100px){ .kpi-row { grid-template-columns:repeat(2, minmax(0, 1fr)); } }

  /* unified-theme 的 .stat-card + .stat-card 纵向 margin 在栅格中会造成卡片错位 */
  .kpi-row .stat-card { margin-top:0 !important; }

  .grid-2 { display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-bottom:20px; }
  @media (max-width:1100px){ .grid-2 { grid-template-columns:1fr; } }

  /* 面板：白底 + 浅灰描边 + 极轻投影，与全站面板统一 */
  .panel {
    background:var(--bg-card);
    border:1px solid #f0f0f0;
    border-radius:12px;
    padding:18px 20px;
    box-shadow:0 1px 3px rgba(16,24,40,0.06);
    min-width:0;
  }
  .panel-title {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding-bottom:12px; margin-bottom:14px;
    border-bottom:1px solid #f0f0f0;
    font-size:15px; font-weight:600; color:var(--text-primary);
  }
  .panel-title > span:first-child { display:inline-flex; align-items:center; gap:8px; }
  .panel-title svg { width:16px; height:16px; color:var(--primary-500); flex-shrink:0; }
  .panel-title .meta { font-size:12px; font-weight:normal; color:var(--text-tertiary); }
  .panel-title .live-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--success); margin-right:5px; vertical-align:middle; }

  /* 今日预警列表：扁平行式，分隔线代替色块底 */
  .top-list { display:flex; flex-direction:column; }
  .top-item {
    display:grid; grid-template-columns:auto 1fr auto; gap:12px;
    padding:12px 0; align-items:start;
    border-bottom:1px solid #f0f0f0;
  }
  .top-item:last-child { border-bottom:none; padding-bottom:0; }
  .top-item .txt { font-size:14px; font-weight:600; color:#262626; line-height:1.5; }
  .top-item .src { font-size:12px; color:#8c8c8c; margin-top:2px; }
  .top-item .tm { font-size:12px; color:#bfbfbf; white-space:nowrap; }

  #alertTrend, #levelDonut { width:100%; height:200px; }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="alert" data-active-submenu="alert-overview">

<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>
    <main class="main-content">
      <div class="content-wrapper">

        <!-- KPI 行 -->
        <div class="kpi-row">
          <div class="stat-card danger">
            <div class="stat-header">
              <span class="stat-label">待处理预警</span>
              <span class="stat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                  <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                  <line x1="12" y1="9" x2="12" y2="13"/>
                  <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
              </span>
            </div>
            <div class="stat-value" id="kpiPending">0</div>
            <div class="stat-footer">含紧急 <span id="kpiUrgent">0</span> 条 · 较昨日 <span style="color:var(--error)">+3</span></div>
          </div>
          <div class="stat-card blue">
            <div class="stat-header">
              <span class="stat-label">今日新增</span>
              <span class="stat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                  <path d="M12 5v14"/>
                  <path d="M5 12h14"/>
                </svg>
              </span>
            </div>
            <div class="stat-value" id="kpiToday">0</div>
            <div class="stat-footer">设备 <span id="kpiDev">0</span> · 农事 <span id="kpiFarm">0</span></div>
          </div>
          <div class="stat-card green">
            <div class="stat-header">
              <span class="stat-label">处理率</span>
              <span class="stat-icon" style="background:var(--primary-50);color:var(--primary-500);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                  <path d="M20 6 9 17l-5-5"/>
                </svg>
              </span>
            </div>
            <div class="stat-value" id="kpiRate">0%</div>
            <div class="stat-footer">已闭环 <span id="kpiDone">0</span> / <span id="kpiTotal">0</span></div>
          </div>
          <div class="stat-card orange">
            <div class="stat-header">
              <span class="stat-label">平均响应</span>
              <span class="stat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                  <circle cx="12" cy="12" r="9"/>
                  <path d="M12 7v5l3 2"/>
                </svg>
              </span>
            </div>
            <div class="stat-value">28<span style="font-size:12px;color:#6b7280;">分钟</span></div>
            <div class="stat-footer">较昨日 -5 分钟</div>
          </div>
        </div>

        <!-- 中部两栏：今日 Top3 + 级别分布 -->
        <div class="grid-2">
          <div class="panel">
            <div class="panel-title">
              <span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                  <line x1="12" y1="9" x2="12" y2="13"/>
                  <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
                今日预警 Top 3
              </span>
              <span class="meta"><span class="live-dot"></span>实时</span>
            </div>
            <div class="top-list" id="topList"></div>
          </div>
          <div class="panel">
            <div class="panel-title">
              <span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="9"/>
                  <path d="M12 3a9 9 0 0 1 9 9h-9z"/>
                </svg>
                告警级别分布
              </span>
              <span class="meta">近 7 天</span>
            </div>
            <div id="levelDonut"></div>
          </div>
        </div>

        <!-- 趋势图 -->
        <div class="panel" style="margin-bottom:20px;">
          <div class="panel-title">
            <span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
              </svg>
              预警趋势
            </span>
            <span class="meta">近 6 个时间窗</span>
          </div>
          <div id="alertTrend"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="js/shared/alert-data.js"></script>
<script>
  var LEVEL_LABEL = { urgent:'紧急', important:'重要', reminder:'提醒', notice:'通知' };

  function fmtTimeShort(t){
    if (!t) return '';
    var m = String(t).match(/(\d{2})-(\d{2})[ T](\d{2}:\d{2})/);
    return m ? (m[1] + '-' + m[2] + ' ' + m[3]) : t;
  }

  function renderTopList(){
    var top = AlertStore.topN(3, 'pending');
    if (!top.length){
      document.getElementById('topList').innerHTML =
        '<div style="padding:20px;text-align:center;color:var(--text-tertiary);font-size:13px;">当前无待处理预警</div>';
      return;
    }
    var html = top.map(function(a){
      var src = (a.type === 'device' ? '设备预警' : '农事预警') + ' · ' + (a.location || '').split(' - ')[0];
      return '<div class="top-item">'+
        '<span class="status-tag '+a.level+'">'+(LEVEL_LABEL[a.level]||a.levelText)+'</span>'+
        '<div><div class="txt">'+a.title+'</div><div class="src">'+src+'</div></div>'+
        '<span class="tm">'+fmtTimeShort(a.time)+'</span>'+
      '</div>';
    }).join('');
    document.getElementById('topList').innerHTML = html;
  }

  function renderKpis(){
    var s = AlertStore.stats();
    document.getElementById('kpiPending').textContent = s.pending;
    document.getElementById('kpiUrgent').textContent = s.urgent;
    document.getElementById('kpiToday').textContent = s.devicePending + s.farmingPending;
    document.getElementById('kpiDev').textContent = s.devicePending;
    document.getElementById('kpiFarm').textContent = s.farmingPending;
    document.getElementById('kpiDone').textContent = s.completed;
    document.getElementById('kpiTotal').textContent = s.total;
    document.getElementById('kpiRate').textContent = s.rate + '%';
  }

  function pad2(n){ return n < 10 ? '0' + n : '' + n; }

  // 动态推导最近 6 个月标签（含当月），避免硬编码年份（PC-B-031）
  function last6Months(){
    var out = [];
    var now = new Date();
    for (var i = 5; i >= 0; i--){
      var m = new Date(now.getFullYear(), now.getMonth() - i, 1);
      out.push({ key: m.getFullYear() + '-' + pad2(m.getMonth() + 1), label: (m.getMonth() + 1) + '月' });
    }
    return out;
  }

  function renderCharts(){
    if (!window.Chart) return;
    window.Chart.loadECharts().then(function(){
      var months = last6Months();
      var agg = {};
      months.forEach(function(m){ agg[m.key] = { device:0, farming:0, closed:0 }; });
      AlertStore.all().forEach(function(x){
        var k = String(x.time || '').substring(0, 7); // YYYY-MM
        if (!agg[k]) return;
        if (x.type === 'device') agg[k].device++;
        if (x.type === 'farming') agg[k].farming++;
        if (x.status === 'completed') agg[k].closed++;
      });
      var cats = months.map(function(m){ return m.label; });
      Chart.line('#alertTrend', {
        categories: cats,
        series:[
          {name:'设备预警', data: months.map(function(m){ return agg[m.key].device; })},
          {name:'农事预警', data: months.map(function(m){ return agg[m.key].farming; })},
          {name:'已闭环', data: months.map(function(m){ return agg[m.key].closed; })}
        ]
      });
      var dist = AlertStore.levelDistribution();
      Chart.donut('#levelDonut', {
        series:[
          {name:'紧急', value:dist.urgent},
          {name:'重要', value:dist.important},
          {name:'提醒', value:dist.reminder},
          {name:'通知', value:dist.notice}
        ]
      });
    });
  }

  function refresh(){
    renderKpis();
    renderTopList();
    renderCharts();
  }

  function openPage(url, title){
    if (window.parent && window.parent.openPage) {
      window.parent.openPage(url, title);
    } else {
      window.location.href = url;
    }
  }

  // 初始渲染 + 订阅数据变更
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){
      refresh();
      AlertStore.subscribe(refresh);
    });
  } else {
    refresh();
    AlertStore.subscribe(refresh);
  }
</script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/common-functions.js"></script>
<script src="js/search-helper.js"></script>
<script src="js/typography.js"></script>
<script src="js/components/chart.js"></script>
</body>
</html>
