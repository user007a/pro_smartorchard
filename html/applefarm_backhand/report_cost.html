<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 成本报表</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
  <link rel="stylesheet" href="css/page-content.css">
<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition:all 0.2s ease;
  }
  .module-card:hover {
    background:var(--bg-hover);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="report" data-active-submenu="report-cost">

<!-- ===== 整体布局容器 ===== -->
<div class="app-layout">

  <!-- ===== 侧边栏 ===== -->
  <!-- 移动端遮罩层 -->
  <!-- ===== 主内容区 ===== -->
  <div class="main-wrapper">

    <!-- 顶栏 -->
    <!-- Tab 标签栏 -->
    <div class="tab-bar">
      <!-- Tab 标签由 JS 动态渲染 -->
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
<!-- 顶部导航 -->

<!-- 页面内容 -->
<div class="page-container">
  <!-- 搜索栏 -->
  <div class="search-section">
    <div class="search-bar">
      <select class="search-select">
        <option>2026</option>
        <option>2025</option>
        <option>2024</option>
      </select>
      <span style="color:var(--text-tertiary); padding:0 4px;">年</span>
      <select class="search-select">
        <option>全部</option>
        <option>1月</option>
        <option>2月</option>
        <option>3月</option>
        <option>4月</option>
        <option>5月</option>
        <option>6月</option>
        <option>7月</option>
        <option>8月</option>
        <option>9月</option>
        <option>10月</option>
        <option>11月</option>
        <option>12月</option>
      </select>
      <select class="search-select" id="plotFilter">
        <option value="">全部地块</option>
      </select>
      <div class="search-actions"><button class="jg-btn jg-btn-primary" onclick="smartSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button><button class="jg-btn" onclick="smartReset()">重置</button></div><div class="search-actions" style="margin-left:auto;">
        
        <button class="jg-btn-outline" onclick="exportCostReport()">导出</button>
      </div>
    </div>
  </div>

  <!-- 分类标签 -->
  <div class="tabs" id="cost-tabs">
    <div class="tab-item active" data-tab="agri">农资成本</div>
    <div class="tab-item" data-tab="labor">人工成本</div>
    <div class="tab-item" data-tab="equip">设备维护</div>
    <div class="tab-item" data-tab="logistics">物流成本</div>
    <div class="tab-item" data-tab="packing">包装耗材</div>
    <div class="tab-item" data-tab="other">其他成本</div>
  </div>

  <!-- 三个图表并排 - 成本趋势、成本构成、同期成本对比 -->
  <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-bottom:20px;">
    <div class="chart-section" style="margin-bottom:0;">
      <h2 class="section-title" id="cost-trend-title">农资成本趋势</h2>
      <div id="chart-cost-trend" class="chart-container" style="height:260px;"></div>
    </div>
    <div class="chart-section" style="margin-bottom:0;">
      <h2 class="section-title" id="cost-pie-title">农资成本构成</h2>
      <div id="chart-cost-pie" class="chart-container" style="height:260px;"></div>
    </div>
    <div class="chart-section" style="margin-bottom:0;">
      <h2 class="section-title">同期成本对比</h2>
      <div id="chart-cost-compare" class="chart-container" style="height:260px;"></div>
    </div>
  </div>

  <!-- 成本科目配置（大屏口径：农资投入/人工用工/物流配送/包装耗材/其他费用 五类） -->
  <div class="table-container" id="costSubjectSection">
    <h2 class="section-title">成本科目配置 <span style="font-size:11px; font-weight:normal; color:var(--text-tertiary); margin-left:12px;">占比用于经营分析与数据大屏的成本结构口径，保存后写入数据库</span></h2>
    <table class="data-table">
      <thead>
        <tr>
          <th style="width:60px;">序号</th>
          <th style="width:160px;">成本科目</th>
          <th>说明</th>
          <th style="width:160px;">占比(%)</th>
          <th style="width:220px;">占比示意</th>
        </tr>
      </thead>
      <tbody id="costSubjectBody"></tbody>
    </table>
    <div style="display:flex; align-items:center; gap:12px; margin-top:14px;">
      <button class="jg-btn jg-btn-primary" onclick="saveCostSubject()">保存科目配置</button>
      <span style="font-size:12px;color:var(--text-tertiary);" id="costSubjectHint"></span>
    </div>
  </div>

  <!-- 成本明细 -->
  <div class="table-container">
    <h2 class="section-title" id="cost-detail-title">农资成本明细</h2>
    <div id="cost-detail-container"></div>
  </div>
</div>

</main>
  </div>

</div>

<!-- 引入交互脚本 -->
<script src="../common/js/api.js"></script>
<script src="js/components/chart.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // 时间轴标签（仅用于图表横轴，非业务数据）
  const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

  /* 严格空库模式：成本数据全部来自真实接口（cost_item / plot_profit / plot），
     页面不再内置任何示例金额、趋势数组与明细行 */
  const COST_TAB_META = {
    agri:      { title: '农资成本', subject: '农资投入', color: '#ff6b35' },
    labor:     { title: '人工成本', subject: '人工用工', color: '#1890ff' },
    equip:     { title: '设备维护', subject: '其他费用', color: '#52c41a' },
    logistics: { title: '物流成本', subject: '物流配送', color: '#13c2c2' },
    packing:   { title: '包装耗材', subject: '包装耗材', color: '#fa8c16' },
    other:     { title: '其他成本', subject: '其他费用', color: '#722ed1' }
  };
  const COST_DETAIL_COLS = ['序号', '成本科目', '金额', '占比(%)', '说明', '财年', '成本科目'];

  var costItems = [];     // sf_cost_item
  var plotProfits = [];   // sf_plot_profit
  var plots = [];         // sf_plot（地块筛选下拉）
  var costDataSet = {};   // 由 buildCostDataSet() 基于真实数据填充

  function escapeHtml(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function setPanelText(id, text) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-tertiary);font-size:13px;">' + escapeHtml(text) + '</div>';
  }

  function clearPanel(id) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = '';
  }

  /* 用真实成本科目构造各 tab 数据集：按财年聚合趋势、按科目聚合构成、真实记录作明细 */
  function buildCostDataSet() {
    var byYear = {};
    costItems.forEach(function (c) {
      var y = String(c.fiscal_year || '未标注');
      byYear[y] = (byYear[y] || 0) + (Number(c.amount) || 0);
    });
    var years = Object.keys(byYear).sort();
    var rows = costItems.map(function (c, i) {
      return [i + 1, c.cost_name || '', c.amount == null ? '' : c.amount,
        c.ratio == null ? '' : c.ratio, c.description || '', c.fiscal_year || ''];
    });
    Object.keys(COST_TAB_META).forEach(function (key) {
      var m = COST_TAB_META[key];
      costDataSet[key] = {
        title: m.title,
        subject: m.subject,
        trend: { name: m.title, data: years.map(function (y) { return byYear[y]; }), color: m.color },
        pie: costItems.map(function (c) { return { name: c.cost_name || '', value: Number(c.amount) || 0 }; }),
        detailCols: COST_DETAIL_COLS,
        detailRows: rows.map(function (r) { return r.concat([m.subject]); }),
        categories: years
      };
    });
  }

  /* 同期成本对比：按 sf_plot_profit.fiscal_year 聚合真实成本 */
  function renderCompare() {
    var byYear = {};
    plotProfits.forEach(function (p) {
      var y = String(p.fiscal_year || '未标注');
      byYear[y] = (byYear[y] || 0) + (Number(p.cost) || 0);
    });
    var years = Object.keys(byYear).sort();
    if (!years.length) { setPanelText('chart-cost-compare', '暂无数据'); return; }
    clearPanel('chart-cost-compare');
    Chart.bar('#chart-cost-compare', {
      categories: years,
      series: [{ name: '年度成本', data: years.map(function (y) { return byYear[y]; }), color: '#ff6b35' }]
    });
  }

  function fillPlotFilter() {
    var sel = document.getElementById('plotFilter');
    if (!sel) return;
    var html = '<option value="">全部地块</option>';
    plots.forEach(function (p) {
      html += '<option value="' + escapeHtml(String(p.id)) + '">' + escapeHtml((p.code ? p.code + ' · ' : '') + (p.name || '')) + '</option>';
    });
    sel.innerHTML = html;
  }

  /* 页面初始「加载中」→ 异步取真实数据 → 渲染 / 空态 / 错误态 */
  function loadData() {
    setPanelText('chart-cost-trend', '加载中...');
    setPanelText('chart-cost-pie', '加载中...');
    setPanelText('chart-cost-compare', '加载中...');
    document.getElementById('cost-detail-container').innerHTML = '<div style="padding:32px;text-align:center;color:var(--text-tertiary);font-size:13px;">加载中...</div>';
    document.getElementById('costSubjectBody').innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-tertiary);padding:32px;">加载中...</td></tr>';
    Promise.all([
      Api.get('cost_item', { page: 1, size: 500, sort: 'sort_order', order: 'asc' }),
      Api.get('plot_profit', { page: 1, size: 500 }),
      Api.get('plot', { page: 1, size: 500 })
    ]).then(function (res) {
      var ci = res[0], pp = res[1], pl = res[2];
      if (!ci || !ci.ok || !pp || !pp.ok) {
        var msg = '数据加载失败：' + ((ci && ci.message) || (pp && pp.message) || '请检查登录状态与网络');
        setPanelText('chart-cost-trend', msg);
        setPanelText('chart-cost-pie', msg);
        setPanelText('chart-cost-compare', msg);
        document.getElementById('cost-detail-container').innerHTML = '<div style="padding:32px;text-align:center;color:var(--text-tertiary);font-size:13px;">' + escapeHtml(msg) + '</div>';
        document.getElementById('costSubjectBody').innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-tertiary);padding:32px;">' + escapeHtml(msg) + '</td></tr>';
        return;
      }
      costItems = (ci.data && ci.data.list) || [];
      plotProfits = (pp.data && pp.data.list) || [];
      plots = (pl && pl.ok && pl.data && pl.data.list) || [];
      buildCostDataSet();
      fillPlotFilter();
      renderCompare();
      renderTab(costCurrentTab);
      renderCostSubjects();
    }).catch(function (err) {
      var msg = '数据加载失败：' + (err && err.message ? err.message : '网络异常');
      setPanelText('chart-cost-trend', msg);
      setPanelText('chart-cost-pie', msg);
      setPanelText('chart-cost-compare', msg);
    });
  }

  /* 同期成本对比已改为基于真实 plot_profit 数据，见 renderCompare() */

  // 渲染指定 tab
  // 联动：采集当前 tab 的成本数据 → CSV 导出
  window.__exportCostData = function() {
    /* 导出内容基于真实成本科目，不再内置示例明细 */
    var items = costItems.map(function (c) {
      return [c.cost_name || '', c.description || '', c.amount == null ? '' : c.amount,
        c.ratio == null ? '' : c.ratio, c.fiscal_year || ''];
    });
    var total = costItems.reduce(function (s, c) { return s + (Number(c.amount) || 0); }, 0);
    var csv = '成本科目,说明,金额,占比(%),财年\n' + items.map(function (r) {
      return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\n') + '\n合计,,,,' + total;
    var blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '成本报表_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    if (typeof Toast !== 'undefined') Toast.success('成本报表已导出');
  };
var costCurrentTab = 'agri';
function renderTab(tabKey) {
    const d = costDataSet[tabKey];
    if (!d) return;

    // 更新标题
    document.getElementById('cost-trend-title').textContent = d.title + '趋势';
    document.getElementById('cost-pie-title').textContent = d.title + '构成';
    document.getElementById('cost-detail-title').textContent = d.title + '明细';

    // 严格空库：无真实记录时显示明确空态，不渲染任何示例数值
    if (!costItems.length) {
      setPanelText('chart-cost-trend', '暂无数据');
      setPanelText('chart-cost-pie', '暂无数据');
      document.getElementById('cost-detail-container').innerHTML =
        '<div style="padding:32px;text-align:center;color:var(--text-tertiary);font-size:13px;">暂无数据</div>';
      return;
    }

    clearPanel('chart-cost-trend');
    Chart.line('#chart-cost-trend', {
      categories: d.categories,
      series: [{ name: d.trend.name, data: d.trend.data, color: d.trend.color, area: true }]
    });

    clearPanel('chart-cost-pie');
    Chart.donut('#chart-cost-pie', { series: d.pie });

    const thead = '<tr>' + d.detailCols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr>';
    const tbody = d.detailRows.map(function (row) {
      return '<tr>' + row.map(function (c) { return '<td>' + escapeHtml(c) + '</td>'; }).join('') + '</tr>';
    }).join('');
    document.getElementById('cost-detail-container').innerHTML =
      '<table class="data-table"><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table>';
  }

  /* ============================================================
   * 成本科目配置：数据直接来自 sf_cost_item，保存走真实接口，不再写 localStorage
   * ============================================================ */
  function renderCostSubjects() {
    const body = document.getElementById('costSubjectBody');
    const hint = document.getElementById('costSubjectHint');
    if (!body) return;
    if (!costItems.length) {
      body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-tertiary);padding:32px;">暂无数据</td></tr>';
      if (hint) hint.textContent = '';
      return;
    }
    body.innerHTML = costItems.map(function (s, i) {
      const share = Number(s.ratio) || 0;
      const pct = Math.max(0, Math.min(100, Math.round(share)));
      return '<tr>' +
        '<td>' + (i + 1) + '</td>' +
        '<td><strong>' + escapeHtml(s.cost_name || '') + '</strong></td>' +
        '<td>' + escapeHtml(s.description || '') + '</td>' +
        '<td><input type="number" class="form-input" style="padding:6px 10px;text-align:right;" min="0" max="100" step="0.1" value="' + share + '" data-subject-idx="' + i + '" oninput="previewCostSubject(' + i + ', this.value)"></td>' +
        '<td><span style="display:block;position:relative;height:8px;border-radius:4px;background:var(--gray-100);overflow:hidden;">' +
          '<i style="position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--primary-500),var(--primary-300));width:' + pct + '%;"></i>' +
        '</span></td>' +
      '</tr>';
    }).join('');
    if (hint) {
      const total = costItems.reduce(function (s, x) { return s + (Number(x.ratio) || 0); }, 0);
      hint.textContent = '科目合计 ' + Math.round(total * 10) / 10 + '%';
    }
  }

  function previewCostSubject(idx, val) {
    if (!costItems[idx]) return;
    costItems[idx].ratio = Number(val) || 0;
    const body = document.getElementById('costSubjectBody');
    if (!body) return;
    const bar = body.querySelectorAll('tr')[idx].querySelector('td:last-child i');
    if (bar) bar.style.width = Math.max(0, Math.min(100, Math.round(costItems[idx].ratio))) + '%';
    const hint = document.getElementById('costSubjectHint');
    if (hint) {
      const total = costItems.reduce(function (s, x) { return s + (Number(x.ratio) || 0); }, 0);
      hint.textContent = '科目合计 ' + Math.round(total * 10) / 10 + '%';
    }
  }

  // 暴露到全局：供 HTML 内联 oninput / onclick 转调
  window.__previewCostSubject = previewCostSubject;
  window.__saveCostSubject = function () {
    if (!costItems.length) { alert('暂无数据'); return; }
    Promise.all(costItems.map(function (c) {
      return Api.update('cost_item', c.id, { ratio: Number(c.ratio) || 0 });
    })).then(function (res) {
      const failed = res.filter(function (r) { return !r || !r.ok; });
      if (failed.length) { alert('保存失败：' + ((failed[0] && failed[0].message) || '请检查登录状态')); return; }
      if (typeof Toast !== 'undefined' && Toast.show) Toast.show('成本科目配置已保存', 'success');
      else alert('成本科目配置已保存');
      loadData();
    });
  };

  // tab 切换
  document.querySelectorAll('#cost-tabs .tab-item').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('#cost-tabs .tab-item').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      window.__costCurrentTab = this.dataset.tab;
      costCurrentTab = this.dataset.tab;
      renderTab(this.dataset.tab);
    });
  });

  // 严格空库模式：进入页面即从真实接口取数
  loadData();
});
</script>
<script>
// 导出入口：供 HTML 内联 onclick 调用（与 DOMContentLoaded 回调内的实现解耦）
function exportCostReport() {
  if (typeof window.__exportCostData === 'function') window.__exportCostData();
  else if (typeof Toast !== 'undefined') Toast.error('导出功能未就绪');
}

// 成本科目配置入口：同上，需暴露到全局供内联 onclick 调用
function previewCostSubject(idx, val) {
  if (typeof window.__previewCostSubject === 'function') window.__previewCostSubject(idx, val);
}

function saveCostSubject() {
  if (typeof window.__saveCostSubject === 'function') window.__saveCostSubject();
  else if (typeof Toast !== 'undefined') Toast.error('成本科目配置未就绪');
}
</script>
