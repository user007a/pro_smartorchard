<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 成本报表</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
  <link rel="stylesheet" href="css/page-content.css">
<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition:all 0.2s ease;
  }
  .module-card:hover {
    background:var(--bg-hover);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="report" data-active-submenu="report-cost">

<!-- ===== 整体布局容器 ===== -->
<div class="app-layout">

  <!-- ===== 侧边栏 ===== -->
  <!-- 移动端遮罩层 -->
  <!-- ===== 主内容区 ===== -->
  <div class="main-wrapper">

    <!-- 顶栏 -->
    <!-- Tab 标签栏 -->
    <div class="tab-bar">
      <!-- Tab 标签由 JS 动态渲染 -->
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
<!-- 顶部导航 -->

<!-- 页面内容 -->
<div class="page-container">
  <!-- 搜索栏 -->
  <div class="search-section">
    <div class="search-bar">
      <select class="search-select">
        <option>2026</option>
        <option>2025</option>
        <option>2024</option>
      </select>
      <span style="color:var(--text-tertiary); padding:0 4px;">年</span>
      <select class="search-select">
        <option>全部</option>
        <option>1月</option>
        <option>2月</option>
        <option>3月</option>
        <option>4月</option>
        <option>5月</option>
        <option>6月</option>
      </select>
      <select class="search-select">
        <option>全部地块</option>
        <option>A1区</option>
        <option>A2区</option>
        <option>B1区</option>
        <option>B2区</option>
      </select>
      <div class="search-actions"><button class="jg-btn jg-btn-primary" onclick="smartSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button><button class="jg-btn" onclick="smartReset()">重置</button></div><div class="search-actions" style="margin-left:auto;">
        
        <button class="jg-btn-outline">导出</button>
      </div>
    </div>
  </div>

  <!-- 分类标签 -->
  <div class="tab-nav">
    <div class="tab-item active">农资成本</div>
    <div class="tab-item">人工成本</div>
    <div class="tab-item">设备维护</div>
    <div class="tab-item">其他成本</div>
  </div>

  <!-- 三个图表并排 - 农资成本趋势、农资成本构成、同期成本对比 -->
  <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-bottom:20px;">
    <div class="chart-section" style="margin-bottom:0;">
      <h2 class="section-title">农资成本趋势</h2>
      <div id="chart-cost-trend" class="chart-container" style="height:260px;"></div>
    </div>
    <div class="chart-section" style="margin-bottom:0;">
      <h2 class="section-title">农资成本构成</h2>
      <div id="chart-cost-pie" class="chart-container" style="height:260px;"></div>
    </div>
    <div class="chart-section" style="margin-bottom:0;">
      <h2 class="section-title">同期成本对比</h2>
      <div id="chart-cost-compare" class="chart-container" style="height:260px;"></div>
    </div>
  </div>

  <!-- 农资成本明细 -->
  <div class="table-container">
    <h2 class="section-title">农资成本明细</h2>
    <table class="data-table">
      <thead>
        <tr>
          <th>序号</th>
          <th>农资名称</th>
          <th>规格</th>
          <th>单价(元)</th>
          <th>采购数量</th>
          <th>金额(元)</th>
          <th>使用地块</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>复合肥</td>
          <td>50kg/袋</td>
          <td>180</td>
          <td>150</td>
          <td>27,000</td>
          <td>A1区、A2区</td>
        </tr>
        <tr>
          <td>2</td>
          <td>尿素</td>
          <td>50kg/袋</td>
          <td>120</td>
          <td>100</td>
          <td>12,000</td>
          <td>B1区、B2区</td>
        </tr>
        <tr>
          <td>3</td>
          <td>多菌灵</td>
          <td>1kg/瓶</td>
          <td>65</td>
          <td>80</td>
          <td>5,200</td>
          <td>全部地块</td>
        </tr>
        <tr>
          <td>4</td>
          <td>杀虫剂</td>
          <td>500ml/瓶</td>
          <td>45</td>
          <td>120</td>
          <td>5,400</td>
          <td>全部地块</td>
        </tr>
        <tr>
          <td>5</td>
          <td>叶面肥</td>
          <td>500ml/瓶</td>
          <td>35</td>
          <td>60</td>
          <td>2,100</td>
          <td>A1区、B2区</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 底部 -->
<footer style="background:var(--bg-card); padding:var(--space-lg); text-align:center; color:var(--text-secondary); font-size:var(--font-size-sm); margin-top:auto;">
  智慧果园·智慧果园管理系统 © 2026
</footer>
    </main>
  </div>

</div>

<!-- 引入交互脚本 -->
<script src="js/components/chart.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // 农资成本趋势数据
  const costTrendData = {
    categories: ['1月', '2月', '3月', '4月', '5月', '6月'],
    series: [{
      name: '农资成本',
      data: [285000, 312000, 298000, 356000, 325000, 287000],
      color: '#ff6b35',
      area: true
    }]
  };
  Chart.line('#chart-cost-trend', costTrendData);

  // 成本构成饼图数据
  const costPieData = {
    series: [
      { name: '肥料', value: 40 },
      { name: '农药', value: 35 },
      { name: '其他', value: 25 }
    ]
  };
  Chart.donut('#chart-cost-pie', costPieData);

  // 同期成本对比柱状图
  const costCompareData = {
    categories: ['1月', '2月', '3月', '4月', '5月', '6月'],
    series: [
      {
        name: '2024年',
        data: [245000, 268000, 252000, 298000, 275000, 248000],
        color: '#bfbfbf'
      },
      {
        name: '2025年',
        data: [268000, 289000, 275000, 318000, 295000, 268000],
        color: '#8c8c8c'
      },
      {
        name: '2026年',
        data: [285000, 312000, 298000, 356000, 325000, 287000],
        color: '#ff6b35'
      }
    ]
  };
  Chart.bar('#chart-cost-compare', costCompareData);
});
</script>

<!-- 已通过质量审查（第2轮修正）- 严过审 2025-01-18 -->
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/common-functions.js"></script>
  <script src="js/search-helper.js"></script>
  <script src="js/typography.js"></script>
</body>
</html>
