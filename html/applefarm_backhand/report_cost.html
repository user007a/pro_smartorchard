    Chart.donut('#chart-cost-pie', { series: d.pie });

    // 明细表：末列统一追加「成本科目」，标明该明细归属哪一类科目
    const subject = d.subject || '其他费用';
    const thead = '<tr>' + d.detailCols.concat(['成本科目']).map(c => '<th>' + c + '</th>').join('') + '</tr>';
    const tbody = d.detailRows.map(row =>
      '<tr>' + row.concat([subject]).map(c => '<td>' + c + '</td>').join('') + '</tr>'
    ).join('');
    document.getElementById('cost-detail-container').innerHTML =
      '<table class="data-table"><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table>';
  }

  /* ============================================================
   * 成本科目配置（大屏口径五类，与经营分析共用）
   *   key = snzg_cost_structure，保存后供成本报表与经营分析读取
   * ============================================================ */
  const COST_SUBJECT_KEY = 'snzg_cost_structure';
  const COST_SUBJECTS = [
    { key: 'agri',      name: '农资投入', desc: '肥料、农药、种苗等直接投入品', share: 34 },
    { key: 'labor',     name: '人工用工', desc: '施肥、采摘、修剪等季节性用工',   share: 28 },
    { key: 'logistics', name: '物流配送', desc: '干线运输、冷链发运、同城配送',     share: 18 },
    { key: 'packing',   name: '包装耗材', desc: '纸箱、网套、礼盒、溯源标签等',     share: 12 },
    { key: 'other',     name: '其他费用', desc: '水电、土地租赁、保险、检测化验',     share: 8 }
  ];

  function loadCostSubjects() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(COST_SUBJECT_KEY) || 'null'); } catch (e) { saved = null; }
    if (saved && Array.isArray(saved.subjects)) {
      COST_SUBJECTS.forEach(function (s, i) {
        if (saved.subjects[i]) {
          s.name = saved.subjects[i].name || s.name;
          s.share = Number(saved.subjects[i].share);
          if (isNaN(s.share)) s.share = 0;
        }
      });
    }
    renderCostSubjects();
  }

  function renderCostSubjects() {
    const body = document.getElementById('costSubjectBody');
    const hint = document.getElementById('costSubjectHint');
    if (!body) return;
    const max = COST_SUBJECTS.reduce(function (m, s) { return Math.max(m, s.share); }, 0) || 1;
    body.innerHTML = COST_SUBJECTS.map(function (s, i) {
      const pct = Math.max(0, Math.min(100, Math.round(s.share / max * 100)));
      return '<tr>' +
        '<td>' + (i + 1) + '</td>' +
        '<td><strong>' + s.name + '</strong></td>' +
        '<td>' + s.desc + '</td>' +
        '<td><input type="number" class="form-input" style="padding:6px 10px;text-align:right;" min="0" max="100" step="0.1" value="' + s.share + '" data-subject-idx="' + i + '" oninput="previewCostSubject(' + i + ', this.value)"></td>' +
        '<td><span style="display:block;position:relative;height:8px;border-radius:4px;background:var(--gray-100);overflow:hidden;">' +
          '<i style="position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--primary-500),var(--primary-300));width:' + pct + '%;"></i>' +
        '</span></td>' +
      '</tr>';
    }).join('');
    if (hint) {
      const total = COST_SUBJECTS.reduce(function (s, x) { return s + (Number(x.share) || 0); }, 0);
      hint.textContent = '五类科目合计 ' + Math.round(total * 10) / 10 + '%';
    }
  }

  function previewCostSubject(idx, val) {
    COST_SUBJECTS[idx].share = Number(val) || 0;
    const body = document.getElementById('costSubjectBody');
    if (!body) return;
    const max = COST_SUBJECTS.reduce(function (m, s) { return Math.max(m, s.share); }, 0) || 1;
    const bar = body.querySelectorAll('tr')[idx].querySelector('td:last-child i');
    if (bar) bar.style.width = Math.max(0, Math.min(100, Math.round(COST_SUBJECTS[idx].share / max * 100))) + '%';
    const hint = document.getElementById('costSubjectHint');
    if (hint) {
      const total = COST_SUBJECTS.reduce(function (s, x) { return s + (Number(x.share) || 0); }, 0);
      hint.textContent = '五类科目合计 ' + Math.round(total * 10) / 10 + '%';
    }
  }

  // 暴露到全局：供 HTML 内联 onclick 的 saveCostSubject() 转调
  window.__saveCostSubject = saveCostSubject;

  function saveCostSubject() {
    const payload = {
      updatedAt: new Date().toISOString().slice(0, 10),
      subjects: COST_SUBJECTS.map(function (s) { return { key: s.key, name: s.name, share: s.share }; })
    };
    try {
      localStorage.setItem(COST_SUBJECT_KEY, JSON.stringify(payload));
      renderCostSubjects();
      if (typeof Toast !== 'undefined' && Toast.show) Toast.show('成本科目配置已保存', 'success');
      else alert('成本科目配置已保存');
    } catch (e) {
      alert('保存失败：' + e.message);
    }
  }

  // 初始化默认 tab
  renderTab('agri');

  // 成本科目配置：读取 localStorage 覆盖默认值后渲染
  loadCostSubjects();

  // tab 切换
  document.querySelectorAll('#cost-tabs .tab-item').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('#cost-tabs .tab-item').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      window.__costCurrentTab = this.dataset.tab;
      renderTab(this.dataset.tab);
    });
  });
});
</script>
<script>
// 导出入口：供 HTML 内联 onclick 调用（与 DOMContentLoaded 回调内的实现解耦）
function exportCostReport() {
  if (typeof window.__exportCostData === 'function') window.__exportCostData();
  else if (typeof Toast !== 'undefined') Toast.error('导出功能未就绪');
}

// 成本科目配置入口：同上，需暴露到全局供内联 onclick 调用
function saveCostSubject() {
  if (typeof window.__saveCostSubject === 'function') window.__saveCostSubject();
  else if (typeof Toast !== 'undefined') Toast.error('成本科目配置未就绪');
}
</script>
