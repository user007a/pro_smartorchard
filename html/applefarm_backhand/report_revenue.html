<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 营收报表</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
  <link rel="stylesheet" href="css/page-content.css">
<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition:all 0.2s ease;
  }
  .module-card:hover {
    background:var(--bg-hover);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="report" data-active-submenu="report-revenue">

<!-- ===== 整体布局容器 ===== -->
<div class="app-layout">

  <!-- ===== 侧边栏 ===== -->
  <!-- 移动端遮罩层 -->
  <!-- ===== 主内容区 ===== -->
  <div class="main-wrapper">

    <!-- 顶栏 -->
    <!-- Tab 标签栏 -->
    <div class="tab-bar">
      <!-- Tab 标签由 JS 动态渲染 -->
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
<!-- 顶部导航 -->

<!-- 页面内容 -->
<div class="page-container">
  <!-- 搜索栏 -->
  <div class="search-section">
    <div class="search-bar">
      <select class="search-select">
        <option>2026</option>
        <option>2025</option>
        <option>2024</option>
      </select>
      <span style="color:var(--text-tertiary); padding:0 4px;">年</span>
      <select class="search-select">
        <option>全部</option>
        <option>1月</option>
        <option>2月</option>
        <option>3月</option>
        <option>4月</option>
        <option>5月</option>
        <option>6月</option>
        <option>7月</option>
        <option>8月</option>
        <option>9月</option>
        <option>10月</option>
        <option>11月</option>
        <option>12月</option>
      </select>
      <div class="search-actions"><button class="jg-btn jg-btn-primary" onclick="smartSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button><button class="jg-btn" onclick="smartReset()">重置</button></div><div class="search-actions" style="margin-left:auto;">
        
        <button class="jg-btn-outline">导出</button>
      </div>
    </div>
  </div>

  <!-- 统计卡片 - 小尺寸样式（本月数据） -->
  <div class="patrol-stats">
    <div class="patrol-stat-card green">
      <div class="stat-value">¥ 168,500</div>
      <div class="stat-label">认养收入</div>
      <div class="stat-trend" style="font-size:12px; color:var(--success);">↑ 18.3% 较上月</div>
    </div>
    <div class="patrol-stat-card blue">
      <div class="stat-value">¥ 148,200</div>
      <div class="stat-label">批发收入</div>
      <div class="stat-trend" style="font-size:12px; color:var(--success);">↑ 8.5% 较上月</div>
    </div>
    <div class="patrol-stat-card orange">
      <div class="stat-value">¥ 62,000</div>
      <div class="stat-label">零售收入</div>
      <div class="stat-trend" style="font-size:12px; color:var(--error);">↓ 2.1% 较上月</div>
    </div>
    <div class="patrol-stat-card purple">
      <div class="stat-value">¥ 378,700</div>
      <div class="stat-label">本月总收入</div>
      <div class="stat-trend" style="font-size:12px; color:var(--success);">↑ 12.5% 较上月</div>
    </div>
  </div>

  <!-- 分类标签 -->
  <div class="tab-nav" id="revenue-tabs">
    <div class="tab-item active" data-tab="trend">收入趋势</div>
    <div class="tab-item" data-tab="struct">收入构成</div>
    <div class="tab-item" data-tab="customer">客户分析</div>
    <div class="tab-item" data-tab="product">产品分析</div>
  </div>

  <!-- 三个图表并排 -->
  <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-bottom:20px;">
    <div class="chart-section" style="margin-bottom:0;">
      <h2 class="section-title" id="revenue-chart1-title">收入趋势分析</h2>
      <div id="chart-revenue-trend" class="chart-container" style="height:260px;"></div>
    </div>
    <div class="chart-section" style="margin-bottom:0;">
      <h2 class="section-title" id="revenue-chart2-title">收入构成分析</h2>
      <div id="chart-revenue-pie" class="chart-container" style="height:260px;"></div>
    </div>
    <div class="table-container" style="margin-bottom:0;">
      <h2 class="section-title" id="revenue-chart3-title">客户收入排行</h2>
      <div id="revenue-table-container"></div>
    </div>
  </div>
</div>

<!-- 底部 -->
<footer style="background:var(--bg-card); padding:var(--space-lg); text-align:center; color:var(--text-secondary); font-size:var(--font-size-sm); margin-top:auto;">
  智慧果园·智慧果园管理系统 © 2026
</footer>
    </main>
  </div>

</div>

<!-- 引入交互脚本 -->
<script src="js/components/chart.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

  // 4 个 tab 完整数据
  const revenueDataSet = {
    trend: {
      title: '收入趋势',
      chart1: '收入趋势分析',
      chart2: '收入构成分析',
      chart3: '客户收入排行',
      trendData: {
        categories: months,
        series: [
          { name: '认养收入', data: [118500, 122000, 132500, 142800, 156800, 168500, 158000, 152000, 165200, 142800, 115800, 98500], color: '#1890ff', area: true },
          { name: '批发收入', data: [85000, 92000, 106000, 118000, 135000, 148200, 132500, 118000, 125000, 102500, 72000, 58000], color: '#52c41a', area: true },
          { name: '零售收入', data: [32000, 38000, 42000, 51000, 58000, 62000, 56000, 48000, 52000, 45000, 32000, 28000], color: '#ff6b35', area: true }
        ]
      },
      pieData: {
        series: [
          { name: '认养收入', value: 168500 },
          { name: '批发收入', value: 148200 },
          { name: '零售收入', value: 62000 }
        ]
      },
      tableCols: ['排名', '客户名称', '收入(元)', '占比'],
      tableRows: [
        ['1', '北京华联超市', '356,800', '12.5%'],
        ['2', '上海果蔬电商', '298,500', '10.5%'],
        ['3', '广州优鲜水果店', '245,200', '8.6%'],
        ['4', '深圳每日生鲜', '198,600', '7.0%'],
        ['5', '杭州鲜达平台', '165,400', '5.8%']
      ]
    },
    struct: {
      title: '收入构成',
      chart1: '各渠道月收入趋势',
      chart2: '收入构成占比',
      chart3: '收入构成明细',
      trendData: {
        categories: months,
        series: [
          { name: '认养收入', data: [118500, 122000, 132500, 142800, 156800, 168500, 158000, 152000, 165200, 142800, 115800, 98500], color: '#1890ff', area: true },
          { name: '批发收入', data: [85000, 92000, 106000, 118000, 135000, 148200, 132500, 118000, 125000, 102500, 72000, 58000], color: '#52c41a', area: true },
          { name: '零售收入', data: [32000, 38000, 42000, 51000, 58000, 62000, 56000, 48000, 52000, 45000, 32000, 28000], color: '#ff6b35', area: true },
          { name: '观光采摘', data: [12000, 15000, 28000, 35000, 42000, 38000, 52000, 45000, 32000, 18000, 12000, 8000], color: '#722ed1', area: true }
        ]
      },
      pieData: {
        series: [
          { name: '认养收入', value: 168500 },
          { name: '批发收入', value: 148200 },
          { name: '零售收入', value: 62000 },
          { name: '观光采摘', value: 38000 }
        ]
      },
      tableCols: ['序号', '收入类型', '本月金额(元)', '全年累计(元)', '同比'],
      tableRows: [
        ['1', '认养收入', '168,500', '1,673,400', '↑ 18.3%'],
        ['2', '批发收入', '148,200', '1,292,200', '↑ 8.5%'],
        ['3', '零售收入', '62,000', '544,000', '↓ 2.1%'],
        ['4', '观光采摘', '38,000', '337,000', '↑ 25.6%']
      ]
    },
    customer: {
      title: '客户分析',
      chart1: '客户类型分布',
      chart2: '客户区域分布',
      chart3: '客户复购排行',
      trendData: {
        categories: ['批发商', '零售商', '电商平台', '个人客户', '企业团购'],
        series: [
          { name: '客户数', data: [28, 65, 18, 245, 30], color: '#1890ff' }
        ]
      },
      pieData: {
        series: [
          { name: '批发商', value: 28 },
          { name: '零售商', value: 65 },
          { name: '电商平台', value: 18 },
          { name: '个人客户', value: 245 },
          { name: '企业团购', value: 30 }
        ]
      },
      tableCols: ['排名', '客户名称', '类型', '交易次数', '累计金额(元)'],
      tableRows: [
        ['1', '北京华联超市', '连锁商超', '24', '856,300'],
        ['2', '上海果蔬电商', '电商平台', '18', '532,400'],
        ['3', '广州优鲜水果店', '连锁零售', '15', '385,200'],
        ['4', '深圳每日生鲜', '电商平台', '12', '328,600'],
        ['5', '杭州鲜达平台', '生鲜平台', '10', '265,400']
      ]
    },
    product: {
      title: '产品分析',
      chart1: '各品种销量对比',
      chart2: '各品种收入占比',
      chart3: '品种销售排行',
      trendData: {
        categories: ['花牛苹果', '红富士', '金帅', '秦冠', '嘎啦', '红星', '国光'],
        series: [
          { name: '销量(吨)', data: [125.8, 98.5, 65.2, 42.8, 35.6, 28.2, 18.5], color: '#ff6b35' }
        ]
      },
      pieData: {
        series: [
          { name: '花牛苹果', value: 628000 },
          { name: '红富士', value: 492500 },
          { name: '金帅', value: 326000 },
          { name: '秦冠', value: 214000 },
          { name: '其他品种', value: 411800 }
        ]
      },
      tableCols: ['排名', '品种', '销量(吨)', '收入(元)', '单价(元/吨)', '占比'],
      tableRows: [
        ['1', '花牛苹果', '125.8', '628,000', '4,992', '30.2%'],
        ['2', '红富士', '98.5', '492,500', '5,000', '23.7%'],
        ['3', '金帅', '65.2', '326,000', '5,000', '15.7%'],
        ['4', '秦冠', '42.8', '214,000', '5,000', '10.3%'],
        ['5', '嘎啦', '35.6', '178,000', '5,000', '8.6%']
      ]
    }
  };

  function renderTab(tabKey) {
    const d = revenueDataSet[tabKey];
    if (!d) return;

    document.getElementById('revenue-chart1-title').textContent = d.chart1;
    document.getElementById('revenue-chart2-title').textContent = d.chart2;
    document.getElementById('revenue-chart3-title').textContent = d.chart3;

    // 趋势图/柱状图（依据结构判断：trend tab 用 line，其他用 bar）
    if (tabKey === 'trend' || tabKey === 'struct') {
      Chart.line('#chart-revenue-trend', d.trendData);
    } else {
      Chart.bar('#chart-revenue-trend', d.trendData);
    }

    // 饼图
    Chart.donut('#chart-revenue-pie', d.pieData);

    // 表格
    const thead = '<tr>' + d.tableCols.map(c => '<th>' + c + '</th>').join('') + '</tr>';
    const tbody = d.tableRows.map(row =>
      '<tr>' + row.map(c => '<td>' + c + '</td>').join('') + '</tr>'
    ).join('');
    document.getElementById('revenue-table-container').innerHTML =
      '<table class="data-table" style="font-size:var(--font-size-sm);"><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table>';
  }

  renderTab('trend');

  document.querySelectorAll('#revenue-tabs .tab-item').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('#revenue-tabs .tab-item').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      renderTab(this.dataset.tab);
    });
  });
});
</script>

<!-- 已通过质量审查（第2轮修正）- 严过审 2026-09-18 -->
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/common-functions.js"></script>
  <script src="js/search-helper.js"></script>
  <script src="js/typography.js"></script>
</body>
</html>
