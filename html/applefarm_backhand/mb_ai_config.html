<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - AI助手配置</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/page-content.css">
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<style>
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
  }
  .stat-label {
    font-size: var(--font-size-sm);
    color: var(--text-tertiary);
    margin-bottom: var(--space-xs);
  }
  .stat-value {
    font-size: 26px;
    font-weight: var(--font-weight-bold);
    color: var(--text-primary);
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .stat-card.is-info .stat-value { color: var(--info); }

  .tab-bar-mini {
    display: flex;
    gap: 4px;
    background: var(--gray-100);
    padding: 4px;
    border-radius: var(--radius-lg);
    margin-bottom: var(--space-lg);
    width: fit-content;
  }
  .tab-bar-mini button {
    border: none;
    background: transparent;
    padding: 8px 18px;
    border-radius: var(--radius-md);
    cursor: pointer;
    font-size: var(--font-size-base);
    color: var(--text-secondary);
    transition: all 0.2s;
  }
  .tab-bar-mini button.active {
    background: var(--bg-card);
    color: var(--primary-600);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    font-weight: 600;
  }

  .id-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    background: var(--gray-100);
    color: var(--text-secondary);
    font-family: var(--font-family-mono, monospace);
    font-size: var(--font-size-xs);
  }
  .cell-sub {
    font-size: var(--font-size-xs);
    color: var(--text-tertiary);
    max-width: 360px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--bg-card);
    border-radius: 12px;
    width: 92%;
    max-width: 540px;
    max-height: 85vh;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    animation: modalFadeIn 0.2s ease-out;
  }
  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.95) translateY(-20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-default);
  }
  .modal-title { font-size: 16px; font-weight: 600; color: #1f1f1f; }
  .modal-close {
    background: none; border: none; cursor: pointer;
    padding: 4px; font-size: 20px; line-height: 1;
    color: var(--text-tertiary); transition: color 0.2s;
  }
  .modal-close:hover { color: var(--text-secondary); }
  .modal-body {
    padding: 20px;
    overflow-y: auto;
    max-height: calc(85vh - 132px);
  }
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    padding: 16px 20px;
    border-top: 1px solid var(--border-default);
  }
  .modal-field { margin-bottom: var(--space-lg); }
  .modal-field label {
    display: block;
    font-size: var(--font-size-sm);
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: var(--space-sm);
  }
  .modal-field textarea, .modal-field input, .modal-field select {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border-default);
    border-radius: var(--radius-lg);
    font-size: var(--font-size-base);
    font-family: inherit;
    background: var(--bg-card);
  }
  .modal-field textarea { min-height: 80px; resize: vertical; line-height: var(--line-height-relaxed); }
  .modal-field textarea:focus, .modal-field input:focus, .modal-field select:focus {
    border-color: var(--primary-500);
    box-shadow: 0 0 0 4px rgba(24, 144, 255, 0.12);
    outline: none;
  }
  .field-hint { font-size: var(--font-size-xs); color: var(--text-tertiary); margin-top: 4px; }

  .empty-state {
    padding: var(--space-2xl) 0;
    text-align: center;
    color: var(--text-tertiary);
    font-size: var(--font-size-sm);
  }
</style>
</head>
<body data-active-menu="mobile-ops" data-active-submenu="ai-config">

<div class="main-wrapper">
  <div class="tab-bar">
    <div class="tab-bar-actions">
      <button class="tab-close-all" title="关闭全部标签">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3L11 11M11 3L3 11"/>
        </svg>
      </button>
    </div>
  </div>

  <main class="main-content">
    <nav class="device-tabs" aria-label="移动端运营·智能与知识">
      <a href="mb_ai_config.html" class="active">AI助手配置</a>
      <a href="mb_disease_config.html">识别规则配置</a>
      <a href="mb_fault_knowledge.html">故障知识库</a>
    </nav>
    <div class="page-header">
      <div>
        <div class="page-title">AI 助手配置</div>
        <div class="page-subtitle">维护移动端「小果」助手的分类与热门推荐问题，配置后立即在移动端生效</div>
      </div>
      <div class="page-actions">
        <button class="jg-btn" onclick="refreshAll()">刷新</button>
      </div>
    </div>

    <!-- 统计区 -->
    <div class="stat-row">
      <div class="stat-card is-info">
        <div class="stat-label">分类数</div>
        <div class="stat-value" id="statCategory">0</div>
      </div>
      <div class="stat-card is-info">
        <div class="stat-label">热门问题数</div>
        <div class="stat-value" id="statQuestion">0</div>
      </div>
    </div>

    <!-- 标签切换 -->
    <div class="tab-bar-mini">
      <button id="tabCatBtn" class="active" onclick="switchView('category')">分类管理</button>
      <button id="tabQBtn" onclick="switchView('question')">热门问题</button>
    </div>

    <!-- 分类表 -->
    <div id="categoryView" class="page-section data-section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div style="color:var(--text-tertiary);font-size:var(--font-size-sm);">分类 ID 是移动端 data-id，建立问题后只能改名称与描述。</div>
        <button class="jg-btn jg-btn-primary" onclick="openCategoryModal()">新增分类</button>
      </div>
      <div class="data-table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:120px;">分类 ID</th>
              <th style="width:160px;">分类名称</th>
              <th>描述</th>
              <th style="width:90px;">关联问题</th>
              <th style="width:160px;">操作</th>
            </tr>
          </thead>
          <tbody id="categoryBody"></tbody>
        </table>
      </div>
      <div id="catEmpty" class="empty-state" style="display:none;">暂无分类，请新增分类</div>
    </div>

    <!-- 问题表 -->
    <div id="questionView" class="page-section data-section" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div style="color:var(--text-tertiary);font-size:var(--font-size-sm);">问题内容会被移动端从 6 个分类池中按分类选择后随机展示。</div>
        <button class="jg-btn jg-btn-primary" onclick="openQuestionModal()">新增问题</button>
      </div>
      <div class="data-table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>问题内容</th>
              <th style="width:140px;">所属分类</th>
              <th style="width:160px;">操作</th>
            </tr>
          </thead>
          <tbody id="questionBody"></tbody>
        </table>
      </div>
      <div id="qEmpty" class="empty-state" style="display:none;">暂无热门问题，请新增问题</div>
    </div>
  </main>
</div>

<!-- 分类表单 -->
<div class="modal-overlay" id="categoryModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="catModalTitle">新增分类</h3>
      <button class="modal-close" onclick="closeCategoryModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-field">
        <label>分类 ID<span style="color:var(--error);">*</span></label>
        <input id="catIdInput" placeholder="例如 plant / grow / custom_xxx" maxlength="32">
      </div>
      <div class="modal-field">
        <label>分类名称<span style="color:var(--error);">*</span></label>
        <input id="catNameInput" placeholder="例如 植保" maxlength="16">
      </div>
      <div class="modal-field">
        <label>描述</label>
        <textarea id="catDescInput" placeholder="移动端暂未展示，可选填用于管理备注" maxlength="120"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeCategoryModal()">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="submitCategory()">保存</button>
    </div>
  </div>
</div>

<!-- 问题表单 -->
<div class="modal-overlay" id="questionModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="qModalTitle">新增问题</h3>
      <button class="modal-close" onclick="closeQuestionModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-field">
        <label>问题内容<span style="color:var(--error);">*</span></label>
        <textarea id="qTextInput" placeholder="请输入移动端将展示的问题文案" maxlength="80"></textarea>
      </div>
      <div class="modal-field">
        <label>所属分类<span style="color:var(--error);">*</span></label>
        <select id="qCategorySelect"><option value="">请选择</option></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeQuestionModal()">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="submitQuestion()">保存</button>
    </div>
  </div>
</div>

<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/common-functions.js"></script>
<script src="js/shared/mobile-ops-store.js"></script>
<script src="../common/js/api.js"></script>
<script>
/* ============================================================
 * AI 助手配置（T12）—— 严格空库模式
 * 数据源（真实接口）：
 *   Api.get('mb_ai_category') -> sf_mb_ai_category(id, category_id, category_name, description)
 *   Api.get('mb_ai_question') -> sf_mb_ai_question(id, category_id, question, related_question)
 * 页面对象：
 *   分类 { id(DB主键), cid(分类ID), name, desc }
 *   问题 { id(DB主键), question, category(所属分类DB主键) }
 * 空库显示「暂无数据」，不内置演示记录，不写入 localStorage。
 * ============================================================ */
(function () {
  'use strict';

  var allData = { categories: [], hotQuestions: [] };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function mapCategory(r) {
    return {
      id: String(r.id),
      cid: r.category_id || '',
      name: r.category_name || '',
      desc: r.description || ''
    };
  }

  function mapQuestion(r) {
    return {
      id: String(r.id),
      question: r.question || '',
      category: r.category_id == null ? '' : String(r.category_id)
    };
  }

  function setTableState(bodyId, emptyId, msg, colspan) {
    var body = document.getElementById(bodyId);
    var empty = document.getElementById(emptyId);
    if (empty) empty.style.display = 'none';
    if (body) body.innerHTML = '<tr><td colspan="' + colspan + '" style="text-align:center;color:var(--text-tertiary);padding:24px 0;">' + esc(msg) + '</td></tr>';
  }

  function loadData() {
    setTableState('categoryBody', 'catEmpty', '加载中...', 5);
    setTableState('questionBody', 'qEmpty', '加载中...', 3);
    if (!window.Api || !Api.get) {
      setTableState('categoryBody', 'catEmpty', '数据加载失败：Api 未就绪', 5);
      setTableState('questionBody', 'qEmpty', '数据加载失败：Api 未就绪', 3);
      return;
    }
    Promise.all([
      Api.get('mb_ai_category', { page: 1, size: 500, sort: 'id', order: 'asc' }),
      Api.get('mb_ai_question', { page: 1, size: 500, sort: 'id', order: 'asc' })
    ]).then(function (results) {
      var cr = results[0], qr = results[1];
      if (!cr || !cr.ok || !qr || !qr.ok) {
        var msg = '数据加载失败：' + ((cr && cr.message) || (qr && qr.message) || '请检查登录状态与网络');
        setTableState('categoryBody', 'catEmpty', msg, 5);
        setTableState('questionBody', 'qEmpty', msg, 3);
        return;
      }
      allData = {
        categories: ((cr.data && cr.data.list) || []).map(mapCategory),
        hotQuestions: ((qr.data && qr.data.list) || []).map(mapQuestion)
      };
      refreshAll();
    }).catch(function (err) {
      var msg = '数据加载失败：' + ((err && err.message) || '请检查登录状态与网络');
      setTableState('categoryBody', 'catEmpty', msg, 5);
      setTableState('questionBody', 'qEmpty', msg, 3);
    });
  }

  function countLinkedQuestions(categoryId) {
    var n = 0;
    allData.hotQuestions.forEach(function (q) {
      if (q && q.category === categoryId) n++;
    });
    return n;
  }

  /* ====================== 渲染 ====================== */

  function renderStats(data) {
    document.getElementById('statCategory').textContent = data.categories.length;
    document.getElementById('statQuestion').textContent = data.hotQuestions.length;
  }

  function renderCategories(data) {
    var body = document.getElementById('categoryBody');
    var empty = document.getElementById('catEmpty');
    if (!data.categories.length) {
      body.innerHTML = '';
      empty.textContent = '暂无数据';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    body.innerHTML = data.categories.map(function (c) {
      var linked = countLinkedQuestions(c.id);
      return '<tr>' +
        '<td><span class="id-tag">' + esc(c.cid || c.id) + '</span></td>' +
        '<td>' + esc(c.name || '') + '</td>' +
        '<td><div class="cell-sub">' + esc(c.desc || '') + '</div></td>' +
        '<td>' + linked + ' 条</td>' +
        '<td><div class="action-btns">' +
          '<button class="action-btn detail" data-edit-cat="' + esc(c.id) + '">编辑</button>' +
          '<button class="action-btn danger" data-del-cat="' + esc(c.id) + '">删除</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  function renderQuestions(data) {
    var body = document.getElementById('questionBody');
    var empty = document.getElementById('qEmpty');
    var catMap = {};
    data.categories.forEach(function (c) { catMap[c.id] = c.name; });
    if (!data.hotQuestions.length) {
      body.innerHTML = '';
      empty.textContent = '暂无数据';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    body.innerHTML = data.hotQuestions.map(function (q) {
      var catName = catMap[q.category] || '—';
      return '<tr>' +
        '<td><div class="cell-title">' + esc(q.question || '') + '</div></td>' +
        '<td>' + esc(catName) + '</td>' +
        '<td><div class="action-btns">' +
          '<button class="action-btn detail" data-edit-q="' + esc(q.id) + '">编辑</button>' +
          '<button class="action-btn danger" data-del-q="' + esc(q.id) + '">删除</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  function rebuildQuestionCategorySelect(selectId) {
    var sel = document.getElementById(selectId);
    if (!sel) return;
    var opts = '<option value="">请选择</option>';
    allData.categories.forEach(function (c) {
      opts += '<option value="' + esc(c.id) + '">' + esc(c.name) + '（' + esc(c.cid || c.id) + '）</option>';
    });
    sel.innerHTML = opts;
  }

  function refreshAll() {
    renderStats(allData);
    renderCategories(allData);
    renderQuestions(allData);
    rebuildQuestionCategorySelect('qCategorySelect');
  }

  function switchView(name) {
    var catBtn = document.getElementById('tabCatBtn');
    var qBtn = document.getElementById('tabQBtn');
    var catView = document.getElementById('categoryView');
    var qView = document.getElementById('questionView');
    if (name === 'category') {
      catBtn.classList.add('active'); qBtn.classList.remove('active');
      catView.style.display = ''; qView.style.display = 'none';
    } else {
      qBtn.classList.add('active'); catBtn.classList.remove('active');
      catView.style.display = 'none'; qView.style.display = '';
    }
  }

  /* ====================== 分类表单 ====================== */
  var editingCatId = null;

  function openCategoryModal(id) {
    editingCatId = id || null;
    document.getElementById('catModalTitle').textContent = id ? '编辑分类' : '新增分类';
    if (id) {
      var target = null;
      allData.categories.forEach(function (c) { if (c.id === id) target = c; });
      if (!target) { Toast.error('未找到该分类'); return; }
      document.getElementById('catIdInput').value = target.cid || '';
      document.getElementById('catNameInput').value = target.name || '';
      document.getElementById('catDescInput').value = target.desc || '';
      document.getElementById('catIdInput').disabled = true;
    } else {
      document.getElementById('catIdInput').value = '';
      document.getElementById('catNameInput').value = '';
      document.getElementById('catDescInput').value = '';
      document.getElementById('catIdInput').disabled = false;
    }
    document.getElementById('categoryModal').classList.add('show');
  }
  function closeCategoryModal() {
    document.getElementById('categoryModal').classList.remove('show');
    editingCatId = null;
  }
  function submitCategory() {
    var idInput = document.getElementById('catIdInput');
    var nameInput = document.getElementById('catNameInput');
    var descInput = document.getElementById('catDescInput');
    var cid = (idInput.value || '').trim();
    var name = (nameInput.value || '').trim();
    var desc = (descInput.value || '').trim();

    if (editingCatId) {
      if (!name) { Toast.warning('请填写分类名称'); return; }
      Api.update('mb_ai_category', editingCatId, {
        category_name: name, description: desc
      }).then(function (res) {
        if (!res || !res.ok) { Toast.error((res && res.message) || '保存失败'); return; }
        closeCategoryModal();
        loadData();
        Toast.success('分类已更新');
      }).catch(function (err) { Toast.error((err && err.message) || '保存失败'); });
      return;
    }

    if (!cid) { Toast.warning('请填写分类 ID'); return; }
    if (!/^[a-zA-Z][a-zA-Z0-9_]*$/.test(cid)) {
      Toast.warning('分类 ID 须以字母开头，仅含字母/数字/下划线');
      return;
    }
    if (!name) { Toast.warning('请填写分类名称'); return; }
    var dup = false;
    allData.categories.forEach(function (c) { if (c.cid === cid) dup = true; });
    if (dup) { Toast.warning('分类 ID 已存在'); return; }
    Api.create('mb_ai_category', {
      category_id: cid, category_name: name, description: desc
    }).then(function (res) {
      if (!res || !res.ok) { Toast.error((res && res.message) || '保存失败'); return; }
      closeCategoryModal();
      loadData();
      Toast.success('已新增分类');
    }).catch(function (err) { Toast.error((err && err.message) || '保存失败'); });
  }

  function deleteCategory(id) {
    var target = null;
    allData.categories.forEach(function (c) { if (c.id === id) target = c; });
    if (!target) { Toast.error('未找到该分类'); return; }
    ConfirmDialog.show({
      title: '删除分类',
      message: '确认删除分类「' + (target.name || id) + '」？该操作不可恢复。',
      onConfirm: function () {
        var linked = countLinkedQuestions(id);
        if (linked > 0) {
          Toast.warning('该分类下还有 ' + linked + ' 条热门问题，请先删除或迁移后再删除分类');
          return;
        }
        Api.remove('mb_ai_category', id).then(function (res) {
          if (!res || !res.ok) { Toast.error((res && res.message) || '删除失败'); return; }
          loadData();
          Toast.success('分类已删除');
        }).catch(function (err) { Toast.error((err && err.message) || '删除失败'); });
      }
    });
  }

  /* ====================== 问题表单 ====================== */
  var editingQId = null;

  function openQuestionModal(id) {
    editingQId = id || null;
    document.getElementById('qModalTitle').textContent = id ? '编辑问题' : '新增问题';
    rebuildQuestionCategorySelect('qCategorySelect');
    if (id) {
      var target = null;
      allData.hotQuestions.forEach(function (q) { if (q.id === id) target = q; });
      if (!target) { Toast.error('未找到该问题'); return; }
      document.getElementById('qTextInput').value = target.question || '';
      document.getElementById('qCategorySelect').value = target.category || '';
    } else {
      document.getElementById('qTextInput').value = '';
      document.getElementById('qCategorySelect').value = '';
    }
    document.getElementById('questionModal').classList.add('show');
  }
  function closeQuestionModal() {
    document.getElementById('questionModal').classList.remove('show');
    editingQId = null;
  }
  function submitQuestion() {
    var qText = (document.getElementById('qTextInput').value || '').trim();
    var cat = document.getElementById('qCategorySelect').value;
    if (!qText) { Toast.warning('请填写问题内容'); return; }
    if (!cat) { Toast.warning('请选择所属分类'); return; }
    var isEdit = !!editingQId;
    var body = { question: qText, category_id: Number(cat) || null };
    var req = isEdit
      ? Api.update('mb_ai_question', editingQId, body)
      : Api.create('mb_ai_question', body);
    req.then(function (res) {
      if (!res || !res.ok) { Toast.error((res && res.message) || '保存失败'); return; }
      closeQuestionModal();
      loadData();
      Toast.success(isEdit ? '热门问题已更新' : '已新增热门问题');
    }).catch(function (err) { Toast.error((err && err.message) || '保存失败'); });
  }
  function deleteQuestion(id) {
    ConfirmDialog.show({
      title: '删除热门问题',
      message: '确认从推荐问题中移除该条？操作不可恢复。',
      onConfirm: function () {
        Api.remove('mb_ai_question', id).then(function (res) {
          if (!res || !res.ok) { Toast.error((res && res.message) || '删除失败'); return; }
          loadData();
          Toast.success('热门问题已删除');
        }).catch(function (err) { Toast.error((err && err.message) || '删除失败'); });
      }
    });
  }

  /* ====================== 事件代理 ====================== */
  document.addEventListener('click', function (e) {
    var catEdit = e.target.closest && e.target.closest('[data-edit-cat]');
    var catDel  = e.target.closest && e.target.closest('[data-del-cat]');
    var qEdit   = e.target.closest && e.target.closest('[data-edit-q]');
    var qDel    = e.target.closest && e.target.closest('[data-del-q]');
    if (catEdit) openCategoryModal(catEdit.getAttribute('data-edit-cat'));
    else if (catDel) deleteCategory(catDel.getAttribute('data-del-cat'));
    else if (qEdit) openQuestionModal(qEdit.getAttribute('data-edit-q'));
    else if (qDel) deleteQuestion(qDel.getAttribute('data-del-q'));
  });

  document.addEventListener('DOMContentLoaded', function () {
    loadData();
  });

  /* 暴露给内联 onclick */
  window.refreshAll = loadData;
  window.switchView = switchView;
  window.openCategoryModal = openCategoryModal;
  window.closeCategoryModal = closeCategoryModal;
  window.submitCategory = submitCategory;
  window.openQuestionModal = openQuestionModal;
  window.closeQuestionModal = closeQuestionModal;
  window.submitQuestion = submitQuestion;
})();
</script>
</body>
</html>
