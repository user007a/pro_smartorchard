<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 设备台账</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:999; backdrop-filter:blur(4px); }
  .modal-overlay.show { display:block; }
  .modal-box { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:var(--bg-card); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.15);
    width:900px; max-width:94vw; max-height:88vh; overflow-y:auto; z-index:1000; animation:modalSlideIn .25s ease-out; }
  .modal-box.show { display:block; }
  @keyframes modalSlideIn { from{opacity:0;transform:translate(-50%,-50%) scale(.95)} to{opacity:1;transform:translate(-50%,-50%) scale(1)} }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;
    padding-bottom:16px; border-bottom:1px solid var(--border-light); position:sticky; top:0; background:var(--bg-card); z-index:2; }
  .modal-header::before { content:''; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:4px; height:24px; background:linear-gradient(180deg,var(--primary-400),var(--primary-600)); border-radius:0 4px 4px 0; }
  .modal-header h3 { font-size:16px; font-weight:600; color:var(--text-primary); margin:0; padding-left:12px; }
  .modal-close { width:28px; height:28px; border:none; background:var(--gray-100); border-radius:6px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .2s ease; }
  .modal-close:hover { background:var(--error-bg); color:var(--error); }
  .modal-body { padding:0 4px; }
  .modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; padding-top:16px;
    border-top:1px solid var(--border-light); background:var(--gray-50); padding:16px 0 0; }

  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:13px; font-weight:500; color:var(--text-secondary); margin-bottom:8px; }
  .form-group label.required::after { content:' *'; color:var(--error); }
  .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px;
    border:1px solid var(--border-default); border-radius:8px; font-size:13px; box-sizing:border-box; transition:all .2s ease; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline:none; border-color:var(--primary-400); box-shadow:0 0 0 3px rgba(24,144,255,.1); }
  .form-group textarea { min-height:80px; resize:vertical; }
  .form-row { display:flex; gap:16px; }
  .form-row > .form-group { flex:1; }

  .detail-info { padding:12px; background:linear-gradient(135deg,var(--gray-50),var(--gray-100));
    border-radius:12px; margin-bottom:12px; border:1px solid var(--border-default); }
  .detail-row { display:flex; padding:9px 0; border-bottom:1px dashed var(--border-default); font-size:13px; }
  .detail-row:last-child { border-bottom:none; }
  .detail-label { width:104px; color:var(--text-tertiary); flex-shrink:0; }
  .detail-value { flex:1; color:var(--text-primary); word-break:break-all; }
  .detail-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:0 24px; }

  .status-tag { display:inline-flex; align-items:center; padding:3px 10px; font-size:11.5px;
    font-weight:500; border-radius:20px; white-space:nowrap; }
  .status-tag.online { background:#d9f7be; color:#3a8618; border:1px solid #b7eb8f; }
  .status-tag.maintain { background:var(--warning-bg); color:#ad8b00; border:1px solid var(--warning-border); }
  .status-tag.processing { background:var(--info-bg); color:var(--primary-500); border:1px solid var(--info-border); }
  .status-tag.offline { background:var(--error-bg); color:#cf1322; border:1px solid #ffccc7; }
  .status-tag.warning { background:var(--warning-bg); color:#ad8b00; border:1px solid var(--warning-border); }
  .status-tag.idle { background:var(--gray-100); color:var(--text-secondary); border:1px solid var(--border-default); }
  .status-tag.scrapped { background:var(--gray-100); color:var(--text-tertiary); border:1px solid var(--border-strong); }

  .type-badge { display:inline-block; padding:2px 8px; border-radius:var(--radius-sm); font-size:11.5px;
    font-weight:500; background:var(--primary-50); color:var(--primary-600); border:1px solid var(--primary-100); }
  .action-btns { display:flex; gap:6px; flex-wrap:nowrap; }
  .action-btn { padding:4px 10px; font-size:11.5px; font-weight:500; border:1px solid transparent;
    border-radius:6px; cursor:pointer; transition:all .2s ease; white-space:nowrap; }
  .action-btn.detail { color:#2b6cb0; background:#f5f8fc; border-color:#c5d9f0; }
  .action-btn.detail:hover { background:#edf2fa; border-color:#90bce8; }
  .action-btn.edit { color:var(--primary-600); background:var(--gray-50); border-color:var(--border-default); }
  .action-btn.edit:hover { background:var(--primary-50); border-color:var(--primary-300); }
  .action-btn.delete { color:var(--error); background:#fff8f7; border-color:#ffd1d1; }
  .action-btn.delete:hover { background:var(--error-bg); border-color:var(--error-border); }
  .action-btn.data { color:#3a8618; background:#f6fcf1; border-color:#c8e6a6; }
  .action-btn.data:hover { background:#eaf7dc; border-color:#9ed35f; }

  .stat-card-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:16px; }
  .stat-card { background:#fff; border:1px solid #eef0ee; border-radius:12px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .stat-label { font-size:12px; color:var(--text-tertiary); margin-bottom:6px; }
  .stat-value { font-size:26px; font-weight:700; color:var(--text-primary); font-variant-numeric:tabular-nums; }
  .stat-value .unit { font-size:13px; font-weight:500; color:var(--text-tertiary); margin-left:4px; }
  .stat-sub { margin-top:6px; font-size:12px; color:var(--text-tertiary); }
  .stat-sub.warn { color:var(--warning); }
  .stat-sub.err { color:var(--error); }

  .chart-card { background:#fff; border:1px solid #eef0ee; border-radius:12px; padding:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.04); min-width:300px; }
  .chart-title { font-weight:600; font-size:14px; color:#1f2e1f; margin-bottom:10px; }

  .point-picker { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .point-picker label { display:flex; align-items:center; gap:8px; cursor:pointer; padding:8px 12px;
    border:1px solid var(--border-default); border-radius:var(--radius-md); font-size:13px;
    color:var(--text-primary); background:var(--bg-card); transition:all .2s; }
  .point-picker label.checked { border-color:var(--primary-500); background:rgba(24,144,255,.08); }
  .point-picker .pk-unit { margin-left:auto; font-size:11px; color:var(--text-tertiary); }

  .metric-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:16px; }
  .metric-card { padding:12px 14px; background:var(--bg-card); border:1px solid var(--border-default);
    border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .metric-name { font-size:12px; color:var(--text-tertiary); margin-bottom:6px; }
  .metric-value { font-size:20px; font-weight:600; color:var(--text-primary); font-variant-numeric:tabular-nums; }
  .metric-value em { margin-left:4px; font-size:12px; font-style:normal; font-weight:500; color:var(--text-tertiary); }
  .data-table { min-width:1320px; }
  .data-table th { white-space:nowrap; }
  .empty-row td { text-align:center; color:var(--text-tertiary); padding:40px 0; }
  #pagination-container { padding:12px 16px; }
  @media (max-width:900px) { .detail-grid { grid-template-columns:1fr; } .point-picker { grid-template-columns:1fr 1fr; } }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>

<body data-active-menu="device" data-active-submenu="device-info">

<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <nav class="device-tabs" aria-label="设备台账">
        <a href="device_info.html" class="active">设备列表</a>
        <a href="device_model.html">类型与物模型</a>
        <a href="device_asset.html">资产盘点</a>
      </nav>

      <!-- 统计卡 -->
      <div class="stat-card-row" id="statCards"></div>

      <!-- 图表 -->
      <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin:0 0 20px;">
        <div class="chart-card"><div class="chart-title">设备状态分布</div><div id="device_info-c1" style="width:100%;height:240px;"></div></div>
        <div class="chart-card"><div class="chart-title">设备类型构成</div><div id="device_info-c2" style="width:100%;height:240px;"></div></div>
      </section>

      <div class="content-wrapper">

        <!-- ===== 搜索栏区 ===== -->
        <div class="page-section search-section">
          <div class="search-bar">
            <select class="search-select" id="typeSelect"><option value="">全部设备类型</option></select>
            <select class="search-select" id="baseSelect"><option value="">全部基地</option></select>
            <select class="search-select" id="statusSelect" style="min-width:120px;">
              <option value="">全部运行状态</option>
              <option value="online">在线</option>
              <option value="maintain">维护中</option>
              <option value="offline">离线</option>
            </select>
            <select class="search-select" id="assetSelect" style="min-width:120px;">
              <option value="">全部资产状态</option>
              <option value="inuse">在用</option>
              <option value="idle">闲置</option>
              <option value="repair">维修中</option>
              <option value="scrapped">已报废</option>
              <option value="transferred">已调拨</option>
            </select>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索设备名称 / 编号 / SN / 型号...">
            <div class="search-actions">
              <button class="jg-btn jg-btn-primary" onclick="handleSearch()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button>
              <button class="jg-btn" onclick="smartReset()">重置</button>
            </div>
          </div>
        </div>

        <!-- ===== 操作按钮区 ===== -->
        <div class="page-section action-bar">
          <button class="jg-btn jg-btn-primary" onclick="openEditModal(null)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M12 5v14"/><path d="M5 12h14"/>
            </svg>新增设备
          </button>
          <button class="jg-btn-outline" onclick="openImportModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>
            </svg>批量导入
          </button>
          <button class="jg-btn-outline" onclick="exportDevices()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/>
            </svg>导出数据
          </button>
        </div>

        <!-- ===== 数据表格区 ===== -->
        <div class="page-section data-section">
          <div class="data-table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th class="checkbox-col" style="width:56px;">序号</th>
                <th style="width:84px;">设备编号</th>
                <th style="width:150px;">设备名称</th>
                <th style="width:128px;">设备类型</th>
                <th style="width:128px;">所属基地</th>
                <th style="width:118px;">所属地块</th>
                <th style="width:110px;">安装位置</th>
                <th style="width:82px;">运行状态</th>
                <th style="width:82px;">资产状态</th>
                <th style="width:88px;">维保周期</th>
                <th style="width:96px;">下次保养</th>
                <th style="width:130px;">操作</th>
              </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
          </table>
          </div>
          <div id="pagination-container"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- 新增/编辑设备模态框 -->
<div class="modal-overlay" id="editOverlay"></div>
<div class="modal-box" id="editModal">
  <div class="modal-header">
    <h3 id="edit-title">新增设备</h3>
    <button class="modal-close" onclick="closeEditModal()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l8 8M11 3l-8 8"/></svg>
    </button>
  </div>
  <div class="modal-body">
    <form id="form-device">
      <div class="form-row">
        <div class="form-group"><label class="required">设备编号</label><input type="text" id="f-id" placeholder="留空自动生成，如 D-026"></div>
        <div class="form-group"><label class="required">设备名称</label><input type="text" id="f-name" placeholder="如 东区气象监测站"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="required">设备类型</label><select id="f-type"></select></div>
        <div class="form-group"><label class="required">所属基地</label><select id="f-base"></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>所属地块</label><select id="f-plot"></select></div>
        <div class="form-group"><label class="required">安装位置</label><input type="text" id="f-location" placeholder="如 A区中心路口"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>设备厂商</label><input type="text" id="f-vendor" placeholder="如 托普云农"></div>
        <div class="form-group"><label>设备型号</label><input type="text" id="f-model" placeholder="如 AWS-800"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>SN 序列号</label><input type="text" id="f-sn" placeholder="设备出厂唯一序列号"></div>
        <div class="form-group"><label>固件版本</label><input type="text" id="f-firmware" placeholder="如 V2.1.0"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>IP 地址</label><input type="text" id="f-ip" placeholder="如 10.20.1.11"></div>
        <div class="form-group"><label>通信协议</label><select id="f-protocol"></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>供电方式</label><select id="f-power"></select></div>
        <div class="form-group"><label>运行状态</label><select id="f-status"></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>资产状态</label><select id="f-assetStatus"></select></div>
        <div class="form-group"><label>处置方式</label><select id="f-disposalWay"></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>安装日期</label><input type="date" id="f-installDate"></div>
        <div class="form-group"><label>启用日期</label><input type="date" id="f-enableDate"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>采购金额(元)</label><input type="number" id="f-purchaseAmount" min="0" step="0.01"></div>
        <div class="form-group"><label>使用寿命(年)</label><input type="number" id="f-usefulYears" min="0" step="1"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>维保周期(月)</label><input type="number" id="f-maintainCycle" min="0" step="1"></div>
        <div class="form-group"><label>校准周期(月)</label><input type="number" id="f-calibrateCycle" min="0" step="1"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>运维负责人</label><select id="f-owner"></select></div>
        <div class="form-group"><label>供应商</label><input type="text" id="f-supplier" placeholder="选填"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>质保到期日</label><input type="date" id="f-warrantyUntil"></div>
        <div class="form-group"><label>累计运行时长(h)</label><input type="number" id="f-runningHours" min="0" step="1"></div>
      </div>
      <div class="form-group">
        <label>备注信息</label>
        <textarea id="f-remark" placeholder="埋设深度 / 供电说明 / 特殊要求等"></textarea>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button class="jg-btn" onclick="closeEditModal()">取消</button>
    <button class="jg-btn jg-btn-primary" onclick="saveDevice()">保存</button>
  </div>
</div>

<!-- 设备详情模态框 -->
<div class="modal-overlay" id="detailOverlay"></div>
<div class="modal-box" id="detailModal" style="width:860px;">
  <div class="modal-header">
    <h3 id="detail-title">设备详情</h3>
    <button class="modal-close" onclick="closeDetailModal()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l8 8M11 3l-8 8"/></svg>
    </button>
  </div>
  <div class="modal-body" id="detailBody"></div>
  <div class="modal-footer">

</div>

<!-- 实时数据模态框 -->
<div class="modal-overlay" id="dataOverlay"></div>
<div class="modal-box" id="dataModal" style="width:880px;">
  <div class="modal-header">
    <h3 id="data-title">设备实时数据</h3>
    <button class="modal-close" onclick="closeDataModal()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l8 8M11 3l-8 8"/></svg>
    </button>
  </div>
  <div class="modal-body" id="dataBody"></div>
  <div class="modal-footer">
    <button class="jg-btn" onclick="closeDataModal()">关闭</button>

  </div>
</div>

<!-- 批量导入模态框 -->
<div class="modal-overlay" id="importOverlay"></div>
<div class="modal-box" id="importModal" style="width:680px;">
  <div class="modal-header">
    <h3>批量导入设备</h3>
    <button class="modal-close" onclick="closeImportModal()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l8 8M11 3l-8 8"/></svg>
    </button>
  </div>
  <div class="modal-body">
    <div class="form-group">
      <label>导入格式</label>
      <div style="font-size:13px;color:var(--text-secondary);line-height:1.8;">
        下载 <a href="#" onclick="downloadTemplate();return false;" style="color:var(--primary-500);">设备导入模板.csv</a> 后按模板填写，
        每行一台设备。<br>
        列顺序：设备名称, 设备类型, 所属基地, 所属地块, 安装位置, 设备厂商, 设备型号, SN序列号, IP地址
      </div>
    </div>
    <div class="form-group">
      <label class="required">选择 CSV 文件</label>
      <input type="file" id="importFile" accept=".csv,text/csv">
    </div>
    <div class="form-hint" id="importHint">导入时自动跳过编号重复的设备，导入结果可在设备列表核对。</div>
  </div>
  <div class="modal-footer">
    <button class="jg-btn" onclick="closeImportModal()">取消</button>
    <button class="jg-btn jg-btn-primary" onclick="doImport()">开始导入</button>
  </div>
</div>

<script src="js/components/modal.js"></script>
<script src="js/components/confirm.js"></script>
<script src="js/shared/device-store.js"></script>
<script src="js/shared/device-ui.js"></script>
<script>
/* ============================================================
 * 设备台账（Device Ledger）
 * 数据源：js/shared/device-store.js → devices()
 *
 * 关键约定：
 *  - 设备类型唯一取自 DeviceStore.DEVICE_TYPE_DICT（全模块字典，22 类）
 *  - 基地 / 地块外键取自 DeviceStore.bases() / plots()（与企业管理、地块管理一致）
 *  - 接入配置、视频通道通过 deviceId 与台账双向关联

/* ---------- 表格行 ---------- */
function renderRow(item, index) {
  var t = DeviceStore.typeOf(item.type);
  var cat = t ? (DeviceStore.TYPE_CATEGORY_TEXT[t.category] || '其他') : '其他';
  var due = item.nextMaintainDate || '';
  var dueText = '-';
  var dueCls = '';
  if (due) {
    var diff = Math.round((Date.parse(due + 'T00:00:00') - Date.parse(DeviceStore.todayStr() + 'T00:00:00')) / 86400000);
    if (diff < 0) { dueText = '已逾期 ' + Math.abs(diff) + ' 天'; dueCls = 'color:#cf1322;'; }
    else if (diff <= 30) { dueText = due + '（' + diff + '天）'; dueCls = 'color:#ad8b00;'; }
    else dueText = due;
  }
  return '<tr>' +
    '<td class="checkbox-col">' + index + '</td>' +
    '<td><strong>' + DeviceUI.esc(item.id) + '</strong></td>' +
    '<td>' + DeviceUI.esc(item.name) + '</td>' +
    '<td><span class="type-badge" title="' + DeviceUI.esc(cat) + '">' + DeviceUI.esc(DeviceStore.typeName(item.type)) + '</span></td>' +
    '<td>' + DeviceUI.esc(item.base) + '</td>' +
    '<td>' + (item.plotId ? DeviceUI.esc(DeviceStore.plotLabel(item.plotId)) : '-') + '</td>' +
    '<td>' + DeviceUI.esc(item.location || '-') + '</td>' +
    '<td class="text-center">' + DeviceUI.statusTag(item.status, STATUS_TEXT[item.status]) + '</td>' +
    '<td class="text-center">' + DeviceUI.statusTag(item.assetStatus, ASSET_TEXT[item.assetStatus]) + '</td>' +
    '<td>' + (item.maintainCycle ? item.maintainCycle + ' 个月' : '-') + '</td>' +
    '<td style="' + dueCls + '">' + DeviceUI.esc(dueText) + '</td>' +
    '<td><div class="action-btns">' +
      '<button class="action-btn detail" onclick="openDetail(\'' + item.id + '\')">详情</button>' +

/* ---------- 筛选 ---------- */
function filteredList() {
  var type = document.getElementById('typeSelect').value;
  var base = document.getElementById('baseSelect').value;
  var status = document.getElementById('statusSelect').value;
  var asset = document.getElementById('assetSelect').value;
  var kw = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  return DeviceStore.devices().filter(function (x) {
    if (type && x.type !== type) return false;
    if (base && x.base !== base) return false;
    if (status && x.status !== status) return false;
    if (asset && x.assetStatus !== asset) return false;
    if (kw) {
      var hay = [x.id, x.name, x.sn, x.model, x.vendor, x.location, x.ip].join(' ').toLowerCase();
      if (hay.indexOf(kw) === -1) return false;
    }
    return true;
  });
}

function handleSearch() {
  var list = filteredList();
  page.updateData(list);
  DeviceUI.toast('找到 ' + list.length + ' 条记录', 'info');
}

function resetDeviceFilter() {
  ['typeSelect', 'baseSelect', 'statusSelect', 'assetSelect'].forEach(function (id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('searchInput').value = '';
  page.updateData(DeviceStore.devices());

function saveDevice() {
  var t = DeviceStore.typeOf(document.getElementById('f-type').value);
  var item = {
    id: (document.getElementById('f-id').value || '').trim() || DeviceStore.nextId('device'),
    name: (document.getElementById('f-name').value || '').trim(),
    type: document.getElementById('f-type').value,
    base: document.getElementById('f-base').value,
    plotId: document.getElementById('f-plot').value || '',
    location: (document.getElementById('f-location').value || '').trim(),
    vendor: (document.getElementById('f-vendor').value || '').trim(),
    model: (document.getElementById('f-model').value || '').trim(),
    sn: (document.getElementById('f-sn').value || '').trim(),
    firmware: (document.getElementById('f-firmware').value || '').trim(),
    ip: (document.getElementById('f-ip').value || '').trim(),
    protocol: document.getElementById('f-protocol').value,
    power: document.getElementById('f-power').value,
    status: document.getElementById('f-status').value,
    assetStatus: document.getElementById('f-assetStatus').value,
    disposalWay: document.getElementById('f-disposalWay').value || '',
    installDate: document.getElementById('f-installDate').value || '',
    enableDate: document.getElementById('f-enableDate').value || '',
    purchaseAmount: Number(document.getElementById('f-purchaseAmount').value) || 0,
    usefulYears: Number(document.getElementById('f-usefulYears').value) || 0,
    maintainCycle: Number(document.getElementById('f-maintainCycle').value) || 0,
    calibrateCycle: Number(document.getElementById('f-calibrateCycle').value) || 0,
    owner: document.getElementById('f-owner').value,
    supplier: (document.getElementById('f-supplier').value || '').trim(),
    warrantyUntil: document.getElementById('f-warrantyUntil').value || '',
    runningHours: Number(document.getElementById('f-runningHours').value) || 0,
    remark: (document.getElementById('f-remark').value || '').trim(),
    updatedAt: DeviceStore.stampNow()
  };

  var chk = DeviceStore.validate('device', item, editingId);
  if (!chk.ok) { DeviceUI.toast(chk.message, 'warning'); return; }

  // 新增时按类型字典补默认维保 / 校准周期
  if (!editingId && t) {
    if (!item.maintainCycle) item.maintainCycle = t.maintainCycle;
    if (!item.calibrateCycle) item.calibrateCycle = t.calibrateCycle;
  }

  var old = editingId ? DeviceStore.deviceOf(editingId) : null;
  var merged = old ? Object.assign({}, old, item) : item;
  if (!merged.createdAt) merged.createdAt = DeviceStore.todayStr();
  if (!merged.lastSeenAt) merged.lastSeenAt = DeviceStore.stampNow();
  if (!merged.onlineRate) merged.onlineRate = 100;
  if (!merged.uptimeRate) merged.uptimeRate = 100;
  if (!merged.faultCount) merged.faultCount = 0;
  if (!merged.collectCount) merged.collectCount = 0;

  DeviceStore.upsertDevice(merged);
  closeEditModal();
  DeviceUI.toast(editingId ? '设备信息已更新' : '设备已创建', 'success');
  refreshAll();
}

/* ---------- 删除 ---------- */
function handleDelete(id) {
  var item = DeviceStore.deviceOf(id);
  if (!item) return;
  var acc = DeviceStore.accessOfDevice(id);
  var cam = DeviceStore.cameraOfDevice(id);
  var ms = DeviceStore.maintainsOfDevice(id);
  var warn = [];
  if (acc) warn.push('接入配置「' + acc.id + '」');
  if (cam) warn.push('视频通道「' + cam.id + '」');
  if (ms.length) warn.push(ms.length + ' 条维护工单');
  var extra = warn.length ? '该设备的 ' + warn.join('、') + ' 将一并清理。' : '';
  DeviceUI.confirmDelete('确定要删除设备「' + item.name + '」吗？' + extra + '此操作不可撤销。')
    .then(function (ok) {
      if (!ok) return;
      DeviceStore.removeDevice(id);
      DeviceUI.toast('删除成功', 'success');
      refreshAll();
    });
}

};

function seedOf(str) {
  var h = 0;
  for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 99991;
  return h;
}
function noiseOf(seed, i) {
  var x = Math.sin(seed + i * 12.9898) * 43758.5453;
  return (x - Math.floor(x)) - 0.5;
}

function openData(id) {
  var d = DeviceStore.deviceOf(id);
  if (!d) return;
  dataId = id;
  var acc = DeviceStore.accessOfDevice(id);
  var points = acc && acc.points && acc.points.length
    ? DeviceStore.dataPointsOf(acc.deviceType).filter(function (p) { return acc.points.indexOf(p.key) !== -1; })
    : DeviceStore.dataPointsOf(d.type);

  if (!points.length) {
    points = DeviceStore.dataPointsOf(d.type);
  }
  if (!points.length) {
    DeviceUI.toast('该设备类型未配置采集测点，请先在「设备类型与物模型」中维护', 'warning');
    return;
  }

  var offline = d.status !== 'online';
  /* 优先取设备最近一次真实上报值（气象/土壤/虫情等在线设备），无上报值时按物模型测点模拟 */
  var live = DeviceStore.readingsOf(id) || {};
  var vals = points.map(function (p, pi) {
    if (typeof live[p.key] === 'number') return live[p.key];
    var base = METRIC_BASE[p.key] !== undefined ? METRIC_BASE[p.key] : 10;
    var n = noiseOf(seedOf(id + '_' + pi), 7);
    var v = base * (1 + 0.06 * n);
    var dec = p.step && String(p.step).indexOf('.') >= 0 ? String(p.step).split('.')[1].length : 0;
    return parseFloat(v.toFixed(dec));
  });

  var times = ['08:00', '10:00', '12:00', '14:00', '16:00', '18:00', '20:00', '22:00'];
  document.getElementById('data-title').textContent = '设备实时数据 · ' + d.name;
  document.getElementById('dataBody').innerHTML =
    '<div class="detail-info" style="margin-bottom:14px;"><div class="detail-grid">' +
      '<div class="detail-row"><span class="detail-label">设备编号</span><span class="detail-value">' + DeviceUI.esc(d.id) + '</span></div>' +
      '<div class="detail-row"><span class="detail-label">设备类型</span><span class="detail-value">' + DeviceUI.esc(DeviceStore.typeName(d.type)) + '</span></div>' +
      '<div class="detail-row"><span class="detail-label">运行状态</span><span class="detail-value">' + (STATUS_TEXT[d.status] || '-') + '</span></div>' +
      '<div class="detail-row"><span class="detail-label">安装位置</span><span class="detail-value">' + DeviceUI.esc(d.location || '-') + '</span></div>' +
      '<div class="detail-row"><span class="detail-label">采集频率</span><span class="detail-value">' + DeviceUI.esc(acc ? acc.freq : '未接入') + '</span></div>' +
      '<div class="detail-row"><span class="detail-label">最近上线</span><span class="detail-value">' + DeviceUI.esc(d.lastSeenAt || '-') + '</span></div>' +
    '</div></div>' +
    (offline ? '<div style="margin-bottom:14px;padding:8px 12px;font-size:12.5px;color:#cf7d00;background:#fffbe6;border:1px solid #ffe58f;border-radius:8px;">设备当前非在线状态，以下展示最近一次成功采集的数据。</div>' : '') +
    '<div class="metric-grid">' + points.map(function (p, pi) {
      var abnormal = p.min !== undefined && p.max !== undefined
        && (vals[pi] < p.min || vals[pi] > p.max);
      return '<div class="metric-card"><div class="metric-name">' + DeviceUI.esc(p.name) +
        ' <span style="font-size:11px;color:' + (abnormal ? '#cf1322' : '#3a8618') + '">' + (abnormal ? '异常' : '正常') + '</span></div>' +
        '<div class="metric-value">' + vals[pi] + '<em>' + DeviceUI.esc(p.unit || '') + '</em></div></div>';
    }).join('') + '</div>' +
    '<div style="font-weight:600;font-size:13px;color:var(--text-primary);margin-bottom:8px;">采集明细</div>' +
    '<div style="max-height:280px;overflow:auto;border:1px solid var(--border-default);border-radius:12px;">' +
    '<table class="data-table" style="min-width:600px;"><thead><tr><th>采集时间</th>' +
    points.map(function (p) { return '<th>' + DeviceUI.esc(p.name) + '(' + DeviceUI.esc(p.unit || '-') + ')</th>'; }).join('') +
    '<th>状态</th></tr></thead><tbody>' +
    times.slice().reverse().map(function (t, i) {
      var idx = times.length - 1 - i;
      var rowVals = points.map(function (p, pi) {
        var base = METRIC_BASE[p.key] !== undefined ? METRIC_BASE[p.key] : 10;
        var v = base * (1 + 0.06 * noiseOf(seedOf(id + '_' + pi), idx));
        var dec = p.step && String(p.step).indexOf('.') >= 0 ? String(p.step).split('.')[1].length : 0;
        return parseFloat(v.toFixed(dec));
      });
      var bad = points.some(function (p, pi) {
        return p.min !== undefined && p.max !== undefined && (rowVals[pi] < p.min || rowVals[pi] > p.max);
      });
      return '<tr><td>' + DeviceStore.todayStr() + ' ' + t + '</td>' +
        rowVals.map(function (v) { return '<td>' + v + '</td>'; }).join('') +
        '<td>' + DeviceUI.statusTag(bad ? 'offline' : 'online', bad ? '预警' : '正常') + '</td></tr>';
    }).join('') + '</tbody></table></div>';

  document.getElementById('dataModal').classList.add('show');
  document.getElementById('dataOverlay').classList.add('show');
}

function closeDataModal() {
  document.getElementById('dataModal').classList.remove('show');
  document.getElementById('dataOverlay').classList.remove('show');
}

function exportDeviceData() {
  var d = DeviceStore.deviceOf(dataId);
  if (!d) return;
  var acc = DeviceStore.accessOfDevice(dataId);
  var points = acc && acc.points && acc.points.length
    ? DeviceStore.dataPointsOf(acc.deviceType).filter(function (p) { return acc.points.indexOf(p.key) !== -1; })
    : DeviceStore.dataPointsOf(d.type);
  var headers = ['采集时间'].concat(points.map(function (p) { return p.name + '(' + (p.unit || '-') + ')'; }));
  var rows = ['08:00', '10:00', '12:00', '14:00', '16:00', '18:00', '20:00', '22:00'].map(function (t, idx) {
    return [DeviceStore.todayStr() + ' ' + t].concat(points.map(function (p, pi) {
      var base = METRIC_BASE[p.key] !== undefined ? METRIC_BASE[p.key] : 10;
      var v = base * (1 + 0.06 * noiseOf(seedOf(dataId + '_' + pi), idx));
      var dec = p.step && String(p.step).indexOf('.') >= 0 ? String(p.step).split('.')[1].length : 0;
      return parseFloat(v.toFixed(dec));
    }));
  });
  DeviceUI.exportCsv('设备数据_' + d.id, headers, rows);
}

  var headers = ['设备编号', '设备名称', '设备类型', '所属基地', '所属地块', '安装位置',
    '设备厂商', '设备型号', 'SN序列号', '固件版本', 'IP地址', '通信协议', '供电方式',
    '运行状态', '资产状态', '安装日期', '采购金额(元)', '维保周期(月)', '校准周期(月)',
    '运维负责人', '最近维护', '下次保养', '在线率(%)', '累计运行时长(h)', '备注'];

    return [x.id, x.name, DeviceStore.typeName(x.type), x.base,
      x.plotId ? DeviceStore.plotLabel(x.plotId) : '', x.location || '', x.vendor || '', x.model || '',

      STATUS_TEXT[x.status] || x.status, ASSET_TEXT[x.assetStatus] || x.assetStatus,

      x.runningHours || 0, x.remark || ''];

/* ---------- 批量导入 ---------- */
function openImportModal() {
  document.getElementById('importFile').value = '';
  document.getElementById('importHint').textContent = '导入时自动跳过编号重复的设备，导入结果可在设备列表核对。';
  document.getElementById('importModal').classList.add('show');
  document.getElementById('importOverlay').classList.add('show');
}
function closeImportModal() {
  document.getElementById('importModal').classList.remove('show');
  document.getElementById('importOverlay').classList.remove('show');
}

function downloadTemplate() {
  var headers = ['设备名称', '设备类型', '所属基地', '所属地块', '安装位置', '设备厂商', '设备型号', 'SN序列号', 'IP地址'];
  var sample = [['东区气象监测站', '气象监测站', DeviceStore.bases()[0] || '', '', 'A区中心路口', '托普云农', 'AWS-800', 'SN-D026-AWS800', '10.20.1.70']];
  DeviceUI.exportCsv('设备导入模板', headers, sample);
}

function doImport() {
  var input = document.getElementById('importFile');
  if (!input.files || !input.files.length) {
    DeviceUI.toast('请先选择 CSV 文件', 'warning');
    return;
  }
  var file = input.files[0];
  var reader = new FileReader();
  reader.onload = function (e) {
    var text = String(e.target.result || '');
    var lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(function (l) { return l.trim(); });
    if (lines.length < 2) { DeviceUI.toast('文件内容为空或缺少表头', 'warning'); return; }
    var ok = 0, skip = 0, fail = 0;
    var exists = {};
    DeviceStore.devices().forEach(function (x) { exists[x.name] = true; });
    for (var i = 1; i < lines.length; i++) {
      var cols = lines[i].split(',').map(function (c) { return c.trim(); });
      var name = cols[0];
      if (!name) continue;
      var t = DeviceStore.typeList().filter(function (x) { return x.name === cols[1]; })[0];
      if (!t) { fail++; continue; }
      if (exists[name]) { skip++; continue; }
      var item = {
        id: DeviceStore.nextId('device'),
        name: name, type: t.code, base: cols[2] || (DeviceStore.bases()[0] || ''),
        plotId: cols[3] || '', location: cols[4] || '',
        vendor: cols[5] || '', model: cols[6] || '', sn: cols[7] || '', ip: cols[8] || '',
        protocol: 'MQTT', power: '市电', status: 'online', assetStatus: 'inuse',
        maintainCycle: t.maintainCycle, calibrateCycle: t.calibrateCycle,
        owner: DeviceUI.operators()[0], installDate: DeviceStore.todayStr(),
        enableDate: DeviceStore.todayStr(), purchaseAmount: 0, usefulYears: 5,
        runningHours: 0, faultCount: 0, onlineRate: 100, uptimeRate: 100, collectCount: 0,
        lastSeenAt: DeviceStore.stampNow(), createdAt: DeviceStore.todayStr(), updatedAt: DeviceStore.stampNow(),
        remark: '批量导入'
      };
      var chk = DeviceStore.validate('device', item, null);
      if (!chk.ok) { fail++; continue; }
      DeviceStore.upsertDevice(item);
      exists[name] = true;
      ok++;
    }
    closeImportModal();
    refreshAll();
    DeviceUI.toast('导入完成：成功 ' + ok + ' 条，跳过重复 ' + skip + ' 条，失败 ' + fail + ' 条', ok ? 'success' : 'warning');
  };
  reader.readAsText(file, 'UTF-8');
}

/* ---------- 刷新 ---------- */
function refreshAll() {
  renderStats();
  page.updateData(filteredList());
  renderCharts();
}

/* ---------- 图表 ---------- */
function renderCharts() {
  if (!window.Chart) return;
  var s = DeviceStore.deviceSummary();
  Chart.donut('#device_info-c1', { series: [
    { name: '在线', value: s.online, color: '#52c41a' },
    { name: '维护中', value: s.maintain, color: '#faad14' },
    { name: '离线', value: s.offline, color: '#ff4d4f' }
  ]});
  var types = Object.keys(s.byType).map(function (k) {
    return { name: DeviceStore.typeName(k), value: s.byType[k] };
  }).sort(function (a, b) { return b.value - a.value; }).slice(0, 8);
  Chart.pie('#device_info-c2', { series: types });
}

/* ---------- 初始化 ---------- */
document.addEventListener('DOMContentLoaded', function () {
  initSelects();
  renderStats();
  page = DeviceUI.pagination({
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderRow,
    emptyCols: 12,
    data: DeviceStore.devices()
  });
  DeviceStore.subscribe(function () {
    initSelects();
    renderStats();
    page.updateData(filteredList());
  });
  if (window.Chart) {
    window.Chart.loadECharts().then(renderCharts);
  } else {
    window.addEventListener('load', function () { window.Chart.loadECharts().then(renderCharts); });
  }
});
