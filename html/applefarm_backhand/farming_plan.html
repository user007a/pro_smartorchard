    border:1px solid var(--info-border, #bae0ff);

// 当前页面数据
var currentPlanName = '';

// 类型标签配色（复用现有三色令牌）
function typeTagClass(type) {
  if (type === 'fertilizer') return 'fertilizer';
  if (type === 'pesticide') return 'pesticide';
  return 'tool';
}

// 获取状态标签
function getStatusTag(status) {
  const statusMap = {
    'completed': '<span class="status-tag normal">已完成</span>',
    'executing': '<span class="status-tag done">执行中</span>',
    'pending': '<span class="status-tag warning">待执行</span>',
    'delayed': '<span class="status-tag danger">已延期</span>'
  };
  return statusMap[status] || statusMap['pending'];
}

// 按当前日期自动判定延误：结束日期已过且仍为 待执行/执行中 → 已延期
function applyAutoDelay() {
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  mockData.forEach(function (item) {
    if (item.status !== 'pending' && item.status !== 'executing') return;
    if (!item.endDate) return;
    var end = new Date(item.endDate + 'T00:00:00');
    if (end.getTime() < today.getTime()) item.status = 'delayed';
  });
}

// 获取操作按钮
function getActionButtons(item) {
  if (item.status === 'completed') {
    return `<div class="action-btns">
      <button class="action-btn detail" onclick="showDetail('${item.name}')">详情</button>
      <button class="action-btn edit" onclick="showEdit('${item.name}')">编辑</button>
      <button class="action-btn delete" onclick="showDeleteConfirm('${item.name}')">删除</button>
    </div>`;
  } else if (item.status === 'executing') {
    return `<div class="action-btns">
      <button class="action-btn detail" onclick="showDetail('${item.name}')">详情</button>
      <button class="action-btn edit" onclick="showEdit('${item.name}')">编辑</button>
      <button class="action-btn approve" onclick="showExecute('${item.name}')">执行任务</button>
    </div>`;
  } else {
    return `<div class="action-btns">
      <button class="action-btn detail" onclick="showDetail('${item.name}')">详情</button>
      <button class="action-btn edit" onclick="showEdit('${item.name}')">编辑</button>
      <button class="action-btn approve" onclick="showExecute('${item.name}')">开始执行</button>
    </div>`;
  }
}

// 完成率：实际量 / 计划量；无计划量时按状态兜底
function getCompletion(item) {
  if (!item.plannedQty) return null;
  return Math.round((item.actualQty || 0) / item.plannedQty * 100);
}

function getCompletionCell(item) {
  var rate = getCompletion(item);
  if (rate === null) return '<span style="color:var(--text-tertiary);">—</span>';
  var color = rate >= 100 ? 'var(--success)' : rate >= 60 ? 'var(--warning)' : 'var(--error)';
  var bar = Math.max(0, Math.min(100, rate));
  return `<div style="display:flex;align-items:center;gap:6px;">
    <span style="flex:1;height:6px;border-radius:3px;background:var(--gray-100);overflow:hidden;position:relative;">
      <i style="position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:${color};width:${bar}%;"></i>
    </span>
    <span style="color:${color};font-weight:600;min-width:34px;text-align:right;">${rate}%</span>
  </div>`;
}

// 渲染表格行
function renderRow(item, index) {
  var rowAttr = item.status === 'delayed' ? ' class="row-delayed"' : '';
  return `<tr${rowAttr}>
    <td>${index + 1}</td>
    <td><strong>${item.name}</strong></td>
    <td>${item.base}</td>
    <td><span class="type-tag ${typeTagClass(item.type)}">${item.typeName}</span></td>
    <td>${item.startDate}</td>
    <td>${item.endDate}</td>
    <td>${item.manager}</td>
    <td>${item.plannedQty ? `${item.plannedQty} / ${item.actualQty || 0} ${item.unit || ''}` : '—'}</td>
    <td>${getCompletionCell(item)}</td>
    <td>${getStatusTag(item.status)}</td>
    <td>${getActionButtons(item)}</td>
  </tr>`;
}

// 搜索功能
function handleSearch() {
  applyAutoDelay();
  var keyword = document.getElementById('searchInput').value.trim();
  var base = document.getElementById('baseSelect').value;
  var type = document.getElementById('typeSelect').value;
  var status = document.getElementById('statusSelect').value;

  var filteredData = mockData.filter(item => {
    if (keyword && !item.name.includes(keyword)) return false;
    if (base && !item.base.includes(base)) return false;
    if (type && item.type !== type) return false;
    if (status && item.status !== status) return false;
    return true;
  });

  Pagination.updateData(filteredData);
  Toast.info('找到 ' + filteredData.length + ' 条记录');
}

// 消费模型预填：来自 model_growth / model_phenology 等模型页的"采纳建议"跳转
function consumeModelPrefill() {
  try {
    var raw = localStorage.getItem('orchard_farming_prefill');
    if (!raw) return;
    var pre = JSON.parse(raw);
    if (!pre || pre.consumed) return;
    var defaults = {
      base: pre.base || '',
      type: pre.type || '',
      manager: pre.manager || '',
      desc: pre.desc || '',
      startDate: pre.startDate || new Date().toISOString().slice(0, 10),
      endDate: pre.endDate || new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10)
    };
    // 仅做表单预填提示用户，不自动提交
    showEdit(decodeURIComponent((pre.name || ('基于' + (pre.model || '模型') + '的建议'))).replace(/^"|"$/g, ''));
    selectOption(document.getElementById('edit-base'), defaults.base);
    selectOption(document.getElementById('edit-type'), defaults.type);
    selectOption(document.getElementById('edit-manager'), defaults.manager);
    document.getElementById('edit-start').value = defaults.startDate;
    document.getElementById('edit-end').value = defaults.endDate;
    document.getElementById('edit-desc').value = defaults.desc;
    Toast.info('已从 ' + (pre.model || '模型') + ' 预填建议，请确认后提交');
    pre.consumed = true;
    localStorage.setItem('orchard_farming_prefill', JSON.stringify(pre));
  } catch (e) { /* ignore parse error */ }
}

// 读取模型推荐 prefill（兼容数组/对象两种写入形式）
function readPrefill() {
  try {
    var raw = localStorage.getItem('orchard_farming_prefill');
    if (!raw) return null;
    var parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) return parsed.length ? parsed[parsed.length - 1] : null;
    return parsed;
  } catch (e) { return null; }
}

// 中文任务类型 → 计划类型编码
function mapTaskType(name) {
  if (!name) return 'other';
  if (/施肥|追肥|基肥|叶面肥/.test(name)) return 'fertilizer';
  if (/喷药|打药|病虫害|防治|杀菌|杀虫/.test(name)) return 'pesticide';
  if (/灌溉|浇水|补水/.test(name)) return 'irrigation';
  if (/修剪|剪枝/.test(name)) return 'pruning';
  if (/疏花|疏果/.test(name)) return 'thinning';
  if (/套袋/.test(name)) return 'bagging';
  if (/除草|清园/.test(name)) return 'weeding';
  if (/采收|采摘/.test(name)) return 'harvest';
  return 'other';
}

// 识别模型来源
function prefillSource(p) {
  var from = '';
  try { from = new URLSearchParams(location.search).get('from') || ''; } catch (e) { from = ''; }
  if (from.indexOf('phenology') !== -1) return '物候期模型';
  if (from.indexOf('growth') !== -1) return '生长模型';
  if (from.indexOf('pest') !== -1) return '病虫害模型';
  if (from.indexOf('weather') !== -1) return '气象模型';
  var title = String(p.title || '') + String(p.source || '');
  if (title.indexOf('物候') !== -1) return '物候期模型';
  if (title.indexOf('生长') !== -1) return '生长模型';
  return '生长模型/物候期模型';
}

// 预填新建计划弹窗
function applyPrefill(p) {
  var today = new Date().toISOString().slice(0, 10);
  var name = p.name || p.title || '模型推荐计划';
  document.getElementById('add-name').value = name;
  document.getElementById('add-base').value = p.base || '';
  var code = p.type && /^[a-z]+$/.test(p.type) ? p.type : mapTaskType(p.taskType || p.type || name);
  document.getElementById('add-type').value = code;
  document.getElementById('add-start').value = p.date || today;
  document.getElementById('add-end').value = '';
  var parts = [];
  if (p.content) parts.push(p.content);
  if (p.plot) parts.push('地块：' + p.plot);
  else if (p.plotRange) parts.push('地块范围：' + p.plotRange);
  document.getElementById('add-desc').value = parts.join('；');
  return name;
}

// 提交新建计划
function submitAddPlan() {
  var name = document.getElementById('add-name').value.trim();
  if (!name) { Toast.warning('请输入计划名称'); return; }
  var base = document.getElementById('add-base').value;
  var typeSel = document.getElementById('add-type');
  var type = typeSel.value || 'other';
  var typeName = typeSel.options[typeSel.selectedIndex] ? typeSel.options[typeSel.selectedIndex].text : '其他';
  var start = document.getElementById('add-start').value;
  var end = document.getElementById('add-end').value;
  var manager = document.getElementById('add-manager').value;
  var desc = document.getElementById('add-desc').value;

  var maxId = mockData.reduce(function (m, p) { return p.id > m ? p.id : m; }, 0);
  mockData.push({
    id: maxId + 1, name: name, base: base, type: type, typeName: typeName,
    startDate: start, endDate: end, manager: manager, status: 'pending', desc: desc
  });
  try { localStorage.removeItem('orchard_farming_prefill'); } catch (e) {}
  applyAutoDelay();
  Pagination.updateData(mockData);
  Toast.success('计划创建成功');
  Modal.hide('modal-add-plan');
}

// 生成 CSV 并下载
function downloadCSV(filename, rows) {
  var csv = rows.map(function (r) {
    return r.map(function (c) {
      return '"' + String(c === null || c === undefined ? '' : c).replace(/"/g, '""') + '"';
    }).join(',');
  }).join('\r\n');
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

// 导出计划（真实 CSV 下载）
function exportPlan(format) {
  var list = (Pagination.filteredData && Pagination.filteredData.length) ? Pagination.filteredData : mockData;
  var rows = [['序号', '计划名称', '所属基地', '计划类型', '开始时间', '结束时间', '负责人', '状态']];
  list.forEach(function (item, i) {
    rows.push([i + 1, item.name, item.base, item.typeName, item.startDate, item.endDate, item.manager, (getStatusTag(item.status).replace(/<[^>]+>/g, ''))]);
  });
  downloadCSV('农事计划_' + new Date().toISOString().slice(0, 10) + '.csv', rows);
  Toast.success('计划已导出为 CSV 文件');
  Modal.hide('modal-export');
}

    renderRow: renderRow
  });

  // AI 模型 → 农事计划 闭环：读取 localStorage 推荐并预填新建弹窗
  var prefill = readPrefill();
  if (prefill) {
    var planName = applyPrefill(prefill);
    var src = prefillSource(prefill);
    var textEl = document.getElementById('prefillText');
    if (textEl) textEl.textContent = '来自模型推荐（' + src + '）：' + planName;
    var banner = document.getElementById('prefillBanner');
    if (banner) banner.style.display = 'flex';
    Modal.show('modal-add-plan');
  }
});
</script>
