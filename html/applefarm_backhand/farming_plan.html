<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 农事计划</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
  <link rel="stylesheet" href="css/page-content.css">
<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition:all 0.2s ease;
  }
  .module-card:hover {
    background:var(--bg-hover);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="farming" data-active-submenu="farming-plan">

<!-- ===== 整体布局容器 ===== -->
<div class="app-layout">

  <!-- ===== 侧边栏 ===== -->
  <!-- 移动端遮罩层 -->
  <!-- ===== 主内容区 ===== -->
  <div class="main-wrapper">

    <!-- 顶栏 -->
    <!-- Tab 标签栏 -->
    <div class="tab-bar">
      <!-- Tab 标签由 JS 动态渲染 -->
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
      <div class="content-wrapper">
        
        <!-- 统计卡片区 -->
        <!-- 统计卡条已按统一规范移除 (原class=patrol-stats) -->

        <!-- ===== 搜索栏区 ===== -->
        <div class="page-section search-section">
          <div class="search-bar">
            <select class="search-select" id="baseSelect">
              <option value="">选择基地</option>
              <option value="ytqx">烟台栖霞基地</option>
              <option value="whrc">威海荣成基地</option>
              <option value="qdlx">青岛莱西基地</option>
              <option value="zy">招远基地</option>
              <option value="pl">蓬莱阁基地</option>
            </select>
            <select class="search-select" id="statusSelect">
              <option value="">全部状态</option>
              <option value="pending">待执行</option>
              <option value="ongoing">执行中</option>
              <option value="completed">已完成</option>
              <option value="delayed">已延期</option>
            </select>
            <select class="search-select" id="typeSelect">
              <option value="">全部类型</option>
              <option value="fertilizer">施肥</option>
              <option value="pesticide">喷药</option>
              <option value="tool">修剪</option>
              <option value="irrigation">灌溉</option>
              <option value="other">其他</option>
            </select>
            <input type="date" class="search-input" id="startDate" placeholder="开始日期">
            <span class="date-separator">至</span>
            <input type="date" class="search-input" id="endDate" placeholder="结束日期">
            <input type="text" class="search-input" placeholder="搜索计划名称..." id="searchInput">

          <div class="search-actions"><button class="jg-btn jg-btn-primary" onclick="handleSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button><button class="jg-btn" onclick="handleReset()">重置</button></div>
          </div>
        </div>

        <!-- ===== 操作按钮区（搜索栏下、数据列表上）===== -->
        <div class="page-section action-bar">
          <button class="jg-btn jg-btn-primary" onclick="Modal.show('modal-add-plan')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M12 5v14"/>
              <path d="M5 12h14"/>
            </svg>
            新建计划
          </button>
          <button class="jg-btn" onclick="Modal.show('modal-export')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" x2="12" y1="15" y2="3"/>
            </svg>
            导出计划
          </button>
        </div>

        <!-- ===== 数据列表区 ===== -->
        <div class="page-section data-section">
          <div class="data-table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width:60px;">序号</th>
                  <th>计划名称</th>
                  <th style="width:140px;">所属基地</th>
                  <th style="width:100px;">计划类型</th>
                  <th style="width:110px;">开始时间</th>
                  <th style="width:110px;">结束时间</th>
                  <th style="width:90px;">负责人</th>
                  <th style="width:80px;">状态</th>
                  <th style="width:140px;">操作</th>
                </tr>
              </thead>
              <tbody id="dataTableBody">
              </tbody>
            </table>
          </div>
          <div id="pagination-container">
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- 新建计划模态框 -->
  <div id="modal-add-plan" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">新建农事计划</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="form-add-plan" class="modal-form">
          <div class="form-group">
            <label>计划名称</label>
            <input type="text" class="form-control" placeholder="请输入计划名称">
          </div>
          <div class="form-group">
            <label>所属基地</label>
            <select class="form-control">
              <option value="">请选择基地</option>
              <option value="ytqx">烟台栖霞基地</option>
              <option value="whrc">威海荣成基地</option>
              <option value="qdlx">青岛莱西基地</option>
              <option value="zy">招远基地</option>
              <option value="pl">蓬莱阁基地</option>
            </select>
          </div>
          <div class="form-group">
            <label>计划类型</label>
            <select class="form-control">
              <option value="">请选择类型</option>
              <option value="fertilizer">施肥</option>
              <option value="pesticide">喷药</option>
              <option value="tool">修剪</option>
              <option value="irrigation">灌溉</option>
              <option value="other">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label>负责人</label>
            <input type="text" class="form-control" placeholder="请输入负责人">
          </div>
          <div class="form-group">
            <label>开始时间</label>
            <input type="date" class="form-control">
          </div>
          <div class="form-group">
            <label>结束时间</label>
            <input type="date" class="form-control">
          </div>
          <div class="form-group">
            <label>计划描述</label>
            <textarea class="form-control" rows="3" placeholder="请输入计划描述"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-add-plan')">取消</button>
        <button class="jg-btn jg-btn-primary" onclick="submitAddPlan()">确定</button>
      </div>
    </div>
  </div>

  <!-- 导出计划模态框 -->
  <div id="modal-export" class="modal-overlay">
    <div class="modal-box" style="max-width:420px;">
      <div class="modal-header">
        <h3 class="modal-title">导出计划</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p style="color:var(--text-secondary); margin-bottom:16px;">请选择导出格式：</p>
        <div style="display:flex; gap:12px;">
          <button class="jg-btn jg-btn-primary" onclick="exportPlan('excel')">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;margin-right:6px;">
              <path d="M10 2H2v16h16V8l-6-6z"/>
              <path d="M14 2v6h6M13 9H7M13 13H7M13 17H7"/>
            </svg>
            Excel格式
          </button>
          <button class="jg-btn" onclick="exportPlan('pdf')">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;margin-right:6px;">
              <path d="M10 2H2v16h16V8l-6-6z"/>
              <path d="M14 2v6h6M13 9H7M13 13H7M13 17H7"/>
            </svg>
            PDF格式
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-export')">关闭</button>
      </div>
    </div>
  </div>

  <!-- 详情模态框 -->
  <div id="modal-detail" class="modal-overlay">
    <div class="modal-box" style="max-width:600px;">
      <div class="modal-header">
        <h3 class="modal-title">计划详情</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="detail-content">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
            <div style="padding:12px; background:var(--gray-50); border-radius:8px;">
              <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">计划名称</div>
              <div id="detail-name" style="font-weight:600;">春季施肥计划</div>
            </div>
            <div style="padding:12px; background:var(--gray-50); border-radius:8px;">
              <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">所属基地</div>
              <div id="detail-base" style="font-weight:600;">烟台栖霞基地</div>
            </div>
            <div style="padding:12px; background:var(--gray-50); border-radius:8px;">
              <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">计划类型</div>
              <div id="detail-type" style="font-weight:600;">施肥</div>
            </div>
            <div style="padding:12px; background:var(--gray-50); border-radius:8px;">
              <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">负责人</div>
              <div id="detail-manager" style="font-weight:600;">李技术员</div>
            </div>
            <div style="padding:12px; background:var(--gray-50); border-radius:8px;">
              <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">开始时间</div>
              <div id="detail-start" style="font-weight:600;">2024-03-01</div>
            </div>
            <div style="padding:12px; background:var(--gray-50); border-radius:8px;">
              <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">结束时间</div>
              <div id="detail-end" style="font-weight:600;">2024-03-15</div>
            </div>
          </div>
          <div style="margin-top:16px; padding:12px; background:var(--gray-50); border-radius:8px;">
            <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">计划描述</div>
            <div id="detail-desc" style="font-weight:500;">根据果园实际情况，进行春季施肥作业，促进果树生长发育。</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-detail')">关闭</button>
      </div>
    </div>
  </div>

  <!-- 编辑模态框 -->
  <div id="modal-edit" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">编辑农事计划</h3>

          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="form-edit-plan" class="modal-form">
          <div class="form-group">
            <label>计划名称</label>
            <input type="text" class="form-control" id="edit-name" value="春季施肥计划">
          </div>
          <div class="form-group">
            <label>所属基地</label>
            <select class="form-control" id="edit-base">
              <option value="ytqx" selected>烟台栖霞基地</option>
              <option value="whrc">威海荣成基地</option>
              <option value="qdlx">青岛莱西基地</option>
              <option value="zy">招远基地</option>
              <option value="pl">蓬莱阁基地</option>
            </select>
          </div>
          <div class="form-group">
            <label>计划类型</label>
            <select class="form-control" id="edit-type">
              <option value="fertilizer" selected>施肥</option>
              <option value="pesticide">喷药</option>
              <option value="tool">修剪</option>
              <option value="irrigation">灌溉</option>
              <option value="other">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label>负责人</label>
            <input type="text" class="form-control" id="edit-manager" value="李技术员">
          </div>
          <div class="form-group">
            <label>开始时间</label>
            <input type="date" class="form-control" id="edit-start" value="2024-03-01">
          </div>
          <div class="form-group">
            <label>结束时间</label>
            <input type="date" class="form-control" id="edit-end" value="2024-03-15">
          </div>
          <div class="form-group">
            <label>计划描述</label>
            <textarea class="form-control" rows="3" id="edit-desc">根据果园实际情况，进行春季施肥作业，促进果树生长发育。</textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-edit')">取消</button>
        <button class="jg-btn jg-btn-primary" onclick="submitEditPlan()">确定</button>
      </div>
    </div>
  </div>

  <!-- 执行计划模态框 -->
  <div id="modal-execute" class="modal-overlay">
    <div class="modal-box" style="max-width:420px;">
      <div class="modal-header">
        <h3 class="modal-title">执行计划</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div style="text-align:center; padding:16px 0;">
          <div style="font-size:48px; margin-bottom:12px;">▶</div>
          <p style="color:var(--text-secondary);">确定要开始执行计划 "<span id="execute-name" style="font-weight:600; color:var(--primary-500);">春季施肥计划</span>" 吗？</p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-execute')">取消</button>
        <button class="jg-btn jg-btn-primary" onclick="executePlan()">确定执行</button>
      </div>
    </div>
  </div>

</div>

  { id: 22, name: '夏季施肥计划', base: '招远基地', type: 'fertilizer', typeName: '施肥', startDate: '2024-07-10', endDate: '2024-07-15', manager: '尤技术员', status: 'pending' },
  { id: 23, name: '秋季灌溉计划', base: '青岛莱西基地', type: 'irrigation', typeName: '灌溉', startDate: '2024-10-15', endDate: '2024-10-20', manager: '许技术员', status: 'pending' }
];

// 当前页面数据
var currentPlanName = '';

// 获取状态标签
function getStatusTag(status) {
  const statusMap = {
    'completed': '<span class="status-tag normal">已完成</span>',
    'executing': '<span class="status-tag done">执行中</span>',
    'pending': '<span class="status-tag warning">待执行</span>'
  };
  return statusMap[status] || statusMap['pending'];
}

// 获取操作按钮
function getActionButtons(item) {
  if (item.status === 'completed') {
    return `<div class="action-btns">
      <button class="action-btn detail" onclick="showDetail('${item.name}')">详情</button>
      <button class="action-btn edit" onclick="showEdit('${item.name}')">编辑</button>
      <button class="action-btn delete" onclick="showDeleteConfirm('${item.name}')">删除</button>
    </div>`;
  } else if (item.status === 'executing') {
    return `<div class="action-btns">
      <button class="action-btn detail" onclick="showDetail('${item.name}')">详情</button>
      <button class="action-btn edit" onclick="showEdit('${item.name}')">编辑</button>
      <button class="action-btn approve" onclick="showExecute('${item.name}')">执行任务</button>
    </div>`;
  } else {
    return `<div class="action-btns">
      <button class="action-btn detail" onclick="showDetail('${item.name}')">详情</button>
      <button class="action-btn edit" onclick="showEdit('${item.name}')">编辑</button>
      <button class="action-btn approve" onclick="showExecute('${item.name}')">开始执行</button>
    </div>`;
  }
}

// 渲染表格行
function renderRow(item, index) {
  return `<tr>
    <td>${index + 1}</td>
    <td><strong>${item.name}</strong></td>
    <td>${item.base}</td>
    <td><span class="type-tag ${item.type}">${item.typeName}</span></td>
    <td>${item.startDate}</td>
    <td>${item.endDate}</td>
    <td>${item.manager}</td>
    <td>${getStatusTag(item.status)}</td>
    <td>${getActionButtons(item)}</td>
  </tr>`;
}

// 搜索功能
function handleSearch() {
  var keyword = document.getElementById('searchInput').value.trim();
  var base = document.getElementById('baseSelect').value;
  var type = document.getElementById('typeSelect').value;
  var status = document.getElementById('statusSelect').value;

  var filteredData = mockData.filter(item => {
    if (keyword && !item.name.includes(keyword)) return false;
    if (base && !item.base.includes(base)) return false;
    if (type && item.type !== type) return false;
    if (status && item.status !== status) return false;
    return true;
  });

  Pagination.updateData(filteredData);
  Toast.info('找到 ' + filteredData.length + ' 条记录');
}

// 重置搜索条件
function handleReset() {
  document.getElementById('searchInput').value = '';
  document.getElementById('baseSelect').value = '';
  document.getElementById('typeSelect').value = '';
  document.getElementById('statusSelect').value = '';
  document.getElementById('startDate').value = '';
  document.getElementById('endDate').value = '';
  Pagination.updateData(mockData);
  Toast.info('搜索条件已重置');
}

// 显示详情
function showDetail(name) {
  currentPlanName = name;
  document.getElementById('detail-name').textContent = name;
  Modal.show('modal-detail');
}

// 显示编辑
function showEdit(name) {
  currentPlanName = name;
  document.getElementById('edit-name').value = name;
  Modal.show('modal-edit');
}

// 显示删除确认
function showDeleteConfirm(name) {
  currentPlanName = name;
  ConfirmDialog.show({
    title: '删除计划',
    message: '确定要删除计划 "' + name + '" 吗？此操作不可撤销。',
    onConfirm: function() {
      Toast.success('计划 "' + currentPlanName + '" 已删除');
    }
  });
}

// 显示执行
function showExecute(name) {
  currentPlanName = name;
  document.getElementById('execute-name').textContent = name;
  Modal.show('modal-execute');
}

// 提交新建计划
function submitAddPlan() {
  Toast.success('计划创建成功');
  Modal.hide('modal-add-plan');
}

// 提交编辑计划
function submitEditPlan() {
  Toast.success('计划 "' + currentPlanName + '" 已更新');
  Modal.hide('modal-edit');
}

// 执行计划
function executePlan() {
  Toast.success('计划 "' + currentPlanName + '" 已开始执行');
  Modal.hide('modal-execute');
}

// 导出计划
function exportPlan(format) {
  Toast.success('计划已导出为' + (format === 'excel' ? 'Excel' : 'PDF') + '格式');
  Modal.hide('modal-export');
}

// 初始化分页
document.addEventListener('DOMContentLoaded', function() {
  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: mockData,
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderRow
  });
});
</script>
