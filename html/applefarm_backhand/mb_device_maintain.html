<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/page-content.css">

<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<style>
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
  }
  .stat-label {
    font-size: var(--font-size-sm);
    color: var(--text-tertiary);
    margin-bottom: var(--space-xs);
  }
  .stat-value {
    font-size: 26px;
    font-weight: var(--font-weight-bold);
    color: var(--text-primary);
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .stat-card.is-pending .stat-value { color: var(--warning); }
  .stat-card.is-accepted .stat-value { color: var(--info); }
  .stat-card.is-done .stat-value { color: var(--success); }
  .status-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    font-size: var(--font-size-xs);
    font-weight: 500;
    white-space: nowrap;
  }
  .status-tag.pending { background: var(--warning-bg); color: var(--warning); }
  .status-tag.accepted { background: var(--info-bg); color: var(--info); }
  .status-tag.done { background: var(--success-bg); color: var(--success); }
  .status-tag.rejected { background: var(--error-bg); color: var(--error); }
  /* 紧急程度标签 */
  .urgency-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: var(--radius-sm);
    font-size: var(--font-size-xs);
    white-space: nowrap;
  }
  .urgency-tag.low { background: var(--gray-100); color: var(--text-secondary); }
  .urgency-tag.normal { background: var(--warning-bg); color: var(--warning); }
  .urgency-tag.high { background: var(--error-bg); color: var(--error); }
  .cell-sub {
    font-size: var(--font-size-xs);
    color: var(--text-tertiary);
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .handle-box {
    margin-top: var(--space-sm);
    padding: 8px 10px;
    background: var(--gray-50);
    border-left: 3px solid var(--primary-300);
    border-radius: var(--radius-sm);
    font-size: var(--font-size-xs);
    color: var(--text-secondary);
  }
  .modal-field { margin-bottom: var(--space-lg); }
  .modal-field label {
    display: block;
    font-size: var(--font-size-sm);
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: var(--space-sm);
  }
  .modal-field textarea, .modal-field input, .modal-field select {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border-default);
    border-radius: var(--radius-lg);
    font-size: var(--font-size-base);
    font-family: inherit;
    background: var(--bg-card);
  }
  .modal-field textarea { min-height: 100px; resize: vertical; line-height: 1.6; }
  .modal-field textarea:focus, .modal-field input:focus, .modal-field select:focus {
    border-color: var(--primary-500);
    box-shadow: 0 0 0 4px rgba(24, 144, 255, 0.12);
    outline: none;
  }
  .detail-row {
    display: flex;
    gap: var(--space-md);
    padding: 10px 0;
    border-bottom: 1px solid var(--border-light);
    font-size: var(--font-size-sm);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: var(--text-tertiary); min-width: 84px; flex-shrink: 0; }
  .detail-value { color: var(--text-primary); flex: 1; word-break: break-all; }
  .empty-state {
    padding: var(--space-2xl) 0;
    text-align: center;
    color: var(--text-tertiary);
    font-size: var(--font-size-sm);
  }
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--bg-card);
    border-radius: 12px;
    width: 92%;
    max-width: 620px;
    max-height: 85vh;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    animation: modalFadeIn 0.2s ease-out;
  }
  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.95) translateY(-20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-default);
  }
  .modal-title { font-size: 16px; font-weight: 600; color: #1f1f1f; }
  .modal-close {
    background: none; border: none; cursor: pointer;
    padding: 4px; font-size: 20px; line-height: 1;
    color: var(--text-tertiary); transition: color 0.2s;
  }
  .modal-close:hover { color: var(--text-secondary); }
  .modal-body {
    padding: 20px;
    overflow-y: auto;
    max-height: calc(85vh - 132px);
  }
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    padding: 16px 20px;
    border-top: 1px solid var(--border-default);
  }
</style>
</head>

<!-- 严格空库模式：演示数据播种已停用，数据一律来自后端 API -->
<script>
/* ============================================================
 * 设备报修受理
 * 数据源：MobileBridge.maintenanceLogs()
 *   写入方 = 移动端设备页维护申请
 *   字段：{ device, urgency, urgencyText, reason,
 *          status:'pending', statusText:'待受理', id, createTime }
 *   urgency：low 一般 / normal 较急 / high 紧急
 * 状态流转：pending 待受理 → accepted 已受理 → done 已完成
 *          另支持 rejected 已驳回
 * 每次操作均回写 MobileBridge.KEYS.maintenance，移动端状态同步更新
 * ============================================================ */

/* 状态枚举：值 → 展示文案 / 标签样式类 */
var STATUS_MAP = {
  pending: { text: '待受理', cls: 'pending' },
  accepted: { text: '已受理', cls: 'accepted' },
  done: { text: '已完成', cls: 'done' },
  rejected: { text: '已驳回', cls: 'rejected' }
};

/* 紧急程度枚举 */
var URGENCY_TEXT = { low: '一般', normal: '较急', high: '紧急' };

var currentId = null;
var page = null;

/* ============================================================
 * 分页组件（与设备管理其他页一致：‹ 1 2 3 › 第 X 页/共 Y 页，共 Z 条记录）
 * 内联实现，不声明全局 Pagination，避免与 common-functions.js 冲突
 * ============================================================ */
var Pagination = {
  currentPage: 1,
  pageSize: 10,
  filteredData: [],
  containerId: 'pagination-container',
  tbodyId: 'maintainBody',
  renderRow: null,
  emptyCols: 9,

  init: function (options) {
    this.currentPage = options.currentPage || 1;
    this.pageSize = options.pageSize || 10;
    this.filteredData = options.data || [];
    this.containerId = options.containerId || this.containerId;
    this.tbodyId = options.tbodyId || this.tbodyId;
    this.renderRow = options.renderRow || null;
    this.render();
  },

  renderTable: function () {
    var tbody = document.getElementById(this.tbodyId);
    if (!tbody || !this.renderRow) return;
    if (!this.filteredData.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="' + this.emptyCols + '" style="text-align:center;color:var(--text-tertiary);padding:40px 0;">暂无符合条件的数据</td></tr>';
      return;
    }
    var start = (this.currentPage - 1) * this.pageSize;
    var pageData = this.filteredData.slice(start, start + this.pageSize);
    tbody.innerHTML = pageData.map(function (item, i) {
      return this.renderRow(item, start + i + 1);
    }, this).join('');
  },

  render: function () {
    var container = document.getElementById(this.containerId);
    if (!container) return;
    var totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    if (totalPages === 0) totalPages = 1;
    var html = '<div class="pagination">';
    html += '<button class="page-btn ' + (this.currentPage <= 1 ? 'disabled' : '') + '" onclick="Pagination.goToPage(' + (this.currentPage - 1) + ')">‹</button>';
    for (var i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= this.currentPage - 1 && i <= this.currentPage + 1)) {
        html += '<button class="page-btn ' + (i === this.currentPage ? 'active' : '') + '" onclick="Pagination.goToPage(' + i + ')">' + i + '</button>';
      } else if (i === this.currentPage - 2 || i === this.currentPage + 2) {
        html += '<span class="page-ellipsis" style="padding:0 8px;color:#6b7b6b;">...</span>';
      }
    }
    html += '<button class="page-btn ' + (this.currentPage >= totalPages ? 'disabled' : '') + '" onclick="Pagination.goToPage(' + (this.currentPage + 1) + ')">›</button>';
    html += '<span style="margin-left:16px;font-size:13px;color:#6b7b6b;">第 ' + this.currentPage + ' 页/共 ' + totalPages + ' 页，共 ' + this.filteredData.length + ' 条记录</span>';
    html += '</div>';
    container.innerHTML = html;
    this.renderTable();
  },

  goToPage: function (page) {
    var totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    if (totalPages === 0) totalPages = 1;
    if (page < 1 || page > totalPages) return;
    this.currentPage = page;
    this.render();
  },

  updateData: function (data) {
    this.filteredData = data || [];
    this.currentPage = 1;
    this.render();
  }
};

/* HTML 转义，所有用户数据渲染前必须走这里 */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* 读取移动端报修申请，读取失败回退空数组 */
function readList() {
  try {
    if (typeof MobileBridge === 'undefined') return [];
    var list = MobileBridge.maintenanceLogs();
    return Array.isArray(list) ? list : [];
  } catch (e) {
    return [];
  }
}

/* 取台账设备（用于回填设备类型；台账不可用时降级为仅显示名称） */
function deviceOf(item) {
  try {
    if (typeof DeviceStore === 'undefined') return null;
    var id = item.deviceId || '';
    if (!id) return null;
    return DeviceStore.deviceOf(id);
  } catch (e) {
    return null;
  }
}

function statusInfo(item) {
  return STATUS_MAP[item.status] || STATUS_MAP.pending;
}

function renderStats(list) {
  var pending = 0, accepted = 0, done = 0, rejected = 0;
  list.forEach(function (i) {
    if (i.status === 'accepted') accepted++;
    else if (i.status === 'done') done++;
    else if (i.status === 'rejected') rejected++;
    else pending++;
  });
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statAccepted').textContent = accepted;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statRejected').textContent = rejected;
  document.getElementById('statTotal').textContent = list.length;
}

function filteredList() {
  var status = document.getElementById('statusSelect').value;
  var urgency = document.getElementById('urgencySelect').value;
  var kw = document.getElementById('searchInput').value.trim().toLowerCase();

  return readList().filter(function (item) {
    if (status && item.status !== status) return false;
    if (urgency && item.urgency !== urgency) return false;
    if (kw) {
      var hay = ((item.device || '') + ' ' + (item.reason || '') + ' ' + (item.urgencyText || '')).toLowerCase();
      if (hay.indexOf(kw) === -1) return false;
    }
    return true;
  });
}

function renderTable() {
  var all = readList();
  renderStats(all);
  var list = filteredList();

  var emptyHint = document.getElementById('emptyHint');
  if (!list.length) {
    emptyHint.style.display = 'block';
  } else {
    emptyHint.style.display = 'none';
  }
  page.updateData(list);
}

function renderRow(item, index) {
  var st = statusInfo(item);
  var urgency = item.urgency || 'low';
  var dev = deviceOf(item);
  /* 处理说明回显 */
  var extra = '';
  if (item.handleRemark || item.handleTime) {
    extra = '<div class="handle-box">' +
      (item.handleRemark ? esc(item.handleRemark) : '') +
      (item.handleTime ? '<br>处理时间：' + esc(item.handleTime) : '') + '</div>';
  }
  /* 操作按钮按状态给出：pending→受理，accepted→完成维修/驳回，done/rejected→查看 */
  var btns = '<div class="action-btns">' +
    '<button class="action-btn detail" onclick="openHandleModal(\'' + esc(item.id) + '\')">' +
    (item.status === 'done' || item.status === 'rejected' ? '查看' : '处理') + '</button>' +
    '</div>';

  return '<tr>' +
    '<td class="checkbox-col">' + index + '</td>' +
    '<td class="text-mono">' + esc(item.id || '-') + '</td>' +
    '<td class="text-mono">' + esc(item.createTime || '-') + '</td>' +
    '<td><strong>' + esc(item.deviceId || (dev ? dev.id : '-')) + '</strong></td>' +
    '<td>' + esc(dev ? dev.name : (item.device || '-')) + '</td>' +
    '<td><span class="urgency-tag ' + esc(urgency) + '">' + esc(item.urgencyText || URGENCY_TEXT[urgency] || '-') + '</span></td>' +
    '<td><div class="cell-sub">' + esc(item.reason || '-') + '</div>' + extra + '</td>' +
    '<td><span class="status-tag ' + st.cls + '">' + esc(item.statusText || st.text) + '</span></td>' +
    '<td>' + btns + '</td>' +
  '</tr>';
}

function resetFilter() {
  document.getElementById('statusSelect').value = '';
  document.getElementById('urgencySelect').value = '';
  document.getElementById('searchInput').value = '';
  renderTable();
}

function refreshList() {
  renderTable();
  Toast.success('报修数据已刷新');
}

/* ---------- 处理弹窗 ---------- */
function openHandleModal(id) {
  var list = readList();
  var target = null;
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].id) === String(id)) { target = list[i]; break; }
  }
  if (!target) { Toast.error('未找到该报修申请'); return; }

  currentId = target.id;
  var st = statusInfo(target);
  var dev = deviceOf(target);
  document.getElementById('handleTitle').textContent = '报修处理';
  document.getElementById('hmTime').textContent = target.createTime || '-';
  document.getElementById('hmId').textContent = target.id || '-';
  document.getElementById('hmDeviceId').textContent = target.deviceId || (dev ? dev.id : '-');
  document.getElementById('hmDevice').textContent = dev ? dev.name : (target.device || '-');
  document.getElementById('hmDeviceType').textContent = (dev && typeof DeviceStore !== 'undefined')
    ? DeviceStore.typeName(dev.type) : '-';
  document.getElementById('hmUrgency').innerHTML =
    '<span class="urgency-tag ' + esc(target.urgency || 'low') + '">'
    + esc(target.urgencyText || URGENCY_TEXT[target.urgency] || '-') + '</span>';
  document.getElementById('hmReason').textContent = target.reason || '-';
  document.getElementById('hmStatus').innerHTML =
    '<span class="status-tag ' + st.cls + '">' + esc(target.statusText || st.text) + '</span>';
  document.getElementById('hmRemark').value = target.handleRemark || '';
  document.getElementById('hmAssignee').value = target.assignee || '';
  document.getElementById('hmResult').value = target.handleResult || '';

  /* 已完成/已驳回的记录只读展示；驳回与完成均按状态收敛按钮 */
  var isClosed = target.status === 'done' || target.status === 'rejected';
  var footerBtns = document.querySelectorAll('#handleModal .modal-footer button');
  footerBtns.forEach(function (b) {
    var act = b.getAttribute('onclick') || '';
    if (isClosed) {
      b.style.display = 'none';
    } else if (act.indexOf("'done'") > -1 && target.status !== 'accepted') {
      /* 未受理的申请不能直接标记完成 */
      b.style.display = 'none';
    } else if (act.indexOf("'rejected'") > -1 && target.status === 'done') {
      b.style.display = 'none';
    } else {
      b.style.display = '';
    }
  });
  /* 终态时输入框只读 */
  ['hmRemark', 'hmAssignee', 'hmResult'].forEach(function (id) {
    document.getElementById(id).readOnly = isClosed;
  });

  document.getElementById('handleModal').classList.add('show');
}

function closeHandleModal() {
  document.getElementById('handleModal').classList.remove('show');
  currentId = null;
}

/* 提交状态流转：accepted 受理 / done 完成维修 / rejected 驳回；均回写移动端记录 */
function submitHandle(next) {
  if (typeof MobileBridge === 'undefined') {
    Toast.error('数据桥接未加载，无法保存处理结果');
    return;
  }
  var remark = document.getElementById('hmRemark').value.trim();
  var assignee = document.getElementById('hmAssignee').value.trim();
  var result = document.getElementById('hmResult').value.trim();

  /* 完成维修必须有处理结果 */
  if (next === 'done' && !result) {
    Toast.error('完成维修必须填写处理结果');
    return;
  }

  /* 驳回与完成为终态操作，需二次确认 */
  if (next === 'rejected' || next === 'done') {
    ConfirmDialog.show({
      title: next === 'rejected' ? '驳回报修申请' : '确认完成维修',
      message: next === 'rejected'
        ? '确定要驳回该报修申请吗？驳回后移动端将标记为「已驳回」。'
        : '确定该设备已维修完成吗？完成后移动端将标记为「已完成」。',
      onConfirm: function () { doHandle(next, remark, assignee, result); }
    });
    return;
  }
  doHandle(next, remark, assignee, result);
}

function doHandle(next, remark, assignee, result) {
  var ok = MobileBridge.updateRecord(MobileBridge.KEYS.maintenance, currentId, {
    status: next,
    statusText: STATUS_MAP[next].text,
    handleRemark: remark,
    assignee: assignee,
    handleResult: result,
    handleTime: MobileBridge.stampNow()
  });
  if (!ok) { Toast.error('处理结果保存失败，请刷新后重试'); return; }

  /* 受理 / 完成后同步生成设备维护工单，实现「报修 → 维保」闭环 */
  if (next === 'accepted' || next === 'done') {
    syncMaintainOrder(next, remark, assignee, result);
  }

  closeHandleModal();
  renderTable();
  Toast.success('已标记为「' + STATUS_MAP[next].text + '」，移动端可查看');
}

/**
 * 报修单同步生成设备维护工单
 * 已受理 → 生成「故障维修」工单（待处理）
 * 已完成 → 回写该工单为已完成并补齐闭环字段
 */
function syncMaintainOrder(next, remark, assignee, result) {
  try {
    if (typeof DeviceStore === 'undefined') return;
    var list = readList();
    var target = null;
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].id) === String(currentId)) { target = list[i]; break; }
    }
    if (!target || !target.deviceId) return;

    var deviceId = target.deviceId;
    var exists = DeviceStore.maintains().filter(function (m) {
      return m.deviceId === deviceId && m.sourceId === target.id;
    })[0];

    var base = {
      deviceId: deviceId,
      type: '故障维修',
      faultType: '硬件故障',
      priority: target.urgency === 'high' ? 'urgent' : (target.urgency === 'normal' ? 'high' : 'normal'),
      faultDesc: target.reason || '',
      content: '移动端报修：' + (target.reason || '设备异常'),
      planDate: (target.createTime || '').slice(0, 10) || DeviceStore.todayStr(),
      manager: assignee || '',
      outsourced: '',
      remark: '来源：移动端报修 ' + (target.id || ''),
      sourceId: target.id
    };

    if (next === 'accepted') {
      if (exists) return;
      var item = Object.assign({}, base, {
        id: DeviceStore.nextId('maintain'),
        status: 'pending',
        startTime: DeviceStore.stampNow(),
        endTime: '', downtime: 0, workHours: 0, cost: 0,
        acceptor: '', parts: '', result: '', createdAt: DeviceStore.stampNow()
      });
      var chk = DeviceStore.validate('maintain', item, null);
      if (!chk.ok) return;
      DeviceStore.upsertMaintain(item);
    } else if (next === 'done') {
      if (!exists) return;
      DeviceStore.upsertMaintain(Object.assign({}, exists, {
        status: 'completed',
        endTime: DeviceStore.stampNow(),
        result: result || remark || '已完成维修',
        acceptor: assignee || exists.manager,
        workHours: exists.workHours || 1
      }));
    }
  } catch (e) {
    console.warn('[mb_device_maintain] 同步维保工单失败', e);
  }
}

document.addEventListener('DOMContentLoaded', function () {
  // 严格空库模式：演示数据播种已停用，数据一律来自后端 API
  page = Pagination;
  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: readList(),
    containerId: 'pagination-container',
    tbodyId: 'maintainBody',
    renderRow: renderRow
  });
  renderStats(readList());
  document.getElementById('searchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') renderTable();
  });
});

/* ============================================================
 * 后端数据到达后自动重绘
 * ------------------------------------------------------------
 * 数据层在「后端预加载完成」与「本地写入」两条路径上都会派发
 * <store>StoreChange 窗口事件；页面若不监听，首次渲染发生在数据
 * 到达之前，界面会一直停在空列表。此处统一订阅后自动重绘。
 * ============================================================ */
(function () {
  // StoreLive 由 common/js/api.js 提供；部分页面未静态引入该文件，
  // 此时回退到原生窗口事件订阅，避免订阅被静默跳过导致页面不重绘。
  function bind(events, handler) {
    if (typeof StoreLive !== 'undefined') return StoreLive.on(events, handler);
    (Array.isArray(events) ? events : [events]).forEach(function (ev) {
      if (ev) window.addEventListener(ev, function () { try { handler(); } catch (e) { console.warn('[store-live]', e); } });
    });
  }
  bind(["deviceStoreChange"], function () {
      refreshList();
  });
})();
</script>
