<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 采收计划</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
  <link rel="stylesheet" href="css/page-content.css">
<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition:all 0.2s ease;
  }
  .module-card:hover {
    background:var(--bg-hover);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="harvest" data-active-submenu="harvest-plan">

<!-- ===== 整体布局容器 ===== -->
<div class="app-layout">

  <!-- ===== 侧边栏 ===== -->
  <!-- 移动端遮罩层 -->
  <!-- ===== 主内容区 ===== -->
  <div class="main-wrapper">

    <!-- 顶栏 -->
    <!-- Tab 标签栏 -->
    <div class="tab-bar">
      <!-- Tab 标签由 JS 动态渲染 -->
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
      <div class="content-wrapper">
        <!-- 统计卡片区 -->
        <!-- 统计卡条已按统一规范移除 (原class=patrol-stats) -->

        <!-- 搜索栏区 -->
        <div class="page-section search-section">
          <div class="search-bar">
            <select class="search-select" id="baseSelect">
              <option value="">全部基地</option>
              <option value="天水麦积区基地">天水麦积区基地</option>
              <option value="招远基地">招远基地</option>
              <option value="天水荣成基地">天水荣成基地</option>
              <option value="麦积区阁基地">麦积区阁基地</option>
              <option value="龙口南山基地">龙口南山基地</option>
            </select>
            <select class="search-select" id="statusSelect">
              <option value="">全部状态</option>
              <option value="pending">待执行</option>
              <option value="executing">执行中</option>
              <option value="completed">已完成</option>
            </select>
            <input type="date" class="search-input date-input" id="startDate" placeholder="开始日期">
            <span class="date-separator">至</span>
            <input type="date" class="search-input date-input" id="endDate" placeholder="结束日期">
            <input type="text" class="search-input" placeholder="搜索计划名称..." id="searchInput">
            
          <div class="search-actions"><button class="jg-btn jg-btn-primary" onclick="handleSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button><button class="jg-btn" onclick="smartReset()">重置</button></div>
          </div>
        </div>

        <!-- 操作按钮区 -->
        <div class="page-section action-bar">
          <button class="jg-btn jg-btn-primary" onclick="Modal.show('modal-add-plan')">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
              <path d="M8 3V13M3 8H13"/>
            </svg>
            新建计划
          </button>
          <button class="jg-btn" onclick="Modal.show('modal-export')">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
              <path d="M3 10L8 15L13 10"/><path d="M8 15V3"/>
            </svg>
            导出计划
          </button>
          <button class="jg-btn jg-btn-danger" onclick="batchDelete()">批量删除</button>
        </div>

        <!-- 数据列表区 -->
        <div class="page-section data-section">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:44px;"><input type="checkbox" id="checkAll" onclick="toggleAll(this)" title="全选本页"></th>
                <th class="checkbox-col" style="width:60px;">序号</th>
                <th>计划编号</th>
                <th>批次号</th>
                <th>计划名称</th>
                <th>基地</th>
                <th>预计采收量</th>
                <th>负责人</th>
                <th>计划开始时间</th>
                <th>计划结束时间</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="dataTableBody">
            </tbody>
          </table>
        </div>
        <div id="pagination-container">
        </div>
      </div>

    </div>
  </main>
</div>

  <!-- 新建计划模态框 -->
  <div id="modal-add-plan" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">新建采收计划</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="form-add-plan" class="modal-form">
          <div class="form-group">
            <label>计划名称</label>
            <input type="text" class="form-control" id="add-name" placeholder="请输入计划名称">
          </div>
          <div class="form-group">
            <label>所属基地</label>
            <select class="form-control" id="add-base">
              <option value="">请选择基地</option>
              <option value="天水麦积区基地">天水麦积区基地</option>
              <option value="招远基地">招远基地</option>
              <option value="天水荣成基地">天水荣成基地</option>
              <option value="麦积区阁基地">麦积区阁基地</option>
              <option value="龙口南山基地">龙口南山基地</option>
            </select>
          </div>
          <div class="form-group">
            <label>预计采收量(kg)</label>
            <input type="number" class="form-control" id="add-quantity" placeholder="请输入预计采收量">
          </div>
          <div class="form-group">
            <label>计划开始时间</label>
            <input type="datetime-local" class="form-control" id="add-start">
          </div>
          <div class="form-group">
            <label>计划结束时间</label>
            <input type="datetime-local" class="form-control" id="add-end">
          </div>
          <div class="form-group">
            <label>负责人</label>
            <input type="text" class="form-control" id="add-manager" placeholder="请输入负责人">
          </div>
          <div class="form-group">
            <label>备注</label>
            <textarea class="form-control" rows="3" id="add-remark" placeholder="请输入备注信息"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-add-plan')">取消</button>
        <button class="jg-btn jg-btn-primary" onclick="submitAddPlan()">确定</button>
      </div>
    </div>
  </div>

  <!-- 导出计划模态框 -->
  <div id="modal-export" class="modal-overlay">
    <div class="modal-box" style="max-width:420px;">
      <div class="modal-header">
        <h3 class="modal-title">导出采收计划</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-item">
            <label>选择导出格式</label>
            <select class="form-select" id="exportFormat">
              <option value="excel">Excel (.xlsx)</option>
              <option value="csv">CSV (.csv)</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>导出范围</label>
            <div style="display:flex;gap:16px;">
              <label class="checkbox-label">
                <input type="radio" name="exportScope" value="all" checked>
                <span>全部数据</span>
              </label>
              <label class="checkbox-label">
                <input type="radio" name="exportScope" value="filtered">
                <span>当前筛选结果</span>
              </label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-export')">取消</button>
        <button class="jg-btn jg-btn-primary" onclick="exportPlan()">导出</button>
      </div>
    </div>
  </div>

  <!-- 详情模态框 -->
  <div id="modal-detail" class="modal-overlay">
    <div class="modal-box" style="max-width:600px;">
      <div class="modal-header">
        <h3 class="modal-title">采收计划详情</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="detail-content">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
            <div style="padding:12px; background:var(--gray-50); border-radius:8px;">
              <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">计划编号</div>
              <div id="detail-id" style="font-weight:600;"></div>
            </div>
            <div style="padding:12px; background:var(--gray-50); border-radius:8px;">
              <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">计划名称</div>
              <div id="detail-name" style="font-weight:600;"></div>
            </div>
            <div style="padding:12px; background:var(--gray-50); border-radius:8px;">
              <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">所属基地</div>
              <div id="detail-base" style="font-weight:600;"></div>
            </div>
            <div style="padding:12px; background:var(--gray-50); border-radius:8px;">
              <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">预计采收量</div>
              <div id="detail-amount" style="font-weight:600;"></div>
            </div>
            <div style="padding:12px; background:var(--gray-50); border-radius:8px;">

              <div id="detail-start" style="font-weight:600;"></div>
            </div>
            <div style="padding:12px; background:var(--gray-50); border-radius:8px;">
              <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">计划结束时间</div>
              <div id="detail-end" style="font-weight:600;"></div>
            </div>
            <div style="padding:12px; background:var(--gray-50); border-radius:8px;">
              <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">负责人</div>
              <div id="detail-manager" style="font-weight:600;"></div>
            </div>
            <div style="padding:12px; background:var(--gray-50); border-radius:8px;">
              <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">状态</div>
              <div id="detail-status" style="font-weight:600;"></div>
            </div>
          </div>
          <div style="margin-top:16px; padding:12px; background:var(--gray-50); border-radius:8px;">
            <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">备注</div>
            <div id="detail-remark" style="font-weight:500;">-</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-detail')">关闭</button>
      </div>
    </div>
  </div>

  <!-- 编辑模态框 -->

      <div class="modal-header">

        <form id="form-edit-plan" class="modal-form">
          <div class="form-group">

          <div class="form-group">

          <div class="form-group">

            <input type="datetime-local" class="form-control" id="edit-start">

          <div class="form-group">
            <label>计划结束时间</label>
            <input type="datetime-local" class="form-control" id="edit-end">

          <div class="form-group">
            <label>负责人</label>
            <input type="text" class="form-control" id="edit-manager">
          </div>
          <div class="form-group">
            <label>备注</label>
            <textarea class="form-control" rows="3" id="edit-remark"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-edit')">取消</button>
        <button class="jg-btn jg-btn-primary" onclick="submitEditPlan()">确定</button>
      </div>
    </div>
  </div>

  <!-- 删除确认模态框 -->
  <div id="modal-delete" class="modal-overlay">
    <div class="modal-box" style="max-width:400px;">
      <div class="modal-header">
        <h3 class="modal-title">确认删除</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>

        </button>
      </div>
      <div class="modal-body">
        <p>确定要删除这条采收计划吗？此操作不可撤销。</p>

      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-delete')">取消</button>
        <button class="jg-btn jg-btn-danger" onclick="confirmDelete()">删除</button>
      </div>
    </div>
  </div>

</div>

  { id: 'HS-2026-019', batchNo: 'PC-20260919-019', name: '花牛苹果第19批', base: '甘肃吉县苹果园', amount: '1,380 kg', manager: '孙班长', startTime: '2026-09-19 08:00', endTime: '2026-09-19 17:00', status: 'executing', remark: '' },
  { id: 'HS-2026-020', batchNo: 'PC-20260920-020', name: '秦冠苹果第20批', base: '天水麦积区苹果基地', amount: '950 kg', manager: '周技术员', startTime: '2026-09-20 08:00', endTime: '2026-09-20 17:00', status: 'executing', remark: '' }
];

// 获取状态标签
function getStatusTag(status) {
  const statusMap = {
    'completed': '<span class="status-tag completed">已完成</span>',
    'executing': '<span class="status-tag processing">执行中</span>',
    'pending': '<span class="status-tag pending">待执行</span>'
  };
  return statusMap[status] || statusMap['pending'];
}

const STATUS_NAME = { 'pending': '待执行', 'executing': '执行中', 'completed': '已完成' };

// 渲染表格行
function renderRow(item, index) {
  return `<tr>
    <td><input type="checkbox" class="row-check" value="${item.id}" onclick="syncCheckAll()"></td>
    <td class="checkbox-col">${index + 1}</td>
    <td><strong>${item.id}</strong></td>
    <td>${item.batchNo}</td>
    <td>${item.name}</td>
    <td>${item.base}</td>
    <td class="text-right">${item.amount}</td>
    <td>${item.manager || '-'}</td>
    <td>${item.startTime}</td>
    <td>${item.endTime}</td>
    <td>${getStatusTag(item.status)}</td>
    <td>
      <div class="action-btns">
        <button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>
        <button class="action-btn edit" onclick="showEdit('${item.id}')">编辑</button>
        <button class="action-btn delete" onclick="showDeleteConfirm('${item.id}')">删除</button>
      </div>
    </td>
  </tr>`;
}

// 全选 / 反选（仅作用当前页）
function toggleAll(box) {
  document.querySelectorAll('.row-check').forEach(c => { c.checked = box.checked; });
}

function syncCheckAll() {
  const boxes = Array.from(document.querySelectorAll('.row-check'));
  const all = document.getElementById('checkAll');
  if (all) all.checked = boxes.length > 0 && boxes.every(c => c.checked);
}

function selectedPlanIds() {
  return Array.from(document.querySelectorAll('.row-check:checked')).map(c => c.value);
}

function showDeleteConfirm(id) {
  deletingPlanId = id;
  Modal.show('modal-delete');
}

function confirmDelete() {
  const index = mockData.findIndex(p => p.id === deletingPlanId);
  if (index !== -1) mockData.splice(index, 1);
  Modal.hide('modal-delete');
  handleSearch();
  Toast.success('删除成功');
}

// 批量删除（已勾选记录）
function batchDelete() {
  const ids = selectedPlanIds();
  if (ids.length === 0) {
    Toast.warning('请先勾选要删除的计划');
    return;
  }
  ids.forEach(id => {
    const index = mockData.findIndex(p => p.id === id);
    if (index !== -1) mockData.splice(index, 1);
  });
  const all = document.getElementById('checkAll');
  if (all) all.checked = false;
  handleSearch();
  Toast.success('已删除 ' + ids.length + ' 条计划');
}

// 搜索功能：基地 + 状态 + 日期范围 + 关键词
function handleSearch() {
  var keyword = document.getElementById('searchInput').value.trim();
  var base = document.getElementById('baseSelect').value;
  var status = document.getElementById('statusSelect').value;
  var startDate = document.getElementById('startDate').value;
  var endDate = document.getElementById('endDate').value;

  var filteredData = mockData.filter(item => {
    if (keyword && !item.id.includes(keyword) && !item.name.includes(keyword)) return false;
    if (base && !item.base.includes(base)) return false;
    if (status && item.status !== status) return false;
    var planDate = item.startTime.slice(0, 10);
    if (startDate && planDate < startDate) return false;
    if (endDate && planDate > endDate) return false;
    return true;
  });

  var all = document.getElementById('checkAll');
  if (all) all.checked = false;
  Pagination.updateData(filteredData);
  Toast.info('找到 ' + filteredData.length + ' 条记录');
}

function findPlan(id) {
  return mockData.find(p => p.id === id);
}

// 显示详情（按行回填）
function showDetail(id) {
  const item = findPlan(id);
  if (!item) return;
  currentPlanId = id;
  document.getElementById('detail-id').textContent = item.id;
  document.getElementById('detail-name').textContent = item.name;
  document.getElementById('detail-base').textContent = item.base;
  document.getElementById('detail-amount').textContent = item.amount;
  document.getElementById('detail-start').textContent = item.startTime;
  document.getElementById('detail-end').textContent = item.endTime;
  document.getElementById('detail-manager').textContent = item.manager || '-';
  document.getElementById('detail-status').innerHTML = getStatusTag(item.status);
  document.getElementById('detail-remark').textContent = item.remark || '-';
  Modal.show('modal-detail');
}

// 显示编辑（按行回填）
function showEdit(id) {
  const item = findPlan(id);
  if (!item) return;
  currentPlanId = id;
  document.getElementById('edit-name').value = item.name;
  document.getElementById('edit-base').value = item.base;
  document.getElementById('edit-quantity').value = parseInt(item.amount.replace(/[^\d]/g, ''), 10) || '';
  document.getElementById('edit-start').value = item.startTime.replace(' ', 'T');
  document.getElementById('edit-end').value = item.endTime.replace(' ', 'T');
  document.getElementById('edit-manager').value = item.manager || '';
  document.getElementById('edit-remark').value = item.remark || '';
  Modal.show('modal-edit');
}

// 提交新建计划
function submitAddPlan() {
  const name = document.getElementById('add-name').value.trim();
  const base = document.getElementById('add-base').value;
  const quantity = document.getElementById('add-quantity').value;
  if (!name || !base || !quantity) {
    Toast.warning('请填写计划名称、所属基地和预计采收量');
    return;
  }
  const newPlan = {
    id: 'HS-2026-' + String(mockData.length + 1).padStart(3, '0'),
    name: name,
    base: base,
    amount: Number(quantity).toLocaleString() + ' kg',
    manager: document.getElementById('add-manager').value.trim(),
    startTime: (document.getElementById('add-start').value || '').replace('T', ' '),
    endTime: (document.getElementById('add-end').value || '').replace('T', ' '),
    status: 'pending',
    remark: document.getElementById('add-remark').value.trim()
  };
  mockData.unshift(newPlan);
  document.getElementById('form-add-plan').reset();
  Modal.hide('modal-add-plan');
  handleSearch();
  Toast.success('采收计划创建成功');
}

// 提交编辑计划
function submitEditPlan() {
  const item = findPlan(currentPlanId);
  if (item) {
    item.name = document.getElementById('edit-name').value.trim();
    item.base = document.getElementById('edit-base').value;
    item.amount = Number(document.getElementById('edit-quantity').value).toLocaleString() + ' kg';
    item.startTime = document.getElementById('edit-start').value.replace('T', ' ');
    item.endTime = document.getElementById('edit-end').value.replace('T', ' ');
    item.manager = document.getElementById('edit-manager').value.trim();
    item.remark = document.getElementById('edit-remark').value.trim();
  }
  Modal.hide('modal-edit');
  handleSearch();
  Toast.success('采收计划 "' + currentPlanId + '" 已更新');
}

// 真实导出（Excel / CSV）
async function exportPlan() {
  const scope = document.querySelector('input[name="exportScope"]:checked').value;
  const rows = (scope === 'filtered' ? Pagination.filteredData : mockData);
  const result = await ExportHelper.exportData({
    filename: '采收计划_' + ExportHelper.stamp(),
    format: document.getElementById('exportFormat').value,
    headers: ['计划编号', '计划名称', '基地', '预计采收量', '负责人', '计划开始时间', '计划结束时间', '状态', '备注'],
    rows: rows.map(p => [p.id, p.name, p.base, p.amount, p.manager || '', p.startTime, p.endTime, STATUS_NAME[p.status], p.remark || ''])
  });
  Modal.hide('modal-export');
  Toast.success(result === 'csv-fallback' ? 'Excel 组件加载失败，已导出为 CSV' : '导出成功，文件已下载');
}

// 初始化分页
document.addEventListener('DOMContentLoaded', function() {
  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: mockData,
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderRow
  });
});
</script>
