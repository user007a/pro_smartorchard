<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 商品管理</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/page-content.css">
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<style>
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
  }
  .stat-label { font-size: var(--font-size-sm); color: var(--text-tertiary); margin-bottom: var(--space-xs); }
  .stat-value {
    font-size: 26px; font-weight: var(--font-weight-bold);
    color: var(--text-primary); line-height: 1.2; font-variant-numeric: tabular-nums;
  }
  .notice-bar {
    display: flex;
    align-items: flex-start;
    gap: var(--space-sm);
    padding: var(--space-md) var(--space-lg);
    background: var(--info-bg);
    border: 1px solid var(--info-border);
    border-radius: var(--radius-lg);
    font-size: var(--font-size-sm);
    color: var(--text-secondary);
    margin-bottom: var(--space-lg);
  }
  .notice-bar svg { flex-shrink: 0; margin-top: 2px; color: var(--info); }
  .sku-cell { display: flex; align-items: center; gap: var(--space-md); }
  .sku-img {
    width: 44px; height: 44px; border-radius: var(--radius-md);
    object-fit: cover; background: var(--gray-100); flex-shrink: 0;
  }
  .sku-name { font-weight: var(--font-weight-semibold, 600); color: var(--text-primary); }
  .sku-sid { font-size: var(--font-size-xs); color: var(--text-tertiary); font-family: 'SF Mono', Consolas, monospace; }
  .cat-tag {
    display: inline-block; padding: 3px 10px; border-radius: var(--radius-sm);
    font-size: var(--font-size-xs); white-space: nowrap;
  }
  .cat-tag.fruit { background: var(--primary-50); color: var(--primary-600); }
  .cat-tag.gift { background: var(--warning-bg); color: var(--warning); }
  .cat-tag.adopt { background: var(--success-bg); color: var(--success); }
  .stock-warn { color: var(--error); font-weight: 600; }
  .stock-ok { color: var(--text-secondary); }
  .sub-cell { font-size: var(--font-size-xs); color: var(--text-tertiary); margin-top: 2px; }
  .status-tag {
    display: inline-block; padding: 3px 10px; border-radius: var(--radius-full);
    font-size: var(--font-size-xs); white-space: nowrap;
  }
  .status-tag.on { background: var(--success-bg); color: var(--success); }
  .status-tag.off { background: var(--gray-100); color: var(--text-secondary); }
  .price-cell { color: var(--error); font-weight: var(--font-weight-semibold, 600); }
  .price-original { color: var(--text-tertiary); text-decoration: line-through; margin-left: 6px; font-weight: 400; font-size: var(--font-size-xs); }
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 1000;
    justify-content: center; align-items: center; backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--bg-card); border-radius: 12px; width: 92%; max-width: 640px;
    max-height: 85vh; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    animation: modalFadeIn 0.2s ease-out;
  }
  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.95) translateY(-20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-bottom: 1px solid var(--border-default);
  }
  .modal-title { font-size: 16px; font-weight: 600; color: #1f1f1f; }
  .modal-close {
    background: none; border: none; cursor: pointer; padding: 4px;
    font-size: 20px; line-height: 1; color: var(--text-tertiary);
  }
  .modal-close:hover { color: var(--text-secondary); }
  .modal-body { padding: 20px; overflow-y: auto; max-height: calc(85vh - 132px); }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 12px;
    padding: 16px 20px; border-top: 1px solid var(--border-default);
  }
  .form-row { display: flex; gap: var(--space-md); margin-bottom: var(--space-lg); }
  .form-field { flex: 1; }
  .form-field label {
    display: block; font-size: var(--font-size-sm);
    font-weight: var(--weight-medium, 500); color: var(--text-primary); margin-bottom: var(--space-sm);
  }
  .form-field input, .form-field select, .form-field textarea {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--border-default);
    border-radius: var(--radius-lg); font-size: var(--font-size-base);
    font-family: inherit; background: var(--bg-card);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); box-sizing: border-box;
  }
  .form-field textarea { min-height: 76px; resize: vertical; line-height: var(--line-height-relaxed); }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
    border-color: var(--primary-500); box-shadow: 0 0 0 4px rgba(24,144,255,0.12); outline: none;
  }
  .empty-state { padding: var(--space-2xl) 0; text-align: center; color: var(--text-tertiary); font-size: var(--font-size-sm); }
</style>
</head>
<body data-active-menu="mall" data-active-submenu="mall-product">

<div class="main-wrapper">
  <div class="tab-bar">
    <div class="tab-bar-actions">
      <button class="tab-close-all" title="关闭全部标签">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3L11 11M11 3L3 11"/>
        </svg>
      </button>
    </div>
  </div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">商品管理</div>
      </div>
      <div class="page-actions">
        <button class="jg-btn" onclick="resetToH5Default()">刷新数据</button>
        <button class="jg-btn jg-btn-primary" onclick="openEdit()">新增商品</button>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">商品总数</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">在售</div>
        <div class="stat-value" id="statOn">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">已下架</div>
        <div class="stat-value" id="statOff">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">认养类</div>
        <div class="stat-value" id="statAdopt">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">库存预警</div>
        <div class="stat-value" id="statWarn" style="color:var(--error);">0</div>
      </div>
    </div>

    <div class="page-section search-section">
      <div class="search-bar">
        <select class="search-select" id="catSelect">
          <option value="">全部分类</option>
          <option value="fruit">水果</option>
          <option value="gift">礼盒</option>
          <option value="adopt">认养</option>
        </select>
        <select class="search-select" id="statusSelect">
          <option value="">全部状态</option>
          <option value="on">在售</option>
          <option value="off">已下架</option>
        </select>
        <input type="text" class="search-input" placeholder="搜索商品名称或 SKU..." id="searchInput">
        <div class="search-actions">
          <button class="jg-btn jg-btn-primary" onclick="renderTable()">搜索</button>
          <button class="jg-btn" onclick="resetFilter()">重置</button>
        </div>
      </div>
    </div>

    <div class="page-section data-section">
      <div class="data-table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th class="checkbox-col" style="width:60px;">序号</th>
              <th>商品</th>
              <th style="width:90px;">分类</th>
              <th style="width:90px;">品种</th>
              <th style="width:100px;">库存</th>
              <th style="width:130px;">售价</th>
              <th style="width:100px;">状态</th>
              <th style="width:150px;">操作</th>
            </tr>
          </thead>
          <tbody id="productBody"></tbody>
        </table>
      </div>
      <div id="emptyHint" class="empty-state" style="display:none;">暂无数据</div>
    </div>
  </main>
</div>

<!-- ===== 编辑弹窗 ===== -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="editModalTitle">新增商品</h3>
      <button class="modal-close" onclick="closeEditModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-field">
          <label>SKU 编码<span style="color:var(--error);">*</span></label>
          <input type="text" id="editSid" placeholder="如 SKU001">
        </div>
        <div class="form-field">
          <label>商品分类</label>
          <select id="editCat">
            <option value="fruit">水果</option>
            <option value="gift">礼盒</option>
            <option value="adopt">认养</option>
          </select>
        </div>
      </div>
      <div class="form-field" style="margin-bottom:var(--space-lg);">
        <label>商品名称<span style="color:var(--error);">*</span></label>
        <input type="text" id="editName" placeholder="如 花牛苹果 5斤装">
      </div>
      <div class="form-field" style="margin-bottom:var(--space-lg);">
        <label>卖点描述</label>
        <input type="text" id="editDesc" placeholder="如 脆甜多汁 · 新鲜采摘">
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>售价（元）<span style="color:var(--error);">*</span></label>
          <input type="number" id="editPrice" min="0" step="1" placeholder="68">
        </div>
        <div class="form-field">
          <label>划线原价（元）</label>
          <input type="number" id="editOriginal" min="0" step="1" placeholder="0 表示无原价">
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>主图路径</label>
          <input type="text" id="editImg" placeholder="images/thumb_redfuji.jpg">
        </div>
        <div class="form-field">
          <label>上架状态</label>
          <select id="editStatus">
            <option value="on">在售</option>
            <option value="off">已下架</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>品种</label>
          <select id="editVariety">
            <option value="huaniu">花牛苹果</option>
            <option value="redfuji">红富士</option>
            <option value="gala">嘎啦</option>
            <option value="qinguan">秦冠</option>
            <option value="jinshuai">金帅</option>
            <option value="hongxing">红星</option>
            <option value="guoguang">国光</option>
            <option value="mixed">混合装</option>
          </select>
        </div>
        <div class="form-field">
          <label>包装规格</label>
          <input type="text" id="editSpec" placeholder="如 5斤装 / 8斤装 / 3年套餐">
        </div>
        <div class="form-field">
          <label>角标</label>
          <input type="text" id="editTag" placeholder="热销 / 推荐 / 礼盒，可留空">
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>计量单位</label>
          <input type="text" id="editUnit" placeholder="斤 / 箱 / 棵">
        </div>
        <div class="form-field">
          <label>可售库存</label>
          <input type="number" id="editStock" min="0" step="1" placeholder="500">
        </div>
        <div class="form-field">
          <label>安全库存</label>
          <input type="number" id="editSafetyStock" min="0" step="1" placeholder="20">
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>成本价（元）</label>
          <input type="number" id="editCostPrice" min="0" step="0.01" placeholder="0">
        </div>
        <div class="form-field">
          <label>会员价（元）</label>
          <input type="number" id="editMemberPrice" min="0" step="0.01" placeholder="0 表示不设会员价">
        </div>
        <div class="form-field">
          <label>排序号</label>
          <input type="number" id="editSort" min="1" step="1" placeholder="越小越靠前">
        </div>
      </div>
      <div class="form-field" style="margin-bottom:var(--space-lg);">
        <label>服务标签</label>
        <input type="text" id="editServiceTags" placeholder="多个标签用逗号分隔，如 冷链直发,坏果包赔">
      </div>
      <div class="form-field" style="margin-bottom:var(--space-lg);">
        <label>商品详情</label>
        <textarea id="editDetail" placeholder="H5 商品详情文案，可留空"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeEditModal()">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="submitEdit()">保存</button>
    </div>
  </div>
</div>

<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/common-functions.js"></script>
<script src="js/shared/mall-store.js"></script>
<script src="../common/js/api.js"></script>
<script>
/* ============================================================
 * 商品管理（商城管理）
 * 严格空库模式：商品一律来自后端 API（sf_mall_product），不再使用本地演示数据/播种
 * ============================================================ */
var PRODUCT_RESOURCE = 'mall_product';
var PRODUCT_KEY = 'mall_products';
var productsData = [];
var productLoadState = 'loading';
var productLoadError = '';

var CAT_TEXT = { fruit: '水果', gift: '礼盒', adopt: '认养' };
var VARIETY_TEXT = {
  huaniu: '花牛', redfuji: '红富士', gala: '嘎啦', qinguan: '秦冠',
  jinshuai: '金帅', hongxing: '红星', guoguang: '国光', mixed: '混合'
};

var editingId = null;

/* 数据库行(snake_case) → 页面渲染字段 */
function mapProductRow(row) {
  var tags = [];
  try { tags = row.service_tags ? JSON.parse(row.service_tags) : []; } catch (e) { tags = []; }
  if (!Array.isArray(tags)) tags = [];
  return {
    id: row.product_code || (row.id == null ? '' : String(row.id)),
    name: row.product_name || '',
    desc: row.desc || '',
    price: Number(row.price) || 0,
    original: Number(row.original) || 0,
    costPrice: Number(row.cost_price) || 0,
    memberPrice: Number(row.member_price) || 0,
    img: '',
    cat: row.category_id || '',
    variety: row.variety || '',
    spec: row.spec || '',
    unit: row.unit || '',
    tag: row.tag || '',
    stock: Number(row.stock) || 0,
    safetyStock: Number(row.safety_stock) || 0,
    soldCount: Number(row.sold_count) || 0,
    sort: Number(row.sort) || 0,
    serviceTags: tags,
    detailHtml: row.detail_html || '',
    status: row.status === 'off' ? 'off' : 'on'
  };
}

/* 异步取数：加载中 / 暂无数据 / 加载失败三态，不写 localStorage */
function loadProducts() {
  if (!window.Api) { productLoadState = 'error'; productLoadError = '接口未就绪'; renderTable(); return; }
  productLoadState = 'loading'; productLoadError = ''; renderTable();
  Api.get(PRODUCT_RESOURCE, { page: 1, size: 500 }).then(function (r) {
    if (!r || !r.ok) {
      productLoadState = 'error'; productLoadError = (r && r.message) || '请求异常';
      productsData = []; renderTable(); return;
    }
    productsData = ((r.data && r.data.list) || []).map(mapProductRow);
    productLoadState = 'ok'; renderTable();
  }).catch(function (e) {
    productLoadState = 'error'; productLoadError = (e && e.message) || '网络异常';
    productsData = []; renderTable();
  });
}

function readAll() { return productsData; }

function writeList(list) {
  productsData = list;
  if (typeof MallStore !== 'undefined') {
    var r = MallStore.replaceProducts(list);
    if (!r.ok) { Toast.error(r.error || '商品保存失败'); return false; }
    return true;
  }
  try {
    localStorage.setItem(PRODUCT_KEY, JSON.stringify(list));
    return true;
  } catch (e) {
    Toast.error('本地存储写入失败，商品未能保存');
    return false;
  }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function renderStats() {
  var list = readAll();
  var on = 0, off = 0, adopt = 0, warn = 0;
  list.forEach(function (p) {
    if (p.status === 'on') on++; else off++;
    if (p.cat === 'adopt') adopt++;
    if (Number(p.stock) <= Number(p.safetyStock)) warn++;
  });
  document.getElementById('statTotal').textContent = list.length;
  document.getElementById('statOn').textContent = on;
  document.getElementById('statOff').textContent = off;
  document.getElementById('statAdopt').textContent = adopt;
  document.getElementById('statWarn').textContent = warn;
}

function filteredList() {
  var cat = document.getElementById('catSelect').value;
  var status = document.getElementById('statusSelect').value;
  var kw = document.getElementById('searchInput').value.trim().toLowerCase();

  return readAll().filter(function (p) {
    if (cat && p.cat !== cat) return false;
    if (status && p.status !== status) return false;
    if (kw) {
      var hay = ((p.name || '') + ' ' + (p.id || '')).toLowerCase();
      if (hay.indexOf(kw) === -1) return false;
    }
    return true;
  });
}

function renderTable() {
  if (productLoadState !== 'ok') {
    var msg = productLoadState === 'loading' ? '正在加载数据...' : ('数据加载失败：' + productLoadError);
    document.getElementById('productBody').innerHTML = '<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--text-secondary,#6b7b6b);">' + esc(msg) + '</td></tr>';
    document.getElementById('emptyHint').style.display = 'none';
    ['statTotal', 'statOn', 'statOff', 'statAdopt', 'statWarn'].forEach(function (id) { var el = document.getElementById(id); if (el) el.textContent = '0'; });
    return;
  }
  var list = filteredList();
  renderStats();

  var body = document.getElementById('productBody');
  var emptyHint = document.getElementById('emptyHint');

  if (!list.length) {
    body.innerHTML = '';
    emptyHint.style.display = 'block';
    return;
  }
  emptyHint.style.display = 'none';

  body.innerHTML = list.map(function (p, i) {
    var original = p.original > 0
      ? '<span class="price-original">¥' + p.original + '</span>'
      : '';
    return '<tr>' +
      '<td class="checkbox-col">' + (i + 1) + '</td>' +
      '<td><div class="sku-cell">' +
          '<img class="sku-img" src="../applefarm_h5/' + esc(p.img) + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
          '<div><div class="sku-name">' + esc(p.name) + '</div>' +
          '<div class="sku-sid">' + esc(p.id) + (p.tag ? ' · ' + esc(p.tag) : '') + '</div></div>' +
        '</div></td>' +
      '<td><span class="cat-tag ' + esc(p.cat) + '">' + (CAT_TEXT[p.cat] || p.cat) + '</span></td>' +
      '<td><div>' + (VARIETY_TEXT[p.variety] || p.variety || '-') + '</div>' +
        '<div class="sub-cell">' + esc(p.spec || '标准装') + '</div></td>' +
      '<td><span class="' + (Number(p.stock) <= Number(p.safetyStock) ? 'stock-warn' : 'stock-ok') + '">' +
        Number(p.stock) + '</span><div class="sub-cell">安全 ' + Number(p.safetyStock) + ' · 已售 ' + Number(p.soldCount) + '</div></td>' +
      '<td class="price-cell">¥' + p.price + original +
        '<div class="sub-cell">成本 ¥' + (Number(p.costPrice) || 0) + ' · 会员 ¥' + (Number(p.memberPrice) || '-') + '</div></td>' +
      '<td><span class="status-tag ' + esc(p.status) + '">' + (p.status === 'on' ? '在售' : '已下架') + '</span></td>' +
      '<td><div class="action-btns">' +
        '<button class="action-btn detail" onclick="openEdit(\'' + esc(p.id) + '\')">编辑</button>' +
        '<button class="action-btn ' + (p.status === 'on' ? 'delete' : 'download') + '" onclick="toggleStatus(\'' + esc(p.id) + '\')">' +
          (p.status === 'on' ? '下架' : '上架') + '</button>' +
        '<button class="action-btn delete" onclick="removeProduct(\'' + esc(p.id) + '\')">删除</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

function resetFilter() {
  document.getElementById('catSelect').value = '';
  document.getElementById('statusSelect').value = '';
  document.getElementById('searchInput').value = '';
  renderTable();
}

function openEdit(id) {
  editingId = id || null;
  var list = readAll();
  var p = null;
  if (id) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) { p = list[i]; break; }
    }
    if (!p) { Toast.error('未找到该商品'); return; }
  }

  document.getElementById('editModalTitle').textContent = p ? '编辑商品' : '新增商品';
  document.getElementById('editSid').value = p ? p.id : '';
  document.getElementById('editSid').disabled = !!p;
  document.getElementById('editName').value = p ? p.name : '';
  document.getElementById('editDesc').value = p ? p.desc : '';
  document.getElementById('editPrice').value = p ? p.price : '';
  document.getElementById('editOriginal').value = p ? (p.original || 0) : 0;
  document.getElementById('editImg').value = p ? (p.img || '') : '';
  document.getElementById('editCat').value = p ? p.cat : 'fruit';
  document.getElementById('editStatus').value = p ? p.status : 'on';
  document.getElementById('editVariety').value = p ? (p.variety || 'huaniu') : 'huaniu';
  document.getElementById('editSpec').value = p ? (p.spec || '') : '';
  document.getElementById('editTag').value = p ? (p.tag || '') : '';
  document.getElementById('editUnit').value = p ? (p.unit || '斤') : '斤';
  document.getElementById('editStock').value = p ? (p.stock == null ? 500 : p.stock) : 500;
  document.getElementById('editSafetyStock').value = p ? (p.safetyStock == null ? 20 : p.safetyStock) : 20;
  document.getElementById('editCostPrice').value = p ? (p.costPrice || 0) : 0;
  document.getElementById('editMemberPrice').value = p ? (p.memberPrice || 0) : 0;
  document.getElementById('editSort').value = p ? (p.sort || 1) : (readAll().length + 1);
  document.getElementById('editServiceTags').value = p && Array.isArray(p.serviceTags) ? p.serviceTags.join(',') : '';
  document.getElementById('editDetail').value = p ? (p.detailHtml || '') : '';

  document.getElementById('editModal').classList.add('show');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  editingId = null;
}

function submitEdit() {
  var sid = document.getElementById('editSid').value.trim();
  var name = document.getElementById('editName').value.trim();
  var price = document.getElementById('editPrice').value;

  if (!sid) { Toast.warning('请填写 SKU 编码'); return; }
  if (!name) { Toast.warning('请填写商品名称'); return; }
  if (price === '' || isNaN(Number(price)) || Number(price) < 0) {
    Toast.warning('请填写正确的售价');
    return;
  }

  var list = readAll();
  var payload = {
    id: sid,
    name: name,
    desc: document.getElementById('editDesc').value.trim(),
    price: Number(price),
    original: Number(document.getElementById('editOriginal').value) || 0,
    costPrice: Number(document.getElementById('editCostPrice').value) || 0,
    memberPrice: Number(document.getElementById('editMemberPrice').value) || 0,
    img: document.getElementById('editImg').value.trim(),
    cat: document.getElementById('editCat').value,
    variety: document.getElementById('editVariety').value,
    spec: document.getElementById('editSpec').value.trim() || '标准装',
    unit: document.getElementById('editUnit').value.trim() || '斤',
    tag: document.getElementById('editTag').value.trim(),
    stock: Number(document.getElementById('editStock').value) || 0,
    safetyStock: Number(document.getElementById('editSafetyStock').value) || 0,
    sort: Number(document.getElementById('editSort').value) || (list.length + 1),
    serviceTags: document.getElementById('editServiceTags').value.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean),
    detailHtml: document.getElementById('editDetail').value.trim(),
    status: document.getElementById('editStatus').value
  };

  if (!editingId) {
    for (var j = 0; j < list.length; j++) {
      if (list[j].id === sid) {
        Toast.warning('SKU 编码已存在');
        return;
      }
    }
  }

  var item = Object.assign({
    costPrice: 0, memberPrice: 0, img: '', cat: '', variety: '', spec: '', unit: '',
    tag: '', stock: 0, safetyStock: 0, soldCount: 0, sort: list.length + 1,
    serviceTags: [], detailHtml: '', status: 'on'
  }, payload);
  var idx = -1;
  for (var m = 0; m < list.length; m++) { if (list[m].id === (editingId || payload.id)) { idx = m; break; } }
  if (idx >= 0) item = Object.assign({}, list[idx], item);
  if (idx >= 0) list[idx] = item; else list.push(item);
  if (!writeList(list)) return;

  closeEditModal();
  renderTable();
  Toast.success(editingId ? '商品已更新' : '商品已新增');
}

function toggleStatus(id) {
  var list = readAll();
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id) {
      list[i].status = list[i].status === 'on' ? 'off' : 'on';
      writeList(list);
      renderTable();
      Toast.success(list[i].status === 'on' ? '商品已上架' : '商品已下架');
      return;
    }
  }
}

function removeProduct(id) {
  ConfirmDialog.show({
    title: '删除商品',
    message: '确定删除商品「' + id + '」吗？此操作不可撤销。',
    onConfirm: function () {
      var list = readAll().filter(function (p) { return p.id !== id; });
      writeList(list);
      renderTable();
      Toast.success('商品已删除');
    }
  });
}

/* 严格空库模式：不再写死默认商品，改为从数据库重新加载 */
function resetToH5Default() {
  ConfirmDialog.show({
    title: '重新加载',
    message: '重新从数据库加载商品？当前未保存的改动将被丢弃。',
    onConfirm: function () {
      loadProducts();
      Toast.success('已重新加载商品');
    }
  });
}

document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('searchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') renderTable();
  });
  loadProducts();
});
</script>
</body>
</html>
