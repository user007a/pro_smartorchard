<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 价格模型</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  /* 品种标签 */
  .variety-tabs { display:flex; gap:6px; margin-bottom:12px; }
  .variety-tab { padding:5px 14px; background:#f5f5f5; border-radius:14px; font-size:13px; color:var(--text-secondary); cursor:pointer; transition:all 0.2s; border:1px solid transparent; }
  .variety-tab:hover { background:#e6f4ff; color:var(--primary-600); }
  .variety-tab.active { background:linear-gradient(135deg,#1890ff,#096dd9); color:#fff; border-color:#1890ff; box-shadow:0 2px 8px rgba(24,144,255,0.25); }
  /* 情景模拟（突出大数字） */
  .simulate-panel { background:linear-gradient(135deg,#f8fbf9,#f0f5f2); border-radius:10px; padding:18px; }
  .simulate-title { font-size:13px; font-weight:600; color:var(--text-primary); margin-bottom:14px; text-align:center; }
  .simulate-row { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .simulate-row:last-of-type { margin-bottom:0; }
  .simulate-label { width:70px; font-size:12.5px; color:var(--text-secondary); flex-shrink:0; }
  .simulate-input { flex:1; height:6px; -webkit-appearance:none; appearance:none; background:#e8e8e8; border-radius:3px; outline:none; cursor:pointer; }
  .simulate-input::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:18px; height:18px; background:linear-gradient(135deg,#1890ff,#096dd9); border-radius:50%; cursor:pointer; box-shadow:0 2px 6px rgba(24,144,255,0.4); }
  .simulate-input::-moz-range-thumb { width:18px; height:18px; background:linear-gradient(135deg,#1890ff,#096dd9); border-radius:50%; cursor:pointer; border:none; }
  .simulate-value { width:50px; font-size:13px; font-weight:600; color:var(--primary-600); text-align:right; flex-shrink:0; }
  .simulate-result { margin-top:16px; padding:14px; background:linear-gradient(135deg,#1890ff,#096dd9); border-radius:8px; text-align:center; color:#fff; }
  .simulate-result-label { font-size:12px; opacity:0.85; margin-bottom:6px; }
  .simulate-result-value { font-size:28px; font-weight:700; line-height:1; }
  .simulate-result-hint { font-size:11px; opacity:0.75; margin-top:4px; }
  /* 销售建议卡 */
  .sale-card { background:linear-gradient(135deg,#1890ff,#096dd9); border-radius:12px; padding:18px; color:#fff; position:relative; overflow:hidden; }
  .sale-card::before { content:''; position:absolute; top:-50%; right:-50%; width:100%; height:200%; background:radial-gradient(circle,rgba(255,255,255,0.08) 0%,transparent 60%); pointer-events:none; }
  .sale-card-title { display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500; opacity:0.9; margin-bottom:8px; position:relative; }
  .sale-card-time { font-size:24px; font-weight:700; margin-bottom:6px; position:relative; }
  .sale-card-desc { font-size:12px; opacity:0.85; margin-bottom:14px; line-height:1.5; position:relative; }
  .sale-card-countdown { display:flex; gap:8px; }
  .sale-card-countdown .countdown-item { background:rgba(255,255,255,0.18); border-radius:6px; padding:10px 14px; text-align:center; min-width:54px; }
  .sale-card-countdown .countdown-value { font-size:20px; font-weight:700; line-height:1; margin-bottom:2px; }
  .sale-card-countdown .countdown-label { font-size:10.5px; opacity:0.85; }
  /* 分规格价格条 */
  .spec-list { display:flex; flex-direction:column; gap:10px; padding:4px 0; }
  .spec-row { display:flex; align-items:center; gap:10px; }
  .spec-label { width:64px; font-size:12.5px; color:var(--text-secondary); flex-shrink:0; }
  .spec-bar { flex:1; height:18px; background:#f0f0f0; border-radius:4px; overflow:hidden; position:relative; }
  .spec-bar-fill { height:100%; border-radius:4px; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; font-size:11px; color:#fff; font-weight:600; }
  /* 影响因素 */
  .factor-list { display:flex; flex-direction:column; gap:6px; }
  .factor-item { display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:6px; font-size:12.5px; }
  .factor-item.positive { background:#e6f7ff; }
  .factor-item.warning { background:#fffbe6; }
  .factor-item.negative { background:#fff1f0; }
  .factor-arrow { font-weight:700; font-size:13px; }
  .factor-arrow.up { color:var(--success); }
  .factor-arrow.flat { color:var(--warning); }
  .factor-arrow.down { color:var(--error); }
</style>
<style id="standalone-fix">.main-wrapper{margin-left:0!important;width:100%!important;}</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
<link rel="stylesheet" href="css/model-page.css">
</head>
<body data-active-menu="model" data-active-submenu="model-price">
<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3L11 11M11 3L3 11"/></svg>
        </button>
      </div>
    </div>

    <main class="main-content">
<div class="page-container">
  <div class="mp-header">
    <div class="mp-header-main">
      <div class="mp-header-icon"><i data-uicon="wallet"></i></div>
      <div>
        <div class="mp-title">价格模型</div>
        <div class="mp-subtitle">价格趋势 · 情景模拟与销售时机建议</div>
      </div>
    </div>
    <div class="mp-header-actions">
      <span class="mp-live">模型运行中</span>
    </div>
  </div>

  <!-- 顶部 4 指标 -->
  <div class="patrol-stats">
    <div class="patrol-stat-card green"><div class="stat-value">--</div><div class="stat-label">当前均价</div><div class="stat-trend" style="font-size:12px;color:var(--success);"></div></div>
    <div class="patrol-stat-card blue"><div class="stat-value" style="color:var(--primary-500);">--</div><div class="stat-label">预测趋势</div><div class="stat-trend" style="font-size:12px;color:var(--text-tertiary);"></div></div>
    <div class="patrol-stat-card orange"><div class="stat-value">--</div><div class="stat-label">预测高价</div><div class="stat-trend" style="font-size:12px;color:var(--text-tertiary);"></div></div>
    <div class="patrol-stat-card purple"><div class="stat-value" style="font-size:20px;">--</div><div class="stat-label">最佳销售窗口</div><div class="stat-trend" style="font-size:12px;color:var(--success);"></div></div>
  </div>

  <!-- 页签 -->
  <div class="mp-tabs">
    <button class="mp-tab active" data-tab="trend" onclick="mpSwitchTab('trend')"><i data-uicon="chartBar"></i>价格预测</button>
    <button class="mp-tab" data-tab="strategy" onclick="mpSwitchTab('strategy')"><i data-uicon="wallet"></i>销售策略</button>
  </div>

  <div class="mp-panel active" data-panel="trend">
  <!-- 价格走势预测（左 2/3）+ 情景模拟（右 1/3） -->
  <div style="display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-bottom:20px;">
    <div class="chart-section">
      <h2 class="section-title">价格走势预测</h2>
      <div class="variety-tabs"></div>
      <div id="chart-price" class="chart-container" style="height:300px;"></div>
    </div>

    <div class="chart-section">
      <h2 class="section-title">情景模拟</h2>
      <div class="simulate-panel">
        <div class="simulate-title">🎮 调整参数查看预测</div>
        <div class="simulate-row"><span class="simulate-label">产量变化</span><input type="range" min="-30" max="30" value="0" class="simulate-input" oninput="updateSimulate()"><span class="simulate-value" id="simYield">+0%</span></div>
        <div class="simulate-row"><span class="simulate-label">市场供给</span><input type="range" min="-30" max="30" value="-10" class="simulate-input" oninput="updateSimulate()"><span class="simulate-value" id="simSupply">-10%</span></div>
        <div class="simulate-row"><span class="simulate-label">消费需求</span><input type="range" min="-30" max="30" value="15" class="simulate-input" oninput="updateSimulate()"><span class="simulate-value" id="simDemand">+15%</span></div>
        <div class="simulate-result">
          <div class="simulate-result-label">模拟预测价格</div>
          <div class="simulate-result-value" id="simResult">--</div>
          <div class="simulate-result-hint">基于弹性系数 · 实时计算</div>
        </div>
      </div>
    </div>
  </div>
  </div>

  <div class="mp-panel" data-panel="strategy">
  <!-- 销售时机 + 分规格价格 + 影响因素（3 列） -->
  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:20px;">
    <div class="chart-section">
      <h2 class="section-title">最佳销售时机</h2>
      <div class="sale-card"></div>
    </div>

    <div class="chart-section">
      <h2 class="section-title">分规格价格预测</h2>
      <div class="spec-list"></div>
    </div>

    <div class="chart-section">
      <h2 class="section-title">价格影响因素</h2>
      <div class="factor-list" style="padding:4px 0;"></div>
    </div>
  </div>
  </div>
</div>
    </main>
  </div>
</div>

<script>
  /* 模型页面通用页签切换 */
  function mpSwitchTab(name) {
    document.querySelectorAll('.mp-tab').forEach(function (t) { t.classList.toggle('active', t.dataset.tab === name); });
    document.querySelectorAll('.mp-panel').forEach(function (p) { p.classList.toggle('active', p.dataset.panel === name); });
    requestAnimationFrame(function () { window.dispatchEvent(new Event('resize')); });
  }
</script>
<script src="js/shared/model-store.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/chart.js"></script>
<script>
// 价格模型数据统一取自 ModelStore（与移动端/大屏共用）
let PRICE_MODEL = ModelStore.get('price');

// 品种标签（数据来自 ModelStore）
function renderPriceVarieties(M) {
  const box = document.querySelector('.variety-tabs');
  if (!box) return;
  box.innerHTML = M.lists.varieties.map(function(v, i) {
    return '<span class="variety-tab' + (i === 0 ? ' active' : '') + '" onclick="selectVariety(this)">' + v + '</span>';
  }).join('');
}

// 最佳销售时机（数据来自 ModelStore）
function renderPriceSaleWindow(M) {
  const card = document.querySelector('.sale-card');
  if (!card) return;
  const w = M.lists.saleWindow;
  card.innerHTML =
    '<div class="sale-card-title">' + w.title + '</div>' +
    '<div class="sale-card-time">' + w.time + '</div>' +
    '<div class="sale-card-desc">' + w.desc + '</div>' +
    '<div class="sale-card-countdown">' +
      w.countdown.map(function(c) {
        return '<div class="countdown-item"><div class="countdown-value">' + c.value + '</div><div class="countdown-label">' + c.label + '</div></div>';
      }).join('') +
    '</div>';
}

// 分规格价格预测（数据来自 ModelStore）
function renderPriceSpecs(M) {
  const list = document.querySelector('.spec-list');
  if (!list) return;
  list.innerHTML = M.lists.specs.map(function(s) {
    return '<div class="spec-row">' +
      '<span class="spec-label">' + s.label + '</span>' +
      '<div class="spec-bar"><div class="spec-bar-fill" style="width:' + s.width + '%;background:' + s.gradient + ';">' + s.price + '</div></div>' +
    '</div>';
  }).join('');
}

// 价格影响因素（数据来自 ModelStore）
function renderPriceFactors(M) {
  const list = document.querySelector('.factor-list');
  if (!list) return;
  const arrowClass = { '↑': 'up', '→': 'flat', '↓': 'down' };
  list.innerHTML = M.lists.factors.map(function(f) {
    return '<div class="factor-item ' + f.tone + '">' +
      '<span class="factor-arrow ' + (arrowClass[f.arrow] || 'flat') + '">' + f.arrow + '</span>' +
      '<span>' + f.text + '</span>' +
    '</div>';
  }).join('');
}

// 整页重绘：统一取最新 ModelStore，空库时各列表为空、结果显示 '--'
function refreshPrice() {
  PRICE_MODEL = ModelStore.get('price');
  ModelStore.hydrateKpi('.patrol-stats', 'price');
  renderPriceVarieties(PRICE_MODEL);
  renderPriceSaleWindow(PRICE_MODEL);
  renderPriceSpecs(PRICE_MODEL);
  renderPriceFactors(PRICE_MODEL);

  const simResult = document.getElementById('simResult');
  if (simResult) simResult.textContent = PRICE_MODEL.lists.simulate.result || '--';

  Chart.line('#chart-price', PRICE_MODEL.charts.priceTrend);
}

document.addEventListener('DOMContentLoaded', refreshPrice);

function updateSimulate() {
  const sim = ModelStore.get('price').lists.simulate;
  const inputs = document.querySelectorAll('.simulate-input');
  const y = parseInt(inputs[0].value, 10);
  const s = parseInt(inputs[1].value, 10);
  const d = parseInt(inputs[2].value, 10);
  document.getElementById('simYield').textContent = (y >= 0 ? '+' : '') + y + '%';
  document.getElementById('simSupply').textContent = (s >= 0 ? '+' : '') + s + '%';
  document.getElementById('simDemand').textContent = (d >= 0 ? '+' : '') + d + '%';
  const out = document.getElementById('simResult');
  // 空库无基准价时不做模拟，避免凭空算出价格
  if (sim.basePrice == null) { out.textContent = '--'; return; }
  const e = sim.elasticity;
  const delta = e.yield * y + e.supply * s + e.demand * d;
  const newPrice = Math.max(0.5, sim.basePrice * (1 + delta / 100));
  out.textContent = newPrice.toFixed(2) + ' 元/斤';
}

function selectVariety(tab) {
  document.querySelectorAll('.variety-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  Toast.show('已切换至' + tab.textContent, 'info');
}
</script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/typography.js"></script>
<script>
/* ============================================================
 * 后端数据到达后自动重绘
 * ------------------------------------------------------------
 * 数据层在「后端预加载完成」与「本地写入」两条路径上都会派发
 * <store>StoreChange 窗口事件；页面若不监听，首次渲染发生在数据
 * 到达之前，界面会一直停在空列表。此处统一订阅后自动重绘。
 * ============================================================ */
(function () {
  function bind(events, handler) {
    if (typeof StoreLive !== 'undefined') return StoreLive.on(events, handler);
    (Array.isArray(events) ? events : [events]).forEach(function (ev) {
      if (ev) window.addEventListener(ev, function () { try { handler(); } catch (e) { console.warn('[store-live]', e); } });
    });
  }
  bind(["modelStoreChange"], refreshPrice);
})();
</script>
</body>
</html>
