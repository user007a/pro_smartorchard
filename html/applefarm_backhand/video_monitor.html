<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 视频监控</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .stat-card-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-lg);
    margin-bottom: var(--space-lg);
  }
  .stat-card {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-light);
    box-shadow: var(--shadow-card);
    padding: var(--space-lg);
  }
  .stat-label { font-size: 13px; color: var(--text-tertiary); margin-bottom: 6px; }
  .stat-value {
    font-size: 28px; font-weight: 700; line-height: 1.2;
    color: var(--text-primary); font-variant-numeric: tabular-nums;
  }
  .stat-value .unit { font-size: 13px; font-weight: 500; color: var(--text-tertiary); margin-left: 4px; }
  .stat-sub { margin-top: 6px; font-size: 12px; color: var(--text-tertiary); }
  .stat-sub.warn { color: var(--warning); }
  .stat-sub.err { color: var(--error); }

  .status-tag {
    display: inline-block; padding: 3px 10px; border-radius: var(--radius-full);
    font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  .status-tag.online  { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
  .status-tag.warning { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning-border); }
  .status-tag.offline { background: var(--gray-100); color: var(--text-secondary); border: 1px solid var(--border-default); }
  .proto-badge {
    display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm);
    font-size: 12px; font-weight: 500; color: #0969da;
    background: rgba(9,105,218,.08); border: 1px solid rgba(9,105,218,.2);
  }

  /* ===== 监控工作区：左通道卡片列表 + 右预览 ===== */
  /* stretch：两列等高，使左右卡片底部对齐 */
  .monitor-layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: var(--space-lg);
    margin-bottom: var(--space-lg);
    align-items: stretch;
  }
  @media (max-width: 1180px) { .monitor-layout { grid-template-columns: 1fr; } }

  .channel-panel {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .panel-head {
    padding: 14px 16px; border-bottom: 1px solid var(--border-light);
    font-size: 14px; font-weight: 600; color: var(--text-primary);
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, #fbfdfb, #f5f8f5);
  }
  .panel-head .ph-sub { font-size: 12px; font-weight: 400; color: var(--text-tertiary); }
  /* 通道列表：一次性铺开，不设内部滚动 */
  .channel-list {
    flex: 1;
    padding: 10px; display: flex; flex-direction: column; gap: 8px;
    background: #f7f9f7;
  }

  /* 通道卡片：横向缩略图 + 信息 */
  .channel-item {
    display: flex; align-items: stretch; gap: 11px;
    padding: 9px; cursor: pointer;
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    transition: box-shadow .18s, border-color .18s, transform .18s;
  }
  .channel-item:hover {
    border-color: var(--primary-400);
    box-shadow: 0 3px 12px rgba(24,144,255,.12);
    transform: translateY(-1px);
  }
  .channel-item.active {
    border-color: var(--primary-500);
    background: linear-gradient(90deg, rgba(24,144,255,.09), rgba(24,144,255,.02));
    box-shadow: 0 3px 14px rgba(24,144,255,.18);
  }

  /* 缩略图：带暗角与 LIVE 角标 */
  .ch-thumb-wrap {
    position: relative; width: 96px; min-height: 62px;
    border-radius: var(--radius-sm); overflow: hidden; flex-shrink: 0;
    background: #1a1f1c;
  }
  .ch-thumb {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .channel-item.offline .ch-thumb { filter: grayscale(1) brightness(.5); }
  .ch-thumb-wrap::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.42) 100%);
    pointer-events: none;
  }
  .ch-live {
    position: absolute; top: 4px; left: 4px; z-index: 2;
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 9px; font-weight: 700; letter-spacing: .4px;
    color: #fff; background: rgba(0,0,0,.55);
    padding: 1px 5px; border-radius: 3px;
  }
  .ch-live i {
    width: 5px; height: 5px; border-radius: 50%; background: #ff4d4f;
    animation: chPulse 1.6s ease-in-out infinite;
  }
  .channel-item.offline .ch-live { background: rgba(0,0,0,.6); }
  .channel-item.offline .ch-live i { background: #8c8c8c; animation: none; }
  @keyframes chPulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  .ch-info { min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .ch-name {
    font-size: 13px; font-weight: 600; color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ch-meta {
    font-size: 11px; color: var(--text-tertiary); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 能力小标签 */
  .ch-tags { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .ch-tag {
    font-size: 10px; line-height: 1.6; padding: 0 6px;
    border-radius: 3px; color: var(--text-secondary);
    background: var(--gray-100); border: 1px solid var(--border-light);
  }
  .ch-tag.on { color: var(--primary-500); background: rgba(24,144,255,.08); border-color: rgba(24,144,255,.22); }
  /* 状态圆点 */
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; align-self: center; }
  .dot.online { background: var(--success); box-shadow: 0 0 0 3px rgba(82,196,26,.16); }
  .dot.warning { background: var(--warning); box-shadow: 0 0 0 3px rgba(250,173,20,.16); }
  .dot.offline { background: #bfbfbf; box-shadow: 0 0 0 3px rgba(191,191,191,.16); }
  .ch-empty { padding: 34px 16px; text-align: center; color: var(--text-tertiary); font-size: 13px; }

  /* ===== 预览画面 ===== */
  .preview-panel {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: var(--space-lg);
    display: flex; flex-direction: column;
  }
  /* 画面限宽居中，保持 16:9 但不过大 */
  .video-frame {
    position: relative; width: 100%; max-width: 620px;
    aspect-ratio: 16 / 9; align-self: center;
    background: #14181a; border-radius: var(--radius-md);
    overflow: hidden; margin-bottom: 14px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .video-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .video-frame.offline-state img { filter: grayscale(1) brightness(.38); }

  /* 暗角 + 上下遮幅，营造取景器观感 */
  .vf-vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.46) 100%);
  }
  .vf-letterbox {
    position: absolute; left: 0; right: 0; height: 7%;
    background: linear-gradient(180deg, rgba(0,0,0,.55), transparent);
    pointer-events: none;
  }
  .vf-letterbox.top { top: 0; }
  .vf-letterbox.bottom {
    top: auto; bottom: 0;
    background: linear-gradient(0deg, rgba(0,0,0,.55), transparent);
  }
  /* 扫描线（静止纹理，不做动画，避免演示时过于花哨） */
  .vf-scan {
    position: absolute; inset: 0; pointer-events: none; opacity: .16;
    background: repeating-linear-gradient(
      0deg, rgba(255,255,255,.28) 0px, rgba(255,255,255,.28) 1px, transparent 1px, transparent 3px
    );
  }
  /* 四角取景框标记 */
  .vf-corner {
    position: absolute; width: 22px; height: 22px; pointer-events: none;
    border-color: rgba(255,255,255,.62); border-style: solid; border-width: 0;
  }
  .vf-corner.tl { top: 16px; left: 18px; border-top-width: 2px; border-left-width: 2px; }
  .vf-corner.tr { top: 16px; right: 18px; border-top-width: 2px; border-right-width: 2px; }
  .vf-corner.bl { bottom: 16px; left: 18px; border-bottom-width: 2px; border-left-width: 2px; }
  .vf-corner.br { bottom: 16px; right: 18px; border-bottom-width: 2px; border-right-width: 2px; }

  /* OSD 信息层 */
  .osd { position: absolute; color: #fff; font-size: 11px; text-shadow: 0 1px 4px rgba(0,0,0,.9); z-index: 2; }
  .osd-tl { top: 12px; left: 42px; }
  .osd-tr { top: 12px; right: 42px; font-variant-numeric: tabular-nums; }
  .osd-bl { bottom: 12px; left: 42px; }
  .osd-br { bottom: 12px; right: 42px; }

  /* 左上：通道名胶囊 */
  .osd-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(12,16,14,.62); border: 1px solid rgba(255,255,255,.16);
    backdrop-filter: blur(4px);
    padding: 3px 10px; border-radius: var(--radius-full);
    font-size: 11px; font-weight: 600;
  }
  .osd-chip .oc-code { font-weight: 400; color: rgba(255,255,255,.72); font-size: 10px; }
  /* 左下：参数胶囊 */
  .osd-chip.params {
    font-weight: 400; font-size: 10px; color: rgba(255,255,255,.86);
    padding: 2px 9px;
  }
  /* 右上：REC 胶囊 */
  .osd-rec {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(12,16,14,.62); border: 1px solid rgba(255,255,255,.16);
    backdrop-filter: blur(4px);
    padding: 3px 9px; border-radius: var(--radius-full);
    font-size: 10px; font-weight: 700; letter-spacing: .4px;
  }
  .rec-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #ff4d4f; animation: recPulse 1.4s ease-in-out infinite;
  }
  @keyframes recPulse { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  .osd-clock { font-variant-numeric: tabular-nums; }

  /* 离线遮罩 */
  .frame-center {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 6px;
    color: rgba(255,255,255,.9); font-size: 12px; z-index: 3;
    background: rgba(10,13,11,.42);
  }
  .video-frame.offline-state .frame-center { display: flex; }
  .frame-center svg { width: 32px; height: 32px; opacity: .65; }
  .frame-center .fc-title { font-size: 13px; font-weight: 600; }
  .frame-center .fc-sub { font-size: 11px; color: rgba(255,255,255,.62); }

  /* 画面工具条 */
  .vf-toolbar {
    display: flex; align-items: center; gap: 6px;
    position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
    flex-direction: column; z-index: 3;
  }
  .vf-tool {
    width: 27px; height: 27px; border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,.18); background: rgba(12,16,14,.58);
    backdrop-filter: blur(4px);
    color: rgba(255,255,255,.86); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .vf-tool:hover { background: rgba(24,144,255,.85); border-color: transparent; color: #fff; }
  .vf-tool svg { width: 14px; height: 14px; }
  .video-frame.offline-state .vf-tool { display: none; }

  /* ===== 预览区下方：信息网格 + 云台 ===== */
  /* 不占用剩余高度，由回放条的 margin-top:auto 把两者推到卡片底部 */
  .preview-foot {
    display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: start;
  }
  @media (max-width: 760px) { .preview-foot { grid-template-columns: 1fr; } }

  .meta-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 20px; align-content: start; }
  .meta-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-primary);
    padding: 6px 0; border-bottom: 1px dashed var(--border-light);
    min-width: 0;
  }
  .meta-item .mi-label { color: var(--text-tertiary); white-space: nowrap; }
  .meta-item .mi-value {
    margin-left: auto; color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  .meta-item .mi-value.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }

  /* 云台控制 */
  .ptz-box {
    border: 1px solid var(--border-light); border-radius: var(--radius-md);
    padding: 12px 16px; background: #fbfdfb; text-align: center;
    align-self: start;
  }
  .ptz-pad {
    display: grid; grid-template-columns: repeat(3, 38px); grid-template-rows: repeat(3, 38px);
    gap: 5px; justify-content: center;
  }
  .ptz-btn {
    border: 1px solid var(--border-default); border-radius: var(--radius-sm);
    background: var(--bg-card); cursor: pointer; color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .ptz-btn:hover:not(:disabled) {
    border-color: var(--primary-500); color: #fff; background: var(--primary-500);
    box-shadow: 0 2px 8px rgba(24,144,255,.32);
  }
  .ptz-btn:active:not(:disabled) { transform: scale(.93); }
  .ptz-btn:disabled { opacity: .35; cursor: not-allowed; }
  .ptz-btn svg { width: 15px; height: 15px; }
  .ptz-title { font-size: 12px; color: var(--text-tertiary); margin-bottom: 9px; }

  /* 回放条：贴住卡片底部，与左栏底部对齐 */
  .playback-bar {
    display: flex; align-items: center; gap: 12px; margin-top: auto;
    padding: 10px 14px; border: 1px solid var(--border-light);
    border-radius: var(--radius-md); background: #fbfdfb;
  }
  .playback-bar input[type=range] { flex: 1; accent-color: var(--primary-500); }
  .pb-time { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .data-table { min-width: 1080px; }
  .data-table th { white-space: nowrap; }
  .empty-row td { text-align: center; color: var(--text-tertiary); padding: 40px 0; }
  #pagination-container { padding: 12px 16px; }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>

<link rel="stylesheet" href="css/typography.css">

<body data-active-menu="device" data-active-submenu="video-monitor">

<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <div class="content-wrapper">

        <div class="page-header">
          <div>
            <div class="page-title">视频监控</div>
            <div class="page-subtitle">摄像头通道接入、实时预览、录像回放与云台控制，取流协议依赖「网关与协议管理」中的视频接入平台</div>
          </div>
          <div class="page-actions">
            <button class="jg-btn jg-btn-primary" onclick="openCameraModal(null)">新增通道</button>
            <button class="jg-btn" onclick="takeSnapshot()">抓拍</button>
          </div>
        </div>

        <div class="stat-card-row" id="statCards"></div>

        <!-- 监控工作区 -->
        <div class="monitor-layout">
          <div class="channel-panel">
            <div class="panel-head">
              <span>监控通道</span>
              <span class="ph-sub" id="channelCount">共 0 路</span>
            </div>
            <div class="channel-list" id="channelList"></div>
          </div>

          <div class="preview-panel">
            <div class="video-frame" id="videoFrame">
              <img id="frameImg" src="" alt="监控画面">

              <!-- 取景器装饰层 -->
              <div class="vf-letterbox top"></div>
              <div class="vf-letterbox bottom"></div>
              <div class="vf-vignette"></div>
              <div class="vf-scan"></div>
              <span class="vf-corner tl"></span>
              <span class="vf-corner tr"></span>
              <span class="vf-corner bl"></span>
              <span class="vf-corner br"></span>

              <!-- OSD 信息层 -->
              <div class="osd osd-tl">
                <span class="osd-chip"><span id="osdName">未选择通道</span><span class="oc-code" id="osdCode"></span></span>
              </div>
              <div class="osd osd-tr">
                <span class="osd-rec" id="osdRec"><span class="rec-dot"></span>REC</span>
              </div>
              <div class="osd osd-bl">
                <span class="osd-chip params" id="osdStream">—</span>
              </div>
              <div class="osd osd-br">
                <span class="osd-chip params osd-clock" id="osdClock">—</span>
              </div>

              <!-- 画面工具条 -->
              <div class="vf-toolbar">
                <button class="vf-tool" onclick="takeSnapshot()" title="抓拍当前画面">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 8V6a2 2 0 0 1 2-2h2M17 4h2a2 2 0 0 1 2 2v2M21 16v2a2 2 0 0 1-2 2h-2M7 20H5a2 2 0 0 1-2-2v-2"/>
                    <circle cx="12" cy="12" r="3.2"/>
                  </svg>
                </button>
                <button class="vf-tool" onclick="toggleFullscreen()" title="全屏">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
                  </svg>
                </button>
              </div>

              <!-- 离线遮罩 -->
              <div class="frame-center">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 1l22 22M16.5 12A4.5 4.5 0 0 0 12 7.5m-6.3 6.9A4.5 4.5 0 0 0 7.5 16.5"/>
                  <path d="M10.7 5.1A10 10 0 0 1 12 5c7 0 10 7 10 7a13.8 13.8 0 0 1-2.2 3.2M6.6 6.6A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/>
                </svg>
                <span class="fc-title" id="frameMsg">信号中断</span>
                <span class="fc-sub" id="frameSub">设备离线，无法获取实时画面</span>
              </div>
            </div>

            <div class="preview-foot">
              <!-- 通道信息 -->
              <div class="meta-grid" id="previewMeta">
                <div class="meta-item"><span class="mi-label">取流协议</span><span class="mi-value">—</span></div>
                <div class="meta-item"><span class="mi-label">分辨率 / 帧率</span><span class="mi-value">—</span></div>
                <div class="meta-item"><span class="mi-label">码流</span><span class="mi-value">—</span></div>
                <div class="meta-item"><span class="mi-label">录像留存</span><span class="mi-value">—</span></div>
                <div class="meta-item"><span class="mi-label">安装位置</span><span class="mi-value">—</span></div>
                <div class="meta-item"><span class="mi-label">所属基地</span><span class="mi-value">—</span></div>
                <div class="meta-item" style="grid-column:1 / -1;">
                  <span class="mi-label">取流地址</span><span class="mi-value mono">—</span>
                </div>
                <div class="meta-item" style="grid-column:1 / -1;">
                  <span class="mi-label">所属平台</span><span class="mi-value">—</span>
                </div>
              </div>

              <!-- 云台控制 -->
              <div class="ptz-box">
                <div class="ptz-title">云台控制</div>
                <div class="ptz-pad">
                  <button class="ptz-btn" data-ptz="left" title="左转">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                  </button>
                  <button class="ptz-btn" data-ptz="up" title="上仰">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
                  </button>
                  <button class="ptz-btn" data-ptz="right" title="右转">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>

/* ============================================================

// 分页组件（与农事计划 / 基地管理一致）
const Pagination = {
  currentPage: 1, pageSize: 10, filteredData: [],
  containerId: 'pagination-container', tbodyId: 'dataTableBody', renderRow: null,
  init: function(options) {
    this.currentPage = options.currentPage || 1;
    this.pageSize = options.pageSize || 10;
    this.filteredData = options.data || [];
    this.containerId = options.containerId || 'pagination-container';
    this.tbodyId = options.tbodyId || 'dataTableBody';
    this.renderRow = options.renderRow || null;
    this.render();
  },
  renderTable: function() {
    const tbody = document.getElementById(this.tbodyId);
    if (!tbody || !this.renderRow) return;
    const start = (this.currentPage - 1) * this.pageSize;
    const pageData = this.filteredData.slice(start, start + this.pageSize);
    tbody.innerHTML = pageData.map((item, i) => this.renderRow(item, start + i + 1)).join('');
  },
  render: function() {
    const container = document.getElementById(this.containerId);
    if (!container) return;
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    let html = '<div class="pagination">';
    html += `<button class="page-btn ${this.currentPage <= 1 ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage - 1})">‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= this.currentPage - 1 && i <= this.currentPage + 1)) {
        html += `<button class="page-btn ${i === this.currentPage ? 'active' : ''}" onclick="Pagination.goToPage(${i})">${i}</button>`;
      } else if (i === this.currentPage - 2 || i === this.currentPage + 2) {
        html += '<span class="page-ellipsis" style="padding:0 8px;color:#6b7b6b;">...</span>';
      }
    }
    html += `<button class="page-btn ${this.currentPage >= totalPages ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage + 1})">›</button>`;
    html += `<span style="margin-left:16px;font-size:13px;color:#6b7b6b;">第 ${this.currentPage} 页/共 ${totalPages} 页，共 ${this.filteredData.length} 条记录</span>`;
    html += '</div>';
    container.innerHTML = html;
    this.renderTable();
  },
  goToPage: function(page) {
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    if (page < 1 || page > totalPages) return;
    this.currentPage = page;
    this.render();
  },
  updateData: function(data) {
    this.filteredData = data;
    this.currentPage = 1;
    this.render();
  }
};

var BASE_OPTIONS = ['麦积区基地 A区', '麦积区基地 B区', '麦积区基地 C区', '白水基地 A区', '宜川基地 A区'];
var CAM_STATUS_TEXT = { online: '在线', warning: '信号弱', offline: '离线' };
var editingCamId = null;
var camDetailId = null;
var activeCamId = null;
var clockTimer = null;
var playbackTimer = null;

// 预览画面占位图（按通道轮换，复用 H5 端实景图）
var FRAME_IMGS = [
  '../applefarm_h5/images/apple_orchard_banner.jpg',
  '../applefarm_h5/images/apple_tree_orchard.jpg',
  '../applefarm_h5/images/apple_spring_orchard.jpg',
  '../applefarm_h5/images/trace_harvest.jpg'
];
function frameImgOf(cam) {
  var idx = Math.max(0, DeviceStore.cameras().findIndex(function (x) { return x.id === cam.id; }));
  return FRAME_IMGS[idx % FRAME_IMGS.length];
}

/* ---------- 统计卡 ---------- */
function renderStats() {
  var s = DeviceStore.cameraSummary();
  document.getElementById('statCards').innerHTML =
    '<div class="stat-card"><div class="stat-label">监控通道</div>' +
    '<div class="stat-value">' + s.total + '<span class="unit">路</span></div>' +
    '<div class="stat-sub">支持云台 ' + s.ptz + ' 路</div></div>' +
    '<div class="stat-card"><div class="stat-label">在线</div>' +
    '<div class="stat-value">' + s.online + '<span class="unit">路</span></div>' +
    '<div class="stat-sub">取流正常</div></div>' +
    '<div class="stat-card"><div class="stat-label">信号弱</div>' +
    '<div class="stat-value">' + s.warning + '<span class="unit">路</span></div>' +
    '<div class="stat-sub ' + (s.warning ? 'warn' : '') + '">建议排查网络</div></div>' +
    '<div class="stat-card"><div class="stat-label">离线</div>' +
    '<div class="stat-value">' + s.offline + '<span class="unit">路</span></div>' +
    '<div class="stat-sub ' + (s.offline ? 'err' : '') + '">需现场检修</div></div>';
}

/* ---------- 下拉初始化 ---------- */
function initSelects() {
  var base = document.getElementById('baseSelect');
  var camBase = document.getElementById('camBaseSelect');
  BASE_OPTIONS.forEach(function (b) {
    var o1 = document.createElement('option'); o1.value = b; o1.textContent = b; base.appendChild(o1);
    var o2 = document.createElement('option'); o2.value = b; o2.textContent = b; camBase.appendChild(o2);
  });
  refreshPlatformSelect();
}

/* 所属平台取自网关配置中的视频接入平台 */
function refreshPlatformSelect() {
  var sel = document.getElementById('camPlatformSelect');
  var cur = sel.value;
  sel.innerHTML = '';
  var gws = DeviceStore.gateways().filter(function (g) {
    return ['ONVIF', 'RTSP', 'GB/T 28181'].indexOf(g.protocol) !== -1;
  });
  if (!gws.length) {
    sel.innerHTML = '<option value="">未配置视频平台</option>';
    return;
  }
  gws.forEach(function (g) {
    var o = document.createElement('option');
    o.value = g.model + ' · ' + g.name;
    o.textContent = o.value;
    sel.appendChild(o);
  });
  if (cur) sel.value = cur;
}

/* ---------- 通道列表（左栏卡片） ---------- */
function renderChannelList() {
  var list = DeviceStore.cameras();
  document.getElementById('channelCount').textContent = '共 ' + list.length + ' 路';
  var box = document.getElementById('channelList');
  box.innerHTML = list.map(function (c) {
    var tags = [];
    tags.push('<span class="ch-tag">' + esc(c.resolution) + '</span>');
    if (c.ptz) tags.push('<span class="ch-tag on">云台</span>');
    if (c.nightVision) tags.push('<span class="ch-tag on">夜视</span>');
    return '<div class="channel-item ' + (c.id === activeCamId ? 'active ' : '') + (c.status === 'offline' ? 'offline' : '') + '" data-id="' + c.id + '">' +
      '<div class="ch-thumb-wrap">' +
        '<img class="ch-thumb" src="' + frameImgOf(c) + '" alt="' + esc(c.name) + '" onerror="this.style.visibility=\'hidden\'">' +
        '<span class="ch-live"><i></i>' + (c.status === 'offline' ? 'OFF' : 'LIVE') + '</span>' +
      '</div>' +
      '<div class="ch-info">' +
        '<div class="ch-name">' + esc(c.name) + '</div>' +
        '<div class="ch-meta">' + esc(c.code) + ' · ' + esc(c.location) + '</div>' +
        '<div class="ch-tags">' + tags.join('') + '</div>' +
      '</div>' +
      '<span class="dot ' + c.status + '" title="' + (CAM_STATUS_TEXT[c.status] || c.statusText) + '"></span>' +
    '</div>';
  }).join('');
  if (!list.length) box.innerHTML = '<div class="ch-empty">暂无监控通道</div>';
}

/* ---------- 预览画面 ---------- */
function renderPreview() {
  var cam = DeviceStore.cameras().filter(function (x) { return x.id === activeCamId; })[0];
  var frame = document.getElementById('videoFrame');
  var img = document.getElementById('frameImg');

  if (!cam) {
    frame.classList.remove('offline-state');
    img.src = FRAME_IMGS[0];
    document.getElementById('osdName').textContent = '未选择通道';
    document.getElementById('osdCode').textContent = '';
    document.getElementById('osdStream').textContent = '—';
    document.getElementById('frameMsg').textContent = '未选择通道';
    document.getElementById('frameSub').textContent = '请从左侧列表选择要预览的监控通道';
    document.getElementById('osdRec').style.display = 'none';
    renderMeta(null);
    setPtzEnabled(false);
    return;
  }

  var offline = cam.status === 'offline';
  frame.classList.toggle('offline-state', offline);
  img.src = frameImgOf(cam);
  document.getElementById('frameMsg').textContent = offline ? '信号中断' : '';
  document.getElementById('frameSub').textContent = offline
    ? (cam.remark || '设备离线，无法获取实时画面')
    : '';
  document.getElementById('osdName').textContent = cam.name;
  document.getElementById('osdCode').textContent = cam.code;
  document.getElementById('osdStream').textContent =
    cam.protocol + ' | ' + cam.resolution + ' | ' + cam.fps + 'fps | ' + cam.stream;
  document.getElementById('osdRec').style.display = offline ? 'none' : 'inline-flex';

  renderMeta(cam);
  setPtzEnabled(!!cam.ptz && !offline);
  updateClock();
}

/* 预览区下方信息网格 */
function renderMeta(cam) {
  var rows = cam ? [
    ['取流协议', cam.protocol],
    ['分辨率 / 帧率', cam.resolution + ' @ ' + cam.fps + 'fps'],
    ['码流', cam.stream],
    ['录像留存', cam.storageDays + ' 天'],
    ['安装位置', cam.location],
    ['所属基地', cam.base],
    ['取流地址', cam.url, 'mono'],
    ['所属平台', cam.platform]
  ] : [
    ['取流协议', '—'], ['分辨率 / 帧率', '—'], ['码流', '—'], ['录像留存', '—'],
    ['安装位置', '—'], ['所属基地', '—'], ['取流地址', '—'], ['所属平台', '—']
  ];
  var lastTwo = rows.slice(6);
  document.getElementById('previewMeta').innerHTML =
    rows.slice(0, 6).map(function (r) {
      return '<div class="meta-item"><span class="mi-label">' + r[0] + '</span>' +
        '<span class="mi-value">' + esc(r[1]) + '</span></div>';
    }).join('') +
    lastTwo.map(function (r) {
      return '<div class="meta-item" style="grid-column:1 / -1;"><span class="mi-label">' + r[0] + '</span>' +
        '<span class="mi-value ' + (r[2] || '') + '" title="' + esc(r[1]) + '">' + esc(r[1]) + '</span></div>';
    }).join('');
}

function setPtzEnabled(on) {
  document.querySelectorAll('.ptz-btn').forEach(function (b) { b.disabled = !on; });
}

/* 画面全屏 */
function toggleFullscreen() {
  var frame = document.getElementById('videoFrame');
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else if (frame.requestFullscreen) {
    frame.requestFullscreen().catch(function () {
      Toast.show('当前浏览器不支持全屏', 'warning');
    });
  }
}

function updateClock() {
  var cam = DeviceStore.cameras().filter(function (x) { return x.id === activeCamId; })[0];
  if (!cam) { document.getElementById('osdClock').textContent = '—'; return; }
  var d = new Date();
  function p(n) { return String(n).padStart(2, '0'); }
  document.getElementById('osdClock').textContent =
    d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

/* ---------- 云台 ---------- */
document.querySelectorAll('.ptz-btn').forEach(function (b) {
  b.addEventListener('click', function () {
    if (b.disabled) return;
    var cam = DeviceStore.cameras().filter(function (x) { return x.id === activeCamId; })[0];
    if (!cam) return;
    var act = { left: '左转', right: '右转', up: '上仰', down: '下俯', 'zoom-in': '放大', 'zoom-out': '缩小', home: '复位预置位' }[b.getAttribute('data-ptz')];
    Toast.show(cam.name + ' 云台' + act + '指令已下发', 'success');
  });
});

/* ---------- 录像回放 ---------- */
function togglePlayback() {
  var cam = DeviceStore.cameras().filter(function (x) { return x.id === activeCamId; })[0];
  if (!cam) { Toast.show('请先选择监控通道', 'warning'); return; }
  if (playbackTimer) {
    clearInterval(playbackTimer);
    playbackTimer = null;
    document.getElementById('pbPlayText').textContent = '回放';
    return;
  }
  document.getElementById('pbPlayText').textContent = '暂停';
  playbackTimer = setInterval(function () {
    var seek = document.getElementById('pbSeek');
    var v = Number(seek.value) + 1;
    if (v > 100) { v = 0; }
    seek.value = v;
    onSeek(v);
  }, 300);
}

function onSeek(v) {
  var cam = DeviceStore.cameras().filter(function (x) { return x.id === activeCamId; })[0];
  if (!cam) return;
  // 以当前时间往前推 60 分钟为回放起点
  var totalSec = 3600;
  var offsetSec = Math.round(totalSec * (100 - Number(v)) / 100);
  var end = new Date(Date.now() - offsetSec * 1000);
  function p(n) { return String(n).padStart(2, '0'); }
  document.getElementById('pbTime').textContent =
    p(end.getHours()) + ':' + p(end.getMinutes()) + ':' + p(end.getSeconds());
}

function takeSnapshot() {
  var cam = DeviceStore.cameras().filter(function (x) { return x.id === activeCamId; })[0];
  if (!cam) { Toast.show('请先选择监控通道', 'warning'); return; }
  if (cam.status === 'offline') { Toast.show(cam.name + ' 当前离线，无法抓拍', 'warning'); return; }
  Toast.show(cam.name + ' 抓拍成功，已保存至相册', 'success');
}

/* ---------- 行渲染 ---------- */
function renderRow(item, index) {
  return '<tr>' +
    '<td><strong>' + esc(item.id) + '</strong></td>' +
    '<td>' + esc(item.name) + '</td>' +
    '<td>' + esc(item.code) + '</td>' +
    '<td>' + esc(item.channel) + '</td>' +
    '<td><span class="proto-badge">' + esc(item.protocol) + '</span></td>' +
    '<td>' + esc(item.resolution) + '</td>' +
    '<td>' + esc(item.fps) + '</td>' +
    '<td>' + esc(item.stream) + '</td>' +
    '<td>' + (item.ptz ? item.ptzText : '-') + '</td>' +
    '<td>' + (item.nightVision ? item.nightVisionText : '-') + '</td>' +
    '<td>' + esc(item.storageDays) + '</td>' +
    '<td>' + esc(item.base) + '</td>' +
    '<td>' + esc(item.location) + '</td>' +
    '<td><span class="status-tag ' + item.status + '">' + (CAM_STATUS_TEXT[item.status] || item.statusText) + '</span></td>' +
    '<td><div class="action-btns">' +
      '<button class="action-btn" data-act="preview" data-id="' + item.id + '">预览</button>' +
      '<button class="action-btn detail" data-act="detail" data-id="' + item.id + '">详情</button>' +
      '<button class="action-btn edit" data-act="edit" data-id="' + item.id + '">编辑</button>' +
      '<button class="action-btn delete" data-act="del" data-id="' + item.id + '">删除</button>' +
    '</div></td>' +
  '</tr>';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ---------- 搜索 ---------- */
function filteredList() {
  var base = document.getElementById('baseSelect').value;
  var proto = document.getElementById('protocolSelect').value;
  var status = document.getElementById('statusSelect').value;
  var kw = (document.getElementById('searchInput').value || '').trim().toLowerCase();

  return DeviceStore.cameras().filter(function (x) {
    if (base && x.base !== base) return false;
    if (proto && x.protocol !== proto) return false;
    if (status && x.status !== status) return false;
    if (kw) {
      var hay = [x.name, x.code, x.location, x.id, x.url].join(' ').toLowerCase();
      if (hay.indexOf(kw) === -1) return false;
    }
    return true;
  });
}

function handleSearch() {
  var list = filteredList();
  Pagination.updateData(list);
  Toast.show('找到 ' + list.length + ' 条记录', 'info');
}

function smartReset() {
  document.getElementById('baseSelect').value = '';
  document.getElementById('protocolSelect').value = '';
  document.getElementById('statusSelect').value = '';
  document.getElementById('searchInput').value = '';
  Pagination.updateData(DeviceStore.cameras());
  Toast.show('已重置搜索条件', 'info');
}

/* ---------- 新增 / 编辑 ---------- */
function openCameraModal(item) {
  editingCamId = item ? item.id : null;
  document.getElementById('cameraModalTitle').textContent = item ? '编辑监控通道' : '新增监控通道';
  var form = document.getElementById('form-camera');
  form.reset();
  refreshPlatformSelect();

  if (item) {
    form.name.value = item.name;
    form.code.value = item.code;
    form.channel.value = item.channel;
    form.protocol.value = item.protocol;
    form.resolution.value = item.resolution;
    form.fps.value = item.fps;
    form.url.value = item.url;
    document.getElementById('camPlatformSelect').value = item.platform || '';
    document.getElementById('camBaseSelect').value = item.base;
    form.location.value = item.location;
    form.storageDays.value = item.storageDays;
    form.stream.value = item.stream;
    form.ptz.value = String(!!item.ptz);
    form.nightVision.value = String(!!item.nightVision);
    form.status.value = item.status;
    form.remark.value = item.remark || '';
  } else {
    document.getElementById('camBaseSelect').value = BASE_OPTIONS[0];
    form.fps.value = '25';
    form.storageDays.value = '30';
    form.stream.value = '主码流';
    form.ptz.value = 'false';
    form.nightVision.value = 'true';
    form.status.value = 'online';
  }
  document.getElementById('modal-camera').classList.add('show');
}

function closeCameraModal() { document.getElementById('modal-camera').classList.remove('show'); }

function submitCamera() {
  var form = document.getElementById('form-camera');
  var name = (form.name.value || '').trim();
  var code = (form.code.value || '').trim();
  var url = (form.url.value || '').trim();
  if (!name) { Toast.show('请填写通道名称', 'warning'); return; }
  if (!code) { Toast.show('请填写设备编码', 'warning'); return; }
  if (!url) { Toast.show('请填写取流地址', 'warning'); return; }

  var ptz = form.ptz.value === 'true';
  var night = form.nightVision.value === 'true';
  var status = form.status.value;
  DeviceStore.upsertCamera({
    id: editingCamId || genCamId(),
    name: name,
    code: code,
    channel: (form.channel.value || '').trim(),
    protocol: form.protocol.value,
    platform: form.platform.value,
    url: url,
    resolution: form.resolution.value,
    fps: Number(form.fps.value) || 25,
    stream: form.stream.value,
    ptz: ptz, ptzText: ptz ? '支持' : '不支持',
    nightVision: night, nightVisionText: night ? '红外夜视' : '无夜视',
    storageDays: Number(form.storageDays.value) || 30,
    base: form.base.value,
    location: (form.location.value || '').trim(),
    status: status,
    statusText: CAM_STATUS_TEXT[status],
    remark: (form.remark.value || '').trim(),
    updatedAt: nowStamp()
  });

  closeCameraModal();
  Toast.show(editingCamId ? '监控通道已更新' : '监控通道已创建', 'success');
}

function genCamId() {
  var max = 0;
  DeviceStore.cameras().forEach(function (x) {
    var n = parseInt(String(x.id || '').replace(/\D/g, ''), 10);
    if (!isNaN(n) && n > max) max = n;
  });
  return 'VC-' + String(max + 1).padStart(3, '0');
}

function pad2(n) { return String(n).padStart(2, '0'); }
function nowStamp() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
    ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

/* ---------- 详情 ---------- */
function openCamDetail(id) {
  var item = DeviceStore.cameras().filter(function (x) { return x.id === id; })[0];
  if (!item) return;
  camDetailId = id;
  document.getElementById('camDetailTitle').textContent = '通道详情 · ' + item.name;

  var rows = [
    ['通道编号', esc(item.id)],
    ['通道名称', esc(item.name)],
    ['设备编码 / 通道号', esc(item.code) + ' / ' + esc(item.channel)],
    ['取流协议', esc(item.protocol)],
    ['取流地址', esc(item.url)],
    ['所属平台', esc(item.platform)],
    ['分辨率 / 帧率', esc(item.resolution) + ' @ ' + esc(item.fps) + 'fps'],
    ['码流', esc(item.stream)],
    ['云台 / 夜视', (item.ptz ? item.ptzText : '不支持') + ' · ' + (item.nightVision ? item.nightVisionText : '无夜视')],
    ['录像留存', item.storageDays + ' 天'],
    ['所属基地', esc(item.base)],
    ['安装位置', esc(item.location)],
    ['通道状态', '<span class="status-tag ' + item.status + '">' + (CAM_STATUS_TEXT[item.status] || item.statusText) + '</span>'],
    ['备注', esc(item.remark) || '-'],
    ['更新时间', esc(item.updatedAt)]
  ].map(function (r) {
    return '<div class="detail-row"><span class="detail-label">' + r[0] + '</span>' +
      '<span class="detail-value">' + r[1] + '</span></div>';
  }).join('');

  document.getElementById('camDetailBody').innerHTML = '<div class="detail-info">' + rows + '</div>';
  document.getElementById('modal-camera-detail').classList.add('show');
}

function closeCamDetailModal() { document.getElementById('modal-camera-detail').classList.remove('show'); }

function editFromCamDetail() {
  var id = camDetailId;
  closeCamDetailModal();
  var item = DeviceStore.cameras().filter(function (x) { return x.id === id; })[0];
  if (item) openCameraModal(item);
}

/* ---------- 删除 ---------- */
function handleDelete(id) {
  var item = DeviceStore.cameras().filter(function (x) { return x.id === id; })[0];
  if (!item) return;
  Confirm.delete('确定要删除监控通道「' + item.name + '」吗？此操作不可撤销。').then(function (ok) {
    if (!ok) return;
    DeviceStore.removeCamera(id);
    if (activeCamId === id) {
      var rest = DeviceStore.cameras();
      activeCamId = rest.length ? rest[0].id : null;
    }
    Toast.show('删除成功', 'success');
  });
}

/* ---------- 事件绑定 ---------- */
document.getElementById('channelList').addEventListener('click', function (e) {
  var item = e.target.closest('.channel-item');
  if (!item) return;
  activeCamId = item.getAttribute('data-id');
  document.getElementById('pbSeek').value = 0;
  renderChannelList();
  renderPreview();
});

document.getElementById('dataTableBody').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-act]');
  if (!btn) return;
  var id = btn.getAttribute('data-id');
  var act = btn.getAttribute('data-act');
  if (act === 'preview') {
    activeCamId = id;
    renderChannelList();
    renderPreview();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (act === 'detail') openCamDetail(id);
  else if (act === 'edit') {
    var item = DeviceStore.cameras().filter(function (x) { return x.id === id; })[0];
    if (item) openCameraModal(item);
  } else handleDelete(id);
});

/* ---------- 初始化 ---------- */
document.addEventListener('DOMContentLoaded', function () {
  initSelects();
  renderStats();

  var cams = DeviceStore.cameras();
  activeCamId = cams.length ? cams[0].id : null;

  renderChannelList();
  renderPreview();
  onSeek(0);

  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: DeviceStore.cameras(),
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderRow
  });

  clockTimer = setInterval(updateClock, 1000);

  DeviceStore.subscribe(function () {
    refreshPlatformSelect();
    renderStats();
    renderChannelList();
    renderPreview();
    Pagination.updateData(filteredList());
  });
});
