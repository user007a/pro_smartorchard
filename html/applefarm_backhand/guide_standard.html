<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 农事标准</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .module-card { transition:all 0.2s ease; }
  .module-card:hover { background:var(--bg-hover); transform:translateY(-2px); box-shadow:var(--shadow-md); }
  /* 分页栏样式（与农事计划一致） */
  #pagination-container { padding:12px 16px; }
  .data-table { width:100%; border-collapse:collapse; }
  .data-table th { white-space:nowrap; }
</style>
<style id="standalone-fix">
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="guide" data-active-submenu="guide-standard">

<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <div class="content-wrapper">

        <!-- 搜索栏区 -->
        <div class="page-section search-section">
          <div class="search-bar">
            <select class="search-select" id="levelSelect">
              <option value="">全部级别</option>
              <option value="国家标准">国家标准</option>
              <option value="地方标准">地方标准</option>
              <option value="企业标准">企业标准</option>
            </select>
            <select class="search-select" id="typeSelect">
              <option value="">全部类型</option>
              <option value="施肥">施肥</option>
              <option value="修剪">修剪</option>
              <option value="疏花疏果">疏花疏果</option>
              <option value="套袋">套袋</option>
              <option value="病虫害防治">病虫害防治</option>
              <option value="灌溉">灌溉</option>
              <option value="采收">采收</option>
            </select>
            <select class="search-select" id="statusSelect">
              <option value="">全部状态</option>
              <option value="现行">现行</option>
              <option value="试行">试行</option>
              <option value="废止">废止</option>
            </select>
            <input type="text" class="search-input" placeholder="搜索标准名称..." id="searchInput">
            <div class="search-actions">
              <button class="jg-btn jg-btn-primary" onclick="handleSearch()">搜索</button>
              <button class="jg-btn" onclick="smartReset()">重置</button>
            </div>
          </div>
        </div>

        <!-- 操作按钮区 -->
        <div class="page-section action-bar">
          <button class="jg-btn jg-btn-primary" onclick="Modal.show('modal-add-standard')">新增标准</button>
          <button class="jg-btn" onclick="Modal.show('modal-export')">导出标准</button>
        </div>

        <!-- 数据列表区 -->
        <div class="page-section data-section">
          <div class="data-table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width:60px;">序号</th>
                  <th>标准编号</th>
                  <th>标准名称</th>
                  <th>标准级别</th>
                  <th>农事类型</th>
                  <th>适用品种</th>
                  <th>生效日期</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="dataTableBody"></tbody>
            </table>
          </div>
          <div id="pagination-container"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- 新增标准模态框 -->

            <label>状态</label>

              <option value="现行">现行</option>
              <option value="试行">试行</option>
              <option value="废止">废止</option>
            </select>

        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="Modal.hide('modal-add-standard')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="handleAddStandard()">保存</button>
    </div>
  </div>
</div>

<!-- 导出标准模态框 -->
<div id="modal-export" class="modal-overlay">
  <div class="modal-box" style="max-width:420px;">
    <div class="modal-header">
      <h3 class="modal-title">导出标准</h3>

    </div>

        <div class="form-item">

            <option value="pdf">PDF (.pdf)</option>

    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="Modal.hide('modal-export')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="handleExport()">导出</button>

</div>

<script>

  { id: 9, code: 'DB62/T 1236-2024', name: '苹果疏花疏果操作规程', level: '地方标准', type: '疏花疏果', variety: '花牛苹果', date: '2026-04-01', status: '试行' },

  { id: 11, code: 'Q/HN 002-2024', name: '果园春季施肥作业标准', level: '企业标准', type: '施肥', variety: '花牛苹果', date: '2026-03-01', status: '现行' },

// 获取状态标签
function getStatusTag(status) {
  const map = {
    '现行': '<span class="status-tag done">现行</span>',
    '试行': '<span class="status-tag warning">试行</span>',
    '废止': '<span class="status-tag normal">废止</span>'
  };
  return map[status] || map['现行'];
}

// 渲染表格行
function renderRow(item, index) {
  return `<tr>
    <td>${index + 1}</td>
    <td>${item.code}</td>
    <td><strong>${item.name}</strong></td>
    <td>${item.level}</td>
    <td>${item.type}</td>
    <td>${item.variety}</td>
    <td>${item.date}</td>
    <td>${getStatusTag(item.status)}</td>
    <td>
      <div class="action-btns">
        <button class="action-btn detail" onclick="Modal.show('modal-detail')">查看</button>
        <button class="action-btn edit" onclick="Modal.show('modal-edit')">编辑</button>
        <button class="action-btn delete" onclick="handleDeleteStandard()">删除</button>
      </div>
    </td>
  </tr>`;
}

// 搜索功能
function handleSearch() {
  const keyword = document.getElementById('searchInput').value;
  const level = document.getElementById('levelSelect').value;
  const type = document.getElementById('typeSelect').value;
  const status = document.getElementById('statusSelect').value;

  var filteredData = mockData.filter(item => {
    if (level && item.level !== level) return false;
    if (type && item.type !== type) return false;
    if (status && item.status !== status) return false;
    if (keyword && !item.name.includes(keyword) && !item.code.includes(keyword)) return false;
    return true;
  });

  Pagination.updateData(filteredData);
  Toast.info('找到 ' + filteredData.length + ' 条记录');
}

// 重置搜索
function smartReset() {
  document.getElementById('searchInput').value = '';
  document.getElementById('levelSelect').value = '';
  document.getElementById('typeSelect').value = '';
  document.getElementById('statusSelect').value = '';
  Pagination.updateData(mockData);
  Toast.info('已重置搜索条件');
}

// 新增标准
function handleAddStandard() {
  Modal.hide('modal-add-standard');
  Toast.success('标准创建成功');
}

// 导出标准
function handleExport() {
  Modal.hide('modal-export');
  Toast.success('导出成功，文件已下载');
}

// 编辑标准
function handleEditStandard() {
  Modal.hide('modal-edit');
  Toast.success('标准更新成功');
}

// 删除标准
function handleDeleteStandard() {
  ConfirmDialog.show({
    title: '确认删除',
    message: '确定要删除这个标准吗？此操作不可撤销。',
    onConfirm: function() {
      Toast.success('删除成功');
    }
  });
}

// 初始化分页
document.addEventListener('DOMContentLoaded', function() {
  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: mockData,
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderRow
  });
});
</script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/search-helper.js"></script>
<script src="js/typography.js"></script>
</body>
