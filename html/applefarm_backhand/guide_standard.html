<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 农事标准</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .module-card {
    transition:all 0.2s ease;
  }
  .module-card:hover {
    background:var(--bg-hover);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="guide" data-active-submenu="guide-standard">

<!-- ===== 整体布局容器 ===== -->
<div class="app-layout">

  <!-- ===== 侧边栏 ===== -->
  <!-- 移动端遮罩层 -->
  <!-- ===== 主内容区 ===== -->
  <div class="main-wrapper">

    <!-- 顶栏 -->
    <!-- Tab 标签栏 -->
    <div class="tab-bar">
      <!-- Tab 标签由 JS 动态渲染 -->
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
      <div class="content-wrapper">
        <!-- 统计卡片区 -->
        <!-- 统计卡条已按统一规范移除 (原class=patrol-stats) -->

        <!-- 搜索栏区 -->
        <div class="page-section search-section">
          <div class="search-bar">
            <select class="search-select" id="typeSelect">
              <option value="">全部类型</option>
              <option value="fertilizer">施肥</option>
              <option value="pesticide">施药</option>
              <option value="pruning">修剪</option>
              <option value="irrigation">灌溉</option>
              <option value="thinning">疏果</option>
            </select>
            <select class="search-select" id="seasonSelect">
              <option value="">全部季节</option>
              <option value="spring">春季</option>
              <option value="summer">夏季</option>
              <option value="autumn">秋季</option>
              <option value="winter">冬季</option>
              <option value="all">全年</option>
            </select>
            <select class="search-select" id="levelSelect">
              <option value="">全部难度</option>
              <option value="basic">基础</option>
              <option value="intermediate">进阶</option>
              <option value="required">必学</option>
            </select>
            <input type="text" class="search-input" placeholder="搜索作业标准..." id="searchInput">
            
          <div class="search-actions"><button class="jg-btn jg-btn-primary" onclick="handleSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button><button class="jg-btn" onclick="smartReset()">重置</button></div>
          </div>
        </div>

        <!-- 操作按钮区 -->
        <div class="page-section action-bar">
          <button class="jg-btn jg-btn-primary" onclick="Modal.show('modal-add-standard')">新增标准</button>
          <button class="jg-btn" onclick="Modal.show('modal-export')">导出标准</button>
        </div>

        <!-- 数据列表区 -->
        <div class="page-section data-section">
          <table class="data-table">
            <thead>
              <tr>
                <th class="checkbox-col" style="width:60px;">序号</th>
                <th>标准名称</th>
                <th>类型</th>
                <th>季节</th>
                <th>难度等级</th>
                <th>浏览次数</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="dataTableBody">
            </tbody>
          </table>
        </div>
        <div id="pagination-container">
        </div>
      </div>

    </div>
  </main>
</div>

<!-- 新增标准模态框 -->
<div id="modal-add-standard" class="modal-overlay">
  <div class="modal-box" style="max-width:600px;">
    <div class="modal-header">
      <h3 class="modal-title">新增作业标准</h3>
      <button class="modal-close">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4L12 12M12 4L4 12"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="form-add-standard">
        <div class="form-row">
          <div class="form-item">
            <label>标准名称</label>
            <input type="text" class="form-input" placeholder="请输入标准名称">
          </div>
          <div class="form-item">
            <label>类型</label>
            <select class="form-select">
              <option value="">请选择类型</option>
              <option value="fertilizer">施肥</option>
              <option value="pesticide">防治</option>
              <option value="pruning">修剪</option>
              <option value="irrigation">灌溉</option>
              <option value="thinning">疏果</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>适用季节</label>
            <select class="form-select">
              <option value="">请选择季节</option>
              <option value="spring">春季</option>
              <option value="summer">夏季</option>
              <option value="autumn">秋季</option>
              <option value="winter">冬季</option>
              <option value="all">全年</option>
            </select>
          </div>
          <div class="form-item">
            <label>难度等级</label>
            <select class="form-select">
              <option value="">请选择难度</option>
              <option value="basic">基础</option>
              <option value="intermediate">进阶</option>
              <option value="required">必学</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>标准内容</label>
            <textarea class="form-textarea" placeholder="请输入标准内容"></textarea>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="Modal.hide('modal-add-standard')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="handleAddStandard()">保存</button>
    </div>
  </div>
</div>

<!-- 导出标准模态框 -->
<div id="modal-export" class="modal-overlay">
  <div class="modal-box" style="max-width:420px;">
    <div class="modal-header">
      <h3 class="modal-title">导出作业标准</h3>
      <button class="modal-close">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4L12 12M12 4L4 12"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-item">
          <label>选择导出格式</label>
          <select class="form-select">
            <option value="excel">Excel (.xlsx)</option>
            <option value="pdf">PDF (.pdf)</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-item">
          <label>导出范围</label>
          <div style="display:flex;gap:16px;">
            <label class="checkbox-label">
              <input type="radio" name="exportScope" value="all" checked>
              <span>全部数据</span>
            </label>
            <label class="checkbox-label">
              <input type="radio" name="exportScope" value="selected">
              <span>选中数据</span>
            </label>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="Modal.hide('modal-export')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="handleExport()">导出</button>
    </div>
  </div>
</div>

<!-- 查看详情模态框 -->
<div id="modal-detail" class="modal-overlay">
  <div class="modal-box" style="max-width:500px;">
    <div class="modal-header">
      <h3 class="modal-title">作业标准详情</h3>
      <button class="modal-close">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4L12 12M12 4L4 12"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="detail-grid">
        <div class="detail-item">
          <span class="detail-label">标准名称</span>
          <span class="detail-value">春季施肥作业标准</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">类型</span>
          <span class="detail-value">施肥</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">适用季节</span>
          <span class="detail-value">春季</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">难度等级</span>
          <span class="detail-value"><span class="status-tag warning">必学</span></span>
        </div>
        <div class="detail-item">
          <span class="detail-label">浏览次数</span>
          <span class="detail-value">128</span>
        </div>
        <div class="detail-item" style="grid-column:span 2;">
          <span class="detail-label">标准内容</span>
          <span class="detail-value" style="text-align:left;">春季是苹果树施肥的关键时期，应在萌芽前施入基肥，以有机肥为主，配合适量复合肥。施肥时注意深度和均匀度，避免伤根。</span>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn jg-btn-primary" onclick="Modal.hide('modal-detail')">关闭</button>
    </div>
  </div>
</div>

<!-- 编辑标准模态框 -->
<div id="modal-edit" class="modal-overlay">
  <div class="modal-box" style="max-width:600px;">
    <div class="modal-header">
      <h3 class="modal-title">编辑作业标准</h3>
      <button class="modal-close">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4L12 12M12 4L4 12"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="form-edit-standard">
        <div class="form-row">
          <div class="form-item">
            <label>标准名称</label>
            <input type="text" class="form-input" value="春季施肥作业标准">
          </div>
          <div class="form-item">
            <label>类型</label>
            <select class="form-select">
              <option value="fertilizer" selected>施肥</option>
              <option value="pesticide">防治</option>
              <option value="pruning">修剪</option>
              <option value="irrigation">灌溉</option>
              <option value="thinning">疏果</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>适用季节</label>
            <select class="form-select">
              <option value="spring" selected>春季</option>
              <option value="summer">夏季</option>
              <option value="autumn">秋季</option>
              <option value="winter">冬季</option>
              <option value="all">全年</option>
            </select>
          </div>
          <div class="form-item">
            <label>难度等级</label>
            <select class="form-select">
              <option value="basic">基础</option>
              <option value="intermediate">进阶</option>
              <option value="required" selected>必学</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>标准内容</label>
            <textarea class="form-textarea">春季是苹果树施肥的关键时期，应在萌芽前施入基肥，以有机肥为主，配合适量复合肥。施肥时注意深度和均匀度，避免伤根。</textarea>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="Modal.hide('modal-edit')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="handleEditStandard()">保存</button>
    </div>
  </div>
</div>

<!-- 引入交互脚本 -->
<script src="js/common-functions.js"></script>
<script>
// Mock数据 - 23条农事标准
const mockData = [
  { id: 'STD-001', name: '春季施肥作业标准', type: '施肥', season: '春季', level: 'required', levelName: '必学', views: 128 },
  { id: 'STD-002', name: '病虫害防治指南', type: '防治', season: '全年', level: 'required', levelName: '必学', views: 256 },
  { id: 'STD-003', name: '苹果树修剪技术规范', type: '修剪', season: '冬季', level: 'intermediate', levelName: '进阶', views: 189 },
  { id: 'STD-004', name: '灌溉管理作业标准', type: '灌溉', season: '夏季', level: 'basic', levelName: '基础', views: 95 },
  { id: 'STD-005', name: '疏花疏果操作规范', type: '管理', season: '春季', level: 'intermediate', levelName: '进阶', views: 142 },
  { id: 'STD-006', name: '套袋技术标准', type: '管理', season: '夏季', level: 'basic', levelName: '基础', views: 78 },
  { id: 'STD-007', name: '秋季施肥作业标准', type: '施肥', season: '秋季', level: 'required', levelName: '必学', views: 156 },
  { id: 'STD-008', name: '冬季清园作业规范', type: '管理', season: '冬季', level: 'basic', levelName: '基础', views: 88 },
  { id: 'STD-009', name: '苹果采收作业标准', type: '采收', season: '秋季', level: 'required', levelName: '必学', views: 201 },
  { id: 'STD-010', name: '农药使用安全规范', type: '防治', season: '全年', level: 'required', levelName: '必学', views: 312 },
  { id: 'STD-011', name: '果树嫁接技术标准', type: '繁殖', season: '春季', level: 'intermediate', levelName: '进阶', views: 167 },
  { id: 'STD-012', name: '土壤改良作业规范', type: '管理', season: '秋季', level: 'basic', levelName: '基础', views: 92 },
  { id: 'STD-013', name: '果园排水管理标准', type: '管理', season: '夏季', level: 'basic', levelName: '基础', views: 65 },
  { id: 'STD-014', name: '苹果分级包装标准', type: '采收', season: '秋季', level: 'intermediate', levelName: '进阶', views: 178 },
  { id: 'STD-015', name: '果园除草作业规范', type: '管理', season: '全年', level: 'basic', levelName: '基础', views: 54 },
  { id: 'STD-016', name: '苹果树病虫害识别手册', type: '防治', season: '全年', level: 'required', levelName: '必学', views: 289 },
  { id: 'STD-017', name: '果园施肥量计算标准', type: '施肥', season: '全年', level: 'intermediate', levelName: '进阶', views: 134 },
  { id: 'STD-018', name: '苹果树整形修剪规范', type: '修剪', season: '冬季', level: 'required', levelName: '必学', views: 223 },
  { id: 'STD-019', name: '果园防霜冻作业标准', type: '管理', season: '春季', level: 'intermediate', levelName: '进阶', views: 98 },
  { id: 'STD-020', name: '苹果贮藏保鲜标准', type: '采收', season: '秋季', level: 'intermediate', levelName: '进阶', views: 156 },
  { id: 'STD-021', name: '果园有机肥施用规范', type: '施肥', season: '秋季', level: 'basic', levelName: '基础', views: 87 },
  { id: 'STD-022', name: '苹果树花果管理标准', type: '管理', season: '春季', level: 'intermediate', levelName: '进阶', views: 145 },
  { id: 'STD-023', name: '果园病虫害综合防治技术', type: '防治', season: '全年', level: 'required', levelName: '必学', views: 267 }
];

// 获取难度标签
function getLevelTag(level) {
  const levelMap = {
    'required': '<span class="status-tag warning">必学</span>',
    'intermediate': '<span class="status-tag done">进阶</span>',
    'basic': '<span class="status-tag normal">基础</span>'
  };
  return levelMap[level] || levelMap['basic'];
}

// 渲染表格行
function renderRow(item, index) {
  return `<tr>
    <td class="checkbox-col">${index + 1}</td>
    <td><strong>${item.name}</strong></td>
    <td>${item.type}</td>
    <td>${item.season}</td>
    <td>${getLevelTag(item.level)}</td>
    <td>${item.views}</td>
    <td>
      <div class="action-btns">
        <button class="action-btn detail" onclick="Modal.show('modal-detail')">查看</button>
        <button class="action-btn edit" onclick="Modal.show('modal-edit')">编辑</button>
        <button class="action-btn delete" onclick="handleDeleteStandard()">删除</button>
      </div>
    </td>
  </tr>`;
}

// 搜索功能
function handleSearch() {
  const keyword = document.getElementById('searchInput').value;

  var filteredData = mockData.filter(item => {
    if (keyword && !item.name.includes(keyword) && !item.type.includes(keyword)) return false;
    return true;
  });

  Pagination.updateData(filteredData);
  Toast.info('找到 ' + filteredData.length + ' 条记录');
}

// 新增标准
function handleAddStandard() {
  Modal.hide('modal-add-standard');
  Toast.success('作业标准创建成功');
}

// 导出标准
function handleExport() {
  Modal.hide('modal-export');
  Toast.success('导出成功，文件已下载');
}

// 编辑标准
function handleEditStandard() {
  Modal.hide('modal-edit');
  Toast.success('作业标准更新成功');
}

// 删除标准
function handleDeleteStandard() {
  ConfirmDialog.show({
    title: '确认删除',
    message: '确定要删除这个作业标准吗？此操作不可撤销。',
    onConfirm: function() {
      Toast.success('删除成功');
    }
  });
}

// 初始化分页
document.addEventListener('DOMContentLoaded', function() {
  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: mockData,
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderRow
  });
});
</script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
  <script src="js/search-helper.js"></script>

</body>
