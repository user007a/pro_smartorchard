<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 农事标准</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .module-card { transition:all 0.2s ease; }
  .module-card:hover { background:var(--bg-hover); transform:translateY(-2px); box-shadow:var(--shadow-md); }
  /* 分页栏样式（与农事计划一致） */
  #pagination-container { padding:12px 16px; }
  .data-table { width:100%; border-collapse:collapse; }
  .data-table th { white-space:nowrap; }
  .std-process { font-size:12px; color:var(--text-secondary); }
  .std-metric { font-size:12px; color:var(--text-secondary); line-height:1.5; }
  .ref-count { color:var(--primary-500); font-weight:600; }
  .ref-zero { color:var(--text-tertiary); }
</style>
<style id="standalone-fix">
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="guide" data-active-submenu="guide-standard">

<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <div class="content-wrapper">

        <!-- 搜索栏区 -->
        <div class="page-section search-section">
          <div class="search-bar">
            <select class="search-select" id="levelSelect">
              <option value="">全部级别</option>
              <option value="国家标准">国家标准</option>
              <option value="地方标准">地方标准</option>
              <option value="企业标准">企业标准</option>
            </select>
            <select class="search-select" id="typeSelect">
              <option value="">全部类型</option>
              <option value="施肥">施肥</option>
              <option value="修剪">修剪</option>
              <option value="疏花疏果">疏花疏果</option>
              <option value="套袋">套袋</option>
              <option value="病虫害防治">病虫害防治</option>
              <option value="灌溉">灌溉</option>
              <option value="采收">采收</option>
            </select>
            <select class="search-select" id="statusSelect">
              <option value="">全部状态</option>
              <option value="现行">现行</option>
              <option value="试行">试行</option>
              <option value="废止">废止</option>
            </select>
            <input type="text" class="search-input" placeholder="搜索标准名称..." id="searchInput">
            <div class="search-actions">
              <button class="jg-btn jg-btn-primary" onclick="handleSearch()">搜索</button>
              <button class="jg-btn" onclick="smartReset()">重置</button>
            </div>
          </div>
        </div>

        <!-- 操作按钮区 -->
        <div class="page-section action-bar">
          <button class="jg-btn jg-btn-primary" onclick="Modal.show('modal-add-standard')">新增标准</button>
          <button class="jg-btn" onclick="Modal.show('modal-export')">导出标准</button>
        </div>

        <!-- 数据列表区 -->
        <div class="page-section data-section">
          <div class="data-table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width:56px;">序号</th>
                  <th style="width:150px;">标准编号</th>
                  <th>标准名称</th>
                  <th style="width:92px;">级别</th>
                  <th style="width:100px;">农事类型</th>
                  <th style="width:88px;">适用品种</th>
                  <th style="width:150px;">关键工序</th>
                  <th style="width:180px;">用量 / 验收指标</th>
                  <th style="width:104px;">生效日期</th>
                  <th style="width:70px;">状态</th>
                  <th style="width:74px;">被引用</th>
                  <th style="width:150px;">操作</th>
                </tr>
              </thead>
              <tbody id="dataTableBody"></tbody>
            </table>
          </div>
          <div id="pagination-container"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- 引入交互脚本 -->
<script src="js/shared/production-store.js"></script>
<script src="js/common-functions.js"></script>
<script>
// 农事标准 - 共享数据层驱动
var PS = window.ProductionStore;

var currentList = [];

// 被引用次数：按当前计划实时统计
function refCountOf(std) {
  return PS.plans().filter(function (p) { return p.standardId === std.id; }).length;
}

function levelTag(level) {
  var cls = level === '国家标准' ? 'done' : (level === '地方标准' ? 'warning' : 'normal');
  return '<span class="status-tag ' + cls + '">' + (level || '—') + '</span>';
}

function stdStatusTag(status) {
  var map = {
    '现行': '<span class="status-tag done">现行</span>',
    '试行': '<span class="status-tag warning">试行</span>',
    '废止': '<span class="status-tag normal">废止</span>'
  };
  return map[status] || map['现行'];
}

function renderRow(item, index) {
  var refs = refCountOf(item);
  return '<tr>' +
    '<td>' + (index + 1) + '</td>' +
    '<td>' + (item.code || '—') + '</td>' +
    '<td><strong>' + (item.name || '') + '</strong></td>' +
    '<td>' + levelTag(item.level) + '</td>' +
    '<td>' + (item.type || '—') + '</td>' +
    '<td>' + (item.variety || '—') + '</td>' +
    '<td class="std-process">' + (item.process || '—') + '</td>' +
    '<td class="std-metric">' + (item.dosage || '—') + ' / ' + (item.accept || '—') + '</td>' +
    '<td>' + (item.date || '—') + '</td>' +
    '<td>' + stdStatusTag(item.status) + '</td>' +
    '<td>' + (refs ? '<span class="ref-count">' + refs + ' 个计划</span>' : '<span class="ref-zero">未引用</span>') + '</td>' +
    '<td>' +
      '<div class="action-btns">' +
        '<button class="action-btn detail" onclick="showDetail(\'' + item.id + '\')">查看</button>' +
        '<button class="action-btn edit" onclick="showEdit(\'' + item.id + '\')">编辑</button>' +
        '<button class="action-btn delete" onclick="handleDeleteStandard(\'' + item.id + '\')">删除</button>' +
      '</div>' +
    '</td>' +
  '</tr>';
}

function applyFilter() {
  var keyword = (document.getElementById('searchInput').value || '').trim();
  var level = document.getElementById('levelSelect').value;
  var type = document.getElementById('typeSelect').value;
  var status = document.getElementById('statusSelect').value;
  var list = currentList.filter(function (item) {
    if (level && item.level !== level) return false;
    if (type && item.type !== type) return false;
    if (status && item.status !== status) return false;
    if (keyword && (item.name || '').indexOf(keyword) < 0 && (item.code || '').indexOf(keyword) < 0) return false;
    return true;
  });
  Pagination.updateData(list);
  return list;
}

function refresh() {
  currentList = PS.standards().slice().sort(function (a, b) { return String(a.id).localeCompare(String(b.id)); });
  applyFilter();
}

function handleSearch() {
  var list = applyFilter();
  Toast.info('找到 ' + list.length + ' 条标准');
}

function smartReset() {
  document.getElementById('searchInput').value = '';
  document.getElementById('levelSelect').value = '';
  document.getElementById('typeSelect').value = '';
  document.getElementById('statusSelect').value = '';
  applyFilter();
  Toast.info('已重置搜索条件');
}

function detailItem(label, value) {
  return '<div class="detail-item"><span class="detail-label">' + label +
    '</span><span class="detail-value">' + (value || '—') + '</span></div>';
}

function showDetail(id) {
  var s = PS.get('standards', id);
  if (!s) { Toast.error('标准不存在'); return; }
  document.getElementById('standardDetailBody').innerHTML =
    detailItem('标准编号', s.code) +
    detailItem('标准名称', s.name) +
    detailItem('标准级别', s.level) +
    detailItem('农事类型', s.type) +
    detailItem('适用品种', s.variety) +
    detailItem('生效日期', s.date) +
    detailItem('关键工序', s.process) +
    detailItem('用量', s.dosage) +
    detailItem('验收指标', s.accept) +
    detailItem('被引用', refCountOf(s) + ' 个计划') +
    detailItem('状态', stdStatusTag(s.status));
  Modal.show('modal-detail');
}

function showEdit(id) {
  var s = PS.get('standards', id);
  if (!s) { Toast.error('标准不存在'); return; }
  document.getElementById('edit-std-code').value = s.code || '';
  document.getElementById('edit-std-name').value = s.name || '';
  document.getElementById('edit-std-level').value = s.level || '国家标准';
  document.getElementById('edit-std-type').value = s.type || '施肥';
  document.getElementById('edit-std-variety').value = s.variety || '通用';
  document.getElementById('edit-std-date').value = s.date || '';
  document.getElementById('edit-std-process').value = s.process || '';
  document.getElementById('edit-std-dosage').value = s.dosage || '';
  document.getElementById('edit-std-accept').value = s.accept || '';
  document.getElementById('edit-std-status').value = s.status || '现行';
  document.getElementById('modal-edit').setAttribute('data-id', id);
  Modal.show('modal-edit');
}

function handleAddStandard() {
  var code = document.getElementById('std-code').value.trim();
  var name = document.getElementById('std-name').value.trim();
  var level = document.getElementById('std-level').value;
  var type = document.getElementById('std-type').value;
  var std = {
    id: PS.nextId('standards'),
    code: code,
    name: name,
    level: level,
    type: type,
    variety: document.getElementById('std-variety').value || '通用',
    date: document.getElementById('std-date').value || PS.today(),
    status: document.getElementById('std-status').value,
    process: document.getElementById('std-process').value.trim() || '按标准作业流程执行',
    dosage: document.getElementById('std-dosage').value.trim() || '—',
    accept: document.getElementById('std-accept').value.trim() || '—',
    refCount: 0
  };
  var invalid = PS.validate.standard(std);
  if (invalid) { Toast.error(invalid); return; }
  PS.upsert('standards', std);
  Modal.hide('modal-add-standard');
  Toast.success('标准创建成功');
  refresh();
}

function handleEditStandard() {
  var id = document.getElementById('modal-edit').getAttribute('data-id');
  var old = PS.get('standards', id);
  if (!old) { Toast.error('标准不存在'); return; }
  var code = document.getElementById('edit-std-code').value.trim();
  var name = document.getElementById('edit-std-name').value.trim();
  var patch = {
    code: code,
    name: name,
    level: document.getElementById('edit-std-level').value,
    type: document.getElementById('edit-std-type').value,
    variety: document.getElementById('edit-std-variety').value,
    date: document.getElementById('edit-std-date').value,
    process: document.getElementById('edit-std-process').value.trim() || old.process,
    dosage: document.getElementById('edit-std-dosage').value.trim() || old.dosage,
    accept: document.getElementById('edit-std-accept').value.trim() || old.accept,
    status: document.getElementById('edit-std-status').value
  };
  var invalid = PS.validate.standard(Object.assign({}, old, patch));
  if (invalid) { Toast.error(invalid); return; }
  PS.upsert('standards', Object.assign({ id: old.id }, patch));
  Modal.hide('modal-edit');
  Toast.success('标准更新成功');
  refresh();
}

function handleDeleteStandard(id) {
  var s = PS.get('standards', id);
  if (!s) { Toast.error('标准不存在'); return; }
  var refs = refCountOf(s);
  if (refs > 0) { Toast.error('该标准已被 ' + refs + ' 个计划引用，无法删除'); return; }
  ConfirmDialog.show({
    title: '确认删除',
    message: '确定要删除标准「' + s.name + '」吗？此操作不可撤销。',
    onConfirm: function () {
      PS.remove('standards', id);
      Toast.success('删除成功');
      refresh();
    }
  });
}

function handleExport() {
  var rows = [['标准编号', '标准名称', '级别', '农事类型', '适用品种', '关键工序', '用量', '验收指标', '生效日期', '状态', '被引用']];
  currentList.forEach(function (s) {
    rows.push([s.code, s.name, s.level, s.type, s.variety, s.process, s.dosage, s.accept, s.date, s.status, refCountOf(s)]);
  });
  var csv = rows.map(function (r) {
    return r.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '农事标准_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  Modal.hide('modal-export');
  Toast.success('导出成功，共 ' + currentList.length + ' 条标准');
}

document.addEventListener('DOMContentLoaded', function () {
  currentList = PS.standards().slice().sort(function (a, b) { return String(a.id).localeCompare(String(b.id)); });
  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: currentList,
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderRow
  });
  PS.subscribe(function () { refresh(); });
});
</script>
