<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
  :root {
    --bg-primary:#f0faf2;
    --bg-secondary:#e8f5ec;
    --bg-card:#ffffff;
    --accent-green:#1890ff;
    --accent-light:#4ade80;
    --accent-teal:#14b8a6;
    --text-primary:#1a2e1a;
    --text-secondary:#6b7b6b;
    --border-light:#d4e8d9;
  }
  body { background:var(--bg-primary); }
  .blockchain-card {
    background:var(--bg-card);
    border-radius:16px;
    padding:20px;
    border:1px solid var(--border-light);
  }
  .block-info {
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
    margin-top:12px;
  }
  .block-item { text-align:center; }
  .item-label { font-size:12px; color:var(--text-secondary); margin-bottom:4px; }
  .item-value { font-size:18px; font-weight:600; color:var(--text-primary); }
  .modal-overlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(24,144,255,0.3);
    backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    z-index:1000; opacity:0; visibility:hidden; transition:all 0.3s ease;
  }
  .modal-overlay.active { opacity:1; visibility:visible; }
  .modal {
    background:var(--bg-card); border-radius:16px;
    width:520px; max-width:90vw; max-height:90vh;
    overflow:hidden; transform:scale(0.9); transition:all 0.3s ease;
  }
  .modal-overlay.active .modal { transform:scale(1); }
  .modal-header {
    padding:20px 24px; border-bottom:1px solid var(--border-light);
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(135deg, var(--accent-green) 0%, #1a8a3a 100%);
    color:var(--text-inverse);
  }
  .modal-header h3 { font-size:18px; font-weight:600; margin:0; }
  .modal-close {
    width:32px; height:32px; border-radius:50%;
    background:rgba(255,255,255,0.2); border:none; color:var(--text-inverse);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all 0.2s;
  }
  .modal-close:hover { background:rgba(255,255,255,0.3); }
  .modal-body { padding:24px; max-height:60vh; overflow-y:auto; }
  .modal-footer {
    padding:16px 24px; border-top:1px solid var(--border-light);
    display:flex; justify-content:flex-end; gap:12px;
  }
  .detail-grid {
    display:grid; grid-template-columns:120px 1fr;
    gap:12px; padding:10px 0; border-bottom:1px solid var(--border-light);
  }
  .detail-grid:last-child { border-bottom:none; }
  .detail-label { color:var(--text-secondary); font-size:14px; }
  .detail-value { color:var(--text-primary); font-size:14px; font-weight:500; }
  .verify-result {
    text-align:center; padding:24px; background:var(--bg-secondary);
    border-radius:12px; margin:16px 0;
  }
  .verify-icon {
    width:64px; height:64px; border-radius:50%;
    background:var(--bg-card); margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center;
  }
  .verify-icon.success { color:var(--accent-green); }
  .verify-icon.error { color:var(--error); }
  .verify-title { font-size:18px; font-weight:600; color:var(--text-primary); margin-bottom:8px; }
  .verify-desc { font-size:14px; color:var(--text-secondary); }
  .toast {
    position:fixed; top:20px; right:20px; padding:14px 20px;
    background:var(--bg-card); border-radius:10px;
    box-shadow:0 4px 20px rgba(24,144,255,0.2);
    display:flex; align-items:center; gap:12px; z-index:2000;
    transform:translateX(120%); transition:all 0.3s ease;
  }
  .toast.show { transform:translateX(0); }
  .toast.success { border-left:4px solid var(--accent-green); }
  .toast-icon {
    width:24px; height:24px; border-radius:50%;
    background:var(--bg-secondary); display:flex; align-items:center; justify-content:center;
    color:var(--accent-green);
  }
  .data-table { background:var(--bg-card); }
</style>

<script>
// 真实 Hash：使用简化 SHA-256 哈希算法对追溯码+时间戳生成
function sha256Hex(s) {
  // 简化版 FNV-1a + SHA-256 风格摘要（仅前端演示用途）
  function ror(x, n) { return (x >>> n) | (x << (32 - n)); }
  var h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
  var h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  var bytes = []; for (var i = 0; i < s.length; i++) bytes.push(s.charCodeAt(i) & 0xff);
  bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
  var bitLen = s.length * 8;
  bytes.push((bitLen >>> 56) & 0xff); bytes.push((bitLen >>> 48) & 0xff);
  bytes.push((bitLen >>> 40) & 0xff); bytes.push((bitLen >>> 32) & 0xff);
  bytes.push((bitLen >>> 24) & 0xff); bytes.push((bitLen >>> 16) & 0xff);
  bytes.push((bitLen >>> 8) & 0xff); bytes.push(bitLen & 0xff);
  for (var off = 0; off < bytes.length; off += 64) {
    var w = []; for (var k = 0; k < 16; k++) w[k] = (bytes[off+k*4] << 24) | (bytes[off+k*4+1] << 16) | (bytes[off+k*4+2] << 8) | bytes[off+k*4+3];
    for (var j = 16; j < 64; j++) {
      var s0 = ror(w[j-15], 7) ^ ror(w[j-15], 18) ^ (w[j-15] >>> 3);
      var s1 = ror(w[j-2], 17) ^ ror(w[j-2], 19) ^ (w[j-2] >>> 10);
      w[j] = (w[j-16] + s0 + w[j-7] + s1) | 0;
    }
    var a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,hh=h7;
    for (var j2 = 0; j2 < 64; j2++) {
      var S1 = ror(e,6) ^ ror(e,11) ^ ror(e,25);
      var ch = (e & f) ^ (~e & g);
      var t1 = (hh + S1 + ch + [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2][j2] + w[j2]) | 0;
      var S0 = ror(a,2) ^ ror(a,13) ^ ror(a,22);
      var mj = (a & b) ^ (a & c) ^ (b & c);
      var t2 = (S0 + mj) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0;
    h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + hh) | 0;
  }
  function pad(n) { return (n < 0 ? n + 0x100000000 : n).toString(16).padStart(8, '0'); }
  return pad(h0) + pad(h1) + pad(h2) + pad(h3) + pad(h4) + pad(h5) + pad(h6) + pad(h7);
}
function realHash(code, time) {
  var seed = (code || '') + '|' + (time || '');
  return '0x' + sha256Hex(seed).substring(0, 60);
}
function mockDataGen() {
  var codes = [
    ['SNZG-20260901-0001','2026-09-01 18:30:00','passed'],
    ['SNZG-20260901-0002','2026-09-01 18:45:00','passed'],
    ['SNZG-20260902-0003','2026-09-02 17:20:00','passed'],
    ['SNZG-20260902-0004','2026-09-02 17:35:00','passed'],
    ['SNZG-20260903-0005','2026-09-03 19:10:00','failed'],
    ['SNZG-20260903-0006','2026-09-03 19:22:00','passed'],
    ['SNZG-20260904-0007','2026-09-04 18:50:00','passed'],
    ['SNZG-20260905-0008','2026-09-05 18:15:00','passed'],
    ['SNZG-20260906-0009','2026-09-06 17:58:00','passed'],
    ['SNZG-20260907-0010','2026-09-07 19:30:00','passed'],
    ['SNZG-20260908-0011','2026-09-08 18:40:00','passed'],
    ['SNZG-20260909-0012','2026-09-09 18:05:00','passed'],
    ['SNZG-20260910-0013','2026-09-10 18:25:00','failed'],
    ['SNZG-20260911-0014','2026-09-11 19:15:00','passed'],
    ['SNZG-20260912-0015','2026-09-12 19:00:00','passed'],
    ['SNZG-20260913-0016','2026-09-13 17:45:00','passed'],
    ['SNZG-20260914-0017','2026-09-14 18:55:00','passed'],
    ['SNZG-20260915-0018','2026-09-15 19:25:00','passed'],
    ['SNZG-20260916-0019','2026-09-16 17:30:00','passed'],
    ['SNZG-20260917-0020','2026-09-17 18:35:00','passed'],
    ['SNZG-20260918-0021','2026-09-18 19:40:00','failed'],
    ['SNZG-20260919-0022','2026-09-19 18:20:00','pending'],
    ['SNZG-20260920-0023','2026-09-20 17:50:00','pending']
  ];
  return codes.map(function(r, i){
    return { code: r[0], hash: realHash(r[0], r[1]), block: 1847301 + i, time: r[1], status: r[2] };
  });
}
var mockData = mockDataGen();

// 验证状态说明：批次检测报告已过期时，对应存证校验不通过
const VERIFY_TEXT = { passed: '已通过', failed: '未通过', pending: '验证中' };

let currentDetailCode = '';

function verifyTagClass(status) {
  return status === 'passed' ? 'active' : status === 'failed' ? 'error' : 'warning';
}

/* ---------- 分页组件（与农事计划、批次管理一致） ---------- */
const Pagination = {
  currentPage: 1, pageSize: 10, filteredData: [],
  containerId: 'pagination-container', tbodyId: 'dataTableBody', renderRow: null,
  init: function(options) {
    this.currentPage = options.currentPage || 1;
    this.pageSize = options.pageSize || 10;
    this.filteredData = options.data || [];
    this.containerId = options.containerId || 'pagination-container';
    this.tbodyId = options.tbodyId || 'dataTableBody';
    this.renderRow = options.renderRow || null;
    this.render();
  },
  renderTable: function() {
    const tbody = document.getElementById(this.tbodyId);
    if (!tbody || !this.renderRow) return;
    const start = (this.currentPage - 1) * this.pageSize;
    const pageData = this.filteredData.slice(start, start + this.pageSize);
    tbody.innerHTML = pageData.map((item, i) => this.renderRow(item, start + i + 1)).join('');
  },
  render: function() {
    const container = document.getElementById(this.containerId);
    if (!container) return;
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    let html = '<div class="pagination">';
    html += `<button class="page-btn ${this.currentPage <= 1 ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage - 1})">‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= this.currentPage - 1 && i <= this.currentPage + 1)) {
        html += `<button class="page-btn ${i === this.currentPage ? 'active' : ''}" onclick="Pagination.goToPage(${i})">${i}</button>`;
      } else if (i === this.currentPage - 2 || i === this.currentPage + 2) {
        html += '<span class="page-ellipsis" style="padding:0 8px;color:#6b7b6b;">...</span>';
      }
    }
    html += `<button class="page-btn ${this.currentPage >= totalPages ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage + 1})">›</button>`;
    html += `<span style="margin-left:16px;font-size:13px;color:#6b7b6b;">第 ${this.currentPage} 页/共 ${totalPages} 页，共 ${this.filteredData.length} 条记录</span>`;
    html += '</div>';
    container.innerHTML = html;
    this.renderTable();
  },
  goToPage: function(page) {
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    if (page < 1 || page > totalPages) return;
    this.currentPage = page;
    this.render();
  },
  updateData: function(data) {
    this.filteredData = data;
    this.currentPage = 1;
    this.render();
  }
};

function renderChainRow(item, seq) {
  return `
    <tr data-id="${item.code}">
      <td><strong>${item.code}</strong></td>
      <td style="font-family:monospace; color:var(--text-secondary);">${item.hash}</td>
      <td>${item.block.toLocaleString()}</td>
      <td>${item.time}</td>
      <td><span class="status-tag ${verifyTagClass(item.status)}">${VERIFY_TEXT[item.status]}</span></td>
      <td>
        <div class="action-btns">
          <button class="action-btn detail" onclick="viewDetail('${item.code}')">详情</button>
          <button class="action-btn qrcode" onclick="verifyRecord('${item.code}')">验证</button>
        </div>
      </td>
    </tr>
  `;
}

function searchData() {
  const code = document.getElementById('traceCodeInput').value.trim().toLowerCase();
  const hash = document.getElementById('txHashInput').value.trim().toLowerCase();
  const status = document.getElementById('statusSelect').value;

  const filtered = mockData.filter(item => {
    if (code && !item.code.toLowerCase().includes(code)) return false;
    if (hash && !item.hash.toLowerCase().includes(hash)) return false;
    if (status && item.status !== status) return false;
    return true;
  });

  Pagination.updateData(filtered);
  showToast(`找到 ${filtered.length} 条记录`);
}

function resetSearch() {
  document.getElementById('traceCodeInput').value = '';
  document.getElementById('txHashInput').value = '';
  document.getElementById('statusSelect').value = '';
  Pagination.updateData(mockData);
  showToast('已重置筛选条件');
}

function viewDetail(code) {
  currentDetailCode = code;
  const item = mockData.find(d => d.code === code);
  if (!item) return;
  
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-grid"><span class="detail-label">溯源码</span><span class="detail-value">${item.code}</span></div>
    <div class="detail-grid"><span class="detail-label">交易哈希</span><span class="detail-value" style="font-family:monospace;">${item.hash}</span></div>
    <div class="detail-grid"><span class="detail-label">区块高度</span><span class="detail-value">${item.block.toLocaleString()}</span></div>
    <div class="detail-grid"><span class="detail-label">上链时间</span><span class="detail-value">${item.time}</span></div>
    <div class="detail-grid"><span class="detail-label">验证状态</span><span class="detail-value"><span class="status-tag ${verifyTagClass(item.status)}">${VERIFY_TEXT[item.status]}</span></span></div>
    <div class="detail-grid"><span class="detail-label">数据摘要</span><span class="detail-value" style="font-family:monospace; font-size:12px;">SHA256: ${item.hash.replace('0x', '')}</span></div>
  `;
  openModal('detailModal');
}

function verifyRecord(code) {
  if (code) currentDetailCode = code;
  const item = mockData.find(d => d.code === currentDetailCode);
  if (!item) return;
  
  closeModal('detailModal');
  
  const isPassed = item.status === 'passed';
  document.getElementById('verifyContent').innerHTML = `
    <div class="verify-result">
      <div class="verify-icon ${isPassed ? 'success' : 'error'}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;">
          ${isPassed ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>' : '<circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6"/><path d="M9 9l6 6"/>'}
        </svg>
      </div>
      <div class="verify-title">${isPassed ? '验证通过' : '验证失败'}</div>
      <div class="verify-desc">${isPassed ? '该溯源信息已在区块链上存证，验证通过。' : '该溯源信息验证失败，数据可能被篡改或不存在。'}</div>
    </div>
    <div class="detail-grid"><span class="detail-label">溯源码</span><span class="detail-value">${item.code}</span></div>
    <div class="detail-grid"><span class="detail-label">交易哈希</span><span class="detail-value" style="font-family:monospace;">${item.hash}</span></div>
    <div class="detail-grid"><span class="detail-label">区块高度</span><span class="detail-value">${item.block.toLocaleString()}</span></div>
    <div class="detail-grid"><span class="detail-label">验证时间</span><span class="detail-value">${new Date().toLocaleString()}</span></div>
  `;
  openModal('verifyModal');
}

function openModal(id) {
  document.getElementById(id).classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
  document.body.style.overflow = '';
}

function showToast(message) {
  const toast = document.getElementById('toast');
  document.getElementById('toastMessage').textContent = message;
  toast.className = 'toast success';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// 页面初始化
document.addEventListener('DOMContentLoaded', function() {
  // 最新区块信息取自当前存证数据
  const latest = mockData.reduce((a, b) => (b.block > a.block ? b : a), mockData[0]);
  document.getElementById('latestBlock').textContent = '#' + latest.block.toLocaleString();
  document.getElementById('latestTxCount').textContent = mockData.length;
  document.getElementById('latestTime').textContent = latest.time;

  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: mockData,
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderChainRow
  });

  // 若 URL 带 ?code=xxx，自动打开对应溯源码的详情弹窗（溯源编码页"上链"入口）
  try {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code && typeof viewDetail === 'function') {
      viewDetail(code);
    }
  } catch (e) { /* 忽略解析错误 */ }
});

// 点击遮罩关闭弹窗
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeModal(overlay.id);
  });
});

// ESC 关闭弹窗
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.active').forEach(o => closeModal(o.id));
  }
});
</script>
