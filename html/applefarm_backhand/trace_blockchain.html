<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 溯源区块链</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  :root {
    --bg-primary:#f0faf2;
    --bg-secondary:#e8f5ec;
    --bg-card:#ffffff;
    --accent-green:#1890ff;
    --accent-light:#4ade80;
    --accent-teal:#14b8a6;
    --text-primary:#1a2e1a;
    --text-secondary:#6b7b6b;
    --border-light:#d4e8d9;
  }
  body { background:var(--bg-primary); }
  .blockchain-card {
    background:var(--bg-card);
    border-radius:16px;
    padding:20px;
    border:1px solid var(--border-light);
  }
  .block-info {
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
    margin-top:12px;
  }
  .block-item { text-align:center; }
  .item-label { font-size:12px; color:var(--text-secondary); margin-bottom:4px; }
  .item-value { font-size:18px; font-weight:600; color:var(--text-primary); }
  .modal-overlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(24,144,255,0.3);
    backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    z-index:1000; opacity:0; visibility:hidden; transition:all 0.3s ease;
  }
  .modal-overlay.active { opacity:1; visibility:visible; }
  .modal {
    background:var(--bg-card); border-radius:16px;
    width:520px; max-width:90vw; max-height:90vh;
    overflow:hidden; transform:scale(0.9); transition:all 0.3s ease;
  }
  .modal-overlay.active .modal { transform:scale(1); }
  .modal-header {
    padding:20px 24px; border-bottom:1px solid var(--border-light);
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(135deg, var(--accent-green) 0%, #1a8a3a 100%);
    color:var(--text-inverse);
  }
  .modal-header h3 { font-size:18px; font-weight:600; margin:0; }
  .modal-close {
    width:32px; height:32px; border-radius:50%;
    background:rgba(255,255,255,0.2); border:none; color:var(--text-inverse);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all 0.2s;
  }
  .modal-close:hover { background:rgba(255,255,255,0.3); }
  .modal-body { padding:24px; max-height:60vh; overflow-y:auto; }
  .modal-footer {
    padding:16px 24px; border-top:1px solid var(--border-light);
    display:flex; justify-content:flex-end; gap:12px;
  }
  .detail-grid {
    display:grid; grid-template-columns:120px 1fr;
    gap:12px; padding:10px 0; border-bottom:1px solid var(--border-light);
  }
  .detail-grid:last-child { border-bottom:none; }
  .detail-label { color:var(--text-secondary); font-size:14px; }
  .detail-value { color:var(--text-primary); font-size:14px; font-weight:500; }
  .verify-result {
    text-align:center; padding:24px; background:var(--bg-secondary);
    border-radius:12px; margin:16px 0;
  }
  .verify-icon {
    width:64px; height:64px; border-radius:50%;
    background:var(--bg-card); margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center;
  }
  .verify-icon.success { color:var(--accent-green); }
  .verify-icon.error { color:var(--error); }
  .verify-title { font-size:18px; font-weight:600; color:var(--text-primary); margin-bottom:8px; }
  .verify-desc { font-size:14px; color:var(--text-secondary); }
  .toast {
    position:fixed; top:20px; right:20px; padding:14px 20px;
    background:var(--bg-card); border-radius:10px;
    box-shadow:0 4px 20px rgba(24,144,255,0.2);
    display:flex; align-items:center; gap:12px; z-index:2000;
    transform:translateX(120%); transition:all 0.3s ease;
  }
  .toast.show { transform:translateX(0); }
  .toast.success { border-left:4px solid var(--accent-green); }
  .toast-icon {
    width:24px; height:24px; border-radius:50%;
    background:var(--bg-secondary); display:flex; align-items:center; justify-content:center;
    color:var(--accent-green);
  }
  .data-table { background:var(--bg-card); }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="trace" data-active-submenu="trace-blockchain">

<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3L11 11M11 3L3 11"/></svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <div class="content-wrapper">
                <!-- 统计卡条已按统一规范移除 (原class=patrol-stats) -->

        <div class="blockchain-card" style="margin-bottom:20px;">
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;color:var(--accent-green);">
              <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
            </svg>
            <span style="font-weight:600; color:var(--text-primary);">最新区块信息</span>
          </div>
          <div class="block-info">
            <div class="block-item">
              <div class="item-label">区块高度</div>
              <div class="item-value" style="color:var(--accent-green);">#1,847,329</div>
            </div>
            <div class="block-item">
              <div class="item-label">交易数量</div>
              <div class="item-value">1,247</div>
            </div>
            <div class="block-item">
              <div class="item-label">区块时间</div>
              <div class="item-value" style="color:var(--accent-teal);">2026-09-10 15:32:18</div>
            </div>
          </div>
        </div>

        <div class="search-section">
          <div class="search-bar">
            <input type="text" class="search-input" placeholder="输入溯源码..." id="traceCodeInput" style="width:180px;">
            <input type="text" class="search-input" placeholder="输入交易哈希..." id="txHashInput" style="width:200px;">
            <select class="search-select" id="statusSelect" style="width:140px;">
              <option value="">全部状态</option>
              <option value="passed">已通过</option>
              <option value="failed">未通过</option>
              <option value="pending">验证中</option>
            </select>
            
          <div class="search-actions"><button class="jg-btn jg-btn-primary" onclick="searchData()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button><button class="jg-btn" onclick="smartReset()">重置</button></div>
          </div>
        </div>

        <div class="data-section">
          <table class="data-table">
            <thead>
              <tr>
                <th>溯源码</th>
                <th>交易哈希</th>
                <th>区块高度</th>
                <th>上链时间</th>
                <th>验证状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
          </table>
          <div class="pagination" id="paginationContainer"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h3>上链详情</h3>
      <button class="modal-close" onclick="closeModal('detailModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="detailContent"></div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('detailModal')">关闭</button>
      <button class="jg-btn jg-btn-primary" onclick="verifyRecord()">验证</button>
    </div>
  </div>
</div>

<!-- 验证弹窗 -->
<div class="modal-overlay" id="verifyModal">
  <div class="modal">
    <div class="modal-header">
      <h3>验证结果</h3>
      <button class="modal-close" onclick="closeModal('verifyModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="verifyContent"></div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('verifyModal')">关闭</button>
    </div>
  </div>
</div>

<!-- Toast提示 -->
<div class="toast" id="toast">
  <div class="toast-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
  </div>
  <span id="toastMessage">操作成功</span>
</div>

<script>
// Mock数据 - 23条记录
const mockData = [
  { code: 'SNZG-2024-0001', hash: '0x7f8e...3a2b', block: 1847329, time: '2026-09-10 15:32:18', status: 'passed' },
  { code: 'SNZG-2024-0002', hash: '0x8a1c...4d5e', block: 1847328, time: '2026-09-10 14:28:45', status: 'passed' },
  { code: 'SNZG-2024-0003', hash: '0x9b2d...5e6f', block: 1847327, time: '2026-09-10 13:15:32', status: 'passed' },
  { code: 'SNZG-2024-0004', hash: '0xac3e...6f7g', block: 1847326, time: '2026-09-10 12:08:19', status: 'failed' },
  { code: 'SNZG-2024-0005', hash: '0xbd4f...7g8h', block: 1847325, time: '2026-09-10 11:42:56', status: 'passed' },
  { code: 'SNZG-2024-0006', hash: '0xce5g...8h9i', block: 1847324, time: '2026-09-10 10:35:21', status: 'passed' },
  { code: 'SNZG-2024-0007', hash: '0xdf6h...9i0j', block: 1847323, time: '2026-09-10 09:28:43', status: 'pending' },
  { code: 'SNZG-2024-0008', hash: '0xea7i...0j1k', block: 1847322, time: '2026-09-10 08:19:07', status: 'passed' },
  { code: 'SNZG-2024-0009', hash: '0xfb8j...1k2l', block: 1847321, time: '2026-09-09 17:45:29', status: 'passed' },
  { code: 'SNZG-2024-0010', hash: '0xac9k...2l3m', block: 1847320, time: '2026-09-09 16:32:14', status: 'failed' },
  { code: 'SNZG-2024-0011', hash: '0xbd0l...3m4n', block: 1847319, time: '2026-09-09 15:28:51', status: 'passed' },
  { code: 'SNZG-2024-0012', hash: '0xce1m...4n5o', block: 1847318, time: '2026-09-09 14:15:38', status: 'passed' },
  { code: 'SNZG-2024-0013', hash: '0xdf2n...5o6p', block: 1847317, time: '2026-09-09 13:08:22', status: 'passed' },
  { code: 'SNZG-2024-0014', hash: '0xea3o...6p7q', block: 1847316, time: '2026-09-09 12:45:09', status: 'passed' },
  { code: 'SNZG-2024-0015', hash: '0xfb4p...7q8r', block: 1847315, time: '2026-09-09 11:32:47', status: 'pending' },
  { code: 'SNZG-2024-0016', hash: '0xac5q...8r9s', block: 1847314, time: '2026-09-09 10:28:35', status: 'passed' },
  { code: 'SNZG-2024-0017', hash: '0xbd6r...9s0t', block: 1847313, time: '2026-09-09 09:15:19', status: 'passed' },
  { code: 'SNZG-2024-0018', hash: '0xce7s...0t1u', block: 1847312, time: '2026-09-08 18:42:58', status: 'passed' },
  { code: 'SNZG-2024-0019', hash: '0xdf8t...1u2v', block: 1847311, time: '2026-09-08 17:35:24', status: 'failed' },
  { code: 'SNZG-2024-0020', hash: '0xea9u...2v3w', block: 1847310, time: '2026-09-08 16:28:41', status: 'passed' },
  { code: 'SNZG-2024-0021', hash: '0xfb0v...3w4x', block: 1847309, time: '2026-09-08 15:19:07', status: 'passed' },
  { code: 'SNZG-2024-0022', hash: '0xac1w...4x5y', block: 1847308, time: '2026-09-08 14:08:53', status: 'passed' },
  { code: 'SNZG-2024-0023', hash: '0xbd2x...5y6z', block: 1847307, time: '2026-09-08 13:42:18', status: 'passed' }
];

let currentPage = 1;
const pageSize = 10;
let filteredData = [...mockData];
let currentDetailCode = '';

document.addEventListener('DOMContentLoaded', function() {
  renderTable();
  renderPagination();
});

function renderTable() {
  const tbody = document.getElementById('dataTableBody');
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageData = filteredData.slice(start, end);
  
  tbody.innerHTML = pageData.map(item => `
    <tr>
      <td><strong>${item.code}</strong></td>
      <td style="font-family:monospace; color:var(--text-secondary);">${item.hash}</td>
      <td>${item.block.toLocaleString()}</td>
      <td>${item.time}</td>
      <td><span class="status-tag ${item.status === 'passed' ? 'active' : item.status === 'failed' ? 'error' : 'warning'}">${item.status === 'passed' ? '已通过' : item.status === 'failed' ? '未通过' : '验证中'}</span></td>
      <td>
        <div class="action-btns">
          <button class="action-btn detail" onclick="viewDetail('${item.code}')">详情</button>
          <button class="action-btn qrcode" onclick="verifyRecord('${item.code}')">验证</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function renderPagination() {
  const container = document.getElementById('paginationContainer');
  const totalPages = Math.ceil(filteredData.length / pageSize);
  if (totalPages <= 1) { container.innerHTML = ''; return; }
  
  let html = `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="goToPage(${currentPage - 1})">‹</button>`;
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
      html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
    } else if (i === currentPage - 2 || i === currentPage + 2) {
      html += '<span class="page-ellipsis">...</span>';
    }
  }
  html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="goToPage(${currentPage + 1})">›</button>`;
  container.innerHTML = html;
}

function goToPage(page) {
  const totalPages = Math.ceil(filteredData.length / pageSize);
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderTable();
  renderPagination();
}

function searchData() {
  const code = document.getElementById('traceCodeInput').value.toLowerCase();
  const hash = document.getElementById('txHashInput').value.toLowerCase();
  const status = document.getElementById('statusSelect').value;
  
  filteredData = mockData.filter(item => {
    if (code && !item.code.toLowerCase().includes(code)) return false;
    if (hash && !item.hash.toLowerCase().includes(hash)) return false;
    if (status && item.status !== status) return false;
    return true;
  });
  
  currentPage = 1;
  renderTable();
  renderPagination();
  showToast(`找到 ${filteredData.length} 条记录`);
}

function viewDetail(code) {
  currentDetailCode = code;
  const item = mockData.find(d => d.code === code);
  if (!item) return;
  
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-grid"><span class="detail-label">溯源码</span><span class="detail-value">${item.code}</span></div>
    <div class="detail-grid"><span class="detail-label">交易哈希</span><span class="detail-value" style="font-family:monospace;">${item.hash}</span></div>
    <div class="detail-grid"><span class="detail-label">区块高度</span><span class="detail-value">${item.block.toLocaleString()}</span></div>
    <div class="detail-grid"><span class="detail-label">上链时间</span><span class="detail-value">${item.time}</span></div>
    <div class="detail-grid"><span class="detail-label">验证状态</span><span class="detail-value"><span class="status-tag ${item.status === 'passed' ? 'active' : item.status === 'failed' ? 'error' : 'warning'}">${item.status === 'passed' ? '已通过' : item.status === 'failed' ? '未通过' : '验证中'}</span></span></div>
    <div class="detail-grid"><span class="detail-label">数据摘要</span><span class="detail-value" style="font-family:monospace; font-size:12px;">SHA256: ${item.hash}abc123</span></div>
  `;
  openModal('detailModal');
}

function verifyRecord(code) {
  if (code) currentDetailCode = code;
  const item = mockData.find(d => d.code === currentDetailCode);
  if (!item) return;
  
  closeModal('detailModal');
  
  const isPassed = item.status === 'passed';
  document.getElementById('verifyContent').innerHTML = `
    <div class="verify-result">
      <div class="verify-icon ${isPassed ? 'success' : 'error'}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;">
          ${isPassed ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>' : '<circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6"/><path d="M9 9l6 6"/>'}
        </svg>
      </div>
      <div class="verify-title">${isPassed ? '验证通过' : '验证失败'}</div>
      <div class="verify-desc">${isPassed ? '该溯源信息已在区块链上存证，验证通过。' : '该溯源信息验证失败，数据可能被篡改或不存在。'}</div>
    </div>
    <div class="detail-grid"><span class="detail-label">溯源码</span><span class="detail-value">${item.code}</span></div>
    <div class="detail-grid"><span class="detail-label">交易哈希</span><span class="detail-value" style="font-family:monospace;">${item.hash}</span></div>
    <div class="detail-grid"><span class="detail-label">区块高度</span><span class="detail-value">${item.block.toLocaleString()}</span></div>
    <div class="detail-grid"><span class="detail-label">验证时间</span><span class="detail-value">${new Date().toLocaleString()}</span></div>
  `;
  openModal('verifyModal');
}

function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function showToast(message) {
  const toast = document.getElementById('toast');
  document.getElementById('toastMessage').textContent = message;
  toast.className = 'toast success';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}
</script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/common-functions.js"></script>
  <script src="js/search-helper.js"></script>
  <script src="js/typography.js"></script>
</body>
</html>
