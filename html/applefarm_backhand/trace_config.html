<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 溯源配置</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .modal-overlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center;
    z-index:1000; opacity:0; visibility:hidden; transition:all 0.3s ease;
  }
  .modal-overlay.active { opacity:1; visibility:visible; }
  .modal { background:var(--bg-card); border-radius:16px; width:600px; max-width:90vw; max-height:90vh; overflow:hidden; transform:scale(0.9); transition:all 0.3s ease; }
  .modal-overlay.active .modal { transform:scale(1); }
  .modal-header {
    padding:20px 24px; border-bottom:1px solid var(--border-default);
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(135deg, #1890ff 0%, #1a8a3a 100%); color:var(--text-inverse);
  }
  .modal-header h3 { font-size:18px; font-weight:600; margin:0; }
  .modal-close { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.2); border:none; color:var(--text-inverse); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
  .modal-close:hover { background:rgba(255,255,255,0.3); }
  .modal-body { padding:24px; max-height:60vh; overflow-y:auto; }
  .modal-footer { padding:16px 24px; border-top:1px solid var(--border-default); display:flex; justify-content:flex-end; gap:12px; }
  .preview-content { background:#f8faf8; border-radius:12px; padding:20px; }
  .preview-section { margin-bottom:16px; }
  .preview-section-title { font-weight:600; color:var(--text-primary); margin-bottom:8px; font-size:14px; }
  .preview-items { display:flex; flex-wrap:wrap; gap:8px; }
  .preview-item { background:var(--bg-card); padding:8px 12px; border-radius:6px; font-size:12px; color:var(--text-tertiary); border:1px solid var(--border-default); }
  .edit-form { display:grid; gap:16px; }
  .form-group { display:flex; flex-direction:column; gap:6px; }
  .form-group label { font-size:14px; font-weight:500; color:var(--text-primary); }
  .form-group input, .form-group select, .form-group textarea { padding:10px 14px; border:1px solid var(--border-default); border-radius:8px; font-size:14px; transition:all 0.2s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--border-primary); box-shadow:0 0 0 3px rgba(24,144,255,0.1); }
  .form-group textarea { resize:vertical; min-height:80px; }
  .module-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .module-tag { display:flex; align-items:center; gap:6px; background:var(--gray-50); padding:6px 12px; border-radius:6px; font-size:13px; cursor:pointer; transition:all 0.2s; }
  .module-tag:hover { background:var(--gray-100); }
  .module-tag.selected { background:var(--primary-500); color:var(--text-inverse); }
  .module-tag input { display:none; }
  .toast { position:fixed; top:20px; right:20px; padding:14px 20px; background:var(--bg-card); border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.15); display:flex; align-items:center; gap:12px; z-index:2000; transform:translateX(120%); transition:all 0.3s ease; }
  .toast.show { transform:translateX(0); }
  .toast.success { border-left:4px solid var(--border-primary); }
  .toast-icon { width:24px; height:24px; border-radius:50%; background:var(--gray-100); display:flex; align-items:center; justify-content:center; color:var(--primary-500); }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="trace" data-active-submenu="trace-config">

<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3L11 11M11 3L3 11"/></svg></button>
      </div>
    </div>

    <main class="main-content">
      <div class="content-wrapper">
        <div class="page-section action-bar">
          <button class="jg-btn jg-btn-primary" onclick="openAddModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M12 4v16m8-8H4"/></svg>
            新建模板
          </button>
        </div>
        <div class="search-section">
          <div class="search-bar">
            <input type="text" class="search-input" placeholder="搜索模板名称..." id="templateNameInput" style="width:200px;">
            <select class="search-select" id="statusSelect" style="width:140px;">
              <option value="">全部状态</option>
              <option value="active">启用中</option>
              <option value="inactive">已禁用</option>
            </select>
            
          <div class="search-actions"><button class="jg-btn jg-btn-primary" onclick="searchData()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button><button class="jg-btn" onclick="smartReset()">重置</button></div>
          </div>
        </div>

        <div class="data-section">
          <table class="data-table">
            <thead>
              <tr>
                <th>模板名称</th>
                <th>企业名称</th>
                <th>展示模块</th>
                <th>创建时间</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
          </table>
          <div class="pagination" id="paginationContainer"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 预览弹窗 -->
<div class="modal-overlay" id="previewModal">
  <div class="modal">
    <div class="modal-header">
      <h3>模板预览</h3>
      <button class="modal-close" onclick="closeModal('previewModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="previewContent"></div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('previewModal')">关闭</button>
      <button class="jg-btn jg-btn-primary" onclick="editFromPreview()">编辑模板</button>
    </div>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="editModalTitle">编辑模板</h3>
      <button class="modal-close" onclick="closeModal('editModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="edit-form">
        <div class="form-group">
          <label>模板名称</label>
          <input type="text" id="editName" placeholder="请输入模板名称">
        </div>
        <div class="form-group">
          <label>企业名称</label>
          <input type="text" id="editCompany" placeholder="请输入企业名称">
        </div>
        <div class="form-group">
          <label>展示模块</label>
          <div class="module-list">
            <label class="module-tag"><input type="checkbox" value="base" checked>基地介绍</label>
            <label class="module-tag"><input type="checkbox" value="story" checked>品种故事</label>
            <label class="module-tag"><input type="checkbox" value="farming" checked>农事记录</label>
            <label class="module-tag"><input type="checkbox" value="quality">质检报告</label>
            <label class="module-tag"><input type="checkbox" value="process">种植过程</label>
            <label class="module-tag"><input type="checkbox" value="cert">企业认证</label>
          </div>
        </div>
        <div class="form-group">
          <label>模板描述</label>
          <textarea id="editDesc" placeholder="请输入模板描述"></textarea>
        </div>
        <div class="form-group">
          <label>状态</label>
          <select id="editStatus">
            <option value="active">启用</option>
            <option value="inactive">禁用</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('editModal')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<!-- Toast提示 -->
<div class="toast" id="toast">
  <div class="toast-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
  </div>
  <span id="toastMessage">操作成功</span>
</div>

<script>
// Mock数据 - 23条记录
const mockData = [
  { id: 1, name: '标准版履历模板', company: '甘肃智慧果园农业科技', modules: ['基地介绍', '品种故事', '农事记录'], createTime: '2026-09-15', status: 'active', desc: '适用于一般农产品溯源，包含基础模块' },
  { id: 2, name: '精简版履历模板', company: '甘肃智慧果园农业科技', modules: ['基地介绍', '质检报告'], createTime: '2026-09-18', status: 'inactive', desc: '简洁版模板，适用于快速溯源' },
  { id: 3, name: '品牌故事版模板', company: '甘肃智慧果园农业科技', modules: ['基地介绍', '品种故事', '种植过程', '企业认证'], createTime: '2026-09-20', status: 'inactive', desc: '强调品牌故事，适用于高端产品' },
  { id: 4, name: '有机认证版模板', company: '有机农业发展公司', modules: ['基地介绍', '品种故事', '农事记录', '质检报告', '企业认证'], createTime: '2026-09-22', status: 'active', desc: '有机产品专用模板' },
  { id: 5, name: '出口认证版模板', company: '出口贸易有限公司', modules: ['基地介绍', '质检报告', '企业认证'], createTime: '2026-09-25', status: 'inactive', desc: '符合出口标准的溯源模板' },
  { id: 6, name: '采摘体验版模板', company: '乡村旅游开发公司', modules: ['基地介绍', '品种故事', '种植过程'], createTime: '2026-09-28', status: 'active', desc: '适用于采摘园体验溯源' },
  { id: 7, name: '企业定制版A', company: '大型农业集团', modules: ['基地介绍', '品种故事', '农事记录', '质检报告', '种植过程'], createTime: '2026-09-01', status: 'inactive', desc: '企业定制模板A版本' },
  { id: 8, name: '企业定制版B', company: '大型农业集团', modules: ['基地介绍', '品种故事', '企业认证'], createTime: '2026-09-03', status: 'inactive', desc: '企业定制模板B版本' },
  { id: 9, name: '礼品套装版模板', company: '果业礼品公司', modules: ['基地介绍', '品种故事', '质检报告'], createTime: '2026-09-05', status: 'active', desc: '礼品套装专用模板' },
  { id: 10, name: '会员专供版模板', company: '会员服务中心', modules: ['基地介绍', '品种故事', '农事记录', '质检报告'], createTime: '2026-09-08', status: 'inactive', desc: '会员专享产品模板' },
  { id: 11, name: '预售尝鲜版模板', company: '农产品预售平台', modules: ['基地介绍', '品种故事'], createTime: '2026-09-10', status: 'active', desc: '预售产品专用模板' },
  { id: 12, name: '亲子农庄版模板', company: '亲子农庄运营', modules: ['基地介绍', '品种故事', '种植过程'], createTime: '2026-09-12', status: 'inactive', desc: '亲子农庄体验模板' },
  { id: 13, name: '扶贫助农版模板', company: '扶贫电商平台', modules: ['基地介绍', '品种故事', '农事记录'], createTime: '2026-09-15', status: 'active', desc: '扶贫产品溯源模板' },
  { id: 14, name: '社区团购版模板', company: '社区团购平台', modules: ['基地介绍', '质检报告'], createTime: '2026-09-18', status: 'inactive', desc: '社区团购产品模板' },
  { id: 15, name: '直播带货版模板', company: '直播电商基地', modules: ['基地介绍', '品种故事', '种植过程'], createTime: '2026-09-20', status: 'active', desc: '直播带货专用模板' },
  { id: 16, name: '农旅融合版模板', company: '农旅开发公司', modules: ['基地介绍', '品种故事', '种植过程', '企业认证'], createTime: '2026-09-22', status: 'inactive', desc: '农旅融合产品模板' },
  { id: 17, name: '区域公用品牌模板', company: '区域公用品牌协会', modules: ['基地介绍', '品种故事', '农事记录', '质检报告', '企业认证'], createTime: '2026-09-25', status: 'active', desc: '区域公用品牌专用' },
  { id: 18, name: '地标产品版模板', company: '地理标志产品协会', modules: ['基地介绍', '品种故事', '农事记录', '质检报告', '企业认证'], createTime: '2026-09-28', status: 'inactive', desc: '地理标志产品模板' },
  { id: 19, name: '认养农业版模板', company: '认养农业平台', modules: ['基地介绍', '品种故事', '农事记录'], createTime: '2026-09-01', status: 'active', desc: '认养农业产品模板' },
  { id: 20, name: '盆栽花卉版模板', company: '盆栽花卉基地', modules: ['基地介绍', '种植过程'], createTime: '2026-09-05', status: 'inactive', desc: '盆栽花卉产品模板' },
  { id: 21, name: '深加工产品版模板', company: '农产品深加工厂', modules: ['基地介绍', '质检报告', '企业认证'], createTime: '2026-09-08', status: 'active', desc: '深加工农产品模板' },
  { id: 22, name: '冷链物流版模板', company: '冷链物流公司', modules: ['基地介绍', '质检报告'], createTime: '2026-09-10', status: 'inactive', desc: '冷链配送产品模板' },
  { id: 23, name: '跨境电商版模板', company: '跨境电商平台', modules: ['基地介绍', '品种故事', '质检报告', '企业认证'], createTime: '2026-09-12', status: 'active', desc: '跨境电商产品模板' }
];

let currentPage = 1;
const pageSize = 10;
let filteredData = [...mockData];
let currentEditId = null;

document.addEventListener('DOMContentLoaded', function() {
  renderTable();
  renderPagination();
});

function renderTable() {
  const tbody = document.getElementById('dataTableBody');
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageData = filteredData.slice(start, end);
  
  tbody.innerHTML = pageData.map(item => `
    <tr>
      <td><strong>${item.name}</strong></td>
      <td>${item.company}</td>
      <td style="font-size:12px; color:var(--text-tertiary);">${item.modules.join('、')}</td>
      <td>${item.createTime}</td>
      <td><span class="status-tag ${item.status === 'active' ? 'active' : 'inactive'}">${item.status === 'active' ? '启用中' : '已禁用'}</span></td>
      <td>
        <div class="action-btns">
          <button class="action-btn detail" onclick="previewTemplate(${item.id})">预览</button>
          <button class="action-btn edit" onclick="editTemplate(${item.id})">编辑</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function renderPagination() {
  const container = document.getElementById('paginationContainer');
  const totalPages = Math.ceil(filteredData.length / pageSize);
  if (totalPages <= 1) { container.innerHTML = ''; return; }
  
  let html = `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="goToPage(${currentPage - 1})">‹</button>`;
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
      html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
    } else if (i === currentPage - 2 || i === currentPage + 2) {
      html += '<span class="page-ellipsis">...</span>';
    }
  }
  html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="goToPage(${currentPage + 1})">›</button>`;
  container.innerHTML = html;
}

function goToPage(page) {
  const totalPages = Math.ceil(filteredData.length / pageSize);
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderTable();
  renderPagination();
}

function searchData() {
  const name = document.getElementById('templateNameInput').value.toLowerCase();
  const status = document.getElementById('statusSelect').value;
  
  filteredData = mockData.filter(item => {
    if (name && !item.name.toLowerCase().includes(name)) return false;
    if (status && item.status !== status) return false;
    return true;
  });
  
  currentPage = 1;
  renderTable();
  renderPagination();
  showToast(`找到 ${filteredData.length} 条记录`);
}

function previewTemplate(id) {
  const item = mockData.find(d => d.id === id);
  if (!item) return;
  
  document.getElementById('previewContent').innerHTML = `
    <div class="preview-content">
      <div class="preview-section">
        <div class="preview-section-title">基本信息</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <div><span style="color:var(--text-tertiary);">模板名称：</span>${item.name}</div>
          <div><span style="color:var(--text-tertiary);">企业名称：</span>${item.company}</div>
          <div><span style="color:var(--text-tertiary);">创建时间：</span>${item.createTime}</div>
          <div><span style="color:var(--text-tertiary);">状态：</span><span class="status-tag ${item.status === 'active' ? 'active' : 'inactive'}">${item.status === 'active' ? '启用中' : '已禁用'}</span></div>
        </div>
      </div>
      <div class="preview-section">
        <div class="preview-section-title">模板描述</div>
        <p style="font-size:14px; color:var(--text-tertiary); margin:0;">${item.desc}</p>
      </div>
      <div class="preview-section">
        <div class="preview-section-title">展示模块（${item.modules.length}个）</div>
        <div class="preview-items">${item.modules.map(m => `<span class="preview-item">${m}</span>`).join('')}</div>
      </div>
    </div>
  `;
  currentEditId = id;
  openModal('previewModal');
}

function editTemplate(id) {
  const item = mockData.find(d => d.id === id);
  if (!item) return;
  
  document.getElementById('editModalTitle').textContent = '编辑模板';
  document.getElementById('editName').value = item.name;
  document.getElementById('editCompany').value = item.company;
  document.getElementById('editDesc').value = item.desc;
  document.getElementById('editStatus').value = item.status;
  
  document.querySelectorAll('.module-tag input').forEach(cb => {
    const moduleName = cb.value === 'base' ? '基地介绍' : 
                       cb.value === 'story' ? '品种故事' : 
                       cb.value === 'farming' ? '农事记录' : 
                       cb.value === 'quality' ? '质检报告' : 
                       cb.value === 'process' ? '种植过程' : '企业认证';
    cb.checked = item.modules.includes(moduleName);
  });
  
  currentEditId = id;
  openModal('editModal');
}

function editFromPreview() {
  closeModal('previewModal');
  setTimeout(() => editTemplate(currentEditId), 200);
}

function openAddModal() {
  document.getElementById('editModalTitle').textContent = '新建模板';
  document.getElementById('editName').value = '';
  document.getElementById('editCompany').value = '甘肃智慧果园农业科技';
  document.getElementById('editDesc').value = '';
  document.getElementById('editStatus').value = 'active';
  document.querySelectorAll('.module-tag input').forEach(cb => cb.checked = false);
  currentEditId = null;
  openModal('editModal');
}

function saveEdit() {
  const name = document.getElementById('editName').value.trim();
  if (!name) {
    showToast('请输入模板名称', 'error');
    return;
  }
  
  closeModal('editModal');
  showToast(currentEditId ? '模板已保存' : '模板已创建');
}

function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  document.getElementById('toastMessage').textContent = message;
  toast.className = `toast ${type}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}
</script>
