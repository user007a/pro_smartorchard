<style>
  .modal-overlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center;
    z-index:1000; opacity:0; visibility:hidden; transition:all 0.3s ease;
  }
  .modal-overlay.active { opacity:1; visibility:visible; }
  .modal { background:var(--bg-card); border-radius:16px; width:600px; max-width:90vw; max-height:90vh; overflow:hidden; transform:scale(0.9); transition:all 0.3s ease; }
  .modal-overlay.active .modal { transform:scale(1); }
  .modal-header {
    padding:20px 24px; border-bottom:1px solid var(--border-default);
    display:flex; align-items:center; justify-content:space-between;

  }
  .modal-header h3 { font-size:18px; font-weight:600; margin:0; }
  .modal-close { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.2); border:none; color:var(--text-inverse); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
  .modal-close:hover { background:rgba(255,255,255,0.3); }
  .modal-body { padding:24px; max-height:60vh; overflow-y:auto; }
  .modal-footer { padding:16px 24px; border-top:1px solid var(--border-default); display:flex; justify-content:flex-end; gap:12px; }
  .preview-content { background:#f8faf8; border-radius:12px; padding:20px; }
  .preview-section { margin-bottom:16px; }
  .preview-section-title { font-weight:600; color:var(--text-primary); margin-bottom:8px; font-size:14px; }
  .preview-items { display:flex; flex-wrap:wrap; gap:8px; }
  .preview-item { background:var(--bg-card); padding:8px 12px; border-radius:6px; font-size:12px; color:var(--text-tertiary); border:1px solid var(--border-default); }
  .edit-form { display:grid; gap:16px; }
  .form-group { display:flex; flex-direction:column; gap:6px; }
  .form-group label { font-size:14px; font-weight:500; color:var(--text-primary); }
  .form-group input, .form-group select, .form-group textarea { padding:10px 14px; border:1px solid var(--border-default); border-radius:8px; font-size:14px; transition:all 0.2s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--border-primary); box-shadow:0 0 0 3px rgba(24,144,255,0.1); }
  .form-group textarea { resize:vertical; min-height:80px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .form-hint { font-size:12px; color:var(--text-tertiary); }
  .module-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .module-tag { display:flex; align-items:center; gap:6px; background:var(--gray-50); padding:6px 12px; border-radius:6px; font-size:13px; cursor:pointer; transition:all 0.2s; }
  .module-tag:hover { background:var(--gray-100); }
  .module-tag.selected { background:var(--primary-500); color:var(--text-inverse); }
  .module-tag input { display:none; }
  /* ===== T15：C 端溯源展示 Tab ===== */
  .stage-icon-cell { font-size:20px; line-height:1; text-align:center; }
  .stage-name-cell { font-weight:600; color:var(--text-primary); }
  .stage-desc-cell { font-size:12px; color:var(--text-tertiary); max-width:340px; }
  .stage-key { font-family:var(--font-family-mono, monospace); font-size:12px; color:var(--text-tertiary); }
  .stage-hint { font-size:12px; color:var(--text-tertiary); padding:12px 0 0; margin:0; }
  .order-btns { display:inline-flex; gap:6px; }
  .toast { position:fixed; top:20px; right:20px; padding:14px 20px; background:var(--bg-card); border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.15); display:flex; align-items:center; gap:12px; z-index:2000; transform:translateX(120%); transition:all 0.3s ease; }
  .toast.show { transform:translateX(0); }
  .toast.success { border-left:4px solid var(--border-primary); }
  .toast-icon { width:24px; height:24px; border-radius:50%; background:var(--gray-100); display:flex; align-items:center; justify-content:center; color:var(--primary-500); }
</style>

<script>
// 企业主体（与企业管理 - 企业信息一致）
const COMPANY_NAME = '天水花牛苹果（集团）有限责任公司';

/* 严格空库模式：产品 / 批次 / 模块下拉数据一律来自后端 API，不再使用写死示例数组 */
let PRODUCT_SOURCE = [];
let BATCH_SOURCE = [];
let MODULE_SOURCE = [];

/* 严格空库模式：展示模板一律来自后端 API（sf_trace_show_template） */
var TEMPLATE_RESOURCE = 'trace_show_template';
function getShowTemplates() { return mockData; }
let mockData = [];

let currentEditId = null;

/* 数据库行(snake_case) → 页面渲染字段 */
function mapShowTemplateRow(row) {
  var modules = [], bound = [];
  try { modules = row.modules ? JSON.parse(row.modules) : []; } catch (e) { modules = []; }
  if (!Array.isArray(modules)) modules = String(row.modules || '').split(/[,，]/).filter(Boolean);
  try { bound = row.bound_batches ? JSON.parse(row.bound_batches) : []; } catch (e) { bound = []; }
  if (!Array.isArray(bound)) bound = String(row.bound_batches || '').split(/[,，]/).filter(Boolean);
  return {
    id: row.id,
    name: row.name || '',
    product: row.product || '',
    modules: modules,
    boundBatches: bound,
    createTime: row.create_time || '',
    desc: row.desc || '',
    status: row.status || 'inactive'
  };
}

/* 表格状态提示：加载中 / 暂无数据 / 加载失败 */
function setTemplateStatus(text, isError) {
  var tbody = document.getElementById('dataTableBody');
  if (tbody) tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:' +
    (isError ? 'var(--error, #d03050)' : 'var(--text-secondary, #6b7b6b)') + ';">' + text + '</td></tr>';
  var pager = document.getElementById('pagination-container');
  if (pager) pager.innerHTML = '';
}

/* 异步取数：成功后渲染，无数据显示暂无数据，失败显示错误提示；不写 localStorage */
function loadTemplates() {
  if (!window.Api) { setTemplateStatus('数据加载失败：接口未就绪', true); return; }
  setTemplateStatus('正在加载数据...', false);
  Api.get(TEMPLATE_RESOURCE, { page: 1, size: 500 }).then(function (r) {
    if (!r || !r.ok) { setTemplateStatus('数据加载失败：' + ((r && r.message) || '请求异常'), true); return; }
    var list = (r.data && r.data.list) || [];
    mockData = list.map(mapShowTemplateRow);
    if (!mockData.length) { setTemplateStatus('暂无数据', false); return; }
    Pagination.init({
      currentPage: 1, pageSize: 10, data: mockData,
      containerId: 'pagination-container', tbodyId: 'dataTableBody',
      renderRow: renderTemplateRow
    });
  }).catch(function (e) {
    setTemplateStatus('数据加载失败：' + (e && e.message ? e.message : '网络异常'), true);
  });
}

/* 下拉选项来自后端 API：产品取 trace_template，批次取 trace_batch，模块取 trace_stage */
function loadSelectOptions() {
  if (!window.Api) return;
  Api.get('trace_template', { page: 1, size: 500 }).then(function (r) {
    if (r && r.ok && r.data && r.data.list) {
      PRODUCT_SOURCE = r.data.list.map(function (x) { return x.applicable_product || ''; })
        .filter(Boolean).join(',').split(/[,，]/).filter(Boolean);
      var sel = document.getElementById('editProduct');
      if (sel) PRODUCT_SOURCE.forEach(function (p) {
        var opt = document.createElement('option');
        opt.value = p; opt.textContent = p;
        sel.appendChild(opt);
      });
    }
  });
  Api.get('trace_batch', { page: 1, size: 500 }).then(function (r) {
    if (r && r.ok && r.data && r.data.list) {
      BATCH_SOURCE = r.data.list.map(function (x) { return x.batch_no || ''; }).filter(Boolean);
      var sel = document.getElementById('editBatch');
      if (sel) sel.innerHTML = '<option value="">暂不绑定</option>' +
        BATCH_SOURCE.map(function (b) { return '<option value="' + b + '">' + b + '</option>'; }).join('');
    }
  });
  Api.get('trace_stage', { page: 1, size: 500 }).then(function (r) {
    if (r && r.ok && r.data && r.data.list) {
      MODULE_SOURCE = r.data.list.map(function (x) { return x.stage_name || ''; }).filter(Boolean);
    }
  });
}

/* ---------- 分页组件（与农事计划、批次管理一致） ---------- */
const Pagination = {
  currentPage: 1, pageSize: 10, filteredData: [],
  containerId: 'pagination-container', tbodyId: 'dataTableBody', renderRow: null,
  init: function(options) {
    this.currentPage = options.currentPage || 1;
    this.pageSize = options.pageSize || 10;
    this.filteredData = options.data || [];
    this.containerId = options.containerId || 'pagination-container';
    this.tbodyId = options.tbodyId || 'dataTableBody';
    this.renderRow = options.renderRow || null;
    this.render();
  },
  renderTable: function() {
    const tbody = document.getElementById(this.tbodyId);
    if (!tbody || !this.renderRow) return;
    const start = (this.currentPage - 1) * this.pageSize;
    const pageData = this.filteredData.slice(start, start + this.pageSize);
    tbody.innerHTML = pageData.map((item, i) => this.renderRow(item, start + i + 1)).join('');
  },
  render: function() {
    const container = document.getElementById(this.containerId);
    if (!container) return;
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    let html = '<div class="pagination">';
    html += `<button class="page-btn ${this.currentPage <= 1 ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage - 1})">‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= this.currentPage - 1 && i <= this.currentPage + 1)) {
        html += `<button class="page-btn ${i === this.currentPage ? 'active' : ''}" onclick="Pagination.goToPage(${i})">${i}</button>`;
      } else if (i === this.currentPage - 2 || i === this.currentPage + 2) {
        html += '<span class="page-ellipsis" style="padding:0 8px;color:#6b7b6b;">...</span>';
      }
    }
    html += `<button class="page-btn ${this.currentPage >= totalPages ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage + 1})">›</button>`;
    html += `<span style="margin-left:16px;font-size:13px;color:#6b7b6b;">第 ${this.currentPage} 页/共 ${totalPages} 页，共 ${this.filteredData.length} 条记录</span>`;
    html += '</div>';
    container.innerHTML = html;
    this.renderTable();
  },
  goToPage: function(page) {
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    if (page < 1 || page > totalPages) return;
    this.currentPage = page;
    this.render();
  },
  updateData: function(data) {
    this.filteredData = data;
    this.currentPage = 1;
    this.render();
  }
};

function renderTemplateRow(item, seq) {
  return `
    <tr data-id="${item.id}">
      <td><strong>${item.name}</strong></td>
      <td>${item.product}</td>
      <td style="font-size:12px; color:var(--text-tertiary);">${item.modules.join('、')}</td>
      <td style="font-size:12px; color:var(--text-tertiary);">${item.boundBatches.length ? item.boundBatches.join('、') : '未绑定'}</td>
      <td>${item.createTime}</td>
      <td><span class="status-tag ${item.status === 'active' ? 'active' : 'inactive'}">${item.status === 'active' ? '启用中' : '已禁用'}</span></td>
      <td>
        <div class="action-btns">
          <button class="action-btn detail" onclick="previewTemplate('${item.id}')">预览</button>
          <button class="action-btn edit" onclick="editTemplate('${item.id}')">编辑</button>
        </div>

}

function searchData() {
  const name = document.getElementById('templateNameInput').value.trim().toLowerCase();
  const status = document.getElementById('statusSelect').value;

  const filtered = mockData.filter(item => {
    if (name && !item.name.toLowerCase().includes(name)) return false;
    if (status && item.status !== status) return false;
    return true;
  });

  Pagination.updateData(filtered);
  showToast(`找到 ${filtered.length} 条记录`);
}

function resetSearch() {
  document.getElementById('templateNameInput').value = '';
  document.getElementById('statusSelect').value = '';
  Pagination.updateData(mockData);
  showToast('已重置筛选条件');
}

function previewTemplate(id) {

  document.getElementById('previewContent').innerHTML = `
    <div class="preview-content">
      <div class="preview-section">

          <div><span style="color:var(--text-tertiary);">模板名称：</span>${item.name}</div>
          <div><span style="color:var(--text-tertiary);">适用产品：</span>${item.product}</div>
          <div><span style="color:var(--text-tertiary);">企业名称：</span>${COMPANY_NAME}</div>
          <div><span style="color:var(--text-tertiary);">创建时间：</span>${item.createTime}</div>
          <div><span style="color:var(--text-tertiary);">绑定批次：</span>${item.boundBatches.length ? item.boundBatches.join('、') : '未绑定'}</div>
          <div><span style="color:var(--text-tertiary);">状态：</span><span class="status-tag ${item.status === 'active' ? 'active' : 'inactive'}">${item.status === 'active' ? '启用中' : '已禁用'}</span></div>
        </div>
      </div>

      </div>
      <div class="preview-section">

      </div>

        <div class="preview-section-title">消费者页效果（H5）</div>

function syncModuleTags(modules) {
  document.querySelectorAll('.module-tag input').forEach(cb => {
    cb.checked = modules.includes(cb.value);
  });
  // 农残检测为强制模块，任何模板都必须展示
  const forced = document.querySelector('.module-tag input[value="农残检测"]');
  if (forced) forced.checked = true;
  refreshModuleTagStyle();
}

function refreshModuleTagStyle() {
  document.querySelectorAll('.module-tag').forEach(tag => {
    const cb = tag.querySelector('input');
    tag.classList.toggle('selected', cb.checked);
  });
}

function editTemplate(id) {
  const item = mockData.find(d => d.id === id);
  if (!item) return;

  document.getElementById('editModalTitle').textContent = '编辑模板';
  document.getElementById('editName').value = item.name;
  document.getElementById('editProduct').value = item.product;
  document.getElementById('editBatch').value = item.boundBatches[0] || '';
  document.getElementById('editDesc').value = item.desc;
  document.getElementById('editStatus').value = item.status;
  syncModuleTags(item.modules);

  currentEditId = id;
  openModal('editModal');
}

function editFromPreview() {
  const id = currentEditId;
  closeModal('previewModal');
  setTimeout(() => editTemplate(id), 200);
}

function openAddModal() {
  document.getElementById('editModalTitle').textContent = '新建模板';
  document.getElementById('editName').value = '';
  document.getElementById('editProduct').selectedIndex = 0;
  document.getElementById('editBatch').value = '';
  document.getElementById('editDesc').value = '';
  document.getElementById('editStatus').value = 'active';
  syncModuleTags(['基地介绍','种植管理','施肥喷药','农残检测','采摘入库']);
  currentEditId = null;
  openModal('editModal');
}

function saveEdit() {
  const name = document.getElementById('editName').value.trim();
  if (!name) { showToast('请输入模板名称', 'error'); return; }

  const modules = Array.from(document.querySelectorAll('.module-tag input'))
    .filter(cb => cb.checked).map(cb => cb.value);
  if (modules.indexOf('农残检测') < 0) modules.push('农残检测');
  if (!modules.length) { showToast('请至少选择一个展示模块', 'error'); return; }

  const batch = document.getElementById('editBatch').value;
  const payload = {
    name: name,
    product: document.getElementById('editProduct').value,
    modules: modules,
    boundBatches: batch ? [batch] : [],
    desc: document.getElementById('editDesc').value.trim(),
    status: document.getElementById('editStatus').value
  };

  if (currentEditId) {
    const S = window.TraceStore;
    if (S && typeof S.saveShowTemplate === 'function') {
      const res = S.saveShowTemplate(Object.assign({ id: currentEditId }, payload));
      if (!res.ok) { showToast(res.message || '保存失败', 'error'); return; }
    }
    showToast('模板已保存');
  } else {
    const pad = n => String(n).padStart(2, '0');
    const now = new Date();
    payload.createTime = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    const S = window.TraceStore;
    if (S && typeof S.saveShowTemplate === 'function') {
      const res = S.saveShowTemplate(payload);
      if (!res.ok) { showToast(res.message || '创建失败', 'error'); return; }
    }
    showToast('模板已创建');
  }
  closeModal('editModal');
  loadTemplates();
}

function openModal(id) {
  document.getElementById(id).classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
  document.body.style.overflow = '';
}

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  document.getElementById('toastMessage').textContent = message;
  toast.className = `toast ${type}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

/* ---------- 展示与短链配置（TraceStore 单一数据源） ---------- */
function renderDisplayConfig() {
  if (!window.TraceStore) return;
  var cfg = TraceStore.config();
  document.getElementById('cfgShortLink').value = cfg.shortLinkBase || '';
  document.getElementById('cfgVideoUrl').value = cfg.baseVideoUrl || '';
  document.getElementById('cfgVr').checked = cfg.showVr !== false;
  document.getElementById('cfgVideo').checked = cfg.showVideo !== false;
  document.getElementById('cfgEnv').checked = cfg.showEnvironment !== false;
}

function saveDisplayConfig() {
  if (!window.TraceStore) { showToast('溯源数据服务未加载', 'error'); return; }
  var base = document.getElementById('cfgShortLink').value.trim().replace(/\/+$/, '');
  if (base && !/^https?:\/\//i.test(base)) {
    showToast('短链域名需以 http:// 或 https:// 开头', 'error');
    return;
  }
  TraceStore.saveConfig({
    shortLinkBase: base || 'https://t.snzg.cn',
    baseVideoUrl: document.getElementById('cfgVideoUrl').value.trim(),
    showVr: document.getElementById('cfgVr').checked,
    showVideo: document.getElementById('cfgVideo').checked,
    showEnvironment: document.getElementById('cfgEnv').checked,
    showInspection: true
  });
  showToast('展示配置已保存');
}

document.addEventListener('DOMContentLoaded', function() {
  initConfigTabs();
  loadTemplates();

  renderDisplayConfig();

  // 模块标签点击态
  document.querySelectorAll('.module-tag input').forEach(cb => {

/* ============================================================
 * T15 · C 端溯源展示配置
 * 【严格空库模式】数据源：后端 API（GET /api/trace_stage）
 *   页面通过 loadCStages() 取数渲染，不再使用写死的固定环节清单，
 *   也不再读写 localStorage；无数据时显示暂无数据。
 * ============================================================ */
/* 严格空库模式：C 端展示环节来自后端 API（sf_trace_stage），不再使用写死示例数据 */
var CSTAGE_RESOURCE = 'trace_stage';
var cstageData = [];

/* 数据库行 → C 端环节渲染字段 */
function mapCStageRow(row) {
  return {
    id: row.id,
    key: row.stage_code || '',
    title: row.stage_name || '',
    icon: row.stage_icon || '',
    img: row.stage_icon || '',
    desc: row.stage_desc || '',
    enabled: row.status !== 'disabled',
    order: Number(row.sort_order) || 0
  };
}

/* C 端环节表格状态提示 */
function setCStageStatus(text, isError) {
  var tbody = document.getElementById('cstageBody');
  if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:' +
    (isError ? 'var(--error, #d03050)' : 'var(--text-secondary, #6b7b6b)') + ';">' + text + '</td></tr>';
}

/* 异步取数：成功后渲染，无数据显示暂无数据，失败显示错误提示；不写 localStorage */
function loadCStages() {
  if (!window.Api) { setCStageStatus('数据加载失败：接口未就绪', true); return; }
  setCStageStatus('正在加载数据...', false);
  Api.get(CSTAGE_RESOURCE, { page: 1, size: 500 }).then(function (r) {
    if (!r || !r.ok) { setCStageStatus('数据加载失败：' + ((r && r.message) || '请求异常'), true); return; }
    var list = (r.data && r.data.list) || [];
    cstageData = list.map(mapCStageRow).sort(function (a, b) { return a.order - b.order; });
    if (!cstageData.length) { setCStageStatus('暂无数据', false); return; }
    renderCStages();
  }).catch(function (e) {
    setCStageStatus('数据加载失败：' + (e && e.message ? e.message : '网络异常'), true);
  });
}

function escCStage(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* 严格空库模式：环节数据来自 loadCStages() 的 API 结果，不再读写 localStorage */
function getCStages() { return cstageData; }

/* 交互保存：严格空库模式下仅更新内存视图，不写 localStorage */
function saveCStages(list) { cstageData = list; return true; }

function renderCStages() {
  var list = getCStages();
  var tbody = document.getElementById('cstageBody');
  if (!tbody) return;
  tbody.innerHTML = list.map(function (s, i) {
    return '<tr>' +
      '<td>' + (i + 1) + '</td>' +
      '<td class="stage-icon-cell">' + escCStage(s.icon) + '</td>' +
      '<td><div class="stage-name-cell">' + escCStage(s.title) + '</div>' +
          '<div class="stage-key">' + escCStage(s.key) + '</div></td>' +
      '<td class="stage-desc-cell">' + escCStage(s.desc) + '</td>' +
      '<td><span class="status-tag active">' + (s.key === 'testing' ? '必需启用' : '启用中') + '</span></td>' +
      '<td><div class="action-btns">' +
        '<button class="action-btn detail" ' + (s.key === 'testing' ? 'disabled title="农残检测为必需环节"' : '') +
          ' onclick="toggleCStage(\'' + escCStage(s.key) + '\')">' +
          (s.key === 'testing' ? '不可停用' : '停用') + '</button>' +
        '<button class="action-btn edit" onclick="editCStage(\'' + escCStage(s.key) + '\')">编辑</button>' +
      '</div>' +
      '<div class="order-btns" style="margin-top:6px;">' +
        '<button class="action-btn" ' + (i === 0 ? 'disabled' : '') +
          ' onclick="moveCStage(\'' + escCStage(s.key) + '\',-1)">上移</button>' +
        '<button class="action-btn" ' + (i === list.length - 1 ? 'disabled' : '') +
          ' onclick="moveCStage(\'' + escCStage(s.key) + '\',1)">下移</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

function findCStage(list, key) {
  for (var i = 0; i < list.length; i++) {
    if (list[i].key === key) return list[i];
  }
  return null;
}

function toggleCStage(key) {
  if (key === 'testing') {
    showToast('农残检测为溯源合规必需环节，不可停用', 'error');
    return;
  }
  var list = getCStages();
  var target = findCStage(list, key);
  if (!target) { showToast('未找到该环节', 'error'); return; }
  target.enabled = !target.enabled;
  if (saveCStages(list)) {
    renderCStages();
    showToast(target.enabled ? '「' + target.title + '」已启用，C 端将展示该环节' : '「' + target.title + '」已停用，C 端不再展示');
  }
}

function moveCStage(key, delta) {
  var list = getCStages();
  var idx = -1;
  for (var i = 0; i < list.length; i++) {
    if (list[i].key === key) { idx = i; break; }
  }
  if (idx < 0) { showToast('未找到该环节', 'error'); return; }
  var target = idx + delta;
  if (target < 0 || target >= list.length) return;
  var tmp = list[idx];
  list[idx] = list[target];
  list[target] = tmp;
  list.forEach(function (s, i) { s.order = i + 1; });
  if (saveCStages(list)) {
    renderCStages();
    showToast('环节顺序已更新');
  }
}

/* 编辑环节：图标 / 名称 / 说明 / 图片文件名（7 个 key 固定，不支持增删） */
function editCStage(key) {
  var list = getCStages();
  var target = findCStage(list, key);
  if (!target) { showToast('未找到该环节', 'error'); return; }

  var icon = prompt('请输入环节图标（emoji，如 🌱）', target.icon);
  if (icon === null) return;
  var title = prompt('请输入环节名称', target.title);
  if (title === null) return;
  if (!title.trim()) { showToast('环节名称不能为空', 'error'); return; }
  var img = prompt('请输入环节图片文件名（相对 applefarm_h5/images/，如 trace_planting.jpg）', target.img);
  if (img === null) return;
  var desc = prompt('请输入环节说明', target.desc);
  if (desc === null) return;

  target.icon = icon.trim();
  target.title = title.trim();
  // 允许填完整相对路径或纯文件名，统一存为 images/xxx 形式
  var imgRaw = img.trim();
  target.img = !imgRaw ? '' : (/^images\//i.test(imgRaw) || /^(https?:|data:)/i.test(imgRaw) ? imgRaw : 'images/' + imgRaw.replace(/^\.?\/?images\//i, ''));
  target.desc = desc.trim();

  if (saveCStages(list)) {
    renderCStages();
    showToast('环节已保存，C 端实时生效');
  }
}

/* Tab 切换（沿用页面现有 Tab 视觉，不影响模板配置原有逻辑） */
function initConfigTabs() {
  document.querySelectorAll('#configTabs .tab-item').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('#configTabs .tab-item').forEach(function (t) { t.classList.remove('active'); });
      this.classList.add('active');
      var name = this.dataset.tab;
      document.getElementById('tab-template').classList.toggle('active', name === 'template');
      document.getElementById('tab-cstage').classList.toggle('active', name === 'cstage');
    });
  });
}

// 点击遮罩关闭弹窗
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeModal(overlay.id);
  });
});

// ESC 关闭弹窗
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.active').forEach(o => closeModal(o.id));
  }
});
