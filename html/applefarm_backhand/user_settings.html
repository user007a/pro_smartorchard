<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 用户设置</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .user-settings-tab-content {
    display:none;
    animation:pageIn 0.25s ease;
  }
  .user-settings-tab-content.active {
    display:block;
  }

  /* 头像卡片（页面专属，对齐 snzg 圆角/描边） */
  .profile-layout {
    display:grid;
    grid-template-columns:260px 1fr;
    gap:24px;
    align-items:start;
  }
  .avatar-box {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:24px;
    background:var(--gray-50, #fafcfa);
    border:1px dashed var(--border-default, #dde3dd);
    border-radius:14px;
    position:relative;
  }
  .avatar-img {
    width:96px;
    height:96px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    font-weight:700;
    color:var(--primary-500, #1890ff);
    background:linear-gradient(135deg, var(--primary-50, #e6f4ff), var(--primary-100, #bae7ff));
    border:3px solid var(--primary-500, #1890ff);
    box-shadow:0 4px 12px rgba(24,144,255,0.15);
  }
  .avatar-edit {
    position:absolute;
    top:24px;
    right:24px;
    width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    border:1px solid var(--border-default, #dde3dd);
    color:var(--text-tertiary, #6b7b6b);
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .avatar-edit:hover {
    color:var(--primary-500, #1890ff);
    border-color:var(--primary-300, #69c0ff);
  }
  .avatar-edit svg { width:15px; height:15px; }
  .avatar-hint { font-size:12px; color:var(--text-secondary, #4a5a4a); }

  /* 安全 / 通知 列表项（对齐 snzg-panel 行高与图标规范） */
  .setting-list { display:flex; flex-direction:column; gap:12px; }
  .setting-item {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:16px 18px;
    background:#fff;
    border:1px solid var(--border-light, #eef1ef);
    border-radius:12px;
    transition:all 0.2s ease;
  }
  .setting-item:hover { box-shadow:0 2px 8px rgba(0,0,0,0.05); border-color:var(--primary-200, #91d5ff); }
  .setting-info { display:flex; align-items:center; gap:16px; min-width:0; }
  .setting-icon {
    width:44px; height:44px; border-radius:12px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .setting-icon svg { width:20px; height:20px; }
  .setting-icon.enabled { background:var(--success-light, #d9f7be); color:var(--success, #52c41a); }
  .setting-icon.disabled { background:var(--gray-100, #f5f5f5); color:var(--text-disabled, #bfbfbf); }
  .setting-title { font-size:14px; font-weight:500; color:var(--text-primary, #1a2e1a); margin-bottom:4px; }
  .setting-desc { font-size:12.5px; color:var(--text-tertiary, #6b7b6b); }

  /* 信息列表（活动记录） */
  .info-list {
    border:1px solid var(--border-light, #eef1ef);
    border-radius:12px;
    overflow:hidden;
  }
  .info-row {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    border-bottom:1px dashed var(--border-light, #eef1ef);
    font-size:13.5px;
  }
  .info-row:last-child { border-bottom:none; }
  .info-label { color:var(--text-tertiary, #6b7b6b); font-weight:500; }
  .info-value { color:var(--text-primary, #1a2e1a); font-weight:600; }
  .info-value.ok { color:var(--success, #52c41a); }

  @media (max-width:900px) {
    .profile-layout { grid-template-columns:1fr; }
  }
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="settings" data-active-submenu="user-settings">
<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <div class="page-header">
        <div>
          <div class="page-title">用户设置</div>
          <div class="page-subtitle">管理系统账户资料、登录安全与通知偏好</div>
        </div>
        <div class="page-actions">
          <button class="jg-btn" onclick="saveProfile()">保存修改</button>
        </div>
      </div>

      <div class="drone-tabs">
        <button class="drone-tab active" onclick="switchTab(event, 'profile')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          个人资料
        </button>
        <button class="drone-tab" onclick="switchTab(event, 'account')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          账户安全
        </button>
        <button class="drone-tab" onclick="switchTab(event, 'notification')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          通知设置
        </button>
        <button class="drone-tab" onclick="switchTab(event, 'activity')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
            <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
            <path d="M10 9H8"/>
            <path d="M16 13H8"/>
            <path d="M16 17H8"/>
          </svg>
          活动记录
        </button>
      </div>

      <!-- 个人资料 -->
      <div id="tab-profile" class="user-settings-tab-content active">
        <div class="snzg-panel">
          <div class="snzg-panel-header">
            <div class="snzg-panel-title">
              <span class="pt-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              基本信息
            </div>
          </div>
          <div class="snzg-panel-body">
            <div class="profile-layout">
              <div class="avatar-box">
                <button class="avatar-edit" onclick="uploadAvatar()" title="更换头像">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
                    <circle cx="12" cy="13" r="3"/>
                  </svg>
                </button>
                <div class="avatar-img">管</div>
                <p class="avatar-hint">点击右上角图标更换头像</p>
              </div>
              <div>
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">用户名<span class="form-required">*</span></label>
                    <input type="text" class="form-input" id="username" value="admin" disabled>
                  </div>
                  <div class="form-group">
                    <label class="form-label">姓名<span class="form-required">*</span></label>
                    <input type="text" class="form-input" id="realName" value="系统管理员">
                  </div>
                  <div class="form-group">
                    <label class="form-label">角色</label>
                    <input type="text" class="form-input" value="超级管理员" disabled>
                  </div>
                  <div class="form-group">
                    <label class="form-label">手机号<span class="form-required">*</span></label>
                    <input type="text" class="form-input" id="phone" value="138****0001">
                  </div>
                  <div class="form-group">
                    <label class="form-label">邮箱</label>
                    <input type="email" class="form-input" id="email" value="admin@snzg.com">
                  </div>
                  <div class="form-group">
                    <label class="form-label">性别</label>
                    <select class="form-select" id="gender">
                      <option value="male">男</option>
                      <option value="female">女</option>
                      <option value="other">其他</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label">所属基地</label>
                    <input type="text" class="form-input" value="全部基地" disabled>
                  </div>
                  <div class="form-group">
                    <label class="form-label">部门</label>
                    <input type="text" class="form-input" id="department" value="技术部">
                  </div>
                  <div class="form-group">
                    <label class="form-label">职位</label>
                    <input type="text" class="form-input" id="position" value="系统管理员">
                  </div>
                  <div class="form-group" style="grid-column:1 / -1;">
                    <label class="form-label">个人简介</label>
                    <textarea class="form-textarea" id="bio" placeholder="请输入个人简介...">负责系统日常维护和管理工作</textarea>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 账户安全 -->
      <div id="tab-account" class="user-settings-tab-content">
        <div class="snzg-panel">
          <div class="snzg-panel-header">
            <div class="snzg-panel-title">
              <span class="pt-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                </svg>
              </span>
              账户安全设置
            </div>
          </div>
          <div class="snzg-panel-body">
            <div class="setting-list">
              <div class="setting-item">
                <div class="setting-info">
                  <div class="setting-icon enabled">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                  </div>
                  <div>
                    <div class="setting-title">登录密码</div>
                    <div class="setting-desc">当前密码强度：强</div>
                  </div>
                </div>
                <button class="jg-btn-outline" onclick="changePassword()">修改密码</button>
              </div>
              <div class="setting-item">
                <div class="setting-info">
                  <div class="setting-icon enabled">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                      <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                  </div>
                  <div>
                    <div class="setting-title">绑定手机</div>
                    <div class="setting-desc">已绑定：138****0001</div>
                  </div>
                </div>
                <button class="jg-btn-outline" onclick="bindPhone()">更换号码</button>
              </div>
              <div class="setting-item">
                <div class="setting-info">
                  <div class="setting-icon disabled">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 8m6 6L3 3m3 3l3 3m12-3a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L21 16"/>
                    </svg>
                  </div>
                  <div>
                    <div class="setting-title">双重认证</div>
                    <div class="setting-desc">增强账户安全性，建议开启</div>
                  </div>
                </div>
                <button class="jg-btn" onclick="enable2FA()">立即开启</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 通知设置 -->

        <div class="snzg-panel">

            <div class="snzg-panel-title">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                  <path d="M13.73 21a2 2 0 0 1-3.46 0"/>

              <button class="jg-btn" onclick="saveNotification()">保存设置</button>
            </div>
          </div>
          <div class="snzg-panel-body">
            <div class="setting-list">
              <div class="setting-item">
                <div class="setting-info">
                  <div class="setting-icon enabled">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M15 18h5l-1.405-1.405A2.032 2.032 0 0 1 18 14.158V11a6.002 6.002 0 0 0-4-5.659V5a2 2 0 1 0-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 18h5m6 0v1a3 3 0 1 1-6 0v-1m6 0H9"/>

                    <div class="setting-title">系统通知</div>
                    <div class="setting-desc">接收系统重要通知和公告</div>
                  </div>
                </div>
                <label class="toggle-switch">
                  <input type="checkbox" checked>
                  <span class="slider"></span>
                </label>
              </div>
              <div class="setting-item">
                <div class="setting-info">
                  <div class="setting-icon enabled">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.09-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                    </svg>
                  </div>
                  <div>
                    <div class="setting-title">邮件通知</div>
                    <div class="setting-desc">接收预警邮件和报表邮件</div>
                  </div>
                </div>
                <label class="toggle-switch">
                  <input type="checkbox" checked>
                  <span class="slider"></span>
                </label>
              </div>
              <div class="setting-item">
                <div class="setting-info">
                  <div class="setting-icon disabled">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.09-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                    </svg>
                  </div>
                  <div>
                    <div class="setting-title">短信通知</div>
                    <div class="setting-desc">接收紧急预警短信通知</div>
                  </div>
                </div>
                <label class="toggle-switch">
                  <input type="checkbox">
                  <span class="slider"></span>
                </label>
              </div>
              <div class="setting-item">
                <div class="setting-info">
                  <div class="setting-icon enabled">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M15 18h5l-1.405-1.405A2.032 2.032 0 0 1 18 14.158V11a6.002 6.002 0 0 0-4-5.659V5a2 2 0 1 0-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 18h5m6 0v1a3 3 0 1 1-6 0v-1m6 0H9"/>
                    </svg>
                  </div>
                  <div>
                    <div class="setting-title">站内消息</div>
                    <div class="setting-desc">接收站内消息提醒</div>
                  </div>
                </div>
                <label class="toggle-switch">
                  <input type="checkbox" checked>
                  <span class="slider"></span>
                </label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 活动记录 -->
      <div id="tab-activity" class="user-settings-tab-content">
        <div class="stat-cards-grid">
          <div class="snzg-stat-card">
            <div class="metric-header">
              <div class="metric-icon green">

                </svg>
              </div>
              <div class="metric-label">登录次数</div>
            </div>

          </div>

            <div class="metric-header">

            </div>
            <div class="metric-value">32</div>
          </div>
        </div>
        <div class="snzg-panel">
          <div class="snzg-panel-header">
            <div class="snzg-panel-title">
              <span class="pt-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
                  <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
                  <path d="M10 9H8"/>
                  <path d="M16 13H8"/>
                  <path d="M16 17H8"/>
                </svg>
              </span>
              最近活动
            </div>
          </div>
          <div class="snzg-panel-body">
            <div class="info-list">
              <div class="info-row">
                <span class="info-label">最后登录时间</span>
                <span class="info-value">2026-09-23 09:15:32</span>
              </div>
              <div class="info-row">
                <span class="info-label">登录IP</span>

              </div>
              <div class="info-row">
                <span class="info-label">账户创建时间</span>
                <span class="info-value">2026-09-15 10:30:00</span>
              </div>
              <div class="info-row">
                <span class="info-label">账户状态</span>
                <span class="info-value ok">正常</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
  function switchTab(event, tabId) {
    document.querySelectorAll('.drone-tab').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.user-settings-tab-content').forEach(content => content.classList.remove('active'));
    event.currentTarget.classList.add('active');
    document.getElementById('tab-' + tabId).classList.add('active');
