<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 用户设置</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .user-settings-tabs {
    display:flex;
    gap:8px;
    padding:16px 20px;
    background:var(--bg-card);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    margin-bottom:20px;
    border:1px solid var(--border-light);
    overflow-x:auto;
  }

  .user-settings-tab {
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 20px;
    border-radius:var(--radius-md);
    font-size:var(--font-size-base);
    font-weight:var(--font-weight-medium);
    color:var(--text-tertiary);
    cursor:pointer;
    transition:all var(--transition-normal);
    border:1px solid transparent;
    white-space:nowrap;
  }

  .user-settings-tab:hover {
    background:var(--bg-hover);
    color:var(--primary-500);
  }

  .user-settings-tab.active {
    background:var(--gradient-primary);
    color:var(--text-inverse);
    box-shadow:var(--shadow-primary);
  }

  .user-settings-tab svg {
    width:16px;
    height:16px;
    flex-shrink:0;
  }

  .user-settings-tab-content {
    display:none;
    animation:fadeIn 0.2s ease;
  }

  .user-settings-tab-content.active {
    display:block;
  }

  @keyframes fadeIn {
    from { opacity:0; transform:translateY(8px); }
    to { opacity:1; transform:translateY(0); }
  }

  .panel-container {
    background:var(--bg-card);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    border:1px solid var(--border-light);
    overflow:hidden;
  }

  .panel-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid var(--border-light);
    background:linear-gradient(135deg, var(--gray-50), var(--bg-card));
  }

  .panel-title {
    display:flex;
    align-items:center;
    gap:10px;
    font-size:var(--font-size-lg);
    font-weight:var(--font-weight-semibold);
    color:var(--text-primary);
  }

  .panel-title svg {
    width:20px;
    height:20px;
    color:var(--primary-500);
  }

  .panel-body {
    padding:20px;
  }

  .form-grid {
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
  }

  .form-grid-2 {
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:16px;
  }

  .form-grid-full {
    grid-column:span 3;
  }

  .form-grid-2col {
    grid-column:span 2;
  }

  .form-group {
    display:flex;
    flex-direction:column;
  }

  .form-label {
    font-size:var(--font-size-base);
    font-weight:var(--font-weight-medium);
    color:var(--text-secondary);
    margin-bottom:8px;
  }

  .form-input, .form-select, .form-textarea {
    padding:10px 14px;
    border:1.5px solid var(--border-default);
    border-radius:var(--radius-md);
    font-size:var(--font-size-base);
    transition:all var(--transition-fast);
    background:var(--bg-card);
    outline:none;
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color:var(--primary-500);
    box-shadow:0 0 0 3px rgba(24, 144, 255, 0.1);
  }

  .form-input:disabled, .form-select:disabled {
    background:var(--gray-50);
    cursor:not-allowed;
    color:var(--text-disabled);
  }

  .form-textarea {
    resize:vertical;
    min-height:100px;
  }

  .avatar-section {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:20px;
    background:var(--gray-50);
    border-radius:var(--radius-lg);
    border:1px dashed var(--border-default);
  }

  .avatar-container {
    position:relative;
    width:120px;
    height:120px;
    border-radius:50%;
    overflow:hidden;
    border:3px solid var(--primary-500);
    box-shadow:0 4px 12px rgba(24, 144, 255, 0.15);
  }

  .avatar {
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    font-weight:var(--font-weight-bold);
    color:var(--primary-500);
    background:linear-gradient(135deg, var(--primary-50), var(--primary-100));
  }

  .avatar-edit-btn {
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    padding:8px;
    background:rgba(0, 0, 0, 0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    opacity:0;
    transition:opacity var(--transition-fast);
  }

  .avatar-container:hover .avatar-edit-btn {
    opacity:1;
  }

  .avatar-edit-btn svg {
    width:20px;
    height:20px;
    color:var(--text-inverse);
  }

  .info-card {
    background:var(--gray-50);
    border-radius:var(--radius-lg);
    padding:16px;
  }

  .info-row {
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px dashed var(--border-light);
  }

  .info-row:last-child {
    border-bottom:none;
  }

  .info-label {
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
    font-weight:var(--font-weight-medium);
  }

  .info-value {
    font-size:var(--font-size-sm);
    color:var(--text-primary);
    font-weight:var(--font-weight-medium);
  }

  .stats-grid {
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:16px;
    margin-bottom:20px;
  }

  .stat-card {
    padding:20px;
    border-radius:12px;
    background:var(--bg-card);
    border:1px solid var(--border-light);
    box-shadow:0 1px 3px rgba(16,24,40,0.06);
  }

  .stat-icon {
    width:40px;
    height:40px;
    border-radius:var(--radius-md);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:12px;
  }

  .stat-icon svg {
    width:20px;
    height:20px;
  }

  .stat-icon.green {
    background:var(--success-bg);
    color:var(--success);
  }

  .stat-icon.blue {
    background:var(--info-bg);
    color:var(--info);
  }

  .stat-icon.orange {
    background:var(--warning-bg);
    color:var(--warning);
  }

  .stat-icon.purple {
    background:#f5f0ff;
    color:#722ed1;
  }

  .stat-value {
    font-size:24px;
    font-weight:var(--font-weight-bold);
    color:var(--text-primary);
    margin-bottom:4px;
  }

  .stat-label {
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
  }

  .security-item {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px;
    background:var(--bg-card);
    border-radius:var(--radius-md);
    border:1px solid var(--border-light);
    margin-bottom:12px;
    transition:all var(--transition-fast);
  }

  .security-item:hover {
    box-shadow:var(--shadow-sm);
  }

  .security-info {
    display:flex;
    align-items:center;
    gap:16px;
  }

  .security-icon {
    width:44px;
    height:44px;
    border-radius:var(--radius-md);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .security-icon.enabled {
    background:var(--success-bg);
    color:var(--success);
  }

  .security-icon.disabled {
    background:var(--gray-100);
    color:var(--text-disabled);
  }

  .security-title {
    font-size:var(--font-size-base);
    font-weight:var(--font-weight-medium);
    color:var(--text-primary);
    margin-bottom:4px;
  }

  .security-desc {
    font-size:var(--font-size-sm);
    color:var(--text-tertiary);
  }

  .btn-group {
    display:flex;
    gap:12px;
  }

  .primary-btn {
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 20px;
    border-radius:var(--radius-md);
    font-size:var(--font-size-base);
    font-weight:var(--font-weight-medium);
    cursor:pointer;
    transition:all var(--transition-normal);
    background:var(--gradient-primary);
    color:var(--text-inverse);
    border:none;
    box-shadow:var(--shadow-primary);
  }

  .primary-btn:hover {
    transform:translateY(-2px);
    box-shadow:var(--shadow-primary-hover);
  }

  .secondary-btn {
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 20px;
    border-radius:var(--radius-md);
    font-size:var(--font-size-base);
    font-weight:var(--font-weight-medium);
    cursor:pointer;
    transition:all var(--transition-normal);
    background:var(--bg-card);
    color:var(--text-secondary);
    border:1.5px solid var(--border-default);
  }

  .secondary-btn:hover {
    border-color:var(--primary-500);
    color:var(--primary-500);
  }

  .notification-item {
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px;
    background:var(--bg-card);
    border-radius:var(--radius-md);
    border:1px solid var(--border-light);
    margin-bottom:8px;
  }

  .notification-item:last-child {
    margin-bottom:0;
  }

  .notification-item:hover {
    background:var(--bg-hover);
  }

  .toggle-switch {
    position:relative;
    width:48px;
    height:26px;
    cursor:pointer;
  }

  .toggle-track {
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:var(--gray-300);
    border-radius:26px;
    transition:all var(--transition-normal);
  }

  .toggle-track.on {
    background:var(--gradient-primary);
  }

  .toggle-thumb {
    position:absolute;
    top:2px;
    left:2px;
    width:22px;
    height:22px;
    background:var(--bg-card);
    border-radius:50%;
    box-shadow:var(--shadow-sm);
    transition:all var(--transition-normal);
  }

  .toggle-track.on .toggle-thumb {
    transform:translateX(22px);
  }

  @media (max-width:1024px) {
    .form-grid {
      grid-template-columns:repeat(2, 1fr);
    }
    .form-grid-full {
      grid-column:span 2;
    }
    .stats-grid {
      grid-template-columns:repeat(2, 1fr);
    }
  }

  @media (max-width:768px) {
    .form-grid {
      grid-template-columns:1fr;
    }
    .form-grid-full {
      grid-column:span 1;
    }
    .stats-grid {
      grid-template-columns:1fr;
    }
    .form-grid-2 {
      grid-template-columns:1fr;
    }
  }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>

<body data-active-menu="settings" data-active-submenu="user-settings">
<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <main class="main-content">
              <div class="user-settings-tabs">
        <div class="user-settings-tab active" onclick="switchTab(event, 'profile')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          个人资料
        </div>
        <div class="user-settings-tab" onclick="switchTab(event, 'account')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          账户安全
        </div>
        <div class="user-settings-tab" onclick="switchTab(event, 'notification')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          通知设置
        </div>
        <div class="user-settings-tab" onclick="switchTab(event, 'activity')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
            <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
            <path d="M10 9H8"/>
            <path d="M16 13H8"/>
            <path d="M16 17H8"/>
          </svg>
          活动记录
        </div>
      </div>

      <div id="tab-profile" class="user-settings-tab-content active">
        <div class="panel-container">
          <div class="panel-header">
            <div class="panel-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              基本信息
            </div>
            <button class="primary-btn" onclick="saveProfile()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5"/>
                <path d="M5 12H19"/>
              </svg>
              保存修改
            </button>
          </div>
          <div class="panel-body">
            <div class="form-grid">
              <div class="form-group form-grid-full">
                <div class="avatar-section">
                  <div class="avatar-container">
                    <div class="avatar">管</div>
                    <div class="avatar-edit-btn" onclick="uploadAvatar()">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
                        <circle cx="12" cy="13" r="3"/>
                      </svg>
                    </div>
                  </div>
                  <p style="font-size:12px;color:var(--text-secondary);">点击更换头像</p>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label required">用户名</label>
                <input type="text" class="form-input" id="username" value="admin" disabled>
              </div>
              <div class="form-group">
                <label class="form-label required">姓名</label>
                <input type="text" class="form-input" id="realName" value="系统管理员">
              </div>
              <div class="form-group">
                <label class="form-label">角色</label>
                <input type="text" class="form-input" value="超级管理员" disabled>
              </div>
              <div class="form-group">
                <label class="form-label required">手机号</label>
                <input type="text" class="form-input" id="phone" value="138****0001">
              </div>
              <div class="form-group">
                <label class="form-label">邮箱</label>
                <input type="email" class="form-input" id="email" value="admin@snzg.com">
              </div>
              <div class="form-group">
                <label class="form-label">性别</label>
                <select class="form-select" id="gender">
                  <option value="male">男</option>
                  <option value="female">女</option>
                  <option value="other">其他</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">所属基地</label>
                <input type="text" class="form-input" value="全部基地" disabled>
              </div>
              <div class="form-group">
                <label class="form-label">部门</label>
                <input type="text" class="form-input" id="department" value="技术部">
              </div>
              <div class="form-group">
                <label class="form-label">职位</label>
                <input type="text" class="form-input" id="position" value="系统管理员">
              </div>
              <div class="form-group form-grid-full">
                <label class="form-label">个人简介</label>
                <textarea class="form-textarea" id="bio" placeholder="请输入个人简介...">负责系统日常维护和管理工作</textarea>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="tab-account" class="user-settings-tab-content">
        <div class="form-grid-2">
          <div class="panel-container" style="grid-column:span 2;">
            <div class="panel-header">
              <div class="panel-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                </svg>
                账户安全设置
              </div>
            </div>
            <div class="panel-body">
              <div class="security-item">
                <div class="security-info">
                  <div class="security-icon enabled">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                  </div>
                  <div>
                    <div class="security-title">登录密码</div>
                    <div class="security-desc">当前密码强度：强</div>
                  </div>
                </div>
                <button class="primary-btn" onclick="changePassword()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20v-2"/>
                    <path d="M12 10V6a6 6 0 0 1 12 0v3.67"/>
                    <path d="M10 10a4 4 0 0 1 8 0v2"/>
                    <path d="M4 18h16"/>
                    <path d="M4 14h16"/>
                  </svg>
                  修改密码
                </button>
              </div>
              <div class="security-item">
                <div class="security-info">
                  <div class="security-icon enabled">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                      <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                  </div>
                  <div>
                    <div class="security-title">绑定手机</div>
                    <div class="security-desc">已绑定：138****0001</div>
                  </div>
                </div>
                <button class="primary-btn" onclick="bindPhone()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                    <path d="M23 16v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                  </svg>
                  更换号码
                </button>
              </div>
              <div class="security-item">
                <div class="security-info">
                  <div class="security-icon disabled">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 8m6 6L3 3m3 3l3 3m12-3a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L21 16"/>
                    </svg>
                  </div>
                  <div>
                    <div class="security-title">双重认证</div>
                    <div class="security-desc">增强账户安全性，建议开启</div>
                  </div>
                </div>
                <button class="primary-btn" onclick="enable2FA()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14"/>
                    <path d="M5 12h14"/>
                  </svg>
                  立即开启
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="tab-notification" class="user-settings-tab-content">
        <div class="panel-container">
          <div class="panel-header">
            <div class="panel-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
              通知设置
            </div>
            <button class="primary-btn" onclick="saveNotification()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5"/>
                <path d="M5 12H19"/>
              </svg>
              保存设置
            </button>
          </div>
          <div class="panel-body">
            <div class="notification-item">

  function switchTab(event, tabId) {
    document.querySelectorAll('.user-settings-tab').forEach(tab => tab.classList.remove('active'));

    event.currentTarget.classList.add('active');
    document.getElementById('tab-' + tabId).classList.add('active');
  }
