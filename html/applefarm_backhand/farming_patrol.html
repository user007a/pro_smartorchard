<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 巡园管理</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
  <link rel="stylesheet" href="css/page-content.css">
<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition: all 0.2s ease;
  }
  .module-card:hover {
    background: var(--bg-hover);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  /* checkbox列样式 */
  .checkbox-col {
    width: 40px;
    text-align: center;
  }
  .checkbox-col input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  /* 日期输入框样式 */
  .search-date {
    padding: 8px 12px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    font-size: 14px;
    background: var(--bg-input);
    color: var(--text-primary);
    min-width: 140px;
  }
  .search-date:focus {
    outline: none;
    border-color: var(--primary);
  }

  /* 操作按钮区样式 */
  .action-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* 页面分区样式 */
  .page-section {
    margin-bottom: 20px;
  }

  /* 数据区样式 */
  .data-section .data-table {
    margin-bottom: 16px;
  }
</style>
</head>
<body data-active-menu="farming" data-active-submenu="farming-patrol">

<!-- ===== 整体布局容器 ===== -->
<div class="app-layout">

  <!-- ===== 侧边栏 ===== -->
  <nav class="sidebar" aria-label="主导航">
    <!-- 品牌区 -->
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <!-- 苹果绿 Logo SVG -->
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 3C8 1 5 3 5 6.5C5 10 8 14 11 17C14 14 17 10 17 6.5C17 3 14 1 11 3Z" fill="rgba(34,168,74,0.2)"/>
          <path d="M11 5C9.5 4 7.5 5 7.5 7C7.5 9 9.5 12 11 14"/>
          <path d="M11 5C12.5 4 14.5 5 14.5 7C14.5 9 12.5 12 11 14"/>
          <path d="M11 3V1"/>
        </svg>
      </div>
      <span class="sidebar-brand-text">智慧果园</span>
    </div>

    <!-- 菜单主体（由 JS 动态渲染） -->
    <div class="sidebar-body"></div>

    <!-- 底部功能区 -->
    <div class="sidebar-footer">
      <button class="sidebar-footer-btn sidebar-collapse-btn" title="折叠侧边栏">
        <span class="collapse-icon">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 3L6 9L11 15"/><path d="M14 3V15"/>
          </svg>
        </span>
        <span class="btn-text">折叠</span>
      </button>
      <button class="sidebar-footer-btn" title="系统设置" id="btn-settings">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="9" r="2.5"/>
          <path d="M9 2V4M9 14V16M2 9H4M14 9H16M4.2 4.2L5.6 5.6M12.4 12.4L13.8 13.8M13.8 4.2L12.4 5.6M5.6 12.4L4.2 13.8"/>
        </svg>
        <span class="btn-text">设置</span>
      </button>
    </div>
  </nav>

  <!-- 移动端遮罩层 -->
  <div class="sidebar-overlay"></div>

  <!-- ===== 主内容区 ===== -->
  <div class="main-wrapper">

    <!-- 顶栏 -->
    <header class="topbar">
      <!-- 移动端汉堡菜单 -->
      <button class="topbar-hamburger" aria-label="打开导航菜单">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M3 6H19M3 11H19M3 16H19"/>
        </svg>
      </button>
      <!-- 右侧功能区 -->
      <div class="topbar-right">
        <!-- 通知铃铛 -->
        <button class="topbar-notification" title="消息通知">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 2C7 2 5 4.5 5 7.5V12L3 14H17L15 12V7.5C15 4.5 13 2 10 2Z"/>
            <path d="M8.5 16C8.5 17 9.2 18 10 18C10.8 18 11.5 17 11.5 16"/>
          </svg>
          <span class="badge">3</span>
        </button>

        <!-- 用户信息 -->
        <div class="topbar-user">
          <div class="topbar-user-avatar">张</div>
          <span class="topbar-user-name">张三</span>
          <span class="topbar-user-arrow">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;">
              <path d="M3 5L6 8L9 5"/>
            </svg>
          </span>
        </div>

        <!-- 用户下拉菜单 -->
        <div class="topbar-user-dropdown">
          <div class="dropdown-item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <circle cx="8" cy="5" r="3"/><path d="M2 15C2 11.5 5 10 8 10C11 10 14 11.5 14 15"/>
            </svg>
            个人中心
          </div>
          <div class="dropdown-item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <path d="M8 2V8L11 11"/><circle cx="8" cy="8" r="6"/>
            </svg>
            操作日志
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-item" style="color:var(--error);">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <path d="M6 2H3C2.45 2 2 2.45 2 3V13C2 13.55 2.45 14 3 14H6"/><path d="M10 11L14 8L10 5"/><path d="M14 8H6"/>
            </svg>
            退出登录
          </div>
        </div>
      </div>
    </header>

    <!-- Tab 标签栏 -->
    <div class="tab-bar">
      <!-- Tab 标签由 JS 动态渲染 -->
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
      <div class="content-wrapper">
        <!-- ===== 页面头部 ===== -->
        <div class="page-header">
          <div>
            <h1 class="page-title">巡园管理</h1>
            <p class="page-subtitle">管理果园巡园工作，及时发现和处理异常问题</p>
          </div>
        </div>

        <!-- 统计卡片区 -->
        <div class="patrol-stats">
          <div class="patrol-stat-card green">
            <div class="stat-value">23</div>
            <div class="stat-label">今日巡园次数</div>
          </div>
          <div class="patrol-stat-card orange">
            <div class="stat-value">5</div>
            <div class="stat-label">发现异常问题</div>
          </div>
          <div class="patrol-stat-card red">
            <div class="stat-value">87%</div>
            <div class="stat-label">问题处理率</div>
          </div>
          <div class="patrol-stat-card blue">
            <div class="stat-value">92%</div>
            <div class="stat-label">打卡完成率</div>
          </div>
        </div>

        <!-- 搜索栏区 -->
        <div class="page-section search-section">
          <div class="search-bar">
            <select class="search-select" id="baseSelect">
              <option value="">选择基地</option>
              <option value="ytqx">烟台栖霞基地</option>
              <option value="whrc">威海荣成基地</option>
              <option value="qdlx">青岛莱西基地</option>
              <option value="zy">招远基地</option>
              <option value="pl">蓬莱阁基地</option>
            </select>
            <select class="search-select" id="patrolTypeSelect">
              <option value="">巡查类型</option>
              <option value="daily">日常巡园</option>
              <option value="special">专项检查</option>
              <option value="pest">病虫害巡查</option>
              <option value="weather">气象巡查</option>
              <option value="growth">生长巡查</option>
            </select>
            <select class="search-select" id="statusSelect">
              <option value="">全部状态</option>
              <option value="normal">无异常</option>
              <option value="warning">发现病虫害</option>
              <option value="danger">设备异常</option>
              <option value="other">其他异常</option>
            </select>
            <input type="date" class="search-date" id="dateStart">
            <span class="date-separator">至</span>
            <input type="date" class="search-date" id="dateEnd">
            <input type="text" class="search-input" placeholder="搜索巡园人员..." id="searchInput">
            <button class="jg-btn" onclick="handleSearch()">搜索</button>
          </div>
        </div>

        <!-- 操作按钮区 -->
        <div class="page-section action-bar">
          <div class="action-buttons">
            <button class="jg-btn jg-btn-primary" onclick="Modal.show('modal-add-patrol')">
              <span>+</span>新建巡查
            </button>
            <button class="jg-btn" onclick="Modal.show('modal-export')">
              <span>↓</span>导出巡查
            </button>
            <button class="jg-btn" onclick="refreshData()">
              <span>⟳</span>刷新数据
            </button>
          </div>
        </div>

        <!-- 数据列表区 -->
        <div class="page-section data-section">
          <table class="data-table">
            <thead>
              <tr>
                <th class="checkbox-col"><input type="checkbox" id="selectAll"></th>
                <th>巡查编号</th>
                <th>所属基地</th>
                <th>巡查类型</th>
                <th>巡查地块</th>
                <th>巡查人员</th>
                <th>巡查时间</th>
                <th>发现问题</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="dataTableBody">
            </tbody>
          </table>
        </div>
        <div id="pagination-container">
        </div>
      </div>

    </div>
  </main>
</div>
  <div id="modal-add-patrol" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">新建巡查记录</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="form-add-patrol" class="modal-form">
          <div class="form-group">
            <label>所属基地</label>
            <select class="form-control">
              <option value="">请选择基地</option>
              <option value="ytqx">烟台栖霞基地</option>
              <option value="whrc">威海荣成基地</option>
              <option value="qdlx">青岛莱西基地</option>
              <option value="zy">招远基地</option>
              <option value="pl">蓬莱阁基地</option>
            </select>
          </div>
          <div class="form-group">
            <label>巡查类型</label>
            <select class="form-control">
              <option value="">请选择类型</option>
              <option value="daily">日常巡园</option>
              <option value="special">专项检查</option>
              <option value="pest">病虫害巡查</option>
              <option value="weather">气象巡查</option>
              <option value="growth">生长巡查</option>
            </select>
          </div>
          <div class="form-group">
            <label>巡查地块</label>
            <input type="text" class="form-control" placeholder="例如：D-001, D-002">
          </div>
          <div class="form-group">
            <label>巡查人员</label>
            <input type="text" class="form-control" placeholder="请输入巡查人员">
          </div>
          <div class="form-group">
            <label>巡查时间</label>
            <input type="datetime-local" class="form-control">
          </div>
          <div class="form-group">
            <label>发现问题</label>
            <select class="form-control">
              <option value="normal">无异常</option>
              <option value="warning">发现病虫害</option>
              <option value="danger">设备异常</option>
              <option value="other">其他异常</option>
            </select>
          </div>
          <div class="form-group">
            <label>问题描述</label>
            <textarea class="form-control" rows="3" placeholder="请输入问题描述"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-add-patrol')">取消</button>
        <button class="jg-btn jg-btn-primary" onclick="submitAddPatrol()">确定</button>
      </div>
    </div>
  </div>

  <!-- 导出巡查模态框 -->
  <div id="modal-export" class="modal-overlay">
    <div class="modal-box" style="max-width: 420px;">
      <div class="modal-header">
        <h3 class="modal-title">导出巡查记录</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p style="color: var(--text-secondary); margin-bottom: 16px;">请选择导出格式：</p>
        <div style="display: flex; gap: 12px;">
          <button class="jg-btn jg-btn-primary" onclick="exportPatrol('excel')">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;margin-right:6px;">
              <path d="M10 2H2v16h16V8l-6-6z"/>
              <path d="M14 2v6h6M13 9H7M13 13H7M13 17H7"/>
            </svg>
            Excel格式
          </button>
          <button class="jg-btn" onclick="exportPatrol('pdf')">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;margin-right:6px;">
              <path d="M10 2H2v16h16V8l-6-6z"/>
              <path d="M14 2v6h6M13 9H7M13 13H7M13 17H7"/>
            </svg>
            PDF格式
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-export')">关闭</button>
      </div>
    </div>
  </div>

  <!-- 详情模态框 -->
  <div id="modal-detail" class="modal-overlay">
    <div class="modal-box" style="max-width: 600px;">
      <div class="modal-header">
        <h3 class="modal-title">巡查详情</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="detail-content">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div style="padding: 12px; background: var(--gray-50); border-radius: 8px;">
              <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px;">巡查编号</div>

            <div style="padding: 12px; background: var(--gray-50); border-radius: 8px;">
              <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px;">所属基地</div>

            <div style="padding: 12px; background: var(--gray-50); border-radius: 8px;">

              <div id="detail-plots" style="font-weight: 600;">D-001, D-002, D-003</div>
            </div>
            <div style="padding: 12px; background: var(--gray-50); border-radius: 8px;">
              <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px;">巡查人员</div>
              <div id="detail-person" style="font-weight: 600;">李技术员</div>

              <div id="detail-time" style="font-weight: 600;">2024-04-15 08:30</div>
            </div>
          </div>
          <div style="margin-top: 16px; padding: 12px; background: var(--gray-50); border-radius: 8px;">
            <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px;">问题描述</div>
            <div id="detail-desc" style="font-weight: 500;">巡查区域内果树生长正常，无病虫害迹象，设备运行良好。</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-detail')">关闭</button>
      </div>
    </div>
  </div>

  <!-- 编辑模态框 -->
  <div id="modal-edit" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">编辑巡查记录</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="form-edit-patrol" class="modal-form">
          <div class="form-group">
            <label>所属基地</label>
            <select class="form-control" id="edit-base">
              <option value="ytqx" selected>烟台栖霞基地</option>
              <option value="whrc">威海荣成基地</option>

      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-edit')">取消</button>
        <button class="jg-btn jg-btn-primary" onclick="submitEditPatrol()">确定</button>
      </div>
    </div>
  </div>

</div>

// 获取问题标签
function getIssueTag(issue) {
  const issueMap = {
    'normal': '<span class="status-tag normal">无异常</span>',
    'warning': '<span class="status-tag warning">发现病虫害</span>',
    'danger': '<span class="status-tag danger">设备异常</span>'
  };
  return issueMap[issue] || issueMap['normal'];
}

// 渲染表格行
function renderRow(item, index) {
  return `<tr>
    <td class="checkbox-col"><input type="checkbox"></td>
    <td><strong>${item.id}</strong></td>
    <td>${item.base}</td>
    <td>${item.type}</td>
    <td>${item.plots}</td>
    <td>${item.inspector}</td>
    <td>${item.time}</td>
    <td>${getIssueTag(item.issue)}</td>
    <td>
      <div class="action-btns">
        <button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>
        <button class="action-btn edit" onclick="showEdit('${item.id}')">编辑</button>
        <button class="action-btn delete" onclick="showDeleteConfirm('${item.id}')">删除</button>
      </div>
    </td>
  </tr>`;
}

// 搜索功能
function handleSearch() {
  var keyword = document.getElementById('searchInput').value.trim();
  var base = document.getElementById('baseSelect').value;
  var patrolType = document.getElementById('patrolTypeSelect').value;

  var filteredData = mockData.filter(item => {
    if (keyword && !item.id.includes(keyword)) return false;
    if (base && !item.base.includes(base)) return false;
    if (patrolType && item.type !== patrolType) return false;
    return true;
  });

  Pagination.updateData(filteredData);
  Toast.info('找到 ' + filteredData.length + ' 条记录');
}

// 刷新数据
function refreshData() {
  Toast.success('数据已刷新');
}

// 显示详情
function showDetail(id) {
  currentPatrolId = id;
  document.getElementById('detail-id').textContent = id;
  Modal.show('modal-detail');
}

// 显示编辑
function showEdit(id) {
  currentPatrolId = id;
  Modal.show('modal-edit');
}

// 显示删除确认
function showDeleteConfirm(id) {
  currentPatrolId = id;
  ConfirmDialog.show({
    title: '删除巡查记录',
    message: '确定要删除巡查记录 "' + id + '" 吗？此操作不可撤销。',
    onConfirm: function() {
      Toast.success('巡查记录 "' + currentPatrolId + '" 已删除');
    }
  });
}

// 提交新建巡查
function submitAddPatrol() {
  Toast.success('巡查记录创建成功');
  Modal.hide('modal-add-patrol');
}

// 提交编辑巡查
function submitEditPatrol() {
  Toast.success('巡查记录 "' + currentPatrolId + '" 已更新');
  Modal.hide('modal-edit');
}

// 导出巡查
function exportPatrol(format) {
  Toast.success('巡查记录已导出为' + (format === 'excel' ? 'Excel' : 'PDF') + '格式');
  Modal.hide('modal-export');
}

// 初始化分页
document.addEventListener('DOMContentLoaded', function() {
  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: mockData,
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderRow
  });
});
</script>
