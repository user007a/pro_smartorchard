<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition:all 0.2s ease;
  }
  .module-card:hover {
    background:var(--bg-hover);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }

  /* checkbox列样式 */
  .checkbox-col {
    width:40px;
    text-align:center;
  }
  .checkbox-col input[type="checkbox"] {
    width:16px;
    height:16px;
    cursor:pointer;
  }

  /* 日期输入框样式 */
  .search-date {
    padding:8px 12px;
    border:1px solid var(--border-color);
    border-radius:4px;
    font-size:14px;
    background:var(--bg-input);
    color:var(--text-primary);
    min-width:140px;
  }
  .search-date:focus {
    outline:none;
    border-color:var(--primary);
  }

  /* 操作按钮区样式 */
  .action-buttons {
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }

  /* 页面分区样式 */
  .page-section {
    margin-bottom:20px;
  }

  /* 数据区样式 */
  .data-section .data-table {
    margin-bottom:16px;
  }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>

// 获取问题标签
function getIssueTag(issue) {
  const issueMap = {
    'normal': '<span class="status-tag normal">无异常</span>',
    'warning': '<span class="status-tag warning">发现病虫害</span>',
    'danger': '<span class="status-tag danger">设备异常</span>'
  };
  return issueMap[issue] || issueMap['normal'];
}

// 渲染表格行
function renderRow(item, index) {
  return `<tr>
    <td class="checkbox-col">${index + 1}</td>
    <td><strong>${item.id}</strong></td>
    <td>${item.base}</td>
    <td>${item.type}</td>
    <td>${item.plots}</td>
    <td>${item.inspector}</td>
    <td>${item.time}</td>
    <td>${getIssueTag(item.issue)}</td>
    <td>
      <div class="action-btns">
        <button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>
        <button class="action-btn edit" onclick="showEdit('${item.id}')">编辑</button>
        <button class="action-btn delete" onclick="showDeleteConfirm('${item.id}')">删除</button>
      </div>
    </td>
  </tr>`;
}

// 搜索功能
function handleSearch() {
  var keyword = document.getElementById('searchInput').value.trim();
  var base = document.getElementById('baseSelect').value;
  var patrolType = document.getElementById('patrolTypeSelect').value;

  var filteredData = mockData.filter(item => {
    if (keyword && !item.id.includes(keyword)) return false;
    if (base && !item.base.includes(base)) return false;
    if (patrolType && item.type !== patrolType) return false;
    return true;
  });

  Pagination.updateData(filteredData);
  Toast.info('找到 ' + filteredData.length + ' 条记录');
}

// 刷新数据
function refreshData() {
  Toast.success('数据已刷新');
}

// 显示详情
function showDetail(id) {
  currentPatrolId = id;
  document.getElementById('detail-id').textContent = id;
  Modal.show('modal-detail');
}

// 显示编辑
function showEdit(id) {
  currentPatrolId = id;
  Modal.show('modal-edit');
}

// 显示删除确认
function showDeleteConfirm(id) {
  currentPatrolId = id;
  ConfirmDialog.show({
    title: '删除巡查记录',
    message: '确定要删除巡查记录 "' + id + '" 吗？此操作不可撤销。',
    onConfirm: function() {
      Toast.success('巡查记录 "' + currentPatrolId + '" 已删除');
    }
  });
}

// 提交新建巡查
function submitAddPatrol() {
  Toast.success('巡查记录创建成功');
  Modal.hide('modal-add-patrol');
}

// 提交编辑巡查
function submitEditPatrol() {
  Toast.success('巡查记录 "' + currentPatrolId + '" 已更新');
  Modal.hide('modal-edit');
}

// 导出巡查
function exportPatrol(format) {
  Toast.success('巡查记录已导出为' + (format === 'excel' ? 'Excel' : 'PDF') + '格式');
  Modal.hide('modal-export');
}

// 初始化分页
document.addEventListener('DOMContentLoaded', function() {
  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: mockData,
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderRow
  });
});
</script>
