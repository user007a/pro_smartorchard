<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 采收记录</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .module-card {
    transition: all 0.2s ease;
  }
  .module-card:hover {
    background: var(--bg-hover);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .main-wrapper {
    margin-left: 0 !important;
    padding-left: 0 !important;
    width: 100% !important;
  }
  .main-content {
    margin-left: 0 !important;
    padding-left: 0 !important;
    width: 100% !important;
  }
  .content-wrapper {
    margin-left: 0 !important;
    padding-left: 0 !important;
    width: 100% !important;
  }
</style>
</head>
<body>

<div class="main-wrapper" style="padding:0;">
  <main class="main-content">
      <div class="content-wrapper">
        <!-- ===== 页面头部 ===== -->
        <div class="page-header">
          <div>
            <h1 class="page-title">采收记录</h1>
            <p class="page-subtitle">记录果园苹果采收数据，支持分级管理和统计分析</p>
          </div>
        </div>

        <div class="patrol-stats">
          <div class="patrol-stat-card green">
            <div class="stat-value">23</div>
            <div class="stat-label">记录总数</div>
          </div>
          <div class="patrol-stat-card orange">
            <div class="stat-value">5</div>
            <div class="stat-label">待处理</div>
          </div>
          <div class="patrol-stat-card blue">
            <div class="stat-value">15</div>
            <div class="stat-label">已完成</div>
          </div>
          <div class="patrol-stat-card purple">
            <div class="stat-value">3</div>
            <div class="stat-label">处理中</div>
          </div>
        </div>

        <div class="page-section search-section">
          <div class="search-bar">
            <select class="search-select" id="baseSelect">
              <option value="">选择基地</option>
              <option value="ytqx">烟台栖霞基地</option>
              <option value="whrc">威海荣成基地</option>
              <option value="qdlx">青岛莱西基地</option>
              <option value="zy">招远基地</option>
              <option value="pl">蓬莱阁基地</option>
            </select>
            <select class="search-select" style="min-width:120px;">
              <option value="">全部状态</option>
              <option value="pending">待处理</option>
              <option value="processing">处理中</option>
              <option value="completed">已完成</option>
            </select>
            <select class="search-select" style="min-width:100px;">
              <option value="">全部等级</option>
              <option value="level1">一级</option>
              <option value="level2">二级</option>
              <option value="level3">三级</option>
            </select>
            <input type="date" class="search-input" id="startDate" placeholder="开始日期">
            <span class="date-separator">至</span>
            <input type="date" class="search-input" id="endDate" placeholder="结束日期">
            <input type="text" class="search-input" placeholder="搜索记录编号..." id="searchInput">
            <button class="jg-btn" onclick="handleSearch()">搜索</button>
          </div>
        </div>

        <div class="page-section action-bar">
          <button class="jg-btn jg-btn-primary" onclick="Modal.show('modal-add-record')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M12 5v14"/>
              <path d="M5 12h14"/>
            </svg>
            新建记录
          </button>
          <button class="jg-btn" onclick="Modal.show('modal-export')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" x2="12" y1="15" y2="3"/>
            </svg>
            导出记录
          </button>
        </div>

        <div class="page-section data-section">
          <div class="data-table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width:40px;">
                    <input type="checkbox" style="width:16px;height:16px;">
                  </th>
                  <th style="width:120px;">记录编号</th>
                  <th style="width:140px;">所属基地</th>
                  <th style="width:100px;">地块</th>
                  <th style="width:90px;">采收量(kg)</th>
                  <th style="width:80px;">等级</th>
                  <th style="width:80px;">状态</th>
                  <th style="width:100px;">采收日期</th>
                  <th style="width:80px;">操作</th>
                </tr>
              </thead>
              <tbody id="dataTableBody">
              </tbody>
            </table>
          </div>
          <div id="pagination-container">
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-add-record" class="modal-overlay">
    <div class="modal-box" style="max-width: 600px;">
      <div class="modal-header">
        <h3 class="modal-title">新建采收记录</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="form-add-record" class="modal-form">
          <div class="form-group">
            <label>所属基地</label>
            <select class="form-control">
              <option value="">请选择基地</option>
              <option value="ytqx">烟台栖霞基地</option>
              <option value="whrc">威海荣成基地</option>
              <option value="qdlx">青岛莱西基地</option>
              <option value="zy">招远基地</option>
              <option value="pl">蓬莱阁基地</option>
            </select>
          </div>
          <div class="form-group">
            <label>地块编号</label>
            <input type="text" class="form-control" placeholder="请输入地块编号">
          </div>
          <div class="form-group">
            <label>采收量(kg)</label>
            <input type="number" class="form-control" placeholder="请输入采收量">
          </div>
          <div class="form-group">
            <label>苹果等级</label>
            <select class="form-control">
              <option value="">请选择等级</option>
              <option value="level1">一级</option>
              <option value="level2">二级</option>
              <option value="level3">三级</option>
            </select>
          </div>
          <div class="form-group">
            <label>采收日期</label>
            <input type="date" class="form-control">
          </div>
          <div class="form-group">
            <label>备注</label>
            <textarea class="form-control" rows="3" placeholder="请输入备注信息"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-add-record')">取消</button>
        <button class="jg-btn jg-btn-primary" onclick="submitAddRecord()">确定</button>
      </div>
    </div>
  </div>

  <div id="modal-export" class="modal-overlay">
    <div class="modal-box" style="max-width: 420px;">
      <div class="modal-header">
        <h3 class="modal-title">导出记录</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="export-options">
          <div class="export-option">
            <input type="radio" name="exportType" value="all" checked>
            <label>导出全部记录</label>
          </div>
          <div class="export-option">
            <input type="radio" name="exportType" value="selected">
            <label>导出选中记录</label>
          </div>
          <div class="export-option">
            <input type="radio" name="exportType" value="filtered">
            <label>导出筛选结果</label>
          </div>
        </div>
        <div class="export-format">
          <label>导出格式</label>
          <select class="form-control">
            <option value="excel">Excel (.xlsx)</option>
            <option value="csv">CSV (.csv)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-export')">取消</button>
        <button class="jg-btn jg-btn-primary" onclick="handleExport()">导出</button>
      </div>
    </div>
  </div>

  <div id="modal-detail" class="modal-overlay">
    <div class="modal-box" style="max-width: 600px;">
      <div class="modal-header">
        <h3 class="modal-title">采收记录详情</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="detail-info">
          <div class="detail-row">
            <span class="detail-label">记录编号</span>
            <span class="detail-value" id="detail-id"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">所属基地</span>
            <span class="detail-value" id="detail-base"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">地块编号</span>
            <span class="detail-value" id="detail-plot"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">采收量</span>
            <span class="detail-value" id="detail-quantity"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">苹果等级</span>
            <span class="detail-value" id="detail-level"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">采收日期</span>
            <span class="detail-value" id="detail-date"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">状态</span>
            <span class="detail-value" id="detail-status"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">备注</span>
            <span class="detail-value" id="detail-remark"></span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-detail')">关闭</button>
      </div>
    </div>
  </div>

  <div id="modal-edit" class="modal-overlay">
    <div class="modal-box" style="max-width: 600px;">
      <div class="modal-header">
        <h3 class="modal-title">编辑采收记录</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="form-edit-record" class="modal-form">
          <input type="hidden" id="edit-id">
          <div class="form-group">
            <label>所属基地</label>
            <select class="form-control" id="edit-base">
              <option value="">请选择基地</option>
              <option value="ytqx">烟台栖霞基地</option>
              <option value="whrc">威海荣成基地</option>
              <option value="qdlx">青岛莱西基地</option>
              <option value="zy">招远基地</option>
              <option value="pl">蓬莱阁基地</option>
            </select>
          </div>
          <div class="form-group">
            <label>地块编号</label>
            <input type="text" class="form-control" id="edit-plot" placeholder="请输入地块编号">
          </div>
          <div class="form-group">
            <label>采收量(kg)</label>
            <input type="number" class="form-control" id="edit-quantity" placeholder="请输入采收量">
          </div>
          <div class="form-group">
            <label>苹果等级</label>
            <select class="form-control" id="edit-level">
              <option value="">请选择等级</option>
              <option value="level1">一级</option>
              <option value="level2">二级</option>
              <option value="level3">三级</option>
            </select>
          </div>
          <div class="form-group">
            <label>采收日期</label>
            <input type="date" class="form-control" id="edit-date">
          </div>
          <div class="form-group">
            <label>备注</label>
            <textarea class="form-control" rows="3" id="edit-remark" placeholder="请输入备注信息"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-edit')">取消</button>
        <button class="jg-btn jg-btn-primary" onclick="submitEditRecord()">确定</button>
      </div>
    </div>
  </div>

  <div id="modal-delete" class="modal-overlay">
    <div class="modal-box" style="max-width: 400px;">
      <div class="modal-header">
        <h3 class="modal-title">确认删除</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p>确定要删除这条采收记录吗？此操作不可撤销。</p>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-delete')">取消</button>
        <button class="jg-btn jg-btn-danger" onclick="confirmDelete()">删除</button>
      </div>
    </div>
  </div>

  <script src="js/common-functions.js"></script>
  <script>
    const harvestRecords = [
      { id: 'HSR-2024-001', base: '烟台栖霞基地', plot: 'A-001', quantity: 1250, level: 'level1', levelName: '一级', date: '2024-05-20', status: 'completed', remark: '第一批采收' },
      { id: 'HSR-2024-002', base: '威海荣成基地', plot: 'B-002', quantity: 890, level: 'level1', levelName: '一级', date: '2024-05-21', status: 'completed', remark: '' },
      { id: 'HSR-2024-003', base: '青岛莱西基地', plot: 'C-003', quantity: 1560, level: 'level2', levelName: '二级', date: '2024-05-22', status: 'processing', remark: '部分已装箱' },
      { id: 'HSR-2024-004', base: '招远基地', plot: 'D-004', quantity: 780, level: 'level1', levelName: '一级', date: '2024-05-23', status: 'pending', remark: '' },
      { id: 'HSR-2024-005', base: '蓬莱阁基地', plot: 'E-005', quantity: 1100, level: 'level2', levelName: '二级', date: '2024-05-24', status: 'completed', remark: '' },
      { id: 'HSR-2024-006', base: '烟台栖霞基地', plot: 'A-006', quantity: 920, level: 'level3', levelName: '三级', date: '2024-05-25', status: 'pending', remark: '待分级' },
      { id: 'HSR-2024-007', base: '威海荣成基地', plot: 'B-007', quantity: 1340, level: 'level1', levelName: '一级', date: '2024-05-26', status: 'completed', remark: '' },
      { id: 'HSR-2024-008', base: '青岛莱西基地', plot: 'C-008', quantity: 650, level: 'level2', levelName: '二级', date: '2024-05-27', status: 'processing', remark: '' },
      { id: 'HSR-2024-009', base: '招远基地', plot: 'D-009', quantity: 1420, level: 'level1', levelName: '一级', date: '2024-05-28', status: 'completed', remark: '优质果' },
      { id: 'HSR-2024-010', base: '蓬莱阁基地', plot: 'E-010', quantity: 870, level: 'level2', levelName: '二级', date: '2024-05-29', status: 'pending', remark: '' },
      { id: 'HSR-2024-011', base: '烟台栖霞基地', plot: 'A-011', quantity: 1680, level: 'level1', levelName: '一级', date: '2024-05-30', status: 'completed', remark: '' },
      { id: 'HSR-2024-012', base: '威海荣成基地', plot: 'B-012', quantity: 720, level: 'level3', levelName: '三级', date: '2024-05-31', status: 'processing', remark: '' },
      { id: 'HSR-2024-013', base: '青岛莱西基地', plot: 'C-013', quantity: 1200, level: 'level1', levelName: '一级', date: '2024-06-01', status: 'completed', remark: '' },
      { id: 'HSR-2024-014', base: '招远基地', plot: 'D-014', quantity: 980, level: 'level2', levelName: '二级', date: '2024-06-02', status: 'pending', remark: '' },
      { id: 'HSR-2024-015', base: '蓬莱阁基地', plot: 'E-015', quantity: 1550, level: 'level1', levelName: '一级', date: '2024-06-03', status: 'completed', remark: '高产' },
      { id: 'HSR-2024-016', base: '烟台栖霞基地', plot: 'A-016', quantity: 830, level: 'level2', levelName: '二级', date: '2024-06-04', status: 'completed', remark: '' },
      { id: 'HSR-2024-017', base: '威海荣成基地', plot: 'B-017', quantity: 1120, level: 'level1', levelName: '一级', date: '2024-06-05', status: 'processing', remark: '' },
      { id: 'HSR-2024-018', base: '青岛莱西基地', plot: 'C-018', quantity: 690, level: 'level3', levelName: '三级', date: '2024-06-06', status: 'pending', remark: '' },
      { id: 'HSR-2024-019', base: '招远基地', plot: 'D-019', quantity: 1380, level: 'level1', levelName: '一级', date: '2024-06-07', status: 'completed', remark: '' },
      { id: 'HSR-2024-020', base: '蓬莱阁基地', plot: 'E-020', quantity: 950, level: 'level2', levelName: '二级', date: '2024-06-08', status: 'completed', remark: '' },
      { id: 'HSR-2024-021', base: '烟台栖霞基地', plot: 'A-021', quantity: 1450, level: 'level1', levelName: '一级', date: '2024-06-09', status: 'pending', remark: '' },
      { id: 'HSR-2024-022', base: '威海荣成基地', plot: 'B-022', quantity: 770, level: 'level2', levelName: '二级', date: '2024-06-10', status: 'completed', remark: '' },
      { id: 'HSR-2024-023', base: '青岛莱西基地', plot: 'C-023', quantity: 1080, level: 'level1', levelName: '一级', date: '2024-06-11', status: 'processing', remark: '正在装箱' }
    ];

    function getStatusTag(status) {
      const statusMap = {
        'completed': '<span class="status-tag normal">已完成</span>',
        'processing': '<span class="status-tag" style="background:#e6f7ff;color:#096dd9;border-color:#91d5ff;">处理中</span>',
        'pending': '<span class="status-tag warning">待处理</span>'
      };
      return statusMap[status] || statusMap['pending'];
    }

    function renderRow(item, index) {
      return `
        <tr>
          <td><input type="checkbox" style="width:16px;height:16px;"></td>
          <td><strong>${item.id}</strong></td>
          <td>${item.base}</td>
          <td>${item.plot}</td>
          <td class="text-right">${item.quantity.toLocaleString()}</td>
          <td>${item.levelName}</td>
          <td>${getStatusTag(item.status)}</td>
          <td>${item.date}</td>
          <td>
            <div class="action-btns">
              <button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>
              <button class="action-btn edit" onclick="showEdit('${item.id}')">编辑</button>
              <button class="action-btn delete" onclick="showDeleteConfirm('${item.id}')">删除</button>
            </div>
          </td>
        </tr>
      `;
    }

    function handleSearch() {
      const base = document.getElementById('baseSelect').value;
      const status = document.querySelector('.search-select:nth-child(2)').value;
      const level = document.querySelector('.search-select:nth-child(3)').value;
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const keyword = document.getElementById('searchInput').value.toLowerCase();

      const filteredData = harvestRecords.filter(item => {
        if (base && !item.base.includes(base === 'ytqx' ? '烟台栖霞' : base === 'whrc' ? '威海荣成' : base === 'qdlx' ? '青岛莱西' : base === 'zy' ? '招远' : base === 'pl' ? '蓬莱阁' : '')) return false;
        if (status && item.status !== status) return false;
        if (level && item.level !== level) return false;
        if (startDate && item.date < startDate) return false;
        if (endDate && item.date > endDate) return false;
        if (keyword && !item.id.toLowerCase().includes(keyword)) return false;
        return true;
      });
      
      Pagination.updateData(filteredData);
      Toast.info('找到 ' + filteredData.length + ' 条记录');
    }

    function showDetail(id) {
      const item = harvestRecords.find(r => r.id === id);
      if (item) {
        document.getElementById('detail-id').textContent = item.id;
        document.getElementById('detail-base').textContent = item.base;
        document.getElementById('detail-plot').textContent = item.plot;
        document.getElementById('detail-quantity').textContent = item.quantity + ' kg';
        document.getElementById('detail-level').textContent = item.levelName;
        document.getElementById('detail-date').textContent = item.date;
        document.getElementById('detail-status').innerHTML = getStatusTag(item.status);
        document.getElementById('detail-remark').textContent = item.remark || '-';
        Modal.show('modal-detail');
      }
    }

    let editingId = null;

    function showEdit(id) {
      editingId = id;
      const item = harvestRecords.find(r => r.id === id);
      if (item) {
        document.getElementById('edit-id').value = item.id;
        document.getElementById('edit-base').value = item.base.includes('烟台栖霞') ? 'ytqx' : item.base.includes('威海荣成') ? 'whrc' : item.base.includes('青岛莱西') ? 'qdlx' : item.base.includes('招远') ? 'zy' : 'pl';
        document.getElementById('edit-plot').value = item.plot;
        document.getElementById('edit-quantity').value = item.quantity;
        document.getElementById('edit-level').value = item.level;
        document.getElementById('edit-date').value = item.date;
        document.getElementById('edit-remark').value = item.remark;
        Modal.show('modal-edit');
      }
    }

    function submitEditRecord() {
      const index = harvestRecords.findIndex(r => r.id === editingId);
      if (index !== -1) {
        harvestRecords[index] = {
          ...harvestRecords[index],
          base: document.getElementById('edit-base').value === 'ytqx' ? '烟台栖霞基地' : document.getElementById('edit-base').value === 'whrc' ? '威海荣成基地' : document.getElementById('edit-base').value === 'qdlx' ? '青岛莱西基地' : document.getElementById('edit-base').value === 'zy' ? '招远基地' : '蓬莱阁基地',
          plot: document.getElementById('edit-plot').value,
          quantity: parseInt(document.getElementById('edit-quantity').value),
          level: document.getElementById('edit-level').value,
          levelName: document.getElementById('edit-level').value === 'level1' ? '一级' : document.getElementById('edit-level').value === 'level2' ? '二级' : '三级',
          date: document.getElementById('edit-date').value,
          remark: document.getElementById('edit-remark').value
        };
      }
      Modal.hide('modal-edit');
      handleSearch();
      Toast.success('修改成功');
    }

    let deletingId = null;

    function showDeleteConfirm(id) {
      deletingId = id;
      Modal.show('modal-delete');
    }

    function confirmDelete() {
      const index = harvestRecords.findIndex(r => r.id === deletingId);
      if (index !== -1) {
        harvestRecords.splice(index, 1);
      }
      Modal.hide('modal-delete');
      handleSearch();
      Toast.success('删除成功');
    }

    function submitAddRecord() {
      const newRecord = {
        id: 'HSR-2024-' + String(harvestRecords.length + 1).padStart(3, '0'),
        base: document.querySelector('#form-add-record select:nth-child(1)').value === 'ytqx' ? '烟台栖霞基地' : document.querySelector('#form-add-record select:nth-child(1)').value === 'whrc' ? '威海荣成基地' : document.querySelector('#form-add-record select:nth-child(1)').value === 'qdlx' ? '青岛莱西基地' : document.querySelector('#form-add-record select:nth-child(1)').value === 'zy' ? '招远基地' : '蓬莱阁基地',
        plot: document.querySelector('#form-add-record input:nth-child(1)').value,
        quantity: parseInt(document.querySelector('#form-add-record input:nth-child(2)').value),
        level: document.querySelector('#form-add-record select:nth-child(2)').value,
        levelName: document.querySelector('#form-add-record select:nth-child(2)').value === 'level1' ? '一级' : document.querySelector('#form-add-record select:nth-child(2)').value === 'level2' ? '二级' : '三级',
        date: document.querySelector('#form-add-record input:nth-child(3)').value,
        status: 'pending',
        remark: document.querySelector('#form-add-record textarea').value
      };
      harvestRecords.unshift(newRecord);
      Modal.hide('modal-add-record');
      handleSearch();
      Toast.success('创建成功');
    }

    function handleExport() {
      Modal.hide('modal-export');
      Toast.success('导出成功');
    }

    document.addEventListener('DOMContentLoaded', function() {
      Pagination.init({
        currentPage: 1,
        pageSize: 10,
        data: harvestRecords,
        containerId: 'pagination-container',
        tbodyId: 'dataTableBody',
        renderRow: renderRow
      });
    });
  </script>
</body>
</html>
