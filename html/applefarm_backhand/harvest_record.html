<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 采收记录</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .module-card {
    transition:all 0.2s ease;
  }
  .module-card:hover {
    background:var(--bg-hover);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }
  /* 分页栏样式（与农事计划一致） */
  #pagination-container { padding:12px 16px; }
  .main-wrapper {
    margin-left:0 !important;
    padding-left:0 !important;
    width:100% !important;
  }
  .main-content {
    margin-left:0 !important;
    padding-left:0 !important;
    width:100% !important;
  }
  .content-wrapper {
    margin-left:0 !important;
    padding-left:0 !important;
    width:100% !important;
  }
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body>

<div class="main-wrapper" style="padding:0;">
  <main class="main-content">
      <div class="content-wrapper">

        <!-- 采收统计分析 -->
        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;">
          <div class="chart-section" style="margin-bottom:0;">
            <h2 class="section-title">品种采收量占比</h2>
            <div id="chart-variety" class="chart-container" style="height:260px;"></div>
          </div>
          <div class="chart-section" style="margin-bottom:0;">
            <h2 class="section-title">基地采收量(kg)</h2>
            <div id="chart-base" class="chart-container" style="height:260px;"></div>
          </div>
          <div class="chart-section" style="margin-bottom:0;">
            <h2 class="section-title">采收量趋势(kg)</h2>
            <div id="chart-trend" class="chart-container" style="height:260px;"></div>
          </div>
        </div>

        <div class="page-section search-section" style="margin-top:16px;">
          <div class="search-bar">
            <select class="search-select" id="baseSelect">
              <option value="">全部基地</option>
              <option value="天水麦积区基地">天水麦积区基地</option>
              <option value="天水荣成基地">天水荣成基地</option>
              <option value="甘肃吉县苹果园">甘肃吉县苹果园</option>
              <option value="甘肃麦积区苹果园">甘肃麦积区苹果园</option>
              <option value="天水麦积区苹果基地">天水麦积区苹果基地</option>
              <option value="甘肃麦积区苹果基地">甘肃麦积区苹果基地</option>
            </select>
            <select class="search-select" id="statusSelect" style="min-width:120px;">
              <option value="">全部状态</option>
              <option value="pending">待处理</option>
              <option value="processing">处理中</option>
              <option value="completed">已完成</option>
            </select>
            <select class="search-select" id="levelSelect" style="min-width:100px;">
              <option value="">全部等级</option>
              <option value="level1">一级</option>
              <option value="level2">二级</option>
              <option value="level3">三级</option>
            </select>
            <input type="date" class="search-input" id="startDate" placeholder="开始日期">
            <span class="date-separator">至</span>
            <input type="date" class="search-input" id="endDate" placeholder="结束日期">
            <input type="text" class="search-input" placeholder="搜索记录编号..." id="searchInput">
          <div class="search-actions"><button class="jg-btn jg-btn-primary" onclick="handleSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button><button class="jg-btn" onclick="smartReset()">重置</button></div>
          </div>
        </div>

        <div class="page-section action-bar">
          <button class="jg-btn jg-btn-primary" onclick="showAdd()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M12 5v14"/>
              <path d="M5 12h14"/>
            </svg>
            新建记录
          </button>
          <button class="jg-btn" onclick="Modal.show('modal-export')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" x2="12" y1="15" y2="3"/>
            </svg>
            导出记录
          </button>
        </div>

        <div class="page-section data-section">
          <div class="data-table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width:60px;">序号</th>
                  <th style="width:120px;">记录编号</th>
                  <th style="width:120px;">关联计划</th>
                  <th style="width:140px;">批次号</th>
                  <th style="width:140px;">所属基地</th>
                  <th style="width:150px;">地块</th>
                  <th style="width:100px;">品种</th>
                  <th style="width:100px;">采收量(kg)</th>
                  <th style="width:80px;">等级</th>
                  <th style="width:80px;">状态</th>
                  <th style="width:100px;">采收日期</th>
                  <th style="width:210px;">操作</th>
                </tr>
              </thead>
              <tbody id="dataTableBody">
              </tbody>
            </table>
          </div>
          <div id="pagination-container">
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-add-record" class="modal-overlay">
    <div class="modal-box" style="max-width:600px;">
      <div class="modal-header">
        <h3 class="modal-title">新建采收记录</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="form-add-record" class="modal-form">
          <div class="form-group">
            <label>关联计划</label>
            <select class="form-control" id="add-plan"></select>
          </div>
          <div class="form-group">
            <label>地块编号</label>
            <select class="form-control" id="add-plot"></select>
          </div>
          <div class="form-group">
            <label>所属基地</label>
            <select class="form-control" id="add-base">
              <option value="">请选择基地</option>
              <option value="天水麦积区基地">天水麦积区基地</option>
              <option value="天水荣成基地">天水荣成基地</option>
              <option value="甘肃吉县苹果园">甘肃吉县苹果园</option>
              <option value="甘肃麦积区苹果园">甘肃麦积区苹果园</option>
              <option value="天水麦积区苹果基地">天水麦积区苹果基地</option>
              <option value="甘肃麦积区苹果基地">甘肃麦积区苹果基地</option>
            </select>
          </div>
          <div class="form-group">
            <label>品种</label>
            <select class="form-control" id="add-variety">
              <option value="">请选择品种</option>
              <option value="花牛苹果">花牛苹果</option>
              <option value="红富士">红富士</option>
              <option value="金帅">金帅</option>
              <option value="秦冠">秦冠</option>
              <option value="嘎啦">嘎啦</option>
              <option value="红星">红星</option>
              <option value="国光">国光</option>
            </select>
          </div>
          <div class="form-group">
            <label>采收量(kg)</label>
            <input type="number" class="form-control" id="add-quantity" placeholder="请输入采收量">
          </div>
          <div class="form-group">
            <label>苹果等级</label>
            <select class="form-control" id="add-level">
              <option value="">请选择等级</option>
              <option value="level1">一级</option>
              <option value="level2">二级</option>
              <option value="level3">三级</option>
            </select>
          </div>
          <div class="form-group">
            <label>采收人</label>
            <select class="form-control" id="add-harvesters" multiple size="5" style="min-height:120px;">
              <option value="惠加宁">惠加宁</option>
              <option value="黄忠坚">黄忠坚</option>
              <option value="徐水应">徐水应</option>
              <option value="朱泉龙">朱泉龙</option>
              <option value="陈小忠">陈小忠</option>
              <option value="廖春亮">廖春亮</option>
              <option value="李建明">李建明</option>
              <option value="李根">李根</option>
              <option value="张才孙">张才孙</option>
              <option value="刘全国">刘全国</option>
              <option value="毛定卫">毛定卫</option>
              <option value="叶三东">叶三东</option>
              <option value="周才贵">周才贵</option>
              <option value="程名高">程名高</option>
              <option value="邓小华">邓小华</option>
              <option value="周成友">周成友</option>
              <option value="危红卫">危红卫</option>
              <option value="方超">方超</option>
              <option value="曹红英">曹红英</option>
              <option value="崔新根">崔新根</option>
              <option value="超级用户">超级用户</option>
            </select>
            <div style="font-size:12px;color:var(--text-tertiary);margin-top:4px;">按住 Ctrl/Cmd 多选</div>
          </div>
          <div class="form-group">
            <label>采收开始时间</label>
            <input type="datetime-local" class="form-control" id="add-start">
          </div>
          <div class="form-group">
            <label>采收结束时间</label>
            <input type="datetime-local" class="form-control" id="add-end">
          </div>
          <div class="form-group">
            <label>备注</label>
            <textarea class="form-control" rows="3" id="add-remark" placeholder="请输入备注信息"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-add-record')">取消</button>
        <button class="jg-btn jg-btn-primary" onclick="submitAddRecord()">确定</button>
      </div>
    </div>
  </div>

  <div id="modal-export" class="modal-overlay">
    <div class="modal-box" style="max-width:420px;">
      <div class="modal-header">
        <h3 class="modal-title">导出记录</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-item">
            <label>选择导出格式</label>
            <select class="form-select" id="exportFormat">
              <option value="excel">Excel (.xlsx)</option>
              <option value="csv">CSV (.csv)</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>导出范围</label>
            <div style="display:flex;gap:16px;">
              <label class="checkbox-label">
                <input type="radio" name="exportType" value="all" checked>
                <span>导出全部记录</span>
              </label>
              <label class="checkbox-label">
                <input type="radio" name="exportType" value="filtered">
                <span>导出筛选结果</span>
              </label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" onclick="Modal.hide('modal-export')">取消</button>
        <button class="jg-btn jg-btn-primary" onclick="handleExport()">导出</button>
      </div>
    </div>
  </div>

  <div id="modal-detail" class="modal-overlay">
    <div class="modal-box" style="max-width:640px;">
      <div class="modal-header">
        <h3 class="modal-title">采收记录详情</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="detail-grid">
          <div class="detail-item">
            <span class="detail-label">记录编号</span>

          </div>
          <div class="detail-item">
            <span class="detail-label">状态</span>
            <span class="detail-value" id="detail-status"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">关联计划</span>
            <span class="detail-value" id="detail-plan"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">所属基地</span>
            <span class="detail-value" id="detail-base"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">地块</span>
            <span class="detail-value" id="detail-plot"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">品种</span>
            <span class="detail-value" id="detail-variety"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">采收量</span>
            <span class="detail-value" id="detail-quantity"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">苹果等级</span>
            <span class="detail-value" id="detail-level"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">采收开始时间</span>
            <span class="detail-value" id="detail-start"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">采收结束时间</span>
            <span class="detail-value" id="detail-end"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">采收人</span>
            <span class="detail-value" id="detail-harvesters"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">追溯码</span>
            <span class="detail-value" id="detail-trace"></span>
          </div>
        </div>
        <div style="margin-top:16px; padding:12px; background:var(--gray-50); border-radius:8px;">
          <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">备注</div>
          <div style="font-weight:500;" id="detail-remark">-</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="jg-btn" id="btn-trace" onclick="generateTraceCode()">生成追溯码</button>
        <button class="jg-btn jg-btn-primary" onclick="Modal.hide('modal-detail')">关闭</button>
      </div>
    </div>
  </div>

  <div id="modal-edit" class="modal-overlay">

      <div class="modal-header">

            <path d="M4 4L12 12M12 4L4 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="form-edit-record" class="modal-form">

          <div class="form-group">

    <div class="modal-box" style="max-width:400px;">
      <div class="modal-header">
        <h3 class="modal-title">确认删除</h3>
        <button class="modal-close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

  <script>
    // 地块主数据（与企业管理 - 地块管理的 mockPlotData 保持一致）

    function getStatusTag(status) {
      const statusMap = {
        'completed': '<span class="status-tag normal">已完成</span>',
        'processing': '<span class="status-tag processing">处理中</span>',
        'pending': '<span class="status-tag pending">待处理</span>'
      };
      return statusMap[status] || statusMap['pending'];
    }

    const STATUS_NAME = { 'pending': '待处理', 'processing': '处理中', 'completed': '已完成' };

    function findRecord(id) {
      return harvestRecords.find(r => r.id === id);

    function renderRow(item, index) {
      let actions = `<button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>`
        + `<button class="action-btn edit" onclick="showEdit('${item.id}')">编辑</button>`;

      if (item.status === 'pending') {
        actions += `<button class="action-btn edit" onclick="advanceStatus('${item.id}')">开始处理</button>`;
      } else if (item.status === 'processing') {
        actions += `<button class="action-btn edit" onclick="advanceStatus('${item.id}')">完成</button>`;
      }
      actions += `<button class="action-btn delete" onclick="showDeleteConfirm('${item.id}')">删除</button>`;

      return `
        <tr>
          <td>${index + 1}</td>
          <td><strong>${item.id}</strong></td>
          <td>${item.plan}</td>
          <td><strong>${item.batchNo}</strong></td>
          <td>${item.base}</td>
          <td>${plotLabel(item.plot)}</td>
          <td>${item.variety}</td>
          <td class="text-right">${item.quantity.toLocaleString()}</td>
          <td>${item.levelName}</td>
          <td>${getStatusTag(item.status)}</td>
          <td>${item.startTime.slice(0, 10)}</td>
          <td><div class="action-btns">${actions}</div></td>
        </tr>
      `;
    }

    // 搜索：基地 + 状态 + 等级 + 日期范围 + 关键词
    function handleSearch() {
      const base = document.getElementById('baseSelect').value;
      const status = document.getElementById('statusSelect').value;
      const level = document.getElementById('levelSelect').value;
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

      const filteredData = harvestRecords.filter(item => {
        if (base && item.base !== base) return false;
        if (status && item.status !== status) return false;
        if (level && item.level !== level) return false;
        const recordDate = item.startTime.slice(0, 10);
        if (startDate && recordDate < startDate) return false;
        if (endDate && recordDate > endDate) return false;
        if (keyword && !item.id.toLowerCase().includes(keyword)) return false;
        return true;
      });

      Pagination.updateData(filteredData);
      renderCharts(filteredData);
      Toast.info('找到 ' + filteredData.length + ' 条记录');
    }

    // 统计分析图表（F-109：品种 / 基地 / 时间 三个维度）
    function renderCharts(data) {
      const varietyMap = {};
      const baseMap = {};
      const dateMap = {};
      data.forEach(item => {
        varietyMap[item.variety] = (varietyMap[item.variety] || 0) + item.quantity;
        baseMap[item.base] = (baseMap[item.base] || 0) + item.quantity;
        const d = item.startTime.slice(0, 10);
        dateMap[d] = (dateMap[d] || 0) + item.quantity;
      });

      const dates = Object.keys(dateMap).sort();

      Chart.donut('#chart-variety', {
        series: Object.keys(varietyMap).map(name => ({ name: name, value: varietyMap[name] }))
      });
      Chart.bar('#chart-base', {
        categories: Object.keys(baseMap),
        series: [{ name: '采收量', data: Object.keys(baseMap).map(k => baseMap[k]) }]
      });
      Chart.line('#chart-trend', {
        categories: dates,
        series: [{ name: '采收量', data: dates.map(d => dateMap[d]) }]
      });
    }

    function showDetail(id) {
      const item = findRecord(id);
      if (!item) return;
      currentRecordId = id;
      document.getElementById('detail-id').textContent = item.id;
      document.getElementById('detail-status').innerHTML = getStatusTag(item.status);
      document.getElementById('detail-plan').textContent = item.plan;
      document.getElementById('detail-base').textContent = item.base;
      document.getElementById('detail-plot').textContent = plotLabel(item.plot);
      document.getElementById('detail-variety').textContent = item.variety;
      document.getElementById('detail-quantity').textContent = item.quantity.toLocaleString() + ' kg';
      document.getElementById('detail-level').textContent = item.levelName;
      document.getElementById('detail-start').textContent = item.startTime;
      document.getElementById('detail-end').textContent = item.endTime;
      document.getElementById('detail-harvesters').textContent = item.harvesters || '-';
      document.getElementById('detail-trace').textContent = item.traceCode || '未生成';
      document.getElementById('detail-remark').textContent = item.remark || '-';
      updateTraceButton(item);
      Modal.show('modal-detail');
    }

    function updateTraceButton(item) {
      const btn = document.getElementById('btn-trace');
      if (item.traceCode) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.style.cursor = 'not-allowed';
        btn.textContent = '追溯码已生成';
      } else {
        btn.disabled = false;
        btn.style.opacity = '';
        btn.style.cursor = '';
        btn.textContent = '生成追溯码';
      }
    }

    // 生成追溯码（F-110：采收记录自动关联追溯模块）
    function generateTraceCode() {
      const item = findRecord(currentRecordId);
      if (!item || item.traceCode) return;
      const seq = harvestRecords.filter(r => r.traceCode).length + 1;
      item.traceCode = 'TRC-2026-' + String(seq).padStart(4, '0');
      document.getElementById('detail-trace').textContent = item.traceCode;
      updateTraceButton(item);
      Toast.success('追溯码已生成：' + item.traceCode);
    }

    // 状态流转（F-108 后续：待处理 → 处理中 → 已完成）
    function advanceStatus(id) {
      const item = findRecord(id);
      if (!item) return;
      if (item.status === 'pending') {
        item.status = 'processing';
        Toast.success(item.id + ' 已进入处理中');
      } else if (item.status === 'processing') {
        item.status = 'completed';
        Toast.success(item.id + ' 已完成采收处理');
      }
      handleSearch();
    }

    function showAdd() {
      document.getElementById('form-add-record').reset();
      fillPlots(document.getElementById('add-plot'), '');
      Modal.show('modal-add-record');
    }

    function submitAddRecord() {
      const plot = document.getElementById('add-plot').value;
      const base = document.getElementById('add-base').value;
      const variety = document.getElementById('add-variety').value;
      const quantity = document.getElementById('add-quantity').value;
      const level = document.getElementById('add-level').value;
      const startTime = document.getElementById('add-start').value;
      if (!plot || !base || !variety || !quantity || !level) {
        Toast.warning('请填写地块、基地、品种、采收量和等级');
        return;
      }
      if (!startTime) {
        Toast.warning('请填写采收开始时间');
        return;
      }
      const levelName = level === 'level1' ? '一级' : level === 'level2' ? '二级' : '三级';
      const newRecord = {
        id: 'HSR-2026-' + String(harvestRecords.length + 1).padStart(3, '0'),
        plan: document.getElementById('add-plan').value,
        base: base,
        plot: plot,
        variety: variety,
        quantity: parseInt(quantity, 10),
        level: level,
        levelName: levelName,
        harvesters: Array.from(document.getElementById('add-harvesters').selectedOptions).map(function(o){ return o.value; }).join('、'),
        startTime: (document.getElementById('add-start').value || '').replace('T', ' '),
        endTime: (document.getElementById('add-end').value || '').replace('T', ' '),
        status: 'pending',
        traceCode: '',
        remark: document.getElementById('add-remark').value.trim()
      };
      harvestRecords.unshift(newRecord);
      Modal.hide('modal-add-record');
      handleSearch();
      Toast.success('创建成功');
    }

    function showEdit(id) {
      const item = findRecord(id);
      if (!item) return;
      editingId = id;
      fillPlots(document.getElementById('edit-plot'), item.plot);
      document.getElementById('edit-plan').value = item.plan;
      document.getElementById('edit-base').value = item.base;
      document.getElementById('edit-variety').value = item.variety;
      document.getElementById('edit-quantity').value = item.quantity;
      document.getElementById('edit-level').value = item.level;
      // 多选下拉：根据 harvesters 字符串（如「惠加宁、黄忠坚」）逐项匹配 selected
      const harvesterSel = document.getElementById('edit-harvesters');
      if (harvesterSel) {
        const arr = (item.harvesters || '').split(/[、,,，\s]+/).filter(Boolean);
        for (let i = 0; i < harvesterSel.options.length; i++) {
          harvesterSel.options[i].selected = arr.indexOf(harvesterSel.options[i].value) !== -1;
        }
      }
      document.getElementById('edit-start').value = item.startTime.replace(' ', 'T');
      document.getElementById('edit-end').value = item.endTime.replace(' ', 'T');
      document.getElementById('edit-remark').value = item.remark || '';
      Modal.show('modal-edit');
    }

    function submitEditRecord() {
      const item = findRecord(editingId);
      if (item) {
        const level = document.getElementById('edit-level').value;
        item.plan = document.getElementById('edit-plan').value;
        item.plot = document.getElementById('edit-plot').value;
        item.base = document.getElementById('edit-base').value;
        item.variety = document.getElementById('edit-variety').value;
        item.quantity = parseInt(document.getElementById('edit-quantity').value, 10);
        item.level = level;
        item.levelName = level === 'level1' ? '一级' : level === 'level2' ? '二级' : '三级';
        item.harvesters = Array.from(document.getElementById('edit-harvesters').selectedOptions).map(function(o){ return o.value; }).join('、');
        item.startTime = document.getElementById('edit-start').value.replace('T', ' ');
        item.endTime = document.getElementById('edit-end').value.replace('T', ' ');
        item.remark = document.getElementById('edit-remark').value.trim();
      }
      Modal.hide('modal-edit');
      handleSearch();
      Toast.success('修改成功');
    }

    function showDeleteConfirm(id) {
      deletingId = id;
      Modal.show('modal-delete');
    }

    function confirmDelete() {
      const index = harvestRecords.findIndex(r => r.id === deletingId);
      if (index !== -1) {
        harvestRecords.splice(index, 1);
      }
      Modal.hide('modal-delete');
      handleSearch();
      Toast.success('删除成功');
    }

    // 真实导出（Excel / CSV）
    async function handleExport() {
      const scope = document.querySelector('input[name="exportType"]:checked').value;
      const rows = (scope === 'filtered' ? Pagination.filteredData : harvestRecords);
      const result = await ExportHelper.exportData({
        filename: '采收记录_' + ExportHelper.stamp(),
        format: document.getElementById('exportFormat').value,
        headers: ['记录编号', '关联计划', '所属基地', '地块', '品种', '采收量(kg)', '等级', '状态', '采收开始时间', '采收结束时间', '采收人', '追溯码'],
        rows: rows.map(r => [r.id, r.plan, r.base, plotLabel(r.plot), r.variety, r.quantity, r.levelName, STATUS_NAME[r.status], r.startTime, r.endTime, r.harvesters, r.traceCode || ''])
      });
      Modal.hide('modal-export');
      Toast.success(result === 'csv-fallback' ? 'Excel 组件加载失败，已导出为 CSV' : '导出成功，文件已下载');
    }

    // 下拉数据填充
    function fillPlots(select, selected) {
      select.innerHTML = '<option value="">请选择地块</option>' + PLOT_MASTER.map(p =>
        `<option value="${p.code}"${p.code === selected ? ' selected' : ''}>${p.code} · ${p.name}</option>`
      ).join('');
    }

    function fillPlans(select, selected) {
      select.innerHTML = '<option value="">请选择关联计划</option>' + PLAN_OPTIONS.map(p =>
        `<option value="${p}"${p === selected ? ' selected' : ''}>${p}</option>`
      ).join('');
    }

    // 选择地块后自动带出所属基地与品种（与地块主数据保持一致）
    function bindPlotAutoFill(plotId, baseId, varietyId) {
      document.getElementById(plotId).addEventListener('change', function () {
        const plot = PLOT_MASTER.find(p => p.code === this.value);
        if (plot) {
          document.getElementById(baseId).value = plot.base;
          document.getElementById(varietyId).value = plot.variety;
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      fillPlans(document.getElementById('add-plan'), '');
      fillPlans(document.getElementById('edit-plan'), '');
      fillPlots(document.getElementById('add-plot'), '');
      fillPlots(document.getElementById('edit-plot'), '');
      bindPlotAutoFill('add-plot', 'add-base', 'add-variety');
      bindPlotAutoFill('edit-plot', 'edit-base', 'edit-variety');

      Pagination.init({
        currentPage: 1,
        pageSize: 10,
        data: harvestRecords,
        containerId: 'pagination-container',
        tbodyId: 'dataTableBody',
        renderRow: renderRow
      });

      renderCharts(harvestRecords);
    });
  </script>
