<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 菜单设置</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  /* ===== 页面纵向节奏（紧凑） ===== */
  .main-content { padding:10px 16px 16px !important; }
  .page-header {
    padding:10px 16px !important;
    margin-bottom:10px !important;
    align-items:flex-start;
  }
  .page-header .page-title { font-size:17px; line-height:1.4; }
  .page-header .page-subtitle { font-size:12px; margin-top:2px; }
  .page-header .page-actions { margin-bottom:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .page-section { margin-bottom:10px; }
  .page-section + .page-section { margin-top:10px !important; }

  /* ===== 搜索栏 ===== */
  .search-section .search-bar { padding:8px 12px; border-radius:10px; gap:8px; }
  .search-section .search-bar .search-input {
    height:32px; padding:0 12px; font-size:13px;
    border-radius:8px; max-width:260px;
  }
  .search-section .search-bar .search-select { height:32px; border-radius:8px; }
  .search-section .search-actions .jg-btn { height:32px; padding:0 16px; font-size:13px; }
  .page-header .page-actions .jg-btn { height:32px; padding:0 14px; font-size:13px; }
  .page-header .page-actions .jg-btn svg { width:14px; height:14px; }

  /* ===== 列表卡片头部 ===== */
  .page-section.data-section { overflow:hidden; }
  .page-section.data-section .data-table-wrapper {
    border:none; border-radius:0; box-shadow:none; background:transparent;
  }
  .table-toolbar {
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:10px 16px;
    background:linear-gradient(180deg,#fafcfa 0%,#fff 100%);
    border-bottom:1px solid #f0f2f1;
  }
  .table-toolbar-title {
    display:flex; align-items:center; gap:7px;
    font-size:13.5px; font-weight:600; color:var(--text-primary,#1a2e1a);
    letter-spacing:.2px;
  }
  .table-toolbar-title svg { width:15px; height:15px; color:var(--primary-500,#1890ff); }
  .table-toolbar-meta { font-size:12px; color:var(--text-tertiary,#6b7b6b); }

  /* ===== 表格（紧凑行高） ===== */
  .data-section .data-table { min-width:1120px; font-size:13px; }
  .data-section .data-table thead th {
    padding:9px 14px; font-size:12px; font-weight:600;
    letter-spacing:.3px; text-transform:none;
    color:var(--text-tertiary,#6b7b6b);
    background:#f7f9f7; border-bottom:1px solid #e8ede8;
  }
  .data-section .data-table tbody td {
    padding:7px 14px; font-size:13px;
    border-bottom:1px solid #f4f6f4;
  }
  /* 树形列表不启用斑马纹，改用目录分组分割线 */
  .data-section .data-table tbody tr:nth-child(even) { background:transparent; }
  .data-section .data-table tbody tr:hover > td { background:#f2f8f4; }
  .data-section .data-table tbody tr.menu-row-root > td {
    background:#fbfdfc;
    border-top:1px solid #eef1ef;
    font-weight:600; color:var(--text-primary,#1a2e1a);
  }
  .data-section .data-table tbody tr.menu-row-root:first-child > td { border-top:none; }
  .data-section .data-table tbody tr.menu-row-root:hover > td { background:#f2f8f4; }
  .data-section .empty-row td {
    text-align:center; color:var(--text-tertiary,#6b7b6b);
    padding:40px 0 !important;
  }

  /* ===== 菜单树 ===== */
  .menu-name-cell { display:flex; align-items:center; gap:5px; min-width:0; }
  .menu-name-cell .menu-text { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .menu-expand-btn {
    width:18px; height:18px;
    display:inline-flex; align-items:center; justify-content:center;
    border:none; background:transparent;
    color:var(--text-tertiary,#6b7b6b); border-radius:4px;
    cursor:pointer; flex-shrink:0;
    transition:all .18s ease;
  }
  .menu-expand-btn:hover { background:#eef4ef; color:var(--primary-500,#1890ff); }
  .menu-expand-btn svg { width:13px; height:13px; }
  .menu-expand-placeholder { width:18px; flex-shrink:0; }
  .menu-icon { display:inline-flex; align-items:center; flex-shrink:0; color:var(--text-tertiary,#6b7b6b); }
  .menu-icon svg { width:14px; height:14px; }
  .menu-row-root .menu-icon { color:var(--primary-500,#1890ff); }

  /* 排序输入框 */
  .sort-input {
    width:58px; height:26px; padding:0 4px;
    font-size:12.5px; font-variant-numeric:tabular-nums;
    border:1px solid #dde3dd; border-radius:6px;
    background:#fff; color:var(--text-primary,#1a2e1a);
    text-align:center; outline:none;
    transition:all .18s ease;
  }
  .sort-input:hover { border-color:#c5cdc5; }
  .sort-input:focus {
    border-color:var(--primary-500,#1890ff);
    box-shadow:0 0 0 3px rgba(24,144,255,.1);
  }

  /* 类型徽标：目录 / 菜单 / 按钮 */
  .menu-type-tag {
    display:inline-flex; align-items:center; gap:4px;
    height:22px; padding:0 9px; border-radius:20px;
    font-size:11.5px; font-weight:500; white-space:nowrap;
    border:1px solid transparent;
  }
  .menu-type-tag::before {
    content:''; width:5px; height:5px; border-radius:50%;
    background:currentColor; flex-shrink:0;
  }
  .menu-type-tag.catalog { background:#e6f7ff; color:#096dd9; border-color:#91d5ff; }
  .menu-type-tag.menu    { background:#f6ffed; color:#3a8618; border-color:#b7eb8f; }
  .menu-type-tag.button  { background:#fffbe6; color:#ad6800; border-color:#ffd591; }

  /* 行内操作按钮（压缩到与列表节奏一致） */
  .data-section .action-btns { display:flex; gap:6px; align-items:center; flex-wrap:nowrap; }
  .data-section .action-btn {
    height:26px; padding:0 9px; margin-left:0;
    font-size:11.5px; font-weight:500; border-radius:6px;
    display:inline-flex; align-items:center; justify-content:center; gap:3px;
  }
  .action-btn.add { color:#3a8618; border-color:#b7eb8f; background:#f6ffed; }
  .action-btn.add:hover { background:#eaffd8; border-color:#8fd45a; color:#2f7a12; }

  /* 权限标识 / 组件路径 */
  .perm-code { font-family:var(--font-family-mono, monospace); font-size:12px; color:var(--text-secondary,#4a5a4a); }
  .comp-path { font-family:var(--font-family-mono, monospace); font-size:12px; color:var(--text-tertiary,#6b7b6b); }

  /* 隐藏小标记 */
  .hide-tag {
    display:inline-flex; align-items:center;
    height:20px; padding:0 7px; margin-left:6px;
    border-radius:10px;
    font-size:11px; font-weight:500;
    background:#f5f5f5; color:#8c8c8c;
    border:1px solid #e8e8e8;
  }

  /* ===== 弹窗表单（紧凑） ===== */
  .modal-form-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:0 20px; }
  .modal-form-grid .full { grid-column:1 / -1; }
  .modal-field { margin-bottom:13px; }
  .modal-field > label {
    display:block; font-size:13px; font-weight:500;
    color:var(--text-primary); margin-bottom:5px;
  }
  .modal-field > label .req { color:var(--error); margin-left:2px; }
  .modal-field input[type="text"],
  .modal-field input[type="number"],
  .modal-field select {
    width:100%; height:34px; padding:0 10px;
    border:1px solid #dde3dd; border-radius:8px;
    font-size:13px; font-family:inherit;
    background:#fff; color:var(--text-primary);
    box-sizing:border-box; outline:none;
    transition:all .18s ease;
  }
  .modal-field input:focus,
  .modal-field select:focus {
    border-color:var(--primary-500,#1890ff);
    box-shadow:0 0 0 3px rgba(24,144,255,.1);
  }
  .modal-field input[readonly] { background:var(--gray-50); color:var(--text-tertiary); }
  .radio-group { display:flex; align-items:center; gap:18px; flex-wrap:wrap; height:34px; }
  .radio-option {
    display:inline-flex; align-items:center; gap:6px;
    cursor:pointer; font-size:13px; color:var(--text-secondary,#4a5a4a);
  }
  .radio-option input[type="radio"] {
    accent-color:var(--primary-500,#1890ff);
    width:14px; height:14px; cursor:pointer;
  }
  .modal-hint { font-size:12px; color:var(--text-tertiary,#6b7b6b); margin-top:5px; }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>

<body data-active-menu="system" data-active-submenu="menu-settings">

<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <div class="content-wrapper">

        <!-- 页面头部 -->
        <div class="page-header">
          <div>
            <div class="page-title">菜单设置</div>
            <div class="page-subtitle">维护后台左侧导航的目录与菜单项，支持层级排序、权限标识与启用状态配置</div>
          </div>
          <div class="page-actions">
            <button class="jg-btn jg-btn-primary" onclick="openMenuModal(null)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14"/><path d="M5 12h14"/>
              </svg>
              新增菜单
            </button>
            <button class="jg-btn" onclick="saveSort()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
              </svg>

        <!-- 搜索栏区 -->
        <div class="page-section search-section">
          <div class="search-bar">
            <input type="text" class="search-input" id="searchName" placeholder="搜索菜单名称..." onkeyup="handleSearch()">

            <div class="search-actions">

              <button class="jg-btn" onclick="resetSearch()">重置</button>

          </div>
        </div>

        <!-- 数据表格 -->
        <div class="page-section data-section">
          <div class="table-toolbar">
            <div class="table-toolbar-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12h-8"/><path d="M21 6H8"/><path d="M21 18H8"/><path d="M3 6v12"/><path d="M3 12h2"/>
              </svg>
              菜单列表
            </div>
            <span class="table-toolbar-meta" id="menuSummary"></span>
          </div>
          <div class="data-table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>菜单名称</th>
                  <th style="width:82px;">类型</th>
                  <th style="width:82px;">排序</th>
                  <th style="width:180px;">权限标识</th>
                  <th style="width:210px;">组件路径</th>

<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>

<script src="js/components/confirm.js"></script>
<script src="js/typography.js"></script>
<script src="../common/js/api.js"></script>
<script>
/* ============================================================
 * 菜单设置（后台左侧导航的目录 / 菜单维护）
 * 严格空库模式：菜单数据来自真实接口 menu（空库下保留系统基础数据），
 * 不再内置默认菜单树、不再读写 localStorage
 * ============================================================ */

var menuList = [];
var TYPE_TEXT  = { catalog: '目录', menu: '菜单', button: '按钮' };
var collapsed  = {};      // 折叠状态：{ id: true }
var editingId  = null;    // 当前编辑的菜单 id

/* ---------- 通用工具 ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}

/* 数据库记录 -> 页面菜单对象（表无 icon/visible/external 列，留默认值） */
function mapMenu(r) {
  return {
    id: String(r.id),
    name: r.menu_name || '',
    type: r.menu_type || 'menu',
    parentId: r.parent_id ? String(r.parent_id) : '',
    sort: Number(r.sort_order) || 0,
    perm: r.perm_code || '',
    path: r.route || '',
    icon: '',
    external: false,
    visible: true,
    status: r.menu_status || 'normal'
  };
}

/* 扁平记录 -> 两级菜单树（页面仅支持目录 + 子菜单两级） */
function buildMenuTree(flat) {
  var groups = [];
  var byId = {};
  flat.forEach(function (m) { byId[m.id] = m; });
  flat.forEach(function (m) {
    if (!m.parentId || !byId[m.parentId]) {
      groups.push(Object.assign({}, m, { children: [] }));
    }
  });
  flat.forEach(function (m) {
    if (!m.parentId || !byId[m.parentId]) return;
    var g = groups.filter(function (x) { return x.id === m.parentId; })[0];
    if (g) g.children.push(Object.assign({}, m, { children: [] }));
    else groups.push(Object.assign({}, m, { children: [] }));
  });
  groups.forEach(function (g) { g.children.sort(function (a, b) { return a.sort - b.sort; }); });
  groups.sort(function (a, b) { return a.sort - b.sort; });
  return groups;
}

/* 异步取真实菜单；加载中 / 空态 / 错误态 */
function loadData() {
  var tbody = document.getElementById('menuTableBody');
  if (tbody) tbody.innerHTML = '<tr class="empty-row"><td colspan="7">加载中...</td></tr>';
  Api.get('menu', { page: 1, size: 500, sort: 'sort_order', order: 'asc' }).then(function (res) {
    if (!res || !res.ok) {
      if (tbody) tbody.innerHTML = '<tr class="empty-row"><td colspan="7">数据加载失败：' + esc((res && res.message) || '请检查登录状态与网络') + '</td></tr>';
      return;
    }
    menuList = buildMenuTree(((res.data && res.data.list) || []).map(mapMenu));
    renderTable();
  }).catch(function (err) {
    if (tbody) tbody.innerHTML = '<tr class="empty-row"><td colspan="7">数据加载失败：' + esc((err && err.message) || '网络异常') + '</td></tr>';
  });
}

/* 数据读写：只读内存中的真实接口结果 */
function readMenus() { return menuList; }

function findMenu(list, id) {
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id) return list[i];
    var kids = list[i].children || [];
    for (var j = 0; j < kids.length; j++) {
      if (kids[j].id === id) return kids[j];
    }
  }
  return null;
}
/* 统计目标节点自身的子项数量（用于判断能否删除） */
function countChildren(list, id) {
  var item = findMenu(list, id);
  if (!item) return 0;
  return (item.children || []).length;
}

/* ---------- 列表渲染 ---------- */
function renderTable() {
  var list = readMenus();
  var tbody = document.getElementById('menuTableBody');
  if (!tbody) return;

  var rows = [];
  list.forEach(function (group) {
    var kids = group.children || [];
    var isCollapsed = !!collapsed[group.id];
    rows.push(menuRowHtml(group, 0, kids.length > 0, isCollapsed, false));
    if (kids.length && !isCollapsed) {
      kids.forEach(function (child) {
        rows.push(menuRowHtml(child, 1, false, false, false));
      });
    }
  });

  tbody.innerHTML = rows.length
    ? rows.join('')
    : '<tr class="empty-row"><td colspan="7">暂无数据</td></tr>';

  renderSummary(list);
}

function menuRowHtml(item, level, hasChildren, isCollapsed, hidden) {
  var typeTag = '<span class="menu-type-tag ' + item.type + '">' + (TYPE_TEXT[item.type] || item.type) + '</span>';
  var toggle = hasChildren
    ? '<button class="menu-expand-btn" onclick="toggleNode(\'' + item.id + '\')" title="' + (isCollapsed ? '展开' : '折叠') + '">' +
        (isCollapsed
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>') +
      '</button>'
    : '<span class="menu-expand-placeholder"></span>';

  var iconHtml = item.icon
    ? '<span class="menu-icon"><span class="iconify" data-icon="' + esc(item.icon) + '"></span></span>'
    : '';

  var statusTag = item.status === 'disabled'
    ? '<span class="status-tag disabled">停用</span>'
    : '<span class="status-tag active">正常</span>';
  var hideTag = item.visible === false ? '<span class="hide-tag">隐藏</span>' : '';

  var addBtn = item.type === 'button' ? '' :
    '<button class="action-btn add" onclick="openMenuModal(null, \'' + item.id + '\')">新增</button>';

  return '<tr class="' + (level === 0 ? 'menu-row-root' : 'menu-row-child') + '">'
    + '<td><div class="menu-name-cell" style="padding-left:' + (level * 20) + 'px;">'
    +   toggle + iconHtml + '<span class="menu-text">' + esc(item.name) + '</span>'
    + '</div></td>'
    + '<td>' + typeTag + '</td>'
    + '<td><input type="number" class="sort-input" value="' + item.sort + '" min="0" data-menu-sort="' + item.id + '"></td>'
    + '<td><span class="perm-code">' + (item.perm ? esc(item.perm) : '—') + '</span></td>'
    + '<td><span class="comp-path">' + (item.path ? esc(item.path) : '—') + '</span></td>'
    + '<td>' + statusTag + hideTag + '</td>'
    + '<td><div class="action-btns">'
    +   '<button class="action-btn edit" onclick="openMenuModal(\'' + item.id + '\')">修改</button>'
    +   addBtn
    +   '<button class="action-btn delete" onclick="deleteMenu(\'' + item.id + '\')">删除</button>'
    + '</div></td>'
    + '</tr>';
}

function renderSummary(list) {
  var catalogs = 0, menus = 0, buttons = 0;
  list.forEach(function (g) {
    if (g.type === 'catalog') catalogs++;
    (g.children || []).forEach(function (c) {
      if (c.type === 'button') buttons++; else menus++;
    });
  });
  var el = document.getElementById('menuSummary');
  if (el) {
    el.textContent = '共 ' + list.length + ' 个目录 · ' + menus + ' 个菜单 · ' + buttons + ' 个按钮';
  }
}

/* ---------- 展开 / 折叠 ---------- */
function toggleNode(id) {
  collapsed[id] = !collapsed[id];
  renderTable();
}
function toggleAllNodes() {
  var list = readMenus();
  var anyCollapsed = list.some(function (g) { return collapsed[g.id]; });
  list.forEach(function (g) { collapsed[g.id] = anyCollapsed ? false : true; });
  renderTable();
}

/* ---------- 搜索 ---------- */
function getFiltered() {
  var kw  = (document.getElementById('searchName').value || '').trim().toLowerCase();
  var type = document.getElementById('searchType').value;
  var st   = document.getElementById('searchStatus').value;
  var list = readMenus();

  if (!kw && !type && !st) return null;   // 无筛选条件时展示完整树

  var groups = [];
  list.forEach(function (g) {
    var hitGroup = matchItem(g, kw, type, st);
    var kids = (g.children || []).filter(function (c) { return matchItem(c, kw, type, st); });
    if (hitGroup || kids.length) {
      groups.push(Object.assign({}, g, { children: hitGroup ? (g.children || []) : kids }));
    }
  });
  return groups;
}
function matchItem(item, kw, type, st) {
  if (kw && item.name.toLowerCase().indexOf(kw) === -1) return false;
  if (type && item.type !== type) return false;
  if (st && item.status !== st) return false;
  return true;
}
function handleSearch() {
  var filtered = getFiltered();
  var list = filtered || readMenus();
  var tbody = document.getElementById('menuTableBody');
  var rows = [];
  list.forEach(function (group) {
    var kids = group.children || [];
    if (!filtered) {
      rows.push(menuRowHtml(group, 0, kids.length > 0, !!collapsed[group.id], false));
      if (kids.length && !collapsed[group.id]) {
        kids.forEach(function (c) { rows.push(menuRowHtml(c, 1, false, false, false)); });
      }
    } else {
      rows.push(menuRowHtml(group, 0, kids.length > 0, false, false));
      kids.forEach(function (c) { rows.push(menuRowHtml(c, 1, false, false, false)); });
    }
  });
  tbody.innerHTML = rows.length
    ? rows.join('')
    : '<tr class="empty-row"><td colspan="7">未找到匹配的菜单</td></tr>';
  renderSummary(readMenus());
}
function resetSearch() {
  document.getElementById('searchName').value = '';
  document.getElementById('searchType').value = '';
  document.getElementById('searchStatus').value = '';
  renderTable();
}

/* ---------- 排序保存 ---------- */
function saveSort() {
  var updates = [];
  document.querySelectorAll('[data-menu-sort]').forEach(function (input) {
    updates.push({ id: input.dataset.menuSort, sort_order: parseInt(input.value, 10) || 0 });
  });
  if (!updates.length) { Toast.show('暂无可保存的排序', 'warning'); return; }
  Promise.all(updates.map(function (u) {
    return Api.update('menu', u.id, { sort_order: u.sort_order });
  })).then(function (res) {
    var failed = res.filter(function (r) { return !r || !r.ok; });
    if (failed.length) { Toast.show('排序保存失败：' + ((failed[0] && failed[0].message) || '请检查登录状态'), 'error'); return; }
    Toast.show('菜单排序已保存', 'success');
    loadData();
  });
}

/* ---------- 新增 / 修改弹窗 ---------- */
function parentOptionsHtml(selectedId) {
  var list = readMenus();
  return list.map(function (g) {
    var selected = g.id === selectedId ? ' selected' : '';
    return '<option value="' + g.id + '"' + selected + '>' + esc(g.name) + '</option>';
  }).join('');
}
function radioGroupHtml(name, current, options) {
  return '<div class="radio-group">' + options.map(function (o) {
    return '<label class="radio-option"><input type="radio" name="' + name + '" value="' + o.value + '"' +
      (o.value === current ? ' checked' : '') + '><span>' + o.label + '</span></label>';
  }).join('') + '</div>';
}

function openMenuModal(id, parentId) {
  editingId = id || null;
  var list = readMenus();
  var item = id ? findMenu(list, id) : null;

  var title = item ? '修改菜单' : '新增菜单';
  var currentType   = item ? item.type   : 'menu';
  var currentSort   = item ? item.sort   : nextSort(parentId);
  var currentPerm   = item ? item.perm   : '';
  var currentPath   = item ? item.path   : '';
  var currentIcon   = item ? item.icon   : '';
  var currentParent = item ? item.parentId : (parentId || '');
  var currentExternal = item ? !!item.external : false;
  var currentVisible  = item ? item.visible !== false : true;
  var currentStatus = item ? item.status : 'normal';

  var content = ''
    + '<div class="modal-form-grid">'
    +   '<div class="modal-field full">'
    +     '<label>上级菜单</label>'
    +     '<select id="mParentId">' + parentOptionsHtml(currentParent) + '</select>'
    +   '</div>'
    +   '<div class="modal-field">'
    +     '<label>菜单类型</label>'
    +     radioGroupHtml('mType', currentType, [
           { value: 'catalog', label: '目录' },
           { value: 'menu',    label: '菜单' },
           { value: 'button',  label: '按钮' }
         ])
    +   '</div>'
    +   '<div class="modal-field">'
    +     '<label>菜单图标</label>'
    +     '<input type="text" id="mIcon" value="' + esc(currentIcon) + '" placeholder="如 ri:settings-3-line">'
    +   '</div>'
    +   '<div class="modal-field">'
    +     '<label>显示排序<span class="req">*</span></label>'
    +     '<input type="number" id="mSort" value="' + currentSort + '" min="0">'
    +   '</div>'
    +   '<div class="modal-field">'
    +     '<label>菜单名称<span class="req">*</span></label>'
    +     '<input type="text" id="mName" value="' + esc(item ? item.name : '') + '" placeholder="如 数据仓库">'
    +   '</div>'
    +   '<div class="modal-field">'
    +     '<label>是否外链</label>'
    +     radioGroupHtml('mExternal', currentExternal ? 'true' : 'false', [
           { value: 'true',  label: '是' },
           { value: 'false', label: '否' }
         ])
    +   '</div>'
    +   '<div class="modal-field">'
    +     '<label>路由地址<span class="req">*</span></label>'
    +     '<input type="text" id="mPath" value="' + esc(currentPath) + '" placeholder="如 enterprise_base.html">'
    +     '<div class="modal-hint">目录可留空；菜单填写对应页面文件名</div>'
    +   '</div>'
    +   '<div class="modal-field">'
    +     '<label>权限标识</label>'
    +     '<input type="text" id="mPerm" value="' + esc(currentPerm) + '" placeholder="如 enterprise:base">'
    +   '</div>'
    +   '<div class="modal-field">'
    +     '<label>显示状态</label>'
    +     radioGroupHtml('mVisible', currentVisible ? 'true' : 'false', [
           { value: 'true',  label: '显示' },
           { value: 'false', label: '隐藏' }
         ])
    +   '</div>'
    +   '<div class="modal-field">'
    +     '<label>菜单状态</label>'
    +     radioGroupHtml('mStatus', currentStatus, [
           { value: 'normal',   label: '正常' },
           { value: 'disabled', label: '停用' }
         ])
    +   '</div>'
    + '</div>';

  var footer = ''
    + '<button class="jg-btn jg-btn-secondary" data-action="cancel">取消</button>'
    + '<button class="jg-btn jg-btn-primary" data-action="submit">确定</button>';

  var modal = Modal.open({ title: title, content: content, footer: footer, width: '680px' });

  modal.querySelector('[data-action="cancel"]').addEventListener('click', function () { Modal.close(); });
  modal.querySelector('[data-action="submit"]').addEventListener('click', function () { submitMenu(); });
}

function nextSort(parentId) {
  var list = readMenus();
  if (!parentId) {
    var max = 0;
    list.forEach(function (g) { if (g.sort > max) max = g.sort; });
    return max + 1;
  }
  var group = list.filter(function (g) { return g.id === parentId; })[0];
  if (!group) return 1;
  var max = 0;
  (group.children || []).forEach(function (c) { if (c.sort > max) max = c.sort; });
  return max + 1;
}

function submitMenu() {
  var name = (document.getElementById('mName').value || '').trim();
  if (!name) { Toast.show('请填写菜单名称', 'warning'); return; }

  var path = (document.getElementById('mPath').value || '').trim();
  var type = (document.querySelector('input[name="mType"]:checked') || {}).value || 'menu';
  if (type !== 'catalog' && !path) {
    Toast.show('菜单类型为「菜单 / 按钮」时，路由地址不能为空', 'warning');
    return;
  }

  /* 严格按 sf_menu 的列构造请求体，新增 / 修改均走真实接口 */
  var parentId = document.getElementById('mParentId').value || '';
  var body = {
    parent_id: parentId || 0,
    menu_name: name,
    menu_type: type,
    perm_code: (document.getElementById('mPerm').value || '').trim(),
    route: path,
    menu_status: (document.querySelector('input[name="mStatus"]:checked') || {}).value || 'normal',
    sort_order: parseInt(document.getElementById('mSort').value, 10) || 0
  };

  var req = editingId
    ? Api.update('menu', editingId, body)
    : Api.create('menu', body);
  req.then(function (res) {
    if (!res || !res.ok) { Toast.show('保存失败：' + ((res && res.message) || '请检查登录状态'), 'error'); return; }
    Toast.show(editingId ? '菜单已保存' : '菜单已新增', 'success');
    Modal.close();
    loadData();
  });
}

/* ---------- 删除 ---------- */
function deleteMenu(id) {
  var list = readMenus();
  var item = findMenu(list, id);
  if (!item) return;

  if (countChildren(list, id) > 0) {
    Toast.show('该目录下仍有子菜单，请先删除子菜单', 'warning');
    return;
  }

  ConfirmDialog.show({
    title: '删除菜单',
    message: '确认删除菜单「' + item.name + '」吗？删除后后台导航中将不再展示该入口。',
    onConfirm: function () {
      Api.remove('menu', id).then(function (res) {
        if (!res || !res.ok) { Toast.show('删除失败：' + ((res && res.message) || '请检查登录状态'), 'error'); return; }
        Toast.show('菜单已删除', 'success');
        loadData();
      });
    }
  });
}

document.addEventListener('DOMContentLoaded', function () {
  loadData();
});
</script>
</body>
