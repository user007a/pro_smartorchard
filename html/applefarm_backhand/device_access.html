<style>
  /* 统计卡：4 列网格 */
  .stat-card-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-lg);
    margin-bottom: var(--space-lg);
  }
  .stat-card {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-light);
    box-shadow: var(--shadow-card);
    padding: var(--space-lg);
  }
  .stat-label { font-size: 13px; color: var(--text-tertiary); margin-bottom: 6px; }
  .stat-value {
    font-size: 28px; font-weight: 700; line-height: 1.2;
    color: var(--text-primary); font-variant-numeric: tabular-nums;
  }
  .stat-value .unit { font-size: 13px; font-weight: 500; color: var(--text-tertiary); margin-left: 4px; }
  .stat-sub { margin-top: 6px; font-size: 12px; color: var(--text-tertiary); }
  .stat-sub.warn { color: var(--warning); }
  .stat-sub.err { color: var(--error); }

  /* 状态 tag */
  .status-tag {
    display: inline-block; padding: 3px 10px; border-radius: var(--radius-full);
    font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  .status-tag.online  { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
  .status-tag.warning { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning-border); }
  .status-tag.offline { background: var(--gray-100); color: var(--text-secondary); border: 1px solid var(--border-default); }

  /* 接入方式徽标 */
  .way-badge {
    display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm);
    font-size: 12px; font-weight: 500; color: var(--primary-500);
    background: rgba(24,144,255,.08); border: 1px solid rgba(24,144,255,.2);
  }
  /* 数据点 chips */
  .point-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .point-chip {
    font-size: 11px; padding: 2px 7px; border-radius: var(--radius-sm);
    background: var(--bg-hover); color: var(--text-secondary);
    border: 1px solid var(--border-light); white-space: nowrap;
  }
  /* 详情内数据点清单 */
  .point-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 16px; margin-top: 4px; }
  .point-item {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; color: var(--text-primary);
    padding: 5px 0; border-bottom: 1px dashed var(--border-light);
  }
  .point-item .pi-unit { font-size: 11px; color: var(--text-tertiary); }

  /* 勾选式数据点选择 */
  .point-picker { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .point-picker label {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 8px 12px; border: 1px solid var(--border-default);
    border-radius: var(--radius-md); font-size: 13px; color: var(--text-primary);
    background: var(--bg-card); transition: all .2s;
  }
  .point-picker label:hover { border-color: var(--primary-500); background: rgba(24,144,255,.04); }
  .point-picker label.checked { border-color: var(--primary-500); background: rgba(24,144,255,.08); }
  .point-picker .pk-unit { margin-left: auto; font-size: 11px; color: var(--text-tertiary); }

  .data-table { min-width: 1180px; }
  .data-table th { white-space: nowrap; }
  .empty-row td { text-align: center; color: var(--text-tertiary); padding: 40px 0; }
  #pagination-container { padding: 12px 16px; }
</style>

<script>
/* ============================================================
 * 设备接入配置
 * 数据源：js/shared/device-store.js → accessConfigs()
 *
 * 注意：本页只用 components/modal.js 的 Toast 与内联分页组件，
 * 弹窗显隐走 classList，故不引用 common-functions.js ——
 * 两者都会声明全局 Modal，重复声明将抛 SyntaxError 导致页面脚本整体失效。
 * ============================================================ */

// 分页组件（与农事计划 / 基地管理一致）
const Pagination = {
  currentPage: 1, pageSize: 10, filteredData: [],
  containerId: 'pagination-container', tbodyId: 'dataTableBody', renderRow: null,
  init: function(options) {
    this.currentPage = options.currentPage || 1;
    this.pageSize = options.pageSize || 10;
    this.filteredData = options.data || [];
    this.containerId = options.containerId || 'pagination-container';
    this.tbodyId = options.tbodyId || 'dataTableBody';
    this.renderRow = options.renderRow || null;
    this.render();
  },
  renderTable: function() {
    const tbody = document.getElementById(this.tbodyId);
    if (!tbody || !this.renderRow) return;
    const start = (this.currentPage - 1) * this.pageSize;
    const pageData = this.filteredData.slice(start, start + this.pageSize);
    tbody.innerHTML = pageData.map((item, i) => this.renderRow(item, start + i + 1)).join('');
  },
  render: function() {
    const container = document.getElementById(this.containerId);
    if (!container) return;
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    let html = '<div class="pagination">';
    html += `<button class="page-btn ${this.currentPage <= 1 ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage - 1})">‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= this.currentPage - 1 && i <= this.currentPage + 1)) {
        html += `<button class="page-btn ${i === this.currentPage ? 'active' : ''}" onclick="Pagination.goToPage(${i})">${i}</button>`;
      } else if (i === this.currentPage - 2 || i === this.currentPage + 2) {
        html += '<span class="page-ellipsis" style="padding:0 8px;color:#6b7b6b;">...</span>';
      }
    }
    html += `<button class="page-btn ${this.currentPage >= totalPages ? 'disabled' : ''}" onclick="Pagination.goToPage(${this.currentPage + 1})">›</button>`;
    html += `<span style="margin-left:16px;font-size:13px;color:#6b7b6b;">第 ${this.currentPage} 页/共 ${totalPages} 页，共 ${this.filteredData.length} 条记录</span>`;
    html += '</div>';
    container.innerHTML = html;
    this.renderTable();
  },
  goToPage: function(page) {
    const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
    if (page < 1 || page > totalPages) return;
    this.currentPage = page;
    this.render();
  },
  updateData: function(data) {
    this.filteredData = data;
    this.currentPage = 1;
    this.render();
  }
};

var BASE_OPTIONS = ['麦积区基地 A区', '麦积区基地 B区', '麦积区基地 C区', '白水基地 A区', '宜川基地 A区'];
var STATUS_TEXT = { online: '已接入', warning: '接入异常', offline: '未接入' };
var editingId = null;
var detailId = null;

/* ---------- 筛选下拉初始化 ---------- */
function initSelects() {
  var typeSel = document.getElementById('typeSelect');
  DeviceStore.DEVICE_TYPES.forEach(function (t) {
    var o = document.createElement('option');
    o.value = t; o.textContent = t;
    typeSel.appendChild(o);
  });

  var baseSel = document.getElementById('baseSelect');
  BASE_OPTIONS.forEach(function (b) {
    var o = document.createElement('option');
    o.value = b; o.textContent = b;
    baseSel.appendChild(o);
  });

  var accType = document.getElementById('accessTypeSelect');
  DeviceStore.DEVICE_TYPES.forEach(function (t) {
    var o = document.createElement('option');
    o.value = t; o.textContent = t;
    accType.appendChild(o);
  });

  var accBase = document.getElementById('accessBaseSelect');
  BASE_OPTIONS.forEach(function (b) {
    var o = document.createElement('option');
    o.value = b; o.textContent = b;
    accBase.appendChild(o);
  });

  refreshGatewaySelect();
}

function refreshGatewaySelect() {
  var sel = document.getElementById('accessGatewaySelect');
  var cur = sel.value;
  sel.innerHTML = '<option value="">不指定</option>';
  DeviceStore.gateways().forEach(function (g) {
    var o = document.createElement('option');
    o.value = g.id; o.textContent = g.id + ' · ' + g.name;
    sel.appendChild(o);
  });
  if (cur) sel.value = cur;
}

/* ---------- 数据点勾选 ---------- */
function renderPointPicker(type, selected) {
  var box = document.getElementById('pointPicker');
  var points = DeviceStore.dataPointsOf(type);
  var sel = selected || [];
  box.innerHTML = points.map(function (p) {
    var on = sel.indexOf(p.key) !== -1;
    return '<label class="' + (on ? 'checked' : '') + '" data-key="' + p.key + '">' +
      '<input type="checkbox" ' + (on ? 'checked' : '') + '>' +
      '<span>' + p.name + '</span><span class="pk-unit">' + p.unit + '</span>' +
    '</label>';
  }).join('');
  if (!points.length) box.innerHTML = '<div class="form-hint">该设备类型暂无可配置测点</div>';
}

document.getElementById('pointPicker').addEventListener('change', function (e) {
  var label = e.target.closest('label');
  if (label) label.classList.toggle('checked', e.target.checked);
});

/* ---------- 统计卡 ---------- */
function renderStats() {
  var s = DeviceStore.accessSummary();
  document.getElementById('statCards').innerHTML =
    '<div class="stat-card"><div class="stat-label">接入配置</div>' +
    '<div class="stat-value">' + s.total + '<span class="unit">条</span></div>' +
    '<div class="stat-sub">覆盖 ' + s.typeCount + ' 类设备</div></div>' +
    '<div class="stat-card"><div class="stat-label">已接入</div>' +
    '<div class="stat-value">' + s.online + '<span class="unit">个</span></div>' +
    '<div class="stat-sub">接入正常</div></div>' +
    '<div class="stat-card"><div class="stat-label">接入异常</div>' +
    '<div class="stat-value">' + s.warning + '<span class="unit">个</span></div>' +
    '<div class="stat-sub ' + (s.warning ? 'warn' : '') + '">需现场排查</div></div>' +
    '<div class="stat-card"><div class="stat-label">未接入</div>' +
    '<div class="stat-value">' + s.offline + '<span class="unit">个</span></div>' +
    '<div class="stat-sub ' + (s.offline ? 'err' : '') + '">配置采集测点 ' + s.pointTotal + ' 项</div></div>';
}

/* ---------- 行渲染 ---------- */
function renderRow(item, index) {
  var points = (item.points || []).map(function (k) {
    var p = DeviceStore.DATA_POINTS[item.deviceType];
    var hit = (p || []).filter(function (x) { return x.key === k; })[0];
    return '<span class="point-chip">' + esc(hit ? hit.name : k) + '</span>';
  }).join('');
  return '<tr>' +
    '<td><strong>' + esc(item.id) + '</strong></td>' +
    '<td>' + esc(item.deviceName) + '</td>' +
    '<td>' + esc(item.deviceType) + '</td>' +
    '<td>' + esc(item.base) + '</td>' +
    '<td><span class="way-badge">' + esc(item.accessWay) + '</span></td>' +
    '<td>' + esc(item.gatewayId || '-') + '</td>' +
    '<td style="font-size:12px;color:var(--text-secondary);">' + esc(item.endpoint || '-') + '</td>' +
    '<td>' + esc(item.freq) + '</td>' +
    '<td>' + esc(item.timeout) + '</td>' +
    '<td><div class="point-chips">' + points + '</div></td>' +
    '<td><span class="status-tag ' + item.status + '">' + (STATUS_TEXT[item.status] || item.statusText) + '</span></td>' +
    '<td><div class="action-btns">' +
      '<button class="action-btn detail" data-act="detail" data-id="' + item.id + '">详情</button>' +
      '<button class="action-btn edit" data-act="edit" data-id="' + item.id + '">编辑</button>' +
      '<button class="action-btn delete" data-act="del" data-id="' + item.id + '">删除</button>' +
    '</div></td>' +
  '</tr>';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ---------- 搜索 ---------- */
function filteredList() {
  var type = document.getElementById('typeSelect').value;
  var base = document.getElementById('baseSelect').value;
  var status = document.getElementById('statusSelect').value;
  var kw = (document.getElementById('searchInput').value || '').trim().toLowerCase();

  return DeviceStore.accessConfigs().filter(function (x) {
    if (type && x.deviceType !== type) return false;
    if (base && x.base !== base) return false;
    if (status && x.status !== status) return false;
    if (kw) {
      var hay = [x.deviceName, x.endpoint, x.id, x.deviceType].join(' ').toLowerCase();
      if (hay.indexOf(kw) === -1) return false;
    }
    return true;
  });
}

function handleSearch() {
  var list = filteredList();
  Pagination.updateData(list);
  Toast.show('找到 ' + list.length + ' 条记录', 'info');
}

function smartReset() {
  document.getElementById('typeSelect').value = '';
  document.getElementById('baseSelect').value = '';
  document.getElementById('statusSelect').value = '';
  document.getElementById('searchInput').value = '';
  Pagination.updateData(DeviceStore.accessConfigs());
  Toast.show('已重置搜索条件', 'info');
}

/* ---------- 新增 / 编辑 ---------- */
function openAccessModal(item) {
  editingId = item ? item.id : null;
  document.getElementById('accessModalTitle').textContent = item ? '编辑接入配置' : '新增接入配置';
  var form = document.getElementById('form-access');
  form.reset();

  var type = item ? item.deviceType : DeviceStore.DEVICE_TYPES[0];
  document.getElementById('accessTypeSelect').value = type;
  refreshGatewaySelect();

  if (item) {
    form.deviceName.value = item.deviceName;
    document.getElementById('accessBaseSelect').value = item.base;
    document.getElementById('accessGatewaySelect').value = item.gatewayId || '';
    document.getElementById('accessWaySelect').value = item.accessWay;
    form.freq.value = item.freq;
    form.endpoint.value = item.endpoint;
    form.timeout.value = item.timeout;
    form.status.value = item.status;
    form.remark.value = item.remark || '';
  } else {
    document.getElementById('accessBaseSelect').value = BASE_OPTIONS[0];
    form.freq.value = '10分钟';
    form.timeout.value = 90;
    form.status.value = 'online';
    renderAccessWays(type);
    renderPointPicker(type, []);
  }

  renderAccessWays(type);
  if (item) renderPointPicker(type, item.points || []);
  document.getElementById('modal-access').classList.add('show');
}

/* 接入方式随设备类型联动 */
function renderAccessWays(type) {
  var sel = document.getElementById('accessWaySelect');
  var ways = DeviceStore.ACCESS_WAYS[type] || ['MQTT'];
  var cur = sel.value;
  sel.innerHTML = ways.map(function (w) {
    var o = document.createElement('option');
    o.value = w; o.textContent = w;
    return o.outerHTML;
  }).join('');
  if (cur && ways.indexOf(cur) !== -1) sel.value = cur;
}

document.getElementById('accessTypeSelect').addEventListener('change', function (e) {
  renderAccessWays(e.target.value);
  renderPointPicker(e.target.value, []);
});

function closeAccessModal() { document.getElementById('modal-access').classList.remove('show'); }

function submitAccess() {
  var form = document.getElementById('form-access');
  var deviceName = (form.deviceName.value || '').trim();
  var endpoint = (form.endpoint.value || '').trim();
  if (!deviceName) { Toast.show('请填写设备名称', 'warning'); return; }
  if (!endpoint) { Toast.show('请填写接入地址', 'warning'); return; }

  var picked = [];
  document.querySelectorAll('#pointPicker input[type=checkbox]').forEach(function (cb) {
    if (cb.checked) picked.push(cb.closest('label').getAttribute('data-key'));
  });
  if (!picked.length) { Toast.show('请至少勾选 1 个采集测点', 'warning'); return; }

  var status = form.status.value;
  DeviceStore.upsertAccess({
    id: editingId || genId(),
    deviceName: deviceName,
    deviceType: form.deviceType.value,
    base: form.base.value,
    accessWay: form.accessWay.value,
    gatewayId: form.gatewayId.value,
    endpoint: endpoint,
    freq: form.freq.value,
    timeout: Number(form.timeout.value) || 90,
    points: picked,
    status: status,
    statusText: STATUS_TEXT[status],
    remark: (form.remark.value || '').trim(),
    updatedAt: nowStamp()
  });

  closeAccessModal();
  Toast.show(editingId ? '接入配置已更新' : '接入配置已创建', 'success');
}

function genId() {
  var max = 0;
  DeviceStore.accessConfigs().forEach(function (x) {
    var n = parseInt(String(x.id || '').replace(/\D/g, ''), 10);
    if (!isNaN(n) && n > max) max = n;
  });
  return 'AC-' + String(max + 1).padStart(3, '0');
}

function pad2(n) { return String(n).padStart(2, '0'); }
function nowStamp() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
    ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

/* ---------- 详情 ---------- */
function openDetail(id) {
  var item = DeviceStore.accessConfigs().filter(function (x) { return x.id === id; })[0];
  if (!item) return;
  detailId = id;
  document.getElementById('detailTitle').textContent = '接入配置详情 · ' + item.deviceName;

  var defs = DeviceStore.dataPointsOf(item.deviceType);
  var pointHtml = (item.points || []).map(function (k) {
    var p = defs.filter(function (x) { return x.key === k; })[0];
    return '<div class="point-item"><span>' + (p ? p.name : k) + '</span>' +
      '<span class="pi-unit">' + (p ? p.unit : '') + '</span></div>';
  }).join('');

  var rows = [
    ['配置编号', item.id],
    ['设备名称', item.deviceName],
    ['设备类型', item.deviceType],
    ['所属基地', item.base],
    ['接入方式', item.accessWay],
    ['所属网关', item.gatewayId || '不指定'],
    ['接入地址', item.endpoint],
    ['采集频率', item.freq],
    ['心跳超时', item.timeout + ' 秒'],
    ['接入状态', '<span class="status-tag ' + item.status + '">' + (STATUS_TEXT[item.status] || item.statusText) + '</span>'],
    ['备注', item.remark || '-'],
    ['更新时间', item.updatedAt]
  ].map(function (r) {
    return '<div class="detail-row"><span class="detail-label">' + r[0] + '</span>' +
      '<span class="detail-value">' + (r[0] === '接入地址' ? esc(r[1]) : r[1]) + '</span></div>';
  }).join('');

  document.getElementById('detailBody').innerHTML =
    '<div class="detail-info">' + rows + '</div>' +
    '<div style="margin-top:18px;">' +
      '<div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:8px;">采集测点（' +
      (item.points || []).length + ' 项）</div>' +
      '<div class="point-list">' + (pointHtml || '<div class="form-hint">未配置测点</div>') + '</div>' +
    '</div>';

  document.getElementById('modal-access-detail').classList.add('show');
}

function closeDetailModal() { document.getElementById('modal-access-detail').classList.remove('show'); }

function editFromDetail() {
  var id = detailId;
  closeDetailModal();
  var item = DeviceStore.accessConfigs().filter(function (x) { return x.id === id; })[0];
  if (item) openAccessModal(item);
}

/* ---------- 删除 ---------- */
function handleDelete(id) {
  var item = DeviceStore.accessConfigs().filter(function (x) { return x.id === id; })[0];
  if (!item) return;
  Confirm.delete('确定要删除接入配置「' + item.deviceName + '」吗？此操作不可撤销。').then(function (ok) {
    if (!ok) return;
    DeviceStore.removeAccess(id);
    Toast.show('删除成功', 'success');
  });
}

/* ---------- 导出 ---------- */
function exportCsv() {
  var list = filteredList();
  var headers = ['配置编号', '设备名称', '设备类型', '所属基地', '接入方式', '所属网关',
    '接入地址', '采集频率', '超时(秒)', '采集测点', '状态', '更新时间'];
  var rows = list.map(function (x) {
    var defs = DeviceStore.dataPointsOf(x.deviceType);
    var pts = (x.points || []).map(function (k) {
      var p = defs.filter(function (y) { return y.key === k; })[0];
      return p ? p.name : k;
    }).join('、');
    return [x.id, x.deviceName, x.deviceType, x.base, x.accessWay, x.gatewayId || '',
      x.endpoint, x.freq, x.timeout, pts, STATUS_TEXT[x.status] || x.status, x.updatedAt];
  });
  var csv = [headers.join(',')].concat(rows.map(function (r) { return r.join(','); })).join('\n');
  try {
    var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = '设备接入配置_' + nowStamp().split(' ')[0] + '.csv';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    Toast.show('导出成功，共 ' + list.length + ' 条', 'success');
  } catch (e) {
    Toast.show('导出失败', 'error');
  }
}

/* ---------- 事件绑定 ---------- */
document.getElementById('dataTableBody').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-act]');
  if (!btn) return;
  var id = btn.getAttribute('data-id');
  var act = btn.getAttribute('data-act');
  if (act === 'detail') openDetail(id);
  else if (act === 'edit') {
    var item = DeviceStore.accessConfigs().filter(function (x) { return x.id === id; })[0];
    if (item) openAccessModal(item);
  } else handleDelete(id);
});

/* ---------- 初始化 ---------- */
document.addEventListener('DOMContentLoaded', function () {
  initSelects();
  renderStats();
  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: DeviceStore.accessConfigs(),
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderRow
  });
  DeviceStore.subscribe(function () {
    refreshGatewaySelect();
    renderStats();
    Pagination.updateData(filteredList());
  });
});
