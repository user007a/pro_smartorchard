<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 标签管理</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/page-content.css">
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<style>
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
  }
  .stat-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, var(--bg-card) 0%, #fbfdff 100%);
    border: 1px solid var(--border-light);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
    --accent: #1890ff;
    --accent-bg: #e8f4ff;
  }
  .stat-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--accent);
  }
  .stat-card:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(16, 24, 40, 0.08); }
  .stat-card.tone-green  { --accent: #16a34a; --accent-bg: #e9f7ee; }
  .stat-card.tone-orange { --accent: #f59e0b; --accent-bg: #fef4e2; }
  .stat-card.tone-purple { --accent: #7c3aed; --accent-bg: #f1ebfd; }
  .stat-label {
    font-size: var(--font-size-sm);
    color: var(--text-tertiary);
    margin-bottom: var(--space-xs);
  }
  .stat-value {
    font-size: 26px;
    font-weight: var(--font-weight-bold);
    color: var(--text-primary);
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .stat-unit {
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-normal);
    color: var(--text-tertiary);
    margin-left: 4px;
  }
  .stat-card.is-low { --accent: #f59e0b; --accent-bg: #fef4e2; }
  .stat-card.is-low .stat-value { color: var(--warning); }
  .stat-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .stat-chip {
    font-size: 11px; line-height: 1.6;
    padding: 1px 8px; border-radius: 20px;
    background: var(--gray-50); color: var(--text-tertiary);
    border: 1px solid var(--border-light);
  }
  /* 页内 Tab */
  .seg-tabs {
    display: inline-flex; gap: 4px; padding: 4px;
    background: var(--gray-50); border: 1px solid var(--border-light);
    border-radius: 12px; margin-bottom: var(--space-lg);
  }
  .seg-tab {
    border: none; background: transparent; cursor: pointer;
    padding: 9px 20px; border-radius: 9px;
    font-size: 14px; font-weight: 500; color: var(--text-secondary);
    transition: all 0.2s ease;
  }
  .seg-tab:hover { color: var(--text-primary); }
  .seg-tab.active {
    background: var(--bg-card); color: var(--primary-500);
    font-weight: 600; box-shadow: 0 1px 4px rgba(16, 24, 40, 0.1);
  }
  .pane { display: none; }
  .pane.active { display: block; animation: paneIn 0.25s ease; }
  @keyframes paneIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .card-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border-light);
  }
  .card-head-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
  .card-head-sub { font-size: 12px; color: var(--text-tertiary); }
  .status-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    font-size: var(--font-size-xs);
    font-weight: 500;
    white-space: nowrap;
  }
  .status-tag.processing { background: var(--warning-bg); color: var(--warning); }
  .status-tag.waiting { background: var(--info-bg); color: var(--primary-500); }
  .status-tag.passed { background: var(--success-bg); color: var(--success); }
  .status-tag.rejected { background: var(--error-bg); color: var(--error); }
  .cell-sub {
    font-size: var(--font-size-xs);
    color: var(--text-tertiary);
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .approve-box {
    margin-top: var(--space-sm);
    padding: 8px 10px;
    background: var(--gray-50);
    border-left: 3px solid var(--primary-300);
    border-radius: var(--radius-sm);
    font-size: var(--font-size-xs);
    color: var(--text-secondary);
  }
  .modal-field { margin-bottom: var(--space-lg); }
  .modal-field label {
    display: block;
    font-size: var(--font-size-sm);
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: var(--space-sm);
  }
  .modal-field textarea, .modal-field input, .modal-field select {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border-default);
    border-radius: var(--radius-lg);
    font-size: var(--font-size-base);
    font-family: inherit;
    background: var(--bg-card);
  }
  .modal-field textarea { min-height: 100px; resize: vertical; line-height: 1.6; }
  .modal-field textarea:focus, .modal-field input:focus, .modal-field select:focus {
    border-color: var(--primary-500);
    box-shadow: 0 0 0 4px rgba(24, 144, 255, 0.12);
    outline: none;
  }
  .stock-row {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: 12px 0;
    border-bottom: 1px solid var(--border-light);
  }
  .stock-row:last-child { border-bottom: none; }
  .stock-name { flex: 1; font-size: var(--font-size-sm); color: var(--text-primary); }
  .stock-row input {
    width: 120px;
    padding: 8px 12px;
    border: 1.5px solid var(--border-default);
    border-radius: var(--radius-lg);
    font-size: var(--font-size-base);
    font-family: inherit;
  }
  .stock-row input:focus {
    border-color: var(--primary-500);
    outline: none;
    box-shadow: 0 0 0 4px rgba(24, 144, 255, 0.12);
  }
  .detail-row {
    display: flex;
    gap: var(--space-md);
    padding: 10px 0;
    border-bottom: 1px solid var(--border-light);
    font-size: var(--font-size-sm);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: var(--text-tertiary); min-width: 84px; flex-shrink: 0; }
  .detail-value { color: var(--text-primary); flex: 1; word-break: break-all; }
  .empty-state {
    padding: var(--space-2xl) 0;
    text-align: center;
    color: var(--text-tertiary);
    font-size: var(--font-size-sm);
  }
  /* T19 库存单一数据源说明条 */
  .notice-bar {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    margin-bottom: var(--space-lg);
    background: var(--info-bg);
    border: 1px solid var(--border-light);
    border-left: 3px solid var(--primary-500);
    border-radius: var(--radius-sm);
    font-size: var(--font-size-sm);
    line-height: 1.7;
    color: var(--text-secondary);
  }
  .notice-bar svg { flex-shrink: 0; margin-top: 3px; width: 16px; height: 16px; color: var(--primary-500); }
  .notice-bar b { color: var(--text-primary); }
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--bg-card);
    border-radius: 12px;
    width: 92%;
    max-width: 620px;
    max-height: 85vh;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    animation: modalFadeIn 0.2s ease-out;
  }
  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.95) translateY(-20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-default);
  }
  .modal-title { font-size: 16px; font-weight: 600; color: #1f1f1f; }
  .modal-close {
    background: none; border: none; cursor: pointer;
    padding: 4px; font-size: 20px; line-height: 1;
    color: var(--text-tertiary); transition: color 0.2s;
  }
  .modal-close:hover { color: var(--text-secondary); }
  .modal-body {
    padding: 20px;
    overflow-y: auto;
    max-height: calc(85vh - 132px);
  }
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    padding: 16px 20px;
    border-top: 1px solid var(--border-default);
  }
</style>
</head>
<body data-active-menu="trace" data-active-submenu="trace-label">

<div class="main-wrapper">
  <div class="tab-bar">
    <div class="tab-bar-actions">
      <button class="tab-close-all" title="关闭全部标签">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

  </div>

    <div class="page-header">

      </div>

        <button class="jg-btn" onclick="openTypeModal()">标签类型</button>
        <button class="jg-btn" onclick="openStockModal()">库存管理</button>

    <!-- 统计区 -->

      <div class="stat-row" id="stockStatRow"></div>

    <!-- 页内 Tab -->
    <div class="seg-tabs" id="labelTabs">
      <button class="seg-tab active" data-pane="pane-records">领用审批</button>
      <button class="seg-tab" data-pane="pane-templates">标签模板</button>
      <button class="seg-tab" data-pane="pane-printjobs">打印任务</button>
    </div>

    <!-- ===== Tab：领用审批 ===== -->
    <div class="pane active" id="pane-records">
      <!-- 搜索栏区 -->
      <div class="page-section search-section">
        <div class="search-bar">
          <select class="search-select" id="statusSelect">
            <option value="">全部状态</option>
            <option value="待审批">待审批</option>
            <option value="待打印">待打印</option>
            <option value="已打印">已打印</option>
            <option value="已驳回">已驳回</option>
          </select>
          <input type="text" class="search-input" placeholder="搜索领用单号、标签名称、申请人与地块..." id="searchInput">
          <div class="search-actions">
            <button class="jg-btn jg-btn-primary" onclick="renderTable()">搜索</button>
            <button class="jg-btn" onclick="resetFilter()">重置</button>
          </div>
        </div>
      </div>

      <!-- 领用记录表 -->
      <div class="page-section data-section">
        <div class="data-table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th class="checkbox-col" style="width:60px;">序号</th>
                <th style="width:140px;">领用单号</th>
                <th style="width:150px;">领用时间</th>
                <th>标签名称</th>
                <th style="width:150px;">标签编码</th>
                <th style="width:140px;">溯源批次号</th>
                <th style="width:110px;">标签类型</th>
                <th style="width:130px;">规格</th>
                <th style="width:80px;">数量</th>
                <th style="width:150px;">使用地块</th>
                <th style="width:90px;">申请人</th>
                <th style="width:90px;">打印人</th>
                <th style="width:90px;">状态</th>
                <th>备注</th>
                <th style="width:160px;">操作</th>
              </tr>
            </thead>
            <tbody id="recordBody"></tbody>
          </table>
        </div>
        <div id="emptyHint" class="empty-state" style="display:none;">暂无标签领用记录</div>
      </div>
    </div>

    <!-- ===== Tab：标签模板 ===== -->
    <div class="pane" id="pane-templates">
      <div class="page-section data-section">
        <div class="card-head">
          <div>
            <div class="card-head-title">标签模板与版本</div>
            <div class="card-head-sub">模板按版本管理，启用版本用于新打印任务</div>
          </div>
          <button class="jg-btn jg-btn-primary" onclick="createLabelTemplate()">新建模板</button>
        </div>
        <div class="data-table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>模板名称</th>
                <th>版式</th>
                <th style="width:90px;">当前版本</th>
                <th style="width:90px;">状态</th>
                <th style="width:150px;">更新时间</th>
                <th style="width:230px;">操作</th>
              </tr>
            </thead>
            <tbody id="templateBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ===== Tab：打印任务 ===== -->
    <div class="pane" id="pane-printjobs">
      <div class="page-section data-section">
        <div class="card-head">
          <div>
            <div class="card-head-title">标签打印任务</div>
            <div class="card-head-sub">每次打印生成任务并扣减库存；支持重打与报废，均写入溯源存证</div>

                <th>标签名称</th>
                <th style="width:80px;">数量</th>
                <th style="width:120px;">模板版本</th>
                <th style="width:100px;">打印人</th>
                <th style="width:150px;">创建时间</th>
                <th style="width:90px;">状态</th>
                <th style="width:150px;">操作</th>
              </tr>
            </thead>
            <tbody id="printJobBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 严格空库模式：演示数据播种已停用，数据一律来自后端 API -->
<script>
/* ============================================================
 * 标签管理
 * 数据源：
 *   MobileBridge.labelRecords() → 标签领用记录（移动端 mb_label.html 写入）
 *     { name, qty, time, plot, status:'pending', remark, id, createTime }
 *   MobileBridge.labelStock()   → 标签库存对象 { 标签名: 剩余张数 }
 * 审批结果回写 MobileBridge.KEYS.labelRecords，库存维护回写 KEYS.labelStock
 * ============================================================ */

/* 状态归一：pending 分为「待审批」与「待打印」
 * 通过审批后保持 status='pending' 并写入 printReady，既满足本页状态字典，
 * 也保持与 trace_code.html 打印环节（仅关联 status==='pending'）的兼容。 */
var STATUS_TEXT = {
  '待审批': '待审批', 'pending': '待审批', '审批中': '待审批',
  '待打印': '待打印', '已审批': '待打印',
  '已打印': '已打印', '已驳回': '已驳回'
};
/* 状态 → 标签样式类 */
var STATUS_CLASS = { '待审批': 'waiting', '待打印': 'processing', '已打印': 'passed', '已驳回': 'rejected' };

/* 库存低于该值时用告警色提示 */
var LOW_STOCK_THRESHOLD = 1000;

var currentId = null;

/* HTML 转义，所有用户数据渲染前必须走这里 */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* 读取领用记录，读取失败回退空数组 */
function readRecords() {
  try {
    if (typeof MobileBridge === 'undefined') return [];
    var list = MobileBridge.labelRecords();
    return Array.isArray(list) ? list : [];
  } catch (e) {
    return [];
  }
}

/* 读取库存对象（库存以对象形式存储，桥接层已按对象型读取处理） */
function readStock() {
  try {
    if (typeof MobileBridge === 'undefined') return {};
    var stock = MobileBridge.labelStock();
    return (stock && typeof stock === 'object') ? stock : {};
  } catch (e) {
    return {};
  }
}

/* 状态归一：pending 未审批 → 待审批，审批通过 → 待打印
 * 兼容历史数据：「待打印」记录若没有审批留痕（approvedBy/approveResult），
 * 视为尚未完成审批，展示为「待审批」，审批通过后写入留痕再转为「待打印」。 */
function statusText(item) {
  if (!item) return '待审批';
  if (item.status === 'pending') {
    return (item.printReady || item.approvedForPrint) ? '待打印' : '待审批';
  }
  if (isAwaitingApproval(item)) return '待审批';
  return STATUS_TEXT[item.status] || item.status || '待审批';
}

/* 是否为待审批（尚未审批，可执行通过/驳回） */
function isAwaitingApproval(item) {
  if (!item) return false;
  if (item.status === '待审批') return true;
  if (item.status === 'pending') return !(item.printReady || item.approvedForPrint || item.printTime);
  if (item.status === '待打印') {
    return !item.approvedBy && !item.approvedForPrint && !item.printTime && !item.approveResult;
  }
  return false;
}

/* 是否为待打印（尚未由后台打印环节扣减库存）的记录 */
function isPendingPrint(item) {
  return statusText(item) === '待打印';
}

/* 新增字段读取：移动端老数据缺失时给出默认值 */
function orderNoOf(item) {
  return item.orderNo || item.applyNo || item.id || '-';
}
function labelCodeOf(item) {
  return item.labelCode || item.code || '—';
}
function traceBatchNoOf(item) {
  return item.traceBatchNo || '';
}
function labelTypeOf(item) {
  return item.labelType || '一物一码';
}
function specOf(item) {
  return item.spec || '标准规格';
}
function applicantOf(item) {
  return item.applicant || item.operator || '移动端用户';
}
function printerOf(item) {
  return item.printer || item.printOperator || (item.printTime ? '后台打印' : '—');
}

/* 渲染各标签库存统计卡 */
function renderStockStats() {
  var records = readRecords();
  var stockMap = window.TraceStore ? TraceStore.stock() : null;
  var stock = readStock();
  var row = document.getElementById('stockStatRow');
  var names = stockMap ? Object.keys(stockMap) : Object.keys(stock);

  /* 本月领用张数：优先当前月，数据不在当前月时回退到最新月份 */
  var now = new Date();
  var pad = function (n) { return n < 10 ? '0' + n : String(n); };
  var currentMonth = now.getFullYear() + '-' + pad(now.getMonth() + 1);
  var month = currentMonth;
  if (!records.some(function (item) {
    return String(item.time || item.createTime || '').indexOf(currentMonth) === 0;
  })) {
    month = '';
    records.forEach(function (item) {
      var m = String(item.time || item.createTime || '').slice(0, 7);
      if (m > month) month = m;
    });
  }
  var monthQty = records.reduce(function (sum, item) {
    var t = String(item.time || item.createTime || '');
    if (month && t.indexOf(month) !== 0) return sum;
    var qty = Number(item.qty);
    return sum + (isFinite(qty) ? qty : 0);
  }, 0);
  var pendingApproval = records.filter(isAwaitingApproval).length;

  var summary =
    '<div class="stat-card">' +
      '<div class="stat-label">本月领用张数</div>' +
      '<div class="stat-value">' + monthQty.toLocaleString('zh-CN') + '<span class="stat-unit">张</span></div>' +
      '<div class="stat-meta"><span class="stat-chip">按领用时间统计</span></div>' +
    '</div>' +
    '<div class="stat-card' + (pendingApproval ? ' is-low' : '') + '">' +
      '<div class="stat-label">待审批数</div>' +
      '<div class="stat-value">' + pendingApproval + '<span class="stat-unit">条</span></div>' +
      '<div class="stat-meta"><span class="stat-chip">' + (pendingApproval ? '待处理，请及时审批' : '暂无待办') + '</span></div>' +
    '</div>';

  if (!names.length) {
    row.innerHTML = summary + '<div class="stat-card"><div class="stat-label">标签库存</div>' +
      '<div class="stat-value" style="font-size:15px;color:var(--text-tertiary);">暂无库存数据，可点击右上角「库存管理」初始化</div></div>';
    return;
  }

  var TONES = ['tone-green', 'tone-purple', 'tone-orange'];
  row.innerHTML = summary + names.map(function (name, idx) {
    var s = stockMap
      ? stockMap[name]
      : { stock: Number(stock[name]) || 0, reserved: 0, available: Number(stock[name]) || 0 };
    var low = s.available < LOW_STOCK_THRESHOLD ? ' is-low' : ' ' + TONES[idx % TONES.length];
    return '<div class="stat-card' + low + '">' +
      '<div class="stat-label">' + esc(name) + '</div>' +
      '<div class="stat-value">' + s.available.toLocaleString('zh-CN') + '<span class="stat-unit">张可用</span></div>' +
      '<div class="stat-meta">' +
        '<span class="stat-chip">库存 ' + s.stock.toLocaleString('zh-CN') + '</span>' +
        '<span class="stat-chip">预占 ' + s.reserved + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

function filteredRecords() {
  var status = document.getElementById('statusSelect').value;
  var kw = document.getElementById('searchInput').value.trim().toLowerCase();

  return readRecords().filter(function (item) {
    if (status && statusText(item) !== status) return false;
    if (kw) {
      var hay = ((item.name || '') + ' ' + (item.plot || '') + ' ' + (item.remark || '') + ' ' +
        orderNoOf(item) + ' ' + labelCodeOf(item) + ' ' + applicantOf(item) + ' ' +
        traceBatchNoOf(item) + ' ' + labelTypeOf(item)).toLowerCase();
      if (hay.indexOf(kw) === -1) return false;
    }
    return true;
  });
}

        (item.printBatch ? '<br>打印批次：' + esc(item.printBatch) : '') + '</div>';
    } else if (item.approveRemark) {

    } else if (isPendingPrint(item)) {
      actions += '<button class="action-btn detail" onclick="openApproveModal(\'' + recordId + '\')">去打印</button>';
    } else {

    }
    actions += '</div>';

    return '<tr>' +
      '<td class="checkbox-col">' + (i + 1) + '</td>' +

      '<td><strong>' + esc(item.name || '-') + '</strong></td>' +

      '<td>' + esc(labelTypeOf(item)) + '</td>' +

      '<td>' + esc(applicantOf(item)) + '</td>' +

function resetFilter() {

function refreshAll() {

}

/* ---------- 审批弹窗 ---------- */
var approveIntent = 'normal';

function openApproveModal(id, mode) {
  var list = readRecords();
  var target = null;
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].id) === String(id)) { target = list[i]; break; }
  }
  if (!target) { Toast.error('未找到该领用记录'); return; }

  currentId = target.id;
  approveIntent = mode || 'normal';
  var st = statusText(target);
  var awaiting = isAwaitingApproval(target);
  var pending = isPendingPrint(target);

  document.getElementById('approveTitle').textContent =
    approveIntent === 'reject' ? '驳回标签领用'
      : (awaiting ? '标签领用审批' : (pending ? '待打印领用申请' : '领用记录详情'));
  document.getElementById('apOrderNo').textContent = orderNoOf(target);
  document.getElementById('apName').textContent = target.name || '-';
  document.getElementById('apCode').textContent = labelCodeOf(target);
  document.getElementById('apTraceBatchNo').textContent = traceBatchNoOf(target);
  var labelTypeSel = document.getElementById('apLabelType');
  var lt = labelTypeOf(target);
  if (!Array.prototype.some.call(labelTypeSel.options, function (o) { return o.value === lt; })) {
    var opt = document.createElement('option');
    opt.value = lt;
    opt.textContent = lt;
    labelTypeSel.appendChild(opt);
  }
  labelTypeSel.value = lt;
  labelTypeSel.disabled = !awaiting;
  document.getElementById('apSpec').textContent = specOf(target);
  document.getElementById('apQty').textContent = target.qty != null ? target.qty : '-';
  document.getElementById('apPlot').textContent = target.plot || '-';
  document.getElementById('apApplicant').textContent = applicantOf(target);
  document.getElementById('apPrinter').textContent = printerOf(target);
  document.getElementById('apTime').textContent = target.time || target.createTime || '-';
  document.getElementById('apRemarkText').textContent = target.remark || '-';
  document.getElementById('apStatus').innerHTML =
    '<span class="status-tag ' + (STATUS_CLASS[st] || 'processing') + '">' + esc(st) + '</span>';
  document.getElementById('apRemark').value = target.approveRemark || '';

  // 打印信息：已打印时展示打印时间与打印批次
  var printWrap = document.getElementById('apPrintWrap');
  if (target.printTime) {
    printWrap.style.display = '';
    document.getElementById('apPrint').textContent =
      target.printTime + (target.printBatch ? ' · 批次 ' + target.printBatch : '');
  } else {
    printWrap.style.display = 'none';
  }

  // 待审批：可通过 / 驳回；待打印：可去打印；已打印 / 已驳回：只读查看
  document.getElementById('apRemarkField').style.display = awaiting ? '' : 'none';
  document.getElementById('apApproveBtn').style.display = (awaiting && approveIntent !== 'reject') ? '' : 'none';
  document.getElementById('apRejectBtn').style.display = awaiting ? '' : 'none';
  document.getElementById('apPrintBtn').style.display = pending ? '' : 'none';

  document.getElementById('approveModal').classList.add('show');
  if (approveIntent === 'reject') {
    setTimeout(function () { document.getElementById('apRemark').focus(); }, 1);
  }
}

/* 跳转到打印环节：带上标签类型，便于直接打印扣减库存 */
function goPrint() {
  var list = readRecords();
  var target = null;
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].id) === String(currentId)) { target = list[i]; break; }
  }
  var name = target && target.name ? target.name : '';
  closeApproveModal();
  var url = 'trace_code.html' + (name ? '?label=' + encodeURIComponent(name) : '');
  if (window.parent && typeof window.parent.openPage === 'function') {
    window.parent.openPage(url, '溯源编码');
  } else {
    window.location.href = url;
  }
}

function closeApproveModal() {
  document.getElementById('approveModal').classList.remove('show');
  currentId = null;
}

/* 提交审批：通过后转为待打印，驳回需二次确认。库存扣减不在本页发生，交由打印环节处理 */
function submitApprove(decision) {
  var remark = document.getElementById('apRemark').value.trim();

  if (decision === '已驳回') {
    if (!remark) { Toast.warning('驳回时请填写驳回原因'); return; }
    ConfirmDialog.show({
      title: '驳回标签领用',
      message: '确定要驳回该领用申请吗？驳回后移动端将标记为「已驳回」，且不再占用待打印标签库存。',
      onConfirm: function () { doApprove(decision, remark); }
    });
    return;
  }

  if (decision === '通过') {
    doApprove(decision, remark || '审批通过');
    return;
  }
  doApprove(decision, remark);
}

/* 审批落库：通过 → 待打印；驳回 → 已驳回 */
function doApprove(decision, remark) {
  if (typeof MobileBridge === 'undefined') {
    Toast.error('数据桥接未加载，无法保存审批结果');
    return;
  }

  var target = null;
  var all = readRecords();
  for (var i = 0; i < all.length; i++) {
    if (String(all[i].id) === String(currentId)) { target = all[i]; break; }
  }
  var labelTypeSel = document.getElementById('apLabelType');

  var patch = {
    approveRemark: remark,
    approveTime: MobileBridge.stampNow(),
    traceBatchNo: target ? traceBatchNoOf(target) : document.getElementById('apTraceBatchNo').textContent || '',
    labelType: (labelTypeSel && labelTypeSel.value) || (target ? labelTypeOf(target) : '一物一码')
  };
  var resultText = decision;

  if (decision === '通过' || decision === '待打印') {
    /* 保持 status='pending' 以兼容 trace_code.html 的打印关联逻辑，
     * 通过 printReady 标记区分「待审批」与「待打印」。 */
    patch.status = 'pending';
    patch.printReady = true;
    patch.approvedBy = '管理员';
    patch.approveResult = '通过';
    resultText = '待打印';
  } else {
    patch.status = decision;
    patch.approveResult = decision;
  }

  // 通过审批即预占库存，驳回则释放预占；实际扣减发生在打印环节
  var reservationId = '';
  if (window.TraceStore && target) {
    if (decision === '通过' || decision === '待打印') {
      if (target.labelReservationId) {
        reservationId = target.labelReservationId;
      } else {
        var rv = TraceStore.reserveStock(target.name, target.qty, { ref: orderNoOf(target), operator: '管理员' });
        if (!rv.ok) { Toast.error(rv.message || '标签库存预占失败'); return; }
        reservationId = rv.reservation.id;
      }
    } else if (target.labelReservationId) {
      TraceStore.releaseReservation(target.labelReservationId);
    }
  }
  patch.labelReservationId = reservationId;

  var ok = MobileBridge.updateRecord(MobileBridge.KEYS.labelRecords, currentId, patch);
  if (!ok) { Toast.error('审批结果保存失败，请刷新后重试'); return; }
  closeApproveModal();
  renderTable();
  Toast.success('审批结果已保存（' + resultText + '），移动端可查看');
}

/* ---------- 库存管理弹窗 ---------- */
function openStockModal() {
  var stock = readStock();
  var box = document.getElementById('stockEditBox');
  var names = Object.keys(stock);

  if (!names.length) {

  } else {

      return '<div class="stock-row">' +
        '<div class="stock-name">' + esc(name) + '</div>' +
        '<input type="number" min="0" step="1" value="' + esc(stock[name]) + '" data-stock-index="' + i + '">' +
        '<span style="font-size:13px;color:var(--text-tertiary);">张</span>' +
      '</div>';
    }).join('');
  }
  document.getElementById('stockModal').classList.add('show');

function closeStockModal() {
  document.getElementById('stockModal').classList.remove('show');
}

/* 保存库存：整份对象回写 localStorage */
function saveStock() {
  var stock = readStock();
  var names = Object.keys(stock);
  var inputs = document.querySelectorAll('#stockEditBox input[data-stock-index]');
  var invalid = false;

  inputs.forEach(function (input) {
    var idx = Number(input.getAttribute('data-stock-index'));
    var name = names[idx];
    if (!name) return;
    var val = Number(input.value);
    if (input.value === '' || isNaN(val) || val < 0) { invalid = true; return; }
    stock[name] = Math.floor(val);
  });

  if (invalid) { Toast.warning('库存数量必须为不小于 0 的整数'); return; }

  try {
    if (typeof MobileBridge === 'undefined') { Toast.error('数据桥接未加载，无法保存库存'); return; }
    localStorage.setItem(MobileBridge.KEYS.labelStock, JSON.stringify(stock));
  } catch (e) {
    Toast.error('本地存储写入失败，库存未能保存');
    return;
  }

  // 同步到溯源库存（预占/可用/打印扣减的统一数据源）
  if (window.TraceStore) {
    names.forEach(function (n) { TraceStore.setStock(n, stock[n]); });
  }

  closeStockModal();
  renderTable();
  Toast.success('标签库存已更新');
}

/* ============================================================
 * 标签类型维护（移动端 mb_label.html 可选清单的权威源）
 * 严格空库模式：标签类型一律来自后端 API（sf_label_type），不再写死/播种
 * ============================================================ */
var TYPE_KEY = 'smartorchard_label_types';
var LABEL_TYPE_RESOURCE = 'label_type';
var labelTypesData = [];
var labelTypesLoadState = 'loading';
var labelTypesLoadError = '';

var typeWorking = [];

/* 数据库行(snake_case) → 页面渲染字段 */
function mapLabelTypeRow(row) {
  return {
    id: row.label_code || (row.id == null ? '' : String(row.id)),
    name: row.label_name || '',
    desc: row.spec || row.label_type || '',
    unit: '张',
    enabled: row.status !== 'off' && row.status !== 'disabled'
  };
}

/* 异步取数：加载中 / 暂无数据 / 加载失败三态，不写 localStorage */
function loadLabelTypes() {
  if (!window.Api) { labelTypesLoadState = 'error'; labelTypesLoadError = '接口未就绪'; renderTypeRows(); return; }
  labelTypesLoadState = 'loading'; labelTypesLoadError = ''; renderTypeRows();
  Api.get(LABEL_TYPE_RESOURCE, { page: 1, size: 500 }).then(function (r) {
    if (!r || !r.ok) {
      labelTypesLoadState = 'error'; labelTypesLoadError = (r && r.message) || '请求异常';
      labelTypesData = []; typeWorking = []; renderTypeRows(); return;
    }
    labelTypesData = ((r.data && r.data.list) || []).map(mapLabelTypeRow);
    typeWorking = labelTypesData.map(function (t) { return Object.assign({}, t); });
    labelTypesLoadState = 'ok'; renderTypeRows();
  }).catch(function (e) {
    labelTypesLoadState = 'error'; labelTypesLoadError = (e && e.message) || '网络异常';
    labelTypesData = []; typeWorking = []; renderTypeRows();
  });
}

/* 读取标签类型清单（页面级数据） */
function readTypes() { return labelTypesData; }

function openTypeModal() {
  typeWorking = (labelTypesLoadState === 'ok')
    ? readTypes().map(function (t) { return Object.assign({}, t); })
    : [];
  renderTypeRows();
  document.getElementById('typeModal').classList.add('show');
}

function closeTypeModal() {
  document.getElementById('typeModal').classList.remove('show');
}

function renderTypeRows() {
  var box = document.getElementById('typeEditBox');
  if (!box) return;
  if (labelTypesLoadState !== 'ok') {
    var msg = labelTypesLoadState === 'loading' ? '正在加载数据...' : ('数据加载失败：' + labelTypesLoadError);
    box.innerHTML = '<div class="empty-state" style="padding:20px 0;">' + esc(msg) + '</div>';
    return;
  }
  if (!typeWorking.length) {
    box.innerHTML = '<div class="empty-state" style="padding:20px 0;">暂无数据，点击下方按钮新增</div>';
    return;
  }
  box.innerHTML = typeWorking.map(function (t, i) {
    return '<div class="stock-row">' +
      '<div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;">' +
        '<input type="text" data-type-index="' + i + '" data-field="name" value="' + esc(t.name || '') + '" placeholder="标签名称">' +
        '<input type="text" data-type-index="' + i + '" data-field="desc" value="' + esc(t.desc || '') + '" placeholder="描述">' +
      '</div>' +
      '<input type="text" data-type-index="' + i + '" data-field="unit" value="' + esc(t.unit || '张') + '" style="width:64px;" placeholder="单位">' +
      '<label style="display:flex;align-items:center;gap:4px;font-size:13px;white-space:nowrap;color:var(--text-secondary);">' +
        '<input type="checkbox" data-type-index="' + i + '" data-field="enabled" ' + (t.enabled !== false ? 'checked' : '') + '>启用</label>' +
      '<button class="jg-btn" style="padding:6px 10px;" onclick="removeTypeRow(' + i + ')">删除</button>' +
    '</div>';
  }).join('');
}

/* 把界面输入同步回 typeWorking，供增删行前保存用户输入 */
function syncTypeInputs() {
  var inputs = document.querySelectorAll('#typeEditBox [data-type-index]');
  Array.prototype.forEach.call(inputs, function (el) {
    var i = Number(el.getAttribute('data-type-index'));
    var field = el.getAttribute('data-field');
    if (!typeWorking[i]) return;
    if (field === 'enabled') typeWorking[i].enabled = el.checked;
    else typeWorking[i][field] = el.value.trim();
  });
}

function addTypeRow() {
  syncTypeInputs();
  typeWorking.push({ id: 'LB-' + Date.now().toString(36), name: '', desc: '', unit: '张', enabled: true });
  renderTypeRows();
}

function removeTypeRow(i) {
  syncTypeInputs();
  typeWorking.splice(i, 1);
  renderTypeRows();
}

function saveTypes() {
  syncTypeInputs();
  var list = typeWorking.filter(function (t) { return t.name; });
  if (!list.length) { Toast.warning('至少保留一个标签类型'); return; }

  var seen = {};
  for (var i = 0; i < list.length; i++) {
    if (seen[list[i].name]) { Toast.warning('标签名称重复：' + list[i].name); return; }
    seen[list[i].name] = true;
  }

  try {
    localStorage.setItem(TYPE_KEY, JSON.stringify(list));
  } catch (e) {
    Toast.error('本地存储写入失败，标签类型未能保存');
    return;
  }

  labelTypesData = list;
  labelTypesLoadState = 'ok';
  /* 为新增类型补齐库存键，使「库存管理」可对其设置库存（不覆盖已有库存） */
  if (typeof MobileBridge !== 'undefined') {
    var stock = readStock();
    var changed = false;
    list.forEach(function (t) { if (stock[t.name] == null) { stock[t.name] = 0; changed = true; } });
    if (changed) {
      try { localStorage.setItem(MobileBridge.KEYS.labelStock, JSON.stringify(stock)); } catch (e) { /* 忽略 */ }
    }
  }

  closeTypeModal();
  renderTable();
  Toast.success('标签类型已保存');
}

/* ---------- 标签模板与版本 ---------- */
function renderTemplates() {
  var tbody = document.getElementById('templateBody');
  if (!tbody) return;
  if (!window.TraceStore) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;color:#999;">溯源数据服务未加载</td></tr>';
    return;
  }
  var list = TraceStore.templates();
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;color:#999;">暂无标签模板</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(function (t) {
    var ly = t.layout || {};
    var fields = (ly.fields || []).join(' / ');
    var statusCls = t.status === 'active' ? 'active' : 'inactive';
    return '<tr>' +
      '<td><strong>' + esc(t.name) + '</strong></td>' +
      '<td style="font-size:12px;">' + esc(ly.size || '—') + ' · ' + esc(ly.material || '—') +
        '<div style="color:#999;">' + esc(fields) + '</div></td>' +
      '<td>v' + esc(t.version) + '</td>' +
      '<td><span class="status-tag ' + statusCls + '">' + (t.status === 'active' ? '启用' : '停用') + '</span></td>' +
      '<td class="text-mono" style="font-size:12px;">' + esc(t.updatedAt || '—') + '</td>' +
      '<td><div class="action-btns">' +
        '<button class="action-btn edit" onclick="bumpLabelTemplate(\'' + esc(t.id) + '\')">新建版本</button>' +
        '<button class="action-btn ' + (t.status === 'active' ? 'reject' : 'detail') + '" onclick="toggleLabelTemplate(\'' + esc(t.id) + '\')">' +
          (t.status === 'active' ? '停用' : '启用') + '</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

function createLabelTemplate() {
  if (!window.TraceStore) return;
  var name = window.prompt('请输入标签模板名称，例如：花牛苹果礼盒标签');
  if (!name) return;
  var res = TraceStore.saveTemplate({ name: name });
  if (!res.ok) { Toast.error(res.message || '新建失败'); return; }
  renderTemplates();
  Toast.success('标签模板已创建');
}

function bumpLabelTemplate(id) {
  if (!window.TraceStore) return;
  var note = window.prompt('请输入版本变更说明（如：新增合格证编号字段）') || '版式调整';
  var res = TraceStore.saveTemplate({ id: id, bumpVersion: true, note: note });
  if (!res.ok) { Toast.error(res.message || '新建版本失败'); return; }
  renderTemplates();
  Toast.success('已创建 v' + res.template.version);
}

function toggleLabelTemplate(id) {
  if (!window.TraceStore) return;
  var t = TraceStore.template(id);
  if (!t) return;
  var res = TraceStore.saveTemplate({ id: id, status: t.status === 'active' ? 'inactive' : 'active' });
  if (!res.ok) { Toast.error(res.message || '操作失败'); return; }
  renderTemplates();
  Toast.success(t.status === 'active' ? '模板已停用' : '模板已启用');
}

/* ---------- 打印任务（TraceStore 统一数据源） ---------- */
function renderPrintJobs() {
  var tbody = document.getElementById('printJobBody');
  if (!tbody) return;
  if (!window.TraceStore) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;color:#999;">溯源数据服务未加载</td></tr>';
    return;
  }
  var jobs = TraceStore.printJobs().slice().sort(function (a, b) {
    return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
  }).slice(0, 10);
  if (!jobs.length) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;color:#999;">暂无打印任务，可在「溯源编码」页打印标签</td></tr>';
    return;
  }
  var statusMap = { printed: '已打印', reprinted: '已重打', scrapped: '已报废' };
  tbody.innerHTML = jobs.map(function (j) {
    var cls = j.status === 'scrapped' ? 'inactive' : 'active';
    var actions = '<div class="action-btns">';
    if (j.status !== 'scrapped') {
      actions += '<button class="action-btn edit" onclick="reprintLabelJob(\'' + esc(j.id) + '\')">重打</button>' +
        '<button class="action-btn reject" onclick="scrapLabelJob(\'' + esc(j.id) + '\')">报废</button>';
    } else {
      actions += '<span style="font-size:12px;color:var(--text-tertiary);">已终止</span>';
    }
    actions += '</div>';
    return '<tr>' +
      '<td class="text-mono">' + esc(j.id) + '</td>' +
      '<td class="text-mono">' + esc(j.batchNo || '-') + '</td>' +
      '<td><strong>' + esc(j.labelName || '-') + '</strong></td>' +
      '<td>' + esc(j.qty) + '</td>' +
      '<td>' + (j.templateVersion ? 'v' + esc(j.templateVersion) : '—') + '</td>' +
      '<td>' + esc(j.operator || '-') + '</td>' +
      '<td class="text-mono">' + esc(j.createdAt || '-') + '</td>' +
      '<td><span class="status-tag ' + cls + '">' + (statusMap[j.status] || esc(j.status)) + '</span></td>' +
      '<td>' + actions + '</td>' +
    '</tr>';
  }).join('');
}

function reprintLabelJob(id) {
  if (!window.TraceStore) return;
  var reason = window.prompt('请输入重打原因（必填）');
  if (!reason) return;
  var res = TraceStore.reprintJob(id, reason);
  if (!res.ok) { Toast.error(res.message || '重打失败'); return; }
  renderTable();
  Toast.success('已创建重打任务：' + res.job.id);
}

function scrapLabelJob(id) {
  if (!window.TraceStore) return;
  var reason = window.prompt('请输入报废原因（选填）') || '标签报废';
  var res = TraceStore.scrapJob(id, reason);
  if (!res.ok) { Toast.error(res.message || '报废失败'); return; }
  renderTable();
  Toast.success('打印任务已标记报废');
}

/* 页内 Tab 切换 */
document.addEventListener('DOMContentLoaded', function () {
  var wrap = document.getElementById('labelTabs');
  if (wrap) {
    wrap.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('.seg-tab') : null;
      if (!btn) return;
      var tabs = wrap.querySelectorAll('.seg-tab');
      for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
      btn.classList.add('active');
      var panes = document.querySelectorAll('.main-content > .content-wrapper > .pane, .main-content > .pane');
      for (var j = 0; j < panes.length; j++) panes[j].classList.remove('active');
      var pane = document.getElementById(btn.getAttribute('data-pane'));
      if (pane) pane.classList.add('active');
    });
  }
});

document.addEventListener('DOMContentLoaded', function () {
  loadLabelTypes();
  // 严格空库模式：演示数据播种已停用，数据一律来自后端 API
  renderTable();
  document.getElementById('searchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') renderTable();
  });
});

/* ============================================================
 * 后端数据到达后自动重绘
 * ------------------------------------------------------------
 * 数据层在「后端预加载完成」与「本地写入」两条路径上都会派发
 * <store>StoreChange 窗口事件；页面若不监听，首次渲染发生在数据
 * 到达之前，界面会一直停在空列表。此处统一订阅后自动重绘。
 * ============================================================ */
(function () {
  // StoreLive 由 common/js/api.js 提供；部分页面未静态引入该文件，
  // 此时回退到原生窗口事件订阅，避免订阅被静默跳过导致页面不重绘。
  function bind(events, handler) {
    if (typeof StoreLive !== 'undefined') return StoreLive.on(events, handler);
    (Array.isArray(events) ? events : [events]).forEach(function (ev) {
      if (ev) window.addEventListener(ev, function () { try { handler(); } catch (e) { console.warn('[store-live]', e); } });
    });
  }
  bind(["traceStoreChange"], function () {
      renderStockStats();
      renderTemplates();
      renderPrintJobs();
  });
})();
</script>
