<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 农资出入库</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
  <link rel="stylesheet" href="css/page-content.css">
<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition:all 0.2s ease;
  }
  .module-card:hover {
    background:var(--bg-hover);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }

  /* 弹窗遮罩层 */
  .modal-overlay {
    display:none;
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0, 0, 0, 0.5);
    z-index:1000;
    justify-content:center;
    align-items:center;
    backdrop-filter:blur(4px);
  }

  .modal-overlay.show {
    display:flex;
  }

  /* 弹窗容器 */
  .modal-container {
    background:var(--bg-card);
    border-radius:12px;
    width:90%;
    max-width:600px;
    max-height:85vh;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0, 0, 0, 0.2);
    animation:modalFadeIn 0.2s ease-out;
  }

  @keyframes modalFadeIn {
    from {
      opacity:0;
      transform:scale(0.95) translateY(-20px);
    }
    to {
      opacity:1;
      transform:scale(1) translateY(0);
    }
  }

  /* 弹窗头部 */
  .modal-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 20px;
    border-bottom:1px solid var(--border-default);
    background:var(--gray-50);
  }

  .modal-title {
    font-size:16px;
    font-weight:600;
    color:#1f1f1f;
  }

  .modal-close {
    background:none;
    border:none;
    cursor:pointer;
    padding:4px;
    color:var(--text-tertiary);
    transition:color 0.2s;
  }

  .modal-close:hover {
    color:var(--text-secondary);
  }

  /* 弹窗内容 */
  .modal-body {
    padding:20px;
    overflow-y:auto;
    max-height:calc(85vh - 100px);
  }

  /* 表单样式 */
  .form-row {
    display:flex;
    gap:16px;
    margin-bottom:16px;
  }

  .form-item {
    flex:1;
  }

  .form-item label {
    display:block;
    font-size:13px;
    color:var(--text-secondary);
    margin-bottom:6px;
  }

  .form-item input,
  .form-item select {
    width:100%;
    padding:8px 12px;
    border:1px solid var(--border-strong);
    border-radius:6px;
    font-size:14px;
    transition:border-color 0.2s;
    box-sizing:border-box;
  }

  .form-item input:focus,
  .form-item select:focus {
    outline:none;
    border-color:var(--border-primary);
  }

  .form-item textarea {
    width:100%;
    padding:8px 12px;
    border:1px solid var(--border-strong);
    border-radius:6px;
    font-size:14px;
    resize:vertical;
    min-height:80px;
    box-sizing:border-box;
  }

  /* 弹窗底部 */
  .modal-footer {
    display:flex;
    justify-content:flex-end;
    gap:12px;
    padding:16px 20px;
    border-top:1px solid var(--border-default);
    background:var(--gray-50);
  }

  /* 详情弹窗样式 */
  .detail-content {
    font-size:14px;
  }

  .detail-row {
    display:flex;
    padding:12px 0;
    border-bottom:1px solid var(--border-light);
  }

  .detail-label {
    width:120px;
    color:var(--text-tertiary);
    flex-shrink:0;
  }

  .detail-value {
    color:var(--text-primary);
    font-weight:500;
  }

  /* 分页输入框 */
  .pagination-input {
    width:50px;
    padding:4px 8px;
    border:1px solid var(--border-strong);
    border-radius:4px;
    text-align:center;
    margin:0 4px;
  }

  /* 操作按钮样式 */
  .action-btns {
    display:flex;
    gap:6px;
  }
  .action-btn {
    padding:4px 10px;
    border:none;
    border-radius:4px;
    font-size:12px;
    cursor:pointer;
    transition:all 0.2s;
  }
  .action-btn.detail {
    background:var(--success-bg);
    color:var(--primary-500);
  }
  .action-btn.detail:hover {
    background:#c8e6c9;
  }
  .action-btn.download {
    background:var(--info-bg);
    color:var(--primary-500);
  }
  .action-btn.download:hover {
    background:#b3d8f0;
  }
  .action-btn.export {
    background:var(--warning-bg);
    color:var(--warning);
  }
  .action-btn.export:hover {
    background:#ffd591;
  }

  /* 导出格式选项 */
  .export-format-group {
    display:flex;
    gap:12px;
    margin-top:8px;
  }
  .export-format-option {
    display:flex;
    align-items:center;
    gap:6px;
    padding:10px 16px;
    border:1px solid var(--border-strong);
    border-radius:6px;
    cursor:pointer;
    transition:all 0.2s;
    flex:1;
    justify-content:center;
  }
  .export-format-option:hover {
    border-color:var(--border-primary);
    background:var(--success-bg);
  }
  .export-format-option input[type="radio"] {
    margin:0;
  }
  .export-format-option:has(input:checked) {
    border-color:var(--border-primary);
    background:var(--success-bg);
    color:var(--primary-500);
  }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */

<body data-active-menu="material" data-active-submenu="material-io">

<!-- ===== 整体布局容器 ===== -->
<div class="app-layout">

  <!-- 移动端遮罩层 -->
  <!-- ===== 主内容区 ===== -->

    <!-- 顶栏 -->
    <!-- Tab 标签栏 -->

      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">

          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
      <div class="content-wrapper">
        <!-- ===== 搜索栏区 ===== -->
        <div class="page-section search-section">
          <div class="search-bar">
            <select class="search-select" id="warehouseSelect">
              <option value="">全部仓库</option>
              <option value="warehouse1">一号仓库</option>
              <option value="warehouse2">二号仓库</option>
            </select>
            <select class="search-select" id="typeSelect">

              <option value="out">出库</option>
            </select>

            <input type="date" class="search-input" id="dateTo" style="min-width:140px;">
            <input type="text" class="search-input" placeholder="搜索单号..." id="searchInput">
            
          <div class="search-actions"><button class="jg-btn jg-btn-primary" onclick="search()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button><button class="jg-btn" onclick="smartReset()">重置</button></div>
          </div>
        </div>

        <!-- ===== 操作按钮区 ===== -->
        <div class="page-section action-bar">
          <button class="jg-btn jg-btn-primary" onclick="openInboundModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M12 5v14"/>
              <path d="M5 12h14"/>
            </svg>
            入库登记
          </button>
          <button class="jg-btn-outline" onclick="openOutboundModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" x2="12" y1="15" y2="3"/>
            </svg>
            出库登记
          </button>
          <button class="jg-btn-outline" onclick="openExportModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" x2="12" y1="3" y2="15"/>
            </svg>
            导出记录
          </button>
        </div>

        <!-- ===== 数据列表区 ===== -->
        <div class="page-section data-section">
          <div class="data-table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width:60px;">序号</th>
                  <th style="width:140px;">单号</th>
                  <th style="width:100px;">仓库</th>
                  <th style="width:80px;">类型</th>
                  <th>农资名称</th>
                  <th style="width:120px;">数量</th>
                  <th style="width:100px;">经手人</th>
                  <th style="width:140px;">日期</th>
                  <th style="width:140px;">操作</th>
                </tr>
              </thead>
              <tbody>
              </tbody>
            </table>
          </div>
          <div class="pagination" id="pagination">
          </div>
        </div>

      </div>
    </main>
  </div>

</div>
<!-- ===== 入库登记弹窗 ===== -->
<div class="modal-overlay" id="inboundModal">
  <div class="modal-container">
    <div class="modal-header">
      <h3 class="modal-title">入库登记</h3>
      <button class="modal-close" onclick="closeInboundModal()">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
          <path d="M5 5L13 13M13 5L5 13"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="inboundForm">
        <div class="form-row">
          <div class="form-item">
            <label>单号</label>
            <input type="text" id="inboundCode" placeholder="自动生成" readonly>
          </div>
          <div class="form-item">
            <label>仓库</label>
            <select id="inboundWarehouse">
              <option value="warehouse1">一号仓库</option>
              <option value="warehouse2">二号仓库</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>农资名称</label>
            <select id="inboundMaterial">
              <option value="">请选择农资</option>
            </select>
          </div>
          <div class="form-item">
            <label>数量</label>
            <input type="number" id="inboundQty" placeholder="请输入数量" min="1">
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>日期</label>
            <input type="date" id="inboundDate">
          </div>
          <div class="form-item">
            <label>经手人</label>
            <input type="text" id="inboundOperator" placeholder="请输入经手人">
          </div>
        </div>
        <div class="form-item">
          <label>备注</label>
          <textarea id="inboundRemark" placeholder="请输入备注信息"></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="jg-btn-outline" onclick="closeInboundModal()">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="saveInbound()">确认入库</button>
    </div>
  </div>
</div>

<!-- ===== 查看详情弹窗 ===== -->

<!-- ===== 导出确认弹窗 ===== -->
<div class="modal-overlay" id="exportModal">
  <div class="modal-container" style="max-width:400px;">
    <div class="modal-header">
      <h3 class="modal-title">导出记录</h3>
      <button class="modal-close" onclick="closeExportModal()">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">

    </div>

<!-- ===== 导出农资弹窗 ===== -->

<!-- ===== 下载记录弹窗 ===== -->

        <div style="display:flex;justify-content:space-between;margin-bottom:10px;">

        </div>
        <div style="display:flex;justify-content:space-between;">

      </div>
      <div class="form-item">

        <div class="export-format-group">
          <label class="export-format-option">
            <input type="radio" name="downFormat" value="excel" checked>

// 当前页面、每页条数、总条数、总页数
let currentPage = 1;
const pageSize = 10;
let totalItems = ioData.length;
let totalPages = Math.ceil(totalItems / pageSize);
let filteredData = [...ioData];

// DOM元素
const tableBody = document.querySelector('.data-table tbody');
const pagination = document.querySelector('.pagination');
const searchBtn = document.querySelector('.search-bar .jg-btn');
const searchInput = document.getElementById('searchInput');
const warehouseSelect = document.getElementById('warehouseSelect');
const typeSelect = document.getElementById('typeSelect');
const dateFrom = document.getElementById('dateFrom');
const dateTo = document.getElementById('dateTo');
const inboundBtn = document.querySelector('.action-bar .jg-btn-primary');
const outboundBtn = document.querySelector('.action-bar .jg-btn-outline:nth-child(2)');
const exportBtn = document.querySelector('.action-bar .jg-btn-outline:nth-child(3)');

// 弹窗元素
const inboundModal = document.getElementById('inboundModal');
const outboundModal = document.getElementById('outboundModal');
const viewModal = document.getElementById('viewModal');
const exportModal = document.getElementById('exportModal');

// 初始化
function init() {
  renderTable();
  renderPagination();
  bindEvents();
  populateMaterialSelect();
}

// 渲染表格
function renderTable() {
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageData = filteredData.slice(start, end);
  
  tableBody.innerHTML = pageData.map((item, __seq) => {
    return `
      <tr>
        <td>${start + __seq + 1}</td>
        <td><strong>${item.code}</strong></td>
        <td>${item.warehouse}</td>
        <td><span class="status-tag ${item.type === 'in' ? 'normal' : 'out'}">${item.typeText}</span></td>
        <td>${item.material}</td>
        <td class="text-right">${item.qty}${item.unit}</td>
        <td>${item.operator}</td>
        <td>${item.date}</td>
        <td>
          <div class="action-btns">
            <button class="action-btn export" onclick="exportMaterial('${item.id}')">导出</button>
            <button class="action-btn detail" onclick="viewDetail('${item.id}')">详情</button>
            <button class="action-btn download" onclick="downloadRecord('${item.id}')">下载</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

// 渲染分页
function renderPagination() {
  pagination.innerHTML = `
    <button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="prevPage()">‹</button>
    <button class="page-btn ${currentPage === 1 ? 'active' : ''}" onclick="goToPage(1)">1</button>
    ${currentPage > 2 ? `<button class="page-btn" onclick="goToPage(${currentPage - 1})">${currentPage - 1}</button>` : ''}
    ${currentPage > 1 && currentPage < totalPages ? `<button class="page-btn active" onclick="goToPage(${currentPage})">${currentPage}</button>` : ''}
    ${currentPage < totalPages - 1 ? `<button class="page-btn" onclick="goToPage(${currentPage + 1})">${currentPage + 1}</button>` : ''}
    ${totalPages > 1 ? `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="nextPage()">›</button>` : ''}
    <span style="margin-left:16px;font-size:13px;color:var(--text-tertiary);">第 <input type="number" class="pagination-input" id="pageInput" value="${currentPage}" min="1" max="${totalPages}" onkeydown="if(event.keyCode===13)jumpToPage()"> 页 / 共 ${totalPages} 页，共 ${totalItems} 条记录</span>
    <button class="jg-btn-outline" style="margin-left:12px;padding:2px 8px;font-size:12px;" onclick="jumpToPage()">跳转</button>
  `;
}

// 上一页
function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    renderTable();
    renderPagination();
  }
}

// 下一页
function nextPage() {
  if (currentPage < totalPages) {
    currentPage++;
    renderTable();
    renderPagination();
  }
}

// 跳转到指定页
function goToPage(page) {
  if (page >= 1 && page <= totalPages) {
    currentPage = page;
    renderTable();
    renderPagination();
  }
}

// 跳转按钮
function jumpToPage() {
  const pageInput = document.getElementById('pageInput');
  const page = parseInt(pageInput.value);
  if (!isNaN(page) && page >= 1 && page <= totalPages) {
    currentPage = page;
    renderTable();
    renderPagination();
  } else {
    pageInput.value = currentPage;
  }
}

// 搜索
function search() {
  const keyword = searchInput.value.toLowerCase().trim();
  const warehouse = warehouseSelect.value;
  const type = typeSelect.value;
  const from = dateFrom.value;
  const to = dateTo.value;
  
  filteredData = ioData.filter(item => {
    let match = true;
    
    if (keyword) {
      match = match && item.code.toLowerCase().includes(keyword);
    }
    if (warehouse) {
      match = match && item.warehouseCode === warehouse;
    }
    if (type) {
      match = match && item.type === type;
    }
    if (from) {
      const itemDate = item.date.split(' ')[0];
      match = match && itemDate >= from;
    }
    if (to) {
      const itemDate = item.date.split(' ')[0];
      match = match && itemDate <= to;
    }
    
    return match;
  });
  
  totalItems = filteredData.length;
  totalPages = Math.ceil(totalItems / pageSize);
  currentPage = 1;
  
  renderTable();
  renderPagination();
}

// 绑定事件
function bindEvents() {
  searchBtn.addEventListener('click', search);
  
  searchInput.addEventListener('keydown', function(e) {
    if (e.keyCode === 13) {
      search();
    }
  });
  
  warehouseSelect.addEventListener('change', search);
  typeSelect.addEventListener('change', search);
  dateFrom.addEventListener('change', search);
  dateTo.addEventListener('change', search);
  
  inboundBtn.addEventListener('click', openInboundModal);
  outboundBtn.addEventListener('click', openOutboundModal);
  exportBtn.addEventListener('click', openExportModal);
  
  // 点击遮罩层关闭弹窗
  inboundModal.addEventListener('click', function(e) {
    if (e.target === inboundModal) closeInboundModal();
  });
  outboundModal.addEventListener('click', function(e) {
    if (e.target === outboundModal) closeOutboundModal();
  });
  viewModal.addEventListener('click', function(e) {
    if (e.target === viewModal) closeViewModal();
  });
  exportModal.addEventListener('click', function(e) {
    if (e.target === exportModal) closeExportModal();
  });
  document.getElementById('exportMaterialModal').addEventListener('click', function(e) {
    if (e.target === this) closeExportMaterialModal();
  });
  document.getElementById('downloadModal').addEventListener('click', function(e) {
    if (e.target === this) closeDownloadModal();
  });
}

// 填充农资选择框
function populateMaterialSelect() {
  const materials = ['NPK复合肥', '高效杀虫剂', '有机肥料', '杀菌剂', '修枝剪', '磷酸二铵', '除草剂', '授粉器', '钾肥', '杀螨剂', '嫁接刀', '尿素', '保鲜剂', '喷雾器', '微量元素肥', '生物农药', '绑枝机', '叶面肥', '生长调节剂', '杀虫灯', '钙肥', '土壤改良剂', '疏花疏果剪'];
  
  const inboundSelect = document.getElementById('inboundMaterial');
  const outboundSelect = document.getElementById('outboundMaterial');
  
  materials.forEach(material => {
    const option1 = document.createElement('option');

}

// 打开入库弹窗
function openInboundModal() {
  document.getElementById('inboundCode').value = 'IO-' + Date.now().toString(36).toUpperCase();
  document.getElementById('inboundWarehouse').value = 'warehouse1';
  document.getElementById('inboundMaterial').value = '';
  document.getElementById('inboundQty').value = '';
  document.getElementById('inboundDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('inboundOperator').value = '';
  document.getElementById('inboundRemark').value = '';
  inboundModal.classList.add('show');
}

// 关闭入库弹窗
function closeInboundModal() {
  inboundModal.classList.remove('show');
}

// 生成出入库单号：IO-YYYYMMDD###（按当日已有记录顺延）
function genIoCode(dateStr) {
  const date = dateStr || new Date().toISOString().split('T')[0];
  const day = date.replace(/-/g, '');
  const seq = ioData.filter(i => i.code.indexOf('IO-' + day) === 0).length + 1;
  return 'IO-' + day + String(seq).padStart(3, '0');
}

// 当前时间 HH:MM
function nowTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

// 保存入库
function saveInbound() {
  const material = document.getElementById('inboundMaterial').value;
  const qty = document.getElementById('inboundQty').value;
  const warehouseSel = document.getElementById('inboundWarehouse');
  const date = document.getElementById('inboundDate').value;

  if (!material) {
    alert('请选择农资');
    return;
  }
  if (!qty || parseInt(qty) <= 0) {
    alert('请输入有效数量');
    return;
  }

  // 联动更新共享库存
  const result = MaterialStore.applyDelta(material, parseInt(qty));
  if (!result.ok) {
    alert(result.message);
    return;
  }

  const m = MaterialStore.get(material);
  ioData.unshift({
    id: String(Date.now()),
    code: genIoCode(date),
    warehouse: warehouseSel.options[warehouseSel.selectedIndex].text,
    warehouseCode: warehouseSel.value,
    type: 'in',
    typeText: '入库',
    material: material,
    qty: String(qty),
    unit: m ? m.unit : '',
    operator: document.getElementById('inboundOperator').value,
    date: (date || new Date().toISOString().split('T')[0]) + ' ' + nowTime(),
    remark: document.getElementById('inboundRemark').value || '入库登记'
  });
  ioData.sort((a, b) => b.date.localeCompare(a.date));

  alert('入库登记成功，库存已增加');
  closeInboundModal();
  search();
}

// 打开出库弹窗
function openOutboundModal() {
  document.getElementById('outboundCode').value = 'IO-' + Date.now().toString(36).toUpperCase();
  document.getElementById('outboundWarehouse').value = 'warehouse1';
  document.getElementById('outboundMaterial').value = '';

}

function closeOutboundModal() {
  outboundModal.classList.remove('show');
}

// 保存出库
function saveOutbound() {
  const material = document.getElementById('outboundMaterial').value;
  const qty = document.getElementById('outboundQty').value;
  const warehouseSel = document.getElementById('outboundWarehouse');
  const date = document.getElementById('outboundDate').value;

  if (!material) {
    alert('请选择农资');
    return;
  }
  if (!qty || parseInt(qty) <= 0) {
    alert('请输入有效数量');
    return;
  }

  // 出库前校验库存，不足则阻止出库
  const result = MaterialStore.applyDelta(material, -parseInt(qty));
  if (!result.ok) {
    alert(result.message);
    return;
  }

  const m = MaterialStore.get(material);
  ioData.unshift({
    id: String(Date.now()),
    code: genIoCode(date),
    warehouse: warehouseSel.options[warehouseSel.selectedIndex].text,
    warehouseCode: warehouseSel.value,
    type: 'out',
    typeText: '出库',
    material: material,
    qty: String(qty),
    unit: m ? m.unit : '',
    operator: document.getElementById('outboundOperator').value,
    date: (date || new Date().toISOString().split('T')[0]) + ' ' + nowTime(),
    remark: document.getElementById('outboundPurpose').value || '出库登记'
  });
  ioData.sort((a, b) => b.date.localeCompare(a.date));

  alert('出库登记成功，库存已扣减');
  closeOutboundModal();
  search();
}

}
