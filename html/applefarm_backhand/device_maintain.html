<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 设备维护</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  /* 模态框基础样式优化 */
  .modal-overlay, .detail-overlay, .add-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 999;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show, .detail-overlay.show, .add-overlay.show {
    display: block;
  }
  .modal-content, .detail-modal, .add-modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    padding: 24px;
    width: 560px;
    max-height: 85vh;
    overflow-y: auto;
    z-index: 1000;
    animation: modalSlideIn 0.25s ease-out;
  }
  @keyframes modalSlideIn {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .modal-content.show, .detail-modal.show, .add-modal.show {
    display: block;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid #f0f0f0;
    position: relative;
  }
  .modal-header::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 24px;
    background: linear-gradient(180deg, var(--primary-400), var(--primary-600));
    border-radius: 0 4px 4px 0;
  }
  .modal-header h3 {
    font-size: 16px;
    font-weight: 600;
    color: #1a2e1a;
    margin: 0;
    padding-left: 12px;
  }
  .modal-close {
    width: 28px;
    height: 28px;
    border: none;
    background: #f5f5f5;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }
  .modal-close:hover {
    background: var(--error-bg);
    color: var(--error);
  }

  /* 表单样式 */
  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #4a5a4a;
    margin-bottom: 8px;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #dde3dd;
    border-radius: 8px;
    font-size: 13px;
    box-sizing: border-box;
    transition: all 0.2s ease;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none;
    border-color: var(--primary-400);
    box-shadow: 0 0 0 3px rgba(34, 168, 74, 0.1);
  }
  .form-group textarea {
    min-height: 100px;
    resize: vertical;
  }
  .modal-footer {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #f0f0f0;
    background: #fafcfa;
    margin: 20px -24px -24px;
    padding: 16px 24px;
    border-radius: 0 0 16px 16px;
  }

  /* 详情信息卡片 */
  .detail-info {
    padding: 12px;
    background: linear-gradient(135deg, #fafcfa, #f5f7f5);
    border-radius: 12px;
    margin-bottom: 12px;
    border: 1px solid #e8ede8;
  }
  .detail-row {
    display: flex;
    padding: 10px 0;
    border-bottom: 1px dashed #e0e5e0;
  }
  .detail-row:last-child {
    border-bottom: none;
  }
  .detail-label {
    width: 100px;
    color: #888;
    font-size: 13px;
    flex-shrink: 0;
  }
  .detail-value {
    flex: 1;
    color: #333;
    font-size: 13px;
  }

  /* 维护状态标签优化 */
  .maintain-status {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 500;
    white-space: nowrap;
  }
  .maintain-status.pending {
    background: #fffbe6;
    color: #d4b106;
    border: 1px solid #ffe58f;
  }
  .maintain-status.pending::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #faad14;
    margin-right: 6px;
  }
  .maintain-status.processing {
    background: #e6f7ff;
    color: #1890ff;
    border: 1px solid #91d5ff;
  }
  .maintain-status.processing::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #1890ff;
    margin-right: 6px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .maintain-status.completed {
    background: #f6ffed;
    color: #3a8618;
    border: 1px solid #b7eb8f;
  }
  .maintain-status.completed::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #52c41a;
    margin-right: 6px;
  }
  .maintain-status.cancelled {
    background: #f5f5f5;
    color: #999;
    border: 1px solid #d9d9d9;
  }
  .maintain-status.cancelled::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #999;
    margin-right: 6px;
  }

  /* 维护类型标签 */
  .maintain-type {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 500;
    background: #f0faf3;
    color: #22a84a;
    border: 1px solid #c5e6cc;
  }

  /* 分页器优化 */
  .pagination-wrapper {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #f0f2f0;
  }
  .pagination-info {
    font-size: 13px;
    color: #6b7b6b;
  }
  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
  }
  .pagination button, .pagination .page-btn {
    min-width: 36px;
    height: 36px;
    padding: 0 12px;
    border: 1px solid #e8ede8;
    background: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: #4a5a4a;
    transition: all 0.2s ease;
  }
  .pagination button.active, .pagination .page-btn.active {
    background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 2px 8px rgba(34, 168, 74, 0.3);
  }
  .pagination button:hover:not(.active):not(.disabled), .pagination .page-btn:hover:not(.active):not(.disabled) {
    background: #f5f8f5;
    border-color: var(--primary-300);
    color: var(--primary-600);
  }
  .pagination .disabled, .pagination .page-btn.disabled {
    opacity: 0.5;
    cursor: not-allowed;
    background: #fafcfa;
  }
  .pagination .page-ellipsis {
    padding: 0 8px;
    color: #999;
  }

  /* 操作按钮样式 */
  .action-btns {
    display: flex;
    gap: 6px;
    flex-wrap: nowrap;
  }
  .action-btn {
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 500;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .action-btn.detail {
    color: #2b6cb0;
    background: #f5f8fc;
    border-color: #c5d9f0;
  }
  .action-btn.detail:hover {
    background: #edf2fa;
    border-color: #90bce8;
  }
  .action-btn.edit {
    color: var(--primary-600);
    background: #f5faf6;
    border-color: #c5e6cc;
  }
  .action-btn.edit:hover {
    background: var(--primary-50);
    border-color: var(--primary-300);
  }
  .action-btn.delete {
    color: var(--error);
    background: #fff8f7;
    border-color: #ffd1d1;
  }
  .action-btn.delete:hover {
    background: var(--error-bg);
    border-color: var(--error-border);
  }
</style>
</head>
<body data-active-menu="device" data-active-submenu="device-maintain">

<!-- ===== 整体布局容器 ===== -->
<div class="app-layout">

  <!-- ===== 侧边栏 ===== -->
  <nav class="sidebar" aria-label="主导航">
    <!-- 品牌区 -->
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <!-- 苹果绿 Logo SVG -->
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 3C8 1 5 3 5 6.5C5 10 8 14 11 17C14 14 17 10 17 6.5C17 3 14 1 11 3Z" fill="rgba(34,168,74,0.2)"/>
          <path d="M11 5C9.5 4 7.5 5 7.5 7C7.5 9 9.5 12 11 14"/>
          <path d="M11 5C12.5 4 14.5 5 14.5 7C14.5 9 12.5 12 11 14"/>
          <path d="M11 3V1"/>
        </svg>
      </div>
      <span class="sidebar-brand-text">智慧果园</span>
    </div>

    <!-- 菜单主体（由 JS 动态渲染） -->
    <div class="sidebar-body"></div>

    <!-- 底部功能区 -->
    <div class="sidebar-footer">
      <button class="sidebar-footer-btn sidebar-collapse-btn" title="折叠侧边栏">
        <span class="collapse-icon">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 3L6 9L11 15"/><path d="M14 3V15"/>
          </svg>
        </span>
        <span class="btn-text">折叠</span>
      </button>
      <button class="sidebar-footer-btn" title="系统设置" id="btn-settings">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="9" r="2.5"/>
          <path d="M9 2V4M9 14V16M2 9H4M14 9H16M4.2 4.2L5.6 5.6M12.4 12.4L13.8 13.8M13.8 4.2L12.4 5.6M5.6 12.4L4.2 13.8"/>
        </svg>
        <span class="btn-text">设置</span>
      </button>
    </div>
  </nav>

  <!-- 移动端遮罩层 -->
  <div class="sidebar-overlay"></div>

  <!-- ===== 主内容区 ===== -->
  <div class="main-wrapper">

    <!-- 顶栏 -->
    <header class="topbar">
      <!-- 移动端汉堡菜单 -->
      <button class="topbar-hamburger" aria-label="打开导航菜单">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M3 6H19M3 11H19M3 16H19"/>
        </svg>
      </button>
      <!-- 右侧功能区 -->
      <div class="topbar-right">
        <!-- 通知铃铛 -->
        <button class="topbar-notification" title="消息通知">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 2C7 2 5 4.5 5 7.5V12L3 14H17L15 12V7.5C15 4.5 13 2 10 2Z"/>
            <path d="M8.5 16C8.5 17 9.2 18 10 18C10.8 18 11.5 17 11.5 16"/>
          </svg>
          <span class="badge">3</span>
        </button>

        <!-- 用户信息 -->
        <div class="topbar-user">
          <div class="topbar-user-avatar">张</div>
          <span class="topbar-user-name">张三</span>
          <span class="topbar-user-arrow">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;">
              <path d="M3 5L6 8L9 5"/>
            </svg>
          </span>
        </div>

        <!-- 用户下拉菜单 -->
        <div class="topbar-user-dropdown">
          <div class="dropdown-item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <circle cx="8" cy="5" r="3"/><path d="M2 15C2 11.5 5 10 8 10C11 10 14 11.5 14 15"/>
            </svg>
            个人中心
          </div>
          <div class="dropdown-item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <path d="M8 2V8L11 11"/><circle cx="8" cy="8" r="6"/>
            </svg>
            操作日志
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-item" style="color:var(--error);">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <path d="M6 2H3C2.45 2 2 2.45 2 3V13C2 13.55 2.45 14 3 14H6"/><path d="M10 11L14 8L10 5"/><path d="M14 8H6"/>
            </svg>
            退出登录
          </div>
        </div>
      </div>
    </header>

    <!-- Tab 标签栏 -->
    <div class="tab-bar">
      <!-- Tab 标签由 JS 动态渲染 -->
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
      <div class="content-wrapper">
        
        <!-- ===== 页面头部 ===== -->
        <div class="page-header">
          <div>
            <h1 class="page-title">设备维护</h1>
            <p class="page-subtitle">管理设备维护记录，安排维护计划</p>
          </div>
        </div>
        
        <!-- ===== 搜索栏区 ===== -->
        <div class="page-section search-section">
          <div class="search-bar">
            <select class="search-select" id="deviceSelect">
              <option value="">全部设备</option>
              <option value="D-001">D-001 土壤湿度传感器</option>
              <option value="D-002">D-002 智能灌溉控制器</option>
              <option value="D-003">D-003 气象监测站</option>
              <option value="D-006">D-006 工控主机</option>
            </select>
            <select class="search-select" id="statusSelect" style="min-width:120px;">
              <option value="">全部状态</option>
              <option value="pending">待处理</option>
              <option value="processing">进行中</option>
              <option value="completed">已完成</option>
              <option value="cancelled">已取消</option>
            </select>
            <select class="search-select" id="typeSelect" style="min-width:120px;">
              <option value="">全部类型</option>
              <option value="例行维护">例行维护</option>
              <option value="故障维修">故障维修</option>
              <option value="升级更新">升级更新</option>
              <option value="巡检">巡检</option>
            </select>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索维护内容...">
            <button class="jg-btn" style="margin-left:auto;" onclick="searchData()">搜索</button>
            <button class="jg-btn-outline" onclick="resetSearch()">重置</button>
          </div>
        </div>

        <!-- ===== 操作按钮区 ===== -->
        <div class="page-section action-bar">
          <button class="jg-btn jg-btn-primary" onclick="showAddModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M12 5v14"/>
              <path d="M5 12h14"/>
            </svg>
            新建维护
          </button>
          <button class="jg-btn-outline" onclick="exportRecords()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" x2="8" y1="13" y2="13"/>
              <line x1="16" x2="8" y1="17" y2="17"/>
            </svg>
            导出记录
          </button>
        </div>

        <!-- ===== 数据表格区 ===== -->
        <div class="page-section">
          <table class="data-table">
            <thead>
              <tr>
                <th>维护编号</th>
                <th>设备编号</th>
                <th>设备名称</th>
                <th>维护类型</th>
                <th>维护内容</th>
                <th>计划时间</th>
                <th>状态</th>
                <th>负责人</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="dataTableBody">
              <!-- 数据由JavaScript动态渲染 -->
            </tbody>
          </table>

          <!-- 分页 -->
          <div class="pagination-wrapper">
            <div class="pagination-info" id="paginationInfo">共 23 条记录，第 1/3 页</div>
            <div class="pagination" id="paginationContainer"></div>
          </div>
        </div>

      </div>
    </main>
  </div>

</div>

<!-- 删除确认模态框 -->
<div class="modal-overlay" id="deleteOverlay" onclick="hideDeleteModal()"></div>
<div class="modal-content" id="deleteModal">
  <div class="modal-header">
    <h3>确认删除</h3>
    <button class="modal-close" onclick="hideDeleteModal()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l8 8M11 3l-8 8"/></svg>
    </button>
  </div>
  <p style="color:#666;font-size:14px;">确定要删除这条维护记录吗？此操作无法撤销。</p>
  <div class="modal-footer">
    <button class="jg-btn-outline" onclick="hideDeleteModal()">取消</button>
    <button class="jg-btn" style="background:#ff4d4f;border-color:#ff4d4f;color:#fff;" onclick="confirmDelete()">确认删除</button>
  </div>
</div>

<!-- 导出记录模态框 -->
<div class="modal-overlay" id="exportOverlay" onclick="hideExportModal()"></div>
<div class="modal-content" id="exportModal">
  <div class="modal-header">
    <h3>导出维护记录</h3>
    <button class="modal-close" onclick="hideExportModal()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l8 8M11 3l-8 8"/></svg>
    </button>
  </div>
  <div class="form-group">
    <label>导出范围</label>
    <select id="exportScope">
      <option value="all">全部记录</option>
      <option value="current">当前筛选结果</option>
    </select>
  </div>
  <div class="form-group">
    <label>维护状态</label>
    <select id="exportStatus">
      <option value="">全部状态</option>
      <option value="pending">待处理</option>
      <option value="processing">进行中</option>
      <option value="completed">已完成</option>
      <option value="cancelled">已取消</option>
    </select>
  </div>
  <div class="form-group">
    <label>时间范围</label>
    <div style="display:flex;gap:10px;">
      <input type="date" id="exportStartDate" style="flex:1;padding:10px;border:1px solid #dde3dd;border-radius:8px;font-size:13px;">
      <span style="display:flex;align-items:center;color:#999;">至</span>
      <input type="date" id="exportEndDate" style="flex:1;padding:10px;border:1px solid #dde3dd;border-radius:8px;font-size:13px;">
    </div>
  </div>
  <div class="form-group">
    <label>导出格式</label>
    <div style="display:flex;gap:10px;">
      <label style="flex:1;display:flex;align-items:center;padding:10px;border:1px solid #dde3dd;border-radius:8px;cursor:pointer;">
        <input type="radio" name="exportFormat" value="excel" checked style="margin-right:8px;">
        <span>Excel (.xlsx)</span>
      </label>
      <label style="flex:1;display:flex;align-items:center;padding:10px;border:1px solid #dde3dd;border-radius:8px;cursor:pointer;">
        <input type="radio" name="exportFormat" value="pdf" style="margin-right:8px;">
        <span>PDF</span>
      </label>
    </div>
  </div>
  <div class="modal-footer">
    <button class="jg-btn-outline" onclick="hideExportModal()">取消</button>
    <button class="jg-btn jg-btn-primary" onclick="confirmExport()">导出记录</button>
  </div>
</div>

<!-- 详情模态框 -->
<div class="detail-overlay" id="detailOverlay" onclick="hideDetailModal()"></div>
<div class="detail-modal" id="detailModal">
  <div class="modal-header">

let currentPage = 1;
const pageSize = 10;
let filteredData = [...mockData];

// 状态映射
const statusMap = {
  pending: '待处理',
  processing: '进行中',
  completed: '已完成',
  cancelled: '已取消'
};

// 渲染表格
function renderTable() {
  const tbody = document.getElementById('dataTableBody');
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageData = filteredData.slice(start, end);
  
  tbody.innerHTML = pageData.map(item => `
    <tr>
      <td><strong>${item.id}</strong></td>
      <td>${item.deviceId}</td>
      <td>${item.deviceName}</td>
      <td><span class="maintain-type">${item.type}</span></td>
      <td>${item.content}</td>
      <td>${item.planDate}</td>
      <td><span class="maintain-status ${item.status}">${statusMap[item.status]}</span></td>
      <td>${item.manager}</td>
      <td>
        <div class="action-btns">
          <button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>
          ${item.status !== 'completed' && item.status !== 'cancelled' ? `<button class="action-btn edit" onclick="editMaintain('${item.id}')">编辑</button>` : ''}
          ${item.status !== 'completed' && item.status !== 'cancelled' ? `<button class="action-btn delete" onclick="deleteMaintain('${item.id}')">删除</button>` : ''}
        </div>
      </td>
    </tr>
  `).join('');
}

// 渲染分页
function renderPagination() {
  const container = document.getElementById('paginationContainer');
  const info = document.getElementById('paginationInfo');
  const totalPages = Math.ceil(filteredData.length / pageSize);
  
  info.textContent = `共 ${filteredData.length} 条记录，第 ${currentPage}/${totalPages || 1} 页`;
  
  if (totalPages <= 1) {
    container.innerHTML = '';
    return;
  }
  
  let html = '';
  html += `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="goToPage(${currentPage - 1})">上一页</button>`;
  
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
      html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
    } else if (i === currentPage - 2 || i === currentPage + 2) {
      html += '<span class="page-ellipsis">...</span>';
    }
  }
  
  html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="goToPage(${currentPage + 1})">下一页</button>`;
  
  container.innerHTML = html;
}

// 跳转页面
function goToPage(page) {
  const totalPages = Math.ceil(filteredData.length / pageSize);
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderTable();
  renderPagination();
}

// 搜索功能
function searchData() {
  const deviceId = document.getElementById('deviceSelect').value;
  const status = document.getElementById('statusSelect').value;
  const type = document.getElementById('typeSelect').value;
  const keyword = document.getElementById('searchInput').value.toLowerCase();
  
  filteredData = mockData.filter(item => {
    if (deviceId && item.deviceId !== deviceId) return false;
    if (status && item.status !== status) return false;
    if (type && item.type !== type) return false;
    if (keyword && !item.content.toLowerCase().includes(keyword) && !item.deviceName.toLowerCase().includes(keyword)) return false;
    return true;
  });
  
  currentPage = 1;
  renderTable();
  renderPagination();
}

// 重置搜索
function resetSearch() {
  document.getElementById('deviceSelect').value = '';
  document.getElementById('statusSelect').value = '';
  document.getElementById('typeSelect').value = '';
  document.getElementById('searchInput').value = '';
  filteredData = [...mockData];
  currentPage = 1;
  renderTable();
  renderPagination();
}
