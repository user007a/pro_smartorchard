<style>
  /* 模态框基础样式优化 */
  .modal-overlay, .detail-overlay, .add-overlay {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0, 0, 0, 0.5);
    z-index:999;
    backdrop-filter:blur(4px);
  }
  .modal-overlay.show, .detail-overlay.show, .add-overlay.show {
    display:block;
  }
  .modal-content, .detail-modal, .add-modal {
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    background:var(--bg-card);
    border-radius:16px;
    box-shadow:0 20px 60px rgba(0, 0, 0, 0.15);
    padding:24px;
    width:560px;
    max-height:85vh;
    overflow-y:auto;
    z-index:1000;
    animation:modalSlideIn 0.25s ease-out;
  }
  @keyframes modalSlideIn {
    from { opacity:0; transform:translate(-50%, -50%) scale(0.95); }
    to { opacity:1; transform:translate(-50%, -50%) scale(1); }
  }
  .modal-content.show, .detail-modal.show, .add-modal.show {
    display:block;
  }
  .modal-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    padding-bottom:16px;
    border-bottom:1px solid var(--border-light);
    position:relative;
  }
  .modal-header::before {
    content:'';
    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);
    width:4px;
    height:24px;
    background:linear-gradient(180deg, var(--primary-400), var(--primary-600));
    border-radius:0 4px 4px 0;
  }
  .modal-header h3 {
    font-size:16px;
    font-weight:600;
    color:var(--text-primary);
    margin:0;
    padding-left:12px;
  }
  .modal-close {
    width:28px;
    height:28px;
    border:none;
    background:var(--gray-100);
    border-radius:6px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.2s ease;
  }
  .modal-close:hover {
    background:var(--error-bg);
    color:var(--error);
  }

  /* 表单样式 */
  .form-group {
    margin-bottom:16px;
  }
  .form-group label {
    display:block;
    font-size:13px;
    font-weight:500;
    color:var(--text-secondary);
    margin-bottom:8px;
  }
  .form-group input, .form-group select, .form-group textarea {
    width:100%;
    padding:10px;
    border:1px solid var(--border-default);
    border-radius:8px;
    font-size:13px;
    box-sizing:border-box;
    transition:all 0.2s ease;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline:none;
    border-color:var(--primary-400);
    box-shadow:0 0 0 3px rgba(24, 144, 255, 0.1);
  }
  .form-group textarea {
    min-height:100px;
    resize:vertical;
  }
  .modal-footer {
    display:flex;
    gap:10px;
    justify-content:flex-end;
    margin-top:24px;
    padding-top:16px;
    border-top:1px solid var(--border-light);
    background:var(--gray-50);
    margin:20px -24px -24px;
    padding:16px 24px;
    border-radius:0 0 16px 16px;
  }

  /* 详情信息卡片 */
  .detail-info {
    padding:12px;
    background:linear-gradient(135deg, var(--gray-50), var(--gray-100));
    border-radius:12px;
    margin-bottom:12px;
    border:1px solid var(--border-default);
  }
  .detail-row {
    display:flex;
    padding:10px 0;
    border-bottom:1px dashed var(--border-default);
  }
  .detail-label {
    width:100px;
    color:var(--text-tertiary);
    font-size:13px;
    flex-shrink:0;
  }
  .detail-value {
    flex:1;
    color:var(--text-primary);
    font-size:13px;
  }

  /* 维护状态标签优化 */
  .maintain-status {
    display:inline-flex;
    align-items:center;
    padding:3px 10px;
    border-radius:20px;
    font-size:11.5px;
    font-weight:500;
    white-space:nowrap;
  }
  .maintain-status.pending {
    background:#fffbe6;
    color:#d4b106;
    border:1px solid #ffe58f;
  }
  .maintain-status.pending::before {
    content:'';
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#faad14;
    margin-right:6px;
  }
  .maintain-status.processing {
    background:var(--info-bg);
    color:var(--primary-500);
    border:1px solid var(--info-border);
  }
  .maintain-status.processing::before {
    content:'';
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--primary-500);
    margin-right:6px;
    animation:pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity:1; }
    50% { opacity:0.5; }
  }
  .maintain-status.completed {
    background:var(--success-bg);
    color:#3a8618;
    border:1px solid #b7eb8f;
  }
  .maintain-status.completed::before {
    content:'';
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--success);
    margin-right:6px;
  }
  .maintain-status.cancelled {
    background:var(--gray-100);
    color:var(--text-tertiary);
    border:1px solid var(--border-strong);
  }
  .maintain-status.cancelled::before {
    content:'';
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#999;
    margin-right:6px;
  }

  /* 维护类型标签 */
  .maintain-type {
    display:inline-flex;
    align-items:center;
    padding:3px 10px;
    border-radius:20px;
    font-size:11.5px;
    font-weight:500;
    background:var(--primary-50);
    color:var(--primary-500);
    border:1px solid var(--border-default);
  }

  /* 分页器优化 */
  .pagination-wrapper {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:24px;
    padding-top:20px;
    border-top:1px solid #f0f2f0;
  }
  .pagination-info {
    font-size:13px;
    color:var(--text-tertiary);
  }
  .pagination {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
  }
  .pagination button, .pagination .page-btn {
    min-width:36px;
    height:36px;
    padding:0 12px;
    border:1px solid var(--border-default);
    background:var(--bg-card);
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    font-weight:500;
    color:var(--text-secondary);
    transition:all 0.2s ease;
  }
  .pagination button.active, .pagination .page-btn.active {
    background:linear-gradient(135deg, var(--primary-500), var(--primary-600));
    color:var(--text-inverse);
    border-color:transparent;
    box-shadow:0 2px 8px rgba(24, 144, 255, 0.3);
  }
  .pagination button:hover:not(.active):not(.disabled), .pagination .page-btn:hover:not(.active):not(.disabled) {
    background:#f5f8f5;
    border-color:var(--primary-300);
    color:var(--primary-600);
  }
  .pagination .disabled, .pagination .page-btn.disabled {
    opacity:0.5;
    cursor:not-allowed;
    background:var(--gray-50);
  }
  .pagination .page-ellipsis {
    padding:0 8px;
    color:var(--text-tertiary);
  }

  /* 操作按钮样式 */
  .action-btns {
    display:flex;
    gap:6px;
    flex-wrap:nowrap;
  }
  .action-btn {
    padding:4px 10px;
    font-size:11.5px;
    font-weight:500;
    border:1px solid transparent;
    border-radius:6px;
    cursor:pointer;
    transition:all 0.2s ease;
    white-space:nowrap;
  }
  .action-btn.detail {
    color:#2b6cb0;
    background:#f5f8fc;
    border-color:#c5d9f0;
  }
  .action-btn.detail:hover {
    background:#edf2fa;
    border-color:#90bce8;
  }
  .action-btn.edit {
    color:var(--primary-600);
    background:var(--gray-50);
    border-color:var(--border-default);
  }
  .action-btn.edit:hover {
    background:var(--primary-50);
    border-color:var(--primary-300);
  }
  .action-btn.delete {
    color:var(--error);
    background:#fff8f7;
    border-color:#ffd1d1;
  }
  .action-btn.delete:hover {
    background:var(--error-bg);
    border-color:var(--error-border);
  }
</style>

let currentPage = 1;
const pageSize = 10;
let filteredData = [...mockData];

// 状态映射
const statusMap = {
  pending: '待处理',
  processing: '进行中',
  completed: '已完成',
  cancelled: '已取消'
};

// 渲染表格
function renderTable() {
  const tbody = document.getElementById('dataTableBody');
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageData = filteredData.slice(start, end);
  
  tbody.innerHTML = pageData.map(item => `
    <tr>
      <td><strong>${item.id}</strong></td>
      <td>${item.deviceId}</td>
      <td>${item.deviceName}</td>
      <td><span class="maintain-type">${item.type}</span></td>
      <td>${item.content}</td>
      <td>${item.planDate}</td>
      <td><span class="maintain-status ${item.status}">${statusMap[item.status]}</span></td>
      <td>${item.manager}</td>
      <td>
        <div class="action-btns">
          <button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>
          ${item.status !== 'completed' && item.status !== 'cancelled' ? `<button class="action-btn edit" onclick="editMaintain('${item.id}')">编辑</button>` : ''}
          ${item.status !== 'completed' && item.status !== 'cancelled' ? `<button class="action-btn delete" onclick="deleteMaintain('${item.id}')">删除</button>` : ''}
        </div>
      </td>
    </tr>
  `).join('');
}

// 渲染分页
function renderPagination() {
  const container = document.getElementById('paginationContainer');
  const info = document.getElementById('paginationInfo');
  const totalPages = Math.ceil(filteredData.length / pageSize);
  
  info.textContent = `共 ${filteredData.length} 条记录，第 ${currentPage}/${totalPages || 1} 页`;
  
  if (totalPages <= 1) {
    container.innerHTML = '';
    return;
  }
  
  let html = '';
  html += `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="goToPage(${currentPage - 1})">上一页</button>`;
  
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
      html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
    } else if (i === currentPage - 2 || i === currentPage + 2) {
      html += '<span class="page-ellipsis">...</span>';
    }
  }
  
  html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="goToPage(${currentPage + 1})">下一页</button>`;
  
  container.innerHTML = html;
}

// 跳转页面
function goToPage(page) {
  const totalPages = Math.ceil(filteredData.length / pageSize);
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderTable();
  renderPagination();
}

// 搜索功能
function searchData() {
  const deviceId = document.getElementById('deviceSelect').value;
  const status = document.getElementById('statusSelect').value;
  const type = document.getElementById('typeSelect').value;
  const keyword = document.getElementById('searchInput').value.toLowerCase();
  
  filteredData = mockData.filter(item => {
    if (deviceId && item.deviceId !== deviceId) return false;
    if (status && item.status !== status) return false;
    if (type && item.type !== type) return false;
    if (keyword && !item.content.toLowerCase().includes(keyword) && !item.deviceName.toLowerCase().includes(keyword)) return false;
    return true;
  });
  
  currentPage = 1;
  renderTable();
  renderPagination();
}

  document.getElementById('typeSelect').value = '';
  document.getElementById('searchInput').value = '';
  filteredData = [...mockData];
  currentPage = 1;
  renderTable();
  renderPagination();
}
