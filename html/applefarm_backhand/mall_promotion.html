<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 促销活动管理</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/page-content.css">
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<style>
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
  }
  .stat-label { font-size: var(--font-size-sm); color: var(--text-tertiary); margin-bottom: var(--space-xs); }
  .stat-value {
    font-size: 26px; font-weight: var(--font-weight-bold);
    color: var(--text-primary); line-height: 1.2; font-variant-numeric: tabular-nums;
  }
  .notice-bar {
    display: flex; align-items: flex-start; gap: var(--space-sm);
    padding: var(--space-md) var(--space-lg);
    background: var(--info-bg); border: 1px solid var(--info-border);
    border-radius: var(--radius-lg); font-size: var(--font-size-sm);
    color: var(--text-secondary); margin-bottom: var(--space-lg);
  }
  .notice-bar svg { flex-shrink: 0; margin-top: 2px; color: var(--info); }
  .promo-cell { display: flex; align-items: center; gap: var(--space-md); }
  .promo-img {
    width: 56px; height: 40px; border-radius: var(--radius-md);
    object-fit: cover; background: var(--gray-100); flex-shrink: 0;
  }
  .promo-name { font-weight: var(--font-weight-semibold, 600); color: var(--text-primary); }
  .promo-sub { font-size: var(--font-size-xs); color: var(--text-tertiary); }
  .promo-id { font-size: var(--font-size-xs); color: var(--text-tertiary); font-family: 'SF Mono', Consolas, monospace; }
  .tag-badge {
    display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm);
    background: var(--error-bg); color: var(--error);
    font-size: var(--font-size-xs); white-space: nowrap;
  }
  .target-tag {
    display: inline-block; padding: 3px 10px; border-radius: var(--radius-sm);
    font-size: var(--font-size-xs); white-space: nowrap;
  }
  .target-tag.order { background: var(--primary-50); color: var(--primary-600); }
  .target-tag.goods { background: var(--warning-bg); color: var(--warning); }
  .status-tag {
    display: inline-block; padding: 3px 10px; border-radius: var(--radius-full);
    font-size: var(--font-size-xs); white-space: nowrap;
  }
  .status-tag.on { background: var(--success-bg); color: var(--success); }
  .status-tag.off { background: var(--gray-100); color: var(--text-secondary); }
  .status-tag.ended { background: var(--gray-100); color: var(--text-tertiary); }
  .price-cell { color: var(--error); font-weight: var(--font-weight-semibold, 600); }
  .price-original { color: var(--text-tertiary); text-decoration: line-through; margin-left: 6px; font-weight: 400; font-size: var(--font-size-xs); }
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 1000;
    justify-content: center; align-items: center; backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--bg-card); border-radius: 12px; width: 92%; max-width: 660px;
    max-height: 85vh; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    animation: modalFadeIn 0.2s ease-out;
  }
  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.95) translateY(-20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-bottom: 1px solid var(--border-default);
  }
  .modal-title { font-size: 16px; font-weight: 600; color: #1f1f1f; }
  .modal-close {
    background: none; border: none; cursor: pointer; padding: 4px;
    font-size: 20px; line-height: 1; color: var(--text-tertiary);
  }
  .modal-close:hover { color: var(--text-secondary); }
  .modal-body { padding: 20px; overflow-y: auto; max-height: calc(85vh - 132px); }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 12px;
    padding: 16px 20px; border-top: 1px solid var(--border-default);
  }
  .form-row { display: flex; gap: var(--space-md); margin-bottom: var(--space-lg); }
  .form-field { flex: 1; }
  .form-field label {
    display: block; font-size: var(--font-size-sm);
    font-weight: var(--weight-medium, 500); color: var(--text-primary); margin-bottom: var(--space-sm);
  }
  .form-field input, .form-field select, .form-field textarea {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--border-default);
    border-radius: var(--radius-lg); font-size: var(--font-size-base);
    font-family: inherit; background: var(--bg-card); box-sizing: border-box;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .form-field textarea { min-height: 76px; resize: vertical; line-height: var(--line-height-relaxed); }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
    border-color: var(--primary-500); box-shadow: 0 0 0 4px rgba(24,144,255,0.12); outline: none;
  }
  .empty-state { padding: var(--space-2xl) 0; text-align: center; color: var(--text-tertiary); font-size: var(--font-size-sm); }
</style>
</head>
<body data-active-menu="mall" data-active-submenu="mall-promotion">

<div class="main-wrapper">
  <div class="tab-bar">
    <div class="tab-bar-actions">
      <button class="tab-close-all" title="关闭全部标签">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3L11 11M11 3L3 11"/>
        </svg>
      </button>
    </div>
  </div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">促销活动管理</div>
        <div class="page-subtitle">维护 H5 首页「最新活动」与商品页的活动位，配置价格区间与起止时间</div>
      </div>
      <div class="page-actions">
        <button class="jg-btn" onclick="resetToH5Default()">恢复 H5 默认</button>
        <button class="jg-btn jg-btn-primary" onclick="openEdit()">新增活动</button>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">活动总数</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">进行中</div>
        <div class="stat-value" id="statOn">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">已结束</div>
        <div class="stat-value" id="statEnd">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">首页活动位</div>
        <div class="stat-value" id="statOrder">0</div>
      </div>
    </div>

    <div class="page-section search-section">
      <div class="search-bar">
        <select class="search-select" id="targetSelect">
          <option value="">全部位置</option>
          <option value="order">首页最新活动</option>
          <option value="goods">商品页活动</option>
        </select>
        <select class="search-select" id="statusSelect">
          <option value="">全部状态</option>
          <option value="on">启用中</option>
          <option value="off">已停用</option>
          <option value="end">已结束</option>
        </select>
        <input type="text" class="search-input" placeholder="搜索活动名称 / 活动ID..." id="searchInput">
        <div class="search-actions">
          <button class="jg-btn jg-btn-primary" onclick="renderTable()">搜索</button>
          <button class="jg-btn" onclick="resetFilter()">重置</button>
        </div>
      </div>
    </div>

    <div class="page-section data-section">
      <div class="data-table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th class="checkbox-col" style="width:60px;">序号</th>
              <th>活动</th>
              <th style="width:90px;">角标</th>
              <th style="width:130px;">价格区间</th>
              <th style="width:120px;">展示位置</th>
              <th style="width:180px;">起止日期</th>
              <th style="width:90px;">状态</th>
              <th style="width:150px;">操作</th>
            </tr>
          </thead>
          <tbody id="promotionBody"></tbody>
        </table>
      </div>
      <div id="emptyHint" class="empty-state" style="display:none;">暂无促销活动</div>
    </div>
  </main>
</div>

<!-- ===== 编辑弹窗 ===== -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="editModalTitle">新增活动</h3>
      <button class="modal-close" onclick="closeEditModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-field">
          <label>活动 ID<span style="color:var(--error);">*</span></label>
          <input type="text" id="editId" placeholder="如 springActivity">
        </div>
        <div class="form-field">
          <label>活动角标</label>
          <input type="text" id="editTag" placeholder="如 限时活动">
        </div>
      </div>
      <div class="form-field" style="margin-bottom:var(--space-lg);">
        <label>活动名称<span style="color:var(--error);">*</span></label>
        <input type="text" id="editTitle" placeholder="如 春季果树认养特惠活动">
      </div>
      <div class="form-field" style="margin-bottom:var(--space-lg);">
        <label>副标题</label>
        <textarea id="editSubTitle" placeholder="如 认养果树享8折优惠，赠送有机肥料套装"></textarea>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>活动价（元）<span style="color:var(--error);">*</span></label>
          <input type="number" id="editPrice" min="0" step="1" placeholder="1510">
        </div>
        <div class="form-field">
          <label>划线原价（元）</label>
          <input type="number" id="editOriginal" min="0" step="1" placeholder="0 表示无原价">
        </div>
      </div>
      <div class="form-field" style="margin-bottom:var(--space-lg);">
        <label>活动图片路径</label>
        <input type="text" id="editImg" placeholder="images/apple_spring_orchard.jpg">
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>开始日期</label>
          <input type="date" id="editStartDate">
        </div>
        <div class="form-field">
          <label>结束日期</label>
          <input type="date" id="editEndDate">
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>展示位置</label>
          <select id="editTarget">
            <option value="order">首页最新活动</option>
            <option value="goods">商品页活动</option>
          </select>
        </div>
        <div class="form-field">
          <label>状态</label>
          <select id="editStatus">
            <option value="on">启用中</option>
            <option value="off">已停用</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeEditModal()">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="submitEdit()">保存</button>
    </div>
  </div>
</div>

<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/common-functions.js"></script>
<script>
/* ============================================================
 * 促销活动管理（商城管理）
 * 数据源：localStorage['mall_promotions']
 *   初始值 = H5 端 index.html 原硬编码的两张活动卡（springActivity / groupBuy）
 *   字段：{ id, title, subTitle, price, original, img, tag, startDate, endDate, status, target }
 *   target 枚举：order 首页最新活动区 / goods 商品页活动位
 * ============================================================ */
var PROMOTION_KEY = 'mall_promotions';

var TARGET_TEXT = { order: '首页最新活动', goods: '商品页活动' };

/* 与 H5 js/mall-promotions.js 的 DEFAULT_PROMOTIONS 保持一致 */
var DEFAULT_PROMOTIONS = [
  { id: 'springActivity', title: '春季果树认养特惠活动', subTitle: '认养果树享8折优惠，赠送有机肥料套装',
    price: 1510, original: 1888, img: 'images/apple_spring_orchard.jpg', tag: '限时活动',
    startDate: '2026-03-01', endDate: '2026-12-31', status: 'on', target: 'order' },
  { id: 'groupBuy', title: '花牛苹果拼团特惠', subTitle: '3人成团，立减20元，优质花牛苹果5斤装',
    price: 48, original: 68, img: 'images/apple_groupbuy_boxes.jpg', tag: '拼团',
    startDate: '2026-03-01', endDate: '2026-12-31', status: 'on', target: 'order' }
];

var editingId = null;

function readAll() {
  try {
    var raw = localStorage.getItem(PROMOTION_KEY);
    if (!raw) return null;
    var v = JSON.parse(raw);
    return Array.isArray(v) && v.length ? v : null;
  } catch (e) {
    return null;
  }
}

/* 首次访问时从 H5 原硬编码活动播种；key 已存在但为空数组视为「后台主动清空」，不再回填默认 */
function readPromotions() {
  var list = readAll();
  if (!list && !keyExists()) {
    list = DEFAULT_PROMOTIONS.map(function (p) { return Object.assign({}, p); });
    writeList(list);
  }
  return list || [];
}

function keyExists() {
  try {
    return localStorage.getItem(PROMOTION_KEY) !== null;
  } catch (e) {
    return false;
  }
}

function writeList(list) {
  try {
    localStorage.setItem(PROMOTION_KEY, JSON.stringify(list));
  } catch (e) {
    Toast.error('本地存储写入失败，活动未能保存');
  }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function todayStr() {
  var d = new Date();
  var p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/* 状态派生：已停用 / 未开始 / 已结束 / 进行中 */
function stateOf(p) {
  if (p.status === 'off') return 'off';
  var t = todayStr();
  if (p.startDate && t < p.startDate) return 'ready';
  if (p.endDate && t > p.endDate) return 'end';
  return 'on';
}

var STATE_TEXT = { on: '进行中', off: '已停用', end: '已结束', ready: '未开始' };

function renderStats() {
  var list = readPromotions();
  var on = 0, end = 0, order = 0;
  list.forEach(function (p) {
    var s = stateOf(p);
    if (s === 'on') on++;
    if (s === 'end' || s === 'ready') end++;
    if ((p.target || 'order') === 'order') order++;
  });
  document.getElementById('statTotal').textContent = list.length;
  document.getElementById('statOn').textContent = on;
  document.getElementById('statEnd').textContent = end;
  document.getElementById('statOrder').textContent = order;
}

function filteredList() {
  var target = document.getElementById('targetSelect').value;
  var status = document.getElementById('statusSelect').value;
  var kw = document.getElementById('searchInput').value.trim().toLowerCase();

  return readPromotions().filter(function (p) {
    if (target && (p.target || 'order') !== target) return false;
    if (status) {
      var s = stateOf(p);
      if (status === 'end') { if (s !== 'end' && s !== 'ready') return false; }
      else if (s !== status) return false;
    }
    if (kw) {
      var hay = ((p.title || '') + ' ' + (p.id || '')).toLowerCase();
      if (hay.indexOf(kw) === -1) return false;
    }
    return true;
  });
}

function renderTable() {
  var list = filteredList();
  renderStats();

  var body = document.getElementById('promotionBody');
  var emptyHint = document.getElementById('emptyHint');

  if (!list.length) {
    body.innerHTML = '';
    emptyHint.style.display = 'block';
    return;
  }
  emptyHint.style.display = 'none';

  body.innerHTML = list.map(function (p, i) {
    var original = Number(p.original) > 0 ? '<span class="price-original">¥' + p.original + '</span>' : '';
    var st = stateOf(p);
    var tag = p.tag ? '<span class="tag-badge">' + esc(p.tag) + '</span>' : '<span class="promo-sub">—</span>';
    var dateText = (p.startDate || '不限') + ' ~ ' + (p.endDate || '不限');
    return '<tr>' +
      '<td class="checkbox-col">' + (i + 1) + '</td>' +
      '<td><div class="promo-cell">' +
          '<img class="promo-img" src="../applefarm_h5/' + esc(p.img) + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
          '<div><div class="promo-name">' + esc(p.title) + '</div>' +
          '<div class="promo-sub">' + esc(p.subTitle || '') + '</div>' +
          '<div class="promo-id">' + esc(p.id) + '</div></div>' +
        '</div></td>' +
      '<td>' + tag + '</td>' +
      '<td class="price-cell">¥' + p.price + original + '</td>' +
      '<td><span class="target-tag ' + esc(p.target || 'order') + '">' + (TARGET_TEXT[p.target || 'order'] || p.target) + '</span></td>' +
      '<td class="text-mono" style="font-size:var(--font-size-xs);">' + esc(dateText) + '</td>' +
      '<td><span class="status-tag ' + st + '">' + (STATE_TEXT[st] || st) + '</span></td>' +
      '<td><div class="action-btns">' +
        '<button class="action-btn detail" onclick="openEdit(\'' + esc(p.id) + '\')">编辑</button>' +
        '<button class="action-btn ' + (p.status === 'on' ? 'delete' : 'download') + '" onclick="toggleStatus(\'' + esc(p.id) + '\')">' +
          (p.status === 'on' ? '停用' : '启用') + '</button>' +
        '<button class="action-btn delete" onclick="removePromotion(\'' + esc(p.id) + '\')">删除</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

function resetFilter() {
  document.getElementById('targetSelect').value = '';
  document.getElementById('statusSelect').value = '';
  document.getElementById('searchInput').value = '';
  renderTable();
}

function openEdit(id) {
  editingId = id || null;
  var p = null;
  if (id) {
    var list = readPromotions();
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) { p = list[i]; break; }
    }
    if (!p) { Toast.error('未找到该活动'); return; }
  }

  document.getElementById('editModalTitle').textContent = p ? '编辑活动' : '新增活动';
  document.getElementById('editId').value = p ? p.id : '';
  document.getElementById('editId').disabled = !!p;
  document.getElementById('editTitle').value = p ? p.title : '';
  document.getElementById('editSubTitle').value = p ? (p.subTitle || '') : '';
  document.getElementById('editTag').value = p ? (p.tag || '') : '';
  document.getElementById('editPrice').value = p ? p.price : '';
  document.getElementById('editOriginal').value = p ? (p.original || 0) : 0;
  document.getElementById('editImg').value = p ? (p.img || '') : '';
  document.getElementById('editStartDate').value = p ? (p.startDate || '') : '';
  document.getElementById('editEndDate').value = p ? (p.endDate || '') : '';
  document.getElementById('editTarget').value = p ? (p.target || 'order') : 'order';
  document.getElementById('editStatus').value = p ? (p.status || 'on') : 'on';

  document.getElementById('editModal').classList.add('show');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  editingId = null;
}

function submitEdit() {
  var pid = document.getElementById('editId').value.trim();
  var title = document.getElementById('editTitle').value.trim();
  var price = document.getElementById('editPrice').value;
  var startDate = document.getElementById('editStartDate').value;
  var endDate = document.getElementById('editEndDate').value;

  if (!pid) { Toast.warning('请填写活动 ID'); return; }
  if (!title) { Toast.warning('请填写活动名称'); return; }
  if (price === '' || isNaN(Number(price)) || Number(price) < 0) { Toast.warning('请填写正确的活动价'); return; }
  if (startDate && endDate && startDate > endDate) { Toast.warning('结束日期不能早于开始日期'); return; }

  var list = readPromotions();
  if (!editingId) {
    for (var j = 0; j < list.length; j++) {
      if (list[j].id === pid) { Toast.warning('活动 ID 已存在'); return; }
    }
  }

  var payload = {
    id: pid,
    title: title,
    subTitle: document.getElementById('editSubTitle').value.trim(),
    price: Number(price),
    original: Number(document.getElementById('editOriginal').value) || 0,
    img: document.getElementById('editImg').value.trim(),
    tag: document.getElementById('editTag').value.trim(),
    startDate: startDate,
    endDate: endDate,
    status: document.getElementById('editStatus').value,
    target: document.getElementById('editTarget').value
  };

  if (editingId) {
    for (var k = 0; k < list.length; k++) {
      if (list[k].id === editingId) { list[k] = payload; break; }
    }
  } else {
    list.push(payload);
  }

  writeList(list);
  closeEditModal();
  renderTable();
  Toast.success(editingId ? '活动已更新' : '活动已新增');
}

function toggleStatus(id) {
  var list = readPromotions();
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id) {
      list[i].status = list[i].status === 'on' ? 'off' : 'on';
      writeList(list);
      renderTable();
      Toast.success(list[i].status === 'on' ? '活动已启用' : '活动已停用');
      return;
    }
  }
}

function removePromotion(id) {
  ConfirmDialog.show({
    title: '删除活动',
    message: '确定删除活动「' + id + '」吗？删除后 H5 端首页将不再展示该活动，此操作不可撤销。',
    onConfirm: function () {
      var list = readPromotions().filter(function (p) { return p.id !== id; });
      writeList(list);
      renderTable();
      Toast.success('活动已删除');
    }
  });
}

function resetToH5Default() {
  ConfirmDialog.show({
    title: '恢复默认',
    message: '将丢弃后台所有改动，恢复为 H5 端内置的 2 个默认活动。是否继续？',
    onConfirm: function () {
      try { localStorage.removeItem(PROMOTION_KEY); } catch (e) { /* 忽略 */ }
      renderTable();
      Toast.success('已恢复 H5 默认活动');
    }
  });
}

document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('searchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') renderTable();
  });
  renderTable();
});
</script>
</body>
</html>
