<style>
  /* 偏差列表 */
  .deviation-list { display:flex; flex-direction:column; }
  .deviation-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #f4f6f4; font-size:13.5px; cursor:pointer; transition:background 0.15s; }
  .deviation-item:last-child { border-bottom:none; }
  .deviation-item:hover { background:#f8fbf9; }
  .deviation-icon { width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  .deviation-content { flex:1; min-width:0; }
  .deviation-title { font-weight:500; color:var(--text-primary); }
  .deviation-desc { font-size:11.5px; color:var(--text-tertiary); margin-top:2px; }
  .deviation-value { padding:3px 10px; border-radius:10px; font-size:11px; font-weight:500; flex-shrink:0; }
  .deviation-value.delay { background:#fff1b8; color:#8c6d10; }
  .deviation-value.advance { background:#f5f0ff; color:#722ed1; }
  .deviation-value.normal { background:#d9f7be; color:#3a8618; }
  /* 紧凑任务项 */
  .task-item { display:flex; align-items:center; gap:12px; padding:12px 14px; background:#fff; border-radius:10px; border:1px solid rgba(0,0,0,0.06); transition:all 0.2s ease; }
  .task-item:hover { border-color:rgba(24,144,255,0.25); box-shadow:0 2px 8px rgba(0,0,0,0.05); }
  .task-icon { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .task-icon.water { background:linear-gradient(135deg,#bae0ff,#91d5ff); color:var(--primary-600); }
  .task-icon.fertilizer { background:linear-gradient(135deg,#d4f4dd,#91d5ff); color:var(--primary-600); }
  .task-icon.pest { background:linear-gradient(135deg,#ffd1d1,#ffccc7); color:#cf1322; }
  .task-content { flex:1; min-width:0; }
  .task-title { font-size:14px; font-weight:600; color:var(--text-primary); margin-bottom:4px; }
  .task-meta { font-size:11.5px; color:var(--text-tertiary); }
  .task-action { padding:7px 16px; background:linear-gradient(135deg,#1890ff,#096dd9); color:#fff; border:none; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; transition:all 0.2s; }
  .task-action:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(24,144,255,0.25); }
  /* 物候期配置 */
  .stage-config-table { width:100%; border-collapse:collapse; font-size:13px; }
  .stage-config-table th { text-align:left; font-weight:600; color:var(--text-secondary); font-size:12px; padding:8px 10px; border-bottom:1px solid var(--border-light); }
  .stage-config-table td { padding:9px 10px; border-bottom:1px dashed #f0f0f0; color:var(--text-primary); }
  .stage-config-table tr:last-child td { border-bottom:none; }
  .stage-swatch { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  .stage-btn { padding:3px 10px; font-size:12px; border:1px solid var(--border-default); border-radius:5px; background:#fff; color:var(--text-secondary); cursor:pointer; transition:all 0.2s; }
  .stage-btn:hover { border-color:var(--primary-500); color:var(--primary-500); }
  .stage-btn + .stage-btn { margin-left:6px; }
  .stage-variety { font-size:11.5px; color:var(--text-tertiary); }
</style>
<style id="standalone-fix">.main-wrapper{margin-left:0!important;width:100%!important;}</style>

<script>
  /* 模型页面通用页签切换 */
  function mpSwitchTab(name) {
    document.querySelectorAll('.mp-tab').forEach(function (t) { t.classList.toggle('active', t.dataset.tab === name); });
    document.querySelectorAll('.mp-panel').forEach(function (p) { p.classList.toggle('active', p.dataset.panel === name); });
    requestAnimationFrame(function () { window.dispatchEvent(new Event('resize')); });
  }
</script>
<script src="js/shared/model-store.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/confirm.js"></script>
<script src="js/components/chart.js"></script>
<script>
// ===== 物候期配置（localStorage: snzg_phenology_stages）=====
// 默认值与品种偏移统一取自 ModelStore，避免与移动端/大屏数据分叉
let PHENOLOGY_MODEL = ModelStore.get('phenology');
let PHENOLOGY_STAGE_DEFAULTS = PHENOLOGY_MODEL.lists.stages.map(s => ({ ...s }));
const PHENOLOGY_STORAGE_KEY = PHENOLOGY_MODEL.meta.storageKey || 'snzg_phenology_stages';

// 品种偏移（保持原有逻辑不变）
const PHENOLOGY_OFFSETS = { ...PHENOLOGY_MODEL.meta.offsets };

let phenologyStages = loadPhenologyStages();
let calendarChart = null;
let editingStageIndex = -1;

function loadPhenologyStages() {
  // 默认物候期以最新 ModelStore 为准（后端预加载异步到达，不能只用首屏快照）
  const defaults = (ModelStore.get('phenology').lists.stages || []);
  try {
    const raw = localStorage.getItem(PHENOLOGY_STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      if (Array.isArray(saved) && saved.length === defaults.length) {
        return saved.map((s, i) => ({ ...defaults[i], ...s }));
      }
    }
  } catch (e) { /* 存储不可用时使用默认值 */ }
  return defaults.map(s => ({ ...s }));
}

function savePhenologyStages() {
  try { localStorage.setItem(PHENOLOGY_STORAGE_KEY, JSON.stringify(phenologyStages)); } catch (e) { /* 忽略存储异常 */ }
  // 同步回统一数据层，保证移动端/大屏读到同一份物候期配置
  try {
    ModelStore.patch('phenology', { lists: Object.assign({}, PHENOLOGY_MODEL.lists, { stages: phenologyStages.map(s => ({ ...s })) }) });
  } catch (e) { /* 数据层不可用时仅保留本地存储 */ }
}

// MM-DD → 月份小数（用于复用原有 ECharts 月份坐标轴）
function mmddToMonthFloat(text, fallback) {
  const m = /^(\d{1,2})-(\d{1,2})$/.exec(String(text || '').trim());
  if (!m) return fallback;
  const month = Math.min(12, Math.max(1, parseInt(m[1], 10)));
  const day = Math.min(31, Math.max(1, parseInt(m[2], 10)));
  return month - 1 + (day - 1) / 30;
}

// 物候期配置表渲染
function renderStageConfig() {
  const tbody = document.getElementById('stageConfigBody');
  if (!tbody) return;
  tbody.innerHTML = phenologyStages.map((s, i) => `
    <tr>
      <td><span class="stage-swatch" style="background:${s.color}"></span>${s.name}</td>
      <td>${s.start}</td>
      <td>${s.end}</td>
      <td class="stage-variety">${s.varieties || '—'}</td>
      <td style="text-align:right;">
        <button class="stage-btn" onclick="editStage(${i})">编辑</button>
        <button class="stage-btn" onclick="resetSingleStage(${i})">重置</button>
      </td>
    </tr>
  `).join('');
}

function editStage(index) {
  const s = phenologyStages[index];
  if (!s) return;
  editingStageIndex = index;
  document.getElementById('stageModalTitle').textContent = '编辑物候期 · ' + s.name;
  document.getElementById('stageEditName').value = s.name;
  document.getElementById('stageEditStart').value = s.start;
  document.getElementById('stageEditEnd').value = s.end;
  const modal = document.getElementById('modal-stage');
  if (modal) modal.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function hideStageModal() {
  const modal = document.getElementById('modal-stage');
  if (modal) modal.classList.remove('show');
  document.body.style.overflow = '';
}

function saveStageEdit() {
  const name = (document.getElementById('stageEditName').value || '').trim();
  const start = (document.getElementById('stageEditStart').value || '').trim();
  const end = (document.getElementById('stageEditEnd').value || '').trim();
  const valid = t => /^(\d{1,2})-(\d{1,2})$/.test(t);
  if (!name) { Toast.show('请输入物候期名称', 'error'); return; }
  if (!valid(start) || !valid(end)) { Toast.show('日期格式应为 MM-DD，例如 03-20', 'error'); return; }
  if (editingStageIndex < 0 || !phenologyStages[editingStageIndex]) { hideStageModal(); return; }
  phenologyStages[editingStageIndex].name = name;
  phenologyStages[editingStageIndex].start = start;
  phenologyStages[editingStageIndex].end = end;
  savePhenologyStages();
  renderStageConfig();
  renderCalendarChart();
  hideStageModal();
  Toast.show('物候期已更新', 'success');
}

// 单行重置为默认值
function resetSingleStage(index) {
  const def = PHENOLOGY_STAGE_DEFAULTS[index];
  if (!def || !phenologyStages[index]) return;
  phenologyStages[index] = { ...def };
  savePhenologyStages();
  renderStageConfig();
  renderCalendarChart();
  Toast.show('已恢复「' + def.name + '」默认日期', 'success');
}

// 恢复默认：清除存储并重绘
function resetPhenologyStages() {
  ConfirmDialog.show({
    title: '恢复默认物候期配置',
    message: '确定要清除自定义配置并恢复默认物候期日期吗？此操作不可撤销。',
    onConfirm: function() {
      try { localStorage.removeItem(PHENOLOGY_STORAGE_KEY); } catch (e) { /* 忽略存储异常 */ }
      phenologyStages = PHENOLOGY_STAGE_DEFAULTS.map(s => ({ ...s }));
      renderStageConfig();
      renderCalendarChart();
      Toast.show('已恢复默认物候期配置', 'success');
    }
  });
}

// 物候期年历渲染（读取当前配置）
function renderCalendarChart() {
  const dom = document.getElementById('chart-calendar');
  if (!dom || typeof Chart === 'undefined' || !Chart.initChart) return;

  const draw = (chart) => {
    calendarChart = chart;

    const varieties = PHENOLOGY_MODEL.meta.varieties;
    const months = PHENOLOGY_MODEL.meta.months;

    const stages = {};
    phenologyStages.forEach(s => {
      stages[s.name] = {
        range: [mmddToMonthFloat(s.start, 0), mmddToMonthFloat(s.end, 12)],
        color: s.color
      };
    });

    const offsets = PHENOLOGY_OFFSETS;

    const series = [];
    Object.keys(stages).forEach((sName) => {
      const s = stages[sName];
      const data = varieties.map(v => {
        const off = offsets[v] || 0;
        return [Math.max(0, s.range[0] + off), Math.min(12, s.range[1] + off)];
      });
      series.push({
        name: sName,
        type: 'bar',
        stack: 'calendar',
        barWidth: 22,
        itemStyle: {
          color: s.color,
          borderRadius: sName === '休眠期' ? [4,4,0,0] : (sName === '采收期' ? [0,0,4,4] : 0)
        },
        emphasis: { focus: 'series' },
        data: data
      });
    });

    series.push({
      name: '今天',
      type: 'line',
      markLine: {
        silent: true,
        symbol: 'none',
        lineStyle: { color: '#ff4d4f', type: 'dashed', width: 2 },
        label: { show: true, position: 'end', formatter: '今天', color: '#ff4d4f', fontSize: 11 },
        data: [{ xAxis: PHENOLOGY_MODEL.meta.todayMarker, yAxis: 0 }, { xAxis: PHENOLOGY_MODEL.meta.todayMarker, yAxis: varieties.length - 1 }]
      },
      data: []
    });

    chart.setOption({
      tooltip: {
        trigger: 'item',
        formatter: function(p) {
          if (!p.data || p.data.length !== 2) return '';
          const v = p.name;
          const m1 = months[Math.floor(p.data[0])];
          const m2 = months[Math.min(11, Math.floor(p.data[1]))];
          return '<b>' + v + '</b><br/>' + p.seriesName + '：' + m1 + ' ~ ' + m2;
        }
      },
      legend: {
        data: phenologyStages.map(s => s.name),
        top: 0,
        itemWidth: 12,
        itemHeight: 12,
        itemGap: 12,
        textStyle: { color: '#595959', fontSize: 12 }
      },
      grid: { left: 110, right: 30, top: 40, bottom: 30, containLabel: true },
      xAxis: {
        type: 'value', min: 0, max: 12, interval: 1,
        axisLabel: { formatter: function(v) { return months[v] || ''; }, color: '#8c8c8c', fontSize: 12 },
        splitLine: { lineStyle: { color: '#f0f0f0' } },
        axisLine: { lineStyle: { color: '#e8e8e8' } },
        axisTick: { show: false }
      },
      yAxis: {
        type: 'category', data: varieties,
        axisLabel: { color: '#595959', fontSize: 13 },
        axisLine: { lineStyle: { color: '#e8e8e8' } },
        axisTick: { show: false }
      },
      series: series
    }, true);
  };

  if (calendarChart) {
    draw(calendarChart);
    return;
  }

  Chart.initChart(dom).then((chart) => {
    if (!chart) {
      dom.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;">图表初始化失败</div>';
      return;
    }
    draw(chart);
  });
}

// 农时偏差列表（数据来自 ModelStore）
function renderDeviationList(M) {
  const list = document.getElementById('deviationList');
  if (!list) return;
  list.innerHTML = M.lists.deviations.map(function (d) {
    return '<div class="deviation-item">' +
      '<div class="deviation-content"><div class="deviation-title">' + d.title + '</div><div class="deviation-desc">' + d.desc + '</div></div>' +
      '<span class="deviation-value ' + d.tone + '">' + d.value + '</span>' +
    '</div>';
  }).join('');
}

// 物候期驱动任务列表（数据来自 ModelStore）
function renderTaskList(M) {
  const list = document.getElementById('taskList');
  if (!list) return;
  list.innerHTML = M.lists.tasks.map(function (t) {
    return '<div class="task-item">' +
      '<div class="task-content">' +
        '<div class="task-title">' + t.title + '</div>' +
        '<div class="task-meta">' + t.desc + '</div>' +
      '</div>' +
      '<button class="task-action" onclick="publishPhenologyTask(\'' + t.title + '\',\'' + t.variety + '\')">' + t.action + '</button>' +
    '</div>';
  }).join('');
}

// 年历「今天」标注文案（日期来自物候期快照，无配置时不显示具体日期）
function renderTodayHint() {
  const el = document.getElementById('todayHint');
  if (!el) return;
  const snap = ModelStore.phenologySnapshot();
  el.textContent = '红虚线=今天' + (snap && snap.today ? ' ' + snap.today : '');
}

document.addEventListener('DOMContentLoaded', function() {
  const M = PHENOLOGY_MODEL;
  ModelStore.hydrateKpi('.patrol-stats', 'phenology');
  renderDeviationList(M);
  renderTaskList(M);
  renderTodayHint();

  renderStageConfig();

  // 物候期编辑弹窗关闭（关闭按钮 / 遮罩 / ESC）
  const stageModal = document.getElementById('modal-stage');
  if (stageModal) {
    stageModal.addEventListener('click', function(e) {
      if (e.target === stageModal || e.target.closest('.modal-close')) hideStageModal();
    });
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && stageModal && stageModal.classList.contains('show')) hideStageModal();
  });

  const dom = document.getElementById('chart-calendar');
  if (!dom || typeof Chart === 'undefined' || !Chart.initChart) {
    if (dom) dom.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;">图表库加载失败</div>';
    return;
  }

  renderCalendarChart();

  // 顶部统计卡点击
  document.querySelectorAll('.patrol-stat-card').forEach((card, i) => {
    card.addEventListener('click', () => {
      const targets = ['enterprise_plot.html', 'enterprise_plot.html?stage=coloring', 'enterprise_plot.html?stage=harvesting', 'model_phenology.html'];
      const f = window.parent.document.querySelector('iframe[name="mainFrame"]');
      if (f) f.src = targets[i];
      else location.href = targets[i];
    });
  });
});

function publishPhenologyTask(taskType, variety) {
  try {
    const prefills = JSON.parse(localStorage.getItem('orchard_farming_prefill') || '[]');
    prefills.push({ title: taskType + '（来自物候模型）', taskType: taskType, plotRange: variety + '相关地块', priority: '高' });
    localStorage.setItem('orchard_farming_prefill', JSON.stringify(prefills));
    Toast.show('已生成' + taskType, 'success');
    setTimeout(() => {
      const f = window.parent.document.querySelector('iframe[name="mainFrame"]');
      if (f) f.src = 'farming_plan.html?from=model_phenology';
      else location.href = 'farming_plan.html?from=model_phenology';
    }, 700);
  } catch (e) { Toast.show('发布失败：' + e.message, 'error'); }
}
</script>

<script>
/* ============================================================
 * 后端数据到达后自动重绘
 * ------------------------------------------------------------
 * 数据层在「后端预加载完成」与「本地写入」两条路径上都会派发
 * modelStoreChange 窗口事件；页面若不监听，首次渲染发生在数据
 * 到达之前，界面会一直停在空列表。此处统一订阅后自动重绘。
 * ============================================================ */
(function () {
  // StoreLive 由 common/js/api.js 提供；部分页面未静态引入该文件，
  // 此时回退到原生窗口事件订阅，避免订阅被静默跳过导致页面不重绘。
  function bind(events, handler) {
    if (typeof StoreLive !== 'undefined') return StoreLive.on(events, handler);
    (Array.isArray(events) ? events : [events]).forEach(function (ev) {
      if (ev) window.addEventListener(ev, function () { try { handler(); } catch (e) { console.warn('[store-live]', e); } });
    });
  }
  bind(["modelStoreChange"], function () {
      PHENOLOGY_MODEL = ModelStore.get('phenology');
      PHENOLOGY_STAGE_DEFAULTS = PHENOLOGY_MODEL.lists.stages.map(s => ({ ...s }));
      phenologyStages = loadPhenologyStages();
      ModelStore.hydrateKpi('.patrol-stats', 'phenology');
      renderDeviationList(PHENOLOGY_MODEL);
      renderTaskList(PHENOLOGY_MODEL);
      renderTodayHint();
      renderStageConfig();
      renderCalendarChart();
  });
})();
</script>
