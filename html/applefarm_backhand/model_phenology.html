<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 物候模型</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
<style>
  /* 偏差列表 */
  .deviation-list { display:flex; flex-direction:column; }
  .deviation-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #f4f6f4; font-size:13.5px; cursor:pointer; transition:background 0.15s; }
  .deviation-item:last-child { border-bottom:none; }
  .deviation-item:hover { background:#f8fbf9; }
  .deviation-icon { width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  .deviation-content { flex:1; min-width:0; }
  .deviation-title { font-weight:500; color:var(--text-primary); }
  .deviation-desc { font-size:11.5px; color:var(--text-tertiary); margin-top:2px; }
  .deviation-value { padding:3px 10px; border-radius:10px; font-size:11px; font-weight:500; flex-shrink:0; }
  .deviation-value.delay { background:#fff1b8; color:#8c6d10; }
  .deviation-value.advance { background:#f5f0ff; color:#722ed1; }
  .deviation-value.normal { background:#d9f7be; color:#3a8618; }
  /* 紧凑任务项 */
  .task-item { display:flex; align-items:center; gap:12px; padding:12px 14px; background:#fff; border-radius:10px; border:1px solid rgba(0,0,0,0.06); transition:all 0.2s ease; }
  .task-item:hover { border-color:rgba(24,144,255,0.25); box-shadow:0 2px 8px rgba(0,0,0,0.05); }
  .task-icon { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .task-icon.water { background:linear-gradient(135deg,#bae0ff,#91d5ff); color:var(--primary-600); }
  .task-icon.fertilizer { background:linear-gradient(135deg,#d4f4dd,#91d5ff); color:var(--primary-600); }
  .task-icon.pest { background:linear-gradient(135deg,#ffd1d1,#ffccc7); color:#cf1322; }
  .task-content { flex:1; min-width:0; }
  .task-title { font-size:14px; font-weight:600; color:var(--text-primary); margin-bottom:4px; }
  .task-meta { font-size:11.5px; color:var(--text-tertiary); }
  .task-action { padding:7px 16px; background:linear-gradient(135deg,#1890ff,#096dd9); color:#fff; border:none; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; transition:all 0.2s; }
  .task-action:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(24,144,255,0.25); }
</style>
<style id="standalone-fix">.main-wrapper{margin-left:0!important;width:100%!important;}</style>
</head>
<body data-active-menu="model" data-active-submenu="model-phenology">
<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3L11 11M11 3L3 11"/></svg>
        </button>
      </div>
    </div>

    <main class="main-content">
<div class="page-container">
  <!-- 顶部 4 指标 -->
  <div class="patrol-stats">
    <div class="patrol-stat-card green"><div class="stat-value" style="font-size:20px;">膨大期</div><div class="stat-label">花牛苹果·晚熟</div><div class="stat-trend" style="font-size:12px;color:var(--text-tertiary);">98块地块</div></div>
    <div class="patrol-stat-card purple"><div class="stat-value" style="font-size:20px;">着色期</div><div class="stat-label">花牛苹果·早熟</div><div class="stat-trend" style="font-size:12px;color:var(--text-tertiary);">8块地块</div></div>
    <div class="patrol-stat-card orange"><div class="stat-value" style="font-size:20px;">采收期</div><div class="stat-label">金帅·中熟</div><div class="stat-trend" style="font-size:12px;color:var(--text-tertiary);">4块地块</div></div>
    <div class="patrol-stat-card blue"><div class="stat-value">3</div><div class="stat-label">品种跟踪</div><div class="stat-trend" style="font-size:12px;color:var(--success);">本周全预测</div></div>
  </div>

  <!-- 物候期年历视图（整行） -->
  <div class="chart-section" style="margin-bottom:20px;">
    <h2 class="section-title">物候期年历视图 <span style="font-size:12px;color:var(--text-tertiary);font-weight:400;">红虚线=今天 09-24</span></h2>
    <div id="chart-calendar" class="chart-container" style="height:340px;"></div>
  </div>

  <!-- 农时偏差 + 驱动任务（2 列） -->
  <div style="display:grid; grid-template-columns:1fr 2fr; gap:16px;">
    <div class="chart-section">
      <h2 class="section-title">农时偏差</h2>
      <div class="deviation-list">
        <div class="deviation-item">
          <div class="deviation-content"><div class="deviation-title">早熟·盛花期</div><div class="deviation-desc">推迟5天，关注授粉</div></div>
          <span class="deviation-value delay">推迟5天</span>
        </div>
        <div class="deviation-item">
          <div class="deviation-content"><div class="deviation-title">晚熟·幼果期</div><div class="deviation-desc">推迟3天，加强营养</div></div>
          <span class="deviation-value delay">推迟3天</span>
        </div>
        <div class="deviation-item">
          <div class="deviation-content"><div class="deviation-title">早熟·着色期</div><div class="deviation-desc">提前2天，控水促色</div></div>
          <span class="deviation-value advance">提前2天</span>
        </div>
        <div class="deviation-item">
          <div class="deviation-content"><div class="deviation-title">金帅·采收期</div><div class="deviation-desc">常年持平</div></div>
          <span class="deviation-value normal">正常</span>
        </div>
      </div>
    </div>

    <div class="chart-section">
      <h2 class="section-title">物候期驱动任务</h2>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div class="task-item">
          <div class="task-content">
            <div class="task-title">膨大期灌溉任务</div>
            <div class="task-meta">花牛苹果膨大期关键阶段，建议增加灌溉频率</div>
          </div>
          <button class="task-action" onclick="publishPhenologyTask('膨大期灌溉任务','花牛苹果')">发布</button>
        </div>
        <div class="task-item">
          <div class="task-content">
            <div class="task-title">膨大期追肥任务</div>
            <div class="task-meta">追施高钾复合肥 0.5-1kg/株</div>
          </div>
          <button class="task-action" onclick="publishPhenologyTask('膨大期追肥任务','花牛苹果')">发布</button>
        </div>
        <div class="task-item">
          <div class="task-content">
            <div class="task-title">着色期病虫害防治</div>
            <div class="task-meta">注意防治炭疽病和轮纹病</div>
          </div>
          <button class="task-action" onclick="publishPhenologyTask('着色期病虫害防治','花牛苹果')">发布</button>
        </div>
      </div>
    </div>
  </div>
</div>
    </main>
  </div>
</div>

<script src="js/components/modal.js"></script>
<script src="js/components/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const dom = document.getElementById('chart-calendar');
  if (!dom || typeof Chart === 'undefined' || !Chart.initChart) {
    if (dom) dom.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;">图表库加载失败</div>';
    return;
  }

  Chart.initChart(dom).then((chart) => {
    if (!chart) {
      dom.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;">图表初始化失败</div>';
      return;
    }

    const varieties = ['花牛苹果（早熟）', '花牛苹果（晚熟）', '金帅'];
    const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

    const stages = {
      '休眠期': { range:[0, 1.5], color:'#d5dbd5' },
      '萌芽期': { range:[1.5, 2.5], color:'#b7eb8f' },
      '花期':   { range:[2.5, 3.5], color:'#ffadd2' },
      '幼果期': { range:[3.5, 4.5], color:'#ffd591' },
      '膨大期': { range:[4.5, 8.5], color:'#91d5ff' },
      '着色期': { range:[8.5, 10.0], color:'#d3adf7' },
      '采收期': { range:[10.0, 12.0], color:'#ffa39e' }
    };

    const offsets = { '花牛苹果（早熟）': -0.3, '花牛苹果（晚熟）': 0, '金帅': 0.2 };

    const series = [];
    Object.keys(stages).forEach((sName) => {
      const s = stages[sName];
      const data = varieties.map(v => {
        const off = offsets[v] || 0;
        return [Math.max(0, s.range[0] + off), Math.min(12, s.range[1] + off)];
      });
      series.push({
        name: sName,
        type: 'bar',
        stack: 'calendar',
        barWidth: 22,
        itemStyle: {
          color: s.color,
          borderRadius: sName === '休眠期' ? [4,4,0,0] : (sName === '采收期' ? [0,0,4,4] : 0)
        },
        emphasis: { focus: 'series' },
        data: data
      });
    });

    series.push({
      name: '今天',
      type: 'line',
      markLine: {
        silent: true,
        symbol: 'none',
        lineStyle: { color: '#ff4d4f', type: 'dashed', width: 2 },
        label: { show: true, position: 'end', formatter: '今天', color: '#ff4d4f', fontSize: 11 },
        data: [{ xAxis: 8.6, yAxis: 0 }, { xAxis: 8.6, yAxis: varieties.length - 1 }]
      },
      data: []
    });

    chart.setOption({
      tooltip: {
        trigger: 'item',
        formatter: function(p) {
          if (!p.data || p.data.length !== 2) return '';
          const v = p.name;
          const m1 = months[Math.floor(p.data[0])];
          const m2 = months[Math.min(11, Math.floor(p.data[1]))];
          return '<b>' + v + '</b><br/>' + p.seriesName + '：' + m1 + ' ~ ' + m2;
        }
      },
      legend: {
        data: Object.keys(stages),
        top: 0,
        itemWidth: 12,
        itemHeight: 12,
        itemGap: 12,
        textStyle: { color: '#595959', fontSize: 12 }
      },
      grid: { left: 110, right: 30, top: 40, bottom: 30, containLabel: true },
      xAxis: {
        type: 'value', min: 0, max: 12, interval: 1,
        axisLabel: { formatter: function(v) { return months[v] || ''; }, color: '#8c8c8c', fontSize: 12 },
        splitLine: { lineStyle: { color: '#f0f0f0' } },
        axisLine: { lineStyle: { color: '#e8e8e8' } },
        axisTick: { show: false }
      },
      yAxis: {
        type: 'category', data: varieties,
        axisLabel: { color: '#595959', fontSize: 13 },
        axisLine: { lineStyle: { color: '#e8e8e8' } },
        axisTick: { show: false }
      },
      series: series
    }, true);
  });

  // 顶部统计卡点击
  document.querySelectorAll('.patrol-stat-card').forEach((card, i) => {
    card.addEventListener('click', () => {
      const targets = ['enterprise_plot.html', 'enterprise_plot.html?stage=coloring', 'enterprise_plot.html?stage=harvesting', 'model_phenology.html'];
      const f = window.parent.document.querySelector('iframe[name="mainFrame"]');
      if (f) f.src = targets[i];
      else location.href = targets[i];
    });
  });
});

function publishPhenologyTask(taskType, variety) {
  try {
    const prefills = JSON.parse(localStorage.getItem('orchard_farming_prefill') || '[]');
    prefills.push({ title: taskType + '（来自物候模型）', taskType: taskType, plotRange: variety + '相关地块', priority: '高' });
    localStorage.setItem('orchard_farming_prefill', JSON.stringify(prefills));
    Toast.show('已生成' + taskType, 'success');
    setTimeout(() => {
      const f = window.parent.document.querySelector('iframe[name="mainFrame"]');
      if (f) f.src = 'farming_plan.html?from=model_phenology';
      else location.href = 'farming_plan.html?from=model_phenology';
    }, 700);
  } catch (e) { Toast.show('发布失败：' + e.message, 'error'); }
}
</script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/typography.js"></script>
</body>
</html>
