<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 销售订单</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
<link rel="stylesheet" href="css/sales-module.css">
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
</head>
<body data-active-menu="sales" data-active-submenu="sales-order">
<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <div class="content-wrapper">
        <div class="page-header">
          <h1 class="page-title">销售订单</h1>
        </div>

        <div class="sales-stats" id="orderStats"></div>

        <div class="page-section search-section">
          <div class="search-bar filter-bar">
            <input type="text" class="search-input" id="fKeyword" placeholder="搜索订单号 / 客户 / 商品">
            <select class="search-select" id="fStatus">
              <option value="all">全部状态</option>
              <option value="confirm">待确认</option>
              <option value="pending">待付款</option>
              <option value="paid">待发货</option>
              <option value="shipped">已发货</option>
              <option value="completed">已完成</option>
              <option value="refunding">退款中</option>
              <option value="refunded">已退款</option>
              <option value="returning">退货中</option>
              <option value="returned">已退货</option>
              <option value="cancelled">已取消</option>
            </select>
            <select class="search-select" id="fChannel">
              <option value="all">全部渠道</option>
              <option value="wholesale">批发渠道</option>
              <option value="retail">零售渠道</option>
              <option value="adoption">认养渠道</option>
              <option value="tour">观光采摘</option>
            </select>
            <select class="search-select" id="fOwner">
              <option value="all">全部业务员</option>
            </select>
            <span class="filter-label">下单日期</span>
            <input type="date" class="search-input" id="fStart" style="min-width:140px;max-width:160px;">
            <span class="filter-label">至</span>
            <input type="date" class="search-input" id="fEnd" style="min-width:140px;max-width:160px;">
            <div class="search-actions">
              <button class="jg-btn jg-btn-primary" onclick="applyFilter()">查询</button>
              <button class="jg-btn" onclick="resetFilter()">重置</button>
            </div>
          </div>
        </div>

        <div class="page-section action-bar">
          <div class="action-left">
            <button class="jg-btn jg-btn-primary" onclick="openAddOrder()">+ 新建订单</button>
            <button class="jg-btn" onclick="openBatchShip()">批量发货</button>
            <button class="jg-btn" onclick="exportOrders()">导出 CSV</button>
          </div>
          <div class="action-right" style="margin-left:auto;">
            <span class="selected-info" id="selectedInfo">未选择订单</span>
          </div>
        </div>

        <div class="page-section data-section">
          <div class="data-table-wrapper">
            <table class="data-table" style="min-width:2050px;">
              <thead>
                <tr>
                  <th style="width:44px;"><input type="checkbox" id="checkAll" onchange="toggleAll(this.checked)"></th>
                  <th style="width:52px;">序号</th>
                  <th style="width:180px;">订单编号</th>
                  <th style="width:96px;">来源</th>
                  <th style="width:92px;">订单类型</th>
                  <th style="width:150px;">客户</th>
                  <th style="width:250px;">商品明细</th>
                  <th style="width:90px;">数量</th>
                  <th style="width:110px;" class="text-right">订单金额</th>
                  <th style="width:120px;" class="text-right">已收 / 待收</th>
                  <th style="width:100px;">订单状态</th>
                  <th style="width:90px;">付款状态</th>
                  <th style="width:190px;">物流</th>
                  <th style="width:130px;">下单时间</th>
                  <th style="width:240px;">操作</th>
                </tr>
              </thead>
              <tbody id="orderTableBody"></tbody>
            </table>
          </div>
          <div id="pagination-container" style="display:flex;justify-content:flex-end;margin-top:14px;"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ================= 订单详情 ================= -->
<div class="modal-overlay" id="detailModal" style="display:none;">
  <div class="modal modal-xl">
    <div class="modal-header">
      <h3 class="modal-title">订单详情</h3>
      <button class="modal-close" onclick="closeModal('detailModal')">×</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer" id="detailFooter"></div>
  </div>
</div>

<!-- ================= 新建 / 编辑订单 ================= -->
<div class="modal-overlay" id="editModal" style="display:none;">
  <div class="modal modal-xl">
    <div class="modal-header">
      <h3 class="modal-title" id="editTitle">新建销售订单</h3>
      <button class="modal-close" onclick="closeModal('editModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="detail-section">
        <div class="detail-section-title">客户与订单信息</div>
        <div class="form-grid-3">
          <div class="form-group">
            <label><span class="required"></span>客户</label>
            <select id="eCustomer" onchange="onCustomerChange()"></select>
          </div>
          <div class="form-group">
            <label><span class="required"></span>订单渠道</label>
            <select id="eChannel">
              <option value="wholesale">批发订单</option>
              <option value="retail">零售订单</option>
              <option value="adoption">认养订单</option>
              <option value="tour">观光采摘</option>
            </select>
          </div>
          <div class="form-group">
            <label>业务员</label>
            <input type="text" id="eOwner" placeholder="归属业务员">
          </div>
          <div class="form-group">
            <label>期望交付日期</label>
            <input type="date" id="eExpected">
          </div>
          <div class="form-group">
            <label>关联批次号</label>
            <input type="text" id="eBatch" list="batchOptions" placeholder="选择或输入采收批次">
            <datalist id="batchOptions"></datalist>
          </div>
          <div class="form-group">
            <label>追溯码</label>
            <input type="text" id="eTrace" placeholder="可选，发货前回写">
          </div>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">商品明细</div>
        <div class="items-editor">
          <div class="items-editor-head">
            <span>商品</span><span>数量</span><span>单价（元）</span><span>单位</span><span style="text-align:right;">金额</span><span></span>
          </div>
          <div id="itemRows"></div>
        </div>
        <div style="margin-top:10px;">
          <button class="jg-btn" onclick="addItemRow()">+ 添加商品行</button>
        </div>
        <div class="calc-summary">
          <span>商品金额：<strong id="sumGoods">¥0.00</strong></span>
          <span>优惠：<input type="number" id="eDiscount" min="0" step="0.01" value="0" style="width:90px;padding:4px 6px;border:1px solid #d9e2d9;border-radius:6px;" oninput="calcItems()"></span>
          <span>运费：<input type="number" id="eFreight" min="0" step="0.01" value="0" style="width:90px;padding:4px 6px;border:1px solid #d9e2d9;border-radius:6px;" oninput="calcItems()"></span>
          <span>应收：<strong id="sumPayable" class="text-danger">¥0.00</strong></span>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">收货信息</div>
        <div class="form-grid-3">
          <div class="form-group">
            <label>收货人</label>
            <input type="text" id="eReceiver">
          </div>
          <div class="form-group">
            <label>联系电话</label>
            <input type="text" id="ePhone">
          </div>
          <div class="form-group">
            <label>发票状态</label>
            <select id="eInvoice">
              <option value="none">未开票</option>
              <option value="pending">待开票</option>
              <option value="issued">已开票</option>
            </select>
          </div>
          <div class="form-group full">
            <label>收货地址</label>
            <input type="text" id="eAddress">
          </div>
          <div class="form-group full">
            <label>订单备注</label>
            <textarea id="eRemark" placeholder="交付要求、包装要求等"></textarea>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('editModal')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="submitOrder()">保存订单</button>
    </div>
  </div>
</div>

<!-- ================= 登记收款 ================= -->
<div class="modal-overlay" id="payModal" style="display:none;">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header">
      <h3 class="modal-title">登记收款</h3>
      <button class="modal-close" onclick="closeModal('payModal')">×</button>
    </div>
    <div class="modal-body">
      <div id="paySummary" class="detail-grid" style="margin-bottom:16px;"></div>
      <div class="form-grid">
        <div class="form-group">
          <label><span class="required"></span>收款金额（元）</label>
          <input type="number" id="pAmount" min="0.01" step="0.01">
        </div>
        <div class="form-group">
          <label><span class="required"></span>收款方式</label>
          <select id="pMethod">
            <option value="bank">银行转账</option>
            <option value="wechat">微信支付</option>
            <option value="alipay">支付宝</option>
            <option value="cash">现金</option>
            <option value="offline">线下结算</option>
          </select>
        </div>
        <div class="form-group">
          <label>收款时间</label>
          <input type="datetime-local" id="pTime">
        </div>
        <div class="form-group">
          <label>凭证号</label>
          <input type="text" id="pVoucher" placeholder="银行流水号 / 收据号">
        </div>
        <div class="form-group full">
          <label>备注</label>
          <input type="text" id="pRemark" placeholder="首期款、尾款等">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('payModal')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="submitPay()">确认收款</button>
    </div>
  </div>
</div>

<!-- ================= 订单发货 ================= -->
<div class="modal-overlay" id="shipModal" style="display:none;">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header">
      <h3 class="modal-title">订单发货</h3>
      <button class="modal-close" onclick="closeModal('shipModal')">×</button>
    </div>
    <div class="modal-body">
      <div id="shipSummary" class="detail-grid" style="margin-bottom:16px;"></div>
      <div class="form-grid">
        <div class="form-group">
          <label><span class="required"></span>快递公司</label>
          <select id="sCompany"></select>
        </div>
        <div class="form-group">
          <label><span class="required"></span>运单号</label>
          <input type="text" id="sTracking" placeholder="请输入运单号">
        </div>
        <div class="form-group full">
          <label>发货备注</label>
          <input type="text" id="sRemark">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('shipModal')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="submitShip()">确认发货</button>
    </div>
  </div>
</div>

<!-- ================= 批量发货 ================= -->
<div class="modal-overlay" id="batchShipModal" style="display:none;">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 class="modal-title">批量发货</h3>
      <button class="modal-close" onclick="closeModal('batchShipModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid" style="margin-bottom:12px;">
        <div class="form-group">
          <label><span class="required"></span>统一快递公司</label>
          <select id="bCompany"></select>
        </div>
        <div class="form-group">
          <label>发货时间</label>
          <input type="datetime-local" id="bTime">
        </div>
      </div>
      <table class="detail-table">
        <thead>
          <tr><th>订单编号</th><th>客户</th><th>商品摘要</th><th class="num">应收</th><th style="width:230px;">运单号</th></tr>
        </thead>
        <tbody id="batchShipBody"></tbody>
      </table>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('batchShipModal')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="submitBatchShip()">确认批量发货</button>
    </div>
  </div>
</div>

<!-- ================= 取消订单 ================= -->
<div class="modal-overlay" id="cancelModal" style="display:none;">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header">
      <h3 class="modal-title">取消订单</h3>
      <button class="modal-close" onclick="closeModal('cancelModal')">×</button>
    </div>
    <div class="modal-body">
      <p class="muted" id="cancelSummary" style="margin-top:0;"></p>
      <div class="form-group">
        <label><span class="required"></span>取消原因</label>
        <textarea id="cancelReason" placeholder="请填写取消原因"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('cancelModal')">返回</button>
      <button class="jg-btn jg-btn-danger" onclick="submitCancel()">确认取消</button>
    </div>
  </div>
</div>

<!-- ================= 发起售后 ================= -->
<div class="modal-overlay" id="afterSaleModal" style="display:none;">
  <div class="modal" style="max-width:600px;">
    <div class="modal-header">
      <h3 class="modal-title">发起售后</h3>
      <button class="modal-close" onclick="closeModal('afterSaleModal')">×</button>
    </div>
    <div class="modal-body">
      <div id="asSummary" class="detail-grid" style="margin-bottom:16px;"></div>
      <div class="form-grid">
        <div class="form-group">
          <label><span class="required"></span>售后类型</label>
          <select id="asType" onchange="onAfterSaleTypeChange()">
            <option value="refund">仅退款</option>
            <option value="return">退货退款</option>
            <option value="exchange">换货</option>
          </select>
        </div>
        <div class="form-group">
          <label>申请金额（元）</label>
          <input type="number" id="asAmount" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label>数量</label>
          <input type="number" id="asQty" min="0" step="1" value="0">
        </div>
        <div class="form-group" id="asRestockWrap" style="display:none;">
          <label>退回库存</label>
          <select id="asRestock">
            <option value="1">退回原批次库存</option>
            <option value="0">不回库（报损）</option>
          </select>
        </div>
        <div class="form-group full">
          <label><span class="required"></span>售后原因</label>
          <textarea id="asReason" placeholder="请描述问题与客户诉求"></textarea>
        </div>
        <div class="form-group full">
          <label>备注</label>
          <input type="text" id="asRemark">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('afterSaleModal')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="submitAfterSale()">提交售后</button>
    </div>
  </div>
</div>

<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/common-functions.js"></script>
<script src="js/search-helper.js"></script>
<script src="js/typography.js"></script>
<script src="js/shared/sales-store.js"></script>
<script>
var PAGE_SIZE = 10;
var selected = {};
var filtered = [];
var editingId = null;
var payOrderId = null;
var shipOrderId = null;
var cancelOrderId = null;
var afterSaleOrderId = null;
var detailOrderId = null;

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function val(id) {
  var el = document.getElementById(id);
  return el ? el.value : '';
}
function toast(msg, type) {
  if (window.LegacyToast) LegacyToast.show(msg, type || 'success');
  else alert(msg);
}
function todayMinus(days) {
  var d = new Date();
  d.setDate(d.getDate() - days);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function nowLocal() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') +
    'T' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

/* ---------------- 筛选 ---------------- */
function getFilters() {
  return {
    keyword: val('fKeyword').trim(),
    status: val('fStatus') || 'all',
    channel: val('fChannel') || 'all',
    owner: val('fOwner') || 'all',
    startDate: val('fStart'),
    endDate: val('fEnd'),
    year: 2026
  };
}

function filterOrders() {
  var f = getFilters();
  var kw = f.keyword.toLowerCase();
  return SalesStore.orders().filter(function (o) {
    if (f.status !== 'all' && o.status !== f.status) return false;
    if (f.channel !== 'all' && o.channel !== f.channel) return false;
    if (f.owner !== 'all' && o.owner !== f.owner) return false;
    var d = (o.createdAt || '').slice(0, 10);
    if (f.startDate && d < f.startDate) return false;
    if (f.endDate && d > f.endDate) return false;
    if (kw) {
      var hay = (o.no + ' ' + o.customerName + ' ' + o.receiver + ' ' +
        o.items.map(function (it) { return it.name + ' ' + it.spec; }).join(' ')).toLowerCase();
      if (hay.indexOf(kw) === -1) return false;
    }
    return true;
  });
}

function applyFilter() {
  selected = {};
  refreshAll();
}

function resetFilter() {
  ['fKeyword'].forEach(function (id) { document.getElementById(id).value = ''; });
  ['fStatus', 'fChannel', 'fOwner'].forEach(function (id) { document.getElementById(id).value = 'all'; });
  document.getElementById('fStart').value = '';
  document.getElementById('fEnd').value = '';
  selected = {};
  refreshAll();
}

/* ---------------- 统计卡 ---------------- */
function renderStats() {
  var f = getFilters();
  var s = SalesStore.summary(f);
  var payAll = SalesStore.payments();
  var now = new Date();
  var monthPaid = 0;
  payAll.forEach(function (p) {
    var d = new Date((p.paidAt || '').replace(' ', 'T'));
    if (isNaN(d.getTime())) return;
    if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) monthPaid += Number(p.amount) || 0;
  });
  var ach = Math.round(s.achievement * 1000) / 10;
  var cards = [
    { label: '筛选范围销售额', value: SalesStore.fmtWan(s.amount), sub: '订单 ' + s.count + ' 笔 · 净销售 ' + SalesStore.fmtWan(s.net), cls: '' },
    { label: '本月回款', value: SalesStore.fmtWan(monthPaid), sub: '含线上支付与线下收款', cls: 'is-success' },
    { label: '待付款订单', value: String(s.pendingPay), sub: '含待确认订单', cls: 'is-warning' },
    { label: '待发货订单', value: String(s.pendingShip), sub: '已收款待出库', cls: 'is-primary' },
    { label: '在途 / 待收货', value: String(s.shipping), sub: '已发货未签收', cls: '' },
    { label: '目标达成率', value: ach + '%', sub: '目标 ' + SalesStore.fmtWan(s.targetAmount), cls: ach < 60 ? 'is-danger' : 'is-success' }
  ];
  document.getElementById('orderStats').innerHTML = cards.map(function (c) {
    return '<div class="sales-stat-card ' + c.cls + '">' +
      '<div class="stat-label">' + c.label + '</div>' +
      '<div class="stat-value">' + c.value + '</div>' +
      '<div class="stat-sub">' + c.sub + '</div>' +
      '</div>';
  }).join('');
}

/* ---------------- 表格 ---------------- */
function statusTag(o) {
  var cls = { confirm: 'confirm', pending: 'pending', paid: 'paid', shipped: 'shipped', completed: 'completed', cancelled: 'cancelled', refunding: 'refunding', refunded: 'refunded', returning: 'returning', returned: 'returned', closed: 'closed' }[o.status] || 'pending';
  return '<span class="status-tag st-' + cls + '">' + (SalesStore.ORDER_STATUS_TEXT[o.status] || o.status) + '</span>';
}

function payTag(o) {
  var cls = o.payStatus === 'paid' ? 'completed' : (o.payStatus === 'partial' ? 'pending' : (o.payStatus === 'refunded' ? 'refunded' : 'unpaid'));
  return '<span class="status-tag st-' + cls + '">' + (SalesStore.PAY_STATUS_TEXT[o.payStatus] || o.payStatus) + '</span>';
}

function itemsText(o) {
  return o.items.map(function (it) {
    return esc(it.name) + ' ×' + it.qty + esc(it.unit);
  }).join('；');
}

function totalQty(o) {
  var qty = 0;
  var units = {};
  o.items.forEach(function (it) { qty += Number(it.qty) || 0; units[it.unit] = true; });
  return qty + (Object.keys(units).length === 1 ? Object.keys(units)[0] : '');
}

function eligibleForShip(o) {
  return o.status === 'paid' && !o.isMirror;
}

function renderRow(o, index) {
  var balance = Number(o.payableAmount) - Number(o.paidAmount);
  var ship = o.shipCompany
    ? esc(o.shipCompany) + '<br><span class="muted">' + esc(o.shipNo) + '</span>'
    : (o.status === 'paid' ? '<span class="text-warning">待发货</span>' : '<span class="muted">—</span>');
  var acts = [];
  acts.push('<button class="action-btn view" onclick="viewOrder(\'' + o.id + '\')">查看</button>');
  if ((o.status === 'confirm' || o.status === 'pending') && balance > 0.01) {
    acts.push('<button class="action-btn edit" onclick="openPay(\'' + o.id + '\')">收款</button>');
  }
  if (o.status === 'confirm') {
    acts.push('<button class="action-btn edit" onclick="doConfirm(\'' + o.id + '\')">确认</button>');
  }
  if (eligibleForShip(o)) {
    acts.push('<button class="action-btn edit" onclick="openShip(\'' + o.id + '\')">发货</button>');
  }
  if (o.status === 'shipped' && !o.isMirror) {
    acts.push('<button class="action-btn view" onclick="doReceive(\'' + o.id + '\')">签收</button>');
  }
  if (o.paidAmount > 0 && ['paid', 'shipped', 'completed'].indexOf(o.status) >= 0) {
    acts.push('<button class="action-btn" onclick="openAfterSale(\'' + o.id + '\')">售后</button>');
  }
  if (o.status === 'confirm' || o.status === 'pending') {
    acts.push('<button class="action-btn" onclick="openEditOrder(\'' + o.id + '\')">编辑</button>');
    acts.push('<button class="action-btn delete" onclick="openCancel(\'' + o.id + '\')">取消</button>');
  }
  var check = eligibleForShip(o)
    ? '<input type="checkbox" class="row-check" data-id="' + o.id + '" ' + (selected[o.id] ? 'checked' : '') + ' onchange="toggleSelect(\'' + o.id + '\',this.checked)">'
    : '<span class="muted">—</span>';

  return '<tr>' +
    '<td>' + check + '</td>' +
    '<td>' + (index + 1) + '</td>' +
    '<td><strong>' + esc(o.no) + '</strong>' + (o.isMirror ? ' <span class="source-chip h5">只读</span>' : '') + '</td>' +
    '<td><span class="source-chip ' + (o.source === 'h5' ? 'h5' : '') + '">' + (o.source === 'h5' ? 'H5 商城' : (SalesStore.SOURCE_TEXT[o.source] || '手工录入')) + '</span></td>' +
    '<td>' + (SalesStore.TYPE_TEXT[o.type] || o.type) + '</td>' +
    '<td><div>' + esc(o.customerName) + '</div><div class="muted">' + esc(o.contact || '') + ' ' + esc(o.phone || '') + '</div></td>' +
    '<td><span class="order-items-cell" title="' + esc(itemsText(o)) + '">' + itemsText(o) + '</span></td>' +
    '<td class="num">' + totalQty(o) + '</td>' +
    '<td class="num money">' + SalesStore.fmtMoney(o.payableAmount) + '</td>' +
    '<td class="num"><span class="text-success">' + SalesStore.fmtMoney(o.paidAmount) + '</span><br><span class="muted">待收 ' + SalesStore.fmtMoney(balance) + '</span></td>' +
    '<td>' + statusTag(o) + '</td>' +
    '<td>' + payTag(o) + '</td>' +
    '<td>' + ship + '</td>' +
    '<td class="muted">' + SalesStore.fmtTime(o.createdAt) + '</td>' +
    '<td><div class="action-btns">' + acts.join('') + '</div></td>' +
    '</tr>';
}

function refreshTable() {
  filtered = filterOrders();
  Pagination.init({
    data: filtered,
    pageSize: PAGE_SIZE,
    containerId: 'pagination-container',
    tbodyId: 'orderTableBody',
    renderRow: renderRow
  });
  updateSelectedInfo();
  var all = document.getElementById('checkAll');
  if (all) all.checked = false;
}

function refreshAll() {
  renderStats();
  refreshTable();
  populateOwnerOptions();
}

/* ---------------- 选择 ---------------- */
function toggleSelect(id, checked) {
  if (checked) selected[id] = true; else delete selected[id];
  updateSelectedInfo();
}
function toggleAll(checked) {
  filtered.forEach(function (o) {
    if (eligibleForShip(o)) {
      if (checked) selected[o.id] = true; else delete selected[o.id];
    }
  });
  refreshTable();
}
function updateSelectedInfo() {
  var ids = Object.keys(selected);
  var amount = 0;
  ids.forEach(function (id) {
    var o = SalesStore.order(id);
    if (o) amount += Number(o.payableAmount) || 0;
  });
  document.getElementById('selectedInfo').textContent = ids.length
    ? '已选 ' + ids.length + ' 笔 · 合计 ' + SalesStore.fmtMoney(amount)
    : '未选择订单';
}

/* ---------------- 订单详情 ---------------- */
function viewOrder(id) {
  var o = SalesStore.order(id);

  var balance = Number(o.payableAmount) - Number(o.paidAmount);

  if (o.status === 'shipped' && !o.isMirror) acts.push('<button class="jg-btn" onclick="doReceive(\'' + o.id + '\')">确认签收</button>');
  if (o.paidAmount > 0 && ['paid', 'shipped', 'completed'].indexOf(o.status) >= 0) acts.push('<button class="jg-btn" onclick="openAfterSale(\'' + o.id + '\')">发起售后</button>');

function detailItem(label, value) {
  return '<div class="detail-item"><span class="detail-label">' + label + '</span><span class="detail-value">' + esc(value == null ? '—' : value) + '</span></div>';
}

/* ---------------- 新建 / 编辑 ---------------- */
function populateCustomerOptions() {
  var list = SalesStore.customers().sort(function (a, b) { return a.code > b.code ? 1 : -1; });
  var html = '<option value="">请选择客户</option>' + list.map(function (c) {
    return '<option value="' + esc(c.id) + '">' + esc(c.code + ' · ' + c.name) + (c.status === 'inactive' ? '（已停用）' : '') + '</option>';
  }).join('');
  document.getElementById('eCustomer').innerHTML = html;
}

function populateOwnerOptions() {
  var set = {};
  SalesStore.customers().forEach(function (c) { if (c.owner) set[c.owner] = true; });
  SalesStore.orders().forEach(function (o) { if (o.owner) set[o.owner] = true; });
  var owners = Object.keys(set);
  var sel = document.getElementById('fOwner');
  var cur = sel.value;
  sel.innerHTML = '<option value="all">全部业务员</option>' + owners.map(function (o) {
    return '<option value="' + esc(o) + '">' + esc(o) + '</option>';
  }).join('');
  if (cur && owners.indexOf(cur) >= 0) sel.value = cur;
}

function productOptionsHtml(selectedSku) {
  var groups = [
    { key: 'wholesale', label: '批发商品' },
    { key: 'retail', label: '零售商品' },
    { key: 'adoption', label: '认养商品' },
    { key: 'tour', label: '观光采摘' }
  ];
  return '<option value="">选择商品</option>' + groups.map(function (g) {
    return '<optgroup label="' + g.label + '">' + SalesStore.PRODUCTS[g.key].map(function (p) {
      return '<option value="' + esc(p.sku) + '" data-name="' + esc(p.name) + '" data-spec="' + esc(p.spec) + '" data-unit="' + esc(p.unit) + '" data-price="' + p.price + '"' + (p.sku === selectedSku ? ' selected' : '') + '>' + esc(p.name + ' · ' + p.spec) + '</option>';
    }).join('') + '</optgroup>';
  }).join('');
}

function addItemRow(item) {
  item = item || {};
  var row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = '<select class="item-product" onchange="onProductChange(this)">' + productOptionsHtml(item.sku) + '</select>' +
    '<input type="number" class="item-qty" min="1" step="1" value="' + (item.qty || 1) + '" oninput="calcItems()">' +
    '<input type="number" class="item-price" min="0" step="0.01" value="' + (item.price || 0) + '" oninput="calcItems()">' +
    '<input type="text" class="item-unit" value="' + esc(item.unit || 'kg') + '">' +
    '<span class="item-amount">¥0.00</span>' +
    '<button type="button" class="item-remove" onclick="removeItemRow(this)" title="删除">×</button>';
  document.getElementById('itemRows').appendChild(row);
  if (item.name && !item.sku) {
    var sel = row.querySelector('.item-product');
    var opt = document.createElement('option');
    opt.value = '__manual';
    opt.textContent = item.name;
    opt.setAttribute('data-name', item.name);
    opt.setAttribute('data-custom', '1');
    sel.appendChild(opt);
    sel.value = '__manual';
    row.querySelector('.item-unit').value = item.unit || '件';
  }
  calcItems();
}

function onProductChange(sel) {
  var opt = sel.options[sel.selectedIndex];
  var row = sel.closest('.item-row');
  if (!opt || !opt.value) return;
  var price = opt.getAttribute('data-price');
  var unit = opt.getAttribute('data-unit');
  if (price) row.querySelector('.item-price').value = price;
  if (unit) row.querySelector('.item-unit').value = unit;
  calcItems();
}

function removeItemRow(btn) {
  var rows = document.querySelectorAll('#itemRows .item-row');
  if (rows.length <= 1) return toast('至少保留一条商品明细', 'warning');
  btn.closest('.item-row').remove();
  calcItems();
}

function collectItems() {
  var rows = document.querySelectorAll('#itemRows .item-row');
  var items = [];
  rows.forEach(function (row) {
    var sel = row.querySelector('.item-product');
    var opt = sel && sel.options[sel.selectedIndex];
    var name = opt && opt.value ? (opt.getAttribute('data-name') || opt.textContent.split(' · ')[0]) : '';
    var qty = Number(row.querySelector('.item-qty').value) || 0;
    var price = Number(row.querySelector('.item-price').value) || 0;
    var unit = row.querySelector('.item-unit').value || '件';
    if (name && qty > 0) {
      items.push({
        sku: opt && opt.value !== '__manual' ? opt.value : '',
        name: name,
        spec: opt ? (opt.getAttribute('data-spec') || '') : '',
        unit: unit,
        qty: qty,
        price: price
      });
    }
  });
  return items;
}

function calcItems() {
  var rows = document.querySelectorAll('#itemRows .item-row');
  var goods = 0;
  rows.forEach(function (row) {
    var qty = Number(row.querySelector('.item-qty').value) || 0;
    var price = Number(row.querySelector('.item-price').value) || 0;
    var amount = qty * price;
    goods += amount;
    row.querySelector('.item-amount').textContent = SalesStore.fmtMoney(amount);
  });
  var discount = Number(val('eDiscount')) || 0;
  var freight = Number(val('eFreight')) || 0;
  document.getElementById('sumGoods').textContent = SalesStore.fmtMoney(goods);
  document.getElementById('sumPayable').textContent = SalesStore.fmtMoney(Math.max(0, goods - discount + freight));
}

function onCustomerChange() {
  var c = SalesStore.customer(val('eCustomer'));
  if (!c) return;
  document.getElementById('eReceiver').value = c.contact || c.name;
  document.getElementById('ePhone').value = c.phone || '';
  document.getElementById('eAddress').value = c.address || '';
  document.getElementById('eOwner').value = c.owner || '';
  document.getElementById('eChannel').value = c.type || 'retail';
}

function openAddOrder() {
  editingId = null;
  document.getElementById('editTitle').textContent = '新建销售订单';
  document.getElementById('eCustomer').value = '';
  document.getElementById('eChannel').value = 'retail';
  document.getElementById('eOwner').value = '';
  document.getElementById('eExpected').value = todayMinus(-3);
  document.getElementById('eBatch').value = '';
  document.getElementById('eTrace').value = '';
  document.getElementById('eReceiver').value = '';
  document.getElementById('ePhone').value = '';
  document.getElementById('eAddress').value = '';
  document.getElementById('eInvoice').value = 'none';
  document.getElementById('eRemark').value = '';
  document.getElementById('eDiscount').value = '0';
  document.getElementById('eFreight').value = '0';
  document.getElementById('itemRows').innerHTML = '';

function openEditOrder(id) {
  var o = SalesStore.order(id);
  if (!o || o.isMirror) return toast('该订单不可编辑', 'warning');
  editingId = id;
  document.getElementById('editTitle').textContent = '编辑订单 · ' + o.no;
  document.getElementById('eCustomer').value = o.customerId;
  document.getElementById('eChannel').value = o.channel;
  document.getElementById('eOwner').value = o.owner || '';
  document.getElementById('eExpected').value = o.expectedDate || '';
  document.getElementById('eBatch').value = o.batchNo || '';
  document.getElementById('eTrace').value = o.traceCode || '';
  document.getElementById('eReceiver').value = o.receiver || '';
  document.getElementById('ePhone').value = o.receiverPhone || '';
  document.getElementById('eAddress').value = o.receiverAddress || '';
  document.getElementById('eInvoice').value = o.invoiceStatus || 'none';
  document.getElementById('eRemark').value = o.remark || '';
  document.getElementById('eDiscount').value = o.discount || 0;
  document.getElementById('eFreight').value = o.freight || 0;
  document.getElementById('itemRows').innerHTML = '';
  o.items.forEach(function (it) { addItemRow(it); });
  calcItems();
  closeModal('detailModal');
  openModal('editModal');
}

function submitOrder() {
  var items = collectItems();
  var payload = {
    id: editingId || undefined,
    customerId: val('eCustomer'),
    channel: val('eChannel'),
    owner: val('eOwner'),
    expectedDate: val('eExpected'),
    batchNo: val('eBatch'),
    traceCode: val('eTrace'),
    receiver: val('eReceiver'),
    receiverPhone: val('ePhone'),
    receiverAddress: val('eAddress'),
    invoiceStatus: val('eInvoice'),
    remark: val('eRemark'),
    discount: val('eDiscount'),
    freight: val('eFreight'),
    items: items
  };
  var res = SalesStore.saveOrder(payload);
  if (!res.ok) return toast(res.message, 'danger');
  closeModal('editModal');
  toast(editingId ? '订单已更新' : '订单已创建，状态为待确认');
  editingId = null;
  refreshAll();
}

/* ---------------- 收款 ---------------- */
function openPay(id) {
  var o = SalesStore.order(id);
  if (!o) return toast('订单不存在', 'danger');
  payOrderId = id;
  closeModal('detailModal');
  var balance = Number(o.payableAmount) - Number(o.paidAmount);

    detailItem('订单编号', o.no) + detailItem('客户', o.customerName) +
    detailItem('应收金额', SalesStore.fmtMoney(o.payableAmount)) +
    detailItem('已收金额', SalesStore.fmtMoney(o.paidAmount)) +
    '<div class="detail-item full"><span class="detail-label">本次最多可收</span><span class="detail-value money-lg text-danger">' + SalesStore.fmtMoney(balance) + '</span></div>';
  document.getElementById('pAmount').value = balance.toFixed(2);
  document.getElementById('pAmount').max = balance.toFixed(2);
  document.getElementById('pMethod').value = o.payMethod || 'bank';
  document.getElementById('pTime').value = nowLocal();
  document.getElementById('pVoucher').value = '';
  document.getElementById('pRemark').value = '';
  openModal('payModal');
}

function submitPay() {
  var res = SalesStore.confirmPayment(payOrderId, {
    amount: Number(val('pAmount')),
    method: val('pMethod'),
    paidAt: val('pTime') ? val('pTime').replace('T', ' ') : '',
    operator: '财务',
    voucherNo: val('pVoucher'),
    remark: val('pRemark')
  });
  if (!res.ok) return toast(res.message, 'danger');
  closeModal('payModal');
  toast('收款已登记');
  refreshAll();
}

/* ---------------- 发货 ---------------- */
function fillCompanyOptions(id) {
  document.getElementById(id).innerHTML = SalesStore.SHIP_COMPANIES.map(function (c) {
    return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
  }).join('');
}

function openShip(id) {
  var o = SalesStore.order(id);
  if (!o) return toast('订单不存在', 'danger');
  if (o.isMirror) return toast('H5 商城订单请在商城管理发货', 'warning');
  shipOrderId = id;
  closeModal('detailModal');
  document.getElementById('shipSummary').innerHTML =
    detailItem('订单编号', o.no) + detailItem('客户', o.customerName) +
    detailItem('应收金额', SalesStore.fmtMoney(o.payableAmount)) +
    detailItem('商品摘要', itemsText(o)) +
    '<div class="detail-item full"><span class="detail-label">收货地址</span><span class="detail-value">' + esc(o.receiver + ' ' + o.receiverPhone + '　' + o.receiverAddress) + '</span></div>';
  document.getElementById('sCompany').value = SalesStore.SHIP_COMPANIES[0];
  document.getElementById('sTracking').value = '';
  document.getElementById('sRemark').value = '';
  openModal('shipModal');
}

function submitShip() {
  var res = SalesStore.createShipment(shipOrderId, {
    company: val('sCompany'),
    trackingNo: val('sTracking'),
    remark: val('sRemark')
  });
  if (!res.ok) return toast(res.message, 'danger');
  closeModal('shipModal');
  toast('发货成功，订单已进入在途');
  refreshAll();
}

function openBatchShip() {
  var ids = Object.keys(selected);
  if (!ids.length) return toast('请先勾选待发货订单', 'warning');
  var list = ids.map(function (id) { return SalesStore.order(id); }).filter(Boolean);
  if (!list.length) return toast('所选订单不存在', 'danger');
  document.getElementById('batchShipBody').innerHTML = list.map(function (o) {
    return '<tr data-id="' + o.id + '"><td>' + esc(o.no) + '</td><td>' + esc(o.customerName) + '</td><td><span class="order-items-cell">' + itemsText(o) + '</span></td><td class="num">' + SalesStore.fmtMoney(o.payableAmount) + '</td><td><input type="text" class="batch-tracking" placeholder="请输入运单号" style="width:100%;padding:6px 8px;border:1px solid #d9e2d9;border-radius:6px;"></td></tr>';
  }).join('');
  fillCompanyOptions('bCompany');
  document.getElementById('bTime').value = nowLocal();
  openModal('batchShipModal');
}

function submitBatchShip() {
  var rows = document.querySelectorAll('#batchShipBody tr');
  var company = val('bCompany');
  var shippedAt = val('bTime') ? val('bTime').replace('T', ' ') : '';
  var success = 0;
  var errors = [];
  rows.forEach(function (row) {
    var id = row.getAttribute('data-id');
    var tracking = row.querySelector('.batch-tracking').value.trim();
    var res = SalesStore.createShipment(id, { company: company, trackingNo: tracking, shippedAt: shippedAt });
    if (res.ok) success++;
    else errors.push(id + '：' + res.message);
  });
  if (errors.length) {
    toast('成功 ' + success + ' 笔，失败 ' + errors.length + ' 笔：' + errors[0], success ? 'warning' : 'danger');
  } else {
    toast('已完成 ' + success + ' 笔发货');
  }
  closeModal('batchShipModal');
  selected = {};
  refreshAll();
}

/* ---------------- 确认 / 签收 / 取消 ---------------- */
function doConfirm(id) {
  var res = SalesStore.confirmOrder(id);
  if (!res.ok) return toast(res.message, 'danger');
  toast('订单已确认');
  refreshAll();
}

function doReceive(id) {
  var res = SalesStore.confirmReceive(id);
  if (!res.ok) return toast(res.message, 'danger');
  toast('已确认签收，订单完成');
  closeModal('detailModal');
  refreshAll();
}

function openCancel(id) {
  var o = SalesStore.order(id);
  if (!o) return;
  if (Number(o.paidAmount) > 0) return toast('订单已收款，请通过「售后与退款」处理', 'warning');
  cancelOrderId = id;
  closeModal('detailModal');
  document.getElementById('cancelSummary').textContent = o.no + ' · ' + o.customerName + ' · ' + SalesStore.fmtMoney(o.payableAmount);
  document.getElementById('cancelReason').value = '';
  openModal('cancelModal');
}

function submitCancel() {
  var reason = val('cancelReason').trim();
  if (!reason) return toast('请填写取消原因', 'warning');
  var res = SalesStore.cancelOrder(cancelOrderId, reason);
  if (!res.ok) return toast(res.message, 'danger');
  closeModal('cancelModal');
  toast('订单已取消');
  refreshAll();
}

/* ---------------- 售后 ---------------- */
function openAfterSale(orderId) {
  var o = SalesStore.order(orderId);
  if (!o) return toast('订单不存在', 'danger');
  if (o.isMirror) return toast('H5 商城订单请在商城管理发起售后', 'warning');
  afterSaleOrderId = orderId;
  closeModal('detailModal');
  document.getElementById('asSummary').innerHTML =
    detailItem('订单编号', o.no) + detailItem('客户', o.customerName) +
    detailItem('已收金额', SalesStore.fmtMoney(o.paidAmount)) +
    detailItem('订单状态', SalesStore.ORDER_STATUS_TEXT[o.status]);
  document.getElementById('asType').value = 'refund';
  document.getElementById('asAmount').value = Number(o.paidAmount).toFixed(2);
  document.getElementById('asAmount').max = Number(o.paidAmount).toFixed(2);
  document.getElementById('asQty').value = 0;
  document.getElementById('asReason').value = '';
  document.getElementById('asRemark').value = '';
  document.getElementById('asRestock').value = '1';
  onAfterSaleTypeChange();
  openModal('afterSaleModal');
}

function onAfterSaleTypeChange() {
  var type = val('asType');
  var amount = document.getElementById('asAmount');
  var qty = document.getElementById('asQty');
  amount.disabled = type === 'exchange';
  qty.disabled = type === 'refund';
  if (type === 'refund') qty.value = 0;
  if (type === 'exchange') amount.value = '0';
  document.getElementById('asRestockWrap').style.display = type === 'return' ? '' : 'none';
}

function submitAfterSale() {
  var type = val('asType');
  var res = SalesStore.saveAfterSale({
    orderId: afterSaleOrderId,
    type: type,
    amount: Number(val('asAmount')),
    qty: Number(val('asQty')),
    reason: val('asReason'),
    restock: val('asRestock') === '1',
    remark: val('asRemark')
  });
  if (!res.ok) return toast(res.message, 'danger');
  closeModal('afterSaleModal');
  toast('售后单已提交，待审核处理');
  refreshAll();
}

/* ---------------- 导出 / 打印 ---------------- */
function exportOrders() {
  var rows = filtered.length ? filtered : filterOrders();
  if (!rows.length) return toast('当前筛选结果为空，无法导出', 'warning');
  var headers = ['订单编号', '来源', '订单类型', '客户名称', '联系人', '联系电话', '商品明细', '数量', '订单金额', '已收金额', '待收金额', '订单状态', '付款状态', '收款方式', '快递公司', '运单号', '业务员', '批次号', '下单时间'];
  var data = rows.map(function (o) {
    return [o.no, o.source === 'h5' ? 'H5 商城' : (SalesStore.SOURCE_TEXT[o.source] || '手工录入'), SalesStore.TYPE_TEXT[o.type] || o.type,
      o.customerName, o.contact, o.phone, itemsText(o), totalQty(o), o.payableAmount, o.paidAmount,
      (Number(o.payableAmount) - Number(o.paidAmount)).toFixed(2), SalesStore.ORDER_STATUS_TEXT[o.status],
      SalesStore.PAY_STATUS_TEXT[o.payStatus], SalesStore.PAY_METHOD_TEXT[o.payMethod] || o.payMethod || '',
      o.shipCompany || '', o.shipNo || '', o.owner || '', o.batchNo || '', o.createdAt];
  });
  SalesStore.downloadCsv('销售订单_' + todayMinus(0) + '.csv', headers, data);
  toast('已导出 ' + rows.length + ' 条订单');
}

    '<div><span>联系人</span><b>' + esc(o.contact || '—') + '</b></div><div><span>联系电话</span><b>' + esc(o.phone || '—') + '</b></div>' +

    o.items.map(function (it) {

    '<p>备注：' + esc(o.remark || '无') + '</p>' +

/* ---------------- 初始化 ---------------- */
function fillBatchOptions() {
  var set = {};
  try {
    if (window.TraceStore && typeof TraceStore.batches === 'function') {
      TraceStore.batches().forEach(function (b) { if (b && (b.batchNo || b.no)) set[b.batchNo || b.no] = true; });
    }
  } catch (e) {}
  try {
    if (window.HarvestStore && typeof HarvestStore.storages === 'function') {
      HarvestStore.storages().forEach(function (s) { if (s && s.batchNo) set[s.batchNo] = true; });
    }
  } catch (e) {}
  if (!Object.keys(set).length) {
    ['PC-20260901-001', 'PC-20260905-005', 'PC-20260910-008', 'PC-20260915-012'].forEach(function (b) { set[b] = true; });
  }
  document.getElementById('batchOptions').innerHTML = Object.keys(set).map(function (b) {
    return '<option value="' + esc(b) + '">';
  }).join('');
}

document.addEventListener('DOMContentLoaded', function () {
  populateCustomerOptions();
  populateOwnerOptions();
  fillCompanyOptions('sCompany');
  fillBatchOptions();
  document.getElementById('fStart').value = '';
  refreshAll();
});

if (document.readyState === 'complete' || document.readyState === 'interactive') {
  populateCustomerOptions();
  populateOwnerOptions();
  fillCompanyOptions('sCompany');
  fillBatchOptions();
  refreshAll();
}

/* ============================================================
 * 后端数据到达后自动重绘
 * ------------------------------------------------------------
 * 数据层在「后端预加载完成」与「本地写入」两条路径上都会派发
 * <store>StoreChange 窗口事件；页面若不监听，首次渲染发生在数据
 * 到达之前，界面会一直停在空列表。此处统一订阅后自动重绘。
 * ============================================================ */
(function () {
  // StoreLive 由 common/js/api.js 提供；部分页面未静态引入该文件，
  // 此时回退到原生窗口事件订阅，避免订阅被静默跳过导致页面不重绘。
  function bind(events, handler) {
    if (typeof StoreLive !== 'undefined') return StoreLive.on(events, handler);
    (Array.isArray(events) ? events : [events]).forEach(function (ev) {
      if (ev) window.addEventListener(ev, function () { try { handler(); } catch (e) { console.warn('[store-live]', e); } });
    });
  }
  bind(["salesStoreChange","harvestStoreChange","traceStoreChange"], function () {
      refreshAll();
      fillBatchOptions();
  });
})();
</script>
