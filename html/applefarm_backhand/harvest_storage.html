<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 储藏管理</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .module-card {
    transition:all 0.2s ease;
  }
  .module-card:hover {
    background:var(--bg-hover);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }
  /* 分页栏样式（与农事计划一致） */
  #pagination-container { padding:12px 16px; }
  .stat-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-bottom:16px; }
  .stat-card { background:var(--bg-card, #fff); border:1px solid var(--border-color, #e8ece8); border-radius:var(--radius-card, 12px); padding:16px 18px; }
  .stat-label { font-size:12px; color:var(--text-tertiary); margin-bottom:6px; }
  .stat-value { font-size:22px; font-weight:600; line-height:1.2; }
  .stat-value small { font-size:12px; font-weight:400; color:var(--text-tertiary); margin-left:4px; }
  .stat-sub { margin-top:6px; font-size:12px; color:var(--text-tertiary); }
  @media (max-width: 1100px) { .stat-grid { grid-template-columns:repeat(2, 1fr); } }
  /* 温湿度记录表 */
  .reading-table { width:100%; border-collapse:collapse; font-size:13px; }
  .reading-table th,
  .reading-table td { padding:8px 10px; border-bottom:1px solid #f0f2f1; text-align:left; }
  .reading-table th { color:var(--text-tertiary); font-weight:600; font-size:12px; background:#f7f9f7; }
  .reading-table td.text-right { text-align:right; }
  /* 出库确认弹窗 */
  #modal-outbound .form-textarea { min-height:76px; }
  #out-quantity { font-variant-numeric: tabular-nums; }
  .outbound-summary {
    display:grid;
    grid-template-columns:minmax(0, 1.3fr) minmax(0, 1fr);
    gap:8px 16px;
    padding:14px 16px;
    border:1px solid var(--primary-50, #e6f4ff);
    border-radius:10px;
    background:var(--u-primary-bg-soft, rgba(24,144,255,0.06));
  }
  .outbound-summary-label { display:block; font-size:12px; color:var(--u-text-3, #8c8c8c); margin-bottom:4px; }
  .outbound-summary-value {
    display:block;
    font-size:14px;
    font-weight:600;
    color:var(--u-text-1, #262626);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .outbound-label-hint {
    margin-left:auto;
    font-size:12px;
    font-weight:400;
    color:var(--text-tertiary, #8c8c8c);
    white-space:nowrap;
  }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="harvest" data-active-submenu="harvest-storage">

<!-- ===== 整体布局容器 ===== -->
<div class="app-layout">

  <!-- ===== 主内容区 ===== -->
  <div class="main-wrapper">

    <!-- Tab 标签栏 -->
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
      <div class="content-wrapper">

        <!-- 搜索栏区 -->
        <div class="page-section search-section">
          <div class="search-bar">
            <select class="search-select" id="baseSelect">
              <option value="">全部基地</option>
            </select>
            <select class="search-select" id="statusSelect">
              <option value="">全部状态</option>
              <option value="normal">在库正常</option>
              <option value="warning">温控预警</option>
            </select>
            <input type="text" class="search-input" placeholder="搜索库位编号或批次..." id="searchInput">
          <div class="search-actions"><button class="jg-btn jg-btn-primary" onclick="handleSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button><button class="jg-btn" onclick="smartReset()">重置</button></div>
          </div>
        </div>

        <!-- 统计卡片 -->
        <div class="page-section">
          <div class="stat-grid" id="statGrid"></div>
        </div>

        <!-- 操作按钮区 -->
        <div class="page-section action-bar">
          <button class="jg-btn" onclick="Modal.show('modal-export')">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
              <path d="M3 10L8 15L13 10"/><path d="M8 15V3"/>
            </svg>
            导出记录
          </button>
        </div>

        <!-- 数据列表区 -->
        <div class="page-section data-section">
          <div class="data-table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width:60px;">序号</th>
                  <th style="width:110px;">库位编号</th>
                  <th style="width:140px;">所属基地</th>
                  <th style="width:120px;">当前批次</th>
                  <th style="width:110px;">在库数量(kg)</th>
                  <th style="width:100px;">温度(℃)</th>
                  <th style="width:100px;">湿度(%)</th>
                  <th style="width:140px;">入库时间</th>
                  <th style="width:100px;">状态</th>
                  <th style="width:200px;">操作</th>
                </tr>
              </thead>
              <tbody id="dataTableBody">
              </tbody>
            </table>
          </div>
          <div id="pagination-container">
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 导出模态框 -->
<div id="modal-export" class="modal-overlay">
  <div class="modal-box" style="max-width:420px;">
    <div class="modal-header">
      <h3 class="modal-title">导出储藏记录</h3>
      <button class="modal-close">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4L12 12M12 4L4 12"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-item">
          <label>选择导出格式</label>
          <select class="form-select" id="exportFormat">
            <option value="excel">Excel (.xlsx)</option>
            <option value="csv">CSV (.csv)</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-item">
          <label>导出范围</label>
          <div style="display:flex;gap:16px;">
            <label class="checkbox-label">
              <input type="radio" name="exportScope" value="all" checked>
              <span>全部数据</span>
            </label>
            <label class="checkbox-label">
              <input type="radio" name="exportScope" value="selected">
              <span>当前筛选结果</span>
            </label>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="Modal.hide('modal-export')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="handleExport()">导出</button>
    </div>
  </div>
</div>

<!-- 详情模态框 -->

  <div class="modal-box" style="max-width:640px;">
    <div class="modal-header">
      <h3 class="modal-title">储藏详情</h3>
      <button class="modal-close">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4L12 12M12 4L4 12"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="detail-grid">
        <div class="detail-item">
          <span class="detail-label">库位编号</span>
          <span class="detail-value" id="detail-id"></span>
        </div>
        <div class="detail-item">
          <span class="detail-label">状态</span>
          <span class="detail-value" id="detail-status"></span>
        </div>
        <div class="detail-item">
          <span class="detail-label">所属基地</span>
          <span class="detail-value" id="detail-base"></span>
        </div>
        <div class="detail-item">
          <span class="detail-label">当前批次</span>
          <span class="detail-value" id="detail-batch"></span>
        </div>
        <div class="detail-item">
          <span class="detail-label">品种</span>
          <span class="detail-value" id="detail-variety"></span>
        </div>
        <div class="detail-item">
          <span class="detail-label">等级</span>
          <span class="detail-value" id="detail-grade"></span>
        </div>
        <div class="detail-item">
          <span class="detail-label">在库数量</span>
          <span class="detail-value" id="detail-quantity"></span>
        </div>
        <div class="detail-item">
          <span class="detail-label">温度 / 湿度</span>
          <span class="detail-value" id="detail-env"></span>
        </div>
        <div class="detail-item">
          <span class="detail-label">入库时间</span>
          <span class="detail-value" id="detail-intime"></span>
        </div>

      <div style="margin-top:16px; padding:12px; background:var(--gray-50); border-radius:8px;">
        <div style="font-size:12px; color:var(--text-tertiary); margin-bottom:4px;">备注</div>
        <div style="font-weight:500;" id="detail-remark">-</div>

    </div>
    <div class="modal-footer">
      <button class="jg-btn jg-btn-primary" onclick="Modal.hide('modal-detail')">关闭</button>
    </div>

</div>

<!-- 温湿度记录模态框 -->
<div id="modal-readings" class="modal-overlay">
  <div class="modal-box" style="max-width:560px;">
    <div class="modal-header">
      <h3 class="modal-title">温湿度记录</h3>
      <button class="modal-close">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4L12 12M12 4L4 12"/>

          </tr>
        </thead>
        <tbody id="readingsBody"></tbody>
      </table>
    </div>

      <button class="jg-btn jg-btn-primary" onclick="Modal.hide('modal-readings')">关闭</button>
    </div>
  </div>
</div>

<!-- 出库模态框 -->

  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title">出库确认</h3>
      <button class="modal-close" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4L12 12M12 4L4 12"/>

    </div>

</div>

<!-- 引入交互脚本 -->
<script src="js/common-functions.js"></script>
<script src="js/export-helper.js"></script>
<script src="js/shared/harvest-store.js"></script>
<script>
// 库位适温适湿区间
const TEMP_MIN = 0, TEMP_MAX = 4;
const HUMI_MIN = 85, HUMI_MAX = 95;

// 库存由 harvest-store.js 从「已入库处理单 − 已出库发货单」派生，本页只读不另存
let currentStorageId = '';

function allStorages() { return HarvestStore.storages(); }

function getStatusTag(status) {
  return '<span class="status-tag ' + HarvestStore.statusTag('storages', status) + '">' + HarvestStore.statusText('storages', status) + '</span>';
}

function findStorage(id) {
  return allStorages().filter(function (s) { return s.id === id; })[0] || null;
}

/** 数据写入后统一刷新统计卡与列表 */
function refresh() {
  renderStats();
  handleSearch();
}

function renderStats() {
  const list = allStorages();
  const totalQty = list.reduce((s, x) => s + Number(x.qty || 0), 0);
  const warning = list.filter(x => x.status === 'warning').length;
  const capacity = HarvestStore.slots().reduce((s, x) => s + x.capacity, 0);
  const usage = capacity ? Math.round(totalQty / capacity * 100) : 0;
  const cards = [
    { label: '在库批次', value: list.length, unit: '批', sub: '占用 ' + list.length + ' / ' + HarvestStore.slots().length + ' 个库位' },
    { label: '在库总量', value: totalQty.toLocaleString(), unit: 'kg', sub: '总库容 ' + capacity.toLocaleString() + ' kg' },
    { label: '库容使用率', value: usage, unit: '%', sub: usage >= 90 ? '库容紧张，建议安排出库' : '库容充足' },
    { label: '温控预警', value: warning, unit: '个', sub: warning ? '存在超限库位，需处理' : '全部库位温湿度正常' }
  ];
  document.getElementById('statGrid').innerHTML = cards.map(c =>
    '<div class="stat-card"><div class="stat-label">' + c.label + '</div>' +
    '<div class="stat-value">' + c.value + ' <small>' + c.unit + '</small></div>' +
    '<div class="stat-sub">' + c.sub + '</div></div>'
  ).join('');
}

function renderRow(item, index) {
  const actions = `<button class="action-btn detail" onclick="showDetail('${item.id}')">详情</button>`
    + `<button class="action-btn edit" onclick="showReadings('${item.id}')">温湿度记录</button>`
    + `<button class="action-btn edit" onclick="showOutbound('${item.id}')">出库</button>`;

  return `<tr>
    <td>${index + 1}</td>
    <td><strong>${item.id}</strong></td>
    <td>${item.base || '-'}</td>
    <td title="${item.batchId}">${item.batchNo || item.batchId}</td>
    <td class="text-right">${Number(item.qty || 0).toLocaleString()}</td>
    <td class="text-right">${Number(item.temp).toFixed(1)}</td>
    <td class="text-right">${item.humidity}</td>
    <td>${item.inTime}</td>
    <td>${getStatusTag(item.status)}</td>
    <td><div class="action-btns">${actions}</div></td>
  </tr>`;
}

function filteredStorages() {
  var base = document.getElementById('baseSelect').value;
  var status = document.getElementById('statusSelect').value;
  var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  return allStorages().filter(function (item) {
    if (base && item.base !== base) return false;
    if (status && item.status !== status) return false;
    if (keyword) {
      var hay = [item.id, item.batchId, item.batchNo, item.plot, item.plotName, item.variety].join(' ').toLowerCase();
      if (hay.indexOf(keyword) === -1) return false;
    }
    return true;
  });
}

// 搜索：基地 + 状态 + 关键词
function handleSearch() {
  var data = filteredStorages();
  Pagination.updateData(data);
  Toast.info('找到 ' + data.length + ' 条记录');
}

function silentRefresh() {
  renderStats();
  Pagination.updateData(filteredStorages());
}

// 详情
function showDetail(id) {
  const item = findStorage(id);
  if (!item) return;
  document.getElementById('detail-id').textContent = item.id;
  document.getElementById('detail-status').innerHTML = getStatusTag(item.status);
  document.getElementById('detail-base').textContent = item.base || '-';
  document.getElementById('detail-batch').textContent = (item.batchNo || '-') + '（' + item.batchId + '）';
  document.getElementById('detail-variety').textContent = item.variety || '-';
  document.getElementById('detail-grade').textContent = item.grade || '-';
  document.getElementById('detail-quantity').textContent =
    Number(item.qty || 0).toLocaleString() + ' kg / 库容 ' + Number(item.capacity || 0).toLocaleString() + ' kg';
  document.getElementById('detail-env').textContent = Number(item.temp).toFixed(1) + '℃ / ' + item.humidity + '%';
  document.getElementById('detail-intime').textContent = item.inTime;
  document.getElementById('detail-expire').textContent = item.expire;
  document.getElementById('detail-remark').textContent = item.remark || '-';
  Modal.show('modal-detail');
}

// 温湿度记录（按当前库位生成近 6 次采集记录）
function showReadings(id) {
  const item = findStorage(id);
  if (!item) return;
  currentStorageId = id;
  document.getElementById('readings-id').textContent = item.id + ' · ' + (item.batchNo || item.batchId);

  const rows = [];
  const baseTime = new Date(String(item.inTime).replace(' ', 'T'));
  for (let i = 5; i >= 0; i--) {
    const t = new Date(baseTime.getTime() + i * 30 * 60 * 1000);
    const p = n => String(n).padStart(2, '0');
    const timeStr = `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;
    // 末次为当前实测值，其余在实测值上下小幅波动
    const temp = i === 0 ? item.temp : Number((item.temp + (i % 2 === 0 ? -0.3 : 0.4) * (i / 2)).toFixed(1));
    const humi = i === 0 ? item.humidity : item.humidity + (i % 2 === 0 ? 1 : -1) * Math.ceil(i / 2);
    const ok = temp >= TEMP_MIN && temp <= TEMP_MAX && humi >= HUMI_MIN && humi <= HUMI_MAX;
    rows.push(`<tr>
      <td>${timeStr}</td>
      <td class="text-right">${temp.toFixed(1)}</td>
      <td class="text-right">${humi}</td>
      <td><span class="status-tag ${ok ? 'normal' : 'warning'}">${ok ? '正常' : '超限'}</span></td>
    </tr>`);
  }
  document.getElementById('readingsBody').innerHTML = rows.join('');
  Modal.show('modal-readings');
}

// 出库：生成发货单并扣减库存
function showOutbound(id) {
  const item = findStorage(id);
  if (!item) return;
  currentStorageId = id;
  document.getElementById('out-id-text').textContent = item.id + ' · ' + (item.batchNo || item.batchId);
  document.getElementById('out-stock-text').textContent = Number(item.qty || 0).toLocaleString() + ' kg';
  document.getElementById('out-quantity-hint').textContent = '最多可出库 ' + Number(item.qty || 0).toLocaleString() + ' kg';
  const quantityInput = document.getElementById('out-quantity');
  quantityInput.value = item.qty;
  quantityInput.max = item.qty;
  document.getElementById('out-customer').value = '';
  document.getElementById('out-phone').value = '';
  document.getElementById('out-address').value = '';
  document.getElementById('out-tracking').value = '';
  document.getElementById('out-time').value = toLocalInput(new Date());
  document.getElementById('out-remark').value = '';
  Modal.show('modal-outbound');
}

function submitOutbound() {
  const r = HarvestStore.outboundStorage(currentStorageId, {
    qty: document.getElementById('out-quantity').value,
    time: document.getElementById('out-time').value,
    customer: document.getElementById('out-customer').value,
    phone: document.getElementById('out-phone').value,
    address: document.getElementById('out-address').value,
    tracking: document.getElementById('out-tracking').value,
    remark: document.getElementById('out-remark').value
  });
  if (!r.ok) { Toast.error(r.message); return; }
  Modal.hide('modal-outbound');
  refresh();
  Toast.success('出库成功，已生成发货单 ' + r.item.id);
}

// 真实导出（Excel / CSV）
async function handleExport() {
  const scope = document.querySelector('input[name="exportScope"]:checked').value;
  const rows = (scope === 'selected' ? Pagination.filteredData : allStorages());
  const result = await ExportHelper.exportData({
    filename: '储藏记录_' + ExportHelper.stamp(),
    format: document.getElementById('exportFormat').value,
    headers: ['库位编号', '所属基地', '当前批次', '处理单号', '地块', '品种', '等级', '在库数量(kg)', '库容(kg)', '温度(℃)', '湿度(%)', '入库时间', '保质期至', '状态', '备注'],
    rows: rows.map(s => [s.id, s.base || '', s.batchNo || '', s.batchId, s.plot || '', s.variety || '', s.grade || '',
      s.qty, s.capacity, s.temp, s.humidity, s.inTime, s.expire, HarvestStore.statusText('storages', s.status), s.remark || ''])
  });
  Modal.hide('modal-export');
  Toast.success(result === 'csv-fallback' ? 'Excel 组件加载失败，已导出为 CSV' : '导出成功，文件已下载');
}

function toLocalInput(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

document.addEventListener('DOMContentLoaded', function() {
  const baseSelect = document.getElementById('baseSelect');
  baseSelect.innerHTML = '<option value="">全部基地</option>' + HarvestStore.bases().map(function (b) {
    return '<option value="' + b + '">' + b + '</option>';
  }).join('');
  renderStats();
  Pagination.init({
    currentPage: 1,
    pageSize: 10,
    data: allStorages(),
    containerId: 'pagination-container',
    tbodyId: 'dataTableBody',
    renderRow: renderRow
  });
  if (HarvestStore.subscribe) HarvestStore.subscribe(silentRefresh);
});
