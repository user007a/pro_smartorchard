<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的消息 - 移动商城</title>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    .messages-section { padding: var(--space-4); padding-bottom: 100px; }

    .messages-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-4);
    }

    .unread-count {
      font-size: var(--font-sm);
      color: var(--error);
      font-weight: var(--font-medium);
    }

    .mark-all-read {
      font-size: var(--font-sm);
      color: var(--primary);
      cursor: pointer;
    }

    .message-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .message-card:active { transform: scale(0.99); }

    .message-card.unread {
      border-left: 3px solid var(--primary);
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
    }

    .message-type {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: var(--font-xs);
      font-weight: var(--font-medium);
    }

    .message-type.system {
      background: var(--info-light);
      color: var(--info-dark);
    }

    .message-type.activity {
      background: var(--warning-light);
      color: var(--warning-dark);
    }

    .message-type.order {
      background: var(--success-light);
      color: var(--success-dark);
    }

    .message-time {
      font-size: var(--font-xs);
      color: var(--text-tertiary);
    }

    .message-title {
      font-size: var(--font-base);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-1);
    }

    .message-content {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      line-height: 1.5;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .message-unread-dot {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      margin-left: auto;
    }

    .empty-state {
      text-align: center;
      padding: var(--space-8) var(--space-4);
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto var(--space-4);
      background: var(--gray-100);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-icon svg {
      width: 40px;
      height: 40px;
      color: var(--text-tertiary);
    }

    .empty-title {
      font-size: var(--font-md);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-2);
    }

    .empty-desc {
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }

    /* 底部弹层查看完整消息 */
    .msg-sheet-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      z-index: 200;
    }
    .msg-sheet-overlay.show { display: block; }
    .msg-sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--bg-white);
      border-radius: 20px 20px 0 0;
      max-height: 80vh;
      padding: var(--space-4);
      transform: translateY(100%);
      transition: transform .25s ease;
      z-index: 201;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .msg-sheet.show { transform: translateY(0); }
    .msg-sheet-handle {
      width: 36px; height: 4px;
      background: var(--gray-300);
      border-radius: 2px;
      margin: 0 auto var(--space-3);
    }
    .msg-sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-3); }
    .msg-sheet-title { font-size: var(--font-md); font-weight: var(--font-semibold); color: var(--text); flex: 1; }
    .msg-sheet-close { font-size: var(--font-base); color: var(--text-tertiary); cursor: pointer; padding: 4px 8px; }
    .msg-sheet-meta { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); font-size: var(--font-xs); color: var(--text-tertiary); }
    .msg-sheet-body { font-size: var(--font-base); color: var(--text); line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div class="mb-app">

    <div class="messages-section">
      <div class="messages-header">
        <span class="unread-count" id="unreadCount">2 条未读消息</span>
        <span class="mark-all-read" onclick="markAllRead()">全部标记已读</span>
      </div>

      <div id="messageList"></div>
    </div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('index.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_store.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>商城</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('trace_h5.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>溯源</span>
      </div>
      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </nav>
  </div>

  <!-- 消息详情底部弹层 -->
  <div class="msg-sheet-overlay" id="msgSheetOverlay" onclick="closeMessageSheet()"></div>
  <div class="msg-sheet" id="msgSheet" role="dialog" aria-modal="true">
    <div class="msg-sheet-handle"></div>
    <div class="msg-sheet-header">
      <div class="msg-sheet-title" id="msgSheetTitle">消息标题</div>
      <div class="msg-sheet-close" onclick="closeMessageSheet()">关闭</div>
    </div>
    <div class="msg-sheet-meta">
      <span class="message-type" id="msgSheetType">系统通知</span>
      <span id="msgSheetTime">2026.09.18 10:30</span>
    </div>
    <div class="msg-sheet-body" id="msgSheetBody">消息内容</div>
  </div>

  <script>
    function navigateTo(page) { window.location.href = page; }

    var MESSAGE_DATA = [
      { id: 1, type: 'system',   time: '2026.10.18 10:30', title: '您的认养果树已进入采收期', content: '您认养的A1-001花牛苹果已完成上色，果径与糖度达到采收标准。预计本周起按成熟度分批采收，采后将分级预冷并按溯源批次统一入库。点击查看实时生长报告。' },
      { id: 2, type: 'activity', time: '2026.10.10 09:00', title: '秋采认养活动火热进行中', content: '秋采果树认养活动已开启：认养即享采收期直送到家，免邮并赠送果园采摘体验名额；老用户邀请好友双方各得100积分。活动截止至 2026-12-31，欢迎前往「认养」页了解详情。' },
      { id: 3, type: 'order',    time: '2026.10.15 14:20', title: '您的订单已发货，请注意查收', content: '订单号：ORD20261015001，花牛苹果5斤装已通过冷链物流发出，预计2-3天内送达。您可在溯源页面查看配送进度。如需调整收货时间，请联系在线客服。' },
      { id: 4, type: 'system',   time: '2026.10.12 16:00', title: '农残检测报告已生成', content: '您认养的果树已完成采摘前农残检测，共检测68项指标，全部未检出。检测报告符合有机产品标准，点击查看详细报告与第三方机构出具的编号。' },
      { id: 5, type: 'order',    time: '2026.10.08 10:15', title: '订单已签收，感谢您的支持', content: '订单号：ORD20261005002 已成功签收。如有任何问题请及时联系客服，祝您品尝愉快！' }
    ];
    var MESSAGE_READ_KEY = 'h5_messages_read';

    function readReadIds() {
      try { var v = JSON.parse(localStorage.getItem(MESSAGE_READ_KEY) || '[]'); return Array.isArray(v) ? v : []; }
      catch (e) { return []; }
    }

    function renderMessages() {
      var readIds = readReadIds();
      // 按时间倒序展示
      var list = MESSAGE_DATA.slice().sort(function(a, b) {
        return a.time < b.time ? 1 : (a.time > b.time ? -1 : 0);
      });
      var unread = 0;
      var html = list.map(function(m) {
        var unreadFlag = readIds.indexOf(m.id) < 0;
        if (unreadFlag) unread++;
        return '<div class="message-card' + (unreadFlag ? ' unread' : '') + '" onclick="viewMessage(' + m.id + ')">' +
          '<div class="message-header">' +
          '<span class="message-type ' + m.type + '">' + ({ system: '系统通知', activity: '活动提醒', order: '订单通知' })[m.type] + '</span>' +
          '<span class="message-time">' + m.time + '</span>' +
          (unreadFlag ? '<div class="message-unread-dot"></div>' : '') +
          '</div>' +
          '<div class="message-title">' + m.title + '</div>' +
          '<div class="message-content">' + m.content + '</div></div>';
      }).join('');
      document.getElementById('messageList').innerHTML = html;
      document.getElementById('unreadCount').textContent = unread + ' 条未读消息';
    }

    function viewMessage(id) {
      var msg = MESSAGE_DATA.find(function (m) { return m.id === id; });
      if (!msg) return;
      // 标记已读并刷新列表
      var all = MESSAGE_DATA.map(function(m) { return m.id; }).concat(readReadIds());
      localStorage.setItem(MESSAGE_READ_KEY, JSON.stringify(all.filter(function(v, i, a) { return a.indexOf(v) === i; })));
      renderMessages();
      // 打开底部弹层显示完整内容
      var labelMap = { system: '系统通知', activity: '活动提醒', order: '订单通知' };
      var titleEl = document.getElementById('msgSheetTitle');
      var typeEl = document.getElementById('msgSheetType');
      var timeEl = document.getElementById('msgSheetTime');
      var bodyEl = document.getElementById('msgSheetBody');
      if (titleEl) titleEl.textContent = msg.title;
      if (typeEl) { typeEl.textContent = labelMap[msg.type] || '通知'; typeEl.className = 'message-type ' + msg.type; }
      if (timeEl) timeEl.textContent = msg.time;
      if (bodyEl) bodyEl.textContent = msg.content;
      var overlay = document.getElementById('msgSheetOverlay');
      var sheet = document.getElementById('msgSheet');
      if (overlay) overlay.classList.add('show');
      if (sheet) {
        sheet.classList.add('show');
        sheet.scrollTop = 0;
      }
    }

    function closeMessageSheet() {
      var overlay = document.getElementById('msgSheetOverlay');
      var sheet = document.getElementById('msgSheet');
      if (overlay) overlay.classList.remove('show');
      if (sheet) sheet.classList.remove('show');
    }

    function markAllRead() {
      localStorage.setItem(MESSAGE_READ_KEY, JSON.stringify(MESSAGE_DATA.map(function(m) { return m.id; })));
      renderMessages();
      showToast('已全部标记为已读');
    }

    renderMessages();

    function showToast(message) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;animation:fadeInOut 2s ease;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2000);
    }
    var style = document.createElement('style');
    style.textContent = '@keyframes fadeInOut { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0} }';
    document.head.appendChild(style);
  </script>
</body>
</html>
