<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>移动商城 - 我的</title>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    /* ========== 页面专属样式 - 参照mb_mine ========== */
    .profile-section {
      background: var(--gradient-header);
      padding: calc(var(--safe-top) + 20px) var(--space-4) var(--space-4);
      color: var(--text-on-primary);
      border-radius: 0 0 var(--radius-xl) var(--radius-xl);
      box-shadow: var(--shadow-header);
      position: relative;
      overflow: hidden;
    }
    .profile-section::before {
      content: '';
      position: absolute;
      top: -50%; right: -30%;
      width: 200px; height: 200px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    .profile-header {
      display: flex; align-items: center; gap: var(--space-4);
      position: relative; z-index: 1;
    }
    .avatar {
      width: 52px; height: 52px;
      border-radius: var(--radius-full);
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(255,255,255,0.3);
      flex-shrink: 0;
    }
    .avatar svg { width: 26px; height: 26px; color: var(--text-on-primary); }
    .profile-info { flex: 1; }
    .profile-name-row { display: flex; align-items: center; gap: var(--space-2); }
    .profile-name { font-size: var(--font-lg); font-weight: var(--font-bold); }
    .role-tag {
      font-size: var(--font-2xs);
      background: rgba(255,255,255,0.25);
      padding: var(--space-0.5) var(--space-2);
      border-radius: var(--radius-full);
    }
    .profile-area { font-size: var(--font-xs); opacity: 0.85; margin-top: var(--space-0.5); }

    .profile-stats {
      display: flex; justify-content: space-around;
      margin-top: var(--space-3);
      padding: var(--space-2) var(--space-2);
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-xl);
      position: relative; z-index: 1;
    }
    .stat-item { flex: 1; text-align: center; }
    .stat-num {
      font-size: var(--font-xl); font-weight: var(--font-extrabold);
      font-family: var(--font-family-number);
      background: linear-gradient(135deg, #fff, rgba(255,255,255,0.7));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .stat-label { font-size: var(--font-2xs); opacity: 0.8; margin-top: var(--space-0.5); }

    /* 菜单图标色 */
    .menu-icon.green { background: var(--primary-50); color: var(--primary-700); }
    .menu-icon.blue { background: var(--info-light); color: var(--info-dark); }
    .menu-icon.orange { background: var(--warning-light); color: var(--warning-dark); }
    .menu-icon.red { background: var(--error-light); color: var(--error-dark); }
    .menu-icon.purple { background: var(--purple-bg); color: #7c3aed; }
    .menu-icon.yellow { background: var(--harvest-50); color: var(--harvest-700); }
  </style>
</head>
<body>
  <div class="mb-app">
    <!-- Profile Section — 参照mb_mine -->
    <header class="profile-section">
      <div class="profile-header">
        <div class="avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="profile-info">
          <div class="profile-name-row">

      <div class="profile-stats" id="profileStats">
        <div class="stat-item" onclick="navigateTo('h5_order.html')"><div class="stat-num" id="statOrders">0</div><div class="stat-label">订单</div></div>
        <div class="stat-item" onclick="navigateTo('h5_adoption.html')"><div class="stat-num" id="statAdoptions">0</div><div class="stat-label">认养</div></div>

        <div class="stat-item"><div class="stat-num" id="statPoints">0</div><div class="stat-label">积分</div></div>

    </header>

      <div class="mb-list-item" onclick="navigateTo('h5_adoption.html')">
        <div class="mb-list-icon menu-icon purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div class="mb-list-content"><div class="mb-list-title">我的认养</div></div>
        <div class="mb-list-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>

        </div>

    <div class="mb-list" style="margin: var(--space-4) 0;">
      <div class="mb-list-item" onclick="navigateTo('h5_profile.html')">

        <div class="mb-list-content"><div class="mb-list-title">个人信息</div></div>

    <!-- 退出按钮 -->

    <!-- 底部导航 -->
    <nav class="mb-tab-bar">

  <script>
    function navigateTo(page) { window.location.href = page; }

// 会员中心 4 宫格：从 localStorage 实时统计（H5-B-021）
function readArr(key) {
  try { var v = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}

// 会员等级（与后台 mall_member.html 一致）：消费≥3000 VIP，≥1000 金卡，其余普通
function computeMemberLevel(totalSpend) {
  if (totalSpend >= 3000) return { name: 'VIP会员', min: 3000 };
  if (totalSpend >= 1000) return { name: '金卡会员', min: 1000 };
  return { name: '普通会员', min: 0 };
}

// 仅统计「当前登录用户」的订单总额
function currentUserSpend(orders) {
  var loginUser = sessionStorage.getItem('loginUser') || '';
  if (!Array.isArray(orders) || !orders.length) return 0;
  var s = 0;
  for (var i = 0; i < orders.length; i++) {
    var o = orders[i];
    if (!o) continue;
    var byUser = !loginUser || (o.user === loginUser) || (o.userName === loginUser) || (o.username === loginUser);
    if (!byUser) continue;
    var amt = parseFloat(o.amount || o.totalAmount || o.total || 0);
    if (!isNaN(amt)) s += amt;
  }
  return s;
}

// 仅统计「当前登录用户」的认养数；未登录或无匹配时显示 0
function currentUserAdoptions(all) {
  var loginUser = sessionStorage.getItem('loginUser') || '';
  if (!loginUser || !Array.isArray(all) || !all.length) return 0;
  var n = 0;
  for (var i = 0; i < all.length; i++) {
    var a = all[i];
    if (!a) continue;
    if (a.user === loginUser || a.userName === loginUser || a.username === loginUser) n++;
  }
  return n;
}

function refreshMemberStats() {
  var orders = readArr('h5_orders');
  var favs = readArr('h5_favorites');
  var points = readArr('h5_points').reduce(function(s, p) { return s + (p.amount || 0); }, 0);
  var allAdoptions = readArr('snzg_adoptions');

  // 演示值（仅无任何数据时回填一次），避免污染正常账号的数据
  var isEmptyData = !orders.length && !favs.length && !allAdoptions.length && !points;
  if (isEmptyData) {
    try {
      localStorage.setItem('h5_points', JSON.stringify([{ amount: 1280, source: '消费返积分' }]));
    } catch (e) {}
    points = readArr('h5_points').reduce(function(s, p) { return s + (p.amount || 0); }, 0);
  }

  // 顶部用户信息从 sessionStorage 读取
  var loginUser = sessionStorage.getItem('loginUser') || '';
  var nameEl = document.getElementById('memberName');
  var levelEl = document.getElementById('memberLevel');
  var areaEl = document.getElementById('memberArea');
  if (nameEl) nameEl.textContent = loginUser || '未登录';
  var spend = currentUserSpend(orders);
  var level = computeMemberLevel(spend);
  if (levelEl) levelEl.textContent = level.name;
  var adoptionsN = currentUserAdoptions(allAdoptions);
  if (areaEl) areaEl.textContent = loginUser ? ('已认养 ' + adoptionsN + ' 棵果树') : '请先登录后查看认养数据';

  document.getElementById('statOrders').textContent = orders.length;
  document.getElementById('statAdoptions').textContent = adoptionsN;
  document.getElementById('statFavs').textContent = favs.length;
  document.getElementById('statPoints').textContent = points;
}
document.addEventListener('DOMContentLoaded', refreshMemberStats);
window.addEventListener('storage', function (e) {
  if (e.key && (/^h5_|^snzg_adoptions/).test(e.key)) refreshMemberStats();
});

function confirmLogout() {
  if (!confirm('确定要退出登录吗？')) return;
  ['isLoggedIn', 'loginUser', 'loginRole'].forEach(function(k) { sessionStorage.removeItem(k); });
  localStorage.removeItem('smartorchard_current_user');
  window.location.href = 'trace_intro.html?logout=1';
}
  </script>
