<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>移动商城 - 我的</title>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    /* ========== 页面专属样式 - 参照mb_mine ========== */
    .profile-section {
      background: var(--gradient-header);
      padding: calc(var(--safe-top) + 20px) var(--space-4) var(--space-4);
      color: var(--text-on-primary);
      border-radius: 0 0 var(--radius-xl) var(--radius-xl);
      box-shadow: var(--shadow-header);
      position: relative;
      overflow: hidden;
    }
    .profile-section::before {
      content: '';
      position: absolute;
      top: -50%; right: -30%;
      width: 200px; height: 200px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    .profile-header {
      display: flex; align-items: center; gap: var(--space-4);
      position: relative; z-index: 1;
    }
    .avatar {
      width: 52px; height: 52px;
      border-radius: var(--radius-full);
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(255,255,255,0.3);
      flex-shrink: 0;
    }
    .avatar svg { width: 26px; height: 26px; color: var(--text-on-primary); }
    .profile-info { flex: 1; }
    .profile-name-row { display: flex; align-items: center; gap: var(--space-2); }
    .profile-name { font-size: var(--font-lg); font-weight: var(--font-bold); }
    .role-tag {
      font-size: var(--font-2xs);
      background: rgba(255,255,255,0.25);
      padding: var(--space-0.5) var(--space-2);
      border-radius: var(--radius-full);
    }
    .profile-area { font-size: var(--font-xs); opacity: 0.85; margin-top: var(--space-0.5); }

    .profile-stats {
      display: flex; justify-content: space-around;
      margin-top: var(--space-3);
      padding: var(--space-2) var(--space-2);
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-xl);
      position: relative; z-index: 1;
    }
    .stat-item { flex: 1; text-align: center; }
    .stat-num {
      font-size: var(--font-xl); font-weight: var(--font-extrabold);
      font-family: var(--font-family-number);
      background: linear-gradient(135deg, #fff, rgba(255,255,255,0.7));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .stat-label { font-size: var(--font-2xs); opacity: 0.8; margin-top: var(--space-0.5); }

    /* 菜单图标色 */
    .menu-icon.green { background: var(--primary-50); color: var(--primary-700); }
    .menu-icon.blue { background: var(--info-light); color: var(--info-dark); }
    .menu-icon.orange { background: var(--warning-light); color: var(--warning-dark); }
    .menu-icon.red { background: var(--error-light); color: var(--error-dark); }
    .menu-icon.purple { background: var(--purple-bg); color: #7c3aed; }
    .menu-icon.yellow { background: var(--harvest-50); color: var(--harvest-700); }
  </style>
</head>
<body>
  <div class="mb-app">
    <!-- Profile Section — 参照mb_mine -->
    <header class="profile-section">
      <div class="profile-header">
        <div class="avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="profile-info">
          <div class="profile-name-row">
            <span class="profile-name">刘友宝</span>
            <span class="role-tag">VIP会员</span>
          </div>
          <div class="profile-area">已认养 2 棵果树</div>
        </div>
      </div>
      <div class="profile-stats">
        <div class="stat-item"><div class="stat-num">5</div><div class="stat-label">订单</div></div>
        <div class="stat-item"><div class="stat-num">2</div><div class="stat-label">认养</div></div>
        <div class="stat-item"><div class="stat-num">3</div><div class="stat-label">收藏</div></div>
        <div class="stat-item"><div class="stat-num">128</div><div class="stat-label">积分</div></div>
      </div>
    </header>

    <!-- 功能菜单 -->
    <div class="mb-list" style="margin: var(--space-4) 0;">
      <div class="mb-list-item" onclick="navigateTo('h5_order.html')">
        <div class="mb-list-icon menu-icon orange">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
        </div>
        <div class="mb-list-content"><div class="mb-list-title">我的订单</div></div>
        <div class="mb-list-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
      <div class="mb-list-item" onclick="navigateTo('h5_cart.html')">
        <div class="mb-list-icon menu-icon green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        </div>
        <div class="mb-list-content"><div class="mb-list-title">我的购物车</div></div>
        <div class="mb-list-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
      <div class="mb-list-item" onclick="navigateTo('h5_adoption.html')">
        <div class="mb-list-icon menu-icon purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div class="mb-list-content"><div class="mb-list-title">我的认养</div></div>
        <div class="mb-list-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
      <div class="mb-list-item" onclick="navigateTo('h5_favorites.html')">
        <div class="mb-list-icon menu-icon red">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.09-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.09-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </div>
        <div class="mb-list-content"><div class="mb-list-title">我的收藏</div></div>
        <div class="mb-list-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
    </div>

    <div class="mb-list" style="margin: var(--space-4) 0;">
      <div class="mb-list-item" onclick="navigateTo('h5_profile.html')">
        <div class="mb-list-icon menu-icon blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="mb-list-content"><div class="mb-list-title">个人信息</div></div>
        <div class="mb-list-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
      <div class="mb-list-item" onclick="navigateTo('h5_messages.html')">
        <div class="mb-list-icon menu-icon yellow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div class="mb-list-content"><div class="mb-list-title">我的消息</div></div>
        <div class="mb-list-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
      <div class="mb-list-item" onclick="navigateTo('h5_settings.html')">
        <div class="mb-list-icon menu-icon green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
        <div class="mb-list-content"><div class="mb-list-title">设置</div></div>
        <div class="mb-list-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
    </div>

    <!-- 退出按钮 -->
    <div style="padding: var(--space-4);">
      <button class="mb-btn mb-btn-block" style="border: 1px solid var(--border); color: var(--text-secondary);" onclick="confirmLogout()">退出登录</button>
    </div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('index.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_store.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>商城</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('trace_h5.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>溯源</span>
      </div>
      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </nav>
  </div>

  <script>
    function navigateTo(page) { window.location.href = page; }

    function confirmLogout() {
      if (confirm('确定要退出登录吗？')) { window.location.href = 'trace_intro.html'; }
    }
  </script>
</body>
</html>
