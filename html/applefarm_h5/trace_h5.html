<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>苹果数字履历 - 产品溯源</title>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    /* ========== 页面专属样式 ========== */
    /* 溯源头部 */
    .trace-header {
      background: var(--gradient-header);
      padding: calc(var(--safe-top) + 12px) var(--space-4) var(--space-5);
      color: var(--text-on-primary);
      border-radius: 0 0 var(--radius-xl) var(--radius-xl);
      box-shadow: var(--shadow-header);
      position: relative;
      overflow: hidden;
    }
    .trace-header::before {
      content: '';
      position: absolute;
      top: -30%; right: -15%;
      width: 70%; height: 120%;
      background: radial-gradient(ellipse, rgba(255,255,255,0.10) 0%, transparent 70%);
      pointer-events: none;
    }
    .trace-header > * { position: relative; z-index: 1; }
    .trace-back {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      margin-bottom: var(--space-3);
    }
    .trace-back:active { background: rgba(255,255,255,0.3); }
    .trace-title { font-size: var(--font-xl); font-weight: var(--font-bold); margin-bottom: var(--space-1); }
    .trace-subtitle { font-size: var(--font-sm); opacity: 0.85; }

    /* 溯源信息卡 */
    .trace-product {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: var(--space-4);
      margin: calc(var(--safe-top) + var(--space-4)) var(--space-4) var(--space-4);
      position: relative;
      z-index: 1;
      box-shadow: var(--shadow-lg);
      display: flex; gap: var(--space-4);
    }
    .trace-product-img {
      width: 90px; height: 90px;
      border-radius: var(--radius-lg);
      background: var(--primary-50);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
      flex-shrink: 0;
    }
    .trace-product-info { flex: 1; }
    .trace-product-name { font-size: var(--font-md); font-weight: var(--font-bold); color: var(--text); margin-bottom: var(--space-1); }
    .trace-product-batch { font-size: var(--font-xs); color: var(--text-secondary); font-family: var(--font-family-mono); }
    .trace-product-tags { display: flex; gap: var(--space-1); margin-top: var(--space-2); flex-wrap: wrap; }

    /* 溯源时间线 */
    .timeline { padding: var(--space-4); }
    .timeline-item {
      display: flex;
      gap: var(--space-3);
      position: relative;
      padding-bottom: var(--space-5);
    }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-dot-line {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }
    .timeline-dot {
      width: 12px; height: 12px;
      border-radius: var(--radius-full);
      background: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-100);
      flex-shrink: 0;
      z-index: 1;
    }
    .timeline-dot.pending { background: var(--gray-400); box-shadow: 0 0 0 4px var(--gray-100); }
    .timeline-line {
      width: 2px;
      flex: 1;
      background: var(--border);
      margin-top: 4px;
    }
    .timeline-item:last-child .timeline-line { display: none; }
    .timeline-content {
      flex: 1;
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-3);
      border: 1px solid var(--border);
      min-width: 0;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .timeline-content:active { transform: scale(0.98); border-color: var(--primary-200); }
    .timeline-label {
      font-size: var(--font-sm);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-0.5);
      display: flex; align-items: center; gap: var(--space-2);
    }
    .timeline-time { font-size: var(--font-xs); color: var(--text-tertiary); }
    .timeline-desc { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.5; }
    .timeline-thumb {
      width: 100%;
      height: 80px;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-top: var(--space-2);
    }
    .timeline-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .timeline-detail-btn {
      font-size: var(--font-xs);
      color: var(--primary);
      margin-top: var(--space-2);
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }
    .timeline-detail-btn svg { width: 12px; height: 12px; }

    /* ========== 通用卡片（检测报告 / 基地环境 / 存证） ========== */
    .h5-card {
      background: #fff;
      border: 1px solid #e6efe8;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      color: #5b6b5b;
      line-height: 1.7;
    }
    .h5-card h4 {
      font-size: 14px;
      color: #1f2e1f;
      margin: 0 0 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .kv { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed #eef4ef; }
    .kv:last-child { border-bottom: none; }
    .kv .k { color: #8b9a8b; flex-shrink: 0; }
    .kv .v { color: #1f2e1f; font-weight: 500; text-align: right; word-break: break-all; }
    .chip { display: inline-block; background: #eef7ef; color: #2f7d46; border-radius: 20px; padding: 2px 10px; font-size: 11px; margin: 3px 4px 0 0; }
    .chip.bad { background: #fdecec; color: #c0392b; }
    .scan-tip {
      display: flex; gap: 8px; align-items: flex-start;
      background: #fff; border: 1px solid #e6efe8; border-left: 4px solid var(--primary);
      border-radius: 10px; padding: 10px 12px; font-size: 12px; color: #5b6b5b; line-height: 1.6;
    }
    .scan-tip.warn { border-left-color: #ef4444; }
    .env-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .env-item { background: #f6faf6; border-radius: 10px; padding: 8px 10px; }
    .env-item .lab { font-size: 11px; color: #8b9a8b; }
    .env-item .val { font-size: 15px; color: #1f2e1f; font-weight: 600; margin-top: 2px; }
    .env-item .val small { font-size: 11px; font-weight: 400; color: #8b9a8b; }
    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
    .gallery figure { margin: 0; }
    .gallery img { width: 100%; height: 88px; object-fit: cover; border-radius: 8px; }
    .gallery figcaption { font-size: 11px; color: #8b9a8b; margin-top: 3px; }
    .video-box video { width: 100%; border-radius: 10px; display: block; background: #000; }
    .chain-event { border-top: 1px dashed #e6efe8; padding-top: 8px; margin-top: 8px; font-size: 12px; }
    .chain-event:first-child { border-top: none; padding-top: 0; margin-top: 0; }
    .mono { font-family: monospace; font-size: 11px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="mb-app">
    <!-- 产品信息卡 -->
    <div class="trace-product">
      <div class="trace-product-img"><img src="images/thumb_redfuji.jpg" alt="花牛苹果" style="width:100%;height:100%;object-fit:cover;border-radius:8px;"></div>
      <div class="trace-product-info">
        <div class="trace-product-name" id="productName">花牛苹果</div>
        <div class="trace-product-batch" id="productBatch">批次号: —</div>
        <div class="trace-product-origin" id="productOrigin" style="font-size:12px;color:#8b9a8b;margin:2px 0 6px;"></div>
        <div class="trace-product-tags" id="productTags">
          <span class="mb-tag success">有机认证</span>
          <span class="mb-tag info">绿色食品</span>
          <span class="mb-tag warning">可追溯</span>
        </div>
      </div>
    </div>

    <!-- 溯源码 -->
    <div class="mb-section" style="padding-top:0;">
      <div style="font-size:12px;color:#8b9a8b;">溯源码：<span id="codeText">—</span></div>
      <div style="font-size:12px;color:#8b9a8b;margin-top:2px;">溯码短链：<span id="shortLinkText">—</span></div>
    </div>

    <!-- 扫码验证提示（首查 / 重复查询 / 风控） -->
    <div class="mb-section" id="scanSection" style="display:none;padding-top:0;">
      <div class="scan-tip" id="scanTip"></div>
    </div>

    <!-- 检测报告 -->
    <div class="mb-section">
      <div class="mb-section-title"><span class="mb-section-dot"></span>检测报告</div>
      <div class="h5-card" id="inspectionBox">加载中...</div>
    </div>

    <!-- 溯源时间线（由 js/trace-stages.js 动态渲染：仅展示后台「C 端展示配置」中启用的环节） -->
    <div class="mb-section">
      <div class="mb-section-title"><span class="mb-section-dot"></span>溯源信息</div>
    </div>
    <div class="timeline" id="timelineBox">
      <div style="text-align:center;color:#8b9a8b;font-size:13px;padding:20px;">溯源信息加载中...</div>
    </div>

    <!-- 基地实时环境 -->
    <div class="mb-section">
      <div class="mb-section-title"><span class="mb-section-dot"></span>基地实时环境</div>
      <div class="h5-card" id="environmentBox">加载中...</div>
    </div>

    <!-- 企业信息 -->
    <div class="mb-section">
      <div class="mb-section-title"><span class="mb-section-dot"></span>企业信息</div>
      <div style="background:#fff;border:1px solid #e6efe8;border-radius:12px;padding:12px;font-size:13px;color:#5b6b5b;line-height:1.8;">
        <div>企业名称：天水花牛苹果（集团）有限责任公司</div>
        <div>产地：甘肃省天水市麦积区</div>
        <div>本页面展示内容由该企业提供，溯源数据已在区块链存证。</div>
      </div>
    </div>

    <!-- 区块链存证（H5-B-005） -->
    <div class="mb-section">
      <div class="mb-section-title"><span class="mb-section-dot"></span>区块链存证</div>
      <div id="h5Blockchain" style="background:#fff;border:1px solid #e6efe8;border-radius:12px;padding:12px;font-size:13px;color:#5b6b5b;line-height:1.8;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;">
          <span style="color:#1f2e1f;font-weight:600;">数据指纹（SHA-256）</span>
          <div style="display:flex;gap:6px;">
            <button onclick="downloadEvidencePack()" style="background:#fff;color:var(--primary);border:1px solid var(--primary);padding:6px 12px;border-radius:6px;font-size:12px;">存证包</button>
            <button onclick="verifyOnChain()" style="background:var(--primary);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;">链上验证</button>
          </div>
        </div>
        <div id="h5Hash" style="font-family:monospace;font-size:11px;word-break:break-all;background:#f6f8f6;padding:8px;border-radius:6px;">加载中...</div>
        <div id="h5ChainInfo" style="margin-top:8px;color:#999;font-size:12px;"></div>
        <div id="h5ChainEvents" style="margin-top:8px;"></div>
      </div>
    </div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('index.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_store.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>商城</span>
      </div>
      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>溯源</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_member.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </nav>
  </div>

  <script src="../applefarm_backhand/js/shared/harvest-store.js"></script>
  <script src="../applefarm_backhand/js/shared/trace-store.js"></script>
  <script src="js/trace-stages.js"></script>
  <script>
    /* ============================================================
     * H5 溯源页 —— 由后台溯源编码生成的追溯码驱动
     * 访问方式：trace_h5.html?code=SNZG-20260901-0001
     *           trace_h5.html?c=<短码> （扫描短链二维码进入）
     *           trace_h5.html?tree=A1-001 （从「我的认养」跳入，按果树编号解析批次）
     * 数据统一来自 TraceStore（与后台批次、检测报告、追溯码、存证同源）
     * 展示哪些环节，取决于「后台溯源配置 - C 端展示配置」的启用状态
     * 以及该追溯码绑定的「溯源配置」模板模块
     * ============================================================ */

    /* 批次与追溯码数据统一来自 TraceStore（与后台批次管理、溯源编码同源），
       此处不再维护静态 BATCH_MAP / CODE_MAP，避免多份数据冲突。 */

    // 展示模板 → 展示模块（与后台溯源配置一致）
    const MODULES_BY_TEMPLATE = {
      '标准版履历模板':['基地介绍','种植管理','施肥喷药','农残检测','采摘入库'],
      '精简版履历模板':['基地介绍','采摘入库'],
      '品牌故事版模板':['基地介绍','种植管理','修剪疏果','套袋保护'],
      '有机认证版模板':['基地介绍','种植管理','施肥喷药','农残检测','企业认证'],
      '默认模板':['基地介绍','种植管理','施肥喷药','农残检测','采摘入库','冷链配送']
    };

    // 展示环节：已抽离到 js/trace-stages.js（数据源 localStorage['h5_trace_stages']，
    // 由后台「溯源配置 - C 端展示配置」维护）。此处仅做兜底映射，保证数据层异常时仍可渲染。
    const STAGE_FALLBACK = (window.TraceStages && window.TraceStages.DEFAULT) || [
      { key:'planting',   name:'种植管理', icon:'🌱', img:'images/trace_planting.jpg',   desc:'A1区花牛苹果果园，有机种植，施用有机肥', enabled:true, order:1 },
      { key:'pruning',    name:'修剪疏果', icon:'✂️', img:'images/trace_pruning.jpg',    desc:'采用开心形整形，去除过密枝条，保证通风透光', enabled:true, order:2 },
      { key:'bagging',    name:'套袋保护', icon:'🛡️', img:'images/trace_bagging.jpg',    desc:'使用双层纸袋套袋，防止虫害和农药污染', enabled:true, order:3 },
      { key:'fertilizer', name:'施肥喷药', icon:'🌿', img:'images/trace_fertilizer.jpg', desc:'使用生物有机肥和绿色农药，确保果实安全', enabled:true, order:4 },
      { key:'testing',    name:'农残检测', icon:'🔬', img:'images/trace_testing.jpg',    desc:'采摘前第三方农残检测，全部指标未检出', enabled:true, order:5 },
      { key:'harvest',    name:'采摘入库', icon:'🍎', img:'images/trace_harvest.jpg',    desc:'人工采摘，精选一级果，全程冷链保鲜', enabled:true, order:6 },
      { key:'coldchain',  name:'冷链配送', icon:'🚚', img:'images/trace_coldchain.jpg',  desc:'全程冷链配送，运输温度维持 2-8°C', enabled:true, order:7 }
    ];

    // 环节定义：module 与后台模板模块名一一对应（module 仅用于与模板模块名匹配）
    function getStages() {
      var list = [];
      try {
        list = (window.TraceStages && typeof TraceStages.onSale === 'function') ? TraceStages.onSale() : [];
      } catch (e) { list = []; }
      if (!Array.isArray(list) || !list.length) {
        list = STAGE_FALLBACK.filter(function (s) { return s.enabled !== false; });
      }
      return list.map(function (s) {
        return {
          key: s.key,
          module: s.name || s.key,
          icon: s.icon || '',
          label: s.name || s.key,
          img: s.img || '',
          desc: s.desc || ''
        };
      });
    }

    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function formatDate(d) { return d ? d.replace(/-/g, '.') : '—'; }

    // 以批次采收日期为基准推算各环节时间（种植/修剪/套袋等在前，配送在后）
    const DAY_OFFSET = { planting:-35, pruning:-25, bagging:-15, fertilizer:-3, testing:-1, harvest:0, coldchain:2 };

    function shiftDate(dateStr, days) {
      if (!dateStr) return '—';
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() + days);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function renderNotFound(code) {
      document.getElementById('productName').textContent = '未找到该追溯码';
      document.getElementById('productBatch').textContent = '批次号: —';
      document.getElementById('productOrigin').textContent = '';
      document.getElementById('codeText').textContent = code || '未提供';
      document.getElementById('shortLinkText').textContent = '—';
      document.getElementById('inspectionBox').innerHTML =
        '<div style="color:#c0392b;font-weight:600;">未查询到检测报告</div>' +
        '<div style="font-size:12px;color:#8b9a8b;margin-top:4px;">请确认二维码来源，或联系生产企业核实。</div>';
      document.getElementById('environmentBox').innerHTML =
        '<div style="font-size:12px;color:#8b9a8b;">暂无基地环境数据。</div>';
      document.getElementById('timelineBox').innerHTML =
        '<div style="background:#fff;border:1px solid #e6efe8;border-radius:12px;padding:20px;text-align:center;font-size:13px;color:#8b9a8b;">未查询到该追溯码对应的溯源信息，请确认二维码来源。</div>';
    }

    function renderTrace(code) {
      const timelineBox = document.getElementById('timelineBox');
      const item = (window.TraceStore && code) ? TraceStore.code(code) : null;

      if (!item) {
        renderNotFound(code);
        return;
      }

      currentTraceCode = item.code;
      const batch = TraceStore.batch(item.batch) || {};
      const template = item.template || '默认模板';
      const modules = MODULES_BY_TEMPLATE[template] || MODULES_BY_TEMPLATE['默认模板'];

      document.getElementById('productName').textContent = batch.product || item.product || '苹果';
      document.getElementById('productBatch').textContent = '批次号：' + (item.batch || '—');
      document.getElementById('productOrigin').textContent =
        (batch.base || '—') + ' / ' + (batch.plotCode || item.plotCode || '—') + ' · ' + (batch.plotName || '—') +
        '　规格：' + (batch.spec || '—') + (batch.variety ? '　品种：' + batch.variety : '');
      document.getElementById('codeText').textContent = item.code;
      document.getElementById('shortLinkText').textContent = TraceStore.shortUrlOf(item);

      // 缓存批次采收日期，供详情页按同一规则推算各环节时间
      try {
        var cache = JSON.parse(sessionStorage.getItem('trace_batch_cache') || '{}');
        cache[item.code] = batch.harvestDate || null;
        sessionStorage.setItem('trace_batch_cache', JSON.stringify(cache));
      } catch (e) {}

      const ins = TraceStore.inspectionState(item.batch);
      document.getElementById('productTags').innerHTML =
        (ins.hasValid
          ? '<span class="mb-tag success">检测合格</span>'
          : '<span class="mb-tag" style="background:#fdecec;color:#c0392b;">检测报告待补</span>') +
        '<span class="mb-tag info">绿色种植</span>' +
        '<span class="mb-tag warning">可追溯</span>';

      renderInspection(item.batch);
      renderEnvironment(item.batch);
      renderH5Blockchain(item.code);

      const stages = getStages();
      // 先按后台「C 端展示配置」的启用状态过滤，再按该批次模板模块过滤

    // 简化 SHA-256（与 trace_blockchain.html 一致）
    function sha256HexH5(s) {
      function ror(x, n) { return (x >>> n) | (x << (32 - n)); }
      var h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
      var bytes=[]; for(var i=0;i<s.length;i++) bytes.push(s.charCodeAt(i)&0xff);
      bytes.push(0x80); while(bytes.length%64!==56) bytes.push(0);
      var bl=s.length*8;
      bytes.push((bl>>>56)&0xff); bytes.push((bl>>>48)&0xff); bytes.push((bl>>>40)&0xff); bytes.push((bl>>>32)&0xff);
      bytes.push((bl>>>24)&0xff); bytes.push((bl>>>16)&0xff); bytes.push((bl>>>8)&0xff); bytes.push(bl&0xff);
      for(var off=0; off<bytes.length; off+=64) {
        var w=[]; for(var k=0;k<16;k++) w[k]=(bytes[off+k*4]<<24)|(bytes[off+k*4+1]<<16)|(bytes[off+k*4+2]<<8)|bytes[off+k*4+3];
        for(var j=16;j<64;j++) {
          var s0=ror(w[j-15],7)^ror(w[j-15],18)^(w[j-15]>>>3);
          var s1=ror(w[j-2],17)^ror(w[j-2],19)^(w[j-2]>>>10);
          w[j]=(w[j-16]+s0+w[j-7]+s1)|0;
        }
        var a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,hh=h7;
        for(var j2=0;j2<64;j2++) {
          var S1=ror(e,6)^ror(e,11)^ror(e,25);
          var ch=(e&f)^(~e&g);
          var t1=(hh+S1+ch+[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2][j2]+w[j2])|0;
          var S0=ror(a,2)^ror(a,13)^ror(a,22);
          var mj=(a&b)^(a&c)^(b&c);
          var t2=(S0+mj)|0;
          hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
        }
        h0=(h0+a)|0;h1=(h1+b)|0;h2=(h2+c)|0;h3=(h3+d)|0;
        h4=(h4+e)|0;h5=(h5+f)|0;h6=(h6+g)|0;h7=(h7+hh)|0;
      }
      function pad(n){return (n<0?n+0x100000000:n).toString(16).padStart(8,'0');}
      return pad(h0)+pad(h1)+pad(h2)+pad(h3)+pad(h4)+pad(h5)+pad(h6)+pad(h7);
    }
    /* ========== 检测报告 ========== */

    /* ========== 区块链存证 ========== */
    var currentChainEvent = null;
    var currentTraceCode = '';
    function downloadEvidencePack() {
      if (!window.TraceStore || !currentTraceCode) return;
      var item = TraceStore.code(currentTraceCode);
      if (!item) return;
      var data = TraceStore.exportEvidence(item.batch);
      if (!data) return;
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'trace_evidence_' + item.batch + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    function renderH5Blockchain(codeStr) {
      var hashEl = document.getElementById('h5Hash');
      var infoEl = document.getElementById('h5ChainInfo');
      var listEl = document.getElementById('h5ChainEvents');
      if (!window.TraceStore) {
        if (hashEl) hashEl.textContent = '存证数据加载失败';
        return;
      }
      var item = TraceStore.code(codeStr);
      var evs = [];
      if (item) {
        var all = TraceStore.events();
        evs = all.filter(function (e) { return e.code === item.code; });
        if (!evs.length) evs = all.filter(function (e) { return e.batchNo === item.batch; });
      }
      evs.sort(function (a, b) { return (a.blockHeight || 0) - (b.blockHeight || 0); });
      currentChainEvent = evs.length ? evs[evs.length - 1] : null;

      if (!currentChainEvent) {
        if (hashEl) hashEl.textContent = '暂无存证记录';
        if (infoEl) infoEl.textContent = '';
        if (listEl) listEl.textContent = '';
        return;
      }

      if (hashEl) hashEl.textContent = currentChainEvent.hash;
      if (infoEl) infoEl.innerHTML = '区块高度：<b>' + currentChainEvent.blockHeight + '</b> · 上链时间：' + escHtml(currentChainEvent.chainTime) +
        ' · 状态：<b style="color:var(--primary);">已确认</b>';

      if (listEl) {
        listEl.innerHTML = evs.slice(-4).reverse().map(function (e) {
          return '<div class="chain-event"><div style="display:flex;justify-content:space-between;gap:8px;">' +
            '<b style="color:#1f2e1f;">' + escHtml(e.title) + '</b>' +
            '<span style="color:#8b9a8b;font-size:11px;">高度 ' + e.blockHeight + '</span></div>' +
            '<div style="color:#8b9a8b;font-size:11px;">' + escHtml(e.summary || '') + '</div>' +
            '<div class="mono" style="color:#8b9a8b;margin-top:2px;">HASH ' + escHtml(String(e.hash || '').slice(0, 32)) + '…</div></div>';
        }).join('');
      }
    }
    function verifyOnChain() {
      var info = document.getElementById('h5ChainInfo');
      if (!info) return;
      if (!currentChainEvent) { info.innerHTML = '<span style="color:#c0392b;">暂无可验证的存证事件</span>'; return; }
      info.innerHTML = '<span style="color:#f59e0b;">验证中...</span>';
      setTimeout(function () {
        var r = window.TraceStore ? TraceStore.verifyEvent(currentChainEvent.id) : { ok: false, reason: '存证数据不可用' };
        info.innerHTML = r.ok
          ? '<span style="color:#2f7d46;">✓ 链上验证通过</span> · 事件哈希与前序区块连续'
          : '<span style="color:#c0392b;">✕ 验证失败：' + escHtml(r.reason) + '</span>';
      }, 600);
    }

    /* ========== 扫码验证（首查 / 重复查询 / 风控） ========== */
    function recordH5Scan(codeStr) {
      if (!window.TraceStore) return;
      var item = TraceStore.code(codeStr);
      if (!item) return;
      var res = TraceStore.recordScan(item.code, { source: 'H5', device: 'H5 扫码', region: '甘肃省天水市' });
      var sec = document.getElementById('scanSection');
      var tip = document.getElementById('scanTip');
      if (!sec || !tip || !res.ok) return;
      sec.style.display = 'block';
      tip.className = 'scan-tip' + (res.risk ? ' warn' : '');
      tip.innerHTML = res.firstScan
        ? '<span style="font-size:16px;">✅</span><div><b style="color:#2f7d46;">首次查询，验证为正品首次查询</b><br>查询时间：' + escHtml(res.lastQuery || '') + '</div>'
        : '<span style="font-size:16px;">ℹ️</span><div>该码已累计查询 <b>' + res.queries + '</b> 次，最后查询：' + escHtml(res.lastQuery || '') +
          (res.risk ? '<br><span style="color:#ef4444;">' + escHtml(res.riskReason) + '</span>' : '') + '</div>';
    }

    /* ========== 追溯码解析（L-6）==========
       「我的认养」卡片跳转本页时带的是果树编号（?tree=A1-001），而本页历史上只认 ?code=，
       导致从认养页点「查看溯源」永远落到默认批次。此处统一解析入口参数：
         1) ?code= 有效追溯码 → 直接使用；
         2) ?tree= 本身就是一个追溯码 → 直接使用；
         3) ?tree= 对应的认养记录里显式绑定了 traceCode/batchCode → 使用该批次；
         4) 兜底：按编号中的数字稳定映射到某个批次，保证同一棵树每次访问结果一致；
         5) 两者都缺省 → 默认批次 SNZG-20260901-0001。 */
    function findBoundCode(tree) {
      var keys = ['snzg_adoptions', 'h5_adoptions'];
      var norm = function (v) { return String(v == null ? '' : v).trim().replace(/^AD-/i, '').trim(); };
      var want = norm(tree);
      for (var i = 0; i < keys.length; i++) {
        var arr = [];
        try {
          var v = JSON.parse(localStorage.getItem(keys[i]) || '[]');
          if (Array.isArray(v)) arr = v;
        } catch (e) { arr = []; }
        for (var j = 0; j < arr.length; j++) {
          var r = arr[j] || {};
          if (norm(r.id) === want || norm(r.treeNo) === want) {
            return r.traceCode || r.batchCode || r.code || '';
          }
        }
      }
      return '';
    }

    function resolveTraceCode(params) {
      // ?code= 完整追溯码；?c= 短码；两者都交给 TraceStore 统一识别
      var raw = (params.get('code') || params.get('c') || '').trim();
      if (raw) return raw;

      var tree = (params.get('tree') || '').trim();
      var codes = window.TraceStore ? TraceStore.codes() : [];
      if (!tree) return codes.length ? codes[0].code : '';
      if (window.TraceStore && TraceStore.code(tree)) return tree;

      var bound = findBoundCode(tree);
      if (bound && window.TraceStore && TraceStore.code(bound)) return bound;

      if (!codes.length) return '';
      var digits = tree.replace(/[^0-9]/g, '');
      var idx;
      if (digits) {
        idx = parseInt(digits, 10);
      } else {
        var h = 0;
        for (var i = 0; i < tree.length; i++) h = (h * 31 + tree.charCodeAt(i)) >>> 0;
        idx = h;
      }
      return codes[idx % codes.length].code;
    }

    document.addEventListener('DOMContentLoaded', function() {
      const params = new URLSearchParams(window.location.search);
      const raw = resolveTraceCode(params);
      const item = (window.TraceStore && raw) ? TraceStore.code(raw) : null;
      const code = item ? item.code : raw;
      renderTrace(code);
      if (item) recordH5Scan(item.code);

      // 后台调整「C 端展示配置」后，同源其他标签页可实时同步时间线
      if (window.TraceStages && typeof TraceStages.subscribe === 'function') {
        TraceStages.subscribe(function() { renderTrace(code); });
      }
    });
  </script>
