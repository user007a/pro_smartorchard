<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>溯源详情 - 智慧果园</title>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    .detail-header {
      background: var(--gradient-header);
      padding: calc(var(--safe-top) + 12px) var(--space-4) var(--space-5);
      color: var(--text-on-primary);
      border-radius: 0 0 var(--radius-xl) var(--radius-xl);
      box-shadow: var(--shadow-header);
      position: relative;
      overflow: hidden;
    }
    .detail-header::before {
      content: '';
      position: absolute;
      top: -30%; right: -15%;
      width: 70%; height: 120%;
      background: radial-gradient(ellipse, rgba(255,255,255,0.10) 0%, transparent 70%);
      pointer-events: none;
    }
    .detail-header > * { position: relative; z-index: 1; }
    .header-nav {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }
    .header-back {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .header-back:active { background: rgba(255,255,255,0.3); }
    .header-title { font-size: var(--font-lg); font-weight: var(--font-bold); }
    .detail-title { font-size: var(--font-xl); font-weight: var(--font-bold); margin-bottom: var(--space-1); }
    .detail-date { font-size: var(--font-sm); opacity: 0.85; }

    .detail-content { padding: var(--space-4); }

    .detail-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      border: 1px solid var(--border);
    }

    .detail-img-box {
      width: 100%;
      height: 200px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: var(--space-4);
    }
    .detail-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info-row {
      display: flex;
      align-items: center;
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-light);
    }
    .info-row:last-child { border-bottom: none; }
    .info-label {
      width: 80px;
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }
    .info-value {
      flex: 1;
      font-size: var(--font-sm);
      color: var(--text);
      font-weight: var(--font-medium);
    }

    .detail-desc {
      font-size: var(--font-base);
      color: var(--text);
      line-height: 1.8;
      margin-top: var(--space-4);
    }

    .detail-tags {
      display: flex;
      gap: var(--space-2);
      margin-top: var(--space-4);
    }
  </style>
</head>
<body>
  <div class="mb-app">
    <header class="detail-header">
      <div class="header-nav">
        <div class="header-back" onclick="history.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
        <div class="header-title">溯源详情</div>
      </div>
      <div class="detail-title" id="pageTitle">种植管理</div>
      <div class="detail-date" id="pageDate">2026.09.15</div>
    </header>

    <div class="detail-content">
      <div class="detail-card">
        <div class="detail-img-box">
          <img id="pageImg" src="https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=600&h=400&fit=crop" alt="">
        </div>
        <div class="info-row">
          <span class="info-label">日期</span>
          <span class="info-value" id="infoDate">2026.09.15</span>
        </div>
        <div class="info-row">
          <span class="info-label">地点</span>
          <span class="info-value" id="infoLocation">A1区花牛苹果果园</span>
        </div>
        <div class="info-row">
          <span class="info-label">负责人</span>
          <span class="info-value" id="infoWorker">张师傅</span>
        </div>
        <div class="info-row">
          <span class="info-label">操作类型</span>
          <span class="info-value" id="infoType">种植管理</span>
        </div>
        <div class="detail-desc" id="pageDesc">A1区花牛苹果果园位于海拔1200米的高原地带，年均气温12°C，昼夜温差大，非常适合苹果糖分积累。果园采用有机种植方式，施用发酵牛羊粪有机肥，每亩施用量达3吨。灌溉水源来自山顶无污染的山泉水，确保水源纯净。果园通过有机认证转换期，2026年正式获得有机产品认证证书。</div>
        <div class="detail-tags" id="pageTags">
          <span class="mb-tag success">有机认证</span>
          <span class="mb-tag info">绿色种植</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    var traceDetails = {
      planting: { title: '种植管理', date: '2026.09.15', content: 'A1区花牛苹果果园位于海拔1200米的高原地带，年均气温12°C，昼夜温差大，非常适合苹果糖分积累。果园采用有机种植方式，施用发酵牛羊粪有机肥，每亩施用量达3吨。灌溉水源来自山顶无污染的山泉水，确保水源纯净。果园通过有机认证转换期，2026年正式获得有机产品认证证书。', location: 'A1区花牛苹果果园', worker: '张师傅', img: 'https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=600&h=400&fit=crop', tags: ['有机认证', '绿色种植'] },
      pruning: { title: '修剪疏果', date: '2026.09.20', content: '春季修剪主要采用开心形整形方式，去除过密枝条，保证树体通风透光。第一次疏果在花后15天进行，每20cm保留一个中心果，确保果实有足够的生长空间。修剪工具每次使用前都经过消毒处理，避免病虫害传播。', location: 'A1区花牛苹果果园', worker: '李师傅', img: 'https://images.unsplash.com/photo-1585307563661-40b51b4e62a8?w=600&h=400&fit=crop', tags: ['专业修剪', '科学疏果'] },
      bagging: { title: '套袋保护', date: '2026.09.18', content: '采用双层纸袋套袋技术，外层为棕色木浆纸，内层为红色涂蜡纸。套袋可有效防止苹果小象甲虫、卷叶虫等害虫入侵，同时减少农药残留。套袋前进行一次全面病虫害防治，确保果实无病虫害附着。', location: 'A1区花牛苹果果园', worker: '王师傅', img: 'https://images.unsplash.com/photo-1594282486552-05b4d80fbb9f?w=600&h=400&fit=crop', tags: ['双层纸袋', '无农药'] },
      fertilizer: { title: '施肥喷药', date: '2026.09.25', content: '使用生物有机肥配合叶面肥进行追施，肥料为发酵菜籽饼和腐植酸钾。农药采用绿色防控技术，使用苦参碱等植物源农药和捕食螨等生物防治方法，确保果实零化学农药残留。所有投入品均符合有机标准。', location: 'A1区花牛苹果果园', worker: '张师傅', img: 'https://images.unsplash.com/photo-1591857177580-dc82b9ac4e1e?w=600&h=400&fit=crop', tags: ['生物有机肥', '绿色防控'] },
      testing: { title: '农残检测', date: '2026.09.10', content: '采摘前进行第三方农残检测，共检测68项农药残留指标，全部未检出。检测报告显示所有指标均符合GB/T 19630有机产品标准和欧盟有机标准。检测报告编号：OTRC-2026-0910-001。', location: 'SGS检测中心', worker: '检测员王', img: 'https://images.unsplash.com/photo-1582719471384-894fbb16e074?w=600&h=400&fit=crop', tags: ['第三方检测', '68项指标'] },
      harvest: { title: '采摘入库', date: '2026.09.12', content: '采用人工采摘方式，采摘人员佩戴一次性手套，使用专用采摘剪带果柄采下。采摘时轻拿轻放，避免机械损伤。采摘后2小时内入库，预冷温度设定为2-4°C。精选一级果（直径≥75mm）进行包装。', location: 'A1区花牛苹果果园', worker: '采摘队', img: 'https://images.unsplash.com/photo-1568702846914-96b305d2ebb1?w=600&h=400&fit=crop', tags: ['人工采摘', '冷链入库'] },
      coldchain: { title: '冷链配送', date: '2026.09.15', content: '采用全程冷链配送，运输车厢温度全程维持在2-8°C。包装采用食品级保鲜盒+冰袋双重保护。物流信息实时追踪，客户可通过溯源系统查看配送进度。预计配送时效：省会城市2-3天，地级城市3-5天。', location: '冷链物流中心', worker: '物流司机', img: 'https://images.unsplash.com/photo-1494412574643-ff11b0a5c1c3?w=600&h=400&fit=crop', tags: ['全程冷链', '实时追踪'] }
    };

    function loadDetail() {
      var params = new URLSearchParams(window.location.search);
      var type = params.get('type') || 'planting';
      var detail = traceDetails[type];
      if (!detail) return;

      document.getElementById('pageTitle').textContent = detail.title;
      document.getElementById('pageDate').textContent = detail.date;
      document.getElementById('pageImg').src = detail.img;
      document.getElementById('infoDate').textContent = detail.date;
      document.getElementById('infoLocation').textContent = detail.location;
      document.getElementById('infoWorker').textContent = detail.worker;
      document.getElementById('infoType').textContent = detail.title;
      document.getElementById('pageDesc').textContent = detail.content;

      var tagsHtml = '';
      detail.tags.forEach(function(tag) {
        tagsHtml += '<span class="mb-tag success">' + tag + '</span>';
      });
      document.getElementById('pageTags').innerHTML = tagsHtml;
    }

    loadDetail();
  </script>
</body>
</html>
