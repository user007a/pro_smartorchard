<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>溯源详情 - 移动商城</title>
  <script src="js/h5-back.js"></script>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    .detail-header {
      background: var(--gradient-header);
      padding: var(--space-4) var(--space-4) var(--space-5);
      color: var(--text-on-primary);
      border-radius: 0 0 var(--radius-xl) var(--radius-xl);
      box-shadow: var(--shadow-header);
      position: relative;
      overflow: hidden;
    }
    .detail-header::before {
      content: '';
      position: absolute;
      top: -30%; right: -15%;
      width: 70%; height: 120%;
      background: radial-gradient(ellipse, rgba(255,255,255,0.10) 0%, transparent 70%);
      pointer-events: none;
    }
    .detail-header > * { position: relative; z-index: 1; }
    .header-nav {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }
    .header-back {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .header-back:active { background: rgba(255,255,255,0.3); }
    .header-title { font-size: var(--font-lg); font-weight: var(--font-bold); }
    .detail-title { font-size: var(--font-xl); font-weight: var(--font-bold); margin-bottom: var(--space-1); }
    .detail-date { font-size: var(--font-sm); opacity: 0.85; }

    .detail-content { padding: var(--space-4); }

    .detail-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      border: 1px solid var(--border);
    }

    .detail-img-box {
      width: 100%;
      height: 200px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: var(--space-4);
    }
    .detail-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info-row {
      display: flex;
      align-items: center;
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-light);
    }
    .info-row:last-child { border-bottom: none; }
    .info-label {
      width: 80px;
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }
    .info-value {
      flex: 1;
      font-size: var(--font-sm);
      color: var(--text);
      font-weight: var(--font-medium);
    }

    .detail-desc {
      font-size: var(--font-base);
      color: var(--text);
      line-height: 1.8;
      margin-top: var(--space-4);
    }

    .detail-tags {
      display: flex;
      gap: var(--space-2);
      margin-top: var(--space-4);
    }
  /* 环节已被后台停用时的友好提示 */
    .stage-offline-tip {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: var(--space-6, 24px);
      text-align: center;
      color: var(--text-secondary);
      font-size: var(--font-sm);
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="mb-app">
    <!-- 返回栏 -->
    <div class="mb-back-bar">
      <button class="mb-back-arrow" type="button" onclick="H5Back.go('trace_h5.html')" aria-label="返回上一页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="mb-back-title">溯源详情</div>
    </div>

    <header class="detail-header">
      <div class="detail-title" id="pageTitle">溯源详情</div>
      <div class="detail-date" id="pageDate"></div>
    </header>
    <div class="detail-content">
      <div class="stage-offline-tip" id="stageTip" style="display:none;"></div>
      <div class="detail-card" id="detailCard">
        <div class="detail-img-box" id="pageImgBox" style="display:none;">
          <img id="pageImg" src="" alt="">
        </div>
        <div class="info-row">
          <span class="info-label">日期</span>
          <span class="info-value" id="infoDate">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">地点</span>
          <span class="info-value" id="infoLocation">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">负责人</span>
          <span class="info-value" id="infoWorker">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">操作类型</span>
          <span class="info-value" id="infoType">—</span>
        </div>
        <div class="detail-desc" id="pageDesc">正在加载…</div>
        <div class="detail-tags" id="pageTags"></div>
      </div>
    </div>
  </div>

  <script src="../applefarm_backhand/js/shared/harvest-store.js"></script>
  <script src="../applefarm_backhand/js/shared/trace-store.js"></script>
  <script src="js/h5-data.js"></script>
  <script src="js/trace-stages.js"></script>
  <script>
    (function () {
      'use strict';

      var params = new URLSearchParams(window.location.search);
      var stageKey = params.get('type') || '';
      var traceCode = params.get('code') || '';

      function setText(id, value) {
        var el = document.getElementById(id);
        if (el) el.textContent = value == null || value === '' ? '—' : value;
      }
      function setRaw(id, value) {
        var el = document.getElementById(id);
        if (el) el.textContent = value == null ? '' : value;
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function shiftDate(dateStr, days) {
        if (!dateStr) return '';
        var d = new Date(String(dateStr).slice(0, 10) + 'T00:00:00');
        if (isNaN(d.getTime())) return '';
        d.setDate(d.getDate() + (Number(days) || 0));
        var pad = function (n) { return String(n).padStart(2, '0'); };
        return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate());
      }

      /* 批次信息（sf_trace_batch）：code 既可能是追溯码，也可能是批次号 */
      function batchOf(code) {
        if (!window.TraceStore || !code) return null;
        try {
          var item = TraceStore.code(code);
          if (item) return TraceStore.batch(item.batch) || null;
          return TraceStore.batch(code) || null;
        } catch (e) { return null; }
      }

      function stageOf(key) {
        if (!window.TraceStages || typeof TraceStages.get !== 'function') return null;
        try { return TraceStages.get(key); } catch (e) { return null; }
      }

      function showTip(html) {
        var tip = document.getElementById('stageTip');
        var card = document.getElementById('detailCard');
        if (tip) { tip.innerHTML = html; tip.style.display = ''; }
        if (card) card.style.display = 'none';
      }
      function hideTip() {
        var tip = document.getElementById('stageTip');
        var card = document.getElementById('detailCard');
        if (tip) { tip.innerHTML = ''; tip.style.display = 'none'; }
        if (card) card.style.display = '';
      }

      function showOfflineTip(stage) {
        showTip(
          '<div style="font-size:28px;margin-bottom:8px;">🌱</div>' +
          '<div style="font-weight:600;color:var(--text);margin-bottom:6px;">该环节已停止对外展示</div>' +
          '<div>「' + esc(stage.title) + '」当前未在溯源流程中开放，' +
          '若需查看完整履历，请返回溯源页查看已开放的环节。</div>' +
          '<div style="margin-top:14px;">' +
            '<button onclick="history.back()" ' +
            'style="background:var(--primary);color:#fff;border:none;padding:8px 20px;border-radius:8px;font-size:13px;">返回溯源页</button>' +
          '</div>'
        );
      }

      function render() {
        var stage = stageOf(stageKey);
        if (!stage) {
          setRaw('pageTitle', '溯源环节');
          setRaw('pageDate', '');
          showTip('未找到该溯源环节的信息，请返回溯源页重新选择。');
          return;
        }

        setRaw('pageTitle', stage.title);
        setRaw('pageDate', '');

        if (stage.enabled === false) {
          showOfflineTip(stage);
          return;
        }

        var batch = batchOf(traceCode) || {};
        var dateText = shiftDate(batch.harvestDate, stage.dayOffset);

        hideTip();
        setRaw('pageDate', dateText || '');
        setText('infoDate', dateText);
        setText('infoLocation', stage.location || [batch.base, batch.plotName].filter(Boolean).join(' / '));
        setText('infoWorker', stage.operator);
        setText('infoType', stage.title);
        setText('pageDesc', stage.detail || stage.desc);

        var imgBox = document.getElementById('pageImgBox');
        var imgEl = document.getElementById('pageImg');
        if (stage.img && imgEl && imgBox) {
          var src = /^(images\/|https?:|data:)/i.test(stage.img) ? stage.img : 'images/' + stage.img.replace(/^\.?\/?(images\/)?/i, '');
          imgEl.setAttribute('src', src);
          imgEl.setAttribute('alt', stage.title || '');
          imgBox.style.display = '';
        } else if (imgBox) {
          imgBox.style.display = 'none';
        }

        var tags = Array.isArray(stage.tags) ? stage.tags : [];
        var tagsEl = document.getElementById('pageTags');
        if (tagsEl) {
          tagsEl.innerHTML = tags.map(function (t) {
            return '<span class="mb-tag success">' + esc(t) + '</span>';
          }).join('');
          tagsEl.style.display = tags.length ? '' : 'none';
        }
      }

      // 环节配置与批次信息均为异步到达，到达后重绘
      if (window.TraceStages && TraceStages.ready && typeof TraceStages.ready.then === 'function') {
        TraceStages.ready.then(render);
      } else {
        render();
      }
      if (window.TraceStages && typeof TraceStages.subscribe === 'function') {
        TraceStages.subscribe(render);
      }
      window.addEventListener('traceStoreChange', render);
    })();
  </script>
</body>
</html>
