﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>移动商城 - 订单管理</title>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    /* ========== 页面专属样式 ========== */
    /* 订单标签筛选 */
    .order-tabs {
      display: flex;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: var(--z-sticky-header);
    }
    .order-tab {
      flex: 1;
      padding: var(--space-3) 0;
      text-align: center;
      font-size: var(--font-sm);
      color: var(--text-secondary);
      font-weight: var(--font-medium);
      cursor: pointer;
      position: relative;
      transition: color var(--transition-fast);
      min-height: 44px;
      display: flex; align-items: center; justify-content: center;
    }
    .order-tab.active {
      color: var(--primary);
      font-weight: var(--font-semibold);
    }
    .order-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 30%; right: 30%;
      height: 3px;
      background: var(--gradient-primary);
      border-radius: 3px 3px 0 0;
    }

    /* 订单卡片 */
    .order-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin: var(--space-3) var(--space-4);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .order-card:active { transform: scale(0.99); }
    .order-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: var(--space-3);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--border-light);
    }
    .order-no { font-size: var(--font-xs); color: var(--text-secondary); font-family: var(--font-family-mono); }
    .order-items { display: flex; gap: var(--space-2); margin-bottom: var(--space-3); }
    .order-item-img {
      width: 56px; height: 56px;
      border-radius: var(--radius-md);
      background: var(--primary-50);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex-shrink: 0;
      overflow: hidden;
    }
    .order-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .order-info { flex: 1; min-width: 0; }
    .order-name {
      font-size: var(--font-base); font-weight: var(--font-semibold); color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .order-spec { font-size: var(--font-xs); color: var(--text-secondary); margin-top: 2px; }
    .order-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: var(--space-2);
      border-top: 1px solid var(--border-light);
    }
    .order-total { font-size: var(--font-sm); color: var(--text-secondary); }
    .order-total strong { color: var(--error); font-size: var(--font-md); font-weight: var(--font-extrabold); font-family: var(--font-family-number); }
    .order-actions { display: flex; gap: var(--space-2); }
  </style>
</head>
<body>
  <div class="mb-app">

    <!-- 订单标签 -->
    <div class="order-tabs">
      <div class="order-tab active">全部</div>
      <div class="order-tab">待付款</div>
      <div class="order-tab">待发货</div>
      <div class="order-tab">待收货</div>
      <div class="order-tab">已完成</div>
    </div>

    <!-- 订单列表 -->
    <div class="order-card">
      <div class="order-header">
        <span class="order-no">SN20260614001</span>
        <span class="mb-tag warning">待发货</span>
      </div>
      <div class="order-items">
        <div class="order-item-img"><img src="images/thumb_apple5kg.jpg" alt="花牛苹果"></div>
        <div class="order-info">
          <div class="order-name">花牛苹果 5斤装</div>
          <div class="order-spec">脆甜多汁 · 新鲜采摘 × 1</div>
        </div>
      </div>
      <div class="order-footer">
        <div class="order-total">共1件 合计 <strong>¥68</strong></div>
        <div class="order-actions">
          <button class="mb-btn mb-btn-sm mb-btn-secondary">查看详情</button>
        </div>
      </div>
    </div>

    <div class="order-card">
      <div class="order-header">
        <span class="order-no">SN20260612003</span>
        <span class="mb-tag success">已完成</span>
      </div>
      <div class="order-items">
        <div class="order-item-img"><img src="images/thumb_giftbox.jpg" alt="精品礼盒"></div>
        <div class="order-info">
          <div class="order-name">精品礼盒装 8斤</div>
          <div class="order-spec">送礼佳品 · 品质保证 × 1</div>
        </div>
      </div>
      <div class="order-footer">
        <div class="order-total">共1件 合计 <strong>¥168</strong></div>
        <div class="order-actions">
          <button class="mb-btn mb-btn-sm mb-btn-secondary">再次购买</button>
        </div>
      </div>
    </div>

    <div class="order-card">
      <div class="order-header">
        <span class="order-no">SN20260610005</span>
        <span class="mb-tag info">待收货</span>
      </div>
      <div class="order-items">
        <div class="order-item-img"><img src="images/thumb_picked.jpg" alt="认养套餐"></div>
        <div class="order-info">
          <div class="order-name">认养果树3年套餐</div>
          <div class="order-spec">专属果树 · 全程溯源 × 1</div>
        </div>
      </div>
      <div class="order-footer">
        <div class="order-total">共1件 合计 <strong>¥1,888</strong></div>
        <div class="order-actions">
          <button class="mb-btn mb-btn-sm mb-btn-secondary">查看物流</button>
        </div>
      </div>
    </div>

    <div class="order-card">
      <div class="order-header">
        <span class="order-no">SN20260608002</span>
        <span class="mb-tag error">待付款</span>
      </div>
      <div class="order-items">
        <div class="order-item-img"><img src="images/thumb_red_hanging.jpg" alt="花牛苹果"></div>
        <div class="order-info">
          <div class="order-name">花牛苹果 5斤装</div>
          <div class="order-spec">酸甜可口 · 皮薄肉嫩 × 2</div>
        </div>
      </div>
      <div class="order-footer">
        <div class="order-total">共2件 合计 <strong>¥116</strong></div>
        <div class="order-actions">
          <button class="mb-btn mb-btn-sm mb-btn-secondary">取消</button>
          <button class="mb-btn mb-btn-sm mb-btn-primary">去付款</button>
        </div>
      </div>
    </div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar">
      <div class="mb-tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_store.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>商城</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('trace_h5.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>溯源</span>
      </div>
      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
        <span>订单</span>
      </div>
    </nav>
  </div>

  <script>
    function navigateTo(page) { window.location.href = page; }

    // 标签切换
    document.querySelectorAll('.order-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.order-tab').forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
