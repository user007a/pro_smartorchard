<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>移动商城 - 订单管理</title>
  <script src="js/h5-auth.js"></script>
  <script>H5Auth.require();</script>
  <script src="js/h5-back.js"></script>
  <script src="../applefarm_backhand/js/shared/adoption-store.js"></script>
  <script src="js/h5-data.js"></script>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    /* ========== 页面专属样式 ========== */
    /* 订单标签筛选 */
    .order-tabs {
      display: flex;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: calc(var(--header-height) + var(--safe-top));
      z-index: var(--z-sticky-header);
    }
    .order-tab {
      flex: 1;
      padding: var(--space-3) 0;
      text-align: center;
      font-size: var(--font-sm);
      color: var(--text-secondary);
      font-weight: var(--font-medium);
      cursor: pointer;
      position: relative;
      transition: color var(--transition-fast);
      min-height: 44px;
      display: flex; align-items: center; justify-content: center;
    }
    .order-tab.active {
      color: var(--primary);
      font-weight: var(--font-semibold);
    }
    .order-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 30%; right: 30%;
      height: 3px;
      background: var(--gradient-primary);
      border-radius: 3px 3px 0 0;
    }

    /* 订单卡片 */
    .order-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin: var(--space-3) var(--space-4);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .order-card:active { transform: scale(0.99); }
    .order-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: var(--space-3);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--border-light);
    }
    .order-no { font-size: var(--font-xs); color: var(--text-secondary); font-family: var(--font-family-mono); }
    .order-items { display: flex; gap: var(--space-2); margin-bottom: var(--space-3); }
    .order-item-img {
      width: 56px; height: 56px;
      border-radius: var(--radius-md);
      background: var(--primary-50);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex-shrink: 0;
      overflow: hidden;
    }
    .order-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .order-info { flex: 1; min-width: 0; }
    .order-name {
      font-size: var(--font-base); font-weight: var(--font-semibold); color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .order-spec { font-size: var(--font-xs); color: var(--text-secondary); margin-top: 2px; }
    .order-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: var(--space-2);
      border-top: 1px solid var(--border-light);
    }
    .order-total { font-size: var(--font-sm); color: var(--text-secondary); }
    .order-total strong { color: var(--error); font-size: var(--font-md); font-weight: var(--font-extrabold); font-family: var(--font-family-number); }
    .order-actions { display: flex; gap: var(--space-2); }
  </style>
</head>
<body>
  <div class="mb-app">

    <!-- 返回栏 -->
    <div class="mb-back-bar">
      <button class="mb-back-arrow" type="button" onclick="H5Back.go('h5_member.html')" aria-label="返回上一页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="mb-back-title">我的订单</div>
    </div>

    <!-- 订单标签 -->
    <div class="order-tabs">
      <div class="order-tab active" data-tab="全部">全部</div>
      <div class="order-tab" data-tab="待付款">待付款</div>
      <div class="order-tab" data-tab="待发货">待发货</div>
      <div class="order-tab" data-tab="待收货">待收货</div>
      <div class="order-tab" data-tab="已完成">已完成</div>
      <div class="order-tab" data-tab="已取消">已取消</div>
    </div>

    <!-- 订单列表（由 JS 动态渲染，读取后端 sf_mall_order） -->
    <div id="orderList"></div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('index.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_store.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>商城</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('trace_h5.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>溯源</span>
      </div>
      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
        <span>订单</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_member.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </nav>
  </div>

  <script>
    function navigateTo(page) { window.location.href = page; }

    // 订单状态枚举与样式映射
    var STATUS_TABS = ['全部', '待付款', '待发货', '待收货', '已完成', '已取消'];
    var TAG_CLASS = { '待付款': 'warning', '待发货': 'info', '待收货': 'info', '已完成': 'success', '已取消': 'default' };

    var currentTab = '全部';
    var focusOrderNo = (new URLSearchParams(location.search)).get('focus') || '';

    /* 订单数据来自后端 sf_mall_order（H5Data），内存缓存 */
    var orderList = [];

    function readOrders() { return orderList; }

    function statusOf(order) {
      // 状态由 H5Data 在映射时已归一为中文（含物流→待收货）
      return order.status || '待付款';
    }

    function actionButtons(order) {
      var code = statusOf(order);
      if (code === '待付款') return '<button class="mb-btn mb-btn-sm mb-btn-secondary" onclick="cancelOrder(\'' + escOrder(order.no) + '\')">取消</button>' +
        '<button class="mb-btn mb-btn-sm mb-btn-primary" onclick="payOrder(\'' + escOrder(order.no) + '\')">去付款</button>';
      if (code === '待发货') return '<button class="mb-btn mb-btn-sm mb-btn-secondary" onclick="viewDetail(\'' + escOrder(order.no) + '\')">查看详情</button>';
      if (code === '待收货') return '<button class="mb-btn mb-btn-sm mb-btn-secondary" onclick="viewLogistics(\'' + escOrder(order.no) + '\')">查看物流</button>' +
        '<button class="mb-btn mb-btn-sm mb-btn-primary" onclick="confirmReceipt(\'' + escOrder(order.no) + '\')">确认收货</button>';
      if (code === '已完成') return '<button class="mb-btn mb-btn-sm mb-btn-secondary" onclick="reorder(\'' + escOrder(order.no) + '\')">再次购买</button>';
      return '';
    }

    /* 状态口径统一：发货/物流信息已由 H5Data 在订单映射时并入（logistics→待收货） */
    function syncShippedStatus() {
      return false;
    }

    function renderOrders() {
      syncShippedStatus();
      var list = readOrders();
      var filtered = (currentTab === '全部') ? list : list.filter(function(o){ return statusOf(o) === currentTab; });
      var html;
      if (!filtered.length) {
        html = '<div style="text-align:center;color:#999;padding:48px 16px;">暂无订单</div>';
      } else {
        html = filtered.map(function(order){
          var items = (order.items || []).map(function(it){
            return '<div class="order-item-img"><img src="' + escOrder(it.img || 'images/thumb_apple5kg.jpg') + '" alt="' + escOrder(it.name || '') + '" onerror="this.onerror=null;this.src=\'images/thumb_apple5kg.jpg\'"></div>' +
              '<div class="order-info"><div class="order-name">' + escOrder(it.name || '商品') + '</div>' +
              '<div class="order-spec">' + escOrder(it.spec || it.desc || '') + ' × ' + (Number(it.qty) || 1) + '</div></div>';
          }).join('');
          var status = statusOf(order);
          var tag = TAG_CLASS[status] || 'default';
          var focused = (focusOrderNo && order.no === focusOrderNo) ? ' style="border-color:var(--primary);box-shadow:0 0 0 2px rgba(46,158,90,.2);"' : '';
          return '<div class="order-card"' + focused + ' data-no="' + escOrder(order.no) + '">' +
            '<div class="order-header"><span class="order-no">' + escOrder(order.no) + '</span>' +
            '<span class="mb-tag ' + tag + '">' + status + '</span></div>' +
            '<div class="order-items">' + items + '</div>' +
            '<div class="order-footer">' +
            '<div class="order-total">共' + (order.items ? order.items.length : 1) + '件 合计 <strong>¥' + (Math.round((Number(order.total) || 0) * 100) / 100).toFixed(2) + '</strong></div>' +
            '<div class="order-actions">' + actionButtons(order) + '</div>' +
            '</div></div>';
        }).join('');
      }
      document.getElementById('orderList').innerHTML = html;
      // 自动滚动到 focus 订单
      if (focusOrderNo) {
        var el = document.querySelector('[data-no="' + focusOrderNo + '"]');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    /* 更新单条订单状态（走后端 sf_mall_order） */
    function persistOrder(o) {
      if (o._id != null) return H5Data.update('order', o._id, o);
      return H5Data.create('order', o);
    }

    function cancelOrder(no) {
      if (!confirm('确定要取消订单 ' + no + '？')) return;
      var o = readOrders().find(function(x){ return x.no === no; });
      if (o) { o.status = '已取消'; o.statusCode = 'cancelled'; persistOrder(o); }
      renderOrders();
      showOrderToast('订单已取消');
    }

    function payOrder(no) {
      var o = readOrders().find(function(x){ return x.no === no; });
      if (o) { o.status = '待发货'; o.statusCode = 'paid'; persistOrder(o); }

      /* 认养订单激活：待支付 → 已支付，果树转已认养 */
      var activated = 0;
      if (o && Array.isArray(o.adoptionOrders) && typeof AdoptionStore !== 'undefined') {
        o.adoptionOrders.forEach(function (adoptNo) {
          try {
            AdoptionStore.activateOrder(adoptNo, { payMethod: 'wechat', payTxnNo: 'H5-' + Date.now() });
            activated++;
          } catch (e) {
            console.warn('[H5] 认养订单激活失败', adoptNo, e && e.message);
          }
        });
      }
      renderOrders();
      showOrderToast(activated
        ? '支付成功，已激活 ' + activated + ' 棵果树认养'
        : '支付成功，等待商家发货');
    }

    function confirmReceipt(no) {
      var o = readOrders().find(function(x){ return x.no === no; });
      if (o) { o.status = '已完成'; o.statusCode = 'completed'; persistOrder(o); }
      renderOrders();
      showOrderToast('已确认收货，感谢您的购买');
    }

    /* 再次购买：同商品需合并数量，否则购物车出现重复行 */
    function reorder(no) {
      var o = readOrders().find(function(x){ return x.no === no; });
      if (!o || !o.items || !o.items.length) return;
      var jobs = o.items.map(function (it) {
        return H5Data.cart.add({ id: it.id, name: it.name, spec: it.spec || it.desc, img: it.img, price: it.price, qty: it.qty || 1, checked: true });
      });
      Promise.all(jobs).then(function () {
        showOrderToast('商品已加入购物车');
        setTimeout(function(){ window.location.href = 'h5_cart.html'; }, 600);
      });
    }

    /* 订单详情 / 物流：使用可滚动的底部弹层，替代 2.2s 自动消失的 toast，
       避免长文本（物流单号、地址）被截断 */
    function openOrderSheet(title, rows) {
      var old = document.getElementById('orderSheetOverlay');
      if (old) old.remove();
      var ov = document.createElement('div');
      ov.id = 'orderSheetOverlay';
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9998;display:flex;align-items:flex-end;justify-content:center;';
      var html = '<div style="width:100%;max-width:750px;background:#fff;border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:76vh;overflow-y:auto;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">' +
        '<div style="font-size:16px;font-weight:600;color:#1a1a1a;">' + title + '</div>' +
        '<button type="button" aria-label="关闭" onclick="document.getElementById(\'orderSheetOverlay\').remove()" ' +
        'style="border:none;background:#f5f7fa;width:28px;height:28px;border-radius:50%;font-size:16px;line-height:1;color:#595959;cursor:pointer;">×</button>' +
        '</div><div style="font-size:14px;color:#1a1a1a;line-height:1.9;">' + rows + '</div></div>';
      ov.innerHTML = html;
      ov.addEventListener('click', function (e) { if (e.target === ov) ov.remove(); });
      document.body.appendChild(ov);
    }
    function row(label, value) {
      return '<div style="display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-bottom:1px solid #f5f7fa;">' +
        '<span style="color:#8c8c8c;flex:none;">' + label + '</span>' +
        '<span style="text-align:right;word-break:break-all;">' + value + '</span></div>';
    }
    function escOrder(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function money(n) { return '¥' + (Math.round((Number(n) || 0) * 100) / 100).toFixed(2); }

    function viewDetail(no) {
      var list = readOrders();
      var o = list.find(function(x){ return x.no === no; });
      if (!o) return;
      var addr = o.address || {};
      var rows = row('订单编号', escOrder(o.no)) +
        row('订单状态', escOrder(statusOf(o))) +
        row('商品金额', money(o.subtotal)) +
        (Number(o.discount) > 0 ? row('优惠金额', '-' + money(o.discount)) : '') +
        row('实付金额', '<strong>' + money(o.total) + '</strong>') +
        (o.pointsUsed > 0 ? row('积分抵扣', escOrder(o.pointsUsed) + ' 积分') : '') +
        (o.couponCode ? row('优惠券', escOrder(o.couponCode)) : '') +
        row('支付方式', escOrder(o.payment || '在线支付')) +
        row('发票', o.invoice ? '已申请' : '未申请') +
        row('收货信息', escOrder([addr.name, addr.phone, addr.region, addr.detail].filter(Boolean).join(' ') || '-')) +
        row('下单时间', o.createdAt ? new Date(o.createdAt).toLocaleString() : '-');
      var goods = (o.items || []).map(function (it) {
        return row(escOrder(it.name || '商品') + ' × ' + (it.qty || 1), money((Number(it.price) || 0) * (Number(it.qty) || 1)));
      }).join('');
      openOrderSheet('订单详情', goods + '<div style="height:8px"></div>' + rows);
    }

    function viewLogistics(no) {
      var o = readOrders().find(function (x) { return x.no === no; });
      var info = (o && o.logistics && o.logistics.length) ? o.logistics[o.logistics.length - 1] : null;
      if (!info) { showOrderToast('暂无物流信息，请耐心等待'); return; }
      openOrderSheet('物流信息',
        row('订单编号', escOrder(no)) +
        row('承运商', escOrder(info.company || '-')) +
        row('运单号', '<strong>' + escOrder(info.tracking || '-') + '</strong>') +
        row('发货时间', info.shippedAt ? new Date(info.shippedAt).toLocaleString() : '-'));
    }

    function showOrderToast(message) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;padding:14px 22px;border-radius:10px;font-size:14px;line-height:1.7;white-space:pre-wrap;z-index:9999;max-width:82%;text-align:center;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2200);
    }

    // 标签切换
    document.querySelectorAll('.order-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.order-tab').forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
        currentTab = this.dataset.tab || this.textContent.trim();
        renderOrders();
      });
    });

    /* 初始化：异步拉取后端订单 */
    H5Data.ready.then(function () { return H5Data.list('order'); }).then(function (list) {
      orderList = list || [];
      renderOrders();
    });
  
/* ============================================================
 * 后端数据到达后自动重绘
 * ------------------------------------------------------------
 * 数据层在「后端预加载完成」与「本地写入」两条路径上都会派发
 * <store>StoreChange 窗口事件；页面若不监听，首次渲染发生在数据
 * 到达之前，界面会一直停在空列表。此处统一订阅后自动重绘。
 * ============================================================ */
(function () {
  if (typeof StoreLive === 'undefined') return;
  StoreLive.on(["adoptionStoreChange"], function () {
      renderOrders();
  });
})();
</script>
</body>
</html>
