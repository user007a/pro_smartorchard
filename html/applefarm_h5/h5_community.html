<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>移动商城 - 认养社区</title>
  <script src="js/h5-back.js"></script>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    /* ========== 页面专属样式 ========== */
    .community-header {
      background: var(--gradient-header);
      padding: calc(var(--safe-top) + 12px) var(--space-4) var(--space-6);
      color: var(--text-on-primary);
      border-radius: 0 0 var(--radius-xl) var(--radius-xl);
      box-shadow: var(--shadow-header);
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .community-header::before {
      content: '';
      position: absolute;
      top: -30%; right: -15%;
      width: 70%; height: 120%;
      background: radial-gradient(ellipse, rgba(255,255,255,0.10) 0%, transparent 70%);
      pointer-events: none;
    }
    .community-header > * { position: relative; z-index: 1; }
    .community-title { font-size: var(--font-xl); font-weight: var(--font-bold); margin-bottom: var(--space-1); }
    .community-subtitle { font-size: var(--font-sm); opacity: 0.85; }

    /* 发布栏 */
    .publish-bar {
      background: var(--bg-white);
      margin: var(--space-3) var(--space-4);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .publish-input {
      flex: 1;
      padding: var(--space-2) var(--space-3);
      background: var(--gray-50);
      border-radius: var(--radius-full);
      border: none;
      font-size: var(--font-sm);
      color: var(--text-placeholder);
      cursor: pointer;
    }

    /* 动态卡片 */
    .feed-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin: var(--space-3) var(--space-4);
      border: 1px solid var(--border);
    }
    .feed-header {
      display: flex; align-items: center; gap: var(--space-3);
      margin-bottom: var(--space-3);
    }
    .feed-avatar {
      width: 40px; height: 40px;
      border-radius: var(--radius-full);
      background: var(--primary-50);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 20px;
    }
    .feed-user-info { flex: 1; }
    .feed-username { font-size: var(--font-base); font-weight: var(--font-semibold); color: var(--text); }
    .feed-time { font-size: var(--font-xs); color: var(--text-tertiary); }
    .feed-content { font-size: var(--font-base); color: var(--text); line-height: 1.6; margin-bottom: var(--space-3); }
    .feed-images {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }
    .feed-img {
      height: 0;
      padding-bottom: 100%;
      border-radius: var(--radius-md);
      background: var(--primary-50);
      position: relative;
    }
    .feed-img span {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
    }
    .feed-actions {
      display: flex; gap: var(--space-6);
      padding-top: var(--space-2);
      border-top: 1px solid var(--border-light);
    }
    .feed-action {
      display: flex; align-items: center; gap: var(--space-1);
      font-size: var(--font-sm); color: var(--text-secondary);
      cursor: pointer;
    }
    .feed-action svg { width: 18px; height: 18px; }
    .feed-action:active { color: var(--primary); }
  </style>
</head>
<body>
  <div class="mb-app">
    <!-- 返回栏 -->
    <div class="mb-back-bar">
      <button class="mb-back-arrow" type="button" onclick="H5Back.go('h5_member.html')" aria-label="返回上一页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="mb-back-title">认养社区</div>
    </div>

    <!-- 发布栏 -->
    <div class="publish-bar" onclick="openPublish()" style="cursor:pointer;">
      <span class="publish-placeholder">说点什么吧…</span>
      <button class="mb-btn mb-btn-sm mb-btn-primary" onclick="event.stopPropagation();openPublish();">发布</button>
    </div>

    <!-- 社区动态列表（后端 sf_mall_post 渲染） -->
    <div id="feedList"></div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('index.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_store.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>商城</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('trace_h5.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>溯源</span>
      </div>
      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span>社区</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_member.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </nav>
  </div>

  <script src="js/h5-auth.js"></script>
  <script src="js/h5-data.js"></script>
  <script>
    function navigateTo(page) { window.location.href = page; }

    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function fmtTime(iso) {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '刚刚';
      var p = function (n) { return n < 10 ? '0' + n : n; };
      return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    /* 社区动态数据源：后端 sf_mall_post（resource = post），
       点赞/评论存 post.like_count / post.comment_count 字段 */
    var posts = [];
    var currentMemberId = '';

    function loadPosts() {
      H5Data.ready.then(function () {
        var m = H5Data.currentMember();
        currentMemberId = m ? String(m.id) : '';
        return H5Data.list('post');
      }).then(function (list) {
        posts = list || [];
        renderPosts();
      }).catch(function () {
        posts = [];
        renderPosts();
      });
    }

    function renderPosts() {
      var box = document.getElementById('feedList');
      if (!box) return;
      var visible = posts.filter(function (p) {
        if (!p) return false;
        if (!p.status || p.status === 'approved' || p.status === 'on') return true;
        return p.status === 'pending' && currentMemberId && String(p.memberId) === currentMemberId;
      });
      if (!visible.length) {
        box.innerHTML = '<div style="text-align:center;color:#999;padding:48px 0;font-size:14px;">暂无数据，快来发布第一条动态吧</div>';
        return;
      }
      box.innerHTML = visible.map(function (p) {
        var lc = parseInt(p.likeCount, 10) || 0;
        var cc = parseInt(p.commentCount, 10) || 0;
        var badge = (p.status === 'pending')
          ? '<span class="mb-tag warning">审核中</span>'
          : '<span class="mb-tag success">已发布</span>';
        var imgs = (p.images && p.images.length)
          ? '<div class="feed-images">' + p.images.map(function () { return '<div class="feed-img"><span>🍎</span></div>'; }).join('') + '</div>'
          : '';
        return '<div class="feed-card">' +
          '<div class="feed-header">' +
            '<div class="feed-avatar">🍎</div>' +
            '<div class="feed-user-info">' +
              '<div class="feed-username">' + escHtml(p.author || '果友') + '</div>' +
              '<div class="feed-time">' + fmtTime(p.time) + '</div>' +
            '</div>' +
            badge +
          '</div>' +
          '<div class="feed-content">' + escHtml(p.content) + '</div>' +
          imgs +
          '<div class="feed-actions">' +
            '<div class="feed-action" onclick="likePost(\'' + p.id + '\')">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>' +
              '<span id="likeCount_' + p.id + '">' + lc + '</span></div>' +
            '<div class="feed-action" onclick="commentPost(\'' + p.id + '\')">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
              '<span id="commentCount_' + p.id + '">' + cc + '</span></div>' +
            '<div class="feed-action" onclick="sharePost()">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>分享</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function findPost(id) {
      for (var i = 0; i < posts.length; i++) {
        if (String(posts[i].id) === String(id)) return posts[i];
      }
      return null;
    }

    // 点赞：递增后端 post.like_count
    function likePost(id) {
      var p = findPost(id);
      if (!p) { showToast('操作失败'); return; }
      p.likeCount = (parseInt(p.likeCount, 10) || 0) + 1;
      H5Data.update('post', p.id, p).then(function (res) {
        if (res && res.ok) { renderPosts(); showToast('已点赞'); }
        else showToast('操作失败');
      }).catch(function () { showToast('操作失败'); });
    }

    // 评论：递增后端 post.comment_count（内容经弹窗录入，计数持久化）
    function commentPost(id) {
      var p = findPost(id);
      if (!p) { showToast('操作失败'); return; }
      var txt = prompt('请输入评论内容：');
      if (!txt || !String(txt).trim()) return;
      p.commentCount = (parseInt(p.commentCount, 10) || 0) + 1;
      H5Data.update('post', p.id, p).then(function (res) {
        if (res && res.ok) { renderPosts(); showToast('评论成功'); }
        else showToast('操作失败');
      }).catch(function () { showToast('操作失败'); });
    }

    function sharePost() { showToast('分享功能敬请期待'); }

    // 发布动态 → 后端 sf_mall_post（status = pending，待审核）
    function openPublish() {
      if (!H5Auth.requireAction('请先登录后再发布动态')) return;
      var text = prompt('请输入动态内容：');
      if (!text || !String(text).trim()) return;
      publishPost(String(text).trim());
    }
    function publishPost(text) {
      text = text || '';
      if (!text) return;
      var m = H5Data.currentMember();
      var p = (typeof H5Auth.profile === 'function') ? (H5Auth.profile() || {}) : {};
      var author = (m && m.nickname) || p.nickname || p.phone || '我';
      H5Data.create('post', {
        author: author,
        memberId: m ? m.id : '',
        content: text,
        images: [],
        topic: '',
        likeCount: 0,
        commentCount: 0,
        status: 'pending',
        time: new Date().toISOString()
      }).then(function (res) {
        if (res && res.ok) {
          loadPosts();
          showToast('动态已提交，审核通过后展示');
        } else {
          showToast('发布失败，请稍后重试');
        }
      }).catch(function () { showToast('发布失败，请稍后重试'); });
    }

    loadPosts();

    function showToast(message) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;animation:fadeInOut 2s ease;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2000);
    }
    var style = document.createElement('style');
    style.textContent = '@keyframes fadeInOut { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0} }';
    document.head.appendChild(style);
  </script>
</body>
</html>
