<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>设置 - 移动商城</title>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    .settings-section { padding: var(--space-4); padding-bottom: 100px; }

    .settings-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      border: 1px solid var(--border);
    }

    .settings-card-title {
      font-size: var(--font-md);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .settings-card-title svg {
      width: 18px;
      height: 18px;
      color: var(--primary);
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-light);
    }

    .setting-row:last-child { border-bottom: none; }

    .setting-label {
      font-size: var(--font-sm);
      color: var(--text);
    }

    .setting-value {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .setting-status {
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }

    .setting-status.on { color: var(--success); }

    .setting-status.off { color: var(--text-tertiary); }

    .setting-toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .setting-toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .setting-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--gray-300);
      border-radius: var(--radius-full);
      transition: var(--transition-fast);
    }

    .setting-slider::before {
      content: '';
      position: absolute;
      height: 20px;
      width: 20px;
      left: 2px;
      bottom: 2px;
      background: var(--bg-white);
      border-radius: 50%;
      transition: var(--transition-fast);
    }

    .setting-toggle input:checked + .setting-slider {
      background: var(--primary);
    }

    .setting-toggle input:checked + .setting-slider::before {
      transform: translateX(20px);
    }

    .setting-action {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }

    .setting-action svg {
      width: 14px;
      height: 14px;
    }

    .setting-action.danger {
      color: var(--error);
    }

    .version-info {
      text-align: center;
      padding: var(--space-4);
      color: var(--text-tertiary);
      font-size: var(--font-xs);
    }

    .version-info a {
      color: var(--primary);
      text-decoration: none;
    }

    .logout-btn {
      margin-top: var(--space-4);
      width: 100%;
      padding: var(--space-3);
      border: 1px solid var(--error);
      background: transparent;
      color: var(--error);
      border-radius: var(--radius-lg);
      font-size: var(--font-base);
      font-weight: var(--font-medium);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .logout-btn:active {
      background: var(--error-light);
    }
  </style>
</head>
<body>
  <div class="mb-app">

    <div class="settings-section">
      <!-- 通知设置 -->
      <div class="settings-card">
        <div class="settings-card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          通知设置
        </div>
        <div class="setting-row">
          <span class="setting-label">推送通知</span>
          <label class="setting-toggle">
            <input type="checkbox" checked>
            <span class="setting-slider"></span>
          </label>
        </div>
      </div>

      <!-- 隐私与安全 -->
      <div class="settings-card">
        <div class="settings-card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          隐私与安全
        </div>
        <div class="setting-row">
          <span class="setting-label">定位服务</span>
          <span class="setting-value">
            <span class="setting-status on">已开</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </span>
        </div>
        <div class="setting-row">
          <span class="setting-label">自动登录</span>
          <label class="setting-toggle">
            <input type="checkbox" checked>
            <span class="setting-slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">修改密码</span>
          <span class="setting-action" onclick="changePassword()">
            点击修改
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </span>
        </div>
        <div class="setting-row">
          <span class="setting-label">清除缓存</span>
          <span class="setting-action" onclick="clearCache()">
            <span id="cacheSize">计算中…</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </span>
        </div>
      </div>

      <!-- 其他设置 -->
      <div class="settings-card">
        <div class="settings-card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          其他
        </div>
        <div class="setting-row">
          <span class="setting-label">意见反馈</span>
          <span class="setting-action" onclick="feedback()">
            提交反馈
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </span>
        </div>
        <div class="setting-row">
          <span class="setting-label">关于我们</span>
          <span class="setting-action" onclick="aboutUs()">
            v1.2.0
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </span>
        </div>
        <div class="setting-row">
          <span class="setting-label">用户协议</span>
          <span class="setting-action" onclick="userAgreement()">
            查看
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </span>
        </div>
        <div class="setting-row">
          <span class="setting-label">隐私政策</span>
          <span class="setting-action" onclick="privacyPolicy()">
            查看
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </span>
        </div>
      </div>

      <!-- 退出登录 -->
      <button class="logout-btn" onclick="confirmLogout()">退出登录</button>
    </div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('index.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_store.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>商城</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('trace_h5.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>溯源</span>
      </div>
      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </nav>
  </div>

  <script>
    function navigateTo(page) { window.location.href = page; }

    function changePassword() {
      showToast('密码修改请联系企业管理员在后台「用户管理」中重置，重置后会通过短信通知新密码');
    }

    /* 真实缓存清理：仅清理 H5 端非业务数据缓存（草稿、积分、本次会话等），
       保留订单、地址、认养、收藏等业务数据，避免破坏正常数据 */
    var H5_CACHE_KEYS = {
      // 业务数据：保留
      keep: [
        'h5_orders', 'h5_addresses', 'snzg_adoptions', 'h5_favorites',
        'h5_cart_items', 'loginUser', 'loginUserProfile', 'isLoggedIn',
        'h5_invoices', 'h5_message_read', 'h5_messages_read'
      ],
      // 缓存数据：清理
      drop: [
        'h5_cart', 'h5_checkout_draft', 'h5_points_used', 'h5_points',
        'h5_search_history', 'h5_view_history', 'h5_browser_cache_v'
      ]
    };
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(2) + ' MB';
    }
    function calcCacheSize() {
      var total = 0;
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (H5_CACHE_KEYS.keep.indexOf(k) >= 0) continue;
          total += ((localStorage.getItem(k) || '').length + k.length) * 2;
        }
        for (var j = 0; j < sessionStorage.length; j++) {
          var sk = sessionStorage.key(j);
          if (H5_CACHE_KEYS.keep.indexOf(sk) >= 0) continue;
          total += ((sessionStorage.getItem(sk) || '').length + sk.length) * 2;
        }
      } catch (e) {}
      return total;
    }
    function refreshCacheSize() {
      var el = document.getElementById('cacheSize');
      if (el) el.textContent = formatSize(calcCacheSize());
    }
    function clearCache() {
      try {
        // 显式清理白名单之外的缓存键
        H5_CACHE_KEYS.drop.forEach(function (k) {
          try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {}
        });
        // 兜底：遍历 storage，保留 keep 白名单中的业务数据
        var removeFrom = function (store) {
          for (var i = store.length - 1; i >= 0; i--) {
            var k = store.key(i);
            if (k && H5_CACHE_KEYS.keep.indexOf(k) < 0) {
              try { store.removeItem(k); } catch (e) {}
            }
          }
        };
        removeFrom(localStorage);
        removeFrom(sessionStorage);
        // 记录清理时间
        try { localStorage.setItem('h5_browser_cache_v', String(Date.now())); } catch (e) {}
      } catch (e) {}
      refreshCacheSize();
      showToast('缓存已清理（业务数据已保留）');
    }

    function feedback() {
      showToast('意见反馈：可通过「我的 → 帮助与反馈」提交，或拨打客服热线 400-000-0000');
    }

    function aboutUs() {
      showToast('移动商城 v1.2.0\n苹果销售与认养移动平台');
    }

    function userAgreement() {
      // 协议/政策以弹层文本方式呈现（不再写「开发中」）
      showModal('用户协议', '欢迎使用天水花牛苹果移动商城。本协议由您与天水花牛苹果（集团）有限责任公司共同签订，约定双方在本平台购物、认养、溯源等环节的权利与义务。\n\n· 您应保证账号信息真实有效，妥善保管登录凭证；\n· 商品价格与库存以结算页为准，下单后请在 30 分钟内完成支付；\n· 认养果树在协议期内归您专属，采收品质按《有机产品标准》执行；\n· 因不可抗力（含气象灾害、疫情管控等）导致延迟交付的，本平台将协助办理延期或按比例退款。\n\n完整协议可联系客服获取。');
    }

    function privacyPolicy() {
      showModal('隐私政策', '我们非常重视您的个人信息安全，本政策简要说明 H5 端的数据处理范围：\n\n· 账号信息（手机号、收货地址）仅用于订单履约与售后服务；\n· 浏览与缓存数据保存在您的设备本地，您可随时通过「设置 → 清除缓存」清理；\n· 农事/溯源数据来源于生产基地与第三方检测机构，仅按您授权的产品/批次展示；\n· 我们不会将您的个人数据用于本平台业务以外的目的，亦不会出售给第三方。\n\n如需查阅完整《隐私政策》或申请数据导出与删除，请联系客服。');
    }

    function showModal(title, body) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;';
      overlay.innerHTML = '<div style="background:#fff;border-radius:12px;width:90%;max-width:480px;max-height:80vh;overflow-y:auto;padding:18px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
        '<h3 style="margin:0;font-size:16px;color:var(--text);">' + title + '</h3>' +
        '<span onclick="this.closest(\'div[style*=fixed]\').remove()" style="color:#999;cursor:pointer;font-size:14px;">关闭</span>' +
        '</div>' +
        '<div style="white-space:pre-wrap;font-size:13px;line-height:1.7;color:var(--text-secondary);">' + body + '</div>' +
        '</div>';
      document.body.appendChild(overlay);
    }

    function confirmLogout() {
      if (confirm('确定要退出登录吗？')) {
        window.location.href = 'trace_intro.html';
      }
    }
    refreshCacheSize();

    function showToast(message) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;animation:fadeInOut 2s ease;white-space:pre-line;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2000);
    }
    var style = document.createElement('style');
    style.textContent = '@keyframes fadeInOut { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0} }';
    document.head.appendChild(style);
  </script>
</body>
</html>
