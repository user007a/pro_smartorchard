<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>移动商城 - 购物车</title>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    /* ========== 页面专属样式 ========== */
    .cart-list { padding: var(--space-4); padding-bottom: 160px; }
    .cart-item {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      display: flex;
      gap: var(--space-3);
      border: 1px solid var(--border);
      position: relative;
      transition: all var(--transition-fast);
    }
    .cart-item:active { transform: scale(0.99); }
    .cart-checkbox {
      margin-top: 28px;
      width: 20px; height: 20px;
      accent-color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
    }
    .cart-img {
      width: 80px; height: 80px;
      border-radius: var(--radius-md);
      background: var(--primary-50);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 40px;
      overflow: hidden;
    }
    .cart-img img { width: 100%; height: 100%; object-fit: cover; }
    .cart-info {
      flex: 1;
      display: flex; flex-direction: column; justify-content: space-between;
      min-width: 0;
    }
    .cart-name {
      font-size: var(--font-base);
      font-weight: var(--font-semibold);
      color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cart-spec { font-size: var(--font-xs); color: var(--text-secondary); }
    .cart-price { font-size: var(--font-lg); font-weight: var(--font-extrabold); color: var(--error); font-family: var(--font-family-number); }
    .cart-quantity { display: flex; align-items: center; gap: var(--space-2); }
    .qty-btn {
      width: 28px; height: 28px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg-white);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; color: var(--text);
      transition: all var(--transition-fast);
    }
    .qty-btn:active { background: var(--primary-50); border-color: var(--primary-200); }
    .qty-value { min-width: 32px; text-align: center; font-size: var(--font-base); font-weight: var(--font-semibold); }
    .cart-delete {
      position: absolute; top: 12px; right: 12px;
      width: 24px; height: 24px; border-radius: var(--radius-full);
      background: var(--gray-100);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border: none;
    }
    .cart-delete:active { background: var(--error-light); }

    /* 底部操作栏 */
    .footer-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 750px;
      background: var(--bg-white);
      padding: var(--space-3) var(--space-4);
      padding-bottom: calc(var(--space-3) + var(--safe-bottom));
      display: flex; align-items: center; gap: var(--space-3);
      box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
      z-index: var(--z-tab-bar);
    }
    .footer-checkbox { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }
    .footer-text { font-size: var(--font-sm); color: var(--text-secondary); cursor: pointer; }
    .footer-price { flex: 1; text-align: right; }
    .price-label { font-size: var(--font-xs); color: var(--text-secondary); }
    .price-value { font-size: var(--font-xl); font-weight: var(--font-extrabold); color: var(--error); font-family: var(--font-family-number); }
  </style>
</head>
<body>
  <div class="mb-app">

    <!-- 购物车列表 -->
    <div class="cart-list">
      <div class="cart-item" data-id="redFuji">
        <input type="checkbox" class="cart-checkbox" checked>
        <div class="cart-img"><img src="images/thumb_apple5kg.jpg" alt="花牛苹果"></div>
        <div class="cart-info">
          <div>
            <div class="cart-name">花牛苹果 5斤装</div>
            <div class="cart-spec">脆甜多汁 · 新鲜采摘</div>
          </div>
          <div class="flex justify-between items-center">
            <span class="cart-price">¥68</span>
            <div class="cart-quantity">
              <button class="qty-btn" onclick="changeQuantity('redFuji', -1)">−</button>
              <span class="qty-value">1</span>
              <button class="qty-btn" onclick="changeQuantity('redFuji', 1)">+</button>
            </div>
          </div>
        </div>
        <button class="cart-delete" onclick="removeItem('redFuji')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>

      <div class="cart-item" data-id="giftBox">
        <input type="checkbox" class="cart-checkbox" checked>
        <div class="cart-img"><img src="images/thumb_giftbox.jpg" alt="精品礼盒"></div>
        <div class="cart-info">
          <div>
            <div class="cart-name">精品礼盒装 8斤</div>
            <div class="cart-spec">送礼佳品 · 品质保证</div>
          </div>
          <div class="flex justify-between items-center">
            <span class="cart-price">¥168</span>
            <div class="cart-quantity">
              <button class="qty-btn" onclick="changeQuantity('giftBox', -1)">−</button>
              <span class="qty-value">1</span>
              <button class="qty-btn" onclick="changeQuantity('giftBox', 1)">+</button>
            </div>
          </div>
        </div>
        <button class="cart-delete" onclick="removeItem('giftBox')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>

      <div class="cart-item" data-id="gala">
        <input type="checkbox" class="cart-checkbox">
        <div class="cart-img"><img src="images/thumb_yellow_red.jpg" alt="花牛苹果"></div>
        <div class="cart-info">
          <div>
            <div class="cart-name">花牛苹果 5斤装</div>
            <div class="cart-spec">酸甜可口 · 皮薄肉嫩</div>
          </div>
          <div class="flex justify-between items-center">
            <span class="cart-price">¥58</span>
            <div class="cart-quantity">
              <button class="qty-btn" onclick="changeQuantity('gala', -1)">−</button>
              <span class="qty-value">2</span>
              <button class="qty-btn" onclick="changeQuantity('gala', 1)">+</button>
            </div>
          </div>
        </div>
        <button class="cart-delete" onclick="removeItem('gala')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
    </div>

    <!-- 底部操作栏 -->
    <div class="footer-bar">
      <input type="checkbox" class="footer-checkbox" checked onclick="toggleSelectAll(this)">
      <span class="footer-text" onclick="toggleSelectAll(document.querySelector('.footer-checkbox'))">全选</span>
      <div class="footer-price">
        <div class="price-label">合计（含优惠）</div>
        <div class="price-value" id="totalPrice">¥236</div>
        <div class="price-discount" id="discountInfo" style="font-size:11px;color:#999;"></div>
      </div>
      <button class="mb-btn mb-btn-primary mb-btn-lg" onclick="checkout()" id="checkoutBtn">结算(2)</button>
    </div>

    <!-- 优惠券/积分选择弹窗（H5-B-003） -->
    <div class="modal-overlay" id="couponModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:flex-end;justify-content:center;">
      <div style="background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:16px;max-height:60vh;overflow-y:auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3 style="margin:0;">选择优惠</h3>
          <button onclick="closeCouponModal()" style="background:none;border:none;font-size:18px;cursor:pointer;">×</button>
        </div>
        <div id="couponList"></div>
      </div>
    </div>
    <div style="position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:998;">
      <button onclick="openCouponModal()" style="background:#fff;border:1px solid #eee;border-radius:20px;padding:6px 14px;font-size:12px;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.08);">🎁 优惠券/积分</button>
    </div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar" style="bottom: -70px;">
    </nav>
  </div>

  <script>
    // 购物车数据
    var cartData = {
      redFuji: { price: 68, quantity: 1 },
      giftBox: { price: 168, quantity: 1 },
      gala: { price: 58, quantity: 2 }
    };

    function navigateTo(page) { window.location.href = page; }
    function checkout() { window.location.href = 'h5_checkout.html'; }
    function clearCart() { showToast('购物车已清空'); }

    // 数量调整
    function changeQuantity(itemId, delta) {
      var item = cartData[itemId];
      if (!item) return;
      
      item.quantity = Math.max(1, item.quantity + delta);
      
      // 更新显示
      var cartItem = document.querySelector('.cart-item[data-id="' + itemId + '"]');
      if (cartItem) {
        var qtyElement = cartItem.querySelector('.qty-value');
        if (qtyElement) {
          qtyElement.textContent = item.quantity;
        }
      }
      
      updateTotal();
    }

    // 删除商品
    function removeItem(itemId) {
      if (confirm('确定要删除该商品吗？')) {
        var cartItem = document.querySelector('.cart-item[data-id="' + itemId + '"]');
        if (cartItem) {
          cartItem.remove();
          delete cartData[itemId];
          updateTotal();
          showToast('已删除');
        }
      }
    }

    // 全选/取消全选
    function toggleSelectAll(checkbox) {
      var checkboxes = document.querySelectorAll('.cart-checkbox');
      checkboxes.forEach(function(cb) {
        cb.checked = checkbox.checked;
        cb.dispatchEvent(new Event('change'));
      });
      updateTotal();
    }

    // 更新总价和结算数量
    function updateTotal() {
      var checkboxes = document.querySelectorAll('.cart-checkbox');
      var totalPrice = 0;
      var selectedCount = 0;

      checkboxes.forEach(function(cb) {
        var cartItem = cb.closest('.cart-item');
        var itemId = cartItem.getAttribute('data-id');
        var item = cartData[itemId];
        
        if (item && cb.checked) {
          totalPrice += item.price * item.quantity;
          selectedCount++;
        }
      });

      // 更新显示
      var totalElement = document.getElementById('totalPrice');
      var checkoutBtn = document.getElementById('checkoutBtn');
      
      if (totalElement) {
        totalElement.textContent = '¥' + totalPrice;
      }
      
      if (checkoutBtn) {
        checkoutBtn.textContent = '结算(' + selectedCount + ')';
      }
    }

    // 单个商品选中状态变化
    document.querySelectorAll('.cart-checkbox').forEach(function(cb) {
      cb.addEventListener('change', function() {
        updateTotal();
        // 更新全选框状态
        var allChecked = document.querySelectorAll('.cart-checkbox').length === 
                        document.querySelectorAll('.cart-checkbox:checked').length;
        var footerCheckbox = document.querySelector('.footer-checkbox');
        if (footerCheckbox) {
          footerCheckbox.checked = allChecked;
        }
      });
    });

    // 优惠券/积分弹窗（H5-B-003）
var selectedCoupon = null; // { name, type:'cash'|'percent', value, min }
function openCouponModal() {
  var list = [
    { name: '满100减10', type: 'cash', value: 10, min: 100 },
    { name: '满200减30', type: 'cash', value: 30, min: 200 },
    { name: '9折优惠券', type: 'percent', value: 9, min: 0 }
  ];
  var html = list.map(function(c, i){
    return '<div onclick="selectCoupon(' + i + ')" style="border:1px dashed #d4af37;border-radius:8px;padding:12px;margin:8px 0;cursor:pointer;background:linear-gradient(135deg,#fef9e7,#fff8dc);">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;">' +
      '<div><div style="font-weight:600;color:#8b4513;">' + c.name + '</div>' +
      '<div style="font-size:11px;color:#8b7355;">满 ' + c.min + ' 元可用</div></div>' +
      '<div style="color:#ea580c;font-weight:700;">' + (c.type === 'cash' ? '¥' + c.value : c.value + '折') + '</div>' +
      '</div></div>';
  }).join('');
  html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #eee;">' +
    '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">可用积分 <b id="userPoints">0</b>（100积分=¥1）</div>' +
    '<input type="number" id="usePoints" placeholder="使用积分" min="0" style="width:100%;padding:8px;border:1px solid #eee;border-radius:6px;">' +
    '<button onclick="applyPoints()" style="margin-top:8px;width:100%;background:var(--primary);color:#fff;border:none;padding:8px;border-radius:6px;">应用积分抵扣</button>' +
    '</div>';
  document.getElementById('couponList').innerHTML = html;
  var pts = JSON.parse(localStorage.getItem('h5_points') || '[]').reduce(function(s,p){ return s + (p.amount || 0); }, 0);
  var el = document.getElementById('userPoints'); if (el) el.textContent = pts;
  document.getElementById('couponModal').style.display = 'flex';
}
function closeCouponModal() { document.getElementById('couponModal').style.display = 'none'; }
function selectCoupon(i) {
  var list = [{name:'满100减10',type:'cash',value:10,min:100},{name:'满200减30',type:'cash',value:30,min:200},{name:'9折优惠券',type:'percent',value:9,min:0}];
  selectedCoupon = list[i];
  closeCouponModal();
  recomputeCartTotal();
  showToast('已选用：' + selectedCoupon.name);
}
function applyPoints() {
  var pts = parseInt(document.getElementById('usePoints').value) || 0;
  if (pts <= 0) { showToast('请填写积分数量'); return; }
  selectedCoupon = selectedCoupon || {};
  selectedCoupon.pointsUsed = pts;
  closeCouponModal();
  recomputeCartTotal();
}
function recomputeCartTotal() {
  var totalEl = document.getElementById('totalPrice');
  var info = document.getElementById('discountInfo');
  var subtotal = 236;
  var discount = 0;
  if (selectedCoupon) {
    if (selectedCoupon.type === 'cash') discount = selectedCoupon.value;
    else if (selectedCoupon.type === 'percent') discount = Math.round(subtotal * (1 - selectedCoupon.value / 10));
  }
  if (selectedCoupon && selectedCoupon.pointsUsed) discount += Math.floor(selectedCoupon.pointsUsed / 100);
  var final = Math.max(0, subtotal - discount);
  totalEl.textContent = '¥' + final;
  if (info) info.textContent = discount > 0 ? '已优惠 ¥' + discount : '';
}

function showToast(message) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;animation:fadeInOut 2s ease;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2000);
    }
    var style = document.createElement('style');
    style.textContent = '@keyframes fadeInOut { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0} }';
    document.head.appendChild(style);
  </script>
</body>
</html>
