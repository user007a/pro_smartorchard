<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>移动商城 - 购物车</title>
  <script src="js/h5-auth.js"></script>
  <script>H5Auth.require();</script>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    /* ========== 页面专属样式 ========== */
    .cart-list { padding: var(--space-4); padding-bottom: 160px; }
    .cart-item {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      display: flex;
      gap: var(--space-3);
      border: 1px solid var(--border);
      position: relative;
      transition: all var(--transition-fast);
    }
    .cart-item:active { transform: scale(0.99); }
    .cart-checkbox {
      margin-top: 28px;
      width: 20px; height: 20px;
      accent-color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
    }
    .cart-img {
      width: 80px; height: 80px;
      border-radius: var(--radius-md);
      background: var(--primary-50);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 40px;
      overflow: hidden;
    }
    .cart-img img { width: 100%; height: 100%; object-fit: cover; }
    .cart-info {
      flex: 1;
      display: flex; flex-direction: column; justify-content: space-between;
      min-width: 0;
    }
    .cart-name {
      font-size: var(--font-base);
      font-weight: var(--font-semibold);
      color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cart-spec { font-size: var(--font-xs); color: var(--text-secondary); }
    .cart-price { font-size: var(--font-lg); font-weight: var(--font-extrabold); color: var(--error); font-family: var(--font-family-number); }
    .cart-quantity { display: flex; align-items: center; gap: var(--space-2); }
    .qty-btn {
      width: 28px; height: 28px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg-white);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; color: var(--text);
      transition: all var(--transition-fast);
    }
    .qty-btn:active { background: var(--primary-50); border-color: var(--primary-200); }
    .qty-value { min-width: 32px; text-align: center; font-size: var(--font-base); font-weight: var(--font-semibold); }
    .cart-delete {
      position: absolute; top: 12px; right: 12px;
      width: 24px; height: 24px; border-radius: var(--radius-full);
      background: var(--gray-100);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border: none;
    }
    .cart-delete:active { background: var(--error-light); }

    /* 底部操作栏 */
    .footer-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 750px;
      background: var(--bg-white);
      padding: var(--space-3) var(--space-4);
      padding-bottom: calc(var(--space-3) + var(--safe-bottom));
      display: flex; align-items: center; gap: var(--space-3);
      box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
      z-index: var(--z-tab-bar);
    }
    .footer-checkbox { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }
    .footer-text { font-size: var(--font-sm); color: var(--text-secondary); cursor: pointer; }
    .footer-price { flex: 1; text-align: right; }
    .price-label { font-size: var(--font-xs); color: var(--text-secondary); }
    .price-value { font-size: var(--font-xl); font-weight: var(--font-extrabold); color: var(--error); font-family: var(--font-family-number); }
  </style>
</head>
<body>
  <div class="mb-app">

    <!-- 购物车列表（由 localStorage['h5_cart'] 渲染） -->
    <div class="cart-list" id="cartList"></div>

    <!-- 底部操作栏 -->
    <div class="footer-bar">
      <input type="checkbox" class="footer-checkbox" checked onclick="toggleSelectAll(this)">
      <span class="footer-text" onclick="toggleSelectAll(document.querySelector('.footer-checkbox'))">全选</span>
      <div class="footer-price">
        <div class="price-label">合计（含优惠）</div>
        <div class="price-value" id="totalPrice">¥0</div>
        <div class="price-discount" id="discountInfo" style="font-size:11px;color:#999;"></div>
      </div>
      <button class="mb-btn mb-btn-primary mb-btn-lg" onclick="checkout()" id="checkoutBtn">结算(0)</button>
    </div>

    <!-- 优惠券/积分选择弹窗（H5-B-003） -->
    <div class="modal-overlay" id="couponModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:flex-end;justify-content:center;">
      <div style="background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:16px;max-height:60vh;overflow-y:auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3 style="margin:0;">选择优惠</h3>
          <button onclick="closeCouponModal()" style="background:none;border:none;font-size:18px;cursor:pointer;">×</button>
        </div>
        <div id="couponList"></div>
      </div>
    </div>
    <div style="position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:998;">
      <button onclick="openCouponModal()" style="background:#fff;border:1px solid #eee;border-radius:20px;padding:6px 14px;font-size:12px;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.08);">🎁 优惠券/积分</button>
    </div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar" style="bottom: -70px;">
    </nav>
  </div>

  <script src="js/mall-coupons.js"></script>
  <script>
    var CART_KEY = 'h5_cart';
    var selectedCoupon = null; // { name, type:'cash'|'percent', value, min, pointsUsed }

    /* ---------- 数据层：与商城/结算页共用 localStorage['h5_cart'] ---------- */
    function readCart() {
      try { var v = JSON.parse(localStorage.getItem(CART_KEY) || '[]'); return Array.isArray(v) ? v : []; }
      catch (e) { return []; }
    }
    function writeCart(list) { localStorage.setItem(CART_KEY, JSON.stringify(list)); }

    var CART_SPEC = { redFuji: '5斤装', gala: '5斤装', giftBox: '8斤装' };

    function navigateTo(page) { window.location.href = page; }
    function checkout() {
      if (!H5Auth.requireAction('请先登录后再结算订单')) return;
      var n = selectedCount();
      if (!n) { showToast('请先选择要结算的商品'); return; }
      var list = readCart();
      // 同步勾选状态，供结算页只结算已选商品
      list.forEach(function(i) {
        i.checked = !!document.querySelector('.cart-item[data-id="' + i.id + '"] .cart-checkbox:checked');
      });
      writeCart(list);
      window.location.href = 'h5_checkout.html';
    }
    function clearCart() { writeCart([]); renderCart(); showToast('购物车已清空'); }

    /* ---------- 渲染 ---------- */
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    function renderCart() {
      var list = readCart();
      var box = document.getElementById('cartList');
      if (!box) return;
      if (!list.length) {
        box.innerHTML = '<div class="empty-state" style="padding:48px 24px;text-align:center;color:var(--text-secondary);">' +
          '<div style="font-size:40px;margin-bottom:12px;">🛒</div>' +
          '<div style="font-size:15px;margin-bottom:16px;">购物车还是空的</div>' +
          '<button class="mb-btn mb-btn-primary" onclick="navigateTo(\'h5_store.html\')">去商城逛逛</button></div>';
        updateTotal();
        return;
      }
      box.innerHTML = list.map(function(i) {
        var id = esc(i.id);
        var qty = Number(i.qty) || 1;
        var price = Number(i.price) || 0;
        var img = i.img || 'images/thumb_redfuji.jpg';
        return '<div class="cart-item" data-id="' + id + '">' +
          '<input type="checkbox" class="cart-checkbox"' + (i.checked !== false ? ' checked' : '') + '>' +
          '<div class="cart-img"><img src="' + esc(img) + '" alt="" onerror="this.src=\'images/thumb_redfuji.jpg\'"></div>' +
          '<div class="cart-info">' +
            '<div>' +
              '<div class="cart-name">' + esc(i.name || '商品') + '</div>' +
              '<div class="cart-spec">' + esc(i.spec || CART_SPEC[i.id] || '标准装') + '</div>' +
            '</div>' +
            '<div class="flex justify-between items-center">' +
              '<span class="cart-price">¥' + price + '</span>' +
              '<div class="cart-quantity">' +
                '<button class="qty-btn" onclick="changeQuantity(\'' + id + '\',-1)">−</button>' +
                '<span class="qty-value">' + qty + '</span>' +
                '<button class="qty-btn" onclick="changeQuantity(\'' + id + '\',1)">+</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<button class="cart-delete" onclick="removeItem(\'' + id + '\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' +
        '</div>';
      }).join('');

      document.querySelectorAll('.cart-checkbox').forEach(function(cb) {
        cb.addEventListener('change', function() {
          persistChecked();
          updateTotal();
          syncFooterCheckbox();
        });
      });
      updateTotal();
      syncFooterCheckbox();
    }

    function persistChecked() {
      var list = readCart();
      list.forEach(function(i) {
        var cb = document.querySelector('.cart-item[data-id="' + i.id + '"] .cart-checkbox');
        if (cb) i.checked = cb.checked;
      });
      writeCart(list);
    }

    /* ---------- 数量 / 删除 / 全选 ---------- */
    function changeQuantity(itemId, delta) {
      var list = readCart();
      var hit = null;
      for (var i = 0; i < list.length; i++) { if (list[i].id === itemId) { hit = list[i]; break; } }
      if (!hit) return;
      hit.qty = Math.max(1, (Number(hit.qty) || 1) + delta);
      writeCart(list);
      var qtyEl = document.querySelector('.cart-item[data-id="' + itemId + '"] .qty-value');
      if (qtyEl) qtyEl.textContent = hit.qty;
      updateTotal();
    }

    function removeItem(itemId) {
      if (!confirm('确定要删除该商品吗？')) return;
      var list = readCart().filter(function(i) { return i.id !== itemId; });
      writeCart(list);
      renderCart();
      showToast('已删除');
    }

    function toggleSelectAll(checkbox) {
      document.querySelectorAll('.cart-checkbox').forEach(function(cb) { cb.checked = checkbox.checked; });
      persistChecked();
      updateTotal();
    }

    function syncFooterCheckbox() {
      var all = document.querySelectorAll('.cart-checkbox');
      var checked = document.querySelectorAll('.cart-checkbox:checked');
      var f = document.querySelector('.footer-checkbox');
      if (f) f.checked = all.length > 0 && all.length === checked.length;
    }

    /* ---------- 金额计算 ---------- */
    function selectedItems() {
      return readCart().filter(function(i) {
        var cb = document.querySelector('.cart-item[data-id="' + i.id + '"] .cart-checkbox');
        return cb ? cb.checked : i.checked !== false;
      });
    }
    function selectedCount() { return selectedItems().length; }
    function subtotal() {
      return round2(selectedItems().reduce(function(s, i) { return s + (Number(i.price) || 0) * (Number(i.qty) || 1); }, 0));
    }
    /* 金额统一规整到分，避免浮点误差 */
    function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

    function updateTotal() {
      var total = subtotal();
      var discount = calcDiscount(total);
      var payable = round2(Math.max(0, total - discount));
      var totalElement = document.getElementById('totalPrice');
      var checkoutBtn = document.getElementById('checkoutBtn');
      var info = document.getElementById('discountInfo');
      if (totalElement) totalElement.textContent = '¥' + payable.toFixed(2);
      if (checkoutBtn) checkoutBtn.textContent = '结算(' + selectedCount() + ')';
      if (info) info.textContent = discount > 0 ? '已优惠 ¥' + discount.toFixed(2) : '';
      var label = document.querySelector('.footer-bar .price-label');
      if (label) label.textContent = discount > 0 ? '合计（已优惠 ¥' + discount.toFixed(2) + '）' : '合计（含优惠）';
    }

    /* 优惠券规则来源：后台「商城管理 / 优惠券管理」维护的 mall_coupons
       （由 js/mall-coupons.js 提供，与结算页 h5_checkout.html 共用同一份配置）
       积分抵扣额随购物车持久化到 h5_points_used，结算页读取同一 key，保证两页口径一致 */
    var COUPONS = MallCoupons.all();
    var POINTS_KEY = 'h5_points_used';
    function getPointsUsed() {
      var n = 0;
      try { n = parseInt(localStorage.getItem(POINTS_KEY) || '0', 10); } catch (e) { n = 0; }
      return isNaN(n) || n < 0 ? 0 : n;
    }
    function setPointsUsed(n) {
      try {
        if (n > 0) localStorage.setItem(POINTS_KEY, String(n));
        else localStorage.removeItem(POINTS_KEY);
      } catch (e) {}
    }
    function calcDiscount(total) {
      var d = 0;
      var code = MallCoupons.selected();
      var c = (selectedCoupon && selectedCoupon.code === code) ? selectedCoupon : MallCoupons.get(code);
      if (c && total >= (c.min || 0)) {
        d += c.type === 'cash' ? Math.min(Number(c.value) || 0, total)
                               : Math.round(total * (1 - (Number(c.value) || 0) / 10));
      }
      d += Math.min(Math.floor(getPointsUsed() / 100), Math.max(0, total - d));
      return round2(Math.min(Math.max(0, d), total));
    }

    /* 可用积分：权威来源为 h5_points（由 h5_member.html 播种）；
       若用户尚未进入会员中心（首次使用商城），此处做一次幂等兜底播种，
       避免积分抵扣功能因缺数据而不可用。 */
    function availablePoints() {
      var pts = 0, raw = null;
      try { raw = localStorage.getItem('h5_points'); } catch (e) { return 0; }
      if (!raw) {
        // 兜底播种：1280 积分（来源：历史消费返积分）
        try {
          localStorage.setItem('h5_points', JSON.stringify([
            { amount: 1280, source: '消费返积分', time: new Date().toISOString() }
          ]));
        } catch (e) {}
        return 1280;
      }
      try {
        var list = JSON.parse(raw);
        if (!Array.isArray(list)) return 0;
        pts = list.reduce(function (s, p) { return s + (Number(p.amount) || 0); }, 0);
      } catch (e) { return 0; }
      return pts;
    }

    // 优惠券/积分弹窗
    function openCouponModal() {
      COUPONS = MallCoupons.all();
      var html = COUPONS.map(function(c, i) {
        return '<div onclick="selectCoupon(' + i + ')" style="border:1px dashed #d4af37;border-radius:8px;padding:12px;margin:8px 0;cursor:pointer;background:linear-gradient(135deg,#fef9e7,#fff8dc);">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;">' +
          '<div><div style="font-weight:600;color:#8b4513;">' + c.name + '</div>' +
          '<div style="font-size:11px;color:#8b7355;">' + (Number(c.min) > 0 ? '满 ' + c.min + ' 元可用' : '无门槛') + '</div></div>' +
          '<div style="color:#ea580c;font-weight:700;">' + (c.type === 'cash' ? '¥' + c.value : c.value + '折') + '</div>' +
          '</div></div>';
      }).join('');
      html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #eee;">' +
        '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">可用积分 <b id="userPoints">0</b>（100积分=¥1）</div>' +
        '<input type="number" id="usePoints" placeholder="使用积分" min="0" style="width:100%;padding:8px;border:1px solid #eee;border-radius:6px;">' +
        '<button onclick="applyPoints()" style="margin-top:8px;width:100%;background:var(--primary);color:#fff;border:none;padding:8px;border-radius:6px;">应用积分抵扣</button>' +
        '</div>';
      document.getElementById('couponList').innerHTML = html;
      var pts = availablePoints();
      var el = document.getElementById('userPoints'); if (el) el.textContent = pts;
      document.getElementById('couponModal').style.display = 'flex';
    }
    function closeCouponModal() { document.getElementById('couponModal').style.display = 'none'; }
    function selectCoupon(i) {
      selectedCoupon = COUPONS[i];
      // 同步给结算页，避免两页优惠口径不一致
      MallCoupons.select(selectedCoupon.code);
      closeCouponModal();
      updateTotal();
      showToast('已选用：' + selectedCoupon.name);
    }
    function applyPoints() {
      var input = document.getElementById('usePoints');
      var pts = parseInt(input.value, 10) || 0;
      if (pts <= 0) { showToast('请填写积分数量'); return; }
      var avail = availablePoints();
      if (pts > avail) { showToast('可用积分不足，当前仅有 ' + avail + ' 积分'); return; }
      // 抵扣上限为当前小计金额（100 积分 = ¥1），避免超额抵扣
      var cap = Math.floor(subtotal() * 100);
      if (pts > cap) { pts = cap; showToast('本单最多可抵扣 ' + cap + ' 积分'); }
      setPointsUsed(pts);
      selectedCoupon = selectedCoupon || MallCoupons.get(MallCoupons.selected()) || {};
      selectedCoupon.pointsUsed = pts;
      closeCouponModal();
      updateTotal();
    }

    renderCart();

    function showToast(message) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;animation:fadeInOut 2s ease;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2000);
    }
    var style = document.createElement('style');
    style.textContent = '@keyframes fadeInOut { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0} }';
    document.head.appendChild(style);
  </script>
</body>
</html>
