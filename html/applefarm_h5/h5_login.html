<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>移动商城 - 登录</title>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    /* ========== 背景：果园实景 + 绿色渐变遮罩（沿用移动端登录页视觉基因） ========== */
    body {
      font-family: var(--font-family);
      min-height: 100vh;
      background: url('../common/images/orchard_bg.jpg') center/cover no-repeat fixed;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(26,138,60,.72) 0%, rgba(34,168,74,.6) 32%, rgba(46,198,100,.48) 72%, rgba(76,214,140,.4) 100%);
      z-index: 0;
    }
    .bg-decor { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .bg-circle { position: absolute; border-radius: 50%; background: rgba(255,255,255,.08); }
    .bg-circle-1 { width: 320px; height: 320px; top: -80px; right: -100px; animation: float 6s ease-in-out infinite; }
    .bg-circle-2 { width: 220px; height: 220px; bottom: 16%; left: -80px; background: rgba(255,255,255,.05); animation: float 8s ease-in-out infinite reverse; }
    .bg-circle-3 { width: 150px; height: 150px; top: 46%; right: 18%; background: rgba(255,255,255,.06); animation: float 5s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-15px) scale(1.05); }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 750px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(var(--safe-top) + 28px) 7.5% calc(var(--safe-bottom) + 28px);
    }

    /* ========== 顶部品牌 ========== */
    .login-header { text-align: center; margin-bottom: 28px; animation: slideDown .5s ease; }
    .logo-wrap {
      width: 76px; height: 76px;
      margin: 0 auto 16px;
      background: rgba(255,255,255,.96);
      border-radius: var(--radius-xl);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,.16);
    }
    .logo-wrap img { width: 46px; height: 46px; object-fit: contain; }
    .sys-name {
      font-size: var(--font-2xl);
      font-weight: var(--font-bold);
      color: #fff;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px rgba(0,0,0,.2);
      margin-bottom: 6px;
    }
    .sys-sub { font-size: var(--font-base); color: rgba(255,255,255,.82); letter-spacing: 2px; }

    /* ========== 登录卡片 ========== */
    .login-card {
      width: 100%;
      background: #fff;
      border-radius: var(--radius-xl);
      box-shadow: 0 12px 40px rgba(0,0,0,.16);
      padding: 26px 22px 22px;
      animation: slideUp .5s ease .1s both;
    }

    /* 未登录拦截提示条 */
    .notice-bar {
      display: none;
      align-items: flex-start;
      gap: var(--space-2);
      background: var(--warning-bg);
      border: 1px solid #ffe58f;
      color: var(--warning-dark);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      font-size: var(--font-sm);
      line-height: 1.6;
      margin-bottom: var(--space-4);
    }
    .notice-bar.show { display: flex; }
    .notice-bar svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      height: 50px;
      padding: 0 14px;
      margin-bottom: 6px;
      background: var(--gray-100);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      transition: border-color var(--transition-fast), background var(--transition-fast);
    }
    .input-group:focus-within { border-color: var(--primary-500); background: #fff; }
    .input-group.error { border-color: var(--error); background: var(--error-bg); }
    .input-icon { width: 20px; height: 20px; color: var(--gray-500); flex-shrink: 0; }
    .input-group input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-size: var(--font-md);
      color: var(--text);
      font-family: var(--font-family);
    }
    .input-group input::placeholder { color: var(--text-placeholder); }

    /* 验证码按钮 */
    .code-btn {
      flex-shrink: 0;
      border: none;
      background: transparent;
      color: var(--primary-600);
      font-size: var(--font-sm);
      font-weight: var(--font-medium);
      font-family: var(--font-family);
      padding: 0 0 0 var(--space-3);
      border-left: 1px solid var(--border);
      cursor: pointer;
      white-space: nowrap;
    }
    .code-btn:disabled { color: var(--text-placeholder); cursor: not-allowed; }

    .error-msg {
      display: none;
      font-size: var(--font-xs);
      color: var(--error);
      padding: 0 2px var(--space-2);
    }
    .error-msg.show { display: block; }

    /* 图形验证码（需求 6.2.1 防爆破） */
    .captcha-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-2);
    }
    .captcha-row .input-group { flex: 1; margin-bottom: 0; }
    .captcha-img {
      width: 104px; height: 50px;
      flex-shrink: 0;
      border-radius: var(--radius-md);
      background: var(--gray-100);
      border: 1px solid var(--border);
      cursor: pointer;
      object-fit: cover;
    }

    .btn-login {
      width: 100%;
      height: 50px;
      margin-top: var(--space-4);
      border: none;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: #fff;
      font-size: var(--font-md);
      font-weight: var(--font-semibold);
      letter-spacing: 4px;
      font-family: var(--font-family);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(34,168,74,.35);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }
    .btn-login:active { transform: scale(.98); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; box-shadow: none; }
    .btn-login .spinner {
      display: none;
      position: absolute; top: 50%; left: 50%;
      width: 22px; height: 22px; margin: -11px 0 0 -11px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    .btn-login.loading .btn-text { opacity: 0; }
    .btn-login.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .agreement {
      margin-top: var(--space-4);
      text-align: center;
      font-size: var(--font-xs);
      color: var(--text-tertiary);
      line-height: 1.7;
    }
    .agreement a { color: var(--primary-600); text-decoration: none; }

    .demo-hint {
      margin-top: var(--space-3);
      text-align: center;
      font-size: var(--font-xs);
      color: var(--text-secondary);
      background: var(--primary-50);
      border-radius: var(--radius-md);
      padding: 8px;
      line-height: 1.7;
    }

    /* ========== 游客浏览 ========== */
    .guest-row {
      margin-top: var(--space-4);
      text-align: center;
      animation: slideUp .5s ease .2s both;
    }
    .btn-ghost {
      border: 1px solid rgba(255,255,255,.7);
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: var(--font-base);
      font-family: var(--font-family);
      padding: 11px 28px;
      border-radius: var(--radius-full);
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .guest-tip { margin-top: 10px; font-size: var(--font-xs); color: rgba(255,255,255,.8); }

    .copyright {
      margin-top: auto;
      padding-top: var(--space-6);
      font-size: var(--font-2xs);
      color: rgba(255,255,255,.7);
      text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,.45);
    }

    @keyframes slideDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .login-header, .login-card, .guest-row, .bg-circle { animation: none; }
    }
  </style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>
  </div>

  <div class="container">
    <div class="login-header">
      <div class="logo-wrap">
        <img src="../common/images/brand_logo.png" alt="智慧果园logo">
      </div>
      <div class="sys-name">移动商城</div>
      <div class="sys-sub">原产地直采 · 从枝头到舌尖</div>
    </div>

    <div class="login-card">
      <!-- 未登录被拦截时的提示 -->
      <div class="notice-bar" id="noticeBar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="noticeText">请先登录后继续操作</span>
      </div>

      <div class="input-group" id="phoneGroup">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>
        </svg>
        <input type="tel" id="phone" inputmode="numeric" maxlength="11" placeholder="请输入手机号" autocomplete="tel" aria-label="手机号">
        <div class="error-msg" id="phoneError">请输入手机号</div>
      </div>

      <div class="input-group" id="codeGroup">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h5"/>
        </svg>
        <input type="tel" id="smsCode" inputmode="numeric" maxlength="6" placeholder="短信验证码" autocomplete="one-time-code" aria-label="短信验证码">
        <button type="button" class="code-btn" id="btnSendCode">获取验证码</button>
        <div class="error-msg" id="codeError">请输入验证码</div>
      </div>

      <!-- 图形验证码：连发 3 次以上才出现，兼顾顺滑与防爆破 -->
      <div class="captcha-row" id="captchaRow" style="display:none;">
        <div class="input-group" id="captchaGroup">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1z"/>
          </svg>
          <input type="text" id="captchaInput" maxlength="4" placeholder="图形验证码" aria-label="图形验证码" style="letter-spacing:4px;">
        </div>
        <img class="captcha-img" id="captchaImg" alt="点击刷新图形验证码" title="点击刷新">
      </div>
      <div class="error-msg" id="captchaError">图形验证码错误</div>

      <button type="button" class="btn-login" id="btnLogin">
        <span class="btn-text">登 录</span>
        <span class="spinner"></span>
      </button>

      <div class="agreement">
        登录即代表同意<a href="javascript:void(0)" id="linkTerms">《用户协议》</a>和<a href="javascript:void(0)" id="linkPrivacy">《隐私政策》</a>
      </div>

      <div class="demo-hint">
        演示：手机号 <strong>15111480531</strong> · 验证码 <strong>123456</strong>
      </div>
    </div>

    <!-- 游客浏览：需求允许游客浏览商城，仅下单/认养等强操作需登录 -->
    <div class="guest-row">
      <button type="button" class="btn-ghost" id="btnGuest">先随便逛逛</button>
      <div class="guest-tip">浏览商品与溯源无需登录，下单与认养需登录</div>
    </div>

    <div class="copyright">© 2026 湖南智农数果科技有限公司 All Rights Reserved</div>
  </div>

  <script src="js/h5-auth.js"></script>
  <script>
  (function () {
    var backUrl = H5Auth.consumeRedirect('h5_store.html');

    /* ---------- 已登录直接回跳 ---------- */
    if (H5Auth.isLoggedIn()) {
      location.replace(backUrl);
      return;
    }

    /* ---------- 被拦截时的提示 ---------- */
    var reason = H5Auth.consumeReason();
    if (reason) {
      document.getElementById('noticeText').textContent = reason;
      document.getElementById('noticeBar').classList.add('show');
    }

    /* ------------------------------------------------------------
     * 演示账号。原型无后端，验证码在本机校验；
     * 生产环境必须改为服务端下发与校验短信验证码。
     * ------------------------------------------------------------ */
    var DEMO_PHONE = '15111480531';
    var DEMO_CODE = '123456';
    var CODE_TTL = 60;          // 验证码有效期（秒）
    var RESEND_INTERVAL = 60;   // 重发冷却（秒）
    var MAX_ATTEMPTS = 5;       // 验证码错误上限，超出后要求图形验证码
    var LOCK_MS = 30000;        // 锁定 30 秒

    var issuedCode = '';        // 本机已下发的验证码
    var issuedAt = 0;           // 下发时间戳
    var failCount = 0;
    var lockUntil = 0;
    var captchaAnswer = '';
    var sendCount = 0;          // 本次会话已发送次数

    var phoneEl = document.getElementById('phone');
    var codeEl = document.getElementById('smsCode');
    var captchaInput = document.getElementById('captchaInput');
    var btnSend = document.getElementById('btnSendCode');
    var btnLogin = document.getElementById('btnLogin');

    /* ---------- 错误提示 ---------- */
    function setError(groupId, msgId, msg) {
      var g = document.getElementById(groupId);
      var m = document.getElementById(msgId);
      if (g) g.classList.add('error');
      if (m) { m.textContent = msg; m.classList.add('show'); }
    }
    function clearError(groupId, msgId) {
      var g = document.getElementById(groupId);
      var m = document.getElementById(msgId);
      if (g) g.classList.remove('error');
      if (m) m.classList.remove('show');
    }
    function showToast(text) {
      var t = document.createElement('div');
      t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;max-width:80%;text-align:center;';
      t.textContent = text;
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 2000);
    }

    /* ---------- 图形验证码 ---------- */
    function drawCaptcha() {
      var chars = 'ABCDEFGHJKMNPQRSTUVWXY345678';
      var text = '';
      for (var i = 0; i < 4; i++) text += chars.charAt(Math.floor(Math.random() * chars.length));
      captchaAnswer = text;

      var w = 104, h = 50;
      var canvas = document.createElement('canvas');
      canvas.width = w * 2; canvas.height = h * 2;
      var ctx = canvas.getContext('2d');
      ctx.scale(2, 2);
      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(0, 0, w, h);

      // 干扰线
      ctx.strokeStyle = 'rgba(0,0,0,.12)';
      ctx.lineWidth = 1;
      for (var i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(Math.random() * w, Math.random() * h);
        ctx.lineTo(Math.random() * w, Math.random() * h);
        ctx.stroke();
      }
      // 字符（随机旋转 + 上下偏移）
      var colors = ['#1a6a38', '#1a8a3c', '#8B7355', '#cf1322'];
      for (var j = 0; j < text.length; j++) {
        ctx.save();
        ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
        ctx.font = 'bold 22px ' + (window.getComputedStyle(document.body).fontFamily || 'sans-serif');
        ctx.textBaseline = 'middle';
        ctx.translate(14 + j * 24, h / 2 + (Math.random() * 8 - 4));
        ctx.rotate((Math.random() * 0.5 - 0.25));
        ctx.fillText(text.charAt(j), 0, 0);
        ctx.restore();
      }
      document.getElementById('captchaImg').src = canvas.toDataURL('image/png');
    }
    document.getElementById('captchaImg').addEventListener('click', function () {
      drawCaptcha();
      captchaInput.value = '';
      clearError('captchaGroup', 'captchaError');
    });

    function captchaRequired() {
      return failCount >= MAX_ATTEMPTS - 2 || sendCount >= 3;
    }
    function syncCaptcha() {
      var need = captchaRequired();
      var row = document.getElementById('captchaRow');
      if (need && row.style.display === 'none') {
        row.style.display = 'flex';
        drawCaptcha();
      } else if (!need) {
        row.style.display = 'none';
        captchaAnswer = '';
        captchaInput.value = '';
      }
    }

    /* ---------- 发送验证码 ---------- */
    var coolTimer = null;
    function startCooldown(seconds) {
      btnSend.disabled = true;
      var left = seconds;
      btnSend.textContent = left + ' 秒后重发';
      clearInterval(coolTimer);
      coolTimer = setInterval(function () {
        left--;
        if (left <= 0) {
          clearInterval(coolTimer);
          btnSend.disabled = false;
          btnSend.textContent = '重新获取';
        } else {
          btnSend.textContent = left + ' 秒后重发';
        }
      }, 1000);
    }

    btnSend.addEventListener('click', function () {
      clearError('phoneGroup', 'phoneError');
      clearError('captchaGroup', 'captchaError');
      var phone = phoneEl.value.trim();
      if (!/^1\d{10}$/.test(phone)) {
        setError('phoneGroup', 'phoneError', '请输入正确的 11 位手机号');
        return;
      }
      if (captchaRequired() &&
          captchaInput.value.trim().toUpperCase() !== captchaAnswer) {
        setError('captchaGroup', 'captchaError', '图形验证码错误');
        drawCaptcha();
        captchaInput.value = '';
        return;
      }

      issuedCode = phone === DEMO_PHONE ? DEMO_CODE : String(Math.floor(100000 + Math.random() * 900000));
      issuedAt = Date.now();
      sendCount++;
      syncCaptcha();
      startCooldown(RESEND_INTERVAL);
      showToast(phone === DEMO_PHONE
        ? '演示环境验证码为 ' + DEMO_CODE
        : '验证码已发送（演示环境任意 6 位数字均可通过）');
    });

    /* ---------- 登录 ---------- */
    btnLogin.addEventListener('click', function () {
      clearError('phoneGroup', 'phoneError');
      clearError('codeGroup', 'codeError');
      clearError('captchaGroup', 'captchaError');

      if (Date.now() < lockUntil) {
        showToast('尝试次数过多，请 ' + Math.ceil((lockUntil - Date.now()) / 1000) + ' 秒后再试');
        return;
      }

      var phone = phoneEl.value.trim();
      var code = codeEl.value.trim();

      if (!/^1\d{10}$/.test(phone)) {
        setError('phoneGroup', 'phoneError', '请输入正确的 11 位手机号');
        return;
      }
      if (!/^\d{6}$/.test(code)) {
        setError('codeGroup', 'codeError', '请输入 6 位短信验证码');
        return;
      }
      if (!issuedCode) {
        setError('codeGroup', 'codeError', '请先获取验证码');
        return;
      }
      if (Date.now() - issuedAt > CODE_TTL * 1000) {
        issuedCode = '';
        setError('codeGroup', 'codeError', '验证码已过期，请重新获取');
        return;
      }
      if (captchaRequired() &&
          captchaInput.value.trim().toUpperCase() !== captchaAnswer) {
        setError('captchaGroup', 'captchaError', '图形验证码错误');
        drawCaptcha();
        captchaInput.value = '';
        return;
      }
      if (code !== issuedCode) {
        failCount++;
        setError('codeGroup', 'codeError', failCount >= MAX_ATTEMPTS
          ? '验证码错误次数过多'
          : '验证码错误，还可尝试 ' + (MAX_ATTEMPTS - failCount) + ' 次');
        if (failCount >= MAX_ATTEMPTS) lockUntil = Date.now() + LOCK_MS;
        syncCaptcha();
        return;
      }

      failCount = 0;
      btnLogin.classList.add('loading');
      btnLogin.disabled = true;

      // 演示环境以手机号尾号派生用户名，保持与既有 C 端数据的归属字段一致
      setTimeout(function () {
        H5Auth.login(phone, { phone: phone, role: '普通会员' });
        location.replace(backUrl);
      }, 600);
    });

    /* ---------- 游客浏览 ---------- */
    document.getElementById('btnGuest').addEventListener('click', function () {
      location.replace(backUrl);
    });

    /* ---------- 协议 / 隐私 ---------- */
    function openInfo(title, body) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
      overlay.innerHTML =
        '<div style="background:#fff;border-radius:14px;width:100%;max-width:420px;max-height:76vh;overflow-y:auto;padding:18px;">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
            '<h3 style="margin:0;font-size:16px;color:var(--text);">' + title + '</h3>' +
            '<span style="color:#999;cursor:pointer;font-size:14px;">关闭</span>' +
          '</div>' +
          '<div style="white-space:pre-wrap;font-size:13px;line-height:1.85;color:var(--text-secondary);">' + body + '</div>' +
        '</div>';
      overlay.addEventListener('click', function (e) { if (e.target === overlay) overlay.remove(); });
      overlay.querySelector('span').addEventListener('click', function () { overlay.remove(); });
      document.body.appendChild(overlay);
    }
    document.getElementById('linkTerms').addEventListener('click', function () {
      openInfo('用户协议',
        '欢迎使用天水花牛苹果移动商城。本协议由您与天水花牛苹果（集团）有限责任公司共同签订，约定双方在本平台购物、认养、溯源等环节的权利与义务。\n\n' +
        '· 您应保证账号信息真实有效，妥善保管登录凭证；\n' +
        '· 商品价格与库存以结算页为准，下单后请在 30 分钟内完成支付；\n' +
        '· 认养果树在协议期内归您专属，采收品质按《有机产品标准》执行；\n' +
        '· 禁止利用平台从事虚假交易、刷单等违规行为。\n\n' +
        '完整协议可联系客服获取。');
    });
    document.getElementById('linkPrivacy').addEventListener('click', function () {
      openInfo('隐私政策',
        '我们非常重视您的个人信息安全，本政策简要说明 H5 端的数据处理范围：\n\n' +
        '· 账号信息（手机号、收货地址）仅用于订单履约与售后服务；\n' +
        '· 浏览与缓存数据保存在您的设备本地，您可随时通过「设置 → 清除缓存」清理；\n' +
        '· 农事/溯源数据来源于生产基地与第三方检测机构，仅按您授权的产品/批次展示；\n' +
        '· 我们不会将您的个人数据用于本平台业务以外的目的，亦不会出售给第三方。\n\n' +
        '如需查阅完整《隐私政策》或申请数据导出与删除，请联系客服。');
    });

    /* ---------- 输入联动 ---------- */
    phoneEl.addEventListener('input', function () {
      clearError('phoneGroup', 'phoneError');
      syncCaptcha();
    });
    codeEl.addEventListener('input', function () { clearError('codeGroup', 'codeError'); });
    captchaInput.addEventListener('input', function () { clearError('captchaGroup', 'captchaError'); });
  })();
  </script>
