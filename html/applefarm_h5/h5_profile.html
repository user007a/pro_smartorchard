<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>个人信息 - 智慧果园</title>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    .profile-section { padding: var(--space-4); padding-bottom: 100px; }

    .avatar-section {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      margin-bottom: var(--space-4);
      border: 1px solid var(--border);
      text-align: center;
    }

    .avatar-box {
      width: 80px;
      height: 80px;
      margin: 0 auto var(--space-3);
      border-radius: var(--radius-full);
      background: var(--gradient-header);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .avatar-box svg {
      width: 40px;
      height: 40px;
      color: white;
    }

    .avatar-edit {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 28px;
      height: 28px;
      background: var(--bg-white);
      border-radius: var(--radius-full);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .avatar-edit svg {
      width: 14px;
      height: 14px;
      color: var(--text-secondary);
    }

    .profile-name-display {
      font-size: var(--font-lg);
      font-weight: var(--font-semibold);
      color: var(--text);
    }

    .info-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      border: 1px solid var(--border);
    }

    .info-card-title {
      font-size: var(--font-md);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .info-card-title svg {
      width: 18px;
      height: 18px;
      color: var(--primary);
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-light);
    }

    .info-row:last-child { border-bottom: none; }

    .info-label {
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }

    .info-value {
      font-size: var(--font-sm);
      color: var(--text);
      font-weight: var(--font-medium);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .info-value svg {
      width: 14px;
      height: 14px;
      color: var(--text-tertiary);
    }

    .info-edit {
      color: var(--primary);
      cursor: pointer;
    }

    .vip-tag {
      display: inline-block;
      padding: 2px 8px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      border-radius: var(--radius-sm);
      font-size: var(--font-xs);
      font-weight: var(--font-medium);
    }

    .address-card {
      background: var(--gray-50);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      margin-top: var(--space-2);
    }

    .address-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-1);
    }

    .address-name {
      font-size: var(--font-sm);
      font-weight: var(--font-semibold);
      color: var(--text);
    }

    .address-phone {
      font-size: var(--font-xs);
      color: var(--text-secondary);
    }

    .address-default {
      display: inline-block;
      padding: 1px 6px;
      background: var(--primary-50);
      color: var(--primary-700);
      border-radius: var(--radius-sm);
      font-size: var(--font-2xs);
    }

    .address-detail {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .stats-row {
      display: flex;
      gap: var(--space-3);
      margin-top: var(--space-3);
    }

    .stat-box {
      flex: 1;
      background: var(--gray-50);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      text-align: center;
    }

    .stat-num {
      font-size: var(--font-lg);
      font-weight: var(--font-extrabold);
      color: var(--primary);
      font-family: var(--font-family-number);
    }

    .stat-label {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-top: var(--space-1);
    }
  </style>
</head>
<body>
  <div class="mb-app">
    <header class="mb-header-detail">
      <div class="header-nav">
        <div class="header-back" onclick="history.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
        <div class="header-title">个人信息</div>
      </div>
    </header>

    <div class="profile-section">
      <!-- 头像区域 -->
      <div class="avatar-section">
        <div class="avatar-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <div class="avatar-edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </div>
        </div>
        <div class="profile-name-display">张三 <span class="vip-tag">VIP会员</span></div>
      </div>

      <!-- 基本信息 -->
      <div class="info-card">
        <div class="info-card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          基本信息
        </div>
        <div class="info-row">
          <span class="info-label">姓名</span>
          <span class="info-value">张三 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
        </div>
        <div class="info-row">
          <span class="info-label">手机号</span>
          <span class="info-value">138****8888 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
        </div>
        <div class="info-row">
          <span class="info-label">会员等级</span>
          <span class="info-value"><span class="vip-tag">VIP会员</span></span>
        </div>
        <div class="info-row">
          <span class="info-label">注册时间</span>
          <span class="info-value">2026.01.15</span>
        </div>
      </div>

      <!-- 收货地址 -->
      <div class="info-card">
        <div class="info-card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          收货地址
        </div>
        <div class="address-card">
          <div class="address-header">
            <span class="address-name">张三</span>
            <span class="address-phone">138****8888</span>
            <span class="address-default">默认</span>
          </div>
          <div class="address-detail">北京市朝阳区建国路88号 智慧果园大厦 1号楼 101室</div>
        </div>
        <div class="info-row" style="margin-top: var(--space-2);">
          <span class="info-label">其他地址</span>
          <span class="info-value info-edit" onclick="manageAddress()">管理地址 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
        </div>
      </div>

      <!-- 账户统计 -->
      <div class="info-card">
        <div class="info-card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          账户统计
        </div>
        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-num">5</div>
            <div class="stat-label">订单数</div>
          </div>
          <div class="stat-box">
            <div class="stat-num">2</div>
            <div class="stat-label">认养数</div>
          </div>
          <div class="stat-box">
            <div class="stat-num">128</div>
            <div class="stat-label">积分</div>
          </div>
        </div>
        <div class="info-row" style="margin-top: var(--space-3);">
          <span class="info-label">已开发票</span>
          <span class="info-value">3 张 <span class="info-edit" onclick="viewInvoices()">查看</span></span>
        </div>
      </div>
    </div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('index.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_store.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>商城</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('trace_h5.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>溯源</span>
      </div>
      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </nav>
  </div>

  <script>
    function navigateTo(page) { window.location.href = page; }

    function manageAddress() {
      showToast('地址管理功能开发中...');
    }

    function viewInvoices() {
      showToast('发票查看功能开发中...');
    }

    function showToast(message) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;animation:fadeInOut 2s ease;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2000);
    }
    var style = document.createElement('style');
    style.textContent = '@keyframes fadeInOut { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0} }';
    document.head.appendChild(style);
  </script>
</body>
</html>
