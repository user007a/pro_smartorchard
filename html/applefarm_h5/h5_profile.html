<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>个人信息 - 移动商城</title>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    .profile-section { padding: var(--space-4); padding-bottom: 100px; }

    .avatar-section {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      margin-bottom: var(--space-4);
      border: 1px solid var(--border);
      text-align: center;
    }

    .avatar-box {
      width: 80px;
      height: 80px;
      margin: 0 auto var(--space-3);
      border-radius: var(--radius-full);
      background: var(--gradient-header);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .avatar-box svg {
      width: 40px;
      height: 40px;
      color: white;
    }

    .avatar-edit {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 28px;
      height: 28px;
      background: var(--bg-white);
      border-radius: var(--radius-full);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .avatar-edit svg {
      width: 14px;
      height: 14px;
      color: var(--text-secondary);
    }

    .profile-name-display {
      font-size: var(--font-lg);
      font-weight: var(--font-semibold);
      color: var(--text);
    }

    .info-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      border: 1px solid var(--border);
    }

    .info-card-title {
      font-size: var(--font-md);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .info-card-title svg {
      width: 18px;
      height: 18px;
      color: var(--primary);
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-light);
    }

    .info-row:last-child { border-bottom: none; }

    .info-label {
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }

    .info-value {
      font-size: var(--font-sm);
      color: var(--text);
      font-weight: var(--font-medium);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .info-value svg {
      width: 14px;
      height: 14px;
      color: var(--text-tertiary);
    }

    .info-edit {
      color: var(--primary);
      cursor: pointer;
    }

    .vip-tag {
      display: inline-block;
      padding: 2px 8px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      border-radius: var(--radius-sm);
      font-size: var(--font-xs);
      font-weight: var(--font-medium);
    }

    .address-card {
      background: var(--gray-50);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      margin-top: var(--space-2);
    }

    .address-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-1);
    }

    .address-name {
      font-size: var(--font-sm);
      font-weight: var(--font-semibold);
      color: var(--text);
    }

    .address-phone {
      font-size: var(--font-xs);
      color: var(--text-secondary);
    }

    .address-default {
      display: inline-block;
      padding: 1px 6px;
      background: var(--primary-50);
      color: var(--primary-700);
      border-radius: var(--radius-sm);
      font-size: var(--font-2xs);
    }

    .address-detail {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .stats-row {
      display: flex;
      gap: var(--space-3);
      margin-top: var(--space-3);
    }

    .stat-box {
      flex: 1;
      background: var(--gray-50);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      text-align: center;
    }

    .stat-num {
      font-size: var(--font-lg);
      font-weight: var(--font-extrabold);
      color: var(--primary);
      font-family: var(--font-family-number);
    }

    .stat-label {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-top: var(--space-1);
    }
  </style>
</head>
<body>
  <div class="mb-app">

    <div class="profile-section">
      <!-- 头像区域 -->
      <div class="avatar-section">
        <div class="avatar-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <div class="avatar-edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </div>
        </div>
        <div class="profile-name-display">刘友宝 <span class="vip-tag">VIP会员</span></div>
      </div>

      <!-- 基本信息 -->
      <div class="info-card">
        <div class="info-card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          基本信息
        </div>
        <div class="info-row">
          <span class="info-label">姓名</span>
          <span class="info-value">刘友宝 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
        </div>
        <div class="info-row">
          <span class="info-label">手机号</span>
          <span class="info-value">15111480531 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
        </div>
        <div class="info-row">
          <span class="info-label">会员等级</span>
          <span class="info-value"><span class="vip-tag">VIP会员</span></span>
        </div>
        <div class="info-row">
          <span class="info-label">注册时间</span>
          <span class="info-value">2026.06.15</span>
        </div>
      </div>

      <!-- 收货地址 -->
      <div class="info-card">
        <div class="info-card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          收货地址
        </div>
        <div class="address-card">
          <div class="address-header">
            <span class="address-name">刘友宝</span>
            <span class="address-phone">15111480531</span>
            <span class="address-default">默认</span>
          </div>
          <div class="address-detail">湖南省长沙市麓云路159号佳境小区15#1406</div>
        </div>
        <div class="info-row" style="margin-top: var(--space-2);">
          <span class="info-label">其他地址</span>
          <span class="info-value info-edit" onclick="manageAddress()">管理地址 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
        </div>
      </div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('index.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_store.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>商城</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('trace_h5.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>溯源</span>
      </div>
      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </nav>
  </div>

  <script>
    function navigateTo(page) { window.location.href = page; }

    function manageAddress() {
      // 地址管理：使用 localStorage 持久化地址列表，支持新增/编辑/设为默认
      var list = [];
      try { list = JSON.parse(localStorage.getItem('h5_addresses') || '[]'); } catch (e) {}
      var html = '';
      if (!list.length) {
        html = '<p style="text-align:center;color:#999;margin:24px 0;">暂无地址，请点击下方新增</p>';
      } else {
        html = list.map(function(a, i){
          return '<div class="addr-item" data-idx="' + i + '" style="border:1px solid #eee;border-radius:8px;padding:12px;margin:8px 0;">' +
            '<div style="display:flex;justify-content:space-between;">' +
            '<strong>' + (a.name || '') + ' ' + (a.phone || '') + '</strong>' +
            (a.default ? '<span style="color:var(--primary);font-size:12px;">默认</span>' : '') +
            '</div>' +
            '<div style="margin-top:6px;color:#666;font-size:13px;">' + (a.region || '') + ' ' + (a.detail || '') + '</div>' +
            '<div style="margin-top:8px;text-align:right;">' +
            '<button style="margin-right:8px;color:#999;" onclick="editAddress(' + i + ')">编辑</button>' +
            '<button style="color:var(--danger);" onclick="deleteAddress(' + i + ')">删除</button>' +
            '</div>' +
            '</div>';
        }).join('');
      }
      html += '<form id="addrForm" style="margin-top:16px;border-top:1px solid #eee;padding-top:16px;">' +
        '<div><input id="addrName" placeholder="收货人" style="width:100%;padding:8px;margin:4px 0;"></div>' +
        '<div><input id="addrPhone" placeholder="手机号" style="width:100%;padding:8px;margin:4px 0;"></div>' +
        '<div><input id="addrRegion" placeholder="省/市/区" style="width:100%;padding:8px;margin:4px 0;"></div>' +
        '<div><textarea id="addrDetail" placeholder="详细地址" style="width:100%;padding:8px;margin:4px 0;"></textarea></div>' +
        '<label style="display:flex;align-items:center;margin:8px 0;"><input type="checkbox" id="addrDefault"> 设为默认</label>' +
        '<div style="display:flex;gap:8px;">' +
        '<button type="button" onclick="saveAddress()" style="flex:1;background:var(--primary);color:#fff;padding:8px;border-radius:6px;">保存</button>' +
        '<button type="button" onclick="closeModal()" style="flex:1;background:#eee;color:#333;padding:8px;border-radius:6px;">取消</button>' +
        '</div></form>';
      showModal('地址管理', html);
    }

    function showModal(title, html) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;';
      overlay.innerHTML = '<div style="background:#fff;border-radius:10px;width:90%;max-width:420px;max-height:80vh;overflow-y:auto;padding:16px;">' +
        '<h3 style="margin-bottom:12px;">' + title + '</h3>' + html +
        '</div>';
      document.body.appendChild(overlay);
      window.__addrOverlay = overlay;
    }

    function closeModal() {
      if (window.__addrOverlay) { window.__addrOverlay.remove(); window.__addrOverlay = null; }
    }

    function saveAddress() {
      var list = [];
      try { list = JSON.parse(localStorage.getItem('h5_addresses') || '[]'); } catch (e) {}
      var name = document.getElementById('addrName').value.trim();
      var phone = document.getElementById('addrPhone').value.trim();
      var region = document.getElementById('addrRegion').value.trim();
      var detail = document.getElementById('addrDetail').value.trim();
      var isDefault = document.getElementById('addrDefault').checked;
      var editIdx = window.__addrEditIdx;
      if (!name || !phone || !detail) { showToast('请填写完整'); return; }
      if (!/^1\d{10}$/.test(phone)) { showToast('手机号格式不正确'); return; }
      var addr = { name: name, phone: phone, region: region, detail: detail, default: isDefault };
      if (isDefault) list.forEach(function(a){ a.default = false; });
      if (editIdx != null && editIdx >= 0) {
        list[editIdx] = addr;
      } else {
        list.push(addr);
      }
      if (!list.some(function(a){ return a.default; }) && list.length) list[0].default = true;
      localStorage.setItem('h5_addresses', JSON.stringify(list));
      window.__addrEditIdx = null;
      closeModal();
      manageAddress();
      showToast('地址已保存');
    }

    function editAddress(idx) {
      var list = [];
      try { list = JSON.parse(localStorage.getItem('h5_addresses') || '[]'); } catch (e) {}
      var a = list[idx];
      if (!a) return;
      window.__addrEditIdx = idx;
      manageAddress();
      document.getElementById('addrName').value = a.name || '';
      document.getElementById('addrPhone').value = a.phone || '';
      document.getElementById('addrRegion').value = a.region || '';
      document.getElementById('addrDetail').value = a.detail || '';
      document.getElementById('addrDefault').checked = !!a.default;
    }

    function deleteAddress(idx) {
      if (!confirm('确定删除该地址？')) return;
      var list = [];
      try { list = JSON.parse(localStorage.getItem('h5_addresses') || '[]'); } catch (e) {}
      list.splice(idx, 1);
      localStorage.setItem('h5_addresses', JSON.stringify(list));
      closeModal();
      manageAddress();
      showToast('地址已删除');
    }

    function viewInvoices() {
      var list = [];
      try { list = JSON.parse(localStorage.getItem('h5_invoices') || '[]'); } catch (e) {}
      var html = '';
      if (!list.length) {
        html = '<p style="text-align:center;color:#999;margin:24px 0;">暂无发票记录，发票将在订单完成后自动生成</p>';
      } else {
        html = list.map(function(inv){
          return '<div style="border:1px solid #eee;border-radius:8px;padding:12px;margin:8px 0;">' +
            '<div><strong>' + (inv.title || '') + '</strong></div>' +
            '<div style="color:#666;font-size:13px;margin-top:4px;">金额：¥' + (inv.amount || 0) + ' · 类型：' + (inv.type || '电子普通发票') + '</div>' +
            '</div>';
        }).join('');
      }
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;';
      overlay.innerHTML = '<div style="background:#fff;border-radius:10px;width:90%;max-width:420px;max-height:80vh;overflow-y:auto;padding:16px;">' +
        '<h3 style="margin-bottom:12px;">发票管理</h3>' + html +
        '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="margin-top:16px;width:100%;background:#eee;color:#333;padding:8px;border-radius:6px;">关闭</button>' +
        '</div>';
      document.body.appendChild(overlay);
    }

    function showToast(message) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;animation:fadeInOut 2s ease;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2000);
    }
    var style = document.createElement('style');
    style.textContent = '@keyframes fadeInOut { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0} }';
    document.head.appendChild(style);
  </script>
</body>
</html>
