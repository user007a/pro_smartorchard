<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的认养 - 移动商城</title>
  <script src="js/h5-auth.js"></script>
  <script>H5Auth.require();</script>
  <script src="js/h5-data.js"></script>
  <script src="js/h5-back.js"></script>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    .adoption-section { padding: var(--space-4); padding-bottom: 100px; }

    .adoption-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .adoption-header {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .adoption-img {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      flex-shrink: 0;
    }

    .adoption-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .adoption-info { flex: 1; }

    .adoption-name {
      font-size: var(--font-base);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-1);
    }

    .adoption-id {
      font-size: var(--font-xs);
      color: var(--text-secondary);
    }

    .adoption-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: var(--font-xs);
      font-weight: var(--font-medium);
    }

    .adoption-status.active {
      background: var(--success-light);
      color: var(--success-dark);
    }

    .adoption-status.growing {
      background: var(--primary-50);
      color: var(--primary-700);
    }

    .adoption-status.harvest {
      background: var(--harvest-50);
      color: var(--harvest-700);
    }

    .adoption-details {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      padding: var(--space-3);
      background: var(--gray-50);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-3);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-label {
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }

    .detail-value {
      font-size: var(--font-sm);
      color: var(--text);
      font-weight: var(--font-medium);
    }

    .adoption-progress {
      margin-bottom: var(--space-3);
    }

    .progress-title {
      font-size: var(--font-sm);
      font-weight: var(--font-medium);
      color: var(--text);
      margin-bottom: var(--space-2);
    }

    .progress-bar {
      height: 8px;
      background: var(--gray-200);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--gradient-primary);
      border-radius: var(--radius-full);
      transition: width var(--transition-normal);
    }

    .progress-text {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-top: var(--space-1);
    }

    .adoption-actions {
      display: flex;
      gap: var(--space-2);
    }

    .action-btn {
      flex: 1;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      font-size: var(--font-sm);
      font-weight: var(--font-medium);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
    }

    .action-btn.primary {
      background: var(--primary-50);
      color: var(--primary-700);
      border: 1px solid var(--primary-200);
    }

    .action-btn.primary:active {
      background: var(--primary-100);
    }

    .action-btn.secondary {
      background: var(--gray-100);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .action-btn.secondary:active {
      background: var(--gray-200);
    }

    .action-btn.monitor {
      background: var(--info-bg, #e6f4ff);
      color: var(--info, #1677ff);
      border: 1px solid var(--info-border, #91caff);
    }

    .action-btn.monitor:active {
      background: var(--info-bg, #d6e9ff);
    }

    .empty-state {
      text-align: center;
      padding: var(--space-8) var(--space-4);
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto var(--space-4);
      background: var(--gray-100);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-icon svg {
      width: 40px;
      height: 40px;
      color: var(--text-tertiary);
    }

    .empty-title {
      font-size: var(--font-md);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-2);
    }

    .empty-desc {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: var(--space-4);
    }
  </style>
</head>
<body>
  <div class="mb-app">

    <!-- 返回栏 -->
    <div class="mb-back-bar">
      <button class="mb-back-arrow" type="button" onclick="H5Back.go('h5_member.html')" aria-label="返回上一页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="mb-back-title">我的认养</div>
    </div>

    <div class="adoption-section" id="adoptionList">
      <!-- 认养卡片由 js 依据后端 sf_adoption_tree 动态渲染 -->
    </div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('index.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_store.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>商城</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('trace_h5.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>溯源</span>
      </div>
      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </nav>
  </div>

  <script>
    /* ============================================================
     * 我的认养（严格空库：数据来自后端 sf_adoption_tree）
     * 唯一数据源：后端 sf_adoption_tree（resource = adoption_tree），
     *   按当前会员归属（customer_id / adopter_phone）过滤，仅展示已认养果树。
     *   字段映射（后端 snake_case → 前端 camelCase）：
     *     tree_code → treeCode, tree_name → treeName, growth_stage → growthStage,
     *     progress → progress, start_date → startDate, duration → duration,
     *     year_fee → yearFee, plot_name → plotName, expire_time → expireTime,
     *     customer_id → customerId, adopter_phone → adopterPhone,
     *     camera_id → cameraId, open_scene → openScene
     * 无数据时显示空态并引导，不自动播种演示数据。
     * ============================================================ */

    // status → 中文文案与样式类
    var STATUS_MAP = {
      growing:   { text: '生长中', cls: 'growing' },
      flowering: { text: '开花期', cls: 'growing' },
      fruiting:  { text: '已挂果', cls: 'harvest' },
      harvest:   { text: '已挂果', cls: 'harvest' },
      active:    { text: '认养中', cls: 'active' }
    };

    // 按认养状态推算生长进度（无进度字段时的兜底展示）
    var PROGRESS_MAP = { active: 20, growing: 60, flowering: 45, fruiting: 70, harvest: 85 };

    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // 统一编号：去掉 AD- 前缀
    function normalizeTreeId(id) {
      return String(id == null ? '' : id).trim().replace(/^AD-/i, '').trim();
    }

    /* 内存数据：后端拉取的认养果树列表 */
    var adoptionTrees = [];
    var photoCache = null;

    function findTree(code) {
      for (var i = 0; i < adoptionTrees.length; i++) {
        var t = adoptionTrees[i];
        if (normalizeTreeId(t && (t.treeCode || t.id)) === normalizeTreeId(code)) return t;
      }
      return null;
    }

    // 当前会员归属判断（customer_id 或 adopter_phone）
    function isMine(item) {
      var m = (typeof H5Data !== 'undefined' && H5Data.currentMember) ? H5Data.currentMember() : null;
      if (!m) return false;
      if (item.customerId && String(item.customerId) === String(m.id)) return true;
      if (m.phone && String(item.adopterPhone || '') === String(m.phone)) return true;
      return false;
    }

    // 日期兼容：2026.06.01 / 2026-06-01 / ISO
    function fmtAdoptDate(v) {
      var s = String(v == null ? '' : v).trim();
      if (!s) return '—';
      var m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
      if (m) return m[1] + '.' + m[2].padStart(2, '0') + '.' + m[3].padStart(2, '0');
      return s;
    }

    var CAMERA_STATUS_TEXT = { online: '在线', warning: '告警', offline: '离线' };

    /* 实景监控：依据果树档案的 camera_id / open_scene 判定是否开放 */
    function resolveMonitor(item) {
      var code = normalizeTreeId(item && (item.treeCode || item.id));
      var cameraId = item && item.cameraId;
      if (!code || !cameraId) return null;
      if (item.openScene === 0 || item.openScene === false) return null;
      return {
        treeCode: code,
        cameraId: cameraId,
        camera: { name: '监控摄像头', code: String(cameraId), status: 'online' }
      };
    }

    function cardHtml(item) {
      var treeId = normalizeTreeId(item.treeCode) || normalizeTreeId(item.id) || '—';
      var st = STATUS_MAP[item.growthStage] || { text: item.growthStage || '认养中', cls: 'active' };
      var progress = Number(item.progress);
      if (isNaN(progress) || progress <= 0) progress = PROGRESS_MAP[item.growthStage] || 60;
      progress = Math.max(0, Math.min(100, progress));
      var name = item.treeName || '认养果树';
      var period = (item.duration != null && item.duration !== '') ? (item.duration + '年') : '3年';
      var fee = item.yearFee != null ? ('¥' + item.yearFee) : '—';
      var area = item.plotName || item.baseName || (name + '果园');
      var expect = item.expireTime || '—';
      var mon = resolveMonitor(item);
      var monText = mon
        ? ((mon.camera && mon.camera.name) || mon.cameraId) +
          (mon.camera && mon.camera.status ? '（' + (CAMERA_STATUS_TEXT[mon.camera.status] || mon.camera.status) + '）' : '')
        : '未开放';

      return '<div class="adoption-card">' +
        '<div class="adoption-header">' +
          '<div class="adoption-img">' +
            '<img src="images/thumb_tree.jpg" alt="' + escHtml(name) + '">' +
          '</div>' +
          '<div class="adoption-info">' +
            '<div class="adoption-name">' + escHtml(name) + '</div>' +
            '<div class="adoption-id">编号：' + escHtml(treeId) + '</div>' +
            '<span class="adoption-status ' + escHtml(st.cls) + '">' + escHtml(st.text) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="adoption-details">' +
          '<div class="detail-row"><span class="detail-label">认养时间</span>' +
            '<span class="detail-value">' + escHtml(fmtAdoptDate(item.startDate)) + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">认养周期</span>' +
            '<span class="detail-value">' + escHtml(period) + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">认养费用</span>' +
            '<span class="detail-value">' + escHtml(fee) + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">所在区域</span>' +
            '<span class="detail-value">' + escHtml(area) + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">实景监控</span>' +
            '<span class="detail-value">' + escHtml(monText) + '</span></div>' +
        '</div>' +
        '<div class="adoption-progress">' +
          '<div class="progress-title">生长进度</div>' +
          '<div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%;"></div></div>' +
          '<div class="progress-text">已完成 ' + progress + '% · 预计收获期 ' + escHtml(expect) + '</div>' +
        '</div>' +
        '<div class="adoption-actions">' +
          '<div class="action-btn primary" onclick="viewTrace(\'' + escHtml(treeId) + '\')">查看溯源</div>' +
          '<div class="action-btn secondary" onclick="viewPhotos(\'' + escHtml(treeId) + '\')">查看照片</div>' +
          (mon ? '<div class="action-btn monitor" onclick="viewMonitor(\'' + escHtml(treeId) + '\')">实景监控</div>' : '') +
        '</div>' +
      '</div>';
    }

    function renderAdoptions() {
      var box = document.getElementById('adoptionList');
      if (!box) return;
      var list = adoptionTrees.filter(function (t) {
        return t && t.status === 'adopted' && isMine(t);
      });

      if (!list.length) {
        box.innerHTML =
          '<div class="empty-state">' +
            '<div class="empty-icon">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>' +
            '</div>' +
            '<div class="empty-title">暂无认养记录</div>' +
            '<div class="empty-desc">您还没有认养的果树，去商城挑选一株属于您的花牛苹果树吧。</div>' +
            '<button class="mb-btn" style="padding:10px 28px;border-radius:8px;" onclick="navigateTo(\'h5_store.html\')">去认养果树</button>' +
          '</div>';
        return;
      }

      box.innerHTML = list.map(cardHtml).join('');
    }

    function navigateTo(page) { window.location.href = page; }

    function viewTrace(treeId) {
      showToast('正在查看 ' + treeId + ' 溯源信息...');
      setTimeout(function() {
        window.location.href = 'trace_h5.html?tree=' + encodeURIComponent(treeId);
      }, 500);
    }

    // 成长相册占位图（本地实拍图片，真实存在；原 images/adoption_default.jpg 不存在）
    var PHOTO_FALLBACK = 'images/apple_tree_orchard.jpg';

    /* 成长相册数据源：后端 sf_adoption_photo（resource = adoption_photo），
       照片地址经 sf_file（resource = file）的 store_path 解析 */
    function loadPhotos() {
      if (photoCache) return Promise.resolve(photoCache);
      return Promise.all([H5Data.list('adoption_photo'), H5Data.list('file')]).then(function (res) {
        var photos = res[0] || [];
        var files = res[1] || [];
        var fm = {};
        files.forEach(function (f) { fm[String(f.id)] = f.storePath || f.fileName || ''; });
        var map = {};
        photos.forEach(function (p) {
          var tid = String(p.treeId);
          if (!map[tid]) map[tid] = [];
          map[tid].push({
            url: fm[String(p.fileId)] || PHOTO_FALLBACK,
            time: p.shootTime || p.createdAt,
            stage: p.stage || '成长'
          });
        });
        photoCache = map;
        return map;
      });
    }

    function viewPhotos(treeId) {
      var code = normalizeTreeId(treeId);
      var tree = findTree(code);
      var treeKey = tree ? String(tree.id) : code;
      loadPhotos().then(function (map) {
        var list = map[treeKey] || map['AD-' + treeKey] || [];
        var html;
        if (!list.length) {
          html = '<div style="text-align:center;color:#999;padding:32px;">暂无照片。认养后工作人员将上传果树成长照片。</div>';
        } else {
          html = '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">' +
            list.map(function (p) {
              return '<div style="background:#f6f8f6;border-radius:8px;overflow:hidden;">' +
                '<img src="' + (p.url || PHOTO_FALLBACK) + '" alt="果树成长照片" ' +
                'style="width:100%;height:120px;object-fit:cover;" ' +
                'onerror="this.onerror=null;this.src=\'' + PHOTO_FALLBACK + '\';" ' +
                'onload="if(!this.naturalWidth){this.onerror&&this.onerror();}">' +
                '<div style="padding:6px 8px;font-size:11px;color:#666;">' +
                new Date(p.time).toLocaleDateString() + ' · ' + (p.stage || '成长') +
                '</div></div>';
            }).join('') + '</div>';
        }
        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;';
        overlay.innerHTML = '<div style="background:#fff;border-radius:10px;width:90%;max-width:420px;max-height:80vh;overflow-y:auto;padding:16px;">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
          '<h3 style="margin:0;">果树相册 ' + code + '</h3>' +
          '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="background:none;border:none;font-size:18px;cursor:pointer;">×</button>' +
          '</div>' + html +
          '</div>';
        document.body.appendChild(overlay);
      }).catch(function () {
        showToast('照片加载失败，请稍后重试');
      });
    }

    // 实景监控面板：展示设备管理绑定的摄像头档案（原型阶段为演示画面）
    function viewMonitor(treeId) {
      var tree = findTree(normalizeTreeId(treeId));
      var mon = resolveMonitor(tree);
      if (!mon) { showToast('该果树暂未开放实景监控'); return; }
      var cam = mon.camera || {};
      var rows = [
        ['果树编号', mon.treeCode],
        ['摄像头', cam.name || mon.cameraId],
        ['设备编码', cam.code || mon.cameraId],
        ['所在基地', cam.base || '—'],
        ['安装位置', cam.location || '—'],
        ['设备状态', CAMERA_STATUS_TEXT[cam.status] || cam.status || '—'],
        ['分辨率', cam.resolution || '—']
      ];
      var infoHtml = rows.map(function (r) {
        return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #eee;font-size:13px;">' +
          '<span style="color:#888;">' + escHtml(r[0]) + '</span>' +
          '<span style="color:#333;text-align:right;">' + escHtml(r[1]) + '</span></div>';
      }).join('');
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;';
      overlay.innerHTML =
        '<div style="background:#fff;border-radius:10px;width:90%;max-width:420px;max-height:80vh;overflow-y:auto;padding:16px;">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
            '<h3 style="margin:0;">实景监控 ' + escHtml(mon.treeCode) + '</h3>' +
            '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="background:none;border:none;font-size:18px;cursor:pointer;">×</button>' +
          '</div>' +
          '<div style="height:160px;border-radius:8px;background:linear-gradient(135deg,#e8f3e8,#c8e6c9);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:12px;">' +
            '<div style="font-size:40px;">🎥</div>' +
            '<div style="font-size:12px;color:#5a7d5a;margin-top:6px;">演示画面 · 未接真实图传</div>' +
          '</div>' + infoHtml +
        '</div>';
      document.body.appendChild(overlay);
    }

    function showToast(message) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;animation:fadeInOut 2s ease;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2000);
    }
    var style = document.createElement('style');
    style.textContent = '@keyframes fadeInOut { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0} }';
    document.head.appendChild(style);

    /* 初始化：拉取后端认养果树列表后渲染（严格空库，无本地播种） */
    H5Data.ready.then(function () {
      return H5Data.list('adoption_tree');
    }).then(function (list) {
      adoptionTrees = list || [];
      renderAdoptions();
    }).catch(function () {
      adoptionTrees = [];
      renderAdoptions();
    });
  </script>
</body>
</html>
