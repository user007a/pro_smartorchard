﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的认养 - 移动商城</title>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    .adoption-section { padding: var(--space-4); padding-bottom: 100px; }

    .adoption-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .adoption-header {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .adoption-img {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      flex-shrink: 0;
    }

    .adoption-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .adoption-info { flex: 1; }

    .adoption-name {
      font-size: var(--font-base);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-1);
    }

    .adoption-id {
      font-size: var(--font-xs);
      color: var(--text-secondary);
    }

    .adoption-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: var(--font-xs);
      font-weight: var(--font-medium);
    }

    .adoption-status.active {
      background: var(--success-light);
      color: var(--success-dark);
    }

    .adoption-status.growing {
      background: var(--primary-50);
      color: var(--primary-700);
    }

    .adoption-status.harvest {
      background: var(--harvest-50);
      color: var(--harvest-700);
    }

    .adoption-details {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      padding: var(--space-3);
      background: var(--gray-50);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-3);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-label {
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }

    .detail-value {
      font-size: var(--font-sm);
      color: var(--text);
      font-weight: var(--font-medium);
    }

    .adoption-progress {
      margin-bottom: var(--space-3);
    }

    .progress-title {
      font-size: var(--font-sm);
      font-weight: var(--font-medium);
      color: var(--text);
      margin-bottom: var(--space-2);
    }

    .progress-bar {
      height: 8px;
      background: var(--gray-200);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--gradient-primary);
      border-radius: var(--radius-full);
      transition: width var(--transition-normal);
    }

    .progress-text {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-top: var(--space-1);
    }

    .adoption-actions {
      display: flex;
      gap: var(--space-2);
    }

    .action-btn {
      flex: 1;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      font-size: var(--font-sm);
      font-weight: var(--font-medium);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
    }

    .action-btn.primary {
      background: var(--primary-50);
      color: var(--primary-700);
      border: 1px solid var(--primary-200);
    }

    .action-btn.primary:active {
      background: var(--primary-100);
    }

    .action-btn.secondary {
      background: var(--gray-100);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .action-btn.secondary:active {
      background: var(--gray-200);
    }

    .empty-state {
      text-align: center;
      padding: var(--space-8) var(--space-4);
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto var(--space-4);
      background: var(--gray-100);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-icon svg {
      width: 40px;
      height: 40px;
      color: var(--text-tertiary);
    }

    .empty-title {
      font-size: var(--font-md);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-2);
    }

    .empty-desc {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: var(--space-4);
    }
  </style>
</head>
<body>
  <div class="mb-app">

    <div class="adoption-section">
      <!-- 认养卡片 1 -->
      <div class="adoption-card">
        <div class="adoption-header">
          <div class="adoption-img">
            <img src="images/thumb_tree.jpg" alt="花牛苹果果树">
          </div>
          <div class="adoption-info">
            <div class="adoption-name">花牛苹果果树</div>
            <div class="adoption-id">编号：A1-001</div>
            <span class="adoption-status growing">生长中</span>
          </div>
        </div>
        <div class="adoption-details">
          <div class="detail-row">
            <span class="detail-label">认养时间</span>
            <span class="detail-value">2026.06.01</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">认养周期</span>
            <span class="detail-value">3年</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">认养费用</span>
            <span class="detail-value">¥1,888/年</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">所在区域</span>
            <span class="detail-value">A1区花牛苹果果园</span>
          </div>
        </div>
        <div class="adoption-progress">
          <div class="progress-title">生长进度</div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: 65%;"></div>
          </div>
          <div class="progress-text">已完成 65% · 预计收获期 2026.09</div>
        </div>
        <div class="adoption-actions">
          <div class="action-btn primary" onclick="viewTrace('A1-001')">查看溯源</div>
          <div class="action-btn secondary" onclick="viewPhotos('A1-001')">查看照片</div>
        </div>
      </div>

      <!-- 认养卡片 2 -->
      <div class="adoption-card">
        <div class="adoption-header">
          <div class="adoption-img">
            <img src="images/thumb_tree.jpg" alt="花牛苹果果树">
          </div>
          <div class="adoption-info">
            <div class="adoption-name">花牛苹果果树</div>
            <div class="adoption-id">编号：G1-003</div>
            <span class="adoption-status harvest">已挂果</span>
          </div>
        </div>
        <div class="adoption-details">
          <div class="detail-row">
            <span class="detail-label">认养时间</span>
            <span class="detail-value">2026.09.15</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">认养周期</span>
            <span class="detail-value">3年</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">认养费用</span>
            <span class="detail-value">¥1,510/年</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">所在区域</span>
            <span class="detail-value">G1区花牛苹果果园</span>
          </div>
        </div>
        <div class="adoption-progress">
          <div class="progress-title">生长进度</div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: 85%;"></div>
          </div>
          <div class="progress-text">已完成 85% · 预计收获期 2026.08</div>
        </div>
        <div class="adoption-actions">
          <div class="action-btn primary" onclick="viewTrace('G1-003')">查看溯源</div>
          <div class="action-btn secondary" onclick="viewPhotos('G1-003')">查看照片</div>
        </div>
      </div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('index.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_store.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>商城</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('trace_h5.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>溯源</span>
      </div>
      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </nav>
  </div>

  <script>
    function navigateTo(page) { window.location.href = page; }

    function viewTrace(treeId) {
      showToast('正在查看 ' + treeId + ' 溯源信息...');
      setTimeout(function() {
        window.location.href = 'trace_h5.html?tree=' + treeId;
      }, 500);
    }

    function viewPhotos(treeId) {
      showToast('正在加载 ' + treeId + ' 照片...');
    }

    function showToast(message) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;animation:fadeInOut 2s ease;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2000);
    }
    var style = document.createElement('style');
    style.textContent = '@keyframes fadeInOut { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0} }';
    document.head.appendChild(style);
  </script>
</body>
</html>
