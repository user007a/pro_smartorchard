<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的认养 - 移动商城</title>
  <script src="js/h5-auth.js"></script>
  <script>H5Auth.require();</script>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    .adoption-section { padding: var(--space-4); padding-bottom: 100px; }

    .adoption-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .adoption-header {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .adoption-img {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      flex-shrink: 0;
    }

    .adoption-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .adoption-info { flex: 1; }

    .adoption-name {
      font-size: var(--font-base);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-1);
    }

    .adoption-id {
      font-size: var(--font-xs);
      color: var(--text-secondary);
    }

    .adoption-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: var(--font-xs);
      font-weight: var(--font-medium);
    }

    .adoption-status.active {
      background: var(--success-light);
      color: var(--success-dark);
    }

    .adoption-status.growing {
      background: var(--primary-50);
      color: var(--primary-700);
    }

    .adoption-status.harvest {
      background: var(--harvest-50);
      color: var(--harvest-700);
    }

    .adoption-details {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      padding: var(--space-3);
      background: var(--gray-50);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-3);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-label {
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }

    .detail-value {
      font-size: var(--font-sm);
      color: var(--text);
      font-weight: var(--font-medium);
    }

    .adoption-progress {
      margin-bottom: var(--space-3);
    }

    .progress-title {
      font-size: var(--font-sm);
      font-weight: var(--font-medium);
      color: var(--text);
      margin-bottom: var(--space-2);
    }

    .progress-bar {
      height: 8px;
      background: var(--gray-200);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--gradient-primary);
      border-radius: var(--radius-full);
      transition: width var(--transition-normal);
    }

    .progress-text {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-top: var(--space-1);
    }

    .adoption-actions {
      display: flex;
      gap: var(--space-2);
    }

    .action-btn {
      flex: 1;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      font-size: var(--font-sm);
      font-weight: var(--font-medium);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
    }

    .action-btn.primary {
      background: var(--primary-50);
      color: var(--primary-700);
      border: 1px solid var(--primary-200);
    }

    .action-btn.primary:active {
      background: var(--primary-100);
    }

    .action-btn.secondary {
      background: var(--gray-100);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .action-btn.secondary:active {
      background: var(--gray-200);
    }

    .empty-state {
      text-align: center;
      padding: var(--space-8) var(--space-4);
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto var(--space-4);
      background: var(--gray-100);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-icon svg {
      width: 40px;
      height: 40px;
      color: var(--text-tertiary);
    }

    .empty-title {
      font-size: var(--font-md);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-2);
    }

    .empty-desc {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: var(--space-4);
    }
  </style>
</head>
<body>
  <div class="mb-app">

    <div class="adoption-section" id="adoptionList">
      <!-- 认养卡片由 js 依据 localStorage['snzg_adoptions'] 动态渲染 -->
    </div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('index.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_store.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>商城</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('trace_h5.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>溯源</span>
      </div>
      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </nav>
  </div>

  <script>
    /* ============================================================
     * 我的认养（T16 认养编号双源统一）
     * 唯一数据源：localStorage['snzg_adoptions']
     *   字段：{ id, treeName, status, adoptDate, ... }
     *   id 为 AD-A1-001 形式，展示时统一去掉 AD- 前缀为 A1-001，
     *   使 H5 展示编号与 h5_adoption_photos 的键、溯源查询保持一致。
     * 无数据时显示空态并引导，不自动播种演示数据。
     * ============================================================ */

    var ADOPTION_KEY = 'snzg_adoptions';
    var LEGACY_ADOPTION_KEY = 'h5_adoptions';

    // status → 中文文案与样式类
    var STATUS_MAP = {
      growing: { text: '生长中', cls: 'growing' },
      harvest: { text: '已挂果', cls: 'harvest' },
      active:   { text: '认养中', cls: 'active' }
    };

    // 按认养状态推算生长进度（无进度字段时的兜底展示）
    var PROGRESS_MAP = { active: 20, growing: 60, harvest: 85 };

    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // 统一编号：去掉 AD- 前缀
    function normalizeTreeId(id) {
      return String(id == null ? '' : id).trim().replace(/^AD-/i, '').trim();
    }

    function readAdoptions() {
      var keys = [ADOPTION_KEY, LEGACY_ADOPTION_KEY];
      for (var i = 0; i < keys.length; i++) {
        try {
          var raw = localStorage.getItem(keys[i]);
          if (!raw) continue;
          var v = JSON.parse(raw);
          if (Array.isArray(v)) {
            return v.filter(function (x) { return x && typeof x === 'object'; });
          }
        } catch (e) { /* 损坏数据跳过，尝试下一个来源 */ }
      }
      return [];
    }

    // 日期兼容：2026.06.01 / 2026-06-01 / ISO
    function fmtAdoptDate(v) {
      var s = String(v == null ? '' : v).trim();
      if (!s) return '—';
      var m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
      if (m) return m[1] + '.' + m[2].padStart(2, '0') + '.' + m[3].padStart(2, '0');
      return s;
    }

    function cardHtml(item) {
      var treeId = normalizeTreeId(item.id) || normalizeTreeId(item.treeNo) || '—';
      var st = STATUS_MAP[item.status] || { text: item.status || '认养中', cls: 'active' };
      var progress = Number(item.progress);
      if (isNaN(progress) || progress <= 0) progress = PROGRESS_MAP[item.status] || 60;
      progress = Math.max(0, Math.min(100, progress));
      var name = item.treeName || item.name || '认养果树';
      var period = item.period || item.years || '3年';
      var fee = item.fee || item.price || '—';
      var area = item.area || item.plotArea || (name + '果园');
      var expect = item.expectHarvest || item.harvestDate || '—';

      return '<div class="adoption-card">' +
        '<div class="adoption-header">' +
          '<div class="adoption-img">' +
            '<img src="images/thumb_tree.jpg" alt="' + escHtml(name) + '">' +
          '</div>' +
          '<div class="adoption-info">' +
            '<div class="adoption-name">' + escHtml(name) + '</div>' +
            '<div class="adoption-id">编号：' + escHtml(treeId) + '</div>' +
            '<span class="adoption-status ' + escHtml(st.cls) + '">' + escHtml(st.text) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="adoption-details">' +
          '<div class="detail-row"><span class="detail-label">认养时间</span>' +
            '<span class="detail-value">' + escHtml(fmtAdoptDate(item.adoptDate)) + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">认养周期</span>' +
            '<span class="detail-value">' + escHtml(period) + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">认养费用</span>' +
            '<span class="detail-value">' + escHtml(fee) + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">所在区域</span>' +
            '<span class="detail-value">' + escHtml(area) + '</span></div>' +
        '</div>' +
        '<div class="adoption-progress">' +
          '<div class="progress-title">生长进度</div>' +
          '<div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%;"></div></div>' +
          '<div class="progress-text">已完成 ' + progress + '% · 预计收获期 ' + escHtml(expect) + '</div>' +
        '</div>' +
        '<div class="adoption-actions">' +
          '<div class="action-btn primary" onclick="viewTrace(\'' + escHtml(treeId) + '\')">查看溯源</div>' +
          '<div class="action-btn secondary" onclick="viewPhotos(\'' + escHtml(treeId) + '\')">查看照片</div>' +
        '</div>' +
      '</div>';
    }

    function renderAdoptions() {
      var box = document.getElementById('adoptionList');
      if (!box) return;
      var list = readAdoptions();

      if (!list.length) {
        box.innerHTML =
          '<div class="empty-state">' +
            '<div class="empty-icon">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>' +
            '</div>' +
            '<div class="empty-title">暂无认养记录</div>' +
            '<div class="empty-desc">您还没有认养的果树，去商城挑选一株属于您的花牛苹果树吧。</div>' +
            '<button class="mb-btn" style="padding:10px 28px;border-radius:8px;" onclick="navigateTo(\'h5_store.html\')">去认养果树</button>' +
          '</div>';
        return;
      }

      box.innerHTML = list.map(cardHtml).join('');
    }

    function navigateTo(page) { window.location.href = page; }

    function viewTrace(treeId) {
      showToast('正在查看 ' + treeId + ' 溯源信息...');
      setTimeout(function() {
        window.location.href = 'trace_h5.html?tree=' + encodeURIComponent(treeId);
      }, 500);
    }

    // 成长相册占位图（本地实拍图片，真实存在；原 images/adoption_default.jpg 不存在）
    var PHOTO_FALLBACK = 'images/apple_tree_orchard.jpg';

    function viewPhotos(treeId) {
      // 从 localStorage 读取果树成长相册（H5-B-020）：按时间倒序展示照片墙
      // 数据结构：{ [果树编号]: [{ url, time, stage }] }，与后台「认养成长相册」共用
      // 兼容两种键：统一编号 A1-001 与 snzg_adoptions 的 AD-A1-001
      var list = [];
      try {
        var all = JSON.parse(localStorage.getItem('h5_adoption_photos') || '{}');
        if (all && typeof all === 'object' && !Array.isArray(all)) {
          if (Array.isArray(all[treeId])) list = all[treeId];
          else if (Array.isArray(all['AD-' + treeId])) list = all['AD-' + treeId];
        }
      } catch (e) { list = []; }
      var html;
      if (!list.length) {
        html = '<div style="text-align:center;color:#999;padding:32px;">暂无照片。认养后工作人员将上传果树成长照片。</div>';
      } else {
        html = '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">' +
          list.map(function(p){
            // url 为空或加载失败时，回退到本地占位图
            return '<div style="background:#f6f8f6;border-radius:8px;overflow:hidden;">' +
              '<img src="' + (p.url || PHOTO_FALLBACK) + '" alt="果树成长照片" ' +
              'style="width:100%;height:120px;object-fit:cover;" ' +
              'onerror="this.onerror=null;this.src=\'' + PHOTO_FALLBACK + '\';" ' +
              'onload="if(!this.naturalWidth){this.onerror&&this.onerror();}">' +
              '<div style="padding:6px 8px;font-size:11px;color:#666;">' +
              new Date(p.time).toLocaleDateString() + ' · ' + (p.stage || '成长') +
              '</div></div>';
          }).join('') + '</div>';
      }
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;';
      overlay.innerHTML = '<div style="background:#fff;border-radius:10px;width:90%;max-width:420px;max-height:80vh;overflow-y:auto;padding:16px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
        '<h3 style="margin:0;">果树相册 ' + treeId + '</h3>' +
        '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="background:none;border:none;font-size:18px;cursor:pointer;">×</button>' +
        '</div>' + html +
        '</div>';
      document.body.appendChild(overlay);
    }

    function showToast(message) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;animation:fadeInOut 2s ease;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2000);
    }
    var style = document.createElement('style');
    style.textContent = '@keyframes fadeInOut { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0} }';
    document.head.appendChild(style);

    // 认养列表渲染：进入页面时读一次，后台/其他标签页写入后自动同步
    renderAdoptions();
    window.addEventListener('storage', function (e) {
      if (e.key === ADOPTION_KEY || e.key === LEGACY_ADOPTION_KEY) renderAdoptions();
    });
  </script>
</body>
</html>
