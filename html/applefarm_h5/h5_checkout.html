<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>结算订单 - 移动商城</title>
  <script src="js/h5-auth.js"></script>
  <script>H5Auth.require();</script>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    .checkout-section { padding: var(--space-4); padding-bottom: 160px; }

    .section-title {
      font-size: var(--font-md);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .address-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .address-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
    }
    .address-name { font-size: var(--font-base); font-weight: var(--font-semibold); color: var(--text); }
    .address-phone { font-size: var(--font-sm); color: var(--text-secondary); }
    .address-detail { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.5; }
    .address-tag {
      display: inline-block;
      padding: 2px 8px;
      background: var(--primary-50);
      color: var(--primary-700);
      border-radius: var(--radius-sm);
      font-size: var(--font-xs);
      margin-left: var(--space-2);
    }

    .goods-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      border: 1px solid var(--border);
    }
    .goods-item {
      display: flex;
      gap: var(--space-3);
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-light);
    }
    .goods-item:last-child { border-bottom: none; }
    .goods-img {
      width: 60px; height: 60px;
      border-radius: var(--radius-md);
      background: var(--primary-50);
      overflow: hidden;
      flex-shrink: 0;
    }
    .goods-img img { width: 100%; height: 100%; object-fit: cover; }
    .goods-info { flex: 1; }
    .goods-name { font-size: var(--font-sm); font-weight: var(--font-semibold); color: var(--text); }
    .goods-spec { font-size: var(--font-xs); color: var(--text-secondary); }
    .goods-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: var(--space-2);
    }
    .goods-price { font-size: var(--font-base); font-weight: var(--font-extrabold); color: var(--error); font-family: var(--font-family-number); }
    .goods-qty { font-size: var(--font-sm); color: var(--text-secondary); }

    .option-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      border: 1px solid var(--border);
    }
    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
    }
    .option-row:last-child { border-bottom: none; }
    .option-label { font-size: var(--font-sm); color: var(--text); }
    .option-value { font-size: var(--font-sm); color: var(--text-secondary); display: flex; align-items: center; gap: var(--space-1); }
    .option-value svg { width: 14px; height: 14px; }

    .invoice-toggle { position: relative; width: 44px; height: 24px; }
    .invoice-toggle input { opacity: 0; width: 0; height: 0; }
    .invoice-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: var(--gray-300); border-radius: var(--radius-full); transition: var(--transition-fast); }
    .invoice-slider::before { content: ''; position: absolute; height: 20px; width: 20px; left: 2px; bottom: 2px; background: var(--bg-white); border-radius: 50%; transition: var(--transition-fast); }
    .invoice-toggle input:checked + .invoice-slider { background: var(--primary); }
    .invoice-toggle input:checked + .invoice-slider::before { transform: translateX(20px); }

    .payment-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      border: 1px solid var(--border);
    }
    .payment-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-2);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .payment-item:last-child { margin-bottom: 0; }
    .payment-item.selected { border-color: var(--primary); background: var(--primary-50); }
    .payment-icon { width: 36px; height: 36px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; }
    .payment-icon.wechat { background: #07c160; }
    .payment-icon.alipay { background: #1677ff; }
    .payment-icon svg { width: 22px; height: 22px; color: white; }
    .payment-name { flex: 1; font-size: var(--font-sm); font-weight: var(--font-medium); color: var(--text); }
    .payment-check { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .payment-item.selected .payment-check { border-color: var(--primary); background: var(--primary); }
    .payment-item.selected .payment-check::after { content: ''; width: 8px; height: 8px; background: white; border-radius: 50%; }

    .footer-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 750px;
      background: var(--bg-white);
      padding: var(--space-3) var(--space-4);
      padding-bottom: calc(var(--space-3) + var(--safe-bottom));
      display: flex; align-items: center; gap: var(--space-3);
      box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
      z-index: var(--z-tab-bar);
    }
    .footer-price { flex: 1; }
    .price-label { font-size: var(--font-xs); color: var(--text-secondary); }
    .price-value { font-size: var(--font-xl); font-weight: var(--font-extrabold); color: var(--error); font-family: var(--font-family-number); }
  </style>
</head>
<body>
  <div class="mb-app">

    <div class="checkout-section">
      <div class="section-title">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        收货地址
      </div>
      <div class="address-card">
        <div class="address-header">
          <span class="address-name" id="checkoutAddrName">刘友宝</span>
          <span class="address-phone" id="checkoutAddrPhone">151****0531</span>
          <span class="address-tag">默认</span>
        </div>
        <div class="address-detail" id="checkoutAddrDetail">湖南省长沙市麓云路159号佳境小区15#1406</div>
      </div>

      <div class="section-title">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        商品清单
      </div>
      <div class="goods-card" id="checkoutGoods">
        <div class="goods-item">
          <div class="goods-img"><img src="images/thumb_redfuji.jpg" alt=""></div>
          <div class="goods-info">
            <div class="goods-name">花牛苹果 5斤装</div>
            <div class="goods-spec">5斤装</div>
            <div class="goods-bottom">
              <span class="goods-price">¥68</span>
              <span class="goods-qty">x1</span>
            </div>
          </div>
        </div>
        <div class="goods-item">
          <div class="goods-img"><img src="images/thumb_giftbox.jpg" alt=""></div>
          <div class="goods-info">
            <div class="goods-name">精品礼盒装 8斤</div>
            <div class="goods-spec">8斤装</div>
            <div class="goods-bottom">
              <span class="goods-price">¥168</span>
              <span class="goods-qty">x1</span>
            </div>
          </div>
        </div>
      </div>

      <div class="section-title">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--primary)" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        其他选项
      </div>
      <div class="option-card">
        <div class="option-row">
          <span class="option-label">配送方式</span>
          <span class="option-value">冷链配送<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
        </div>
        <div class="option-row">
          <span class="option-label">需要发票</span>
          <label class="invoice-toggle">
            <input type="checkbox" id="invoiceToggle">
            <span class="invoice-slider"></span>
          </label>
        </div>
        <div class="option-row">
          <span class="option-label">优惠券</span>
          <span class="option-value" id="checkoutCoupon" style="color: var(--error);">-¥10<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
        </div>
      </div>

      <div class="section-title">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--primary)" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        支付方式
      </div>
      <div class="payment-card">
        <div class="payment-item selected" onclick="selectPayment(this)">
          <div class="payment-icon wechat">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348z"/></svg>
          </div>
          <span class="payment-name">微信支付</span>
          <div class="payment-check"></div>
        </div>
        <div class="payment-item" onclick="selectPayment(this)">
          <div class="payment-icon alipay">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.032 11.268c-.088-.037-.168-.057-.263-.057-.186 0-.331.124-.331.313 0 .138.087.24.22.29.146.053.323.088.484.157.054.02.111.037.17.059.186.067.31.18.31.349 0 .194-.146.348-.366.348-.08 0-.17-.023-.26-.055-.09-.035-.187-.076-.29-.12v.393c.09.037.17.057.263.057.186 0 .33-.124.33-.313 0-.138-.086-.24-.22-.29-.145-.053-.322-.088-.483-.157a1.92 1.92 0 0 1-.17-.059.557.557 0 0 1-.31-.349c0-.194.146-.348.366-.348.08 0 .17.023.26.055.09.035.187.076.29.12v-.393z"/></svg>
          </div>
          <span class="payment-name">支付宝</span>
          <div class="payment-check"></div>
        </div>
      </div>
    </div>

    <div class="footer-bar">
      <div class="footer-price">
        <div class="price-label" id="checkoutTotalLabel">合计（含优惠）</div>
        <div class="price-value" id="checkoutTotal">¥0</div>
      </div>
      <button class="mb-btn mb-btn-primary mb-btn-lg" onclick="submitOrder()">提交订单</button>
    </div>
  </div>

  <script src="js/mall-coupons.js"></script>
  <script>
    function selectPayment(el) {
      document.querySelectorAll('.payment-item').forEach(function(p) { p.classList.remove('selected'); });
      el.classList.add('selected');
    }

    function renderAddress() {
      var list = [];
      try { list = JSON.parse(localStorage.getItem('h5_addresses') || '[]'); } catch (e) { list = []; }
      if (!list.length) return;
      var def = list.filter(function(a) { return a.default; })[0] || list[0];
      var nameEl = document.getElementById('checkoutAddrName');
      var phoneEl = document.getElementById('checkoutAddrPhone');
      var detailEl = document.getElementById('checkoutAddrDetail');
      if (nameEl) nameEl.textContent = def.name || '';
      if (phoneEl) phoneEl.textContent = String(def.phone || '').replace(/^(\d{3})\d{4}(\d{4})$/, '$1****$2');
      if (detailEl) {
        detailEl.textContent = [def.region, def.detail].filter(Boolean).join(' ');
      }
    }

    function readCart() {
      try { return JSON.parse(localStorage.getItem('h5_cart') || '[]'); }
      catch (e) { return []; }
    }

    /* 优惠券规则来源：后台「商城管理 / 优惠券管理」维护的 mall_coupons
       （由 js/mall-coupons.js 提供，与购物车 h5_cart.html 共用同一份配置） */
    function calcDiscount(subtotal) {
      return round2(MallCoupons.calc(subtotal, MallCoupons.selected()) + pointsDeduct(subtotal));
    }

    /* 积分抵扣：与购物车共用 h5_points_used（100 积分 = ¥1），避免两页口径漂移 */
    function pointsDeduct(subtotal) {
      var used = 0;
      try { used = parseInt(localStorage.getItem('h5_points_used') || '0', 10); } catch (e) { used = 0; }
      if (isNaN(used) || used <= 0) return 0;
      return Math.min(Math.floor(used / 100), Math.max(0, subtotal));
    }

    /* 金额统一规整到分，避免浮点误差（如 19.9*3=59.700000000000006） */
    function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

    function renderCheckout() {
      var items = readCart().filter(function(i) { return i.checked !== false; });
      var goods = document.getElementById('checkoutGoods');
      if (!items.length) {
        goods.innerHTML = '<div class="empty-state" style="padding:24px;text-align:center;color:var(--text-tertiary);">购物车为空，请返回商城选购商品</div>';
      } else {
        goods.innerHTML = items.map(function(i) {
          var qty = Number(i.qty) || 1;
          var price = Number(i.price) || 0;
          return '<div class="goods-item">' +
            '<div class="goods-img"><img src="' + (i.img || 'images/thumb_redfuji.jpg') + '" alt=""></div>' +
            '<div class="goods-info">' +
            '<div class="goods-name">' + (i.name || '商品') + '</div>' +
            '<div class="goods-spec">' + (i.spec || '标准装') + '</div>' +
            '<div class="goods-bottom"><span class="goods-price">¥' + price + '</span>' +
            '<span class="goods-qty">x' + qty + '</span></div>' +
            '</div></div>';
        }).join('');
      }
      var subtotal = round2(items.reduce(function(s, i) { return s + (Number(i.price) || 0) * (Number(i.qty) || 1); }, 0));
      var discount = round2(calcDiscount(subtotal));
      var total = round2(Math.max(0, subtotal - discount));
      var couponEl = document.getElementById('checkoutCoupon');
      if (couponEl) {
        couponEl.innerHTML = (discount > 0 ? '-¥' + discount.toFixed(2) : '未使用') +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>';
        couponEl.style.color = discount > 0 ? 'var(--error)' : 'var(--text-tertiary)';
      }
      var labelEl = document.getElementById('checkoutTotalLabel');
      if (labelEl) labelEl.textContent = discount > 0 ? '合计（已优惠 ¥' + discount.toFixed(2) + '）' : '合计（含优惠）';
      var totalEl = document.getElementById('checkoutTotal');
      if (totalEl) totalEl.textContent = '¥' + total.toFixed(2);
      return { items: items, subtotal: subtotal, discount: discount, total: total };
    }

    /* 读取默认收货地址快照（供后台订单售后/对账使用） */
    function snapshotAddress() {
      // 首页加购时会把当时的地址快照写入 h5_checkout_draft，24h 内优先沿用
      try {
        var draft = JSON.parse(localStorage.getItem('h5_checkout_draft') || 'null');
        if (draft && draft.address && Date.now() - (Number(draft.ts) || 0) < 86400000) {
          return {
            name: draft.address.name || '', phone: draft.address.phone || '',
            region: draft.address.region || '', detail: draft.address.detail || ''
          };
        }
      } catch (e) { /* 忽略 */ }
      var list = [];
      try { list = JSON.parse(localStorage.getItem('h5_addresses') || '[]'); } catch (e) { list = []; }
      if (!Array.isArray(list)) list = [];
      var def = list.filter(function (a) { return a && a.default; })[0] || list[0];
      if (!def) return { name: '刘友宝', phone: '15111480531', region: '湖南省长沙市', detail: '麓云路159号佳境小区15#1406' };
      return { name: def.name || '', phone: def.phone || '', region: def.region || '', detail: def.detail || '' };
    }

    /* 勾选需要发票时，向后台「发票管理」推送一条开票申请 */
    function pushInvoiceApply(orderNo, amount) {
      var list = [];
      try { list = JSON.parse(localStorage.getItem('h5_invoices') || '[]'); } catch (e) { list = []; }
      if (!Array.isArray(list)) list = [];
      var addr = snapshotAddress();
      list.unshift({
        id: 'INV' + Date.now(),
        title: addr.name || '个人',
        amount: Number(amount) || 0,
        type: '电子普通发票',
        orderNo: orderNo,
        applyTime: new Date().toISOString(),
        status: 'pending'
      });
      localStorage.setItem('h5_invoices', JSON.stringify(list));
    }

    function submitOrder() {
      var needInvoice = document.getElementById('invoiceToggle').checked;
      var paymentEl = document.querySelector('.payment-item.selected .payment-name');
      var payment = paymentEl ? paymentEl.textContent : '在线支付';
      var data = renderCheckout();
      var items = data.items;
      if (!items.length) { showToast('订单为空，请先选购商品'); return; }
      var orderNo = 'ORD' + Date.now();
      // 券码在下单后会被 MallCoupons.clear() 清除，需在此之前留档
      var couponCode = MallCoupons.selected();
      var order = {
        id: orderNo,
        no: orderNo,
        items: items,
        subtotal: data.subtotal,
        discount: data.discount,
        total: data.total,
        payment: payment,
        invoice: needInvoice,
        address: snapshotAddress(),
        couponCode: couponCode,
        pointsUsed: (function () { try { return parseInt(localStorage.getItem('h5_points_used') || '0', 10) || 0; } catch (e) { return 0; } })(),
        status: '待付款',
        statusCode: 'pending',
        createdAt: new Date().toISOString()
      };
      /* 落库必须原子化：任一步失败都要回滚并明确提示，禁止出现「提示成功但数据丢失」 */
      var list = [];
      try { list = JSON.parse(localStorage.getItem('h5_orders') || '[]'); }
      catch (e) { list = []; }
      if (!Array.isArray(list)) list = [];
      list.unshift(order);
      try {
        localStorage.setItem('h5_orders', JSON.stringify(list));
      } catch (err) {
        showToast('订单保存失败（浏览器存储不可用），请检查隐私模式或清理空间后重试');
        return;
      }
      if (needInvoice) { try { pushInvoiceApply(orderNo, data.total); } catch (e) {} }
      try {
        localStorage.removeItem('h5_cart');
        localStorage.removeItem('h5_checkout_single');
        localStorage.removeItem('h5_checkout_draft');
        localStorage.removeItem('h5_points_used');
        // 券码一次性使用，下单后清除，避免下次下单静默复用上次优惠
        MallCoupons.clear();
      } catch (e) {}
      showToast('订单已生成：' + orderNo + '，使用' + payment + (needInvoice ? '，已申请发票' : ''));
      setTimeout(function() { window.location.href = 'h5_order.html?focus=' + orderNo; }, 1200);
    }

    renderAddress();
    renderCheckout();

    function showToast(message) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;animation:fadeInOut 2s ease;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2000);
    }
    var style = document.createElement('style');
    style.textContent = '@keyframes fadeInOut { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0} }';
    document.head.appendChild(style);
  </script>
</body>
</html>
