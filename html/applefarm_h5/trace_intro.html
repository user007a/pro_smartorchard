<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>苹果数字履历 - 移动商城</title>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    /* ========== 引导页 ========== */
    .splash-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--gradient-header);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }
    .splash-screen::before {
      content: '';
      position: absolute;
      top: -30%; right: -15%;
      width: 70%; height: 120%;
      background: radial-gradient(ellipse, rgba(255,255,255,0.10) 0%, transparent 70%);
      pointer-events: none;
    }
    .splash-screen::after {
      content: '';
      position: absolute;
      bottom: 8%; right: 6%;
      width: 80px; height: 80px;
      background: radial-gradient(circle, rgba(255,255,255,0.07) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    /* 背景装饰圆 */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
    }
    .bg-circle-1 { width: 300px; height: 300px; top: -100px; right: -80px; animation: float1 8s ease-in-out infinite; }
    .bg-circle-2 { width: 200px; height: 200px; bottom: 20%; left: -60px; animation: float2 10s ease-in-out infinite; }
    .bg-circle-3 { width: 120px; height: 120px; top: 30%; left: 60%; animation: float3 12s ease-in-out infinite; }

    @keyframes float1 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    @keyframes float2 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(15px); } }
    @keyframes float3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-10px,10px); } }

    /* Logo区域 */
    .splash-content {
      position: relative; z-index: 1;
      text-align: center;
      animation: fadeIn var(--transition-slow) ease;
    }
    .splash-logo {
      width: 100px; height: 100px;
      border-radius: var(--radius-xl);
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto var(--space-5);
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .splash-logo span { font-size: 52px; }
    .splash-brand {
      font-size: var(--font-3xl);
      font-weight: var(--font-extrabold);
      color: var(--text-on-primary);
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
      margin-bottom: var(--space-2);
      letter-spacing: 2px;
    }
    .splash-slogan {
      font-size: var(--font-md);
      color: var(--text-on-primary);
      opacity: 0.85;
      letter-spacing: 1px;
    }

    /* 进度条 */
    .splash-progress {
      position: relative; z-index: 1;
      margin-top: var(--space-10);
      width: 160px;
    }
    .progress-bar {
      height: 3px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: rgba(255,255,255,0.8);
      border-radius: 2px;
      animation: progressFill 2s ease-out forwards;
    }
    @keyframes progressFill {
      0% { width: 0; }
      100% { width: 100%; }
    }

    .splash-hint {
      margin-top: var(--space-3);
      font-size: var(--font-xs);
      color: var(--text-on-primary);
      opacity: 0.6;
      letter-spacing: 0.5px;
    }

    /* 底部版权 */
    .splash-footer {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 20px);
      left: 0; right: 0;
      text-align: center;
      z-index: 1;
    }
    .splash-copyright {
      font-size: var(--font-2xs);
      color: var(--text-on-primary);
      opacity: 0.5;
      letter-spacing: 0.3px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="splash-screen">
    <!-- 背景装饰 -->
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>

    <!-- 内容 -->
    <div class="splash-content">
      <div class="splash-logo"><span>🍎</span></div>
      <div class="splash-brand">移动商城</div>
      <div class="splash-slogan">从果园到餐桌 · 品质可追溯</div>
    </div>

    <!-- 进度条 -->
    <div class="splash-progress">
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="splash-hint">正在加载...</div>
    </div>

    <!-- 底部版权 -->
    <div class="splash-footer">
      <div class="splash-copyright">© 2026 移动商城 · 原产地好苹果</div>
    </div>
  </div>

  <script>
    // 2秒后自动跳转到商城首页
    setTimeout(function() {
      window.location.href = 'h5_store.html';
    }, 2500);
  </script>
</body>
</html>
