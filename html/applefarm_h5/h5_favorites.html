<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的收藏 - 智慧果园</title>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    .favorites-section { padding: var(--space-4); padding-bottom: 100px; }

    .favorites-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-4);
    }

    .favorites-count {
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }

    .favorites-edit {
      font-size: var(--font-sm);
      color: var(--primary);
      cursor: pointer;
    }

    .favorite-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      border: 1px solid var(--border);
      display: flex;
      gap: var(--space-3);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .favorite-card:active { transform: scale(0.99); }

    .favorite-img {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-md);
      overflow: hidden;
      flex-shrink: 0;
    }

    .favorite-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .favorite-info { flex: 1; display: flex; flex-direction: column; }

    .favorite-name {
      font-size: var(--font-base);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-1);
    }

    .favorite-desc {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-bottom: var(--space-2);
    }

    .favorite-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .favorite-price {
      font-size: var(--font-lg);
      font-weight: var(--font-extrabold);
      color: var(--error);
      font-family: var(--font-family-number);
    }

    .favorite-date {
      font-size: var(--font-xs);
      color: var(--text-tertiary);
    }

    .favorite-delete {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      background: var(--gray-100);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .favorite-delete:active { background: var(--error-light); }

    .empty-state {
      text-align: center;
      padding: var(--space-8) var(--space-4);
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto var(--space-4);
      background: var(--gray-100);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-icon svg {
      width: 40px;
      height: 40px;
      color: var(--text-tertiary);
    }

    .empty-title {
      font-size: var(--font-md);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-2);
    }

    .empty-desc {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: var(--space-4);
    }
  </style>
</head>
<body>
  <div class="mb-app">
    <header class="mb-header-detail">
      <div class="header-nav">
        <div class="header-back" onclick="history.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
        <div class="header-title">我的收藏</div>
      </div>
    </header>

    <div class="favorites-section">
      <div class="favorites-header">
        <span class="favorites-count">共收藏 3 件商品</span>
        <span class="favorites-edit" onclick="toggleEditMode()">编辑</span>
      </div>

      <!-- 收藏商品 1 -->
      <div class="favorite-card" onclick="goToProduct('redFuji')">
        <div class="favorite-img">
          <img src="https://images.unsplash.com/photo-1570913149827-d2ac84ab3f9a?w=160&h=160&fit=crop" alt="花牛苹果">
        </div>
        <div class="favorite-info">
          <div class="favorite-name">花牛苹果 5斤装</div>
          <div class="favorite-desc">脆甜多汁 · 新鲜采摘</div>
          <div class="favorite-bottom">
            <span class="favorite-price">¥68</span>
            <span class="favorite-date">收藏于 2026.09.10</span>
          </div>
        </div>
        <div class="favorite-delete" onclick="removeFavorite(event, 1)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
      </div>

      <!-- 收藏商品 2 -->
      <div class="favorite-card" onclick="goToProduct('giftBox')">
        <div class="favorite-img">
          <img src="https://images.unsplash.com/photo-1585478259715-876acc5be8eb?w=160&h=160&fit=crop" alt="精品礼盒">
        </div>
        <div class="favorite-info">
          <div class="favorite-name">精品礼盒装 8斤</div>
          <div class="favorite-desc">送礼佳品 · 品质保证</div>
          <div class="favorite-bottom">
            <span class="favorite-price">¥168</span>
            <span class="favorite-date">收藏于 2026.09.08</span>
          </div>
        </div>
        <div class="favorite-delete" onclick="removeFavorite(event, 2)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
      </div>

      <!-- 收藏商品 3 -->
      <div class="favorite-card" onclick="goToProduct('adopt3yr')">
        <div class="favorite-img">
          <img src="https://images.unsplash.com/photo-1528825871115-3581a5387919?w=160&h=160&fit=crop" alt="认养套餐">
        </div>
        <div class="favorite-info">
          <div class="favorite-name">认养果树3年套餐</div>
          <div class="favorite-desc">专属果树 · 全程溯源</div>
          <div class="favorite-bottom">
            <span class="favorite-price">¥1,888</span>
            <span class="favorite-date">收藏于 2026.09.01</span>
          </div>
        </div>
        <div class="favorite-delete" onclick="removeFavorite(event, 3)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
      </div>
    </div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('index.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_store.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>商城</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('trace_h5.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>溯源</span>
      </div>
      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </nav>
  </div>

  <script>
    function navigateTo(page) { window.location.href = page; }

    function goToProduct(productId) {
      window.location.href = 'h5_store.html?product=' + productId;
    }

    function removeFavorite(event, id) {
      event.stopPropagation();
      showToast('已取消收藏');
    }

    function toggleEditMode() {
      showToast('进入编辑模式');
    }

    function showToast(message) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;animation:fadeInOut 2s ease;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2000);
    }
    var style = document.createElement('style');
    style.textContent = '@keyframes fadeInOut { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0} }';
    document.head.appendChild(style);
  </script>
</body>
</html>
