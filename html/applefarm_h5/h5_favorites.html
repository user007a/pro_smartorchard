<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的收藏 - 移动商城</title>
  <script src="js/h5-auth.js"></script>
  <script>H5Auth.require();</script>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    .favorites-section { padding: var(--space-4); padding-bottom: 100px; }

    .favorites-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-4);
    }

    .favorites-count {
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }

    .favorites-edit {
      font-size: var(--font-sm);
      color: var(--primary);
      cursor: pointer;
    }

    .favorite-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      border: 1px solid var(--border);
      display: flex;
      gap: var(--space-3);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .favorite-card:active { transform: scale(0.99); }

    /* 编辑模式 */
    .favorite-card.is-edit { background: var(--primary-50); border-color: var(--primary-200); }
    .fav-check {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .fav-check input { position: absolute; opacity: 0; pointer-events: none; }
    .fav-check-box {
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-radius: 50%;
      background: var(--bg-white);
    }
    .fav-check input:checked + .fav-check-box {
      background: var(--primary);
      border-color: var(--primary);
    }
    .fav-check input:checked + .fav-check-box::after {
      content: '';
      width: 6px; height: 12px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translate(-1px, -1px);
    }
    .favorite-card { position: relative; }
    .fav-edit-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-3) var(--space-4);
      margin-bottom: var(--space-3);
    }
    .fav-edit-bar .bar-tip { font-size: var(--font-sm); color: var(--text-secondary); }
    .fav-edit-bar .bar-btn {
      background: var(--error);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 6px 14px;
      font-size: var(--font-sm);
      font-weight: 600;
      cursor: pointer;
    }

    .favorite-img {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-md);
      overflow: hidden;
      flex-shrink: 0;
    }

    .favorite-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .favorite-info { flex: 1; display: flex; flex-direction: column; }

    .favorite-name {
      font-size: var(--font-base);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-1);
    }

    .favorite-desc {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-bottom: var(--space-2);
    }

    .favorite-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .favorite-price {
      font-size: var(--font-lg);
      font-weight: var(--font-extrabold);
      color: var(--error);
      font-family: var(--font-family-number);
    }

    .favorite-date {
      font-size: var(--font-xs);
      color: var(--text-tertiary);
    }

    .favorite-delete {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      background: var(--gray-100);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .favorite-delete:active { background: var(--error-light); }

    .empty-state {
      text-align: center;
      padding: var(--space-8) var(--space-4);
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto var(--space-4);
      background: var(--gray-100);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-icon svg {
      width: 40px;
      height: 40px;
      color: var(--text-tertiary);
    }

    .empty-title {
      font-size: var(--font-md);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-2);
    }

    .empty-desc {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: var(--space-4);
    }
  </style>
</head>
<body>
  <div class="mb-app">
    <div class="favorites-section">
      <div class="favorites-header">
        <span class="favorites-count" id="favCount">共收藏 0 件商品</span>
        <span class="favorites-edit" onclick="toggleEditMode()">编辑</span>
      </div>

      <div id="favoriteList"></div>

      <div class="fav-edit-bar" id="favEditBar" style="display:none;">
        <span class="bar-tip">勾选后点击右侧按钮可批量删除</span>
        <button class="bar-btn" onclick="deleteSelectedFavorites()">删除所选</button>
      </div>
    </div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('index.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('h5_store.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>商城</span>
      </div>
      <div class="mb-tab-item" onclick="navigateTo('trace_h5.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>溯源</span>
      </div>
      <div class="mb-tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </nav>
  </div>

  <script>
    function navigateTo(page) { window.location.href = page; }

    function goToProduct(productId) {
      window.location.href = 'h5_store.html?product=' + encodeURIComponent(productId);
    }

    /* 首次访问时初始化演示收藏数据，保证收藏页与会员中心统计一致 */
    function seedFavorites() {
      if (localStorage.getItem('h5_favorites')) return;
      localStorage.setItem('h5_favorites', JSON.stringify([
        { id: 'redFuji', name: '花牛苹果 5斤装', desc: '脆甜多汁 · 新鲜采摘', price: 68, img: 'images/thumb_red_hanging.jpg', date: '2026.10.15' },
        { id: 'giftBox', name: '精品礼盒装 8斤', desc: '送礼佳品 · 品质保证', price: 168, img: 'images/thumb_giftbox.jpg', date: '2026.10.10' },
        { id: 'adopt3yr', name: '认养果树3年套餐', desc: '专属果树 · 全程溯源', price: 1888, img: 'images/thumb_picked.jpg', date: '2026.10.05' }
      ]));
    }

    function readFavorites() {
      try { return JSON.parse(localStorage.getItem('h5_favorites') || '[]'); }
      catch (e) { return []; }
    }

    /* 多选删除状态 */
    var _favEditMode = false;
    var _favSelected = Object.create(null);

    function renderFavorites() {
      seedFavorites();
      var list = readFavorites();
      var box = document.getElementById('favoriteList');
      var countEl = document.getElementById('favCount');
      if (countEl) {
        var selectedCount = Object.keys(_favSelected).length;
        countEl.textContent = _favEditMode
          ? ('已选 ' + selectedCount + ' / ' + list.length)
          : ('共收藏 ' + list.length + ' 件商品');
      }
      if (!list.length) {
        box.innerHTML = '<div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21.2l7.7-7.7 1.1-1a5.5 5.5 0 0 0 0-7.9z"/></svg></div>' +
          '<div class="empty-title">暂无收藏</div><div class="empty-desc">去商城挑选喜欢的商品吧</div>';
        return;
      }
      box.innerHTML = list.map(function(it) {
        var checked = _favSelected[it.id] ? ' checked' : '';
        var checkbox = _favEditMode
          ? '<label class="fav-check" onclick="event.stopPropagation();">' +
              '<input type="checkbox" ' + (checked ? 'checked' : '') + ' onchange="toggleSelect(\'' + it.id + '\', this.checked)">' +
              '<span class="fav-check-box"></span>' +
            '</label>'
          : '';
        return '<div class="favorite-card' + (_favEditMode ? ' is-edit' : '') + '" onclick="' + (_favEditMode ? 'toggleSelect(\'' + it.id + '\', !_favSelected[\'' + it.id + '\'])' : 'goToProduct(\'' + it.id + '\')') + '">' +
          checkbox +
          '<div class="favorite-img"><img src="' + (it.img || 'images/thumb_redfuji.jpg') + '" alt="' + (it.name || '') + '"></div>' +
          '<div class="favorite-info">' +
          '<div class="favorite-name">' + (it.name || '商品') + '</div>' +
          '<div class="favorite-desc">' + (it.desc || '') + '</div>' +
          '<div class="favorite-bottom"><span class="favorite-price">¥' + (Number(it.price) || 0) + '</span>' +
          '<span class="favorite-date">收藏于 ' + (it.date || '-') + '</span></div></div>' +
          '</div>';
      }).join('');
    }

    function toggleSelect(id, checked) {
      if (!_favEditMode) return;
      if (checked) _favSelected[id] = true; else delete _favSelected[id];
      renderFavorites();
    }

    function toggleEditMode() {
      _favEditMode = !_favEditMode;
      _favSelected = Object.create(null);
      var editEl = document.querySelector('.favorites-edit');
      var bar = document.getElementById('favEditBar');
      if (editEl) editEl.textContent = _favEditMode ? '取消' : '编辑';
      if (bar) bar.style.display = _favEditMode ? 'flex' : 'none';
      renderFavorites();
    }

    function deleteSelectedFavorites() {
      var ids = Object.keys(_favSelected);
      if (!ids.length) {
        showToast('请先勾选要删除的收藏');
        return;
      }
      if (!confirm('确定删除已选的 ' + ids.length + ' 件收藏？')) return;
      var next = readFavorites().filter(function (x) { return !_favSelected[x.id]; });
      localStorage.setItem('h5_favorites', JSON.stringify(next));
      _favSelected = Object.create(null);
      showToast('已删除 ' + ids.length + ' 件收藏');
      renderFavorites();
    }

    renderFavorites();

    function showToast(message) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;animation:fadeInOut 2s ease;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2000);
    }
    var style = document.createElement('style');
    style.textContent = '@keyframes fadeInOut { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0} }';
    document.head.appendChild(style);
  </script>
</body>
</html>
