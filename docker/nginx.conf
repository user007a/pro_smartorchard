# ============================================================
# 智慧果园平台 · 前端 Nginx 配置
# --------------------------------------------------------------
# 职责：
#   1. 托管四端静态页面（html/）
#   2. 反向代理 /api 到后端 Node 服务（api:3000）
#   3. 反向代理 /uploads 到后端（上传文件）
#
# 页面与接口同源，前端无需配置 API 基址。
# ============================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 中文文件名与 UTF-8 内容正确显示
    charset utf-8;
    charset_types text/css application/javascript application/json text/plain;

    # 上传接口限制（后端 express 侧为 10mb，这里留出余量）
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---- 静态资源缓存 ----
    # 图片/字体长缓存（内容不变，改动频率极低）；
    # JS/CSS 必须走协商缓存：这两类文件承载业务逻辑，一旦改动必须
    # 立即对所有客户端生效，否则浏览器会继续跑旧代码，导致「改了代码
    # 但页面行为不变」的假象（HTML 加时间戳也绕不开 JS 自身的缓存）。
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|mp4|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ---- API 反向代理 ----
    location /api/ {
        proxy_pass         http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ---- 上传文件 ----
    location /uploads/ {
        proxy_pass       http://api:3000/uploads/;
        proxy_set_header Host $host;
        expires 7d;
    }

    # ---- 首页跳转门户 ----
    # Nginx 的 root 是 html/，所以门户实际路径是 /portal.html
    location = / {
        return 302 /portal.html;
    }

    # ---- 静态页面 ----
    location / {
        try_files $uri $uri/ =404;
    }

    # ---- 健康检查 ----
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
