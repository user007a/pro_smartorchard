<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;url=html/dataanlye/da_dashboard.html">
    <title>智慧果园大数据平台</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #146c31, #22a84a);
            color: #fff;
        }
        .loading {
            text-align: center;
        }
        .loading h1 {
            font-size: 24px;
            margin-bottom: 12px;
        }
        .loading p {
            font-size: 14px;
            opacity: 0.8;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <h1>智慧果园大数据平台</h1>
        <p>正在进入智慧果园基地驾驶舱...</p>
        <p>如未自动跳转，请 <a href="html/applefarm_dataanlye/da_dashboard.html">点击这里</a></p>
    </div>
</body>
</html>
